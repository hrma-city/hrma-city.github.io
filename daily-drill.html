<body>
<header class="hero"><div class="wrap">
<span class="tag">学得会 · 每天两分钟</span>
<h1>每日一问 · 要点卡</h1>
<p>每天一道题、一张卡。把该记住的变成条件反射，不用专门抽时间学。</p>
</div></header>
<main class="wrap">

<h2>每日一问</h2>
<p class="lead">每天一道，答完看依据。题目按顺序轮换，攒几天就过一遍。不排名、不统计分数，只帮你把该记住的变成条件反射。</p>
<div class="card">
<h3 id="qq">—</h3>
<div id="qo"></div>
<div id="qe" class="hide"></div>
<div style="margin-top:10px">
<button class="btn o" id="next">换一题</button>
<span id="streak" style="font-size:13px;color:#5b6a7d;margin-left:8px"></span>
</div>
</div>
<div class="note"><b>怎么养成习惯：</b>每天到岗前花两分钟答一题。连续打卡会在下面记录——断了也没关系，重来就是。</div>
<div class="card"><h3>打卡</h3><p><b id="days">连续 0 天</b> · 累计 <b id="tot">0</b> 题
<button class="btn o" id="reset" style="padding:5px 11px;font-size:12.5px">重置</button></p></div>

<h2>要点卡（翻开背一句）</h2>
<p class="lead">正面是问题，点一下翻开要点。适合通勤路上或晨会前过一遍。</p>

<script>
var QS = [{"q": "早上到岗，按每日节拍第一件事该做什么？", "o": ["直接看今天要不要调价", "抓昨日实际数据", "先看竞对价格", "先开晨会"], "a": 1, "e": "按每日节拍，先抓昨日数据包，才有判断基准。没数据就调价等于猜。", "u": "daily-flow.html"}, {"q": "查每日调价表（表 A）时，横行看的是什么？", "o": ["进度偏差", "预测出租率", "竞对价格", "昨天实际"], "a": 1, "e": "横行＝预测出租率，纵列＝进度偏差，交叉处就是当天动作。", "u": "m05.html"}, {"q": "进度偏差为负（落后）说明什么？", "o": ["卖超了", "在手比目标少，需要加推动作", "价格定高了", "竞对断房"], "a": 1, "e": "在手比目标少。要按所在窗口决定动作：远期调结构，近期调价格或加渠道。", "u": "m04.html"}, {"q": "发现 OTA 价格比官网低，第一步做什么？", "o": ["跟着降到一样低", "先停该渠道售卖并对齐价格", "不管，等客人投诉再说", "把所有渠道都涨价"], "a": 1, "e": "价格一致性是红线。先停违规渠道、对齐价格，再补每日核查机制。", "u": "m08.html"}, {"q": "团队报价低于底线，最合适的做法是？", "o": ["直接拒绝", "照接，冲出租率", "换条件：加餐饮/会议室或收紧取消条款", "先接了再申请"], "a": 2, "e": "底线是机会成本不是成本价。低于底线要么不接，要么换条件把总贡献补回来。", "u": "m10.html"}, {"q": "超售计算出的间数超过硬上限，应该用哪个？", "o": ["用计算值", "用硬上限", "取两者平均", "干脆不开超售"], "a": 1, "e": "硬上限是红线，任何理由都不能突破。超售的代价是客人到店无房。", "u": "m07.html"}, {"q": "竞对降价了，第一反应应该是什么？", "o": ["立刻跟满", "先确认是不是同档次同商圈的可比竞对", "不理会", "立刻涨价"], "a": 1, "e": "竞组不可比，跟价就是自伤。先确认可比性，再决定跟不跟、跟多少。", "u": "m09.html"}, {"q": "老板问\"这个月为什么没达标\"，最有效的答法是？", "o": ["把报表发给他", "拆成\"量\"和\"价\"两部分讲", "说市场不好", "说竞对太凶"], "a": 1, "e": "拆成量与价：是人少了还是价低了，再给下一步要他批什么。", "u": "m12.html"}, {"q": "房型价差越界了，应该？", "o": ["不动，等客人反应", "调系数回到健康区间", "直接调低高级房型价格", "关掉低价房型"], "a": 1, "e": "价差体检每周一次，越界就调系数，别等客人投诉或高房型卖不动。", "u": "m06.html"}, {"q": "满房日在即，渠道应该怎么关？", "o": ["全部关掉", "先关高成本、低附加的渠道", "先关直销", "不关，多卖一间是一间"], "a": 1, "e": "先关高成本低附加渠道，保住库存给高价值订单，别一刀切全关。", "u": "m08.html"}, {"q": "预测持续偏差（系统性偏差）应该怎么办？", "o": ["每天手动改预测", "回查历史基数与事件因子，攒够样本再调", "换一套系统", "忽略"], "a": 1, "e": "先分系统性偏差还是单次波动。系统性偏差要查基数与事件因子，不要频繁改模型。", "u": "m04.html"}, {"q": "免费升级时，排序的第一优先是什么？", "o": ["谁先开口", "会员等级高低", "谁住得久", "随机"], "a": 1, "e": "按升级规则表的四级排序执行，同时守住建档上限与审批约束。", "u": "m07.html"}, {"q": "多张表同时给出动作，优先级最高的是？", "o": ["价格表", "应急与异常处置", "渠道表", "谁先出就听谁的"], "a": 1, "e": "应急是最高优先级，覆盖常规动作；但应急有退出条件，触发后必须复盘。", "u": "m07.html"}, {"q": "调价台账最少必须记下什么？", "o": ["改了多少价", "依据是哪张表 + 审批人 + 结果", "谁让我改的", "改的时间就行"], "a": 1, "e": "台账的核心是\"为什么\"：依据、审批、结果。它既是复盘依据，也是免责证据。", "u": "m03.html"}, {"q": "比较不同渠道的收益，应该看什么？", "o": ["看谁的房价高", "看扣掉成本后的净收入", "看谁的订单多", "看谁名气大"], "a": 1, "e": "同价不同渠道成本率差异很大，要比净的。", "u": "m08.html"}, {"q": "算打平量时，分母是什么？", "o": ["房价", "单间边际贡献（卖价−变动成本）", "总营收", "出租率"], "a": 1, "e": "分母是边际贡献不是卖价。基数越高，打平量越大。", "u": "m05.html"}, {"q": "淡日想降价冲量，先算什么？", "o": ["算竞对最低价", "算打平量", "算出租率", "不用算，直接降"], "a": 1, "e": "先算要补多少间才不亏；补不回来就改做打包增值，而不是硬降。", "u": "m05.html"}, {"q": "哪个指标能同时反映\"卖了多少\"和\"卖了什么价\"？", "o": ["出租率", "平均房价", "每间可售房收入", "总营收"], "a": 2, "e": "每间可售房收入＝出租率×平均房价，两个维度都在里面。", "u": "m01.html"}, {"q": "竞组应该怎么选？", "o": ["周边所有酒店", "同档次、同商圈、同客源", "价格最低的几家", "名气最大的几家"], "a": 1, "e": "三个\"同\"：同档次、同商圈、同客源。竞组选错，指数就错了。", "u": "m09.html"}, {"q": "竞对涨价了，最稳妥的做法是？", "o": ["立刻跟涨到位", "小步试探，看在手反应", "不跟", "反而降价抢量"], "a": 1, "e": "跟涨要保守。先确认涨价是不是因为对方断房，再小步试探。", "u": "m09.html"}, {"q": "遇到大型活动，定价策略应该？", "o": ["一次性把价格拉满", "分层：确定的提前锁，不确定的留观察窗口", "维持原价", "先降价抢单"], "a": 1, "e": "按确定性分层处理，留观察窗口，按在手进度逐步加码。", "u": "m04.html"}, {"q": "提升直销占比，最稳的做法是？", "o": ["把 OTA 价格抬得很高", "做产品差异：会员价、打包、增值", "关掉 OTA", "给官网大额补贴"], "a": 1, "e": "靠产品差异而不是硬压 OTA，同时把官网体验做顺。", "u": "m08.html"}, {"q": "客人到店无房，现场第一步是？", "o": ["解释是系统问题", "先认错，再安排与补偿", "让客人自己找酒店", "请示领导再说"], "a": 1, "e": "现场先认错再补偿：升级或外送同档次，承担差价与交通，后续再补偿。", "u": "m07.html"}, {"q": "做月度预测时，最不该做的是？", "o": ["看历史数据", "把年度目标按天数平均分摊", "看在手进度", "看事件因子"], "a": 1, "e": "不能简单按天数平均——淡旺日结构与事件因子都要进去。", "u": "m11.html"}, {"q": "收入变化要拆成哪两部分分析？", "o": ["线上与线下", "量与价（量差与价差）", "客房与餐饮", "新老客"], "a": 1, "e": "量价拆解是收益分析的基本动作：先分清是人少还是价低。", "u": "m11.html"}, {"q": "想看\"整店\"赚不赚钱，看什么？", "o": ["只看客房收入", "看总营收与经营毛利口径的指标", "只看出租率", "只看现金流"], "a": 1, "e": "看整店要看把客房之外收入与成本都算进去的口径。", "u": "m14.html"}, {"q": "价格一致性的红线是什么？", "o": ["各渠道可以有差异", "同房型同日期各渠道价格一致", "只要不低于成本就行", "以最低渠道为准"], "a": 1, "e": "同房型、同日期、各渠道价格一致，是必须每天核查的红线。", "u": "m08.html"}, {"q": "一周一次的例行检查通常安排做什么？", "o": ["年度预算", "房型价差体检", "系统升级", "竞组重选"], "a": 1, "e": "价差体检通常安排在周一，越界就调系数。", "u": "m06.html"}, {"q": "系统推荐价和你的判断差很多，怎么办？", "o": ["一律听系统", "边界内人工复核，并记录偏差用于调参", "一律听自己的", "取中间值"], "a": 1, "e": "安全区让系统自动跑，边界情况人工复核，偏差要记录用于调参。", "u": "m14.html"}, {"q": "判断团队该不该接，看什么？", "o": ["只看房价", "看总贡献（房价+餐饮+会议室）与置换成本", "只看间数", "看对方名气"], "a": 1, "e": "团队看总贡献，不是房价。餐饮和会议室收入要算进去。", "u": "m10.html"}, {"q": "从应急状态退出后，必须做什么？", "o": ["什么都不用做", "在规定时间内复盘为什么进了应急态", "写一份表扬", "调整年度预算"], "a": 1, "e": "应急有退出条件，退出后必须复盘。常态化的\"应急\"是管理失败。", "u": "m07.html"}, {"q": "汇报一页纸，第一个板块应该放什么？", "o": ["数据明细", "结论", "过程描述", "团队名单"], "a": 1, "e": "结论先行：先说结果和建议，再给依据。老板没时间在最后一页找答案。", "u": "m12.html"}, {"q": "每间可售房收入涨了但经营毛利没涨，先看什么？", "o": ["看员工成本", "看渠道结构", "看天气", "看竞争对手"], "a": 1, "e": "大概率是低成本渠道占比下降或变动成本上升，先看渠道结构。", "u": "m08.html"}, {"q": "刚上岗第一天，最不该做的是？", "o": ["要权限、认人", "急着改价格", "看历史台账", "确认口径"], "a": 1, "e": "第一天只建立输入：权限、口径、关系。不输出决策。", "u": "onboarding-kit.html"}, {"q": "收益岗最重要的一条习惯是什么？", "o": ["敢调价", "每次动作都有依据、有记录", "反应快", "价格敢降"], "a": 1, "e": "敢调价的人多，能说清为什么的人少。依据是复盘的基础，也是你的保护。", "u": "m03.html"}];
var CS = [{"q": "每日调价表怎么查？", "a": "横行＝预测出租率，纵列＝进度偏差，交叉处＝当天动作。查完还要过约束再落。", "u": "m03.html"}, {"q": "三个竞争指数怎么记？", "a": "MPI 看抢到人没有，ARI 看卖到价没有，RGI 看综合位置。三个要一起看。", "u": "m09.html"}, {"q": "每间可售房收入是什么？", "a": "＝出租率 × 平均房价。一个数字同时看\"量\"和\"价\"。", "u": "m01.html"}, {"q": "团队底线到底是什么？", "a": "不是成本价，是\"不接这个团队、改卖散客能拿多少\"。", "u": "m10.html"}, {"q": "打平量怎么算？", "a": "降价损失 ÷ 单间边际贡献。分母是边际贡献，不是房价。", "u": "m05.html"}, {"q": "比价时看什么？", "a": "看扣掉渠道成本后的净收入，不要只看挂牌价。", "u": "m08.html"}, {"q": "超售三步怎么走？", "a": "先取基准率，再连乘修正系数，最后换算间数并过硬上限。", "u": "m07.html"}, {"q": "多张表冲突听谁的？", "a": "应急优先，其次库存，再是价格；裁决要留痕。", "u": "m13.html"}, {"q": "汇报讲哪六块？", "a": "结论、结果、原因、风险、动作、需要的决定。", "u": "m12.html"}, {"q": "预算能不能按天平均？", "a": "不能。淡旺日结构与事件因子都要进去，别拿年度目标除以天数。", "u": "m11.html"}, {"q": "一天的节拍是什么？", "a": "抓数 → 看进度 → 采竞对 → 查表 → 一致性核查 → 台账 → 晨会。", "u": "daily-flow.html"}, {"q": "台账为什么最重要？", "a": "13 个字段记全，才能复盘，也才能在争议时说清当时为什么这么做。", "u": "m04.html"}];
var KEY = 'hrma_drill_v1';
var st = {i: 0, days: 0, tot: 0, last: ''};
try{var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if(s) st = s;}catch(e){}
function save(){try{localStorage.setItem(KEY, JSON.stringify(st))}catch(e){}}
function today(){var d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();}
function paintCard(){
  var q = QS[st.i % QS.length];
  document.getElementById('qq').textContent = '第 ' + ((st.i % QS.length) + 1) + ' 题 · ' + q.q;
  var box = document.getElementById('qo'); box.innerHTML = '';
  q.o.forEach(function(t, i){
    var b = document.createElement('button');
    b.className = 'btn o'; b.style.display = 'block'; b.style.width = '100%'; b.style.textAlign = 'left';
    b.textContent = t;
    b.addEventListener('click', function(){
      var e = document.getElementById('qe');
      e.classList.remove('hide');
      e.className = (i === q.a) ? 'note' : 'warn';
      e.innerHTML = '<b>' + (i === q.a ? '对。' : '不对。') + '</b>' + q.e +
        ' <a class="btn o" href="' + q.u + '" style="padding:4px 10px;font-size:12.5px">看依据</a>'
        + '<br><span style="font-size:12.5px;color:#5b6a7d;margin-top:6px;display:inline-block">还不懂？把这条依据讲给 <a href="rm-coach.html">RM 学长</a>或你常用的 AI 听，让它<b>考你三个变体</b>（换个日子 / 换个竞对动作 / 换个房量）——讲得清、变体接得住，才是真会了。</span>';
      st.tot++; if(today() !== st.last){st.last = today(); st.days++;} save(); paintStreak();
    });
    box.appendChild(b);
  });
  document.getElementById('qe').className = 'hide'; document.getElementById('qe').innerHTML = '';
}
function paintStreak(){
  document.getElementById('days').textContent = '连续 ' + st.days + ' 天';
  document.getElementById('tot').textContent = st.tot;
  document.getElementById('streak').textContent = '累计已答 ' + st.tot + ' 题';
}
document.getElementById('next').addEventListener('click', function(){st.i++; save(); paintCard();});
document.getElementById('reset').addEventListener('click', function(){st = {i:0,days:0,tot:0,last:''}; save(); paintCard(); paintStreak();});
var cg = document.getElementById('cards');
CS.forEach(function(c){
  var d = document.createElement('div'); d.className = 'mini';
  d.innerHTML = '<b>' + c.q + '</b><span class="bk" style="display:none;margin-top:6px">' + c.a +
    '<br><a class="btn o" href="' + c.u + '" style="padding:4px 10px;font-size:12.5px;margin-top:6px">看依据</a></span>' +
    '<span style="margin-top:6px;color:#3d8bd4;cursor:pointer" class="flip">翻开看答案 →</span>';
  d.querySelector('.flip').addEventListener('click', function(){
    var bk = d.querySelector('.bk');
    if(bk.style.display === 'none'){bk.style.display = 'block'; this.textContent = '收起';}
    else{bk.style.display = 'none'; this.textContent = '翻开看答案 →';}
  });
  cg.appendChild(d);
});
paintCard(); paintStreak();
</script>
