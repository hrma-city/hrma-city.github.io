<h1>报表预览中心</h1>
<p class="sub">无需下载即可在线查看各报表内容（由站点预渲染，公式计算值随原文件在 Excel / WPS 中打开后自动得出）。点击任一项在新页面打开完整预览。</p>
<div class="note">说明：模拟数据库与练习模板的「数据 / 答案」页为静态内容，预览即真实数值；工具模板含公式的工作表，预览显示公式文本（计算逻辑可见），计算结果请在下载的 Excel 中查看。所有预览页均需登录后访问。</div>
<div id="list">加载中…</div>
</div>
<footer>RMC 收益管理社区 · 教学数据工坊 ｜ 数据口径以《收益管理案例解析》云璟设定为准</footer>
<script src="assets/previews/previews-map.js"></script>
<script>
(function(){
  var M = window.GJP_PREVIEWS || {};
  var keys = Object.keys(M);
  function cat(k){
    if(k.indexOf("模拟数据库")>=0) return ["核心","模拟数据库"];
    if(k.indexOf("练习")>=0) return ["配套练习","课程练习模板"];
    if(/^templates\/\d+_/.test(k)) return ["实操工具","日常运营工具模板"];
    if(k.indexOf("data/")>=0) return ["CSV","模拟数据库分表（CSV）"];
    return ["其他","其他"];
  }
  function name(k){ return k.replace(/^templates\//,"").replace(/^data\//,"").replace(/\.xlsx$/,"").replace(/\.csv$/,""); }
  // 分组
  var groups = {};
  keys.forEach(function(k){ var c=cat(k)[1]; (groups[c]=groups[c]||[]).push(k); });
  var order = ["模拟数据库","课程练习模板","日常运营工具模板","模拟数据库分表（CSV）","其他"];
  var tagOf = {"模拟数据库":"核心","课程练习模板":"配套练习","日常运营工具模板":"实操工具","模拟数据库分表（CSV）":"CSV","其他":"其他"};
  var html = "";
  order.forEach(function(g){
    if(!groups[g]) return;
    var items = groups[g].slice().sort();
    var lis = items.map(function(k){
      return '<li><span>'+name(k)+'</span><a href="'+M[k]+'">打开预览 →</a></li>';
    }).join("");
    html += '<div class="card"><h2><span class="tag">'+tagOf[g]+'</span> '+g+'</h2><ul class="f">'+lis+'</ul></div>';
  });
  document.getElementById("list").innerHTML = html || "暂无预览";
})();
</script>
</body></html>
