<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
  .box{width:min(360px,90vw);background:#111a2e;border:1px solid #243049;border-radius:14px;padding:26px 22px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  input{width:100%;height:46px;margin:9px 0;padding:0 14px;background:#0b1220;color:#e6edf7;border:1px solid #2a3852;border-radius:9px;font-size:15px;outline:none}
  input:focus{border-color:#3b82f6}
  button{width:100%;height:46px;margin-top:12px;background:#2563eb;color:#fff;border:0;border-radius:9px;font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:12px;min-height:20px;font-size:14px;text-align:center}
  .msg.bad{color:#f87171}.msg.ok{color:#4ade80}
  textarea{width:100%;height:64px;margin:9px 0;padding:10px 14px;background:#0b1220;color:#e6edf7;border:1px solid #2a3852;border-radius:9px;font-size:14px;outline:none;resize:vertical;font-family:inherit}
  .switch{margin-top:14px;text-align:center}
  .switch a{color:#7db0ff;font-size:13px;text-decoration:none}
  .switch a:hover{text-decoration:underline}
</style>

<body>
  <div class="box">
    <div id="loginView">
      <input id="acc" type="text" autocomplete="username" placeholder="账号 / 邮箱" aria-label="账号">
      <input id="password" type="password" autocomplete="current-password" placeholder="密码" aria-label="密码">
      <button id="btn">登录</button>
      <div id="msg" class="msg"></div>
      <div id="regToggle" class="switch" style="display:none">
        <a href="#" id="toReg">还没有账号？注册</a>
      </div>
    </div>
    <div id="regView" style="display:none">
      <input id="rname" type="text" placeholder="姓名 / 昵称" aria-label="姓名">
      <input id="remail" type="email" placeholder="邮箱" aria-label="邮箱">
      <input id="rorg" type="text" placeholder="单位（选填）" aria-label="单位">
      <input id="rpassword" type="password" autocomplete="new-password" placeholder="设置密码" aria-label="密码">
      <textarea id="rreason" placeholder="申请理由（选填）" aria-label="申请理由"></textarea>
      <button id="rbtn">提交注册</button>
      <div id="rmsg" class="msg"></div>
      <div class="switch"><a href="#" id="toLogin">已有账号？返回登录</a></div>
    </div>
  </div>

<script src="auth-config.js?v=cloud20261021"></script>
<script src="assets/data/accounts.js?v=v20261023"></script>
<script>
(function () {
  'use strict';
  /* 云端模式需要的配置（URL/anonKey/模式开关）来自 auth-config.js。
     本地模式时该文件里的 HRMA_AUTH_MODE='local'，下方逻辑自动回退到预置账号表。
     账号为预置列表 rmc001–rmc500（无自由注册）。哈希=密码 SHA-256，无法反推。 */
  var USERS = (window.HRMA_ACCOUNTS || []).map(function (a) {
    return { u: a.u, p: a.p, en: a.en, exp: a.exp, note: a.note };
  });
  function accUsable(rec) {
    if (!rec) return { ok: false, why: 'no' };
    if (rec.en === 0) return { ok: false, why: 'disabled' };
    var t = new Date(); var today = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
    if (rec.exp && rec.exp < today) return { ok: false, why: 'expired' };
    return { ok: true };
  }
  var RC_HASH = 'ff83ba05f7c0fc44b710a828ca5ba85ad8dcfaf1fed1dc4592803b100b07e9c0';

  var $ = function (id) { return document.getElementById(id); };
  var accEl = $('acc'), pwEl = $('password'), btn = $('btn'), msg = $('msg');

  function qs(n) {
    var m = location.search.match(new RegExp('[?&]' + n + '=([^&]*)'));
    if (!m) return '';
    try { return decodeURIComponent(m[1]); } catch (e) { return ''; }
  }
  function say(t, kind) { msg.textContent = t || ''; msg.className = 'msg' + (kind ? ' ' + kind : ''); }
  function safeTarget(t) {
    if (!t) return 'index.html';
    if (/^https?:/i.test(t) || t.charAt(0) === '/' || t.indexOf('..') >= 0) return 'index.html';
    return t;
  }
  function sha256Sync(str) {
    function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
    var mathPow = Math.pow, maxWord = mathPow(2, 32);
    var result = '', words = [];
    var asciiBitLength = str.length * 8;
    var hash = sha256Sync.h = sha256Sync.h || [], k = sha256Sync.k = sha256Sync.k || [];
    var primeCounter = k.length, isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (var i2 = 0; i2 < 313; i2 += candidate) isComposite[i2] = candidate;
        hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    str += '\x80';
    while (str.length % 64 - 56) str += '\x00';
    for (var i3 = 0; i3 < str.length; i3++) {
      var j = str.charCodeAt(i3);
      if (j >> 8) return '';
      words[i3 >> 2] |= j << ((3 - i3) % 4) * 8;
    }
    words[words.length] = (asciiBitLength / maxWord) | 0;
    words[words.length] = asciiBitLength;
    for (var jj = 0; jj < words.length;) {
      var w = words.slice(jj, jj += 16), oldHash = hash, h2 = hash.slice(0, 8);
      for (var i4 = 0; i4 < 64; i4++) {
        var w15 = w[i4 - 15], w2 = w[i4 - 2];
        var a = h2[0], e = h2[4];
        var temp1 = h2[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & h2[5]) ^ (~e & h2[6])) + k[i4] + (w[i4] = (i4 < 16) ? w[i4] : (w[i4 - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i4 - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
        var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & h2[1]) ^ (a & h2[2]) ^ (h2[1] & h2[2]));
        h2 = [(temp1 + temp2) | 0].concat(h2);
        h2[4] = (h2[4] + temp1) | 0;
      }
      for (var i5 = 0; i5 < 8; i5++) h2[i5] = (h2[i5] + oldHash[i5]) | 0;
      hash = h2;
    }
    for (var i6 = 0; i6 < 8; i6++) result += (hash[i6] >>> 0).toString(16).padStart(8, '0');
    return result;
  }
  function sha256(str) { return Promise.resolve(sha256Sync(str)); }

  /* 门守卫要求：会话 pwRef 必须与本机账号表里的密码哈希一致。
     登录时务必「同时写账号表 + 会话」，二者用同一哈希。 */
  function grant(account, hash) {
    var db = { users: [], approved: [] };
    try { db = JSON.parse(localStorage.getItem('hrma_users_local') || 'null') || db; } catch (e) {}
    if (!Array.isArray(db.users)) db.users = [];
    if (!Array.isArray(db.approved)) db.approved = [];
    var u = db.users.filter(function (x) { return x.email === account; })[0];
    if (!u) { u = { email: account, name: account }; db.users.push(u); }
    u.pw = hash; u.status = 'approved';
    try { delete u.password; } catch (e) {}
    if (db.approved.indexOf(account) < 0) db.approved.push(account);
    try { localStorage.setItem('hrma_users_local', JSON.stringify(db)); } catch (e) {}
    var s = {
      email: account, name: account, status: 'approved',
      pwRef: hash, issuedAt: Date.now(), verifiedAt: Date.now()
    };
    try { localStorage.setItem('hrma_session_v2', JSON.stringify(s)); } catch (e) {}
    location.replace(safeTarget(qs('to') || 'index.html?t=nav1'));
  }

  /* 恢复码深链（备用通道，不暴露界面文字） */
  var rc = qs('rc');
  if (rc) {
    sha256('hrma-rc|' + rc.trim()).then(function (h) {
      if (h === RC_HASH) grant('__rc__', h);
      else say('恢复码无效。', 'bad');
    });
    return;
  }

  /* 本地匹配（预置账号表），云端登录失败时的兜底 */
  function localMatch(acc, pw) {
    sha256(pw).then(function (h) {
      for (var i = 0; i < USERS.length; i++) {
        if (USERS[i].u === acc && USERS[i].p === h) {
          var us = accUsable(USERS[i]);
          if (!us.ok) {
            btn.disabled = false; btn.textContent = '登录';
            say(us.why === 'disabled' ? '该账号已停用，请联系管理员。' : '该账号已过有效期（至 ' + USERS[i].exp + '）。', 'bad');
            return;
          }
          say('验证通过，正在进入…', 'ok');
          setTimeout(function () { grant(acc, h); }, 300);
          return;
        }
      }
      btn.disabled = false; btn.textContent = '登录';
      if (window.console && console.info) console.info('[HRMA login] fail: badpw');
      say('账号或密码不对。', 'bad');
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = '登录';
      if (window.console && console.error) console.error('[HRMA login]', e);
      say('登录失败，请稍后重试。', 'bad');
    });
  }

  /* 云端登录：走 Supabase 密码授权，成功签发 cloud: 会话 */
  function cloudLogin(email, password) {
    var C = window.HRMA_SUPABASE || {};
    if (!C.url || !C.anonKey) return Promise.reject(new Error('no-cfg'));
    return fetch(C.url + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: C.anonKey, Authorization: 'Bearer ' + C.anonKey },
      body: JSON.stringify({ email: email, password: password })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (!res.ok || !res.j || !res.j.access_token) throw new Error('bad-cred');
      var j = res.j;
      return sha256('cloud:' + j.access_token).then(function (h) {
        var s = {
          email: (j.user && j.user.email) ? j.user.email : email,
          name: (j.user && j.user.user_metadata && j.user.user_metadata.full_name) || email,
          status: 'pending',
          pwRef: 'cloud:' + h,
          access_token: j.access_token,
          issuedAt: Date.now(),
          verifiedAt: 0
        };
        try { localStorage.setItem('hrma_session_v2', JSON.stringify(s)); } catch (e) {}
        location.replace(safeTarget(qs('to') || 'index.html?t=nav1'));
        return true;
      });
    });
  }

  /* 账号 + 密码登录：云端模式先试 Supabase，失败回退本地预置账号 */
  btn.addEventListener('click', function () {
    var acc = String(accEl.value || '').trim().toLowerCase();
    var pw = String(pwEl.value || '').replace(/^\s+|\s+$/g, '');
    if (!acc || !pw) { say('请填写账号和密码。', 'bad'); return; }
    var C = window.HRMA_SUPABASE || {};
    var cloud = (String(window.HRMA_AUTH_MODE || 'cloud') !== 'local')
      && !!(C.url && C.anonKey && String(C.anonKey).indexOf('XXXX') < 0);
    if (cloud) {
      btn.disabled = true; btn.textContent = '验证中…'; say('');
      cloudLogin(acc, pw).then(function (ok) {
        if (ok) return;                  // 已重定向进站
        localMatch(acc, pw);             // 云端失败 → 本地兜底（预置账号/恢复码仍可用）
      }).catch(function () { localMatch(acc, pw); });
      return;
    }
    localMatch(acc, pw);
  });
  [accEl, pwEl].forEach(function (el) {
    if (!el) return;
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' && btn) btn.click(); });
  });

  /* ---------- 云端注册（仅云端模式显示） ---------- */
  var C2 = window.HRMA_SUPABASE || {};
  var cloudOn = (String(window.HRMA_AUTH_MODE || 'cloud') !== 'local')
    && !!(C2.url && C2.anonKey && String(C2.anonKey).indexOf('XXXX') < 0);
  var regToggle = document.getElementById('regToggle');
  var regView = document.getElementById('regView');
  var loginView = document.getElementById('loginView');
  if (cloudOn && regToggle) regToggle.style.display = 'block';
  var toReg = document.getElementById('toReg');
  if (toReg) toReg.addEventListener('click', function (e) {
    e.preventDefault();
    if (loginView) loginView.style.display = 'none';
    if (regView) regView.style.display = 'block';
  });
  var toLogin = document.getElementById('toLogin');
  if (toLogin) toLogin.addEventListener('click', function (e) {
    e.preventDefault();
    if (regView) regView.style.display = 'none';
    if (loginView) loginView.style.display = 'block';
  });
  var rbtn = document.getElementById('rbtn');
  if (rbtn) rbtn.addEventListener('click', function () {
    var remail = document.getElementById('remail');
    var rpassword = document.getElementById('rpassword');
    var rname = document.getElementById('rname');
    var rorg = document.getElementById('rorg');
    var rreason = document.getElementById('rreason');
    var rmsg = document.getElementById('rmsg');
    var email = String(remail.value || '').trim();
    var pw = String(rpassword.value || '');
    var name = String(rname.value || '').trim();
    var org = String(rorg.value || '').trim();
    var reason = String(rreason.value || '').trim();
    if (!email || !pw) { rmsg.textContent = '请填写邮箱和密码。'; rmsg.className = 'msg bad'; return; }
    if (!cloudOn) { rmsg.textContent = '当前为本地模式，不开放注册。'; rmsg.className = 'msg bad'; return; }
    rbtn.disabled = true; rbtn.textContent = '提交中…'; rmsg.textContent = '';
    var redir = location.origin + location.pathname.replace(/signin\.html.*/, 'confirm.html');
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 15000) : null;
    fetch(C2.url + '/auth/v1/signup', {
      method: 'POST',
      signal: ctrl ? ctrl.signal : undefined,
      headers: { 'Content-Type': 'application/json', apikey: C2.anonKey, Authorization: 'Bearer ' + C2.anonKey },
      body: JSON.stringify({
        email: email, password: pw,
        options: {
          emailRedirectTo: redir,
          data: { full_name: name, org: org, role_text: '', phone: '', reason: reason }
        }
      })
    }).then(function (r) {
      if (timer) clearTimeout(timer);
      return r.text().then(function (txt) {
        var j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
        return { ok: r.ok, status: r.status, j: j, txt: txt };
      });
    }).then(function (res) {
      rbtn.disabled = false; rbtn.textContent = '提交注册';
      if (res.j && res.j.error) {
        rmsg.textContent = '注册失败：' + (res.j.error.message || ('HTTP ' + res.status));
        rmsg.className = 'msg bad'; return;
      }
      if (!res.ok) {
        rmsg.textContent = '注册失败（HTTP ' + res.status + '）：' + ((res.j && (res.j.msg || res.j.error_description)) || (res.txt || '').slice(0, 80) || '服务端异常');
        rmsg.className = 'msg bad'; return;
      }
      rmsg.textContent = '注册成功，请等待管理员审核后登录。';
      rmsg.className = 'msg ok';
    }).catch(function (e) {
      if (timer) clearTimeout(timer);
      rbtn.disabled = false; rbtn.textContent = '提交注册';
      var m = (e && e.name === 'AbortError')
        ? '连接超时（15 秒无响应）'
        : ('网络错误：' + ((e && e.message) || '无法连接到登录服务器'));
      rmsg.textContent = m + '。若反复失败，可能是登录服务器在境外、当前网络暂不可达。';
      rmsg.className = 'msg bad';
    });
  });
})();
</script>
