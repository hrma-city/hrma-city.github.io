<script>
/* ============ 工具配置（公式 1:1 复用 build_templates.py 的 Excel 模板） ============ */
var fmtInt=function(n){return Math.round(n).toLocaleString('zh-CN');};
var fmtYuan=function(n){return '¥'+fmtInt(Math.round(n));};
var fmtYuan2=function(n){return '¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});};
var fmtPct=function(r,d){return (r*100).toFixed(d==null?1:d)+'%';};
var r0=function(n){return isFinite(n)?n:0;};

var TOOLS=[
 {
   key:'overbooking', name:'超额预订测算', badge:'房量决策',
   desc:'满房日决定还能多接多少预订：用历史未到店+取消的余量填补空房，同时控制被 walk 的风险与成本。',
   formula:'建议超售 ≈ MIN( (No-show+取消)×预订量 ×风险偏好 , 房量×硬上限 )',
   groups:[
     {title:'参数输入', inputs:[
       {id:'R',label:'可售房数（间）',def:200,unit:'间',hint:'当天可售客房总数'},
       {id:'S',label:'当前已售房晚（间夜）',def:200,unit:'间夜',hint:'已确认预订（满房日 S=R）'},
       {id:'ns',label:'历史 No-show 率（%）',def:8,unit:'%',hint:'未到店占比，填数字'},
       {id:'cx',label:'历史取消率（%）',def:12,unit:'%',hint:'取消占比，填数字'},
       {id:'walk',label:'每间 Walk 成本（元）',def:400,unit:'元',hint:'升房+补偿+差旅'},
       {id:'adr',label:'平均房价 ADR（元）',def:1000,unit:'元',hint:'估算空房损失用'},
       {id:'pref',label:'风险偏好（保守0.7/标准1/激进1.3）',def:1,unit:'',hint:'直接抄 0.7/1/1.3'},
       {id:'cap',label:'超售硬上限（占房量%）',def:20,unit:'%',hint:'最多超售比例'}
     ]}
   ],
   compute:function(v){
     var nsB=v.S*v.ns/100, cxB=v.S*v.cx/100, refill=nsB+cxB;
     var capN=v.R*v.cap/100;
     var sug=Math.min(refill*v.pref, capN);
     var walk=Math.max(0, sug-refill);
     var walkCost=walk*v.walk, emptyLoss=Math.max(0,(v.R-v.S-sug))*v.adr;
     var three='保守 '+fmtInt(Math.min(refill*0.7,capN))+' / 标准 '+fmtInt(sug)+' / 激进 '+fmtInt(Math.min(refill*1.3,capN));
     var advice, cls;
     if(walk===0){advice='建议按标准档超售 ✓ 无 walk 风险';cls='ok';}
     else if(walkCost<emptyLoss){advice='建议超售 ✓ 收益更大（walk 成本 < 空房损失）';cls='ok';}
     else {advice='谨慎：可降低超售档 ✗ walk 成本偏高';cls='bad';}
     return {sections:[
       {rows:[
         {k:'预期可回填房晚',v:fmtInt(refill)+' 间',note:'No-show+取消'},
         {k:'建议超售（标准档）',v:fmtInt(sug)+' 间',note:'当天可多接',hl:true},
         {k:'三档建议',v:three,hl:true},
         {k:'预期 Walk 数',v:fmtInt(walk)+' 人',note:'需升房/补偿'},
         {k:'期望 Walk 成本',v:fmtYuan(walkCost),note:'超售代价'},
         {k:'拒绝超售的空房损失',v:fmtYuan(emptyLoss),note:'不超售会少赚'}
       ]}
     ], diag:{text:advice, cls:cls}};
   }
 },
 {
   key:'displacement', name:'置换分析', badge:'决策方法',
   desc:'判断一笔低价/团队业务会不会挤掉更高价散客，导致整体收益下降。比净贡献，不比单价。',
   formula:'净贡献 = 团队总贡献 − 被挤掉散客贡献；>0 接受，<0 拒绝',
   groups:[
     {title:'参数输入', inputs:[
       {id:'R',label:'总房数（间）',def:200,unit:'间',hint:'可售客房总数'},
       {id:'Dt',label:'散客需求（间夜）',def:180,unit:'间夜',hint:'按散客价能卖出的量'},
       {id:'Dg',label:'团队申请（间夜）',def:50,unit:'间夜',hint:'低价业务申请量'},
       {id:'ADRt',label:'散客均价（元）',def:1000,unit:'元',hint:'散客 ADR'},
       {id:'ADRg',label:'团队价（元）',def:650,unit:'元',hint:'团队报价'},
       {id:'VC',label:'每间变动成本（元）',def:120,unit:'元',hint:'仅随出租变动的成本'},
       {id:'FBt',label:'散客餐饮贡献（元/间夜）',def:200,unit:'元',hint:'净利润贡献'},
       {id:'FBg',label:'团队餐饮贡献（元/间夜）',def:180,unit:'元',hint:'净利润贡献'}
     ]}
   ],
   compute:function(v){
     var disp=Math.max(0, v.Dt-(v.R-v.Dg));
     var Ct=(v.ADRt-v.VC)+v.FBt, Cg=(v.ADRg-v.VC)+v.FBg;
     var grpTot=v.Dg*Cg, transLoss=disp*Ct, net=grpTot-transLoss;
     var minG=v.VC-v.FBg+(disp/v.Dg)*Ct;
     var decision, cls; if(net>0){decision='接受团队 ✓';cls='ok';}else{decision='拒绝团队 ✗';cls='bad';}
     return {sections:[
       {rows:[
         {k:'被挤掉散客房晚',v:fmtInt(disp)+' 间夜',note:'团队占房后留给散客不足的部分'},
         {k:'散客边际贡献/间夜',v:fmtYuan(Ct)},
         {k:'团队边际贡献/间夜',v:fmtYuan(Cg)},
         {k:'团队总贡献',v:fmtYuan(grpTot),hl:true},
         {k:'散客损失贡献',v:fmtYuan(transLoss),hl:true},
         {k:'净贡献',v:fmtYuan(net),hl:true},
         {k:'团队盈亏平衡最低价',v:fmtYuan(minG),note:'≥此值即划算，可据此还价'}
       ]}
     ], diag:{text:decision+'（净贡献 '+(net>=0?'+':'')+fmtYuan(net)+'）', cls:cls}};
   }
 },
 {
   key:'forecast', name:'入住率手工预测', badge:'预测',
   desc:'不用系统也能做靠谱预测：按细分市场，用「在手预订 + 历史同周期还会新增多少」推算未来销量。',
   formula:'预测需求量 = 在手预订 × (1 + 历史同周期新增率%)',
   groups:[
     {title:'① 统计期总可售房晚', inputs:[
       {id:'R',label:'总可售房晚 R（间夜）',def:6000,unit:'间夜',hint:'如未来30天×200间'}
     ]},
     {type:'matrix', groupId:'seg', title:'② 细分市场预测表', cols:[
       {id:'ob',label:'当前在手(房晚)',def:0},{id:'rate',label:'历史新增率(%)',def:0}
     ], rows:[
       {id:'fit',label:'散客(FIT)',ob:1800,rate:35},
       {id:'grp',label:'团队(Group)',ob:1200,rate:15},
       {id:'mem',label:'会员',ob:600,rate:25},
       {id:'ota',label:'OTA',ob:900,rate:30},
       {id:'corp',label:'协议公司',ob:700,rate:20},
       {id:'oth',label:'其他',ob:300,rate:10}
     ]}
   ],
   compute:function(v){
     var segs=['fit','grp','mem','ota','corp','oth'];
     var labels={fit:'散客',grp:'团队',mem:'会员',ota:'OTA',corp:'协议',oth:'其他'};
     var total=0, rows=[];
     segs.forEach(function(s){
       var ob=v['seg_'+s+'_ob'], rate=v['seg_'+s+'_rate'];
       var pred=ob*(1+rate/100); total+=pred;
       rows.push([labels[s], fmtInt(ob), rate+'%', fmtInt(pred), fmtPct(pred/v.R)]);
     });
     var totalOcc=total/v.R, gap=v.R-total;
     var concl, cls; if(totalOcc>=0.9){concl='进度健康 ✓ 可转守为攻';cls='ok';}else{concl='进度偏低 ✗ 需促销/放开低价渠道';cls='bad';}
     return {sections:[
       {table:{head:['细分市场','在手','新增率','预测需求','预测出租率'], rows:rows}},
       {rows:[
         {k:'预测总房晚',v:fmtInt(total)+' 间夜',hl:true},
         {k:'预测总出租率',v:fmtPct(totalOcc),hl:true},
         {k:'预测总房晚缺口',v:fmtInt(gap)+' 间夜',note:'正数=还差多少要促'}
       ]}
     ], diag:{text:concl, cls:cls}};
   }
 },
 {
   key:'cruise', name:'邮轮收益测算（RevPAC）', badge:'候补行业',
   desc:'舱位=房、航次=连住、套舱=房型。看单舱产出 RevPAC 与舱位利用率，并模拟早鸟/甩舱定价。',
   formula:'RevPAC = (船票+岸上餐饮)×已售 ÷ 可用舱位夜；可用舱位夜 = 舱位数 × 航次天数',
   groups:[
     {title:'① 核心参数', inputs:[
       {id:'cab',label:'可用舱位数（间）',def:1000,unit:'间',hint:'全船可售舱位总数'},
       {id:'days',label:'航次天数（晚）',def:8,unit:'晚',hint:'单航次跨夜数'},
       {id:'sold',label:'已售舱位夜',def:7200,unit:'cabin-night',hint:'已卖舱位×夜'},
       {id:'fare',label:'平均船票（元/舱位夜）',def:1800,unit:'元',hint:'基础票价均值'},
       {id:'anc',label:'岸上+餐饮摊入（元/舱位夜）',def:540,unit:'元',hint:'二次消费净贡献'}
     ]},
     {title:'④ 早鸟 + 临期甩舱 定价模拟', inputs:[
       {id:'eb',label:'早鸟占比（%）',def:40,unit:'%'},
       {id:'ebd',label:'早鸟折扣（%）',def:15,unit:'%'},
       {id:'lb',label:'临期甩舱占比（%）',def:20,unit:'%'},
       {id:'lbd',label:'临期甩舱折扣（%）',def:35,unit:'%'}
     ]}
   ],
   compute:function(v){
     var avail=v.cab*v.days, occ=v.sold/avail, unit=v.fare+v.anc;
     var rev=unit*v.sold, revpac=rev/avail;
     var coreDiag, coreCls; if(occ>=0.9){coreDiag='舱位利用健康 ✓ OCC≥90%';coreCls='ok';}else{coreDiag='利用率偏低 ✗ 需促销/放开低价渠道';coreCls='bad';}
     var rest=Math.max(0,100-v.eb-v.lb);
     var coef=v.eb/100*(1-v.ebd/100)+v.lb/100*(1-v.lbd/100)+rest/100*1;
     var simP=v.fare*coef, simRev=(simP+v.anc)*v.sold, fullRev=(v.fare+v.anc)*v.sold, diff=simRev-fullRev;
     var ebConcl, ebCls; if(diff>=0){ebConcl='分层定价已补回折扣 ✓';ebCls='ok';}else{ebConcl='售出量不变时折扣=纯让利 ✗ 须靠早鸟/甩舱带来额外销量';ebCls='bad';}
     return {sections:[
       {rows:[
         {k:'可用舱位夜',v:fmtInt(avail),note:'舱位数×天数'},
         {k:'舱位利用率 OCC',v:fmtPct(occ),hl:true},
         {k:'综合单价',v:fmtYuan(unit)},
         {k:'航次总营收',v:fmtYuan(rev),hl:true},
         {k:'单舱产出 RevPAC',v:fmtYuan(revpac),hl:true}
       ], diag:{text:coreDiag, cls:coreCls}},
       {rows:[
         {k:'实现价格系数',v:coef.toFixed(3)},
         {k:'模拟实现均价',v:fmtYuan(simP)},
         {k:'模拟总收入',v:fmtYuan(simRev),hl:true},
         {k:'全价对照收入',v:fmtYuan(fullRev)},
         {k:'收入差',v:(diff>=0?'+':'')+fmtYuan(diff),hl:true}
       ], diag:{text:ebConcl, cls:ebCls}}
     ]};
   }
 },
 {
   key:'rental-apartment', name:'长租公寓收益测算（RevPAU）', badge:'候补行业',
   desc:'房源=房、租期=超长连住、续约=复购。看 RevPAU 与出租率，并量化「续约率」这个最大杠杆。',
   formula:'RevPAU = 总营收 ÷ 可出租间夜；有效日租金 = (月租÷30)×(1−免租期÷365)',
   groups:[
     {title:'① 核心参数', inputs:[
       {id:'units',label:'可出租房源数（间）',def:500,unit:'间',hint:'可售房源总数'},
       {id:'days',label:'统计天数（天）',def:30,unit:'天',hint:'通常按 30 天'},

   compute:function(v){

     var loss=v.vd*eff+v.acq+v.reno;

     return {sections:[

/* ============ 渲染与持久化 ============ */
(function(){
  var PREFIX='hrma_tool_';
  function loadSaved(key){ try{return JSON.parse(localStorage.getItem(PREFIX+key)||'null');}catch(e){return null;} }
  function save(key,obj){ try{localStorage.setItem(PREFIX+key, JSON.stringify(obj));}catch(e){} }
  function clear(key){ try{localStorage.removeItem(PREFIX+key);}catch(e){} }

  function inputId(key,g,id){ return 'f_'+key+'_'+(g&&g.groupId?g.groupId+'_':'')+id; }

  function buildInputs(tool){
    var html='';
    tool.groups.forEach(function(g){
      if(g.type==='matrix'){
        html+='<div class="tw-grp"><h3>'+g.title+'</h3><table class="tw-tbl"><thead><tr><th>'+g.rows[0].label.replace(/\(.*\)/,'')+'</th>';
        g.cols.forEach(function(c){ html+='<th>'+c.label+'</th>'; });
        html+='</tr></thead><tbody>';
        g.rows.forEach(function(r){
          html+='<tr><td>'+r.label+'</td>';
          g.cols.forEach(function(c){
            var iid=inputId(tool.key,g,r.id+'_'+c.id);
            html+='<td><input type="number" id="'+iid+'" data-def="'+r[c.id]+'" data-key="'+r.id+'_'+c.id+'"></td>';
          });
          html+='</tr>';
        });
        html+='</tbody></table></div>';
      } else {
        html+='<div class="tw-grp"><h3>'+g.title+'</h3><div class="tw-grid">';
        g.inputs.forEach(function(it){
          var iid=inputId(tool.key,null,it.id);
          html+='<div class="tw-fld"><label>'+it.label+(it.unit?' <b>'+it.unit+'</b>':'')+'</label>'+
            '<input type="number" id="'+iid+'" data-def="'+it.def+'">'+
            (it.hint?'<span class="hint">'+it.hint+'</span>':'')+'</div>';
        });
        html+='</div></div>';
      }
    });
    return html;
  }

  function readVals(tool){
    var v={};
    tool.groups.forEach(function(g){
      if(g.type==='matrix'){
        g.rows.forEach(function(r){
          g.cols.forEach(function(c){
            var el=document.getElementById(inputId(tool.key,g,r.id+'_'+c.id));
            v[r.id+'_'+c.id]=parseFloat(el&&el.value!==''?el.value:el.dataset.def)||0;
          });
        });
      } else {
        g.inputs.forEach(function(it){
          var el=document.getElementById(inputId(tool.key,null,it.id));
          v[it.id]=parseFloat(el&&el.value!==''?el.value:el.dataset.def)||0;
        });
      }
    });
    return v;
  }

  function renderOut(tool, res){
    var html='';
    res.sections.forEach(function(sec){
      html+='<div class="tw-out">';
      if(sec.title) html+='<h3>'+sec.title+'</h3>';
      if(sec.table){
        html+='<table class="tw-tbl"><thead><tr>';
        sec.table.head.forEach(function(h){html+='<th>'+h+'</th>';});
        html+='</tr></thead><tbody>';
        sec.table.rows.forEach(function(row){
          html+='<tr>'; row.forEach(function(c){html+='<td>'+c+'</td>';}); html+='</tr>';
        });
        html+='</tbody></table>';
      }
      if(sec.rows){
        html+='<div class="tw-res">';
        sec.rows.forEach(function(r){
          html+='<div class="tw-row"><span class="k">'+r.k+(r.note?' <small>'+r.note+'</small>':'')+'</span><span class="v'+(r.hl?' hl':'')+'">'+r.v+'</span></div>';
        });
        html+='</div>';
      }
      if(sec.diag) html+='<div class="tw-diag '+sec.diag.cls+'">'+sec.diag.text+'</div>';
      html+='</div>';
    });
    return html;
  }

  function recompute(tool){
    var v=readVals(tool);
    var res=tool.compute(v);
    document.getElementById('out_'+tool.key).innerHTML=renderOut(tool,res);
    save(tool.key, v);
  }

  function copyRes(tool){
    var txt=tool.name+'\n';
    var v=readVals(tool); var res=tool.compute(v);
    res.sections.forEach(function(sec){
      if(sec.title) txt+='\n['+sec.title+']\n';
      if(sec.table){ sec.table.head.forEach(function(h,i){ if(i)txt+='\t'; txt+=h;}); txt+='\n';
        sec.table.rows.forEach(function(row){ row.forEach(function(c,i){ if(i)txt+='\t'; txt+=c;}); txt+='\n'; }); }
      if(sec.rows){ sec.rows.forEach(function(r){ txt+=r.k+'：'+r.v+(r.note?'（'+r.note+'）':'')+'\n'; }); }
      if(sec.diag) txt+='→ '+sec.diag.text+'\n';
    });
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); }
      else { var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
      if(window.Notify) Notify.toast('已复制「'+tool.name+'」结果'); else alert('已复制结果');
    }catch(e){ alert(txt); }
  }

  // TOC + main
  var toc='', main='';
  TOOLS.forEach(function(t){
    toc+='<a href="#'+t.key+'" data-key="'+t.key+'">'+t.name+'</a>';
    main+='<section class="tw-card" id="'+t.key+'">'+
      '<span class="badge">'+t.badge+'</span><h2>'+t.name+'</h2>'+
      '<p class="desc">'+t.desc+'</p>'+
      '<div class="formula">'+t.formula+'</div>'+
      buildInputs(t)+
      '<div id="out_'+t.key+'"></div>'+
      '<div class="foot"><button class="save" data-key="'+t.key+'">重新计算</button>'+
      '<button class="reset" data-key="'+t.key+'">重置本工具</button>'+
      '<button class="copy" data-key="'+t.key+'">复制结果</button>'+
      '<span class="saved" id="saved_'+t.key+'">已自动保存 ✓</span></div>'+
      '</section>';
  });
  document.getElementById('twToc').innerHTML=toc;
  document.getElementById('twMain').innerHTML=main;

  // 初始化：填值（先存后默认值）+ 绑定
  TOOLS.forEach(function(t){
    var saved=loadSaved(t.key)||{};
    t.groups.forEach(function(g){
      if(g.type==='matrix'){
        g.rows.forEach(function(r){ g.cols.forEach(function(c){
          var el=document.getElementById(inputId(t.key,g,r.id+'_'+c.id));
          var val=saved[r.id+'_'+c.id];
          el.value=(val===undefined||val===null)?r[c.id]:val;
        });});
      } else {
        g.inputs.forEach(function(it){
          var el=document.getElementById(inputId(t.key,null,it.id));
          var val=saved[it.id];
          el.value=(val===undefined||val===null)?it.def:val;
          el.addEventListener('input', function(){ flashSaved(t.key); recompute(t); });
        });
      }
    });
    recompute(t);
    var card=document.getElementById(t.key);
    card.querySelector('.save').addEventListener('click', function(){ recompute(t); flashSaved(t.key); });
    card.querySelector('.reset').addEventListener('click', function(){ clear(t.key);
      t.groups.forEach(function(g){
        if(g.type==='matrix'){ g.rows.forEach(function(r){ g.cols.forEach(function(c){ document.getElementById(inputId(t.key,g,r.id+'_'+c.id)).value=r[c.id]; });}); }
        else { g.inputs.forEach(function(it){ document.getElementById(inputId(t.key,null,it.id)).value=it.def; }); }
      });
      recompute(t);
    });
    card.querySelector('.copy').addEventListener('click', function(){ copyRes(t); });
  });

  function flashSaved(key){ var s=document.getElementById('saved_'+key); if(!s)return; s.classList.add('show'); setTimeout(function(){s.classList.remove('show');},1200); }

  // 清空全部
  var ca=document.getElementById('twClearAll');
  if(ca) ca.addEventListener('click', function(){
    if(!confirm('确定清空本机所有工具已保存的数据？此操作不可恢复。')) return;
    TOOLS.forEach(function(t){ clear(t.key); });
    location.reload();
  });

  // TOC 高亮
  var links=document.querySelectorAll('#twToc a');
  if('IntersectionObserver' in window){
    var obs=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){
        links.forEach(function(l){ l.classList.toggle('on', l.dataset.key===e.target.id); });
      }});
    }, {rootMargin:'-20% 0px -70% 0px'});
    TOOLS.forEach(function(t){ obs.observe(document.getElementById(t.key)); });
  }
})();
</script>
</body>
</html>
