<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script>window.HRMA_PREFIX="";</script>
</script>
<script src="auth-config.js"></script>
<script src="assets/js/access-gate.js"?v=v11></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>定位 · 服务器到底返回了什么</title>
<style>
:root{--ink:#152238;--ink2:#3d4c63;--mute:#6b7a90;--line:#dfe6ef;--navy:#0f2a4a;--ok:#1c7a4a;--no:#b3261e;--warn:#8a6a10}
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:var(--ink);font:15px/1.7 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;padding:20px}
.wrap{max-width:940px;margin:0 auto}
h1{font-size:20px;color:var(--navy);margin:0 0 6px}
p.lead{margin:0 0 18px;color:var(--ink2);font-size:14px}
.big{font-size:26px;font-weight:800;line-height:1.35;padding:16px 18px;border-radius:12px;margin:0 0 14px}
.big.ok{background:#e7f5ee;color:var(--ok);border:1px solid #b6e0c9}
.big.no{background:#fdecea;color:var(--no);border:1px solid #f5c6c0}
.big.mid{background:#fff4d6;color:var(--warn);border:1px solid #f0dca8}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top;word-break:break-all}
td:first-child{width:30%;color:var(--mute)}
code{background:#f0f3f8;border-radius:4px;padding:1px 5px;font-size:12.5px}
pre{background:#0f2a4a;color:#d6e6f5;border-radius:8px;padding:12px;font-size:12px;overflow:auto;max-height:260px;white-space:pre-wrap;word-break:break-all;margin:0}
button{font:inherit;background:#1d6fb8;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
.st{display:inline-block;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.st.g{background:#e7f5ee;color:var(--ok)}.st.r{background:#fdecea;color:var(--no)}.st.y{background:#fff4d6;color:var(--warn)}
.hint{font-size:12.5px;color:var(--mute);margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>定位：服务器到底返回了什么</h1>
  <p class="lead">这一页会自动跑三项检测，<strong>不用你点任何按钮</strong>。看完最上面那一行大字，把结果告诉我即可。</p>

  <div class="big mid" id="head">正在检测…（约 10 秒）</div>

  <div class="card">
    <h2>检测 1 · 课程模块页 m01.html</h2>
    <table><tbody id="t1"><tr><td>等待</td><td></td></tr></tbody></table>
    <pre id="p1"></pre>
  </div>

  <div class="card">
    <h2>检测 2 · 题库页 wb.html</h2>
    <table><tbody id="t2"><tr><td>等待</td><td></td></tr></tbody></table>
    <pre id="p2"></pre>
  </div>

  <div class="card">
    <h2>检测 3 · 首页 index.html（对照组，应该正常）</h2>
    <table><tbody id="t3"><tr><td>等待</td><td></td></tr></tbody></table>
    <pre id="p3"></pre>
  </div>

  <div class="card">
    <h2>把结果发我</h2>
    <p class="hint">点下面按钮，然后复制框里全部内容发我。</p>
    <button onclick="build()">生成结果文本</button>
    <pre id="rep" style="margin-top:10px">点上面按钮</pre>
  </div>
</div>

<script>
var OUT=[];
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function st(cls,t){ return '<span class="st '+cls+'">'+t+'</span>'; }
function rows(a){ document.getElementById('t'+a.i).innerHTML=a.rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join(''); }
var VERDICT=[];

/* 用 fetch 直接取原始字节：不经任何 JS 跳转、不经 iframe。
   res.url / res.redirected / status / 正文首段，四样合起来就能定性。 */
function probe(path, slot){
  var t0=Date.now();
  fetch(path+'?probe='+Date.now(), {cache:'no-store', redirect:'follow'})
  .then(function(r){
    return r.text().then(function(txt){ return {r:r, txt:txt, ms:Date.now()-t0}; });
  })
  .then(function(o){
    var r=o.r, txt=o.txt;
    var tm=/<title[^>]*>([\s\S]{0,120}?)<\/title>/i.exec(txt);
    var title=tm?tm[1].replace(/\s+/g,' ').trim():'(没有 title 标签)';
    var isHome=/RMC收益管理社区<\/title>/i.test(txt) || /选一个入口|按你要做的事/.test(txt);
    var isM01=/M01/.test(txt)&&/收益管理的语言/.test(txt);
    var verdict = isM01? st('g','正确：拿到了 M01 模块页')
                : isHome? st('r','拿到的是首页（服务器返回错页）')
                : st('y','拿到的是其他页面');
    var rows=[
      ['请求的网址', '<code>'+esc(path)+'?probe=…</code>'],
      ['HTTP 状态', st(r.status===200?'g':(r.status===404?'r':'y'), r.status)],
      ['是否被重定向', (r.redirected? st('y','是'):st('g','否'))+'　最终地址 <code>'+esc(r.url.replace(location.origin,''))+'</code>'],
      ['响应里的标题', '<code>'+esc(title)+'</code>'],
      ['判定', verdict],
      ['耗时', o.ms+' ms　大小 '+Math.round(txt.length/1024)+' KB'],
      ['正文前 200 字', '<code>'+esc(txt.replace(/<script[\s\S]*?<\/script>/g,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,200))+'</code>']
    ];
    rows({i:slot, rows:rows});
    document.getElementById('p'+slot).textContent =
      'status='+r.status+'  redirected='+r.redirected+'\n最终地址='+r.url+'\ntitle='+title+'\n\n'+
      txt.replace(/<script[\s\S]*?<\/script>/g,' ').replace(/<style[\s\S]*?<\/style>/g,' ')
         .replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,400);
    OUT.push('['+path+'] '+verdict.replace(/<[^>]+>/g,'')+' | HTTP '+r.status+' | 最终地址 '+r.url
      +' | title='+title);
    VERDICT.push({p:path, ok:isM01||!isHome});
  })
  .catch(function(e){
    rows({i:slot, rows:[['结果', st('r','请求失败：'+e.message)]]});
    document.getElementById('p'+slot).textContent='失败：'+e.message;
    OUT.push('['+path+'] 请求失败：'+e.message);
  });
}

function run(){
  probe('m01.html', 1);
  probe('wb.html', 2);
  probe('index.html', 3);
  setTimeout(function(){
    var bad=OUT.filter(function(x){ return x.indexOf('首页')>=0 || x.indexOf('失败')>=0; });
    var head=document.getElementById('head');
    if(!OUT.length){ head.className='big mid'; head.textContent='还没拿到结果，请点下面「重新检测」'; return; }
    if(bad.length===0){
      head.className='big ok';
      head.textContent='结论：三个页面都取对了 —— 你的网络能正常拿到内容页。那问题出在浏览器跳转/缓存环节，点下面的「重新检测」再试一次，或把结果发我。';
    } else {
      head.className='big no';
      head.textContent='结论：有问题 —— '+bad.length+' 个页面服务器返回的不是内容页。'
        +'这说明你这边网络/代理把地址换成了首页，不是浏览器缓存。请把下面结果发我。';
    }
  }, 9000);
}

function build(){
  OUT.push('---');
  OUT.push('当前地址：'+location.href);
  OUT.push('浏览器：'+navigator.userAgent.slice(0,100));
  document.getElementById('rep').textContent=OUT.join('\n')+'\n（全部复制发我）';
}

run();
</script>
<script src="assets/js/site-nav.js?v=v10"></script>
  </body>
</html>
