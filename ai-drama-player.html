<script>
window.DP_CFG = {"series": "《定价之间》· 漫剧动画（12 集版）", "subtitle": "把剧本变成会动的剧：按场次推进、逐句对白、集末知识点与分镜提示。共 12 集，每集约 90–100 秒。", "source": "ai-drama.html", "groups": [], "episodes": [{"no": 1, "title": "满房的那天", "meta": "约 90 秒 · 场景：周一早会 · 知识：OCC / ADR / RevPAR", "scenes": ["场 1　周一早上 9:00，酒店小会议室。白板上写着\"昨日：满房！\"和一个感叹号。", "场 2　白板前。林薇拿起笔，画了三个格子。", "场 3　散会，走廊。"], "lines": [{"sp": "阿杰", "tx": "（推门进来，兴冲冲）昨晚满房！最后一间高级房凌晨一点卖掉的，前台几个人都欢呼了。"}, {"sp": "小唐", "tx": "我就说嘛，价格放低点，房子就出去了。这个月任务我提前完成了。"}, {"sp": "老周", "tx": "（没抬头，敲了敲桌上的报表）满房是好事。那你们谁能告诉我，为什么昨天比上周六少赚了两万八？"}, {"sp": "阿杰", "tx": "不可能吧……满房诶，300 间全卖出去了。"}, {"sp": "林薇", "tx": "300 间都卖出去了，这是真的。但上周六均价 780，昨晚 520。"}, {"sp": "老周", "tx": "对。我们拿 100% 的房，换了 67% 的钱。"}, {"sp": "小马", "tx": "（小声）那……卖满了不就是最好吗？"}, {"sp": "林薇", "tx": "如果房是无限的，是。但房是 300 间，卖一间少一间，今晚卖完就没了——它跟卖饮料不一样。"}, {"sp": "林薇", "tx": "所以我们要同时看三个数：出租率，昨晚 100%；平均房价，520。（在白板上写下 OCC、ADR）"}, {"sp": "林薇", "tx": "这两个数单独看都会骗人。真正要看的是第三个——每间可售房收入，也就是 RevPAR。100% × 520 = 520。上周六是 92% × 780 = 718。"}, {"sp": "老周", "tx": "所以昨天比上周六，每间房少赚 198 块，300 间，一天就是五万九。你们只算了两万八，因为还少算了餐饮。"}, {"sp": "阿杰", "tx": "（愣住）所以我们……是亏着满房的。"}, {"sp": "小马", "tx": "薇姐，满房不是好事，那什么时候才是好事？"}, {"sp": "林薇", "tx": "满房本身不是坏事，它只是个信号。它可能说明我们卖对了；也可能说明我们卖早了、卖便宜了——客人拿走了本来愿意付更多的房间。"}, {"sp": "林薇", "tx": "（转身）记住一句话：房子卖得出去，不等于卖得值。"}], "know": "本集知识点｜OCC（出租率）= 卖了多少间；ADR（平均房价）= 每间卖了多少钱；RevPAR = OCC × ADR，才是\"每间可售房赚了多少\"。满房而 RevPAR 下降，是典型的定价失败信号——不是业绩好，是卖便宜了。", "shot": "分镜/画面提示（供 AI 生图）：\n\n① 现代酒店小会议室，长桌，晨光从落地窗斜进来，白板上红色大字\"满房！\"，桌上散着报表，商务写实风。\n\n② 女主角林薇侧身站在白板前，手持马克笔，神情平静但有力，身后四个人表情各异，浅景深。\n\n③ 白板特写：三个手写公式 OCC / ADR / RevPAR，笔迹清晰，旁边画着上升下降箭头。\n\n④ 走廊逆光，两人背影，画面留白，字幕\"房子卖得出去，不等于卖得值\"。"}, {"no": 2, "title": "三个数字", "meta": "约 90 秒 · 场景：总经理办公室 · 知识：指标诊断顺序", "scenes": ["场 1　老周办公室。他盯着屏幕，林薇站在对面。", "场 2　办公室门口，小马偷听。"], "lines": [{"sp": "老周", "tx": "别跟我讲三个数。我就想知道一件事：这个月到底好不好？"}, {"sp": "林薇", "tx": "不好。RevPAR 422，目标 450，差 28。"}, {"sp": "老周", "tx": "差在哪？"}, {"sp": "林薇", "tx": "这就是三个数的用处——它告诉你差在哪一步。RevPAR 掉了，先看出租率：68%，跟去年一样。"}, {"sp": "林薇", "tx": "出租率没掉，那就是价格掉了。ADR 620，去年 645。"}, {"sp": "老周", "tx": "那是我们降价了？"}, {"sp": "林薇", "tx": "不是我们降的。（把平板转过去）看渠道结构：OTA 占比从 20% 涨到 34%。OTA 卖的价格本来就低，还抽 15% 的佣。结构性把 ADR 拉下去了。"}, {"sp": "老周", "tx": "所以不是我们卖便宜了，是我们在便宜的地方卖太多了。"}, {"sp": "林薇", "tx": "对。同样的病，不同的方子：如果是价格问题，要调价；如果是渠道问题，要调结构——降价只会让渠道问题更严重。"}, {"sp": "小马", "tx": "（记笔记）所以顺序是……先看 RevPAR，再看 OCC，再看 ADR？"}, {"sp": "林薇", "tx": "反过来更顺手：出租率看量，均价看价，两个相乘看结果。结果不对，就往回拆，一层一层问\"是谁掉的\"。（笑）像查漏水，先看水表，再找管子。"}], "know": "本集知识点｜诊断顺序：RevPAR 异常 → 拆成 OCC（量）与 ADR（价）→ 定位是谁掉的 → 再追问结构（渠道、客源、房型）。\"降价\"只对\"价低了\"这一种病有效，渠道结构失衡要靠调渠道，误用降价会加重病情。", "shot": "分镜/画面提示：\n\n① 总经理办公室，深色木质，男主角坐在办公桌后皱眉看屏幕，女主站立，光线从侧面窗进，商务写实。\n\n② 平板屏幕特写：柱状图显示渠道占比变化，OTA 柱体明显变高，配色克制。\n\n③ 手绘风格水管漏水示意（可做动画叠加），从水表到管道，标注\"先看结果，再找原因\"。"}, {"no": 3, "title": "星期三的会议室", "meta": "约 100 秒 · 场景：收益例会 · 知识：收益例会工作流", "scenes": ["场 1　周三下午 3:00，会议室。六个人围坐。桌上每人面前一页纸。", "场 2　散场，小马追上林薇。"], "lines": [{"sp": "阿杰", "tx": "（翻着那页纸）每周都开，到底要开什么啊？不就是念数字吗。"}, {"sp": "林薇", "tx": "不念数字。数字提前发，大家会前看。（指向议程）开会只做四件事：看过去、看未来、定动作、分活儿。"}, {"sp": "老周", "tx": "那开始。看过去。"}, {"sp": "林薇", "tx": "上周 RevPAR 430，超目标 8 块。原因是周二、周三两个会议团补上了空档。"}, {"sp": "老周", "tx": "看未来。"}, {"sp": "林薇", "tx": "未来 14 天：下周三有个展，对手 A 已经满房，我们目前 55%。预计三天内会冲到 90%。"}, {"sp": "小唐", "tx": "那我现在就关掉低价渠道？"}, {"sp": "林薇", "tx": "不。先关最便宜的那一档，留一个中档接着收。一次性全关，万一预测错了，房子全砸手里。"}, {"sp": "老周", "tx": "定动作。"}, {"sp": "林薇", "tx": "三条：① 今晚 6 点前关掉 B 档价格；② 行政房最短停留两晚；③ 小唐，展会那两天别再接 30 人以下的团队。"}, {"sp": "小唐", "tx": "（急）可是我已经有个 25 人的在谈……"}, {"sp": "老周", "tx": "分活儿。这个会不谈具体单子，你俩会后单独过——用置换算一遍，算完再定。散会。"}, {"sp": "小马", "tx": "四件事……我记下来了。可这么快就散了？才十七分钟。"}, {"sp": "林薇", "tx": "例会开长了，就说明该在会前做的事被搬到了会上。数据是会前的，判断是会上的。"}], "know": "本集知识点｜收益例会四步：看过去（复盘）→ 看未来（预测）→ 定动作（价格/库存/限制条件）→ 分活儿（责任人与时点）。会议时长目标 15–30 分钟；会前发数据、会上只做判断；具体单子的争议不在会上谈，会后按分析工具单独立会。", "shot": "分镜/画面提示：\n\n① 会议室俯拍，六人围坐长桌，每人面前一页纸，墙上挂\"14 天预测曲线\"图，暖色调。\n\n② 女主站立指着白板四栏：看过去／看未来／定动作／分活儿，其余人抬头的反应镜头。\n\n③ 特写：时钟指向 15:17，画面右下角字幕\"例会开长了，说明该在会前做的事被搬到了会上\"。"}, {"no": 4, "title": "三十天后的那场会", "meta": "约 100 秒 · 场景：办公室 + 快剪 · 知识：预测（Forecast）", "scenes": ["场 1　老周让林薇报\"下个月能卖多少\"。", "场 2　快剪：林薇做预测的四步（画面快速切换，配字幕）。", "场 3　半小时后。"], "lines": [{"sp": "老周", "tx": "下个月能卖多少？给我个数。"}, {"sp": "林薇", "tx": "给我半小时。"}, {"sp": "老周", "tx": "你不是有系统吗，系统不是会算？"}, {"sp": "林薇", "tx": "系统算的是\"按过去的规律，会怎样\"。但规律里没有\"下个月会展中心有个三万人展会\"，也没有\"对手 B 刚换了总经理在冲量\"。（敲桌子）这些得人加进去。"}, {"sp": "字幕① 拉出去年同月 —— 历史基线\n② 看当前在手进度（pickup）—— 已经订了多少\n③ 加事件：展会、演唱会、天气、节假日\n④ 加竞争：对手价格与满房情况\n林薇", "tx": "（画外音）历史给形状，在手给斜率，事件给尖峰，竞争给修正。"}, {"sp": "林薇", "tx": "下个月 RevPAR 我给 465，区间 450–480。"}, {"sp": "老周", "tx": "为什么是 465，不是 470？"}, {"sp": "林薇", "tx": "因为其中两天是展会尾期，需求会断崖。我把那两天按 55% 算的。要是那两天能到 70%，就是 480。"}, {"sp": "老周", "tx": "那你就把它做成 480 的条件：那两天要不要接个团队填进去？"}, {"sp": "林薇", "tx": "（笑）这就是预测真正的用处——它不是算命，是提前把\"还差多少\"摆在桌上，让大家有时间去补。"}], "know": "本集知识点｜预测四要素：历史基线 + 当前在手（pickup）+ 事件（展会/节假/天气）+ 竞争动态。预测的价值不在\"准\"，而在提前暴露缺口——差多少、差在哪天、还有多少天可以补。给出区间而非单点，并说明区间两端对应的条件。", "shot": "分镜/画面提示：\n\n① 女主独自在办公室对着两台显示器，屏幕上折线图与日历叠加，夜景窗外城市灯光，专注神情。\n\n② 快剪四格分屏：历史曲线／在手进度条／展会场馆外景／竞品价格表，每格配 2 字标签。\n\n③ 曲线图特写，其中一段被红框圈出并标注\"缺口\"，旁边手写\"还有 21 天\"。"}, {"no": 5, "title": "这个团队接不接", "meta": "约 110 秒 · 场景：销售部 · 知识：置换分析", "scenes": ["场 1　销售部。小唐把一份报价推到林薇面前。", "场 2　白板上的两栏数字。"], "lines": [{"sp": "小唐", "tx": "80 间，两晚，展会尾期那两天。给 480，行不行？不然客户就走了。"}, {"sp": "林薇", "tx": "这两天预计能卖到 70%，散客均价 700。你这一单，要把 80 间 × 2 晚的位置，用 480 锁掉。"}, {"sp": "小唐", "tx": "可是不接，这 160 间夜可能就空着！"}, {"sp": "林薇", "tx": "那就算清楚\"空着\"和\"接了\"到底哪个亏。（在纸上画）我们算的是置换：这 160 间夜里，有多少本来会被散客以 700 买走？"}, {"sp": "小马", "tx": "可散客还没来啊，怎么知道有多少？"}, {"sp": "林薇", "tx": "所以要估。按预测，这两天散客需求大概 140 间夜。你这一单 160 间夜，会挤掉其中 140。"}, {"sp": "林薇", "tx": "接：160 × 480 = 7 万 6。餐饮我算你 8 千，一共 8 万 4。"}, {"sp": "林薇", "tx": "不接：留下的 140 间夜散客，140 × 700 = 9 万 8，加餐饮 4 千 = 10 万 2。但——这 140 是有风险的，预测可能落空，实际来 100 间夜，那就只有 7 万 4。"}, {"sp": "小唐", "tx": "所以……不一定？"}, {"sp": "林薇", "tx": "现在不一定，是因为价格差太大（480 vs 700 差了 220）。如果把这单谈到 590，就是 9 万 4 加餐饮 8 千 = 10 万 2，跟散客持平且没有风险——确定的钱比可能的钱值钱。"}, {"sp": "小唐", "tx": "那我去谈 590？"}, {"sp": "林薇", "tx": "去谈。谈不下来，就只接 60 间，剩下的留给散客。置换分析算出来的从来不是\"接不接\"，是\"什么条件下可以接\"。"}], "know": "本集知识点｜置换分析（Displacement）：比较\"接这单的收入\"与\"它可能挤掉的散客收入（含餐饮等附加）\"，并计入需求不确定性风险。结论通常不是\"接/不接\"，而是\"到什么价可以接、接多少间\"。规则：确定的钱比可能的钱值钱——风险越高，越要早锁。", "shot": "分镜/画面提示：\n\n① 销售部开放式办公区，男女主隔着堆满文件的桌子对峙，窗外白天，气氛紧张但克制。\n\n② 白板特写两栏对比：左\"接团队 8.4 万\"，右\"留散客 10.2 万（风险 7.4 万）\"，红色标注差额。\n\n③ 女主手指点在一行公式上，抬头说\"什么条件下可以接\"，画面定格配字幕。"}, {"no": 6, "title": "客人说：给我打折", "meta": "约 100 秒 · 场景：前厅 · 知识：价格栅栏", "scenes": ["场 1　前厅。一位商务客人（男，40 岁）在前台，语气不耐。", "场 2　林薇走过来。", "场 3　客人走后。"], "lines": [{"sp": "客人", "tx": "我上个月来还是 620，怎么今天 780？老客户不给优惠？"}, {"sp": "阿杰", "tx": "（为难）这个……先生，这两天有展会……"}, {"sp": "客人", "tx": "那给我上个月那个价，我就住。不然我去对面，他们 700。"}, {"sp": "阿杰", "tx": "（小声对旁边）要不要给他？他一个月来三次。"}, {"sp": "林薇", "tx": "先生，780 是这两天展会的价格。您要是行程能提前一天走，周日是 620，我可以按 620 给您——只是要周日退房。"}, {"sp": "客人", "tx": "我周三才走呢。"}, {"sp": "林薇", "tx": "那还有一个办法：您提前 7 天订、连住三晚、不改不取消，我可以给 690。（笑）不是给不给面子的问题，是价格得挂在一个\"条件\"上。"}, {"sp": "客人", "tx": "……那我下次早点订。"}, {"sp": "客人", "tx": "（转身）算了，就 780 吧，发票开公司。"}, {"sp": "阿杰", "tx": "你刚才怎么不直接给他 620？"}, {"sp": "林薇", "tx": "因为一旦这次给了，他下次就知道\"闹一闹就有\"。而且前台一破例，系统里那条价格就废了，谁都能要走。"}, {"sp": "林薇", "tx": "折扣可以给，但必须挂在条件上——提前订、连住、不取消、会员、特定房型。这叫价格栅栏。客人愿意为便宜接受条件，就不算贱卖；不愿意，他就会按原价买。"}, {"sp": "小马", "tx": "所以他刚才其实……是愿意付 780 的？"}, {"sp": "林薇", "tx": "对。他要的不是便宜，是\"被优待的感觉\"。给他条件，比给他降价有用。"}], "know": "本集知识点｜价格栅栏（Rate Fence）：折扣必须绑定可验证的条件——提前预订、连住天数、不可取消、会员身份、特定房型、特定渠道。作用：① 保护高价客源不被低价侵蚀；② 让\"愿意让渡条件的人\"拿到低价，而非\"会闹的人\"拿到低价。裸折扣是价格体系的漏洞，栅栏是带开关的门。", "shot": "分镜/画面提示：\n\n① 酒店大堂前台，商务男客人抱臂站在台前，前台小哥为难，背景有大理石与暖光吊灯，写实商务风。\n\n② 女主走近，三人对话的中景，表情层次清晰：客人不耐、前台紧张、女主从容微笑。\n\n③ 图示动画：一个\"价格\"被几道竖栏隔开，每栏标注\"提前订／连住／不可取消／会员\"，配字幕\"折扣要挂在条件上\"。"}, {"no": 7, "title": "为什么我订不到房", "meta": "约 100 秒 · 场景：预订部 + 前厅 · 知识：存量控制与最短停留", "scenes": ["场 1　小马盯着屏幕发懵。", "场 2　前厅。一位女士客人。", "场 3　客人办完。阿杰不解。"], "lines": [{"sp": "小马", "tx": "薇姐，系统出问题了！下周三还有 40 间高级房，但官网显示\"不可订\"。"}, {"sp": "林薇", "tx": "没出问题，是我关的。"}, {"sp": "小马", "tx": "有房不卖？客人在网站上刷到我们\"没房\"，会跑去别家啊！"}, {"sp": "林薇", "tx": "下周三展会第一天，连住三晚的客人已经在排队了。如果我让只住一晚的客人把房订走，那第二天、第三天来的长住客就没房了。"}, {"sp": "林薇", "tx": "一晚赚 780，但会把后面两晚的 1560 挤掉。我们不是在卖一间房，是在卖一段连续的日期。"}, {"sp": "客人", "tx": "我就住一晚，为什么一定要两晚起订？"}, {"sp": "阿杰", "tx": "（照着话术念）因为展会期间有最短停留要求……"}, {"sp": "客人", "tx": "那我不住了，我去旁边那家。"}, {"sp": "林薇", "tx": "（走过来）女士，您要是只住一晚，官网现在显示不可订，但我们的豪华房还有，价格一样，您可以看看。高级房那 40 间，是留给连住的客人的。"}, {"sp": "客人", "tx": "豪华房也一样价？那行，就这个。"}, {"sp": "阿杰", "tx": "这不还是卖了吗？那你关它干嘛？"}, {"sp": "林薇", "tx": "区别在她买的是哪一间。我把高级房留给连住客，把一晚客引到豪华房——房型之间的门开着，但\"高级房只卖给连住\"这条规则没破。"}, {"sp": "林薇", "tx": "存量控制的精髓不是\"少卖\"，是把对的库存留给对的客人。空着的高级房在那天，比卖掉更值钱。"}], "know": "本集知识点｜存量控制（Inventory Control）与最短停留（MinLOS）：需求高峰日对低价房型设关闭/最短停留限制，防止短住客挤掉高价值的连住需求。关键技巧：不是把客人赶走，而是\"引流到别的房型\"——规则守住，客源不丢。", "shot": "分镜/画面提示：\n\n① 预订部工位，男青年盯着双屏，屏幕上日历网格中若干日期被红色斜线划掉，神情焦急。\n\n② 大堂前台，女客人与前台对话，女主侧身介入，三人构图，暖色灯光。\n\n③ 动画图示：一排房子图标，短住客被引流箭头指向另一房型，配字幕\"把对的库存留给对的客人\"。"}, {"no": 8, "title": "渠道里的那道缝", "meta": "约 110 秒 · 场景：会议室 · 知识：渠道结构与净价", "scenes": ["场 1　月度会。老周指着渠道表。", "场 2　白板：三条渠道。"], "lines": [{"sp": "老周", "tx": "OTA 占比 34%，去年 20%。小唐，为什么？"}, {"sp": "小唐", "tx": "因为……他们给流量啊。不上 OTA，客人搜不到我们。"}, {"sp": "林薇", "tx": "流量是真的，但我们付了多少？（投影切到净价表）OTA 挂 700，抽 15%，我们到手 595，还要给客人积分。官网同样 700，到手 700。"}, {"sp": "老周", "tx": "差 105 块一间。一个月 3000 间夜走 OTA，就是 31 万。"}, {"sp": "小唐", "tx": "那我们下架？"}, {"sp": "林薇", "tx": "不能下。OTA 是招牌——很多客人在 OTA 上看到我们，再去官网订。这叫\"看板效应\"。我们要的不是砍掉它，是别让它变成唯一入口。"}, {"sp": "林薇", "tx": "三条路同时走：① 官网做会员价，比 OTA 便宜 30，但只在官网；② 协议公司客户转到直销，给固定折扣不走 OTA；③ OTA 只保留两家主力，砍掉那些量小、抽成高的小平台。"}, {"sp": "小唐", "tx": "会员价比 OTA 便宜？那 OTA 不更没人订了。"}, {"sp": "林薇", "tx": "对，那正是我们要的。我们不是要每间房都卖最贵，是要让客人养成直接来找我们的习惯。这个习惯，一年省 300 万。"}, {"sp": "老周", "tx": "做。三个月后我要看 OTA 占比回到 25% 以内。"}], "know": "本集知识点｜渠道管理看净价（到手价）而非挂牌价：净价 = 挂牌价 − 佣金 − 积分/卡券成本。OTA 的双重角色：既获客也分流（看板效应）。策略不是下架，而是① 官网会员价形成价差 ② 协议客户直销化 ③ 收缩低效平台，把结构调到健康区间。", "shot": "分镜/画面提示：\n\n① 会议室投影画面：环形图显示渠道占比，OTA 板块显著偏大，用红色突出；与会人抬头看。\n\n② 女主在白板画三条渠道路径：官网／协议／OTA，每条标注到手价数字。\n\n③ 特写：手机屏幕上酒店官网与 OTA 同房型价格并排，官网价低 30 元，配字幕\"让客人养成直接来找我们的习惯\"。"}, {"no": 9, "title": "对面降价了", "meta": "约 100 秒 · 场景：办公室 + 前厅 · 知识：竞争集与价格弹性", "scenes": ["场 1　小唐冲进办公室。", "场 2　两天后。"], "lines": [{"sp": "小唐", "tx": "对面 A 酒店降价了！原来 880，现在 780。我们要不要跟？"}, {"sp": "林薇", "tx": "先看三件事：他降到什么时候、降了多少间、他自己还剩多少房。"}, {"sp": "林薇", "tx": "（看数据）他只降了下周三到周五，而且只放了 30 间低价房。真正的挂牌价没动。"}, {"sp": "小唐", "tx": "那还是在降啊。"}, {"sp": "林薇", "tx": "这叫试探性放价，不是全面降价。他自己在试需求。我们要是跟着全面降 100，一天少赚 3 万，还把价格锚点砸下去，以后涨不回来。"}, {"sp": "小马", "tx": "那我们不跟，客人不都跑了吗？"}, {"sp": "林薇", "tx": "看我们的在手进度。下周三我们已经 85%，他降他的，我们只剩 45 间。这 45 间本来就是要留给高价晚订客的。（停顿）反而是他降到 780，说明他那天只有 60%——他的需求比我们差。"}, {"sp": "小唐", "tx": "（佩服）你真没跟。结果我们满房了，他最后一天还在 60%。"}, {"sp": "林薇", "tx": "竞品价格是信息，不是指令。看到对手降就跟着降，是把自己的定价权交出去了。"}, {"sp": "林薇", "tx": "什么时候该跟？三种情况：① 他全面降、且持续；② 我们的在手进度明显落后于他；③ 我们的客群跟他高度重叠。三条里至少中两条，才考虑。"}], "know": "本集知识点｜应对竞品降价先看三个维度：降价的时间范围、数量（是试探还是全面）、对手自身在手进度。跟价判据：对手全面且持续 + 我方进度落后 + 客群高度重叠，至少满足两条才跟。盲目跟价会摧毁价格锚点，且损失不可逆。", "shot": "分镜/画面提示：\n\n① 办公室，男销售焦急地举着手机给女主看竞品页面，屏幕上价格从 880 划到 780。\n\n② 电脑屏幕特写：竞品价格表，其中几天被黄色高亮（仅部分日期降价）。\n\n③ 女主站在窗前俯瞰城市，侧脸坚定，配字幕\"竞品价格是信息，不是指令\"。"}, {"no": 10, "title": "淡季的三十天", "meta": "约 110 秒 · 场景：会议室 + 快剪 · 知识：需求创造与细分市场", "scenes": ["场 1　七月，雨季。出租率掉到 41%。气氛低迷。", "场 2　快剪：三个动作落地。", "场 3　月末。"], "lines": [{"sp": "老周", "tx": "41%。这个月工资都发不出来。"}, {"sp": "小唐", "tx": "要不降到 380？总比空着强。"}, {"sp": "林薇", "tx": "降到 380，出租率能到 60%，但 RevPAR 只有 228——比现在 254 还低。淡季降价是对的，但要降给\"本来不会来的人\"，不能降给本来就会来的客人。"}, {"sp": "阿杰", "tx": "那怎么区分？"}, {"sp": "林薇", "tx": "用栅栏。我们做三件事，每一件都只针对一个新的人群。"}, {"sp": "字幕① 本地微度假包：含双人下午茶 + 延迟退房，只卖本市身份证客人（外地客买不到）\n② 会议日场包：白天开会 + 午餐 + 钟点房，不占夜间库存\n③ 长住包月：30 天起，价格打六折，但不含早餐与布草每日更换\n陈姐", "tx": "（插话）那个长住包，布草三天换一次是吧？那我们排班能省下来。厨房也不需要那么早备早餐了。"}, {"sp": "老周", "tx": "（眼睛亮了）这倒是省成本。"}, {"sp": "林薇", "tx": "这个月出租率 63%，RevPAR 288。比去年同期高 11%。而且长住包和会议日场，把餐饮和人工成本一起带下来了。"}, {"sp": "小马", "tx": "所以淡季不是\"等客人来\"，是\"换一批客人来\"？"}, {"sp": "林薇", "tx": "对。需求不会自己长出来，但可以被设计出来。关键是——给不同的人，做不同的产品，还要给它们装上栅栏，别让它们互相打架。"}], "know": "本集知识点｜淡季的正确动作是创造需求而非单纯降价：针对新的细分市场（本地客、日间会议客、长住客）设计带栅栏的新产品，避免低价侵蚀原有客源。同时注意成本联动——少换布草、减少早餐备餐，收益与成本两头一起改善。", "shot": "分镜/画面提示：\n\n① 淡季酒店大堂，雨天窗外，稀疏的客人，前台空荡，冷色调，气氛低迷。\n\n② 快剪三格：下午茶套餐摆拍／白天会议室使用／长住公寓式房间，各配 4 字标签\"本地客\"\"日间客\"\"长住客\"。\n\n③ 月末数据面板：出租率与 RevPAR 两条曲线同时抬头，暖色调，配字幕\"需求可以被设计出来\"。"}, {"no": 11, "title": "明年的数字", "meta": "约 110 秒 · 场景：年度预算会 · 知识：预算与目标设定", "scenes": ["场 1　十一月，年度预算会。气氛紧绷。", "场 2　会后走廊。"], "lines": [{"sp": "老周", "tx": "明年 RevPAR 目标 480。今年 422。"}, {"sp": "林薇", "tx": "这个数字我不签。"}, {"sp": "老周", "tx": "（皱眉）集团要增长。"}, {"sp": "林薇", "tx": "增长可以有，但不能靠拍一个数。480 意味着 ADR 要涨 14%。可我们明年的房量没变、产品没升级、对手 B 还要开新店。凭什么涨 14%？"}, {"sp": "老周", "tx": "那你给个数。"}, {"sp": "林薇", "tx": "445。拆开看：出租率 68→70（+2 个点，靠淡季产品），ADR 620→636（+2.6%，靠渠道结构改善）。（递上一页纸）这是每一项的依据和责任人。"}, {"sp": "老周", "tx": "（翻看，沉默）……渠道改善这一项，你确定能拿 2.6 个点？"}, {"sp": "林薇", "tx": "OTA 占比从 34% 压到 25%，能拿 3.1 个点。我按 2.6 报，留了余量。"}, {"sp": "老周", "tx": "（合上纸）行，445。但每月要复盘，掉了要给我说法。"}, {"sp": "小马", "tx": "薇姐，你刚才不怕吗？跟老周拍桌子。"}, {"sp": "林薇", "tx": "我不是反对高目标，我是反对没有依据的目标。（笑）目标一旦拍脑袋定下来，后面一整年所有人都在为这个数字做假动作——该关的价格不关，该接的单硬接。预算不是一个数字，是一套\"凭什么\"。"}, {"sp": "林薇", "tx": "而且你要记住：你报的数，最好是你留了余量还能做到的。做不到一次，第二年你说话就没人听了。"}], "know": "本集知识点｜预算与目标设定：自下而上拆依据（出租率 × 均价，逐项给来源与责任人），而非自上而下拍数。要点：① 每项增幅都要有具体动作支撑（渠道改善、淡季产品）；② 报价留余量，承诺要能兑现；③ 绑定月度复盘机制。凭空的高目标会诱导一线做\"假动作\"。", "shot": "分镜/画面提示：\n\n① 年末会议室，长桌上摊开打印好的年度报表，众人神色凝重，侧光，气氛冷。\n\n② 女主把一页纸推到桌对面，总经理低头翻看，特写两人手部与纸张，紧张感。\n\n③ 拆解式图表动画：RevPAR 目标被拆成 OCC 与 ADR 两根柱子，各自标注动作与责任人。"}, {"no": 12, "title": "定价之间", "meta": "约 120 秒 · 场景：一年后的行业分享会 · 知识：内核收束", "scenes": ["场 1　一年后，某酒店行业分享会。林薇站在台上，台下坐着同行。小马在台下第一排。", "场 2　闪回快剪（一年来的片段，各 1 秒）：满房那天的白板 / 关门的高级房 / 淡季的下午茶 / 小唐谈回 590 的单 / 老周说\"行，445\"。", "场 3　回到讲台。", "场 4　散场。老周发来微信：「明年目标你来定」。林薇笑了一下，走出会场。镜头拉远，字幕升起。"], "lines": [{"sp": "同行", "tx": "（举手）林老师，能不能一句话说清楚——收益管理到底做什么？"}, {"sp": "林薇", "tx": "一句话：在正确的时间，用正确的价格，把正确的房间，卖给正确的客人。"}, {"sp": "同行", "tx": "那不就是……涨价吗？"}, {"sp": "林薇", "tx": "（笑）我刚做这行的时候，我妈也这么问我。她说：\"你是不是专门把房价抬高的那个人？\""}, {"sp": "林薇", "tx": "这一年我们酒店，涨过价，也降过价。淡季我们降到过 380，旺季我们拒绝过 80 间的团队。涨还是降，从来不是目的。"}, {"sp": "林薇", "tx": "（画外音）我们真正做的事只有一件：每一次都要回答\"现在这个价格，对不对\"。"}, {"sp": "林薇", "tx": "怎么回答？靠三样东西：数据（现在发生了什么）、预测（接下来会发生什么）、规则（这种情况下该怎么做）。"}, {"sp": "林薇", "tx": "数据靠报表，预测靠方法，规则靠提前想清楚——不是等到客人站在前台跟你砍价的时候才想。"}, {"sp": "同行", "tx": "那最难的是什么？"}, {"sp": "林薇", "tx": "不是算数。（停顿）最难的是敢说\"不\"。对想接的单说不，对想给的折扣说不，对拍脑袋的目标说不。因为每一次\"不\"，都是在保护那个正确的价格。"}, {"sp": "林薇", "tx": "还有一件事——你不孤单。前厅、销售、客房，所有人的活儿都跟这个价格有关。收益管理不是一个人对着屏幕调数字，是一整个酒店对\"我们值多少钱\"达成共识。"}], "know": "全集收束｜收益管理的内核不是涨价，而是持续回答\"这个价格对不对\"。支撑它的是三件事：数据（现状）× 预测（未来）× 规则（提前想清楚的判断标准）。最难的不是算数，是在该说\"不\"的时候说\"不\"；最终形态不是个人技能，而是全店对\"我们值多少钱\"的共识。", "shot": "分镜/画面提示（收束集镜头建议升级）：\n\n① 行业分享会舞台，女主手持麦克风侧身站着，背景大屏写着\"定价之间\"，台下满座，专业灯光。\n\n② 快剪蒙太奇：白板公式／关闭房态界面／下午茶摆盘／谈判握手／报表签字，每帧 1 秒，暖黄调。\n\n③ 女主走出会场大门的逆光背影，城市黄昏，镜头缓缓拉远，字幕浮起\"定价之间，是判断的余地\"。"}]};
