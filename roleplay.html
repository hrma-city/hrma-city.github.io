(function(){
  "use strict";
  var SCEN = [{"id": "biz", "title": "城市商务酒店 · 周五会议旺季", "industry": "住宿 · 商务", "role": "收益经理", "intro": "您是杭州滨江云璟酒店（320 间）收益经理。今天周五、明天会议旺季。事情会一件件找上门，您只管选——四个仪表此消彼长。", "nodes": {"s1": {"who": "08:00 · 早会", "txt": "销售总监甩来周末预测：明天会议旺季，今天周五晚已满房 96%。他问『今天基调怎么定？』", "step": "情境 1 / 5", "choices": [{"t": "<b>先看价格弹性再定</b>：调近 4 周同档日型数据，确认提价空间后动手", "d": {"rev": 3, "guest": 1, "owner": 2, "team": 2}, "next": "s2", "fb": "稳。先有数据再动手，避免拍脑袋。对应表 A（价格弹性）与表 N（周度节奏）。", "tab": "表A · 表N"}, {"t": "<b>直接把今天 BAR 顶到上限 +20%</b>：满房了还怕卖不掉？", "d": {"rev": 6, "guest": -4, "owner": 4, "team": -1}, "next": "s2", "fb": "敢提价是本事，但满房日硬顶价可能把价格敏感客推给竞对，且前台后续难卖。对应表 A 上限规则。", "tab": "表A"}, {"t": "<b>维持原价，怕动错</b>：周末再说", "d": {"rev": -3, "guest": 1, "owner": -3, "team": 0}, "next": "s2", "fb": "保守但浪费峰值日。满房日前一天通常有提价空间，不抓等于把利润留给人。对应表 A。", "tab": "表A"}]}, "s2": {"who": "09:20 · 前台急call", "txt": "前台：『系统显示今天已售 323 间——超售 3 间！一位是保证订房（担保卡已扣），另一位是会员。怎么办？』", "step": "情境 2 / 5", "choices": [{"t": "<b>按表 E 处理</b>：查 No-show 率，够则等；不足则安排一位去合作酒店并补偿", "d": {"rev": 2, "guest": -1, "owner": 2, "team": 2}, "next": "s3", "fb": "标准动作。超售不是不能做，是按表 E（超售修正）算清再执行，步行客人要安置+补偿。", "tab": "表E"}, {"t": "<b>直接把保证订房那位 walk</b>：谁让他晚到", "d": {"rev": 4, "guest": -9, "owner": 3, "team": -3}, "next": "s3", "fb": "大忌。保证订房 walk 最伤口碑也最易投诉到平台，与表 E 相悖。", "tab": "表E"}, {"t": "<b>悄悄取消超售 3 间</b>：不认了", "d": {"rev": -3, "guest": 0, "owner": -2, "team": -2}, "next": "s3", "fb": "取消已售订单同样违约且伤信任，还白白丢收入。表 E 给的是『算清再超售』而非『超了就撤』。", "tab": "表E"}]}, "s3": {"who": "10:30 · 销售询价", "txt": "销售：『40 间会议团队要今天入住，只肯出 ¥520（BAR ¥680）。今天已 90%。接不接？』", "step": "情境 3 / 5", "choices": [{"t": "<b>接，但置换</b>：用表 G 算清挤掉多少散客高价，等价或略低则接、并挪一部分到偏低谷日", "d": {"rev": 1, "guest": 0, "owner": 3, "team": 2}, "next": "s4", "fb": "正确思路。团队价用表 G（团队置换）衡量综合贡献，不是只看单价。", "tab": "表G"}, {"t": "<b>全接，单价好谈</b>：40 间到手再说", "d": {"rev": -5, "guest": 1, "owner": 1, "team": 1}, "next": "s4", "fb": "今天已 90%，低价接大团会挤掉高价散客，单位收益反降。表 G 提示置换损失。", "tab": "表G"}, {"t": "<b>一口回绝</b>：满房日不接团队", "d": {"rev": 2, "guest": 1, "owner     } else if(G.rev>=70&&G.owner>=65&&G.guest>=45&&G.team>=45){
      em="🏆"; badge="稳健收益派";
      desc="收益与业主双赢，客人、团队没拖后腿。这是教科书追求的『综合贡献最大化』（表 K）——不是把单一指标拉满，而是让四端都站得住。";
    } else if(maxK==="guest"){
      em="😊"; badge="客人至上型";
      desc="您把客人满意度守得最高，口碑资产厚。但下次可在满房日更敢提价（表 A）、团队置换更精（表 G）。";
    } else if(maxK==="owner"){
      em="💼"; badge="业主宠儿型";
      desc="业主仪表最高，短期最讨喜。但别为业主牺牲客人与团队太久——表 N 例会的透明汇报能帮您平衡长期关系。";
    } else if(maxK==="team"){
      em="🤝"; badge="团队凝聚型";
      desc="团队仪表最高，执行最顺。补强可在数据驱动决策（表 A/J）上再狠一点。";
    } else {
      em="📊"; badge="平衡经营型";
      desc="四端都没崩、也没特别突出——这是新手最稳的结局。下一步目标：在守住底线同时把收益/业主推过 70（表 A 提价、表 G 置换、表 H 尾单清仓）。";
    }
    var h='<div class="rp-end"><div class="em">'+em+'</div><h2>'+badge+'</h2>'+
      '<div class="rp-gauges" style="max-width:520px;margin:14px auto">';
    ["rev","guest","owner","team"].forEach(function(k){
      h+='<div class="rp-g'+(G[k]<=15?" warn":(G[k]>=85?" glow":""))+'"><div class="gl">'+GMETA[k].l+'</div><div class="gv">'+G[k]+'</div><div class="gbar"><i style="width:'+G[k]+'%"></i></div></div>';
    });
    h+='</div><div class="ed">'+desc+'</div></div>';
    $("board").innerHTML=h;
  }
  $("btnBack").onclick=renderPicker;
  $("btnRestart").onclick=function(){ if(CUR) startScenario(SCEN.indexOf(CUR)); };
  renderPicker();
})();
</script>
<script>window.HRMA_PREFIX="";</script>
<script src="assets/js/notify.js"></script>
</body>
