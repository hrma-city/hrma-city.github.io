<div class="box">
  <div class="spin"></div>
  <h1>正在前往登录页…</h1>
  <p>登录功能已统一到同一个页面（<b>access.html</b>）。<br>
     站长本人请用页面顶部的<b>恢复码</b>进站，不需要密码。</p>
  <a class="btn" id="go" href="access.html">立即前往登录页</a>
</div>
<script>
/* ⚠️ 这个文件从 2026-10-03 起只是一个「旧登录页地址」的兼容入口。
   原因：站内曾同时存在两套登录（access.html 用 access-login.js + 恢复码通道；
   login.html 用旧的 auth.js + demo-backend.js，没有恢复码、且旧逻辑已损坏），
   导致站长「在登录页输密码一直提示不正确」——他进的是这套旧页。
   现在统一：所有 login.html?redirect=xxx 都自动转到 access.html?next=xxx，
   两个参数名都兼容。 */
(function () {
  function q(n) {
    var m = location.search.match(new RegExp('[?&]' + n + '=([^&]*)'));
    if (!m) return '';
    try { return decodeURIComponent(m[1]); } catch (e) { return ''; }
  }
  var target = q('next') || q('redirect') || '';
  /* 只接受站内相对路径，防止被拼到站外地址 */
  if (target && (target.indexOf('//') === 0 || target.indexOf('http') === 0)) target = '';
  var to = 'access.html' + (target ? '?next=' + encodeURIComponent(target) : '');
  document.getElementById('go').href = to;
  try { location.replace(to); } catch (e) { location.href = to; }
})();
</script>
