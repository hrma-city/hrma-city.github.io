<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>window.HRMA_PREFIX="";</script>
<script src="auth-config.js?v=gate20261013"></script>
<script src="assets/js/access-gate.js?v=v12"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>46章配套资源地图 · RMC</title>
<style>
:root{--navy:#0f2a4a;--navy2:#123a66;--gold:#e8b84b;--ink:#1f2a37;--mut:#5b6a7d;--ok:#2a9d5f;--line:#e3e9f1;--bg:#f4f7fb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;font-size:15px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px 80px}
.hero{background:linear-gradient(135deg,#0f2a4a,#1d4e7e);color:#fff;padding:30px 0 26px}
.hero .wrap{padding-bottom:0}
.hero .tag{display:inline-block;background:rgba(232,184,75,.18);border:1px solid rgba(232,184,75,.5);color:#f5d78e;font-size:12px;border-radius:999px;padding:3px 12px;margin-bottom:10px}
.hero h1{font-size:24px;line-height:1.45}
.hero p{color:#b9d0e6;font-size:14px;margin-top:8px;max-width:840px}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}
.stats b{font-size:19px;color:#f5d78e}
.stats span{font-size:12px;color:#b9d0e6;display:block}
.bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 17px;margin:16px 0;position:sticky;top:8px;z-index:5}
.bar input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit}
.bar .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;color:var(--mut)}
.pill.on{background:var(--navy2);border-color:var(--navy2);color:#fff;font-weight:700}
.grid{display:grid;gap:11px;margin-top:14px}
.ch{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 17px;box-shadow:0 1px 3px rgba(15,42,74,.05)}
.ch-hd{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.no{background:var(--navy2);color:#fff;border-radius:7px;padding:2px 9px;font-weight:800;font-size:13px;flex:none}
.tt{font-weight:800;color:var(--navy);font-size:15px}
.tb{font-size:11px;color:var(--gold);background:#faf3e0;border-radius:5px;padding:2px 7px}
.res{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.res a{text-decoration:none;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:5px 10px;color:var(--navy2);background:#f7fafc;transition:.15s}
.res a:hover{border-color:var(--navy2);background:#eaf1f9}
.res a.k2{color:var(--ok);border-color:#cfe6d9;background:#f2f9f5}
.res a.k3{color:#8a6510;border-color:#ead9ac;background:#fdf9ee}
.res a.k4{color:#6b4a8c;border-color:#e0d4ef;background:#f8f5fc}
.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--mut)}
.note{background:#eaf6ef;border:1px solid #bfe3cd;color:#1d5a41;border-radius:9px;padding:9px 13px;font-size:12.5px;margin:12px 0}
@media print{.bar{position:static}.hero{background:#fff;color:#000}.hero p,.stats span{color:#333}.stats b{color:#1d4e7e}}
</style>
</head>
<body data-page="chapter-map" data-auth="protected">
<header class="hero"><div class="wrap">
  <span class="tag">46章配套资源地图 · 全部链接已核验</span>
  <h1>读哪一章，就用哪一章的工具</h1>
  <p>每章的教材、题库、判定表、实验表、工具、AI 课集中在一处。点击即得，不必再全站找。所有链接均已核对文件真实存在。</p>
  <div class="stats">
    <div><b>46</b><span>章</span></div>
    <div><b>466</b><span>道题</span></div>
    <div><b>15</b><span>张判定表</span></div>
    <div><b>23</b><span>实验表（带预览）</span></div>
    <div><b>3</b><span>AI 试听课</span></div>
  </div>
</div></header>
<main class="wrap">
  <div class="note">版本口径：以现行 <b>46 章</b>教材为准。41 章内容仅作历史版本保留，不作为现行配套依据。</div>
  <div class="bar"><div class="row">
    <input id="q" placeholder="搜章号或关键词，如「超售」「12」「预算」…">
    <span class="pill on" data-f="all">全部 46</span>
    <span class="pill" data-f="exp">有实验表 23</span>
    <span class="pill" data-f="ai">有 AI 课 3</span>
    <span class="pill" data-f="tool">有专属工具</span>
  </div></div>
  <div class="grid" id="grid"></div>
</main>
<script src="chapter-map-data.js"></script>
<script src="auth.js?v=2"></script>
<script>
(function(){
  var M=window.RMC_CHAPTER_MAP;
  var grid=document.getElementById('grid'),q=document.getElementById('q');
  var filter='all';
  var TOOLNAME={'benchmark-fit.html':'基准对比器','diagnose.html':'收益健康自检','rm-audit.html':'成熟度自评','action-plan-90.html':'90天行动','pricing-decision.html':'定价陪练','competitor-pricing-decision.html':'跟价陪练','team-replacement-decision.html':'团队置换陪练','attribution-coach.html':'归因陪练','attribution-drill.html':'归因追问(3样本)','calc-center-v2.html':'计算中心','mock-interview.html':'模拟面试','rm-personality.html':'性格测评'};
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
  function render(){
    if(!M){grid.innerHTML='<div class="empty">映射数据未加载（检查 chapter-map-data.js）。</div>';return}
    var kw=(q.value||'').trim().toLowerCase();
    var list=M.items.filter(function(it){
      if(filter==='exp'&&!it.exp)return false;
      if(filter==='ai'&&!it.ai)return false;
      if(filter==='tool'&&!it.tools.length)return false;
      if(kw){
        var hay=(it.ch+' '+it.title+' '+it.tables).toLowerCase();
        if(hay.indexOf(kw)<0)return false;
      }
      return true;
    });
    if(!list.length){grid.innerHTML='<div class="empty">没有符合条件的章节。</div>';return}
    grid.innerHTML=list.map(function(it){
      var r='<a href="'+it.book+'">教材第'+it.ch+'章</a>';
      r+='<a href="'+it.quiz.url+'">速测 '+it.quiz.n+' 题</a>';
      r+='<a href="'+it.tableUrl+'">判定表 '+esc(it.tables)+'</a>';
      if(it.exp){
        if(it.exp.preview) r+='<a class="k3" href="'+it.exp.preview+'">实验表·预览</a>';
        r+='<a class="k3" href="'+it.exp.csv+'">实验表·下载</a>';
      }
      it.tools.forEach(function(t){r+='<a class="k4" href="'+t+'">'+esc(TOOLNAME[t]||t)+'</a>'});
      if(it.ai) r+='<a class="k2" href="'+it.ai+'">AI 试听课</a>';
      M.fallback.forEach(function(t){r+='<a href="'+t+'">'+esc(TOOLNAME[t]||t)+'</a>'});
      return '<article class="ch" id="ch'+it.ch+'"><div class="ch-hd"><span class="no">第 '+it.ch+' 章</span>'+
        '<span class="tt">'+esc(it.title)+'</span><span class="tb">表 '+esc(it.tables)+'</span></div>'+
        '<div class="res">'+r+'</div></article>';
    }).join('');
  }
  q.addEventListener('input',render);
  [].forEach.call(document.querySelectorAll('.pill'),function(p){
    p.onclick=function(){
      [].forEach.call(document.querySelectorAll('.pill'),function(x){x.classList.remove('on')});
      p.classList.add('on'); filter=p.getAttribute('data-f'); render();
    }
  });
  render();
})();
</script>
</body>
</html>
