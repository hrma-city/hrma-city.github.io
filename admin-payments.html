<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大额订单核销 · RMC收益管理社区</title>
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/auth.css">
<link rel="stylesheet" href="assets/css/notify.css">
</head>
<body data-auth="admin">

<header class="site-nav">
  <div class="sn-inner">
    <a class="sn-logo" href="index.html"><span class="gem">收</span><span>RMC收益管理社区</span></a>
    <nav class="sn-links" id="snLinks">
      <a href="index.html">首页</a>
      <a href="about.html">关于学院</a>
      <a href="login.html">登录</a>
      <a href="register.html">申请账号</a>
      <a href="admin.html">账号审批</a>
      <a href="admin-payments.html" class="on">大额核销</a>
      <a href="contact.html">联系我们</a>
    </nav>
    <a class="sn-cta" href="codex.html">打开法典</a>
    <button class="sn-toggle" id="snToggle" aria-label="菜单">☰</button>
  </div>
</header>

<main class="adm-wrap">
  <div class="adm-head">
    <h1>大额订单核销</h1>
    <a class="btn-ok btn-sm" href="#" id="refresh">刷新列表</a>
  </div>
  <p class="adm-sub">金额 &gt; 500 元的订单（如企业版会员 ¥1999）走人工确认：用户点「我已支付」后进入待确认，不立即开通权益。<br>请在核对到账（微信 / 支付宝 / 银行账单）后点「核销」，系统才开通会员。防转账后撤回白嫖。</p>

  <div class="msg" id="msg" style="text-align:left"></div>
  <div class="adm-count-bar" id="countBar">待确认订单：<b id="cN">0</b></div>
  <div class="adm-list" id="list"></div>
</main>

<footer class="site-footer">
  <div class="sf-in">
    <div class="sf-bot">
      <span>RMC收益管理社区 · 大额订单核销</span>
      <span>联系：<a href="mailto:rm-community@qq.com" style="display:inline;color:var(--gold-2)">rm-community@qq.com</a></span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script src="assets/js/commerce.js"></script>
<script>
(function () {
  var A = window.HRMAuth;
  var C = window.RMCCommerce;
  var listEl = document.getElementById("list");
  var msg = document.getElementById("msg");

  function show(text, kind) {
    msg.className = "msg show " + (kind || "err");
    msg.innerHTML = text;
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function fmt(t) {
    if (!t) return "—";
    try { return new Date(t).toLocaleString("zh-CN", { hour12: false }); }
    catch (e) { return String(t); }
  }
  var KIND = { membership: "会员", course: "课程包", consult: "专家咨询", job_post: "职位推广" };

  function rowHTML(o) {
    var p = o.profiles || {};
    var buyer = [p.full_name, p.email].filter(Boolean).join(" · ") || "（未知）";
    var meta = [
      "类型：" + (KIND[o.kind] || o.kind),
      o.ref_id ? ("项目：" + esc(o.ref_id)) : "",
      "金额：<b>¥" + Number(o.amount) + "</b>",
      "下单：" + fmt(o.created_at)
    ].filter(Boolean).join("　|　");
    var act = '<button class="btn-sm btn-ok" data-act="approve" data-id="' + o.id + '">核销并开通</button>';
    return '<div class="adm-row">' +
      '<div class="ar-main">' +
        '<div class="ar-name">订单 ' + esc((o.id || "").slice(0, 8)) + ' <span class="pill-s review">待确认</span></div>' +
        '<div class="ar-meta">' + meta + "</div>" +
        '<div class="ar-reason">下单人：' + esc(buyer) + "</div>" +
      "</div>" +
      '<div class="ar-act">' + act + "</div>" +
    "</div>";
  }

  async function load() {
    listEl.innerHTML = '<div class="adm-empty">加载中…</div>';
    try {
      var c = C.client();
      var r = await c.from("orders")
        .select("*, profiles(email, full_name)")
        .eq("status", "pending_review")
        .order("created_at", { ascending: true });
      if (r.error) throw r.error;
      var rows = r.data || [];
      document.getElementById("cN").textContent = rows.length;
      if (!rows.length) {
        listEl.innerHTML = '<div class="adm-empty">暂无待确认订单 🎉</div>';
        return;
      }
      listEl.innerHTML = rows.map(rowHTML).join("");
    } catch (err) {
      listEl.innerHTML = "";
      show("加载失败：" + ((err && err.message) || err), "err");
    }
  }

  listEl.addEventListener("click", async function (e) {
    var btn = e.target.closest("button[data-act]");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    if (!confirm("确认已核对到账？核销后将为该用户开通权益，此操作不可撤销。")) return;
    btn.disabled = true;
    try {
      var res = await C.approvePayment(id);
      if (res && res.ok) {
        show("已核销并开通权益。列表已刷新。", "ok");
        await load();
      } else {
        show("核销失败：" + ((res && res.msg) || "未知错误"), "err");
        btn.disabled = false;
      }
    } catch (err) {
      show("核销失败：" + ((err && err.message) || err), "err");
      btn.disabled = false;
    }
  });

  document.getElementById("refresh").addEventListener("click", function (e) {
    e.preventDefault();
    load();
  });

  (async function () {
    if (!A || !A.configured()) {
      listEl.innerHTML = "";
      show("鉴权未配置。请先在 auth-config.js 填入 Supabase 的 URL 与 anon key。", "err");
      return;
    }
    try {
      var s = await A.session();
      if (!s) { location.href = "login.html?redirect=admin-payments.html"; return; }
      if (!A.isAdmin(s.user.email)) {
        listEl.innerHTML = '<div class="adm-empty">无权限：本页面仅管理员可访问。</div>';
        return;
      }
      await load();
    } catch (err) {
      show("初始化失败：" + ((err && err.message) || err), "err");
    }
  })();
})();
</script>
<script>
(function(){var t=document.getElementById('snToggle'),l=document.getElementById('snLinks');
if(t&&l){t.addEventListener('click',function(){l.classList.toggle('open');});}})();
</script>
<script>window.HRMA_PREFIX="";</script>
<script src="assets/js/notify.js"></script>
</body>
</html>
