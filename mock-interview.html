<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.HRMA_PREFIX="";</script>
<script src="auth-config.js?v=gate20261013"></script>
<script src="assets/js/access-gate-public.js?v=v1"></script>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 模拟面试官 · 收益岗位实战演练</title>
<style>
:root{--o:#0284C7;--od:#0369A1;--soft:#f0f9ff;--navy:#0f2a4a;--navy2:#1d4e7e;--ink:#1f2937;--mut:#5b6a7d;--line:#e3e9f1;--page:#f4f7fb;--g:#16a34a;--r:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--ink)}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px 0 20px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.top .kick{font-size:12px;color:#f5d78e;letter-spacing:1px;margin-bottom:6px}
.top h1{font-size:26px;line-height:1.35;margin-bottom:6px}
.top p{color:#c9d8ea;font-size:13.5px;max-width:640px}
main{max-width:860px;margin:0 auto;padding:24px 20px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px}
h2{font-size:18px;color:var(--navy);margin-bottom:10px}
h3{font-size:15px;color:var(--navy);margin:14px 0 8px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
select,input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
.btn{display:inline-block;background:var(--o);color:#fff;border:0;border-radius:9px;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit;margin:6px 6px 0 0}
.btn:hover{background:var(--od)}
.btn.ghost{background:#fff;color:var(--o);border:1px solid var(--o)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.hide{display:none}
.tag{display:inline-block;background:var(--soft);color:var(--od);border:1px solid #fcd9b6;border-radius:20px;padding:3px 11px;font-size:12px;margin:2px 4px 2px 0}
.note{background:#fffbe8;border:1px solid #f5d78e;border-radius:9px;padding:10px 13px;font-size:12.5px;color:#7a5b00;margin-top:12px}
.out{background:var(--soft);border:1px dashed var(--o);border-radius:11px;padding:16px 18px;margin-top:14px;white-space:pre-wrap;line-height:1.85;font-size:14px}
.back{display:inline-block;margin-top:8px;color:var(--mut);font-size:12.5px;text-decoration:none}
.back:hover{color:var(--o)}
@media(max-width:600px){.top h1{font-size:21px}.card{padding:18px 16px}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
<div class="kick">RMC 收益管理社区 · 免费工具</div>
<h1>AI 模拟面试官 · 收益岗位实战演练</h1>
<p id="topdesc"></p>
</div></div>
<main><div class="card"><h2>像真的面试一样，把话说出来</h2><p class="sub">选一个岗位方向，逐题作答。每题给出考察点和参考要点，答完生成自评报告。</p><label>目标岗位</label><select id="role"><option value="exec">收益执行专员（L1）</option><option value="sup">收益主管（L2）</option><option value="mgr">收益经理（L3）</option><option value="teacher">院校教师 / 讲师</option></select><div style="margin-top:14px"><button class="btn" onclick="start()">开始面试 →</button></div></div><div class="card hide" id="stage"></div><script>
const Q={"exec": [{"q": "你到岗第一周，每天要看哪几张表？为什么？", "pt": "指标体系与日常流程", "ref": "日报/台账、pickup 预订速度、竞对比价、on-book 快照。能说出看它们是为了发现进度偏差与竞对动作。"}, {"q": "如果发现某天 pickup 明显慢于进度，你会怎么做？", "pt": "进度偏差触发动作", "ref": "先核对比价与库存/渠道状态，定位是价格、位置还是渠道问题；按判定表采取调价/放量/开渠道等动作并留痕。"}, {"q": "OTA 和直销价格倒挂了，你怎么处理？", "pt": "渠道一致性", "ref": "查净价与成本率，优先保直销和会员价的一致性，必要时调渠道配额或关低价渠道。"}], "sup": [{"q": "旺季来临，你会怎么安排提价节奏和库存？", "pt": "需求预测与库存策略", "ref": "结合需求日历与历史弹性分步提价，配合 MinLOS、保护位，峰值日关低价渠道。"}, {"q": "有个团队想挤掉散客，你如何决定接不接？", "pt": "置换分析", "ref": "算净贡献与置换门槛，比较散客机会成本、渠道成本与团队长期价值，再决策。"}, {"q": "怎么带团队开好每日收益例会？", "pt": "组织与执行标准", "ref": "固定议程：昨日复盘、今日偏差、竞对变化、动作与责任人、留痕追踪。"}], "mgr": [{"q": "年度预算怎么分解到每天，并据此管理？", "pt": "预算与预测体系", "ref": "按季节与事件日把年目标拆到日，滚动预测，用偏差触发动作而非拍脑袋。"}, {"q": "你如何说服前厅和销售配合收益策略？", "pt": "跨部门协同", "ref": "用共同目标与冲突仲裁规则，把收益动作翻译成对各岗位有意义的指标。"}, {"q": "淡季如何创造需求，而不只是降价？", "pt": "需求创造", "ref": "细分客源、套餐打包、事件营销、私域会员等多手段组合，把蛋糕做大。"}], "teacher": [{"q": "如果给你 32 学时，你会怎么挑章节、排进度？", "pt": "课程设计", "ref": "先保住决策闭环（指标—预测—定价—库存—渠道—竞争）必讲章，再加广度；说明取舍依据。"}, {"q": "怎么把抽象的价格弹性讲给学生听懂？", "pt": "教法与案例", "ref": "用真实场景或课堂游戏切入，先直觉后公式，配一个可算的小例子。"}, {"q": "student 做错的题，你怎么设计讲评？", "pt": "教学反馈", "ref": "按知识域归类错因，回到判定表和公式的适用边界，配变式题巩固。"}]};
let role='',cur=0,answers=[];
function start(){role=document.getElementById('role').value;cur=0;answers=[];document.getElementById('stage').classList.remove('hide');showQ();}
function showQ(){
  const q=Q[role][cur];
  document.getElementById('stage').innerHTML=`<h2>第 ${cur+1} / ${Q[role].length} 题</h2>
   <p class="sub">考察点：${q.pt}</p>
   <h3>${q.q}</h3>
   <label>你的回答（尽量像面试时说出来）</label>
   <textarea id="ans" placeholder="写下你的思路..."></textarea>
   <div style="margin-top:12px"><button class="btn" onclick="next()">${cur===Q[role].length-1?'完成面试':'下一题 →'}</button></div>`;
  document.getElementById('stage').scrollIntoView({behavior:'smooth'});
}
function next(){
  answers.push(document.getElementById('ans').value.trim());cur++;
  if(cur<Q[role].length){showQ();return;}
  const rows=Q[role].map((q,i)=>`<div class="card" style="margin:10px 0;background:#fff">
    <h3 style="margin-top:0">${i+1}. ${q.q}</h3>
    <p style="font-size:13px;color:var(--mut)"><b>你的回答：</b>${answers[i]||'（未作答）'}</p>
    <div class="note" style="background:#f0f9ff;border-color:#bae6fd;color:#075985"><b>参考要点：</b>${q.ref}</div></div>`).join('');
  document.getElementById('stage').innerHTML=`<h2>面试复盘</h2><p class="sub">对照参考要点，看看自己的回答覆盖了几点。真实面试里，结构化 + 有例子最加分。</p>${rows}
   <div style="margin-top:12px"><button class="btn ghost sm" onclick="start()">再练一次</button></div>`;
  document.getElementById('stage').scrollIntoView({behavior:'smooth'});
}
</script>
<div style="text-align:center;margin-top:26px">
<a class="back" href="free-tools-hub.html">← 返回免费工具箱</a>
</div>
</main>
<script src="assets/js/evidence-line.js"></script>
</body>
</html>
