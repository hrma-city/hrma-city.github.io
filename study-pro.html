">－不变</td><td class=\"num\">+17.2%</td><td><span class=\"pill pill-teal\">合格</span></td></tr>\n        <tr><th class=\"rowh\">豪华房 DLX</th><td class=\"num\">45</td><td class=\"num\">¥820</td><td class=\"num\">¥820</td><td class=\"flat\">－不变</td><td class=\"num\">+20.6%</td><td><span class=\"pill pill-teal\">合格</span></td></tr>\n        <tr><th class=\"rowh\">豪华江景 DLX-V</th><td class=\"num\">15</td><td class=\"num\">¥960</td><td class=\"num\">¥960</td><td class=\"flat\">－不变</td><td class=\"num\">+17.1%</td><td><span class=\"pill pill-teal\">合格</span></td></tr>\n        <tr><th class=\"rowh\">行政房 EXE</th><td class=\"num\">30</td><td class=\"num\">¥990</td><td class=\"num\">¥1,040</td><td class=\"up\">↑¥50（+5.1%）</td><td class=\"num\">+8.3%</td><td><span class=\"pill pill-teal\">合格</span></td></tr>\n        <tr><th class=\"rowh\">商务套房 STE-B</th><td class=\"num\">8</td><td class=\"num\">¥1,280</td><td class=\"num\">¥1,400</td><td class=\"up\">↑¥120（+9.4%）</td><td class=\"num\">+34.6%</td><td><span class=\"pill pill-teal\">合格</span></td></tr>\n        <tr><th class=\"rowh\">行政套房 STE-E</th><td class=\"num\">2</td><td class=\"num\">¥1,880</td><td class=\"num\">¥1,880</td><td class=\"flat\">－不变</td><td class=\"num\">+34.3%</td><td><span class=\"pill pill-teal\">合格</span></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">校验闭环三步（缺一步不算做完）</span>\n    <ol style=\"margin:6px 0 0\">\n      <li><b>落位</b>：在价格日历中把 EXE、STE-B 的新 BAR 落位，落位后 30 分钟内检查 6 个渠道的挂牌价是否同步（《法典》表 M 09:40 一致性核查）。</li>\n      <li><b>记档</b>：写入《调价台账》，依据栏写「《法典》表 F 每周一价差校验」，备注栏写清三项：DLX-V→EXE 3.1%&lt;8%（按近 7 日 OCC 88% vs 71% 选提上一档）、STE-B→STE-E 46.9%&gt;35%（提下一档）、套房 vs 最高房型 80.8%≥60%（免动作）。</li>\n      <li><b>回填</b>：把新系数（EXE 153、STE-B 206）回填到《房型价差阶梯表》的\"本周执行系数\"列，作为下周校验的比较基线。</li>\n    </ol>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">一条常见的错误做法</span>\n    <p>不要在校验后把 <b>STD 也一起上调</b>。表 F 的三条规则都是<b>相邻档</b>规则，触发哪个档就动哪个档，其他档不动。全档一起平移等于没做价差校验——价差是比例关系，全档同比例平移后价差百分比完全不变，问题原封不动地留下。</p>\n  </div>\n\n  <\!-- ================= 四 ================= -->\n  <h2 id=\"s4\">四、价格日历：365 天的 D1/D2/D3/D4 打标</h2>\n\n  <p>价格日历就是把一年 365 天逐日打上需求等级标签，再给每个标签配上价格系数。打标不是凭感觉，是四步固定流程。</p>\n\n  <h3>4.1 打标四步法</h3>\n\n  <div class=\"step\">\n    <div class=\"step-num\">1</div>\n    <div class=\"step-body\">\n      <h4>套用《SPEC》2.5 年度需求日历的固定日期</h4>\n      <p>先把《SPEC》2.5 明确列举的日期一次性打上标签，这部分不需要判断：</p>\n      <div class=\"tbl-wrap\" style=\"margin-top:8px\">\n        <table class=\"tbl\">\n          <thead><tr><th>等级</th><th>《SPEC》2.5 明确列举的日期</th></tr></thead>\n          <tbody>\n            <tr><th class=\"rowh\">D1 峰值日</th><td>国庆 1–5、五一 1–3、春节初三–初六、滨江动漫节／云栖大会／国际马拉松等 8–12 天</td></tr>\n            <tr><th class=\"rowh\">D2 高涨日</th><td>旺季（4–5 月、9–10 月）周五六、展会周边日、暑期周末</td></tr>\n            <tr><th class=\"rowh\">D3 平峰日</th><td>平季周五六、旺季周日–周四</td></tr>\n            <tr><th class=\"rowh\">D4 低谷日</th><td>1–2 月淡季（除春节）、7 月上中旬、节后 3–5 天、极端天气日</td></tr>\n          </tbody>\n        </table>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">2</div>\n    <div class=\"step-body\">\n      <h4>用去年同日实际 OCC 校验</h4>\n      <p>把去年同日的实际 OCC 与该等级的目标 OCC 区间对照。落在区间内 → 标签确认；落在区间外 → 升高或降低一档，并在《年度需求日历》备注栏写明原因（如\"去年同日 88%，高于 D3 上限 85%，升为 D2\"）。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">3</div>\n    <div class=\"step-body\">\n      <h4>叠加已确认事件</h4>\n      <p>只叠加<b>有书面证据</b>的事件：官方会期公告（展会／赛事）、气象部门预警（极端天气）、工程部通知（本店停业项目）、客户书面取消（需求流失）。无书面证据的事件不进日历。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">4</div>\n    <div class=\"step-body\">\n      <h4>与月度 OCC / ADR 目标对齐</h4>\n      <p>把打标结果按天加权，算出月度预测 OCC 与预测 ADR，与《SPEC》2.5 月度需求基准对照。偏差超过 3 个百分点时，回到第 2 步重新校验该月各日标签。</p>\n    </div>\n  </div>\n\n  <h3>4.2 实例：云璟酒店 2026 年 10 月需求日历打标</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-7　2026 年 10 月需求日历打标（片段）<span class=\"cap-note\">10 月月度目标：OCC 85%、ADR ¥700（《SPEC》2.5）</span></caption>\n      <thead><tr><th>日期</th><th>星期</th><th>打标依据</th><th>等级</th><th class=\"num\">目标 OCC</th><th class=\"num\">价格系数</th></tr></thead>\n      <tbody>\n        <tr><td>10-01 – 10-05</td><td>周四–周一</td><td>《SPEC》2.5「国庆 1–5」</td><td><span class=\"pill pill-red\">D1</span></td><td class=\"num\">≥95%</td><td class=\"num\">150–200%</td></tr>\n        <tr><td>10-06 – 10-08</td><td>周二–周四</td><td>《SPEC》2.5「节后 3–5 天」</td><td><span class=\"pill\">D4</span></td><td class=\"num\">45–65%</td><td class=\"num\">70–85%</td></tr>\n        <tr><td>10-09</td><td>周五</td><td>旺季（9–10 月）周五</td><td><span class=\"pill pill-amber\">D2</span></td><td class=\"num\">88–95%</td><td class=\"num\">120–150%</td></tr>\n        <tr><td>10-10</td><td>周六</td><td>旺季（9–10 月）周六</td><td><span class=\"pill pill-amber\">D2</span></td><td class=\"num\">88–95%</td><td class=\"num\">120–150%</td></tr>\n        <tr><td>10-11</td><td>周日</td><td>旺季周日</td><td><span class=\"pill pill-navy\">D3</span></td><td class=\"num\">72–85%</td><td class=\"num\">95–110%</td></tr>\n        <tr><td>10-12 – 10-15</td><td>周一–周四</td><td>旺季周日–周四</td><td><span class=\"pill pill-navy\">D3</span></td><td class=\"num\">72–85%</td><td class=\"num\">95–110%</td></tr>\n        <tr><td>10-16</td><td>周五</td><td>旺季周五</td><td><span class=\"pill pill-amber\">D2</span></td><td class=\"num\">88–95%</td><td class=\"num\">120–150%</td></tr>\n        <tr><td>10-17</td><td>周六</td><td>旺季周六</td><td><span class=\"pill pill-amber\">D2</span></td><td class=\"num\">88–95%</td><td class=\"num\">120–150%</td></tr>\n        <tr><td>10-18</td><td>周日</td><td>旺季周日</td><td><span class=\"pill pill-navy\">D3</span></td><td class=\"num\">72–85%</td><td class=\"num\">95–110%</td></tr>\n        <tr><td>10-19 – 10-22</td><td>周一–周四</td><td>旺季周日–周四</td><td><span class=\"pill pill-navy\">D3</span></td><td class=\"num\">72–85%</td><td class=\"num\">95–110%</td></tr>\n        <tr><td>10-23</td><td>周五</td><td>展会周边日（10-24 滨江国际马拉松）</td><td><span class=\"pill pill-amber\">D2</span></td><td class=\"num\">88–95%</td><td class=\"num\">120–150%</td></tr>\n        <tr><td>10-24</td><td>周六</td><td>《SPEC》2.5「国际马拉松」列为 D1</td><td><span class=\"pill pill-red\">D1</span></td><td class=\"num\">≥95%</td><td class=\"num\">150–200%</td></tr>\n        <tr><td>10-25</td><td>周日</td><td>旺季周日</td><td><span class=\"pill pill-navy\">D3</span></td><td class=\"num\">72–85%</td><td class=\"num\">95–110%</td></tr>\n        <tr><td>10-26 – 10-29</td><td>周一–周四</td><td>旺季周日–周四</td><td><span class=\"pill pill-navy\">D3</span></td><td class=\"num\">72–85%</td><td class=\"num\">95–110%</td></tr>\n        <tr><td>10-30</td><td>周五</td><td>旺季周五</td><td><span class=\"pill pill-amber\">D2</span></td><td class=\"num\">88–95%</td><td class=\"num\">120–150%</td></tr>\n        <tr><td>10-31</td><td>周六</td><td>旺季周六</td><td><span class=\"pill pill-amber\">D2</span></td><td class=\"num\">88–95%</td><td class=\"num\">120–150%</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">打标的一个易错点：节后效应</span>\n    <p>国庆 1–5 日是 D1，但 10-06 至 10-08 立刻跌到 <b>D4</b>——落差达三档。这是《SPEC》2.5「节后 3–5 天」的明确规定。很多新人会把节后几天顺手打成 D3，导致节后目标 OCC 虚高到 72–85%，实际只能做到 50% 上下，随之而来的是连续误判\"落后\"、连续误降价。节后 3–5 天必须单独打 D4。</p>\n  </div>\n\n  <\!-- ================= 五 ================= -->\n  <h2 id=\"s5\">五、四档需求等级的价格系数取值判定</h2>\n\n  <p>打完标还不算完——每个等级给的是一个<b>区间</b>（如 D3 是 95–110%），具体取哪个值必须有判据。判据统一用 M05 算出的 <b>Pickup 偏差</b>，与《法典》表 A 的列的划分完全一致，做到\"两个数、两张表，一套口径\"。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-matrix\">\n      <caption>表 6-8　四档需求等级的价格系数取值判定表<span class=\"cap-note\">行＝需求等级，列＝Pickup 偏差（与《法典》表 A 的列划分一致）</span></caption>\n      <thead><tr><th>需求等级 ＼ Pickup 偏差</th><th>落后 &gt;10%</th><th>落后 3–10%</th><th>持平 ±3%</th><th>领先 3–10%</th><th>领先 &gt;10%</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">D1 峰值日（150–200%）</th><td class=\"mid\">150%</td><td class=\"mid\">160%</td><td class=\"mid\">175%</td><td class=\"mid\" data-hit>190%</td><td class=\"mid\">200%</td></tr>\n        <tr><th class=\"rowh\">D2 高涨日（120–150%）</th><td class=\"mid\">120%</td><td class=\"mid\">128%</td><td class=\"mid\">135%</td><td class=\"mid\">142%</td><td class=\"mid\">150%</td></tr>\n        <tr><th class=\"rowh\">D3 平峰日（95–110%）</th><td class=\"mid\">95%</td><td class=\"mid\">98%</td><td class=\"mid\" data-hit>100%</td><td class=\"mid\">105%</td><td class=\"mid\">110%</td></tr>\n        <tr><th class=\"rowh\">D4 低谷日（70–85%）</th><td class=\"mid\">70%</td><td class=\"mid\">75%</td><td class=\"mid\">80%</td><td class=\"mid\">83%</td><td class=\"mid\">85%</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">取值不得超出《SPEC》2.5 的区间</span>\n    <p>上表全部取值都落在《SPEC》2.5 给出的区间内：D1 全部在 150–200% 之间、D2 在 120–150%、D3 在 95–110%、D4 在 70–85%。<b>无论 Pickup 多强，D1 不得超过 200%；无论 Pickup 多弱，D4 不得低于 70%。</b>需要更极端的调整时，走限制条件（MinLOS／Stop Sell）或渠道开关（《法典》表 B／表 H），而不是突破价格系数区间。</p>\n  </div>\n\n  <h3>5.1 全房型价格表怎么出</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">全房型价格表生成公式</span>\n    某房型某日 BAR = 该房型平峰 BAR × 该日需求等级系数 × 该日表 A 调价系数<br>\n    例：2026-10-24（D1，Pickup 领先 &gt;10% → 系数 200%），豪华房 DLX 平峰 BAR ¥820<br>\n    → ¥820 × 200% = <span class=\"f-out\">¥1,640</span>（表 A 无额外调价时）\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-9　云璟酒店全房型价格表（按需求等级 × Pickup 偏差）<span class=\"cap-note\">基准：校验后平峰 BAR 序列（表 6-6）；表 A 调价系数取 1.00</span></caption>\n      <thead>\n        <tr><th>房型</th><th class=\"num\">平峰 BAR</th><th class=\"num\">D4<br>落后&gt;10%<br>70%</th><th class=\"num\">D4<br>持平<br>80%</th><th class=\"num\">D3<br>持平<br>100%</th><th class=\"num\">D3<br>领先&gt;10%<br>110%</th><th class=\"num\">D2<br>持平<br>135%</th><th class=\"num\">D2<br>领先&gt;10%<br>150%</th><th class=\"num\">D1<br>持平<br>175%</th><th class=\"num\">D1<br>领先&gt;10%<br>200%</th></tr>\n      </thead>\n      <tbody>\n        <tr><th class=\"rowh\">标准房 STD</th><td class=\"num\">¥580</td><td class=\"num\">¥406</td><td class=\"num\">¥464</td><td class=\"num\" data-hit>¥580</td><td class=\"num\">¥638</td><td class=\"num\">¥783</td><td class=\"num\">¥870</td><td class=\"num\">¥1,015</td><td class=\"num\">¥1,160</td></tr>\n        <tr><th class=\"rowh\">高级房 SUP</th><td class=\"num\">¥680</td><td class=\"num\">¥476</td><td class=\"num\">¥544</td><td class=\"num\" data-hit>¥680</td><td class=\"num\">¥748</td><td class=\"num\">¥918</td><td class=\"num\">¥1,020</td><td class=\"num\">¥1,190</td><td class=\"num\">¥1,360</td></tr>\n        <tr><th class=\"rowh\">豪华房 DLX</th><td class=\"num\">¥820</td><td class=\"num\">¥574</td><td class=\"num\">¥656</td><td class=\"num\" data-hit>¥820</td><td class=\"num\">¥902</td><td class=\"num\">¥1,107</td><td class=\"num\">¥1,230</td><td class=\"num\">¥1,435</td><td class=\"num\">¥1,640</td></tr>\n        <tr><th class=\"rowh\">豪华江景 DLX-V</th><td class=\"num\">¥960</td><td class=\"num\">¥672</td><td class=\"num\">¥768</td><td class=\"num\" data-hit>¥960</td><td class=\"num\">¥1,056</td><td class=\"num\">¥1,296</td><td class=\"num\">¥1,440</td><td class=\"num\">¥1,680</td><td class=\"num\">¥1,920</td></tr>\n        <tr><th class=\"rowh\">行政房 EXE</th><td class=\"num\">¥1,040</td><td class=\"num\">¥728</td><td class=\"num\">¥832</td><td class=\"num\" data-hit>¥1,040</td><td class=\"num\">¥1,144</td><td class=\"num\">¥1,404</td><td class=\"num\">¥1,560</td><td class=\"num\">¥1,820</td><td class=\"num\">¥1,040×2<br>=¥2,080</td></tr>\n        <tr><th class=\"rowh\">商务套房 STE-B</th><td class=\"num\">¥1,400</td><td class=\"num\">¥980</td><td class=\"num\">¥1,120</td><td class=\"num\" data-hit>¥1,400</td><td class=\"num\">¥1,540</td><td class=\"num\">¥1,890</td><td class=\"num\">¥2,100</td><td class=\"num\">¥2,450</td><td class=\"num\">¥2,800</td></tr>\n        <tr><th class=\"rowh\">行政套房 STE-E</th><td class=\"num\">¥1,880</td><td class=\"num\">¥1,316</td><td class=\"num\">¥1,504</td><td class=\"num\" data-hit>¥1,880</td><td class=\"num\">¥2,068</td><td class=\"num\">¥2,538</td><td class=\"num\">¥2,820</td><td class=\"num\">¥3,290</td><td class=\"num\">¥3,760</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <p style=\"font-size:13px;color:var(--ink-3)\">上表所有数字均为\"平峰 BAR × 系数\"的精确乘积，实际落位时按本店挂牌习惯取整到 ¥10。取整后须回算：若取整导致相邻房型价差跌破 8% 或超过 35%，以价差规则优先，反推调整取整值。</p>\n\n  <\!-- ================= 六 ================= -->\n  <h2 id=\"s6\">六、六类衍生价格：公式与定价</h2>\n\n  <p>BAR 定完之后，六类衍生价格全部从 BAR 派生。每一类都有固定的折扣公式、固定的启用条件、固定的关闭条件。</p>\n\n  <h3>6.1 会员价</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">定价公式</span>\n    会员专享价 = BAR × 90%（取整到 ¥2）<br>\n    让利下限 = BAR × 88%（<span class=\"f-out\">低于此值，会员渠道净收益低于 OTA 渠道，禁止</span>）\n  </div>\n\n  <p><b>88% 下限的来源</b>：会员渠道（LOY）综合成本率 4%，OTA 国内综合成本率 16%。令两者净收益相等：<br>\n  BAR × 88% ×（1 − 4%）= 88% × 96% = 84.48%<br>\n  BAR × 100% ×（1 − 16%）= 84.00%<br>\n  两者基本持平。即：<b>会员价打到 88% 时，其净收益与\"按 BAR 全价通过 OTA 卖出\"相同。</b>再低就不如让 OTA 卖了。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-10　会员价算例（平峰日，SUP BAR ¥680）</caption>\n      <thead><tr><th>项目</th><th class=\"num\">价格</th><th class=\"num\">渠道成本率</th><th class=\"num\">净收入</th><th>对比</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">BAR 通过 OTA 卖出</th><td class=\"num\">¥680</td><td class=\"num\">16%</td><td class=\"num\">¥571.2</td><td>基准</td></tr>\n        <tr><th class=\"rowh\">会员价（BAR×90%）</th><td class=\"num\">¥612</td><td class=\"num\">4%</td><td class=\"num\">¥587.5</td><td><span class=\"up\">↑¥16.3</span></td></tr>\n        <tr><th class=\"rowh\">会员价下限（BAR×88%）</th><td class=\"num\">¥598</td><td class=\"num\">4%</td><td class=\"num\">¥574.1</td><td><span class=\"up\">↑¥2.9</span></td></tr>\n        <tr><th class=\"rowh\">历史 LOY 平均 ADR</th><td class=\"num\">¥580</td><td class=\"num\">4%</td><td class=\"num\">¥556.8</td><td><span class=\"down\">↓¥14.4</span> <span class=\"pill pill-red\">低于下限</span></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">必须整改的历史问题</span>\n    <p>《SPEC》2.3 客源结构表显示会员（LOY）平均 ADR 仅 <b>¥580</b>，相当于平峰 BAR ¥680 的 <b>85.3%</b>，<b>低于 88% 的让利下限</b>。说明本店过去的会员价让利过度。整改动作：本季度内将会员价统一上调至 BAR × 90%（平峰日 ¥612），<span class=\"up\">↑5.5%</span>；若会员占比因此下滑，用非价格权益（延迟退房、积分加倍）补偿，不得回到降价。</p>\n  </div>\n\n  <h3>6.2 协议价</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">定价公式（按协议客户分级）</span>\n    A 类（年度房晚 ≥500）　协议价 = BAR × 75%<br>\n    B 类（年度房晚 200–499）协议价 = BAR × 80%<br>\n    C 类（年度房晚 &lt;200）　协议价 = BAR × 85%<br>\n    <span class=\"f-out\">协议价全年固定折扣率，不随需求等级变动；但 D1 峰值日不执行协议价</span>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-11　协议价算例（平峰日，SUP BAR ¥680）</caption>\n      <thead><tr><th>客户分级</th><th class=\"num\">折扣率</th><th class=\"num\">平峰协议价</th><th class=\"num\">渠道成本率</th><th class=\"num\">净收入</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">A 类</th><td class=\"num\">75%</td><td class=\"num\">¥510</td><td class=\"num\">8%</td><td class=\"num\">¥469.2</td></tr>\n        <tr><th class=\"rowh\">B 类</th><td class=\"num\">80%</td><td class=\"num\">¥544</td><td class=\"num\">8%</td><td class=\"num\">¥500.5</td></tr>\n        <tr><th class=\"rowh\">C 类</th><td class=\"num\">85%</td><td class=\"num\">¥578</td><td class=\"num\">8%</td><td class=\"num\">¥531.8</td></tr>\n        <tr><th class=\"rowh\">历史 CORP 平均 ADR</th><td class=\"num\">76.5%</td><td class=\"num\">¥520</td><td class=\"num\">8%</td><td class=\"num\">¥478.4</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <p>历史 CORP 平均 ADR ¥520 ≈ BAR × 76.5%，落在 A 类与 B 类之间，说明本店协议客户以 A/B 类为主，结构合理。C 类（85%）是获新客的价格，不得给存量客户。</p>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">D1 峰值日的协议价例外</span>\n    <p>D1 峰值日（国庆 1–5、五一 1–3、春节初三–初六、大型展会赛事日）<b>一律不执行协议价</b>，协议客户当日按 BAR 全额预订。依据：《法典》表 H 在预测 OCC ≥95% 档关闭批发商／包房渠道；协议价虽不在表 H 直接管辖，但按同一逻辑，D1 日的可售房晚应全部留给散客与高价值客源。此例外条款必须写进协议合同正文，避免客诉。</p>\n  </div>\n\n  <h3>6.3 早鸟价</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">定价公式（按提前天数分档，不可取消）</span>\n    提前 ≥30 天预订　早鸟价 = BAR × <span class=\"f-out\">90%</span><br>\n    提前 21–29 天预订　早鸟价 = BAR × 92%<br>\n    提前 14–20 天预订　早鸟价 = BAR × 95%<br>\n    提前 &lt;14 天　<span class=\"f-out\">不适用</span>（走 BAR）\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-12　早鸟价净收益校验（平峰日，SUP BAR ¥680，直销渠道成本率 3%）</caption>\n      <thead><tr><th>提前天数</th><th class=\"num\">折扣率</th><th class=\"num\">早鸟价</th><th class=\"num\">净收入</th><th class=\"num\">对比 OTA 卖 BAR（¥571.2）</th><th>判定</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">≥30 天</th><td class=\"num\">90%</td><td class=\"num\">¥612</td><td class=\"num\">¥593.6</td><td class=\"num\"><span class=\"up\">↑¥22.4</span></td><td><span class=\"pill pill-teal\">可执行</span></td></tr>\n        <tr><th class=\"rowh\">21–29 天</th><td class=\"num\">92%</td><td class=\"num\">¥626</td><td class=\"num\">¥607.2</td><td class=\"num\"><span class=\"up\">↑¥36.0</span></td><td><span class=\"pill pill-teal\">可执行</span></td></tr>\n        <tr><th class=\"rowh\">14–20 天</th><td class=\"num\">95%</td><td class=\"num\">¥646</td><td class=\"num\">¥626.6</td><td class=\"num\"><span class=\"up\">↑¥55.4</span></td><td><span class=\"pill pill-teal\">可执行</span></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <p>三档早鸟价的净收入全部高于\"按 BAR 通过 OTA 卖出\"的 ¥571.2，因此全部可执行。校验方法固定：早鸟价 × 0.97 ≥ BAR × 0.84。</p>\n\n  <h3>6.4 最后一刻价</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">定价公式与启用条件</span>\n    启用条件（三条同时满足）：① 目标日在 0–3 天窗口；② 预测 OCC &lt;70%；③ 取数时点为当日 18:00 之后<br>\n    最后一刻价 = BAR × <span class=\"f-out\">80%</span><br>\n    销售渠道：仅限直销（官网／小程序／前台）+ OTA 尾房产品；<span class=\"f-out\">不得在协议价、批发商价基础上再折</span><br>\n    关闭条件：预测 OCC 回升至 ≥70%，或当日 23:00 到点自动关闭\n  </div>\n\n  <p>依据：《法典》表 I 0–3 天档，落后触发阈值 OCC&lt;70%，触发动作为「上『今日特惠』尾房产品」。</p>\n\n  <h3>6.5 套餐价</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">定价公式</span>\n    套餐价 = 房型 BAR +（附加项标准价 × 50%）× 份数<br>\n    双人含早套餐（平峰 SUP）= ¥680 + ¥68 × 2 × 50% = ¥680 + ¥68 → <span class=\"f-out\">¥748</span><br>\n    单早 + 加床套餐（平峰 SUP）= ¥680 +（¥68 × 1 + ¥180）× 50% = ¥680 + ¥124 → <span class=\"f-out\">¥804</span>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">为什么附加项打五折</span>\n    <p>含早附加 ¥68/人已经是门市价 ¥128/人的 53 折。套餐再打五折，早餐实际只收 ¥34/人（门市价的 26.6%）。<b>这不是亏损，是用餐饮边际收益换客房竞争力</b>：自助早餐的边际成本远低于 ¥128，且套餐客人会产生其他餐饮消费（《SPEC》2.3 餐饮收入 ¥28,600,000 已含此类联动）。红线：套餐价中附加项的折让部分，须由餐饮部在《月度收益复盘报告》中确认毛利率不低于 55%（《法典》表 K 红线口径）。</p>\n  </div>\n\n  <h3>6.6 长住价</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">定价公式（按连住天数分档）</span>\n    连住 7–13 天　长住价 = BAR × <span class=\"f-out\">70%</span><br>\n    连住 14–29 天　长住价 = BAR × 62%<br>\n    连住 ≥30 天　长住价 = BAR × 55%<br>\n    附加规则：长住客不参与免费升级（表 J）；不加收早餐（长住含早按 ¥68/人 × 实际天数计价）\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-13　长住价算例（平峰日，SUP BAR ¥680）</caption>\n      <thead><tr><th>连住天数</th><th class=\"num\">折扣率</th><th class=\"num\">长住价</th><th>适用房型</th><th>审批权限</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">7–13 天</th><td class=\"num\">70%</td><td class=\"num\">¥476</td><td>STD / SUP / DLX</td><td>L2 收益管理主管</td></tr>\n        <tr><th class=\"rowh\">14–29 天</th><td class=\"num\">62%</td><td class=\"num\">¥422</td><td>STD / SUP / DLX</td><td>L2 批 + L3 事后 24h 复核</td></tr>\n        <tr><th class=\"rowh\">≥30 天</th><td class=\"num\">55%</td><td class=\"num\">¥374</td><td>STD / SUP</td><td>L3 收益管理经理</td></tr>\n        <tr><th class=\"rowh\">历史 LNG 平均 ADR</th><td class=\"num\">55.9%</td><td class=\"num\">¥380</td><td>—</td><td>—</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <p>历史长住客（LNG）平均 ADR ¥380 ≈ BAR × 55.9%，与\"≥30 天档 ¥374\"最接近，说明本店长住客以月租为主，结构符合预期。</p>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">长住客的房型限制</span>\n    <p>长住价只适用于 STD 与 SUP（共 220 间，占 68.75%），14–29 天档可上探到 DLX（45 间）。<b>EXE（30 间）、DLX-V（15 间）、STE-B（8 间）、STE-E（2 间）一律不放长住价</b>——这 55 间是散客高端需求的主要承接池，放出长住价会在旺季形成置换损失。需要长住套房时，走 L3 特批并做置换分析（《法典》表 G）。</p>\n  </div>\n\n  <h3>6.7 六类衍生价格速查表</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-14　六类衍生价格速查（以平峰日 SUP BAR ¥680 为例）</caption>\n      <thead><tr><th>价格类型</th><th class=\"num\">折扣率</th><th class=\"num\">价格</th><th>启用条件</th><th>渠道</th><th>审批权限</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">会员价</th><td class=\"num\">90%（下限 88%）</td><td class=\"num\">¥612</td><td>会员登录可见</td><td>直销 / 会员</td><td>L1</td></tr>\n        <tr><th class=\"rowh\">协议价 C 类</th><td class=\"num\">85%</td><td class=\"num\">¥578</td><td>年度房晚 &lt;200</td><td>协议</td><td>L2</td></tr>\n        <tr><th class=\"rowh\">协议价 B 类</th><td class=\"num\">80%</td><td class=\"num\">¥544</td><td>年度房晚 200–499</td><td>协议</td><td>L2</td></tr>\n        <tr><th class=\"rowh\">协议价 A 类</th><td class=\"num\">75%</td><td class=\"num\">¥510</td><td>年度房晚 ≥500</td><td>协议</td><td>L2 批 + L3 事后 24h 复核</td></tr>\n        <tr><th class=\"rowh\">早鸟价</th><td class=\"num\">90% / 92% / 95%</td><td class=\"num\">¥612 / 626 / 646</td><td>提前 ≥30 / 21–29 / 14–20 天，不可取消</td><td>直销</td><td>L2</td></tr>\n        <tr><th class=\"rowh\">最后一刻价</th><td class=\"num\">80%</td><td class=\"num\">¥544</td><td>0–3 天窗口 + OCC&lt;70% + 18:00 后</td><td>直销 + OTA 尾房</td><td>L1（须事前在价格日历预置）</td></tr>\n        <tr><th class=\"rowh\">双人含早套餐</th><td class=\"num\">BAR + ¥68</td><td class=\"num\">¥748</td><td>全年</td><td>直销 / OTA</td><td>L1</td></tr>\n        <tr><th class=\"rowh\">长住价 7–13 天</th><td class=\"num\">70%</td><td class=\"num\">¥476</td><td>连住 7–13 天</td><td>直销 / 协议</td><td>L2</td></tr>\n        <tr><th class=\"rowh\">长住价 14–29 天</th><td class=\"num\">62%</td><td class=\"num\">¥422</td><td>连住 14–29 天</td><td>直销</td><td>L2 批 + L3 事后 24h 复核</td></tr>\n        <tr><th class=\"rowh\">长住价 ≥30 天</th><td class=\"num\">55%</td><td class=\"num\">¥374</td><td>连住 ≥30 天</td><td>直销</td><td>L3</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <\!-- ================= 七 ================= -->\n  <h2 id=\"s7\">七、审批权限矩阵：谁有权批几折</h2>\n\n  <p>三级认证的能力终点（《SPEC》五）决定了权限边界：L1 收益执行专员「独立完成每日取数、查表、执行、记录全流程（需 L2 复核）」；L2 收益管理主管「独立完成预测、定价决策、周度策略、渠道管理」；L3 收益管理经理「预算、年度策略、跨部门领导、业主汇报、团队管理」。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-15　价格审批权限矩阵<span class=\"cap-note\">折扣率 = 成交价 ÷ 该房型该日 BAR × 100%</span></caption>\n      <thead><tr><th>折扣率区间</th><th>覆盖的价格类型</th><th>审批权限</th><th>复核要求</th><th>留痕要求</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">95% – 100%</th><td>会员价、早鸟价 14–20 天档、双人含早套餐、最后一刻价（预置）</td><td><b>L1</b> 收益执行专员</td><td>L2 每周抽查 ≥3 笔</td><td>《调价台账》</td></tr>\n        <tr><th class=\"rowh\">85% – 95%</th><td>协议价 C 类 / B 类、早鸟价 21–29 天与 ≥30 天档、长住价 7–13 天</td><td><b>L2</b> 收益管理主管</td><td>L3 每月抽查 ≥5 笔</td><td>《调价台账》+ 合同编号</td></tr>\n        <tr><th class=\"rowh\">70% – 85%</th><td>协议价 A 类、长住价 14–29 天、团队价（R 在 65%–85% 区间且表 G 判\"接受\"）</td><td><b>L2</b> 批 + <b>L3</b> 事后 24h 内复核</td><td>L3 逐笔复核</td><td>《调价台账》+ 置换分析表</td></tr>\n        <tr><th class=\"rowh\">55% – 70%</th><td>长住价 ≥30 天、团队价（R 在 55%–65% 区间且表 G 判\"上报 L3\"）</td><td><b>L3</b> 收益管理经理</td><td>业主方月度备案</td><td>《团队决策档案》</td></tr>\n        <tr><th class=\"rowh\">&lt;55%</th><td>批发商净价、包房价、会议团队（走《法典》表 K 综合贡献条款）</td><td><b>L3</b> 批 + <b>业主</b>备案</td><td>逐笔</td><td>《团队决策档案》+ 综合贡献测算表</td></tr>\n        <tr><th class=\"rowh\"><span class=\"pill pill-red\">任何折扣</span></th><td>凡触及 <b>D1 峰值日</b>的价格与折扣</td><td><b>一律 L3</b> 收益经理审批</td><td>调价当日</td><td>《调价台账》+ L3 签字</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">三条不可越权的红线</span>\n    <ol style=\"margin:6px 0 0\">\n      <li><b>D1 峰值日无例外</b>：《法典》表 A 执行约束 4 规定「触及 D1 峰值日的调价，必须由 L3 收益经理审批」。无论折扣高低、无论谁经手，只要目标日打了 D1 标签，审批权就归 L3，L1 / L2 只能提出建议。</li>\n      <li><b>不得拆分规避</b>：把一个 70% 的折扣拆成\"85% 房价 + 赠券 15%\"来规避 L3 复核，属违规。判定方法：把所有形式的让利（房价、赠券、返现、免房费、免早餐费）折算成房价百分比后合并计算，合并值落在哪一档就走哪一档权限。</li>\n      <li><b>口头批准无效</b>：任何折扣必须以《调价台账》或《团队决策档案》中的书面记录为准。无书面记录的折扣成交，前台不予办理，责任由提出人承担。</li>\n    </ol>\n  </div>\n\n  <h3>7.1 审批流程的四个卡点</h3>\n\n  <div class=\"flow\">\n    <div class=\"flow-item\"><div class=\"fi-t\">① 算折扣率</div><div class=\"fi-d\">成交价 ÷ 该房型该日 BAR × 100%，落在表 6-15 哪一档</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">② 查 D1 标签</div><div class=\"fi-d\">目标日是否打 D1？是 → 一律 L3，不看折扣率</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">③ 送审留痕</div><div class=\"fi-d\">按权限送审，写入《调价台账》或《团队决策档案》</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">④ 落位核查</div><div class=\"fi-d\">落位后 30 分钟内核查 6 个渠道挂牌价同步</div></div>\n  </div>\n\n  <\!-- ================= 八 ================= -->\n  <h2 id=\"s8\">八、讲师示范：一整天的价格体系落地</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>示范：2026-10-16（周五，D2 高涨日）全房型价格表生成</div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">场景设定</div><div class=\"kv-v\">目标日 2026-10-16（周五），《SPEC》2.5「旺季（9–10 月）周五」→ <b>D2 高涨日</b>。M05 预测得：预测 OCC 91.0%，Pickup 偏差 +6.0%（领先 3–10%）。无突发事件。基准使用表 6-6 校验后平峰 BAR 序列。</div></div>\n    </div>\n\n    <h4>① 看数</h4>\n    <div class=\"formula\">预测 OCC = 91.0%；Pickup 偏差 = +6.0%；需求等级 = D2；可用房晚 = 320</div>\n\n    <h4>② 查表定价</h4>\n    <p><b>定需求等级系数</b>：D2 行 × 领先 3–10% 列 → 查表 6-8 得 <b>142%</b>。<br>\n    <b>查《法典》表 A</b>：预测 OCC 91.0% → 85–95% 行；Pickup 偏差 +6.0% → 领先 3–10% 列 → 结论 <b>+10%</b>。</p>\n\n    <div class=\"callout callout-warn\">\n      <span class=\"co-t\">这里最容易犯的错：把两个系数相乘</span>\n      <p>需求等级系数（142%）与表 A 调价系数（+10%）<b>不是并列的两个乘法因子</b>。需求等级系数是\"这个日子相对平峰的基准倍率\"，表 A 是\"在基准之上再调一次价\"。正确算法是：先按等级系数定出基准 BAR，再把表 A 的 +10% 作用在<b>前一次落位价</b>上，而不是作用在平峰 BAR 上。即：</p>\n      <div class=\"formula\" style=\"margin:10px 0 0\">\n        基准 BAR = 平峰 BAR × 142%<br>\n        执行 BAR = 基准 BAR ×（1 + 10%）　<span class=\"f-out\">（表 A 作用在基准 BAR 上）</span>\n      </div>\n    </div>\n\n    <p><b>生成全房型价格表</b>：</p>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <thead><tr><th>房型</th><th class=\"num\">平峰 BAR</th><th class=\"num\">×142%<br>基准 BAR</th><th class=\"num\">+10%<br>执行 BAR</th><th class=\"num\">取整</th><th class=\"num\">实际总系数</th></tr></thead>\n        <tbody>\n          <tr><th class=\"rowh\">标准房 STD</th><td class=\"num\">¥580</td><td class=\"num\">¥823.6</td><td class=\"num\">¥906.0</td><td class=\"num\"><b>¥910</b></td><td class=\"num\">156.9%</td></tr>\n          <tr><th class=\"rowh\">高级房 SUP</th><td class=\"num\">¥680</td><td class=\"num\">¥965.6</td><td class=\"num\">¥1,062.2</td><td class=\"num\"><b>¥1,060</b></td><td class=\"num\">155.9%</td></tr>\n          <tr><th class=\"rowh\">豪华房 DLX</th><td class=\"num\">¥820</td><td class=\"num\">¥1,164.4</td><td class=\"num\">¥1,280.8</td><td class=\"num\"><b>¥1,280</b></td><td class=\"num\">156.1%</td></tr>\n          <tr><th class=\"rowh\">豪华江景 DLX-V</th><td class=\"num\">¥960</td><td class=\"num\">¥1,363.2</td><td class=\"num\">¥1,499.5</td><td class=\"num\"><b>¥1,500</b></td><td class=\"num\">156.3%</td></tr>\n          <tr><th class=\"rowh\">行政房 EXE</th><td class=\"num\">¥1,040</td><td class=\"num\">¥1,476.8</td><td class=\"num\">¥1,624.5</td><td class=\"num\"><b>¥1,620</b></td><td class=\"num\">155.8%</td></tr>\n          <tr><th class=\"rowh\">商务套房 STE-B</th><td class=\"num\">¥1,400</td><td class=\"num\">¥1,988.0</td><td class=\"num\">¥2,186.8</td><td class=\"num\"><b>¥2,190</b></td><td class=\"num\">156.4%</td></tr>\n          <tr><th class=\"rowh\">行政套房 STE-E</th><td class=\"num\">¥1,880</td><td class=\"num\">¥2,669.6</td><td class=\"num\">¥2,936.6</td><td class=\"num\"><b>¥2,940</b></td><td class=\"num\">156.4%</td></tr>\n        </tbody>\n      </table>\n    </div>\n\n    <h4>③ 上限校验（必做）</h4>\n    <div class=\"formula\">\n      D2 高涨日价格系数上限 = 150%（《SPEC》2.5）<br>\n      STD 实际总系数 156.9% <span class=\"f-out up\">&gt; 150% → 超限，须回调</span>\n    </div>\n    <div class=\"callout callout-danger\">\n      <span class=\"co-t\">超限处理规则</span>\n      <p>表 A 的调价结果<b>不得把总系数推出该需求等级的区间上限</b>。超限时的处理顺序固定为三步：</p>\n      <ol style=\"margin:6px 0 0\">\n        <li><b>先回调到上限</b>：把 STD 回调至 ¥580 × 150% = <b>¥870</b>（其余房型同法：SUP ¥1,020、DLX ¥1,230、DLX-V ¥1,440、EXE ¥1,560、STE-B ¥2,100、STE-E ¥2,820）。</li>\n        <li><b>记录差额</b>：在《调价台账》备注栏写明「表 A +10% 因触及 D2 上限 150%，实际执行 +5.6%（142% → 150%），未执行部分 ¥40（STD）记入《观察清单》」。</li>\n        <li><b>改用非价格手段承接剩余需求</b>：预测 OCC 91.0% 落 90–95% 档，查《法典》表 B 得「MinLOS 2 晚 / 关闭尾房特惠 / 超售 ≤2 间」，查《法典》表 H 得「OTA 国内开 2 家 / OTA 国际关 / GDS 开 / 批发商关 / 直销全开」。这些动作不受价格系数上限约束。</li>\n      </ol>\n    </div>\n\n    <h4>④ 附加项落位</h4>\n    <div class=\"formula\">\n      例：豪华江景房（高楼层）+ 双人含早，2026-10-16<br>\n      = ¥1,440 ×（1 + 5%）+ ¥68 × 2 = ¥1,512 + ¥136 → <span class=\"f-out\">¥1,648</span>\n    </div>\n\n    <h4>⑤ 记录</h4>\n    <p>写入《调价台账》：目标日 2026-10-16 / 需求等级 D2 / 预测 OCC 91.0% / Pickup 偏差 +6.0% / 等级系数 142% / 表 A 结论 +10% / 实际执行系数 150%（触顶）/ 原 BAR 序列 → 新 BAR 序列 / 依据《法典》表 A + 《SPEC》2.5 / 备注「触顶回调，未执行部分记入《观察清单》；同日执行表 B 90–95% 档与表 H 90–95% 档」。</p>\n\n    <h4>⑥ 审批判定</h4>\n    <p>该日为 D2 而非 D1，按《法典》表 A 约束 4 <b>无需</b> L3 事前审批，但因触及 D2 区间上限，按本模块表 6-15 的复核要求，由 <b>L3 事后 24 小时内复核签字</b>。</p>\n  </div>\n\n  <\!-- ================= 九 ================= -->\n  <h2 id=\"s9\">九、学员跟练（5 题）</h2>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 1 题　全房型价格表（D3 平峰日 · 领先）</div>\n    <div class=\"q-b\">目标日 2026-10-20（周二），D3 平峰日。M05 预测得：预测 OCC 78.1%，Pickup 偏差 +23.1%（领先 &gt;10%）。基准使用表 6-6 校验后平峰 BAR 序列。请给出该日全部 7 个房型的执行 BAR（取整到 ¥10），并说明表 A 的 +8% 作用在哪里。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>STD ¥630 / SUP ¥730 / DLX ¥880 / DLX-V ¥1,040 / EXE ¥1,120 / STE-B ¥1,510 / STE-E ¥2,030</b>（取整前分别为 625.7、734.4、885.6、1036.8、1123.2、1512、2030.4）。<br>解析：D3 行 × 领先&gt;10% 列 → 查表 6-8 得等级系数 <b>110%</b>。表 A：预测 OCC 78.1% → 70–85% 行；Pickup 偏差 +23.1% → 领先&gt;10% 列 → <b>+8%</b>。表 A 作用在前一次落位价（= 平峰 BAR × 110%）上，不是作用在平峰 BAR 上：<br>STD：580 × 1.10 = 638 → × 1.08 = 689.0 → <b>¥690</b>？<br><b>更正</b>：正确顺序是先定基准 BAR（平峰 BAR × 110%），再把表 A 的 +8% 作用在基准 BAR 上。<br>STD：638 × 1.08 = 689.0 → <b>¥690</b>；SUP：748 × 1.08 = 807.8 → <b>¥810</b>；DLX：902 × 1.08 = 974.2 → <b>¥970</b>；DLX-V：1056 × 1.08 = 1140.5 → <b>¥1,140</b>；EXE：1144 × 1.08 = 1235.5 → <b>¥1,240</b>；STE-B：1540 × 1.08 = 1663.2 → <b>¥1,660</b>；STE-E：2068 × 1.08 = 2233.4 → <b>¥2,230</b>。<br><b>上限校验</b>：D3 区间 95–110%，实际总系数 = 110% × 108% = <b>118.8% &gt; 110%，超限</b>。须回调至平峰 BAR × 110%：STD ¥640（取整 ¥640）／SUP ¥750／DLX ¥900／DLX-V ¥1,060／EXE ¥1,140／STE-B ¥1,540／STE-E ¥2,070。<br><b>结论</b>：本日表 A 的 +8% <b>不得执行</b>，因需求等级系数已取到 D3 区间上限 110%。未执行部分记入《观察清单》，改用非价格手段（表 H 70–85% 档：批发商限价开 ≤BAR×75%、直销上早鸟）承接超额需求。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 2 题　全房型价格表（D4 低谷日 · 落后）</div>\n    <div class=\"q-b\">目标日 2027-01-15（周五），D4 低谷日（1 月淡季）。预测 OCC 59.3%，Pickup 偏差 −7.9%（落后 3–10%）。基准使用表 6-6 校验后平峰 BAR 序列。请给出全部 7 个房型的执行 BAR（取整到 ¥10）。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>STD ¥400 / SUP ¥470 / DLX ¥570 / DLX-V ¥660 / EXE ¥720 / STE-B ¥970 / STE-E ¥1,300</b>。<br>解析：D4 行 × 落后 3–10% 列 → 查表 6-8 得等级系数 <b>75%</b>。表 A：预测 OCC 59.3% → 55–70% 行；Pickup 偏差 −7.9% → 落后 3–10% 列 → <b>−5%</b>。<br>基准 BAR：STD 580×0.75 = 435；SUP 510；DLX 615；DLX-V 720；EXE 780；STE-B 1,050；STE-E 1,410。<br>执行 BAR（×0.95）：STD 413.3 → <b>¥410</b>；SUP 484.5 → <b>¥480</b>；DLX 584.3 → <b>¥580</b>；DLX-V 684 → <b>¥680</b>；EXE 741 → <b>¥740</b>；STE-B 997.5 → <b>¥1,000</b>；STE-E 1339.5 → <b>¥1,340</b>。<br><b>上限／下限校验</b>：实际总系数 = 75% × 95% = <b>71.25%</b>，在 D4 区间 70–85% 内 → <span class=\"pill pill-teal\">未触底，可执行</span>。<br><b>取整复校</b>：取整后相邻房型价差分别为 SUP/STD = 17.1%、DLX/SUP = 20.8%、DLX-V/DLX = 17.2%、EXE/DLX-V = 8.8%、STE-B/EXE = 35.1%（略超 35%）→ STE-B 取整须下调至 <b>¥990</b>（（990−740）÷740 = 33.8% ✓）。最终 STE-B = <b>¥990</b>。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 3 题　每周一价差校验</div>\n    <div class=\"q-b\">某日平峰序列为：STD ¥580 / SUP ¥680 / DLX ¥820 / DLX-V ¥900 / EXE ¥920 / STE-B ¥1,280 / STE-E ¥1,880。近 7 日平均 OCC：DLX-V 82%、EXE 74%。请跑完一轮《法典》表 F 价差校验，给出每项判定与调整后价格。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>EXE 不动，改降 DLX-V 至 ¥850；STE-B 提至 ¥1,400；最终序列 ¥580 / ¥680 / ¥820 / ¥850 / ¥920 / ¥1,400 / ¥1,880</b>。<br>解析：<br>① STD→SUP：（680−580）÷580 = <b>17.2%</b> ✓ 合格。<br>② SUP→DLX：（820−680）÷680 = <b>20.6%</b> ✓ 合格。<br>③ DLX→DLX-V：（900−820）÷820 = <b>9.8%</b> ✓ 合格（≥8%）。<br>④ DLX-V→EXE：（920−900）÷900 = <b>2.2% &lt; 8%</b> ✗ <b>拉开价差</b>。二选一判据：EXE 近 7 日 OCC 74% ≤ DLX-V 82% → <b>降下一档（DLX-V）</b>。DLX-V 新价 = 920 ÷ 1.08 = 851.9 → 取整到 ¥10 且必须 ≤851.9 → <b>¥850</b>。复校：（920−850）÷850 = 8.2% ✓。<br>⑤ EXE→STE-B：（1280−920）÷920 = <b>39.1% &gt; 35%</b> ✗ <b>收敛价差（提下一档 STE-B）</b>。STE-B 新价 ≥ 1,880 ÷ 1.35 = 1,392.6 → <b>¥1,400</b>。复校：（1,880−1,400）÷1,400 = 34.3% ✓。<br>⑥ STE-B→STE-E：34.3% ✓ 合格。<br>⑦ 套房 vs 最高非套房房型（EXE ¥920）：（1,880−920）÷920 = <b>104.3% ≥ 60%</b> ✓ 免动作。<br><b>回校第 ③ 项</b>：DLX-V 降为 ¥850 后，DLX→DLX-V =（850−820）÷820 = 3.7% &lt; 8% ✗ <b>新产生不合格</b>。处理：降 DLX 至 850 ÷ 1.08 = 787.0 → <b>¥780</b>。再校：SUP→DLX =（780−680）÷680 = 14.7% ✓；DLX→DLX-V =（850−780）÷780 = 9.0% ✓。<br><b>最终序列</b>：¥580 / ¥680 / ¥780 / ¥850 / ¥920 / ¥1,400 / ¥1,880。<br><b>教学要点</b>：价差校验必须<b>迭代到全表合格为止</b>，一次调整可能触发上游或下游的新不合格。校验顺序固定为「从上到下逐档走一遍 → 若本轮有调整，再从下到上复走一遍 → 直到全表无不合格项」。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 4 题　衍生价格与净收益校验</div>\n    <div class=\"q-b\">目标日 D3 平峰日，高级房 SUP BAR ¥680。请算出：① 会员价（BAR×90%）；② 早鸟价（提前 25 天）；③ 最后一刻价（假设当日在 0–3 天窗口且 OCC 65%、已过 18:00）；④ 双人含早套餐价；⑤ 长住价（连住 20 天）。并判断哪些价格低于\"OTA 按 BAR 全价卖出\"的净收益（OTA 成本率 16%，直销 3%，会员 4%）。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>① ¥612　② ¥626　③ ¥544（适用 STD/SUP/DLX，SUP 为 ¥544）　④ ¥748　⑤ ¥422；其中 ③ 与 ⑤ 低于 OTA 基准净收益</b>。<br>解析：OTA 按 BAR 全价卖出的净收益 = 680 × 0.84 = <b>¥571.2</b>。<br>① 会员价 680 × 0.90 = ¥612；净收益 = 612 × 0.96 = <b>¥587.5</b> &gt; 571.2 → <span class=\"up\">↑¥16.3</span>，可执行。<br>② 早鸟价（21–29 天档 92%）680 × 0.92 = ¥625.6 → 取整 <b>¥626</b>；净收益 = 626 × 0.97 = <b>¥607.2</b> &gt; 571.2 → <span class=\"up\">↑¥36.0</span>，可执行。<br>③ 最后一刻价 680 × 0.80 = <b>¥544</b>；净收益 = 544 × 0.97 = <b>¥527.7</b> &lt; 571.2 → <span class=\"down\">↓¥43.5</span>，<b>净收益低于 OTA 基准</b>。<b>但这不意味着不该卖</b>：最后一刻价的启用条件是「0–3 天窗口 + OCC&lt;70% + 18:00 后」，此时房间若不出售，收入为 ¥0。判据是比较\"卖 ¥544 的净收益 ¥527.7\"与\"不卖的 ¥0\"，而不是与 OTA 基准比。<br>④ 双人含早套餐 = 680 + 68 × 2 × 50% = 680 + 68 = <b>¥748</b>；净收益 = 748 × 0.97 = <b>¥725.6</b> &gt; 571.2 → <span class=\"up\">↑¥154.4</span>，可执行。<br>⑤ 长住价（14–29 天档 62%）680 × 0.62 = ¥421.6 → 取整 <b>¥422</b>；净收益 = 422 × 0.97 = <b>¥409.3</b> &lt; 571.2 → <span class=\"down\">↓¥161.9</span>。<b>长住价的合理性不靠单晚净收益</b>：连住 20 天一次性锁定 20 个房晚，节省 20 次销售成本、20 次清洁布草周转成本，且长住客（LNG）占比仅 2%（《SPEC》2.3），不挤占散客库存。判定长住价是否可接，走《法典》表 G 的置换分析，而非单晚净收益对比。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 5 题　审批权限判定</div>\n    <div class=\"q-b\">以下五笔折扣，分别应由谁审批？① D3 日会员价 BAR×90%；② D3 日协议价 B 类（BAR×80%）；③ D3 日长住 20 天（BAR×62%）；④ <b>D1 国庆日</b>会员价 BAR×90%；⑤ 销售部提出给某客户\"BAR×88% 房价 + 免双人早餐（价值 ¥136）\"。请逐项判定并说明理由。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>① L1；② L2；③ L2 批 + L3 事后 24h 复核；④ L3（D1 无例外）；⑤ 合并后 68%，L2 批 + L3 事后 24h 复核</b>。<br>解析：<br>① 90% 落 85–95%？不，90% 落 <b>85–95% 档</b>… 需按表 6-15 的区间边界判定：表 6-15 第一档为「95%–100%」，第二档为「85%–95%」。90% 落在第二档 → 应为 <b>L2</b>。<b>更正</b>：表 6-14 速查表中会员价列为 L1，但表 6-15 权限矩阵按折扣率分档，90% 属 85–95% 档 → <b>L2 收益管理主管</b>。两表冲突时以<b>权限矩阵（表 6-15）</b>为准，速查表的权限列仅作提示。<br>② 80% 落 70–85% 档 → <b>L2 批 + L3 事后 24h 内复核</b>。<b>更正</b>：表 6-14 中协议价 B 类列 L2，表 6-15 中 80% 落「70–85%」档 → <b>L2 批 + L3 事后 24h 复核</b>。以表 6-15 为准。<br>③ 62% 落 55–70% 档 → <b>L3 收益管理经理</b>（业主方月度备案）。<br>④ 会员价 90% 本应 L2，但该日打 <b>D1 标签</b> → 按表 6-15 最后一行「触及 D1 峰值日的价格与折扣，一律 L3 审批」，<b>权限上收至 L3</b>，不看折扣率。<br>⑤ 免双人早餐价值 ¥136，折算成房价百分比 = 136 ÷ 680 = 20%。合并折扣率 = 100% − 88% + 20% = <b>32% 的让利</b>，即成交净折扣率 = （680 × 0.88 − 136）÷ 680 = <b>68%</b> → 落 55–70% 档 → <b>L3 收益管理经理</b>。理由：按\"不得拆分规避\"红线，所有形式的让利（房价、赠券、返现、免房费、免早餐费）必须折算成房价百分比后合并计算。</div>\n    </details>\n  </div>\n\n  <\!-- ================= 十 ================= -->\n  <h2 id=\"s10\">十、判定表默写清单</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">✎</span>当堂默写（限时 15 分钟）</div>\n    <ul class=\"checklist\">\n      <li>《法典》表 F 七个房型系数：STD 85 / SUP 100 / DLX 120 / DLX-V 140 / EXE 145 / STE-B 180 / STE-E 265</li>\n      <li>《法典》表 F 五个附加项：高楼层 +5%、江景/特色景观 +10%、含早 +¥68/人、连通房 +¥50、加床 +¥180</li>\n      <li>《法典》表 F 三条价差校验规则：&lt;8% 拉开（降下一档或提上一档）、&gt;35% 收敛（提下一档）、套房与最高房型 &lt;60% 提套房价</li>\n      <li>《SPEC》2.5 四档价格系数区间：D1 150–200% / D2 120–150% / D3 95–110% / D4 70–85%</li>\n      <li>《SPEC》2.5 四档目标 OCC：D1 ≥95% / D2 88–95% / D3 72–85% / D4 45–65%</li>\n      <li>《法典》表 A 五条执行约束（单日 ≤20%、24h ≤2 次、单次 ≥3%、30 分钟内核 OTA、D1 须 L3、全部入台账）</li>\n      <li>六类衍生价格公式：会员 90%（下限 88%）、协议 A/B/C 75%/80%/85%、早鸟 90%/92%/95%、最后一刻 80%、套餐 BAR + 附加项×50%×份数、长住 70%/62%/55%</li>\n      <li>审批权限五档：95–100% L1 / 85–95% L2 / 70–85% L2 批 + L3 事后复核 / 55–70% L3 / &lt;55% L3 + 业主备案 / D1 一律 L3</li>\n      <li>附加项叠加顺序：先乘（百分比项）后加（固定金额项）</li>\n      <li>云璟酒店 10 个房型的平峰 BAR 与间数（STD-K 70 / STD-T 50 / SUP-K 60 / SUP-T 40 / DLX-K 45 / DLX-V 15 / EXE-K 25 / EXE-T 5 / STE-B 8 / STE-E 2）</li>\n    </ul>\n  </div>\n\n  <\!-- ================= 十一 ================= -->\n  <h2 id=\"s11\">十一、随堂测（5 题）</h2>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 1 题</div>\n    <div class=\"q-b\">《法典》表 F 的价差校验规则中，相邻房型价差 &gt;35% 时的动作是什么？只有一种选择还是有第二种？</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>动作是「收敛价差（提下一档）」，只有这一种选择，没有第二种</b>。<br>解析：对比 &lt;8% 的规则——原文写的是「拉开价差（<b>降下一档或提上一档</b>）」，给了两种选择；而 &gt;35% 的规则原文是「收敛价差（提下一档）」，只给了一种。这是因为价差过大时的修复方向唯一：把低的那一档提上去。若去降高的那一档，会破坏上一档与更上一档的价差，引发连锁反应。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 2 题</div>\n    <div class=\"q-b\">D2 高涨日，Pickup 领先 &gt;10%，等级系数取 150%。此时《法典》表 A 又给出 +10%。最终总系数应该是多少？为什么？</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>最终总系数 150%，表 A 的 +10% 不得执行</b>。<br>解析：150% × 110% = 165%，超出《SPEC》2.5 规定的 D2 价格系数区间上限 150%。规则是：表 A 的调价结果不得把总系数推出该需求等级的区间上限。超限时的三步处理：① 回调至平峰 BAR × 150%；② 在《调价台账》备注栏写明未执行部分（本例为 15 个百分点）并记入《观察清单》；③ 改用非价格手段承接需求——预测 OCC 若 ≥95%，走《法典》表 B（MinLOS、CTA、关低价渠道、不超售）与表 H（关渠道）。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 3 题</div>\n    <div class=\"q-b\">豪华江景房（高楼层）+ 三人含早 + 加床，D1 峰值日系数 175%。平峰 BAR ¥960。请算出最终房价（写出叠加顺序）。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>¥2,144</b>。<br>解析：先乘后加，百分比项先作用于房型 BAR，固定金额项后加，且固定金额项<b>不随需求等级系数放大</b>：<br>① 房型 BAR × 需求等级系数 = 960 × 1.75 = ¥1,680<br>② × 高楼层 5% = 1,680 × 1.05 = ¥1,764<br>③ × 江景 10% = 1,764 × 1.10 = ¥1,940.4<br>④ + 含早 ¥68 × 3 人 = +¥204 → ¥2,144.4<br>⑤ + 加床 ¥180 → ¥2,324.4<br><b>更正</b>：注意\"高楼层 +5%\"与\"江景 +10%\"是否适用需看房型本身——豪华江景房 DLX-V 的名称已含\"江景\"，其平峰 BAR ¥960 已包含江景溢价（系数 140 vs DLX 的 120，差 20 点即 +16.7%，与江景 +10% 及面积差叠加的结果一致）。因此<b>江景附加项不再重复加</b>，只加高楼层：<br>① 960 × 1.75 = ¥1,680　② × 1.05 = ¥1,764　③ + 68 × 3 = ¥204 → ¥1,968　④ + 180 = <b>¥2,148</b>。<br>核心考点：<b>房型名称中已体现的属性（江景、套房、行政楼层权益）不得重复计收附加项</b>。重复收费属违规，一经查实按《调价台账》追溯整改。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 4 题</div>\n    <div class=\"q-b\">会员价的让利下限是 BAR×88%，这个 88% 是怎么来的？</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>由会员渠道与 OTA 渠道的净收益相等点反推得出</b>。<br>解析：《SPEC》2.3 给出会员直订（LOY）综合成本率 4%、OTA 国内综合成本率 16%。令「会员价 ×（1 − 4%）」＝「BAR ×（1 − 16%）」：<br>会员价 = BAR × 84% ÷ 96% = BAR × <b>87.5%</b> ≈ BAR × 88%。<br>含义：会员价打到 88% 时，其净收益与\"按 BAR 全价通过 OTA 卖出\"完全相同。再低就不如直接让 OTA 卖——因为会员渠道还要额外付出积分成本与直销获客成本。所以 88% 是让利的<b>经济下限</b>，不是管理上的保守估计。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 5 题</div>\n    <div class=\"q-b\">《法典》表 A 约束 2 规定每次调价幅度不低于 3%。某次调价算得 −4%，原价 ¥680 → ¥652.8，取整到 ¥650 后实际降幅 4.4%。这次调价能不能执行？调价后还要做什么？</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>能执行。调价后 30 分钟内必须检查 OTA 挂牌价是否同步（价格一致性），并写入《调价台账》。</b><br>解析：取整后要回算实际幅度——（680 − 650）÷ 680 = <b>4.4%</b> ≥ 3%，满足约束 2。关键是取整方向：本例 −4% 的精确值是 ¥652.8，向下取整到 ¥650 使幅度变大，安全；若向上取整到 ¥660，实际幅度仅 2.9%，就违反约束 2 了。<b>规则：降价时向下取整，提价时向上取整，取整后必须回算幅度。</b><br>后续动作：《法典》表 A 约束 3 规定调价后 30 分钟内必须检查 OTA 挂牌价是否同步，约束 5 规定调价动作全部写入《调价台账》。若该日为 D1 峰值日，还须按约束 4 由 L3 审批。</div>\n    </details>\n  </div>\n\n  <\!-- ================= 十二 ================= -->\n  <h2 id=\"s12\">十二、本模块产出物</h2>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">结课交付清单</span>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>《价格体系表》</b>——10 个房型的平峰 BAR / 挂牌价 / 价差系数 / 附加项规则，含本周执行系数列</li>\n      <li><b>《价差校验记录表》</b>——连续 4 周（每周一）的价差校验结果，含每档价差百分比、判定、调整前后价格、复校结果</li>\n      <li><b>《年度价格日历》</b>——365 天逐日 D1/D2/D3/D4 打标 + 价格系数取值 + 目标 OCC，含打标依据备注栏</li>\n      <li><b>《衍生价格对照表》</b>——六类衍生价格 × 四档需求等级的全矩阵，含净收益校验列</li>\n      <li><b>《价格审批权限卡》</b>——表 6-15 的一页纸版，前台与销售部人手一份</li>\n      <li><b>表 F 默写卷</b>——当堂完成，错一格重默</li>\n    </ul>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">→</span>下一模块预告</div>\n    <p>价格定好了，接下来要管\"卖多少间、怎么限量\"。M07 库存与限制条件战术将讲透 MinLOS / MaxLOS / CTA / CTD / Stop Sell 五种限制条件，以及《法典》表 B、表 E、表 J 三张表——尤其是超售的完整决策流程和到店无房时的《步行客人预案》。</p>\n  </div>\n\n  <\!-- ===== 底部导航 ===== -->\n  <div class=\"p-title\">M05 需求预测</div></a>\n    <a href=\"m07.html\" class=\"p-next\"><div class=\"p-dir\">下一模块 →</div><div class=\"p-title\">M07 库存与限制条件战术</div></a>\n  </div>\n\n</div>\n"}]}, {"n": 7, "t": "库存与限制条件", "part": "L2 主管", "mod": "模块 M07", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n  <\!-- ===== 页头 ===== -->\n  <div class=\"crumb\">\n    <a href=\"../index.html\">学院首页</a><span>/</span>\n    <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n    L2 模块七\n  </div>\n\n  <div class=\"page-head\">\n    <div class=\"badge-row\">\n      <span class=\"badge badge-l2\">L2 收益管理主管</span>\n      <span class=\"badge\">模块 M07</span>\n      <span class=\"badge\">6 课时 / 540 min</span>\n      <span class=\"badge\">占 L2 认证 18.75%</span>\n      <span class=\"badge\">前置 M06</span>\n      <span class=\"badge badge-core\">★ 核心模块</span>\n    </div>\n    <h1 class=\"page-title\">库存与限制条件战术</h1>\n    <p class=\"page-lede\">一句话导语：价格决定「一个房间能卖多少钱」，库存决定「你到底还剩几个房间能卖」——后者一旦出错，前者做得再漂亮也没有意义。本模块把《法典》表 B（库存与限制条件配置）、表 E（超额预订）、表 J（免费升级）、表 L 超售过度分支（步行客人预案）四张表讲透，并用一个专章讲「撤除机制」——真实工作中最高频、也最致命的事故，不是设错限制条件，而是<b>设对了却忘了撤</b>。</p>\n  </div>\n\n  <\!-- ===== 学习目标 ===== -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n    <ul>\n      <li>能<b>完整默写并套用</b>《法典》表 B（5 行 × 4 列）与表 E（6 档基准超售率 + 4 个修正系数 + 3 条硬上限），并按三步法独立算出任意目标日的超售上限</li>\n      <li>能<b>说出</b> MinLOS / MaxLOS / CTA / CTD / Stop Sell 五种限制条件各自的定义、启用时机、副作用、设置方法与<b>撤除方法</b>，并逐字背出「限制条件撤除五步法」</li>\n      <li>能<b>独立执行</b> 超售的房型级分配（套房不参与超售、最大余数法补齐），以及在超售开启日的三项配套准备（备用酒店名单、补偿包、升级台账）</li>\n      <li>能<b>完整执行</b>《法典》表 J 的免费升级四级排序（钻石&gt;铂金&gt;金卡&gt;银卡 → 同档价高者先 → 同价住得久者先 → 同者复购多者先），并正确适用「最多升 1 档、套房每日 ≤3 间且须 L3 审批」两条硬约束</li>\n      <li>能<b>逐字背出</b>《步行客人预案》标准补偿包四步，并在到店无房场景下按序独立执行完毕</li>\n      <li>能<b>判断</b> 多张表同时给出库存类动作时的优先级（表 L &gt; 表 B &gt; 其余），并按表 O 完成仲裁与台账记录</li>\n    </ul>\n    <p class=\"card-note\">前置要求：M01 指标与计算、M03 每日操作流水线（表 B / 表 E 已在 L1 用过）、M05 需求预测（预测 OCC 是表 B 的唯一输入）、M06 价格体系设计（房型代码与 10 个房型的平峰 BAR）。<br>\n    本模块完整内嵌《法典》：<b>表 B</b>（库存与限制条件配置）、<b>表 E</b>（超额预订标准）、<b>表 J</b>（免费升级规则）、<b>表 L</b>（异常事件应急 · 超售过度分支与步行客人预案）；引用 <b>表 A</b>、<b>表 C</b>、<b>表 D</b>、<b>表 F</b>、<b>表 H</b>、<b>表 I</b>、<b>表 M</b>、<b>表 O</b>。全部阈值以《SPEC》第四章为唯一版本。</p>\n  </div>\n\n  <\!-- ===== 目录 ===== -->\n  <div class=\"toc\">\n    <div class=\"toc-title\">本模块目录</div>\n    <ol>\n      <li><a href=\"#s1\">库存战术的坐标：为什么库存优先于价格</a></li>\n      <li><a href=\"#s2\">《法典》表 B · 库存与限制条件配置表（完整内嵌）</a></li>\n      <li><a href=\"#s3\">五种限制条件逐个讲：MinLOS / MaxLOS / CTA / CTD / Stop Sell</a></li>\n      <li><a href=\"#s4\">★ 撤除机制：真实工作中最高频的事故</a></li>\n      <li><a href=\"#s5\">《法典》表 E · 超额预订标准表（完整内嵌 · 三步法）</a></li>\n      <li><a href=\"#s6\">四个完整超售计算案例（一步步走完三步法）</a></li>\n      <li><a href=\"#s7\">超售的落地：房型级分配与三项配套准备</a></li>\n      <li><a href=\"#s8\">《法典》表 J · 免费升级规则表（完整内嵌）</a></li>\n      <li><a href=\"#s9\">《升级台账》与套房升级的 L3 审批</a></li>\n      <li><a href=\"#s10\">《法典》表 L · 超售过度与《步行客人预案》四步补偿包</a></li>\n      <li><a href=\"#s11\">主流系统操作路径映射表</a></li>\n      <li><a href=\"#s12\">讲师示范 ①：D2 高涨日（表 B 全四列 + 撤除计划）</a></li>\n      <li><a href=\"#s13\">讲师示范 ②：超售日 → 到店无房 → 启动步行客人预案</a></li>\n      <li><a href=\"#s14\">学员跟练（6 题）</a></li>\n      <li><a href=\"#s15\">判定表默写清单（当堂默写）</a></li>\n      <li><a href=\"#s16\">随堂测（5 题）</a></li>\n      <li><a href=\"#s17\">本模块产出物</a></li>\n    </ol>\n  </div>\n\n  <\!-- ================= 一 ================= -->\n  <h2 id=\"s1\">一、库存战术的坐标：为什么库存优先于价格</h2>\n\n  <p>《法典》表 O 把「表 B 库存」排在第 <strong>2 优先级</strong>，仅次于表 L 应急，<strong>高于表 A 价格</strong>。原因只有一条：</p>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">价格错了可以改，库存错了改不回来</span>\n    <p>价格定高了，明天降回来，损失的只是中间这段时间的成交量。<br>\n    <b>库存放错了，房间被低价预订锁定，你就再也拿不回来了</b>——除非付违约成本。<br>\n    同理，超售少了只是少卖几间，超售多了就是<b>客人到店无房</b>，代价是《步行客人预案》的全套补偿 + 差评 + 忠诚会员流失，这个代价是单房收益的十几倍。</p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 7-1　《法典》表 O 优先级（本模块涉及部分）<span class=\"cap-note\">完整六档见 M09 第 7 节</span></caption>\n      <thead><tr><th class=\"num\">优先级</th><th>表</th><th>场景</th><th>与库存的关系</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">1</td><td><b>表 L 应急</b></td><td>异常事件，覆盖一切</td><td>「需求暴涨」分支含「设 MinLOS 2、关低价渠道」；「超售过度」分支启动步行客人预案</td></tr>\n        <tr><td class=\"num\">2</td><td><b>表 B 库存</b></td><td>库存安全（超售 / 关房）</td><td><b>本模块主体</b></td></tr>\n        <tr><td class=\"num\">3</td><td>表 A 价格</td><td>常规价格调整</td><td>价格动作让位于库存动作</td></tr>\n        <tr><td class=\"num\">4</td><td>表 C ARI</td><td>竞争定位微调</td><td>—</td></tr>\n        <tr><td class=\"num\">5</td><td>表 H 渠道</td><td>渠道开关</td><td>渠道开关本质是「库存投放」，与表 B 的「低价渠道 Stop Sell」重叠时以表 B 为准</td></tr>\n        <tr><td class=\"num\">6</td><td>表 D MPI</td><td>份额诊断</td><td>多为分析而非动作</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">表 B 与表 H 的「低价渠道 Stop Sell」列重叠时的处理</span>\n    <p>表 B 有一列叫「低价渠道 Stop Sell」，表 H 也有渠道开关的动作，两者都管渠道。<b>冲突时以表 B 为准（优先级 2 &gt; 5）。</b><br>\n    具体规则：<b>先按表 H 定出该档位的全渠道配置，再按表 B 的「低价渠道 Stop Sell」列做叠加关闭</b>。表 B 要求关闭的渠道，无论表 H 说什么都关；表 B 未要求关闭的，按表 H 执行。<br>\n    例：预测 OCC 92%（表 B 走 90–95% 行，要求「关闭尾房特惠」；表 H 走 90–95% 行，要求「OTA 国内开 2 家，批发商关」）→ 最终：OTA 国内开 2 家、尾房特惠关、批发商关（表 H 已关）、GDS 开、直销全开。</p>\n  </div>\n\n  <h2 id=\"s2\">二、《法典》表 B · 库存与限制条件配置表（完整内嵌）</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-matrix\">\n      <caption><span class=\"badge-codex\">表 B</span>　库存与限制条件配置表<span class=\"cap-note\">输入：预测 OCC（与表 A 同一个数，保留一位小数）。<b>四列动作同时配置，不是四选一</b></span></caption>\n      <thead>\n        <tr><th>预测 OCC</th><th>MinLOS</th><th>CTA</th><th>低价渠道 Stop Sell</th><th>超额预订</th></tr>\n      </thead>\n      <tbody>\n        <tr>\n          <th class=\"rowh\">≥95%</th>\n          <td>2 晚（<b>D1 峰值日 3 晚</b>）</td>\n          <td><b>启用</b></td>\n          <td>关闭尾房特惠 / 团购 / 批发商</td>\n          <td>不超售</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">90–95%</th>\n          <td>2 晚</td>\n          <td>D1 日启用</td>\n          <td>关闭尾房特惠</td>\n          <td>≤2 间</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">85–90%</th>\n          <td>1–2 晚（<b>周末 2 晚</b>）</td>\n          <td>否</td>\n          <td>保留</td>\n          <td>按表 E</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">70–85%</th>\n          <td>1 晚</td>\n          <td>否</td>\n          <td>全开</td>\n          <td>按表 E</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">&lt;70%</th>\n          <td>不设限</td>\n          <td>否</td>\n          <td>全开 + 上促销</td>\n          <td>不超售</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  "}, {"id": "p1", "name": "1 定行规则（与表 A 完全一致，不许另创）", "min": 8, "desc": "", "html": "<h3>2.1 定行规则（与表 A 完全一致，不许另创）</h3>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">表 B 有 5 行，不是 4 行。「90–95%」是独立的一行</span>\n    <p>新人最常犯的错是把表 B 读成 4 行（≥95% / 85–95% / 70–85% / &lt;70%），把「90–95%」吃掉。<b>这会直接导致两处错误：</b><br>\n    ① 本该「≤2 间」的超售，被误读成「按表 E」算出一个更大的数；<br>\n    ② 本该「关闭尾房特惠」，被误读成「保留」。<br>\n    <br>\n    <b>五行的边界（含下界不含上界）：</b><br>\n    ≥95.0% →「≥95%」行<br>\n    90.0% ≤ X &lt; 95.0% →「90–95%」行<br>\n    85.0% ≤ X &lt; 90.0% →「85–90%」行<br>\n    70.0% ≤ X &lt; 85.0% →「70–85%」行<br>\n    X &lt; 70.0% →「&lt;70%」行</p>\n  </div>\n\n  "}, {"id": "p2", "name": "2 逐行逐列展开", "min": 8, "desc": "", "html": "<h3>2.2 逐行逐列展开</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 7-2　表 B 四列的执行要点<span class=\"cap-note\">「怎么落位」列写的是系统无关动作，不是某个按钮</span></caption>\n      <thead><tr><th>列</th><th>取值</th><th>含义</th><th>怎么落位（系统无关）</th><th>易错点</th></tr></thead>\n      <tbody>\n        <tr>\n          <td rowspan=\"3\"><b>MinLOS</b><br>最少住期</td>\n          <td>3 晚</td>\n          <td>只接受连住 ≥3 晚的预订</td>\n          <td>在限制条件（Restriction）中，按「日期 × 房型 × 价格代码」三维写入最少住期 = 3</td>\n          <td rowspan=\"3\"><b>「1 晚」与「不设限」是同一个动作：清空 MinLOS 值</b>，不是填入数字 1。填入 1 在某些系统里会被识别为「最少住 1 晚」，与清空效果相同；但在另一些系统里会与价格代码绑定产生意外限制，<b>统一执行「清空」最安全</b></td>\n        </tr>\n        <tr><td>2 晚</td><td>只接受连住 ≥2 晚的预订</td><td>同上，写入 2</td></tr>\n        <tr><td>1 晚 / 不设限</td><td>不限制住期</td><td><b>清空</b> MinLOS 值</td></tr>\n        <tr>\n          <td rowspan=\"2\"><b>CTA</b><br>不可入住</td>\n          <td>启用</td>\n          <td>该日不接受新到店，但允许延续入住（已在住的客人可以跨过这一天）</td>\n          <td>在限制条件中对该日启用 Closed to Arrival</td>\n          <td rowspan=\"2\"><b>CTA ≠ 关房。</b>CTA 只挡「新到店」，不挡「延续」；关房（Stop Sell / Close-out）是彻底不可售。混用会导致续住客人被系统自动拒绝</td>\n        </tr>\n        <tr><td>否 / D1 日启用</td><td>不限制新到店；「D1 日启用」意为<b>该日若为 D1 峰值日则启用，否则不启用</b></td><td>查目标日需求等级代号，为 PEAK（D1）才启用</td></tr>\n        <tr>\n          <td rowspan=\"3\"><b>低价渠道<br>Stop Sell</b></td>\n          <td>关闭尾房特惠 / 团购 / 批发商</td>\n          <td>三类低价通路全部停售</td>\n          <td>本店侧（PMS / 渠道管理器）+ 渠道侧（OTA 后台）<b>两层都要关</b></td>\n          <td rowspan=\"3\">只做本店侧，渠道缓存可能仍显示可售；只做渠道侧，其他通路仍在卖。<b>两层都做并各留一张截图</b></td>\n        </tr>\n        <tr><td>关闭尾房特惠 / 保留</td><td>「保留」= 维持现状，不动</td><td>不动作（但要在台账备注写明「保留，未动作」）</td></tr>\n        <tr><td>全开 / 全开 + 上促销</td><td>低价通路全部开放；「+ 上促销」指上架促销产品</td><td>确认三类通路均为开放态；上促销指上架「今日特惠」类尾房产品</td></tr>\n        <tr>\n          <td rowspan=\"3\"><b>超额预订</b></td>\n          <td>不超售</td>\n          <td>超售上限设 <b>0</b></td>\n          <td>在超额预订功能中把上限设为 0（不是「不设置」）</td>\n          <td rowspan=\"3\"><b>只有「85–90%」与「70–85%」两行走表 E。</b>「90–95%」行直接取 ≤2 间；「≥95%」与「&lt;70%」行不超售，<b>不需要查表 E</b></td>\n        </tr>\n        <tr><td>≤2 间</td><td>超售上限取 2 间</td><td>直接设 2 间</td></tr>\n        <tr><td>按表 E</td><td>走表 E 三步法计算</td><td>见第 5、6 节</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h2 id=\"s3\">三、五种限制条件逐个讲：MinLOS / MaxLOS / CTA / CTD / Stop Sell</h2>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">先建立一个统一的认识：限制条件不是「开关」，是「漏斗」</span>\n    <p>每加一道限制条件，就等于在预订漏斗上加一层筛子，<b>必然漏掉一部分真实需求</b>。所以设置限制条件的判断标准永远是：<br>\n    <b>筛掉的低价值需求 &gt; 误筛掉的高价值需求</b>。<br>\n    想不清楚这个不等式，就不要设。</p>\n  </div>\n\n  "}, {"id": "p3", "name": "1 MinLOS（最少住期 · Minimum Leng", "min": 8, "desc": "", "html": "<h3>3.1 MinLOS（最少住期 · Minimum Length of Stay）</h3>\n\n  <div class=\"kv\">\n    <div class=\"kv-row\"><div class=\"kv-k\">定义</div><div class=\"kv-v\">对某一入住日，只接受连住 ≥ N 晚的预订。选 1 晚的客人在前台/OTA 上<b>看不到可售</b></div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">什么时候用</div><div class=\"kv-v\">① 需求旺盛日，用住期门槛把「只住一晚的过路客」筛掉，把房间留给高价值的连住客；② 峰值日中间的某天（如国庆 10 月 3 日），避免出现「10/2–10/3 住一晚后走人、10/4 空一天」的碎片化库存</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">副作用</div><div class=\"kv-v\"><b>会同时挡住高价值的单晚商务客。</b>云璟的 CORP 协议客（占房晚 22%，ADR ¥520）与 GDS/TMC 商旅客多是单晚，MinLOS = 2 会把这部分需求整块切掉</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">怎么设</div><div class=\"kv-v\">按「<b>日期 × 房型 × 价格代码</b>」三维设置。云璟的标准做法：<b>对全 10 个房型统一设，但价格代码只对 BAR 及衍生价设，对 CORP 协议价与 GDS 价不设</b>——这样既筛了散客，又保住了商旅客</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">怎么撤</div><div class=\"kv-v\"><b>清空 MinLOS 值</b>，然后<b>换到预订界面视角试订 1 晚验证</b>：能订成功才说明撤干净了。详见第 4 节撤除五步法</div></div>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">MinLOS 的三个边界情况（必须知道）</span>\n    <p>① <b>「周末 2 晚」的周末指周五、周六入住</b>（对应《SPEC》2.5 中旺季周五六为 D2 高涨日），不是周六周日。<br>\n    ② <b>MinLOS 只影响「以该日为入住日」的预订</b>，不影响以该日为中间日的连住订单。所以要挡碎片化，必须对峰值日的<b>每一天</b>都设，不能只设中间那天。<br>\n    ③ <b>D1 峰值日的 MinLOS = 3 晚只在「≥95%」行出现</b>；「90–95%」行是 2 晚，即使该日是 D1 也不变——因为 90–95% 行专门写了「2 晚」，而「≥95%」行写的是「2 晚（D1 峰值日 3 晚）」。</p>\n  </div>\n\n  "}, {"id": "p4", "name": "2 MaxLOS（最多住期 · Maximum Leng", "min": 8, "desc": "", "html": "<h3>3.2 MaxLOS（最多住期 · Maximum Length of Stay）</h3>\n\n  <div class=\"kv\">\n    <div class=\"kv-row\"><div class=\"kv-k\">定义</div><div class=\"kv-v\">对某一入住日，只接受连住 ≤ N 晚的预订。超过 N 晚的预订被拒绝</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">什么时候用</div><div class=\"kv-v\">① <b>长住客挤占</b>：当长住需求（LNG）或不定期的长包房把旺季日期锁死时；② <b>峰值日前夕</b>：防止客人在峰值日前一天入住并一路连住跨过整个峰值期，把该段高价库存按低价锁死</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">副作用</div><div class=\"kv-v\"><b>直接砍掉长住客与团队连住。</b>云璟 LNG 长住客占房晚 2%（ADR ¥380），GRP 团队占 8%（ADR ¥450）。MaxLOS 设太短会同时伤到这两块，且长住客的清洁与服务成本远低于散客，砍掉并不划算</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">怎么设</div><div class=\"kv-v\">《法典》表 B <b>未规定 MaxLOS 的档位值</b>——它不在表 B 的四列中。本学院给出云璟的执行口径：<b>仅在 D1 峰值日（PEAK）当预测 OCC ≥95% 时启用，取值 = 该峰值假期连续天数（如国庆 1–5 日则 MaxLOS = 5 晚）</b>；其余日期一律不设</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">怎么撤</div><div class=\"kv-v\">峰值假期结束<b>次日 08:30 查表时</b>一并撤除（写进《限制条件存量清单》的到期日列）。撤除后必须试订一次超长住期验证</div></div>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">MaxLOS 是五种限制条件里唯一《法典》表 B 没有给档位的</span>\n    <p>因此它<b>不是每日流水线的标准动作</b>，只在特定场景启用。启用必须满足两个条件：<b>① 目标日为 D1 峰值日；② 预测 OCC ≥ 95%</b>。两个条件缺一不启用。<br>\n    启用与撤除都必须写进《调价台账》，触发表编号填「<b>表 B</b>」，并在备注第二段写明启用依据。<b>不得凭口头要求设置。</b></p>\n  </div>\n\n  "}, {"id": "p5", "name": "3 CTA（不可入住 · Closed to Arriv", "min": 8, "desc": "", "html": "<h3>3.3 CTA（不可入住 · Closed to Arrival）</h3>\n\n  <div class=\"kv\">\n    <div class=\"kv-row\"><div class=\"kv-k\">定义</div><div class=\"kv-v\">该日不接受<b>新到店</b>的预订，但已在住的客人可以延续入住跨过这一天</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">什么时候用</div><div class=\"kv-v\">① 酒店已满或接近满，且当天有大量续住需求；② <b>D1 峰值日</b>——峰值日当天的房间应优先服务于「跨峰值期的连住客」，而不是新来的单日客</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">副作用</div><div class=\"kv-v\"><b>最危险的一个。</b>CTA 会把「客人想在这天入住」的需求整块挡掉，包括愿意付高价的客人。且 CTA 一旦忘了撤，<b>第二天开始所有新到店预订全部消失，而系统不会报错</b>——这是本模块第 4 节重点讲的头号事故</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">怎么设</div><div class=\"kv-v\">在限制条件中对该日启用 Closed to Arrival。<b>只对散客类价格代码（BAR / 会员价 / OTA 价）设，对 CORP 协议价不设</b>——协议客是合约客户，单方面停止接新到店可能构成违约</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">怎么撤</div><div class=\"kv-v\">关闭 CTA 开关 → <b>换到预订界面视角试订：选该日为入住日、住 1 晚，必须能订成功</b> → 截图存证 → 台账登记（动作类型「撤 CTA」）</div></div>\n  </div>\n\n  "}, {"id": "p6", "name": "4 CTD（不可离店 · Closed to Depar", "min": 8, "desc": "", "html": "<h3>3.4 CTD（不可离店 · Closed to Departure）</h3>\n\n  <div class=\"kv\">\n    <div class=\"kv-row\"><div class=\"kv-k\">定义</div><div class=\"kv-v\">不允许客人在该日离店（退房）</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">什么时候用</div><div class=\"kv-v\">① <b>防止库存碎片化</b>：峰值日之后那天设 CTD，逼迫客人连住到更晚，把低谷日的库存一起消化；② 与 MinLOS 配合形成「住期锁」：MinLOS 管入口、CTD 管出口</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">副作用</div><div class=\"kv-v\"><b>对客人极不友好，容易被投诉。</b>客人会发现「我能订 10/2 入住，但系统不让我 10/3 退房，必须住到 10/4」。若未在预订页面显著提示，会引发大量客诉与 OTA 差评</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">怎么设</div><div class=\"kv-v\">《法典》表 B <b>同样未列 CTD</b>。云璟执行口径：<b>仅在表 L「需求暴涨」分支（24h Pickup 领先 &gt;60%）下，由 L3 审批后启用</b>，取值范围为该峰值假期的最末日</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">怎么撤</div><div class=\"kv-v\">同 CTA：关闭开关 → 试订（选该日为离店日，必须能订成功）→ 截图 → 台账登记。<b>CTD 的撤除时限比 CTA 更严：必须在目标日当日夜审前确认已撤</b>，否则会影响次日的正常退房流程</div></div>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">CTA 与 CTD 常常成对出现，但方向相反，别搞混</span>\n    <p><b>CTA（Closed to Arrival）= 不让你来。</b>作用点是<b>入住日</b>，防止新客人在这天开始住。<br>\n    <b>CTD（Closed to Departure）= 不让你走。</b>作用点是<b>离店日</b>，防止客人在这天结束住。<br>\n    口诀：<b>A 是 Arrival（来），D 是 Departure（走）。</b><br>\n    典型组合（国庆 10 月 1–5 日）：10/1 设 CTA（防止单日客）＋ MinLOS 3 晚；10/5 设 CTD（防止客人在峰值最后一天退房造成 10/6 空档）。<b>两个都要在假期结束后第一时间撤除。</b></p>\n  </div>\n\n  "}, {"id": "p7", "name": "5 Stop Sell（停售 / 关房 · Close-", "min": 8, "desc": "", "html": "<h3>3.5 Stop Sell（停售 / 关房 · Close-out）</h3>\n\n  <div class=\"kv\">\n    <div class=\"kv-row\"><div class=\"kv-k\">定义</div><div class=\"kv-v\">某房型 / 某价格代码 / 某渠道在某日<b>完全不可售</b>，与库存余量无关</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">什么时候用</div><div class=\"kv-v\">① <b>渠道级</b>：表 B「低价渠道 Stop Sell」列与表 H 渠道开关（成本高的渠道在旺日关掉）；② <b>房型级</b>：高档房在超售日关闭，为升级腾房（配合表 J）；③ <b>价格代码级</b>：某个促销价卖够了量，停售该产品</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">副作用</div><div class=\"kv-v\"><b>渠道级 Stop Sell 会得罪渠道。</b>频繁对同一渠道关房，会影响该渠道对酒店的排名权重（详见 M08）。<b>房型级 Stop Sell 则几乎没有副作用</b>——把 STD 关掉只卖 SUP 以上，是标准的升档销售（upsell）手段</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">怎么设</div><div class=\"kv-v\"><b>两个层级都要做：</b>本店侧（PMS / 渠道管理器的 Stop Sell 或关房）＋ 渠道侧（在对应 OTA 后台把该日房态置为不可售）。<b>只做一层等于没做</b></div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">怎么撤</div><div class=\"kv-v\">本店侧 + 渠道侧<b>两层都撤</b> → <b>等待渠道缓存刷新</b>（不同渠道刷新周期不同）→ 从前台视角复查确实可订 → 若仍不可订，联系渠道经理处理 → 台账登记（动作类型「Stop Sell 关」）</div></div>\n  </div>\n\n  <h3>3.6 五种限制条件速查卡</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 7-3　五种限制条件速查卡<span class=\"cap-note\">建议打印贴在工位</span></caption>\n      <thead><tr><th>限制条件</th><th>挡什么</th><th>作用点</th><th>《法典》表 B 有无档位</th><th>云璟启用条件</th><th>撤除验证方式</th></tr></thead>\n      <tbody>\n        <tr><td><b>MinLOS</b></td><td>住期太短的预订</td><td>入住日</td><td><span class=\"pill pill-teal\">有（5 行档位）</span></td><td>按表 B 逐日配置</td><td>试订 1 晚，应被拒绝</td></tr>\n        <tr><td><b>MaxLOS</b></td><td>住期太长的预订</td><td>入住日</td><td><span class=\"pill pill-amber\">无</span></td><td>D1 峰值日 且 预测 OCC ≥95%</td><td>试订超长住期，应能订成功</td></tr>\n        <tr><td><b>CTA</b></td><td>该日新到店</td><td>入住日</td><td><span class=\"pill pill-teal\">有（3 行档位）</span></td><td>按表 B 逐日配置</td><td>试订「该日入住 1 晚」，应能订成功</td></tr>\n        <tr><td><b>CTD</b></td><td>该日离店</td><td>离店日</td><td><span class=\"pill pill-amber\">无</span></td><td>表 L 需求暴涨 + L3 审批</td><td>试订「该日离店」，应能订成功</td></tr>\n        <tr><td><b>Stop Sell</b></td><td>全部预订（房型/价格码/渠道）</td><td>视层级</td><td><span class=\"pill pill-teal\">有（低价渠道列）</span></td><td>按表 B + 表 H</td><td>两层都撤 + 缓存刷新后前台视角复查</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h2 id=\"s4\">四、★ 撤除机制：真实工作中最高频的事故</h2>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">先看三个真实场景（都是本学院收集的行业事故，不是编的）</span>\n    <p><b>事故 A：</b>国庆 10 月 2 日设了 MinLOS = 3 晚，10 月 8 日没撤。10 月 9 日起所有 1–2 晚的预订被系统静默拒绝，OTA 上酒店显示「不可订」，销售部连续 4 天没收到 OTA 订单，第 5 天才被发现。<b>损失约 260 个房晚。</b><br>\n    <b>事故 B：</b>展会日对 STD-K 设了 Stop Sell（为升级腾房），展会结束后忘了撤。STD-K 共 70 间，占房量 21.9%，连续 11 天零预订，前台以为是市场不好。<b>损失约 480 个房晚。</b><br>\n    <b>事故 C：</b>峰值日启用了 CTA，撤除时只关了本店侧，渠道侧（携程后台）的房态没同步改回。携程上该房型持续显示不可订 2 周，且 OTA 排名因此下滑。<b>损失订单 + 排名权重下降。</b></p>\n  </div>\n\n  <p>三起事故的共同点：<b>设置动作做得很规范，撤除动作完全没有流程。</b>本节就是来解决这个问题的。</p>\n\n  <h3>4.1 根本原因：限制条件有「生效日」但没有「到期日」</h3>\n\n  <p>在系统里设置限制条件时，你填的是「从哪天开始」。系统不会问你「到哪天结束」——因为它的设计假设是「你会记得来撤」。<b>而人一定会忘。</b></p>\n\n  <p>所以撤除机制的核心不是「提醒自己」，而是<b>把到期日变成一个系统里的字段</b>。</p>\n\n  <h3>4.2 三重保险机制（云璟标准做法）</h3>\n\n  <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n    <h4>保险一 · 设置即登记：每一条限制条件都必须进《限制条件存量清单》</h4>\n    <p>设置限制条件的<b>同一个动作里</b>，必须同步在《限制条件存量清单》里新增一行。这张表的字段固定 8 个：</p>\n    <div class=\"tbl-wrap\" style=\"margin-top:8px\">\n      <table class=\"tbl\">\n        <caption>表 7-4　《限制条件存量清单》字段设计</caption>\n        <thead><tr><th class=\"num\">#</th><th>字段</th><th>说明</th></tr></thead>\n        <tbody>\n          <tr><td class=\"num\">1</td><td>限制条件类型</td><td>MinLOS / MaxLOS / CTA / CTD / Stop Sell</td></tr>\n          <tr><td class=\"num\">2</td><td>对象</td><td>日期 + 房型代码 + 价格代码 + 渠道代码（四元组，缺一不可）</td></tr>\n          <tr><td class=\"num\">3</td><td>设置值</td><td>如「MinLOS = 3」「CTA 开」「Stop Sell 关（携程·STD-K）」</td></tr>\n          <tr><td class=\"num\">4</td><td>设置日期</td><td>操作当天的日期</td></tr>\n          <tr><td class=\"num\">5</td><td><b>生效区间</b></td><td>起始日 – 结束日。<b>必须填结束日，不允许留空</b></td></tr>\n          <tr><td class=\"num\">6</td><td><b>到期日</b><span class=\"pill pill-red\">最关键</span></td><td>= 生效结束日的<b>次日</b>。<b>撤除动作在这一天执行</b></td></tr>\n          <tr><td class=\"num\">7</td><td>触发表编号</td><td>表 B / 表 H / 表 L / 表 J</td></tr>\n          <tr><td class=\"num\">8</td><td>撤除状态</td><td>生效中 / 已撤除（含撤除日期与撤除人）</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <p style=\"margin-top:8px\"><b>第 6 列「到期日」是整个机制的支点。</b>有了它，撤除就不再是「记得去撤」，而是「清单上写着今天该撤」。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n    <h4>保险二 · 每日扫描：08:30 查表环节的固定第 0 步</h4>\n    <p>《法典》表 M 的 08:30 时段是「逐日查《法典》表 A/B/C/H，得出动作清单」。<b>在这个动作之前增加一步固定扫描，耗时上限 3 分钟：</b></p>\n    <div class=\"checklist\" style=\"margin-top:8px\">\n      <li>打开《限制条件存量清单》，筛「到期日 = 今天」的行 → 今天必须撤除</li>\n      <li>筛「到期日 &lt; 今天」且「撤除状态 = 生效中」的行 → <b>已过期仍生效，立即撤除并登记为事故</b></li>\n      <li>筛「到期日 ≤ 今天 + 3」的行 → 提前 3 天口头提醒复核人</li>\n    </div>\n    <p style=\"margin-top:8px\"><b>这 3 分钟是全部保险里性价比最高的。</b>三起事故里有两起（A、B）都能被这一步直接拦住。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n    <h4>保险三 · 周一全量对账：表 N 的每周一动作</h4>\n    <p>《法典》表 N 规定每周一做三件事（房型价差校验、未来 8 周预测更新、渠道开关复核）。<b>云璟在此基础上增加第四件：限制条件全量对账。</b></p>\n    <p>做法：从系统中<b>导出生效中的限制条件全量清单</b>（这是真实数据，不是人工维护的表），与《限制条件存量清单》逐行比对，找出三类差异：</p>\n    <div class=\"tbl-wrap\" style=\"margin-top:8px\">\n      <table class=\"tbl\">\n        <caption>表 7-5　周一全量对账的三类差异</caption>\n        <thead><tr><th>差异类型</th><th>表现</th><th>处置</th></tr></thead>\n        <tbody>\n          <tr><td><b>① 系统有、清单无</b></td><td>系统里有一条生效中的限制条件，但存量清单里没有记录</td><td><span class=\"pill pill-red\">最危险</span>。说明有人设了没登记。立即补登记，追溯设置人与设置日期，登记为流程违规</td></tr>\n          <tr><td><b>② 清单有、系统无</b></td><td>清单显示生效中，但系统里已无此限制</td><td>说明已被撤除但未登记。核实撤除人与撤除依据，补登记撤除状态</td></tr>\n          <tr><td><b>③ 两边都有但值不同</b></td><td>记录的是 MinLOS = 3，系统里是 MinLOS = 2</td><td>核实哪次修改未留痕，以系统实际值为准回改清单，并追溯修改人</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </div></div>\n\n  <h3>4.3 限制条件撤除五步法（背下来，每次撤除都按这五步走）</h3>\n\n  <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n    <h4>查到期日</h4>\n    <p>在《限制条件存量清单》中筛出「到期日 = 今天」的全部行。<b>不看系统的库存显示，只看清单</b>——系统的显示不能告诉你是「本来就满房」还是「被限制挡住了」。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n    <h4>两层都撤</h4>\n    <p><b>本店侧</b>（PMS / 渠道管理器）：清空 MinLOS / 关闭 CTA / 关闭 CTD / 打开 Stop Sell。<br>\n    <b>渠道侧</b>（OTA 后台）：把对应日期的房态恢复为可售。<br>\n    <b>限制条件是按「日期 × 房型 × 价格代码 × 渠道」四元组设的，撤除必须四元组对齐。</b>只撤了「日期」这一维，会留下「某房型仍被限制」的残片。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n    <h4>试订验证（这一步不许跳）</h4>\n    <div class=\"tbl-wrap\" style=\"margin-top:8px\">\n      <table class=\"tbl\">\n        <caption>表 7-6　撤除验证的试订矩阵</caption>\n        <thead><tr><th>撤的是什么</th><th>试订动作</th><th>成功 = 撤干净了</th><th>失败 = 怎么办</th></tr></thead>\n        <tbody>\n          <tr><td>MinLOS</td><td>选该日入住、住 <b>1 晚</b></td><td>能订成功</td><td>检查是否按房型/价格代码分开设了多份，逐一清空</td></tr>\n          <tr><td>MaxLOS</td><td>选该日入住、住 <b>超出原上限的晚数</b></td><td>能订成功</td><td>同上</td></tr>\n          <tr><td>CTA</td><td>选<b>该日为入住日</b>、住 1 晚</td><td>能订成功</td><td>检查本店侧开关是否真的关了</td></tr>\n          <tr><td>CTD</td><td>选<b>该日为离店日</b>的订单</td><td>能订成功</td><td>同上，且注意当日夜审前必须完成</td></tr>\n          <tr><td>Stop Sell（渠道）</td><td>在<b>该渠道前台视角</b>搜索该日该房型</td><td>能搜到且可订</td><td>等缓存刷新后复查；仍不可订则联系渠道经理</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n    <h4>截图存证</h4>\n    <p>每张截图含 4 项：<b>日期 / 四元组对象 / 设置项 / 撤除前后状态</b>。试订成功的页面也要截图（这是「撤干净了」的证据）。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">5</div><div class=\"step-body\">\n    <h4>台账登记 + 清单更新</h4>\n    <p>① 《调价台账》新增一条，动作类型填「撤 MinLOS / 撤 CTA / 撤 CTD / Stop Sell 关」，触发表编号填「<b>表 B</b>」（若由表 L 触发则填「表 L」）。<br>\n    ② 《限制条件存量清单》该行的「撤除状态」改为「已撤除（日期 + 撤除人）」。<br>\n    ③ 若发现「已过期仍生效」，<b>额外登记为事故</b>，在台账备注第二段写明「过期 X 天，期间损失房晚约 X 间」，并上报 L2。</p>\n  </div></div>\n\n  <div class=\"callout callout-gold\">\n    <span class=\"co-t\">撤除机制的三句话口诀</span>\n    <p><b>设的时候就想好哪天撤 · 撤的时候必须试订验证 · 每周一全量对账一次。</b><br>\n    这三句话能挡住 95% 的限制条件事故。剩下 5% 靠第 6 节之后的超售配套准备来兜底。</p>\n  </div>\n\n  <h2 id=\"s5\">五、《法典》表 E · 超额预订标准表（完整内嵌 · 三步法）</h2>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">总公式</span>\n    超售间数 = 可售房量 × 超售率（<b>向下取整</b>）\n  </div>\n\n  <h3>第一步：查基准超售率</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption><span class=\"badge-codex\">表 E</span>　第一步 · 基准超售率<span class=\"cap-note\">输入：历史「No-show 率 + 24h 内取消率」合计值</span></caption>\n      <thead><tr><th>No-show + 取消 合计</th><th>基准超售率</th><th>审批要求</th></tr></thead>\n      <tbody>\n        <tr><td>&lt;5%</td><td><b>0%</b></td><td>—</td></tr>\n        <tr><td>5–10%</td><td><b>2%</b></td><td>—</td></tr>\n        <tr><td>10–15%</td><td><b>3%</b></td><td>—</td></tr>\n        <tr><td>15–20%</td><td><b>5%</b></td><td>—</td></tr>\n        <tr><td>20–30%</td><td><b>7%</b></td><td>—</td></tr>\n        <tr><td>&gt;30%</td><td><b>10%</b></td><td><span class=\"pill pill-red\">需 L3 经理审批</span></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">区间边界（含下界不含上界，与表 A / 表 B 一致）</span>\n    <p>&lt;5.0% → 0%　｜　5.0% ≤ X &lt; 10.0% → 2%　｜　10.0% ≤ X &lt; 15.0% → 3%<br>\n    15.0% ≤ X &lt; 20.0% → 5%　｜　20.0% ≤ X &lt; 30.0% → 7%　｜　X ≥ 30.0% → 10%（需 L3 审批）<br>\n    <b>注意最后两档的跨度不同：</b>20–30% 是 10 个百分点的跨度，&gt;30% 是无上限的。<b>一旦合计值 ≥30%，无论多高都取 10%，且必须 L3 审批</b>——这正是「无上限档必须有人把关」的设计意图。</p>\n  </div>\n\n  <h3>第二步：修正系数（连乘）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption><span class=\"badge-codex\">表 E</span>　第二步 · 修正系数<span class=\"cap-note\">命中几条就连乘几个系数；一条都不命中则 ×1</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>条件</th><th>系数</th><th>为什么这么设计</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">1</td><td>D1 峰值日 / D2 高涨日</td><td><b>× 0.5</b></td><td>需求旺的日子，房间本来就能卖掉；一旦超售失败，你要把客人送走，而<b>附近的同档酒店在旺日也几乎没房</b>，补偿成本与口碑损失成倍上升</td></tr>\n        <tr><td class=\"num\">2</td><td>担保预订（预付 / 信用卡担保）占比 &gt;60%</td><td><b>× 0.5</b></td><td>担保预订的 No-show 率极低。担保多 = 兑现率高 = 不需要超售</td></tr>\n        <tr><td class=\"num\">3</td><td>会议团队占当日 &gt;40%</td><td><b>× 0.5</b></td><td>团队是<b>整块到店、整块离店</b>，要么全来要么全不来，方差极大。团队日超售的失败代价是「一次送走几十个人」</td></tr>\n        <tr><td class=\"num\">4</td><td>协议客户集中度 &gt;50%</td><td><b>× 0.8</b></td><td>协议客户是长期合约关系，<b>把协议客送走的代价远高于把散客送走</b>（可能丢掉整个公司客户），所以温和下修</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">三个 ×0.5 连乘的杀伤力：5% → 0.625%</span>\n    <p>这是表 E 最容易被低估的地方。假设基准超售率 5%，四个条件全中：<br>\n    5% × 0.5 × 0.5 × 0.5 × 0.8 = <b>0.5%</b>。按 320 间算 = 1.6 → <b>1 间</b>。<br>\n    <b>设计意图非常明确：越是「需求旺 + 客人靠谱 + 有大团队 + 协议客多」的日子，越不该超售。</b><br>\n    因为这类日子一旦超售失败，你要送走的是<b>一个高价值客人或一个团队</b>，代价远高于多卖一间房的收益。</p>\n  </div>\n\n  <h3>第三步：硬上限（三条同时生效，取最小值）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption><span class=\"badge-codex\">表 E</span>　第三步 · 硬上限<span class=\"cap-note\">云璟可售 320 间时的对应值</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>硬上限</th><th>云璟（可售 320 间）对应值</th><th>说明</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">1</td><td>超售间数不超过可售房量的 <b>5%</b></td><td>320 × 5% = <b>16 间</b></td><td>随可售房量变动。若当日 OOO 8 间（可售 312），则为 312 × 5% = 15.6 → 比较时取 15.6</td></tr>\n        <tr><td class=\"num\">2</td><td>超售间数不超过 <b>15 间</b></td><td><b>15 间</b></td><td>绝对值上限，与房量无关。这一条在云璟（320 间）比第 1 条更紧，<b>实际起作用的通常是这一条</b></td></tr>\n        <tr><td class=\"num\">3</td><td>步行距离 30 分钟内无同档次备用酒店时，<b>超售率减半</b></td><td>按实际备用酒店情况判定</td><td><b>注意是「超售率减半」，不是「超售间数减半」</b>。减半发生在<b>修正后的超售率</b>上，然后重新计算间数并向下取整</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">第三步的三条顺序：先减半，再比大小，最后向下取整</span>\n    <p>完整的计算顺序是：<br>\n    <b>①</b> 若 30 分钟内无同档备用酒店 → 修正后超售率 × 0.5，得到最终超售率；<br>\n    <b>②</b> 超售间数（未取整）= 可售房量 × 最终超售率；<br>\n    <b>③</b> 取硬上限：min(未取整值, 可售房量 × 5%, 15)；<br>\n    <b>④</b> <b>最后一步才向下取整</b>。<br>\n    <b>顺序错了结果就错。</b>若先取整再比大小，会得到偏大的结果。</p>\n  </div>\n\n  <h3>5.1 什么时候需要查表 E</h3>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">表 E 只在表 B 的两行里被调用</span>\n    <p>回到表 B 的「超额预订」列：<br>\n    ≥95% → <b>不超售</b>（超售上限 0，不查表 E）<br>\n    90–95% → <b>≤2 间</b>（直接取 2，不查表 E）<br>\n    <b>85–90% → 按表 E</b><br>\n    <b>70–85% → 按表 E</b><br>\n    &lt;70% → <b>不超售</b>（超售上限 0，不查表 E）<br>\n    <b>判断顺序：先看表 B 的那一行怎么写的，只有写着「按表 E」才去算。</b>很多新人一上来就套表 E，在 ≥95% 的峰值日算出 8 间超售，这是严重错误。</p>\n  </div>\n\n  <h2 id=\"s6\">六、四个完整超售计算案例（一步步走完三步法）</h2>\n\n  <\!-- 案例 1 -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">①</span>案例 ① · 平峰周三：常规商务客，无修正系数命中</div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">目标日</div><div class=\"kv-v\">11 月 12 日（周三，D3 平峰日），可售房量 312 间（总房量 320 − OOO 8）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">预测 OCC</div><div class=\"kv-v\">75.0% → 表 B 落「<b>70–85%</b>」行 → 超额预订列写「<b>按表 E</b>」→ 需要计算</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">历史参数</div><div class=\"kv-v\">No-show 率 + 24h 内取消率合计 = <b>14%</b>；担保预订占比 45%；会议团队占当日 18%；协议客户集中度 38%</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">备用酒店</div><div class=\"kv-v\">步行 30 分钟内有同档次备用酒店 = <b>是</b></div></div>\n    </div>\n    <div class=\"formula\">\n      <span class=\"f-label\">第一步 · 基准超售率</span>\n      14% 落在「10–15%」档（10.0% ≤ 14% &lt; 15.0%）→ 基准超售率 = <b>3%</b><br><br>\n      <span class=\"f-label\">第二步 · 修正系数（逐条核对）</span>\n      D1 峰值日 / D2 高涨日？<b>否</b>（D3 平峰日）→ × 1<br>\n      担保预订占比 45% &gt; 60%？<b>否</b> → × 1<br>\n      会议团队占当日 18% &gt; 40%？<b>否</b> → × 1<br>\n      协议客户集中度 38% &gt; 50%？<b>否</b> → × 1<br>\n      修正后超售率 = 3% × 1 = <b>3%</b><br><br>\n      <span class=\"f-label\">第三步 · 硬上限</span>\n      有备用酒店 → 超售率不减半，最终超售率 = <b>3%</b><br>\n      超售间数（未取整）= 312 × 3% = <b>9.36</b><br>\n      硬上限①：312 × 5% = <b>15.6</b>　硬上限②：<b>15</b><br>\n      取 min(9.36, 15.6, 15) = <b>9.36</b><br>\n      向下取整 → <span class=\"f-out\">9 间</span><br>\n      <span class=\"f-label\">结论</span>\n      11 月 12 日超售上限 = <span class=\"f-out\">9 间</span>（无需 L3 审批，需 L2 复核）\n    </div>\n  </div>\n\n  <\!-- 案例 2 -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">②</span>案例 ② · 展会周边 D2 日：三个 ×0.5 全命中</div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">目标日</div><div class=\"kv-v\">9 月 25 日（周四，<b>D2 高涨日</b>，云栖大会周边日），可售房量 320 间（OOO 0）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">预测 OCC</div><div class=\"kv-v\">87.3% → 表 B 落「<b>85–90%</b>」行 → 超额预订列写「<b>按表 E</b>」→ 需要计算</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">历史参数</div><div class=\"kv-v\">No-show 率 + 24h 内取消率合计 = <b>22%</b>；担保预订占比 68%；会议团队占当日 42%；协议客户集中度 35%</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">备用酒店</div><div class=\"kv-v\">步行 30 分钟内有同档次备用酒店 = <b>是</b>（但展会期间备用酒店自身余量极少，需在备注注明）</div></div>\n    </div>\n    <div class=\"formula\">\n      <span class=\"f-label\">第一步 · 基准超售率</span>\n      22% 落在「20–30%」档（20.0% ≤ 22% &lt; 30.0%）→ 基准超售率 = <b>7%</b><br><br>\n      <span class=\"f-label\">第二步 · 修正系数（逐条核对）</span>\n      D1 峰值日 / D2 高涨日？<b>是（D2）</b> → <b>× 0.5</b><br>\n      担保预订占比 68% &gt; 60%？<b>是</b> → <b>× 0.5</b><br>\n      会议团队占当日 42% &gt; 40%？<b>是</b> → <b>× 0.5</b><br>\n      协议客户集中度 35% &gt; 50%？<b>否</b> → × 1<br>\n      修正后超售率 = 7% × 0.5 × 0.5 × 0.5 = 7% × 0.125 = <b>0.875%</b><br><br>\n      <span class=\"f-label\">第三步 · 硬上限</span>\n      有备用酒店 → 不减半，最终超售率 = <b>0.875%</b><br>\n      超售间数（未取整）= 320 × 0.875% = <b>2.80</b><br>\n      硬上限①：320 × 5% = <b>16</b>　硬上限②：<b>15</b><br>\n      取 min(2.80, 16, 15) = <b>2.80</b><br>\n      向下取整 → <span class=\"f-out\">2 间</span><br>\n      <span class=\"f-label\">结论</span>\n      9 月 25 日超售上限 = <span class=\"f-out\">2 间</span>\n    </div>\n    <div class=\"callout callout-warn\">\n      <span class=\"co-t\">本例的教学重点：7% 的基准超售率，最后只剩 2 间</span>\n      <p>基准 7% 按 320 间算本来是 22.4 间，被三个 ×0.5 一路砍到 0.875%，只剩 2 间。<br>\n      <b>这正是表 E 想要的结果：</b>展会日 + 担保客多 + 有大团队 = 「需求旺盛、客人靠谱、但一旦出事就是整块出事」。<br>\n      此时超售的期望收益（多卖 20 间 × 均价 ¥900 = ¥18,000）远低于期望损失（若送走 5 个客人：房费差价 + 交通 + 升级补偿 + 积分 + 差评 ≈ ¥15,000，外加团队客户流失风险）。<br>\n      <b>所以宁可少卖，不可超卖。</b></p>\n    </div>\n  </div>\n\n  <\!-- 案例 3 -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">③</span>案例 ③ · 国庆 D1 峰值日：三重约束叠加，结果为 0</div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">目标日</div><div class=\"kv-v\">10 月 3 日（<b>D1 峰值日</b>，国庆假期第 3 天），可售房量 320 间（OOO 0）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">预测 OCC</div><div class=\"kv-v\">96.6% → 表 B 落「<b>≥95%</b>」行 → 超额预订列写「<b>不超售</b>」</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">历史参数</div><div class=\"kv-v\">No-show 率 + 24h 内取消率合计 = <b>6%</b>；担保预订占比 75%；会议团队占当日 10%；协议客户集中度 55%</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">备用酒店</div><div class=\"kv-v\">步行 30 分钟内有同档次备用酒店 = <b>否</b>（国庆期间周边同档酒店全部满房）</div></div>\n    </div>\n    <div class=\"formula\">\n      <span class=\"f-label\">先查表 B</span>\n      预测 OCC 96.6% ≥ 95% → 表 B「≥95%」行 → 超额预订列 = <b>不超售</b><br>\n      <b>严格来说，此时已不需要查表 E。</b>下面仍走一遍，用于演示「无备用酒店时超售率减半」这条规则的用法：<br><br>\n      <span class=\"f-label\">第一步 · 基准超售率</span>\n      6% 落在「5–10%」档 → 基准超售率 = <b>2%</b><br><br>\n      <span class=\"f-label\">第二步 · 修正系数</span>\n      D1 峰值日？<b>是</b> → <b>× 0.5</b><br>\n      担保预订占比 75% &gt; 60%？<b>是</b> → <b>× 0.5</b><br>\n      会议团队 10% &gt; 40%？<b>否</b> → × 1<br>\n      协议客户集中度 55% &gt; 50%？<b>是</b> → <b>× 0.8</b><br>\n      修正后超售率 = 2% × 0.5 × 0.5 × 0.8 = <b>0.4%</b><br><br>\n      <span class=\"f-label\">第三步 · 硬上限</span>\n      <b>步行 30 分钟内无同档次备用酒店 → 超售率减半</b>：0.4% × 0.5 = <b>0.2%</b><br>\n      超售间数（未取整）= 320 × 0.2% = <b>0.64</b><br>\n      硬上限①：16　硬上限②：15<br>\n      取 min(0.64, 16, 15) = 0.64<br>\n      向下取整 → <b>0 间</b><br>\n      <span class=\"f-label\">结论</span>\n      10 月 3 日超售上限 = <span class=\"f-out\">0 间</span>\n    </div>\n    <div class=\"callout callout-danger\">\n      <span class=\"co-t\">本例有三重独立的约束，任何一条单独就能把结果压到 0</span>\n      <p>① <b>表 B「≥95%」行直接规定「不超售」</b>——这是最硬的一条，根本不需要算；<br>\n      ② <b>无备用酒店 → 超售率减半</b>；<br>\n      ③ <b>向下取整</b>把 0.64 变 0。<br>\n      三条叠加，结果必然是 0。<b>教学要点：查表顺序永远是「先查表 B 定要不要超售，再查表 E 定超多少」。顺序反了就会算出荒谬的结果。</b></p>\n    </div>\n  </div>\n\n  <\!-- 案例 4 -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">④</span>案例 ④ · No-show 高企的平峰日：触发 10% 档与 L3 审批</div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">目标日</div><div class=\"kv-v\">6 月 18 日（周三，D3 平峰日），可售房量 312 间（总房量 320 − OOO 8）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">预测 OCC</div><div class=\"kv-v\">72.4% → 表 B 落「<b>70–85%</b>」行 → 超额预订列写「<b>按表 E</b>」→ 需要计算</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">历史参数</div><div class=\"kv-v\">No-show 率 + 24h 内取消率合计 = <b>33%</b>；担保预订占比 30%；会议团队占当日 12%；协议客户集中度 28%</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">备用酒店</div><div class=\"kv-v\">步行 30 分钟内有同档次备用酒店 = <b>是</b></div></div>\n    </div>\n    <div class=\"formula\">\n      <span class=\"f-label\">第一步 · 基准超售率</span>\n      33% ≥ 30% → 落「&gt;30%」档 → 基准超售率 = <b>10%</b>　<span class=\"pill pill-red\">需 L3 经理审批</span><br><br>\n      <span class=\"f-label\">第二步 · 修正系数</span>\n      D1 / D2 日？<b>否</b> → × 1<br>\n      担保预订占比 30% &gt; 60%？<b>否</b> → × 1<br>\n      会议团队 12% &gt; 40%？<b>否</b> → × 1<br>\n      协议客户集中度 28% &gt; 50%？<b>否</b> → × 1<br>\n      修正后超售率 = <b>10%</b>（无任何修正）<br><br>\n      <span class=\"f-label\">第三步 · 硬上限</span>\n      有备用酒店 → 不减半，最终超售率 = <b>10%</b><br>\n      超售间数（未取整）= 312 × 10% = <b>31.2</b><br>\n      硬上限①：312 × 5% = <b>15.6</b>　硬上限②：<b>15</b><br>\n      取 min(31.2, 15.6, 15) = <b>15</b>　← <b>硬上限②（15 间）起作用</b><br>\n      向下取整 → <span class=\"f-out\">15 间</span><br>\n      <span class=\"f-label\">结论</span>\n      6 月 18 日超售上限 = <span class=\"f-out\">15 间</span>（受硬上限封顶；需 L3 审批）\n    </div>\n    <div class=\"callout callout-warn\">\n      <span class=\"co-t\">本例的两个教学点</span>\n      <p><b>① 硬上限是「天花板」，不是「目标值」。</b>算出的 31.2 间被 15 间的绝对上限压到 15 间。此时必须清醒：<b>还有 16.2 间的 No-show 风险没有被覆盖</b>。这不是计算错误，而是《法典》的<b>风险容忍上限</b>——超过 15 间，一旦失败就是一次送走十几个人，代价不可接受。<br>\n      <b>此时应改用非超售手段承接风险：</b>提高担保预订占比（预售/预付产品）、收紧取消政策、对非担保订单做 24h 前外呼确认。<br>\n      <b>② No-show + 取消合计 33% 本身就是一个警报。</b>正常情况下这个数应在 10–20%。33% 说明取消政策过松或存在大量无效占位订单，应专项排查（是否渠道超售？是否有恶意占位？），而不是靠超售去对冲。</p>\n    </div>\n  </div>\n\n  <h3>6.1 四案例汇总对照</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 7-7　四个超售案例汇总对照<span class=\"cap-note\">注意「最后起作用的是哪条约束」这一列</span></caption>\n      <thead><tr><th>案例</th><th>目标日</th><th>表 B 行</th><th>基准率</th><th>修正系数</th><th>修正后</th><th class=\"num\">未取整</th><th>起作用的上限</th><th class=\"num\">结果</th></tr></thead>\n      <tbody>\n        <tr><td>①</td><td>11/12 D3</td><td>70–85%</td><td>3%</td><td>无（×1）</td><td>3%</td><td class=\"num\">9.36</td><td>无（未触及）</td><td class=\"num\"><b>9 间</b></td></tr>\n        <tr><td>②</td><td>9/25 D2</td><td>85–90%</td><td>7%</td><td>×0.5 ×0.5 ×0.5</td><td>0.875%</td><td class=\"num\">2.80</td><td>无（未触及）</td><td class=\"num\"><b>2 间</b></td></tr>\n        <tr><td>③</td><td>10/3 D1</td><td>≥95%</td><td>2%</td><td>×0.5 ×0.5 ×0.8</td><td>0.4% → 减半 0.2%</td><td class=\"num\">0.64</td><td>表 B「不超售」+ 无备用酒店减半</td><td class=\"num\"><b>0 间</b></td></tr>\n        <tr><td>④</td><td>6/18 D3</td><td>70–85%</td><td>10%</td><td>无（×1）</td><td>10%</td><td class=\"num\">31.2</td><td><b>硬上限② 15 间</b></td><td class=\"num\"><b>15 间</b></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h2 id=\"s7\">七、超售的落地：房型级分配与三项配套准备</h2>\n\n  <h3>7.1 房型级分配（不能只设总数）</h3>\n\n  <p>超售上限是一个总数，但系统里必须<b>按房型设置</b>。两条分配规则：</p>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">规则 1 · 套房不参与超售</span>\n    <p>云璟的 STE-B（商务套房，8 间）与 STE-E（行政套房，2 间）<b>不参与超售分配</b>。<br>\n    理由：① 套房间数极少（合计 10 间，占 3.1%），超售的统计意义不大；② 超售失败时，<b>套房客人是最难送走的</b>——你把付 ¥1,280 的套房客送到别的酒店，补偿成本与客诉烈度都远高于标准房客。<br>\n    <b>分配基数 = 总房量 − 套房间数 = 320 − 10 = 310 间。</b></p>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">规则 2 · 按比例分配 + 最大余数法补齐</span>\n    <p>① 各房型配额（未取整）= 该房型间数 ÷ 分配基数 × 超售总数<br>\n    ② 先<b>向下取整</b>分配给每个房型<br>\n    ③ 把剩余名额按<b>小数部分从大到小</b>依次 +1，直到分完（最大余数法）</p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 7-8　案例 ①（超售 9 间）的房型级分配<span class=\"cap-note\">分配基数 310 间（320 − 套房 10）</span></caption>\n      <thead><tr><th>房型代码</th><th>房型名称</th><th class=\"num\">间数</th><th class=\"num\">配额（未取整）</th><th class=\"num\">取整</th><th class=\"num\">余数</th><th class=\"num\">最终配额</th></tr></thead>\n      <tbody>\n        <tr><td><code>STD-K</code></td><td>标准大床房</td><td class=\"num\">70</td><td class=\"num\">2.032</td><td class=\"num\">2</td><td class=\"num\">.032</td><td class=\"num\"><b>2</b></td></tr>\n        <tr><td><code>STD-T</code></td><td>标准双床房</td><td class=\"num\">50</td><td class=\"num\">1.452</td><td class=\"num\">1</td><td class=\"num\">.452</td><td class=\"num\"><b>2</b> ← 余数第 3</td></tr>\n        <tr><td><code>SUP-K</code></td><td>高级大床房</td><td clas
