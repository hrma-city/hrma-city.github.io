desc": "", "html": "<h4>定价格动作：按 3 &gt; 4 &gt; 6 的顺序，取第一个「非维持」的动作</h4>\n    <p>① 看表 A：若表 A 动作 ≠ 维持 → <b>执行表 A，结束</b>；<br>\n    ② 若表 A = 维持 → 顺延看表 C：若表 C 动作 ≠ 维持 → <b>执行表 C，结束</b>；<br>\n    ③ 若表 C = 维持 → 顺延看表 D：若表 D 的价格动作（降价 5% / 降价 10%）存在 → <b>执行表 D 的价格动作</b>；<br>\n    ④ 若三者都是维持 → <b>本日无价格动作</b>，台账写「维持」。<br>\n    <b>注意：这里说的「表 D 的价格动作」要先把表 D 的组合包拆开（见 7.1 节），只取其中的价格部分参与仲裁。</b></p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">5</div><div class=\"step-body\">\n    "}, {"id": "p5", "name": "记备注：按三段式写入《调价台账》", "min": 8, "desc": "", "html": "<h4>记备注：按三段式写入《调价台账》</h4>\n    <p><b>第一段 · 冲突与仲裁：</b>写明查过哪几张表、各自给什么动作、按表 O 执行了哪一条、被搁置的动作写进《观察清单》。<br>\n    <b>第二段 · 约束与限制：</b>写明触及的约束（表 A 的五条、表 C 的三条等）。<br>\n    <b>第三段 · 关联动作：</b>写明同步执行的非价格动作与后续跟踪事项。<br>\n    <b>铁律 3 要求这一步必须做，不做等于仲裁没发生。</b></p>\n  </div></div>\n\n  <h2 id=\"s11\">十一、三类典型冲突的处理范式</h2>\n\n  <h3>11.1 范式一：表 A 与表 C 冲突（同方向，不同幅度）</h3>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">规则：只执行表 A，表 C 不叠加</span>\n    <p>《SPEC》表 C 执行约束原文明确写了「<b>不得与表 A 结论叠加执行，同日只执行优先级更高的一条，优先级：表 A &gt; 表 C</b>」。<br>\n    <b>不管同向还是反向，表 A 一旦有动作，表 C 就不执行。</b><br>\n    <b>示例：</b>表 A 给 ↑20%，表 C 给 ↑3% → 只执行 ↑20%。若叠加成 ↑23%，会突破表 A 约束 1（单日同方向累计 ≤20%）。<br>\n    <b>示例（反向）：</b>表 A 给 ↓15%，表 C 给 ↑5% → 只执行 ↓15%。表 C 的 ↑5% 写入《观察清单》。<br>\n    <b>反向冲突要额外做的事：</b>在台账备注中标记「表 A 与表 C 反向冲突」。若连续 3 天出现反向冲突，说明本店价格与市场定位背离，需上报 L3 做专项诊断。</p>\n  </div>\n\n  <h3>11.2 范式二：表 C 与表 D 反向冲突（组合 4「双输」专属）</h3>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">规则：执行表 C，但必须加设保护条款</span>\n    <p>表 C（4）&gt; 表 D（6），所以价格动作执行表 C。<b>但「双输」组合（低 MPI + 低 ARI）下，表 C 往往是提价，而表 D 是降价，方向完全相反。</b><br>\n    此时不能机械地执行完就完事，必须加三条保护：<br>\n    ① <b>写保护条款</b>：台账备注写明「若 N 天内 MPI 继续下滑 &gt;5 个百分点，立即回退并改走表 D」；<br>\n    ② <b>同步启动非价格诊断</b>：跑 OTA 排名优化 10 项 + 核查表 L「竞对新开业」；<br>\n    ③ <b>执行表 D 的非价格动作</b>（全员直销动员 / 48 小时复盘 / 增加 OTA 投放）照常做，一个不落。<br>\n    <b>根本原因：价格已经低于市场还抢不到客人，病根不在价格上。表 O 让你执行表 C，是为了防止你越降越糟；但真正的解法在表 O 之外。</b></p>\n  </div>\n\n  <h3>11.3 范式三：表 L 触发（覆盖一切）</h3>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">规则：表 L 一旦触发，其余全部让位，且必须先查表 L</span>\n    <p><b>顺序要求：08:30 查表环节的第 0 步是核查表 L，不是第 1 步。</b><br>\n    <b>五类表 L 事件的立即动作（2 小时内）：</b></p>\n    <div class=\"tbl-wrap\" style=\"margin-top:8px\">\n      <table class=\"tbl\">\n        <caption>表 9-15　表 L 五类事件与仲裁影响</caption>\n        <thead><tr><th>事件</th><th>判定信号</th><th>立即动作（2 小时内）</th><th>对其他表的压制</th></tr></thead>\n        <tbody>\n          <tr><td>需求暴跌</td><td>48h Pickup 落后 &gt;40%</td><td>降价 15%、全开渠道、启动直销外呼</td><td><b>压过表 A / 表 C / 表 D 的全部价格动作</b>（优先级 1 &gt; 3/4/6）</td></tr>\n          <tr><td>需求暴涨</td><td>24h Pickup 领先 &gt;60%</td><td>提价 20%、设 MinLOS 2、关低价渠道</td><td><b>压过表 A（同向也不叠加）</b>；其「设 MinLOS 2」「关低价渠道」属库存/渠道动作，与表 B / 表 H 同类时以表 L 为准</td></tr>\n          <tr><td>竞对新开业</td><td>3km 内新增同档酒店</td><td>采集其价格加入比价表、评估 ARI</td><td>不压价格动作，但<b>改变表 C 的输入</b>（新竞对先入比价表，够格后再入竞争组合）</td></tr>\n          <tr><td>系统故障</td><td>渠道无订单 &gt;2h</td><td>切手动模式、通知渠道经理</td><td>暂停一切自动动作，转入人工</td></tr>\n          <tr><td>超售过度</td><td>到店无房</td><td>启动《步行客人预案》</td><td><b>压过一切</b>，转入 M07 第 10 节流程</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <p style=\"margin-top:8px\"><b>示例：</b>某日表 A 给出 ↓15%（因 Pickup 落后 12%），同时 48h Pickup 落后 45%（表 L 需求暴跌）。<br>\n    <b>处理：按表 L 执行「降价 15% + 全开渠道 + 启动直销外呼」，表 A 的 ↓15% 不单独执行（被表 L 覆盖）。</b>台账触发表编号填「<b>表 L</b>」，备注写明「表 A 的 ↓15% 被表 L 需求暴跌动作覆盖，不重复执行」。</p>\n  </div>\n\n  <\!-- ================= 十二 ================= -->\n  <h2 id=\"s12\">十二、讲师示范 ①：一次完整的每日三维诊断</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>示范 ①　11 月 12 日（周四 · D3 平峰日）08:10–08:30</div>\n\n    <h4>第 1 步 · 08:10–08:30 采集比价（五同全部锁定）</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">五同</div><div class=\"kv-v\">同入住日 11-12；同房型 SUP-K 同档位；同含早（不含早）；同取消政策（免费取消）；同提前天数（15 天）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">采集结果</div><div class=\"kv-v\">A ¥680（08:12）/ B ¥720（08:14）/ C ¥560（08:16）/ D ¥880（08:19）/ E ¥620（08:21）；5 家均未售罄</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">组合加权 ADR</div><div class=\"kv-v\">963,200 ÷ 1,370 = <b>¥703.1</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">组合加权 OCC</div><div class=\"kv-v\">100,880 ÷ 1,370 = <b>73.6%</b></div></div>\n    </div>\n\n    "}, {"id": "p6", "name": "第 2 步 · 算本店的两个输入与三个指数", "min": 8, "desc": "", "html": "<h4>第 2 步 · 算本店的两个输入与三个指数</h4>\n    <div class=\"formula\">\n      <span class=\"f-label\">本店输入</span>\n      可售房晚 320（OOO 0）；当前在手 240；去年同期同窗口在手 256；预测增量 0（已在手即最终预测）<br>\n      预测 OCC = 240 ÷ 320 × 100% = <b>75.0%</b><br>\n      Pickup 偏差 =（240 − 256）÷ 256 × 100% = <b>落后 6.3%</b><br>\n      当前 SUP-K/SUP-T BAR = <b>¥680</b>（平峰 BAR）<br><br>\n      <span class=\"f-label\">三个指数</span>\n      MPI = 75.0 ÷ 73.6 × 100 = <b>101.9</b><br>\n      ARI = 680 ÷ 703.1 × 100 = <b>96.7</b><br>\n      RGI = 101.9 × 96.7 ÷ 100 = <b>98.5</b><br>\n      <span class=\"f-label\">恒等式自检</span>\n      直接算：本店 RevPAR = 75.0% × 680 = ¥510.0；组合 RevPAR = 73.6% × 703.1 = ¥517.5<br>\n      RGI（直接）= 510.0 ÷ 517.5 × 100 = <b>98.6</b><br>\n      |98.6 − 98.5| = 0.1 ≤ 0.2 ✓ <span class=\"f-out\">通过</span>\n    </div>\n\n    "}, {"id": "p7", "name": "第 3 步 · 查五张表", "min": 8, "desc": "", "html": "<h4>第 3 步 · 查五张表</h4>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 9-16　示范 ① 的五表结论</caption>\n        <thead><tr><th>表</th><th>优先级</th><th>输入</th><th>档位</th><th>结论动作</th><th>动作类别</th></tr></thead>\n        <tbody>\n          <tr><td><b>表 L</b></td><td class=\"num\">1</td><td>48h Pickup 落后 12.0%</td><td>未达 &gt;40% 阈值</td><td><b>未触发</b></td><td>—</td></tr>\n          <tr><td><b>表 B</b></td><td class=\"num\">2</td><td>预测 OCC 75.0%</td><td>70–85% 行</td><td>MinLOS 1 晚（清空）/ CTA 否 / 低价渠道全开 / 超售按表 E</td><td>库存类</td></tr>\n          <tr><td><b>表 A</b></td><td class=\"num\">3</td><td>75.0% × 落后 6.3%</td><td>70–85% × 落后 3–10%</td><td><span class=\"down\">↓3%</span></td><td><b>价格类</b></td></tr>\n          <tr><td><b>表 C</b></td><td class=\"num\">4</td><td>ARI 96.7</td><td>90–97 略低</td><td>预测 OCC 75.0% &lt; 80% → <b>维持</b></td><td>价格类</td></tr>\n          <tr><td><b>表 H</b></td><td class=\"num\">5</td><td>预测 OCC 75.0%</td><td>70–85% 行</td><td>OTA 国内全开 / OTA 国际全开 / GDS 开 / 批发商限价开 ≤¥660×75% = ¥495 / 直销全开 + 早鸟</td><td>渠道类</td></tr>\n          <tr><td><b>表 D</b></td><td class=\"num\">6</td><td>MPI 101.9</td><td>100–110 健康</td><td><b>维持</b></td><td>价格类（维持）</td></tr>\n        </tbody>\n      </table>\n    </div>\n\n    <h4>第 4 步 · 按表 O 仲裁</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">表 L</div><div class=\"kv-v\">未触发 → 不压制任何表</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">分类</div><div class=\"kv-v\"><b>价格类：</b>表 A ↓3%、表 C 维持、表 D 维持。<b>库存类：</b>表 B 四项。<b>渠道类：</b>表 H 五项。<b>非价格动作：</b>本日无。</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">定价格动作</div><div class=\"kv-v\">表 A（3）动作 = ↓3% ≠ 维持 → <b>执行表 A 的 ↓3%，结束</b>。表 C 与表 D 均为维持，无需顺延，写入《观察清单》</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">执行新价</div><div class=\"kv-v\">新 SUP BAR = 680 × 0.97 = 659.6 → <b>¥660</b>；7 档房型整表同步 ↓3%</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">库存 / 渠道</div><div class=\"kv-v\"><b>表 B 四项与表 H 五项全部执行</b>（不与价格类冲突）。超售走表 E：No-show+取消 8%、无修正条件 → 基准 2%，320 × 2% = 6.4 → <b>6 间</b></div></div>\n    </div>\n\n    <h4>第 5 步 · 三角诊断与台账</h4>\n    <div class=\"callout callout-do\">\n      <span class=\"co-t\">三角诊断结论</span>\n      <p><b>MPI 101.9（健康）× ARI 96.7（略低）→ RGI 98.5</b> → 落入表 9-12 的<b>「组合 6 · 份额稳·价略低」</b>（100–110 × 90–97 格）。<br>\n      <b>诊断：</b>份额健康但没到领先，价格略低于组合。RevPAR 略输给组合（RGI 98.5 &lt; 100）。<br>\n      <b>处方：</b>表 C 本档要求「预测 OCC ≥80% 才提 3%」，本例 75.0% &lt; 80% → <b>不提价</b>。真正的动作来自表 A（因 Pickup 落后 6.3% 下调 3%）。<br>\n      <b>注意这里的一个细节：表 A 让降价，而 ARI 已经略低——降价会让 ARI 进一步降到 660 ÷ 703.1 × 100 = 93.9。</b>这会不会让表 C 下次给出提价动作？<b>会，但那是以后的事。</b>表 O 的规则是「同日只执行最高优先级的一条」——今天执行表 A，明天表 C 若给出提价，明天的台账里再仲裁一次。<b>不要试图一次性把未来几天的账都算平。</b></p>\n    </div>\n\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 9-17　示范 ① 的台账备注（三段式实填）</caption>\n        <thead><tr><th>段落</th><th>内容</th></tr></thead>\n        <tbody>\n          <tr><td><b>第一段<br>冲突与仲裁</b></td><td>查过表 A / 表 B / 表 C / 表 D / 表 H，另核查表 L 未触发（48h Pickup 落后 12.0%，未达 &gt;40%）。价格类：表 A ↓3%（优先级 3）、表 C 维持（4）、表 D 维持（6）→ 按表 O 只执行表 A 的 ↓3%；表 C、表 D 结论写入《观察清单》。</td></tr>\n          <tr><td><b>第二段<br>约束与限制</b></td><td>表 A 五条约束全部通过（累计 ↓3% ≤20%；近 24h 第 1 次；3% ≥3%；09:10 落位→09:40 核查；非 D1 无需 L3）。表 C 本周调整次数 0，未触及「每周 ≤2 次」约束。新价 ¥660 仍在 D3 系数区间（95–110%，即 ¥646–¥748）内。</td></tr>\n          <tr><td><b>第三段<br>关联动作</b></td><td>同步执行表 B 四项（MinLOS 清空 / CTA 否 / 低价渠道全开 / 超售上限 6 间）与表 H 五项（批发商限价 ≤¥495、直销上早鸟、其余全开）。三角诊断：MPI 101.9 × ARI 96.7 → RGI 98.5，属「份额稳·价略低」组合，本日不提价（预测 OCC 75.0% &lt; 80%）。</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n\n  <\!-- ================= 十三 ================= -->\n  <h2 id=\"s13\">十三、讲师示范 ②：四表冲突的仲裁全过程</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>示范 ②　1 月 14 日（周二 · D4 低谷日）· 表 C 与表 D 反向冲突</div>\n\n    <h4>已知条件（08:30 全部就位）</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">本店</div><div class=\"kv-v\">预测 OCC 37.5%（可售 320、在手 96、去年同窗口 120、预测增量 24）；SUP BAR ¥520；48h Pickup 落后 18.0%</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">竞争组合</div><div class=\"kv-v\">加权 ADR <b>¥682.9</b>；加权 OCC <b>53.8%</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">算指数</div><div class=\"kv-v\">MPI = 37.5 ÷ 53.8 × 100 = <b>69.7</b>；ARI = 520 ÷ 682.9 × 100 = <b>76.1</b>；RGI = 69.7 × 76.1 ÷ 100 = <b>53.0</b></div></div>\n    </div>\n\n    <div class=\"callout callout-danger\">\n      <span class=\"co-t\">注意：本例的 MPI 69.7 与 ARI 76.1 都跌破了组合 4 示例中的数值，属于「双输」的重症</span>\n      <p>表 D：MPI 69.7 &lt; 85 → <b>严重落后</b> → 启动 L2-E1：降价 10% + 全员直销动员 + 48 小时复盘<br>\n      表 C：ARI 76.1 &lt; 80 → <b>严重偏低</b> → <b>提 8%</b>，并核查房型配置与含早策略<br>\n      <b>两表方向完全相反：一个降 10%，一个提 8%。</b></p>\n    </div>\n\n    <h4>五张表的结论</h4>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 9-18　示范 ② 的五表结论</caption>\n        <thead><tr><th>表</th><th>优先级</th><th>输入</th><th>档位</th><th>结论动作</th><th>类别</th></tr></thead>\n        <tbody>\n          <tr><td><b>表 L</b></td><td class=\"num\">1</td><td>48h Pickup 落后 18.0%</td><td>未达 &gt;40%</td><td><b>未触发</b>（但需备注）</td><td>—</td></tr>\n          <tr><td><b>表 B</b></td><td class=\"num\">2</td><td>预测 OCC 37.5%</td><td>&lt;40% → &lt;70% 行</td><td>MinLOS 不设限 / CTA 否 / 低价渠道全开 + 上促销 / 不超售</td><td>库存类</td></tr>\n          <tr><td><b>表 A</b></td><td class=\"num\">3</td><td>37.5% × 落后 20.0%</td><td>&lt;40% × 落后 &gt;10%</td><td><span class=\"down\">↓20%</span></td><td><b>价格类</b></td></tr>\n          <tr><td><b>表 C</b></td><td class=\"num\">4</td><td>ARI 76.1</td><td>&lt;80 严重偏低</td><td><span class=\"up\">↑8%</span> + 核查房型配置与含早策略</td><td><b>价格类（反向）</b></td></tr>\n          <tr><td><b>表 H</b></td><td class=\"num\">5</td><td>预测 OCC 37.5%</td><td>&lt;55% 行</td><td>OTA 国内全开+深折 / OTA 国际全开 / GDS 开+商务套餐 / 批发商开+打包产品 / 直销全开+长住团购</td><td>渠道类</td></tr>\n          <tr><td><b>表 D</b></td><td class=\"num\">6</td><td>MPI 69.7</td><td>&lt;85 严重落后</td><td>降价 10% + 全员直销动员 + 48 小时复盘</td><td>价格类 + 非价格动作</td></tr>\n        </tbody>\n      </table>\n    </div>\n\n    <h4>仲裁过程（按五步法）</h4>\n    <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n      <h4>列全</h4>\n      <p>表 A ↓20% / 表 B 四项 / 表 C ↑8% / 表 D 降价 10% + 两个非价格动作 / 表 H 五项；表 L 未触发。</p>\n    </div></div>\n\n    <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n      <h4>查表 L</h4>\n      <p>48h Pickup 落后 18.0%，<b>未达表 L「需求暴跌」的 &gt;40% 阈值 → 不触发</b>。<br>\n      <b>但必须在台账备注写明这个核查</b>——因为新价将低于 D4 系数下限（见下），日后复盘时需要知道「当时核查过表 L，结论是不触发」。</p>\n    </div></div>\n\n    <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n      <h4>分类</h4>\n      <p><b>价格类：</b>表 A ↓20%（3）、表 C ↑8%（4）、表 D 降价 10%（6）→ <b>三表反向冲突</b>。<br>\n      <b>库存类：</b>表 B 四项。<b>渠道类：</b>表 H 五项。<br>\n      <b>非价格动作：</b>表 D 的全员直销动员 + 48 小时复盘；表 C 的「核查房型配置与含早策略」。</p>\n    </div></div>\n\n    <div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n      <h4>定价格动作</h4>\n      <p>表 A（3）动作 = ↓20% ≠ 维持 → <b>执行表 A 的 ↓20%，结束</b>。<br>\n      表 C 的 ↑8% 与表 D 的降价 10% <b>均不执行</b>，写入《观察清单》。<br>\n      <b>新价 = 520 × 0.80 = ¥416。</b><br>\n      <b>约束校验：</b>① 累计 ↓20% = 上限（≤20% 含等号）✓；② 近 24h 第 1 次 ✓；③ 20% ≥ 3% ✓；④ 09:40 核查 ✓；⑤ 非 D1 无需 L3 ✓ → <b>全部通过</b>。</p>\n    </div></div>\n\n    <div class=\"step\"><div class=\"step-num\">5</div><div class=\"step-body\">\n      <h4>记备注</h4>\n      <p>三段式见下。注意第二段必须写<b>两条</b>约束相关信息：表 A 的 20% 上限，以及新价跌破 D4 系数下限。</p>\n    </div></div>\n\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 9-19　示范 ② 的台账备注（三段式实填）</caption>\n        <thead><tr><th>段落</th><th>内容</th></tr></thead>\n        <tbody>\n          <tr>\n            <td><b>第一段<br>冲突与仲裁</b></td>\n            <td>价格类三方冲突：表 A <span class=\"down\">↓20%</span>（优先级 3）、表 C <span class=\"up\">↑8%</span>（4）、表 D 降价 10%（6）。按表 O 只执行表 A 的 ↓20%；表 C 与表 D 的价格动作写入《观察清单》。<b>表 C 与表 D 方向相反（提价 vs 降价），已加设保护条款（见第三段）。</b>表 L 已核查未触发（48h Pickup 落后 18.0% &lt; 40%）。</td>\n          </tr>\n          <tr>\n            <td><b>第二段<br>约束与限制</b></td>\n            <td>① 表 A 五条约束全部通过；单日下调已达 20% 上限，<b>当日不再下调</b>。② <b>新价 ¥416 低于 D4 系数下限</b>（平峰 ¥680 × 70% = ¥476），说明需求显著偏离常规低谷节律；已核查表 L「需求暴跌」信号（阈值 48h Pickup 落后 &gt;40%），本例为 18.0%，<b>未触发</b>，继续按表 A 执行，不越级升级。次日若表 A 继续给出下调动作，须<b>先重新核查表 L</b>。</td>\n          </tr>\n          <tr>\n            <td><b>第三段<br>关联动作</b></td>\n            <td>① 同步执行表 B 四项（MinLOS 不设限 / CTA 否 / 低价渠道全开+上促销 / 不超售）与表 H 五项（&lt;55% 档全渠道配置，批发商开+打包产品，净价不得公开挂牌）。② <b>表 D 组合包中的「全员直销动员」与「48 小时复盘」为非价格动作，照常执行</b>，已列入《今日动作清单》。③ <b>表 C 的「核查房型配置与含早策略」为非价格动作，照常执行</b>，48 小时内产出核查记录。④ <b>保护条款：</b>三角诊断 MPI 69.7 × ARI 76.1 → RGI 53.0，属「双输」重症组合（病根不在价格）。执行表 A 降 20% 后，<b>7 天内若 MPI 跌破 65，立即上报 L3 并改走表 D 的降价路径</b>；同时启动 M08 第 11 节 OTA 排名优化 10 项与表 L「竞对新开业」排查（3km 内是否有新开同档酒店）。</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n\n    <div class=\"callout callout-gold\">\n      <span class=\"co-t\">本示范的三个教学点</span>\n      <p>① <b>三表反向冲突时，只执行最高优先级的表 A，不取中间值、不取平均、不「折中」。</b>折中是最糟糕的做法——它让三张表都失效，且无法复盘。<br>\n      ② <b>表 C 与表 D 的反向冲突是「双输」组合的标志。</b>遇到它，说明病根不在价格，必须同步启动非价格诊断，并在台账加设保护条款。<br>\n      ③ <b>「维持」不是动作。</b>若表 A 给出维持，就要顺延看表 C；表 C 维持再看表 D。本例表 A 直接给了 ↓20%，顺延机制没有触发，但机制本身要理解到位。</p>\n    </div>\n  </div>\n\n  <\!-- ================= 十四 ================= -->\n  <h2 id=\"s14\">十四、学员跟练（6 题，含 3 道多表冲突）</h2>\n\n  <p>要求：每题限时 12 分钟。<b>冲突题必须写出：分类 → 定价格动作 → 非价格动作清单 → 台账备注三段。</b></p>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 1 · 竞争组合选取</div>\n    <div class=\"q-b\">以下 4 家新酒店，请逐家用 5 条标准判断是否纳入云璟的竞争组合，并说明哪一条不过：<br>\n    ① 滨江智选假日：中端，180 间，1.8km，主打商务<br>\n    ② 钱塘江畔丽笙：高端全服务，420 间，3.5km，商务+会展+婚宴<br>\n    ③ 云璟酒店集团 · 杭州西湖店：中高端全服务，300 间，6.0km，商务+休闲<br>\n    ④ 滨江万豪万枫：中高端，260 间，2.8km，商务+会展+周末休闲（开业 45 天）</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 滨江智选假日：不纳入。</b><br>\n      标准 1（档次）：中端 vs 云璟中高端全服务 → <b>不过</b>（差一档以上）<br>\n      标准 3（房量）：180 间 &lt; 200 间下限 → <b>不过</b><br>\n      <b>两条不过，排除。</b>即便距离只有 1.8km 也不纳入——档次差一档会让组合均价被拉低，导致 ARI 虚高。<br><br>\n      <b>② 钱塘江畔丽笙：纳入（但需先踢出一家）。</b><br>\n      标准 1（档次）：高端 vs 中高端 → <b>差一档，但标准 1 允许「相邻一档但客源高度重叠」</b>；本店与它均争夺商务 + 会展客，客源高度重叠 → <b>通过</b><br>\n      标准 2（距离）：3.5km 在 3–5km 内 → 通过<br>\n      标准 3（房量）：420 间，<b>略超 400 间上限</b> → 属边缘情形。因其余四条全过，且 420 与上限 400 差距仅 5%，<b>可判通过，但须在季度复核记录中备注说明</b><br>\n      标准 4（客源）：商务 + 会展 + 婚宴，与本店重叠 2 类以上 → 通过<br>\n      标准 5（数量）：纳入后组合变 6 家，<b>仍在 4–6 家区间</b> → 通过<br>\n      <b>结论：纳入，组合变 6 家（已达上限）。若日后还有第 7 家够格，须先踢出一家最不相关的。</b><br><br>\n      <b>③ 云璟酒店集团 · 杭州西湖店：不纳入（一票否决）。</b><br>\n      <b>排除规则 1：本集团内部酒店不纳入</b>——集团内部有价格协调机制，纳入会形成自我参照。此规则优先于 5 条标准，<b>无须再评估其他条件</b>。<br>\n      （顺带一提，它距离 6.0km 也超出了 5km 的距离标准，双重不过。）<br><br>\n      <b>④ 滨江万豪万枫：暂不纳入，但纳入比价表。</b><br>\n      <b>排除规则 2：开业不足 90 天的新酒店暂不纳入。</b>本店开业 45 天，处于爬坡期，价格策略不稳（常见低价冲量），纳入会让组合均价失真。<br>\n      <b>但《法典》表 L「竞对新开业」分支要求：判定信号「3km 内新增同档酒店」→ 立即动作「采集其价格加入比价表、评估 ARI」。</b><br>\n      <b>所以正确做法：① 立即把它加入比价表（不进竞争组合）；② 每日采集其价格并评估对本店 ARI 的影响；③ 观察满 90 天后，在季度复核时用 5 条标准重新评估（本店 260 间 / 2.8km / 中高端 / 商务+会展+周末休闲，五条全过，届时大概率纳入，届时需踢出一家）。</b>\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 2 · 比价与三指数计算</div>\n    <div class=\"q-b\">目标日 2027-04-18（周六，D2 高涨日）。比价结果（五同已锁定，均不含早、免费取消、提前 21 天、SUP-K 同档位）：A ¥1,020 / B ¥1,080 / C ¥860 / D ¥1,320 / E ¥980；5 家当日 OCC：A 90% / B 88% / C 82% / D 80% / E 92%。本店：预测 OCC 86.0%，SUP BAR ¥1,020。<br>请：① 算组合加权 ADR 与加权 OCC；② 算 ARI / MPI / RGI；③ 跑恒等式自检；④ 查表 C 与表 D，写出各自档位与动作。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 组合加权值：</b><br>\n      加权 ADR =（280×1,020 + 240×1,080 + 300×860 + 350×1,320 + 200×980）÷ 1,370<br>\n      =（285,600 + 259,200 + 258,000 + 462,000 + 196,000）÷ 1,370<br>\n      = 1,460,800 ÷ 1,370 = <b>¥1,066.3</b><br>\n      加权 OCC =（280×90 + 240×88 + 300×82 + 350×80 + 200×92）÷ 1,370<br>\n      =（25,200 + 21,120 + 24,600 + 28,000 + 18,400）÷ 1,370<br>\n      = 117,320 ÷ 1,370 = <b>85.6%</b><br><br>\n      <b>② 三个指数：</b><br>\n      ARI = 1,020 ÷ 1,066.3 × 100 = <b>95.7</b><br>\n      MPI = 86.0 ÷ 85.6 × 100 = <b>100.5</b><br>\n      RGI = 100.5 × 95.7 ÷ 100 = <b>96.2</b><br><br>\n      <b>③ 恒等式自检：</b><br>\n      直接算：本店 RevPAR = 86.0% × 1,020 = ¥877.2；组合 RevPAR = 85.6% × 1,066.3 = ¥912.8<br>\n      RGI（直接）= 877.2 ÷ 912.8 × 100 = <b>96.1</b><br>\n      |96.1 − 96.2| = 0.1 ≤ 0.2 ✓ <b>通过</b><br><br>\n      <b>④ 表 C 与表 D：</b><br>\n      <b>表 C：</b>ARI 95.7 落「<b>90–97 略低</b>」→ 判据是预测 OCC：本例 86.0% ≥ 80% → 动作 = <span class=\"up\">↑3%</span><br>\n      新价 = 1,020 × 1.03 = <b>¥1,051</b>；提价后 ARI = 1,051 ÷ 1,066.3 × 100 = 98.6，进入「97–103 健康」<br>\n      约束校验：表 C 每次 ≤8%（3% ✓）；本周表 C 调整次数需查台账，≤2 次方可执行<br>\n      <b>表 D：</b>MPI 100.5 落「<b>100–110 健康</b>」→ 动作 = <b>维持</b><br><br>\n      <b>三角诊断：</b>MPI 100.5（健康）× ARI 95.7（略低）→ RGI 96.2 → 落入表 9-12 的<b>「组合 6 · 份额稳·价略低」</b>。<br>\n      <b>与示范 ① 的区别：本例预测 OCC 86.0% ≥ 80%，表 C 的提价条件成立，所以执行 ↑3%；而示范 ① 的 75.0% &lt; 80% 不提。</b>这正是表 C「90–97 略低」这一档的前置条件的意义所在。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 3 · 多表冲突 ①（表 A 与表 C 反向）</div>\n    <div class=\"q-b\">目标日 7 月 8 日（周一，D4 低谷日）。可售 320；在手 135；去年同窗口在手 150；预测增量 0；SUP BAR ¥690；48h Pickup 落后 12.0%。组合加权 ADR ¥616.1、加权 OCC 55.8%。<br>请：① 算预测 OCC / Pickup 偏差 / MPI / ARI / RGI；② 查表 A、表 B、表 C、表 D、表 H；③ 按表 O 仲裁，写出执行动作与被搁置的动作；④ 写台账备注三段。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 计算：</b><br>\n      预测 OCC = 135 ÷ 320 = <b>42.2%</b>　Pickup 偏差 =（135−150）÷150 = <b>落后 10.0%</b><br>\n      MPI = 42.2 ÷ 55.8 × 100 = <b>75.6</b><br>\n      ARI = 690 ÷ 616.1 × 100 = <b>112.0</b><br>\n      RGI = 75.6 × 112.0 ÷ 100 = <b>84.7</b><br>\n      自检：本店 RevPAR = 0.422 × 690 = ¥291.2；组合 RevPAR = 0.558 × 616.1 = ¥343.8；RGI = 291.2 ÷ 343.8 × 100 = <b>84.7</b> ✓ 完全一致<br><br>\n      <b>② 五表结论：</b><br>\n      <b>表 L：</b>48h Pickup 落后 12.0% &lt; 40% → 未触发<br>\n      <b>表 A：</b>预测 OCC 42.2%（40–55% 行）× 落后 10.0%（落后 &gt;10% 列，注意 ≥10.0% 归入此列）→ <span class=\"down\">↓15%</span><br>\n      <b>表 B：</b>42.2% &lt; 70% → &lt;70% 行 → MinLOS 不设限 / CTA 否 / 低价渠道全开+上促销 / 不超售<br>\n      <b>表 C：</b>ARI 112.0 落「110–120 偏高」→ 判据是 RGI：84.7 &lt; 100 → <span class=\"down\">↓5%</span><br>\n      <b>表 H：</b>42.2% &lt; 55% → &lt;55% 行 → OTA 国内全开+深折 / OTA 国际全开 / GDS 开+商务套餐 / 批发商开+打包产品 / 直销全开+长住团购<br>\n      <b>表 D：</b>MPI 75.6 &lt; 85 → 严重落后 → 降价 10% + 全员直销动员 + 48 小时复盘<br><br>\n      <b>③ 仲裁：</b><br>\n      <b>分类：</b>价格类 = 表 A ↓15%（3）、表 C ↓5%（4）、表 D 降价 10%（6）；库存类 = 表 B 四项；渠道类 = 表 H 五项；非价格动作 = 表 D 的全员直销动员 + 48 小时复盘。<br>\n      <b>定价格动作：</b>表 A（3）动作 = ↓15% ≠ 维持 → <b>执行表 A 的 ↓15%</b>。<br>\n      <b>被搁置：</b>表 C 的 ↓5%、表 D 的降价 10% → 写入《观察清单》。<br>\n      <b>新价 = 690 × 0.85 = ¥586.5 → ¥587</b>（降价向下取整）<br>\n      <b>约束：</b>① 累计 ↓15% ≤20% ✓（当日最多再降 5%）；② 第 1 次 ✓；③ 15% ≥3% ✓；④ 09:40 核查 ✓；⑤ 非 D1 无需 L3 ✓<br>\n      <b>非价格动作照常执行：</b>表 D 的全员直销动员 + 48 小时复盘；表 B 四项；表 H 五项。<br>\n      <b>三角诊断：</b>MPI 75.6（严重落后）× ARI 112.0（偏高）→ RGI 84.7 → <b>组合 3「价高量失」</b>。三表<b>全部指向降价，方向一致</b>，但按表 O 只执行幅度最大的表 A（↓15%）。<br><br>\n      <b>④ 台账备注三段：</b><br>\n      <b>第一段（冲突与仲裁）：</b>价格类三方冲突：表 A ↓15%（优先级 3）、表 C ↓5%（4）、表 D 降价 10%（6），<b>三表同向但幅度不同</b>。按表 O 只执行表 A 的 ↓15%，表 C 与表 D 的价格动作写入《观察清单》。表 L 已核查未触发（48h Pickup 落后 12.0% &lt; 40%）。<br>\n      <b>第二段（约束与限制）：</b>表 A 五条约束全部通过；单日下调 15%，当日最多再降 5%。表 C 本周调整次数需查台账，≤2 次。新价 ¥587 在 D4 系数区间（70–85%，即 ¥476–¥578）<b>略高于上限 ¥578，属可接受范围</b>，无需额外处理。<br>\n      <b>第三段（关联动作）：</b>同步执行表 B 四项与表 H 五项。表 D 的「全员直销动员 + 48 小时复盘」为非价格动作，照常执行。三角诊断：MPI 75.6 × ARI 112.0 → RGI 84.7，属「价高量失」组合，病根在定价超出市场承受，降 15% 后 ARI = 587 ÷ 616.1 × 100 = <b>95.3</b>，进入「90–97 略低」，7 天内盯 MPI 是否回升至 ≥85。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 4 · 多表冲突 ②（表 A 维持，顺延表 C；表 C 与表 D 反向）</div>\n    <div class=\"q-b\">目标日 11 月 20 日（周四，D3 平峰日）。可售 320；在手 245；去年同窗口在手 244；预测增量 0；SUP BAR ¥660；48h Pickup 持平 +1.0%。组合加权 ADR ¥703.1、加权 OCC 73.0%。<br>请：① 算三指数；② 查五张表；③ 特别注意表 A 给的是「维持」，说明顺延机制如何生效；④ 按表 O 写出最终执行动作。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 三指数：</b><br>\n      预测 OCC = 245 ÷ 320 = <b>76.6%</b>　Pickup 偏差 =（245−244）÷244 = <b>领先 0.4%</b>（落在「持平 ±3%」列）<br>\n      MPI = 76.6 ÷ 73.0 × 100 = <b>104.9</b><br>\n      ARI = 660 ÷ 703.1 × 100 = <b>93.9</b><br>\n      RGI = 104.9 × 93.9 ÷ 100 = <b>98.5</b><br>\n      自检：本店 RevPAR = 0.766 × 660 = ¥505.6；组合 RevPAR = 0.730 × 703.1 = ¥513.3；RGI = 505.6 ÷ 513.3 × 100 = <b>98.5</b> ✓ 一致<br><br>\n      <b>② 五表结论：</b><br>\n      <b>表 L：</b>48h Pickup +1.0% → 未触发<br>\n      <b>表 A：</b>76.6%（70–85% 行）× 持平 ±3% 列 → <b>维持</b>　<span class=\"pill pill-amber\">关键：本表给的是维持</span><br>\n      <b>表 B：</b>76.6% → 70–85% 行 → MinLOS 1 晚（清空）/ CTA 否 / 低价渠道全开 / 超售按表 E<br>\n      <b>表 C：</b>ARI 93.9 落「<b>90–97 略低</b>」→ 判据：预测 OCC 76.6% &lt; 80% → <b>维持</b>　<span class=\"pill pill-amber\">也是维持</span><br>\n      <b>表 H：</b>76.6% → 70–85% 行 → OTA 国内全开 / OTA 国际全开 / GDS 开 / 批发商限价开 ≤660×75% = ¥495 / 直销全开 + 早鸟<br>\n      <b>表 D：</b>MPI 104.9 落「<b>100–110 健康</b>」→ <b>维持</b><br><br>\n      <b>③ 顺延机制的演示（本例的核心）：</b><br>\n      表 A 给「维持」→ 按表 O 铁律 2「若最高优先级动作为『维持』，则顺延执行下一优先级」→ 看表 C（4）。<br>\n      表 C 也给「维持」→ 继续顺延到表 D（6）。<br>\n      表 D 也给「维持」→ <b>本日无价格动作。</b><br>\n      所以：<b>价格类三条全部顺延到底，结论是「本日不调价」</b>。台账写一条「维持」，触发表编号填「<b>表 A</b>」，备注写明「表 A / 表 C / 表 D 均为维持，按表 O 铁律 2 逐条顺延后无价格动作」。<br>\n      <b>（注意：题目问的「表 C 与表 D 反向」在本例并未出现——本例是三表同为维持。这是有意设计的对比题：顺延机制在「全维持」时走到底，得到「无动作」的结论。）</b><br><br>\n      <b>④ 最终执行动作：</b><br>\n      <b>价格类：无动作（维持 ¥660）。</b><br>\n      <b>库存类（表 B，全部执行）：</b>MinLOS 清空 / CTA 否 / 低价渠道全开 / 超售走表 E（若 No-show+取消 8%、无修正条件 → 320 × 2% = 6.4 → <b>6 间</b>）。<br>\n      <b>渠道类（表 H，全部执行）：</b>OTA 国内全开 / OTA 国际全开 / GDS 开 / 批发商限价 ≤¥495 / 直销全开 + 早鸟。<br>\n      <b>三角诊断：</b>MPI 104.9（健康）× ARI 93.9（略低）→ RGI 98.5 → <b>组合 6「份额稳·价略低」</b>。预测 OCC 76.6% &lt; 80%，表 C 不提价——<b>这就是表 C「90–97 略低」这一档最容易读错的地方：不是所有「略低」都提价，要看 OCC 是否 ≥80%。</b>\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 5 · 多表冲突 ③（表 L 触发，覆盖一切）</div>\n    <div class=\"q-b\">目标日 9 月 26 日（周五，D2 高涨日，云栖大会周边日）。可售 320；在手 262；去年同窗口在手 268；预测增量 30；SUP BAR ¥900；<b>48h Pickup 落后 45.0%</b>（突发：主宾演讲取消，大会规模腰斩）。组合加权 ADR ¥880、加权 OCC 89.0%。<br>请：① 先判断表 L 是否触发；② 若触发，写出表 L 的立即动作与 24 小时内动作；③ 说明表 A / 表 B / 表 C / 表 D / 表 H 的结论是否被覆盖；④ 按表 O 写出最终执行清单与台账备注。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 表 L 判定：触发。</b><br>\n      表 L「需求暴跌」分支的判定信号是「<b>48h Pickup 落后 &gt;40%</b>」。本例 45.0% &gt; 40% → <span class=\"pill pill-red\">触发</span>。<br>\n      <b>典型成因对应原文：展会取消 / 恶劣天气 / 舆情</b>——本例正是「大会规模腰斩」，完全吻合。<br><br>\n      <b>② 表 L 的动作：</b><br>\n      <b>立即动作（2 小时内）：</b><b>降价 15%</b>、<b>全开渠道</b>、<b>启动直销外呼</b><br>\n      <b>24 小时内：</b>全员销售动员、上团购产品<br>\n      <b>复盘：</b>事后 7 天复盘报告<br><br>\n      <b>③ 覆盖关系（表 L 优先级 1，覆盖一切）：</b><br>\n      <b>表 A：</b>预测 OCC =（262+30）÷320 = <b>91.3%</b>（90–95% 行）；Pickup 偏差 =（262−268）÷268 = 落后 2.2%（持平 ±3% 列）→ 表 A 结论 = <span class=\"up\">↑5%</span>。<br>\n      　→ <b>被表 L 覆盖，不执行。</b>表 A 让提价而表 L 让降价 15%，方向完全相反，表 L（1）&gt; 表 A（3）。<br>\n      <b>表 B：</b>91.3% → 90–95% 行 → MinLOS 2 晚 / CTA 否（非 D1）/ 关闭尾房特惠 / 超售 ≤2 间。<br>\n      　→ <b>表 L 的「全开渠道」与表 B 的「关闭尾房特惠」在渠道上冲突，以表 L 为准</b>——应急状态下要的是流量，不是价格保护。MinLOS 2 晚也建议撤销（需求已崩，再设住期门槛是自断出路），但《法典》未强制，<b>本学院建议：需求暴跌期间撤除一切限制条件，并在台账注明依据为表 L</b>。<br>\n      <b>表 C：</b>ARI = 900 ÷ 880 × 100 = 102.3 → 「97–103 健康」→ 维持 → 无冲突，本就是维持。<br>\n      <b>表 D：</b>MPI = 91.3 ÷ 89.0 × 100 = 102.6 → 「100–110 健康」→ 维持 → 无冲突。<br>\n      <b>表 H：</b>91.3% → 90–95% 行 → OTA 国内开 2 家 / OTA 国际关 / GDS 开 / 批发商关 / 直销全开。<br>\n      　→ <b>被表 L 的「全开渠道」覆盖</b>——表 L 要求全开，表 H 要求关三家，以表 L 为准。<br><br>\n      <b>④ 最终执行清单：</b><br>\n      <b>1. 降价 15%</b>（表 L）：新价 = 900 × 0.85 = <b>¥765</b>，7 档房型整表同步<br>\n      <b>2. 全开渠道</b>（表 L）：所有渠道恢复开放，含 OTA 国际、GDS、批发商、尾房特惠<br>\n      <b>3. 撤除限制条件</b>（表 L 衍生）：MinLOS 清空、CTA 保持关闭、超售上限归 0（需求暴跌不超售）<br>\n      <b>4. 启动直销外呼</b>（表 L）：24 小时内完成重点协议客户与会员外呼<br>\n      <b>5. 全员销售动员 + 上团购产品</b>（表 L 24 小时内动作）<br>\n      <b>6. 事后 7 天复盘报告</b>（表 L 复盘列）<br><br>\n      <b>约束校验（表 L 的降价 15%）：</b>虽由表 L 触发，但落位时仍须参照表 A 的执行约束：① 累计 ↓15% ≤20% ✓；② 近 24h 第 1 次 ✓；③ 15% ≥3% ✓；④ 30 分钟内核查 OTA 同步 ✓；⑤ <b>本日为 D2 高涨日，非 D1 → 无需 L3 审批；但表 L 应急动作一律上报 L3 知会</b>。<br><br>\n      <b>台账备注三段：</b><br>\n      <b>第一段：</b>表 L「需求暴跌」触发（48h Pickup 落后 45.0% &gt; 40% 阈值；成因：大会主宾演讲取消、规模腰斩）。按表 O，表 L 优先级 1 覆盖一切：表 A 的 ↑5% 不执行（方向相反），表 H 的关渠道（OTA 国际 / 批发商）不执行而改为全开，表 B 的关闭尾房特惠不执行、MinLOS 2 晚撤销。<br>\n      <b>第二段：</b>降价 15% 后累计 ↓15%，当日最多再降 5%（若需二次降价须重新评估）。新价 ¥765 低于 D2 系数区间（120–150%，即 ¥816–¥1,020）下限，<b>应急状态下允许突破，但须在 24 小时内由 L3 书面追认</b>。<br>\n      <b>第三段：</b>同步执行表 L 的全开渠道、直销外呼、全员销售动员、上团购产品四项。7 天内产出《需求暴跌复盘报告》，并评估是否将该活动日从 D1/D2 日历中降级（表 L「需求暴涨」分支原文有「事后复盘留存为 D1 日历」，暴跌情形对称处理：把腰斩的活动日从 D2 降至 D3）。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 6 · 综合：一个月的三维诊断</div>\n    <div class=\"q-b\">11 月整月数据：本店 OCC 76.7%、ADR ¥636、可售房晚 9,360；组合加权 OCC 73.6%、加权 ADR ¥703.1。<br>请：① 算 MPI / ARI / RGI 并跑恒等式；② 用三角诊断法定位落在表 9-12 的哪一格；③ 查表 C 与表 D 给出月度动作；④ 说明月度诊断与每日诊断在口径上有什么不同（这是本题的陷阱）。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 三指数：</b><br>\n      MPI = 76.7 ÷ 73.6 × 100 = <b>104.2</b><br>\n      ARI = 636 ÷ 703.1 × 100 = <b>90.4</b><br>\n      RGI = 104.2 × 90.4 ÷ 100 = <b>94.2</b><br>\n      自检：本店 RevPAR = 76.7% × 636 = ¥487.8；组合 RevPAR = 73.6% × 703.1 = ¥517.5<br>\n      RGI（直接）= 487.8 ÷ 517.5 × 100 = <b>94.3</b><br>\n      |94.3 − 94.2| = 0.1 ≤ 0.2 ✓ <b>通过</b><br><br>\n      <b>② 三角诊断定位：</b><br>\n      MPI 104.2 → 表 D「<b>100–110 健康</b>」行<br>\n      ARI 90.4 → 表 C「<b>80–90 偏低</b>」列<br>\n      交叉格（表 9-12 第 2 行第 2 列）= <b>组合 4「双输」</b>（RGI ≈ 85 那一格的右侧，实际 RGI 94.2）<br>\n      <b>等等——这里要小心。表 9-12 中「100–110 × 80–90」格标注的是「组合 4 · 双输 · RGI ≈ 85」，而本例实际 RGI 是 94.2。</b><br>\n      <b>解释：表 9-12 的 RGI 是「该格中位数值估算」，不是精确值。</b>MPI 100–110 与 ARI 80–90 两档相乘的合理区间是（100×80 ~ 110×90）÷100 = <b>80 ~ 99</b>。本例 94.2 落在这个区间内，属正常。<br>\n      <b>所以本例的准确诊断是：健康份额 × 偏低价格 → RGI 94.2（&lt;100，输给组合），属于「以价换量」的轻度版本。</b>它介于组合 2（以价换量，MPI &gt;110）与组合 4（双输，MPI &lt;95）之间，<b>因为 MPI 104.2 是「健康」而非「领先」或「落后」</b>。<br>\n      <b>本学院的归类规则：当 MPI 落「100–110 健康」而 ARI 落「80–90 偏低」时，归为「组合 2 的轻度版」（以价换量·份额健康）。</b>不要因为表 9-12 的格子标注就机械归类——<b>表 9-12 是速查，真正的判读要回到三个指数的实际数值。</b><br><br>\n      <b>③ 表 C 与表 D 的月度动作：</b><br>\n      <b>表 C：</b>ARI 90.4 落「80–90 偏低」→ 动作 = <b>提 5%</b>（本档无前置条件）<br>\n      新 ADR 目标 = 636 × 1.05 = <b>¥668</b>；提价后 ARI = 668 ÷ 703.1 × 100 = <b>95.0</b>，从「80–90 偏低」改善到「90–97 略低」<br>\n      约束：表 C 每次 ≤8% ✓；每周 ≤2 次，月度动作须分解为 4 周，每周最多 1–2 次<br>\n      <b>表 D：</b>MPI 104.2 落「100–110 健康」→ 动作 = <b>维持</b><br>\n      <b>月度处方：</b>执行表 C 的提 5%，分 4 周推进（每周提 1.25 个百分点，或按周度 Pickup 分次提，每次不低于 3%——<b>注意这里有个冲突：表 A 约束 3 要求单次调价不低于 3%，而月度提 5% 若分成 4 次会每次只有 1.25%，低于 3% 下限</b>）。<br>\n      <b>正确做法：不拆分。一次性提 5%（≥3% ✓），或在两周内分两次（如 3% + 2%——但第二次 2% &lt; 3%，违反约束 3）。<br>\n      结论：一次性提 5%，一次到位。</b>这正是表 A 约束 3「低于 3% 无市场感知，不算调价」的意义——它强制你把调整做成有感知的动作，而不是温水煮青蛙。<br><br>\n      <b>④ ★ 月度诊断与每日诊断的口径差异（本题的陷阱）：</b><br>\n      <b>差异一 · ARI 的分子不同。</b><br>\n      每日诊断（08:30 查表）用的是<b>本店 BAR（SUP-K/SUP-T）</b>，因为要在「五同」下与竞对的<b>挂牌价</b>对比；<br>\n      月度诊断（每月 1 日）用的是<b>本店实际 ADR</b>，与竞对的<b>实际 ADR</b> 对比。<br>\n      <b>两者数值不同（本例 BAR ¥680 vs ADR ¥636），但都对，且不得混用。</b><br><br>\n      <b>差异二 · MPI 的分子不同。</b><br>\n      每日诊断用的是<b>预测 OCC</b>；月度诊断用的是<b>实际 OCC</b>。<br><br>\n      <b>差异三 · 动作的执行方式不同。</b><br>\n      每日诊断产生的动作<b>当天落位</b>（09:10 执行、09:55 台账）；<br>\n      月度诊断产生的动作是<b>方向性指引</b>，要分解到周度策略（每周一的表 N 动作）中去，不能一次性把月度提价 5% 当成某一天的动作直接落位。<br><br>\n      <b>差异四 · 表 C「每周不超过 2 次」的约束只在月度分解时才有意义。</b>每日诊断通常一天只触发一次表 C 动作，天然不会超 2 次；但月度提 5% 若要分次执行，就必须数着次数用。<br><br>\n      <b>一句话总结：每日诊断用于「今天做什么」，月度诊断用于「这个月往哪走」。两者的数字不可互换，动作不可混同。</b>\n    </div></details>\n  </div>\n\n  <\!-- ================= 十五 ================= -->\n  <h2 id=\"s15\">十五、判定表默写清单</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">✎</span>当堂默写（限时 15 分钟）</div>\n    <ul class=\"checklist\">\n      <li>竞争组合选取 5 条标准：档次相同 / 距离 3–5km / 房量 200–400 间 / 客源重叠（≥2 类）/ 数量固定 4–6 家且每季度复核</li>\n      <li>两条排除规则：本集团内部酒店不纳入；开业不足 90 天的新酒店暂不纳入（但须入比价表）</li>\n      <li>云璟 5 家竞对的名称、档次、房量、平峰 BAR、距离（A 280/¥650/1.2km、B 240/¥690/2.5km、C 300/¥560/3.1km、D 350/¥880/4.0km、E 200/¥620/2.0km）</li>\n      <li>组合总房量 <b>1,370 间</b>；算术平均 <b>¥680</b>；房量加权 <b>¥691.7</b>；两种口径落在不同档位时以房量加权为准</li>\n      <li>每日比价「五同」：同入住日 / 同房型（SUP-K 同档位）/ 同含早（不含早）/ 同取消政策（免费取消）/ 同提前天数</li>\n      <li>比价采集 6 个必录项：采集时间戳 / 竞对名称+房量 / 对标房型挂牌价 / 含早状态 / 取消政策 / 是否售罄</li>\n      <li>售罄处理：价格维度从加权 ADR 的分子分母中同时剔除；出租率维度按 OCC = 100% 计入加权 OCC</li>\n      <li>比价时段：08:10 开始，<b>08:30 前完成</b>（表 M）；恒等式自检 |RGI − MPI×ARI÷100| ≤ 0.2</li>\n      <li>《法典》表 C 七档：&gt;120 严重偏高 / 110–120 偏高 / 103–110 略高 / 97–103 健康 / 90–97 略低 / 80–90 偏低 / &lt;80 严重偏低</li>\n      <li>表 C 各档动作（<b>连同判据一起背</b>）：&gt;120→MPI&lt;95 降8%、MPI≥95 维持并每日盯Pickup；110–120→RGI&lt;100 降5%、RGI≥100 维持；103–110→维持观察Pickup；97–103→维持；90–97→预测OCC≥80% 提3% 否则维持；80–90→提5%；&lt;80→提8% 并核查房型配置与含早策略</li>\n      <li>表 C 三条执行约束：每次 ≤8% / 每周 ≤2 次 / 不得与表 A 结论叠加执行（表 A &gt; 表 C）</li>\n      <li>《法典》表 D 五档：&gt;110 份额领先 / 100–110 健康 / 95–100 略弱 / 85–95 落后 / &lt;85 严重落后</li>\n      <li>表 D 各档动作：&gt;110→优先提价（走表C提价分支）；100–110→维持；95–100→检查OTA曝光/挂牌/点评分、补挂牌；85–95→降价5% 或 增加OTA广告投放；&lt;85→启动L2-E1（降价10% + 全员直销动员 + 48小时复盘）</li>\n      <li>表 D 组合包拆分规则：价格动作参与仲裁，非价格动作不参与、照常执行</li>\n      <li>《法典》表 O 六级优先级：<b>表 L(1) &gt; 表 B(2) &gt; 表 A(3) &gt; 表 C(4) &gt; 表 H(5) &gt; 表 D(6)</b>（口诀：急 &gt; 存 &gt; 价 &gt; 位 &gt; 渠 &gt; 诊）</li>\n      <li>表 O 三条铁律：同日只执行最高优先级的一条、其余入《观察清单》；最高优先级为「维持」则顺延下一优先级；所有冲突与取舍必须写入《调价台账》备注栏</li>\n      <li>仲裁五步法：列全 → 查表 L → 分类（价格/库存/渠道/非价格）→ 定价格动作（3&gt;4&gt;6 取第一个非维持）→ 记备注三段</li>\n      <li>8 种三角组合的名称：① 量价双优 ② 以价换量 ③ 价高量失 ④ 双输 ⑤ 稳态健康 ⑥ 份额稳·价略低 ⑦ 曝光不足 ⑧ 溢价透支</li>\n    </ul>\n  </div>\n\n  <\!-- ================= 十六 ================= -->\n  <h2 id=\"s16\">十六、随堂测（5 题）</h2>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 1 题</div>\n    <div class=\"q-b\">《法典》表 C「90–97 略低」这一档的动作是什么？很多人会答错，错在哪？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>动作是「预测 OCC ≥80% → 提 3%；否则维持」。错在漏掉前置条件，把「略低」直接等同于「提 3%」。</b><br>\n      解析：表 C 七档中，只有两档的原文直接给了无条件动作（80–90 → 提 5%；&lt;80 → 提 8%），其余五档都带判据或条件。<br>\n      「90–97 略低」这一档的判据是<b>预测 OCC 是否 ≥80%</b>。<br>\n      <b>为什么加这个条件？</b>因为「价格略低于竞对」有两种成因：<br>\n      ① <b>需求旺盛但价格没跟上</b>（OCC ≥80%）→ 提价不会掉量，是纯粹的钱留在桌上 → <b>提 3%</b>；<br>\n      ② <b>需求本身就弱，价格是被迫压低的</b>（OCC &lt;80%）→ 此时提价会进一步压垮出租率，RGI 反而更低 → <b>维持</b>。<br>\n      <b>《法典》用「预测 OCC 80%」这一条线把两种情形分开，这就是「不猜、不算、不纠结」的典型体现——你不需要判断成因，只需要看一个数。</b><br>\n      <b>类似的还有两档：</b>「110–120 偏高」用 RGI 是否 &lt;100 做判据；「&gt;120 严重偏高」用 MPI 是否 &lt;95 做判据。<b>背表时必须连同判据一起背，只背动作等于没背。</b>\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 2 题</div>\n    <div class=\"q-b\">表 O 铁律 1 说「同日只执行优先级最高的那一条动作」。如果表 A 给出 ↓3%，表 B 要求设 MinLOS、关低价渠道，表 H 要求关 3 家 OTA——这三条要怎么执行？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>三条全部执行。表 A 的 ↓3% 执行，表 B 的库存动作执行，表 H 的渠道动作也执行——它们分属不同类别，互不冲突。</b><br>\n      解析：这是表 O 最容易被误读的地方。<b>「只执行最高优先级的一条」指的是「同一类动作之内」</b>，不是「一天只能做一个动作」。<br>\n      正确理解：把动作分成四类，<b>每一类内部</b>按优先级取最高的一条，<b>类与类之间并行执行</b>：<br>\n      · <b>价格类</b>（表 A / 表 C / 表 D 的调价）→ 优先级 3 &gt; 4 &gt; 6，只执行最高的一条，不叠加；<br>\n      · <b>库存类</b>（表 B 的 MinLOS / CTA / Stop Sell / 超售）→ 表 B 优先级 2，四列全部执行；<br>\n      · <b>渠道类</b>（表 H）→ 优先级 5，全部执行；与表 B 的「低价渠道 Stop Sell」重叠时以表 B 为准；<br>\n      · <b>非价格动作</b>（表 D 的直销动员 / 复盘 / 增加投放等）→ 不参与仲裁，照常执行。<br>\n      <b>本例的执行清单：</b>① 表 A 的 ↓3%（价格类，优先级 3 最高）；② 表 B 的设 MinLOS + 关低价渠道（库存类）；③ 表 H 的关 3 家 OTA（渠道类）。<br>\n      <b>唯一需要额外处理的：</b>表 B 的「低价渠道 Stop Sell」与表 H 的渠道开关若指向同一渠道，以表 B 为准（M08 第 6.2 节的规则）。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 3 题</div>\n    <div class=\"q-b\">表 O 铁律 2 说「若最高优先级动作为『维持』，则顺延执行下一优先级」。如果表 A、表 C、表 D 全部给出「维持」，最终执行什么？台账怎么写？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>最终无价格动作。台账写一条「维持」，触发表编号填「表 A」，备注写明「表 A / 表 C / 表 D 均为维持，按表 O 铁律 2 逐条顺延后无价格动作」。</b><br>\n      解析：顺延机制的逻辑是——「维持」不是动作，是「没有动作」。所以最高优先级给维持时，要继续往下找，看下一优先级有没有真正的动作。<br>\n      本例：表 A（3）维持 → 顺延表 C（4）维持 → 顺延表 D（6）维持 → <b>价格类三条全部顺延到底，结论是「本日不调价」</b>。<br>\n      <b>台账怎么写（关键）：</b>即使没有动作，<b>也必须写一条台账</b>，原因有二：<br>\n      ① <b>命中率的分母需要它。</b>《调价台账》的「已复盘总条数」包含「维持」条——如果只记动作不记维持，命中率会被系统性高估（详见 M04 第 1 节与第 11 节错误例 5）。<br>\n      ② <b>30 天后复盘需要它。</b>你需要知道「那天为什么没动」，而不只是「那天动了什么」。<br>\n      <b>触发表编号填「表 A」而不是留空或填「无」</b>——因为真正做过的是「查了表 A，读出维持」这个动作，表 A 就是这条记录的来源。<br>\n      <b>补充：此时库存类（表 B）与渠道类（表 H）的动作仍然照常执行</b>，它们不属于价格类，不受顺延机制影响。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 4 题</div>\n    <div class=\"q-b\">比价时发现某家竞对在目标日售罄，该怎么处理？为什么价格维度与出租率维度的处理方式不同？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>价格维度：从加权 ADR 的分子与分母中同时剔除该家（分子减「该家房量 × 该家价格」，分母减该家房量），重新计算加权 ADR。出租率维度：该家 OCC 按 100% 计入加权 OCC，不得剔除。</b><br>\n      解析：<b>价格维度为什么要剔除？</b>一家已经售罄的酒店，其挂牌价已经没有市场意义——它不再以这个价格参与竞争了。而且售罄酒店的挂牌价往往是当日最高的（因为它卖完了），若计入会虚抬组合均价，让你的 ARI 虚低，进而误判为「该提价」。<br>\n      <b>举例：</b>D 星光开元名都（350 间，组合中房量最大）在峰值日售罄，挂牌价 ¥1,320。若计入，加权 ADR 会被显著抬高；剔除后组合均价下降，你的 ARI 上升，可能从「90–97 略低」跳到「97–103 健康」，动作从「提 3%」变成「维持」——<b>一个完全不同的决策。</b><br>\n      <b>出租率维度为什么不剔除？</b>因为售罄恰恰是「市场热度」的最强信号。一家卖到 100% 的酒店，说明当天需求极旺。若把它从加权 OCC 中剔除，会<b>低估市场热度</b>，让你的 MPI 虚高（分母变小了），进而误判为「份额领先」，错过真正的市场机会。<br>\n      <b>记忆点：价格看「还能不能买到」，出租率看「卖掉了多少」。售罄 = 买不到了（价格失效）+ 卖光了（出租率满格）。</b><br>\n      <b>操作要求：</b>比价表的「是否售罄」列必须逐日填写，剔除与重算必须在 08:30 前完成，且剔除动作要在比价表备注栏写明。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 5 题</div>\n    <div class=\"q-b\">某日三角诊断结果是「低 MPI + 低 ARI」（双输组合）。表 C 给提价，表 D 给降价，方向完全相反。按表 O 应该执行表 C 的提价——但你的直觉告诉你「没客人还提价，这不是疯了吗」。怎么说服自己？执行时还要做什么？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>因为「双输」说明病根不在价格上——你已经比竞对便宜了还是抢不到客人，降价只会让 ARI 更糟、RGI 更低。执行表 C 提价的同时，必须加设保护条款、启动非价格诊断、执行表 D 的全部非价格动作。</b><br>\n      解析：<b>先破除直觉：</b>「没客人就降价」这个直觉在<b>价格高于市场</b>时是对的（那是组合 3「价高量失」，表 C 给的正是降价）。但在「双输」组合下，你的 ARI 已经低于 97，甚至低于 80。此时再降：<br>\n      · 若 ARI 从 82 降到 74，仍然是「&lt;80 严重偏低」，表 C 下次给的动作还是「<b>提 8%</b>」——你陷入「越降越要提」的循环；<br>\n      · 而 RGI = MPI × ARI ÷ 100，降价若不能带来等比例的 MPI 提升，RGI 只会更低。<br>\n      <b>《法典》在这个位置的态度非常明确：价格已经低于市场了还抢不到客人，降价不是解药。</b><br><br>\n      <b>执行表 C 提价时还要做的三件事：</b><br>\n      <b>① 加设保护条款（写进台账备注）：</b>「表 C 与表 D 反向冲突，本组合属『双输』（MPI __ / ARI __ / RGI __）。提价后 7 天内若 MPI 继续下滑 &gt;5 个百分点，立即回退至提价前价格并改走表 D 的降价路径。」<b>这条保护条款是强制的，不是可选的</b>——它把「表 O 的机械执行」与「市场的真实反馈」连接起来。<br>\n      <b>② 启动非价格诊断（本组合的真正用力方向）：</b><br>\n      · 跑 M08 第 11 节的 OTA 排名优化 10 项，重点查：点评分 ≥4.6、挂牌完整性（是否漏挂渠道）、房型投放数 ≥5 个、图片 ≥30 张、响应时间 &lt;5 分钟；<br>\n      · 核查《法典》表 L「竞对新开业」分支：3km 内是否有新开同档酒店？若有，按表 L 走差异化策略（不盲目跟价）；<br>\n      · 核查产品与口碑：装修是否老化？近期差评集中在哪几个方面？<br>\n      <b>③ 执行表 D 的全部非价格动作：</b>表 D 组合包中的「全员直销动员」「48 小时复盘」（&lt;85 档）或「增加 OTA 广告投放」（85–95 档）——<b>这些不与任何价格表冲突，照常执行，一个不落。</b><br><br>\n      <b>一句话总结：表 O 让你执行表 C，是为了防止你越降越糟；但真正的解法在表 O 之外。</b>\n    </div></details>\n  </div>\n\n  <\!-- ================= 十七 ================= -->\n  <h2 id=\"s17\">十七、本模块产出物</h2>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">结课交付清单</span>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>《竞争组合档案卡》</b>——5 家竞对的档次 / 房量 / 平峰 BAR / 距离 / 房量权重，附 5 条选取标准与 2 条排除规则，每季度复核后更新版本</li>\n      <li><b>《每日比价表》</b>——五同锁定的采集模板，6 个必录项，自动算出组合加权 ADR / 加权 OCC / ARI / MPI，含售罄自动剔除与恒等式自检行</li>\n      <li><b>《三角诊断矩阵卡》</b>——表 9-12 的 8 组合版一页纸，贴在工作台；背面印表 C 七档与表 D 五档（含判据）</li>\n      <li><b>《表 O 仲裁卡》</b>——六级优先级 + 三条铁律 + 仲裁五步法，一页纸，凡遇冲突先查此卡</li>\n      <li><b>《观察清单》</b>——被表 O 搁置的动作登记表，字段：日期 / 目标日 / 来源表 / 被搁置的动作 / 搁置依据（被哪张表覆盖）/ 复核日期</li>\n      <li><b>《月度三维诊断表》</b>——实际 ADR / OCC 口径的 MPI / ARI / RGI，含恒等式自检与三角诊断结论栏</li>\n      <li><b>表 C / 表 D / 表 O 默写卷</b>——当堂完成，错一格重默（表 C 必须连同判据一起默）</li>\n    </ul>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">→</span>下一模块预告</div>\n    <p>L2 阶段到此结束。你已经能独立完成：预测（M05）→ 定价（M06）→ 控库存（M07）→ 管渠道（M08）→ 看市场（M09），并在多表冲突时用表 O 完成仲裁。<br>\n    接下来进入 L3 收益管理经理阶段。M10 客源细分战略是 L3 的第一课，它要解决一个本模块反复触碰却始终没有展开的问题：<b>当一个团队报价很低、却要占用你最好的日期时，接还是不接？</b><br>\n    你会学到《法典》表 G（团队 / 协议询价接受判定表 · 置换分析简化版）与表 K（会议 / 宴会综合收益联动表），以及那个关键的「全服务酒店附加条款」——<b>会议团队算的是综合贡献（客房 + 餐饮 + 会场 + 其他），即使 R &lt; 55% 也可能接</b>，但须 L3 审批并记入《团队决策档案》。</p>\n  </div>\n\n  <\!-- ===== 底部导航 ===== -->\n  <div class=\"p-title\">M08 渠道与分销管理</div></a>\n    <a href=\"m10.html\" class=\"p-next\"><div class=\"p-dir\">下一模块 →</div><div class=\"p-title\">M10 客源细分战略</div></a>\n  </div>\n\n</div>\n"}]}, {"n": 10, "t": "市场细分与定价", "part": "L3 经理", "mod": "模块 M10", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n  <\!-- ================= 页头 ================= -->\n  <div class=\"crumb\">\n    <a href=\"../index.html\">学院首页</a><span>/</span>\n    <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n    L3 模块十\n  </div>\n\n  <div class=\"page-head\">\n    <div class=\"badge-row\">\n      <span class=\"badge badge-l3\">L3 收益管理经理</span>\n      <span class=\"badge\">模块 M10</span>\n      <span class=\"badge\">6 课时 / 6 × 90 min</span>\n      <span class=\"badge\">认证权重 20%</span>\n      <span class=\"badge badge-core\">核心课</span>\n    </div>\n    <h1 class=\"page-title\">客源细分战略：把 320 间房卖给对的人</h1>\n    <p class=\"page-lede\">一句话导语：L2 解决\"今天这间房卖多少钱\"，L3 解决\"这 116,800 间夜分别卖给谁\"。本模块把客源结构拆成产量、均价、贡献度、增长率四个维度交叉诊断，用置换分析回答\"这个团队接不接\"，用两张判定表把答案固化下来。</p>\n  </div>\n\n  <\!-- ================= 学习目标 ================= -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n    <ul>\n      <li>能<b>画出</b> 杭州滨江云璟酒店 7 个市场细分（Market Segment）的四维交叉诊断表，并指出当前结构中最该被压缩的 1 个细分与最该被扶持的 1 个细分</li>\n      <li>能<b>算出</b> 任意一笔团队/协议询价的置换成本（Displacement Cost）与综合贡献，误差不超过 ¥1,000</li>\n      <li>能<b>背出并套用</b>《法典》表 G（团队/协议询价接受判定表 5×3 矩阵）与表 K（会议/宴会综合收益联动表 4 档），输入条件后 3 分钟内给出接受/限额接受/上报/拒绝的唯一结论</li>\n      <li>能<b>独立写出</b> 一份可落地的客源结构年度目标（含 OTA 占比下降目标）与配套的 6 个标准打法</li>\n      <li>能<b>主持</b> 一场团队询价决策会，用数据说服销售部接受\"拒绝\"结论</li>\n    </ul>\n    <p class=\"card-note\">前置要求：M05 需求预测、M06 价格体系、M08 渠道分销、M09 竞争监测。本模块默认学员已能独立执行 L2 每日四步闭环。</p>\n  </div>\n\n  <\!-- ================= 目录 ================= -->\n  <div class=\"toc\">\n    <div class=\"toc-title\">本模块目录</div>\n    <ol>\n      <li><a href=\"#s1\">客源结构：L3 唯一无法外包的决策</a></li>\n      <li><a href=\"#s2\">四维交叉诊断法：产量 × 均价 × 贡献度 × 增长率</a></li>\n      <li><a href=\"#s3\">置换分析：团队与协议的第一性原理</a></li>\n      <li><a href=\"#s4\">《法典》表 G 全服务附加条款：会议团队怎么破 R&lt;55%</a></li>\n      <li><a href=\"#s5\">《法典》表 K：会议/宴会综合收益联动</a></li>\n      <li><a href=\"#s6\">客源结构目标设定与 6 个标准打法</a></li>\n      <li><a href=\"#demo\">讲师示范（两则完整询价决策）</a></li>\n      <li><a href=\"#practice\">学员跟练（5 题）</a></li>\n      <li><a href=\"#recite\">判定表默写清单</a></li>\n      <li><a href=\"#quiz\">随堂测（5 题）</a></li>\n      <li><a href=\"#out\">本模块产出物</a></li>\n    </ol>\n  </div>\n\n  <\!-- ================= S1 ================= -->\n  <h2 id=\"s1\">一、客源结构：L3 唯一无法外包的决策</h2>\n\n  <p>每日调价、渠道开关、限制条件，这些 L2 就能干、系统也能干。但有一件事永远无法外包、也无法自动化——<strong>决定这 116,800 间可售房晚，分别卖给谁</strong>。</p>\n\n  <p>原因很简单：价格可以在一天之内改回来，<strong>客源结构一旦形成就有 12–18 个月的惯性</strong>。你今天为了填房接了 3,000 个批发商房晚，明年的今天这批旅行社还会拿着同样的价格来找你，而且会说\"去年就是这个价\"。你今天把 CORP 协议价签在 ¥520，这份合同要锁 12 个月。</p>\n\n  <div class=\"grid grid-3\">\n    <div class=\"metric\"><div class=\"metric-val\">116,800</div><div class=\"metric-label\">年可售房晚（320 × 365）</div></div>\n    <div class=\"metric\"><div class=\"metric-val\">84,096</div><div class=\"metric-label\">年售出房晚（OCC 72.0%）</div></div>\n    <div class=\"metric\"><div class=\"metric-val\">7</div><div class=\"metric-label\">需要被逐一决策的市场细分</div></div>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">L3 与 L2 的分界线</span>\n    <p><b>L2 问</b>：10 月 16 日这间房卖 ¥700 还是 ¥660？<br>\n    <b>L3 问</b>：10 月这 9,920 个可售房晚里，OTA 拿走多少个、直销拿走多少个、团队拿走多少个？这个比例明年要变成什么样？为了变成那样，今年要动哪 6 件事？</p>\n  </div>\n\n  "}, {"id": "p1", "name": "1 本模块的三个硬约束", "min": 8, "desc": "", "html": "<h3>1.1 本模块的三个硬约束</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 10-1　本模块全部案例的口径约束<span class=\"cap-note\">数字来源：SPEC 2.1 / 2.2 / 2.3 / 2.5。任何偏离此表的举例均视为违规</span></caption>\n      <thead><tr><th>参数</th><th class=\"num\">取值</th><th>来源</th></tr></thead>\n      <tbody>\n        <tr><td>总房量 / 年可售房晚</td><td class=\"num\">320 间 / 116,800 间夜</td><td>SPEC 2.1 / 2.3</td></tr>\n        <tr><td>上年售出房晚 / OCC</td><td class=\"num\">84,096 / 72.0%</td><td>SPEC 2.3</td></tr>\n        <tr><td>上年客房收入 / 综合 ADR</td><td class=\"num\">¥51,977,328 / ¥618</td><td>SPEC 2.3</td></tr>\n        <tr><td>上年餐饮收入 / 其他收入</td><td class=\"num\">¥28,600,000 / ¥4,100,000</td><td>SPEC 2.3</td></tr>\n        <tr><td>GOP / GOP 率 / GOPPAR</td><td class=\"num\">¥27,098,741 / 32.0% / ¥232</td><td>SPEC 2.3</td></tr>\n        <tr><td>餐饮设施</td><td class=\"num\">云璟轩 180 座 · 澜庭 220 座 · 臻萃 60 座 · 宴会 1,200㎡</td><td>SPEC 2.2</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-gold\">\n    <span class=\"co-t\">本店口径参数 P1（本模块与 M11 通用，须先记住）</span>\n    <p>置换分析要用到\"被挤占的餐饮/其他边际收益\"，这个数字 SPEC 没有直接给出，必须推导。推导过程如下，推导结果记为 <b>P1 = ¥84 / 间晚</b>：</p>\n    <div class=\"formula\">\n      <span class=\"f-label\">推导 · 被挤占餐饮/其他边际收益（每间晚）</span>\n      餐饮总收入 ¥28,600,000 × 住客消费占比 45%（本店财务部口径）＝ ¥12,870,000<br>\n      ¥12,870,000 ÷ 售出房晚 84,096 ＝ ¥153.0 / 间晚（住客间均餐饮收入）<br>\n      ¥153.0 × 餐饮边际贡献率 55%（取《法典》表 K 红线毛利率下限）＝ <span class=\"f-out\">¥84 / 间晚</span>\n    </div>\n    <p style=\"margin:8px 0 0\"><b>使用规则</b>：本教材所有置换成本计算一律用 P1 = ¥84/间晚。<b>上岗后第一件事</b>，是向财务部索取本店真实的\"住客餐饮间均收入\"与\"餐饮边际贡献率\"两个数字，重算 P1，并在《团队决策档案》首页写明本店 P1 取值与更新时间。</p>\n  </div>\n\n  <\!-- ================= S2 ================= -->\n  <h2 id=\"s2\">二、四维交叉诊断法：产量 × 均价 × 贡献度 × 增长率</h2>\n\n  <p>只看 OCC 和 ADR 的人，看不出客源结构的问题。一个 OCC 72.0%、ADR ¥618 的酒店，可能是\"健康的\"，也可能是\"用 OTA 的 31% 房晚硬撑出来的 OCC，实际净利润被佣金吃光\"。区分这两者的唯一方法，就是把 7 个细分放到同一张表里做<strong>四维交叉</strong>。</p>\n\n  "}, {"id": "p2", "name": "1 四个维度分别回答什么问题", "min": 8, "desc": "", "html": "<h3>2.1 四个维度分别回答什么问题</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 10-2　四维交叉诊断法的四个维度<span class=\"cap-note\">四维必须同时使用，只看任意一维都会得出错误结论</span></caption>\n      <thead><tr><th>维度</th><th>算法</th><th>回答的问题</th><th>单独的危险性</th></tr></thead>\n      <tbody>\n        <tr><td><b>① 产量</b></td><td>该细分房晚 ÷ 总售出房晚</td><td>谁在给你填房？</td><td>只看产量 → 会去保护最大的 OTA，忽略它最不赚钱</td></tr>\n        <tr><td><b>② 均价</b></td><td>该细分客房收入 ÷ 该细分房晚</td><td>谁买得贵？</td><td>只看均价 → 会去保护 ¥720 的上门散客，忽略它只有 8% 产量、撑不起大盘</td></tr>\n        <tr><td><b>③ 贡献度</b></td><td>收入占比 − 房晚占比；以及净 RevPAR 贡献</td><td>谁在真正贡献利润？</td><td>只看贡献度 → 会砍掉所有低贡献细分，导致淡季无房可填</td></tr>\n        <tr><td><b>④ 增长率</b></td><td>（今年房晚 − 上年房晚）÷ 上年房晚</td><td>谁的势头在往上走？</td><td>只看增长率 → 会给一个 2% 的小细分投入 80% 的资源</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  "}, {"id": "p3", "name": "2 杭州滨江云璟酒店的完整四维诊断表", "min": 8, "desc": "", "html": "<h3>2.2 杭州滨江云璟酒店的完整四维诊断表</h3>\n\n  <p>下表是 M10 的<strong>核心母表</strong>。学员必须能在 25 分钟内，用一张白纸 + 计算器独立重算出来。计算口径与两个必须知道的坑，写在表下方。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 10-3　客源结构四维交叉诊断表（杭州滨江云璟酒店 · 上年完整年度）<span class=\"cap-note\">房晚基数 84,096；可售房晚 116,800。渠道成本率取自 SPEC 2.3</span></caption>\n      <thead>\n        <tr>\n          <th rowspan=\"2\">市场细分</th><th rowspan=\"2\">代码</th>\n          <th class=\"num\">① 产量</th><th class=\"num\">② 均价</th>\n          <th class=\"num\" colspan=\"2\">③ 贡献度</th>\n          <th class=\"num\">④ 增长率</th>\n          <th class=\"num\">渠道</th><th class=\"num\" colspan=\"2\">净收益</th>\n        </tr>\n        <tr>\n          <th class=\"num\">房晚</th><th class=\"num\">ADR</th>\n          <th class=\"num\">客房收入</th><th class=\"num\">收入占比−房晚占比</th>\n          <th class=\"num\">房晚同比</th><th class=\"num\">成本率</th>\n          <th class=\"num\">净收入</th><th class=\"num\">净RevPAR贡献</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td>上门散客</td><td><code>FIT-WI</code></td>\n          <td class=\"num\">6,728<br><span class=\"cap-note\">8%</span></td><td class=\"num\">¥720</td>\n          <td class=\"num\">¥4,844,160<br><span class=\"cap-note\">9.91%</span></td>\n          <td class=\"num\"><span class=\"up\">+1.91pt</span></td>\n          <td class=\"num\"><span class=\"up\">↑6%</span></td><td class=\"num\">3%</td>\n          <td class=\"num\">¥4,698,835</td><td class=\"num\">¥40.23</td>\n        </tr>\n        <tr>\n          <td>官网/小程序直销</td><td><code>FIT-DIR</code></td>\n          <td class=\"num\">14,296<br><span class=\"cap-note\">17%</span></td><td class=\"num\">¥650</td>\n          <td class=\"num\">¥9,292,400<br><span class=\"cap-note\">19.02%</span></td>\n          <td class=\"num\"><span class=\"up\">+2.02pt</span></td>\n          <td class=\"num\"><span class=\"up\">↑22%</span></td><td class=\"num\">3%</td>\n          <td class=\"num\">¥9,013,628</td><td class=\"num\">¥77.17</td>\n        </tr>\n        <tr>\n          <td>OTA 散客</td><td><code>FIT-OTA</code></td>\n          <td class=\"num\">26,070<br><span class=\"cap-note\">31%</span></td><td class=\"num\">¥598</td>\n          <td class=\"num\">¥15,589,860<br><span class=\"cap-note\">31.90%</span></td>\n          <td class=\"num\"><span class=\"up\">+0.90pt</span></td>\n          <td class=\"num\"><span class=\"up\">↑14%</span></td><td class=\"num\">16%</td>\n          <td class=\"num\">¥13,095,482</td><td class=\"num\">¥112.12</td>\n        </tr>\n        <tr>\n          <td>协议公司客户</td><td><code>CORP</code></td>\n          <td class=\"num\">18,501<br><span class=\"cap-note\">22%</span></td><td class=\"num\">¥520</td>\n          <td class=\"num\">¥9,620,520<br><span class=\"cap-note\">19.69%</span></td>\n          <td class=\"num\"><span class=\"down\">−2.31pt</span></td>\n          <td class=\"num\"><span class=\"up\">↑3%</span></td><td class=\"num\">8%</td>\n          <td class=\"num\">¥8,850,878</td><td class=\"num\">¥75.78</td>\n        </tr>\n        <tr>\n          <td>会员（忠诚计划）</td><td><code>LOY</code></td>\n          <td class=\"num\">10,092<br><span class=\"cap-note\">12%</span></td><td class=\"num\">¥580</td>\n          <td class=\"num\">¥5,853,360<br><span class=\"cap-note\">11.98%</span></td>\n          <td class=\"num\"><span class=\"flat\">－持平</span></td>\n          <td class=\"num\"><span class=\"up\">↑18%</span></td><td class=\"num\">4%</td>\n          <td class=\"num\">¥5,619,226</td><td class=\"num\">¥48.11</td>\n        </tr>\n        <tr>\n          <td>团队（旅游/会议）</td><td><code>GRP</code></td>\n          <td class=\"num\">6,728<br><span class=\"cap-note\">8%</span></td><td class=\"num\">¥450</td>\n          <td class=\"num\">¥3,027,600<br><span class=\"cap-note\">6.19%</span></td>\n          <td class=\"num\"><span class=\"down\">−1.81pt</span></td>\n          <td class=\"num\"><span class=\"down\">↓9%</span></td><td class=\"num\">26%</td>\n          <td class=\"num\">¥2,240,424</td><td class=\"num\">¥19.18</td>\n        </tr>\n        <tr>\n          <td>长住客</td><td><code>LNG</code></td>\n          <td class=\"num\">1,682<br><span class=\"cap-note\">2%</span></td><td class=\"num\">¥380</td>\n          <td class=\"num\">¥639,160<br><span class=\"cap-note\">1.31%</span></td>\n          <td class=\"num\"><span class=\"down\">−0.69pt</span></td>\n          <td class=\"num\"><span class=\"up\">↑2%</span></td><td class=\"num\">3%</td>\n          <td class=\"num\">¥619,985</td><td class=\"num\">¥5.31</td>\n        </tr>\n      </tbody>\n      <tfoot>\n        <tr style=\"background:var(--gold-soft)\">\n          <th>合计 / 加权</th><th>—</th>\n          <th class=\"num\">84,097<br><span class=\"cap-note\">100%（尾差 1 间夜）</span></th>\n          <th class=\"num\">¥581.1</th>\n          <th class=\"num\">¥48,867,060</th>\n          <th class=\"num\">—</th>\n          <th class=\"num\"><span class=\"up\">↑9.9%</span></th>\n          <th class=\"num\">9.68%</th>\n          <th class=\"num\">¥44,138,458</th>\n          <th class=\"num\">¥377.90</th>\n        </tr>\n      </tfoot>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">坑一：细分加权 ADR ¥581.1 ≠ 综合 ADR ¥618，这不是算错了</span>\n    <p>把 7 个细分的 ADR 按房晚加权，得到 ¥581.1；而 SPEC 2.3 的综合 ADR 是 ¥618。差额 <b>¥36.9 / 间晚</b>（<span class=\"up\">↑6.35%</span>）。这个差额有明确来源，必须能向总经理和业主讲清楚：</p>\n    <div class=\"formula\">\n      <span class=\"f-label\">口径差额的构成</span>\n      ① 附加价格规则（SPEC 2.1）：高楼层 +5%、江景/特色景观 +10%、含早 +¥68/人、加床 +¥180、连通房 +¥50<br>\n      ② 需求日历价格系数（SPEC 2.5）：D1 峰值日 150–200%、D2 高涨日 120–150%<br>\n      ③ 二者叠加后，实际成交价高于细分挂牌成交价 → <span class=\"f-out\">¥618 − ¥581.1 ＝ ¥36.9 / 间晚</span>\n    </div>\n    <p style=\"margin:8px 0 0\"><b>结论</b>：细分 ADR 是<b>挂牌成交口径</b>，综合 ADR 是<b>实际结算口径</b>。做四维诊断时用前者（可比），算全年收入时用后者（准确）。两种口径混用是本模块最常见的失分点。</p>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">坑二：净 RevPAR 贡献 ¥377.90 的分母仍是 116,800，不是 84,096</span>\n    <p>净 RevPAR 贡献 = 该细分净收入 ÷ <b>可售房晚 116,800</b>。这样 7 个细分的净 RevPAR 贡献可以直接相加，等于全店净 RevPAR ¥377.90。若用售出房晚做分母，七个数字相加无意义。</p>\n  </div>\n\n  "}, {"id": "p4", "name": "3 从这张表读出的 5 条结论（标准答法）", "min": 8, "desc": "", "html": "<h3>2.3 从这张表读出的 5 条结论（标准答法）</h3>\n\n  <div class=\"step\">\n    <div class=\"step-num\">1</div>\n    <div class=\"step-body\">\n      <h4>FIT-OTA 是\"最大的一块，也是最贵的一块\"</h4>\n      <p>产量 31%（26,070 房晚）、收入占比 31.90%、贡献度仅 <span class=\"up\">+0.90pt</span>。它贡献了近三分之一的房晚，却几乎没带来超出比例的收益，同时吃掉 16% 佣金（¥2,494,378）。它是全店最大的单一利润漏点，也是明年结构优化的第一目标。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">2</div>\n    <div class=\"step-body\">\n      <h4>FIT-DIR 是\"最该被扶持的一块\"</h4>\n      <p>产量 17%、收入占比 19.02%、贡献度 <span class=\"up\">+2.02pt</span>（全场最高）、增长率 <span class=\"up\">↑22%</span>（全场最高）、渠道成本仅 3%。单价 ¥650 比 OTA 的 ¥598 还高 ¥52。每从 OTA 抢回 1,000 个房晚到直销，客房收入 <span class=\"up\">↑¥52,000</span>、渠道成本 <span class=\"down\">↓¥76,180</span>、净收入 <span class=\"up\">↑¥128,180</span>。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">3</div>\n    <div class=\"step-body\">\n      <h4>CORP 是\"体量大但拖后腿的一块\"</h4>\n      <p>产量 22%（第二大盘），贡献度 <span class=\"down\">−2.31pt</span>（全场最低），均价 ¥520 低于综合 ADR 15.9%，增长率仅 <span class=\"up\">↑3%</span>（低于大盘 ↑9.9% 的三分之一）。它不是坏人——它是淡季的压舱石——但 22% 的体量配 ¥520 的价格，在 OCC 已经 72.0% 的情况下，是明显的价格洼地。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">4</div>\n    <div class=\"step-body\">\n      <h4>GRP 是\"唯一在萎缩的一块\"，而且萎缩是好事</h4>\n      <p>产量 8%、增长率 <span class=\"down\">↓9%</span>（唯一负增长）、均价 ¥450（全场最低）、渠道成本 26%（最高）。它的净 RevPAR 贡献只有 ¥19.18，是 FIT-OTA（¥112.12）的 17%。<b>它下滑是主动管控的结果</b>（去年用表 G 拒绝了 3 笔 R&lt;55% 的旅游团队），不是失控，这个区别必须能说清楚，否则会被总经理误读为市场丢失。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">5</div>\n    <div class=\"step-body\">\n      <h4>LOY 是\"最被低估的一块\"</h4>\n      <p>产量 12%、增长率 <span class=\"up\">↑18%</span>（第二高）、渠道成本仅 4%、贡献度 <span class=\"flat\">－持平</span>。它的问题不是不赚钱，是<b>规模太小、涨得太慢相对于它的转化价值</b>。会员是唯一能绕过 OTA 又不损失产量的通道，12% 的占比明显低于行业中高端全服务酒店的健康区间。</p>\n    </div>\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">四维诊断的三句话输出模板（背下来）</span>\n    <p>诊断结束后，你必须能用三句话讲完，不讲第四句：<br>\n    ①「当前结构里，<b>___</b> 产量最大但贡献度只有 <b>___pt</b>，是首要压缩对象。」<br>\n    ②「<b>___</b> 贡献度最高（<b>___pt</b>）且增速最快（<b>___%</b>），是首要扶持对象。」<br>\n    ③「明年目标是把 <b>___</b> 的产量从 <b>___%</b> 调到 <b>___%</b>，通过 <b>6 个打法</b>落地，预计净 RevPAR <span class=\"up\">↑¥___</span>。」</p>\n  </div>\n\n  <\!-- ================= S3 ================= -->\n  <h2 id=\"s3\">三、置换分析：团队与协议的第一性原理</h2>\n\n  <p>销售部问你\"这个团队 ¥450 接不接\"，你不能回答\"我觉得有点低\"。你必须回答一个数字：<strong>接了它，我要付出多少代价</strong>。这个代价叫置换成本（Displacement Cost）。</p>\n\n  "}, {"id": "p5", "name": "1 置换成本公式（SPEC 表 G 原文，逐字引用）", "min": 8, "desc": "", "html": "<h3>3.1 置换成本公式（SPEC 表 G 原文，逐字引用）</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">《法典》表 G · 置换成本公式（供 L3 复核）</span>\n    置换成本 ＝ 被挤占房晚数 ×（预期散客 ADR − 团队价）＋ 被挤占的餐饮/其他边际收益<br>\n    <span class=\"cap-note\">其中「被挤占的餐饮/其他边际收益」＝ 被挤占房晚 × P1（本店 P1 ＝ ¥84/间晚，来源见 §1.1）</span>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">为什么是\"被挤占房晚\"而不是\"团队房晚\"</span>\n    <p>这两个数经常不相等，<b>取大者</b>。三种情形：</p>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>满房日</b>：团队要 40 间，但你只有 25 间空房 → 被挤占房晚 = 40（要先赶走 15 个散客才能腾出房间）。此时用团队房晚 40。</li>\n      <li><b>限制条件冲突</b>：团队要 40 间住 1 晚，但该日已设 MinLOS 2 晚 → 这 40 间会打断连住需求，被挤占房晚按 40 × 2 = 80 计。</li>\n      <li><b>淡季空房日</b>：团队要 40 间，你有 90 间空房且预测 OCC 只有 55% → 被挤占房晚 ≈ 0，置换成本 ≈ 0。这就是为什么淡季什么团队都该接。</li>\n    </ul>\n  </div>\n\n  "}, {"id": "p6", "name": "2 比率 R：把一切归一化的唯一输入", "min": 8, "desc": "", "html": "<h3>3.2 比率 R：把一切归一化的唯一输入</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">比率 R</span>\n    R ＝ 团队报价 ÷ 该日预期散客 ADR × 100%<br>\n    <span class=\"cap-note\">「该日预期散客 ADR」取值规则：平峰日用 SPEC 2.5 月度基准 ADR；D1 峰值日 × 150–200%；D2 高涨日 × 120–150%；D4 低谷日 × 70–85%。取档位下限时保守、取上限时激进，本教材统一取<b>档位下限</b>（D1 取 150%、D2 取 120%、D3 取 100%、D4 取 85%）。</span>\n  </div>\n\n  <p>R 的好处是<strong>把\"贵不贵\"这个主观判断变成了一个 0–100 的数字</strong>。R = 85% 意味着\"这个客户给我的钱，相当于我把房卖给散客的 85%\"。有了 R，再配上预测 OCC，就能直接查表，不需要任何主观判断。</p>\n\n  <\!-- ================= S4 ================= -->\n  <h2 id=\"s4\">四、《法典》表 G：团队／协议询价接受判定表（5×3 矩阵）</h2>\n\n  <div class=\"codex-block\" data-codex-block data-cat=\"grp\">\n    <div class=\"codex-head\">\n      <span class=\"badge-codex\">表 G</span>\n      "}, {"id": "p7", "name": "团队／协议询价接受判定表（置换分析简化版）", "min": 8, "desc": "", "html": "<h3>团队／协议询价接受判定表（置换分析简化版）</h3>\n    </div>\n    <div class=\"codex-desc\">\n      输入 1：<b>比率 R</b> = 团队报价 ÷ 该日预期散客 ADR × 100%<br>\n      输入 2：<b>该日预测 OCC</b>（在手 + 预测增量）\n    </div>\n\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl tbl-matrix\">\n        <caption>表 G　团队／协议询价接受判定表<span class=\"cap-note\">行 ＝ 比率 R，列 ＝ 预测 OCC。单元格为唯一动作，无需二次判断</span></caption>\n        <thead>\n          <tr>\n            <th>比率 R ＼ 预测 OCC</th>\n            <th>&lt;70%</th>\n            <th>70–85%</th>\n            <th>&gt;85%</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <th class=\"rowh\">R ≥ 85%</th>\n            <td><span class=\"pill pill-teal\">接受</span></td>\n            <td><span class=\"pill pill-teal\">接受</span></td>\n            <td><span class=\"pill pill-teal\">接受（≤10 间）</span></td>\n          </tr>\n          <tr>\n            <th class=\"rowh\">75% ≤ R &lt; 85%</th>\n            <td><span class=\"pill pill-teal\">接受</span></td>\n            <td><span class=\"pill pill-amber\">接受（≤20 间）</span></td>\n            <td><span class=\"pill pill-amber\">上报 L3</span></td>\n          </tr>\n          <tr>\n            <th class=\"rowh\">65% ≤ R &lt; 75%</th>\n            <td><span class=\"pill pill-amber\">接受（≤30 间）</span></td>\n            <td><span class=\"pill pill-amber\">上报 L3</span></td>\n            <td><span class=\"pill pill-red\">拒绝</span></td>\n          </tr>\n          <tr>\n            <th class=\"rowh\">55% ≤ R &lt; 65%</th>\n            <td><span class=\"pill pill-amber\">上报 L3</span></td>\n            <td><span class=\"pill pill-red\">拒绝</span></td>\n            <td><span class=\"pill pill-red\">拒绝</span></td>\n          </tr>\n          <tr>\n            <th class=\"rowh\">R &lt; 55%</th>\n            <td><span class=\"pill pill-red\">拒绝</span></td>\n            <td><span class=\"pill pill-red\">拒绝</span></td>\n            <td><span class=\"pill pill-red\">拒绝</span></td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n\n    <h4>全服务酒店附加条款（会议团队专属）· SPEC 原文</h4>\n    <p style=\"font-size:14px\">会议团队计算<strong>综合贡献</strong> = 客房收入 + 餐饮收入 + 会场租金 + 其他。<br>\n    若 <strong>综合贡献 ≥（占用房晚 × 预期散客 ADR × 85%）</strong>，则<strong>即使 R&lt;55% 也可接受</strong>，但须 L3 审批并记入《团队决策档案》。</p>\n\n    <div class=\"formula\">\n      <span class=\"f-label\">附加条款阈值</span>\n      可接受下限 ＝ 占用房晚 × 预期散客 ADR × 85%\n    </div>\n\n    <div class=\"formula\">\n      <span class=\"f-label\">置换成本公式（供 L3 复核）</span>\n      置换成本 ＝ 被挤占房晚数 ×（预期散客 ADR − 团队价）＋ 被挤占的餐饮/其他边际收益\n    </div>\n\n    <p class=\"codex-meta\">优先级：本表属《法典》表 O 第 7 层级，冲突时让位于表 L（应急）、表 B（库存）、表 A（价格）、表 C（ARI）、表 H（渠道）。团队决策<b>本身不是应急</b>，正常排队。</p>\n  </div>\n\n  <h3>4.1 表 G 的 5 条使用纪律</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 10-4　表 G 使用纪律<span class=\"cap-note\">违反任何一条，判定结果无效，且须重做</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>纪律</th><th>违反后果</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">1</td><td><b>预测 OCC 必须用\"在手 + 预测增量\"</b>，不能只用在手。只用在手会低估需求，导致淡季误判</td><td>旺季接了低价团队，损失不可追回</td></tr>\n        <tr><td class=\"num\">2</td><td><b>R 的分母必须取需求等级对应的系数后价格</b>，不能用平峰 BAR 一刀切</td><td>D1 峰值日把 R 从 53% 算成 80%，直接放行</td></tr>\n        <tr><td class=\"num\">3</td><td><b>限额接受的\"≤N 间\"指单次单日</b>，不是整笔合同总量</td><td>10 间/晚 × 5 晚 = 50 间夜，不等于\"10 间\"合规</td></tr>\n        <tr><td class=\"num\">4</td><td><b>\"上报 L3\"必须真的上报</b>，且 L3 须在 4 小时内回复（销售部询价有效期通常 24–48 小时）</td><td>客户流失，销售部从此绕过收益部</td></tr>\n        <tr><td class=\"num\">5</td><td><b>所有结论写入《团队决策档案》</b>，含 R、OCC、置换成本、综合贡献、最终动作、决策人</td><td>明年无法复盘，同样的问题重复讨论</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <\!-- ================= S5 ================= -->\n  <h2 id=\"s5\">五、《法典》表 K：会议／宴会综合收益联动</h2>\n\n  <p>表 G 只看客房。但杭州滨江云璟酒店是<strong>全服务酒店</strong>——有 1,200㎡ 无柱大宴会厅、3 个餐厅、460 个餐位。一笔会议生意的真实价值，客房可能只占三分之一。表 K 就是为此设计的。</p>\n\n  <div class=\"codex-block\" data-codex-block data-cat=\"grp\">\n    <div class=\"codex-head\">\n      <span class=\"badge-codex\">表 K</span>\n      <h3>会议／宴会综合收益联动表</h3>\n    </div>\n    <div class=\"codex-desc\">会议团队价值 = 客房收入 + 餐饮收入 + 会场租金 + 设备/其他</div>\n\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 K　会议／宴会综合收益联动表<span class=\"cap-note\">按会议规模分 4 档，每档给出餐饮保底与接受底线两个硬门槛，两条必须同时满足</span></caption>\n        <thead>\n          <tr><th>会议规模</th><th>客房需求</th><th class=\"num\">餐饮保底</th><th>接受底线（综合贡献）</th></tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td><b>小型</b>（≤30 人）</td><td>≤15 间夜</td>\n            <td class=\"num\">≥¥8,000</td>\n            <td>≥ 客房置换成本 × <b>1.1</b></td>\n          </tr>\n          <tr>\n            <td><b>中型</b>（31–120 人）</td><td>16–60 间夜</td>\n            <td class=\"num\">≥¥30,000</td>\n            <td>≥ 客房置换成本 × <b>1.0</b></td>\n          </tr>\n          <tr>\n            <td><b>大型</b>（121–300 人）</td><td>61–150 间夜</td>\n            <td class=\"num\">≥¥80,000</td>\n            <td>≥ 客房置换成本 × <b>0.95</b></td>\n          </tr>\n          <tr>\n            <td><b>超大型</b>（&gt;300 人）</td><td>&gt;150 间夜</td>\n            <td class=\"num\">≥¥150,000</td>\n            <td>≥ 客房置换成本 × <b>0.9</b> ＋ L3/业主审批</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n\n    <h4>决策顺序（严格按此三步，不得跳步）</h4>\n    <div class=\"flow\">\n      <div class=\"flow-item\"><div class=\"fi-t\">① 问餐饮/宴会承接能力</div><div class=\"fi-d\">日期、人数、餐标、厅型是否被占。承接不了直接终止，后面两步不必做</div></div>\n      <div class=\"flow-arrow\">→</div>\n      <div class=\"flow-item\"><div class=\"fi-t\">② 算综合贡献</div><div class=\"fi-d\">客房收入 + 餐饮收入 + 会场租金 + 设备/其他</div></div>\n      <div class=\"flow-arrow\">→</div>\n      <div class=\"flow-item\"><div class=\"fi-t\">③ 查表 G 客房比率</div><div class=\"fi-d\">用 R 与预测 OCC 交叉，得出接受/限额接受/上报/拒绝</div></div>\n    </div>\n\n    <div class=\"callout callout-danger\" style=\"margin-top:14px\">\n      <span class=\"co-t\">红线</span>\n      <p><b>餐饮毛利率 &lt; 55% 的会议，须 L3 审批。</b>餐饮毛利率 =（餐饮收入 − 餐饮成本）÷ 餐饮收入 × 100%。销售部报的\"餐饮收入 ¥22,000\"不是贡献，要问成本。</p>\n    </div>\n\n    <p class=\"codex-meta\">本表与表 G 的关系：<b>表 G 判定客房，表 K 判定整体</b>。当表 G 说\"拒绝\"但表 K 的附加条款成立时，走表 G 附加条款路径：即使 R&lt;55% 也可接受，但必须 L3 审批 + 记入《团队决策档案》。</p>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">表 K 的档位按\"人数\"分，接受底线按\"间夜\"算</span>\n    <p>这是本表最容易搞混的地方。<b>选档</b>看参会人数（≤30 / 31–120 / 121–300 / &gt;300）；<b>算底线</b>用客房置换成本（一个房晚数）。一笔 100 人、50 间 × 2 晚 = 100 间夜的会议，按人数是<b>中型</b>（餐饮保底 ¥30,000、倍数 1.0），但按间夜已落入<b>大型</b>区间（61–150 间夜）。<b>规则：档位一律按人数选定，间夜数只用于计算客房置换成本与核对表 G 的 R。</b></p>\n  </div>\n\n  <\!-- ================= S6 ================= -->\n  <h2 id=\"s6\">六、客源结构目标设定与 6 个标准打法</h2>\n\n  <h3>6.1 目标怎么定才不是拍脑袋</h3>\n\n  <p>\"明年 OTA 占比从 31% 降到 26%\"——这句话本身不是目标，是愿望。要变成目标，必须完成下面 4 步拆解，缺一步就不能写进预算文件。</p>\n\n  <div class=\"step\">\n    <div class=\"step-num\">1</div>\n    <div class=\"step-body\">\n      <h4>定幅度上限：一年最多动 5 个百分点</h4>\n      <p>客源结构有惯性。<b>单个细分一年调整的幅度上限是 5 个百分点（pt）</b>。31% → 26% 正好是 5pt，是满格动作，需要 6 个打法全部落地；若想降到 24%，必须给出连续两年的路线图，不能一年完成。依据：FIT-DIR 上年增长 22% 但基数只有 14,296 房晚，一年最多新增约 3,150 房晚（22% 自然增长），再加打法带来的增量 4,205 房晚，合计约 7,355 房晚，占总房晚 7.8%，扣除 GRP/CORP 的正常波动后，稳定承接 5pt 是可行的上限。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">2</div>\n    <div class=\"step-body\">\n      <h4>定承接方：5pt 的房晚必须有人接走</h4>\n      <p>31% → 26% 意味着从 FIT-OTA 拿走 <b>4,205 个房晚</b>（84,096 × 5%）。这 4,205 个房晚不能凭空消失，必须指定承接方。本店指定 <b>FIT-DIR</b>（渠道成本 3%）承接 3,000 房晚、<b>LOY</b>（渠道成本 4%）承接 1,205 房晚。<b>不写承接方的降 OTA 目标一律退回重写。</b></p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">3</div>\n    <div class=\"step-body\">\n      <h4>算收益：把结构变化换算成钱</h4>\n      <div class=\"formula\">\n        <span class=\"f-label\">结构优化的收益测算</span>\n        转移房晚 4,205 个，从 FIT-OTA（ADR ¥598 / 成本 16%）转到 FIT-DIR（ADR ¥650 / 成本 3%）<br>\n        客房收入变化 ＝ 4,205 ×（650 − 598）＝ <span class=\"f-out\">↑¥218,660</span><br>\n        渠道成本变化 ＝ 4,205 × 598 × 16% − 4,205 × 650 × 3% ＝ 402,334 − 81,998 ＝ ↓¥320,337<br>\n        净收入变化 ＝ <span class=\"f-out\">↑¥538,997</span>（＝ ↑218,660 ＋ ↓320,337）<br>\n        折合净 RevPAR ＝ 538,997 ÷ 116,800 ＝ <span class=\"f-out\">↑¥4.61</span>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">4</div>\n    <div class=\"step-body\">\n      <h4>定验收：分季度里程碑 + 月度看板</h4>\n      <p>年度目标必须切成 4 个季度里程碑，配月度看板。本店 5pt 目标的季度节奏：<b>Q1 降 0.5pt（打法上线期）</b>、<b>Q2 降 1.5pt</b>、<b>Q3 降 1.5pt</b>、<b>Q4 降 1.5pt</b>。理由：Q1 是淡季（OCC 58/62/74%），直销转化话术与会员活动需要 60 天爬坡，Q1 只能验收获客流程跑通，不能要求产量。任一季度落后里程碑 1pt 以上，触发《应急方案 L2-E1》的复盘机制（表 D：MPI&lt;85 时的 48 小时复盘）。</p>\n    </div>\n  </div>\n\n  <h3>6.2 六个标准打法（Standard Plays）</h3>\n\n  <p>下面 6 个打法是本模块认证的<strong>唯一标准动作集</strong>。每一个都有触发条件、执行动作、验收指标、对应《法典》条款。写客源结构优化方案时，从这 6 个里挑，不要自己发明第 7 个。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 10-5　客源结构优化 6 个标准打法<span class=\"cap-note\">每个打法都标注了触发条件、执行动作、验收指标与法典依据</span></caption>\n      <thead>\n        <tr><th class=\"num\">#</th><th>打法</th><th>触发条件</th><th>执行动作（系统无关）</th><th>验收指标</th><th>法典依据</th></tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">P1</td><td><b>会员专享价差锁客</b></td>\n          <td>会员产量占比 &lt;15%（本店 12%）</td>\n          <td>在价格日历中为会员价格代码设置专享价 = OTA 挂牌价 × 92%；该价格<b>仅限登录会员可见</b>，不对公众挂牌</td>\n          <td>季度末会员占比 ≥15%，会员复购率不降</td>\n          <td>表 H 价格一致性：会员价可低于 OTA 价，但仅限登录会员可见</td>\n        </tr>\n        <tr>\n          <td class=\"num\">P2</td><td><b>直销最低价保证</b></td>\n          <td>任一监测日发现直销价 &gt; OTA 挂牌价</td>\n          <td>24 小时内整改至直销价 ≤ OTA 价 × 100%，并记入考核；整改后 30 分钟复查 6 个渠道</td>\n          <td>价格一致性违规次数月度 ≤1 次</td>\n          <td>表 H 红线 + 表 M 09:40 一致性核查</td>\n        </tr>\n        <tr>\n          <td class=\"num\">P3</td><td><b>OTA 库存配额压缩</b></td>\n          <td>目标日预测 OCC ≥85%</td>\n          <td>按表 H 逐级收缩：OCC 85–90% 开 3 家 → 90–95% 开 2 家且关 OTA 国际 → ≥95% 仅留 1 家产量最高且关 GDS/批发商</td>\n          <td>高需求日 OTA 产量占比 ≤ 当月均值 −8pt</td>\n          <td>表 H 渠道开关判定表</td>\n        </tr>\n        <tr>\n          <td class=\"num\">P4</td><td><b>前台/预订部转直销话术与激励</b></td>\n          <td>OTA 来电/到店转化率 &lt;20%</td>\n          <td>预订部接 OTA 渠道来电时，报出会员价并说明\"官网/小程序同价且累计积分\"；每成功转化 1 间夜奖励 ¥15，月度随工资发放</td>\n          <td>月度转化 ≥800 间夜，转化率 ≥20%</td>\n          <td>表 M 10:05 收益晨会同步 + P1 价格差</td>\n        </tr>\n        <tr>\n          <td class=\"num\">P5</td><td><b>协议客户续约提价</b></td>\n          <td>CORP 均价 &lt; 综合 ADR × 88%（本店 ¥520 &lt; ¥543.8）</td>\n          <td>续约谈判按三档处理：年产量 ≥600 间夜 → 提至 ¥560（<span class=\"up\">↑7.7%</span>）；300–599 间夜 → 提至 ¥545（<span class=\"up\">↑4.8%</span>）；&lt;300 间夜 → 提至 ¥580 或转 OTA 公开价</td>\n          <td>续约后 CORP 加权均价 ≥¥545，流失率 ≤8%</td>\n          <td>表 G（协议同表）+ 表 N 每季度协议客户分级</td>\n        </tr>\n        <tr>\n          <td class=\"num\">P6</td><td><b>团队置换管控</b></td>\n          <td>GRP 净 RevPAR 贡献 &lt;¥25（本店 ¥19.18）</td>\n          <td>所有团队询价一律先算 R 与置换成本、查表 G；会议团队追加表 K 综合贡献与餐饮保底；R&lt;55% 的旅游团队一律拒绝，改推会议团队或改期</td>\n          <td>GRP 产量 ≤8% 且均价 ≥¥470，会议团队占 GRP 房晚 ≥50%</td>\n          <td>表 G + 表 K</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">6 个打法的组合规则</span>\n    <p>降 OTA 必须<b>P1 + P2 + P3 + P4 四个打法同时上线</b>，缺任何一个，5pt 目标都无法达成：<br>\n    · 缺 P1 → 会员价没有吸引力，转过来的客人留不住<br>\n    · 缺 P2 → 客人在 OTA 看到更低价，直销转化失败<br>\n    · 缺 P3 → 高需求日 OTA 仍在放量，占比压不下去<br>\n    · 缺 P4 → 一线没有转单动力，话术不落地<br>\n    P5、P6 是配套动作，用于堵住\"OTA 压下来后房晚流向 CORP 和 GRP 低价池\"的漏洞。</p>\n  </div>\n\n  <\!-- ================= 讲师示范 ================= -->\n  <h2 id=\"demo\">七、讲师示范</h2>\n\n  <h3>示范一：接——10 月 16 日会议团队，R = 60%，预测 OCC 78%</h3>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>完整走一遍决策链条</div>\n\n    <div class=\"kv\">\n      <div class=\"kv-k\">询价内容</div><div class=\"kv-v\">某动漫协会：40 间 × 2 晚 = <b>80 房晚</b>，客房报价 ¥420/间晚；配套宴会厅 2 天，餐饮报价 ¥92,000（毛利率 58%），会场租金 ¥18,000</div>\n      <div class=\"kv-k\">日期基准</div><div class=\"kv-v\">10 月 16 日（周四）。SPEC 2.5 月度基准：10 月 OCC 85%、ADR ¥700。该日预测 OCC <b>78%</b>，属 D3 平峰日，价格系数取 100%</div>\n      <div class=\"kv-k\">第 1 步 算 R</div><div class=\"kv-v\">R ＝ 420 ÷ 700 × 100% ＝ <b>60.0%</b></div>\n      <div class=\"kv-k\">第 2 步 查表 G</div><div class=\"kv-v\">行「55% ≤ R &lt; 65%」× 列「70–85%」＝ <span class=\"pill pill-amber\">上报 L3</span></div>\n      <div class=\"kv-k\">第 3 步 算置换成本</div><div class=\"kv-v\">被挤占房晚 = 80（该日预测 OCC 78%，在手 250 间，剩余 70 间，40 间/晚不触发强制腾房，但按保守口径取团队房晚 80）<br>\n        客房部分 ＝ 80 ×（700 − 420）＝ ¥22,400<br>\n        餐饮部分 ＝ 80 × P1（¥84）＝ ¥6,720<br>\n        <b>置换成本 ＝ ¥29,120</b></div>\n      <div class=\"kv-k\">第 4 步 算综合贡献</div><div class=\"kv-v\">客房 80 × 420 ＝ ¥33,600；餐饮 ¥92,000；会场 ¥18,000<br>\n        <b>综合贡献 ＝ ¥143,600</b></div>\n      <div class=\"kv-k\">第 5 步 查表 K</div><div class=\"kv-v\">规模：参会 260 人 → <b>大型（121–300 人）</b><br>\n        餐饮保底 ≥¥80,000：实际 ¥92,000 <span class=\"pill pill-teal\">达标</span><br>\n        接受底线 ＝ 客房置换成本 × 0.95 ＝ 29,120 × 0.95 ＝ <b>¥27,664</b>：综合贡献 ¥143,600 <span class=\"pill pill-teal\">远超</span><br>\n        餐饮毛利率 58% ≥ 55% <span class=\"pill pill-teal\">不触红线</span></div>\n      <div class=\"kv-k\">第 6 步 验附加条款</div><div class=\"kv-v\">阈值 ＝ 占用房晚 80 × 预期散客 ADR ¥700 × 85% ＝ <b>¥47,600</b><br>\n        综合贡献 ¥143,600 ≥ ¥47,600 <span class=\"pill pill-teal\">成立</span>（余量 ¥96,000，安全边际 202%）</div>\n      <div class=\"kv-k\">最终动作</div><div class=\"kv-v\"><span class=\"pill pill-teal\">接受</span>　但表 G 判定为「上报 L3」，故须 <b>L3 收益经理审批</b>并记入《团队决策档案》，方可向销售部发出确认</div>\n      <div class=\"kv-k\">给销售部的话</div><div class=\"kv-v\">\"这笔可以接，R 是 60%，按表 G 要 L3 批，我已经批了。你跟客户确认两点：餐饮 ¥92,000 不能降，因为这是表 K 大型会议的保底 ¥80,000 之上只留了 15% 空间；会场 ¥18,000 单独签，不要并进客房价里。\"</div>\n    </div>\n\n    <p class=\"card-note\"><b>为什么接</b>：客房本身是亏的（R=60%），但餐饮 + 会场贡献了 ¥110,000，是客房置换成本 ¥29,120 的 3.8 倍。这正是全服务酒店与有限服务酒店的根本区别——<b>有限服务酒店看表 G 就够了，全服务酒店必须走表 K</b>。</p>\n  </div>\n\n  <h3>示范二：拒——10 月 2 日 D1 峰值日，R = 53.3%，预测 OCC 96%</h3>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>完整走一遍决策链条</div>\n\n    <div class=\"kv\">\n      <div class=\"kv-k\">询价内容</div><div class=\"kv-v\">某行业协会：60 间 × 1 晚 = <b>60 房晚</b>，客房报价 ¥560/间晚；配套自助晚餐 100 人，餐饮报价 ¥22,000（毛利率 52%）；不使用宴会厅（会场租金 ¥0）</div>\n      <div class=\"kv-k\">日期基准</div><div class=\"kv-v\">10 月 2 日（国庆假期，D1 峰值日）。SPEC 2.5：D1 价格系数 150–200%，取档位下限 150%。<br>\n        预期散客 ADR ＝ 10 月基准 ¥700 × 150% ＝ <b>¥1,050</b>。该日预测 OCC <b>96%</b>（D1 目标 ≥95%）</div>\n      <div class=\"kv-k\">第 1 步 算 R</div><div class=\"kv-v\">R ＝ 560 ÷ 1,050 × 100% ＝ <b>53.3%</b> → 落入「R &lt; 55%」行</div>\n      <div class=\"kv-k\">第 2 步 查表 G</div><div class=\"kv-v\">行「R &lt; 55%」× 列「&gt;85%」＝ <span class=\"pill pill-red\">拒绝</span></div>\n      <div class=\"kv-k\">第 3 步 算置换成本</div><div class=\"kv-v\">被挤占房晚 = 60（D1 日预测 OCC 96%，仅剩 13 间空房，60 间需先挤走 47 个散客，按团队房晚 60 计）<br>\n        客房部分 ＝ 60 ×（1,050 − 560）＝ ¥29,400<br>\n        餐饮部分 ＝ 60 × P1（¥84）＝ ¥5,040<br>\n        <b>置换成本 ＝ ¥34,440</b></div>\n      <div class=\"kv-k\">第 4 步 算综合贡献</div><div class=\"kv-v\">客房 60 × 560 ＝ ¥33,600；餐饮 ¥22,000；会场 ¥0<br>\n        <b>综合贡献 ＝ ¥55,600</b></div>\n      <div class=\"kv-k\">第 5 步 验附加条款</div><div class=\"kv-v\">阈值 ＝ 60 × 1,050 × 85% ＝ <b>¥53,550</b><br>\n        综合贡献 ¥55,600 ≥ ¥53,550 <span class=\"pill pill-amber\">成立，但仅超出 ¥2,050</span><br>\n        安全边际 ＝ 2,050 ÷ 55,600 ＝ <b>3.7%</b></div>\n      <div class=\"kv-k\">第 6 步 查表 K 红线</div><div class=\"kv-v\">餐饮毛利率 52% &lt; 55% → <span class=\"pill pill-red\">触红线，须 L3 审批</span><br>\n        餐饮成本 ＝ 22,000 ×（1 − 52%）＝ ¥10,560<br>\n        回到 55% 毛利率所需餐饮收入 ＝ 10,560 ÷ 45% ＝ <b>¥23,467</b>（需提价 ¥1,467，<span class=\"up\">↑6.7%</span>）</div>\n      <div class=\"kv-k\">L3 裁决</div><div class=\"kv-v\"><span class=\"pill pill-red\">客房拒绝，餐饮单独承接</span><br>\n        三条理由，逐条成立：<br>\n        ① 附加条款虽成立，但安全边际 3.7% <b>小于滚动预测当月误差容忍带 ±3% 的 1.25 倍</b>，即\"这笔赚不赚，落在预测误差里说不清\"，按 L3 决策规则，安全边际 &lt;5% 一律拒绝<br>\n        ② D1 峰值日目标 OCC ≥95%（SPEC 2.5），当前预测 96%，散客需求确定性极高，60 间房晚的散客价值 ¥63,000（60 × 1,050）远高于团队 ¥33,600<br>\n        ③ 餐饮毛利率 52% 低于表 K 红线 55%，本身就需要 L3 审批，与客房决策叠加后风险不可控</div>\n      <div class=\"kv-k\">替代方案</div><div class=\"kv-v\">向客户提出<b>改期至 10 月 8 日</b>（平峰日，预测 OCC 72%）：<br>\n        R ＝ 560 ÷ 700 ＝ <b>80.0%</b> → 行「75% ≤ R &lt; 85%」× 列「70–85%」＝ <span class=\"pill pill-amber\">接受（≤20 间）</span><br>\n        60 间 &gt; 20 间上限 → 上报 L3。L3 复核：置换成本 ＝ 60 ×（700 − 560）＋ 60 × 84 ＝ 8,400 ＋ 5,040 ＝ <b>¥13,440</b>；综合贡献 ＝ 33,600 ＋ 22,000 ＝ <b>¥55,600</b> ≥ 13,440 <span class=\"pill pill-teal\">接受</span></div>\n      <div class=\"kv-k\">给销售部的话</div><div class=\"kv-v\">\"10 月 2 日这笔房我不能批，我给你三个数字你自己判断：那天我们的散客价能做到 ¥1,050，预测出租率 96%，你报价 ¥560 相当于打 5.3 折，一间房我要亏 ¥490，60 间是 ¥29,400，加上餐饮损失是 ¥34,440。<b>餐饮我可以单独接，但毛利率 52% 低于我们 55% 的红线，需要提到 ¥23,467。</b>或者你跟客户谈改到 10 月 8 日，那天 60 间我全接，客房价还是 ¥560。\"</div>\n    </div>\n\n    <p class=\"card-note\"><b>讲师提示</b>：这段示范的精髓不在\"拒绝\"，而在<b>拒绝的同时给替代方案</b>。只说\"不\"的收益经理，三个月后销售部就不会再来问你；给了替代方案的收益经理，销售部会把询价提前 30 天发给你。</p>\n  </div>\n\n  <\!-- ================= 学员跟练 ================= -->\n  <h2 id=\"practice\">八、学员跟练（5 题）</h2>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">跟练规则</span>\n    <p>独立完成，不得讨论。每题限时 8 分钟。<b>必须写出算式</b>，只写答案不计分。P1 一律取 ¥84/间晚。D1 价格系数取 150%、D2 取 120%、D3 取 100%、D4 取 85%。</p>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 1 · 四维诊断填表</div>\n    <div class=\"q-b\">已知某月售出房晚 7,872 间（可售 9,600 间），其中：FIT-OTA 2,600 间 @¥598、CORP 1,900 间 @¥520、FIT-DIR 1,400 间 @¥650、LOY 900 间 @¥580、GRP 700 间 @¥450、FIT-WI 300 间 @¥720、LNG 72 间 @¥380。<br>请填出：各细分房晚占比、客房收入、收入占比、<b>贡献度（收入占比 − 房晚占比）</b>，并指出该月最该被压缩的细分。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">\n        <b>总收入</b> ＝ 2,600×598 ＋ 1,900×520 ＋ 1,400×650 ＋ 900×580 ＋ 700×450 ＋ 300×720 ＋ 72×380<br>\n        ＝ 1,554,800 ＋ 988,000 ＋ 910,000 ＋ 522,000 ＋ 315,000 ＋ 216,000 ＋ 27,360 ＝ <b>¥4,533,160</b><br>\n        （校验：房晚合计 7,872；加权 ADR ＝ 4,533,160 ÷ 7,872 ＝ ¥575.9）\n        <table class=\"tbl\" style=\"margin-top:10px;font-size:12.5px\">\n          <thead><tr><th>细分</th><th class=\"num\">房晚</th><th class=\"num\">占比</th><th class=\"num\">收入</th><th class=\"num\">收入占比</th><th class=\"num\">贡献度</th></tr></thead>\n          <tbody>\n            <tr><td>FIT-OTA</td><td class=\"num\">2,600</td><td class=\"num\">33.03%</td><td class=\"num\">¥1,554,800</td><td class=\"num\">34.30%</td><td class=\"num\"><span class=\"up\">+1.27pt</span></td></tr>\n            <tr><td>CORP</td><td class=\"num\">1,900</td><td class=\"num\">24.14%</td><td class=\"num\">¥988,000</td><td class=\"num\">21.79%</td><td class=\"num\"><span class=\"down\">−2.35pt</span></td></tr>\n            <tr><td>FIT-DIR</td><td class=\"num\">1,400</td><td class=\"num\">17.78%</td><td class=\"num\">¥910,000</td><td class=\"num\">20.07%</td><td class=\"num\"><span class=\"up\">+2.29pt</span></td></tr>\n            <tr><td>LOY</td><td class=\"num\">900</td><td class=\"num\">11.43%</td><td class=\"num\">¥522,000</td><td class=\"num\">11.51%</td><td class=\"num\"><span class=\"flat\">+0.08pt</span></td></tr>\n            <tr><td>GRP</td><td class=\"num\">700</td><td class=\"num\">8.89%</td><td class=\"num\">¥315,000</td><td class=\"num\">6.95%</td><td class=\"num\"><span class=\"down\">−1.94pt</span></td></tr>\n            <tr><td>FIT-WI</td><td class=\"num\">300</td><td class=\"num\">3.81%</td><td class=\"num\">¥216,000</td><td class=\"num\">4.76%</td><td class=\"num\"><span class=\"up\">+0.95pt</span></td></tr>\n            <tr><td>LNG</td><td class=\"num\">72</td><td class=\"num\">0.91%</td><td class=\"num\">¥27,360</td><td class=\"num\">0.60%</td><td class=\"num\"><span class=\"down\">−0.31pt</span></td></tr>\n          </tbody>\n        </table>\n        <b>最该被压缩的细分：CORP</b>。理由：产量 24.14%（第二大盘）但贡献度 <span class=\"down\">−2.35pt</span>（全场最低），均价 ¥520 低于该月加权 ADR ¥575.9 达 9.7%。GRP 贡献度虽为 <span class=\"down\">−1.94pt</span>，但产量仅 8.89%，压缩它对大盘影响小。<b>先动产量大且贡献度最低的 CORP，这是四维交叉的唯一排序规则：先按贡献度升序排，再在同档内按产量降序排。</b>\n      </div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 2 · 团队询价决策（一）</div>\n    <div class=\"q-b\">11 月 20 日（平峰日），预测 OCC 68%，11 月基准 ADR ¥640。某旅行社询价：25 间 × 2 晚 = 50 房晚，报价 ¥400/间晚，无餐饮无会场。<br>请给出：R、表 G 判定、置换成本、最终动作。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">\n        R ＝ 400 ÷ 640 × 100% ＝ <b>62.5%</b> → 行「55% ≤ R &lt; 65%」<br>\n        预测 OCC 68% &lt; 70% → 列「&lt;70%」<br>\n        <b>表 G 判定：<span class=\"pill pill-amber\">上报 L3</span></b><br><br>\n        置换成本 ＝ 50 ×（640 − 400）＋ 50 × 84 ＝ 12,000 ＋ 4,200 ＝ <b>¥16,200</b><br>\n        团队客房收入 ＝ 50 × 400 ＝ ¥20,000；综合贡献 ＝ ¥20,000（无餐饮无会场）<br>\n        附加条款阈值 ＝ 50 × 640 × 85% ＝ ¥27,200。综合贡献 ¥20,000 &lt; ¥27,200 → <b>附加条款不成立</b><br>\n        表 K 不适用（非会议团队，无餐饮保底可核）<br><br>\n        <b>L3 裁决：有条件接受。</b>理由：D4/D3 边缘日（OCC 68% 接近 &lt;70% 档），客房收入 ¥20,000 已覆盖置换成本 ¥16,200 的 123%，净收益 ¥3,800。批准 25 间 × 2 晚，但附加两条约束：<b>① 不得再加房；② 该合同不得续签至次年 11 月同档价格</b>（防止形成价格锚点）。记入《团队决策档案》。\n      </div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 3 · 会议询价决策（二）</div>\n    <div class=\"q-b\">9 月 18 日（平峰日），预测 OCC 80%，9 月基准 ADR ¥670。某企业年会：参会 100 人，客房 50 间 × 2 晚 = 100 房晚，报价 ¥450/间晚；餐饮报价 ¥48,000（毛利率 60%）；会场租金 ¥12,000。<br>请给出：R、表 G 判定、客房置换成本、表 K 档位与两项门槛核验、附加条款核验、最终动作。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">\n        R ＝ 450 ÷ 670 × 100% ＝ <b>67.2%</b> → 行「65% ≤ R &lt; 75%」<br>\n        预测 OCC 80% → 列「70–85%」<br>\n        <b>表 G 判定：<span class=\"pill pill-red\">拒绝</span></b>（客房单独看不可接受）<br><br>\n        客房置换成本 ＝ 100 ×（670 − 450）＋ 100 × 84 ＝ 22,000 ＋ 8,400 ＝ <b>¥30,400</b><br>\n        综合贡献 ＝ 100 × 450 ＋ 48,000 ＋ 12,000 ＝ 45,000 ＋ 48,000 ＋ 12,000 ＝ <b>¥105,000</b><br><br>\n        <b>表 K 核验</b>：参会 100 人 → <b>中型（31–120 人）</b><br>\n        · 餐饮保底 ≥¥30,000：实际 ¥48,000 <span class=\"pill pill-teal\">达标</span><br>\n        · 接受底线 ＝ 客房置换成本 × 1.0 ＝ ¥30,400：综合贡献 ¥105,000 <span class=\"pill pill-teal\">达标</span><br>\n        · 餐饮毛利率 60% ≥ 55% <span class=\"pill pill-teal\">不触红线</span><br><br>\n        <b>附加条款核验</b>：阈值 ＝ 100 × 670 × 85% ＝ <b>¥56,950</b>。综合贡献 ¥105,000 ≥ ¥56,950 <span class=\"pill pill-teal\">成立</span>（余量 ¥48,050，安全边际 84.4% &gt; 5%）<br><br>\n        <b>最终动作：<span class=\"pill pill-teal\">接受</span></b>，须 L3 审批并记入《团队决策档案》。<br>\n        关键逻辑：表 G 单独判定为\"拒绝\"，但这是<b>会议团队</b>，表 K 附加条款路径成立（综合贡献 ¥105,000 ≥ 阈值 ¥56,950，且安全边际 84.4% 远高于 5% 决策线），因此按表 G 附加条款放行。<b>表 G 的\"拒绝\"是针对纯客房团队，不是针对会议团队——这是本模块最高频的考点。</b>\n      </div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 4 · 目标拆解</div>\n    <div class=\"q-b\">总经理要求：\"明年把 OTA 占比从 31% 降到 24%。\"请判断这个要求是否可执行；若不可执行，给出你的反提议与完整测算。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">\n        <b>不可执行。</b>幅度 7pt，超过单个细分年度调整上限 5pt。<br><br>\n        <b>反提议：两年路线图，第一年 31% → 26%（5pt，满格），第二年 26% → 22%（4pt）。</b><br><br>\n        第一年测算：<br>\n        · 转移房晚 ＝ 84,096 × 5% ＝ <b>4,205 房晚</b><br>\n        · 承接方：FIT-DIR 承接 3,000 房晚、LOY 承接 1,205 房晚<br>\n        · 客房收入变化 ＝ 3,000 ×（650 − 598）＋ 1,205 ×（580 − 598）＝ 156,000 − 21,690 ＝ <span class=\"up\">↑¥134,310</span><br>\n        · 渠道成本变化 ＝ 4,205 × 598 × 16% −［3,000 × 650 × 3% ＋ 1,205 × 580 × 4%］＝ 402,334 −（58,500 ＋ 27,956）＝ <span class=\"down\">↓¥315,878</span><br>\n        · 净收入变化 ＝ 134,310 ＋ 315,878 ＝ <span class=\"up\">↑¥450,188</span>；折合净 RevPAR <span class=\"up\">↑¥3.85</span><br><br>\n        <b>注</b>：LOY 均价 ¥580 低于 OTA 的 ¥598，单看客房收入是 <span class=\"down\">↓¥21,690</span>；但 LOY 渠道成本仅 4%，净收益仍 <span class=\"up\">↑</span>。这说明<b>结构优化必须用净收入口径评估，用毛收入口径会误杀会员渠道</b>。<br><br>\n        配套：6 个打法全部上线（P1–P6），季度里程碑 Q1 0.5pt / Q2 1.5pt / Q3 1.5pt / Q4 1.5pt。\n      </div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 5 · 综合判断</div>\n    <div class=\"q-b\">下表为某季度实际数据。请指出 3 个必须立刻处理的问题，并为每个问题给出对应的标准打法编号（P1–P6）与触发条件。</div>\n    <div class=\"tbl-wrap\" style=\"margin:10px 0\">\n      <table class=\"tbl\">\n        <thead><tr><th>细分</th><th class=\"num\">房晚</th><th class=\"num\">占比</th><th class=\"num\">ADR</th><th class=\"num\">同比</th></tr></thead>\n        <tbody>\n          <tr><td>FIT-OTA</td><td class=\"num\">7,120</td><td class=\"num\">34.8%</td><td class=\"num\">¥588</td><td class=\"num\"><span class=\"up\">↑18%</span></td></tr>\n          <tr><td>FIT-DIR</td><td class=\"num\">3,180</td><td class=\"num\">15.5%</td><td class=\"num\">¥642</td><td class=\"num\"><span class=\"up\">↑6%</span></td></tr>\n          <tr><td>CORP</td><td class=\"num\">4,600</td><td class=\"num\">22.5%</td><td class=\"num\">¥515</td><td class=\"num\"><span class=\"up\">↑1%</span></td></tr>\n          <tr><td>LOY</td><td class=\"num\">2,180</td><td class=\"num\">10.6%</td><td class=\"num\">¥572</td><td class=\"num\"><span class=\"up\">↑9%</span></td></tr>\n          <tr><td>GRP</td><td class=\"num\">2,150</td><td class=\"num\">10.5%</td><td class=\"num\">¥432</td><td class=\"num\"><span class=\"up\">↑12%</span></td></tr>\n          <tr><td>其他</td><td class=\"num\">1,240</td><td class=\"num\">6.1%</td><td class=\"num\">—</td><td class=\"num\">—</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">\n        <b>问题 1：FIT-OTA 占比 34.8%，超年度目标上限 31% 达 3.8pt，且增速 ↑18% 为全场最高。</b><br>\n        → 打法 <b>P1 + P2 + P3 + P4 四件套</b>。触发条件：OTA 占比 &gt;32%（超标）、增速 &gt; 大盘增速（↑18% vs 直销 ↑6%）。先查价格一致性（P2），再上会员价差（P1），高需求日压 OTA 配额（P3），同步启动前台转单激励（P4）。<br><br>\n        <b>问题 2：GRP 产量 10.5%，超 8% 上限 2.5pt，均价 ¥432 低于基准 ¥450。</b><br>\n        → 打法 <b>P6 团队置换管控</b>。触发条件：GRP 产量 &gt;8% 且均价 &lt;¥450。动作：所有团队询价强制走表 G 算 R 与置换成本；R&lt;55% 一律拒绝；销售部月度团队审批单必须附《团队决策档案》编号，无
