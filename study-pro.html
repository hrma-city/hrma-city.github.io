</span>。新价 = 520×0.80 = <b>¥416</b>。<br>\n      约束：累计 ↓20% = 上限 ✓；第 1 次 ✓；20%≥3% ✓；非 D1 无需 L3 ✓。<br>\n      <b>注意：</b>新价 ¥416 已低于 D4 系数下限（680×70% = ¥476），说明需求显著偏离常规低谷。<b>核查表 L：48h Pickup 落后 18.0%，未达「&gt;40%」阈值 → 不触发表 L 需求暴跌</b>，继续按表 A 执行。<br>\n      <b>② 表 B（&lt;70%）：</b>MinLOS <b>不设限</b>；CTA <b>否</b>；低价渠道 <b>全开 + 上促销</b>；<b>不超售</b>。<br>\n      <b>表 H（&lt;55%）：</b>OTA 国内<b>全开 + 深折</b>；OTA 国际<b>全开</b>；GDS <b>开 + 商务套餐</b>；批发商 <b>开 + 打包产品</b>（净价不得公开挂牌）；直销/会员 <b>全开 + 长住/团购</b>。<br>\n      <b>③ 表 C：</b>ARI = 520÷600×100 = <b>86.7</b> →「80–90 偏低」→ <b>提 5%</b>。<b>表 D：</b>MPI = 37.5÷52.0×100 = <b>72.1</b> →「&lt;85 严重落后」→ 启动 L2-E1：降价 10% + 全员直销动员 + 48 小时复盘。<br>\n      <b>④ 仲裁：</b>价格类动作三方冲突——表 A ↓20%（优先级 3）、表 C ↑5%（4）、表 D ↓10%（6）。<b>只执行表 A 的 ↓20%</b>；表 C 的 ↑5% 与表 D 的 ↓10% 均写入《观察清单》。<br>\n      <b>表 D 组合包拆分：</b>「降价 10%」是价格动作 → 与表 A 同类 → <b>不执行</b>；「全员直销动员」「48 小时复盘」是<b>非价格动作</b> → 不与表 A 冲突 → <b>照常执行</b>，列入《今日动作清单》并行推进，全部写入台账备注栏。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">场景 4 · 超售计算（表 E 三步法）</div>\n    <div class=\"q-b\">目标日：9 月 26 日（周五，D2 高涨日），可售房量 320 间。历史 No-show 率 + 24h 内取消率合计 18%；担保预订占比 72%；会议团队占当日 45%；协议客户集中度 38%；步行 30 分钟内有同档次备用酒店。<br>请按表 E 三步算出超售上限；再算：若该日会议团队占比降到 30%，结果会变成多少。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>情形一（会议团队 45%）：</b><br>\n      第一步：18% 落「15–20%」档 → 基准超售率 <b>5%</b><br>\n      第二步：D2 高涨日 → <b>×0.5</b>；担保 72%&gt;60% → <b>×0.5</b>；会议团队 45%&gt;40% → <b>×0.5</b>；协议 38%≯50% → ×1<br>\n      　　　　修正后 = 5% × 0.5 × 0.5 × 0.5 = <b>0.625%</b><br>\n      第三步：320 × 0.625% = <b>2.0 间</b> → 向下取整 <b>2 间</b>；硬上限 16 / 15 未触及 → <b>超售上限 2 间</b><br>\n      <br>\n      <b>情形二（会议团队 30%）：</b><br>\n      第二步：D2 → ×0.5；担保 72%&gt;60% → ×0.5；会议 30%≯40% → ×1；协议 38%≯50% → ×1<br>\n      　　　　修正后 = 5% × 0.5 × 0.5 = <b>1.25%</b><br>\n      第三步：320 × 1.25% = <b>4.0 间</b> → <b>超售上限 4 间</b><br>\n      <br>\n      <b>解析：</b>三个 ×0.5 连乘的杀伤力极大——5% 一路降到 0.625%。这正是表 E 的设计意图：<b>越是「需求旺、客人靠谱（担保多）、有大团队」的日子，越不该超售</b>，因为一旦超售，步行客人的代价（补偿包 + 口碑损失）远高于多卖一间房的收益。<br>\n      <b>补充：</b>本日预测 OCC 若落在 90–95% 档，表 B 直接给「≤2 间」，<b>不需要查表 E</b>；只有当预测 OCC 落在 85–90% 或 70–85% 时才走表 E。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">场景 5 · 价格一致性核查与整改</div>\n    <div class=\"q-b\">目标日 11 月 20 日，房型 SUP-K，价格代码 BAR，不含早，免费取消。直销基准价 P = ¥748（当日刚从 ¥680 上调 10%）。6 渠道挂牌价：携程 ¥748、美团 ¥712、飞猪 ¥748、Booking ¥760、GDS 展示价 ¥748、美团会员日专享 ¥690（未登录用户可见）。<br>请：① 逐渠道算 Δ 并判定；② 指出共几项违规、分别是哪几项；③ 按整改 SOP 写出后续 4 个动作。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① Δ 与判定：</b><br>\n      携程 748 − 748 = 0 → <span class=\"pill pill-teal\">一致</span><br>\n      美团 712 − 748 = <span class=\"down\">−¥36</span> → <span class=\"pill pill-red\">违反</span><br>\n      飞猪 748 − 748 = 0 → <span class=\"pill pill-teal\">一致</span><br>\n      Booking 760 − 748 = <span class=\"up\">+¥12</span> → <span class=\"pill pill-teal\">允许</span>（列入观察）<br>\n      GDS 748 − 748 = 0 → <span class=\"pill pill-teal\">一致</span><br>\n      美团会员日专享 690 − 748 = <span class=\"down\">−¥58</span> → <span class=\"pill pill-red\">违反</span>（未登录用户可见，不是「仅限登录会员可见」的 MEMB 价）<br>\n      <b>② 共 2 项违规：</b>美团常规挂牌价低 ¥36；美团会员日专享价低 ¥58 且未登录可见。<br>\n      <b>③ 整改 SOP 4 个动作：</b><br>\n      <b>1) 定位（15 min 内）：</b>锁定「美团 + 11-20 + SUP-K + BAR」；把美团渠道未来 30 天同款产品全部扫一遍，确认违规日期范围。<br>\n      <b>2) 判成因：</b>美团常规价低于后台 → 疑似<b>渠道私自促销</b>或<b>系统未同步</b>（本次刚上调 10%，高度怀疑缓存未刷新）；会员日专享 → <b>渠道私自促销</b>（渠道自补差价的平台活动）。<br>\n      <b>3) 处置：</b>联系美团渠道经理，要求下架会员日专享活动、恢复常规挂牌价；同时在渠道管理器重新推送价格与库存；保留邮件/工单截图。<br>\n      <b>4) 复查与留痕：</b>整改后立即复查一次，24 小时内再复查一次，写入《价格一致性检查表》「整改结果」列（含时间戳）；记入当事人考核；在《调价台账》备注栏写明「美团 Δ=−¥36、会员日 Δ=−¥58，成因渠道促销，整改于 XX:XX 完成，复查通过」；若 30 天内第 2 次违规，上报 L3 启动渠道合作复核。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">场景 6 · 综合：多日流水线 + 台账</div>\n    <div class=\"q-b\">以下是某日 08:30 查表环节拿到的三个目标日数据。请写出完整的《今日动作清单》，并为每条标注触发表编号与是否需要 L3 审批。<br><br>\n    <b>A 日</b> 10 月 1 日（D1 峰值日）：预测 OCC 97.5%，Pickup 领先 18.0%，当前 SUP BAR ¥1,020，MinLOS 现状 2 晚，超售现状 0 间。<br>\n    <b>B 日</b> 10 月 22 日（D3 平峰日）：预测 OCC 81.4%，Pickup 持平 +2.0%，当前 SUP BAR ¥680，No-show+取消 9%，担保占比 50%，会议团队 15%，协议集中度 60%，有备用酒店。<br>\n    <b>C 日</b> 7 月 15 日（D4 低谷日）：预测 OCC 48.6%，Pickup 落后 7.0%，当前 SUP BAR ¥520。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>A 日（D1 峰值日，预测 OCC 97.5%）：</b><br>\n      表 A：行「≥95%」× 列「领先 &gt;10%」→ <span class=\"up\">↑20%</span>。新 SUP BAR = 1,020×1.20 = <b>¥1,224</b>（7 档同步 ↑20%）。<br>\n      表 B（≥95%）：MinLOS → <b>3 晚</b>（D1 峰值日，现状 2 晚需改）；CTA <b>启用</b>；关闭<b>尾房特惠/团购/批发商</b>；<b>不超售</b>（现状 0 间，维持）。<br>\n      表 H（≥95%）：OTA 国内<b>仅留 1 家</b>；OTA 国际<b>关</b>；GDS <b>关</b>；批发商 <b>关</b>；直销/会员<b>全开+会员专享价</b>。<br>\n      <b>审批：需要 L3 审批（D1 峰值日，表 A 约束 5），且为前置条件。</b>另累计 ↑20% 已达上限，当日不得再上调。<br>\n      <br>\n      <b>B 日（D3 平峰日，预测 OCC 81.4%）：</b><br>\n      表 A：行「70–85%」× 列「持平 ±3%」→ <b>维持</b>。<br>\n      表 B（70–85%）：MinLOS <b>1 晚（清空）</b>；CTA <b>否</b>；低价渠道 <b>全开</b>；超售 <b>按表 E</b>。<br>\n      表 E：9% 落「5–10%」→ 基准 2%；非 D1/D2(×1)、担保 50%≯60%(×1)、会议 15%≯40%(×1)、<b>协议集中度 60%&gt;50% → ×0.8</b> → 修正后 1.6%；320×1.6% = 5.12 → <b>5 间</b>；硬上限未触及 → 超售上限 <b>5 间</b>。<br>\n      表 H（70–85%）：OTA 国内/国际/GDS 全开；批发商<b>限价开（≤ BAR×75% = 680×0.75 = ¥510）</b>；直销全开 + 早鸟。<br>\n      <b>审批：无需 L3。</b>表 A 维持，顺延执行表 B / 表 H 的非价格动作。<br>\n      <br>\n      <b>C 日（D4 低谷日，预测 OCC 48.6%）：</b><br>\n      表 A：行「40–55%」× 列「落后 3–10%」→ <span class=\"down\">↓10%</span>。新 SUP BAR = 520×0.90 = <b>¥468</b>。<br>\n      表 B（&lt;70%）：MinLOS <b>不设限</b>；CTA <b>否</b>；低价渠道 <b>全开 + 上促销</b>；<b>不超售</b>。<br>\n      表 H（&lt;55%）：OTA 国内<b>全开+深折</b>；OTA 国际<b>全开</b>；GDS <b>开+商务套餐</b>；批发商 <b>开+打包产品</b>（净价不得公开挂牌）；直销/会员 <b>全开+长住/团购</b>。<br>\n      <b>审批：无需 L3。</b>新价 ¥468 低于 D4 系数下限 ¥476，需在备注注明「已低于 D4 系数下限，次日若继续下调须先核查表 L 需求暴跌信号（48h Pickup 落后 &gt;40%）」。<br>\n      <br>\n      <b>清单汇总（8 条）：</b>A 上调 20%（表 A，需 L3）／A 日 MinLOS 2→3 晚（表 B）／A 日启用 CTA + 关闭 3 类低价渠道（表 B）／A 日渠道按 ≥95% 档重配（表 H）／B 日维持价格但执行表 B 库存配置（表 B）／B 日超售上限 5 间（表 E）／B 日批发商限价 ≤ ¥510（表 H）。\n      <br>\n      <b>清单汇总（8 条主项 + 2 条配套项）：</b>\n      ① A 日 SUP BAR ↑20% 至 ¥1,224（表 A，<b>需 L3 审批</b>）／\n      ② A 日 MinLOS 2 晚 → 3 晚（表 B）／\n      ③ A 日启用 CTA + 关闭尾房特惠/团购/批发商（表 B）／\n      ④ A 日渠道按「≥95%」档重配（表 H）／\n      ⑤ B 日价格维持，但执行表 B 的库存配置（表 B）／\n      ⑥ B 日超售上限 5 间（表 E）／\n      ⑦ B 日批发商限价 ≤ ¥510（表 H）／\n      ⑧ C 日 SUP BAR ↓10% 至 ¥468（表 A）。<br>\n      <b>配套项：</b>C 日解除 MinLOS、低价渠道全开 + 上促销、不超售（表 B）；C 日渠道按「&lt;55%」档全开（表 H）。\n    </div></details>\n  </div>\n\n<\!-- ===== 本模块产出物 ===== -->\n<div class=\"callout callout-do\">\n  <span class=\"co-t\">本模块产出物（结课时必须交齐）</span>\n  <ul style=\"margin:6px 0 0\">\n    <li><b>《每日收益数据包》</b>——按《取数清单》抓全的当日数据，含昨日实绩、未来 30 天在手、竞争组合 5 家价格</li>\n    <li><b>《今日动作清单》</b>——逐日列出动作，每条标注「依据表 X」与是否需要 L3 审批</li>\n    <li><b>《调价台账》</b>——全部动作已落位并登记，字段无缺</li>\n    <li><b>《价格一致性检查表》</b>——6 个渠道核查完毕，违规项已整改并截图存档</li>\n  </ul>\n</div>\n\n<div class=\"callout callout-key\">\n  <span class=\"co-t\">合格标准（L1 认证核心）</span>\n  <p>整个上午流程在 <b>10:30 前全部完成</b>，且《今日动作清单》上<b>每一项都标明了「依据表 X」</b>。\n  做到这两条，就是一名合格的 L1 收益执行专员。<br>\n  速度要求：第 1 天约 120 分钟，练到第 5 天应能压缩到 <b>60 分钟以内</b>。</p>\n</div>\n\n<\!-- ===== 底部导航 ===== -->\n<div class=\"p-title\">M02 系统与数据导航</div></a>\n  <a href=\"m04.html\" class=\"p-next\"><div class=\"p-dir\">下一模块 →</div><div class=\"p-title\">M04 报表与台账</div></a>\n</div>\n\n</div>\n"}]}, {"n": 4, "t": "报表体系", "part": "L1 执行专员", "mod": "模块 M04", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n  <\!-- ===== 页头 ===== -->\n  <div class=\"crumb\">\n    <a href=\"../index.html\">学院首页</a><span>/</span>\n    <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n    L1 模块四\n  </div>\n\n  <div class=\"page-head\">\n    <div class=\"badge-row\">\n      <span class=\"badge badge-l1\">L1 收益执行专员</span>\n      <span class=\"badge\">模块 M04</span>\n      <span class=\"badge\">2 课时 / 180 min</span>\n      <span class=\"badge\">占 L1 认证 12.5%</span>\n      <span class=\"badge\">前置 M03</span>\n    </div>\n    <h1 class=\"page-title\">报表与台账：让决策可追溯</h1>\n    <p class=\"page-lede\">一句话导语：四步闭环的前三步（看数、查表、执行）都在别人看得见的地方发生，唯独第四步「记录」发生在没人看的地方——本模块把这一步做成硬动作：四类报表回答「发生了什么」，《调价台账》回答「当时为什么这么干」，《调价命中率》回答「这么干到底对不对」。</p>\n  </div>\n\n  <\!-- ===== 学习目标 ===== -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n    <ul>\n      <li>能<b>说出</b> 日报 / 周报 / 月报 / 业主一页纸四类报表的读者分别是谁、各自回答什么问题，并逐字列出每类报表的必填字段</li>\n      <li>能<b>说出</b> 《调价台账》15 个字段中每一个「缺了会导致什么后果」，并在给定场景下独立填出一条完整、无空值的台账记录</li>\n      <li>能<b>算出</b> 调价命中率（= 复盘结论为「做对」的条数 ÷ 已复盘总条数），并按触发表编号 / 需求等级 / 调整方向三个维度分组统计</li>\n      <li>能<b>判断</b> 命中率 &lt;60% 与 &gt;75% 分别意味着什么、各自触发什么动作，并能识破「高命中率 + 低动作率」的假优秀</li>\n      <li>能<b>独立执行</b> 报表常见错误的 5 例排查，并给出本店报表自动化的 6 条可落地改造项</li>\n    </ul>\n    <p class=\"card-note\">前置要求：M01 指标与计算（OCC / ADR / RevPAR 口径）、M02 系统与数据导航（14 字段取数与 4 条恒等式）、M03 每日操作流水线（表 M 九时段、《今日动作清单》）。<br>\n    本模块内嵌：《法典》<b>表 A</b>、<b>表 B</b>、<b>表 E</b>、<b>表 H</b>、<b>表 I</b>、<b>表 M</b>、<b>表 N</b>、<b>表 O</b> 的引用口径；引用 <b>表 C</b> / <b>表 D</b> / <b>表 F</b> / <b>表 L</b>。全部阈值以《SPEC》第四章为唯一版本。</p>\n  </div>\n\n  <\!-- ===== 目录 ===== -->\n  <div class=\"toc\">\n    <div class=\"toc-title\">本模块目录</div>\n    <ol>\n      <li><a href=\"#s1\">为什么「记录」是四步闭环里最难的一步</a></li>\n      <li><a href=\"#s2\">四类报表的定位：谁在看、看什么、多久看一次</a></li>\n      <li><a href=\"#s3\">日报（Daily Report）：14 个字段与设计理由</a></li>\n      <li><a href=\"#s4\">周报（Weekly Report）：从「发生了什么」到「趋势是什么」</a></li>\n      <li><a href=\"#s5\">月报（Monthly Report）：三维诊断与结构分析</a></li>\n      <li><a href=\"#s6\">业主一页纸（Owner One-Pager）：只给结论</a></li>\n      <li><a href=\"#s7\">《调价台账》：15 个字段，缺一个就复盘不了</a></li>\n      <li><a href=\"#s8\">台账填写 SOP：什么时候写、谁写、谁复核</a></li>\n      <li><a href=\"#s9\">调价命中率：定义、算法与分组统计</a></li>\n      <li><a href=\"#s10\">命中率 &lt;60% 怎么办、&gt;75% 说明什么</a></li>\n      <li><a href=\"#s11\">报表常见错误 5 例（含排查动作）</a></li>\n      <li><a href=\"#s12\">报表与台账的自动化改造 6 条</a></li>\n      <li><a href=\"#s13\">讲师示范：一条台账从写到复盘的全生命周期</a></li>\n      <li><a href=\"#s14\">学员跟练（5 题）</a></li>\n      <li><a href=\"#s15\">判定表默写清单（当堂默写）</a></li>\n      <li><a href=\"#s16\">随堂测（5 题）</a></li>\n      <li><a href=\"#s17\">本模块产出物</a></li>\n    </ol>\n  </div>\n\n  <\!-- ================= 一 ================= -->\n  "}, {"id": "p1", "name": "一、为什么「记录」是四步闭环里最难的一步", "min": 8, "desc": "", "html": "<h2 id=\"s1\">一、为什么「记录」是四步闭环里最难的一步</h2>\n\n  <p>四步闭环「<strong>看数 → 查表 → 执行 → 记录</strong>」里，前三步有外部约束：不取数就没有输入，不查表就读不出动作，不执行系统里就不会变。唯独第四步「记录」<strong>没有即时的负反馈</strong>——今天没写台账，今天照样下班，明天照样能干活。</p>\n\n  <p>但三个月后，当你被问到「国庆那波提价 20% 到底对不对」时，只有台账能回答。没有台账，你只能凭印象说「好像还行」，而这恰恰是 RMC 教学哲学第一条「<b>不猜</b>」所禁止的。</p>\n\n  <div class=\"grid-3\">\n    <div class=\"metric\">\n      <div class=\"metric-val\">看数</div>\n      <div class=\"metric-label\">抓固定 14 字段<br>不多一个，不少一个</div>\n    </div>\n    <div class=\"metric\">\n      <div class=\"metric-val\">查表</div>\n      <div class=\"metric-label\">把数代入《法典》<br>读出唯一动作</div>\n    </div>\n    <div class=\"metric\">\n      <div class=\"metric-val\">执行</div>\n      <div class=\"metric-label\">系统落位<br>截图存证</div>\n    </div>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">记录的三个真实用途（不是为了给领导交作业）</span>\n    <p><b>用途 1 · 复盘。</b>30 天后回填实际 RevPAR，判断这条动作做对了没有，累计成<b>调价命中率</b>（第 9 节）。<br>\n    <b>用途 2 · 追责与免责。</b>当业主问「为什么那天卖了 ¥520」，台账上的「触发表编号 + 当时 OCC 预测 + Pickup 偏差」就是证据链：这个价不是谁拍脑袋定的，是《法典》表 A 第 X 行第 Y 列算出来的。<br>\n    <b>用途 3 · 交接。</b>收益专员离职或调岗，接手的人靠台账能在两天内还原过去 90 天的全部决策逻辑，而不是从零摸索。</p>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">本模块最重要的一条规矩</span>\n    <p><b>「本日无动作」也要写一条台账。</b>写法固定为：动作类型「维持」，触发表编号填实际查过的表（如「表 A」），备注栏写「行 70–85% × 列 持平 ±3% → 维持」。<br>\n    原因：命中率的分母是「已复盘总条数」。如果只记录动作、不记录维持，分母里就只剩下你「敢下手」的那些动作，命中率会被系统性高估，变成了自欺欺人。</p>\n  </div>\n\n  "}, {"id": "p2", "name": "二、四类报表的定位：谁在看、看什么、多久看一次", "min": 8, "desc": "", "html": "<h2 id=\"s2\">二、四类报表的定位：谁在看、看什么、多久看一次</h2>\n\n  <p>云璟酒店（320 间房，中高端全服务）的收益报表体系只有四类。<b>多一类都是浪费，少一类都会失控。</b></p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 4-1　四类报表的定位对照<span class=\"cap-note\">读者不同 → 字段不同 → 频率不同。混用是报表体系崩溃的头号原因</span></caption>\n      <thead><tr><th>报表</th><th>频率</th><th>主要读者</th><th>回答的问题</th><th>字段量级</th><th>产出时点</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>日报</b><br>Daily Report</td>\n          <td>每日</td>\n          <td>收益专员本人、收益主管、前厅经理、销售部</td>\n          <td><b>昨天发生了什么</b>？今天要做什么？</td>\n          <td>14 个字段 + 6 项指标</td>\n          <td>07:50 前（表 M 07:30 时段 +20 min）</td>\n        </tr>\n        <tr>\n          <td><b>周报</b><br>Weekly Report</td>\n          <td>每周一</td>\n          <td>收益主管、驻店经理、销售总监</td>\n          <td><b>趋势往哪走</b>？未来 8 周哪里有问题？</td>\n          <td>日报字段 + 周维度聚合 + 8 周预测</td>\n          <td>周一 11:00 前（表 N 每周一动作）</td>\n        </tr>\n        <tr>\n          <td><b>月报</b><br>Monthly Report</td>\n          <td>每月 1 日 / 5 日</td>\n          <td>收益经理（L3）、驻店经理、财务部</td>\n          <td><b>结构对不对</b>？客源、渠道、房型是否健康？</td>\n          <td>月维度聚合 + RGI/MPI/ARI 三维 + 客源渠道分析</td>\n          <td>每月 1 日（复盘）、每月 5 日（客源渠道）</td>\n        </tr>\n        <tr>\n          <td><b>业主一页纸</b><br>Owner One-Pager</td>\n          <td>每月 10 日</td>\n          <td>业主 / 业主代表、集团管理层</td>\n          <td><b>钱赚到了没有</b>？下个月会怎样？有什么要我配合的？</td>\n          <td>严格限制在 1 页 A4，≤12 个数字</td>\n          <td>每月 10 日（表 N 每月 10 日汇报）</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">四类报表的「信息递减」原则</span>\n    <p>从日报到一页纸，<b>字段数量必须递减，判断浓度必须递增</b>：<br>\n    日报是<b>原始数据层</b>（14 字段全给，不加判断）；<br>\n    周报是<b>趋势层</b>（把 7 天聚合成几条线，加 1–3 条判断）；<br>\n    月报是<b>结构层</b>（把 30 天拆成客源/渠道/房型三个切面，加 3–5 条判断）；<br>\n    一页纸是<b>结论层</b>（只给结果、差异、下月预测、需决策事项，<b>不出现任何一个过程数字</b>）。<br>\n    违反这条原则的典型表现：把日报直接压缩字号印给业主看。业主看完只会问一句「所以呢」。</p>\n  </div>\n\n  "}, {"id": "p3", "name": "三、日报（Daily Report）：14 个字段与设计", "min": 8, "desc": "", "html": "<h2 id=\"s3\">三、日报（Daily Report）：14 个字段与设计理由</h2>\n\n  <h3>3.1 字段清单（每个字段都回答「为什么要有」）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 4-2　《每日收益数据包》字段清单<span class=\"cap-note\">与 M02 表 2-8 取数清单完全一致；本表补充「设计理由」与「谁在看」</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>字段</th><th>口径</th><th>为什么要有（设计理由）</th><th>谁在看 / 看什么</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td><td><b>统计日期</b></td><td>营业日（非自然日），夜审后锁定</td>\n          <td>所有数字的锚。没有它，30 天后无法对齐任何一张表</td>\n          <td>全员 · 对齐口径</td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td><td><b>总房量</b></td><td>320 间（含 12 间无障碍连通房）</td>\n          <td>分母的源头。变了要立刻查明原因（改造？长住转自用？）</td>\n          <td>前厅 · 房量完整性</td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td><td><b>OOO 房晚</b></td><td>维修 / 装修 / 封存房 × 天数</td>\n          <td><b>最常被漏掉的分母项。</b>漏了它，OCC 会被系统性低估，进而让表 A 读到更激进的降价档</td>\n          <td>工程 / 前厅 · 可售性</td>\n        </tr>\n        <tr>\n          <td class=\"num\">4</td><td><b>可售房晚</b></td><td>总房量 − OOO 房晚</td>\n          <td>OCC 与 RevPAR 的<b>唯一合法分母</b>。云璟年可售 116,800 = 320 × 365</td>\n          <td>收益 · 指标正确性</td>\n        </tr>\n        <tr>\n          <td class=\"num\">5</td><td><b>已售房晚</b></td><td>实际售出并入住的房晚</td>\n          <td>OCC 的分子。同时是 ADR 的分母</td>\n          <td>收益 · 业绩</td>\n        </tr>\n        <tr>\n          <td class=\"num\">6</td><td><b>Comp / House Use 房晚</b></td><td>免费房 / 自用房，单独列示</td>\n          <td>必须<b>单列不并入已售房晚</b>。并入会同时污染 OCC（虚高）与 ADR（虚低）</td>\n          <td>财务 / 收益 · 口径纯净度</td>\n        </tr>\n        <tr>\n          <td class=\"num\">7</td><td><b>客房收入</b></td><td>含服务费，不含增值税</td>\n          <td>RevPAR 的分子。口径不一致会让月度同比完全失真</td>\n          <td>财务 · 收入确认</td>\n        </tr>\n        <tr>\n          <td class=\"num\">8</td><td><b>餐饮收入</b></td><td>云璟轩 / 澜庭 / 臻萃扒房 / 宴会合计</td>\n          <td>全服务酒店必须看 TrevPAR。客房 RevPAR 涨、餐饮跌，总账可能没赚</td>\n          <td>餐饮总监 · 联动机会</td>\n        </tr>\n        <tr>\n          <td class=\"num\">9</td><td><b>其他收入</b></td><td>SPA / 泳池 / 会议设备 / 停车等</td>\n          <td>TrevPAR 的第三块拼图</td>\n          <td>财务</td>\n        </tr>\n        <tr>\n          <td class=\"num\">10</td><td><b>GOP</b></td><td>营业毛利（未扣管理费/租金/折旧前）</td>\n          <td>GOPPAR 的分子。云璟上年 GOP ¥27,098,741，GOP 率 32.0%</td>\n          <td>驻店经理 · 最终考核</td>\n        </tr>\n        <tr>\n          <td class=\"num\">11</td><td><b>分渠道房晚</b></td><td>7 个渠道代码各一行（DIR/LOY/CORP/OTA/OTA-I/GDS/WHO）</td>\n          <td>算 NRevPAR 与综合成本率的唯一输入。没有它，渠道优化无从谈起</td>\n          <td>收益 / 销售 · 渠道结构</td>\n        </tr>\n        <tr>\n          <td class=\"num\">12</td><td><b>分房型房晚</b></td><td>10 个房型代码各一行</td>\n          <td>房型价差校验（表 F）、高档房空置率（表 J 升级触发条件②）的输入</td>\n          <td>收益 / 前厅 · 房型热度</td>\n        </tr>\n        <tr>\n          <td class=\"num\">13</td><td><b>分细分房晚与收入</b></td><td>7 个细分代码（FIT-WI/FIT-DIR/FIT-OTA/CORP/LOY/GRP/LNG）</td>\n          <td>置换分析（表 G）与客源结构月报的输入</td>\n          <td>收益 / 销售 · 客源结构</td>\n        </tr>\n        <tr>\n          <td class=\"num\">14</td><td><b>竞争组合 5 家挂牌价</b></td><td>A–E 五家同档房型，含采集时间戳</td>\n          <td>ARI / MPI / RGI 的输入。缺时间戳就无法判断数据新鲜度</td>\n          <td>收益 · 竞争定位</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>3.2 由 14 字段自动计算的 6 项指标</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">OCC</span>\n    已售房晚 ÷ 可售房晚 × 100%　→　云璟上年 <span class=\"f-out\">72.0%</span><br><br>\n    <span class=\"f-label\">ADR</span>\n    客房收入 ÷ 已售房晚　→　云璟上年 <span class=\"f-out\">¥618</span><br><br>\n    <span class=\"f-label\">RevPAR</span>\n    客房收入 ÷ 可售房晚 = OCC × ADR　→　云璟上年 <span class=\"f-out\">¥445</span><br><br>\n    <span class=\"f-label\">TrevPAR</span>\n    （客房 + 餐饮 + 其他收入）÷ 可售房晚　→　云璟上年 84,677,328 ÷ 116,800 = <span class=\"f-out\">¥724.98</span><br><br>\n    <span class=\"f-label\">GOPPAR</span>\n    GOP ÷ 可售房晚　→　云璟上年 27,098,741 ÷ 116,800 = <span class=\"f-out\">¥232</span><br><br>\n    <span class=\"f-label\">NRevPAR</span>\n    RevPAR ×（1 − 渠道综合成本率）　→　详见 M08 第 3 节\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">日报的 4 条数据一致性恒等式（来自 M02，任一不通过禁止进入 08:30 查表）</span>\n    <p>① 总房量 − OOO 房晚 = 可售房晚<br>\n    ② 已售房晚 ≤ 可售房晚<br>\n    ③ RevPAR 两法互验：客房收入 ÷ 可售房晚 ＝ OCC × ADR（差值 ≤ ¥0.5）<br>\n    ④ 分渠道房晚之和 = 分细分房晚之和 = 已售房晚</p>\n  </div>\n\n  <h3>3.3 日报的读者视角（同一份日报，四个人看四个地方）</h3>\n\n  <div class=\"grid-2\">\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">①</span>收益专员（L1）看什么</div>\n      <ul class=\"checklist\">\n        <li>4 条恒等式是否全过</li>\n        <li>OCC / ADR / RevPAR vs 昨日预测，差多少</li>\n        <li>未来 30 天 Pickup 表有无落后超阈值的日期（表 I 六档）</li>\n        <li>今日动作清单有几条、都由哪张表触发</li>\n      </ul>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">②</span>前厅经理看什么</div>\n      <ul class=\"checklist\">\n        <li>OOO 房晚今天有几间，什么时候恢复</li>\n        <li>分房型房晚：哪个房型卖爆了，哪个房型压着</li>\n        <li>昨日 No-show 与 24h 取消间数（超售参数）</li>\n        <li>今日是否有 MinLOS / CTA 限制，前台话术要不要改</li>\n      </ul>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">③</span>销售部看什么</div>\n      <ul class=\"checklist\">\n        <li>CORP 与 GRP 两个细分的房晚与 ADR</li>\n        <li>未来 30 天哪些日期还有团队承接空间</li>\n        <li>协议客户集中度（&gt;50% 会触发表 E ×0.8 修正系数）</li>\n        <li>在谈询价清单的进度</li>\n      </ul>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">④</span>收益主管（L2）看什么</div>\n      <ul class=\"checklist\">\n        <li>日报与台账是否对得上：动作数 = 台账条数</li>\n        <li>触发表编号填得规不规范（有无「经验判断」类来源）</li>\n        <li>一致性核查 6 渠道是否全做、有无违规</li>\n        <li>昨日调价的 OTA 同步时滞</li>\n      </ul>\n    </div>\n  </div>\n\n  "}, {"id": "p4", "name": "四、周报（Weekly Report）：从「发生了什么」", "min": 8, "desc": "", "html": "<h2 id=\"s4\">四、周报（Weekly Report）：从「发生了什么」到「趋势是什么」</h2>\n\n  <p>《法典》表 N 规定<strong>每周一</strong>做三件事：房型价差校验（表 F）、未来 8 周预测更新、渠道开关复核（表 H）。周报就是这三件事的产出载体。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 4-3　《周度收益报告》字段清单<span class=\"cap-note\">在日报 14 字段基础上做周聚合，并新增 5 个「趋势字段」</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>字段</th><th>算法 / 口径</th><th>为什么要有</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">1</td><td><b>本周 OCC / ADR / RevPAR</b></td><td>7 天房晚与收入聚合后计算，<b>不取 7 天算术平均</b></td><td>算术平均会让周末与工作日等权，掩盖真实结构</td></tr>\n        <tr><td class=\"num\">2</td><td><b>上周对比</b>（WoW）</td><td>本周值 ÷ 上周值 − 1，带 ↑↓ 箭头</td><td>捕捉短期拐点</td></tr>\n        <tr><td class=\"num\">3</td><td><b>去年同期对比</b>（YoY）</td><td>本周值 ÷ 去年同期周值 − 1</td><td>剔除季节性，是唯一可信的对比基准</td></tr>\n        <tr><td class=\"num\">4</td><td><b>本周累计 vs 月目标</b></td><td>月目标 OCC / ADR 按日拆解后累计对比</td><td>月中就能预警，不等到月底</td></tr>\n        <tr><td class=\"num\">5</td><td><b>未来 8 周在手曲线</b></td><td>逐周在手房晚 + 去年同期同窗口在手 + 偏差%</td><td>表 N 要求的 8 周预测更新；偏差超表 I 阈值即触发动作</td></tr>\n        <tr><td class=\"num\">6</td><td><b>房型价差校验结果</b></td><td>表 F 三条规则逐档判定（&lt;8% 拉开 / &gt;35% 收敛 / 套房 &lt;60% 提价）</td><td>周一固定动作，未做即漏检</td></tr>\n        <tr><td class=\"num\">7</td><td><b>渠道开关复核</b></td><td>未来 8 周逐周预测 OCC → 表 H 6 档 → 当前渠道状态 vs 应有状态</td><td>渠道配置最容易「设了忘撤」</td></tr>\n        <tr><td class=\"num\">8</td><td><b>限制条件存量清单</b></td><td>当前所有生效中的 MinLOS / CTA / CTD / Stop Sell，含<b>生效日期区间</b></td><td><b>这是防事故字段</b>——详见 M07 第 4 节撤除机制</td></tr>\n        <tr><td class=\"num\">9</td><td><b>本周台账统计</b></td><td>动作条数 / 维持条数 / 按触发表编号分组计数</td><td>命中率的周度前哨</td></tr>\n        <tr><td class=\"num\">10</td><td><b>下周 D1/D2 日清单</b></td><td>逐日列出需求等级 + 当前 BAR + 是否需 L3 审批</td><td>表 N 每周五《周末作战表》的输入</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">周报里唯一必须有的那张图：未来 8 周在手曲线</span>\n    <p>横轴 8 周，三条线：<b>本年在手（实线）</b>、<b>去年同期同窗口在手（虚线）</b>、<b>目标在手（点线）</b>。<br>\n    读法只有一条规则：<b>实线在虚线下方，且差距超过表 I 该窗口的落后触发阈值，就必须有动作。</b><br>\n    窗口阈值对照（《法典》表 I）：0–3 天 OCC&lt;70% / 4–7 天 落后 10% / 8–14 天 落后 15% / 15–30 天 落后 20% / 31–60 天 落后 25% / &gt;60 天 落后 30%。</p>\n  </div>\n\n  "}, {"id": "p5", "name": "五、月报（Monthly Report）：三维诊断与结构", "min": 8, "desc": "", "html": "<h2 id=\"s5\">五、月报（Monthly Report）：三维诊断与结构分析</h2>\n\n  <p>《法典》表 N 规定：<strong>每月 1 日</strong>做上月复盘（RGI / MPI / ARI 三维诊断）与滚动预测更新；<strong>每月 5 日</strong>做客源结构分析与渠道贡献 / 净 RevPAR 分析。月报由这两部分组成。</p>\n\n  <h3>5.1 第一部分：三维诊断（每月 1 日）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 4-4　月度三维诊断表<span class=\"cap-note\">MPI × ARI ÷ 100 = RGI，三者必须同时看，只看一个必然误判</span></caption>\n      <thead><tr><th>维度</th><th>公式</th><th>云璟目标（SPEC 2.4）</th><th>本月</th><th>上月</th><th>同比</th><th>判定</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>MPI</b><br>市场渗透指数</td>\n          <td>本店 OCC ÷ 竞争组合 OCC × 100</td>\n          <td><b>≥ 105</b></td>\n          <td>（填）</td><td>（填）</td><td>（填）</td><td>（按表 D 五档判定）</td>\n        </tr>\n        <tr>\n          <td><b>ARI</b><br>平均房价指数</td>\n          <td>本店 ADR ÷ 竞争组合 ADR × 100</td>\n          <td><b>≈ 100</b></td>\n          <td>（填）</td><td>（填）</td><td>（填）</td><td>（按表 C 七档判定）</td>\n        </tr>\n        <tr>\n          <td><b>RGI</b><br>收入生成指数</td>\n          <td>本店 RevPAR ÷ 竞争组合 RevPAR × 100<br>= MPI × ARI ÷ 100</td>\n          <td>越大越好</td>\n          <td>（填）</td><td>（填）</td><td>（填）</td><td>&gt;100 = 赢过组合</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">三维诊断的恒等式自检</span>\n    <p>填完后必须验算：<b>|RGI − MPI × ARI ÷ 100| ≤ 0.2</b>。<br>\n    差值超过 0.2 说明三个数不是同一口径算出来的（常见原因：OCC 用了总房量做分母，或 ADR 一个含早一个不含早）。<b>不通过不得上报。</b></p>\n  </div>\n\n  <h3>5.2 第二部分：客源与渠道结构（每月 5 日）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 4-5　月度客源结构与渠道贡献表<span class=\"cap-note\">基准结构来自《SPEC》2.3；渠道成本率来自《SPEC》2.3</span></caption>\n      <thead><tr><th>市场细分</th><th>代码</th><th class=\"num\">基准房晚占比</th><th class=\"num\">本月占比</th><th class=\"num\">偏差</th><th class=\"num\">基准 ADR</th><th class=\"num\">本月 ADR</th><th>结构判定</th></tr></thead>\n      <tbody>\n        <tr><td>上门散客</td><td><code>FIT-WI</code></td><td class=\"num\">8%</td><td class=\"num\">（填）</td><td class=\"num\">（填）</td><td class=\"num\">¥720</td><td class=\"num\">（填）</td><td>（填）</td></tr>\n        <tr><td>官网/小程序直销</td><td><code>FIT-DIR</code></td><td class=\"num\">17%</td><td class=\"num\">（填）</td><td class=\"num\">（填）</td><td class=\"num\">¥650</td><td class=\"num\">（填）</td><td>（填）</td></tr>\n        <tr><td>OTA 散客</td><td><code>FIT-OTA</code></td><td class=\"num\">31%</td><td class=\"num\">（填）</td><td class=\"num\">（填）</td><td class=\"num\">¥598</td><td class=\"num\">（填）</td><td>（填）</td></tr>\n        <tr><td>协议公司客户</td><td><code>CORP</code></td><td class=\"num\">22%</td><td class=\"num\">（填）</td><td class=\"num\">（填）</td><td class=\"num\">¥520</td><td class=\"num\">（填）</td><td>（填）</td></tr>\n        <tr><td>会员（忠诚计划）</td><td><code>LOY</code></td><td class=\"num\">12%</td><td class=\"num\">（填）</td><td class=\"num\">（填）</td><td class=\"num\">¥580</td><td class=\"num\">（填）</td><td>（填）</td></tr>\n        <tr><td>团队（旅游/会议）</td><td><code>GRP</code></td><td class=\"num\">8%</td><td class=\"num\">（填）</td><td class=\"num\">（填）</td><td class=\"num\">¥450</td><td class=\"num\">（填）</td><td>（填）</td></tr>\n        <tr><td>长住客</td><td><code>LNG</code></td><td class=\"num\">2%</td><td class=\"num\">（填）</td><td class=\"num\">（填）</td><td class=\"num\">¥380</td><td class=\"num\">（填）</td><td>（填）</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">结构判定的三条硬标准（不许写「基本正常」）</span>\n    <p>① <b>单细分占比偏差绝对值 ≥ 3 个百分点</b> → 必须在备注写出原因，并列入下月策略。<br>\n    ② <b>直销合计（FIT-WI + FIT-DIR + LOY = 37%）下降 ≥ 2 个百分点</b> → 触发 M08 直销提升 8 个标准动作的复盘。<br>\n    ③ <b>任一细分 ADR 同比降幅 &gt;5%</b> → 单独写一段分析，说明是主动降价（有台账支撑）还是被动失守（无台账支撑）。</p>\n  </div>\n\n  "}, {"id": "p6", "name": "六、业主一页纸（Owner One-Pager）：只给结", "min": 8, "desc": "", "html": "<h2 id=\"s6\">六、业主一页纸（Owner One-Pager）：只给结论</h2>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">一页纸的三条铁律</span>\n    <p>① <b>一页 A4，字号不小于 10pt，绝不缩印。</b>缩印 = 你没想清楚什么重要。<br>\n    ② <b>数字不超过 12 个。</b>超了就把最不重要的删掉，不是把字号调小。<br>\n    ③ <b>不出现任何一个过程数字。</b>业主不需要看「Pickup 偏差落后 6.3%」，他需要看「上月 RevPAR ¥452，比竞争组合高 3.2%」。</p>\n  </div>\n\n  <h3>6.1 一页纸的固定五段结构</h3>\n\n  <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n    <h4>本月结果（4 个数字）</h4>\n    <p>OCC / ADR / RevPAR / GOPPAR，每个都带「 vs 预算 / vs 去年同期 / vs 竞争组合」三个对比。<b>共 4 × 3 = 12 个对比位，这是一页纸上唯一的数字密集区。</b></p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n    <h4>赢在哪里 / 输在哪里（各 2 条，每条一句话）</h4>\n    <p>必须具体到日期与动作。写法示例：「10 月 2 日按表 A ↑20%，当日 RevPAR ¥1,172，同比 <span class=\"up\">↑18.4%</span>」。<br>\n    <b>禁止写「团队市场表现良好」这类无数字的话。</b></p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n    <h4>下月预测（3 个数字 + 1 个风险）</h4>\n    <p>下月 OCC 预测 / ADR 预测 / RevPAR 预测，加一条风险提示（如「春节提前至 1 月，1 月下旬在手落后 22%，已启动表 I 31–60 天档的协议客户拜访计划」）。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n    <h4>调价命中率（1 个数字 + 1 行说明）</h4>\n    <p>格式固定：「本月已复盘 XX 条，命中率 XX.X%（目标 ≥60%），最低的一组是<b>表 X</b>（XX.X%），已采取 XX 措施」。<br>\n    <b>命中率必须上报</b>——这是让业主相信「你的决策是有一套方法的」而不是「你运气好」的唯一证据。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">5</div><div class=\"step-body\">\n    <h4>需业主决策/配合的事项（0–3 条）</h4>\n    <p>没有就写「无」。有的话每条必须写清：<b>要什么 / 什么时候要 / 不给的后果</b>。<br>\n    示例：「需批准 12 月 20 日宴会厅 ¥30,000 保底的会议团队（综合贡献 ¥186,000，已过表 K 中型会议底线），需在 11 月 25 日前答复，逾期该团队将转投 B 滨江希尔顿花园」。</p>\n  </div></div>\n\n  <h3>6.2 一页纸填空模板</h3>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▤</span>《业主一页纸》模板（每月 10 日）</div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">酒店</div><div class=\"kv-v\">杭州滨江云璟酒店 · 320 间 · 中高端全服务</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">报告期</div><div class=\"kv-v\">2026 年 ___ 月</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">① 本月结果</div><div class=\"kv-v\">OCC ___%（预算 ___% / 去年 ___% / 组合 ___%）｜ADR ¥___（预算 ¥___ / 去年 ¥___ / 组合 ¥___）<br>RevPAR ¥___（预算 ¥___ / 去年 ¥___ / 组合 ¥___）｜GOPPAR ¥___（预算 ¥___ / 去年 ¥___）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">② 赢在 / 输在</div><div class=\"kv-v\">赢 1：________　赢 2：________　输 1：________　输 2：________</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">③ 下月预测</div><div class=\"kv-v\">OCC ___% / ADR ¥___ / RevPAR ¥___；风险：________</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">④ 调价命中率</div><div class=\"kv-v\">已复盘 ___ 条，命中率 ___%（目标 ≥60%），最低组：表 _（___%），措施：________</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">⑤ 需决策</div><div class=\"kv-v\">1. ________　2. ________　3. ________（无则写「无」）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">编制 / 复核</div><div class=\"kv-v\">编制：收益主管（L2）XXX　复核：收益经理（L3）XXX　日期：____-__-__</div></div>\n    </div>\n  </div>\n\n  "}, {"id": "p7", "name": "七、《调价台账》：15 个字段，缺一个就复盘不了", "min": 8, "desc": "", "html": "<h2 id=\"s7\">七、《调价台账》：15 个字段，缺一个就复盘不了</h2>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">台账的本质</span>\n    <p>台账不是工作日志，是<b>决策的取证档案</b>。每一个字段都是在回答 30 天后复盘会上的某一个具体问题。缺一个字段，就有一个问题答不上来，这条记录就<b>不能计入命中率的分母</b>。</p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 4-6　《调价台账》字段设计（15 字段）<span class=\"cap-note\">「缺了会怎样」列是本模块的背诵重点</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>字段</th><th>填写规范</th><th>缺了会导致什么后果</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td><td><b>操作日期</b></td>\n          <td>YYYY-MM-DD，营业日</td>\n          <td>无法判断这次调价距离入住日还有多少天（预订窗口），也就无法按表 I 六档窗口做归因分析</td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td><td><b>目标入住日</b></td>\n          <td>YYYY-MM-DD，必须唯一</td>\n          <td>30 天后无法定位到具体那天去回填实际数据，整条记录作废</td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td><td><b>动作类型</b></td>\n          <td>下拉单选：调价（上调）/ 调价（下调）/ 维持 / 设 MinLOS / 撤 MinLOS / 设 CTA / 撤 CTA / 设 CTD / 撤 CTD / Stop Sell 开 / Stop Sell 关 / 开渠道 / 关渠道 / 开超售 / 关超售 / 上促销 / 免费升级</td>\n          <td>无法按动作类型分组统计命中率，也无法核查「维持」是否被漏记</td>\n        </tr>\n        <tr>\n          <td class=\"num\">4</td><td><b>调整前</b></td>\n          <td>精确值 + 单位。调价写金额，限制条件写旧设置值，渠道写开关状态</td>\n          <td>算不出幅度，也无法还原调整前的价格体系，出现争议时没有基准</td>\n        </tr>\n        <tr>\n          <td class=\"num\">5</td><td><b>调整后</b></td>\n          <td>同上。7 档房型整表调整时写「基准房型 + 见截图编号」，截图必须含全 7 档</td>\n          <td>同上。且无法校验是否触发表 F 的价差校验问题（相邻价差 &lt;8% / &gt;35%）</td>\n        </tr>\n        <tr>\n          <td class=\"num\">6</td><td><b>幅度 %</b></td>\n          <td>带箭头：↑5% / ↓3% / <span class=\"flat\">－持平</span>。非价格动作填「—」</td>\n          <td>无法校验表 A 的三条量化约束：单日同方向累计 ≤20%、24h 内同方向 ≤2 次、单次幅度 ≥3%</td>\n        </tr>\n        <tr>\n          <td class=\"num\">7</td><td><b>触发表编号</b><span class=\"pill pill-red\">最关键</span></td>\n          <td>严格填《法典》表编号：表 A / 表 B / 表 C / 表 D / 表 E / 表 F / 表 G / 表 H / 表 I / 表 J / 表 K / 表 L / 表 M / 表 N / 表 O。<b>禁止填「经验判断」「领导要求」</b></td>\n          <td><b>整条记录失去可追溯性。</b>命中率无法按表分组，也就无法回答「到底是哪张表的阈值不适用于本店」这个最核心的复盘问题</td>\n        </tr>\n        <tr>\n          <td class=\"num\">8</td><td><b>当时 OCC 预测</b></td>\n          <td>保留一位小数，如 78.2%</td>\n          <td>无法验证查表时定行是否正确（表 A 六行按 5 个百分点分档，定错行 = 读错动作）</td>\n        </tr>\n        <tr>\n          <td class=\"num\">9</td><td><b>当时 Pickup 偏差</b></td>\n          <td>写明方向与数值，如「落后 6.0%」「领先 13.5%」「持平 +1.1%」。<b>禁止只写裸负数</b></td>\n          <td>无法验证定列是否正确（表 A 五列）。且裸负数在跨表引用时极易被误读为「领先」</td>\n        </tr>\n        <tr>\n          <td class=\"num\">10</td><td><b>执行人</b></td>\n          <td>姓名 + 认证等级（L1/L2/L3）</td>\n          <td>无法按人统计命中率，也无法判断该动作是否超出其权限（如 L1 独立执行了需 L3 审批的 D1 峰值日调价）</td>\n        </tr>\n        <tr>\n          <td class=\"num\">11</td><td><b>复核人</b></td>\n          <td>姓名 + 等级。<b>D1 峰值日调价必须填 L3 审批人姓名</b>（表 A 约束 5）</td>\n          <td>无法证明 L3 审批已取得。业主或集团内审追问时，这就是一处实打实的合规漏洞</td>\n        </tr>\n        <tr>\n          <td class=\"num\">12</td><td><b>执行时间</b></td>\n          <td>HH:MM（24 小时制）</td>\n          <td>无法校验三件事：① 24h 内同方向调价次数是否 ≤2 次（表 A 约束 2）；② 调价后 30 分钟内是否完成 OTA 一致性核查（约束 3）；③ 是否落在表 M 规定的时段内</td>\n        </tr>\n        <tr>\n          <td class=\"num\">13</td><td><b>30 天后实际 OCC / ADR / RevPAR</b></td>\n          <td>入住日次日起 3 个工作日内回填，三个值都要填</td>\n          <td><b>命中率无法计算。</b>缺 ADR 或 OCC 中任意一个就凑不出实际 RevPAR，这条记录只能作废</td>\n        </tr>\n        <tr>\n          <td class=\"num\">14</td><td><b>复盘结论</b></td>\n          <td>下拉单选：做对 / 做错 / 无法判定</td>\n          <td>命中率的分子无从统计。「无法判定」也必须填，并计入分母</td>\n        </tr>\n        <tr>\n          <td class=\"num\">15</td><td><b>备注</b></td>\n          <td>三段式（见下）</td>\n          <td>多表冲突时的仲裁依据无处记录，下次遇到同样冲突要重新吵一遍</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">备注栏三段式写法（固定格式，不许自由发挥）</span>\n    <p><b>第一段 · 冲突与仲裁。</b>写明查过哪几张表、各自给什么动作、按表 O 的优先级执行了哪一条、被搁置的动作写进了《观察清单》。<br>\n    <b>第二段 · 约束与限制。</b>写明哪条约束被触及（如「单日上调已达 20% 上限，当日不再上调」「幅度 &lt;3%，按约束 3 不执行」）。<br>\n    <b>第三段 · 关联动作。</b>写明同步执行的非价格动作（表 B 库存配置、表 H 渠道开关），以及后续需要跟踪的事项。</p>\n  </div>\n\n  <h2 id=\"s8\">八、台账填写 SOP：什么时候写、谁写、谁复核</h2>\n\n  <h3>8.1 时间轴（与《法典》表 M 严格对齐）</h3>\n\n  <div class=\"timeline\">\n    <div class=\"tl-item\">\n      <div class=\"tl-time\">08:30</div>\n      <div class=\"tl-body\">\n        <b>查表的同时就开条目。</b>每查出一个动作，立刻在台账里新建一行，把字段 1–9（操作日期 / 目标日 / 动作类型 / 调整前 / 调整后 / 幅度 / 触发表 / OCC 预测 / Pickup 偏差）先填好。<b>不要在 09:55 集中补写前 9 个字段</b>——那时你已经记不清当时定的是哪一行哪一列了。\n      </div>\n    </div>\n    <div class=\"tl-item\">\n      <div class=\"tl-time\">09:10</div>\n      <div class=\"tl-body\">\n        <b>执行的同时填执行时间。</b>每落位一条，立刻回填字段 12（执行时间）与调整后的实际值。截图编号写在备注第三段。\n      </div>\n    </div>\n    <div class=\"tl-item\">\n      <div class=\"tl-time\">09:40</div>\n      <div class=\"tl-body\">\n        <b>一致性核查结果进备注。</b>若发现违规，在备注第二段写明「X 渠道 Δ=−¥XX，成因 X，整改于 XX:XX 完成，复查通过」。\n      </div>\n    </div>\n    <div class=\"tl-item\">\n      <div class=\"tl-time\">09:55</div>\n      <div class=\"tl-body\">\n        <b>封板。</b>补齐字段 10（执行人）、11（复核人）、15（备注三段）。此时<b>台账条数必须等于《今日动作清单》条数</b>，不等就是漏记，当场补。\n      </div>\n    </div>\n    <div class=\"tl-item\">\n      <div class=\"tl-time\">17:00</div>\n      <div class=\"tl-body\">\n        <b>二次巡检的尾房动作补录。</b>触发表编号填「表 I」，动作类型填「上促销 / 开渠道 / 撤 Stop Sell」。\n      </div>\n    </div>\n    <div class=\"tl-item\">\n      <div class=\"tl-time\">T+30 天</div>\n      <div class=\"tl-body\">\n        <b>回填与复盘。</b>目标日次日起 3 个工作日内，回填字段 13（实际 OCC / ADR / RevPAR）与字段 14（复盘结论）。<b>3 个工作日是硬期限</b>，超期未回填的记录从分子中剔除但仍计入分母，等于自动判为未命中。\n      </div>\n    </div>\n  </div>\n\n  <h3>8.2 复核分工</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 4-7　台账复核权限矩阵</caption>\n      <thead><tr><th>情形</th><th>执行人</th><th>复核人</th><th>审批人</th></tr></thead>\n      <tbody>\n        <tr><td>常规日（D2/D3/D4）调价</td><td>L1 收益执行专员</td><td><b>L2 收益管理主管</b>（当日 09:55 前）</td><td>—</td></tr>\n        <tr><td><b>D1 峰值日</b>调价</td><td>L1 / L2</td><td>L2</td><td><b>L3 收益管理经理</b>（表 A 约束 5，<b>前置条件</b>）</td></tr>\n        <tr><td>超售开启（表 E）</td><td>L1 / L2</td><td><b>L2 必复核</b></td><td>基准超售率落「&gt;30% → 10%」档时<b>需 L3 审批</b></td></tr>\n        <tr><td>免费升级至套房（表 J）</td><td>L1 / L2</td><td>L2</td><td><b>L3 审批</b>（表 J 原文：每日 ≤3 间且须 L3 审批）</td></tr>\n        <tr><td>《步行客人预案》启动（表 L）</td><td>值班经理</td><td>L2</td><td><b>L3 + 总经理</b>（致歉信需总经理签名）</td></tr>\n        <tr><td>月度命中率报告</td><td>L2 编制</td><td>L3 复核</td><td>上报业主（每月 10 日）</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h2 id=\"s9\">九、调价命中率：定义、算法与分组统计</h2>\n\n  <h3>9.1 定义（全学院唯一口径）</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">调价命中率</span>\n    命中率 = 复盘结论为「<b>做对</b>」的条数 ÷ <b>已复盘</b>总条数 × 100%<br><br>\n    <span class=\"f-label\">「做对」的判定</span>\n    30 天后该日<b>实际 RevPAR ≥ 调价前预测 RevPAR</b>　→　结论填「做对」<br>\n    30 天后该日<b>实际 RevPAR &lt; 调价前预测 RevPAR</b>　→　结论填「做错」<br>\n    实际数据无法取得 / 期间发生表 L 异常事件　→　结论填「<b>无法判定</b>」<br><br>\n    <span class=\"f-label\">调价前预测 RevPAR</span>\n    预测 RevPAR = 调价前预测 OCC × 调整后 BAR（对基准房型 SUP-K/SUP-T 计算）<br>\n    <span class=\"f-out\">注意：分子用「调整后 BAR」，不是调整前</span>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">为什么分子用「调整后 BAR」——这是命中率设计的灵魂</span>\n    <p>命中率要回答的问题是：<b>「我做了这个动作之后，日子有没有比动作之前预想的更好？」</b><br>\n    动作之前，你能拿到的最好估计是「按当时的预测 OCC、按调整后的新价能收多少」——这就是<b>调价前预测 RevPAR</b>。<br>\n    30 天后实际 RevPAR 若 ≥ 它，说明这次调价（连同它背后的查表逻辑）把日子带到了不比预想差的位置，判「做对」；反之判「做错」。<br>\n    <b>关键纠偏：</b>命中率<b>不是</b>「提价后 ADR 涨了没有」，也不是「降价后 OCC 涨了没有」。它只看最终的 RevPAR 这一个综合结果。因为 ADR 涨而 OCC 崩、或 OCC 涨而 ADR 崩，都是失败的动作。</p>\n  </div>\n\n  <h3>9.2 计算示例（云璟 10 月 30 日那条台账）</h3>\n\n  <div class=\"kv\">\n    <div class=\"kv-row\"><div class=\"kv-k\">动作</div><div class=\"kv-v\">2026-10-16 对目标日 2026-10-30 按表 A 下调 3%（SUP-K/SUP-T ¥680 → ¥660）</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">调价前预测 OCC</div><div class=\"kv-v\">78.2%</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">调价前预测 RevPAR</div><div class=\"kv-v\">78.2% × ¥660 = <b>¥516.1</b></div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">30 天后实际</div><div class=\"kv-v\">实际 OCC 81.5%　实际 ADR ¥648　实际 RevPAR = 81.5% × 648 = <b>¥528.1</b></div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">判定</div><div class=\"kv-v\">¥528.1 ≥ ¥516.1 → 复盘结论 = <span class=\"pill pill-teal\">做对</span></div></div>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">注意：实际 ADR（¥648）低于调整后 BAR（¥660），但这仍判「做对」</span>\n    <p>因为实际 ADR 是<b>全房型、全渠道、全客源</b>的加权平均值，天然会低于基准房型 SUP 的 BAR（低价房型 STD 与折扣客源 CORP/GRP/LNG 会把它拉下来）。<br>\n    <b>命中率比较的是 RevPAR，不是 ADR，也不是 OCC。</b>本例 OCC 从预测 78.2% 涨到实际 81.5%（<span class=\"up\">↑3.3 个百分点</span>），足以抵消 ADR 的折让，所以 RevPAR 上升 → 判做对。</p>\n  </div>\n\n  <h3>9.3 分组统计（三个维度，缺一不可）</h3>\n\n  <div class=\"grid-3\">\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">A</span>按触发表编号分组</div>\n      <p>表 A / 表 B / 表 C / 表 D / 表 E / 表 H / 表 I 各一组。<br><b>用途：找出哪张表的阈值不适用于本店。</b>这是最有价值的一组。</p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">B</span>按需求等级分组</div>\n      <p>D1 峰值 / D2 高涨 / D3 平峰 / D4 低谷各一组。<br><b>用途：找出本店在哪种需求节律下判断力最弱。</b>通常是 D4 低谷日命中率最低。</p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">C</span>按调整方向分组</div>\n      <p>上调 / 下调 / 维持各一组。<br><b>用途：找出执行人是「不敢提」还是「不敢降」。</b>多数新人是上调命中率低（提价提早了）。</p>\n    </div>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">样本量门槛（不许用小样本骗自己）</span>\n    <p><b>单组样本 &lt; 20 条不统计命中率</b>，在报告里写「样本不足（n=__），暂不统计」。<br>\n    原因：20 条以下，一条记录的进出就能让命中率变动 5 个百分点以上，这个数字没有管理意义，只会被用来给自己贴金或背锅。<br>\n    按云璟的节奏（每日约 3–6 条台账，其中价格类 1–3 条），<b>按触发表编号分组约需 1 个月达到门槛，按需求等级分组约需 2 个月</b>。所以命中率报告的最小周期是<b>月度</b>，周度只做台账条数统计，不做命中率。</p>\n  </div>\n\n  <h2 id=\"s10\">十、命中率 &lt;60% 怎么办、&gt;75% 说明什么</h2>\n\n  <div class=\"grid-2\">\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">▼</span>命中率 &lt; 60%</div>\n      <div class=\"metric\">\n        <div class=\"metric-val\"><span class=\"down\">&lt;60%</span></div>\n        <div class=\"metric-label\">判定表的输入或执行<br>至少有一处系统性错误</div>\n      </div>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">▲</span>命中率 &gt; 75%</div>\n      <div class=\"metric\">\n        <div class=\"metric-val\"><span class=\"up\">&gt;75%</span></div>\n        <div class=\"metric-label\">判定表在本店成立<br>但要排查「假优秀」</div>\n      </div>\n    </div>\n  </div>\n\n  <h3>10.1 命中率 &lt;60% 的五步处置（按顺序执行，不许跳步）</h3>\n\n  <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n    <h4>定位最低的那一组</h4>\n    <p>按触发表编号分组，找出命中率最低且样本 ≥20 条的那一组。<b>不许一上来就怀疑全部阈值</b>——绝大多数情况是某一张表的某个输入算错了。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n    <h4>核查该表的输入口径（三查）</h4>\n    <div class=\"tbl-wrap\" style=\"margin-top:8px\">\n      <table class=\"tbl\">\n        <caption>表 4-8　输入口径三查</caption>\n        <thead><tr><th>查什么</th><th>正确做法</th><th>常见错误</th></tr></thead>\n        <tbody>\n          <tr><td><b>查 Pickup 偏差</b></td><td>与<b>去年同期同一提前窗口</b>在手比</td><td>错用「昨天在手 − 前天在手」或「与上周同日比」，季节性完全失真</td></tr>\n          <tr><td><b>查预测 OCC 的分母</b></td><td>用<b>可售房晚</b>（总房量 − OOO）</td><td>错用总房量 320，导致 OCC 被低估，读到偏激进的降价档</td></tr>\n          <tr><td><b>查定行定列</b></td><td>保留一位小数后按「含下界不含上界」定行</td><td>先四舍五入到整数再定行，84.6% 与 85.4% 会被归到同一行</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n    <h4>两周「纯表执行」测试</h4>\n    <p>若三查无问题，则执行两周<b>纯表模式</b>：严格执行判定表给出的动作，<b>禁止任何个人经验修正</b>（包括「我觉得这个价太贵了少提 2 个点」）。期间台账备注栏加标记「纯表期」。<br>\n    两周后单独统计纯表期的命中率。<b>若纯表期命中率回到 ≥60%，则问题出在执行人不按表做，不是表的问题</b> → 转入人事辅导，不动阈值。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n    <h4>阈值复核（连续 2 个月 &lt;60% 才启动）</h4>\n    <p>若纯表期命中率仍 &lt;60%，且已连续 2 个月 &lt;60%，则由 <b>L3 收益管理经理</b>启动阈值复核，上报集团收益管理部。<br>\n    <b>复核不得自行改动《法典》阈值</b>——只能提出调整建议并附数据，由集团统一发布版本。任何本地擅自改阈值的台账记录，触发表编号一栏视为无效。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">5</div><div class=\"step-body\">\n    <h4>权限收紧（命中率 &lt;50% 触发）</h4>\n    <p>单个执行人连续 2 个月命中率 &lt;50%（样本 ≥20 条）→ <b>暂停其独立调价权限</b>，回到「L1 执行 + L2 逐条复核」制，为期 1 个月。期满后重新统计，≥60% 方可恢复。</p>\n  </div></div>\n\n  <h3>10.2 命中率 &gt;75% 的三层解读</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 4-9　高命中率的三层解读<span class=\"cap-note\">第 1 层是结论，第 2 层是验证，第 3 层是防自欺</span></caption>\n      <thead><tr><th>层次</th><th>说明什么</th><th>触发什么动作</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>第 1 层<br>结论</b></td>\n          <td>《法典》判定表与取数口径在<b>本店是成立的</b>。输入（预测 OCC + Pickup 偏差）的质量足以支撑判定，执行人按表做的纪律性良好。</td>\n          <td>可申请<b>扩大执行人的自主权限</b>：如把「70–85% 档的 ±3% 以内调价」从 L2 复核改为 L1 独立执行。写入季度策略文件。</td>\n        </tr>\n        <tr>\n          <td><b>第 2 层<br>验证</b></td>\n          <td>但必须同时看<b>动作率</b>：动作率 =（动作类型为调价上调 + 调价下调的条数）÷ 台账总条数 × 100%。<br>若命中率 &gt;75% 而<b>动作率 &lt;30%</b>，说明大部分日子在填「维持」。</td>\n          <td>命中率 &gt;75% <b>且</b> 动作率 ≥30% → 真优秀，可扩权。<br>命中率 &gt;75% <b>但</b> 动作率 &lt;30% → <b>判为「回避决策」</b>，见第 3 层。</td>\n        </tr>\n        <tr>\n          <td><b>第 3 层<br>防自欺</b></td>\n          <td>「只做有把握的动作」可以把命中率刷得很高：<b>需求明确的日子才动手，模糊的日子一律填维持</b>。这样分母里全是简单题，命中率自然高，但酒店的收益机会大量流失。</td>\n          <td>查两件事：① 台账中「维持」条数占比；② 那些填了「维持」的日子，30 天后实际 RevPAR 与预测 RevPAR 的差值分布。<b>若维持日的实际 RevPAR 普遍显著偏离预测，说明该动没动</b> → 列入 L2 辅导，并在季度策略中复盘「维持」的判定条件是否过严。</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-gold\">\n    <span class=\"co-t\">记忆口诀</span>\n    <p><b>「命中率看对不对，动作率看敢不敢。两个都高才是真本事。」</b><br>\n    云璟的月度目标值：命中率 <b>≥60%</b>（合格线）、<b>≥75%</b>（优秀线）；动作率 <b>≥30%</b>（合格线）。两个指标同时出现在《业主一页纸》第 ④ 段。</p>\n  </div>\n\n  <h2 id=\"s11\">十一、报表常见错误 5 例（含排查动作）</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 4-10　报表常见错误 5 例<span class=\"cap-note\">每例都给出「怎么发现的」与「发现后怎么办」，不是只讲道理</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>错误</th><th>后果</th><th>怎么发现</th><th>发现后怎么办</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td>\n          <td><b>OCC 分母用了总房量 320，没扣 OOO 房晚</b></td>\n          <td>OCC 被系统性低估。云璟常年 OOO 约 6–10 间，即 OCC 被低估约 2–3 个百分点。后果是表 A 定行偏低 → 读到偏激进的降价档（如本该 70–85% 行读成 55–70% 行，动作从 ↓3% 变成 ↓10%）</td>\n          <td>跑恒等式①：总房量 − OOO = 可售房晚。再把本周 OCC 与上周逐日对比，若某日突降且无需求原因，先查 OOO</td>\n          <td>重算全部受影响日期的 OCC；把这些日期的台账条目加标记「分母错误」，从命中率统计中剔除并重跑；当日起改用可售房晚</td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td>\n          <td><b>ADR 口径混用：一个月含早、一个月不含早</b></td>\n          <td>月度 ADR 同比完全失真。云璟含早加价 ¥68/人，双人含早就是 ¥136，占平峰 BAR ¥680 的 20%</td>\n          <td>把 ADR 与「客房收入 ÷ 已售房晚」对算，再看含早套餐的销售占比是否突变；把本月 ADR 除以 <code>1 + 含早房晚占比 × 68 ÷ ADR</code> 反推还原</td>\n          <td>锁定统一口径：<b>全学院统一用不含早 ADR</b>，含早收入单独列示在「其他收入」的早餐项下；历史月份按还原值重算并标注</td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td>\n          <td><b>Comp / House Use 房晚并入已售房晚</b></td>\n          <td>OCC 虚高、ADR 虚低。免费房收入为 0 却计入分母，等于白送一间还要赔一次平均数</td>\n          <td>跑恒等式④：分渠道房晚之和 = 分细分房晚之和 = 已售房晚。Comp 不属于任何渠道，若总数对得上但含 Comp，恒等式④会不成立</td>\n          <td>把 Comp / House Use 单独列行，<b>不计入已售房晚</b>；若政策明确要求按 0 计入房晚，则收入按 0 计并在备注说明（该例外须 L3 书面确认）</td>\n        </tr>\n        <tr>\n          <td class=\"num\">4</td>\n          <td><b>Pickup 偏差拿「昨天 vs 前天」代替「今年 vs 去年同期同窗口」</b></td>\n          <td>季节性完全丢失。淡季里「每天比昨天多」会被读成领先，实际可能大幅落后去年同期</td>\n          <td>抽查 3 天：把台账上的 Pickup 偏差用正确公式（（当前在手 − 去年同期同窗口在手）÷ 去年同期在手）重算一遍，对比差异</td>\n          <td>把 Pickup 表的去年同期列做成<b>系统固定取数项</b>，人工不得修改；受影响日期的台账条目标记「偏差口径错误」并剔除出命中率</td>\n        </tr>\n        <tr>\n          <td class=\"num\">5</td>\n          <td><b>台账只记调价，不记「维持」与「因约束未执行」</b></td>\n          <td>命中率分母只剩简单题，命中率被系统性高估；且无法回答「那天为什么没动」</td>\n          <td>把当月《今日动作清单》的条目总数与台账条数对比，不等即为漏记；再看台账中「维持」条数占比，若 &lt;20% 高度可疑</td>\n          <td>补记（能补多少补多少，补不上的月份在命中率报告里标注「分母不完整，仅供参考」）；当日起执行「查表即开条目」的 08:30 动作（见 8.1）</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">补充第 6 例（不进表，但最常见）</span>\n    <p><b>报表数字与 PMS 对不上，但没人核对。</b>根源是跳过了 M02 的 4 条恒等式自检。<br>\n    排查动作：把恒等式① ② ③ ④ 做成报表模板的<b>自动校验行</b>，任一不通过则整张报表标红，<b>且不允许提交</b>。这是下一节自动化改造的第 1 条。</p>\n  </div>\n\n  <h2 id=\"s12\">十二、报表与台账的自动化改造 6 条</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 4-11　自动化改造清单<span class=\"cap-note\">按「投入产出比」排序，从上往下做，不要并行开工</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>改造项</th><th>替代的人工动作</th><th>落地做法</th><th>验收标准</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td><td><b>4 条恒等式自动校验</b></td>\n          <td>07:30 人工核对 14 字段</td>\n          <td>在《每日收益数据包》模板里加 4 个校验单元格，任一为 FALSE 则整表标红并锁定提交按钮</td>\n          <td>连续 10 天无「数据错误导致返工」</td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td><td><b>台账表单化</b></td>\n          <td>自由文本填写 15 字段</td>\n          <td>把台账改成带下拉选项的表单：动作类型、触发表编号、复盘结论三列强制单选，备注栏保留自由文本但给出三段式占位提示</td>\n          <td>触发表编号列 100% 为合法表编号，无「经验判断」类内容</td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td><td><b>命中率自动透视</b></td>\n          <td>月底人工数条数</td>\n          <td>用台账做数据透视表：行 = 触发表编号 / 需求等级 / 调整方向，值 = 条数、做对条数、命中率；加「样本量 &lt;20 显示『样本不足』」的条件格式</td>\n          <td>月度命中率报告编制时间从 4 小时降到 30 分钟</td>\n        </tr>\n        <tr>\n          <td class=\"num\">4</td><td><b>Pickup 落后自动标红</b></td>\n          <td>07:50 人工逐日比对 30 天</td>\n          <td>在 Pickup 表里嵌入《法典》表 I 六档阈值（0–3 天 OCC&lt;70% / 4–7 天 10% / 8–14 天 15% / 15–30 天 20% / 31–60 天 25% / &gt;60 天 30%），超阈值自动标红并生成待办行</td>\n          <td>无遗漏的落后日；08:30 查表前待办清单已就绪</td>\n        </tr>\n        <tr>\n          <td class=\"num\">5</td><td><b>限制条件存量清单自动导出</b></td>\n          <td>每周一人工翻系统找设过哪些限制</td>\n          <td>每周一自动导出生效中的 MinLOS / CTA / CTD / Stop Sell 全量清单，含生效日期区间，并高亮「7 天内到期」与「已过期仍生效」两类</td>\n          <td>连续 4 周无「限制条件忘记撤除」事故（详见 M07 第 4 节）</td>\n        </tr>\n        <tr>\n          <td class=\"num\">6</td><td><b>竞价比价定时抓取 + 时间戳</b></td>\n          <td>08:10 人工开 5 个网页抄价</td>\n          <td>设定时任务在 08:10 抓取 A–E 五家同档房型挂牌价，自动写入比价表并记录<b>采集时间戳</b>；抓取失败的行留空并告警，<b>禁止用旧数据填充</b></td>\n          <td>比价表 100% 行有当日时间戳；08:30 前完成率 100%</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">自动化的红线：自动化的只是「搬运与计算」，不是「判断与决策」</span>\n    <p>下面三件事<b>永远不许自动化</b>：<br>\n    ① <b>不许</b>让系统直接按判定表自动改价后不写台账——哪怕系统能自动落位，台账条目也必须自动生成并人工确认三个字段（触发表编号、复核人、备注三段）。<br>\n    ② <b>不许</b>让系统自动改写《法典》阈值——阈值变更必须走集团版本发布。<br>\n    ③ <b>不许</b>让系统自动回填「复盘结论」——结论可以由系统算出建议值（实际 RevPAR vs 预测 RevPAR 的比较是纯计算），但<b>最终判定必须由人确认后落定</b>，因为期间可能发生了表 L 异常事件（应判「无法判定」而非「做错」）。</p>\n  </div>\n\n  <\!-- ================= 十三 ================= -->\n  <h2 id=\"s13\">十三、讲师示范：一条台账从写到复盘的全生命周期</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>示范　目标日 2026-11-12（周三 · D3 平峰日）的一条台账</div>\n\n    <h4>阶段一 · 2026-10-28（T−15 天）08:30 查表即开条目</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">已知</div><div class=\"kv-v\">目标日 11 月 12 日，可售 320（OOO 0）；在手 210；去年同期同窗口在手 224；预测增量 30；当前 SUP-K/SUP-T BAR ¥680</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">算输入</div><div class=\"kv-v\">预测 OCC =（210+30）÷320 = <b>75.0%</b>；Pickup 偏差 =（210−224）÷224 = <b>落后 6.3%</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">查表 A</div><div class=\"kv-v\">行「70–85%」× 列「落后 3–10%」→ <span class=\"down\">↓3%</span>。新价 = 680 × 0.97 = 659.6 → <b>¥660</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">此时就填好的 9 个字段</div><div class=\"kv-v\">操作日期 2026-10-28｜目标日 2026-11-12｜动作类型 调价（下调）｜调整前 ¥680｜调整后 ¥660｜幅度 <span class=\"down\">↓3%</span>｜触发表编号 表 A｜OCC 预测 75.0%｜Pickup 偏差 落后 6.3%</div></div>\n    </div>\n\n    <h4>阶段二 · 09:10 执行 → 09:55 封板</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">落位</div><div class=\"kv-v\">7 档房型整表同步 ↓3%：STD ¥563 / SUP ¥660 / DLX ¥795 / DLX-V ¥931 / EXE ¥960 / STE-B ¥1,242 / STE-E ¥1,824；截图编号 F1028-01</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">约束校验</div><div class=\"kv-v\">① 累计 ↓3% ≤20% ✓　② 近 24h 第 1 次 ✓　③ 3% ≥3% ✓　④ 09:10 落位 → 09:40 核查 ✓　⑤ 非 D1 日，无需 L3 ✓</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">同步动作</div><div class=\"kv-v\">表 B（70–85% 行）：MinLOS 清空 / CTA 否 / 低价渠道全开 / 超售按表 E（8% → 基准 2%，无修正 → 320×2% = 6.4 → <b>6 间</b>）<br>表 H（70–85% 行）：OTA 国内全开 / OTA 国际全开 / GDS 开 / 批发商限价开 ≤¥495（= 660 × 75%）/ 直销全开 + 早鸟</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 C / 表 D 仲裁</div><div class=\"kv-v\">竞争组合加权 ADR ¥703.1、加权 OCC 73.6% → ARI = 680÷703.1×100 = <b>96.7</b>（落「90–97 略低」，预测 OCC 75.0% &lt;80% → <b>维持</b>）；MPI = 75.0÷73.6×100 = <b>101.9</b>（落「100–110 健康」→ 维持）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">补全字段 10–12、15</div><div class=\"kv-v\">执行人 收益专员 XXX（L1）｜复核人 收益主管 XXX（L2）｜执行时间 09:14｜备注三段（见下）</div></div>\n    </div>\n\n    <div class=\"callout callout-do\">\n      <span class=\"co-t\">备注栏三段式（本条实填）</span>\n      <p><b>第一段 · 冲突与仲裁：</b>查表 A 得 ↓3%（优先级 3）、表 C 得维持（4）、表 D 得维持（6）。按表 O 执行表 A 的 ↓3%；表 C、表 D 结论写入《观察清单》。<br>\n      <b>第二段 · 约束与限制：</b>5 条约束全部通过；下调后新价 ¥660 仍在 D3 系数区间（95–110%，即 ¥646–¥748）内，未触底。<br>\n      <b>第三段 · 关联动作：</b>同步执行表 B（MinLOS 清空、低价渠道全开、超售上限 6 间）与表 H（批发商限价 ≤¥495、直销上早鸟）。7 档房型整表落位截图 F1028-01。09:40 一致性核查 6 渠道全部通过。</p>\n    </div>\n\n    <h4>阶段三 · 2026-11-13（T+1 天）回填与复盘</h4>\n    <div class=\"formula\">\n      <span class=\"f-label\">实际数据</span>\n      实际 OCC 78.4%　实际 ADR ¥655　实际 RevPAR = 78.4% × 655 = <b>¥513.5</b><br><br>\n      <span class=\"f-label\">调价前预测 RevPAR</span>\n      75.0% × ¥660 = <b>¥495.0</b><br><br>\n      <span class=\"f-label\">判定</span>\n      ¥513.5 ≥ ¥495.0 → 复盘结论 = <span class=\"f-out\">做对</span>\n    </div>\n\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 4-12　本条台账的完整 15 字段（成稿）</caption>\n        <thead><tr><th class=\"num\">#</th><th>字段</th><th>内容</th></tr></thead>\n        <tbody>\n          <tr><td class=\"num\">1</td><td>操作日期</td><td>2026-10-28</td></tr>\n          <tr><td class=\"num\">2</td><td>目标入住日</td><td>2026-11-12</td></tr>\n          <tr><td class=\"num\">3</td><td>动作类型</td><td>调价（下调）</td></tr>\n          <tr><td class=\"num\">4</td><td>调整前</td><td>SUP-K/SUP-T ¥680（7 档整表见截图 F1028-00）</td></tr>\n          <tr><td class=\"num\">5</td><td>调整后</td><td>SUP-K/SUP-T ¥660（7 档整表见截图 F1028-01）</td></tr>\n          <tr><td class=\"num\">6</td><td>幅度 %</td><td><span class=\"down\">↓3%</span></td></tr>\n          <tr><td class=\"num\">7</td><td>触发表编号</td><td><b>表 A</b>（行 70–85% × 列 落后 3–10%）</td></tr>\n          <tr><td class=\"num\">8</td><td>当时 OCC 预测</td><td>75.0%</td></tr>\n          <tr><td class=\"num\">9</td><td>当时 Pickup 偏差</td><td>落后 6.3%</td></tr>\n          <tr><td class=\"num\">10</td><td>执行人</td><td>收益专员 XXX（L1）</td></tr>\n          <tr><td class=\"num\">11</td><td>复核人</td><td>收益主管 XXX（L2）— 非 D1 日，无需 L3 审批</td></tr>\n          <tr><td class=\"num\">12</td><td>执行时间</td><td>09:14</td></tr>\n          <tr><td class=\"num\">13</td><td>30 天后实际</td><td>OCC 78.4% / ADR ¥655 / RevPAR ¥513.5</td></tr>\n          <tr><td class=\"num\">14</td><td>复盘结论</td><td><span class=\"pill pill-teal\">做对</span>（¥513.5 ≥ ¥495.0）</td></tr>\n          <tr><td class=\"num\">15</td><td>备注</td><td>（三段式全文，见上）</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n\n  <\!-- ================= 十四 ================= -->\n  <h2 id=\"s14\">十四、学员跟练（5 题）</h2>\n\n  <p>要求：每题限时 12 分钟，先独立作答再展开答案。<b>答案中每个数字都必须能追溯到 SPEC 或《法典》。</b></p>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 1 · 台账字段缺漏排查</div>\n    <div class=\"q-b\">以下是某专员写的一条台账，请逐字段指出缺漏与错误，并说明每一处会导致什么后果：<br>\n    「10 月 16 日，把 10 月 30 日的价格从 680 调到 660，因为 Pickup −6%，感觉要降一点。执行人：小李。」</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>共 10 处问题：</b><br>\n      ① <b>操作日期缺年份</b> → 跨年无法排序，30 天后回填时可能定位到错误的目标日。<br>\n      ② <b>动作类型未填</b> → 无法按类型分组统计命中率，「维持」是否被漏记无从核查。<br>\n      ③ <b>调整前/后只写了基准房型</b>，未注明 7 档整表是否同步 → 无法校验是否破坏表 F 的房型价差阶梯。<br>\n      ④ <b>幅度 % 未填</b> → 无法校验表 A 三条量化约束（单日 ≤20%、24h 内 ≤2 次、单次 ≥3%）。本例实际为 <span class=\"down\">↓2.9%</span>（（680−660）÷680 = 2.94%），<b>低于 3% 下限，按表 A 约束 3 根本不该执行</b>。<br>\n      ⑤ <b>触发表编号写成了「感觉要降一点」</b> → <span class=\"pill pill-red\">最严重</span>。整条记录失去可追溯性，命中率无法按表分组，这条记录不能计入分母。<br>\n      ⑥ <b>Pickup 偏差写裸负数「−6%」</b> → 应为「落后 6.0%」并保留一位小数。裸负数在跨表引用时极易被误读为领先。<br>\n      ⑦ <b>OCC 预测未填</b> → 无法验证定行是否正确。<br>\n      ⑧ <b>复核人未填</b> → 无法证明已过 L2 复核；若 10 月 30 日是 D1 峰值日，还缺 L3 审批人。<br>\n      ⑨ <b>执行时间未填</b> → 无法校验「24h 内同方向 ≤2 次」与「调价后 30 分钟内核查 OTA」。<br>\n      ⑩ <b>字段 13、14 未填</b> → 30 天后未回填实际 OCC/ADR/RevPAR 与复盘结论，命中率的分子无法统计。<br>\n      <b>另注：</b>备注栏完全空白，多表冲突的仲裁依据无处记录。<br>\n      <b>结论：</b>这条记录<b>全部 15 个字段中完整合规的只有 2 个</b>（目标入住日、执行人），应从命中率统计中剔除，并要求当事人重写。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 2 · 完整填一条台账</div>\n    <div class=\"q-b\">目标日 2027-01-15（周五，D4 低谷日）。2026-12-31 08:30 查表得：可售 320（OOO 0）；在手 96；去年同期同窗口在手 120；预测增量 24；当前 SUP-K/SUP-T BAR ¥520；竞争组合加权 ADR ¥600、加权 OCC 52.0%；48h Pickup 落后 18.0%；No-show+24h 取消 8%。<br>请：① 查表 A 得出动作与新价；② 查表 B、表 H、表 C、表 D；③ 按表 O 仲裁；④ 按 15 字段完整写出这条台账。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 表 A：</b>预测 OCC =（96+24）÷320 = <b>37.5%</b> →「<b>&lt;40%</b>」行；Pickup 偏差 =（96−120）÷120 = <b>落后 20.0%</b> →「落后 &gt;10%」列 → <span class=\"down\">↓20%</span>。新价 = 520 × 0.80 = <b>¥416</b>。<br>\n      约束：累计 ↓20% = 上限 ✓；第 1 次 ✓；20% ≥3% ✓；非 D1 无需 L3 ✓。<b>注意：</b>新价 ¥416 <b>低于 D4 系数下限</b>（680 × 70% = ¥476），须核查表 L——48h Pickup 落后 18.0%，<b>未达「&gt;40%」阈值 → 不触发表 L</b>，继续按表 A 执行，但备注必须写明。<br>\n      <b>② 表 B（&lt;70% 行）：</b>MinLOS 不设限；CTA 否；低价渠道全开 + 上促销；<b>不超售</b>。<br>\n      <b>表 H（&lt;55% 行）：</b>OTA 国内全开 + 深折；OTA 国际全开；GDS 开 + 商务套餐；批发商开 + 打包产品（净价不得公开挂牌）；直销/会员全开 + 长住/团购。<br>\n      <b>表 C：</b>ARI = 520÷600×100 = <b>86.7</b> →「80–90 偏低」→ <b>提 5%</b>。<br>\n      <b>表 D：</b>MPI = 37.5÷52.0×100 = <b>72.1</b> →「&lt;85 严重落后」→ 启动 L2-E1：降价 10% + 全员直销动员 + 48 小时复盘。<br>\n      <b>③ 仲裁：</b>价格类三方冲突——表 A ↓20%（优先级 3）、表 C ↑5%（4）、表 D ↓10%（6）→ <b>只执行表 A 的 ↓20%</b>。表 C ↑5%、表 D「降价 10%」写入《观察清单》。表 D 组合包中的「全员直销动员」「48 小时复盘」是<b>非价格动作</b>，不与表 A 冲突 → <b>照常执行</b>。<br>\n      <b>④ 台账 15 字段：</b><br>\n      1 操作日期 2026-12-31｜2 目标日 2027-01-15｜3 动作类型 调价（下调）｜4 调整前 SUP ¥520｜5 调整后 SUP ¥416（7 档整表同步 ↓20%，见截图 F1231-01）｜6 幅度 <span class=\"down\">↓20%</span>｜7 触发表编号 <b>表 A</b>（行 &lt;40% × 列 落后 &gt;10%）｜8 OCC 预测 37.5%｜9 Pickup 偏差 落后 20.0%｜10 执行人 收益专员 XXX（L1）｜11 复核人 收益主管 XXX（L2）｜12 执行时间 09:12｜13 30 天后实际（待回填）｜14 复盘结论（待回填）｜<br>\n      15 备注三段：<b>①冲突与仲裁</b>——查表 A ↓20%（3）、表 C ↑5%（4）、表 D ↓10%（6），按表 O 只执行表 A；表 C、表 D 价格动作写入《观察清单》；表 D 的「全员直销动员 + 48 小时复盘」为非价格动作，已列入《今日动作清单》并行执行。<b>②约束与限制</b>——5 条约束全部通过；单日下调已达 20% 上限，当日不再下调；新价 ¥416 低于 D4 系数下限 ¥476，已核查表 L（48h Pickup 落后 18.0% &lt; 40% 阈值）不触发应急。<b>③关联动作</b>——同步执行表 B（MinLOS 不设限、低价渠道全开+上促销、不超售）与表 H（&lt;55% 档全渠道配置）。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 3 · 命中率计算与诊断</div>\n    <div class=\"q-b\">某月台账统计如下（已全部复盘，无「无法判定」）：<br>\n    表 A 触发 42 条，做对 26 条；表 B 触发 18 条，做对 14 条；表 C 触发 12 条，做对 6 条；表 H 触发 9 条，做对 7 条；表 I 触发 6 条，做对 5 条。<br>\n    其中表 A 的 42 条里：上调 14 条（做对 6 条）、下调 20 条（做对 16 条）、维持 8 条（做对 4 条）。<br>\n    请：① 算总命中率；② 按触发表编号分组算各组命中率并指出最低组；③ 算表 A 内部按调整方向的分组命中率；④ 给出诊断结论与下一步动作。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 总命中率：</b>总条数 = 42+18+12+9+6 = <b>87 条</b>；做对 = 26+14+6+7+5 = <b>58 条</b>；命中率 = 58÷87 = <b>66.7%</b>。<br>\n      <b>② 分组：</b><br>\n      表 A：26÷42 = <b>61.9%</b>（n=42）<br>\n      表 B：14÷18 = <b>77.8%</b>（n=18，<b>&lt;20，样本不足，不统计</b>）<br>\n      表 C：6÷12 = <b>50.0%</b>（n=12，<b>&lt;20，样本不足，不统计</b>）<br>\n      表 H：7÷9 = <b>77.8%</b>（n=9，<b>样本不足</b>）<br>\n      表 I：5÷6 = <b>83.3%</b>（n=6，<b>样本不足</b>）<br>\n      <b>达标样本量的只有表 A 一组（n=42 ≥20）</b>，命中率 <b>61.9%</b>，刚过 60% 合格线。<b>其余四组写「样本不足（n=__），暂不统计」。</b><br>\n      <b>③ 表 A 内部按方向：</b><br>\n      上调：6÷14 = <b>42.9%</b>（n=14，<b>&lt;20，参考值</b>）<br>\n      下调：16÷20 = <b>80.0%</b>（n=20，达标）<br>\n      维持：4÷8 = <b>50.0%</b>（n=8，<b>&lt;20，参考值</b>）<br>\n      <b>④ 诊断与动作：</b><br>\n      <b>结论 1：</b>总命中率 66.7% ≥60% 合格线，<b>未达 75% 优秀线</b>，不扩权、不收紧，维持现状。<br>\n      <b>结论 2：</b>唯一达标的表 A 组里，<b>上调命中率 42.9% 显著低于下调的 80.0%</b>（差 37.1 个百分点）。这是典型的「<b>提价提早了</b>」症状：看到 Pickup 领先就立刻提价，但等需求真正兑现时已经把价格抬过市场承受点，导致后续 Pickup 掉头向下。<br>\n      <b>下一步动作（按顺序）：</b><br>\n      a. <b>不做阈值调整</b>——表 A 组整体 61.9% 已过合格线，且表 C/表 H/表 I 组样本不足，证据不足以启动阈值复核。<br>\n      b. <b>针对上调动作做专项复盘</b>：把 14 条上调记录逐条拉出，看「提价后 7 天内 Pickup 是否掉头」，若 &gt;8 条出现掉头，则确认是提前量问题。<br>\n      c. <b>执行 2 周「纯表 + 上调延迟」测试</b>：在纯表模式基础上，对「领先 3–10%」列的上调动作延后 1 个观察日再执行（「领先 &gt;10%」列不延后），期间台账标记「上调延迟测试期」，2 周后单独统计。<br>\n      d. <b>扩大样本</b>：表 C 组只有 12 条，需再积累 1 个月才能统计。下月报告中表 C 组仍写「样本不足」。<br>\n      <b>不做的动作：</b>不因表 C 的 50.0% 就去怀疑表 C 的阈值——n=12 远低于 20 条门槛，这个数字没有统计意义。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 4 · 报表错误识别</div>\n    <div class=\"q-b\">某专员提交的 11 月日报中有以下情况，请逐条识别错误、说明后果、给出排查动作：<br>\n    ① 11 月 OCC 用 320 间做分母，未扣 OOO（11 月累计 OOO 房晚 240）；<br>\n    ② 11 月 ADR ¥636，其中含早套餐房晚占 35%，而 10 月 ADR ¥618 的含早占比为 12%；<br>\n    ③ 台账中 11 月共 68 条，其中「维持」仅 3 条；<br>\n    ④ 11 月 Pickup 偏差按「当日在手 − 昨日在手」计算。<br>\n    （已知：11 月实际售出房晚 7,180，11 月共 30 天）</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 分母错误（对应表 4-10 第 1 例）：</b><br>\n      正确可售房晚 = 320 × 30 − 240 = 9,600 − 240 = <b>9,360</b>。专员算的 OCC = 7,180 ÷ 9,600 = <b>74.8%</b>；正确 OCC = 7,180 ÷ 9,360 = <b>76.7%</b>。<br>\n      <b>低估 1.9 个百分点。</b>后果：表 A 定行可能从「70–85%」掉到「55–70%」，动作从 ↓3% 变成 ↓10%，白白多让 7 个点。<br>\n      <b>排查动作：</b>重算全月 OCC；把 11 月所有台账条目标记「分母错误」，剔除后重跑命中率；当日起模板强制走恒等式①。<br><br>\n      <b>② 口径混用（对应第 2 例）：</b><br>\n      含早加价 ¥68/人，按单人计。还原不含早 ADR ≈ 636 − 68 × 35% ×（按一人计）≈ 636 − 23.8 = <b>¥612.2</b>；10 月还原值 ≈ 618 − 68 × 12% = <b>¥609.8</b>。<br>\n      专员看到的同比是 636 ÷ 618 − 1 = <span class=\"up\">↑2.9%</span>；<b>同口径还原后仅 <span class=\"up\">↑0.4%</span></b>。含早占比从 12% 跳到 35% 才是 ADR 上涨的主因，<b>不是价格能力提升</b>。<br>\n      <b>排查动作：</b>锁定统一口径为不含早 ADR；历史月份按还原值重算并标注；含早收入单列。<br><br>\n      <b>③ 维持条数过少（对应第 5 例）：</b><br>\n      68 条中维持仅 3 条，维持占比 <b>4.4%</b>，远低于 20% 的警戒线。<b>两种可能：</b>一是真的每天都有动作（11 月 30 天，68 条 = 日均 2.3 条，有可能）；二是漏记了维持。<br>\n      <b>排查动作：</b>把 11 月每日《今日动作清单》条目总数与台账条数逐日对比。表 A 的 30 格中「维持」占了 7 格（≥95%行的落后&gt;10%列、85–95%行的落后&gt;10%列、70–85%行的持平列、55–70%行的领先3–10%列、40–55%行的两列、&lt;40%行的领先&gt;10%列），平峰月份里维持日占比通常不会低于 15%。<b>若清单条数 &gt; 台账条数，即为漏记，必须补记并标注「分母不完整」。</b><br><br>\n      <b>④ Pickup 口径错误（对应第 4 例）：</b><br>\n      「当日在手 − 昨日在手」算的是<b>单日净增量</b>，不是 Pickup 偏差。表 A 的输入 2 明确定义为「（当前在手 − 去年同期同一提前窗口在手）÷ 去年同期在手 × 100%」。<br>\n      <b>后果最严重：</b>用错口径后，淡季里「每天净增 5 间」会被读成「领先」，表 A 会读到提价档，与真实需求方向<b>完全相反</b>。<br>\n      <b>排查动作：</b>把 Pickup 表的去年同期列做成系统固定取数项，人工不得修改；11 月所有台账条目标记「偏差口径错误」，<b>整月记录从命中率统计中剔除</b>，12 月起重新起算。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 5 · 业主一页纸撰写</div>\n    <div class=\"q-b\">11 月数据：可售房晚 9,360；已售房晚 7,180；客房收入 ¥4,566,480；GOP ¥1,585,728；11 月预算 OCC 78%、ADR ¥620、RevPAR ¥484、GOPPAR ¥170；去年同期 OCC 76%、ADR ¥605、RevPAR ¥460、GOPPAR ¥162；竞争组合 OCC 73.6%、ADR ¥703.1、RevPAR ¥517.5。渠道综合成本率 10.0%。<br>请：① 算出 OCC / ADR / RevPAR / GOPPAR / TrevPAR（TrevPAR 按客房收入的 1.63 倍估算总营收）/ NRevPAR，并做三组对比；② 算出 MPI / ARI / RGI 并验算恒等式；③ 按五段结构写出《业主一页纸》。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 六项指标：</b><br>\n      OCC = 7,180 ÷ 9,360 = <b>76.7%</b>（预算 78% → <span class=\"down\">↓1.3pt</span>；去年 76.0% → <span class=\"up\">↑0.7pt</span>；组合 73.6% → <span class=\"up\">↑3.1pt</span>）<br>\n      ADR = 4,566,480 ÷ 7,180 = <b>¥636</b>（预算 ¥620 → <span class=\"up\">↑2.6%</span>；去年 ¥605 → <span class=\"up\">↑5.1%</span>；组合 ¥703.1 → <span class=\"down\">↓9.5%</span>）<br>\n      RevPAR = 4,566,480 ÷ 9,360 = <b>¥488</b>（预算 ¥484 → <span class=\"up\">↑0.8%</span>；去年 ¥460 → <span class=\"up\">↑6.1%</span>；组合 ¥517.5 → <span class=\"down\">↓5.7%</span>）<br>\n      验算：OCC × ADR = 76.7% × 636 = ¥487.8 ≈ ¥488 ✓<br>\n      GOPPAR = 1,585,728 ÷ 9,360 = <b>¥169.4</b>（预算 ¥170 → <span class=\"down\">↓0.4%</span>；去年 ¥162 → <span class=\"up\">↑4.6%</span>）<br>\n      TrevPAR =（4,566,480 × 1.63）÷ 9,360 = 7,443,362 ÷ 9,360 = <b>¥795.2</b><br>\n      NRevPAR = 488 ×（1 − 10.0%）= <b>¥439.2</b><br><br>\n      <b>② 三维诊断：</b><br>\n      MPI = 76.7 ÷ 73.6 × 100 = <b>104.2</b> → 表 D「100–110 健康」→ 维持<br>\n      ARI = 636 ÷ 703.1 × 100 = <b>90.4</b> → 表 C「90–97 略低」→ 预测 OCC ≥80% 才提 3%；本例 76.7% &lt;80% → <b>维持</b><br>\n      RGI = 488 ÷ 517.5 × 100 = <b>94.3</b><br>\n      <b>恒等式验算：</b>MPI × ARI ÷ 100 = 104.2 × 90.4 ÷ 100 = <b>94.2</b>；|94.3 − 94.2| = 0.1 ≤ 0.2 ✓ <b>通过</b><br><br>\n      <b>③ 《业主一页纸》：</b><br>\n      <b>① 本月结果：</b>OCC 76.7%（预算 78% / 去年 76.0% / 组合 73.6%）｜ADR ¥636（预算 ¥620 / 去年 ¥605 / 组合 ¥703.1）｜RevPAR ¥488（预算 ¥484 / 去年 ¥460 / 组合 ¥517.5）｜GOPPAR ¥169（预算 ¥170 / 去年 ¥162）<br>\n      <b>② 赢在 / 输在：</b>赢 1——份额领先，MPI 104.2，连续 3 个月 &gt;100。赢 2——RevPAR 同比 <span class=\"up\">↑6.1%</span>，超预算 <span class=\"up\">↑0.8%</span>。输 1——ARI 90.4，比竞争组合便宜 9.5%，ADR 失守是 RGI 仅 94.3 的唯一原因（份额已经赢了）。输 2——GOPPAR ¥169 略低于预算 ¥170，RevPAR 超预算但 GOPPAR 未同步超，需查成本端。<br>\n      <b>③ 下月预测：</b>12 月（去年 OCC 68%、ADR ¥570）预测 OCC 72% / ADR ¥600 / RevPAR ¥432；风险：12 月 24–31 日在手落后 26%，已按表 I「31–60 天」档（阈值 25%）启动协议客户拜访计划。<br>\n      <b>④ 调价命中率：</b>已复盘 87 条，命中率 66.7%（目标 ≥60%），唯一达标样本组为表 A（n=42，61.9%），其中上调命中率 42.9% 显著低于下调 80.0%，措施：已启动 2 周「纯表 + 上调延迟」测试（详见跟练 3）。动作率 =（上调 14 + 下调 20）÷ 68 = 50.0% ≥30% ✓。<br>\n      <b>⑤ 需决策：</b>1. 请批准 12 月 20 日中型会议团队（综合贡献 ¥186,000，已过表 K 底线 ¥30,000 餐饮保底），需 11 月 25 日前答复。2. 无。3. 无。<br>\n      <b>编制 / 复核：</b>编制 收益主管（L2）XXX　复核 收益经理（L3）XXX　日期 2026-12-10\n    </div></details>\n  </div>\n\n  <\!-- ================= 十五 ================= -->\n  <h2 id=\"s15\">十五、判定表默写清单</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">✎</span>当堂默写（限时 15 分钟）</div>\n    <ul class=\"checklist\">\n      <li>《调价台账》15 个字段名，按 1–15 顺序背出</li>\n      <li>《调价台账》15 个字段各自的「缺了会导致什么后果」（至少能说出 10 个）</li>\n      <li>调价命中率公式：命中率 = 做对条数 ÷ 已复盘总条数；「做对」= 实际 RevPAR ≥ 调价前预测 RevPAR</li>\n      <li>调价前预测 RevPAR = 调价前预测 OCC × 调整后 BAR（<b>分子用调整后 BAR</b>）</li>\n      <li>命中率三个分组维度：触发表编号 / 需求等级 / 调整方向；单组样本 &lt;20 条不统计</li>\n      <li>命中率 &lt;60% 五步处置：定位最低组 → 三查（Pickup 口径 / OCC 分母 / 定行定列）→ 两周纯表测试 → 连续 2 个月才启动阈值复核 → &lt;50% 暂停独立权限</li>\n      <li>命中率 &gt;75% 三层解读：结论（表成立，可扩权）/ 验证（须同时看动作率 ≥30%）/ 防自欺（只做简单题是回避决策）</li>\n      <li>四类报表的读者与频率：日报（每日/收益+前厅+销售）、周报（每周一/主管+驻店）、月报（每月 1 日与 5 日/L3+财务）、业主一页纸（每月 10 日/业主）</li>\n      <li>业主一页纸三条铁律：一页 A4 不缩印、数字 ≤12 个、不出现过程数字</li>\n      <li>业主一页纸五段结构：本月结果 / 赢在输在 / 下月预测 / 调价命中率 / 需决策事项</li>\n      <li>报表常见错误 5 例：OOO 未扣、ADR 含早口径混用、Comp 并入已售、Pickup 口径错、维持未入台账</li>\n      <li>日报 4 条恒等式：① 总房量 − OOO = 可售房晚　② 已售 ≤ 可售　③ RevPAR 两法互验　④ 分渠道和 = 分细分成 = 已售</li>\n      <li>三维诊断恒等式：|RGI − MPI × ARI ÷ 100| ≤ 0.2</li>\n      <li>《法典》表 M 台账相关时段：08:30 开条目 / 09:10 填执行时间 / 09:40 一致性结果进备注 / 09:55 封板 / 17:00 补录尾房 / T+30 天回填</li>\n      <li>《法典》表 I 六档落后触发阈值：0–3 天 OCC&lt;70% / 4–7 天 10% / 8–14 天 15% / 15–30 天 20% / 31–60 天 25% / &gt;60 天 30%</li>\n    </ul>\n  </div>\n\n  <\!-- ================= 十六 ================= -->\n  <h2 id=\"s16\">十六、随堂测（5 题）</h2>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 1 题</div>\n    <div class=\"q-b\">调价前预测 RevPAR 为什么用「调整后 BAR」而不是「调整前 BAR」？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>因为命中率要回答的是「做了这个动作之后，日子有没有比动作之前预想的更好」，而动作之后的预期收入必然按新价计算。</b><br>\n      解析：动作发生前的那一刻，你能拿到的最好估计是「按当时的预测 OCC、按调整后的新价能收多少」。用调整前 BAR 会得到一个「如果什么都不做会怎样」的基准，那是另一个问题（反事实推断），且无法观测验证——因为你永远不知道什么都不做会怎样。<br>\n      用调整后 BAR 得到的是一个<b>可观测、可验证</b>的承诺值：30 天后拿实际 RevPAR 与它比，就能判定这次决策兑现了没有。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 2 题</div>\n    <div class=\"q-b\">某执行人连续两个月命中率 82%，动作率 18%。该怎么评价？为什么？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>判定为「回避决策」，不给扩权，转入 L2 辅导。</b><br>\n      解析：命中率 82% &gt;75% 优秀线，但动作率 18% &lt;30% 合格线。<b>两个指标必须同时达标才算真优秀。</b><br>\n      动作率 =（上调条数 + 下调条数）÷ 台账总条数。18% 意味着 82% 的日子填了「维持」——也就是说，这个人只在需求信号极其明确、胜算极大的日子里才动手，模糊的日子一律不动。<br>\n      后果有两个：① 分母里全是简单题，命中率被人为抬高；② 大量本可通过调价捕捉的收益机会被放弃。<br>\n      验证动作（第 3 层防自欺）：把那些填了「维持」的日子拉出来，看 30 天后实际 RevPAR 与预测 RevPAR 的差值分布。<b>若维持日的实际 RevPAR 普遍显著偏离预测，说明判定条件过严、该动没动</b>，需在季度策略中复盘「维持」的判定条件。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 3 题</div>\n    <div class=\"q-b\">《调价台账》第 7 个字段「触发表编号」为什么被标为最关键字段？如果某人填了「经验判断」，这条记录该怎么处理？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>因为它是命中率能够「按表分组统计」的唯一依据；填「经验判断」的记录不得计入命中率的分母。</b><br>\n      解析：本模块全部方法论的落点是「用命中率反查哪张表的阈值不适用于本店」。这个反查只能通过「触发表编号」这一个字段完成——它是连接动作与判定表的唯一索引。<br>\n      填「经验判断」意味着这条动作不是由判定表给出的，它既不能证明表对，也不能证明表错。若把它计入分母，等于把「拍脑袋」的结果混进「按表做」的成绩里，命中率就失去了全部意义。<br>\n      处理方式：① 该条记录标记为无效，从分子分母中同时剔除；② 由 L2 复核人找当事人复盘，确认当时为什么不查表（是表覆盖不到？还是懒得查？）；③ 若某类场景反复出现「表覆盖不到」，由 L3 汇总上报集团，作为《法典》下一版增补判定表的候选场景。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 4 题</div>\n    <div class=\"q-b\">某组命中率 45%，样本量 14 条。能直接判定「这个执行人水平不行」并暂停其独立调价权限吗？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>不能。样本量 14 条 &lt;20 条门槛，这个 45% 不具统计意义，报告中应写「样本不足（n=14），暂不统计」。</b><br>\n      解析：20 条以下，单条记录的进出就能让命中率变动 5 个百分点以上（1÷14 = 7.1 个百分点）。用这样不稳定的数字去做人事决策（暂停权限）是不负责任的。<br>\n      正确动作：① 报告中写「样本不足」；② 继续积累样本，直到该组 ≥20 条；③ 按云璟节奏（每日 1–3 条价格类台账），约需再等 1–2 周；④ 若期间发现明显的操作错误（如跟练 1 那种 10 处缺漏），可针对<b>操作规范性</b>做辅导，但<b>不得以命中率为由做人事处置</b>。<br>\n      <b>补充：</b>真正触发权限收紧的条件是「单个执行人<b>连续 2 个月</b>命中率 &lt;50%（样本 ≥20 条）」，两个条件缺一不可。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 5 题</div>\n    <div class=\"q-b\">自动化改造的红线有三条，请说出其中两条，并说明为什么「复盘结论」不能由系统自动判定。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>三条红线（任答两条）：</b>① 不允许系统自动改价后不写台账；② 不允许系统自动改写《法典》阈值（须走集团版本发布）；③ 不允许系统自动回填「复盘结论」。<br>\n      <b>为什么复盘结论不能自动判定：</b>因为「实际 RevPAR vs 预测 RevPAR」的比较虽然是纯计算，但存在一类系统无法识别的情形——<b>期间发生了《法典》表 L 异常事件</b>。<br>\n      举例：目标日 9 月 19 日，表 A 给出 ↑5%，30 天后实际 RevPAR 低于预测 RevPAR。系统会自动判「做错」。但实际上，该日恰逢台风过境（表 L「需求暴跌」：48h Pickup 落后 &gt;40%），全城酒店 RevPAR 普跌 30%，本店跌 12% <b>已经远好于市场</b>。这种情况下正确结论是「<b>无法判定</b>」，不是「做错」。<br>\n      若由系统自动判定，会把这类记录错误地计入「未命中」，进而拉低整组命中率，最终误导阈值复核的方向。<br>\n      <b>落地做法：</b>系统给出<b>建议值</b>（做对 / 做错），同时自动标记「期间是否发生表 L 事件」，由人确认后落定最终结论。\n    </div></details>\n  </div>\n\n  <\!-- ================= 十七 ================= -->\n  <h2 id=\"s17\">十七、本模块产出物</h2>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">结课交付清单</span>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>《每日收益数据包》模板</b>——14 字段 + 6 项指标 + 4 条恒等式自动校验行，标红即锁定提交</li>\n      <li><b>《周度收益报告》模板</b>——10 个字段，含未来 8 周在手曲线（本年在手 / 去年同期 / 目标三条线）</li>\n      <li><b>《月度收益复盘报告》模板</b>——三维诊断表（MPI/ARI/RGI，含恒等式自检）+ 客源结构表 + 渠道贡献表</li>\n      <li><b>《业主一页纸》模板</b>——五段结构填空版，严格一页 A4</li>\n      <li><b>《调价台账》表单</b>——15 字段，动作类型/触发表编号/复盘结论三列强制下拉单选，备注栏三段式占位提示</li>\n      <li><b>《命中率自动透视表》</b>——三个分组维度 + 样本量 &lt;20 自动显示「样本不足」</li>\n      <li><b>《限制条件存量清单》自动导出配置</b>——每周一自动生成，高亮「7 天内到期」与「已过期仍生效」</li>\n      <li><b>台账默写卷</b>——15 字段当堂默写，错 3 个以上重默</li>\n    </ul>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">→</span>下一模块预告</div>\n    <p>到此为止，你已能独立完成 L1 的全部四步闭环：取数（M02）、查表执行（M03）、报表记录（M04）。但闭环里有一个关键输入你一直在用、却还没学过它<b>是怎么算出来的</b>——预测 OCC 里的那个「预测增量」。<br>\n    M05 需求预测将把这个黑箱打开：Pickup（预订增量）与预订曲线怎么读、去年同期同窗口怎么对齐、剩余需求分析（RW）怎么算、预测偏差怎么修正。届时你会发现，M03 与 M04 里所有动作的准确性，都建立在这一个数字上。</p>\n  </div>\n\n  <\!-- ===== 底部导航 ===== -->\n  <div class=\"p-title\">M03 每日操作流水线</div></a>\n    <a href=\"m05.html\" class=\"p-next\"><div class=\"p-dir\">下一模块 →</div><div class=\"p-title\">M05 需求预测：Pickup 与预订曲线</div></a>\n  </div>\n\n</div>\n"}]}, {"n": 5, "t": "需求预测", "part": "L2 主管", "mod": "模块 M05", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n  <\!-- ===== 页头 ===== -->\n  <div class=\"crumb\">\n    <a href=\"../index.html\">学院首页</a><span>/</span>\n    <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n    L2 模块五\n  </div>\n\n  <div class=\"page-head\">\n    <div class=\"badge-row\">\n      <span class=\"badge badge-l2\">L2 收益管理主管</span>\n      <span class=\"badge\">模块 M05</span>\n      <span class=\"badge\">8 课时 / 720 min</span>\n      <span class=\"badge\">占 L2 认证 25%</span>\n      <span class=\"badge badge-core\">L2 核心模块</span>\n    </div>\n    <h1 class=\"page-title\">需求预测：Pickup 与预订曲线</h1>\n    <p class=\"page-lede\">一句话导语：预测不是算命，是把「去年这个日子发生了什么」＋「今年到今天为止多收了多少」＋「今年这个日子有什么不同」三笔账加在一起。本模块把这套加法做成固定三步，学员只需填数、读结果、查表执行。</p>\n  </div>\n\n  <\!-- ===== 学习目标 ===== -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n    <ul>\n      <li>能<b>说出</b> Pickup（预订增量）、Booking Window（预订窗口）、On-the-books（在手预订）、Remaining Demand / RW（剩余需求）四个概念的定义与计算口径</li>\n      <li>能<b>独立搭建</b>《Pickup 追踪表》（行＝提前天数 60/45/30/21/14/7/3/1/0，列＝目标日期，单元格＝累计在手房晚），并用对角读法、竖读法、横读法三种方式读出结论</li>\n      <li>能<b>背诵并套用</b>《法典》表 I（预订窗口分档监控表，6 档）的监控频率、落后触发阈值与触发动作</li>\n      <li>能<b>独立执行</b>预测三步法（① 去年同期实际 ② 加 Pickup 增量 ③ 用需求日历／事件／星期几做修正），算出未来 30 天任一目标日的预测房晚与预测 OCC（出租率）</li>\n      <li>能<b>算出</b>预测准确率并判断是否达标，能按偏差分类给出改进动作</li>\n    </ul>\n    <p class=\"card-note\">前置要求：M01 指标语言（OCC／ADR／RevPAR 口径）、M03 每日流水线（表 M）、M04 报表与台账（《调价台账》写法）。本模块是 L2 阶段的第一个模块，也是全部 L2 决策的输入源头。</p>\n  </div>\n\n  <\!-- ===== 目录 ===== -->\n  <div class=\"toc\">\n    <div class=\"toc-title\">本模块目录</div>\n    <ol>\n      <li><a href=\"#s1\">预测的四块基石：Pickup / Booking Window / 在手预订 / 剩余需求</a></li>\n      <li><a href=\"#s2\">《Pickup 追踪表》的搭建</a></li>\n      <li><a href=\"#s3\">《Pickup 追踪表》的三种读法</a></li>\n      <li><a href=\"#s4\">《法典》表 I：预订窗口分档监控表（完整内嵌）</a></li>\n      <li><a href=\"#s5\">《法典》表 A：每日价格调整判定表（本模块配套内嵌）</a></li>\n      <li><a href=\"#s6\">预测三步法与修正系数表</a></li>\n      <li><a href=\"#s7\">三个完整预测演算案例</a></li>\n      <li><a href=\"#s8\">预测偏差复盘：准确率、合格线与改进</a></li>\n      <li><a href=\"#s9\">讲师示范：完整走一遍四步闭环</a></li>\n      <li><a href=\"#s10\">学员跟练（7 题）</a></li>\n      <li><a href=\"#s11\">判定表默写清单</a></li>\n      <li><a href=\"#s12\">随堂测（5 题）</a></li>\n      <li><a href=\"#s13\">本模块产出物</a></li>\n    </ol>\n  </div>\n\n  <\!-- ================= 一 ================= -->\n  <h2 id=\"s1\">一、预测的四块基石：Pickup / Booking Window / 在手预订 / 剩余需求</h2>\n\n  <p>收益管理所有决策的第一句是「这个日子会卖多少」。这句话必须由数字回答，不能由感觉回答。要回答它，只需要四个概念。四个概念全部来自《SPEC》3.1 术语表，全学院唯一口径，不得另创。</p>\n\n  "}, {"id": "p1", "name": "1 Pickup（预订增量）", "min": 8, "desc": "", "html": "<h3>1.1 Pickup（预订增量）</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">定义</span>\n    Pickup = 某目标日在某一时间段内新增的预订房晚数<br>\n    区间 Pickup（本表口径） = 期末在手房晚 − 期初在手房晚<br>\n    <span class=\"f-out\">正值 = 净新增；负值 = 取消多于新增</span>\n  </div>\n\n  <p>举例：10 月 20 日这天，昨天 08:00 在手 92 房晚，今天 08:00 在手 96 房晚，则今日区间 Pickup = 96 − 92 = <b>+4 房晚</b>。若今天在手 88 房晚，则 Pickup = 88 − 92 = <span class=\"down\">−4 房晚</span>，说明今天净取消 4 间。</p>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">口径红线</span>\n    <p>Pickup 必须用<b>同一取数时点</b>对比。今天 17:00 的手数不能减昨天 08:00 的手数——下午本来就会多收订单，减出来的\"Pickup\"是假的。《法典》表 M 规定取数时点为 07:50（未来 30 天在手 + Pickup）与 17:00（0–3 天窗口二次巡检），同口径对比才能用。</p>\n  </div>\n\n  <h3>1.2 Booking Window（预订窗口）</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">定义</span>\n    Booking Window = 入住日 − 预订日（天数）<br>\n    例：今天 2026-09-20，目标入住日 2026-10-20 → 预订窗口 = <span class=\"f-out\">30 天</span>\n  </div>\n\n  <p>预订窗口不是\"一个数\"，而是一条<b>分档的监控节奏</b>。窗口越近，监控越密；窗口越远，监控越松。《法典》表 I 把 0 天到 60 天以上切成 6 档，每档规定了监控频率、关注指标、落后触发阈值和触发动作。这是本模块最重要的一张表，第四节完整内嵌。</p>\n\n  <h3>1.3 On-the-books（在手预订，OTB）</h3>\n\n  <p>在手预订 = 截至取数时点，某目标日已经确认、未取消的累计预订房晚数。它是<b>已经落袋的事实</b>，不是预测。预测要算的，是\"从今天到那天，还会再来多少\"。</p>\n\n  <h3>1.4 Remaining Demand（剩余需求，RW）</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">定义</span>\n    RW（剩余需求） = 预测总需求 − 在手预订<br>\n    例：预测 10/20 总需求 250 房晚，当前在手 96 房晚 → <span class=\"f-out\">RW = 154 房晚</span>\n  </div>\n\n  <p>RW 是给销售部和渠道部的<b>任务量</b>。没有 RW，销售部不知道该打多少电话；有了 RW，还可以把它摊到剩余天数上，算出每天必须完成的日均进度。</p>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">派生公式</span>\n    日均必需进度 = RW ÷ 剩余天数<br>\n    例：RW 154 房晚 ÷ 30 天 → <span class=\"f-out\">日均 5.1 房晚／天</span>\n  </div>\n\n  "}, {"id": "p2", "name": "5 四者的关系（一张图记牢）", "min": 8, "desc": "", "html": "<h3>1.5 四者的关系（一张图记牢）</h3>\n\n  <div class=\"flow\">\n    <div class=\"flow-item\"><div class=\"fi-t\">在手预订 OTB</div><div class=\"fi-d\">已发生的事实<br>例：96 房晚</div></div>\n    <div class=\"flow-arrow\">＋</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">剩余需求 RW</div><div class=\"fi-d\">还没来的部分<br>例：154 房晚</div></div>\n    <div class=\"flow-arrow\">＝</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">预测总需求</div><div class=\"fi-d\">本模块的输出<br>例：250 房晚</div></div>\n    <div class=\"flow-arrow\">÷</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">可售房晚</div><div class=\"fi-d\">云璟 320 间<br>（剔除 OOO 房）</div></div>\n    <div class=\"flow-arrow\">＝</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">预测 OCC</div><div class=\"fi-d\">查表 A 的行<br>例：78.1%</div></div>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">要点</span>\n    <p>预测 OCC = 预测总需求 ÷ 可售房晚。杭州滨江云璟酒店总房量 <b>320 间</b>，平峰日无装修房时可售房晚 = 320。只要有 OOO（维修房），分母必须同步下调——分母错了，后面全错。</p>\n  </div>\n\n  <\!-- ================= 二 ================= -->\n  <h2 id=\"s2\">二、《Pickup 追踪表》的搭建</h2>\n\n  <p>《Pickup 追踪表》是 L2 收益管理主管的第一件武器。它把\"未来每一天\"和\"距离那一天还有多久\"交叉成一张网格，网格里填的是累计在手房晚。建表只需四步。</p>\n\n  "}, {"id": "p3", "name": "1 建表四步", "min": 8, "desc": "", "html": "<h3>2.1 建表四步</h3>\n\n  <div class=\"step\">\n    <div class=\"step-num\">1</div>\n    <div class=\"step-body\">\n      <h4>定行：9 个提前天数档</h4>\n      <p>行＝提前天数，固定 9 行，自上而下为 <code>60 / 45 / 30 / 21 / 14 / 7 / 3 / 1 / 0</code>。这 9 档不是随意选的：0–3 天是最后一刻战场，7 天是闪购启动线，14 天是调价线，30 天是月度策略线，60 天是长线团队线。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">2</div>\n    <div class=\"step-body\">\n      <h4>定列：目标日期</h4>\n      <p>列＝目标入住日期，自左向右按日期升序排列。日常作业覆盖\"今天 + 未来 60 天\"，即 61 列。教学与周度汇报用精简版，只保留与 9 个提前天数档对应的 9 个代表日。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">3</div>\n    <div class=\"step-body\">\n      <h4>填数：累计在手房晚</h4>\n      <p>单元格＝<b>该目标日在该提前天数时点上的累计在手房晚</b>。不是当日新增，是累计。每天 07:50 取数后，在今天所处的那一条对角线上填一次（见第三节）。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">4</div>\n    <div class=\"step-body\">\n      <h4>建第二张表：去年同期同结构表</h4>\n      <p>用完全相同的数据结构，把<b>去年同一目标日、同一提前天数</b>的在手房晚填一遍。没有这张表，就算不出《法典》表 A 要的 Pickup 偏差，后面全部决策停摆。</p>\n    </div>\n  </div>\n\n  "}, {"id": "p4", "name": "2 表样：云璟酒店 2026-09-20 取数快照", "min": 8, "desc": "", "html": "<h3>2.2 表样：云璟酒店 2026-09-20 取数快照</h3>\n\n  <p>下表为杭州滨江云璟酒店《Pickup 追踪表》精简版。取数日 2026-09-20（周日），酒店可售房晚 320。单元格数字＝累计在手房晚；<b>加粗金底单元格＝今天的取数对角线</b>；<code>—</code> 表示该快照尚未发生（未来的取数时点，格子留空）。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-1　《Pickup 追踪表》（精简版 · 累计在手房晚）<span class=\"cap-note\">行＝提前天数，列＝目标入住日期；取数日 2026-09-20；加粗金底＝当日取数对角线；— ＝尚未发生的快照</span></caption>\n      <thead>\n        <tr>\n          <th>提前天数 ＼ 目标日</th>\n          <th class=\"num\">09-20<br>周日</th>\n          <th class=\"num\">09-21<br>周一</th>\n          <th class=\"num\">09-23<br>周三</th>\n          <th class=\"num\">09-27<br>周日</th>\n          <th class=\"num\">10-04<br>周日</th>\n          <th class=\"num\">10-11<br>周日</th>\n          <th class=\"num\">10-20<br>周二</th>\n          <th class=\"num\">11-04<br>周三</th>\n          <th class=\"num\">11-19<br>周四</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr><th class=\"rowh\">提前 60 天</th><td class=\"num\">29</td><td class=\"num\">28</td><td class=\"num\">27</td><td class=\"num\">28</td><td class=\"num\">29</td><td class=\"num\">29</td><td class=\"num\">28</td><td class=\"num\">25</td><td class=\"num\" data-hit>24</td></tr>\n        <tr><th class=\"rowh\">提前 45 天</th><td class=\"num\">48</td><td class=\"num\">47</td><td class=\"num\">46</td><td class=\"num\">47</td><td class=\"num\">49</td><td class=\"num\">48</td><td class=\"num\">46</td><td class=\"num\" data-hit>42</td><td class=\"num\">—</td></tr>\n        <tr><th class=\"rowh\">提前 30 天</th><td class=\"num\">82</td><td class=\"num\">80</td><td class=\"num\">78</td><td class=\"num\">80</td><td class=\"num\">83</td><td class=\"num\">82</td><td class=\"num\" data-hit>96</td><td class=\"num\">—</td><td class=\"num\">—</td></tr>\n        <tr><th class=\"rowh\">提前 21 天</th><td class=\"num\">110</td><td class=\"num\">108</td><td class=\"num\">105</td><td class=\"num\">109</td><td class=\"num\">112</td><td class=\"num\" data-hit>110</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td></tr>\n        <tr><th class=\"rowh\">提前 14 天</th><td class=\"num\">139</td><td class=\"num\">136</td><td class=\"num\">132</td><td class=\"num\">137</td><td class=\"num\" data-hit>142</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td></tr>\n        <tr><th class=\"rowh\">提前 7 天</th><td class=\"num\">175</td><td class=\"num\">172</td><td class=\"num\">166</td><td class=\"num\" data-hit>172</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td></tr>\n        <tr><th class=\"rowh\">提前 3 天</th><td class=\"num\">206</td><td class=\"num\">202</td><td class=\"num\" data-hit>196</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td></tr>\n        <tr><th class=\"rowh\">提前 1 天</th><td class=\"num\">226</td><td class=\"num\" data-hit>221</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td></tr>\n        <tr><th class=\"rowh\">当天（0 天）</th><td class=\"num\" data-hit>240</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">为什么是\"阶梯对角线\"而不是直线</span>\n    <p>因为行距是不等距的（60→45 差 15 天，7→3 差 4 天，3→1 差 2 天）。今天的取数对角线满足唯一条件：<b>目标日期 − 今天 = 该行的提前天数</b>。顺着这个条件找格子，就得到上面 9 个金底单元格。不要凭\"看起来像对角线\"去数格子。</p>\n  </div>\n\n  "}, {"id": "p5", "name": "3 同期对比表与差值表", "min": 8, "desc": "", "html": "<h3>2.3 同期对比表与差值表</h3>\n\n  <p>把去年同期同结构表叠上来，做同位置相减，得到《Pickup 差值表》。这张表直接产出《法典》表 A 要的 Pickup 偏差。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-2　《Pickup 差值表》（今年在手 − 去年同期在手）<span class=\"cap-note\">取数日 2026-09-20；仅列今天所处的对角线，即\"当前各目标日的领先／落后幅度\"</span></caption>\n      <thead>\n        <tr><th>目标日</th><th class=\"num\">提前天数</th><th class=\"num\">今年在手</th><th class=\"num\">去年同期在手</th><th class=\"num\">差值</th><th class=\"num\">Pickup 偏差</th><th>表 A 列定位</th></tr>\n      </thead>\n      <tbody>\n        <tr><td>2026-09-20</td><td class=\"num\">0</td><td class=\"num\">240</td><td class=\"num\">235</td><td class=\"num\">+5</td><td class=\"num\">+2.1%</td><td>持平 ±3%</td>
