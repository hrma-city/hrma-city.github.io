</div><script>
var BOOK=[{"n": 1, "t": "指标与计算", "part": "L1 执行专员", "mod": "模块 M01", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n  <\!-- ===== 页头 ===== -->\n  <div class=\"crumb\">\n    <a href=\"../index.html\">学院首页</a><span>/</span>\n    <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n    L1 模块一\n  </div>\n\n  <div class=\"page-head\">\n    <div class=\"badge-row\">\n      <span class=\"badge badge-l1\">L1 收益执行专员</span>\n      <span class=\"badge\">模块 M01</span>\n      <span class=\"badge\">2 课时 / 180 min</span>\n      <span class=\"badge\">课时占比 2/12</span>\n    </div>\n    <h1 class=\"page-title\">收益管理的语言：指标与计算</h1>\n    <p class=\"page-lede\">一句话导语：指标的口径错一个字，后面查表得出的动作就全错——本模块把 10 个核心指标的定义、公式和口径陷阱一次钉死，让你算出来的每一个数都能写进台账。</p>\n  </div>\n\n  <\!-- ===== 学习目标 ===== -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n    <ul>\n      <li>能<b>说出</b> OCC、ADR、RevPAR、TrevPAR、GOPPAR、MPI、ARI、RGI、NRevPAR、Pickup 共 10 个指标的中文名、英文全称、公式与单位</li>\n      <li>能<b>背出</b> 4 条口径铁律：OCC 分母是「可售」房晚、ADR 分母是「付费」房晚、RevPAR 分母是「可售」房晚、MPI×ARI÷100 = RGI</li>\n      <li>能<b>算出</b> 给定房量、房晚、收入、竞对数据下的全部核心指标（手算或计算器，保留一位小数）</li>\n      <li>能<b>指出</b> 5 个最常见的指标算错场景并给出正确算法</li>\n      <li>能<b>独立执行</b> 一次「指标体检」：看到异常指标，列出 3–5 个成因并说出下一步查什么、查哪张表</li>\n    </ul>\n    <p class=\"card-note\">前置要求：无。本模块为零基础起点。<br>本模块对应《收益管理操作法典》的内容：无独立判定表，但表 C（ARI）、表 D（MPI）、表 A（Pickup 偏差）全部以本模块公式为输入。</p>\n  </div>\n\n  <\!-- ===== 目录 ===== -->\n  <div class=\"toc\">\n    <div class=\"toc-title\">本模块目录</div>\n    <ol>\n      <li><a href=\"#s1\">为什么先学指标：看数这一步到底在看什么</a></li>\n      <li><a href=\"#s2\">指标家族总览（10 个指标一张表）</a></li>\n      <li><a href=\"#s3\">OCC 出租率：分母必须是「可售」房晚</a></li>\n      <li><a href=\"#s4\">ADR 平均房价：分子含什么、分母含什么</a></li>\n      <li><a href=\"#s5\">RevPAR 每间可售房收入：收益管理第一指标</a></li>\n      <li><a href=\"#s6\">TrevPAR 与 GOPPAR：全服务酒店必须同时看</a></li>\n      <li><a href=\"#s7\">MPI / ARI / RGI：三个竞争指数与恒等式</a></li>\n      <li><a href=\"#s8\">NRevPAR 与 Pickup：净收益与增量</a></li>\n      <li><a href=\"#s9\">口径陷阱总表（5 个高频算错场景）</a></li>\n      <li><a href=\"#s10\">指标体检表：异常 → 成因 → 下一步</a></li>\n      <li><a href=\"#demo\">讲师示范：某日全指标完整计算</a></li>\n      <li><a href=\"#drill\">学员跟练：10 道计算练习</a></li>\n      <li><a href=\"#recite\">口径速记清单（当堂默写）</a></li>\n      <li><a href=\"#quiz\">随堂测（5 题）</a></li>\n      <li><a href=\"#out\">本模块产出物</a></li>\n    </ol>\n  </div>\n\n  <\!-- ===== 正文 ===== -->\n  "}, {"id": "p1", "name": "一、为什么先学指标：看数这一步到底在看什么", "min": 8, "desc": "", "html": "<h2 id=\"s1\">一、为什么先学指标：看数这一步到底在看什么</h2>\n\n  <p>本学院的核心动作是四步闭环：<strong>看数 → 查表 → 执行 → 记录</strong>。在这四步里，「看数」是第一步，也是唯一一步错了会导致后面三步全部白做的环节。</p>\n\n  <p>《收益管理操作法典》表 A（每日价格调整判定表）需要两个输入：目标日预测 OCC，以及 Pickup 偏差。这两个数字只要算错一个百分点，查表读出的动作就会从「维持」跳到「<span class=\"up\">↑10%</span>」或者从「<span class=\"down\">↓5%</span>」跳到「<span class=\"down\">↓10%</span>」。所以本模块不是理论课，是<strong>防错课</strong>。</p>\n\n  <div class=\"flow\">\n    <div class=\"flow-item\"><div class=\"fi-t\">看数</div><div class=\"fi-d\">按取数清单抓固定字段（M02 详讲）</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">查表</div><div class=\"fi-d\">数字代入《法典》判定表，读出唯一动作</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">执行</div><div class=\"fi-d\">按系统操作路径落位（M03 详讲）</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">记录</div><div class=\"fi-d\">写入《调价台账》，形成可追溯档案（M04 详讲）</div></div>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">本模块的统一计算约定（全学院适用）</span>\n    <p>1. 百分比一律保留一位小数（OCC 75.0%、MPI 107.1）。<br>\n    2. 金额单位为元，保留一位小数（¥663.4）。<br>\n    3. 房晚数一律<b>向下取整</b>取整数（超售间数 9.6 间 → 9 间）。<br>\n    4. 竞争指数（MPI/ARI/RGI）保留一位小数，不四舍五入到整数。<br>\n    5. 价格调整结果四舍五入到整数元（此为执行口径，非《法典》判定阈值）。</p>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">本页数据来源说明</span>\n    <p>本页所有示例数字均来自本学院统一原型 <strong>杭州滨江云璟酒店</strong>（320 间房，年度实绩：可售房晚 116,800、售出房晚 84,096、OCC 72.0%、ADR ¥618、RevPAR ¥445、客房收入 ¥51,977,328、餐饮收入 ¥28,600,000、其他收入 ¥4,100,000、总营收 ¥84,677,328、GOP ¥27,098,741、GOPPAR ¥232；平峰 BAR ¥680；竞争组合 5 家加权均价 ¥680）。任何举例不得另造酒店。</p>\n  </div>\n\n  "}, {"id": "p2", "name": "二、指标家族总览（10 个指标一张表）", "min": 8, "desc": "", "html": "<h2 id=\"s2\">二、指标家族总览（10 个指标一张表）</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 1-1　核心指标总览<span class=\"cap-note\">「单位」列是本模块最容易记混的地方：率是 %，价是 元，PAR 是 元/间夜</span></caption>\n      <thead>\n        <tr><th>缩写</th><th>中文名</th><th>英文全称</th><th>公式</th><th>单位</th><th>谁看</th></tr>\n      </thead>\n      <tbody>\n        <tr><td><b>OCC</b></td><td>出租率</td><td>Occupancy</td><td>已售房晚 ÷ 可售房晚 × 100%</td><td>%</td><td>全员</td></tr>\n        <tr><td><b>ADR</b></td><td>平均房价</td><td>Average Daily Rate</td><td>客房收入 ÷ 已售房晚</td><td>元</td><td>前厅/销售</td></tr>\n        <tr><td><b>RevPAR</b></td><td>每间可售房收入</td><td>Revenue Per Available Room</td><td>客房收入 ÷ 可售房晚 = OCC × ADR</td><td>元</td><td>收益经理</td></tr>\n        <tr><td><b>TrevPAR</b></td><td>每间可售房总营收</td><td>Total Revenue Per Available Room</td><td>总营收 ÷ 可售房晚</td><td>元</td><td>总经理</td></tr>\n        <tr><td><b>GOPPAR</b></td><td>每间可售房毛利润</td><td>Gross Operating Profit Per Available Room</td><td>GOP ÷ 可售房晚</td><td>元</td><td>业主/总经理</td></tr>\n        <tr><td><b>MPI</b></td><td>市场渗透指数</td><td>Market Penetration Index</td><td>本店 OCC ÷ 竞争组合 OCC × 100</td><td>指数</td><td>收益经理</td></tr>\n        <tr><td><b>ARI</b></td><td>平均房价指数</td><td>Average Rate Index</td><td>本店 ADR ÷ 竞争组合 ADR × 100</td><td>指数</td><td>收益经理</td></tr>\n        <tr><td><b>RGI</b></td><td>收入生成指数</td><td>Revenue Generation Index</td><td>本店 RevPAR ÷ 竞争组合 RevPAR × 100</td><td>指数</td><td>总经理/业主</td></tr>\n        <tr><td><b>NRevPAR</b></td><td>净 RevPAR</td><td>Net RevPAR</td><td>RevPAR ×（1 − 渠道综合成本率）</td><td>元</td><td>收益/财务</td></tr>\n        <tr><td><b>Pickup</b></td><td>预订增量</td><td>Pickup</td><td>某目标日在某时间段内新增的预订房晚数</td><td>间夜</td><td>收益专员</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">记忆锚点：三个「PAR」的层级</span>\n    <p>RevPAR 只看<strong>客房</strong>，TrevPAR 看<strong>全店营收</strong>，GOPPAR 看<strong>利润</strong>。三者分母完全相同（都是可售房晚），只有分子在变大。云璟酒店是全服务酒店（中餐厅 180 座、全日制餐厅 220 座、扒房 60 座、1,200㎡ 宴会厅），餐饮收入 ¥28,600,000 占到总营收的 33.8%，只看 RevPAR 会严重低估一次会议团队的真实价值——这就是为什么必须同时看 TrevPAR 和 GOPPAR。</p>\n  </div>\n\n  "}, {"id": "p3", "name": "三、OCC 出租率：分母必须是「可售」房晚", "min": 8, "desc": "", "html": "<h2 id=\"s3\">三、OCC 出租率：分母必须是「可售」房晚</h2>\n\n  <h3>3.1 定义与公式</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">公式</span>\n    OCC = 已售房晚 ÷ 可售房晚 × 100%<br>\n    可售房晚 = 总房量 − OOO 房晚（维修 / 装修 / 不可用）\n  </div>\n\n  <p><strong>口径铁律 1：分母是「可售」房晚，不是总房晚。</strong>云璟酒店总房量 320 间，若某日有 8 间处于 OOO（Out of Order，维修房）状态，当日可售房晚就是 312，不是 320。</p>\n\n  <h3>3.2 用云璟真实数字手算</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">示例 · 平峰日（无 OOO）</span>\n    可售房晚 = 320（总房量 320，当日 OOO 0 间）<br>\n    已售房晚 = 240<br>\n    OCC = 240 ÷ 320 × 100% → <span class=\"f-out\">75.0%</span>\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">示例 · 有 8 间 OOO 的同一天</span>\n    可售房晚 = 320 − 8 = 312<br>\n    已售房晚 = 234<br>\n    正确：OCC = 234 ÷ 312 × 100% → <span class=\"f-out\">75.0%</span><br>\n    错误：OCC = 234 ÷ 320 × 100% → 73.1%（分母用错，低估 1.9 个百分点）\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">为什么 1.9 个百分点很致命</span>\n    <p>《法典》表 A 的行边界是 70%、85%、95%。若真实 OCC 是 85.0%（落在「85–95%」行），用错分母算成 83.1% 就会落到「70–85%」行。同样一个 Pickup 偏差「领先 3–10%」，前者读出 <span class=\"up\">↑10%</span>，后者读出 <span class=\"up\">↑5%</span>。<strong>一次分母错误，等于把该赚的钱少赚一半。</strong></p>\n  </div>\n\n  <h3>3.3 分子的三种边缘情况</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 1-2　OCC 分子处理规则<span class=\"cap-note\">判断依据：这间房当晚有没有被占掉、还能不能再卖</span></caption>\n      <thead><tr><th>房晚类型</th><th>计入 OCC 分子（已售房晚）</th><th>理由</th></tr></thead>\n      <tbody>\n        <tr><td>正常付费售出</td><td><span class=\"pill pill-teal\">计入</span></td><td>既占房又有收入</td></tr>\n        <tr><td>免费房 Comp</td><td><span class=\"pill pill-teal\">计入</span></td><td>房间被占掉，不能再卖</td></tr>\n        <tr><td>自用房 House Use</td><td><span class=\"pill pill-teal\">计入</span></td><td>房间被占掉，不能再卖</td></tr>\n        <tr><td>OOO 维修 / 装修房</td><td><span class=\"pill pill-red\">不计入，且从分母剔除</span></td><td>物理上不可售</td></tr>\n        <tr><td>当日空置房</td><td><span class=\"pill\">不计入，分母保留</span></td><td>这是 OCC 没做上去的部分</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  "}, {"id": "p4", "name": "四、ADR 平均房价：分子含什么、分母含什么", "min": 8, "desc": "", "html": "<h2 id=\"s4\">四、ADR 平均房价：分子含什么、分母含什么</h2>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">公式</span>\n    ADR = 客房收入 ÷ 已售房晚<br>\n    · 分子「客房收入」：<b>含服务费，不含增值税</b><br>\n    · 分母「已售房晚」：本学院统一采用<b>付费房晚</b>口径（详见下方口径说明）\n  </div>\n\n  <h3>4.1 关于免费房与自用房：必须选一个口径并全学院统一</h3>\n\n  <p>《SPEC》对 ADR 的表述是「不含免费房与自用房……仅当政策明确时」。这句话的意思是：<strong>两种口径都存在，必须由本店政策明确选定，且一旦选定就不能今天一个算法明天一个算法。</strong></p>\n\n  <div class=\"callout callout-gold\">\n    <span class=\"co-t\">本学院统一口径（政策已明确，全学院执行）</span>\n    <p>免费房（Comp）与自用房（House Use）：<b>计入已售房晚（进 OCC 分子），但不计入 ADR 分母</b>。<br>\n    即：ADR 只统计<strong>付费房晚</strong>。同时在日报中单列「Comp 房晚」「House Use 房晚」两行，并同时披露含 Comp 口径的对照 ADR，便于与集团口径对齐。</p>\n  </div>\n\n  <h3>4.2 用云璟真实数字手算两种口径</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">示例 · 免费房混入的影响</span>\n    可售房晚 = 320　已售房晚 = 240（其中免费房 8 间，收入 ¥0）→ 付费房晚 = 232<br>\n    客房收入 = ¥162,400（含服务费，不含增值税）<br>\n    <br>\n    口径 A（本学院采用 · 付费房晚）：ADR = 162,400 ÷ 232 → <span class=\"f-out\">¥700.0</span><br>\n    口径 B（含免费房）：ADR = 162,400 ÷ 240 → <span class=\"f-out\">¥676.7</span><br>\n    两种口径差额 = 700.0 − 676.7 → <span class=\"f-out\">¥23.3（3.4%）</span>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">这里有一个必须想通的点</span>\n    <p>换 ADR 口径<b>完全不影响 RevPAR</b>。因为 RevPAR = 客房收入 ÷ 可售房晚，客房收入还是 ¥162,400，可售房晚还是 320，RevPAR = ¥507.5，与用哪种 ADR 口径无关。<br>\n    换句话说：<b>ADR 口径之争只影响 ADR 和 ARI，不影响 RevPAR 和 RGI。</b>凡是涉及收入与份额的结论，都可以放心用 RevPAR/RGI；凡是涉及价格定位的结论（走《法典》表 C），必须先确认 ADR 口径与竞对采集口径一致。</p>\n  </div>\n\n  <h3>4.3 ADR 的第二个陷阱：不能对各房型价格做简单平均</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">错误算法 vs 正确算法</span>\n    当日 STD-K（标准大床房）售出 70 间 @ ¥580　→ 收入 ¥40,600<br>\n    当日 SUP-K（高级大床房）售出 60 间 @ ¥680　→ 收入 ¥40,800<br>\n    <br>\n    正确（加权）：ADR = (40,600 + 40,800) ÷ (70 + 60) = 81,400 ÷ 130 → <span class=\"f-out\">¥626.2</span><br>\n    错误（简单平均）：ADR = (580 + 680) ÷ 2 → <span class=\"f-out\">¥630.0</span>（虚高 ¥3.8）\n  </div>\n\n  <p>原因很简单：STD-K 卖得多（70 间 &gt; 60 间），低价房权重更大，加权结果必然低于简单平均。<strong>只要各房型销量不同，简单平均就一定是错的。</strong></p>\n\n  "}, {"id": "p5", "name": "五、RevPAR 每间可售房收入：收益管理第一指标", "min": 8, "desc": "", "html": "<h2 id=\"s5\">五、RevPAR 每间可售房收入：收益管理第一指标</h2>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">公式（两种算法等价，必须都会）</span>\n    算法一（收入法）：RevPAR = 客房收入 ÷ 可售房晚<br>\n    算法二（乘法式）：RevPAR = OCC × ADR<br>\n    <br>\n    云璟平峰日示例：客房收入 ¥163,200，可售房晚 320，已售 240<br>\n    算法一：163,200 ÷ 320 → <span class=\"f-out\">¥510.0</span><br>\n    算法二：75.0% × ¥680 → <span class=\"f-out\">¥510.0</span>　✓ 两式相等\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">为什么 RevPAR 是第一指标</span>\n    <p>因为它同时惩罚两种错误：<br>\n    · <b>只追 OCC 不追价</b>：OCC 100%、ADR ¥400 → RevPAR ¥400。<br>\n    · <b>只追 ADR 不追量</b>：OCC 40%、ADR ¥1,000 → RevPAR ¥400。<br>\n    · <b>两个都做好</b>：OCC 75%、ADR ¥680 → RevPAR ¥510。<br>\n    云璟酒店年度实绩 OCC 72.0%、ADR ¥618，RevPAR = 72.0% × ¥618 = ¥445.0（与《SPEC》年 RevPAR ¥445 一致）。这就是本店要超越的基线。</p>\n  </div>\n\n  <h3>5.1 用 RevPAR 反推需要的 ADR（查表前最常用的反向计算）</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">反推公式</span>\n    所需 ADR = 目标 RevPAR ÷ 预测 OCC<br>\n    <br>\n    示例：10 月目标 OCC 85%（《SPEC》月度基准表 10 月 OCC 85%），目标 RevPAR ¥560<br>\n    所需 ADR = 560 ÷ 85.0% → <span class=\"f-out\">¥658.8</span><br>\n    对照 10 月 ADR 基准 ¥700 → 当前 ¥658.8 <span class=\"down\">↓5.9%</span>，说明价格还没拉到位\n  </div>\n\n  "}, {"id": "p6", "name": "六、TrevPAR 与 GOPPAR：全服务酒店必须同时", "min": 8, "desc": "", "html": "<h2 id=\"s6\">六、TrevPAR 与 GOPPAR：全服务酒店必须同时看</h2>\n\n  <h3>6.1 TrevPAR（每间可售房总营收）</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">公式</span>\n    TrevPAR = 总营收 ÷ 可售房晚<br>\n    总营收 = 客房收入 + 餐饮收入 + 其他收入\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">示例 · 云璟某日（含一场中型会议）</span>\n    客房收入 ¥163,200　餐饮收入 ¥78,000　其他收入 ¥8,400<br>\n    总营收 = 163,200 + 78,000 + 8,400 = ¥249,600<br>\n    可售房晚 = 320<br>\n    TrevPAR = 249,600 ÷ 320 → <span class=\"f-out\">¥780.0</span><br>\n    <br>\n    对照：当日 RevPAR = 163,200 ÷ 320 = ¥510.0<br>\n    非客房收入对每间房的贡献 = 780.0 − 510.0 → <span class=\"f-out\">¥270.0</span>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 1-3　云璟年度 TrevPAR 分解<span class=\"cap-note\">数据来源：《SPEC》2.3 经营基线，可售房晚 116,800</span></caption>\n      <thead><tr><th>项目</th><th class=\"num\">年度金额（元）</th><th class=\"num\">每间可售房（元）</th><th class=\"num\">占总营收</th></tr></thead>\n      <tbody>\n        <tr><td>客房收入</td><td class=\"num\">51,977,328</td><td class=\"num\">445.0</td><td class=\"num\">61.4%</td></tr>\n        <tr><td>餐饮收入</td><td class=\"num\">28,600,000</td><td class=\"num\">244.9</td><td class=\"num\">33.8%</td></tr>\n        <tr><td>其他收入</td><td class=\"num\">4,100,000</td><td class=\"num\">35.1</td><td class=\"num\">4.8%</td></tr>\n        <tr><td><b>总营收</b></td><td class=\"num\"><b>84,677,328</b></td><td class=\"num\"><b>725.0</b></td><td class=\"num\">100.0%</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <p>结论：<strong>云璟酒店的 TrevPAR（¥725.0）比 RevPAR（¥445.0）高出 63%</strong>。这意味着在计算团队是否该接时（《法典》表 G、表 K），只看客房价格一定会误杀高价值会议团队——这正是表 K「会议／宴会综合收益联动表」要求先算综合贡献的原因。</p>\n\n  <h3>6.2 GOPPAR（每间可售房毛利润）</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">公式</span>\n    GOPPAR = GOP ÷ 可售房晚<br>\n    GOP 率 = GOP ÷ 总营收 × 100%\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">示例 · 云璟某日</span>\n    GOP = ¥87,360　总营收 = ¥249,600　可售房晚 = 320<br>\n    GOPPAR = 87,360 ÷ 320 → <span class=\"f-out\">¥273.0</span><br>\n    GOP 率 = 87,360 ÷ 249,600 × 100% → <span class=\"f-out\">35.0%</span><br>\n    <br>\n    对照年度基线：GOPPAR ¥232、GOP 率 32.0% → 当日 <span class=\"up\">↑17.7%</span> / <span class=\"up\">↑3.0pp</span>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">GOPPAR 才是最终考核指标</span>\n    <p>一个典型反例：为了把 OCC 从 60% 拉到 80%，把 ADR 从 ¥620 降到 ¥450。<br>\n    RevPAR = 80% × ¥450 = ¥360，比原来的 60% × ¥620 = ¥372 还低 <span class=\"down\">↓3.2%</span>。<br>\n    更糟的是：多卖 20% 的房间会带来额外的布草洗涤、易耗品、早餐、人力成本，GOPPAR 的降幅会远大于 RevPAR 的降幅。<br>\n    <b>所以：任何以降价换量的动作，必须先看 RevPAR 是否上升，再看 GOPPAR 是否上升。两个都上升，动作才算成立。</b></p>\n  </div>\n\n  "}, {"id": "p7", "name": "七、MPI / ARI / RGI：三个竞争指数与恒等式", "min": 8, "desc": "", "html": "<h2 id=\"s7\">七、MPI / ARI / RGI：三个竞争指数与恒等式</h2>\n\n  <h3>7.1 三个公式</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">公式</span>\n    MPI = 本店 OCC ÷ 竞争组合 OCC × 100　　（&gt;100 表示份额领先）<br>\n    ARI = 本店 ADR ÷ 竞争组合 ADR × 100　　（&gt;100 表示卖得比竞对贵）<br>\n    RGI = 本店 RevPAR ÷ 竞争组合 RevPAR × 100　（综合竞争力）<br>\n    <b>恒等式：RGI = MPI × ARI ÷ 100</b>\n  </div>\n\n  <h3>7.2 恒等式成立的原因（必须理解，不能死记）</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">推导</span>\n    MPI × ARI ÷ 100<br>\n    = (本店OCC ÷ 竞对OCC × 100) × (本店ADR ÷ 竞对ADR × 100) ÷ 100<br>\n    = (本店OCC × 本店ADR) ÷ (竞对OCC × 竞对ADR) × 100<br>\n    = 本店RevPAR ÷ 竞对RevPAR × 100<br>\n    = RGI　■\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">这个恒等式在实战中的两个用法</span>\n    <p><b>用法一（验算）：</b>算出 MPI 和 ARI 后，用乘法求出 RGI，再和直接算出的 RGI 对比。两者不等说明至少有一个原始数据错了——这是最快的自查手段。<br>\n    <b>用法二（拆解）：</b>RGI 低于 100 时，看是 MPI 拖后腿还是 ARI 拖后腿。MPI 低 → 走《法典》表 D（份额问题，查 OTA 曝光/挂牌）；ARI 低 → 走《法典》表 C（价格问题，调价）。两条路完全不同。</p>\n  </div>\n\n  <h3>7.3 用云璟真实数字手算</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">示例 · 竞对数据来自《SPEC》2.4</span>\n    本店：OCC 75.0%　ADR ¥680　→ RevPAR = 75.0% × 680 = ¥510.0<br>\n    竞争组合（5 家加权）：OCC 68.0%　ADR ¥700　→ RevPAR = 68.0% × 700 = ¥476.0<br>\n    <br>\n    MPI = 75.0 ÷ 68.0 × 100 → <span class=\"f-out\">110.3</span>（份额领先，走表 D「&gt;110 份额领先」）<br>\n    ARI = 680 ÷ 700 × 100 → <span class=\"f-out\">97.1</span>（略低，走表 C「90–97 略低」）<br>\n    RGI 直接算 = 510.0 ÷ 476.0 × 100 → <span class=\"f-out\">107.1</span><br>\n    RGI 乘法验算 = 110.3 × 97.1 ÷ 100 → <span class=\"f-out\">107.1</span>　✓ 恒等式成立\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">读出来的结论（这就是「查表」的输入）</span>\n    <p>MPI 110.3 → 查《法典》表 D：落在「&gt;110 份额领先」→ 动作「优先提价（走表 C 提价分支）」。<br>\n    ARI 97.1 → 查《法典》表 C：落在「90–97 略低」→ 判定「预测 OCC≥80% → 提 3%；否则维持」。本例预测 OCC 75.0% &lt; 80% → <b>维持</b>。<br>\n    两个结论合并：份额已经领先，但价格还没跟上；当前不动价，等预测 OCC 跨过 80% 再按表 C 提 3%。<br>\n    <b>注意：表 A 优先级高于表 C（《法典》表 O），同日若表 A 也给出动作，只执行表 A 的结论，表 C 结论写入《观察清单》。</b></p>\n  </div>\n\n  <h2 id=\"s8\">八、NRevPAR 与 Pickup：净收益与增量</h2>\n\n  <h3>8.1 NRevPAR（净 RevPAR）</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">公式</span>\n    NRevPAR = RevPAR ×（1 − 渠道综合成本率）<br>\n    渠道综合成本率 = Σ(某渠道房晚 × 该渠道成本率) ÷ 总房晚\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">示例 · 云璟某日 240 间已售房晚的渠道结构</span>\n    DIR 直销 72 间 × 3% = 216<br>\n    LOY 会员 24 间 × 4% = 96<br>\n    CORP 协议 48 间 × 8% = 384<br>\n    OTA 国内 72 间 × 16% = 1,152<br>\n    GDS/TMC 24 间 × 13% = 312<br>\n    合计 240 间 → 加权成本点数和 = 2,160<br>\n    <br>\n    渠道综合成本率 = 2,160 ÷ 240 → <span class=\"f-out\">9.0%</span><br>\n    NRevPAR = 510.0 × (1 − 9.0%) = 510.0 × 0.91 → <span class=\"f-out\">¥464.1</span>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 1-4　云璟渠道成本率速查<span class=\"cap-note\">数据来源：《SPEC》2.3 渠道成本表。算 NRevPAR 时直接取用，不要另设数值</span></caption>\n      <thead><tr><th>渠道</th><th>代码</th><th class=\"num\">综合成本率</th><th>典型来源</th></tr></thead>\n      <tbody>\n        <tr><td>直销（官网/小程序/前台）</td><td>DIR</td><td class=\"num\">3%</td><td>支付手续费 + 系统费</td></tr>\n        <tr><td>协议公司（含返佣/账期）</td><td>CORP</td><td class=\"num\">8%</td><td>返佣 + 账期成本</td></tr>\n        <tr><td>会员直订</td><td>LOY</td><td class=\"num\">4%</td><td>积分成本</td></tr>\n        <tr><td>OTA 国内（携程/美团/飞猪）</td><td>OTA</td><td class=\"num\">16%</td><td>佣金</td></tr>\n        <tr><td>OTA 国际（Booking/Agoda）</td><td>OTA-I</td><td class=\"num\">18%</td><td>佣金</td></tr>\n        <tr><td>GDS / 商旅 TMC</td><td>GDS</td><td class=\"num\">13%</td><td>结算费率</td></tr>\n        <tr><td>批发商 / 包房商</td><td>WHO</td><td class=\"num\">26%</td><td>净价差</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">NRevPAR 的唯一实战用途：比较两个「RevPAR 相同」的方案</span>\n    <p>方案甲：RevPAR ¥510，全部来自直销（成本率 3%）→ NRevPAR = ¥494.7。<br>\n    方案乙：RevPAR ¥510，全部来自 OTA 国内（成本率 16%）→ NRevPAR = ¥428.4。<br>\n    两者 RevPAR 完全相同，NRevPAR 相差 <span class=\"down\">¥66.3</span>。<br>\n    <b>触发规则：当两个方案 RevPAR 差值 ≤ 3% 时，一律选 NRevPAR 更高的那个。</b>《法典》表 H 在高 OCC 时关闭 OTA、只留直销与会员，本质就是这条规则。</p>\n  </div>\n\n  <h3>8.2 Pickup（预订增量）与 Pickup 偏差</h3>\n\n  <p>Pickup 是《法典》表 A 的第二个输入，也是本模块唯一一个「不是比率」的指标。必须区分两个概念：</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 1-5　Pickup 与 Pickup 偏差的区别<span class=\"cap-note\">表 A 用的是「偏差」，不是绝对增量——这是新手第一大错</span></caption>\n      <thead><tr><th>概念</th><th>定义</th><th>单位</th><th>示例</th><th>用途</th></tr></thead>\n      <tbody>\n        <tr><td><b>Pickup（绝对增量）</b></td><td>某目标日在某时间段内新增的预订房晚数（负值＝取消净额）</td><td>间夜</td><td>昨日新增 38 间夜</td><td>画预订曲线（M05）</td></tr>\n        <tr><td><b>Pickup 偏差</b></td><td>（当前在手房晚 − 去年同期同一提前窗口在手房晚）÷ 去年同期在手房晚 × 100%</td><td>%</td><td>落后 6.0%</td><td><b>查《法典》表 A</b></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">Pickup 偏差公式（《SPEC》表 A 原文定义）</span>\n    Pickup 偏差 =（当前在手房晚 − 去年同期同一提前窗口在手房晚）÷ 去年同期在手房晚 × 100%\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">示例 · 目标日 10 月 15 日，提前窗口 14 天</span>\n    当前在手房晚（10 月 15 日）= 187 间<br>\n    去年同期同一提前窗口在手房晚 = 199 间<br>\n    Pickup 偏差 = (187 − 199) ÷ 199 × 100% = −12 ÷ 199 × 100% → <span class=\"f-out\">落后 6.0%</span>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">三个必须写对的细节</span>\n    <p>1. <b>分母是「去年同期在手」，不是「当前在手」。</b>写反了符号会变，落后会算成领先。<br>\n    2. <b>必须是「同一提前窗口」。</b>拿今天（提前 14 天）的在手，去比去年今天（提前 14 天）的在手，不能比去年全年的在手。<br>\n    3. <b>结果为负＝落后，为正＝领先。</b>写台账时必须写「落后 6.0%」或「领先 6.0%」，不能只写「−6.0%」，避免查表时看错列。</p>\n  </div>\n\n  <h2 id=\"s9\">九、口径陷阱总表（5 个高频算错场景）</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 1-6　口径陷阱与正确算法<span class=\"cap-note\">每一行都配了一个会「跨过判定表边界」的真实后果</span></caption>\n      <thead><tr><th>#</th><th>陷阱</th><th>错误算法</th><th>正确算法</th><th>后果</th></tr></thead>\n      <tbody>\n        <tr>\n          <td>1</td>\n          <td><b>分母用总房晚而非可售房晚</b></td>\n          <td>OCC = 234 ÷ 320 = 73.1%</td>\n          <td>OCC = 234 ÷ 312 = <b>75.0%</b>（8 间 OOO）</td>\n          <td>落错表 A 的行，动作从 <span class=\"up\">↑10%</span> 变成 <span class=\"up\">↑5%</span></td>\n        </tr>\n        <tr>\n          <td>2</td>\n          <td><b>ADR 分母混入免费房</b></td>\n          <td>ADR = 162,400 ÷ 240 = ¥676.7</td>\n          <td>ADR = 162,400 ÷ 232 = <b>¥700.0</b>（8 间 Comp）</td>\n          <td>ARI 从 96.7 变 100.0，表 C 判定从「略低」变「健康」，该提的价没提</td>\n        </tr>\n        <tr>\n          <td>3</td>\n          <td><b>房型价格简单平均</b></td>\n          <td>ADR = (580 + 680) ÷ 2 = ¥630.0</td>\n          <td>ADR = 81,400 ÷ 130 = <b>¥626.2</b></td>\n          <td>月度 ADR 虚高，与财务对不上账</td>\n        </tr>\n        <tr>\n          <td>4</td>\n          <td><b>Pickup 偏差分母写反</b></td>\n          <td>(187 − 199) ÷ <b>187</b> = 落后 6.4%</td>\n          <td>(187 − 199) ÷ <b>199</b> = <b>落后 6.0%</b></td>\n          <td>本例未跨列，但若真实值 −9.5%/−10.5%，会跨过「3–10%」与「&gt;10%」的分界</td>\n        </tr>\n        <tr>\n          <td>5</td>\n          <td><b>竞争指数用绝对差代替比值</b></td>\n          <td>ARI = 700 − 680 = 20</td>\n          <td>ARI = 680 ÷ 700 × 100 = <b>97.1</b></td>\n          <td>指数无量纲，绝对差无法横向对比不同城市/不同月份</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h2 id=\"s10\">十、指标体检表：异常 → 成因 → 下一步</h2>\n\n  <p>体检表的使用方式：在每日 07:30 抓完数后，先看下面 8 个「症状」，命中哪一条就按「下一步查什么」执行，并按「查哪张表」落地动作。这是把「看数」和「查表」两步连起来的唯一桥梁。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 1-7　指标体检表（8 症状）<span class=\"cap-note\">「成因」列按出现概率从高到低排列，逐条排查，不要跳着查</span></caption>\n      <thead><tr><th>症状（看到什么）</th><th>可能成因（3–5 个）</th><th>下一步查什么</th><th>查哪张表</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>OCC 达标但 RevPAR 未达标</b></td>\n          <td>① 低价渠道占比过高；② 团队/协议压价过多；③ 免费房与升级超发；④ 促销未按期下架；⑤ 房型结构下沉（高级房没卖出，全卖标准房）</td>\n          <td>拆渠道收入结构 → 算各渠道 NRevPAR → 查房型销售结构</td>\n          <td>表 H（渠道开关）、表 F（房型价差）</td>\n        </tr>\n        <tr>\n          <td><b>ADR 达标但 OCC 落后</b></td>\n          <td>① ARI 偏高（卖贵了）；② OTA 曝光/点评分下滑；③ 竞对降价未跟进；④ 协议客户集中度高但产出不足；⑤ 关房过早</td>\n          <td>算 ARI 与 MPI → 抓竞对 5 家挂牌价 → 查 OTA 后台曝光量与点评分</td>\n          <td>表 C（ARI）、表 D（MPI）</td>\n        </tr>\n        <tr>\n          <td><b>OCC 与 ADR 双高但 GOPPAR 下滑</b></td>\n          <td>① 渠道成本率上升（OTA 占比超 31% 基线）；② 布草/易耗/能耗超支；③ 加班人力成本；④ 含早赠送超量；⑤ 免费升级超发挤占高价房</td>\n          <td>算渠道综合成本率 → 取财务 GOP 明细 → 查《升级台账》</td>\n          <td>表 H（渠道）、表 J（升级规则）</td>\n        </tr>\n        <tr>\n          <td><b>Pickup 落后 &gt;10% 连续 3 天</b></td>\n          <td>① 竞对降价抢量；② 本店价格已偏高；③ OTA 排名/点评分下滑；④ 区域需求整体走弱（展会取消等）；⑤ 销售渠道未铺开</td>\n          <td>确认是否踩表 L「需求暴跌」信号（48h Pickup 落后 &gt;40%）→ 抓竞对比价</td>\n          <td>表 A（调价）、表 L（应急）</td>\n        </tr>\n        <tr>\n          <td><b>MPI &lt; 95</b></td>\n          <td>① OTA 挂牌缺失或被下架；② 渠道关得太早；③ MinLOS 设太长挡单；④ 竞对新开业分流；⑤ 点评分低于竞对</td>\n          <td>逐渠道查挂牌是否在线 → 查当前限制条件设置 → 查 3km 内新增竞对</td>\n          <td>表 D（MPI）、表 B（库存限制）、表 H（渠道）</td>\n        </tr>\n        <tr>\n          <td><b>ARI &gt; 110</b></td>\n          <td>① 竞对已降价本店未跟；② 本店含早/套餐抬高了名义 ADR；③ 采集口径不一致（本店含早、竞对不含早）；④ 房型结构偏向高档房</td>\n          <td>核对采集口径是否一致（同一房型、同一含早状态、同一取消政策）→ 复采竞对价</td>\n          <td>表 C（ARI）</td>\n        </tr>\n        <tr>\n          <td><b>RGI 与 MPI×ARI÷100 不相等</b></td>\n          <td>① 三个指数用了不同天数口径；② 竞对 OCC 用的是估算非实测；③ 本店 RevPAR 分母用了已售房晚；④ 四舍五入误差累积</td>\n          <td>统一全部取「可售房晚」口径重算 → 逐项核对原始数据</td>\n          <td>—（数据校验，不查判定表）</td>\n        </tr>\n        <tr>\n          <td><b>TrevPAR 上升但 GOPPAR 持平</b></td>\n          <td>① 餐饮毛利率下滑（低于 55% 红线）；② 会议团队客房压价、餐饮没起来；③ 宴会厅租金减免过多；④ 其他收入多为低毛利代收</td>\n          <td>取餐饮毛利明细 → 查会议团队《团队决策档案》</td>\n          <td>表 K（会议联动）、表 G（置换分析）</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <\!-- ===== 讲师示范 ===== -->\n  <h2 id=\"demo\">十一、讲师示范：某日全指标完整计算</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>示范一 · 从原始数据到查表输入（完整走一遍）</div>\n\n    <h4>第 0 步：原始数据（来自《每日收益数据包》）</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">日期</div><div class=\"kv-v\">10 月 15 日（周三，D3 平峰日，《SPEC》2.5 需求等级）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">总房量</div><div class=\"kv-v\">320 间（含 12 间无障碍连通房）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">当日 OOO</div><div class=\"kv-v\">8 间（12 层行政楼层局部检修）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">已售房晚</div><div class=\"kv-v\">234 间（其中免费房 Comp 6 间、自用房 House Use 2 间）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">客房收入</div><div class=\"kv-v\">¥163,800（含服务费，不含增值税；Comp 与 House Use 收入为 ¥0）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">餐饮收入</div><div class=\"kv-v\">¥78,000</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">其他收入</div><div class=\"kv-v\">¥8,400</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">GOP</div><div class=\"kv-v\">¥87,360</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">渠道结构</div><div class=\"kv-v\">DIR 70 间 / LOY 24 间 / CORP 46 间 / OTA 国内 70 间 / GDS 24 间（合计 234 间，其中 Comp 6 间与 House Use 2 间归入 DIR 直销）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">竞争组合</div><div class=\"kv-v\">5 家加权 OCC 68.0%、加权 ADR ¥700（《SPEC》2.4 平峰加权均价 ¥680 为本店目标锚点，本例为当日实测加权值）</div></div>\n    </div>\n\n    <h4>第 1 步：算 OCC（先定分母）</h4>\n    <div class=\"formula\">\n      <span class=\"f-label\">计算</span>\n      可售房晚 = 320 − 8 = 312<br>\n      已售房晚 = 234（含 Comp 6、House Use 2）<br>\n      OCC = 234 ÷ 312 × 100% → <span class=\"f-out\">75.0%</span>\n    </div>\n    <div class=\"callout callout-warn\">\n      <span class=\"co-t\">停一下：如果这里用 320 会怎样</span>\n      <p>234 ÷ 320 = 73.1%。《法典》表 A 的行边界是 70% / 85%。本例 75.0% 与 73.1% 都落在「70–85%」行，<b>本例恰好没跨行</b>。但如果当日 OOO 是 20 间（可售 300），真实 OCC = 234 ÷ 300 = 78.0%，误算成 73.1% 仍然同行；再极端一点，可售 280（40 间 OOO，大修期常见），真实 OCC = 83.6%（仍属 70–85% 行），误算 73.1% 也同行——<b>但这不代表可以偷懒</b>：一旦可售房量降到 275 以下，真实 OCC 就跨进「85–95%」行，动作完全不同。OOO 数字必须从系统取当日实际值，不允许沿用昨天。</p>\n    </div>\n\n    <h4>第 2 步：算 ADR（先定口径）</h4>\n    <div class=\"formula\">\n      <span class=\"f-label\">计算</span>\n      付费房晚 = 234 − 6（Comp）− 2（House Use）= 226<br>\n      ADR（本学院口径 · 付费房晚）= 163,800 ÷ 226 → <span class=\"f-out\">¥724.8</span><br>\n      ADR（含 Comp/House Use 对照值）= 163,800 ÷ 234 → <span class=\"f-out\">¥700.0</span>\n    </div>\n    <p>日报中两行都要列，与集团/业主汇报时说明本店采用付费房晚口径。</p>\n\n    <h4>第 3 步：算 RevPAR</h4>\n    <div class=\"formula\">\n      <span class=\"f-label\">计算（两法互验）</span>\n      收入法：RevPAR = 163,800 ÷ 312 → <span class=\"f-out\">¥525.0</span><br>\n      乘法式：RevPAR = 75.0% × 700.0（用同口径 ADR）→ <span class=\"f-out\">¥525.0</span>　✓\n    </div>\n    <div class=\"callout callout-key\">\n      <span class=\"co-t\">互验规则</span>\n      <p>用乘法式验算时，ADR 必须与 OCC 同一口径：若 OCC 分子含 Comp，ADR 就要用含 Comp 口径（¥700.0），两式才相等。若混用（75.0% × 724.8 = ¥543.6）会与收入法 ¥525.0 差 ¥18.6。<b>两式不等 = 口径串了，必须重算，不许取平均值。</b></p>\n    </div>\n\n    <h4>第 4 步：算 TrevPAR 与 GOPPAR</h4>\n    <div class=\"formula\">\n      <span class=\"f-label\">计算</span>\n      总营收 = 163,800 + 78,000 + 8,400 = ¥250,200<br>\n      TrevPAR = 250,200 ÷ 312 → <span class=\"f-out\">¥801.9</span><br>\n      GOPPAR = 87,360 ÷ 312 → <span class=\"f-out\">¥280.0</span><br>\n      GOP 率 = 87,360 ÷ 250,200 × 100% → <span class=\"f-out\">34.9%</span>\n    </div>\n\n    <h4>第 5 步：算 NRevPAR</h4>\n    <div class=\"formula\">\n      <span class=\"f-label\">计算</span>\n      加权成本点数和 = 70×3 + 24×4 + 46×8 + 70×16 + 24×13 = 210 + 96 + 368 + 1,120 + 312 = 2,106<br>\n      渠道综合成本率 = 2,106 ÷ 234 → <span class=\"f-out\">9.0%</span><br>\n      NRevPAR = 525.0 × (1 − 9.0%) = 525.0 × 0.91 → <span class=\"f-out\">¥477.8</span>\n    </div>\n\n    <h4>第 6 步：算三个竞争指数</h4>\n    <div class=\"formula\">\n      <span class=\"f-label\">计算</span>\n      MPI = 75.0 ÷ 68.0 × 100 → <span class=\"f-out\">110.3</span><br>\n      ARI = 700.0 ÷ 700 × 100 → <span class=\"f-out\">100.0</span>（用含 Comp 口径 ADR，与竞对采集口径一致）<br>\n      RGI 直接算 = 525.0 ÷ 476.0 × 100 → <span class=\"f-out\">110.3</span><br>\n      恒等式验算 = 110.3 × 100.0 ÷ 100 → <span class=\"f-out\">110.3</span>　✓\n    </div>\n\n    <h4>第 7 步：把这些数变成查表输入</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">表 A 输入 1</div><div class=\"kv-v\">预测 OCC =（在手房晚 + 预测增量房晚）÷ 可售房晚 =（187 + 57）÷ 312 = 244 ÷ 312 = <b>78.2%</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 A 输入 2</div><div class=\"kv-v\">Pickup 偏差 =（187 − 199）÷ 199 × 100% = <b>落后 6.0%</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">查表结果</div><div class=\"kv-v\">表 A：行「70–85%」× 列「落后 3–10%」→ <span class=\"down\">↓3%</span>（M03 详讲完整查表动作）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 C 输入</div><div class=\"kv-v\">ARI = 100.0 → 落「97–103 健康」→ 维持</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 D 输入</div><div class=\"kv-v\">MPI = 110.3 → 落「&gt;110 份额领先」→ 优先提价</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">冲突仲裁</div><div class=\"kv-v\">按《法典》表 O：表 A（优先级 3）&gt; 表 C（4）&gt; 表 D（6）→ <b>只执行表 A 的 ↓3%</b>，表 C「维持」与表 D「优先提价」写入《观察清单》，并在《调价台账》备注栏记录冲突过程</div></div>\n    </div>\n    <p class=\"card-note\">本示范覆盖 10 个指标中的 9 个（Pickup 已单独演示）。学员需在 20 分钟内独立复算全部数值，任一数值与示范相差超过 0.1 即判不通过。</p>\n  </div>\n\n  <\!-- ===== 学员跟练 ===== -->\n  <h2 id=\"drill\">十二、学员跟练：10 道计算练习</h2>\n\n  <p>要求：先独立算完再展开答案。每题限时 4 分钟。所有题目均使用杭州滨江云璟酒店的参数（320 间房、平峰 BAR ¥680、竞争组合平峰加权均价 ¥680）。</p>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 1 题（基础 · OCC/ADR/RevPAR 三件套）</div>\n    <div class=\"q-b\">某日：可售房晚 320，已售房晚 192，客房收入 ¥119,040。求 OCC、ADR、RevPAR。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      OCC = 192 ÷ 320 × 100% = <b>60.0%</b><br>\n      ADR = 119,040 ÷ 192 = <b>¥620.0</b><br>\n      RevPAR = 119,040 ÷ 320 = <b>¥372.0</b><br>\n      验算：60.0% × 620.0 = ¥372.0 ✓<br>\n      解析：这一题检验「三件套」的基本功。注意 RevPAR 的分母是 320（可售），不是 192（已售）。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 2 题（基础 · 已知 OCC 与 ADR 反推收入）</div>\n    <div class=\"q-b\">某日 OCC 75.0%、ADR ¥680（平峰 BAR）、可售房晚 320。求已售房晚、客房收入、RevPAR。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      已售房晚 = 320 × 75.0% = <b>240 间</b><br>\n      客房收入 = 240 × 680 = <b>¥163,200</b><br>\n      RevPAR = 163,200 ÷ 320 = <b>¥510.0</b>（或 75.0% × 680 = ¥510.0）<br>\n      解析：这是平峰日的基准盘，后面很多题都会以 ¥510.0 为对照。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 3 题（进阶 · OOO 房的处理）</div>\n    <div class=\"q-b\">某日总房量 320，其中 OOO 8 间；已售房晚 234，客房收入 ¥163,800。求可售房晚、OCC、ADR、RevPAR；并算出若误用 320 作分母，OCC 与 RevPAR 各偏差多少。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      可售房晚 = 320 − 8 = <b>312</b><br>\n      OCC = 234 ÷ 312 × 100% = <b>75.0%</b><br>\n      ADR = 163,800 ÷ 234 = <b>¥700.0</b><br>\n      RevPAR = 163,800 ÷ 312 = <b>¥525.0</b><br>\n      误算：OCC = 234 ÷ 320 = <b>73.1%</b>（低估 <b>1.9 个百分点</b>）；RevPAR = 163,800 ÷ 320 = <b>¥511.9</b>（低估 <b>¥13.1</b>）<br>\n      解析：ADR 不受分母口径影响（分母是已售房晚），受影响的只有 OCC 与 RevPAR。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 4 题（进阶 · 免费房与自用房口径）</div>\n    <div class=\"q-b\">某日可售房晚 320，已售房晚 240（含免费房 Comp 8 间、自用房 House Use 0 间），客房收入 ¥162,400。求：（1）本学院口径 ADR（付费房晚）；（2）含 Comp 口径 ADR；（3）两种口径下的 RevPAR；（4）说明 RevPAR 是否受口径影响。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      付费房晚 = 240 − 8 = <b>232</b><br>\n      （1）本学院口径 ADR = 162,400 ÷ 232 = <b>¥700.0</b><br>\n      （2）含 Comp 口径 ADR = 162,400 ÷ 240 = <b>¥676.7</b><br>\n      （3）两种口径的 RevPAR 都是 162,400 ÷ 320 = <b>¥507.5</b><br>\n      （4）<b>RevPAR 不受 ADR 口径影响</b>，因为 RevPAR 的分子（客房收入）和分母（可售房晚）都与 Comp 是否计入 ADR 分母无关。<br>\n      解析：口径差额 = 700.0 − 676.7 = <b>¥23.3</b>。若竞对采集的是含 Comp 口径而本店用付费口径，ARI 会被虚高 3.4%，可能误判为「健康」而错失提价机会。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 5 题（进阶 · 加权 vs 简单平均）</div>\n    <div class=\"q-b\">某日 STD-K 售出 70 间 @ ¥580，SUP-K 售出 60 间 @ ¥680，DLX-K 售出 45 间 @ ¥820。求加权 ADR；并求三档房型价格的简单平均值，指出差额。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      房晚合计 = 70 + 60 + 45 = <b>175 间</b><br>\n      收入合计 = 70×580 + 60×680 + 45×820 = 40,600 + 40,800 + 36,900 = <b>¥118,300</b><br>\n      加权 ADR = 118,300 ÷ 175 = <b>¥676.0</b><br>\n      简单平均 = (580 + 680 + 820) ÷ 3 = <b>¥693.3</b><br>\n      差额 = 693.3 − 676.0 = <b>¥17.3（虚高 2.6%）</b><br>\n      解析：低价房 STD-K 卖得最多（70 间），权重最大，所以加权值低于简单平均。房型销量越不均衡，两种算法的差距越大。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 6 题（进阶 · TrevPAR 与 GOPPAR）</div>\n    <div class=\"q-b\">某日可售房晚 320，客房收入 ¥163,200，餐饮收入 ¥78,000，其他收入 ¥8,400，GOP ¥87,360。求总营收、TrevPAR、GOPPAR、GOP 率；并与年度基线（TrevPAR ¥725.0、GOPPAR ¥232、GOP 率 32.0%）对比，说明涨跌。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      总营收 = 163,200 + 78,000 + 8,400 = <b>¥249,600</b><br>\n      TrevPAR = 249,600 ÷ 320 = <b>¥780.0</b><br>\n      GOPPAR = 87,360 ÷ 320 = <b>¥273.0</b><br>\n      GOP 率 = 87,360 ÷ 249,600 × 100% = <b>35.0%</b><br>\n      对比基线：TrevPAR 780.0 vs 725.0 → <span class=\"up\">↑7.6%</span>；GOPPAR 273.0 vs 232 → <span class=\"up\">↑17.7%</span>；GOP 率 35.0% vs 32.0% → <span class=\"up\">↑3.0pp</span><br>\n      解析：GOPPAR 涨幅（17.7%）大于 TrevPAR 涨幅（7.6%），说明当日不仅收入好，成本控制也到位，是一个「高质量」的经营日。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 7 题（进阶 · 三个竞争指数 + 恒等式验算）</div>\n    <div class=\"q-b\">本店：OCC 75.0%、ADR ¥680。竞争组合 5 家加权：OCC 68.0%、ADR ¥700。求 MPI、ARI、RGI（直接算），并用恒等式验算 RGI。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      本店 RevPAR = 75.0% × 680 = <b>¥510.0</b>；竞对 RevPAR = 68.0% × 700 = <b>¥476.0</b><br>\n      MPI = 75.0 ÷ 68.0 × 100 = <b>110.3</b>　→ 查《法典》表 D：落「&gt;110 份额领先」<br>\n      ARI = 680 ÷ 700 × 100 = <b>97.1</b>　→ 查《法典》表 C：落「90–97 略低」<br>\n      RGI 直接算 = 510.0 ÷ 476.0 × 100 = <b>107.1</b><br>\n      恒等式验算 = 110.3 × 97.1 ÷ 100 = <b>107.1</b> ✓<br>\n      解析：RGI 107.1 &gt; 100，说明综合竞争力领先。拆解看：份额（MPI 110.3）是主要贡献，价格（ARI 97.1）是拖累项——这正是《SPEC》为云璟设定的「MPI ≥ 105、ARI ≈ 100」画像。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 8 题（进阶 · NRevPAR）</div>\n    <div class=\"q-b\">某日 RevPAR ¥510.0，已售 240 间，渠道结构：DIR 72 间（3%）、LOY 24 间（4%）、CORP 48 间（8%）、OTA 国内 72 间（16%）、GDS 24 间（13%）。求渠道综合成本率与 NRevPAR。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      加权点数和 = 72×3 + 24×4 + 48×8 + 72×16 + 24×13 = 216 + 96 + 384 + 1,152 + 312 = <b>2,160</b><br>\n      渠道综合成本率 = 2,160 ÷ 240 = <b>9.0%</b><br>\n      NRevPAR = 510.0 × (1 − 9.0%) = 510.0 × 0.91 = <b>¥464.1</b><br>\n      解析：注意渠道成本率必须按<b>房晚加权</b>，不能用渠道数量平均（(3+4+8+16+13)÷5 = 8.8% 是错的）。若 OTA 占比从 30% 升到 50%，成本率会明显上升，NRevPAR 随之下降。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 9 题（综合 · Pickup 偏差与查表前置）</div>\n    <div class=\"q-b\">目标日 10 月 15 日：当前在手房晚 187 间，去年同期同一提前窗口在手房晚 199 间。求 Pickup 偏差。若该日预测 OCC 为 78.0%，请写出查《法典》表 A 时的「行」和「列」分别落在哪一档（不要求给出动作）。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      Pickup 偏差 = (187 − 199) ÷ 199 × 100% = −12 ÷ 199 × 100% = <b>落后 6.0%</b>（保留一位小数为 6.0%）<br>\n      查表定位：预测 OCC 78.0% → 落在「<b>70–85%</b>」行；Pickup 偏差 落后 6.0% → 落在「<b>落后 3–10%</b>」列。<br>\n      解析：写答案时必须写「落后 6.0%」而不是「−6.0%」。若分母误用当前在手 187，会算成落后 6.4%，本例未跨列，但真实业务中 −9.8% 与 −10.2% 会分属两列，动作从 <span class=\"down\">↓3%</span> 变成 <span class=\"down\">↓5%</span>。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 10 题（综合 · 反推所需 ADR + 判断价格是否到位）</div>\n    <div class=\"q-b\">11 月目标 OCC 78%（《SPEC》月度基准表），11 月 ADR 基准 ¥640。若收益经理设定目标 RevPAR 为 ¥520，求所需 ADR；并判断当前基准 ADR 是偏高还是偏低，差值多少（用百分比表示，带箭头）。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      所需 ADR = 520 ÷ 78.0% = <b>¥666.7</b><br>\n      当前基准 ADR = ¥640.0<br>\n      差值 = (640.0 − 666.7) ÷ 666.7 × 100% = −4.0% → <span class=\"down\">↓4.0%</span>（基准偏低，还差 ¥26.7）<br>\n      解析：这一题训练「目标倒推」——先有目标 RevPAR，再倒推需要什么样的价格组合。倒推出的所需 ADR 是判断「价格是否到位」的唯一标尺，不能用「感觉贵了/便宜了」代替。<br>\n      落地提示：若倒推出的所需 ADR 高于当前 BAR，优先走《法典》表 C 提价分支（受「每次不超过 8%、每周不超过 2 次」约束），不要一次性拉到位。\n    </div></details>\n  </div>\n\n  <\!-- ===== 默写清单 ===== -->\n  <h2 id=\"recite\">十三、口径速记清单（当堂默写）</h2>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">当堂默写 12 条（10 分钟内写完，错 1 条即需重默）</span>\n    <ol style=\"margin:6px 0 0\">\n      <li>OCC = 已售房晚 ÷ <b>可售</b>房晚 × 100%</li>\n      <li>可售房晚 = 总房量 − <b>OOO</b> 房晚</li>\n      <li>ADR = 客房收入 ÷ <b>付费</b>房晚（本学院口径）</li>\n      <li>客房收入：<b>含服务费、不含增值税</b></li>\n      <li>RevPAR = 客房收入 ÷ 可售房晚 = <b>OCC × ADR</b></li>\n      <li>TrevPAR = <b>总营收</b> ÷ 可售房晚</li>\n      <li>GOPPAR = <b>GOP</b> ÷ 可售房晚</li>\n      <li>MPI = 本店 OCC ÷ 竞对 OCC × 100</li>\n      <li>ARI = 本店 ADR ÷ 竞对 ADR × 100</li>\n      <li>RGI = 本店 RevPAR ÷ 竞对 RevPAR × 100 = <b>MPI × ARI ÷ 100</b></li>\n      <li>NRevPAR = RevPAR ×（1 − <b>渠道综合成本率</b>）</li>\n      <li>Pickup 偏差 =（当前在手 − <b>去年同期同一提前窗口在手</b>）÷ 去年同期在手 × 100%</li>\n    </ol>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">默写判定标准</span>\n    <p>公式中的<b>分母</b>写错即判错，不扣分制、直接重默。因为分母错 = 数字错 = 查表错 = 动作错，这是本学院「不猜、不算、不纠结」的第一道防线。</p>\n  </div>\n\n  <\!-- ===== 随堂测 ===== -->\n  <h2 id=\"quiz\">十四、随堂测（5 题）</h2>\n\n  <p>全对（5/5）方可进入下一课。限时 15 分钟。</p>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 1 题</div>\n    <div class=\"q-b\">云璟酒店某日总房量 320 间，其中 10 间 OOO，已售房晚 217 间。OCC 是多少？（保留一位小数）</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      可售房晚 = 320 − 10 = 310；OCC = 217 ÷ 310 × 100% = <b>70.0%</b><br>\n      解析：70.0% 恰好落在《法典》表 A「70–85%」行的下边界上。边界值按<b>包含下界</b>处理（表 A 行区间写作「70–85%」，即 ≥70% 且 &lt;85%）。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 2 题</div>\n    <div class=\"q-b\">某日客房收入 ¥163,800，已售房晚 234（含免费房 6 间、自用房 2 间）。按本学院口径，ADR 是多少？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      付费房晚 = 234 − 6 − 2 = 226；ADR = 163,800 ÷ 226 = <b>¥724.8</b><br>\n      解析：免费房进 OCC 分子（房间被占掉），但不进 ADR 分母（没有收入，进入分母会拉低 ADR 并扭曲与竞对的对比）。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 3 题</div>\n    <div class=\"q-b\">本店 OCC 80.0%、ADR ¥700；竞争组合 OCC 72.0%、ADR ¥720。求 MPI、ARI、RGI。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      本店 RevPAR = 80.0% × 700 = ¥560.0；竞对 RevPAR = 72.0% × 720 = ¥518.4<br>\n      MPI = 80.0 ÷ 72.0 × 100 = <b>111.1</b><br>\n      ARI = 700 ÷ 720 × 100 = <b>97.2</b><br>\n      RGI = 560.0 ÷ 518.4 × 100 = <b>108.0</b><br>\n      验算：111.1 × 97.2 ÷ 100 = 108.0 ✓\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 4 题</div>\n    <div class=\"q-b\">某日 RevPAR ¥510.0，渠道综合成本率 12.0%。求 NRevPAR。若把 OTA 国内的 72 间改为直销（成本率从 16% 降到 3%，其余不变，总房晚 240），新的渠道综合成本率与 NRevPAR 分别是多少？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      原 NRevPAR = 510.0 × (1 − 12.0%) = 510.0 × 0.88 = <b>¥448.8</b><br>\n      调整后加权点数和 = 2,160 − 72×16 + 72×3 = 2,160 − 1,152 + 216 = 1,224<br>\n      新成本率 = 1,224 ÷ 240 = <b>5.1%</b><br>\n      新 NRevPAR = 510.0 × (1 − 5.1%) = 510.0 × 0.949 = <b>¥484.0</b><br>\n      解析：RevPAR 完全没变（¥510.0），NRevPAR 从 ¥448.8 提升到 ¥484.0，<span class=\"up\">↑7.8%</span>。这就是《法典》表 H 在高 OCC 时优先保直销的原因——<b>同样的 RevPAR，渠道结构不同，落到口袋里的钱差 7.8%</b>。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 5 题</div>\n    <div class=\"q-b\">判断改错：某收益专员在日报中写道「昨日 OCC 73.1%，比目标 75.0% 落后 1.9 个百分点，因此判定需求偏弱，计划下调价格」。已知昨日有 8 间 OOO。请指出这段话的计算错误、逻辑错误，并给出正确结论。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>计算错误：</b>未剔除 OOO。若已售房晚为 234，正确 OCC = 234 ÷ 312 = 75.0%，已达目标，不存在落后。<br>\n      <b>逻辑错误（两条）：</b>① 判断需求强弱不能只看 OCC，必须同时看 Pickup 偏差与 ARI；② 「计划下调价格」没有触发条件——按《法典》表 A，调价必须由「预测 OCC」+「Pickup 偏差」两个输入共同决定，且优先级低于表 B（库存）与表 L（应急）。<br>\n      <b>正确结论：</b>先用可售房晚 312 重算 OCC = 75.0%，判定达成目标；再取该目标日的 Pickup 偏差，代入《法典》表 A 查表；表 A 若给出「维持」，则不调价，把结论写入《调价台账》并注明「本日无动作，原因：表 A 判定维持」。<br>\n      解析：这是本模块最重要的一题——<b>算错一个数，就会凭空造出一个本来不存在的降价动作</b>。\n    </div></details>\n  </div>\n\n  <\!-- ===== 产出物 ===== -->\n  <div id=\"out\" class=\"callout callout-do\">\n    <span class=\"co-t\">本模块产出物</span>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>《指标卡》</b>：10 个指标一页纸，含公式、单位、口径铁律、云璟基线值（打印版贴工位）</li>\n      <li><b>《指标计算练习表》</b>：10 道练习题的空白计算区 + 自动校验公式（Excel 模板，填数即出对错）</li>\n      <li><b>《口径速记清单》</b>：当堂默写 12 条，讲师批改签字</li>\n      <li><b>《指标体检表》</b>：8 症状版，打印版随《每日收益数据包》一同摆放</li>\n      <li><b>随堂测成绩</b>：5 题全对方可进入 M02</li>\n    </ul>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">下一模块预告</span>\n    <p>M02《系统与数据导航》将回答本模块留下的唯一悬念：这些数字<b>从哪里抓</b>。你会拿到一份《每日取数清单》（字段 / 来源系统 / 格式 / 截止时间）、一张主流系统操作路径映射表，以及 5 类脏数据的排查方法。</p>\n  </div>\n\n  <\!-- ===== 底部导航 ===== -->\n  <div class=\"p-title\">收益管理操作法典（15 表）</div></a>\n    <a href=\"m02.html\" class=\"p-next\"><div class=\"p-dir\">下一模块 →</div><div class=\"p-title\">M02 系统与数据导航</div></a>\n  </div>\n\n</div>\n"}]}, {"n": 2, "t": "系统与数据导航", "part": "L1 执行专员", "mod": "模块 M02", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n  <\!-- ===== 页头 ===== -->\n  <div class=\"crumb\">\n    <a href=\"../index.html\">学院首页</a><span>/</span>\n    <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n    L1 模块二\n  </div>\n\n  <div class=\"page-head\">\n    <div class=\"badge-row\">\n      <span class=\"badge badge-l1\">L1 收益执行专员</span>\n      <span class=\"badge\">模块 M02</span>\n      <span class=\"badge\">2 课时 / 180 min</span>\n      <span class=\"badge\">课时占比 2/12</span>\n    </div>\n    <h1 class=\"page-title\">系统与数据导航</h1>\n    <p class=\"page-lede\">一句话导语：不管你店上跑的是哪套 PMS，收益专员要抓的字段是固定的——本模块把「要找什么数据、它一般叫什么、几点前必须抓完」钉死，并给你一套脏数据排查方法，保证喂给判定表的每一个数都是干净的。</p>\n  </div>\n\n  <\!-- ===== 学习目标 ===== -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n    <ul>\n      <li>能<b>说出</b> 房型代码、价格代码（Rate Code）、市场细分代码、渠道代码四套编码体系各自的作用与区别，并写出云璟酒店 10 个房型代码、7 个细分代码、7 个渠道代码</li>\n      <li>能<b>独立执行</b> 《每日取数清单》全部 28 个字段的抓取，在规定时间节点前完成，格式符合约定（CSV/截图/系统导出，不手工转录数字）</li>\n      <li>能<b>识别</b> 重复订单、负房晚、渠道错配、免费房混入、团队拆分共 5 类脏数据，并说出各自的排查字段与处置动作</li>\n      <li>能<b>使用</b> 《主流系统操作路径映射表》，在任意一套 PMS/RMS/OTA 后台中定位「价格日历 / 房晚报表 / MinLOS / Stop Sell / 超售」5 个通用功能</li>\n      <li>能<b>完成</b> 4 条数据一致性恒等式自检，且在发现不等时说出排查顺序</li>\n    </ul>\n    <p class=\"card-note\">前置要求：M01 指标与计算（必须能独立算出 OCC/ADR/RevPAR/Pickup 偏差）。<br>本模块对应《法典》：表 M（每日收益操作流水线 07:30 / 07:50 / 08:10 三个取数时段）、表 I（预订窗口分档监控表）。</p>\n  </div>\n\n  <\!-- ===== 目录 ===== -->\n  <div class=\"toc\">\n    <div class=\"toc-title\">本模块目录</div>\n    <ol>\n      <li><a href=\"#s1\">为什么讲「系统无关」：字段是固定的，菜单是会变的</a></li>\n      <li><a href=\"#s2\">四套编码体系：一条订单的完整身份证</a></li>\n      <li><a href=\"#s3\">编码体系一：房型代码（云璟 10 个房型）</a></li>\n      <li><a href=\"#s4\">编码体系二：价格代码 Rate Code</a></li>\n      <li><a href=\"#s5\">编码体系三：市场细分代码</a></li>\n      <li><a href=\"#s6\">编码体系四：渠道代码</a></li>\n      <li><a href=\"#s7\">主流系统操作路径映射表（10 个通用动作 × 8 类系统）</a></li>\n      <li><a href=\"#s8\">《每日取数清单》：28 个字段 / 来源 / 格式 / 截止时间</a></li>\n      <li><a href=\"#s9\">数据一致性自检：4 条恒等式</a></li>\n      <li><a href=\"#s10\">5 类脏数据：症状 / 排查 / 处置 / 留痕</a></li>\n      <li><a href=\"#demo\">讲师示范：一次完整的每日取数（含脏数据修正）</a></li>\n      <li><a href=\"#drill\">学员跟练</a></li>\n      <li><a href=\"#recite\">取数速记清单（当堂默写）</a></li>\n      <li><a href=\"#quiz\">随堂测（5 题）</a></li>\n      <li><a href=\"#out\">本模块产出物</a></li>\n    </ol>\n  </div>\n\n  <\!-- ===== 正文 ===== -->\n  "}, {"id": "p1", "name": "一、为什么讲「系统无关」：字段是固定的，菜单是会变的", "min": 8, "desc": "", "html": "<h2 id=\"s1\">一、为什么讲「系统无关」：字段是固定的，菜单是会变的</h2>\n\n  <p>本学院不教某一个品牌系统的按钮在哪，原因有三：</p>\n\n  <div class=\"grid grid-3\">\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">1</span>原因一</div>\n      <p style=\"margin:0\">你不知道学员店上跑的是哪套系统。云璟酒店集团 38 家在营门店就可能同时存在多套 PMS。教按钮，等于教了一条上任第一天就失效的知识。</p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">2</span>原因二</div>\n      <p style=\"margin:0\">同一套系统不同版本，菜单位置会变；同一版本不同门店的权限配置，可见菜单也会变。路径不可靠，<b>功能名与字段名</b>可靠。</p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">3</span>原因三</div>\n      <p style=\"margin:0\">《法典》判定表的输入是<b>字段值</b>（预测 OCC、Pickup 偏差、在手房晚），不是菜单。学会抓字段，换系统当天就能上岗。</p>\n    </div>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">系统无关的唯一写法</span>\n    <p><b>正确写法：</b>「在价格日历中，把目标日 SUP-K 房型的 BAR 从 ¥680 调整为 ¥748。」<br>\n    <b>错误写法：</b>「点击 Opera 的 Rate Grid 按钮，在第三列输入 748。」<br>\n    <b>判断标准：</b>把这句话拿给一个用西软的同事看，他能照做，就是系统无关；他问「按钮在哪」，就是系统有关。</p>\n  </div>\n\n  <h3>1.1 三层系统分工（先搞清楚去哪台系统找什么）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-1　三层系统与职责边界<span class=\"cap-note\">取数时先判断「这个字段属于哪一层」，再去对应系统，不要在所有系统里乱翻</span></caption>\n      <thead><tr><th>层级</th><th>通用名称</th><th>典型产品</th><th>它负责什么</th><th>它<b>不</b>负责什么</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>第一层</b></td>\n          <td>酒店管理系统 PMS<br>（Property Management System）</td>\n          <td>Opera、西软、绿云、盟广</td>\n          <td>订单、房态、房价码、客账、市场细分、渠道来源的<b>唯一权威记录</b></td>\n          <td>不做预测，不给调价建议</td>\n        </tr>\n        <tr>\n          <td><b>第二层</b></td>\n          <td>收益管理系统 RMS<br>（Revenue Management System）</td>\n          <td>IDeaS、Duetto</td>\n          <td>需求预测、价格建议、限制条件建议、Pickup 曲线</td>\n          <td>不是成交数据的权威源，最终以 PMS 为准</td>\n        </tr>\n        <tr>\n          <td><b>第三层</b></td>\n          <td>渠道后台<br>（OTA / 直销 / GDS）</td>\n          <td>携程 EBK、美团商家后台、飞猪、Booking、官网后台</td>\n          <td>挂牌价、库存配额、曝光/转化数据、点评分</td>\n          <td>不含本店真实成本与细分，不能替代 PMS 出报表</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">铁律：数字对不上时，以 PMS 为准</span>\n    <p>当 RMS 的预测在手房晚、OTA 后台的已售间夜、PMS 的报表三者不一致时，<b>一律以 PMS 导出的数据为准</b>，其余两者仅作参考。原因：只有 PMS 记录了取消、No-show、换房、冲销的完整流水。这条规则写入《调价台账》的数据来源栏。</p>\n  </div>\n\n  "}, {"id": "p2", "name": "二、四套编码体系：一条订单的完整身份证", "min": 8, "desc": "", "html": "<h2 id=\"s2\">二、四套编码体系：一条订单的完整身份证</h2>\n\n  <p>任何一笔订单，在 PMS 里都由四个编码共同描述。缺任何一个，这笔业务就无法被正确归因，后面所有的 OCC/ADR/渠道分析都会偏。</p>\n\n  <div class=\"flow\">\n    <div class=\"flow-item\"><div class=\"fi-t\">房型代码</div><div class=\"fi-d\">卖的是什么房间<br>例：SUP-K 高级大床房</div></div>\n    <div class=\"flow-arrow\">＋</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">价格代码</div><div class=\"fi-d\">按什么价格规则卖<br>例：BAR 最优可用房价</div></div>\n    <div class=\"flow-arrow\">＋</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">市场细分</div><div class=\"fi-d\">客人是谁<br>例：FIT-OTA OTA 散客</div></div>\n    <div class=\"flow-arrow\">＋</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">渠道代码</div><div class=\"fi-d\">从哪条通路进来<br>例：OTA 国内（16% 成本）</div></div>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">四个编码常犯的一个错</span>\n    <p>把「市场细分」和「渠道」当成一回事。举例：一位协议公司员工通过携程预订——<b>市场细分是 CORP（人是谁），渠道是 OTA（从哪来，成本 16%）</b>。如果只记成 CORP，NRevPAR 会按 8% 成本算，实际是 16%，一进一出偏差 8 个百分点。<br>\n    <b>判定口诀：细分看「人」，渠道看「钱从哪条路进来」。</b></p>\n  </div>\n\n  "}, {"id": "p3", "name": "三、编码体系一：房型代码（云璟 10 个房型）", "min": 8, "desc": "", "html": "<h2 id=\"s3\">三、编码体系一：房型代码（云璟 10 个房型）</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-2　杭州滨江云璟酒店房型代码表<span class=\"cap-note\">数据来源：《SPEC》2.1。价差系数以高级房 SUP = 100 为基准，对应平峰 BAR ¥680</span></caption>\n      <thead>\n        <tr><th>房型代码</th><th>房型名称</th><th class=\"num\">间数</th><th class=\"num\">面积</th><th>床型</th><th class=\"num\">标准 BAR（平峰）</th><th class=\"num\">价差系数</th></tr>\n      </thead>\n      <tbody>\n        <tr><td><code>STD-K</code></td><td>标准大床房</td><td class=\"num\">70</td><td class=\"num\">32㎡</td><td>1.8m 大床</td><td class=\"num\">¥580</td><td class=\"num\">85</td></tr>\n        <tr><td><code>STD-T</code></td><td>标准双床房</td><td class=\"num\">50</td><td class=\"num\">32㎡</td><td>1.2m×2</td><td class=\"num\">¥580</td><td class=\"num\">85</td></tr>\n        <tr><td><code>SUP-K</code></td><td>高级大床房</td><td class=\"num\">60</td><td class=\"num\">38㎡</td><td>1.8m 大床</td><td class=\"num\">¥680</td><td class=\"num\">100</td></tr>\n        <tr><td><code>SUP-T</code></td><td>高级双床房</td><td class=\"num\">40</td><td class=\"num\">38㎡</td><td>1.2m×2</td><td class=\"num\">¥680</td><td class=\"num\">100</td></tr>\n        <tr><td><code>DLX-K</code></td><td>豪华大床房</td><td class=\"num\">45</td><td class=\"num\">45㎡</td><td>2.0m 大床</td><td class=\"num\">¥820</td><td class=\"num\">120</td></tr>\n        <tr><td><code>DLX-V</code></td><td>豪华江景房</td><td class=\"num\">15</td><td class=\"num\">48㎡</td><td>2.0m 大床</td><td class=\"num\">¥960</td><td class=\"num\">140</td></tr>\n        <tr><td><code>EXE-K</code></td><td>行政大床房</td><td class=\"num\">25</td><td class=\"num\">45㎡</td><td>2.0m 大床</td><td class=\"num\">¥990</td><td class=\"num\">145</td></tr>\n        <tr><td><code>EXE-T</code></td><td>行政双床房</td><td class=\"num\">5</td><td class=\"num\">45㎡</td><td>1.2m×2</td><td class=\"num\">¥990</td><td class=\"num\">145</td></tr>\n        <tr><td><code>STE-B</code></td><td>商务套房</td><td class=\"num\">8</td><td class=\"num\">65㎡</td><td>2.0m 大床</td><td class=\"num\">¥1,280</td><td class=\"num\">180</td></tr>\n        <tr><td><code>STE-E</code></td><td>行政套房</td><td class=\"num\">2</td><td class=\"num\">88㎡</td><td>2.0m 大床</td><td class=\"num\">¥1,880</td><td class=\"num\">265</td></tr>\n        <tr><td colspan=\"2\"><b>合计</b></td><td class=\"num\"><b>320</b></td><td class=\"num\">—</td><td>—</td><td class=\"num\">—</td><td class=\"num\">—</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">房型代码的 3 个取数纪律</span>\n    <p>1. <b>房型代码必须写全，不许简写。</b>「高级房」是 SUP-K + SUP-T 两个代码共 100 间，写「高级房」会让房晚统计差 40 间。<br>\n    2. <b>间数合计必须等于 320。</b>导出报表后先做合计校验，不等于 320 说明有房型被漏选或重复。<br>\n    3. <b>12 间无障碍连通房不单列房型代码。</b>它们分布在 STD 与 SUP 房型内，通过「房态属性/房间特征」字段标记，取数时用该属性过滤，不要自建房型代码。</p>\n  </div>\n\n  <h3>3.1 附加价格规则（影响价格代码落位，必须一并记录）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-3　附加价格规则<span class=\"cap-note\">数据来源：《SPEC》2.1 附加价格规则 + 表 F 附加项。调价落位时必须同步核对</span></caption>\n      <thead><tr><th>附加项</th><th>加价规则</th><th>记录字段</th></tr></thead>\n      <tbody>\n        <tr><td>高低层差价</td><td>同楼层、同朝向，高楼层 <span class=\"up\">+5%</span></td><td>房间特征：高/低层</td></tr>\n        <tr><td>江景 vs 城景</td><td>江景 <span class=\"up\">+10%</span></td><td>房间特征：江景/城景</td></tr>\n        <tr><td>含早</td><td><span class=\"up\">+¥68/人</span>（自助早餐门市价 ¥128/人）</td><td>价格代码 BARB / 早餐份数字段</td></tr>\n        <tr><td>加床</td><td><span class=\"up\">+¥180/晚</span>（含早）</td><td>加床标记字段</td></tr>\n        <tr><td>连通房</td><td><span class=\"up\">+¥50</span></td><td>房间特征：连通</td></tr>\n        <tr><td>儿童政策</td><td>1.2m 以下不占床免费；1.2–1.4m 早餐半价</td><td>儿童数 / 早餐份数</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  "}, {"id": "p4", "name": "四、编码体系二：价格代码 Rate Code", "min": 8, "desc": "", "html": "<h2 id=\"s4\">四、编码体系二：价格代码 Rate Code</h2>\n\n  <div class=\"callout callout-gold\">\n    <span class=\"co-t\">口径声明（务必阅读）</span>\n    <p>《SPEC》未逐条列举价格代码表。下表是按《SPEC》2.1 附加价格规则、2.3 客源结构与渠道成本、表 H 价格一致性红线<b>推导出的编码口径</b>，属于「编码命名规范」，<b>不是判定阈值</b>；与本店现有价格代码冲突时，以本店 PMS 现有代码为准，但<b>四套编码必须一一对应、不得多套并存</b>。</p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-4　价格代码表（Rate Code）<span class=\"cap-note\">「挂牌范围」列直接对应《法典》表 H 价格一致性红线</span></caption>\n      <thead><tr><th>价格代码</th><th>名称</th><th>定价规则</th><th>挂牌范围</th><th>关联细分</th></tr></thead>\n      <tbody>\n        <tr><td><code>BAR</code></td><td>最优可用房价<br>Best Available Rate</td><td>公开可订的基准弹性价，所有折扣的锚点。平峰日 SUP-K/SUP-T = <b>¥680</b></td><td>全渠道公开</td><td>FIT-WI / FIT-DIR / FIT-OTA</td></tr>\n        <tr><td><code>BARB</code></td><td>含早价</td><td>BAR <span class=\"up\">+¥68/人</span>（自助早餐门市价 ¥128/人）</td><td>全渠道公开</td><td>FIT-WI / FIT-DIR / FIT-OTA</td></tr>\n        <tr><td><code>MEMB</code></td><td>会员专享价</td><td>可低于 OTA 挂牌价</td><td><b>仅限登录会员可见</b>（表 H 红线）</td><td>LOY</td></tr>\n        <tr><td><code>CORP</code></td><td>协议公司价</td><td>按协议约定，需协议号</td><td>不公开，需协议号或公司邮箱验证</td><td>CORP</td></tr>\n        <tr><td><code>ADV</code></td><td>早鸟预付价</td><td>提前 N 天预订、预付、不可取消</td><td>直销为主（表 H「全开 + 早鸟」）</td><td>FIT-DIR / LOY</td></tr>\n        <tr><td><code>PKG</code></td><td>套餐价</td><td>房 + 餐 / 房 + 会 综合定价</td><td>直销 + OTA</td><td>FIT-DIR / FIT-OTA / GRP</td></tr>\n        <tr><td><code>GRP</code></td><td>团队价</td><td>须先走《法典》表 G 置换分析</td><td>不公开</td><td>GRP</td></tr>\n        <tr><td><code>LNG</code></td><td>长住价</td><td>长住客专属（表 H「&lt;55% → 长住/团购」）</td><td>不公开，需审批</td><td>LNG</td></tr>\n        <tr><td><code>COMP</code></td><td>免费房</td><td>收入 ¥0，计房晚不计 ADR 分母（M01 口径）</td><td>内部审批，不对外</td><td>内部</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">价格代码最容易出的三个事故</span>\n    <p>1. <b>BAR 只改了一个房型。</b>调 <span class=\"up\">↑10%</span> 时只改了 SUP-K，忘了 SUP-T / DLX-K / EXE-K。后果：房型价差阶梯被破坏，触发《法典》表 F「相邻房型价差 &lt;8% → 拉开价差」。<b>处置：调价必须按《房型价差阶梯表》整表落位，逐个房型核对。</b><br>\n    2. <b>COMP 挂了 BAR 代码。</b>免费房用了 BAR 价格代码、收入填 ¥0。后果：ADR 分母虚增，ARI 被低估。<b>处置：凡是收入为 ¥0 的订单，价格代码必须是 COMP。</b><br>\n    3. <b>MEMB 未设登录可见。</b>会员价被未登录用户抓到并比价。后果：违反《法典》表 H 价格一致性红线，24 小时内必须整改并记入考核。<b>处置：每周一渠道开关复核时逐渠道验证一次会员价可见性。</b></p>\n  </div>\n\n  "}, {"id": "p5", "name": "五、编码体系三：市场细分代码", "min": 8, "desc": "", "html": "<h2 id=\"s5\">五、编码体系三：市场细分代码</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-5　市场细分代码与基线<span class=\"cap-note\">数据来源：《SPEC》2.3 客源结构（按房晚）。「基线房晚占比」是判断结构是否失衡的对照值</span></caption>\n      <thead><tr><th>细分代码</th><th>市场细分</th><th class=\"num\">基线房晚占比</th><th class=\"num\">基线平均 ADR</th><th>结构失衡信号</th></tr></thead>\n      <tbody>\n        <tr><td><code>FIT-WI</code></td><td>上门散客（Walk-in）</td><td class=\"num\">8%</td><td class=\"num\">¥720</td><td>占比 &gt;12% 说明直销与 OTA 承接不足，客人在门口才订</td></tr>\n        <tr><td><code>FIT-DIR</code></td><td>官网 / 小程序直销</td><td class=\"num\">17%</td><td class=\"num\">¥650</td><td>占比 &lt;13% 说明直销被 OTA 侵蚀，NRevPAR 受损</td></tr>\n        <tr><td><code>FIT-OTA</code></td><td>OTA 散客</td><td class=\"num\">31%</td><td class=\"num\">¥598</td><td>占比 &gt;38% 说明渠道成本失控，走表 H 收缩</td></tr>\n        <tr><td><code>CORP</code></td><td>协议公司客户</td><td class=\"num\">22%</td><td class=\"num\">¥520</td><td>占比 &gt;30% 触发表 E「协议客户集中度 &gt;50%」前的预警，需核对集中度</td></tr>\n        <tr><td><code>LOY</code></td><td>会员（忠诚计划）</td><td class=\"num\">12%</td><td class=\"num\">¥580</td><td>占比 &lt;8% 说明会员转化不足</td></tr>\n        <tr><td><code>GRP</code></td><td>团队（旅游 / 会议）</td><td class=\"num\">8%</td><td class=\"num\">¥450</td><td>占比 &gt;15% 且未走表 G 置换分析，属于重大风险</td></tr>\n        <tr><td><code>LNG</code></td><td>长住客</td><td class=\"num\">2%</td><td class=\"num\">¥380</td><td>占比 &gt;5% 会挤占弹性需求，需 L3 复核</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">细分代码不是「随便选一个」</span>\n    <p>细分代码决定三件事：① 该笔房晚计入哪个细分占比；② 该笔业务是否触发置换分析（GRP 必查表 G）；③ 该笔业务走哪条渠道成本（影响 NRevPAR）。<br>\n    <b>冲突判定：当一笔订单同时符合两个细分时，按「更严格」的一个归类。</b>例：一位协议公司客人以团队形式预订 12 间 → 归 <code>GRP</code>（因为 GRP 需要走表 G 置换分析，更严格），不归 <code>CORP</code>。</p>\n  </div>\n\n  "}, {"id": "p6", "name": "六、编码体系四：渠道代码", "min": 8, "desc": "", "html": "<h2 id=\"s6\">六、编码体系四：渠道代码</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-6　渠道代码与综合成本率<span class=\"cap-note\">数据来源：《SPEC》2.3 渠道成本表。算 NRevPAR 与做表 H 渠道开关时直接取用</span></caption>\n      <thead><tr><th>渠道代码</th><th>渠道</th><th class=\"num\">综合成本率</th><th>典型系统</th><th>《法典》表 H 中的角色</th></tr></thead>\n      <tbody>\n        <tr><td><code>DIR</code></td><td>直销（官网 / 小程序 / 前台）</td><td class=\"num\">3%</td><td>官网后台 / PMS 前台</td><td>任何档位均「全开」</td></tr>\n        <tr><td><code>LOY</code></td><td>会员直订</td><td class=\"num\">4%</td><td>小程序会员中心</td><td>高 OCC 时「全开 + 会员专享价」</td></tr>\n        <tr><td><code>CORP</code></td><td>协议公司（含返佣 / 账期）</td><td class=\"num\">8%</td><td>PMS 协议档案</td><td>不属表 H 管理，由销售部管</td></tr>\n        <tr><td><code>OTA</code></td><td>OTA 国内（携程 / 美团 / 飞猪）</td><td class=\"num\">16%</td><td>携程 EBK / 美团商家后台 / 飞猪</td><td>随 OCC 从「全开 + 深折」收缩到「仅留 1 家」</td></tr>\n        <tr><td><code>OTA-I</code></td><td>OTA 国际（Booking / Agoda）</td><td class=\"num\">18%</td><td>Booking Extranet / Agoda YCS</td><td>OCC ≥95% 时关闭</td></tr>\n        <tr><td><code>GDS</code></td><td>GDS / 商旅 TMC</td><td class=\"num\">13%</td><td>GDS 终端 / TMC 平台</td><td>OCC ≥95% 时关闭</td></tr>\n        <tr><td><code>WHO</code></td><td>批发商 / 包房商</td><td class=\"num\">26%</td><td>批发商后台 / 包房合同</td><td>成本最高，OCC ≥90% 即关闭；<b>净价不得公开挂牌</b></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">渠道代码的红线（来自《法典》表 H）</span>\n    <p>1. <b>直销价不得高于任一 OTA 挂牌价</b>（直销价 ≤ OTA 价 × 100%）。<br>\n    2. <b>会员价可低于 OTA 价，但仅限登录会员可见。</b><br>\n    3. <b>批发商 / 包房价为净价，不得公开挂牌。</b><br>\n    4. 违反一致性：<b>24 小时内整改并记入考核</b>。（完整 6 步核查见 M03）</p>\n  </div>\n\n  "}, {"id": "p7", "name": "七、主流系统操作路径映射表（10 个通用动作 × 8 类", "min": 8, "desc": "", "html": "<h2 id=\"s7\">七、主流系统操作路径映射表（10 个通用动作 × 8 类系统）</h2>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">使用说明（必须读完再用表）</span>\n    <p>1. 下表路径为各系统<b>典型版本</b>的菜单位置，不同版本、不同门店权限会有差异。<b>路径只是「第一次定位用」，定位到之后请记住功能名与字段名，而不是记住路径。</b><br>\n    2. 若按路径找不到：<b>先在系统内搜索功能名关键词</b>（如搜「房价」「Restrictions」「Stop Sell」）→ 再问门店系统管理员 → 找到后<b>把本店实际路径补写进本表空白处</b>，形成本店版本。<br>\n    3. 本表不构成任何系统厂商的操作承诺，一切以厂商官方文档为准。</p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-7　主流系统操作路径映射表<span class=\"cap-note\">行＝通用动作（系统无关），列＝具体系统（仅供首次定位）</span></caption>\n      <thead>\n        <tr>\n          <th>通用动作</th><th>Opera</th><th>西软</th><th>绿云</th><th>盟广</th><th>IDeaS</th><th>Duetto</th><th>携程 EBK</th><th>美团商家后台</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td><b>① 打开价格日历</b><br><span class=\"cap-note\">查/改某日某房型 BAR</span></td>\n          <td>Rate Management → Rate Calendar / Rate Grid</td>\n          <td>房价管理 → 房价计划 → 房价日历</td>\n          <td>收益管理 → 房价日历</td>\n          <td>价格中心 → 价格日历</td>\n          <td>Rate &amp; Demand → Rate Recommendation</td>\n          <td>GameChanger → Rates</td>\n          <td>房价房态 → 房价维护</td>\n          <td>房价房态 → 价格日历</td>\n        </tr>\n        <tr>\n          <td><b>② 导出房晚报表</b><br><span class=\"cap-note\">昨日经营数据</span></td>\n          <td>Reports → Report Explorer → Daily Revenue / Occupancy Statistics</td>\n          <td>报表中心 → 经营报表 → 营业日报</td>\n          <td>数据中心 → 报表 → 经营日报表</td>\n          <td>数据中心 → 经营日报</td>\n          <td>Reports → Report Library → Performance</td>\n          <td>Analytics → Reports</td>\n          <td>数据中心 → 经营数据 → 间夜/成交额</td>\n          <td>经营数据 → 数据报表 → 营业概况</td>\n        </tr>\n        <tr>\n          <td><b>③ 设置 MinLOS</b><br><span class=\"cap-note\">最少住期</span></td>\n          <td>Rate Management → Restrictions → Min Length of Stay</td>\n          <td>房态控制 → 限制条件 → 最少入住天数</td>\n          <td>房态 → 销售控制 → 最少连住</td>\n          <td>库存 → 限制条件 → MinLOS</td>\n          <td>Strategy → Restrictions（输出至 PMS）</td>\n          <td>Strategy → Restrictions（输出至 PMS）</td>\n          <td>房价房态 → 预订规则 → 最少入住晚数</td>\n          <td>房价房态 → 预订规则 → 连住设置</td>\n        </tr>\n        <tr>\n          <td><b>④ 关闭渠道（Stop Sell）</b></td>\n          <td>Availability / Rate Management → Stop Sell（按渠道设置）</td>\n          <td>渠道管理 → 停售设置</td>\n          <td>渠道 → 房态控制 → 停售</td>\n          <td>渠道管理 → 停售</td>\n          <td>不直接控制，输出建议至 PMS / 渠道管理器</td>\n          <td>不直接控制，输出建议至 PMS / 渠道管理器</td>\n          <td>房价房态 → 房态维护 → 关房</td>\n          <td>房价房态 → 房态维护 → 停售</td>\n        </tr>\n        <tr>\n          <td><b>⑤ 设置 CTA</b><br><span class=\"cap-note\">Closed to Arrival 不可入住</span></td>\n          <td>Restrictions → Closed to Arrival</td>\n          <td>房态控制 → 限制条件 → 不可入住</td>\n          <td>房态 → 销售控制 → CTA</td>\n          <td>库存 → 限制条件 → CTA</td>\n          <td>Strategy → Restrictions</td>\n          <td>Strategy → Restrictions</td>\n          <td>房价房态 → 预订规则 → 不可入住</td>\n          <td>房价房态 → 预订规则 → 不可入住</td>\n        </tr>\n        <tr>\n          <td><b>⑥ 查看在手预订与 Pickup</b></td>\n          <td>Reports → Business on Hand / Pickup Report</td>\n          <td>报表中心 → 预订报表 → 在手预订</td>\n          <td>数据中心 → 预订分析 → 在手</td>\n          <td>数据中心 → 预订在手</td>\n          <td>Forecast → Business on Hand / Pickup</td>\n          <td>Analytics → Booking Curve</td>\n          <td>数据中心 → 预订数据</td>\n          <td>经营数据 → 预订数据</td>\n        </tr>\n        <tr>\n          <td><b>⑦ 设置超额预订</b></td>\n          <td>Availability → Overbooking（按房型设上限）</td>\n          <td>房态控制 → 超额预订设置</td>\n          <td>房态 → 超售设置</td>\n          <td>库存 → 超额预订</td>\n          <td>输出建议至 PMS</td>\n          <td>输出建议至 PMS</td>\n          <td>不支持（渠道侧无超售概念）</td>\n          <td>不支持（渠道侧无超售概念）</td>\n        </tr>\n        <tr>\n          <td><b>⑧ 查订单的细分与渠道代码</b></td>\n          <td>Reservation → 打开订单 → Market Segment / Source</td>\n          <td>预订 → 订单详情 → 客源类别 / 来源</td>\n          <td>预订 → 订单详情 → 市场细分 / 渠道</td>\n          <td>订单 → 详情 → 细分 / 渠道</td>\n          <td>不存订单</td>\n          <td>不存订单</td>\n          <td>订单管理 → 订单详情</td>\n          <td>订单管理 → 订单详情</td>\n        </tr>\n        <tr>\n          <td><b>⑨ 导出渠道产量 / 客源结构</b></td>\n          <td>Reports → Statistics → Source / Market Segment Statistics</td>\n          <td>报表中心 → 客源分析</td>\n          <td>数据中心 → 客源结构</td>\n          <td>数据中心 → 渠道产量</td>\n          <td>Reports → Channel / Segment</td>\n          <td>Analytics → Segment</td>\n          <td>数据中心 → 渠道分析</td>\n          <td>经营数据 → 渠道分析</td>\n        </tr>\n        <tr>\n          <td><b>⑩ 团队/协议置换审批留痕</b></td>\n          <td>Business Block → 备注 + 审批附件</td>\n          <td>团队管理 → 审批流</td>\n          <td>团队 → 审批记录</td>\n          <td>团队 → 审批记录</td>\n          <td>不支持（走线下《团队决策档案》）</td>\n          <td>不支持（走线下《团队决策档案》）</td>\n          <td>不适用</td>\n          <td>不适用</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">本表的使用方式：先查行，再查列</span>\n    <p>拿到一个任务，比如「把 10 月 15 日 SUP-K 的 BAR 从 ¥680 调到 ¥748」：<br>\n    ① 判断属于哪个<b>通用动作</b> → ① 打开价格日历；<br>\n    ② 在本店所用的系统列（假设是绿云）查到路径 →「收益管理 → 房价日历」；<br>\n    ③ 进去后按<b>字段名</b>定位：目标日期、房型代码 SUP-K、价格代码 BAR、金额；<br>\n    ④ 落位完成后截图存证，截图需包含<b>日期、房型、价格代码、修改前后金额</b>四项。</p>\n  </div>\n\n  <h2 id=\"s8\">八、《每日取数清单》：28 个字段 / 来源 / 格式 / 截止时间</h2>\n\n  <p>《每日取数清单》是四步闭环里「看数」这一步的唯一作业指导。原则：<strong>不多抓一个字段，不少抓一个字段</strong>。多抓浪费时间（表 M 每个时段都有耗时上限），少抓会导致查表输入缺失。</p>\n\n  <h3>8.1 三个取数时段（来自《法典》表 M）</h3>\n\n  <div class=\"timeline\">\n    <div class=\"tl-item\">\n      <div class=\"tl-time\">07:30　耗时上限 20 min</div>\n      <div class=\"tl-body\"><b>抓取昨日经营数据</b> → 产出《每日收益数据包》。字段共 14 项（见 8.2）。</div>\n    </div>\n    <div class=\"tl-item\">\n      <div class=\"tl-time\">07:50　耗时上限 20 min</div>\n      <div class=\"tl-body\"><b>抓取未来 30 天在手 + Pickup</b> → 产出 Pickup 表更新。字段共 8 项（见 8.3）。</div>\n    </div>\n    <div class=\"tl-item\">\n      <div class=\"tl-time\">08:10　耗时上限 20 min</div>\n      <div class=\"tl-body\"><b>采集竞争组合 5 家价格</b> → 产出比价表更新。字段共 6 项（见 8.4）。</div>\n    </div>\n  </div>\n\n  <h3>8.2 时段一：昨日经营数据（14 个字段）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-8　昨日经营数据字段清单<span class=\"cap-note\">来源层级：P = PMS，R = RMS，F = 财务，O = OTA 后台</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>字段</th><th>来源</th><th>格式</th><th>为什么必须抓（不抓会怎样）</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">1</td><td>统计日期</td><td>P</td><td>YYYY-MM-DD</td><td>缺了无法与去年同期对齐，Pickup 偏差算不出来</td></tr>\n        <tr><td class=\"num\">2</td><td>总房量</td><td>P</td><td>整数</td><td>云璟固定 320，但装修期会变，必须每日取实际值</td></tr>\n        <tr><td class=\"num\">3</td><td>OOO 房晚</td><td>P</td><td>整数</td><td>不抓则 OCC 分母错（M01 陷阱 1）</td></tr>\n        <tr><td class=\"num\">4</td><td>可售房晚</td><td>P</td><td>整数</td><td>= 字段 2 − 字段 3，OCC / RevPAR / TrevPAR / GOPPAR 的共同分母</td></tr>\n        <tr><td class=\"num\">5</td><td>已售房晚</td><td>P</td><td>整数</td><td>OCC 分子、ADR 分母的基数</td></tr>\n        <tr><td class=\"num\">6</td><td>免费房房晚（Comp）</td><td>P</td><td>整数</td><td>不抓则 ADR 分母错（M01 陷阱 2）</td></tr>\n        <tr><td class=\"num\">7</td><td>自用房房晚（House Use）</td><td>P</td><td>整数</td><td>同上</td></tr>\n        <tr><td class=\"num\">8</td><td>客房收入</td><td>F / P</td><td>元，一位小数</td><td>RevPAR / ADR 分子；口径：含服务费、不含增值税</td></tr>\n        <tr><td class=\"num\">9</td><td>餐饮收入</td><td>F</td><td>元，一位小数</td><td>TrevPAR 分子；全服务酒店必看（云璟餐饮占总营收 33.8%）</td></tr>\n        <tr><td class=\"num\">10</td><td>其他收入</td><td>F</td><td>元，一位小数</td><td>TrevPAR 分子</td></tr>\n        <tr><td class=\"num\">11</td><td>GOP</td><td>F</td><td>元，一位小数</td><td>GOPPAR 分子；最终考核指标</td></tr>\n        <tr><td class=\"num\">12</td><td>分渠道房晚（7 个渠道代码）</td><td>P</td><td>整数 × 7</td><td>NRevPAR 唯一输入；不抓则无法判断渠道成本是否失控</td></tr>\n        <tr><td class=\"num\">13</td><td>分房型房晚（10 个房型代码）</td><td>P</td><td>整数 × 10</td><td>房型结构诊断（表 F 价差校验）、升级与置换分析基础</td></tr>\n        <tr><td class=\"num\">14</td><td>分市场细分房晚 + 收入（7 个细分代码）</td><td>P</td><td>整数 + 元 × 7</td><td>客源结构诊断；结构失衡信号对照（表 2-5）</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>8.3 时段二：未来 30 天在手 + Pickup（8 个字段）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-9　在手与 Pickup 字段清单<span class=\"cap-note\">这是《法典》表 A 两个输入的唯一来源，缺一不可</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>字段</th><th>来源</th><th>格式</th><th>为什么必须抓</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">1</td><td>目标日期（未来 30 天逐日）</td><td>P / R</td><td>YYYY-MM-DD × 30</td><td>逐日查表的基础，30 天一行不能少</td></tr>\n        <tr><td class=\"num\">2</td><td>当日可售房晚</td><td>P</td><td>整数</td><td>预测 OCC 的分母</td></tr>\n        <tr><td class=\"num\">3</td><td>当前在手房晚（On the Books）</td><td>P / R</td><td>整数</td><td><b>表 A 输入 1 的分子、输入 2 的被减数</b></td></tr>\n        <tr><td class=\"num\">4</td><td>去年同期同一提前窗口在手房晚</td><td>P / R</td><td>整数</td><td><b>表 A 输入 2 的分母</b>，写反了符号就反了</td></tr>\n        <tr><td class=\"num\">5</td><td>Pickup 绝对增量（近 24h 新增房晚）</td><td>P / R</td><td>整数（可为负）</td><td>画预订曲线；触发表 I 各窗口落后阈值</td></tr>\n        <tr><td class=\"num\">6</td><td>预测增量房晚（Remaining Demand 预测值）</td><td>R</td><td>整数</td><td>预测 OCC =（在手 + 预测增量）÷ 可售</td></tr>\n        <tr><td class=\"num\">7</td><td>需求等级代号（D1/D2/D3/D4）</td><td>日历</td><td>PEAK / HIGH / SHOULDER / LOW</td><td>表 A「触及 D1 峰值日的调价必须 L3 审批」的判定依据</td></tr>\n        <tr><td class=\"num\">8</td><td>当前 BAR（分房型）</td><td>P</td><td>元 × 10</td><td>调价动作的起点值；不抓则算不出新价格</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>8.4 时段三：竞争组合 5 家价格（6 个字段 × 5 家）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-10　竞争组合比价字段清单<span class=\"cap-note\">5 家竞对：A 江畔万枫、B 滨江希尔顿花园、C 钱塘智选假日、D 星光开元名都、E 云栖亚朵 S</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>字段</th><th>来源</th><th>格式</th><th>为什么必须抓</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">1</td><td>采集时间戳</td><td>人工</td><td>YYYY-MM-DD HH:mm</td><td>同日多次调价的先后依据；也是整改留痕证据</td></tr>\n        <tr><td class=\"num\">2</td><td>竞对名称 + 房量</td><td>固定表</td><td>文本 + 整数</td><td>加权平均的权重来源（A 280 / B 240 / C 300 / D 350 / E 200）</td></tr>\n        <tr><td class=\"num\">3</td><td>对标房型挂牌价</td><td>OTA / 官网</td><td>元，一位小数</td><td><b>必须与本店 SUP-K 同档位</b>（标准/高级/豪华不可混采）</td></tr>\n        <tr><td class=\"num\">4</td><td>含早状态</td><td>OTA / 官网</td><td>含早 / 不含早</td><td>口径不一致会让 ARI 偏离 10 个点以上</td></tr>\n        <tr><td class=\"num\">5</td><td>取消政策</td><td>OTA / 官网</td><td>免费取消 / 不可取消</td><td>不可取消价天然更低，不标注会误判 ARI 偏低</td></tr>\n        <tr><td class=\"num\">6</td><td>是否可售（Sold Out 标记）</td><td>OTA / 官网</td><td>是 / 否</td><td>竞对满房时其挂牌价无参考意义，须剔除后重算加权均价</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">比价采集的两条硬约束</span>\n    <p>1. <b>五家必须同一时间窗采集</b>（08:10–08:30 内完成）。跨天采集的价格不能放同一张比价表。<br>\n    2. <b>竞争组合加权均价按房量加权</b>，不是简单平均。平峰基准加权均价为 <b>¥680</b>（《SPEC》2.4），本店目标 ARI ≈ 100、MPI ≥ 105。若某次算出的加权均价与 ¥680 偏离超过 8%，先怀疑采集口径，再怀疑市场。</p>\n  </div>\n\n  <h3>8.5 每日取数清单（可勾选执行版）</h3>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">☑</span>《每日取数清单》· 执行版</div>\n\n    <h4>时段一 · 07:30 前完成（耗时上限 20 min）</h4>\n    <ul class=\"checklist\">\n      <li>PMS 导出昨日房晚统计，确认总房量 − OOO = 可售房晚，且房型间数合计 = 320</li>\n      <li>PMS 导出昨日 Comp / House Use 房晚，与已售房晚核对（Comp + House Use ≤ 已售）</li>\n      <li>财务系统取昨日客房收入 / 餐饮收入 / 其他收入 / GOP，口径确认：含服务费、不含增值税</li>\n      <li>PMS 导出分渠道房晚（DIR / LOY / CORP / OTA / OTA-I / GDS / WHO），7 项合计 = 已售房晚</li>\n      <li>PMS 导出分房型房晚（10 个代码），合计 = 已售房晚</li>\n      <li>PMS 导出分市场细分房晚 + 收入（7 个代码），房晚合计 = 已售房晚，收入合计 = 客房收入</li>\n      <li>数据在 07:50 前录入《每日收益数据包》，<b>不得手工转录数字</b>（一律系统导出 CSV 或截图）</li>\n    </ul>\n\n    <h4>时段二 · 07:50 前完成（耗时上限 20 min）</h4>\n    <ul class=\"checklist\">\n      <li>PMS / RMS 导出未来 30 天逐日在手房晚（On the Books）</li>\n      <li>导出去年同期同一提前窗口在手房晚（30 天，逐日对齐）</li>\n      <li>计算 30 天逐日 Pickup 偏差，标记落后 / 领先及幅度（保留一位小数）</li>\n      <li>导出近 24h Pickup 绝对增量（可为负）</li>\n      <li>RMS 导出各目标日预测增量房晚，算出预测 OCC =（在手 + 预测增量）÷ 可售</li>\n      <li>标注 30 天中每一天的 D1/D2/D3/D4 需求等级（对照《SPEC》2.5 需求日历与年度月度基准）</li>\n      <li>导出当前 10 个房型的 BAR，作为调价起点值</li>\n    </ul>\n\n    <h4>时段三 · 08:10 前完成（耗时上限 20 min）</h4>\n    <ul class=\"checklist\">\n      <li>同一时间窗内采集 5 家竞对对标房型挂牌价（与 SUP-K 同档位）</li>\n      <li>逐家记录含早状态、取消政策、是否售罄</li>\n      <li>剔除售罄竞对后，按房量加权算出竞争组合加权 ADR</li>\n      <li>算出本店 ARI / MPI / RGI，用恒等式 RGI = MPI × ARI ÷ 100 验算</li>\n      <li>比价表更新完成，进入 08:30 查表环节</li>\n    </ul>\n\n    <p class=\"card-note\">交付纪律：三个时段全部完成后，《每日收益数据包》《Pickup 表》《比价表》三份文件在 08:30 前必须处于可查阅状态，否则表 M 中 08:30 的查表动作无法按时启动。任一时段超时，必须在《调价台账》备注栏写明超时原因与时长。</p>\n  </div>\n\n  <h2 id=\"s9\">九、数据一致性自检：4 条恒等式</h2>\n\n  <p>取完数、查表之前，必须先跑这 4 条自检。<strong>任何一条不成立，禁止进入查表环节</strong>——因为带着脏数据查表得出的动作，比不查表更危险。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-11　数据一致性 4 条恒等式<span class=\"cap-note\">「不等时的排查顺序」列是执行动作，按顺序走，不要跳</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>恒等式</th><th>不等时的排查顺序</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td>\n          <td>已售房晚 = Σ10 个房型房晚 = Σ7 个渠道房晚 = Σ7 个细分房晚</td>\n          <td>① 检查导出时是否漏选房型/渠道；② 检查是否有订单缺失渠道或细分字段（空值）；③ 检查 Comp / House Use 是否被同时计入两个渠道</td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td>\n          <td>客房收入 = Σ7 个细分收入</td>\n          <td>① 检查是否有收入未分摊到细分（挂「其他/未分类」）；② 检查包名拆分（PKG 套餐的客房部分是否单独拆出）；③ 与财务科目余额核对</td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td>\n          <td>可售房晚 = 总房量 − OOO 房晚；且 已售房晚 ≤ 可售房晚（未超售时）</td>\n          <td>① 检查 OOO 是否取当日实际值（不是沿用昨天）；② 若已售 &gt; 可售，检查是否开启了超售，超售间数是否符合《法典》表 E</td>\n        </tr>\n        <tr>\n          <td class=\"num\">4</td>\n          <td>RGI = MPI × ARI ÷ 100（误差 ≤ 0.2）</td>\n          <td>① 检查三个指数是否用了同一天、同一口径；② 检查竞对 OCC 是否为实测值而非估算；③ 检查 RevPAR 分母是否误用已售房晚</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h2 id=\"s10\">十、5 类脏数据：症状 / 排查 / 处置 / 留痕</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 2-12　5 类脏数据排查手册<span class=\"cap-note\">「留痕」列是硬要求：任何数据修正如果不留痕，30 天后复盘就无法解释数字为什么变了</span></caption>\n      <thead><tr><th>类型</th><th>症状（看到什么）</th><th>排查方法（查哪些字段）</th><th>处置动作</th><th>留痕</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>① 重复订单</b></td>\n          <td>同一目标日在手房晚虚高；同一客人出现两笔订单；Pickup 某日突然正增长后次日等量回落</td>\n          <td>按「客人姓名 + 入住日 + 房型代码 + 离店日」四字段分组，计数 &gt; 1 即为疑似重复；再核对创建时间与订单号</td>\n          <td><b>不物理删除。</b>保留最早创建的一笔为有效订单，其余标记「重复 Dup」，从在手统计中剔除；通知预订部核实是否会实际到店</td>\n          <td>《数据修正记录》：订单号、重复原因、处置时间、操作人；写入当日《每日收益数据包》备注</td>\n        </tr>\n        <tr>\n          <td><b>② 负房晚</b></td>\n          <td>某日房晚为负；某房型房晚为负；月度合计与日报累加不一致</td>\n          <td>筛「房晚 &lt; 0」的记录；再筛「离店日 &lt; 入住日」；再查是否跨月冲销（上月预订本月取消 / 上月入住本月退房）</td>\n          <td>① 跨月冲销属正常，标记为「跨期调整」不计入脏数据；② 数据录入错误导致的负值，由预订部更正订单日期后重导；③ 当日修正后重算 OCC/ADR</td>\n          <td>《数据修正记录》：负值订单号、判定为「跨期」或「错误」、修正后数值</td>\n        </tr>\n        <tr>\n          <td><b>③ 渠道错配</b></td>\n          <td>某渠道房晚占比与上月基线偏离 &gt;5 个百分点；NRevPAR 与财务佣金支出对不上</td>\n          <td>做「细分 × 渠道」交叉表，找出逻辑不成立的组合：<br>· <code>FIT-OTA</code> 挂 <code>DIR</code> 渠道 ✗<br>· <code>CORP</code> 挂 <code>OTA</code> 渠道 ✗（成本率被高估）<br>· <code>LOY</code> 挂 <code>OTA</code> 渠道 ✗</td>\n          <td>批量核对后由预订部更正渠道字段；更正后重算渠道综合成本率与 NRevPAR；若 NRevPAR 变动 &gt;2%，当日《调价台账》需补记说明</td>\n          <td>《数据修正记录》：错配订单数、涉及房晚、成本率修正前后值</td>\n        </tr>\n        <tr>\n          <td><b>④ 免费房混入</b></td>\n          <td>ADR 单日莫名下滑；收入为 ¥0 但价格代码是 BAR；或价格代码是 COMP 但收入 &gt; 0</td>\n          <td>筛「收入 = 0 且价格代码 ≠ COMP」→ 漏标；筛「价格代码 = COMP 且收入 &gt; 0」→ 错标。两种情况都要修</td>\n          <td>漏标的补改为 <code>COMP</code> 代码；错标的核实后改为对应付费代码。修正后按 M01 口径重算 ADR（付费房晚）与含 Comp 对照值</td>\n          <td>《数据修正记录》：订单号、修正前后价格代码、对 ADR 的影响金额</td>\n        </tr>\n        <tr>\n          <td><b>⑤ 团队拆分</b></td>\n          <td>某日 FIT 散客占比突然飙升；多个订单同一公司名/同一团号；同一入住日多笔 5 间以下的「散客」订单集中出现</td>\n          <td>按「公司名称 + 团号 + 入住日」分组，若合计 ≥ 10 间且预订人相同 → 判定为拆分团队；再核对是否走了《法典》表 G 置换分析</td>\n          <td>合并为 <code>GRP</code> 细分并补做置换分析；<b>若已在手且未做置换分析，立即上报 L3</b>（因为表 G 的接受/拒绝结论可能被绕过）；重算该日散客真实可售量与预测 OCC</td>\n          <td>《团队决策档案》补录 + 《数据修正记录》；涉及表 G 结论的一并写入《调价台账》备注栏</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">脏数据的共同危害：它们全都会污染《法典》表 A 的输入</span>\n    <p>· 重复订单 → 在手房晚虚高 → Pickup 偏差虚高 → 本该降价却读成「维持」或「提价」。<br>\n    · 团队拆分 → 散客可售量虚低 → 预测 OCC 虚高 → 落错表 A 的行。<br>\n    · 渠道错配 → NRevPAR 错 → 表 H 渠道开关判错。<br>\n    · 免费房混入 → ADR 与 ARI 错 → 表 C 判错。<br>\n    <b>结论：取数环节省下的 10 分钟，会在执行环节用 10 倍的价格错误偿还。</b></p>\n  </div>\n\n  <\!-- ===== 讲师示范 ===== -->\n  <h2 id=\"demo\">十一、讲师示范：一次完整的每日取数（含脏数据修正）</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>示范 · 10 月 16 日（周四）上午的完整取数过程</div>\n\n    <h4>07:30 · 抓取昨日（10 月 15 日）经营数据</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">PMS 导出</div><div class=\"kv-v\">总房量 320、OOO 8、可售房晚 312、已售房晚 234、Comp 6、House Use 2</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">财务系统</div><div class=\"kv-v\">客房收入 ¥163,800、餐饮收入 ¥78,000、其他收入 ¥8,400、GOP ¥87,360</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">渠道导出</div><div class=\"kv-v\">DIR 70 / LOY 24 / CORP 46 / OTA 70 / OTA-I 0 / GDS 24 / WHO 0 = <b>234</b> ✓ 与已售房晚一致</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">房型导出</div><div class=\"kv-v\">STD-K 58 / STD-T 40 / SUP-K 46 / SUP-T 30 / DLX-K 28 / DLX-V 9 / EXE-K 16 / EXE-T 2 / STE-B 4 / STE-E 1 = <b>234</b> ✓</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">细分导出</div><div class=\"kv-v\">FIT-WI 16 / FIT-DIR 42 / FIT-OTA 78 / CORP 52 / LOY 28 / GRP 14 / LNG 4 = <b>234</b> ✓</div></div>\n    </div>\n\n    <h4>发现问题一：细分收入合计对不上</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">症状</div><div class=\"kv-v\">7 个细分收入合计 = ¥161,200，但财务客房收入 = ¥163,800，差 <b>¥2,600</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">排查</div><div class=\"kv-v\">按恒等式 2 的排查顺序：① 查是否有收入挂「未分类」→ 找到 4 间房晚 ¥2,600 挂「其他/未分类」细分；② 查订单明细 → 这 4 间为 LONG STAY 长住客，预订部漏选细分代码</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">处置</div><div class=\"kv-v\">更正为 <code>LNG</code> 细分（4 间房晚）。重算后 LNG = 8 间，细分收入合计 = ¥163,800 ✓</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">留痕</div><div class=\"kv-v\">《数据修正记录》第 2026-1016-01 条：未分类收入 ¥2,600 / 4 间房晚，更正为 LNG，操作人：收益专员 XXX，07:41</div></div>\n    </div>\n\n    <h4>发现问题二：免费房漏标</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">症状</div><div class=\"kv-v\">筛「收入 = ¥0」的订单共 8 间，但价格代码为 COMP 的只有 6 间</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">排查</div><div class=\"kv-v\">逐单核对，发现 2 间自用房（工程部驻场用房）价格代码挂了 <code>BAR</code>，收入 ¥0</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">处置</div><div class=\"kv-v\">更正为 <code>COMP</code> 代码。按 M01 口径重算：付费房晚 = 234 − 6 − 2 = 226，ADR = 163,800 ÷ 226 = <b>¥724.8</b>（修正前若按 228 算为 ¥718.4，虚低 <b>¥6.4</b>）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">留痕</div><div class=\"kv-v\">《数据修正记录》第 2026-1016-02 条：2 间自用房价格代码 BAR → COMP，ADR 由 ¥718.4 修正为 ¥724.8</div></div>\n    </div>\n\n    <h4>07:50 · 抓取未来 30 天在手 + Pickup</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">目标日</div><div class=\"kv-v\">10 月 30 日（周四，D3 平峰日）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">当前在手</div><div class=\"kv-v\">187 间</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">去年同期同窗口在手</div><div class=\"kv-v\">199 间</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">Pickup 偏差</div><div class=\"kv-v\">(187 − 199) ÷ 199 × 100% = <b>落后 6.0%</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">预测增量</div><div class=\"kv-v\">57 间</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">预测 OCC</div><div class=\"kv-v\">（187 + 57）÷ 312 = 244 ÷ 312 = <b>78.2%</b></div></div>\n    </div>\n\n    <h4>发现问题三：疑似团队拆分</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">症状</div><div class=\"kv-v\">10 月 30 日在手中，<code>FIT-DIR</code> 细分突然出现 5 笔 4 间的订单，预订人均为「杭州某某科技」，合计 20 间</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">排查</div><div class=\"kv-v\">按「公司名称 + 入住日」分组，合计 20 间 ≥ 10 间且预订人相同 → 判定为拆分团队</div
