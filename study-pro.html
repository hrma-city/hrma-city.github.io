编号不予确认。<br><br>\n        <b>问题 3：CORP 均价 ¥515，低于综合 ADR 的 88% 门槛线，且增速仅 ↑1%（近乎停滞）。</b><br>\n        → 打法 <b>P5 协议客户续约提价</b>。触发条件：CORP 均价 &lt; 综合 ADR × 88%。动作：按年产量三档提价（≥600 间夜 → ¥560；300–599 → ¥545；&lt;300 → ¥580 或转公开价），续约窗口为每季度（表 N 每季度协议客户分级）。<br><br>\n        <b>排序依据</b>：先处理\"超标且增速最快\"的（问题 1），再处理\"超标且单价最低\"的（问题 2），最后处理\"停滞但有合同周期、不能马上改\"的（问题 3）。<b>不能同时上 6 个打法——资源有限，一个季度最多主攻 2 个打法。</b>\n      </div>\n    </details>\n  </div>\n\n  <\!-- ================= 默写 ================= -->\n  <h2 id=\"recite\">九、判定表默写清单</h2>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">当堂默写（25 分钟，白纸，全对方可通过）</span>\n    <ul class=\"checklist\">\n      <li>默写出<b>表 G 5×3 矩阵</b>：5 行 R 档（≥85% / 75–85% / 65–75% / 55–65% / &lt;55%）× 3 列 OCC 档（&lt;70% / 70–85% / &gt;85%），15 格动作一字不差</li>\n      <li>默写出<b>表 G 全服务附加条款</b>：综合贡献 = 客房 + 餐饮 + 会场 + 其他；阈值 = 占用房晚 × 预期散客 ADR × 85%；条件成立时即使 R&lt;55% 也可接受；须 L3 审批 + 记入《团队决策档案》</li>\n      <li>默写出<b>表 G 置换成本公式</b>：被挤占房晚 ×（预期散客 ADR − 团队价）+ 被挤占的餐饮/其他边际收益</li>\n      <li>默写出<b>表 K 4 档</b>：小型 ≤30 人 / 中型 31–120 人 / 大型 121–300 人 / 超大型 &gt;300 人，对应的餐饮保底 ¥8,000 / ¥30,000 / ¥80,000 / ¥150,000，与接受底线倍数 1.1 / 1.0 / 0.95 / 0.9</li>\n      <li>默写出<b>表 K 决策顺序</b>（先问餐饮承接能力 → 再算综合贡献 → 最后查表 G 客房比率）与<b>红线</b>（餐饮毛利率 &lt;55% 须 L3 审批）</li>\n      <li>默写出<b>本店 7 个细分</b>的代码、房晚占比、ADR：FIT-WI 8%/¥720、FIT-DIR 17%/¥650、FIT-OTA 31%/¥598、CORP 22%/¥520、LOY 12%/¥580、GRP 8%/¥450、LNG 2%/¥380</li>\n      <li>默写出<b>6 个标准打法</b>的编号、名称与触发条件（P1 会员价差 / P2 直销最低价 / P3 OTA 配额 / P4 前台转单 / P5 协议提价 / P6 团队管控）</li>\n      <li>默写出<b>本店 P1 = ¥84/间晚</b>的完整推导链（¥28,600,000 × 45% ÷ 84,096 × 55%）</li>\n    </ul>\n  </div>\n\n  <\!-- ================= 随堂测 ================= -->\n  <h2 id=\"quiz\">十、随堂测（5 题）</h2>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 1 题</div>\n    <div class=\"q-b\">表 G 中，行「65% ≤ R &lt; 75%」与列「&gt;85%」交叉的动作是什么？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b><span class=\"pill pill-red\">拒绝</span></b><br>解析：表 G 第三行第三列。记忆口诀——OCC &gt;85% 的那一列，只有 R ≥85% 才自动接受（且限 10 间），其余全部拒绝或上报。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 2 题</div>\n    <div class=\"q-b\">表 K 中，一场 260 人、80 间夜、餐饮报价 ¥70,000 的会议，违反了哪一条门槛？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>违反餐饮保底</b>。<br>解析：260 人属<b>大型（121–300 人）</b>档，餐饮保底 ≥¥80,000，实际报价 ¥70,000 差 ¥10,000。<br>注意不要误判为\"超大型\"——超大型的门槛是 &gt;300 人，而且超大型还额外要求 L3/业主审批。80 间夜落在大型的客房需求区间（61–150 间夜）内，不矛盾。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 3 题</div>\n    <div class=\"q-b\">12 月 28 日，预测 OCC 62%，12 月基准 ADR ¥570，该日为 D4 低谷日（价格系数取 85%）。某团队报价 ¥300/间晚。请算出预期散客 ADR、R，并给出表 G 判定。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：预期散客 ADR ＝ <b>¥484.5</b>；R ＝ <b>61.9%</b>；表 G 判定 ＝ <b><span class=\"pill pill-amber\">上报 L3</span></b>。<br>\n      解析：预期散客 ADR ＝ 570 × 85% ＝ ¥484.5。R ＝ 300 ÷ 484.5 ＝ 61.9% → 行「55% ≤ R &lt; 65%」。预测 OCC 62% &lt; 70% → 列「&lt;70%」。交叉得「上报 L3」。<br>\n      易错点：忘记乘 D4 的价格系数 85%，直接用 ¥570 算 R ＝ 52.6% → 落入「R&lt;55%」行 → 判定为\"拒绝\"，与正确答案相反。<b>低谷日的 R 会被价格系数抬高，所以淡季能接的团队比直觉更多。</b></div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 4 题</div>\n    <div class=\"q-b\">四维诊断中，\"贡献度\"的正确算法是什么？为什么不能只看 ADR？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：贡献度 ＝ <b>该细分收入占比 − 该细分房晚占比</b>（单位：百分点 pt）；同时应给出<b>净 RevPAR 贡献</b> ＝ 该细分净收入 ÷ 可售房晚 116,800。<br>\n      解析：只看 ADR 会得出\"上门散客 FIT-WI 最该被扶持\"的错误结论——它 ADR ¥720 全场最高，但产量只有 8%（6,728 房晚），把全部资源投给它，全店 RevPAR 提升上限只有 ¥5.3（净 RevPAR 贡献 ¥40.23 的天花板）。而 FIT-DIR 产量 17%、ADR ¥650、渠道成本仅 3%，扶持它的边际收益是前者的 1.9 倍。<b>贡献度必须同时用\"pt 差\"看相对效率、用\"净 RevPAR 贡献\"看绝对规模，两个维度缺一不可。</b></div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 5 题</div>\n    <div class=\"q-b\">销售部带来一笔 60 间 × 1 晚的会议团队，客房报价 ¥520，餐饮报价 ¥60,000（毛利率 50%），会场 ¥8,000。日期为 5 月 20 日（D3 平峰日），预测 OCC 76%，5 月基准 ADR ¥690。请给出完整判定。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary>\n      <div class=\"a-body\">\n        预期散客 ADR ＝ 690 × 100% ＝ ¥690（D3 平峰日，系数 100%）<br>\n        R ＝ 520 ÷ 690 ＝ <b>75.4%</b> → 行「75% ≤ R &lt; 85%」；预测 OCC 76% → 列「70–85%」<br>\n        <b>表 G 判定：<span class=\"pill pill-amber\">接受（≤20 间）</span></b>。60 间 &gt; 20 间上限 → <b>上报 L3</b><br><br>\n        客房置换成本 ＝ 60 ×（690 − 520）＋ 60 × 84 ＝ 10,200 ＋ 5,040 ＝ <b>¥15,240</b><br>\n        综合贡献 ＝ 60 × 520 ＋ 60,000 ＋ 8,000 ＝ 31,200 ＋ 60,000 ＋ 8,000 ＝ <b>¥99,200</b><br>\n        附加条款阈值 ＝ 60 × 690 × 85% ＝ <b>¥35,190</b>。综合贡献 ¥99,200 ≥ ¥35,190 <span class=\"pill pill-teal\">成立</span>（安全边际 182%）<br><br>\n        <b>表 K 红线：餐饮毛利率 50% &lt; 55% → 触红线，须 L3 审批。</b><br>\n        餐饮成本 ＝ 60,000 × 50% ＝ ¥30,000；回到 55% 毛利率需餐饮收入 ＝ 30,000 ÷ 45% ＝ <b>¥66,667</b>（需提价 ¥6,667，<span class=\"up\">↑11.1%</span>）<br><br>\n        <b>L3 裁决：<span class=\"pill pill-teal\">接受</span></b>，但附加三条约束：① 餐饮报价须提至 ¥66,667 或提供等效成本优化方案（毛利率回到 ≥55%），否则餐饮部分单独走 L3 特批；② 客房 60 间全部批准（附加条款成立，安全边际 182%）；③ 记入《团队决策档案》，决策人为 L3 收益经理。<br>\n        <b>考点</b>：表 G 说\"限额接受 ≤20 间\"不代表整笔只能做 20 间——<b>会议团队走表 K 附加条款可以突破表 G 的间数上限</b>，这正是表 K 存在的意义。\n      </div>\n    </details>\n  </div>\n\n  <\!-- ================= 产出物 ================= -->\n  <h2 id=\"out\">十一、本模块产出物</h2>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">结课须提交（4 份，缺一不可）</span>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>《客源结构四维交叉诊断表》</b>——用本店真实数据重算表 10-3 全部 7 个细分的 9 列数据，含 P1 的本店实测值</li>\n      <li><b>《团队/协议询价决策记录（≥5 笔）》</b>——每笔须含日期、需求等级、预期散客 ADR、团队价、R、预测 OCC、表 G 判定、置换成本、综合贡献、表 K 核验、附加条款核验、最终动作、决策人</li>\n      <li><b>《客源结构年度优化方案》</b>——含目标（分季里程碑）、承接方、收益测算（净收入口径与净 RevPAR）、所选打法编号与触发条件、验收指标</li>\n      <li><b>《团队决策档案》（台账）</b>——本模块上线后所有团队/协议决策的留档，字段固定，供次年复盘</li>\n    </ul>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">下一模块预告</span>\n    <p>M11《年度预算与滚动预测》将把你在本模块定下的\"OTA 31% → 26%\"这类目标，翻译成一整年的分月 OCC/ADR 目标与 GOP，并把 SPEC 2.5 的月度基准表一路推演到 RevPAR ¥445、客房收入 ¥51,977,328。</p>\n  </div>\n\n  <\!-- ================= 导航 ================= -->\n  \n      <div class=\"p-title\">M09 竞争监测与市场定位</div>\n    </a>\n    <a href=\"m11.html\" class=\"p-next\">\n      <div class=\"p-dir\">下一模块 →</div>\n      <div class=\"p-title\">M11 年度预算与滚动预测（8 课时）</div>\n    </a>\n  </div>\n\n</div>\n"}]}, {"n": 11, "t": "年度预算与分解", "part": "L3 经理", "mod": "模块 M11", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n  <\!-- ================= 页头 ================= -->\n  <div class=\"crumb\">\n    <a href=\"../index.html\">学院首页</a><span>/</span>\n    <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n    L3 模块十一\n  </div>\n\n  <div class=\"page-head\">\n    <div class=\"badge-row\">\n      <span class=\"badge badge-l3\">L3 收益管理经理</span>\n      <span class=\"badge\">模块 M11</span>\n      <span class=\"badge\">8 课时 / 8 × 90 min</span>\n      <span class=\"badge\">认证权重 25%</span>\n      <span class=\"badge badge-core\">核心课 · 权重最高</span>\n    </div>\n    <h1 class=\"page-title\">年度预算与滚动预测：把一年拆成 365 个承诺</h1>\n    <p class=\"page-lede\">一句话导语：预算不是\"猜明年能赚多少\"，是\"把明年每一天的 OCC 和 ADR 都定下来，并且每个月都能说清楚差在哪\"。本模块用七步法，从 SPEC 2.5 的一张 12 格月度基准表，一路推演到 RevPAR ¥445、客房收入 ¥51,977,328、GOP ¥27,098,741。</p>\n  </div>\n\n  <\!-- ================= 学习目标 ================= -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n    <ul>\n      <li>能<b>独立执行</b> 预算编制七步法，从宏观假设一路推到分月 GOP，全过程不使用任何未经说明的数字</li>\n      <li>能<b>手算并复现</b> 从月度基准表到全年 RevPAR ¥445、客房收入 ¥51,977,328 的完整推演链，并能解释校准因子 α = 0.9614 与 β = 0.9850 是怎么来的</li>\n      <li>能<b>独立编制</b> 12 个月滚动预测，套用更新公式，并按当月 ±3% / 次月 ±5% / 第 3 月 ±8% / 3 个月以上 ±15% 的误差容忍度判定是否触发行动</li>\n      <li>能<b>拆解</b> 任意一月的预算 vs 实际差异为量差与价差两个部分，且量差 + 价差必须与差异额完全相等</li>\n      <li>能<b>独立完成</b> 两个完整的分月预算推演案例（保平型、增长型），并输出业主评审可用的《年度预算提交清单》</li>\n    </ul>\n    <p class=\"card-note\">前置要求：M05 需求预测、M09 竞争监测、M10 客源细分战略。本模块沿用 M10 的 P1 参数（¥84/间晚）与客源结构优化测算结论。</p>\n  </div>\n\n  <\!-- ================= 目录 ================= -->\n  <div class=\"toc\">\n    <div class=\"toc-title\">本模块目录</div>\n    <ol>\n      <li><a href=\"#s1\">预算是什么：L3 的年度承诺</a></li>\n      <li><a href=\"#s2\">七步法总览</a></li>\n      <li><a href=\"#s3\">第①步：定宏观假设</a></li>\n      <li><a href=\"#s4\">第②步：拆分 365 天需求日历</a></li>\n      <li><a href=\"#s5\">第③④步：分月定 OCC 与 ADR 目标</a></li>\n      <li><a href=\"#s6\">第⑤步：算客房收入（★核心推演）</a></li>\n      <li><a href=\"#s7\">第⑥步：算餐饮与其他收入</a></li>\n      <li><a href=\"#s8\">第⑦步：算 GOP</a></li>\n      <li><a href=\"#s9\">完整年度预算表（12 个月）</a></li>\n      <li><a href=\"#demo1\">推演案例一：保平型预算</a></li>\n      <li><a href=\"#demo2\">推演案例二：增长型预算（GOP 率 32% → 33%）</a></li>\n      <li><a href=\"#s10\">滚动预测（Rolling Forecast）</a></li>\n      <li><a href=\"#s11\">差异分析：量差 vs 价差</a></li>\n      <li><a href=\"#practice\">学员跟练（6 题）</a></li>\n      <li><a href=\"#recite\">参数与流程默写清单</a></li>\n      <li><a href=\"#quiz\">随堂测（5 题）</a></li>\n      <li><a href=\"#checklist\">《年度预算提交清单》</a></li>\n      <li><a href=\"#out\">本模块产出物</a></li>\n    </ol>\n  </div>\n\n  <\!-- ================= S1 ================= -->\n  "}, {"id": "p1", "name": "一、预算是什么：L3 的年度承诺", "min": 8, "desc": "", "html": "<h2 id=\"s1\">一、预算是什么：L3 的年度承诺</h2>\n\n  <p>L1/L2 的工作以\"天\"为单位，L3 的工作以\"年\"为单位。年度预算是收益经理一年里<strong>唯一一份必须签字、必须被追责、且无法事后修改</strong>的文件。</p>\n\n  <div class=\"grid grid-4\">\n    <div class=\"metric\"><div class=\"metric-val\">¥84,677,328</div><div class=\"metric-label\">上年总营收（SPEC 2.3）</div></div>\n    <div class=\"metric\"><div class=\"metric-val\">¥51,977,328</div><div class=\"metric-label\">客房收入（占比 61.4%）</div></div>\n    <div class=\"metric\"><div class=\"metric-val\">¥27,098,741</div><div class=\"metric-label\">GOP（GOP 率 32.0%）</div></div>\n    <div class=\"metric\"><div class=\"metric-val\">¥232</div><div class=\"metric-label\">GOPPAR</div></div>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">预算的三重身份（缺一不可）</span>\n    <p><b>① 对业主的承诺</b>：GOP 数字写进文件，年底没做到要解释。<br>\n    <b>② 对团队的靶子</b>：销售部按这个数签协议、前厅部按这个数排班、餐饮部按这个数备货。<br>\n    <b>③ 对你自己的尺子</b>：每月 1 日做差异分析时，没有预算就没有\"差异\"这个概念，你只会看到一堆孤立的数字。</p>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">新人最常犯的三个错误</span>\n    <p><b>错误一：只做年度总数，不做分月。</b>只知道全年 ¥51,977,328，不知道 1 月该做多少 —— 结果 1 月结束才发现落后，全年已无法追回。<br>\n    <b>错误二：拿\"增长率\"代替\"逐月推演\"。</b>\"去年做了 5,198 万，今年涨 8% 就是 5,613 万\" —— 这是把预算做成了算术题，没有回答\"哪个月涨、靠什么涨、涨不了怎么办\"。<br>\n    <b>错误三：预算和实际口径不一致。</b>预算里 ADR 含早、实际不含早，年底差异分析全是无用功。<b>口径一致性是预算的第一生命线。</b></p>\n  </div>\n\n  <\!-- ================= S2 ================= -->\n  "}, {"id": "p2", "name": "二、七步法总览", "min": 8, "desc": "", "html": "<h2 id=\"s2\">二、七步法总览</h2>\n\n  <div class=\"flow\">\n    <div class=\"flow-item\"><div class=\"fi-t\">① 定宏观假设</div><div class=\"fi-d\">市场增长 g、成本通胀、竞对变化、停业计划</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">② 拆 365 天日历</div><div class=\"fi-d\">按 D1/D2/D3/D4 把一年分成 4 堆</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">③ 分月定 OCC</div><div class=\"fi-d\">SPEC 2.5 月度基准 × 因子 α</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">④ 分月定 ADR</div><div class=\"fi-d\">SPEC 2.5 月度基准 × 因子 β</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">⑤ 算客房收入</div><div class=\"fi-d\">OCC × ADR = RevPAR，× 可售房晚</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">⑥ 算餐饮/其他</div><div class=\"fi-d\">按客房收入比例分摊</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">⑦ 算 GOP</div><div class=\"fi-d\">总营收 × GOP 率，校验 GOPPAR</div></div>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 11-1　七步法每步的输入、输出与校验规则<span class=\"cap-note\">每一步都有\"校验\"栏——校验不通过不得进入下一步</span></caption>\n      <thead><tr><th class=\"num\">步</th><th>输入</th><th>输出</th><th>校验规则（不通过则退回）</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">①</td><td>集团/业主的增长要求、市场调研、竞对动态</td><td>一组不超过 6 条、每条可证伪的宏观假设</td><td>每条假设必须写\"若该假设不成立，预算如何调整\"</td></tr>\n        <tr><td class=\"num\">②</td><td>SPEC 2.5 需求日历 + 本店当地活动日历</td><td>365 天按 D1/D2/D3/D4 归类</td><td>四类天数之和 = 365；加权 OCC 与月度基准表差异 ≤1.0pt</td></tr>\n        <tr><td class=\"num\">③</td><td>② 的归类结果 + ① 的假设</td><td>12 个月的 OCC 目标</td><td>12 个月加权 OCC = SPEC 2.3 的 72.0%，误差 ≤0.5pt</td></tr>\n        <tr><td class=\"num\">④</td><td>② 的归类结果 + ① 的假设 + 校准因子 β</td><td>12 个月的 ADR 目标</td><td>12 个月加权 ADR = SPEC 2.3 的 ¥618，误差 ≤¥3</td></tr>\n        <tr><td class=\"num\">⑤</td><td>③④ 的月度 OCC / ADR</td><td>12 个月的客房收入</td><td>合计 = ¥51,977,328，误差 ≤0.1%</td></tr>\n        <tr><td class=\"num\">⑥</td><td>⑤ 的分月客房收入</td><td>12 个月的餐饮收入、其他收入</td><td>餐饮合计 = ¥28,600,000、其他合计 = ¥4,100,000，误差 ≤0.1%</td></tr>\n        <tr><td class=\"num\">⑦</td><td>⑤⑥ 的月度收入</td><td>12 个月的 GOP、GOPPAR</td><td>GOP 合计 = ¥27,098,741；GOPPAR = ¥232，误差 ≤0.1%</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <\!-- ================= S3 ================= -->\n  "}, {"id": "p3", "name": "三、第①步：定宏观假设", "min": 8, "desc": "", "html": "<h2 id=\"s3\">三、第①步：定宏观假设</h2>\n\n  <p>宏观假设是整份预算的地基。<strong>最多 6 条，每条都必须能被证伪</strong>——即你能明确说出\"如果 X 发生，这条假设就错了\"。写不出证伪条件的假设，等于没写。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 11-2　杭州滨江云璟酒店 202X 年度预算 · 宏观假设表（6 条）<span class=\"cap-note\">每年 9 月重做（表 N：每年 9 月预算编制）</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>假设</th><th>取值</th><th>依据</th><th>证伪条件（触发即重做预算）</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">A1</td><td>区域市场需求增长 g</td><td><span class=\"up\">↑4.0%</span></td><td>华东区中高端全服务酒店近 3 年需求复合增长；滨江区会展与总部经济持续导入</td><td>连续 2 个季度本店 Pickup 落后上年同期 &gt;10%</td></tr>\n        <tr><td class=\"num\">A2</td><td>成本通胀（人力 + 物料）</td><td><span class=\"up\">↑3.5%</span></td><td>上年 CPI 与本市最低工资调整幅度</td><td>人力成本涨幅 &gt;6% 或 &lt;1%</td></tr>\n        <tr><td class=\"num\">A3</td><td>竞争组合无新增供给</td><td>维持 5 家</td><td>3km 内在建酒店项目清单（A/B/C/D/E 之外无同档新增）</td><td>3km 内新开 1 家同档酒店 → 触发表 L「竞对新开业」</td></tr>\n        <tr><td class=\"num\">A4</td><td>本店无计划外停业</td><td>OOO 房 ≤1.5%</td><td>工程部年度维修计划；去年实际 OOO 占比</td><td>计划外停业 &gt;7 天，或单月 OOO &gt;5%</td></tr>\n        <tr><td class=\"num\">A5</td><td>客源结构优化落地</td><td>OTA 占比 31% → 26%</td><td>M10 §6.1 测算：净 RevPAR <span class=\"up\">↑¥4.61</span></td><td>Q2 末 OTA 占比 &gt;30%</td></tr>\n        <tr><td class=\"num\">A6</td><td>大型活动日历稳定</td><td>D1 峰值日 22 天</td><td>滨江动漫节、云栖大会、国际马拉松等已公布档期</td><td>任一 D1 活动取消或改期 &gt;30 天</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">宏观假设和预算的关系：假设改一个字，预算要重做一遍</span>\n    <p>若 A3 被证伪（3km 内新开一家同档酒店），你不能只是\"把 ADR 调低一点\"。正确动作是：<b>① 按表 L「竞对新开业」执行</b>（采集其价格加入比价表、评估 ARI、制定差异化策略，不盲目跟价）；<b>② 重做第②步的 D1/D2 归类</b>（新竞对主要分流 D2 高涨日需求）；<b>③ 重跑第③–⑦步</b>；<b>④ 向业主提交预算修订版</b>，写明 GOP 影响金额与责任归属。<b>全程不超过 10 个工作日。</b></p>\n  </div>\n\n  <\!-- ================= S4 ================= -->\n  "}, {"id": "p4", "name": "四、第②步：拆分 365 天需求日历", "min": 8, "desc": "", "html": "<h2 id=\"s4\">四、第②步：拆分 365 天需求日历</h2>\n\n  <p>一年不是 12 个\"平均月\"，而是 365 个<strong>需求等级完全不同</strong>的日子。SPEC 2.5 把它们分成 4 档。这一步的任务：把 365 天放进这 4 个桶里，算出每桶天数，并验证它和月度基准表对得上。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 11-3　365 天需求日历拆分（杭州滨江云璟酒店）<span class=\"cap-note\">依据 SPEC 2.5；价格系数统一取档位下限（D1 150%、D2 120%、D3 100%、D4 85%）</span></caption>\n      <thead>\n        <tr><th>需求等级</th><th>代号</th><th class=\"num\">天数</th><th>构成明细</th><th class=\"num\">目标 OCC</th><th class=\"num\">价格系数</th><th class=\"num\">售出房晚</th></tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td><b>D1 峰值日</b></td><td><code>PEAK</code></td><td class=\"num\">22</td>\n          <td>国庆 1–5（5）+ 五一 1–3（3）+ 春节初三–初六（4）+ 滨江动漫节/云栖大会/国际马拉松等（10）</td>\n          <td class=\"num\">≥95%</td><td class=\"num\">150%</td><td class=\"num\">6,688</td>\n        </tr>\n        <tr>\n          <td><b>D2 高涨日</b></td><td><code>HIGH</code></td><td class=\"num\">64</td>\n          <td>4–5 月周五六（17）+ 9–10 月周五六（17）+ 暑期周末（18）+ 展会周边日（12）</td>\n          <td class=\"num\">88–95%<br>取 90%</td><td class=\"num\">120%</td><td class=\"num\">18,432</td>\n        </tr>\n        <tr>\n          <td><b>D3 平峰日</b></td><td><code>SHOULDER</code></td><td class=\"num\">165</td>\n          <td>平季周五六 + 旺季周日–周四</td>\n          <td class=\"num\">72–85%<br>取 80%</td><td class=\"num\">100%</td><td class=\"num\">42,240</td>\n        </tr>\n        <tr>\n          <td><b>D4 低谷日</b></td><td><code>LOW</code></td><td class=\"num\">114</td>\n          <td>1–2 月淡季（除春节）+ 7 月上中旬 + 节后 3–5 天 + 极端天气日</td>\n          <td class=\"num\">45–65%<br>取 55%</td><td class=\"num\">85%</td><td class=\"num\">20,064</td>\n        </tr>\n      </tbody>\n      <tfoot>\n        <tr style=\"background:var(--gold-soft)\">\n          <th>合计</th><th>—</th><th class=\"num\">365</th><th>—</th>\n          <th class=\"num\">加权 74.85%</th><th class=\"num\">—</th><th class=\"num\">87,424</th>\n        </tr>\n      </tfoot>\n    </table>\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">校验一：天数闭合</span>\n    22 ＋ 64 ＋ 165 ＋ 114 ＝ <span class=\"f-out\">365 天</span> ✓\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">校验二：需求日历法算加权 OCC 与售出房晚</span>\n    D1：320 × 22 × 95% ＝ 6,688 房晚　　D2：320 × 64 × 90% ＝ 18,432 房晚<br>\n    D3：320 × 165 × 80% ＝ 42,240 房晚　D4：320 × 114 × 55% ＝ 20,064 房晚<br>\n    合计售出房晚 ＝ <span class=\"f-out\">87,424 房晚</span>　加权 OCC ＝ 87,424 ÷ 116,800 ＝ <span class=\"f-out\">74.85%</span>\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">★ 关键交叉校验：需求日历法 vs 月度基准法</span>\n    <p>现在用完全独立的第二条路径（SPEC 2.5 月度基准表）再算一遍，看两条路径是否互相印证：</p>\n    <div class=\"formula\" style=\"background:#fff\">\n      <span class=\"f-label\">月度基准法：分月售出房晚求和（房晚四舍五入到整数）</span>\n      1月 320×31×58% ＝ 5,754　2月 320×28×62% ＝ 5,555　3月 320×31×74% ＝ 7,341<br>\n      4月 320×30×82% ＝ 7,872　5月 320×31×84% ＝ 8,333　6月 320×30×76% ＝ 7,296<br>\n      7月 320×31×70% ＝ 6,944　8月 320×31×78% ＝ 7,738　9月 320×30×83% ＝ 7,968<br>\n      10月 320×31×85% ＝ 8,432　11月 320×30×78% ＝ 7,488　12月 320×31×68% ＝ 6,746<br>\n      合计 ＝ <span class=\"f-out\">87,467 房晚</span>　加权 OCC ＝ 87,467 ÷ 116,800 ＝ <span class=\"f-out\">74.89%</span>\n    </div>\n    <p style=\"margin:8px 0 0\"><b>两条路径相差 0.04pt（74.85% vs 74.89%），远小于校验阈值 1.0pt，交叉验证通过。</b>若差异 &gt;1.0pt，说明天数归类或月度基准抄错了，必须回头查，不得继续往下做。<br>\n    <b>但请注意：74.89% ≠ SPEC 2.3 的 72.0%。</b>这个 2.9pt 的差，就是第③步要用校准因子 α 消掉的东西。</p>\n  </div>\n\n  <\!-- ================= S5 ================= -->\n  "}, {"id": "p5", "name": "五、第③④步：分月定 OCC 与 ADR 目标", "min": 8, "desc": "", "html": "<h2 id=\"s5\">五、第③④步：分月定 OCC 与 ADR 目标</h2>\n\n  <h3>5.1 为什么必须把校准拆成两个因子</h3>\n\n  <p>月度基准表算出来的加权 OCC 是 <strong>74.89%</strong>、加权 ADR 是 <strong>¥627.4</strong>；而 SPEC 2.3 的上年实绩锚定是 OCC <strong>72.0%</strong>、ADR <strong>¥618</strong>。四个数字两两都对不上。</p>\n\n  <p>如果把差额全部压在 ADR 上（只算一个系数 K 乘 ADR），预算就会变成\"<strong>卖多 4% 的房，收低 4% 的价</strong>\"——收入持平，但多卖的 3,371 个房晚带来额外的清洁、易耗品、人工变动成本，GOP 反而下降。这是一份<strong>自己把自己做亏</strong>的预算。</p>\n\n  <div class=\"callout callout-gold\">\n    <span class=\"co-t\">★ 校准因子 α 与 β 的完整推导（必考）</span>\n    <div class=\"formula\" style=\"background:#fff\">\n      <span class=\"f-label\">第一步：自下而上（Bottom-up）—— 月度基准表直接算</span>\n      毛加权 OCC ＝ 87,467 ÷ 116,800 ＝ <b>74.89%</b><br>\n      毛客房收入 ＝ Σ（各月 OCC × 各月基准 ADR × 320 × 各月天数）<br>\n      　＝ 3,106,944 ＋ 3,110,912 ＋ 4,404,480 ＋ 5,195,520 ＋ 5,749,632 ＋ 4,523,520<br>\n      　　＋ 4,027,520 ＋ 4,874,688 ＋ 5,338,560 ＋ 5,902,400 ＋ 4,792,320 ＋ 3,844,992<br>\n      　＝ <b>¥54,871,488</b><br>\n      毛加权 ADR ＝ 54,871,488 ÷ 87,467 ＝ <b>¥627.4</b>\n    </div>\n    <div class=\"formula\" style=\"background:#fff\">\n      <span class=\"f-label\">第二步：自上而下（Top-down）—— SPEC 2.3 锚定</span>\n      锚定 OCC ＝ <b>72.0%</b>　锚定 ADR ＝ <b>¥618</b>　锚定 RevPAR ＝ <b>¥445</b><br>\n      锚定客房收入 ＝ 116,800 × 445 ＝ <b>¥51,977,328</b>\n    </div>\n    <div class=\"formula\" style=\"background:#fff\">\n      <span class=\"f-label\">第三步：拆成两个校准因子</span>\n      α（OCC 因子）＝ 锚定 OCC ÷ 毛加权 OCC ＝ 72.0% ÷ 74.89% ＝ <span class=\"f-out\">0.9614</span><br>\n      β（ADR 因子）＝ 锚定 ADR ÷ 毛加权 ADR ＝ 618 ÷ 627.4 ＝ <span class=\"f-out\">0.9850</span><br>\n      校验：α × β ＝ 0.9614 × 0.9850 ＝ <span class=\"f-out\">0.9470</span>\n    </div>\n    <p style=\"margin:8px 0 0\"><b>两个因子分别对应两类损耗，成因完全不同：</b></p>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>α = 0.9614（OCC 侧，扣 3.86%）</b>：① OOO 维修房与自用房占用可售房量；② 需求日历的\"目标 OCC\"是区间上限，实际成交常落在下限；③ 取消与 No-show 产生的空置无法被超售（表 E）100% 弥补</li>\n      <li><b>β = 0.9850（ADR 侧，扣 1.50%）</b>：① GRP ¥450、LNG ¥380 显著低于散客，合计 10% 的产量按低价成交；② D1/D2 的 150–200% / 120–150% 系数是上限，实际成交常低于档位下限；③ 免费房与会员升级（表 J）稀释均价</li>\n    </ul>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">两个因子的使用铁律</span>\n    <p><b>α 只乘 OCC，β 只乘 ADR，不得互换、不得合并成一个数直接乘收入。</b><br>\n    原因：OCC 回答\"能卖多少间\"（需求决定），ADR 回答\"实际收到多少钱\"（损耗决定）。合成一个系数会把两个不同性质的东西混在一起，导致后面做量差/价差拆解时无法归因——<b>而量差价差拆解正是 M11 的另一个核心交付</b>。<br>\n    <b>两个因子每年 9 月重算一次。</b>若本店连续两年 α &lt;0.94 或 β &lt;0.97，说明月度基准表与本店实际节律已脱节，应向集团申请重新校准基准表，而不是硬调因子。</p>\n  </div>\n\n  <h3>5.2 分月 OCC 与 ADR 目标（基准 × α / × β）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 11-4　分月 OCC 与 ADR 目标推导<span class=\"cap-note\">预算 OCC = 基准 OCC × α（0.9614）；预算 ADR = 基准 ADR × β（0.9850），取整到元</span></caption>\n      <thead>\n        <tr><th>月</th><th class=\"num\">基准 OCC</th><th class=\"num\">预算 OCC</th><th class=\"num\">可售房晚</th><th class=\"num\">售出房晚</th><th class=\"num\">基准 ADR</th><th class=\"num\">预算 ADR</th><th class=\"num\">预算 RevPAR</th></tr>\n      </thead>\n      <tbody>\n        <tr><td>1 月</td><td class=\"num\">58%</td><td class=\"num\"><b>55.8%</b></td><td class=\"num\">9,920</td><td class=\"num\">5,531</td><td class=\"num\">¥540</td><td class=\"num\"><b>¥532</b></td><td class=\"num\">¥296.6</td></tr>\n        <tr><td>2 月</td><td class=\"num\">62%</td><td class=\"num\"><b>59.6%</b></td><td class=\"num\">8,960</td><td class=\"num\">5,341</td><td class=\"num\">¥560</td><td class=\"num\"><b>¥552</b></td><td class=\"num\">¥329.0</td></tr>\n        <tr><td>3 月</td><td class=\"num\">74%</td><td class=\"num\"><b>71.1%</b></td><td class=\"num\">9,920</td><td class=\"num\">7,057</td><td class=\"num\">¥600</td><td class=\"num\"><b>¥591</b></td><td class=\"num\">¥420.4</td></tr>\n        <tr><td>4 月</td><td class=\"num\">82%</td><td class=\"num\"><b>78.8%</b></td><td class=\"num\">9,600</td><td class=\"num\">7,568</td><td class=\"num\">¥660</td><td class=\"num\"><b>¥650</b></td><td class=\"num\">¥512.4</td></tr>\n        <tr><td>5 月</td><td class=\"num\">84%</td><td class=\"num\"><b>80.8%</b></td><td class=\"num\">9,920</td><td class=\"num\">8,011</td><td class=\"num\">¥690</td><td class=\"num\"><b>¥680</b></td><td class=\"num\">¥549.1</td></tr>\n        <tr><td>6 月</td><td class=\"num\">76%</td><td class=\"num\"><b>73.1%</b></td><td class=\"num\">9,600</td><td class=\"num\">7,018</td><td class=\"num\">¥620</td><td class=\"num\"><b>¥611</b></td><td class=\"num\">¥446.7</td></tr>\n        <tr><td>7 月</td><td class=\"num\">70%</td><td class=\"num\"><b>67.3%</b></td><td class=\"num\">9,920</td><td class=\"num\">6,676</td><td class=\"num\">¥580</td><td class=\"num\"><b>¥571</b></td><td class=\"num\">¥384.3</td></tr>\n        <tr><td>8 月</td><td class=\"num\">78%</td><td class=\"num\"><b>75.0%</b></td><td class=\"num\">9,920</td><td class=\"num\">7,439</td><td class=\"num\">¥630</td><td class=\"num\"><b>¥621</b></td><td class=\"num\">¥465.7</td></tr>\n        <tr><td>9 月</td><td class=\"num\">83%</td><td class=\"num\"><b>79.8%</b></td><td class=\"num\">9,600</td><td class=\"num\">7,661</td><td class=\"num\">¥670</td><td class=\"num\"><b>¥660</b></td><td class=\"num\">¥526.7</td></tr>\n        <tr><td>10 月</td><td class=\"num\">85%</td><td class=\"num\"><b>81.7%</b></td><td class=\"num\">9,920</td><td class=\"num\">8,107</td><td class=\"num\">¥700</td><td class=\"num\"><b>¥690</b></td><td class=\"num\">¥563.9</td></tr>\n        <tr><td>11 月</td><td class=\"num\">78%</td><td class=\"num\"><b>75.0%</b></td><td class=\"num\">9,600</td><td class=\"num\">7,199</td><td class=\"num\">¥640</td><td class=\"num\"><b>¥630</b></td><td class=\"num\">¥472.4</td></tr>\n        <tr><td>12 月</td><td class=\"num\">68%</td><td class=\"num\"><b>65.4%</b></td><td class=\"num\">9,920</td><td class=\"num\">6,486</td><td class=\"num\">¥570</td><td class=\"num\"><b>¥562</b></td><td class=\"num\">¥367.4</td></tr>\n      </tbody>\n      <tfoot>\n        <tr style=\"background:var(--gold-soft)\">\n          <th>合计 / 加权</th><th class=\"num\">74.89%</th><th class=\"num\"><b>72.0%</b></th>\n          <th class=\"num\">116,800</th><th class=\"num\">84,094</th><th class=\"num\">¥627.4</th><th class=\"num\"><b>¥618.0</b></th><th class=\"num\"><b>¥445.0</b></th>\n        </tr>\n      </tfoot>\n    </table>\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">三线闭合校验（本步必须通过，否则退回）</span>\n    <div class=\"formula\" style=\"background:#fff\">\n      <span class=\"f-label\">校验 A · OCC</span>84,094 ÷ 116,800 ＝ <span class=\"f-out\">72.0%</span>　＝ SPEC 2.3 ✓\n    </div>\n    <div class=\"formula\" style=\"background:#fff\">\n      <span class=\"f-label\">校验 B · ADR</span>51,977,328 ÷ 84,094 ＝ <span class=\"f-out\">¥618.0</span>　＝ SPEC 2.3 ✓\n    </div>\n    <div class=\"formula\" style=\"background:#fff\">\n      <span class=\"f-label\">校验 C · RevPAR</span>72.0% × ¥618.0 ＝ <span class=\"f-out\">¥445.0</span>　＝ SPEC 2.3 ✓\n    </div>\n    <p style=\"margin:8px 0 0\">三条线同时闭合 —— 这就是\"从月度基准表推出 RevPAR ¥445、客房收入 ¥51,977,328\"的完整证明。<b>任何一条不闭合，说明你的 α、β 或房晚取整有误。</b></p>\n  </div>\n\n  <\!-- ================= S6 ================= -->\n  "}, {"id": "p6", "name": "六、第⑤步：算客房收入（★ 核心推演）", "min": 8, "desc": "", "html": "<h2 id=\"s6\">六、第⑤步：算客房收入（★ 核心推演）</h2>\n\n  <h3>6.1 核心公式与两个必须避开的坑</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">单月客房收入（三步）</span>\n    ① 月 RevPAR ＝ 月 OCC × 月 ADR<br>\n    ② 月可售房晚 ＝ 320 间 × 该月自然天数<br>\n    ③ 月客房收入 ＝ 月 RevPAR × 月可售房晚 ＝ 月 OCC × 月 ADR × 320 × 该月天数\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">坑一：不能用\"年 RevPAR × 365 × 320\"一步到底</span>\n    <p>年 RevPAR ¥445 × 365 × 320 ＝ ¥51,976,000 —— 数字碰巧接近，但<b>方法是错的</b>。因为年 RevPAR ¥445 本身就是「全年客房收入 ÷ 116,800」倒算出来的，你是在用结果推结果，等于什么都没算。而且这个算法无法回答\"1 月该做多少\"，一旦某月天数不同（2 月只有 28 天）就全错。<b>必须分月算，再求和。</b></p>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">坑二：年 RevPAR 是\"房晚加权平均\"，不是 12 个月的算术平均</span>\n    <p>1 月 31 天、2 月 28 天、4 月 30 天 —— 天数不同，权重就不同。<br>\n    本店 12 个月 RevPAR 的算术平均 = ¥444.6，房晚加权 = ¥445.0，差 ¥0.4（0.09%）。<b>两者接近纯属巧合</b>（因为本店月度 RevPAR 分布相对均匀），不能当作\"两种算法都行\"的证据。<br><br>\n    反例：若 3 月因全面装修停业、可售房晚从 9,920 降为 0，则：<br>\n    · 算术平均 ＝（5,334.6 − 420.4）÷ 12 ＝ <b>¥409.5</b><br>\n    · 房晚加权 ＝（51,977,328 − 4,170,687）÷（116,800 − 9,920）＝ <b>¥447.3</b><br>\n    · 差异 <b>¥37.8（9.2%）</b>，足以让全年目标虚低约 ¥3,930,000。<br>\n    <b>结论：永远用房晚加权。</b></p>\n  </div>\n\n  <h3>6.2 三个月的手算演示（把公式走到底）</h3>\n\n  <div class=\"grid grid-3\">\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">1</span>1 月</div>\n      <div class=\"kv\">\n        <div class=\"kv-row\"><div class=\"kv-k\">OCC × ADR</div><div class=\"kv-v\">55.8% × ¥532 ＝ ¥296.9</div></div>\n        <div class=\"kv-row\"><div class=\"kv-k\">× 可售房晚</div><div class=\"kv-v\">×（320 × 31）＝ × 9,920</div></div>\n        <div class=\"kv-row\"><div class=\"kv-k\">客房收入</div><div class=\"kv-v\"><b>¥2,942,492</b></div></div>\n      </div>\n      <p class=\"card-note\">售出房晚 5,531 × ¥532 ＝ ¥2,942,492（两条算法一致）</p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">4</span>4 月</div>\n      <div class=\"kv\">\n        <div class=\"kv-row\"><div class=\"kv-k\">OCC × ADR</div><div class=\"kv-v\">78.8% × ¥650 ＝ ¥512.2</div></div>\n        <div class=\"kv-row\"><div class=\"kv-k\">× 可售房晚</div><div class=\"kv-v\">×（320 × 30）＝ × 9,600</div></div>\n        <div class=\"kv-row\"><div class=\"kv-k\">客房收入</div><div class=\"kv-v\"><b>¥4,919,200</b></div></div>\n      </div>\n      <p class=\"card-note\">售出房晚 7,568 × ¥650 ＝ ¥4,919,200（两条算法一致）</p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">10</span>10 月</div>\n      <div class=\"kv\">\n        <div class=\"kv-row\"><div class=\"kv-k\">OCC × ADR</div><div class=\"kv-v\">81.7% × ¥690 ＝ ¥563.7</div></div>\n        <div class=\"kv-row\"><div class=\"kv-k\">× 可售房晚</div><div class=\"kv-v\">×（320 × 31）＝ × 9,920</div></div>\n        <div class=\"kv-row\"><div class=\"kv-k\">客房收入</div><div class=\"kv-v\"><b>¥5,593,830</b></div></div>\n      </div>\n      <p class=\"card-note\">售出房晚 8,107 × ¥690 ＝ ¥5,593,830（两条算法一致）</p>\n    </div>\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">全年汇总</span>\n    年客房收入 ＝ Σ 12 个月 ＝ <span class=\"f-out\">¥51,977,328</span><br>\n    年 RevPAR ＝ 51,977,328 ÷ 116,800 ＝ <span class=\"f-out\">¥445.0</span><br>\n    年售出房晚 ＝ 84,094　年 OCC ＝ 72.0%　年 ADR ＝ ¥618.0\n  </div>\n\n  <\!-- ================= S7 ================= -->\n  "}, {"id": "p7", "name": "七、第⑥步：算餐饮与其他收入", "min": 8, "desc": "", "html": "<h2 id=\"s7\">七、第⑥步：算餐饮与其他收入</h2>\n\n  <p>全服务酒店的餐饮收入与客房收入高度相关（住客用餐、会议宴席都随房晚走）。因此按<strong>客房收入比例分摊</strong>是最稳的分月方法——比\"按去年同期增长 8%\"靠谱得多。</p>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">分摊比例（由 SPEC 2.3 推导）</span>\n    餐饮系数 ＝ 餐饮收入 ÷ 客房收入 ＝ 28,600,000 ÷ 51,977,328 ＝ <span class=\"f-out\">0.5502</span><br>\n    其他系数 ＝ 其他收入 ÷ 客房收入 ＝ 4,100,000 ÷ 51,977,328 ＝ <span class=\"f-out\">0.078881</span><br>\n    月餐饮收入 ＝ 月客房收入 × 0.5502　　月其他收入 ＝ 月客房收入 × 0.078881\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">分摊法的适用边界（必须知道什么时候不能用）</span>\n    <p>按客房收入比例分摊，隐含假设是\"每间售出房晚带来的餐饮消费恒定\"。以下三种情况不适用，必须单独建模：<br>\n    <b>① 有大型宴会/婚宴预订的月份</b>：餐饮收入与房晚脱钩，按宴会部确认单单独加。<br>\n    <b>② 有春节、中秋等节令餐饮高峰的月份</b>：本地客餐饮不产生房晚。<br>\n    <b>③ 餐厅装修改造的月份</b>：餐饮收入直接归零或大幅下降。<br>\n    出现以上任一情况，该月的餐饮收入<b>改用宴会部与餐饮部上报的预算数</b>，并在备注栏注明\"非分摊口径\"。</p>\n  </div>\n\n  <\!-- ================= S8 ================= -->\n  <h2 id=\"s8\">八、第⑦步：算 GOP</h2>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">GOP 计算与校验</span>\n    月总营收 ＝ 月客房收入 ＋ 月餐饮收入 ＋ 月其他收入<br>\n    月 GOP ＝ 月总营收 × GOP 率<br>\n    月 GOPPAR ＝ 月 GOP ÷ 月可售房晚<br>\n    <span class=\"cap-note\">本店 GOP 率取 SPEC 2.3 的 32.0%；GOPPAR 目标 ¥232</span>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">GOP 率不是常数——分月应该用不同的率</span>\n    <p>严格来说，1 月（OCC 55.8%）与 10 月（OCC 81.7%）的 GOP 率不可能相同：收入中有相当比例用于覆盖固定成本，低收入月的 GOP 率必然更低。<b>本教材为教学统一取 32.0%</b>，并以此为基准做差异分析。</p>\n    <div class=\"formula\" style=\"background:#fff\">\n      <span class=\"f-label\">进阶做法（上岗后应采用）</span>\n      月 GOP ＝ 月总营收 × 边际贡献率 − 年固定成本 ÷ 12<br>\n      <span class=\"cap-note\">用这个模型，1 月 GOP 率会自动低于 10 月，差异分析才不会被\"季节性 GOP 率波动\"污染。<b>本模块不要求掌握，列为 L3 进阶项。</b></span>\n    </div>\n  </div>\n\n  <\!-- ================= S9 ================= -->\n  <h2 id=\"s9\">九、完整年度预算表（12 个月）</h2>\n\n  <p>下表是七步法的最终产出，也是提交给业主的核心页。<strong>学员必须能在 40 分钟内独立重算整张表的每一行。</strong></p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 11-5　杭州滨江云璟酒店年度预算表（保平型）<span class=\"cap-note\">房晚四舍五入到整数；ADR 取整到元。12 月含年度调平项：客房 −¥968、餐饮 +¥2,074、其他 −¥25、GOP +¥1,994（调整原因：ADR 取整与分摊系数四舍五入产生的累计尾差）</span></caption>\n      <thead>\n        <tr>\n          <th>月</th><th class=\"num\">天数</th><th class=\"num\">可售房晚</th><th class=\"num\">OCC</th><th class=\"num\">售出房晚</th>\n          <th class=\"num\">ADR</th><th class=\"num\">RevPAR</th><th class=\"num\">客房收入</th>\n          <th class=\"num\">餐饮收入</th><th class=\"num\">其他收入</th><th class=\"num\">总营收</th><th class=\"num\">GOP</th><th class=\"num\">GOPPAR</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr><td>1 月</td><td class=\"num\">31</td><td class=\"num\">9,920</td><td class=\"num\">55.8%</td><td class=\"num\">5,531</td><td class=\"num\">¥532</td><td class=\"num\">¥296.6</td><td class=\"num\">2,942,492</td><td class=\"num\">1,618,959</td><td class=\"num\">232,107</td><td class=\"num\">4,793,558</td><td class=\"num\">1,533,939</td><td class=\"num\">¥154.6</td></tr>\n        <tr><td>2 月</td><td class=\"num\">28</td><td class=\"num\">8,960</td><td class=\"num\">59.6%</td><td class=\"num\">5,341</td><td class=\"num\">¥552</td><td class=\"num\">¥329.0</td><td class=\"num\">2,948,232</td><td class=\"num\">1,622,117</td><td class=\"num\">232,560</td><td class=\"num\">4,802,909</td><td class=\"num\">1,536,931</td><td class=\"num\">¥171.5</td></tr>\n        <tr><td>3 月</td><td class=\"num\">31</td><td class=\"num\">9,920</td><td class=\"num\">71.1%</td><td class=\"num\">7,057</td><td class=\"num\">¥591</td><td class=\"num\">¥420.4</td><td class=\"num\">4,170,687</td><td class=\"num\">2,294,712</td><td class=\"num\">328,988</td><td class=\"num\">6,794,387</td><td class=\"num\">2,174,204</td><td class=\"num\">¥219.2</td></tr>\n        <tr><td>4 月</td><td class=\"num\">30</td><td class=\"num\">9,600</td><td class=\"num\">78.8%</td><td class=\"num\">7,568</td><td class=\"num\">¥650</td><td class=\"num\">¥512.4</td><td class=\"num\">4,919,200</td><td class=\"num\">2,706,544</td><td class=\"num\">388,031</td><td class=\"num\">8,013,775</td><td class=\"num\">2,564,408</td><td class=\"num\">¥267.1</td></tr>\n        <tr><td>5 月</td><td class=\"num\">31</td><td class=\"num\">9,920</td><td class=\"num\">80.8%</td><td class=\"num\">8,011</td><td class=\"num\">¥680</td><td class=\"num\">¥549.1</td><td class=\"num\">5,447,480</td><td class=\"num\">2,997,204</td><td class=\"num\">429,703</td><td class=\"num\">8,874,387</td><td class=\"num\">2,839,804</td><td class=\"num\">¥286.3</td></tr>\n        <tr><td>6 月</td><td class=\"num\">30</td><td class=\"num\">9,600</td><td class=\"num\">73.1%</td><td class=\"num\">7,018</td><td class=\"num\">¥611</td><td class=\"num\">¥446.7</td><td class=\"num\">4,287,998</td><td class=\"num\">2,359,257</td><td class=\"num\">338,242</td><td class=\"num\">6,985,497</td><td class=\"num\">2,235,359</td><td class=\"num\">¥232.8</td></tr>\n        <tr><td>7 月</td><td class=\"num\">31</td><td class=\"num\">9,920</td><td class=\"num\">67.3%</td><td class=\"num\">6,676</td><td class=\"num\">¥571</td><td class=\"num\">¥384.3</td><td class=\"num\">3,811,996</td><td class=\"num\">2,097,360</td><td class=\"num\">300,694</td><td class=\"num\">6,210,050</td><td class=\"num\">1,987,216</td><td class=\"num\">¥200.3</td></tr>\n        <tr><td>8 月</td><td class=\"num\">31</td><td class=\"num\">9,920</td><td class=\"num\">75.0%</td><td class=\"num\">7,439</td><td class=\"num\">¥621</td><td class=\"num\">¥465.7</td><td class=\"num\">4,619,619</td><td class=\"num\">2,541,714</td><td class=\"num\">364,400</td><td class=\"num\">7,525,733</td><td class=\"num\">2,408,235</td><td class=\"num\">¥242.8</td></tr>\n        <tr><td>9 月</td><td class=\"num\">30</td><td class=\"num\">9,600</td><td class=\"num\">79.8%</td><td class=\"num\">7,661</td><td class=\"num\">¥660</td><td class=\"num\">¥526.7</td><td class=\"num\">5,056,260</td><td class=\"num\">2,781,954</td><td class=\"num\">398,843</td><td class=\"num\">8,237,057</td><td class=\"num\">2,635,858</td><td class=\"num\">¥274.6</td></tr>\n        <tr><td>10 月</td><td class=\"num\">31</td><td class=\"num\">9,920</td><td class=\"num\">81.7%</td><td class=\"num\">8,107</td><td class=\"num\">¥690</td><td class=\"num\">¥563.9</td><td class=\"num\">5,593,830</td><td class=\"num\">3,077,725</td><td class=\"num\">441,247</td><td class=\"num\">9,112,802</td><td class=\"num\">2,916,097</td><td class=\"num\">¥294.0</td></tr>\n        <tr><td>11 月</td><td class=\"num\">30</td><td class=\"num\">9,600</td><td class=\"num\">75.0%</td><td class=\"num\">7,199</td><td class=\"num\">¥630</td><td class=\"num\">¥472.4</td><td class=\"num\">4,535,370</td><td class=\"num\">2,495,361</td><td class=\"num\">357,755</td><td class=\"num\">7,388,486</td><td class=\"num\">2,364,316</td><td class=\"num\">¥246.3</td></tr>\n        <tr><td>12 月</td><td class=\"num\">31</td><td class=\"num\">9,920</td><td class=\"num\">65.4%</td><td class=\"num\">6,486</td><td class=\"num\">¥562</td><td class=\"num\">¥367.4</td><td class=\"num\">3,644,164</td><td class=\"num\">2,007,093</td><td class=\"num\">287,430</td><td class=\"num\">5,938,687</td><td class=\"num\">1,902,374</td><td class=\"num\">¥191.8</td></tr>\n      </tbody>\n      <tfoot>\n        <tr style=\"background:var(--gold-soft);font-weight:700\">\n          <td>全年</td><td class=\"num\">365</td><td class=\"num\">116,800</td><td class=\"num\">72.0%</td><td class=\"num\">84,094</td>\n          <td class=\"num\">¥618.0</td><td class=\"num\">¥445.0</td><td class=\"num\">51,977,328</td><td class=\"num\">28,600,000</td><td class=\"num\">4,100,000</td>\n          <td class=\"num\">84,677,328</td><td class=\"num\">27,098,741</td><td class=\"num\">¥232.0</td>\n        </tr>\n      </tfoot>\n    </table>\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">四行闭合校验（提交前必须逐条打勾）</span>\n    <div class=\"formula\" style=\"background:#fff\">\n      ① 客房收入合计 ＝ <b>¥51,977,328</b> ＝ SPEC 2.3 ✓<br>\n      ② 餐饮 ＋ 其他 ＝ 28,600,000 ＋ 4,100,000 ＝ <b>¥32,700,000</b> ＝ SPEC 2.3 ✓<br>\n      ③ 总营收 ＝ 51,977,328 ＋ 32,700,000 ＝ <b>¥84,677,328</b> ＝ SPEC 2.3 ✓<br>\n      ④ OCC 72.0% × ADR ¥618.0 ＝ RevPAR <b>¥445.0</b>；GOPPAR ＝ 27,098,741 ÷ 116,800 ＝ <b>¥232.0</b> ＝ SPEC 2.3 ✓\n    </div>\n  </div>\n\n  <\!-- ================= 推演案例一 ================= -->\n  <h2 id=\"demo1\">十、推演案例一：保平型预算（完整走一遍七步法）</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>场景：业主只要求\"不低于去年\"，不接受增长目标</div>\n    <p><b>背景</b>：业主判断明年市场不确定（可能有新竞对），要求预算按\"保平\"编制，GOP 不低于 ¥27,098,741，且不希望看到激进的 OCC/ADR 双升假设。</p>\n\n    <div class=\"step\">\n      <div class=\"step-num\">①</div>\n      <div class=\"step-body\">\n        <h4>宏观假设</h4>\n        <p>采用表 11-2 的 A1–A6，但把 A1 市场增长 g 从 <span class=\"up\">↑4.0%</span> 下调为 <span class=\"flat\">0.0%</span>（保守口径），并在假设栏注明\"若实际增长为正，超出部分计入超额完成\"。</p>\n      </div>\n    </div>\n\n    <div class=\"step\">\n      <div class=\"step-num\">②</div>\n      <div class=\"step-body\">\n        <h4>365 天拆分</h4>\n        <p>D1 22 天 / D2 64 天 / D3 165 天 / D4 114 天，加权 OCC 74.85%（表 11-3）。与月度基准法的 74.89% 差 0.04pt，通过。</p>\n      </div>\n    </div>\n\n    <div class=\"step\">\n      <div class=\"step-num\">③④</div>\n      <div class=\"step-body\">\n        <h4>分月 OCC / ADR</h4>\n        <p>α = 0.9614、β = 0.9850，逐月套用（表 11-4）。加权 OCC 72.0%、加权 ADR ¥618.0、RevPAR ¥445.0，三线闭合。</p>\n      </div>\n    </div>\n\n    <div class=\"step\">\n      <div class=\"step-num\">⑤</div>\n      <div class=\"step-body\">\n        <h4>客房收入</h4>\n        <p>逐月「售出房晚 × 预算 ADR」求和 = ¥51,977,328（表 11-5 第 8 列）。</p>\n      </div>\n    </div>\n\n    <div class=\"step\">\n      <div class=\"step-num\">⑥</div>\n      <div class=\"step-body\">\n        <h4>餐饮 / 其他</h4>\n        <p>餐饮 = 客房 × 0.5502，其他 = 客房 × 0.078881，合计 ¥28,600,000 / ¥4,100,000。</p>\n      </div>\n    </div>\n\n    <div class=\"step\">\n      <div class=\"step-num\">⑦</div>\n      <div class=\"step-body\">\n        <h4>GOP</h4>\n        <p>总营收 ¥84,677,328 × 32.0% = ¥27,098,741；GOPPAR ¥232.0。</p>\n      </div>\n    </div>\n\n    <div class=\"kv\" style=\"margin-top:18px\">\n      <div class=\"kv-k\">关键判断</div>\n      <div class=\"kv-v\">这份预算的实质是<b>\"OCC 与 ADR 同时按基准节律执行，收入与去年持平\"</b>。它没有给团队任何增长压力，同时也意味着——<b>任何一项宏观假设被证伪（尤其 A3 竞对新开业），全年 GOP 立刻失守，且没有缓冲。</b></div>\n      <div class=\"kv-k\">向业主的说明</div>\n      <div class=\"kv-v\">\"这份预算的三个数字是 OCC 72.0%、ADR ¥618、GOP ¥27,098,741，和去年完全持平。我要说明两点：第一，'持平'不是不动，是我们把月度基准表的理想节律（OCC 74.89%）按 α = 0.9614 回落到可实现的 72.0%，这个回落对应的是维修房、未实现的峰值 OCC、取消空置这三类损耗，去年实际就是这么发生的；ADR 那 1.5% 的回落（β = 0.9850）对应的是团队长住的低价成交和会员升级。第二，这份预算没有冗余——如果 3 公里内新开一家同档酒店（假设 A3），我需要 10 个工作日内提交修订版，GOP 影响我会在修订版里给出具体金额。\"</div>\n      <div class=\"kv-k\">风险披露</div>\n      <div class=\"kv-v\">必写三条：<br>\n      <b>① A3 竞对风险（无缓冲，GOP 无冗余）</b><br>\n      <b>② A5 客源结构优化未计入</b>（若落地，净 RevPAR 额外 <span class=\"up\">↑¥4.61</span>、净收入 <span class=\"up\">↑¥538,997</span>）<br>\n      <b>③ A6 大型活动取消风险</b>：D1 日预期 ADR = ¥618 × 150% = ¥927，D1 日售出房晚 = 320 × 95% = 304 房晚/天。若 D1 天数减少 5 天，毛口径损失 = 1,520 × ¥927 = ¥1,409,040；其中一部分会被自然散客需求吸收，按 D3 平峰价 ¥618 保守重估，净损失 = 1,520 ×（927 − 618）= <b>¥469,680</b>。<b>两个口径都要给业主看，不能只报小的那个。</b></div>\n    </div>\n  </div>\n\n  <\!-- ================= 推演案例二 ================= -->\n  <h2 id=\"demo2\">十一、推演案例二：增长型预算（GOP 率 32% → 33%）</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>场景：业主要求 GOP 率提升 1 个百分点</div>\n\n    <div class=\"kv\">\n      <div class=\"kv-k\">要求</div><div class=\"kv-v\">总营收维持 ¥84,677,328 不变，GOP 率从 32.0% 提到 <b>33.0%</b></div>\n      <div class=\"kv-k\">缺口测算</div><div class=\"kv-v\">\n        目标 GOP ＝ 84,677,328 × 33.0% ＝ <b>¥27,943,518</b><br>\n        需增 GOP ＝ 27,943,518 − 27,098,741 ＝ <span class=\"up\">↑¥844,777</span>\n      </div>\n      <div class=\"kv-k\">杠杆①</div><div class=\"kv-v\">\n        <b>M10 客源结构优化：OTA 占比 31% → 26%</b><br>\n        转移房晚 4,205 个（84,096 × 5%），由 FIT-DIR 承接（M10 §6.1）<br>\n        客房收入 <span class=\"up\">↑¥218,660</span>；渠道成本 <span class=\"down\">↓¥320,337</span>；净收入 <span class=\"up\">↑¥538,997</span><br>\n        <b>GOP 贡献：↑¥538,997</b>（客房单位变动成本在 OTA 与直销间相同，增量净收入全额落 GOP）\n      </div>\n      <div class=\"kv-k\">杠杆②</div><div class=\"kv-v\">\n        <b>P5 协议客户续约提价：CORP ¥520 → ¥545（加权）</b><br>\n        年产量 18,501 房晚，按 8% 流失率计：留存 17,021 房晚、流失 1,480 房晚<br>\n        留存部分净收入 ＝ 17,021 × 545 ×（1 − 8%）＝ 9,276,445 × 0.92 ＝ <b>¥8,534,329</b><br>\n        流失部分由 P4 转至 FIT-DIR 承接：1,480 × 650 ×（1 − 3%）＝ 962,000 × 0.97 ＝ <b>¥933,140</b><br>\n        原 CORP 净收入 ＝ 18,501 × 520 × 0.92 ＝ <b>¥8,850,878</b><br>\n        净变化 ＝（8,534,329 ＋ 933,140）− 8,850,878 ＝ <span class=\"up\">↑¥616,591</span><br>\n        <b>GOP 贡献：↑¥616,591</b>\n      </div>\n      <div class=\"kv-k\">执行率折损</div><div class=\"kv-v\">\n        ①＋② ＝ 538,997 ＋ 616,591 ＝ <b>¥1,155,588</b>，覆盖缺口 136.8%<br>\n        但按本店历史打法执行率 <b>70%</b>（过去 3 个季度\"打法实际达成 ÷ 目标\"的均值，<b>学员须用本店实际值替换</b>）：<br>\n        1,155,588 × 70% ＝ <b>¥808,912</b> &lt; ¥844,777 → <span class=\"pill pill-red\">缺口 ¥35,865</span>\n      </div>\n      <div class=\"kv-k\">杠杆③</div><div class=\"kv-v\">\n        <b>餐饮毛利率 55% → 56.5%（↑1.5pt）</b><br>\n        GOP 贡献 ＝ 餐饮收入 28,600,000 × 1.5% ＝ <b>¥429,000</b><br>\n        按 60% 执行率（毛利率改善难度高于收入类打法，执行率折损更大）→ <b>¥257,400</b>\n      </div>\n      <div class=\"kv-k\">合计</div><div class=\"kv-v\">\n        808,912 ＋ 257,400 ＝ <b>¥1,066,312</b> ≥ ¥844,777<br>\n        覆盖 <b>126.2%</b>，安全余量 <b>¥221,535（26.2%）</b> <span class=\"pill pill-teal\">通过</span>\n      </div>\n      <div class=\"kv-k\">★ 冲突检查</div><div class=\"kv-v\">\n        <b>杠杆①与杠杆②存在房晚流向冲突，必须同时处理，否则目标落空：</b><br>\n        杠杆②的 1,480 个流失 CORP 房晚，<b>若未被 P4 转直销承接而流向 OTA</b>：<br>\n        · OTA 房晚变化 ＝ −4,205（杠杆①）＋ 1,480（杠杆②回流）＝ 净 −2,725 房晚<br>\n        · OTA 占比 ＝ 31% −（2,725 ÷ 84,096）＝ 31% − 3.24% ＝ <b>27.76%</b>，<span class=\"pill pill-red\">未达 26% 目标</span><br>\n        · 杠杆①的收益从 ¥538,997 降至 538,997 ×（2,725 ÷ 4,205）＝ <b>¥349,055</b><br>\n        <b>结论：P4（前台/预订部转直销话术与激励）不是可选项，是杠杆②成立的前提条件。</b>在预算文件的打法清单里，必须把 P4 标注为\"杠杆②的强制前置项\"。\n      </div>\n      <div class=\"kv-k\">向业主的说明</div><div class=\"kv-v\">\"GOP 率从 32% 到 33%，需要多赚 ¥844,777。我给你三个来源：第一，把 OTA 占比从 31% 压到 26%，值 ¥538,997；第二，协议客户续约提价，值 ¥616,591；第三，餐饮毛利率提 1.5 个点，值 ¥429,000。三个加起来是 ¥1,584,588，但我不敢按满额报——按我们过去三个季度的打法执行率 70% 折算，实际能拿到 ¥1,066,312，超出目标 26%。<b>我要特别提示一个风险：第二项的协议提价会让 8% 的协议客户流失，这批房晚如果不转到直销而流回 OTA，第一项的目标只能实现 65%。所以我需要前台转直销的激励预算 ¥48,000（800 间夜 × ¥15 × 4 个季度），这笔钱已经算在成本里了。</b>\"</div>\n    </div>\n\n    <p class=\"card-note\"><b>讲师提示</b>：这份方案的说服力不在\"三个杠杆加起来 158 万\"，而在<b>主动打折到 106 万、主动披露打法间的冲突、主动把前置条件（P4 激励预算）摆到桌面上</b>。只报满额数字的方案，业主一眼就能看出你没做过执行。</p>\n  </div>\n\n  <\!-- ================= 滚动预测 ================= -->\n  <h2 id=\"s10\">十二、滚动预测（Rolling Forecast）</h2>\n\n  <p>预算一年做一次，但市场一年变 12 次。滚动预测的作用是：<strong>每月 1 日把未来 12 个月重算一遍</strong>，让预算始终保持\"当前最佳估计\"，而不是一份 9 月做完就锁死的历史文件。</p>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">滚动预测的定位（必须讲清，否则会被总经理误解）</span>\n    <p><b>滚动预测不修改预算。</b>预算是承诺，滚动预测是判断。两者并存：<br>\n    · <b>预算</b>用于考核与差异分析（分母不动）<br>\n    · <b>滚动预测</b>用于决策（决定这个月要不要降价、要不要加销售动员）<br>\n    每月 1 日（表 N）同时输出两份：《月度收益复盘报告》（预算 vs 实际 vs 预测，三列并排）与更新后的 12 个月滚动预测。</p>\n  </div>\n\n  <h3>12.1 更新公式</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">滚动预测更新公式（对未来第 n 月，在每月 1 日执行）</span>\n    F(n) ＝ OnHand(n) ＋［LY(n) − LY_OnHand(n)］×（1 ＋ g）＋ Adj(n)<br><br>\n    <span class=\"cap-note\">OnHand(n)　＝ 第 n 月当前在手房晚（系统直接取数，无主观判断）<br>\n    LY(n)　　　　　＝ 上年同月售出房晚<br>\n    LY_OnHand(n) ＝ 上年同月、在同一预订窗口（同为 N 月 1 日）的在手房晚<br>\n    ［LY(n) − LY_OnHand(n)］＝ 上年同期的\"剩余增量空间\"，这是预测的核心锚<br>\n    g　　　　　　　＝ 市场增长假设（本店 A1：+4.0%）<br>\n    Adj(n)　　　　 ＝ 人工调整量（±，每一项必须写明理由与依据表，不得无理由填写）</span>\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">ADR 预测公式（在手与剩余分开算，再加权）</span>\n    F_ADR(n) ＝［OnHand(n) × 在手加权成交价 ＋ 剩余房晚 × 剩余预期成交价］÷ F(n)<br>\n    <span class=\"cap-note\">· 在手加权成交价：系统直接取数（已售部分的实际加权价）<br>\n    · 剩余房晚 ＝ F(n) − OnHand(n)<br>\n    · 剩余预期成交价：按当前价格日历中各需求等级的 BAR 加权，D1 × 150%、D2 × 120%、D3 × 100%、D4 × 85%</span>\n  </div>\n\n  <h3>12.2 误差容忍度与触发动作</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-matrix\">\n      <caption>表 11-6　滚动预测误差容忍度与触发动作表<span class=\"cap-note\">\"预测月距当前\"决定容忍带宽；超出即触发对应动作，不得观望</span></caption>\n      <thead>\n        <tr><th>预测月距当前</th><th>误差容忍度</th><th>超出时的判定</th><th>触发动作</th></tr>\n      </thead>\n      <tbody>\n        <tr><th class=\"rowh\">当月（N 月）</th><td class=\"num\"><b>±3%</b></td><td>已进入执行期，误差必须极小</td><td>逐日查表 A 调价 + 表 H 渠道开关；按表 I「0–3 天」窗口每日 2 次（10:00 / 17:00）盯 Pickup</td></tr>\n        <tr><th class=\"rowh\">次月（N+1 月）</th><td class=\"num\"><b>±5%</b></td><td>尚有一次完整调整窗口</td><td>按表 I「4–7 天」窗口（落后 10% 触发 48h 闪购）与「8–14 天」窗口（落后 15% 执行表 A 调价）分级处理</td></tr>\n        <tr><th class=\"rowh\">第 3 月（N+2 月）</th><td class=\"num\"><b>±8%</b></td><td>结构性偏差信号</td><td>按表 I「15–30 天」窗口（落后 20% 触发策略复盘 + 销售动员）执行；更新年度策略假设</td></tr>\n        <tr><th class=\"rowh\">3 个月以上（N+3 及以后）</th><td class=\"num\"><b>±15%</b></td><td>长线，允许较大偏差</td><td>按表 I「31–60 天」（落后 25% 启动协议客户拜访计划）与「&gt;60 天」（落后 30% 上报 L3、调整年度策略）处理</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">容忍度按\"房晚\"判，还是按\"收入\"判？</span>\n    <p><b>两个都要判，分别记录。</b>房晚预测误差用上表判断；收入预测误差<b>先拆成量差与价差（见 §13），再对量差部分套用上表</b>——因为价差部分通常由主动调价造成（比如你主动提价 8% 导致收入超预测 8%），这是决策结果，不是预测失误，不应触发行动。<br>\n    <b>只有\"非主动调价造成\"的价差才计入误差。</b>判断标准：查《调价台账》，若该月有对应方向的调价记录且幅度可解释该价差，则不计入误差。</p>\n  </div>\n\n  <h3>12.3 完整演示：3 月 1 日预测 4 月</h3>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>次月预测（容忍度 ±5%），含触发动作判定</div>\n    <div class=\"kv\">\n      <div class=\"kv-k\">4 月预算</div><div class=\"kv-v\">OCC 78.8%、售出房晚 <b>7,568</b>、ADR <b>¥650</b>、客房收入 <b>¥4,919,200</b></div>\n      <div class=\"kv-k\">已知数据</div><div class=\"kv-v\">\n        OnHand（今年 3/1 的 4 月在手）＝ <b>2,600</b> 房晚<br>\n        LY（上年 4 月售出）＝ <b>7,200</b> 房晚<br>\n        LY_OnHand（上年 3/1 的 4 月在手）＝ <b>3,000</b> 房晚<br>\n        g ＝ +4.0%（假设 A1）<br>\n        Adj ＝ <b>+120</b>（已确认 1 个会议团队 40 间 × 3 晚，持书面确认单）\n      </div>\n      <div class=\"kv-k\">算房晚</div><div class=\"kv-v\">\n        F(4月) ＝ 2,600 ＋（7,200 − 3,000）× 1.04 ＋ 120<br>\n        　　　 ＝ 2,600 ＋ 4,200 × 1.04 ＋ 120 ＝ 2,600 ＋ 4,368 ＋ 120 ＝ <b>7,088 房晚</b>\n      </div>\n      <div class=\"kv-k\">算 ADR</div><div class=\"kv-v\">\n        在手加权成交价 ＝ ¥640（系统取数）<br>\n        剩余房晚 ＝ 7,088 − 2,600 ＝ 4,488；剩余预期成交价 ＝ ¥660（按当前价格日历 D3 平峰 BAR 加权）<br>\n        F_ADR ＝（2,600 × 640 ＋ 4,488 × 660）÷ 7,088 ＝（1,664,000 ＋ 2,962,080）÷ 7,088<br>\n        　　　 ＝ 4,626,080 ÷ 7,088 ＝ <b>¥652.7</b>\n      </div>\n      <div class=\"kv-k\">算收入</div><div class=\"kv-v\">F(收入) ＝ 7,088 × 652.7 ＝ <b>¥4,626,338</b></div>\n      <div class=\"kv-k\">比预算</div><div class=\"kv-v\">\n        房晚差异 ＝ 7,088 − 7,568 ＝ <b>−480 房晚</b>（<span class=\"down\">↓6.34%</span>）<br>\n        收入差异 ＝ 4,626,338 − 4,919,200 ＝ <b>−¥292,862</b>（<span class=\"down\">↓5.95%</span>）\n      </div>\n      <div class=\"kv-k\">判定</div><div class=\"kv-v\">\n        房晚 <span class=\"down\">↓6.34%</span> &gt; 次月容忍度 ±5% → <span class=\"pill pill-red\">触发行动</span><br>\n        收入 <span class=\"down\">↓5.95%</span> &gt; 次月容忍度 ±5% → <span class=\"pill pill-red\">触发行动</span>\n      </div>\n      <div class=\"kv-k\">触发动作</div><div class=\"kv-v\">\n        <b>① 查表 A（逐日）</b>：把 4 月每一天按「预测 OCC × Pickup 偏差」交叉，得出调价清单。示例：某日预测 OCC 76%（行 70–85%）、Pickup 落后 12%（列 落后 &gt;10%）→ 动作 <span class=\"down\">↓5%</span>。<br>\n        <b>② 查表 I（按窗口）</b>：4 月各日当前落在「15–30 天」窗口，触发阈值为\"落后 20%\"。当前整体落后 6.34% &lt; 20% → <b>暂不启动策略复盘与销售动员</b>，但须写入《观察清单》，下周复核。<br>\n        <b>③ 更新滚动预测</b>：把 F(4月) = 7,088 写入预测表，并在备注栏写明\"落后 −6.34%，已执行表 A 调价，未达表 I 动员阈值\"。<br>\n        <b>④ 记入《调价台账》</b>：所有调价动作按表 M 09:55 环节留档。\n      </div>\n    </div>\n    <p class=\"card-note\"><b>关键教学点</b>：房晚预测落后 6.34%，但表 I 的动员阈值是 20%，<b>两者不矛盾</b>——表 I 的 20% 是\"相对上年同期在手的落后幅度\"（Pickup 维度），滚动预测的 5% 是\"相对本店预算房晚的落后幅度\"（预算维度）。两个维度的指标各管一段，都要看，不能互相替代。</p>\n  </div>\n\n  <\!-- ================= 差异分析 ================= -->\n  <h2 id=\"s11\">十三、差异分析：量差 vs 价差</h2>\n\n  <p>每月 1 日做完实际数据后，第一件事不是看\"超了还是没超\"，而是把差异<strong>拆成量差和价差</strong>。因为这两种差异的<strong>责任人和下一步动作完全不同</strong>。</p>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">差异分析四件套</span>\n    差异额 ＝ 实际客房收入 − 预算客房收入<br>\n    差异率 ＝ 差异额 ÷ 预算客房收入 × 100%<br>\n    <b>量差 ＝（实际房晚 − 预算房晚）× 预算 ADR</b><br>\n    <b>价差 ＝（实际 ADR − 预算 ADR）× 实际房晚</b><br>\n    校验：<span class=\"f-out\">量差 ＋ 价差 ＝ 差异额（必须完全相等，不等即算错）</span>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">为什么量差用\"预算 ADR\"、价差用\"实际房晚\"</span>\n    <p>这是<b>连环替代法</b>的标准顺序：先固定价格、看量的影响；再固定（新的）量、看价的影响。这样拆分后两部分之和<b>恰好等于总差异，没有残差</b>。<br>\n    若反过来写（量差用实际 ADR、价差用预算房晚），两部分之和会多出一个\"量价交互项\"，无法归因。<br>\n    <b>记忆口诀：量差用预算价，价差用实际量。</b></p>\n  </div>\n\n  <h3>13.1 差异归因对照表（谁该负责、下一步干什么）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 11-7　差异类型 → 责任部门 → 下一步动作<span class=\"cap-note\">差异分析的终点永远是\"下一步干什么\"，不是\"谁错了\"</span></caption>\n      <thead><tr><th>差异形态</th><th>量差</th><th>价差</th><th>典型成因</th><th>责任/协同部门</th><th>下一步动作</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>A 量价双超</b></td><td class=\"num\"><span class=\"up\">+</span></td><td class=\"num\"><span class=\"up\">+</span></td>\n          <td>需求强于预期，且提价成功</td><td>收益部（主）</td><td>把超预期的日子记入需求日历，明年升级为 D1/D2</td>\n        </tr>\n        <tr>\n          <td><b>B 量超价跌</b></td><td class=\"num\"><span class=\"up\">+</span></td><td class=\"num\"><span class=\"down\">−</span></td>\n          <td>以价换量；或团队/批发放量</td><td>销售部 + 收益部</td><td>若价差绝对值 &gt; 量差绝对值的 1.5 倍 → 查表 G 复核团队决策；否则视为主动策略，接受</td>\n        </tr>\n        <tr>\n          <td><b>C 量跌价超</b></td><td class=\"num\"><span class=\"down\">−</span></td><td class=\"num\"><span class=\"up\">+</span></td>\n          <td>提价过度；或竞对分流</td><td>收益部（主）+ 市场部</td><td>查表 C（ARI）与表 D（MPI）：若 ARI &gt;110 且 MPI &lt;95 → 按表 C 降 8%</td>\n        </tr>\n        <tr>\n          <td><b>D 量价双跌</b></td><td class=\"num\"><span class=\"down\">−</span></td><td class=\"num\"><span class=\"down\">−</span></td>\n          <td>需求塌陷；或有异常事件</td><td>全体</td><td>先查表 L（异常事件）排除应急情形；再按表 D 分级，MPI &lt;85 → 启动《应急方案 L2-E1》</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>13.2 完整演示：4 月差异分析</h3>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>从原始数据到归因结论</div>\n    <div class=\"kv\">\n      <div class=\"kv-k\">预算</div><div class=\"kv-v\">OCC 78.8%、售出房晚 <b>7,568</b>、ADR <b>¥650</b>、客房收入 <b>¥4,919,200</b></div>\n      <div class=\"kv-k\">实际</div><div class=\"kv-v\">OCC 78.0%、售出房晚 <b>7,488</b>（9,600 × 78.0%）、ADR <b>¥680</b>、客房收入 = 7,488 × 680 = <b>¥5,091,840</b></div>\n      <div class=\"kv-k\">差异额</div><div class=\"kv-v\">5,091,840 − 4,919,200 ＝ <span class=\"up\">＋¥172,640</span></div>\n      <div class=\"kv-k\">差异率</div><div class=\"kv-v\">172,640 ÷ 4,919,200 ＝ <span class=\"up\">↑3.51%</span>　<span class=\"pill pill-teal\">达标</span></div>\n      <div class=\"kv-k\">量差</div><div class=\"kv-v\">（7,488 − 7,568）× 650 ＝（−80）× 650 ＝ <span class=\"down\">−¥52,000</span></div>\n      <div class=\"kv-k\">价差</div><div class=\"kv-v\">（680 − 650）× 7,488 ＝ 30 × 7,488 ＝ <span class=\"up\">＋¥224,640</span></div>\n      <div class=\"kv-k\">校验</div><div class=\"kv-v\">−52,000 ＋ 224,640 ＝ <b>＋172,640</b> ＝ 差异额 ✓</div>\n      <div class=\"kv-k\">归因</div><div class=\"kv-v\">\n        形态 <b>C「量跌价超」</b>：房晚少了 80 间（<span class=\"down\">↓1.06%</span>），但 ADR 多了 ¥30（<span class=\"up\">↑4.62%</span>），净收益 <span class=\"up\">↑¥172,640</span>。<br>\n        这是<b>一次成功的主动提价</b>：用 1.06% 的量换来了 4.62% 的价。\n      </div>\n      <div class=\"kv-k\">动作</div><div class=\"kv-v\">\n        ① 查《调价台账》：确认 4 月是否有对应方向的提价记录（若 ADR <span class=\"up\">↑4.62%</span> 来自表 A 的 <span class=\"up\">↑5%</span> 动作，则价差属主动决策，<b>不计入预测误差</b>）<br>\n        ② 查表 C（ARI）：本店 ADR ¥680 ÷ 竞争组合加权 ADR ¥680 × 100 ＝ <b>ARI 100</b>，落在「97–103 健康」区间 → 维持<br>\n        ③ 查表 D（MPI）：若本店 OCC 78.0%、竞争组合 OCC 76.0% → MPI ＝ 78.0 ÷ 76.0 × 100 ＝ <b>102.6</b>，落在「100–110 健康」→ 维持<br>\n        ④ 结论：<b>维持当前策略</b>，把本次\"提价 <span class=\"up\">↑5%</span> 仅损失 1.06% 量\"的经验写入《月度收益复盘报告》，作为下个旺季提价的依据\n      </div>\n    </div>\n    <p class=\"card-note\"><b>反向情形</b>：若实际是 OCC 76.0%（房晚 7,296）、ADR ¥700，则量差 =（7,296 − 7,568）× 650 = <span class=\"down\">−¥176,800</span>，价差 = 50 × 7,296 = <span class=\"up\">＋¥364,800</span>，合计 <span class=\"up\">＋¥188,000</span>。表面看更好，但量跌 3.60% 而价只涨 7.69% —— 此时必须查 ARI：¥700 ÷ ¥680 × 100 = <b>ARI 102.9</b>，仍在健康区；但 MPI 若因竞对抢占而跌破 95，就要按表 D 处理。<b>差异越大，越要回到表 C / 表 D 做二次校验，不能只看差异额的正负。</b></p>\n  </div>\n\n</div>\n"}]}, {"n": 12, "t": "收益例会与会议", "part": "L3 经理", "mod": "模块 M12", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n<div class=\"crumb\">\n  <a href=\"../index.html\">学院首页</a><span>/</span>\n  <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n  L3 模块十二\n</div>\n\n<div class=\"page-head\">\n  <div class=\"badge-row\">\n    <span class=\"badge badge-l3\">L3 收益管理经理</span>\n    <span class=\"badge\">模块 M12</span>\n    <span class=\"badge\">6 课时 / 270 min</span>\n    <span class=\"badge\">认证权重 20%</span>\n  </div>\n  <h1 class=\"page-title\">会议与汇报：驱动组织行动</h1>\n  <p class=\"page-lede\">\n    数据再对，说不出来也白搭。这一模块给你现成的会议议程和话术脚本——\n    <b>学完就能用，用了就有效。</b>\n  </p>\n</div>\n\n<div class=\"card\">\n  <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n  <ul>\n    <li>能<b>独立主持</b>每日收益晨会、每周收益例会、每月经营分析会</li>\n    <li>能<b>独立写出</b>给业主的一页纸汇报（四个数字 + 三个动作 + 一个请求）</li>\n    <li>能<b>照念</b>四段标准话术，应对未达标、拒绝团队、拒绝降价、要求配合四种场合</li>\n    <li>能<b>说出</b>数据可视化的 5 条铁律，并指出违规图表错在哪</li>\n  </ul>\n  <p class=\"card-note\">前置要求：M11 年度预算（要会做量差价差归因）。本模块是 L3 最实用的部分之一。</p>\n</div>\n\n<div class=\"toc\">\n  <div class=\"toc-title\">本模块目录</div>\n  <ol>\n    <li><a href=\"#s0\">核心概念区</a></li>\n    <li><a href=\"#s1\">三层会议体系</a></li>\n    <li><a href=\"#s2\">《法典》表 N：周期节奏</a></li>\n    <li><a href=\"#s3\">一页纸法则</a></li>\n    <li><a href=\"#s4\">四段话术脚本</a></li>\n    <li><a href=\"#s5\">数据可视化五条铁律</a></li>\n    <li><a href=\"#s6\">讲师示范：月度经营分析会</a></li>\n    <li><a href=\"#s7\">学员跟练</a></li>\n    <li><a href=\"#quiz\">随堂测</a></li>\n    <li><a href=\"#memo\">判定表默写清单</a></li>\n  </ol>\n</div>\n\n<div class=\"card\" id=\"s0\" style=\"margin-top:4px\">\n  <div class=\"card-title\"><span class=\"ic\">◈</span>核心概念区（本模块 5 个新概念）</div>\n  <div class=\"grid grid-2\">\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">三层会议</div><div class=\"kv-v\">晨会管今天、周会管这周、月会管这个月，目的与产出各不相同</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">一页纸</div><div class=\"kv-v\">给业主的汇报 = 4 个数字 + 3 个动作 + 3 个计划 + 1 个请求</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">话术四步</div><div class=\"kv-v\">共情 → 算账 → 给方案 → 留余地，任何场景都能套</div></div>\n    </div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">可视化铁律</div><div class=\"kv-v\">一图一结论、红涨绿跌带箭头、禁双轴、表≤7 行、纵轴从 0</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 N</div><div class=\"kv-v\">周/月节奏表，把三层会议嵌进一张无法跳过的日历</div></div>\n    </div>\n  </div>\n  <p class=\"card-note\">这些概念在前序模块都出现过，本模块是把它们<b>组织成「开得了会、说得了话、拿得到资源」的动作</b>。</p>\n</div>\n\n<\!-- ============ 一、三层会议 ============ -->\n"}, {"id": "p1", "name": "一、三层会议体系", "min": 8, "desc": "", "html": "<h2 id=\"s1\">一、三层会议体系</h2>\n<p>\n  收益经理开三种会：<b>晨会解决今天，周会解决这周，月会解决这个月。</b>\n  三种会的目的、参会人、议程、铁律完全不同，不能用同一种方式开。\n</p>\n\n<h3>1. 每日收益晨会（15 分钟）</h3>\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>每日收益晨会<span class=\"cap-note\">站着开，15 分钟必须结束</span></caption>\n    <thead><tr><th class=\"mid\" style=\"width:90px\">项</th><th>内容</th></tr></thead>\n    <tbody>\n      <tr><td><b>时间</b></td><td>每日 10:05–10:20（收益动作执行完毕后）</td></tr>\n      <tr><td><b>参会</b></td><td>收益、销售、前厅、预订　<b>四个人必须到</b></td></tr>\n      <tr><td><b>议程</b></td><td>\n        ① 昨日实绩（OCC / ADR / RevPAR，1 分钟）<br>\n        ② 今日动作清单（我改了哪些价、设了哪些限制，3 分钟）<br>\n        ③ 未来 7 天风险提示（哪天在手落后、哪天可能满房，3 分钟）<br>\n        ④ 销售带来的大单 / 询价（需要收益当场报价，3 分钟）<br>\n        ⑤ 前厅的现场情况（客人反馈、满房压力、投诉，2 分钟）<br>\n        ⑥ 需要谁配合什么（明确到人，2 分钟）\n      </td></tr>\n      <tr><td><b>产出</b></td><td>会议纪要（一页，当天发群）</td></tr>\n      <tr><td><b>铁律</b></td><td><b>站着开。</b>站着开不会超时。有人坐下就说明跑题了。</td></tr>\n      <tr><td><b>超时怎么办</b></td><td>第 14 分钟主持人直接喊停，未完事项转为「会后单独聊」</td></tr>\n    </tbody>\n  </table>\n</div>\n\n<h3>2. 每周收益例会（60 分钟）</h3>\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>每周收益例会<span class=\"cap-note\">会上只做决策，不做讨论</span></caption>\n    <thead><tr><th class=\"mid\" style=\"width:90px\">项</th><th>内容</th></tr></thead>\n    <tbody>\n      <tr><td><b>时间</b></td><td>每周一 14:00–15:00</td></tr>\n      <tr><td><b>参会</b></td><td>收益（主持）、销售总监、前厅经理、市场、财务</td></tr>\n      <tr><td><b>议程</b></td><td>\n        ① 上周实绩 vs 预算 vs 去年（5 分钟）<br>\n        ② 本周三维诊断：RGI / MPI / ARI（8 分钟）<br>\n        ③ 未来 8 周预测更新（8 分钟）<br>\n        ④ 房型价差校验结果（表 F，5 分钟）<br>\n        ⑤ 渠道结构调整（表 H，8 分钟）<br>\n        ⑥ 团队 / 会议询价决策（表 G / 表 K，10 分钟）<br>\n        ⑦ 竞争动态（谁降价了、谁新开业，5 分钟）<br>\n        ⑧ 风险与机会清单（5 分钟）<br>\n        ⑨ 本周行动项分配（明确到人 + 截止时间，4 分钟）<br>\n        ⑩ 下周同期预告（2 分钟）\n      </td></tr>\n      <tr><td><b>产出</b></td><td>《周度收益报告》+ 行动项清单</td></tr>\n      <tr><td><b>铁律</b></td><td><b>会上只做决策，不做讨论。</b>需要讨论的议题，会前先一对一谈拢，会上只确认。</td></tr>\n      <tr><td><b>超时怎么办</b></td><td>⑥⑦ 两项最容易超时。设闹钟，超时直接顺延到下周并标注「连续未决」。</td></tr>\n    </tbody>\n  </table>\n</div>\n\n<h3>3. 每月经营分析会（90 分钟）</h3>\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>每月经营分析会<span class=\"cap-note\">每个数字后面必须跟一个动作</span></caption>\n    <thead><tr><th class=\"mid\" style=\"width:90px\">项</th><th>内容</th></tr></thead>\n    <tbody>\n      <tr><td><b>时间</b></td><td>每月 10 日 09:00–10:30</td></tr>\n      <tr><td><b>参会</b></td><td>总经理（主持）+ 全体部门负责人，<b>业主列席</b></td></tr>\n      <tr><td><b>议程</b></td><td>\n        ① 上月核心数字：OCC / ADR / RevPAR / GOP（实际 vs 预算 vs 去年，8 分钟）<br>\n        ② 三维诊断：RGI / MPI / ARI（10 分钟）<br>\n        ③ 量差价差归因（10 分钟）<br>\n        ④ 客源结构分析（细分占比 + 渠道成本 + NRevPAR，12 分钟）<br>\n        ⑤ 上月动作复盘：调价命中率（8 分钟）<br>\n        ⑥ 下月需求预测与策略（12 分钟）<br>\n        ⑦ 各部门协同事项（8 分钟）<br>\n        ⑧ 资源需求（8 分钟）<br>\n        ⑨ 风险与机会（6 分钟）<br>\n        ⑩ 行动项分配（5 分钟）<br>\n        ⑪ 一页纸摘要发放（2 分钟）<br>\n        ⑫ 下月会议时间确认（1 分钟）\n      </td></tr>\n      <tr><td><b>产出</b></td><td>《月度收益复盘报告》+ <b>一页纸摘要</b>（给业主）</td></tr>\n      <tr><td><b>铁律</b></td><td><b>每个数字后面必须跟一个动作。</b>只报数字不给动作的，会被总经理打断——这是好事，说明他在听。</td></tr>\n      <tr><td><b>超时怎么办</b></td><td>④⑦ 容易超时。提前把这两项做成书面材料发群里，会上只讲结论。</td></tr>\n    </tbody>\n  </table>\n</div>\n\n<div class=\"callout callout-key\">\n  <span class=\"co-t\">主持人的开场台词（每周例会，可直接照念）</span>\n  <p>\n    「各位，今天是 X 月 X 日的收益例会，60 分钟。议程我已经发群里了。<br>\n    先说规矩：今天会上只做决策，不做讨论。有需要讨论的，我们散会后单独约。<br>\n    先从数字开始——上周 RevPAR ¥XXX，比预算<span class=\"up\">↑3.2%</span>，比去年<span class=\"up\">↑5.8%</span>。\n    拆开看，量差 +X 万，价差 −X 万。我的判断是……」\n  </p>\n</div>\n\n<\!-- ============ 二、表 N ============ -->\n"}, {"id": "p2", "name": "二、《法典》表 N：周期节奏", "min": 8, "desc": "", "html": "<h2 id=\"s2\">二、《法典》表 N：周期节奏</h2>\n<p>三层会议不是孤立的，它们嵌在一整套周期节奏里。<b>漏掉任何一项，体系就会出现漏洞。</b></p>\n\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>表 N　周度／月度节奏表</caption>\n    <thead><tr><th>周期</th><th>动作</th><th>产出物</th><th class=\"mid\">承接会议</th></tr></thead>\n    <tbody>\n      <tr><td><b>每周一</b></td><td>房型价差校验（表 F）、未来 8 周预测更新、渠道开关复核（表 H）</td><td>《周度收益报告》</td><td class=\"mid\">周例会</td></tr>\n      <tr><td><b>每周三</b></td><td>竞争组合深度比价（含套餐 / 含早 / 取消政策）</td><td>比价深度表</td><td class=\"mid\">—</td></tr>\n      <tr><td><b>每周五</b></td><td>下周 D1/D2 日重点盯防、周末策略确认</td><td>《周末作战表》</td><td class=\"mid\">—</td></tr>\n      <tr><td><b>每月 1 日</b></td><td>上月复盘（RGI / MPI / ARI 三维诊断）、滚动预测更新</td><td>《月度收益复盘报告》</td><td class=\"mid\">月会预备</td></tr>\n      <tr><td><b>每月 5 日</b></td><td>客源结构分析、渠道贡献与净 RevPAR 分析</td><td>《客源渠道报告》</td><td class=\"mid\">月会预备</td></tr>\n      <tr><td><b>每月 10 日</b></td><td>业主 / 管理层汇报</td><td>汇报 PPT + 一页纸摘要</td><td class=\"mid\">月会</td></tr>\n      <tr><td><b>每季度</b></td><td>竞争组合复核、价格体系重构、协议客户分级</td><td>《季度策略文件》</td><td class=\"mid\">季度会</td></tr>\n      <tr><td><b>每年 9 月</b></td><td>下年度预算编制</td><td>《年度预算文件》</td><td class=\"mid\">预算会</td></tr>\n    </tbody>\n  </table>\n</div>\n\n<div class=\"callout callout-warn\">\n  <span class=\"co-t\">新手最容易漏的三项</span>\n  <ol style=\"margin:6px 0 0\">\n    <li><b>每周五的周末作战表</b>——周末是营收大头，周五不定策略，周一就只能复盘后悔。</li>\n    <li><b>每月 5 日的客源渠道报告</b>——只盯 OCC/ADR 会忽略渠道成本失控，NRevPAR 才是真相。</li>\n    <li><b>每季度的竞争组合复核</b>——竞对会开新店、会换档次，一年不看就失效了。</li>\n  </ol>\n</div>\n\n<\!-- ============ 三、一页纸 ============ -->\n"}, {"id": "p3", "name": "三、给业主的一页纸法则", "min": 8, "desc": "", "html": "<h2 id=\"s3\">三、给业主的一页纸法则</h2>\n<p>\n  业主看你的报告的时间通常<b>不超过 3 分钟</b>。超过一页，他就不会看；不看，你就拿不到资源。\n</p>\n\n<div class=\"card\">\n  <div class=\"card-title\"><span class=\"ic\">▤</span>这一页纸上只能有四样东西</div>\n  <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n    <h4>四个核心数字</h4>\n    <p>OCC / ADR / RevPAR / GOP，每个都要三组对比：<b>实际 vs 预算 vs 去年同期</b>。</p>\n  </div></div>\n  <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n    <h4>三个动作</h4>\n    <p>上个月我做了什么、效果如何。<b>只写三个</b>，多了记不住。</p>\n  </div></div>\n  <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n    <h4>下个月我要做什么</h4>\n    <p>同样三个，每条要能对应到一个具体数字目标。</p>\n  </div></div>\n  <div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n    <h4>一个请求</h4>\n    <p>需要业主或总经理批准、支持的一件事。<b>只写一个</b>——写多了等于一个都不提。</p>\n  </div></div>\n</div>\n\n<div class=\"grid grid-2\">\n  <div class=\"card\">\n    <div class=\"card-title\">✕ 反面示例</div>\n    <p style=\"font-size:13.5px;color:var(--ink-2);margin:0\">\n      一份 18 页的 PPT，第 1 页封面，第 2–3 页目录与说明，第 4–15 页是 12 张图表，\n      第 16 页是下月计划，第 17–18 页附录。业主翻到第 4 页就放下了。<br><br>\n      <b>问题：没有结论，没有请求。</b>\n    </p>\n  </div>\n  <div class=\"card\">\n    <div class=\"card-title\">✓ 正面示例（云璟酒店 10 月）</div>\n    <div class=\"kv\" style=\"margin:0\">\n      <div class=\"kv-row\"><div class=\"kv-k\">OCC</div><div class=\"kv-v\">85.2%　预算 85.0%　去年 82.1%</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">ADR</div><div class=\"kv-v\">¥706　预算 ¥700　去年 ¥672</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">RevPAR</div><div class=\"kv-v\">¥602　预算 ¥595　去年 ¥552</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">GOP</div><div class=\"kv-v\">¥298 万　预算 ¥290 万　去年 ¥261 万</div></div>\n    </div>\n    <p style=\"font-size:13px;margin:10px 0 0;color:var(--ink-2)\">\n      <b>做了：</b>① 国庆 7 天提前 30 天锁价，ADR <span class=\"up\">↑18%</span>；\n      ② 关掉批发商，省佣金 ¥12 万；③ 协议客户分级，砍掉 8 家低效客户。<br>\n      <b>下月：</b>① 11 月会展周提价 12%；② OTA 占比从 31% 压到 28%；③ 上线会员专享价。<br>\n      <b>请求：</b>批准 ¥8 万预算，用于小程序直销改造（预计 6 个月回本）。\n    </p>\n  </div>\n</div>\n\n<div class=\"callout callout-danger\">\n  <span class=\"co-t\">最容易被忽略的第四项</span>\n  <p>\n    很多人的汇报停在「下个月我要做什么」，<b>忘了提请求</b>。\n    但月度汇报是你<b>唯一能稳定拿到资源的场合</b>——不提请求，等于放弃了这个机会。<br>\n    请求要具体、要小、要能算回本周期。「给我 8 万做直销改造，6 个月回本」比「希望公司重视直销」强一百倍。\n  </p>\n</div>\n\n<\!-- ============ 四、话术 ============ -->\n"}, {"id": "p4", "name": "四、四段话术脚本（可直接照念）", "min": 8, "desc": "", "html": "<h2 id=\"s4\">四、四段话术脚本（可直接照念）</h2>\n<p>\n  这四段话是 L3 学员回去立刻用得上、且别人教不了的东西。\n  <b>课上要让学员站起来念一遍</b>——光看没用，必须开口。\n</p>\n\n<div class=\"dialogue\">\n  <div class=\"dlg-row\">\n    <div class=\"dlg-who\">场景一<br>向总经理汇报未达标</div>\n    <div class=\"dlg-text\">\n      <b>收益：</b>「王总，上月 RevPAR 差预算 6.2%，我先把原因说清楚。」<br>\n      <b>总经理：</b>「差多少？」（打断）<br>\n      <b>收益：</b>「拆开看：量差 −19 万，价差 +11 万，净差 −8 万。<b>是提价提早了，把量打没了。</b>」<br>\n      <b>总经理：</b>「那你为什么提早提价？」<br>\n      <b>收益：</b>「当时 30 天窗口在手领先去年 12%，按表 A 应该提 5%。但后来展会取消了，\n      这部分在手退掉了——这是表 L 的异常事件，我识别晚了两天。」<br>\n      <b>总经理：</b>「这个月怎么办？」<br>\n      <b>收益：</b>「一分为二：前半月保量，按表 A 降到 −3%；后半月会展周按表 A 提到 +12%。\n      目标 RevPAR ¥560，比预算低 2%，但比上月<span class=\"up\">↑9%</span>。」<br>\n      <b>总经理：</b>「行。下周把数据给我看。」<br>\n      <b>收益：</b>「好。另外我需要一件事：展会这类信息，能否让销售每周同步一次给我？」\n    </div>\n  </div>\n</div>\n\n<div class=\"callout callout-key\">\n  <span class=\"co-t\">这段好在哪</span>\n  <p>① 先认账，不找借口；② 用<b>量差价差</b>把问题拆成技术语言，不带情绪；\n  ③ 主动承认自己识别晚了两天的失误（<b>主动认错比被追问出错误体面得多</b>）；\n  ④ 给具体动作和数字目标；⑤ 最后提请求。</p>\n</div>\n\n<div class=\"dialogue\">\n  <div class=\"dlg-row\">\n    <div class=\"dlg-who\">场景二<br>拒绝销售的团队价</div>\n    <div class=\"dlg-text\">\n      <b>销售：</b>「这个团 80 间，¥380 一间，客户跟了三年了，不能拒。」<br>\n      <b>收益：</b>「李总，这个客户我知道，跟了很久，你的辛苦我清楚。」<br>\n      <b>销售：</b>「那你签不签？」<br>\n      <b>收益：</b>「我算笔账给你听：那天预测 OCC 88%，预期散客 ADR ¥680。\n      按表 G，比率 R = 380 ÷ 680 = 56%，落在「55–65%」这一行、OCC&gt;85% 这一列——<b>这一格是拒绝。</b>」<br>\n      <b>销售：</b>「你这是拿表压我。」<br>\n      <b>收益：</b>「不是压你，是给你弹药。你回去跟客户说：80 间 ×（680−380）= <b>置换成本 2 万 4</b>。\n      谈到 ¥520 我立刻签，或者减到 30 间、¥380 也行。」<br>\n      <b>销售：</b>「客户不可能加到 520。」<br>\n      <b>收益：</b>「那就减到 30 间。或者换个日期——11 号那天 OCC 预测只有 61%，¥380 我能给 60 间。」<br>\n      <b>销售：</b>「……行，我先去谈。」\n    </div>\n  </div>\n</div>\n\n<div class=\"callout callout-do\">\n  <span class=\"co-t\">关键技巧：把立场之争变成算术题</span>\n  <p>\n    不要说「公司规定不能接」——这会让销售觉得你在拿制度压人。<br>\n    <b>要说「置换成本 2 万 4，谈到 520 我立刻签」</b>——这把问题变成了客户的报价问题，\n    你和销售站到了同一边。\n  </p>\n</div>\n\n<div class=\"dialogue\">\n  <div class=\"dlg-row\">\n    <div class=\"dlg-who\">场景三<br>解释为什么不跟竞对降价</div>\n    <div class=\"dlg-text\">\n      <b>总经理：</b>「隔壁亚朵 S 降到 480 了，我们还在 620，要不要跟？」<br>\n      <b>收益：</b>「先说数据：我们 MPI 105，份额还在涨——<b>说明客人并没有被他抢走。</b>」<br>\n      <b>总经理：</b>「但他便宜 140 块。」<br>\n      <b>收益：</b>「是。但我们算了：如果跟到 480，全年少收约 300 万。而现在我们的 ARI 是 91，\n      本来就已经略低于竞争组合了，再降就掉到 75 以下——表 C 判定「严重偏低」。」<br>\n      <b>总经理：</b>「那客人跑了怎么办？」<br>\n      <b>收益：</b>「不跟价，<b>加价值</b>：含双早（成本 ¥68/人）、免费升级一档、延迟退房到 14 点。\n      成本不到 ¥150，但客人感知价值超过降价 140。而且不会破坏价格体系。」<br>\n      <b>总经理：</b>「能撑多久？」<br>\n      <b>收益：</b>「给我两周。两周后我拿 MPI 和 Pickup 数据回来复盘，如果份额掉了，我们再议降价。」\n    </div>\n  </div>\n</div>\n\n<div class=\"dialogue\">\n  <div class=\"dlg-row\">\n    <div class=\"dlg-who\">场景四<br>要求前厅配合升级</div>\n    <div class=\"dlg-text\">\n      <b>前厅：</b>「客人是金卡，都站前台了，你不给他升级说不过去吧？」<br>\n      <b>收益：</b>「按表 J，顺序是钻石 &gt; 铂金 &gt; 金 &gt; 银。今天在住的有两位铂金还没升。」<br>\n      <b>前厅：</b>「那两位还没到店啊。」<br>\n      <b>收益：</b>「他们在 18 点前会到。金卡客人我给你另一个方案：<b>双早 + 延迟退房</b>，\n      成本 ¥136，比升级一档（¥140 差价）还低一点，但客人感受到的是两样东西。」<br>\n      <b>前厅：</b>「每次都要找你确认，太麻烦了。」<br>\n      <b>收益：</b>「不用找我。我把表 J 做成一张卡片贴在你们工位上，照着执行就行。\n      只有套房升级才需要问我——每天最多 3 间。」<br>\n      <b>前厅：</b>「那行吧。」<br>\n      <b>收益：</b>「另外，配合得好的话，我月度会上会点名表扬前厅。这个月升级投诉\n      已经从 11 起降到 3 起了，是你们的功劳。」\n    </div>\n  </div>\n</div>\n\n<div class=\"callout callout-warn\">\n  <span class=\"co-t\">四段话术的共同结构</span>\n  <div class=\"flow\" style=\"margin-top:10px\">\n    <div class=\"flow-item\"><div class=\"fi-t\">① 共情</div><div class=\"fi-d\">先承认对方的立场和辛苦</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">② 算账</div><div class=\"fi-d\">用数据和表说话，不带情绪</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">③ 给方案</div><div class=\"fi-d\">不只说不行，要给替代方案</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">④ 留余地</div><div class=\"fi-d\">给观察期、给条件、给台阶</div></div>\n  </div>\n  <p style=\"margin:10px 0 0\"><b>记住这个顺序，任何场景都能套。</b></p>\n</div>\n\n<\!-- ============ 五、可视化 ============ -->\n"}, {"id": "p5", "name": "五、数据可视化五条铁律", "min": 8, "desc": "", "html": "<h2 id=\"s5\">五、数据可视化五条铁律</h2>\n\n<div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n  <h4>一图一结论</h4>\n  <p>每张图下面必须写一句话结论。<b>没有结论的图删掉。</b>如果一句话说不清，说明这张图没想清楚。</p>\n</div></div>\n<div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n  <h4>涨跌配色：红涨绿跌，且必须带箭头</h4>\n  <p>中国习惯：<span class=\"up\">上涨用红</span>，<span class=\"down\">下跌用绿</span>。\n  但<b>不能只靠颜色</b>——色盲和黑白打印都会失效，所以每个数字都要带 ↑↓ 箭头。</p>\n</div></div>\n<div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n  <h4>禁止双轴</h4>\n  <p>OCC 和 ADR 画在一张图用两个纵轴，会让两条线的交点看起来有意义，其实纯属巧合——\n  这是在误导读者。<b>要么分两张图，要么改用 RevPAR 一个指标。</b></p>\n</div></div>\n<div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n  <h4>表格不超过 7 行</h4>\n  <p>超过 7 行没人看。<b>要突出重点就只列前 5 名 + 其他 + 合计。</b>\n  完整数据放附件。</p>\n</div></div>\n<div class=\"step\"><div class=\"step-num\">5</div><div class=\"step-body\">\n  <h4>纵轴从 0 开始</h4>\n  <p>截断纵轴会把 2% 的波动画成 50% 的悬崖，这叫<b>图表撒谎</b>。\n  想突出细节，改用表格或标注具体数值。</p>\n</div></div>\n\n<div class=\"callout callout-key\">\n  <span class=\"co-t\">讲师示范：指出这张图错在哪</span>\n  <p>\n    「某酒店月度汇报：一张双轴图，左轴 OCC（50%–90%），右轴 ADR（¥500–¥750），\n    两条线在 7 月交叉。结论写的是『7 月出现拐点，房价与出租率背离』。」<br><br>\n    <b>错在三处：</b>① 用了双轴（违反铁律 3）；② 两个纵轴都截断了（违反铁律 5）；\n    ③ 结论是看图说话，不是看数说话——7 月 OCC 70%、ADR ¥580，RevPAR ¥406，\n    比 6 月的 ¥471 低，<b>真正的问题是 RevPAR 掉了 14%，不是什么「背离」</b>。\n  </p>\n</div>\n\n<\!-- ============ 六、讲师示范 ============ -->\n"}, {"id": "p6", "name": "六、讲师示范：一场完整的月度经营分析会", "min": 8, "desc": "", "html": "<h2 id=\"s6\">六、讲师示范：一场完整的月度经营分析会</h2>\n<p>以云璟酒店 10 月为例，完整走一遍月会。记住月会铁律：<b>每个数字后面必须跟一个动作</b>。</p>\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>云璟 10 月月会 · 90 分钟全流程</caption>\n    <thead><tr><th class=\"mid\" style=\"width:64px\">环节</th><th>讲师动作（可直接照念）</th><th class=\"mid\" style=\"width:54px\">用时</th></tr></thead>\n    <tbody>\n      <tr><td><b>开场</b></td><td>「各位，10 月复盘，90 分钟。我只报结论和动作，细节看群里材料。」</td><td class=\"mid\">1′</td></tr>\n      <tr><td><b>数字</b></td><td>OCC 85.2%（预算 85.0%）<span class=\"up\">达标</span>；ADR ¥706（预算 ¥700）<span class=\"up\">↑0.9%</span>；RevPAR ¥602（预算 ¥595）<span class=\"up\">↑1.2%</span>；GOP ¥298 万（预算 ¥290 万）<span class=\"up\">↑2.8%</span>。</td><td class=\"mid\">8′</td></tr>\n      <tr><td><b>诊断</b></td><td>RGI = 本店 RevPAR ¥602 ÷ 组合 RevPAR ¥545 ×100 = <b>110.5</b> → 综合竞争力领先；MPI 105、ARI 91（略低）。</td><td class=\"mid\">10′</td></tr>\n      <tr><td><b>归因</b></td><td>量差 +¥9 万（国庆锁价提量），价差 −¥3 万（批发商占比偏高），净差 +¥6 万。</td><td class=\"mid\">10′</td></tr>\n      <tr><td><b>动作 1</b></td><td>国庆 7 天提前 30 天锁价，ADR <span class=\"up\">↑18%</span> → <b>延续写进明年预算</b>。</td><td class=\"mid\">12′</td></tr>\n      <tr><td><b>动作 2</b></td><td>OTA 占比 31% 偏高、NRevPAR 被佣金吃掉 → <b>下月压到 28%，申请直销改造预算</b>。</td><td class=\"mid\">12′</td></tr>\n      <tr><td><b>风险</b></td><td>11 月展会周预测 OCC 96%，但竞对 B 新开 40 间 → <b>已设 MinLOS 2 + 关批发商</b>。</td><td class=\"mid\">6′</td></tr>\n      <tr><td><b>请求</b></td><td>「请批准 ¥8 万小程序直销改造预算，6 个月回本。」</td><td class=\"mid\">5′</td></tr>\n      <tr><td><b>收尾</b></td><td>发一页纸摘要，确认下月 10 日会议时间。</td><td class=\"mid\">2′</td></tr>\n    </tbody>\n  </table>\n</div>\n<div class=\"callout callout-key\">\n  <span class=\"co-t\">示范要点</span>\n  <p>① 开场先定规矩（只报结论）；② 四个数字都带「实际 vs 预算」；③ 诊断用 RGI / MPI / ARI 三指标；\n  ④ 归因用「量差价差」避免情绪化；⑤ 两个动作都对应具体数字；⑥ 最后落到「一个请求」——这是拿资源的关键。</p>\n</div>\n\n"}, {"id": "p7", "name": "七、学员跟练（4 题）", "min": 8, "desc": "", "html": "<h2 id=\"s7\">七、学员跟练（4 题）</h2>\n<p>用云璟真实数据独立练。答案在折叠里，<b>先自己做再对</b>。</p>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 1</div>\n  <div class=\"q-b\">给你一组数字：本月 OCC 79.0%（预算 82.0%）、ADR ¥612（预算 ¥610）、GOP ¥241 万（预算 ¥255 万）。月会上你先报哪句话？为什么？</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    先报结论：<b>OCC 差预算 3 个百分点、GOP 差 14 万，是本月主要缺口</b>；ADR 基本达标，所以问题在「量」不在「价」。\n    按话术四步：共情（承认没达标）→ 算账（量差为主）→ 给方案（保量：开闪购 / 长住产品）→ 留余地（两周后复盘 MPI 与 Pickup）。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 2</div>\n  <div class=\"q-b\">总经理要求把月报从 18 页 PPT 改成「一页纸」。你保留哪四样？如果只能留两个数字，留哪两个？</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    保留四样：① 四个核心数字（OCC / ADR / RevPAR / GOP 各带实际 vs 预算 vs 去年）；② 三个动作；③ 下月三个计划；④ 一个请求。<br><br>\n    若只留两个数字，留 <b>RevPAR</b>（第一指标）和 <b>GOP</b>（最终考核）——一个看收益效率，一个看赚钱能力，业主最关心后者。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 3</div>\n  <div class=\"q-b\">周会上销售拿来一个 60 间、¥430 的团，入住日预测 OCC 90%、预期散客 ADR ¥700。按表 G 你当场怎么判？话术第一步说什么？</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    R = 430 ÷ 700 = <b>61.4%</b>，落在「55% ≤ R &lt; 65%」行；预测 OCC 90% 落在「&gt;85%」列 → <b>拒绝</b>（表 G）。<br><br>\n    话术第一步<b>共情</b>：「这个客户跟你很久，你的辛苦我清楚。」<br>\n    第二步<b>算账</b>：置换成本 = 60 ×(700−430) = 1 万 6，谈到 ¥560 我立刻签，或减到 20 间、¥430 也行。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 4</div>\n  <div class=\"q-b\">一张月报图：双轴，左轴 OCC、右轴 ADR，两条线 8 月交叉，结论写「8 月量价背离」。你作为听众第一句问什么？</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    第一句：<b>「RevPAR 8 月是多少？比 7 月高还是低？」</b>——把问题拉回唯一指标。<br><br>\n    若 8 月 OCC 72%、ADR ¥590，RevPAR = ¥425，比 7 月 ¥471 低 9.8%，则真实结论是「RevPAR 下滑近 10%，需查表 L 是否有异常事件」，而不是什么「背离」。\n    这正好命中可视化铁律 1（一图一结论）和铁律 3（禁双轴）。\n  </div></details>\n</div>\n\n<\!-- ============ 随堂测 ============ -->\n<h2 id=\"quiz\">八、随堂测（5 题）</h2>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 1 题</div>\n  <div class=\"q-b\">每日收益晨会的铁律是什么？为什么要这样规定？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    <b>站着开，15 分钟必须结束。</b><br>\n    原因：站着开人会有时间压力，不会跑题、不会超时。有人坐下就说明话题已经偏离日常执行，\n    应该转为会后单独讨论。晨会的目的是<b>同步信息和分配动作</b>，不是讨论问题。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 2 题</div>\n  <div class=\"q-b\">给业主的一页纸上必须有哪四样东西？哪一样最容易被忽略？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    ① 四个核心数字（OCC / ADR / RevPAR / GOP，实际 vs 预算 vs 去年）；\n    ② 三个动作（上月做了什么、效果）；③ 下月要做什么；④ <b>一个请求</b>。<br><br>\n    <b>第四项「一个请求」最容易被忽略。</b>但月度汇报是唯一能稳定拿到资源的场合，\n    不提请求等于放弃机会。请求要具体、要小、要能算出回本周期。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 3 题</div>\n  <div class=\"q-b\">销售拿来一个 80 间 ¥380 的团，入住日预测 OCC 88%、预期散客 ADR ¥680。\n  按《法典》表 G 该怎么判？你准备怎么跟销售说？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    比率 R = 380 ÷ 680 = <b>55.9%</b>，落在「55% ≤ R &lt; 65%」这一行；\n    预测 OCC 88% 落在「&gt;85%」这一列 → <b>拒绝</b>（依据《法典》表 G）。<br><br>\n    跟销售说：<b>先共情</b>（「这个客户跟了三年，你的辛苦我清楚」）→\n    <b>再算账</b>（「置换成本 = 80 ×(680−380) = 2 万 4」）→\n    <b>给方案</b>（「谈到 ¥520 我立刻签，或者减到 30 间，或者换到 11 号那天 OCC 61% 的日子」）→\n    <b>留余地</b>（「如果战略意义大，我们报 L3 一起评估」）。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 4 题</div>\n  <div class=\"q-b\">总经理要求跟竞对降价到 ¥480（本店现价 ¥620，竞争组合均价 ¥680）。\n  按《法典》表 C 现在本店 ARI 是多少？跟降到 480 后 ARI 会变成多少、判定是什么？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    现在 ARI = 620 ÷ 680 × 100 = <b>91.2</b> → 落在「90–97」档，判定<b>略低</b>；\n    预测 OCC ≥80% 才提 3%，否则维持。<br><br>\n    跟降到 480 后 ARI = 480 ÷ 680 × 100 = <b>70.6</b> → 落在「&lt;80」档，判定<b>严重偏低</b>，\n    按表 C 反而应该<b>提价 8%</b>。<br><br>\n    <b>所以不该跟。</b>正确做法是加价值（含早、升级、延迟退房）而不是降价，\n    并给总经理一个两周的观察期，用 MPI 和 Pickup 数据复盘。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 5 题</div>\n  <div class=\"q-b\">指出这张图的问题：「双轴图，左轴 OCC 50%–90%，右轴 ADR ¥500–¥750，\n  7 月两线交叉，结论写『7 月出现拐点，房价与出租率背离』」。</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    违反三条铁律：<br>\n    ① <b>用了双轴</b>（铁律 3）——两条线的交点纯属坐标巧合，没有业务含义；<br>\n    ② <b>两个纵轴都截断</b>（铁律 5）——把小幅波动画成了悬崖，属于图表撒谎；<br>\n    ③ <b>结论是看图说话</b>（铁律 1）——真正的数字是：7 月 OCC 70%、ADR ¥580、\n    RevPAR ¥406，比 6 月 ¥471 低 14%。<b>结论应该是「7 月 RevPAR 下滑 14%，\n    量价双失，需查表 L 是否有异常事件」，而不是什么「背离」。</b>\n  </div></details>\n</div>\n\n<h2 id=\"memo\">九、判定表默写清单</h2>\n<p>本模块结业前，必须能不翻资料默写以下条目：</p>\n<ul class=\"checklist\">\n  <li>三层会议时间铁律：晨会每日 10:05 站着 15′；周会周一 14:00「只决策不讨论」；月会每月 10 日 09:00「数字后必跟动作」。</li>\n  <li>一页纸四要素：4 个数字（实际 vs 预算 vs 去年）+ 3 个动作 + 3 个计划 + 1 个请求；最易漏的是「请求」。</li>\n  <li>话术四步顺序：共情 → 算账 → 给方案 → 留余地；把立场之争变成算术题。</li>\n  <li>表 N 三件最易漏：周五周末作战表、每月 5 日客源渠道报告（看 NRevPAR）、每季度竞争组合复核。</li>\n  <li>可视化五铁律：一图一结论、红涨绿跌带箭头、禁双轴、表≤7 行、纵轴从 0。</li>\n</ul>\n\n<div class=\"callout callout-do\">\n  <span class=\"co-t\">本模块产出物</span>\n  <ul style=\"margin:6px 0 0\">\n    <li>三份会议议程（晨会 / 周会 / 月会）——可直接打印使用</li>\n    <li>一份给业主的一页纸汇报（用你酒店上月真实数据）</li>\n    <li>四段话术——<b>课上站起来各念一遍</b></li>\n  </ul>\n</div>\n\n<div class=\"p-title\">M11 年度预算与滚动预测</div></a>\n  <a href=\"m13.html\" class=\"p-next\"><div class=\"p-dir\">下一模块 →</div><div class=\"p-title\">M13 跨部门协同与变革推动</div></a>\n</div>\n\n</div>\n"}]}, {"n": 13, "t": "团队与组织", "part": "L3 经理", "mod": "模块 M13", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n<div class=\"crumb\">\n  <a href=\"../index.html\">学院首页</a><span>/</span>\n  <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n  L3 模块十三\n</div>\n\n<div class=\"page-head\">\n  <div class=\"badge-row\">\n    <span class=\"badge badge-l3\">L3 收益管理经理</span>\n    <span class=\"badge\">模块 M13</span>\n    <span class=\"badge\">6 课时 / 270 min</span>\n    <span class=\"badge\">认证权重 15%</span>\n  </div>\n  <h1 class=\"page-title\">跨部门协同与变革推动</h1>\n  <p class=\"page-lede\">\n    收益管理不是一个人干的事。<b>数据让人服，利益让人动</b>——\n    这一模块教你怎么让别人愿意配合你。\n  </p>\n</div>\n\n<div class=\"card\">\n  <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n  <ul>\n    <li>能<b>说出</b>六个部门各自的 KPI、痛点，以及收益需要他们配合什么</li>\n    <li>能<b>照念</b>异议应对库中至少 10 组「对方说 / 你答」</li>\n    <li>能<b>设计</b>一套推动工具组合（看板 + 排名 + 激励 + 复盘会）</li>\n    <li>能<b>制定</b>变革落地六步计划，并给出合理的时间预期</li>\n  </ul>\n  <p class=\"card-note\">前置要求：M12 会议与汇报。本模块与 M12 是 L3 最有实战价值的两块。</p>\n</div>\n\n<div class=\"toc\">\n  <div class=\"toc-title\">本模块目录</div>\n  <ol>\n    <li><a href=\"#s0\">核心概念区</a></li>\n    <li><a href=\"#s1\">六个部门的接口与诉求</a></li>\n    <li><a href=\"#s2\">异议应对库（14 组）</a></li>\n    <li><a href=\"#s3\">推动工具箱</a></li>\n    <li><a href=\"#s4\">变革落地六步</a></li>\n    <li><a href=\"#s5\">八种失败模式</a></li>\n    <li><a href=\"#s6\">讲师示范：协同冲突处置</a></li>\n    <li><a href=\"#s7\">学员跟练</a></li>\n    <li><a href=\"#quiz\">随堂测</a></li>\n    <li><a href=\"#memo\">判定表默写清单</a></li>\n  </ol>\n</div>\n\n<div class=\"card\" id=\"s0\" style=\"margin-top:4px\">\n  <div class=\"card-title\"><span class=\"ic\">◈</span>核心概念区（本模块 5 个新概念）</div>\n  <div class=\"grid grid-2\">\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">部门 KPI 差</div><div class=\"kv-v\">协同的本质不是说服对方，而是找到双方 KPI 都受益的方案</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">异议四步</div><div class=\"kv-v\">共情 → 算账 → 给方案 → 留余地，把立场之争变成算术题</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">四工具</div><div class=\"kv-v\">看板 + 排名 + 激励挂钩 + 案例复盘会，组合使用</div></div>\n    </div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">变革六步</div><div class=\"kv-v\">成绩 → 公开 → 守信 → 制度化 → 利益挂钩 → 盟友，3–6 个月</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">八失败</div><div class=\"kv-v\">最致命的是「承诺了没做到」——一次失信前功尽弃</div></div>\n    </div>\n  </div>\n  <p class=\"card-note\">数据让人服，利益让人动。本模块教你怎么让别的部门<b>主动</b>来找你配合。</p>\n</div>\n\n<\!-- ============ 一、六个部门 ============ -->\n"}, {"id": "p1", "name": "一、六个部门的接口与诉求", "min": 8, "desc": "", "html": "<h2 id=\"s1\">一、六个部门的接口与诉求</h2>\n<p>\n  要让人配合，先得知道<b>他要什么、怕什么</b>。\n  下面这张表是本模块最核心的工具——把它打印出来，贴在你的工位上。\n</p>\n\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>六个部门：KPI / 痛点 / 要他配合什么 / 怎么让他愿意</caption>\n    <thead>\n      <
