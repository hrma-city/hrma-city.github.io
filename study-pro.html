s=\"num\">60</td><td class=\"num\">1.742</td><td class=\"num\">1</td><td class=\"num\">.742</td><td class=\"num\"><b>2</b> ← 余数第 1</td></tr>\n        <tr><td><code>SUP-T</code></td><td>高级双床房</td><td class=\"num\">40</td><td class=\"num\">1.161</td><td class=\"num\">1</td><td class=\"num\">.161</td><td class=\"num\"><b>1</b></td></tr>\n        <tr><td><code>DLX-K</code></td><td>豪华大床房</td><td class=\"num\">45</td><td class=\"num\">1.306</td><td class=\"num\">1</td><td class=\"num\">.306</td><td class=\"num\"><b>1</b></td></tr>\n        <tr><td><code>DLX-V</code></td><td>豪华江景房</td><td class=\"num\">15</td><td class=\"num\">0.435</td><td class=\"num\">0</td><td class=\"num\">.435</td><td class=\"num\"><b>0</b> ← 余数第 4，名额已分完</td></tr>\n        <tr><td><code>EXE-K</code></td><td>行政大床房</td><td class=\"num\">25</td><td class=\"num\">0.726</td><td class=\"num\">0</td><td class=\"num\">.726</td><td class=\"num\"><b>1</b> ← 余数第 2</td></tr>\n        <tr><td><code>EXE-T</code></td><td>行政双床房</td><td class=\"num\">5</td><td class=\"num\">0.145</td><td class=\"num\">0</td><td class=\"num\">.145</td><td class=\"num\"><b>0</b></td></tr>\n        <tr><td><code>STE-B</code></td><td>商务套房</td><td class=\"num\">8</td><td colspan=\"4\" class=\"num\"><b>不参与超售</b></td></tr>\n        <tr><td><code>STE-E</code></td><td>行政套房</td><td class=\"num\">2</td><td colspan=\"4\" class=\"num\"><b>不参与超售</b></td></tr>\n        <tr><td colspan=\"3\"><b>合计</b></td><td class=\"num\"><b>9.000</b></td><td class=\"num\"><b>6</b></td><td class=\"num\">—</td><td class=\"num\"><b>9</b> ✓</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 7-9　案例 ④（超售 15 间，受硬上限封顶）的房型级分配</caption>\n      <thead><tr><th>房型代码</th><th class=\"num\">间数</th><th class=\"num\">配额（未取整）</th><th class=\"num\">取整</th><th class=\"num\">余数</th><th class=\"num\">最终配额</th></tr></thead>\n      <tbody>\n        <tr><td><code>STD-K</code></td><td class=\"num\">70</td><td class=\"num\">3.387</td><td class=\"num\">3</td><td class=\"num\">.387</td><td class=\"num\"><b>3</b></td></tr>\n        <tr><td><code>STD-T</code></td><td class=\"num\">50</td><td class=\"num\">2.419</td><td class=\"num\">2</td><td class=\"num\">.419</td><td class=\"num\"><b>3</b> ← 余数第 4</td></tr>\n        <tr><td><code>SUP-K</code></td><td class=\"num\">60</td><td class=\"num\">2.903</td><td class=\"num\">2</td><td class=\"num\">.903</td><td class=\"num\"><b>3</b> ← 余数第 2</td></tr>\n        <tr><td><code>SUP-T</code></td><td class=\"num\">40</td><td class=\"num\">1.935</td><td class=\"num\">1</td><td class=\"num\">.935</td><td class=\"num\"><b>2</b> ← 余数第 1</td></tr>\n        <tr><td><code>DLX-K</code></td><td class=\"num\">45</td><td class=\"num\">2.177</td><td class=\"num\">2</td><td class=\"num\">.177</td><td class=\"num\"><b>2</b></td></tr>\n        <tr><td><code>DLX-V</code></td><td class=\"num\">15</td><td class=\"num\">0.726</td><td class=\"num\">0</td><td class=\"num\">.726</td><td class=\"num\"><b>1</b> ← 余数第 3</td></tr>\n        <tr><td><code>EXE-K</code></td><td class=\"num\">25</td><td class=\"num\">1.210</td><td class=\"num\">1</td><td class=\"num\">.210</td><td class=\"num\"><b>1</b></td></tr>\n        <tr><td><code>EXE-T</code></td><td class=\"num\">5</td><td class=\"num\">0.242</td><td class=\"num\">0</td><td class=\"num\">.242</td><td class=\"num\"><b>0</b></td></tr>\n        <tr><td><code>STE-B</code> / <code>STE-E</code></td><td class=\"num\">10</td><td colspan=\"4\" class=\"num\"><b>不参与超售</b></td></tr>\n        <tr><td colspan=\"2\"><b>合计</b></td><td class=\"num\"><b>15.000</b></td><td class=\"num\"><b>11</b></td><td class=\"num\">—</td><td class=\"num\"><b>15</b> ✓</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>7.2 开启超售日的三项配套准备（缺一不可）</h3>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">开超售 = 承诺「万一失败我负责」。下面三件必须在落位当天备妥</span>\n    <p><b>准备 1 · 30 分钟内同档次备用酒店名单可用。</b>名单必须含：酒店名称、档次、距离（步行/车程分钟数）、<b>当日实时可售状态</b>、协议价或前台价、24 小时联系电话。<b>名单每周更新一次，且超售日当天 17:00 二次巡检时必须重新确认一次房态</b>——上周能订不代表今天还能订。<br><br>\n    <b>准备 2 · 《步行客人预案》标准补偿包已备妥。</b>含：备用酒店协议（承担差价与交通的财务授权）、本店下次升级券模板、忠诚会员积分补偿的授权额度（5,000 积分/人次）、<b>已预签的总经理致歉信</b>（留出填空的客人姓名与日期，总经理签名须为原件预签，不得事后补签）。<br><br>\n    <b>准备 3 · 《升级台账》已准备。</b>超售日大概率触发《法典》表 J 的免费升级（超售需要腾房）。台账表单、L3 审批通道、前厅执行话术必须提前就位，不能等客人站在前台了才临时找人批。</p>\n  </div>\n\n  <h3>7.3 《超售日监控表》（超售日 17:00 二次巡检固定动作）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 7-10　《超售日监控表》字段设计</caption>\n      <thead><tr><th class=\"num\">#</th><th>字段</th><th>说明</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">1</td><td>目标日 / 可售房量 / 超售上限</td><td>来自表 E 计算结果</td></tr>\n        <tr><td class=\"num\">2</td><td>当前在手（含超售部分）</td><td>实时值，17:00 抓取</td></tr>\n        <tr><td class=\"num\">3</td><td><b>超售余额</b> = 超售上限 −（在手 − 可售）</td><td>为正 = 还能再收；为 0 = <b>立即关闭超售</b>；为负 = 已超限，立即上报 L2</td></tr>\n        <tr><td class=\"num\">4</td><td>今日实际 No-show 间数</td><td>夜审后回填，用于校验表 E 的 No-show 参数是否还成立</td></tr>\n        <tr><td class=\"num\">5</td><td>今日实际 24h 内取消间数</td><td>同上</td></tr>\n        <tr><td class=\"num\">6</td><td>备用酒店当日房态</td><td>17:00 实时确认，记录确认时间与确认人</td></tr>\n        <tr><td class=\"num\">7</td><td>是否启动步行客人预案</td><td>是 / 否；若为「是」关联到《步行客人处置记录单》编号</td></tr>\n        <tr><td class=\"num\">8</td><td>免费升级间数</td><td>关联《升级台账》，不得超过表 J 的套房 ≤3 间上限</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h2 id=\"s8\">八、《法典》表 J · 免费升级规则表（完整内嵌）</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption><span class=\"badge-codex\">表 J</span>　免费升级规则表（超售或高档房空置时）<span class=\"cap-note\">《SPEC》第四章原文，不得改动</span></caption>\n      <thead><tr><th>项目</th><th>内容</th></tr></thead>\n      <tbody>\n        <tr>\n          <th class=\"rowh\">升级触发</th>\n          <td>① 超售需要腾房；② 目标日高档房预测空置 &gt;20%；③ 会员权益兑现</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">执行顺序<br>（严格按序）</th>\n          <td>\n            <b>1. 忠诚会员：钻石 &gt; 铂金 &gt; 金卡 &gt; 银卡</b><br>\n            <b>2. 同档内：预订价高者优先</b><br>\n            <b>3. 同价：入住天数长者先</b><br>\n            <b>4. 相同：复购次数多者先</b>\n          </td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">升幅限制</th>\n          <td>每次<b>最多升 1 档</b>（标准 → 高级 → 豪华 → 行政 → 套房），<b>禁止连跳 2 档</b>（除 L3 特批）</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">套房升级</th>\n          <td>每日不超过 <b>3 间</b>，且须 <b>L3 审批</b></td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">记录</th>\n          <td>每次升级写入《升级台账》，注明<b>原因、房号、会员等级</b></td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>8.1 三个触发条件的逐个解释</h3>\n\n  <div class=\"grid-3\">\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">①</span>超售需要腾房</div>\n      <p><b>被动升级。</b>到店客人多于可用房间，必须把一部分客人升级到更高房型，腾出低档房给后到的人。<br>\n      <b>判定：</b>当日「在手 − 可售房量 &gt; 0」且已无法再安排步行客人时触发。<br>\n      <b>优先级最高</b>——这是救火，不是福利。</p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">②</span>高档房空置 &gt;20%</div>\n      <p><b>主动升级。</b>目标日高档房（DLX 及以上）预测空置率 &gt;20% 时，把低档房客人升级上去，腾出低档房继续卖。<br>\n      <b>算式：</b>高档房空置率 = 高档房剩余间数 ÷ 高档房总间数 × 100%。云璟高档房 = DLX-K 45 + DLX-V 15 + EXE-K 25 + EXE-T 5 + STE-B 8 + STE-E 2 = <b>100 间</b>，&gt;20% 即剩余 &gt;20 间。<br>\n      <b>注意：这是「空置」不是「已售」，别把分母搞反。</b></p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">③</span>会员权益兑现</div>\n      <p><b>合约升级。</b>会员条款中写明「钻石会员到店可免费升 1 档」，属于必须履行。<br>\n      <b>判定：</b>客人出示有效会员等级且在住期间。<br>\n      <b>注意：</b>会员权益升级<b>同样受「最多升 1 档」限制</b>，不能因为「他是钻石」就连跳两档；套房升级同样计入每日 ≤3 间。</p>\n    </div>\n  </div>\n\n  <h3>8.2 四级排序的逐条解释（最容易出错的是第 2 级）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 7-11　表 J 四级排序规则与常见误读</caption>\n      <thead><tr><th class=\"num\">级别</th><th>规则原文</th><th>含义</th><th>常见误读</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td>\n          <td>忠诚会员：钻石 &gt; 铂金 &gt; 金卡 &gt; 银卡</td>\n          <td>先按会员等级排序。<b>非会员排在所有会员之后</b></td>\n          <td>误以为「会员等级相同才比下一级」——不对，<b>等级不同时第 1 级就分出胜负了，不再往下比</b></td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td>\n          <td>同档内：预订价高者优先</td>\n          <td><b>同等级会员之间</b>，谁的原预订价高谁先升</td>\n          <td><span class=\"pill pill-red\">最常错</span>误读成「全店比价」。<b>是同一会员等级内部比</b>，一个银卡付 ¥900 的人不会优先于一个钻石付 ¥600 的人</td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td>\n          <td>同价：入住天数长者先</td>\n          <td>预订价也相同，则住得久的先升</td>\n          <td>误读成「先到店者先升」。表 J 没有「先到先得」这条规则，<b>不要自己加</b></td>\n        </tr>\n        <tr>\n          <td class=\"num\">4</td>\n          <td>相同：复购次数多者先</td>\n          <td>都相同，则历史累计入住次数多者先升</td>\n          <td>把「复购次数」误读成「累计消费金额」。表 J 写的是<b>复购次数</b>，按次数不按金额</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">两条硬约束：最多升 1 档、套房每日 ≤3 间</span>\n    <p><b>硬约束 1 · 每次最多升 1 档。</b>云璟的房型阶梯是：<b>标准（STD）→ 高级（SUP）→ 豪华（DLX）→ 行政（EXE）→ 套房（STE）</b>。<br>\n    所以 STD 只能升到 SUP，<b>不能升到 DLX</b>；DLX 只能升到 EXE，不能直接升到 STE。<br>\n    <b>唯一例外：L3 特批</b>。特批必须在《升级台账》注明特批人姓名与理由。<br><br>\n    <b>硬约束 2 · 套房升级每日不超过 3 间，且须 L3 审批。</b>云璟的套房共 10 间（STE-B 8 + STE-E 2），每日最多放出 3 间用于升级。<br>\n    <b>计数口径：</b>按<b>办理升级的日期</b>计数，不是按入住日计数。也就是说，10 月 2 日办理的升级，无论客人住几天，都计在 10 月 2 日这一天的 3 间额度内。<br>\n    <b>三个触发条件共享这 3 间额度</b>——超售腾房、高档房空置、会员权益，加起来一天最多 3 间套房升级。</p>\n  </div>\n\n  <h3>8.3 升级排序实操（一个完整的排序练习）</h3>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">场景：某日需腾出 2 间 STD 房，以下 6 位客人竞争升级到 SUP</span>\n    <div class=\"tbl-wrap\" style=\"margin-top:10px\">\n      <table class=\"tbl\">\n        <caption>表 7-12　升级排序练习</caption>\n        <thead><tr><th>客人</th><th>会员等级</th><th class=\"num\">原预订价</th><th class=\"num\">入住天数</th><th class=\"num\">复购次数</th><th class=\"num\">排序</th></tr></thead>\n        <tbody>\n          <tr><td>客人甲</td><td>金卡</td><td class=\"num\">¥680</td><td class=\"num\">2</td><td class=\"num\">5</td><td class=\"num\">?</td></tr>\n          <tr><td>客人乙</td><td>钻石</td><td class=\"num\">¥580</td><td class=\"num\">1</td><td class=\"num\">2</td><td class=\"num\">?</td></tr>\n          <tr><td>客人丙</td><td>银卡</td><td class=\"num\">¥820</td><td class=\"num\">3</td><td class=\"num\">12</td><td class=\"num\">?</td></tr>\n          <tr><td>客人丁</td><td>钻石</td><td class=\"num\">¥680</td><td class=\"num\">1</td><td class=\"num\">7</td><td class=\"num\">?</td></tr>\n          <tr><td>客人戊</td><td>钻石</td><td class=\"num\">¥680</td><td class=\"num\">3</td><td class=\"num\">4</td><td class=\"num\">?</td></tr>\n          <tr><td>客人己</td><td>无会员</td><td class=\"num\">¥960</td><td class=\"num\">5</td><td class=\"num\">0</td><td class=\"num\">?</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <p style=\"margin-top:10px\"><b>排序过程：</b><br>\n    <b>第 1 级（会员等级）：</b>钻石 = 乙、丁、戊（3 人）→ 进入下一级；金卡 = 甲；银卡 = 丙；无会员 = 己（排最后）。<br>\n    所以前 3 名必在 {乙、丁、戊} 中产生，2 个升级名额<b>全部给钻石会员</b>，甲、丙、己本轮无份。<br><br>\n    <b>第 2 级（同档内比预订价）：</b>乙 ¥580 < 丁 ¥680 = 戊 ¥680 → <b>乙出局</b>，丁与戊进入第 3 级。<br>\n    <b>（关键：丙的 ¥820 比丁戊都高，但丙是银卡，第 1 级就已经被淘汰了，不参与比价。）</b><br><br>\n    <b>第 3 级（同价比入住天数）：</b>丁 1 天 < 戊 3 天 → <b>戊第 1，丁第 2</b>。<br><br>\n    <b>最终排序：</b>① 戊（升级）② 丁（升级）③ 乙 ④ 甲 ⑤ 丙 ⑥ 己<br>\n    <b>升档：</b>戊与丁均从 STD 升到 <b>SUP</b>（升 1 档），不得升到 DLX。</p>\n  </div>\n\n  <h2 id=\"s9\">九、《升级台账》与套房升级的 L3 审批</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 7-13　《升级台账》字段设计<span class=\"cap-note\">表 J 原文要求注明「原因、房号、会员等级」；本表扩展至 11 字段</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>字段</th><th>填写规范</th><th>为什么要有</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">1</td><td><b>日期</b></td><td>办理升级的日期（<b>不是入住日</b>）</td><td>套房每日 ≤3 间按此日期计数</td></tr>\n        <tr><td class=\"num\">2</td><td><b>客人姓名 / 会员号</b></td><td>必填</td><td>复购次数与积分补偿都靠它关联</td></tr>\n        <tr><td class=\"num\">3</td><td><b>会员等级</b><span class=\"pill pill-red\">表 J 要求</span></td><td>钻石 / 铂金 / 金卡 / 银卡 / 非会员</td><td>第 1 级排序依据；也是后续积分补偿的判定依据</td></tr>\n        <tr><td class=\"num\">4</td><td><b>升级原因</b><span class=\"pill pill-red\">表 J 要求</span></td><td>下拉：① 超售腾房 ② 高档房空置 &gt;20% ③ 会员权益兑现</td><td>三个原因的性质完全不同（被动/主动/合约），混在一起统计会让高档房空置率分析失真</td></tr>\n        <tr><td class=\"num\">5</td><td><b>原房型代码</b></td><td>如 <code>STD-K</code></td><td>校验是否只升 1 档</td></tr>\n        <tr><td class=\"num\">6</td><td><b>升级后房型代码</b><span class=\"pill pill-red\">表 J 要求（房号）</span></td><td>房型代码 + <b>实际房号</b></td><td>房号是前厅排房与客史追溯的唯一凭据</td></tr>\n        <tr><td class=\"num\">7</td><td><b>升档数</b></td><td>填 1（正常）或 2 及以上（须 L3 特批）</td><td>自动标红 =&nbsp;1 的记录，触发 L3 特批核查</td></tr>\n        <tr><td class=\"num\">8</td><td><b>原预订价 / 升级后房价</b></td><td>两个都要填</td><td>升级的<b>机会成本</b> = 升级后房价 − 原预订价，是月度升级成本分析的输入</td></tr>\n        <tr><td class=\"num\">9</td><td><b>是否套房升级</b></td><td>是 / 否</td><td>触发 L3 审批与每日 3 间额度核查</td></tr>\n        <tr><td class=\"num\">10</td><td><b>审批人</b></td><td>常规升 1 档：L2；<b>套房升级或连跳 2 档：L3</b></td><td>表 J 硬约束的取证</td></tr>\n        <tr><td class=\"num\">11</td><td><b>执行人 / 备注</b></td><td>前厅执行人姓名 + 客人反应</td><td>客诉追溯</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">套房升级 L3 审批的操作流程（当日额度管理）</span>\n    <p>① 前厅确认当日已有套房升级间数（查《升级台账》当日「是否套房升级 = 是」的条数）；<br>\n    ② <b>若已 3 间，直接拒绝，不得再升</b>——改用「升级到 EXE 行政房 + 赠送双早」替代；<br>\n    ③ 若 &lt;3 间，发起 L3 审批（书面或系统审批流），注明客人姓名、会员等级、升级原因、原房型与目标房型；<br>\n    ④ 取得 L3 书面确认后办理，并把审批人姓名填入《升级台账》第 10 列；<br>\n    ⑤ 夜审时由 L2 复核当日套房升级总间数 ≤3。<br>\n    <b>红线：先办后批视为违规</b>，与表 A 约束 5（D1 峰值日调价须 L3 前置审批）同理——审批是<b>前置条件</b>，不是事后补签。</p>\n  </div>\n\n  <h2 id=\"s10\">十、《法典》表 L · 超售过度与《步行客人预案》四步补偿包</h2>\n\n  <h3>10.1 表 L「超售过度」分支原文</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption><span class=\"badge-codex\">表 L</span>　异常事件应急判定表 · 超售过度分支<span class=\"cap-note\">《SPEC》第四章原文</span></caption>\n      <thead><tr><th>事件类型</th><th>判定信号</th><th>立即动作（2 小时内）</th><th>24 小时内</th><th>复盘</th></tr></thead>\n      <tbody>\n        <tr>\n          <th class=\"rowh\"><b>超售过度</b><br>（到店无证可住）</th>\n          <td><b>到店无房</b></td>\n          <td>启动《步行客人预案》：<b>就近同档酒店、承担差价、升级补偿、次日优先回本店</b></td>\n          <td>赔偿结算、客人回访</td>\n          <td><b>重算表 E 参数</b></td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">「到店无房」的判定信号：不是「在手超了可售」</span>\n    <p>在手超过可售房量是<b>常态</b>（这就是超售的目的），不是异常。<br>\n    <b>真正的判定信号是：夜审/排房时点，实际到店（或已确认必到）的客人数量 &gt; 实际可用房间数量。</b><br>\n    具体触发时点：当日 18:00 后，把「在手 − 已取消 − No-show」与「可售 − OOO 新增 − 维修房」做一次实时比对，若前者 &gt; 后者，即判定「到店无房」，<b>立即启动预案，不等客人站到前台</b>。<br>\n    <b>提前两小时知道，和让客人站在大堂才知道，是两个完全不同的事故等级。</b></p>\n  </div>\n\n  <h3>10.2 《步行客人预案》标准补偿包（四步，按序执行，不许跳步）</h3>\n\n  <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n    <h4>安排同档或更高档酒店，承担房费差价 + 交通费</h4>\n    <p><b>执行标准：</b><br>\n    · <b>档次要求：同档或更高档</b>。云璟是中高端全服务（准五星/四星+），备用酒店必须 ≥ 此档次，不得降级安排。<br>\n    · <b>承担范围：房费差价 + 往返交通费</b>。差价 = 备用酒店房费 − 客人在本店的成交房价（<b>按客人的实际成交价算，不是按 BAR 算</b>）。<br>\n    · <b>承担天数：</b>本店无法提供的全部夜次。若次日仍无房，继续承担至客人可回本店为止。<br>\n    · <b>执行人：</b>值班经理（须有预先授权的财务额度，不得现批现报）。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n    <h4>本店下次入住免费升级 1 档 + 双早</h4>\n    <p><b>执行标准：</b><br>\n    · <b>升级 1 档</b>（严格按表 J 的房型阶梯：STD→SUP→DLX→EXE→STE），<b>不因本次事故而连跳 2 档</b>——若客人要求连跳，须走 L3 特批。<br>\n    · <b>双早</b>指两份自助早餐（云璟早餐门市价 ¥128/人，含早加价 ¥68/人）。按<b>门市价 ¥128 × 2 = ¥256</b> 计入补偿成本，不是按 ¥68 的加价计。<br>\n    · <b>有效期：</b>自发放之日起 <b>12 个月</b>。过期作废且不延期——这条必须写在券面上，否则会形成无限期的成本敞口。<br>\n    · <b>发放形式：</b>实体券或系统内权益，<b>必须记录券号</b>并写入《升级台账》备注。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n    <h4>忠诚会员额外补偿 5,000 积分</h4>\n    <p><b>执行标准：</b><br>\n    · <b>仅对忠诚会员发放</b>（钻石 / 铂金 / 金卡 / 银卡）。非会员不发放——非会员拿不到积分也没有意义。<br>\n    · <b>金额固定 5,000 积分</b>，<b>不按会员等级差异化</b>。表 L 原文写的是「忠诚会员额外补偿 5,000 积分」，没有分级。<br>\n    · <b>发放时点：</b>当场发放并短信通知，<b>不等客人投诉后再补</b>——主动补偿与被动赔偿在客诉转化率上差一个数量级。<br>\n    · <b>成本归属：</b>按会员渠道（LOY）综合成本率 4% 折算积分成本，计入本次事故成本。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n    <h4>总经理签名致歉信 + 当日值班经理全程跟进</h4>\n    <p><b>执行标准：</b><br>\n    · <b>致歉信必须由总经理亲笔签名</b>（预签原件，留出客人姓名与日期的填空位）。<b>打印签名或事后补签视为未执行</b>。<br>\n    · <b>致歉信内容四项要素：</b>① 明确承认是本店超售失误（不许写「因不可抗力」）；② 说明已安排的同档酒店与承担范围；③ 写明后续补偿（升级券 + 积分）；④ 留下总经理与值班经理的直接联系方式。<br>\n    · <b>全程跟进：</b>当日值班经理负责：送客人上车 → 到备用酒店确认入住 → <b>次日致电确认回本店安排</b> → 客人离店后 72 小时内回访。<br>\n    · <b>交接：</b>值班经理交接班时，未闭环的步行客人必须逐位书面交接，<b>不允许口头交接</b>。</p>\n  </div></div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">四步补偿包的成本量级（云璟实算，供 L3 决策参考）</span>\n    <p>假设某日送走 3 位客人（2 位非会员 + 1 位钻石会员），备用酒店同档房价 ¥720，客人本店成交价 ¥680，住 1 晚：<br>\n    <b>第 1 步：</b>房费差价（720 − 680）× 3 = ¥120；交通费（往返打车约 ¥80）× 3 = ¥240 → <b>¥360</b><br>\n    <b>第 2 步：</b>下次升级 1 档的差价（SUP ¥680 − STD ¥580）× 3 = ¥300；双早 ¥256 × 3 = ¥768 → <b>¥1,068</b><br>\n    <b>第 3 步：</b>5,000 积分 × 1 人 × 4% 折算（按云璟积分价值约 ¥0.01/分估算）→ 约 <b>¥50</b><br>\n    <b>第 4 步：</b>致歉信与值班经理人力成本 → 约 <b>¥300</b><br>\n    <b>合计直接成本 ≈ ¥1,778，约 ¥593/人次。</b><br>\n    <b>对照：多卖 1 间房的收益 = 1 × ¥680 = ¥680。</b><br>\n    <b>结论：送走 1 个人的代价（¥593）几乎等于多卖 1 间房的收益（¥680），还没算差评与忠诚会员流失的长期损失。</b>这就是为什么表 E 的三个 ×0.5 与三条硬上限设计得如此保守。</p>\n  </div>\n\n  <h3>10.3 事后复盘：重算表 E 参数</h3>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">表 L 规定「超售过度」的复盘动作是「重算表 E 参数」，具体做四件事</span>\n    <p>① <b>重算 No-show 率与 24h 内取消率</b>：取事发当月全月数据重算，看是否显著高于表 E 计算时所采用的历史值。若高出 5 个百分点以上，说明表 E 的输入已经过时。<br>\n    ② <b>核查修正系数的判定是否漏项</b>：事发当日是否属于 D1/D2？担保占比多少？会议团队占比多少？协议集中度多少？<b>逐条回看，看有没有漏乘的 ×0.5 / ×0.8。</b><br>\n    ③ <b>核查备用酒店假设</b>：事发当日 30 分钟内的同档备用酒店是否真的有房？若没有，第三步的「无备用酒店 → 超售率减半」是否被正确应用？<br>\n    ④ <b>重设未来 30 天的超售上限</b>：按修正后的参数重算，并在《调价台账》备注写明「依表 L 复盘重算，原上限 X 间调整为 Y 间」。<br>\n    <b>产出物：《超售过度复盘报告》，7 天内完成（表 L 的「复盘」列对需求暴跌分支写明「事后 7 天复盘报告」，超售过度分支沿用同一时限）。</b></p>\n  </div>\n\n  <h2 id=\"s11\">十一、主流系统操作路径映射表</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 7-14　库存与限制条件的系统无关操作路径<span class=\"cap-note\">本学院统一使用通用术语；下表为常见系统的对应入口，不同版本字段名可能略有差异，<b>以通用术语为准</b></span></caption>\n      <thead><tr><th>通用动作</th><th>通用术语</th><th>国际连锁常见 PMS<br>（Opera 类）</th><th>国产常见 PMS<br>（西软 / 绿云类）</th><th>渠道管理器<br>（Channel Manager）</th></tr></thead>\n      <tbody>\n        <tr><td>设最少住期</td><td>MinLOS / 最少连住</td><td>Restriction → Min Length of Stay</td><td>房价控制 / 限制条件 → 最少入住天数</td><td>通常不设，由 PMS 推送</td></tr>\n        <tr><td>设最多住期</td><td>MaxLOS / 最多连住</td><td>Restriction → Max Length of Stay</td><td>房价控制 → 最多入住天数</td><td>通常不设</td></tr>\n        <tr><td>设不可入住</td><td>CTA / Closed to Arrival</td><td>Restriction → Closed to Arrival</td><td>限制条件 → 不可入住</td><td>不设</td></tr>\n        <tr><td>设不可离店</td><td>CTD / Closed to Departure</td><td>Restriction → Closed to Departure</td><td>限制条件 → 不可离店</td><td>不设</td></tr>\n        <tr><td>停售某房型</td><td>Stop Sell / Close-out</td><td>Room Type → Close-out / Stop Sell</td><td>房态管理 → 关房 / 停售</td><td>房型级停售（同步至各 OTA）</td></tr>\n        <tr><td>停售某渠道</td><td>Channel Stop Sell</td><td>Channel / Source → Stop Sell</td><td>渠道管理 → 渠道停售</td><td><b>主战场</b>：渠道 → 停止投放</td></tr>\n        <tr><td>设超售上限</td><td>Overbooking Limit</td><td>Room Type → Overbooking Limit</td><td>房态管理 → 超售设置</td><td>部分支持，通常不设</td></tr>\n        <tr><td>办理免费升级</td><td>Room Upgrade</td><td>Reservation → Room Move / Upgrade</td><td>在住客人 → 换房 / 升级</td><td>不涉及</td></tr>\n        <tr><td>导出限制条件清单</td><td>Restriction Report</td><td>Reports → Restriction Report</td><td>报表 → 房价控制明细</td><td>渠道投放明细导出</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">系统无关的真正含义</span>\n    <p>本学院要求写「<b>在限制条件中，按日期 × 房型 × 价格代码设置 MinLOS = 2</b>」，而不是「点击 XX 按钮第 3 个 Tab」。<br>\n    原因有二：① 学员毕业后会去不同的酒店用不同的系统，记住按钮没有迁移价值；② 系统升级后按钮位置会变，但「日期 × 房型 × 价格代码」这个三维模型不会变。<br>\n    <b>上面这张表是给「需要落地到具体系统」时的索引，不是教学内容本身。</b></p>\n  </div>\n\n  <\!-- ================= 十二 ================= -->\n  <h2 id=\"s12\">十二、讲师示范 ①：D2 高涨日（表 B 全四列 + 撤除计划）</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>示范 ①　9 月 19 日（周五 · D2 高涨日 · HIGH）的完整库存动作</div>\n\n    <h4>已知条件</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">目标日</div><div class=\"kv-v\">9 月 19 日，周五，D2 高涨日（价格系数 120–150%，目标 OCC 88–95%）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">可售房晚</div><div class=\"kv-v\">320 间（OOO 0）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">当前在手 / 去年同窗口</div><div class=\"kv-v\">285 间 / 282 间</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">预测增量</div><div class=\"kv-v\">10 间</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">当前 SUP-K/SUP-T BAR</div><div class=\"kv-v\">¥900</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">当前限制状态</div><div class=\"kv-v\">MinLOS = 1 晚（不设限）；CTA 未启用；全部渠道开放；超售上限 0 间</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">历史参数</div><div class=\"kv-v\">No-show + 24h 取消 = 16%；担保占比 52%；会议团队 28%；协议集中度 44%；有备用酒店</div></div>\n    </div>\n\n    <h4>第 1 步 · 定行</h4>\n    <div class=\"formula\">\n      <span class=\"f-label\">预测 OCC</span>\n      （285 + 10）÷ 320 × 100% = 295 ÷ 320 × 100% → <span class=\"f-out\">92.2%</span><br>\n      <span class=\"f-label\">定行</span>\n      90.0% ≤ 92.2% &lt; 95.0% → 表 B「<b>90–95%</b>」行（不是「85–90%」行）\n    </div>\n\n    <h4>第 2 步 · 读四列并落位</h4>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 7-15　示范 ① 的表 B 四列动作与落位</caption>\n        <thead><tr><th>列</th><th>表 B 值</th><th>落位动作</th><th>四元组</th><th>截图</th></tr></thead>\n        <tbody>\n          <tr>\n            <td><b>MinLOS</b></td><td>2 晚</td>\n            <td>在限制条件中把 MinLOS 从「1 晚（不设限）」改为 <b>2 晚</b></td>\n            <td>9/19 × 全 10 房型 × BAR 及衍生价（<b>不含 CORP 与 GDS 价</b>）</td>\n            <td>F0912-01</td>\n          </tr>\n          <tr>\n            <td><b>CTA</b></td><td>D1 日启用</td>\n            <td>本日为 <b>D2 高涨日，非 D1</b> → <b>不启用</b>（动作：确认 CTA 为关闭态，写台账「CTA 否」）</td>\n            <td>—</td>\n            <td>F0912-02</td>\n          </tr>\n          <tr>\n            <td><b>低价渠道 Stop Sell</b></td><td>关闭尾房特惠</td>\n            <td>本店侧 + 渠道侧<b>两层都关</b>「尾房特惠」渠道；团购与批发商本档<b>不要求关闭</b>（那两条只在 ≥95% 行出现），但需按表 H 复核</td>\n            <td>9/19 × 尾房特惠渠道 × 全房型</td>\n            <td>F0912-03</td>\n          </tr>\n          <tr>\n            <td><b>超额预订</b></td><td>≤2 间</td>\n            <td>直接设超售上限 <b>2 间</b>，<b>不查表 E</b>（表 B 本行已直接给值）</td>\n            <td>按房型分配，见下</td>\n            <td>F0912-04</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n\n    <h4>第 3 步 · 超售 2 间的房型分配</h4>\n    <div class=\"formula\">\n      <span class=\"f-label\">分配基数</span>\n      320 − 套房 10 = <b>310 间</b>（套房不参与）<br>\n      <span class=\"f-label\">配额</span>\n      STD-K：70 ÷ 310 × 2 = 0.452 → 0（余 .452）<br>\n      STD-T：50 ÷ 310 × 2 = 0.323 → 0（余 .323）<br>\n      SUP-K：60 ÷ 310 × 2 = 0.387 → 0（余 .387）<br>\n      SUP-T：40 ÷ 310 × 2 = 0.258 → 0（余 .258）<br>\n      DLX-K：45 ÷ 310 × 2 = 0.290 → 0（余 .290）<br>\n      DLX-V：15 ÷ 310 × 2 = 0.097 → 0（余 .097）<br>\n      EXE-K：25 ÷ 310 × 2 = 0.161 → 0（余 .161）<br>\n      EXE-T：5 ÷ 310 × 2 = 0.032 → 0（余 .032）<br>\n      取整合计 0，需补 2 个名额 → 余数最大的两档：STD-K（.452）、SUP-K（.387）<br>\n      <span class=\"f-label\">结论</span>\n      超售 2 间 = <span class=\"f-out\">STD-K 1 间 + SUP-K 1 间</span>\n    </div>\n\n    <h4>第 4 步 · 配套准备（超售 2 间也要做，不能因为少就省）</h4>\n    <ul class=\"checklist\">\n      <li>备用酒店名单：确认步行 30 分钟内同档酒店当日有房（记录确认时间 08:52、确认人）</li>\n      <li>《步行客人预案》补偿包：升级券、积分授权、预签致歉信已在前台保险柜</li>\n      <li>《升级台账》表单已打印放前台；L3 审批电话通道已确认（本日若需套房升级需 L3 批）</li>\n      <li>《超售日监控表》已建行，17:00 二次巡检时更新</li>\n    </ul>\n\n    <h4>第 5 步 · ★ 撤除计划（设置的同时就写好）</h4>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 7-16　示范 ① 的《限制条件存量清单》登记</caption>\n        <thead><tr><th>类型</th><th>对象（四元组）</th><th>设置值</th><th>设置日期</th><th>生效区间</th><th><b>到期日</b></th><th>触发表</th><th>撤除状态</th></tr></thead>\n        <tbody>\n          <tr><td>MinLOS</td><td>9/19 × 全房型 × BAR 及衍生价</td><td>2 晚</td><td>09-12</td><td>09-19 ~ 09-19</td><td><b>09-20</b></td><td>表 B</td><td>生效中</td></tr>\n          <tr><td>Stop Sell</td><td>9/19 × 尾房特惠 × 全房型</td><td>关</td><td>09-12</td><td>09-19 ~ 09-19</td><td><b>09-20</b></td><td>表 B</td><td>生效中</td></tr>\n          <tr><td>超售</td><td>9/19 × STD-K 1 / SUP-K 1</td><td>2 间</td><td>09-12</td><td>09-19 ~ 09-19</td><td><b>09-20</b>（自动失效）</td><td>表 B</td><td>生效中</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <div class=\"callout callout-do\">\n      <span class=\"co-t\">到期日的执行</span>\n      <p>9 月 20 日 08:30 的扫描环节会筛出这三行（到期日 = 09-20）。届时按<b>撤除五步法</b>执行：<br>\n      ① 查到期日 → ② 两层都撤（MinLOS 清空、尾房特惠本店侧+渠道侧都开）→ ③ <b>试订验证</b>（选 9/20 入住 1 晚，必须能订成功；在携程搜 9/20 该房型，必须可订）→ ④ 截图 → ⑤ 台账登记（动作类型「撤 MinLOS」「Stop Sell 关」）+ 清单更新撤除状态。<br>\n      <b>超售那一行的到期日写「自动失效」，但 9 月 20 日仍需确认超售上限已归零</b>——部分系统的超售设置按日期区间生效，区间结束后会自动归零；另一些系统需要手动清零。必须实查，不能假设。</p>\n    </div>\n  </div>\n\n  <\!-- ================= 十三 ================= -->\n  <h2 id=\"s13\">十三、讲师示范 ②：超售日 → 到店无房 → 启动步行客人预案</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>示范 ②　11 月 12 日（案例 ① 的超售日）走到最坏的一步</div>\n\n    <h4>时间线</h4>\n    <div class=\"timeline\">\n      <div class=\"tl-item\">\n        <div class=\"tl-time\">10-28<br>08:30</div>\n        <div class=\"tl-body\">\n          <b>设超售 9 间</b>（案例 ① 的计算结果）。按房型分配：STD-K 2 / STD-T 2 / SUP-K 2 / SUP-T 1 / DLX-K 1 / EXE-K 1。三项配套准备完成。《限制条件存量清单》登记，到期日 11-13。\n        </div>\n      </div>\n      <div class=\"tl-item\">\n        <div class=\"tl-time\">11-12<br>17:00</div>\n        <div class=\"tl-body\">\n          <b>二次巡检。</b>在手 321 间，可售 312 间，超售余额 = 9 −（321 − 312）= 9 − 9 = <b>0</b> → <b>立即关闭超售，不再接受新预订</b>。<br>\n          备用酒店 A 江畔万枫（1.2km，280 间）确认当日有房 12 间，房价 ¥700；备用酒店 E 云栖亚朵 S（2.0km，200 间）确认有房 8 间，房价 ¥660。\n        </div>\n      </div>\n      <div class=\"tl-item\">\n        <div class=\"tl-time\">11-12<br>20:30</div>\n        <div class=\"tl-body\">\n          <b>判定「到店无房」。</b>实时比对：已到店 296 间 + 已确认必到（担保/预付）28 间 = <b>324 间</b>；可用房间 = 312 − 新增维修 2 间 = <b>310 间</b>。<br>\n          324 &gt; 310 → <b>缺口 14 间</b>。<span class=\"pill pill-red\">判定信号成立</span>\n        </div>\n      </div>\n      <div class=\"tl-item\">\n        <div class=\"tl-time\">20:30<br>+10 min</div>\n        <div class=\"tl-body\">\n          <b>第一道防线：免费升级腾房（表 J 触发条件①）。</b>高档房（DLX 及以上共 100 间）当前空置 23 间 → 空置率 23% &gt; 20%，双重符合。<br>\n          把 14 位最低优先级的 STD/SUP 客人升级到 DLX（升 1 档，符合表 J），腾出 14 间 STD/SUP。<br>\n          <b>按表 J 四级排序挑人：</b>优先升级<b>非会员且预订价低</b>的客人（因为他们排在升级队列最末，但本场景是「必须腾房」，所以逻辑反过来——<b>优先动排在队尾的人</b>，把好房间留给高等级会员）。<br>\n          <b>套房升级额度核查：</b>本次不涉及套房（只升到 DLX），无需 L3 审批；若需升到 STE，则当日上限 3 间且须 L3 批。\n        </div>\n      </div>\n      <div class=\"tl-item\">\n        <div class=\"tl-time\">21:00</div>\n        <div class=\"tl-body\">\n          <b>第二道防线：仍缺 3 间。</b>升级已用完高档房全部空置（23 − 14 = 9 间，其中 4 间为 DLX-V/EXE 需保留给已在途的高价客）。<br>\n          实际缺口 3 间 → <b>启动《步行客人预案》</b>，表 L 优先级 1，覆盖一切。\n        </div>\n      </div>\n    </div>\n\n    <h4>步行客人预案执行（3 位客人）</h4>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 7-17　《步行客人处置记录单》示例</caption>\n        <thead><tr><th>客人</th><th>会员等级</th><th class=\"num\">本店成交价</th><th>去向</th><th class=\"num\">第 1 步</th><th>第 2 步</th><th>第 3 步</th><th>第 4 步</th></tr></thead>\n        <tbody>\n          <tr>\n            <td>客人 A</td><td>钻石</td><td class=\"num\">¥580<br>（STD-K 协议价）</td>\n            <td>A 江畔万枫<br>（1.2km，¥700）</td>\n            <td class=\"num\">差价 ¥220 + 交通 ¥80<br>= <b>¥300</b></td>\n            <td>升级券 1 张（升 1 档 + 双早，值 ¥100 + ¥256 = ¥356）</td>\n            <td><b>5,000 积分</b></td>\n            <td>总经理预签致歉信 + 值班经理全程跟进</td>\n          </tr>\n          <tr>\n            <td>客人 B</td><td>非会员</td><td class=\"num\">¥660<br>（SUP-K BAR）</td>\n            <td>A 江畔万枫<br>（¥700）</td>\n            <td class=\"num\">差价 ¥40 + 交通 ¥80<br>= <b>¥120</b></td>\n            <td>升级券 1 张（¥356）</td>\n            <td><b>不适用</b>（非会员）</td>\n            <td>致歉信 + 跟进</td>\n          </tr>\n          <tr>\n            <td>客人 C</td><td>金卡</td><td class=\"num\">¥660<br>（SUP-K 会员价）</td>\n            <td>E 云栖亚朵 S<br>（2.0km，¥660）</td>\n            <td class=\"num\">差价 ¥0 + 交通 ¥120<br>= <b>¥120</b></td>\n            <td>升级券 1 张（¥356）</td>\n            <td><b>5,000 积分</b></td>\n            <td>致歉信 + 跟进</td>\n          </tr>\n          <tr>\n            <td colspan=\"4\"><b>直接成本合计</b></td>\n            <td class=\"num\"><b>¥540</b></td>\n            <td class=\"num\"><b>¥1,068</b></td>\n            <td class=\"num\">2 人 × 5,000 分<br>≈ ¥100</td>\n            <td>人力 + 信函 ≈ ¥300</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n\n    <div class=\"formula\">\n      <span class=\"f-label\">本次事故总直接成本</span>\n      540 + 1,068 + 100 + 300 = <span class=\"f-out\">¥2,008</span>（约 ¥669/人次）<br>\n      <span class=\"f-label\">对照：本日超售 9 间带来的增量收益</span>\n      9 间 × 平均 ¥640 ×（1 − 渠道综合成本率 10%）= <span class=\"f-out\">¥5,184</span><br>\n      <span class=\"f-label\">净结果</span>\n      5,184 − 2,008 = <span class=\"f-out\">+¥3,176</span>（仍为正，超售策略本身成立）\n    </div>\n\n    <div class=\"callout callout-key\">\n      <span class=\"co-t\">本示范最重要的一个结论：出了事故不等于策略失败</span>\n      <p>本日超售 9 间，最终送走 3 人，直接成本 ¥2,008，但超售带来的增量净收益 ¥5,184，<b>净赚 ¥3,176</b>。<br>\n      <b>策略是成功的。</b>需要改进的只是执行细节：20:30 才判定缺口，如果能在 18:00 就开始升级腾房，客人的等待时间会短很多，补偿成本中的「客人情绪成本」也会下降。<br>\n      <b>复盘的正确方向不是「不该超售」，而是「判定缺口的时间点要提前」。</b>这就是表 L「复盘」列写「重算表 E 参数」而不是「禁止超售」的原因。</p>\n    </div>\n\n    <h4>事后复盘（7 天内完成）</h4>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 7-18　《超售过度复盘报告》要点</caption>\n        <thead><tr><th class=\"num\">#</th><th>复盘项</th><th>结论</th><th>动作</th></tr></thead>\n        <tbody>\n          <tr><td class=\"num\">1</td><td>重算 No-show + 取消率</td><td>本月实际 17%，表 E 计算时采用 14%，<b>高出 3 个百分点</b></td><td>仍在「15–20%」档内（基准 5%），但已接近下档边界。下月改用 17% 重算</td></tr>\n          <tr><td class=\"num\">2</td><td>修正系数是否漏项</td><td>D3 平峰（×1）、担保 45%（×1）、会议 18%（×1）、协议 38%（×1）→ <b>无漏项</b></td><td>无</td></tr>\n          <tr><td class=\"num\">3</td><td>备用酒店假设</td><td>两家备用酒店当日均有房，<b>假设成立</b></td><td>无</td></tr>\n          <tr><td class=\"num\">4</td><td>重设未来 30 天超售上限</td><td>按 17% 重算：17% 落「15–20%」→ 基准 5%，无修正 → 312 × 5% = 15.6，硬上限 15 → <b>15 间</b></td><td><b>上限从 9 间提高到 15 间</b>，但在《调价台账》备注写明「No-show 参数已升至 17%，连续 2 个月观察后再定是否稳定」</td></tr>\n          <tr><td class=\"num\">5</td><td><b>流程改进（本条最重要）</b></td><td>缺口判定时间 20:30 太晚</td><td>增加 <b>18:00 缺口预检</b>：18:00 做一次实时比对，若缺口 &gt;0 立即启动升级腾房，不必等到实际到店</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n\n  <\!-- ================= 十四 ================= -->\n  <h2 id=\"s14\">十四、学员跟练（6 题）</h2>\n\n  <p>要求：每题限时 12 分钟，先独立作答再展开答案。<b>凡涉及超售计算的题，必须写出完整的三步法过程。</b></p>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 1 · 表 B 定行与四列落位</div>\n    <div class=\"q-b\">目标日 10 月 24 日（周五，D2 高涨日）。可售 320（OOO 0）；在手 271；去年同期同窗口在手 268；预测增量 21。当前 MinLOS = 1 晚、CTA 未启用、全部渠道开放、超售上限 0 间。<br>请：① 算预测 OCC 并定表 B 的行；② 写出四列动作与落位方式；③ 说明 CTA 这一列在本例怎么判断。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 定行：</b>预测 OCC =（271+21）÷320 = 292÷320 = <b>91.3%</b> → 90.0% ≤ 91.3% &lt; 95.0% → 表 B「<b>90–95%</b>」行。<br>\n      <b>② 四列动作：</b><br>\n      <b>MinLOS = 2 晚</b> → 落位：在限制条件中，按「10/24 × 全 10 房型 × BAR 及衍生价」写入最少住期 2（<b>不含 CORP 与 GDS 价</b>，避免误伤商旅客）。现状 1 晚（不设限）→ 改为 2 晚。<br>\n      <b>CTA = D1 日启用</b> → 本日为 <b>D2 高涨日，非 D1</b> → <b>不启用</b>。<br>\n      <b>低价渠道 Stop Sell = 关闭尾房特惠</b> → 本店侧 + 渠道侧两层都关；团购与批发商本档<b>不要求关闭</b>（只在 ≥95% 行才要求）。<br>\n      <b>超额预订 = ≤2 间</b> → 直接设 2 间，<b>不查表 E</b>。<br>\n      <b>③ CTA 的判断方式：</b>CTA 列在「90–95%」行写的是「<b>D1 日启用</b>」，这是一个<b>条件式取值</b>——必须先查目标日的需求等级代号。本日为 D2（HIGH），不是 D1（PEAK），所以条件不成立，不启用。<br>\n      <b>易错点：</b>把「D1 日启用」读成「启用」，或读成「待定」。正确读法是「<b>仅当该日为 D1 峰值日时启用，否则不启用</b>」。<br>\n      <b>补充：</b>若本日预测 OCC 是 96.0%（≥95% 行），CTA 列直接写「启用」，此时不看需求等级，一律启用。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 2 · 超售计算（三步法 + 房型分配）</div>\n    <div class=\"q-b\">目标日 4 月 18 日（周四，D3 平峰日），可售 312 间（OOO 8）。预测 OCC 79.5%。历史 No-show + 24h 取消 = 11%；担保预订占比 58%；会议团队占当日 22%；协议客户集中度 62%；步行 30 分钟内有同档备用酒店。<br>请：① 判断是否需查表 E；② 完整走三步法算出超售上限；③ 按房型分配（写出每档配额与余数补齐过程）。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 是否查表 E：</b>预测 OCC 79.5% → 表 B「<b>70–85%</b>」行 → 超额预订列写「<b>按表 E</b>」→ <b>需要计算</b>。<br>\n      <b>② 三步法：</b><br>\n      <b>第一步：</b>11% 落「10–15%」档 → 基准超售率 = <b>3%</b><br>\n      <b>第二步：</b>D1/D2？否（D3）→ ×1；担保 58% &gt; 60%？<b>否</b>（58 &lt; 60）→ ×1；会议团队 22% &gt; 40%？否 → ×1；<b>协议集中度 62% &gt; 50%？是 → × 0.8</b><br>\n      修正后超售率 = 3% × 0.8 = <b>2.4%</b><br>\n      <b>第三步：</b>有备用酒店 → 不减半，最终 2.4%<br>\n      超售间数（未取整）= 312 × 2.4% = <b>7.488</b><br>\n      硬上限①：312 × 5% = 15.6　硬上限②：15<br>\n      min(7.488, 15.6, 15) = 7.488 → 向下取整 = <b>7 间</b><br>\n      <b>超售上限 = 7 间</b><br>\n      <b>③ 房型分配：</b>分配基数 = 312 − 套房 10 = <b>302 间</b>（注意：本例可售 312 而非 320，OOO 8 间分布未知，本学院统一按「套房间数 10 间不参与」扣减，得 302）<br>\n      STD-K：70 ÷ 302 × 7 = 1.623 → 1（余 .623）<br>\n      STD-T：50 ÷ 302 × 7 = 1.159 → 1（余 .159）<br>\n      SUP-K：60 ÷ 302 × 7 = 1.390 → 1（余 .390）<br>\n      SUP-T：40 ÷ 302 × 7 = 0.927 → 0（余 .927）<br>\n      DLX-K：45 ÷ 302 × 7 = 1.043 → 1（余 .043）<br>\n      DLX-V：15 ÷ 302 × 7 = 0.348 → 0（余 .348）<br>\n      EXE-K：25 ÷ 302 × 7 = 0.579 → 0（余 .579）<br>\n      EXE-T：5 ÷ 302 × 7 = 0.116 → 0（余 .116）<br>\n      取整合计 = 1+1+1+0+1+0+0+0 = <b>4</b>，需补 3 个名额<br>\n      余数排序：SUP-T .927（第 1）、STD-K .623（第 2）、EXE-K .579（第 3）、SUP-K .390（第 4）…<br>\n      <b>最终分配：STD-K 2 / STD-T 1 / SUP-K 1 / SUP-T 1 / DLX-K 1 / EXE-K 1 / DLX-V 0 / EXE-T 0 = 7 间</b> ✓<br>\n      <b>易错点提醒：</b>担保占比 58% 是精心设计的数字——<b>刚好差 2 个百分点不触发 ×0.5</b>。这类「差一点」的数字在考试和实务中都会出现，必须严格比大小，不许四舍五入。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 3 · 峰值日超售（三重约束）</div>\n    <div class=\"q-b\">目标日 5 月 2 日（D1 峰值日，五一假期第 2 天）。可售 320；在手 300；去年同期同窗口在手 268；预测增量 8。历史 No-show + 24h 取消 = 9%；担保占比 82%；会议团队 5%；协议集中度 30%；<b>步行 30 分钟内无同档次备用酒店</b>（假期周边满房）。<br>请：① 先查表 B 判断要不要超售；② 即便如此，仍走一遍表 E 三步法验证；③ 说明三重约束分别是哪三条。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 表 B：</b>预测 OCC =（300+8）÷320 = 308÷320 = <b>96.3%</b> → ≥95% → 表 B「<b>≥95%</b>」行 → 超额预订列 = <b>不超售</b> → <b>超售上限 0 间，不需要查表 E</b>。<br>\n      <b>② 表 E 验证（仅作演示）：</b><br>\n      第一步：9% 落「5–10%」档 → 基准 = <b>2%</b><br>\n      第二步：D1 峰值日 → <b>×0.5</b>；担保 82% &gt; 60% → <b>×0.5</b>；会议 5% ≯ 40% → ×1；协议 30% ≯ 50% → ×1<br>\n      修正后 = 2% × 0.5 × 0.5 = <b>0.5%</b><br>\n      第三步：<b>无备用酒店 → 超售率减半</b>：0.5% × 0.5 = <b>0.25%</b><br>\n      超售间数 = 320 × 0.25% = <b>0.8</b>；硬上限 16 / 15 未触及<br>\n      向下取整 → <b>0 间</b><br>\n      <b>③ 三重约束：</b><br>\n      <b>约束 1（最硬）：表 B「≥95%」行直接规定「不超售」</b>。这是优先级 2 的表 B 给出的结论，根本不需要进入表 E。<br>\n      <b>约束 2：无备用酒店 → 超售率减半</b>（表 E 第三步第 3 条）。<br>\n      <b>约束 3：向下取整</b>把 0.8 变成 0。<br>\n      三条叠加，结果必然为 0。<br>\n      <b>教学要点：查表顺序永远是「先表 B 定要不要超售，再表 E 定超多少」。</b>若顺序反了，直接套表 E 会算出 2% × 0.5 × 0.5 = 0.5% → 320 × 0.5% = 1.6 → 1 间，在峰值日多超售 1 间，而这一天你几乎不可能找到地方送走客人。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 4 · 撤除事故复盘</div>\n    <div class=\"q-b\">9 月 25 日（D2 展会日）对 STD-K 设了 Stop Sell（为升级腾房），到期日应为 9 月 26 日，但撤除流程没走。9 月 30 日周一全量对账时才发现 STD-K 仍为停售状态。<br>请：① 估算损失房晚（STD-K 共 70 间，同期其余房型平均 OCC 78%，STD-K 历史占比 22%）；② 说明三重保险中哪几重失效了；③ 写出补救动作与后续防复发措施。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 损失估算：</b><br>\n      过期天数 = 9/26 至 9/30（含）= <b>5 天</b><br>\n      全店日均已售房晚 = 320 × 78% = <b>249.6 间</b><br>\n      STD-K 历史占比 22% → 日均应售 STD-K = 249.6 × 22% = <b>54.9 间</b><br>\n      <b>5 天损失房晚 ≈ 274 间</b>；按 STD-K 平峰 BAR ¥580 ×（1 − 渠道综合成本率 10%）= 净 ¥522/间<br>\n      <b>直接经济损失 ≈ 274 × 522 = ¥143,028</b><br>\n      <b>注：</b>这是保守估算——实际还有一部分需求会转移到 SUP 等更高房型（升档销售），真实损失会低于此数；但也会有对价格敏感的客人直接流失，真实损失也可能更高。<b>报告时应写明估算口径与不确定性。</b><br><br>\n      <b>② 三重保险的失效情况：</b><br>\n      <b>保险一（设置即登记）：失效。</b>若已登记进《限制条件存量清单》并填了到期日 9-26，则下面两重至少有一重能拦住。5 天未被发现，高度怀疑<b>根本没登记</b>。<br>\n      <b>保险二（每日扫描）：失效。</b>9/26–9/30 连续 5 天的 08:30 扫描都没有筛出这一行。要么扫描动作根本没执行，要么清单里没有这一行。<br>\n      <b>保险三（周一全量对账）：部分生效。</b>9 月 30 日（周一）的对账发现了问题——<b>这是唯一起作用的一重，但晚了 5 天</b>。<br>\n      <b>根因：保险一没做。</b>后面两重都依赖于第一重产生的清单。<br><br>\n      <b>③ 补救与防复发：</b><br>\n      <b>补救：</b>① 立即撤除（本店侧 + 渠道侧两层），按撤除五步法执行并试订验证；② 在《调价台账》登记为事故，备注写明「过期 5 天，损失房晚约 274 间，直接损失约 ¥143,028」；③ 上报 L2 与驻店经理；④ 立即筛查 9/26–9/30 期间被 OTA 拒单的客人，能召回的做定向挽回（直销专享价 + 会员积分）。<br>\n      <b>防复发：</b>① 把「设置即登记」写入 L1 的岗位操作卡，<b>未登记的限制条件视为未设置，不得执行</b>；② 在《限制条件存量清单》加一列「登记人」，与设置人交叉复核；③ 把周一全量对账改为<b>每日晨会（10:05）口头确认一次到期项</b>，把周期从 7 天压到 1 天；④ 用系统的限制条件报表做自动导出（见 M04 第 12 节自动化改造第 5 条），<b>不依赖人工维护的清单</b>。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 5 · 免费升级排序（表 J）</div>\n    <div class=\"q-b\">某日高档房空置 24%（共 100 间高档房，空 24 间），需挑 3 位客人从 SUP 升到 DLX。候选人如下：<br>\n    甲：钻石，预订价 ¥680，住 2 晚，复购 5 次<br>\n    乙：铂金，预订价 ¥820，住 1 晚，复购 20 次<br>\n    丙：钻石，预订价 ¥660，住 4 晚，复购 3 次<br>\n    丁：钻石，预订价 ¥680，住 2 晚，复购 9 次<br>\n    戊：银卡，预订价 ¥880，住 7 晚，复购 31 次<br>\n    己：金卡，预订价 ¥750，住 3 晚，复购 1 次<br>\n    请：① 给出完整排序与理由；② 指出哪两位入选；③ 若第 3 位客人坚持要升到 STE 套房，该怎么处理？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 排序过程：</b><br>\n      <b>第 1 级 · 会员等级：</b>钻石 {甲、丙、丁} &gt; 铂金 {乙} &gt; 金卡 {己} &gt; 银卡 {戊}。<br>\n      3 个名额全部在钻石组内产生，<b>乙、己、戊本轮无份</b>。<br>\n      <b>（关键：戊的 ¥880 最高、住 7 晚最久、复购 31 次最多，但他是银卡，第 1 级就被淘汰了，后面三项都不再比。）</b><br>\n      <b>第 2 级 · 同档内比预订价：</b>丙 ¥660 &lt; 甲 ¥680 = 丁 ¥680 → <b>丙出局</b>。<br>\n      <b>第 3 级 · 同价比入住天数：</b>甲 2 晚 = 丁 2 晚 → 平手，进入第 4 级。<br>\n      <b>第 4 级 · 复购次数：</b>丁 9 次 &gt; 甲 5 次 → <b>丁第 1，甲第 2</b>。<br>\n      <b>第 3 名回到钻石组剩余者：丙</b>（第 2 级被淘汰，但钻石组只有 3 人，第 3 个名额仍给丙）。<br>\n      <b>完整排序：① 丁 ② 甲 ③ 丙 ④ 乙 ⑤ 己 ⑥ 戊</b><br><br>\n      <b>② 入选：丁、甲、丙，均从 SUP 升到 DLX（升 1 档，符合表 J「最多升 1 档」）。</b><br><br>\n      <b>③ 若第 3 位客人坚持升到 STE 套房：</b><br>\n      SUP → STE 是<b>连跳 2 档</b>（SUP → DLX → STE），<b>表 J 明令禁止，除 L3 特批</b>。<br>\n      处理步骤：① 明确告知客人：按规则最多升 1 档（到 DLX）；② 若客人不接受，<b>不得擅自办理</b>，立即发起 L3 特批，说明客人等级、原因、原房型与目标房型；③ 取得 L3 书面确认后办理，并在《升级台账》第 7 列「升档数」填 2、第 10 列「审批人」填 L3 姓名、备注写明特批理由；④ 若涉及套房，<b>还要核查当日套房升级是否已满 3 间</b>，满 3 间则即使 L3 特批也不得办理（两条硬约束独立生效）。<br>\n      <b>替代方案（不占用套房额度）：</b>升级到 DLX + 赠送双早（¥256）+ 行政酒廊权益，成本远低于套房，且不受 3 间额度限制。这是前厅应优先提出的方案。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 6 · 步行客人预案完整执行</div>\n    <div class=\"q-b\">11 月 12 日超售日，21:00 判定缺口 2 间，需送走 2 位客人：客人 X（铂金会员，本店成交价 ¥680，SUP-K）；客人 Y（非会员，本店成交价 ¥563，STD-K）。备用酒店 B 滨江希尔顿花园（2.5km，同档，房价 ¥720）当日有房。<br>请：① 按四步补偿包逐项写出对两位客人的处置；② 估算直接成本；③ 写出事后复盘必须做的四件事。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 四步补偿包：</b><br>\n      <b>第 1 步 · 安排同档酒店 + 承担差价与交通：</b><br>\n      客人 X：B 滨江希尔顿花园（中高端，与本店同档 ✓），房费 ¥720，本店成交价 ¥680 → 差价 <b>¥40</b>；交通 2.5km 往返打车约 <b>¥120</b> → 小计 <b>¥160</b><br>\n      客人 Y：同酒店，房费 ¥720，本店成交价 ¥563 → 差价 <b>¥157</b>；交通 <b>¥120</b> → 小计 <b>¥277</b><br>\n      <b>注意差价按「客人实际成交价」算，不是按 BAR ¥680 算。</b>客人 Y 买的是 STD-K 促销价 ¥563，差价就是 ¥720 − ¥563 = ¥157。<br>\n      <b>第 2 步 · 下次入住免费升级 1 档 + 双早：</b><br>\n      两位各发 1 张券：升级 1 档（X：SUP→DLX，差价 ¥140；Y：STD→SUP，差价 ¥100）+ 双早（¥128 × 2 = ¥256）<br>\n      X：140 + 256 = <b>¥396</b>　Y：100 + 256 = <b>¥356</b>　小计 <b>¥752</b><br>\n      券面必须写明<b>有效期 12 个月</b>，并记录券号。<br>\n      <b>第 3 步 · 忠诚会员额外补偿 5,000 积分：</b><br>\n      <b>仅客人 X（铂金）发放 5,000 积分；客人 Y 非会员，不适用。</b>不按等级差异化——若 X 是钻石，同样是 5,000 积分。<br>\n      成本 ≈ 5,000 × 约 ¥0.01/分 ≈ <b>¥50</b>（按 LOY 渠道 4% 综合成本率折算口径记账）<br>\n      <b>第 4 步 · 总经理签名致歉信 + 值班经理全程跟进：</b><br>\n      两位各一封<b>总经理亲笔预签</b>的致歉信（含四项要素：承认超售失误 / 说明已安排的同档酒店与承担范围 / 写明后续补偿 / 留总经理与值班经理直联方式）。<br>\n      值班经理：送客人上车 → 到店确认入住 → <b>次日致电确认回本店安排</b> → 离店后 72 小时内回访。<br>\n      成本（信函 + 人力）≈ <b>¥200</b><br><br>\n      <b>② 直接成本合计：</b>160 + 277 + 752 + 50 + 200 = <b>¥1,439</b>（约 ¥720/人次）<br><br>\n      <b>③ 事后复盘四件事（表 L：重算表 E 参数）：</b><br>\n      <b>a. 重算 No-show 率与 24h 内取消率</b>：取 11 月全月数据重算，与表 E 计算时采用的历史值对比。若高出 5 个百分点以上，说明输入已过时。<br>\n      <b>b. 核查修正系数是否漏项</b>：11/12 为 D3 平峰（×1）、担保占比多少？会议团队占比多少？协议集中度多少？逐条回看，看有没有漏乘的 ×0.5 / ×0.8。<br>\n      <b>c. 核查备用酒店假设</b>：11/12 当日 30 分钟内的同档备用酒店是否真有房？本次 B 酒店有房，假设成立；若无房，第三步的减半是否被正确应用？<br>\n      <b>d. 重设未来 30 天的超售上限</b>：按修正后的参数重算，并在《调价台账》备注写明「依表 L 复盘重算，原上限 9 间调整为 X 间」。<br>\n      <b>产出物：《超售过度复盘报告》，7 天内完成。</b>\n    </div></details>\n  </div>\n\n  <\!-- ================= 十五 ================= -->\n  <h2 id=\"s15\">十五、判定表默写清单</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">✎</span>当堂默写（限时 15 分钟）</div>\n    <ul class=\"checklist\">\n      <li>《法典》表 B 的 5 行边界：≥95% / 90.0–95.0% / 85.0–90.0% / 70.0–85.0% / &lt;70.0%（<b>含下界不含上界</b>）</li>\n      <li>《法典》表 B 的四列：MinLOS / CTA / 低价渠道 Stop Sell / 超额预订（<b>四列同时配置，不是四选一</b>）</li>\n      <li>表 B 各行的 MinLOS：≥95% → 2 晚（D1 峰值日 3 晚）；90–95% → 2 晚；85–90% → 1–2 晚（周末 2 晚）；70–85% → 1 晚；&lt;70% → 不设限</li>\n      <li>表 B 各行的 CTA：≥95% → 启用；90–95% → <b>D1 日启用</b>；其余三行 → 否</li>\n      <li>表 B 各行的超额预订：≥95% → 不超售；90–95% → <b>≤2 间</b>；85–90% → 按表 E；70–85% → 按表 E；&lt;70% → 不超售</li>\n      <li>《法典》表 E 第一步六档：&lt;5%→0%、5–10%→2%、10–15%→3%、15–20%→5%、20–30%→7%、&gt;30%→10%（需 L3 审批）</li>\n      <li>《法典》表 E 第二步四个修正系数：D1/D2 → ×0.5；担保 &gt;60% → ×0.5；会议团队 &gt;40% → ×0.5；协议集中度 &gt;50% → ×0.8</li>\n      <li>《法典》表 E 第三步三条硬上限：≤可售房量 5%（云璟 320 间 → 16 间）；≤15 间；30 分钟内无同档备用酒店 → <b>超售率减半</b></li>\n      <li>表 E 计算顺序：先减半 → 再比大小（取 min）→ 最后向下取整</li>\n      <li>超售房型分配两条规则：套房（STE-B 8 + STE-E 2 = 10 间）不参与；按比例 + 最大余数法补齐</li>\n      <li>《法典》表 J 三个触发条件：① 超售需要腾房 ② 高档房预测空置 &gt;20% ③ 会员权益兑现</li>\n      <li>《法典》表 J 四级排序：钻石&gt;铂金&gt;金卡&gt;银卡 → 同档内预订价高者先 → 同价入住天数长者先 → 相同复购次数多者先</li>\n      <li>《法典》表 J 两条硬约束：最多升 1 档（禁连跳 2 档，除 L3 特批）；套房升级每日 ≤3 间且须 L3 审批</li>\n      <li>《升级台账》表 J 要求的三个必记项：原因、房号、会员等级</li>\n      <li>《步行客人预案》四步：① 同档或更高档酒店 + 承担房费差价与交通费 ② 本店下次升级 1 档 + 双早 ③ 忠诚会员 5,000 积分 ④ 总经理签名致歉信 + 值班经理全程跟进</li>\n      <li>限制条件撤除五步法：查到期日 → 两层都撤 → 试订验证 → 截图存证 → 台账登记 + 清单更新</li>\n      <li>《限制条件存量清单》8 个字段，其中第 6 列「到期日」= 生效结束日的<b>次日</b></li>\n      <li>三重保险：设置即登记 / 每日 08:30 扫描（3 分钟）/ 每周一全量对账</li>\n    </ul>\n  </div>\n\n  <\!-- ================= 十六 ================= -->\n  <h2 id=\"s16\">十六、随堂测（5 题）</h2>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 1 题</div>\n    <div class=\"q-b\">CTA 与 Stop Sell 有什么本质区别？如果误把 CTA 当 Stop Sell 用，会发生什么？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>CTA 只挡「新到店」，不挡「延续入住」；Stop Sell 是完全不可售，什么都不让订。</b><br>\n      解析：CTA（Closed to Arrival，不可入住）的作用点是<b>入住日</b>——它拒绝「以该日为入住日的新订单」，但已经在住的客人可以正常延续跨过这一天。<br>\n      Stop Sell（停售/关房）是把该房型/价格代码/渠道在某日<b>整体置为不可售</b>，与库存余量无关，任何人都订不到。<br>\n      <b>误用后果：</b>若本想做 CTA（挡新客、保留续住）却设成了 Stop Sell，会把已经在住客人的续住请求一起挡掉——系统会把续住视为「该日的新预订」而拒绝。结果是：<b>满房日的续住客人在前台被告知「系统订不了」，引发严重客诉，且前厅需要用手工单绕开系统，造成房态与账务不同步。</b><br>\n      反之，若本想 Stop Sell 却设成 CTA，房间仍会被延续入住占用，达不到腾房目的。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 2 题</div>\n    <div class=\"q-b\">表 E 第三步的「无备用酒店 → 超售率减半」，减半作用在哪个量上？如果先向下取整再减半会怎样？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>减半作用在「修正后的超售率」上，不是作用在「超售间数」上；且减半必须在向下取整之前完成。</b><br>\n      解析：正确顺序是——① 修正后超售率 × 0.5 → 最终超售率；② 超售间数（未取整）= 可售房量 × 最终超售率；③ 取硬上限 min(未取整值, 可售×5%, 15)；④ 最后向下取整。<br>\n      <b>错误示范：</b>假设修正后超售率 3%，可售 320 间。<br>\n      正确：3% × 0.5 = 1.5% → 320 × 1.5% = 4.8 → <b>4 间</b><br>\n      错误（先取整再减半）：320 × 3% = 9.6 → 取整 9 间 → 9 ÷ 2 = 4.5 → <b>4 间</b>（本例巧合相同）<br>\n      <b>换个数字就能看出差异：</b>修正后超售率 1%，可售 320 间。<br>\n      正确：1% × 0.5 = 0.5% → 320 × 0.5% = 1.6 → <b>1 间</b><br>\n      错误：320 × 1% = 3.2 → 取整 3 → 3 ÷ 2 = 1.5 → 若再取整得 <b>1 间</b>，若不取整得 <b>1.5 间</b>（非法，房间不能是小数）<br>\n      <b>更关键的是「超售率减半」而非「间数减半」在大幅超售时的差异：</b>若修正后 10%、可售 312：<br>\n      正确：10% × 0.5 = 5% → 312 × 5% = 15.6 → 硬上限 15 → <b>15 间</b><br>\n      错误：312 × 10% = 31.2 → 硬上限 15 → 15 → 15 ÷ 2 = 7.5 → <b>7 间</b><br>\n      <b>两者相差 8 间。</b>所以顺序必须对。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 3 题</div>\n    <div class=\"q-b\">《法典》表 J 第 2 级排序「同档内：预订价高者优先」的「同档内」指的是什么？一个付 ¥900 的银卡会员和一个付 ¥600 的钻石会员，谁先升？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>「同档内」指「同一会员等级内部」。钻石会员先升，与预订价无关。</b><br>\n      解析：表 J 的四级排序是<b>严格按序的层级判定</b>，不是加权打分。第 1 级（会员等级）就能分出胜负时，后面三级<b>根本不再比较</b>。<br>\n      钻石 &gt; 银卡 → 第 1 级已定胜负 → 钻石会员先升。<br>\n      「预订价高者优先」是第 2 级规则，只在<b>第 1 级打平时</b>才启动——即两个都是钻石、或两个都是铂金时，才去比谁的原预订价高。<br>\n      <b>这个规则的设计意图：</b>会员等级代表客人的长期价值，预订价只代表本次交易的金额。一个钻石会员即使是本次订了低价房（比如用了积分或协议价），他的<b>生命周期价值</b>仍高于一个偶尔订高价的银卡会员。<br>\n      <b>常见错误：</b>把四级规则当成「综合评分」加权计算，这是彻底误读。表 J 写的是「执行顺序（严格按序）」。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 4 题</div>\n    <div class=\"q-b\">为什么超售的房型分配要排除套房？如果一定要给套房设超售，需要满足什么条件？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>因为套房间数极少而超售失败代价极高；若一定要设，须 L3 特批并单独评估，且不得占用常规分配额度。</b><br>\n      解析：<b>排除套房的两个理由：</b><br>\n      ① <b>统计意义不足。</b>云璟套房共 10 间（STE-B 8 + STE-E 2），占房量 3.1%。按 3% 的比例分配，10 间 × 超售率只能分到零点几间，对整体超售目标贡献微乎其微。<br>\n      ② <b>失败代价不对称。</b>超售失败时，把付 ¥1,280 的套房客送走，补偿成本（需安排同档或更高档的套房，本区域同档套房极少且极贵）+ 客诉烈度（套房客通常是高价值或纪念日客人）+ 忠诚会员流失风险，<b>远高于多卖一间标准房的收益</b>。<br>\n      <b>若一定要给套房设超售：</b>① 必须 L3 特批，写明理由；② 单独计算，<b>不纳入表 E 的常规分配基数</b>（即 310 间的分配不受影响）；③ 必须有确定的同档或更高档套房作为备用（普通房不算「同档」）；④ 在《超售日监控表》与《升级台账》中单独标记。<br>\n      <b>本学院立场：默认不给套房设超售。</b>上表的四个条件只是「万一要做时的最低要求」，不是鼓励去做。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 5 题</div>\n    <div class=\"q-b\">限制条件撤除五步法里，第 3 步「试订验证」为什么不能省？请举一个「看起来撤了、实际没撤干净」的具体例子。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>因为限制条件是按「日期 × 房型 × 价格代码 × 渠道」四元组设置的，撤除时很容易只撤了其中一个维度，留下残片。系统的库存显示不会告诉你这是「本来就满房」还是「被限制挡住了」。</b><br>\n      解析：<b>具体例子：</b>9 月 19 日设 MinLOS = 2 晚时，操作人按房型逐个设置，设了 STD-K / STD-T / SUP-K / SUP-T / DLX-K 五档（当时只想着挡散客主力房型）。撤除时，操作人在「限制条件」页面按<b>日期</b>批量清空——但系统里 MinLOS 是按「日期 × 房型 × 价格代码」存的，批量清空只清了<b>当前筛选条件下显示的那几档</b>，DLX-V / EXE-K / EXE-T 三档的 MinLOS = 2 仍在生效。<br>\n      <b>表现：</b>9 月 20 日起，STD 与 SUP 能订 1 晚，但 DLX-V / EXE-K / EXE-T 只能订 2 晚以上。OTA 上这三个房型显示「不可订（1 晚）」，客人以为售罄。而收益专员看「全店可售房量」是正常的，完全看不出问题。<br>\n      <b>后果：</b>这三个房型共 45 间（DLX-V 15 + EXE-K 25 + EXE-T 5），占房量 14%，在平峰日连续多天接不到单晚商务客。<br>\n      <b>试订验证能拦住它：</b>按表 7-6 的试订矩阵，撤 MinLOS 后要试订「该日入住 1 晚」——但<b>必须逐房型试订</b>，不能只试一个房型。若只试 STD-K 成功就认为撤干净了，仍会漏掉 DLX-V / EXE / EXE-T。<br>\n      <b>所以试订验证的操作标准是：逐房型、逐价格代码试订，并把试订成功的页面截图存证。</b>\n    </div></details>\n  </div>\n\n  <\!-- ================= 十七 ================= -->\n  <h2 id=\"s17\">十七、本模块产出物</h2>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">结课交付清单</span>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>《库存与限制条件配置卡》</b>——表 B 的 5 行 × 4 列一页纸版，含四列的执行要点与易错点，前台与收益人手一份</li>\n      <li><b>《限制条件存量清单》</b>——8 字段，含「到期日」列；设置为生效中时必登记，撤除后更新状态</li>\n      <li><b>《撤除五步法检查卡》</b>——含表 7-6 试订矩阵（逐房型、逐价格代码），贴在工位</li>\n      <li><b>《超售计算表》</b>——表 E 三步法的 Excel 自动计算模板，输入 5 个参数自动输出超售上限与房型分配（含套房排除与最大余数法）</li>\n      <li><b>《超售日监控表》</b>——8 字段，含超售余额自动告警（余额 ≤0 时标红并提示关闭超售）</li>\n      <li><b>《升级台账》</b>——11 字段，含升档数自动标红（&gt;1 即触发 L3 特批核查）与套房每日 3 间额度自动计数</li>\n      <li><b>《步行客人预案包》</b>——备用酒店名单模板（含实时房态确认栏）+ 四步补偿包执行单 + 总经理预签致歉信模板 + 补偿成本速算表</li>\n      <li><b>《超售过度复盘报告》模板</b>——四项复盘动作（重算 No-show、核查修正系数、核查备用酒店、重设 30 天上限）</li>\n      <li><b>表 B / 表 E / 表 J 默写卷</b>——当堂完成，错一格重默</li>\n    </ul>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">→</span>下一模块预告</div>\n    <p>库存管好了，接下来要管「这些房间通过谁卖出去」。M08 渠道与分销管理会把《法典》表 H（渠道开关判定表，6 档 OCC × 5 类渠道）讲透，并回答一个本模块埋下的伏笔：<b>表 B 的「低价渠道 Stop Sell」列到底在关哪些渠道、关了之后少赚多少</b>。<br>\n    你会学到 7 个渠道的真实成本（直销 3%、会员 4%、协议 8%、GDS 13%、OTA 国内 16%、OTA 国际 18%、批发商 26%），以及一个反直觉的结论：<b>OTA 卖 ¥600（净 ¥504）不如直销卖 ¥530（净 ¥514）——便宜 70 元反而多赚 10 元。</b>理解了这一点，你才会明白为什么表 B 要在旺日去关那些看起来「卖得很好」的渠道。</p>\n  </div>\n\n  <\!-- ===== 底部导航 ===== -->\n  <div class=\"p-title\">M06 价格体系设计</div></a>\n    <a href=\"m08.html\" class=\"p-next\"><div class=\"p-dir\">下一模块 →</div><div class=\"p-title\">M08 渠道与分销管理</div></a>\n  </div>\n\n</div>\n"}]}, {"n": 8, "t": "渠道与净价", "part": "L2 主管", "mod": "模块 M08", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n  <\!-- ===== 页头 ===== -->\n  <div class=\"crumb\">\n    <a href=\"../index.html\">学院首页</a><span>/</span>\n    <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n    L2 模块八\n  </div>\n\n  <div class=\"page-head\">\n    <div class=\"badge-row\">\n      <span class=\"badge badge-l2\">L2 收益管理主管</span>\n      <span class=\"badge\">模块 M08</span>\n      <span class=\"badge\">6 课时 / 540 min</span>\n      <span class=\"badge\">占 L2 认证 18.75%</span>\n      <span class=\"badge\">前置 M07</span>\n      <span class=\"badge badge-core\">★ 核心模块</span>\n    </div>\n    <h1 class=\"page-title\">渠道与分销管理</h1>\n    <p class=\"page-lede\">一句话导语：同样一间房，通过不同渠道卖出，落到你口袋里的钱能差 23 个百分点——本模块先把这个真相摆到台面上（NRevPAR），再给出《法典》表 H 的 6 档渠道开关判定表、价格一致性（Rate Parity）四条红线的核查与整改 SOP、OTA 排名的可执行动作清单，以及直销提升的 8 个标准动作。学完你会明白：<b>渠道管理不是「哪个渠道卖得多就多用哪个」，而是「哪个渠道净落袋多就用哪个」。</b></p>\n  </div>\n\n  <\!-- ===== 学习目标 ===== -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n    <ul>\n      <li>能<b>背出</b> 云璟 7 个渠道的综合成本率（直销 3% / 会员 4% / 协议 8% / GDS 13% / OTA 国内 16% / OTA 国际 18% / 批发商 26%），并算出任意渠道结构下的渠道综合成本率</li>\n      <li>能<b>算出</b> NRevPAR = RevPAR ×（1 − 渠道综合成本率），并能解释「OTA 卖 ¥600（净 ¥504）不如直销卖 ¥530（净 ¥514）」这个反直觉结论及其平衡点价格</li>\n      <li>能<b>完整默写并套用</b>《法典》表 H（6 档预测 OCC × 5 类渠道开关），并独立写出任意预测 OCC 档位下的全渠道配置动作</li>\n      <li>能<b>独立执行</b> 价格一致性（Rate Parity）四条红线的 6 步核查法，并在发现违规时按整改 SOP 完成定位、判成因、处置、复查留痕四步</li>\n      <li>能<b>说出并落地</b> OTA 排名优化的可执行动作清单（每条带具体标准数字）与直销提升的 8 个标准动作（每个带触发条件与验收数字）</li>\n      <li>能<b>判断</b> 表 B 的「低价渠道 Stop Sell」与表 H 的渠道开关冲突时的仲裁结果（表 B 优先级 2 &gt; 表 H 优先级 5）</li>\n    </ul>\n    <p class=\"card-note\">前置要求：M01 指标与计算（RevPAR / ADR 口径）、M03 每日操作流水线（09:40 一致性核查时段、表 H 的引用）、M06 价格体系设计（BAR 与衍生价格，会员价 88% 下限的来源）、M07 库存与限制条件战术（表 B 的低价渠道 Stop Sell 列，优先级高于表 H）。<br>\n    本模块完整内嵌《法典》<b>表 H</b>（渠道开关判定表 + 价格一致性红线）；引用 <b>表 A</b>、<b>表 B</b>、<b>表 D</b>、<b>表 I</b>、<b>表 L</b>、<b>表 M</b>、<b>表 N</b>、<b>表 O</b>。渠道成本率与客源结构来自《SPEC》2.3。全部阈值以《SPEC》为唯一版本。</p>\n  </div>\n\n  <\!-- ===== 目录 ===== -->\n  <div class=\"toc\">\n    <div class=\"toc-title\">本模块目录</div>\n    <ol>\n      <li><a href=\"#s1\">渠道地图：7 个渠道、7 个成本率</a></li>\n      <li><a href=\"#s2\">渠道成本真相：同一个客人，7 种落袋金额</a></li>\n      <li><a href=\"#s3\">NRevPAR：剔除渠道成本后的真实收益</a></li>\n      <li><a href=\"#s4\">★ 反直觉结论：OTA 卖 ¥600 不如直销卖 ¥530</a></li>\n      <li><a href=\"#s5\">净收益平衡点：各渠道的最低可接受售价</a></li>\n      <li><a href=\"#s6\">《法典》表 H · 渠道开关判定表（完整内嵌）</a></li>\n      <li><a href=\"#s7\">表 H 的落位：两个层级、五类渠道</a></li>\n      <li><a href=\"#s8\">价格一致性（Rate Parity）四条红线</a></li>\n      <li><a href=\"#s9\">价格一致性 6 步核查法（7 渠道版）</a></li>\n      <li><a href=\"#s10\">违规整改 SOP：定位 → 判成因 → 处置 → 复查留痕</a></li>\n      <li><a href=\"#s11\">OTA 排名优化：可执行动作清单（带标准数字）</a></li>\n      <li><a href=\"#s12\">直销提升的 8 个标准动作</a></li>\n      <li><a href=\"#s13\">主流系统操作路径映射表</a></li>\n      <li><a href=\"#s14\">讲师示范：一次渠道结构调整的完整测算</a></li>\n      <li><a href=\"#s15\">学员跟练（6 题，含 2 道 NRevPAR）</a></li>\n      <li><a href=\"#s16\">判定表默写清单（当堂默写）</a></li>\n      <li><a href=\"#s17\">随堂测（5 题）</a></li>\n      <li><a href=\"#s18\">本模块产出物</a></li>\n    </ol>\n  </div>\n\n  <\!-- ================= 一 ================= -->\n  <h2 id=\"s1\">一、渠道地图：7 个渠道、7 个成本率</h2>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">先建立一个观念：渠道成本不是「手续费」，是「这个客人的获取成本」</span>\n    <p>很多人把佣金看成财务上的一个小扣项。<b>错。</b>佣金是你为「让这个客人知道你、选择你、完成支付」付出的全部代价。它必须被当成<b>获客成本</b>来管理，与房价放在同一个天平上称。</p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption>表 8-1　云璟 7 个渠道的综合成本率<span class=\"cap-note\">《SPEC》2.3 原文，唯一权威版本</span></caption>\n      <thead><tr><th>渠道</th><th>代码</th><th class=\"num\">综合成本率</th><th>成本构成说明</th><th>净留存率</th></tr></thead>\n      <tbody>\n        <tr><td><b>直销</b>（官网 / 小程序 / 前台）</td><td><code>DIR</code></td><td class=\"num\"><b>3%</b></td><td>支付通道费 + 系统费</td><td class=\"num\">97%</td></tr>\n        <tr><td><b>会员直订</b></td><td><code>LOY</code></td><td class=\"num\"><b>4%</b></td><td>3% 支付系统 + 约 1% 积分成本</td><td class=\"num\">96%</td></tr>\n        <tr><td><b>协议公司</b>（含返佣 / 账期）</td><td><code>CORP</code></td><td class=\"num\"><b>8%</b></td><td>公司返佣 + 账期资金成本 + 差旅管理费</td><td class=\"num\">92%</td></tr>\n        <tr><td><b>GDS / 商旅 TMC</b></td><td><code>GDS</code></td><td class=\"num\"><b>13%</b></td><td>GDS 通道费 + TMC 服务费</td><td class=\"num\">87%</td></tr>\n        <tr><td><b>OTA 国内</b>（携程 / 美团 / 飞猪）</td><td><code>OTA</code></td><td class=\"num\"><b>16%</b></td><td>平台佣金 +  promotional 分摊</td><td class=\"num\">84%</td></tr>\n        <tr><td><b>OTA 国际</b>（Booking / Agoda）</td><td><code>OTA-I</code></td><td class=\"num\"><b>18%</b></td><td>平台佣金 + 跨境结算成本</td><td class=\"num\">82%</td></tr>\n        <tr><td><b>批发商 / 包房商</b></td><td><code>WHO</code></td><td class=\"num\"><b>26%</b></td><td>批发净价折让 + 包房商利润</td><td class=\"num\">74%</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">最高与最低差 23 个百分点</span>\n    <p>直销 3% 与批发商 26%，<b>相差 23 个百分点</b>。这意味着同样卖 ¥680 的一间房：<br>\n    直销落袋 <b>¥659.6</b>，批发商落袋 <b>¥503.2</b>，<b>差 ¥156.4</b>。<br>\n    <b>一间差 ¥156，一年 116,800 个可售房晚，哪怕只有 5% 的房晚从批发商转到直销，就是 ¥91 万。</b></p>\n  </div>\n\n  <h3>1.1 客源细分与渠道的对应关系（本学院教学用映射）</h3>\n\n  <p>《SPEC》2.3 同时给出了<b>7 个市场细分</b>的房晚占比与<b>7 个渠道</b>的成本率，但两者不是一一对应的。为了能算出渠道综合成本率，本学院给出以下<b>教学用映射</b>，并在全学院统一使用：</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 8-2　客源细分 → 渠道映射（本学院教学用口径）<span class=\"cap-note\">映射后渠道占比合计 100%，且 OTA 国内 + OTA 国际 = FIT-OTA 31%、GDS + WHO = GRP 8% + LNG 2%</span></caption>\n      <thead><tr><th>渠道</th><th>代码</th><th class=\"num\">成本率</th><th>对应市场细分</th><th class=\"num\">房晚占比</th><th class=\"num\">加权成本</th></tr></thead>\n      <tbody>\n        <tr><td><b>直销</b></td><td><code>DIR</code></td><td class=\"num\">3%</td><td>FIT-DIR 17% + FIT-WI 8%（上门散客按前台直销计）</td><td class=\"num\">25%</td><td class=\"num\">0.75%</td></tr>\n        <tr><td><b>会员直订</b></td><td><code>LOY</code></td><td class=\"num\">4%</td><td>LOY 忠诚计划 12%</td><td class=\"num\">12%</td><td class=\"num\">0.48%</td></tr>\n        <tr><td><b>协议公司</b></td><td><code>CORP</code></td><td class=\"num\">8%</td><td>CORP 协议公司 22%</td><td class=\"num\">22%</td><td class=\"num\">1.76%</td></tr>\n        <tr><td><b>OTA 国内</b></td><td><code>OTA</code></td><td class=\"num\">16%</td><td>FIT-OTA 31% 中的国内部分</td><td class=\"num\">26%</td><td class=\"num\">4.16%</td></tr>\n        <tr><td><b>OTA 国际</b></td><td><code>OTA-I</code></td><td class=\"num\">18%</td><td>FIT-OTA 31% 中的国际部分</td><td class=\"num\">5%</td><td class=\"num\">0.90%</td></tr>\n        <tr><td><b>GDS / TMC</b></td><td><code>GDS</code></td><td class=\"num\">13%</td><td>GRP 与 LNG 中走商旅通路的部分</td><td class=\"num\">5%</td><td class=\"num\">0.65%</td></tr>\n        <tr><td><b>批发商 / 包房</b></td><td><code>WHO</code></td><td class=\"num\">26%</td><td>GRP 与 LNG 中走批发通路的部分</td><td class=\"num\">5%</td><td class=\"num\">1.30%</td></tr>\n        <tr><td colspan=\"4\"><b>合计</b></td><td class=\"num\"><b>100%</b></td><td class=\"num\"><b>10.00%</b></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">这张映射表的性质（务必讲清楚，避免学员误用）</span>\n    <p>《SPEC》2.3 给的是<b>市场细分占比</b>（7 个细分）与<b>渠道成本率</b>（7 个渠道），<b>没有给出两者的对应关系</b>。表 8-2 的映射是本学院为教学计算而设定的<b>统一假设</b>，满足两个约束：<br>\n    ① 各渠道占比之和 = 100%；② OTA 国内 + OTA 国际 = FIT-OTA 的 31%；GDS + WHO = GRP 8% + LNG 2% = 10%。<br>\n    <b>每月 5 日的《客源渠道报告》中，必须使用本店 PMS 导出的真实渠道占比重算，不得沿用教学假设值。</b>教学假设值仅用于课堂练习与考试。</p>\n  </div>\n\n  <h2 id=\"s2\">二、渠道成本真相：同一个客人，7 种落袋金额</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 8-3　同一间房（平峰 BAR ¥680）通过 7 个渠道卖出的落袋金额<span class=\"cap-note\">净收益 = 售价 ×（1 − 该渠道综合成本率）</span></caption>\n      <thead><tr><th>渠道</th><th class=\"num\">成本率</th><th class=\"num\">售价</th><th class=\"num\">渠道成本</th><th class=\"num\">净收益</th><th class=\"num\">vs 直销</th></tr></thead>\n      <tbody>\n        <tr><td><b>直销 DIR</b></td><td class=\"num\">3%</td><td class=\"num\">¥680</td><td class=\"num\">¥20.4</td><td class=\"num\"><b>¥659.6</b></td><td class=\"num\"><span class=\"flat\">基准</span></td></tr>\n        <tr><td>会员 LOY</td><td class=\"num\">4%</td><td class=\"num\">¥680</td><td class=\"num\">¥27.2</td><td class=\"num\">¥652.8</td><td class=\"num\"><span class=\"down\">↓¥6.8</span></td></tr>\n        <tr><td>协议 CORP</td><td class=\"num\">8%</td><td class=\"num\">¥680</td><td class=\"num\">¥54.4</td><td class=\"num\">¥625.6</td><td class=\"num\"><span class=\"down\">↓¥34.0</span></td></tr>\n        <tr><td>GDS / TMC</td><td class=\"num\">13%</td><td class=\"num\">¥680</td><td class=\"num\">¥88.4</td><td class=\"num\">¥591.6</td><td class=\"num\"><span class=\"down\">↓¥68.0</span></td></tr>\n        <tr><td>OTA 国内</td><td class=\"num\">16%</td><td class=\"num\">¥680</td><td class=\"num\">¥108.8</td><td class=\"num\">¥571.2</td><td class=\"num\"><span class=\"down\">↓¥88.4</span></td></tr>\n        <tr><td>OTA 国际</td><td class=\"num\">18%</td><td class=\"num\">¥680</td><td class=\"num\">¥122.4</td><td class=\"num\">¥557.6</td><td class=\"num\"><span class=\"down\">↓¥102.0</span></td></tr>\n        <tr><td>批发商 WHO</td><td class=\"num\">26%</td><td class=\"num\">¥680</td><td class=\"num\">¥176.8</td><td class=\"num\">¥503.2</td><td class=\"num\"><span class=\"down\">↓¥156.4</span></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-gold\">\n    <span class=\"co-t\">记住这三个「转换差值」，日常决策够用了</span>\n    <p>以平峰 BAR ¥680 为基准，把一间房从高成本渠道转到低成本渠道，每转一间净赚：<br>\n    <b>OTA 国内 → 直销：+¥88.4</b>（13 个百分点 × ¥680）<br>\n    <b>OTA 国际 → 直销：+¥102.0</b>（15 个百分点 × ¥680）<br>\n    <b>批发商 → 直销：+¥156.4</b>（23 个百分点 × ¥680）<br>\n    这三个数字就是表 B 在旺日要求「关闭批发商」「关闭尾房特惠」的全部理由。</p>\n  </div>\n\n  <h2 id=\"s3\">三、NRevPAR：剔除渠道成本后的真实收益</h2>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">NRevPAR（净 RevPAR · Net RevPAR）</span>\n    NRevPAR = RevPAR ×（1 − 渠道综合成本率）<br><br>\n    <span class=\"f-label\">渠道综合成本率</span>\n    渠道综合成本率 = Σ（各渠道房晚占比 × 该渠道综合成本率）\n  </div>\n\n  <h3>3.1 云璟的 NRevPAR 实算</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">第一步 · 算渠道综合成本率</span>\n    直销　25% × 3% = 0.75%<br>\n    会员　12% × 4% = 0.48%<br>\n    协议　22% × 8% = 1.76%<br>\n    OTA 国内　26% × 16% = 4.16%<br>\n    OTA 国际　5% × 18% = 0.90%<br>\n    GDS/TMC　5% × 13% = 0.65%<br>\n    批发商　5% × 26% = 1.30%<br>\n    　　　　　　　　　　　累计 = <b>10.00%</b><br><br>\n    <span class=\"f-label\">第二步 · 算 NRevPAR</span>\n    RevPAR（上年实际）= <b>¥445</b><br>\n    NRevPAR = 445 ×（1 − 10.00%）= 445 × 0.90 = <span class=\"f-out\">¥400.5</span><br><br>\n    <span class=\"f-label\">第三步 · 算年渠道成本总额</span>\n    客房收入 ¥51,977,328 × 10.00% ≈ <span class=\"f-out\">¥5,197,733</span><br>\n    净客房收入 = 51,977,328 − 5,197,733 ≈ <b>¥46,779,595</b>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">口径提示：¥400.5 与「净客房收入 ÷ 可售房晚」会有几分钱差异，属正常</span>\n    <p>《SPEC》给出的 RevPAR ¥445 是<b>取整值</b>（51,977,328 ÷ 116,800 = 445.01）。用取整后的 445 算 NRevPAR 得 ¥400.5，用净收入反算得 46,779,595 ÷ 116,800 = ¥400.51。<br>\n    <b>本学院统一：对外汇报与考核使用「净客房收入 ÷ 可售房晚」的精确值；课堂练习与考试使用 RevPAR 取整值计算，允许 ≤¥0.5 的差异。</b></p>\n  </div>\n\n  <h3>3.2 为什么必须看 NRevPAR，而不能只看 RevPAR</h3>\n\n  <div class=\"grid-2\">\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">✗</span>只看 RevPAR 会踩的坑</div>\n      <p>某月 RevPAR ¥488，同比 <span class=\"up\">↑6.1%</span>，看起来很好。但如果这个增长是靠「OTA 大促 + 批发商放量」换来的，渠道综合成本率从 10.0% 涨到 14.0%，那么：<br>\n      NRevPAR = 488 × 0.86 = <b>¥419.7</b><br>\n      而去年同期 NRevPAR = 460 × 0.90 = <b>¥414.0</b><br>\n      <b>实际只涨了 1.4%，不是 6.1%。</b></p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">✓</span>NRevPAR 的正确用法</div>\n      <p>NRevPAR 是<b>渠道策略效果的唯一考核指标</b>。<br>\n      ① 每月 5 日的《客源渠道报告》必须同时报 RevPAR 与 NRevPAR；<br>\n      ② 任何渠道结构调整（开关渠道、上促销、改佣金）都以 NRevPAR 变化为验收标准；<br>\n      ③ <b>RevPAR 涨而 NRevPAR 跌 = 用渠道成本买量，视为失败</b>，须在月报中单独说明。</p>\n    </div>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">NRevPAR 与 GOPPAR 的关系</span>\n    <p>NRevPAR 剔除的是<b>渠道成本</b>，GOPPAR 还要再剔除人力、能耗、布草、餐饮成本等。<br>\n    云璟上年：RevPAR ¥445 → NRevPAR ¥400.5（渠道成本吃掉 10%）→ GOPPAR ¥232。<br>\n    <b>三者是同一条链上的三个刻度：RevPAR 看营收、NRevPAR 看渠道效率、GOPPAR 看最终盈利。</b>渠道管理只负责中间这一格。</p>\n  </div>\n\n  <h2 id=\"s4\">四、★ 反直觉结论：OTA 卖 ¥600 不如直销卖 ¥530</h2>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">先把结论摆出来，再用三个角度讲透</span>\n    <p><b>OTA 卖 ¥600，净落袋 ¥504；直销卖 ¥530，净落袋 ¥514。</b><br>\n    <b>直销便宜 ¥70，反而多赚 ¥10。</b><br>\n    这不是文字游戏，这是渠道成本率差异（16% vs 3%，差 13 个百分点）在价格上的直接体现。</p>\n  </div>\n\n  <h3>4.1 算一遍</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">OTA 国内渠道</span>\n    售价 ¥600 ×（1 − 16%）= 600 × 0.84 = <span class=\"f-out\">¥504.0</span><br><br>\n    <span class=\"f-label\">直销渠道</span>\n    售价 ¥530 ×（1 − 3%）= 530 × 0.97 = <span class=\"f-out\">¥514.1</span><br><br>\n    <span class=\"f-label\">比较</span>\n    售价差：600 − 530 = <b>直销便宜 ¥70</b><br>\n    净收益差：514.1 − 504.0 = <b>直销多赚 ¥10.1</b>\n  </div>\n\n  <h3>4.2 完整对照表：直销价从 ¥600 一路降到 ¥500</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 8-4　直销价 vs OTA ¥600 的净收益对照<span class=\"cap-note\">OTA 国内成本率 16%，直销成本率 3%。基准：OTA 卖 ¥600 净 ¥504.0</span></caption>\n      <thead><tr><th class=\"num\">直销售价</th><th class=\"num\">直销净收益<br>（× 0.97）</th><th class=\"num\">vs OTA 净 ¥504.0</th><th>判定</th><th>说明</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\">¥600</td><td class=\"num\">¥582.0</td><td class=\"num\"><span class=\"up\">↑¥78.0</span></td><td><span class=\"pill pill-teal\">大幅优于 OTA</span></td><td>同价直销，多赚 13%</td></tr>\n        <tr><td class=\"num\">¥580</td><td class=\"num\">¥562.6</td><td class=\"num\"><span class=\"up\">↑¥58.6</span></td><td><span class=\"pill pill-teal\">优于 OTA</span></td><td>便宜 ¥20 仍多赚</td></tr>\n        <tr><td class=\"num\">¥560</td><td class=\"num\">¥543.2</td><td class=\"num\"><span class=\"up\">↑¥39.2</span></td><td><span class=\"pill pill-teal\">优于 OTA</span></td><td>便宜 ¥40 仍多赚</td></tr>\n        <tr><td class=\"num\">¥540</td><td class=\"num\">¥523.8</td><td class=\"num\"><span class=\"up\">↑¥19.8</span></td><td><span class=\"pill pill-teal\">优于 OTA</span></td><td>便宜 ¥60 仍多赚</td></tr>\n        <tr><td class=\"num\"><b>¥530</b></td><td class=\"num\"><b>¥514.1</b></td><td class=\"num\"><span class=\"up\">↑¥10.1</span></td><td><span class=\"pill pill-teal\">优于 OTA</span></td><td><b>本模块的例题：便宜 ¥70，多赚 ¥10</b></td></tr>\n        <tr><td class=\"num\">¥520</td><td class=\"num\">¥504.4</td><td class=\"num\"><span class=\"up\">↑¥0.4</span></td><td><span class=\"pill pill-amber\">基本持平</span></td><td>便宜 ¥80，打平</td></tr>\n        <tr><td class=\"num\"><b>¥519.6</b></td><td class=\"num\">¥504.0</td><td class=\"num\"><span class=\"flat\">±¥0</span></td><td><span class=\"pill pill-navy\">★ 平衡点</span></td><td><b>直销价的经济下限</b></td></tr>\n        <tr><td class=\"num\">¥510</td><td class=\"num\">¥494.7</td><td class=\"num\"><span class=\"down\">↓¥9.3</span></td><td><span class=\"pill pill-red\">不如 OTA</span></td><td>降过头了</td></tr>\n        <tr><td class=\"num\">¥500</td><td class=\"num\">¥485.0</td><td class=\"num\"><span class=\"down\">↓¥19.0</span></td><td><span class=\"pill pill-red\">不如 OTA</span></td><td>降过头了</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-gold\">\n    <span class=\"co-t\">这张表最重要的一行是「¥519.6」</span>\n    <p><b>¥519.6 就是直销价的经济下限。</b>低于这个价，你不如让 OTA 去卖。<br>\n    算法：令「直销价 ×（1 − 3%）」=「OTA 价 ¥600 ×（1 − 16%）」<br>\n    直销价 = 600 × 0.84 ÷ 0.97 = <b>¥519.6</b><br>\n    <b>更一般的写法：直销价下限 = OTA 挂牌价 ×（1 − OTA 成本率）÷（1 − 直销成本率）</b><br>\n    按云璟的成本率（OTA 16%、直销 3%）：直销价下限 = OTA 价 × 0.84 ÷ 0.97 = <b>OTA 价 × 86.6%</b><br>\n    <b>也就是说：直销价只要不低于 OTA 挂牌价的 86.6%，就比让 OTA 卖划算。</b>这个 86.6% 值得背下来。</p>\n  </div>\n\n  <h3>4.3 这个结论的三个实际用途</h3>\n\n  <div class=\"grid-3\">\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">①</span>给会员价定下限</div>\n      <p>《SPEC》会员渠道成本率 4%。会员价下限 = OTA 价 × 0.84 ÷ 0.96 = <b>OTA 价 × 87.5%</b>（≈ 88%）。<br>\n      <b>这正是 M06 讲过的「会员价让利下限 BAR×88%」的来源</b>——不是保守估计，是净收益相等点反推出来的经济下限。</p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">②</span>判断要不要上 OTA 促销</div>\n      <p>渠道经理说「上个 OTA 大促，每间让 ¥80，能多卖 100 间」。<br>\n      判断标准：<b>这 100 间是不是本来就能通过直销卖掉？</b>若是，则让掉的是 ¥80 × 100 = ¥8,000 的净收益；若不是，让 ¥80 换来 100 间增量，净落袋（600−80）× 0.84 = ¥436.8/间 × 100 = ¥43,680，仍然划算。<br>\n      <b>关键是「增量」二字。</b></p>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"ic\">③</span>解释表 B 为什么要关低价渠道</div>\n      <p>表 B 在预测 OCC ≥95% 时要求「关闭尾房特惠 / 团购 / 批发商」。<br>\n      批发商成本率 26%，净留存只有 74%。在旺日，这些房间本来就能以 BAR 通过直销或 OTA 卖掉，<b>再通过批发商放出去等于白送 26 个点</b>。<br>\n      这就是表 B 那条动作的底层逻辑。</p>\n    </div>\n  </div>\n\n  <h2 id=\"s5\">五、净收益平衡点：各渠道的最低可接受售价</h2>\n\n  <p>把 4.2 的算法推广到全部 7 个渠道，得到一张日常询价时可以直接查的表。<b>基准：让 OTA 国内按 BAR 全价卖出的净收益。</b></p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 8-5　各渠道的最低可接受售价<span class=\"cap-note\">基准：OTA 国内按 ¥680 卖出，净收益 ¥571.2（= 680 × 0.84）</span></caption>\n      <thead><tr><th>渠道</th><th class=\"num\">成本率</th><th class=\"num\">净留存率</th><th class=\"num\">最低可接受售价<br>（= 571.2 ÷ 净留存率）</th><th class=\"num\">相当于 BAR ¥680 的</th><th>用途</th></tr></thead>\n      <tbody>\n        <tr><td><b>直销 DIR</b></td><td class=\"num\">3%</td><td class=\"num\">0.97</td><td class=\"num\"><b>¥588.9</b></td><td class=\"num\">86.6%</td><td>直销价的谈判底线</td></tr>\n        <tr><td>会员 LOY</td><td class=\"num\">4%</td><td class=\"num\">0.96</td><td class=\"num\"><b>¥595.0</b></td><td class=\"num\">87.5%</td><td>会员价下限（≈88%）</td></tr>\n        <tr><td>协议 CORP</td><td class=\"num\">8%</td><td class=\"num\">0.92</td><td class=\"num\"><b>¥620.9</b></td><td class=\"num\">91.3%</td><td>协议价 C 类（85%）在此线之下，<b>需以量补价</b></td></tr>\n        <tr><td>GDS / TMC</td><td class=\"num\">13%</td><td class=\"num\">0.87</td><td class=\"num\"><b>¥656.6</b></td><td class=\"num\">96.6%</td><td>GDS 报价低于此线不如走 OTA</td></tr>\n        <tr><td><b>OTA 国内</b></td><td class=\"num\">16%</td><td class=\"num\">0.84</td><td class=\"num\"><b>¥680.0</b></td><td class=\"num\">100.0%</td><td><b>基准线</b></td></tr>\n        <tr><td>OTA 国际</td><td class=\"num\">18%</td><td class=\"num\">0.82</td><td class=\"num\"><b>¥696.6</b></td><td class=\"num\">102.4%</td><td>国际渠道需溢价 2.4% 才等价</td></tr>\n        <tr><td>批发商 WHO</td><td class=\"num\">26%</td><td class=\"num\">0.74</td><td class=\"num\"><b>¥771.9</b></td><td class=\"num\">113.5%</td><td>批发商需溢价 13.5% 才等价，<b>实际几乎不可能，所以批发只能用于填补空置</b></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">怎么读这张表（否则会误用）</span>\n    <p>① <b>「最低可接受售价」是「与 OTA 全价卖出等价」的那个价，不是「绝对不能低于」的价。</b>低于它会让净收益低于基准，但如果这间房<b>不卖就一分钱收不到</b>，那么任何正数价格都是赚的。<br>\n    ② <b>批发商那一行尤其要这么理解：</b>批发商净价通常只有 BAR 的 60–70%（远低于 113.5%），单看净收益是亏的。但它的价值在于<b>提前锁定团队房晚、填补必然的空置</b>。判定的正确方法是《法典》表 G 的置换分析，不是拿净收益跟 OTA 比。<br>\n    ③ <b>用途是谈判，不是定价。</b>这张表用于：销售部谈协议价时给出底线、渠道经理谈 GDS 报价时给出底线、收益主管审批折扣时判断合理性。</p>\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">速算口诀</span>\n    <p><b>「净留存率 = 1 − 成本率；等价价 = 基准净收益 ÷ 净留存率。」</b><br>\n    记住 7 个净留存率：97 / 96 / 92 / 87 / 84 / 82 / 74。日常够用了。</p>\n  </div>\n\n  <h2 id=\"s6\">六、《法典》表 H · 渠道开关判定表（完整内嵌）</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-matrix\">\n      <caption><span class=\"badge-codex\">表 H</span>　渠道开关判定表<span class=\"cap-note\">输入：预测 OCC（与表 A / 表 B 同一个数）。<b>五列同时配置，不是五选一</b></span></caption>\n      <thead>\n        <tr><th>预测 OCC</th><th>OTA 国内</th><th>OTA 国际</th><th>GDS / TMC</th><th>批发商 / 包房</th><th>直销 / 会员</th></tr>\n      </thead>\n      <tbody>\n        <tr>\n          <th class=\"rowh\">≥95%</th>\n          <td>仅留 1 家产量最高</td>\n          <td>关</td>\n          <td>关</td>\n          <td>关</td>\n          <td>全开 + 会员专享价</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">90–95%</th>\n          <td>开 2 家</td>\n          <td>关</td>\n          <td>开</td>\n          <td>关</td>\n          <td>全开</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">85–90%</th>\n          <td>开 3 家</td>\n          <td>开 1 家</td>\n          <td>开</td>\n          <td>关</td>\n          <td>全开</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">70–85%</th>\n          <td>全开</td>\n          <td>全开</td>\n          <td>开</td>\n          <td>限价开（≤BAR×75%）</td>\n          <td>全开 + 早鸟</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">55–70%</th>\n          <td>全开 + 促销</td>\n          <td>全开</td>\n          <td>开</td>\n          <td>开</td>\n          <td>全开 + 闪购 / 套餐</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">&lt;55%</th>\n          <td>全开 + 深折</td>\n          <td>全开</td>\n          <td>开 + 商务套餐</td>\n          <td>开 + 打包产品</td>\n          <td>全开 + 长住 / 团购</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">表 H 有 6 行，与表 A（6 行）一致，与表 B（5 行）不一致。别串</span>\n    <p><b>表 A：6 行</b>（≥95% / 85–95% / 70–85% / 55–70% / 40–55% / &lt;40%）<br>\n    <b>表 B：5 行</b>（≥95% / 90–95% / 85–90% / 70–85% / &lt;70%）<br>\n    <b>表 H：6 行</b>（≥95% / 90–95% / 85–90% / 70–85% / 55–70% / &lt;55%）<br>\n    <b>差异点：</b>表 H 在 70% 以下<b>再分两档</b>（55–70% 与 &lt;55%），而表 B 只有「&lt;70%」一档；表 A 在 70% 以下分三档（55–70% / 40–55% / &lt;40%）。<br>\n    <b>三张表的行不同，是因为它们管的事不同：表 A 管价格（需要更细的价格档），表 B 管库存（粗一点就够），表 H 管渠道（中等粒度）。</b></p>\n  </div>\n\n  <h3>6.1 五类渠道的逐列解释</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 8-6　表 H 五列的取值与落位</caption>\n      <thead><tr><th>列</th><th>取值类型</th><th>落位动作</th><th>易错点</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>OTA 国内</b></td>\n          <td>数量档：全开 / 开 3 家 / 开 2 家 / 仅留 1 家；<br>叠加态：+ 促销 / + 深折</td>\n          <td>按<b>近 90 天该渠道产量</b>排序，保留前 N 家，其余 Stop Sell。<b>产量排序每季度更新一次</b>（表 N 每季度动作之一）</td>\n          <td><b>「仅留 1 家」不等于「全部关掉」</b>——OTA 有排名权重，完全关停会让排名断崖式下滑（详见第 11 节）</td>\n        </tr>\n        <tr>\n          <td><b>OTA 国际</b></td>\n          <td>关 / 开 1 家 / 全开</td>\n          <td>Booking / Agoda 等；「开 1 家」按近 90 天产量取第 1</td>\n          <td>成本率 18%，是五个列里最贵的两档之一，旺日优先关它</td>\n        </tr>\n        <tr>\n          <td><b>GDS / TMC</b></td>\n          <td>关 / 开 / 开 + 商务套餐</td>\n          <td>商旅通路。<b>「关」只出现在 ≥95% 一行</b>，其余五行全部「开」</td>\n          <td>GDS 关停会影响企业客户的差旅预订，需提前通知协议客户；且 GDS 关停后有恢复期</td>\n        </tr>\n        <tr>\n          <td><b>批发商 / 包房</b></td>\n          <td>关 / 限价开（≤BAR×75%）/ 开 / 开 + 打包产品</td>\n          <td><b>「限价开」= 只对报价 ≥ BAR×75% 的批发商开放</b>；低于此线的批发需求一律拒绝</td>\n          <td><span class=\"pill pill-red\">成本率最高（26%）</span>，是五列里唯一「70–85% 才算放开」的渠道；<b>净价不得公开挂牌</b>（表 H 红线 3）</td>\n        </tr>\n        <tr>\n          <td><b>直销 / 会员</b></td>\n          <td>全开 / 全开 + 会员专享价 / 全开 + 早鸟 / 全开 + 闪购套餐 / 全开 + 长住团购</td>\n          <td>成本率最低（3% / 4%），<b>六行全部「全开」，永不关闭</b></td>\n          <td><b>这一列没有「关」这个选项</b>。任何情况下都不关直销——这是全表唯一恒定不变的列</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">表 H 的设计逻辑（理解了就不用死背）</span>\n    <p>把五列按成本率从低到高排：直销 3% &lt; 会员 4% &lt; 协议 8% &lt; GDS 13% &lt; OTA 国内 16% &lt; OTA 国际 18% &lt; 批发商 26%。<br>\n    <b>预测 OCC 越高（房间越不愁卖），越要关掉成本率高的渠道；OCC 越低（房间越难卖），越要把高成本渠道打开。</b><br>\n    逐行验证：<br>\n    ≥95%：只留直销全开 + OTA 国内 1 家（保排名），其余全关 → <b>成本率高的全关</b><br>\n    85–90%：OTA 国内 3 家、OTA 国际 1 家、GDS 开，批发商仍关 → <b>中等成本的开了，最贵的仍关</b><br>\n    70–85%：全开，但批发商限价（≤BAR×75%）→ <b>最贵的开了但设了价格门槛</b><br>\n    &lt;55%：全开 + 深折 + 商务套餐 + 打包产品 + 长住团购 → <b>能开的都开，还加码</b><br>\n    <b>记不住格子的时候，就用这个逻辑推。</b></p>\n  </div>\n\n  <h3>6.2 表 H 与表 B 的冲突仲裁</h3>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">规则：先表 H 定全渠道配置，再表 B 叠加关闭</span>\n    <p>表 B（优先级 2）的「低价渠道 Stop Sell」列与表 H（优先级 5）都会关渠道。<b>冲突时以表 B 为准。</b><br>\n    <b>执行顺序固定为两步：</b><br>\n    <b>第一步</b>：按表 H 定出该预测 OCC 档位的五类渠道配置；<br>\n    <b>第二步</b>：按表 B 的「低价渠道 Stop Sell」列，把表 B 要求关闭的渠道<b>额外关掉</b>。<br>\n    表 B 要求关的，无论表 H 说什么都关；表 B 未要求关的，按表 H 执行。<br>\n    <b>示例（预测 OCC 92%，D2 高涨日）：</b><br>\n    表 H「90–95%」行 → OTA 国内开 2 家 / OTA 国际关 / GDS 开 / 批发商关 / 直销全开<br>\n    表 B「90–95%」行 → <b>关闭尾房特惠</b><br>\n    <b>最终：OTA 国内开 2 家（尾房特惠这一类除外）/ OTA 国际关 / GDS 开 / 批发商关 / 直销全开</b></p>\n  </div>\n\n  <h2 id=\"s7\">七、表 H 的落位：两个层级、五类渠道</h2>\n\n  <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n    "}, {"id": "p1", "name": "列出待调整渠道清单", "min": 8, "desc": "", "html": "<h4>列出待调整渠道清单</h4>\n    <p>从表 H 读出该档位五类渠道的应有状态，与<b>当前实际状态</b>逐条比对，列出「应开实关」与「应关实开」两张清单。<b>不比对就动手，会把本来就对的改错。</b></p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n    <h4>两个层级都要做</h4>\n    <p><b>本店侧</b>（PMS / 渠道管理器）：Stop Sell 或关房，切断库存投放。<br>\n    <b>渠道侧</b>（OTA / GDS 后台）：把该日房态置为不可售，或在该渠道后台停用对应产品。<br>\n    <b>只做本店侧，渠道缓存可能仍显示可售；只做渠道侧，其他通路仍在卖。两层都要做，各留一张截图。</b></p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n    <h4>OTA 国内「开 N 家」的排序依据</h4>\n    <p>按<b>近 90 天各 OTA 的实际产量（房晚数）</b>从高到低排序，保留前 N 家。<br>\n    <b>排序每季度更新一次</b>（《法典》表 N 每季度动作：竞争组合复核、价格体系重构、协议客户分级——渠道产量排序并入此项）。<br>\n    云璟当前参考排序：携程 &gt; 美团 &gt; 飞猪（<b>以实际数据为准，本排序仅为示例</b>）。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n    <h4>关渠道前的两项通知</h4>\n    <p>① <b>GDS 关停</b>：提前 3 个工作日通知主要协议客户与 TMC 合作方，说明关停窗口期。<br>\n    ② <b>批发商关停</b>：按合同约定提前通知包房商，避免违约责任。<b>《法典》表 H 未规定通知期，本学院给出云璟执行标准：GDS 提前 3 个工作日、批发商提前 5 个工作日</b>——这是本店标准，不是《法典》阈值。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">5</div><div class=\"step-body\">\n    <h4>等待缓存刷新并前台复查</h4>\n    <p>关闭后等待渠道缓存刷新（不同渠道刷新周期不同），再从<b>前台视角</b>（客人视角）复查确实不可订。<b>若仍可订，联系渠道经理处理</b>，不要自己反复推送造成库存错乱。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">6</div><div class=\"step-body\">\n    "}, {"id": "p2", "name": "台账登记", "min": 8, "desc": "", "html": "<h4>台账登记</h4>\n    <p>《调价台账》新增一条，动作类型填「开渠道 / 关渠道」，触发表编号填「<b>表 H</b>」（若由表 B 触发关闭则填「表 B」）。备注栏写明：档位、应有状态、实际状态、涉及渠道代码。</p>\n  </div></div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">渠道开关的撤除（与 M07 的限制条件撤除同理）</span>\n    <p>渠道开关<b>同样会「设了忘撤」</b>。防复发机制与 M07 第 4 节一致：<br>\n    ① 渠道开关也要进《限制条件存量清单》，<b>必须填到期日</b>；<br>\n    ② 每日 08:30 扫描到期项；<br>\n    ③ <b>每周一的「渠道开关复核」（表 N 每周一动作之一）必须做全量对账</b>，把系统中的实际渠道状态与应有状态逐条比对。<br>\n    <b>渠道开关忘撤的后果比限制条件更隐蔽：</b>渠道被关后，该渠道上没有订单，但酒店其他渠道照常有单，很容易被误读为「这个渠道最近没量」。</p>\n  </div>\n\n  <h2 id=\"s8\">八、价格一致性（Rate Parity）四条红线</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption><span class=\"badge-codex\">表 H</span>　价格一致性（Rate Parity）红线<span class=\"cap-note\">《SPEC》第四章原文，四条同时生效</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>红线</th><th>判定方法</th><th>违反后果</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td>\n          <td>直销价 <b>不得高于</b> 任一 OTA 挂牌价（直销价 ≤ OTA 价 × 100%）</td>\n          <td>Δ = OTA 挂牌价 − 直销基准价。<b>Δ &lt; 0 即违反</b></td>\n          <td rowspan=\"4\"><b>24 小时内整改并记入考核</b><br>（第 4 条）</td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td>\n          <td>会员价可低于 OTA 价，但<b>仅限登录会员可见</b></td>\n          <td>用未登录浏览器 / 无痕窗口访问，能看到即违反</td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td>\n          <td>批发商 / 包房价为<b>净价，不得公开挂牌</b></td>\n          <td>在任何公开可搜索页面搜到该净价即违反</td>\n        </tr>\n        <tr>\n          <td class=\"num\">4</td>\n          <td>违反一致性：<b>24 小时内整改并记入考核</b></td>\n          <td>从<b>发现时刻</b>起算 24 小时</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>8.1 为什么要管价格一致性（不只是为了合规）</h3>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">价格一致性的商业本质：保护直销的「存在理由」</span>\n    <p>客人为什么要在你的官网订？<b>三个理由：更便宜、更方便、有会员权益。</b><br>\n    如果 OTA 上比你的官网还便宜，你就亲手毁掉了第一个理由，客人会全部流向 OTA，你就得付 16% 的佣金去拿一个本来可以 3% 拿到的订单。<br>\n    <b>用数字说话：</b>一间房 BAR ¥680，直销净落袋 ¥659.6，OTA 净落袋 ¥571.2。<b>每有一个客人因为「OTA 更便宜」而从直销流向 OTA，你就损失 ¥88.4。</b><br>\n    若一个月有 300 个房晚因此流失，损失 = 300 × 88.4 = <b>¥26,520</b>。这就是为什么价格一致性违规要「记入考核」——它不是形式主义，是真金白银。</p>\n  </div>\n\n  <h3>8.2 Δ 的三种取值与判定</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">差值定义</span>\n    Δ = 渠道挂牌价 − 直销基准价 P\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 8-7　Δ 判定规则（6 个公开渠道适用）</caption>\n      <thead><tr><th>Δ</th><th>含义</th><th>判定</th><th>动作</th></tr></thead>\n      <tbody>\n        <tr><td><b>Δ &lt; 0</b></td><td>渠道价低于直销价</td><td><span class=\"pill pill-red\">违反一致性</span></td><td><b>24 小时内整改，记入考核，启动整改 SOP</b></td></tr>\n        <tr><td><b>Δ = 0</b></td><td>完全一致</td><td><span class=\"pill pill-teal\">一致</span></td><td>记录通过</td></tr>\n        <tr><td><b>Δ &gt; 0</b></td><td>渠道价高于直销价</td><td><span class=\"pill pill-teal\">允许</span></td><td>记录通过；但需核查是否渠道自行加价。若长期 Δ &gt; 0，会损害该渠道的竞争力，列入观察</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">会员价（LOY）与批发商净价（WHO）不适用 Δ 判定</span>\n    <p>这两类价格<b>本来就应该低于直销价</b>，Δ &lt; 0 不算违反。它们的判定标准改为「可见性」：<br>\n    · <b>会员价</b> → 是否<b>仅限登录会员可见</b>（能用未登录浏览器看到即违反红线 2）；<br>\n    · <b>批发商净价</b> → 是否<b>未公开挂牌</b>（出现在任何公开可搜索页面即违反红线 3）。<br>\n    <b>所以核查表是「6 行公开渠道 + 2 行单列核查」，共 8 行，不是 8 行同一判定。</b></p>\n  </div>\n\n  <h2 id=\"s9\">九、价格一致性 6 步核查法（7 渠道版）</h2>\n\n  <p>《法典》表 M 把一致性核查排在 <strong>09:40</strong>，耗时上限 15 分钟，核查 <strong>6 个渠道</strong>。本模块给出 7 渠道版（6 个公开渠道 + 会员价 + 批发商净价单列核查）。</p>\n\n  <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n    <h4>确定基准价 P</h4>\n    <p>基准价 = 本店<b>直销渠道</b>（官网 / 小程序）在同一目标日、同房型（<b>SUP-K</b>）、同价格代码（<b>BAR</b>）、同取消政策、同含早状态下的挂牌价。<br>\n    <b>所有比对都以它为锚。</b>P 变了，全部 Δ 重算。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n    <h4>列出比对的渠道清单</h4>\n    <p>云璟的默认清单（<b>6 个公开渠道</b>）：<br>\n    ① 官网 / 小程序直销（基准，不比对）② 携程 ③ 美团 ④ 飞猪 ⑤ Booking（OTA-I）⑥ GDS / TMC 展示价。<br>\n    <b>单列核查 2 行：</b>⑦ 会员专享价（LOY）⑧ 批发商净价（WHO）。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n    <h4>统一 5 个比对条件（\"五同\"）</h4>\n    <div class=\"checklist\" style=\"margin-top:8px\">\n      <li><b>同一入住日</b>（目标日）</li>\n      <li><b>同一房型代码</b>（统一用 <code>SUP-K</code>）</li>\n      <li><b>同一价格代码</b>（统一用 <code>BAR</code>，不用会员价/协议价/套餐价）</li>\n      <li><b>同一取消政策</b>（统一用「免费取消」）</li>\n      <li><b>同一含早状态</b>（统一用「不含早」）</li>\n    </div>\n    <p style=\"margin-top:8px\"><b>任一条件不同就不可比。</b>含早价与不含早价混比，会让 Δ 差出 ¥68（云璟含早加价 ¥68/人，与自助早餐门市价 ¥128/人 是两个不同的数）。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n    <h4>逐渠道计算 Δ 并填入检查表</h4>\n    <p>Δ = 渠道挂牌价 − 直销基准价 P。逐行填入《价格一致性检查表》。<b>同时记录抓取时间戳</b>——不同时间抓的价格不可比（OTA 价格会随库存动态变化）。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">5</div><div class=\"step-body\">\n    "}, {"id": "p3", "name": "逐行判定（注意第 7、8 行判定标准不同）", "min": 8, "desc": "", "html": "<h4>逐行判定（注意第 7、8 行判定标准不同）</h4>\n    <div class=\"tbl-wrap\" style=\"margin-top:8px\">\n      <table class=\"tbl\">\n        <caption>表 8-8　《价格一致性检查表》示例<span class=\"cap-note\">目标日 11 月 12 日，房型 SUP-K，价格代码 BAR，不含早，免费取消。直销基准价 P = ¥660</span></caption>\n        <thead><tr><th class=\"num\">#</th><th>渠道</th><th>代码</th><th class=\"num\">挂牌价</th><th class=\"num\">Δ</th><th>判定</th><th>动作</th></tr></thead>\n        <tbody>\n          <tr><td class=\"num\">1</td><td>官网 / 小程序直销</td><td><code>DIR</code></td><td class=\"num\">¥660</td><td class=\"num\">0</td><td><span class=\"pill pill-navy\">基准</span></td><td>—</td></tr>\n          <tr><td class=\"num\">2</td><td>携程</td><td><code>OTA</code></td><td class=\"num\">¥660</td><td class=\"num\">0</td><td><span class=\"pill pill-teal\">一致</span></td><td>通过</td></tr>\n          <tr><td class=\"num\">3</td><td>美团</td><td><code>OTA</code></td><td class=\"num\">¥628</td><td class=\"num\"><span class=\"down\">−¥32</span></td><t
