d><span class=\"pill pill-red\">违反</span></td><td><b>24h 内整改 + 记入考核</b></td></tr>\n          <tr><td class=\"num\">4</td><td>飞猪</td><td><code>OTA</code></td><td class=\"num\">¥660</td><td class=\"num\">0</td><td><span class=\"pill pill-teal\">一致</span></td><td>通过</td></tr>\n          <tr><td class=\"num\">5</td><td>Booking</td><td><code>OTA-I</code></td><td class=\"num\">¥666</td><td class=\"num\"><span class=\"up\">+¥6</span></td><td><span class=\"pill pill-teal\">允许</span></td><td>通过，列入观察</td></tr>\n          <tr><td class=\"num\">6</td><td>GDS / TMC 展示价</td><td><code>GDS</code></td><td class=\"num\">¥660</td><td class=\"num\">0</td><td><span class=\"pill pill-teal\">一致</span></td><td>通过</td></tr>\n          <tr><td class=\"num\">7</td><td><b>会员专享价</b>（单列）</td><td><code>LOY</code></td><td class=\"num\">¥594</td><td class=\"num\"><span class=\"down\">−¥66</span></td><td><span class=\"pill pill-amber\">需验证可见性</span></td><td>验证<b>仅限登录会员可见</b>，可见则合规</td></tr>\n          <tr><td class=\"num\">8</td><td><b>批发商净价</b>（单列）</td><td><code>WHO</code></td><td class=\"num\">¥495</td><td class=\"num\"><span class=\"down\">−¥165</span></td><td><span class=\"pill pill-amber\">需验证挂牌</span></td><td>验证<b>未公开挂牌</b>，未挂牌则合规</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <p style=\"margin-top:8px\"><b>第 7 行交叉校验：</b>会员价 ¥594 = 660 × 90%，符合 M06 的会员价公式（BAR×90%）且 ≥ 88% 下限（660 × 88% = ¥580.8）✓<br>\n    <b>第 8 行交叉校验：</b>批发商净价 ¥495 = 660 × 75%，正好是表 H「70–85%」行的限价上限（≤BAR×75%）✓</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">6</div><div class=\"step-body\">\n    "}, {"id": "p4", "name": "记录与留痕", "min": 8, "desc": "", "html": "<h4>记录与留痕</h4>\n    <p>通过项打勾，违规项记入考核并转整改 SOP。<b>《价格一致性检查表》随《调价台账》一同归档</b>，作为当日动作的完整性证明。<br>\n    <b>时限校验：</b>表 A 执行约束第 3 条要求「调价后 30 分钟内必须检查 OTA 挂牌价是否同步」。若当日 09:10 落位，则 09:40 的核查正好卡在 30 分钟边界，<b>不得延后</b>。</p>\n  </div></div>\n\n  <h2 id=\"s10\">十、违规整改 SOP：定位 → 判成因 → 处置 → 复查留痕</h2>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">时限：《法典》表 H 规定 24 小时内整改并记入考核</span>\n    <p>从<b>发现时刻</b>起算 24 小时，不是从次日算起。<b>在《价格一致性检查表》上写下发现时间戳，并倒推整改截止时间。</b></p>\n  </div>\n\n  <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n    <h4>定位（15 min 内）</h4>\n    <p>锁定违规的 4 个坐标：<b>渠道代码 + 目标日期 + 房型代码 + 价格代码</b>。<br>\n    <b>逐日扩展核查</b>——一次低价往往不是一天。把该渠道<b>未来 30 天同款产品全部扫一遍</b>，记录违规日期范围。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n    "}, {"id": "p5", "name": "判成因（4 选 1）", "min": 8, "desc": "", "html": "<h4>判成因（4 选 1）</h4>\n    <div class=\"tbl-wrap\" style=\"margin-top:8px\">\n      <table class=\"tbl\">\n        <caption>表 8-9　4 类成因与判定依据</caption>\n        <thead><tr><th>成因</th><th>判定依据</th><th>处置</th></tr></thead>\n        <tbody>\n          <tr><td><b>① 渠道私自促销</b><br>（渠道自补差价的促销 / 红包 / 会员日）</td><td>本店后台挂牌价正常，但前台展示价低于后台价</td><td>联系渠道经理要求下架该促销；保留沟通记录</td></tr>\n          <tr><td><b>② 包房商倒挂</b><br>（包房商以净价转手公开售卖）</td><td>在公开页面搜到低于直销的价格，来源非本店合作挂牌渠道</td><td>按合同追究；向渠道方发函要求下架</td></tr>\n          <tr><td><b>③ 系统未同步</b><br>（调价后渠道缓存未刷新）</td><td>违规日期与最近一次调价的日期高度重合，且违规渠道为多个</td><td>重新推送价格 / 库存；等待缓存刷新后复查</td></tr>\n          <tr><td><b>④ 人工改价漏改</b><br>（只改了部分房型 / 部分日期）</td><td>违规仅出现在个别房型或个别日期，不成规律</td><td>补齐漏改的房型与日期；当日 17:00 二次巡检复查</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n    <h4>处置（按成因执行）</h4>\n    <p>① 与 ② → 通知渠道经理下架，发送书面函件，抄送收益主管；<br>\n    ③ → 在渠道管理器中重新推送价格与库存，等待缓存刷新后复查；<br>\n    ④ → 按 <b>7 档房型整表</b>重新落位，补齐漏项。<br>\n    <b>处置过程中的所有沟通（邮件 / 工单 / 聊天记录）截图归档</b>，作为考核凭证。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n    "}, {"id": "p6", "name": "复查与留痕", "min": 8, "desc": "", "html": "<h4>复查与留痕</h4>\n    <p>整改完成后<b>立即复查一次</b>，并在 24 小时时限内<b>再复查一次</b>。两次复查结果写入《价格一致性检查表》的「整改结果」列，连同时间戳一并归档。<br>\n    同时完成三件事：<br>\n    ① <b>记入当事人考核</b>；<br>\n    ② 在《调价台账》当日备注栏写明「X 渠道 Δ=−¥XX，成因 X，整改于 XX:XX 完成，复查通过」；<br>\n    ③ <b>若同一渠道 30 天内第 2 次违规，上报 L3 并启动渠道合作复核</b>。</p>\n  </div></div>\n\n  <h2 id=\"s11\">十一、OTA 排名优化：可执行动作清单（带标准数字）</h2>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">先说明这些数字的来源</span>\n    <p>《SPEC》<b>没有</b>规定 OTA 排名的优化标准——这不是《法典》阈值。<br>\n    下表是<b>云璟酒店的执行标准（本学院制定）</b>，用于把「提升排名」这件模糊的事变成可检查的动作。<br>\n    <b>使用原则：这些标准每季度复盘一次，随平台算法变化调整；但一旦定下就是硬指标，不是参考值。</b></p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 8-10　OTA 排名优化动作清单（云璟执行标准）<span class=\"cap-note\">每条都给「标准数字 + 检查频率 + 责任人」</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>动作项</th><th>标准数字</th><th>检查频率</th><th>责任人</th><th>不达标动作</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td><td><b>挂牌价</b></td>\n          <td>挂牌价 = 直销 BAR，Δ = 0（不得低于直销，见红线 1）</td>\n          <td>每日 09:40</td><td>L1 收益专员</td>\n          <td>24h 内整改（SOP 第 10 节）</td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td><td><b>可售天数占比</b></td>\n          <td>单月关房（Stop Sell）天数 ≤ <b>3 天/渠道</b>，即可售天数占比 ≥ <b>90%</b></td>\n          <td>每周一</td><td>L2 收益主管</td>\n          <td>若超标，评估是否该渠道产能不足，考虑减配而非硬关</td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td><td><b>点评分</b></td>\n          <td>≥ <b>4.6</b> 分（满分 5 分）；<b>近 30 天新增点评数 ≥ 15 条</b></td>\n          <td>每周一</td><td>前厅经理 / L2</td>\n          <td>&lt;4.6 时启动服务专项整改，并对 3 星以下差评逐条回复</td>\n        </tr>\n        <tr>\n          <td class=\"num\">4</td><td><b>图片</b></td>\n          <td>总图 ≥ <b>30 张</b>；房型图 ≥ <b>10 张</b>（覆盖主力 7 档房型）；首图为房型实拍（不得为外景或效果图）；<b>每季度至少更新 1 次</b></td>\n          <td>每季度</td><td>市场部 / L2</td>\n          <td>缺图立即补拍；首图不合格当周更换</td>\n        </tr>\n        <tr>\n          <td class=\"num\">5</td><td><b>取消政策</b></td>\n          <td>至少提供 <b>1 款免费取消</b>产品（入住前 24h 可免费取消）；且免费取消产品的挂牌价 ≤ 不可取消产品的 <b>110%</b></td>\n          <td>每周一</td><td>L2 收益主管</td>\n          <td>缺失则新增；价差超 110% 则回调</td>\n        </tr>\n        <tr>\n          <td class=\"num\">6</td><td><b>响应时间</b></td>\n          <td>渠道后台询单 / 客服响应 <b>&lt; 5 分钟</b>（营业时段 08:00–22:00）</td>\n          <td>每周抽测 5 次</td><td>前厅经理</td>\n          <td>超时率 &gt;20% 时调整排班与提醒机制</td>\n        </tr>\n        <tr>\n          <td class=\"num\">7</td><td><b>订单确认率</b></td>\n          <td>≥ <b>98%</b>（拒单率 ≤ 2%）；<b>开启即时确认</b></td>\n          <td>每月 5 日</td><td>L2 收益主管</td>\n          <td>拒单多为超售或库存不同步所致，回到 M07 表 E 与本节第 2 项</td>\n        </tr>\n        <tr>\n          <td class=\"num\">8</td><td><b>促销标签</b></td>\n          <td>每月参与平台促销 ≥ <b>2 个</b>（如早鸟、连住、会员日）；<b>但促销价不得低于直销价</b>（红线 1）</td>\n          <td>每月 1 日</td><td>L2 收益主管</td>\n          <td>参与不足则主动报名；若促销要求破价，<b>拒绝参与</b></td>\n        </tr>\n        <tr>\n          <td class=\"num\">9</td><td><b>差评回复</b></td>\n          <td>回复率 <b>100%</b>；3 星及以下差评回复时效 ≤ <b>24 小时</b></td>\n          <td>每周一</td><td>前厅经理</td>\n          <td>未回复立即补回，并计入前厅考核</td>\n        </tr>\n        <tr>\n          <td class=\"num\">10</td><td><b>库存深度</b></td>\n          <td>未来 30 天每个开放渠道的可售房型数 ≥ <b>5 个</b>（避免只投 1–2 个房型导致搜索命中率低）</td>\n          <td>每周一</td><td>L2 收益主管</td>\n          <td>不足则开放更多房型或调整房型投放策略</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">第 2 项（可售天数占比）与表 H 的冲突</span>\n    <p>表 H 在旺日要求关渠道，而排名优化要求少关房。<b>这是一对真实矛盾，必须给出仲裁规则：</b><br>\n    <b>规则：表 H 的渠道开关优先（表 H 是《法典》，排名优化是本店标准）。</b><br>\n    但为降低排名损失，执行三条缓冲措施：<br>\n    ① <b>「仅留 1 家」不等于全关</b>——≥95% 档保留产量最高的 1 家，让主渠道的排名不至于断档；<br>\n    ② <b>关房以「房型级」优先于「渠道级」</b>——先关低价房型的投放，保留高价房型在该渠道的露出；<br>\n    ③ <b>关房天数优先集中在同一个连续区间</b>（如国庆 5 天连关），而不是分散在 5 个不连续的周末——平台算法对连续关房更宽容。<br>\n    <b>单月 3 天的关房上限正是据此设定：国庆 5 天 + 五一 3 天 = 8 天，已超 3 天。</b>所以第 2 项的检查口径应调整为：<b>「非 D1 峰值日的关房天数 ≤ 3 天/月」</b>，D1 峰值日的关房不计入。这个口径修正必须写在检查表备注里，避免误判。</p>\n  </div>\n\n  <h2 id=\"s12\">十二、直销提升的 8 个标准动作</h2>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">先把目标量化</span>\n    <p>直销合计（FIT-WI 8% + FIT-DIR 17% + LOY 12%）= <b>37%</b> 房晚占比，综合成本率 3% / 4%。<br>\n    每提升 1 个百分点（从 OTA 国内 16% 转来），渠道综合成本率下降 = 1% × （16% − 3%）= <b>0.13 个百分点</b>。<br>\n    NRevPAR 提升 = ¥445 × 0.13% = <b>¥0.58</b>；年化 = 0.58 × 116,800 = <b>¥67,744</b>。<br>\n    <b>也就是说：直销占比每提升 1 个百分点，一年多赚约 ¥6.8 万。</b>这是 8 个动作的共同目标。</p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 8-11　直销提升的 8 个标准动作<span class=\"cap-note\">每个动作都给「触发条件 / 标准数字 / 验收方式」</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>动作</th><th>触发条件</th><th>标准数字</th><th>验收方式</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td>\n          <td><b>会员专享价</b></td>\n          <td>常设；仅在直销与会员渠道投放</td>\n          <td>BAR × <b>90%</b>；下限 BAR × <b>88%</b>（= OTA 价 × 87.5%，来源见 4.2 节）；<b>仅限登录会员可见</b>（红线 2）</td>\n          <td>每月用无痕窗口抽查 1 次，能看到即违规</td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td>\n          <td><b>早鸟价</b></td>\n          <td>表 H「70–85%」档（直销全开 + 早鸟）</td>\n          <td>提前 30 天以上 90% / 21–29 天 92% / 14–20 天 95%（M06 衍生价格公式）</td>\n          <td>早鸟价房晚占直销房晚 ≥ <b>15%</b></td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td>\n          <td><b>直销专属套餐</b></td>\n          <td>常设</td>\n          <td>房 + 双早套餐价 = BAR + ¥68 × 2 × 50% = BAR + <b>¥68</b>；每季度至少更新 <b>2 款</b></td>\n          <td>套餐房晚占直销房晚 ≥ <b>10%</b></td>\n        </tr>\n        <tr>\n          <td class=\"num\">4</td>\n          <td><b>前台 OTA 客人转化</b></td>\n          <td>每位 OTA 渠道到店客人在办理入住时执行</td>\n          <td>话术三句：① 告知官网价与会员价 ② 现场引导注册会员 ③ 赠下次直订专享券。<b>转化率目标 ≥ 20%</b>（= 现场注册会员数 ÷ OTA 到店客人数）</td>\n          <td>每月统计转化率；&lt;20% 时重新培训话术</td>\n        </tr>\n        <tr>\n          <td class=\"num\">5</td>\n          <td><b>直销专属库存</b></td>\n          <td>预测 OCC ≥ <b>85%</b> 的日期</td>\n          <td>为直销保留可售房量的 <b>10%</b>（云璟 320 间 → 32 间），其余渠道售罄后直销仍可订</td>\n          <td>每月统计「直销有房而其他渠道售罄」的天数；目标 ≥ <b>8 天/月</b></td>\n        </tr>\n        <tr>\n          <td class=\"num\">6</td>\n          <td><b>会员积分与等级权益</b></td>\n          <td>常设</td>\n          <td>钻石 &gt; 铂金 &gt; 金卡 &gt; 银卡（与表 J 一致）；<b>会员复购率 ≥ 35%</b>（= 当年入住 ≥2 次的会员 ÷ 当年有入住的会员）</td>\n          <td>每月 5 日《客源渠道报告》统计</td>\n        </tr>\n        <tr>\n          <td class=\"num\">7</td>\n          <td><b>协议客户自助预订门户</b></td>\n          <td>协议客户集中度 &gt; <b>50%</b> 时（该阈值同时触发表 E ×0.8 修正系数）</td>\n          <td>为前 <b>20 大</b>协议客户开通直连 / 自助预订门户，绕过 GDS（省 13% → 3%，省 10 个点）</td>\n          <td>直连协议客户的房晚占 CORP 房晚 ≥ <b>30%</b></td>\n        </tr>\n        <tr>\n          <td class=\"num\">8</td>\n          <td><b>最后一刻价只在直销投放</b></td>\n          <td>《法典》表 I「0–3 天」窗口 + OCC &lt; <b>70%</b> + 已过 <b>18:00</b></td>\n          <td>最后一刻价 = BAR × <b>80%</b>；<b>仅在官网 / 小程序 / 前台投放，不投 OTA</b>；上架时段 18:00–23:59</td>\n          <td>每档尾房产品销售 ≥ <b>5 间/日</b>；且不得在 OTA 出现同价（否则违反红线 1）</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">8 个动作的优先级排序（资源有限时按此顺序做）</span>\n    <p><b>第一梯队（投入小、见效快）：</b>① 会员专享价、④ 前台转化、⑧ 最后一刻价——这三个不需要系统改造，当周就能上线。<br>\n    <b>第二梯队（需要系统配置）：</b>② 早鸟价、③ 直销套餐、⑤ 直销专属库存——需要价格代码与库存配置，1–2 周上线。<br>\n    <b>第三梯队（需要跨部门与投入）：</b>⑥ 会员权益体系、⑦ 协议客户直连门户——需要 IT 与销售配合，1–3 个月。<br>\n    <b>禁止：8 个动作同时上。</b>同时上会导致归因不清——你不知道直销占比提升是哪个动作带来的，下次就没法复制。正确做法是<b>每月只上一到两个，单独跟踪 30 天</b>。</p>\n  </div>\n\n  <h2 id=\"s13\">十三、主流系统操作路径映射表</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 8-12　渠道与分销的系统无关操作路径</caption>\n      <thead><tr><th>通用动作</th><th>通用术语</th><th>PMS / 渠道管理器</th><th>OTA 渠道后台</th><th>GDS / TMC</th></tr></thead>\n      <tbody>\n        <tr><td>关闭某渠道投放</td><td>Channel Stop Sell</td><td>渠道管理 → 该渠道 → 停止投放 / 关闭日期</td><td>房态维护 → 该日期置为不可售</td><td>关闭该日期的可用性（Availability）</td></tr>\n        <tr><td>限制渠道投放数量</td><td>Allotment / 配额</td><td>渠道管理 → 该渠道 → 设置每日配额</td><td>库存维护 → 设置每日房量</td><td>设置 Allotment 数量</td></tr>\n        <tr><td>设置渠道专属价</td><td>Channel Rate Plan</td><td>价格代码 → 绑定渠道可见性</td><td>产品维护 → 价格计划</td><td>房价码（Rate Code）维护</td></tr>\n        <tr><td>推送价格与库存</td><td>Push ARI<br>（Availability / Rates / Inventory）</td><td>渠道管理器 → 立即推送 / 全量刷新</td><td>（接收方）</td><td>（接收方）</td></tr>\n        <tr><td>核查挂牌价</td><td>Rate Shop / 比价</td><td>报表 → 渠道价格对照</td><td>前台页面直接查询（需记录时间戳）</td><td>GDS 终端查询（需记录时间戳）</td></tr>\n        <tr><td>设置会员价可见性</td><td>Closed / Negotiated Rate 可见性</td><td>价格代码 → 设置「仅登录会员可见」</td><td>不适用（会员价不投 OTA）</td><td>不适用</td></tr>\n        <tr><td>导出渠道产量</td><td>Channel Production Report</td><td>报表 → 渠道产量（近 90 天）</td><td>后台 → 生意参谋 / 数据中心</td><td>TMC 对账单</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h2 id=\"s14\">十四、讲师示范：一次渠道结构调整的完整测算</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>示范　把 OTA 国内占比从 26% 降到 22%，直销从 25% 升到 29%</div>\n\n    <h4>背景</h4>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">现状</div><div class=\"kv-v\">渠道综合成本率 10.00%，NRevPAR ¥400.5，年 RevPAR ¥445，年可售房晚 116,800</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">提案</div><div class=\"kv-v\">通过直销提升 8 个动作中的第 ①④⑤ 项（会员价、前台转化、直销专属库存），把 OTA 国内占比压低 4 个百分点，转到直销</div></div>\n    </div>\n\n    "}, {"id": "p7", "name": "第 1 步 · 算新结构下的渠道综合成本率", "min": 8, "desc": "", "html": "<h4>第 1 步 · 算新结构下的渠道综合成本率</h4>\n    <div class=\"formula\">\n      <span class=\"f-label\">新结构</span>\n      直销　29% × 3% = 0.87%<br>\n      会员　12% × 4% = 0.48%<br>\n      协议　22% × 8% = 1.76%<br>\n      OTA 国内　<b>22%</b> × 16% = 3.52%<br>\n      OTA 国际　5% × 18% = 0.90%<br>\n      GDS/TMC　5% × 13% = 0.65%<br>\n      批发商　5% × 26% = 1.30%<br>\n      　　　　　　　　　　累计 = <b>9.48%</b>\n    </div>\n\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 8-13　结构调整前后对照</caption>\n        <thead><tr><th>指标</th><th class=\"num\">调整前</th><th class=\"num\">调整后</th><th class=\"num\">变动</th></tr></thead>\n        <tbody>\n          <tr><td>渠道综合成本率</td><td class=\"num\">10.00%</td><td class=\"num\"><b>9.48%</b></td><td class=\"num\"><span class=\"down\">↓0.52 个百分点</span></td></tr>\n          <tr><td>RevPAR（假设不变）</td><td class=\"num\">¥445</td><td class=\"num\">¥445</td><td class=\"num\"><span class=\"flat\">－持平</span></td></tr>\n          <tr><td><b>NRevPAR</b></td><td class=\"num\">¥400.5</td><td class=\"num\"><b>¥402.8</b></td><td class=\"num\"><span class=\"up\">↑¥2.31</span></td></tr>\n          <tr><td>年净客房收入增量</td><td class=\"num\">—</td><td class=\"num\"><b>+¥269,808</b></td><td class=\"num\"><span class=\"up\">↑约 ¥27 万</span></td></tr>\n          <tr><td>年渠道成本节约</td><td class=\"num\">¥5,197,733</td><td class=\"num\">¥4,927,925</td><td class=\"num\"><span class=\"down\">↓¥269,808</span></td></tr>\n        </tbody>\n      </table>\n    </div>\n\n    <h4>第 2 步 · 验证：这个调整会不会让 RevPAR 下降？</h4>\n    <div class=\"callout callout-warn\">\n      <span class=\"co-t\">这是整个测算里最关键的一步，也是最容易被跳过的一步</span>\n      <p>上面的计算假设 RevPAR 不变。但<b>把 OTA 的 4 个百分点转到直销，很可能带来 RevPAR 的损失</b>——因为 OTA 的流量比直销大，转化率高。<br>\n      <b>必须做「保本线」测算：</b>RevPAR 下降到多少时，NRevPAR 的提升会被抵消？<br>\n      调整后 NRevPAR = RevPAR × (1 − 9.48%) = RevPAR × 0.9052<br>\n      令其等于调整前的 ¥400.5：<br>\n      RevPAR 保本线 = 400.5 ÷ 0.9052 = <b>¥442.4</b><br>\n      <b>也就是说：只要 RevPAR 不低于 ¥442.4（比现在的 ¥445 低 0.6%），这次渠道结构调整就是划算的。</b></p>\n    </div>\n\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <caption>表 8-14　NRevPAR 敏感性分析<span class=\"cap-note\">假设渠道结构调整后 RevPAR 分别变动 0% / −1% / −2%</span></caption>\n        <thead><tr><th>情形</th><th class=\"num\">RevPAR</th><th class=\"num\">NRevPAR<br>（成本率 9.48%）</th><th class=\"num\">vs 调整前 ¥400.5</th><th>结论</th></tr></thead>\n        <tbody>\n          <tr><td>RevPAR 持平</td><td class=\"num\">¥445.0</td><td class=\"num\">¥402.8</td><td class=\"num\"><span class=\"up\">↑¥2.31</span></td><td><span class=\"pill pill-teal\">划算</span></td></tr>\n          <tr><td>RevPAR 降 1%</td><td class=\"num\">¥440.6</td><td class=\"num\">¥398.8</td><td class=\"num\"><span class=\"down\">↓¥1.70</span></td><td><span class=\"pill pill-red\">不划算</span></td></tr>\n          <tr><td>RevPAR 降 2%</td><td class=\"num\">¥436.1</td><td class=\"num\">¥394.8</td><td class=\"num\"><span class=\"down\">↓¥5.70</span></td><td><span class=\"pill pill-red\">不划算</span></td></tr>\n        </tbody>\n      </table>\n    </div>\n\n    <div class=\"callout callout-key\">\n    <span class=\"co-t\">本示范的真正结论：渠道结构调整的容错空间只有 0.6 个百分点</span>\n    <p>把 OTA 的 4 个百分点转到直销，能省下 ¥27 万渠道成本，<b>但代价是 RevPAR 只要跌超过 0.6%，省下的钱就全赔进去了。</b><br>\n    <b>所以正确做法不是「一次性切 4 个百分点」，而是：</b><br>\n    ① <b>小步试</b>：先切 1 个百分点（直销 25% → 26%，OTA 26% → 25%），跟踪 30 天；<br>\n    ② <b>看两个指标</b>：直销占比是否真的上去了、RevPAR 是否守住；<br>\n    ③ <b>达标再扩</b>：若 RevPAR 未跌，再切 1 个百分点，循环推进；<br>\n    ④ <b>任一阶段 RevPAR 跌破保本线，立即回退</b>，并复盘是哪个动作导致流量流失。<br>\n    <b>这正是第 12 节强调「每月只上一到两个动作，单独跟踪 30 天」的原因。</b></p>\n  </div>\n\n  <h4>第 3 步 · 落位与记录</h4>\n  <div class=\"kv\">\n    <div class=\"kv-row\"><div class=\"kv-k\">动作清单</div><div class=\"kv-v\">① 会员专享价从 BAR×92% 降到 BAR×90%（触发表：本模块第 12 节动作 ①）② 前台 OTA 客人转化话术上线（动作 ④）③ 预测 OCC ≥85% 的日期为直销保留 10% 库存（动作 ⑤）</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">台账登记</div><div class=\"kv-v\">三条动作各写一条《调价台账》，动作类型「上促销 / 开渠道」「设库存保留」，触发表编号填「<b>表 H</b>」（渠道与产品策略）</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">验收时点</div><div class=\"kv-v\">30 天后（即次月 5 日的《客源渠道报告》）统计：直销占比、OTA 国内占比、RevPAR、NRevPAR 四项</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">回退条件</div><div class=\"kv-v\"><b>RevPAR &lt; ¥442.4</b> 或 <b>直销占比未提升</b> → 立即回退，并在月报中写明「本轮渠道结构调整未达预期，原因：XXX」</div></div>\n    </div>\n  </div>\n\n  <\!-- ================= 十五 ================= -->\n  <h2 id=\"s15\">十五、学员跟练（6 题，含 2 道 NRevPAR）</h2>\n\n  <p>要求：每题限时 12 分钟。<b>NRevPAR 相关题目必须写出「渠道综合成本率 → NRevPAR」两步过程。</b></p>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 1 · NRevPAR 计算（基础）</div>\n    <div class=\"q-b\">某月云璟渠道结构如下：直销 22%（3%）、会员 10%（4%）、协议 25%（8%）、OTA 国内 30%（16%）、OTA 国际 4%（18%）、GDS 4%（13%）、批发商 5%（26%）。该月 RevPAR ¥488，可售房晚 9,360。<br>请：① 算渠道综合成本率；② 算 NRevPAR；③ 算该月渠道成本总额与净客房收入；④ 与基准结构（综合成本率 10.00%）相比，本月渠道结构是变好还是变坏，差多少。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 渠道综合成本率：</b><br>\n      直销 22% × 3% = 0.66%<br>\n      会员 10% × 4% = 0.40%<br>\n      协议 25% × 8% = 2.00%<br>\n      OTA 国内 30% × 16% = 4.80%<br>\n      OTA 国际 4% × 18% = 0.72%<br>\n      GDS 4% × 13% = 0.52%<br>\n      批发商 5% × 26% = 1.30%<br>\n      合计 = 0.66+0.40+2.00+4.80+0.72+0.52+1.30 = <b>10.40%</b><br>\n      （占比合计 22+10+25+30+4+4+5 = 100% ✓）<br><br>\n      <b>② NRevPAR：</b>488 ×（1 − 10.40%）= 488 × 0.896 = <b>¥437.2</b><br><br>\n      <b>③ 成本与净收入：</b><br>\n      客房收入 = RevPAR × 可售房晚 = 488 × 9,360 = <b>¥4,567,680</b><br>\n      渠道成本 = 4,567,680 × 10.40% = <b>¥475,039</b><br>\n      净客房收入 = 4,567,680 − 475,039 = <b>¥4,092,641</b><br>\n      验算：437.2 × 9,360 = ¥4,092,192（与 4,092,641 差 ¥449，因 NRevPAR 取整所致，差值 0.01%，合格）<br><br>\n      <b>④ 与基准对比：</b><br>\n      基准综合成本率 10.00%，本月 10.40% → <b>高出 0.40 个百分点，结构变坏</b>。<br>\n      若按基准结构，NRevPAR 应为 488 × 0.90 = ¥439.2；实际 ¥437.2 → <b>NRevPAR 少 ¥2.0</b><br>\n      年化损失 = 2.0 × 116,800 ≈ <b>¥233,600</b><br>\n      <b>归因：</b>本月 OTA 国内占比从 26% 升到 30%（<span class=\"up\">↑4pt</span>）、直销从 25% 降到 22%（<span class=\"down\">↓3pt</span>）、会员从 12% 降到 10%（<span class=\"down\">↓2pt</span>）。<b>典型的「用高成本渠道买量」</b>，须在月报中单独说明，并启动第 12 节的直销提升动作。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 2 · NRevPAR 与保本线（进阶）</div>\n    <div class=\"q-b\">云璟拟把批发商（26%）的 5 个百分点房晚全部取消，改由直销承接。已知：批发商净价 = BAR × 70%，直销价 = BAR × 92%（为承接这批客人需给到接近批发的价格）。平峰 BAR ¥680，当前 RevPAR ¥445，可售房晚 116,800。<br>请：① 算新渠道综合成本率；② 算新 NRevPAR（假设 RevPAR 不变）；③ 算 RevPAR 保本线；④ 判断该方案是否可行。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 新渠道综合成本率：</b><br>\n      直销 25% + 5% = 30% × 3% = 0.90%<br>\n      会员 12% × 4% = 0.48%<br>\n      协议 22% × 8% = 1.76%<br>\n      OTA 国内 26% × 16% = 4.16%<br>\n      OTA 国际 5% × 18% = 0.90%<br>\n      GDS 5% × 13% = 0.65%<br>\n      批发商 0% × 26% = 0%<br>\n      合计 = 0.90+0.48+1.76+4.16+0.90+0.65 = <b>8.85%</b><br><br>\n      <b>② 新 NRevPAR（RevPAR 不变）：</b>445 ×（1 − 8.85%）= 445 × 0.9115 = <b>¥405.6</b><br><br>\n      <b>③ RevPAR 保本线：</b><br>\n      调整前 NRevPAR = 445 × 0.90 = ¥400.5<br>\n      令 RevPAR × 0.9115 = 400.5 → RevPAR 保本线 = 400.5 ÷ 0.9115 = <b>¥439.4</b><br>\n      即 RevPAR 最多可跌（445 − 439.4）÷ 445 = <b>1.26%</b><br><br>\n      <b>④ 可行性判断：</b><br>\n      <b>算一下单间净收益就清楚了：</b><br>\n      批发商：净价 680 × 70% = ¥476，净收益 = 476 ×（1 − 26%）= 476 × 0.74 = <b>¥352.2</b><br>\n      直销（给到 92%）：售价 680 × 92% = ¥625.6，净收益 = 625.6 × 0.97 = <b>¥606.8</b><br>\n      <b>单间净收益差 = 606.8 − 352.2 = +¥254.6</b><br>\n      5% 房晚 = 116,800 × 5% = 5,840 间夜 → <b>年化增益 = 5,840 × 254.6 = ¥1,486,864（约 ¥149 万）</b><br>\n      <b>结论：方案可行，且收益巨大。</b><br>\n      <b>关键前提（必须写进方案）：</b>这 5% 的房晚要<b>真的能从批发商转移到直销</b>。批发商带来的是团队客，团队客通常不会自己上官网订房。所以现实中这个转化率可能只有 30–50%。<br>\n      <b>修正后的测算（按 40% 转化率）：</b>5,840 × 40% = 2,336 间夜转为直销，增益 = 2,336 × 254.6 = ¥594,746；其余 3,504 间夜流失（收益 0），损失 = 3,504 × 352.2 = ¥1,234,109。<br>\n      <b>净结果 = 594,746 − 1,234,109 = −¥639,363（亏损 64 万）</b><br>\n      <b>所以正确结论是：只有当这批客人确实能转到直销（转化率 &gt; 约 58%）时，方案才划算。判定的正确工具是《法典》表 G 的置换分析（见 M10），不是单看渠道成本率。</b>\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 3 · 反直觉结论的应用</div>\n    <div class=\"q-b\">渠道经理提出：某 OTA 愿意做一场大促，条件是本店把 SUP-K 的挂牌价从 ¥660 降到 ¥600，平台同步给流量倾斜，预计多卖 120 间。<br>请：① 若这 120 间本来就能以 ¥660 通过直销卖掉，这场促销的净收益影响是多少？② 若这 120 间是纯增量（不做就卖不掉），净收益影响是多少？③ 给出决策结论。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 情形一（120 间是替代，不是增量）：</b><br>\n      原方案：120 间 × ¥660 直销，净收益 = 120 × 660 × 0.97 = <b>¥76,824</b><br>\n      促销方案：120 间 × ¥600 OTA，净收益 = 120 × 600 × 0.84 = <b>¥60,480</b><br>\n      <b>净收益影响 = 60,480 − 76,824 = <span class=\"down\">−¥16,344</span>（亏损 ¥1.6 万）</b><br>\n      等价算法：单间损失 = 660 × 0.97 − 600 × 0.84 = 640.2 − 504 = ¥136.2；120 间 × 136.2 = ¥16,344 ✓<br><br>\n      <b>② 情形二（120 间是纯增量）：</b><br>\n      原方案：这 120 间卖不掉，净收益 = <b>¥0</b><br>\n      促销方案：120 间 × ¥600 OTA，净收益 = <b>¥60,480</b><br>\n      <b>净收益影响 = <span class=\"up\">+¥60,480</span>（赚 ¥6 万）</b><br>\n      注意：此时不能用「¥600 的净收益 ¥504」与「直销 ¥660 的净收益 ¥640.2」比——<b>因为直销根本卖不掉这 120 间，¥640.2 是拿不到的。</b>正确的比较基准是 ¥0。<br><br>\n      <b>③ 决策结论：</b><br>\n      <b>先判断「增量还是替代」，再决定做不做。</b>三条判据：<br>\n      a. <b>看目标日的预测 OCC。</b>若目标日预测 OCC &gt; 85%，房间本来就不愁卖 → 大概率是替代 → <b>拒绝</b>。<br>\n      b. <b>看提前天数。</b>若活动针对的是 30 天后的日期，且该日期当前在手已落后去年同期 → 可能是增量 → <b>可以做</b>。<br>\n      c. <b>做小范围测试。</b>先对 1–2 个日期开放促销，跟踪 7 天 Pickup 变化：若 Pickup 净增量接近 120 间的水平，说明是增量；若 Pickup 涨了但在手结构只是从直销搬到了 OTA（直销预订量同步下降），说明是替代 → 立即停止。<br>\n      <b>本例补充：</b>即使判定为增量，也要注意<b>价格一致性的连带影响</b>——把 OTA 价降到 ¥600，直销价必须同步降到 ≤¥600（红线 1），否则直销更贵会引发客诉。而直销降到 ¥600 会让<b>所有</b>直销订单的收益下降，不只是这 120 间。<b>这才是促销真正的隐性成本。</b>\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 4 · 表 H 全渠道配置</div>\n    <div class=\"q-b\">目标日 10 月 18 日（周六，D2 高涨日）。预测 OCC 87.6%，当前全部渠道开放，超售上限 0 间。当前 OTA 国内产量排序（近 90 天）：携程 &gt; 美团 &gt; 飞猪 &gt; 同程。<br>请：① 定表 H 的行；② 写出五类渠道的应有配置；③ 叠加表 B「85–90%」行的低价渠道 Stop Sell 列，写出最终配置；④ 指出本日最容易忘的一件事。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 定行：</b>85.0% ≤ 87.6% &lt; 90.0% → 表 H「<b>85–90%</b>」行。<br><br>\n      <b>② 表 H 应有配置：</b><br>\n      <b>OTA 国内：开 3 家</b> → 按产量排序保留携程、美团、飞猪，<b>同程 Stop Sell</b><br>\n      <b>OTA 国际：开 1 家</b> → 保留产量最高的 1 家（Booking 或 Agoda，按近 90 天产量定）<br>\n      <b>GDS / TMC：开</b><br>\n      <b>批发商 / 包房：关</b>（表 H 在 85–90% 与 90–95% 与 ≥95% 三行均为「关」）<br>\n      <b>直销 / 会员：全开</b><br><br>\n      <b>③ 叠加表 B「85–90%」行：</b>表 B 该行的「低价渠道 Stop Sell」列写的是「<b>保留</b>」→ <b>不额外关闭任何渠道</b>。<br>\n      <b>最终配置 = 表 H 的配置原样执行：</b>OTA 国内开 3 家（关同程）/ OTA 国际开 1 家 / GDS 开 / 批发商关 / 直销全开。<br>\n      <b>（对比：若本日预测 OCC 是 92%，走表 B「90–95%」行，则要额外关闭「尾房特惠」这一低价通路。）</b><br><br>\n      <b>④ 最容易忘的一件事：渠道开关的撤除登记。</b><br>\n      本日关闭了「同程」与「批发商」两个渠道，必须在《限制条件存量清单》中登记，<b>并填到期日 10 月 19 日</b>。<br>\n      10 月 19 日 08:30 扫描时筛出这两行，按撤除五步法执行：两层都撤（本店侧 + 渠道侧）→ <b>前台视角复查确实可订</b>（这一步最常被跳过）→ 截图 → 台账登记 + 清单更新。<br>\n      <b>补充：批发商关停按云璟执行标准需提前 5 个工作日通知包房商。</b>若 10 月 18 日才决定关，需评估是否构成违约，或只关闭「新增预订」而不取消已确认的存量订单。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 5 · 价格一致性核查与整改</div>\n    <div class=\"q-b\">目标日 11 月 20 日，房型 SUP-K，价格代码 BAR，不含早，免费取消。直销基准价 P = ¥748（当日刚从 ¥680 上调 10%）。核查结果：携程 ¥748、美团 ¥712、飞猪 ¥748、Booking ¥760、GDS 展示价 ¥748、美团会员日专享 ¥690（未登录用户可见）、会员专享价 ¥673、批发商净价 ¥561。<br>请：① 逐渠道算 Δ 并判定；② 指出共几项违规、分别违反哪条红线；③ 交叉校验会员价与批发商净价是否符合公式；④ 按整改 SOP 写出后续 4 个动作。</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① Δ 与判定：</b><br>\n      携程 748 − 748 = 0 → <span class=\"pill pill-teal\">一致</span><br>\n      美团 712 − 748 = <span class=\"down\">−¥36</span> → <span class=\"pill pill-red\">违反（红线 1）</span><br>\n      飞猪 748 − 748 = 0 → <span class=\"pill pill-teal\">一致</span><br>\n      Booking 760 − 748 = <span class=\"up\">+¥12</span> → <span class=\"pill pill-teal\">允许</span>（列入观察）<br>\n      GDS 748 − 748 = 0 → <span class=\"pill pill-teal\">一致</span><br>\n      美团会员日专享 690 − 748 = <span class=\"down\">−¥58</span> → <span class=\"pill pill-red\">违反（红线 1，且未登录可见，不是「仅限登录会员可见」）</span><br>\n      <b>会员专享价 673 − 748 = −¥75 → 不按 Δ 判，验证「仅限登录会员可见」</b><br>\n      <b>批发商净价 561 − 748 = −¥187 → 不按 Δ 判，验证「未公开挂牌」</b><br><br>\n      <b>② 共 2 项违规，均违反红线 1</b>（直销价不得高于任一 OTA 挂牌价）：<br>\n      a. 美团常规挂牌价 ¥712，低于直销 ¥748，差 ¥36；<br>\n      b. 美团会员日专享 ¥690，低于直销 ¥748，差 ¥58，且<b>未登录用户可见</b>——这不是合规的会员价，是公开的低价。<br>\n      <b>会员专享价 ¥673 与批发商净价 ¥561 不算违规</b>，只要前者仅限登录可见、后者未公开挂牌。<br><br>\n      <b>③ 交叉校验：</b><br>\n      <b>会员价：</b>748 × 90% = <b>¥673.2</b> → 实际 ¥673 ✓ 符合公式；下限校验 748 × 88% = ¥658.2，673 &gt; 658.2 ✓ 未破下限。<br>\n      <b>批发商净价：</b>748 × 75% = <b>¥561</b> → 实际 ¥561 ✓ 正好等于表 H「70–85%」行的限价上限（≤BAR×75%）。<br>\n      两项均符合，说明<b>违规不在本店的价格体系，而在渠道侧的展示</b>。<br><br>\n      <b>④ 整改 SOP 4 个动作：</b><br>\n      <b>1) 定位（15 min 内）：</b>锁定「美团 + 11-20 + SUP-K + BAR」；把美团渠道<b>未来 30 天同款产品全部扫一遍</b>，确认违规日期范围（本例刚上调 10%，重点查 11/20 之后的所有日期）。<br>\n      <b>2) 判成因：</b>美团常规价 ¥712 低于后台 → 疑似<b>系统未同步</b>（本次刚上调 10%，且违规日为调价日，高度怀疑缓存未刷新）；会员日专享 ¥690 且未登录可见 → <b>渠道私自促销</b>（渠道自补差价的平台活动）。<br>\n      <b>3) 处置：</b>① 联系美团渠道经理，要求下架会员日专享活动、恢复常规挂牌价；② 在渠道管理器<b>重新推送价格与库存</b>；③ 保留邮件 / 工单截图归档。<br>\n      <b>4) 复查与留痕：</b>整改后立即复查一次，<b>24 小时内再复查一次</b>，写入《价格一致性检查表》「整改结果」列（含时间戳）；记入当事人考核；在《调价台账》备注栏写明「美团 Δ=−¥36、会员日 Δ=−¥58，成因渠道促销 + 系统未同步，整改于 XX:XX 完成，复查通过」；<b>若美团 30 天内第 2 次违规，上报 L3 启动渠道合作复核。</b>\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">跟练 6 · 综合：表 B 与表 H 冲突 + 直销动作</div>\n    <div class=\"q-b\">目标日 10 月 2 日（D1 峰值日，国庆假期第 2 天）。预测 OCC 96.3%，当前 SUP-K/SUP-T BAR ¥1,020，全部渠道开放，MinLOS 现状 2 晚。当前直销占比 25%、OTA 国内 26%。<br>请：① 定表 B 与表 H 的行；② 写出表 B 四列 + 表 H 五列的全部动作，并说明表 B 与表 H 在渠道上的冲突如何仲裁；③ 若要在本日提升直销，8 个动作中哪一个<b>不适用</b>，为什么？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      <b>① 定行：</b>预测 OCC 96.3% ≥ 95% → 表 B「<b>≥95%</b>」行、表 H「<b>≥95%</b>」行。<br><br>\n      <b>② 全部动作：</b><br>\n      <b>表 B（≥95% 行，四列全做）：</b><br>\n      · <b>MinLOS = 3 晚</b>（D1 峰值日）→ 现状 2 晚，需改为 3 晚<br>\n      · <b>CTA = 启用</b>（本行为无条件启用，不看需求等级）<br>\n      · <b>低价渠道 Stop Sell = 关闭尾房特惠 / 团购 / 批发商</b><br>\n      · <b>超额预订 = 不超售</b>（上限设 0）<br><br>\n      <b>表 H（≥95% 行，五列全做）：</b><br>\n      · OTA 国内：<b>仅留 1 家产量最高</b>（携程）<br>\n      · OTA 国际：<b>关</b><br>\n      · GDS / TMC：<b>关</b>（需提前 3 个工作日通知主要协议客户与 TMC）<br>\n      · 批发商 / 包房：<b>关</b>（需提前 5 个工作日通知，避免违约）<br>\n      · 直销 / 会员：<b>全开 + 会员专享价</b>（MEMB 仅限登录会员可见）<br><br>\n      <b>冲突仲裁：</b>表 B 要求关闭「尾房特惠 / 团购 / 批发商」，表 H 也要求关闭批发商。<br>\n      <b>两者在批发商上结论一致（都关），无冲突。</b>规则仍是「先表 H 定全渠道配置，再表 B 叠加关闭」——本例表 B 额外要求关闭的「尾房特惠」和「团购」两类低价通路，即使表 H 未提及也要关。<br>\n      <b>最终渠道状态：</b>OTA 国内仅携程 / OTA 国际关 / GDS 关 / 批发商关 / 尾房特惠关 / 团购关 / 直销全开 + 会员专享价。<br><br>\n      <b>③ 8 个直销动作中不适用的一项：动作 ⑧「最后一刻价只在直销投放」。</b><br>\n      <b>理由（三条，任一条即构成不适用）：</b><br>\n      a. <b>触发条件不满足。</b>动作 ⑧ 的触发条件是「《法典》表 I 0–3 天窗口 + OCC &lt; 70% + 已过 18:00」。本日预测 OCC 96.3%，<b>远高于 70% 的门槛</b>，条件不成立。<br>\n      b. <b>与表 A 冲突。</b>表 A 在本日（≥95% × 领先 &gt;10%）给出 ↑20% 的提价动作，而最后一刻价是 BAR×80% 的深折，方向完全相反。<br>\n      c. <b>与表 B 冲突。</b>表 B 在本行要求「关闭尾房特惠 / 团购」，最后一刻价本质上就是尾房产品，<b>与其直接矛盾</b>。<br>\n      <b>本日适用的直销动作是：① 会员专享价（BAR×90%，仅限登录可见）、⑤ 直销专属库存（预测 OCC ≥85%，为直销保留 10% = 32 间）。</b>这两个动作在旺日的价值最大——房间不愁卖，把最便宜的渠道留给自己的直销通路。\n    </div></details>\n  </div>\n\n  <\!-- ================= 十六 ================= -->\n  <h2 id=\"s16\">十六、判定表默写清单</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">✎</span>当堂默写（限时 15 分钟）</div>\n    <ul class=\"checklist\">\n      <li>7 个渠道的综合成本率：直销 3% / 会员 4% / 协议 8% / GDS 13% / OTA 国内 16% / OTA 国际 18% / 批发商 26%</li>\n      <li>7 个渠道的净留存率：97% / 96% / 92% / 87% / 84% / 82% / 74%</li>\n      <li>NRevPAR 公式：NRevPAR = RevPAR ×（1 − 渠道综合成本率）；渠道综合成本率 = Σ（渠道房晚占比 × 该渠道成本率）</li>\n      <li>云璟基准结构：直销 25% / 会员 12% / 协议 22% / OTA 国内 26% / OTA 国际 5% / GDS 5% / 批发商 5%，综合成本率 <b>10.00%</b>，NRevPAR <b>¥400.5</b></li>\n      <li>反直觉结论：OTA ¥600 净 ¥504 vs 直销 ¥530 净 ¥514（便宜 ¥70 多赚 ¥10）；平衡点 ¥519.6</li>\n      <li>直销价下限公式：直销价下限 = OTA 价 ×（1 − OTA 成本率）÷（1 − 直销成本率）= OTA 价 × <b>86.6%</b></li>\n      <li>《法典》表 H 的 6 行：≥95% / 90–95% / 85–90% / 70–85% / 55–70% / &lt;55%（<b>与表 B 的 5 行、表 A 的 6 行不同，别串</b>）</li>\n      <li>《法典》表 H 的五列：OTA 国内 / OTA 国际 / GDS·TMC / 批发商·包房 / 直销·会员（<b>直销一列六行全部「全开」，永不关闭</b>）</li>\n      <li>表 H 批发商列：≥95%、90–95%、85–90% 三行均「关」；70–85% 行「限价开（≤BAR×75%）」；55–70% 与 &lt;55% 行「开」</li>\n      <li>表 H 与表 B 冲突规则：先表 H 定全渠道配置，再表 B 叠加关闭；表 B 要求关的无论表 H 说什么都关</li>\n      <li>价格一致性四条红线：① 直销价 ≤ OTA 价 ×100% ② 会员价可低但仅限登录可见 ③ 批发净价不得公开挂牌 ④ 违反须 24h 内整改并记入考核</li>\n      <li>Δ 判定：Δ&lt;0 违反 / Δ=0 一致 / Δ&gt;0 允许；<b>会员价与批发净价不适用 Δ 判定，改为验证可见性</b></li>\n      <li>整改 SOP 四步：定位（15 min）→ 判成因（4 选 1）→ 处置 → 复查留痕（24h 内复查 2 次）</li>\n      <li>4 类成因：渠道私自促销 / 包房商倒挂 / 系统未同步 / 人工改价漏改</li>\n      <li>直销提升 8 个动作的名称与各自的标准数字（会员价 90% 下限 88%、早鸟 90/92/95%、套餐 BAR+¥68、前台转化 ≥20%、专属库存 10%、复购率 ≥35%、直连门户 ≥30%、最后一刻 80% 且触发条件 0–3 天 + OCC&lt;70% + 18:00 后）</li>\n      <li>三个转换差值（BAR ¥680 基准）：OTA 国内→直销 +¥88.4 / OTA 国际→直销 +¥102.0 / 批发商→直销 +¥156.4</li>\n    </ul>\n  </div>\n\n  <\!-- ================= 十七 ================= -->\n  <h2 id=\"s17\">十七、随堂测（5 题）</h2>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 1 题</div>\n    <div class=\"q-b\">《法典》表 H 的「直销 / 会员」这一列，六行的取值分别是什么？有没有「关」这个选项？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>六行全部是「全开」+ 附加动作，没有「关」这个选项。</b><br>\n      逐行取值：≥95% → 全开 + 会员专享价；90–95% → 全开；85–90% → 全开；70–85% → 全开 + 早鸟；55–70% → 全开 + 闪购 / 套餐；&lt;55% → 全开 + 长住 / 团购。<br>\n      解析：直销（3%）与会员（4%）是成本率最低的两个渠道，<b>任何情况下关掉它们都不合理</b>——你不可能用一个更贵的渠道去替代一个更便宜的渠道。<br>\n      而且随着预测 OCC 下降，这一列的附加动作<b>越来越多</b>（会员专享价 → 早鸟 → 闪购/套餐 → 长住/团购），说明淡季正是直销发力的时候。<br>\n      <b>易错点：</b>把「≥95%」行的「全开 + 会员专享价」记成「全开 + 会员价关闭」。旺日是会员专享价价值最大的时候（房间不愁卖，把最便宜的通路留给会员能提高会员粘性），不是关掉它。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 2 题</div>\n    <div class=\"q-b\">直销价下限 = OTA 价 × 86.6%，这个 86.6% 是怎么来的？如果 OTA 成本率谈到了 14%，下限会变成多少？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>由两个渠道净收益相等点反推得出。OTA 成本率降到 14% 后，下限 = OTA 价 × 88.7%。</b><br>\n      解析：令「直销价 ×（1 − 直销成本率 3%）」=「OTA 价 ×（1 − OTA 成本率 16%）」<br>\n      直销价 = OTA 价 × 0.84 ÷ 0.97 = OTA 价 × <b>86.6%</b><br>\n      若 OTA 成本率降到 14%：直销价 = OTA 价 × 0.86 ÷ 0.97 = OTA 价 × <b>88.66%</b> ≈ <b>88.7%</b><br>\n      <b>关键洞察：OTA 佣金越低，直销价的下限就越高——也就是说，直销的让利空间越小。</b><br>\n      原因是：直销的优势完全来自成本率差。当 OTA 佣金从 16% 降到 14%，两个渠道的成本率差从 13 个百分点缩小到 11 个百分点，直销不再需要（也不应该）让那么多价去竞争。<br>\n      <b>实践意义：</b>当你与 OTA 谈下更低的佣金时，<b>同步上调会员价的让利下限</b>，不要白让利。这也是为什么会员价下限 88% 不是一个固定的管理数字，而是一个随渠道成本结构变动的<b>经济变量</b>。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 3 题</div>\n    <div class=\"q-b\">会员价（LOY）¥594 与批发商净价（WHO）¥495，两者的 Δ 都是负数，为什么都不算违反价格一致性？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>因为这两类价格本来就应该低于直销价，Δ&lt;0 是设计使然；它们的合规判定标准是「可见性」，不是「价格高低」。</b><br>\n      解析：《法典》表 H 的四条红线中：<br>\n      <b>红线 2</b> 明确写着「会员价可低于 OTA 价，但<b>仅限登录会员可见</b>」——也就是说，会员价<b>允许</b>低，只是不能让非会员看到。<br>\n      <b>红线 3</b> 明确写着「批发商 / 包房价为<b>净价，不得公开挂牌</b>」——也就是说，批发净价<b>允许</b>低，只是不能出现在任何公开可搜索页面。<br>\n      所以这两行的核查动作是：<br>\n      · 会员价 → 用<b>无痕窗口 / 未登录浏览器</b>访问，能看到即违规；<br>\n      · 批发净价 → 在<b>公开搜索页面</b>搜索该价格，能搜到即违规（这叫「包房商倒挂」，是整改 SOP 里的成因②）。<br>\n      <b>商业逻辑：</b>会员价是给忠诚客户的专属权益，批发净价是给渠道的结算价——两者都是<b>封闭通路的价格</b>，不进入公开比价体系。价格一致性管的是「公开市场上客人能看到的价格」，不是所有价格。<br>\n      <b>交叉校验（本例）：</b>594 ÷ 660 = 90% ✓ 符合会员价公式；495 ÷ 660 = 75% ✓ 正好是表 H「70–85%」行批发商限价上限。\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 4 题</div>\n    <div class=\"q-b\">表 H 在 ≥95% 时要求「OTA 国内仅留 1 家产量最高」，为什么不干脆全部关掉？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>因为 OTA 排名有记忆效应，完全关停会导致排名断崖式下滑，恢复成本远高于旺日多付的佣金。</b><br>\n      解析：OTA 的搜索排名权重里包含<b>可售天数、近期产量、订单确认率</b>等历史指标（见第 11 节动作清单第 2、7 项）。<br>\n      若在某个渠道完全关停若干天：① 该渠道的可售天数占比下降，排名权重被扣；② 近期产量归零，进一步拉低权重；③ 恢复投放后，排名不会立刻回到原水平，需要数周才能爬回。<br>\n      <b>算一笔账：</b>假设全关 5 天省下的佣金 = 5 天 × 30 间/天 × ¥1,020 × 16% = ¥24,480。但排名下滑后，恢复期（假设 4 周）内每天少 5 间 OTA 订单，损失 = 28 天 × 5 间 × ¥1,020 × 84% = ¥119,952。<br>\n      <b>损失是省下的钱的 4.9 倍。</b><br>\n      <b>所以表 H 的设计是「仅留 1 家产量最高」而不是「全关」</b>——保留产量最高的那一家，既把高成本渠道的投放压到最小，又维持了该渠道的排名权重与历史数据连续性。<br>\n      <b>同理，第 11 节把「非 D1 峰值日的关房天数」上限设为 3 天/月，也是为了保护排名权重。</b>\n    </div></details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 5 题</div>\n    <div class=\"q-b\">某月 RevPAR 同比 <span class=\"up\">↑8%</span>，但 NRevPAR 同比 <span class=\"down\">↓2%</span>。这说明什么？该怎么处理？</div>\n    <details class=\"ex-a\"><summary>查看答案与解析</summary><div class=\"a-body\">\n      答案：<b>说明这个月的增长是「用渠道成本买来的」，渠道结构恶化吞掉了全部 RevPAR 增幅还有余。须在月报中单独说明，并启动直销提升动作。</b><br>\n      解析：<b>定量拆解：</b>设去年同期 RevPAR = R₀ = 460，今年 = 460 × 1.08 = 496.8。<br>\n      去年 NRevPAR = 460 ×（1 − c₀）；今年 NRevPAR = 496.8 ×（1 − c₁）。<br>\n      已知今年 NRevPAR 同比降 2%：496.8 ×（1 − c₁）= 460 ×（1 − c₀）× 0.98。<br>\n      若 c₀ = 10.00%（基准结构）：去年 NRevPAR = 414.0；今年 = 414.0 × 0.98 = 405.7。<br>\n      反推 c₁ = 1 − 405.7 ÷ 496.8 = <b>18.34%</b>。<br>\n      <b>渠道综合成本率从 10.00% 恶化到 18.34%，上升 8.34 个百分点。</b><br>\n      按 BAR ¥680 估算，相当于大量房晚从直销（3%）转到了 OTA 国内（16%）甚至批发商（26%）。<br>\n      <b>处理动作（按顺序）：</b><br>\n      ① <b>在《月度收益复盘报告》与《客源渠道报告》中单独列示</b>：RevPAR 与 NRevPAR 反向变动，属红灯，须写明原因。<br>\n      ② <b>拆解渠道结构</b>：逐渠道对比本月与去年同期的房晚占比，定位是哪几个渠道的占比变化导致的。<br>\n      ③ <b>判断是主动还是被动</b>：若为主动（如淡季做 OTA 大促冲量），须说明<b>增量效果</b>——这批房晚不做就卖不掉吗？若不是增量，就是白付佣金。<br>\n      ④ <b>启动直销提升 8 个动作</b>：按第 12 节的优先级，先上第一梯队（会员价、前台转化、最后一刻价），<b>每月只上一到两个，单独跟踪 30 天</b>。<br>\n      ⑤ <b>设定回退条件</b>：若连续 2 个月 NRevPAR 仍同比下降，上报 L3，暂停一切以「冲 RevPAR」为目标的 OTA 促销活动。<br>\n      <b>记忆点：RevPAR 涨而 NRevPAR 跌 = 用渠道成本买量 = 失败。这句话应该写进月报模板的红灯判定里。</b>\n    </div></details>\n  </div>\n\n  <\!-- ================= 十八 ================= -->\n  <h2 id=\"s18\">十八、本模块产出物</h2>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">结课交付清单</span>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>《渠道地图卡》</b>——7 个渠道的成本率 / 净留存率 / 转换差值一页纸版，销售与前厅人手一份</li>\n      <li><b>《NRevPAR 计算器》</b>——输入 7 个渠道的房晚占比，自动输出渠道综合成本率、NRevPAR、年化渠道成本；含保本线反算功能</li>\n      <li><b>《渠道开关配置卡》</b>——表 H 的 6 行 × 5 列一页纸版，附「设计逻辑」（成本率从低到高，OCC 越高关得越多）</li>\n      <li><b>《渠道开关存量清单》</b>——与 M07 的《限制条件存量清单》同构，含到期日与撤除状态</li>\n      <li><b>《价格一致性检查表》</b>——8 行（6 公开渠道 + 会员价 + 批发净价），含 Δ 自动计算、判定、抓取时间戳、整改结果列</li>\n      <li><b>《违规整改 SOP 卡》</b>——四步（定位 15min / 判成因 4 选 1 / 处置 / 复查留痕 24h 内 2 次）+ 4 类成因判定依据</li>\n      <li><b>《OTA 排名优化检查表》</b>——10 项动作 × 标准数字 × 检查频率 × 责任人，每周一逐项打勾</li>\n      <li><b>《直销提升 8 动作跟踪表》</b>——每个动作的触发条件、上线日期、30 天跟踪指标（直销占比 / RevPAR / NRevPAR）、达标判定、回退条件</li>\n      <li><b>表 H 默写卷 + 渠道成本率默写卷</b>——当堂完成，错一格重默</li>\n    </ul>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">→</span>下一模块预告</div>\n    <p>到这里，你已经能独立决定「这个日子卖多少间」（M07）与「通过谁卖」（M08）。但这两件事都建立在一个前提上：<b>你的价格在市场上站得住</b>。<br>\n    M09 竞争监测与市场定位会把这个前提补上：怎么选竞争组合（Comp Set）5 家、每日比价的「五同」SOP 怎么走、《法典》表 C（ARI 七档）与表 D（MPI 五档）怎么用，以及本课程体系最关键的一张仲裁表——<b>表 O（决策优先级与冲突仲裁表）</b>。<br>\n    届时你会发现，M03、M07、M08 里那些「多张表给出不同动作时怎么办」的困惑，都有了一个统一的答案：<b>表 L 应急 &gt; 表 B 库存 &gt; 表 A 价格 &gt; 表 C 定位 &gt; 表 H 渠道 &gt; 表 D 诊断。</b></p>\n  </div>\n\n  <\!-- ===== 底部导航 ===== -->\n  <div class=\"p-title\">M07 库存与限制条件战术</div></a>\n    <a href=\"m09.html\" class=\"p-next\"><div class=\"p-dir\">下一模块 →</div><div class=\"p-title\">M09 竞争监测与市场定位</div></a>\n  </div>\n\n</div>\n"}]}, {"n": 9, "t": "竞争比价响应", "part": "L2 主管", "mod": "模块 M09", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n  <\!-- ===== 页头 ===== -->\n  <div class=\"crumb\">\n    <a href=\"../index.html\">学院首页</a><span>/</span>\n    <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n    L2 模块九\n  </div>\n\n  <div class=\"page-head\">\n    <div class=\"badge-row\">\n      <span class=\"badge badge-l2\">L2 收益管理主管</span>\n      <span class=\"badge\">模块 M09</span>\n      <span class=\"badge\">6 课时 / 540 min</span>\n      <span class=\"badge\">占 L2 认证 18.75%</span>\n      <span class=\"badge\">前置 M08</span>\n      <span class=\"badge badge-core\">★ 核心模块</span>\n    </div>\n    <h1 class=\"page-title\">竞争监测与市场定位</h1>\n    <p class=\"page-lede\">一句话导语：前面八个模块都在回答「我们自己该怎么干」，本模块回答最后一个问题——<b>「我们这么干，在市场上到底算什么水平」</b>。你会学到怎么选竞争组合（Comp Set）、每日比价的「五同」SOP、《法典》表 C（ARI 七档）与表 D（MPI 五档），以及本课程体系最关键的一张仲裁表：<b>表 O（决策优先级与冲突仲裁表）</b>。学完这一模块，多张表同时给出不同动作时你不再纠结——因为纠结是被明令禁止的，你只需要查表 O。</p>\n  </div>\n\n  <\!-- ===== 学习目标 ===== -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n    <ul>\n      <li>能<b>说出</b> 竞争组合（Comp Set）选取的 5 条标准，并能用这 5 条标准独立评估一家新开酒店是否应纳入云璟的竞争组合</li>\n      <li>能<b>独立执行</b> 每日比价 SOP：按「五同」（同入住日、同房型、同含早条件、同取消政策、同提前天数）采集 5 家竞对价格，在 08:30 前完成比价表更新</li>\n      <li>能<b>完整默写并套用</b>《法典》表 C（ARI 七档）与表 D（MPI 五档），并算出任意目标日的 ARI / MPI / RGI 三项指数并通过恒等式自检</li>\n      <li>能<b>运用</b> 三角诊断法（MPI × ARI = RGI）：对 8 种典型组合给出诊断结论与处方，其中「高MPI+低ARI」「低MPI+高ARI」「低MPI+低ARI」「高MPI+高ARI」四种基础组合能各配一个云璟的例子</li>\n      <li>能<b>完整默写并套用</b>《法典》表 O（六级优先级 + 三条冲突处理铁律），并在多表冲突场景下独立仲裁、写出唯一的执行动作与完整的台账备注</li>\n      <li>能<b>判断</b> 表 C 与表 A 不得叠加、表 C 与表 D 反向冲突、表 L 覆盖一切三类典型困境的处理方式</li>\n    </ul>\n    <p class=\"card-note\">前置要求：M01 指标与计算（OCC / ADR / RevPAR 口径）、M03 每日操作流水线（08:10 比价时段）、M05 需求预测（预测 OCC 是本模块全部指数的输入）、M07 库存战术（表 B 优先级 2）、M08 渠道分销（表 H 优先级 5）。<br>\n    本模块完整内嵌《法典》<b>表 C</b>（价格指数 ARI 判定表）、<b>表 D</b>（市场渗透指数 MPI 判定表）、<b>表 O</b>（决策优先级与冲突仲裁表）；引用 <b>表 A</b>、<b>表 B</b>、<b>表 E</b>、<b>表 H</b>、<b>表 I</b>、<b>表 L</b>、<b>表 M</b>、<b>表 N</b>。竞争组合数据来自《SPEC》2.4。全部阈值以《SPEC》第四章为唯一版本。</p>\n  </div>\n\n  <\!-- ===== 目录 ===== -->\n  <div class=\"toc\">\n    <div class=\"toc-title\">本模块目录</div>\n    <ol>\n      <li><a href=\"#s1\">竞争组合（Comp Set）：选谁当参照物</a></li>\n      <li><a href=\"#s2\">云璟的 5 家竞对与两种加权口径</a></li>\n      <li><a href=\"#s3\">每日比价 SOP：五同、怎么记、几点前完成</a></li>\n      <li><a href=\"#s4\">比价表：字段设计与填好的示例</a></li>\n      <li><a href=\"#s5\">三个指数：ARI / MPI / RGI 的口径与恒等式</a></li>\n      <li><a href=\"#s6\">《法典》表 C · 价格指数（ARI）判定表（完整内嵌）</a></li>\n      <li><a href=\"#s7\">《法典》表 D · 市场渗透指数（MPI）判定表（完整内嵌）</a></li>\n      <li><a href=\"#s8\">★ 三角诊断法：MPI × ARI = RGI 的 8 种组合与处方</a></li>\n      <li><a href=\"#s9\">★ 《法典》表 O · 决策优先级与冲突仲裁表（完整内嵌）</a></li>\n      <li><a href=\"#s10\">表 O 的三条铁律与仲裁五步法</a></li>\n      <li><a href=\"#s11\">三类典型冲突的处理范式</a></li>\n      <li><a href=\"#s12\">讲师示范 ①：一次完整的每日三维诊断</a></li>\n      <li><a href=\"#s13\">讲师示范 ②：四表冲突的仲裁全过程</a></li>\n      <li><a href=\"#s14\">学员跟练（6 题，含 3 道多表冲突）</a></li>\n      <li><a href=\"#s15\">判定表默写清单（当堂默写）</a></li>\n      <li><a href=\"#s16\">随堂测（5 题）</a></li>\n      <li><a href=\"#s17\">本模块产出物</a></li>\n    </ol>\n  </div>\n\n  <\!-- ================= 一 ================= -->\n  <h2 id=\"s1\">一、竞争组合（Comp Set）：选谁当参照物</h2>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">先问一个问题：为什么不能拿全市所有酒店做参照</span>\n    <p>因为<b>参照物必须与你争夺同一批客人</b>。把 3 公里外的一家经济型连锁放进竞争组合，它的价格会拉低组合均价，让你的 ARI 虚高到 130，诱使你做出错误的降价决策。<br>\n    把远在城市另一端的奢华酒店放进来，则让你的 ARI 虚低，诱使你盲目提价。<br>\n    <b>选错参照物比没有参照物更危险</b>——没有参照物你至少知道自己不知道，选错了你会误以为自己知道。</p>\n  </div>\n\n  <h3>1.1 竞争组合选取的 5 条标准</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 9-1　竞争组合（Comp Set）选取 5 条标准<span class=\"cap-note\">5 条<b>同时满足</b>才纳入；任一条不满足即排除</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>标准</th><th>判定口径</th><th>云璟的取值</th><th>不满足会怎样</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td>\n          <td><b>档次相同</b></td>\n          <td>同为「中高端全服务 / 准五星 / 四星+」定位；或相邻一档但客源高度重叠</td>\n          <td>A 中高端 / B 中高端 / C 中端偏上 / D 高端 / E 中高端</td>\n          <td>档次差一档以上 → ARI 失真（低档拉低均价、高档抬高均价）</td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td>\n          <td><b>距离相近</b></td>\n          <td>直线或车程 <b>3–5 km</b> 内；超出 5 km 需证明客源仍高度重叠</td>\n          <td>A 1.2km / B 2.5km / C 3.1km / D 4.0km / E 2.0km（<b>全部在 4.0km 内</b>）</td>\n          <td>距离过远 → 不构成直接竞争，MPI 无法反映真实份额争夺</td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td>\n          <td><b>房量相近</b></td>\n          <td>单家房量在 <b>200–400 间</b>；组合总房量建议 800–2,000 间</td>\n          <td>A 280 / B 240 / C 300 / D 350 / E 200（云璟 320 间）<br>组合总房量 <b>1,370 间</b></td>\n          <td>房量差 3 倍以上 → 加权 ADR 被大房量酒店主导，小房量酒店的价格信号被淹没</td>\n        </tr>\n        <tr>\n          <td class=\"num\">4</td>\n          <td><b>客源重叠</b></td>\n          <td>争夺同一批客源：商务散客 / 会展客 / 周末休闲客，至少 2 类重叠</td>\n          <td>5 家均争夺滨江区的<b>商务散客 + 会展客 + 周末休闲客</b></td>\n          <td>客源不重叠（如机场中转酒店）→ 价格变动互不影响，纳入毫无意义</td>\n        </tr>\n        <tr>\n          <td class=\"num\">5</td>\n          <td><b>数量固定</b></td>\n          <td><b>4–6 家</b>；一旦确定，<b>每季度复核一次</b>方可调整（《法典》表 N 每季度动作：竞争组合复核）</td>\n          <td>固定 <b>5 家</b>（A / B / C / D / E）</td>\n          <td>数量随意变动 → 同比数据断裂，历史趋势全部失效</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">两条排除规则（比 5 条标准更早执行）</span>\n    <p><b>排除 1 · 本集团内部酒店不纳入。</b>云璟酒店集团在杭州的其他门店<b>不得</b>进入竞争组合——集团内部有价格协调机制，纳入会形成自我参照。<br>\n    <b>排除 2 · 开业不足 90 天的新酒店暂不纳入。</b>新开业酒店处在爬坡期，价格策略不稳（常见低价冲量），纳入会让组合均价失真。观察满 90 天后，再用 5 条标准评估是否纳入。<br>\n    <b>但注意《法典》表 L 有一条专门针对新竞对的应急分支：</b>「竞对新开业 → 判定信号：3km 内新增同档酒店 → 立即动作：采集其价格加入比价表、评估 ARI」。也就是说，<b>不纳入竞争组合，但必须纳入比价表</b>——先观察，够格了再纳入。</p>\n  </div>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">评估一家新酒店是否纳入竞争组合的 5 问（按序问，一票否决）</span>\n    <div class=\"checklist\" style=\"margin-top:8px\">\n      <li>档次是否与本店相同？（中高端全服务 / 准五星 / 四星+）</li>\n      <li>距离是否在 3–5 km 内？</li>\n      <li>房量是否在 200–400 间？</li>\n      <li>是否争夺同一批客源（商务 / 会展 / 周末休闲，至少 2 类）？</li>\n      <li>纳入后组合总数是否仍在 4–6 家？（若是第 7 家，须先踢出一家最不相关的）</li>\n    </div>\n    <p style=\"margin-top:8px\"><b>五问全过才纳入，且只在每季度复核时调整，中途不增不减。</b></p>\n  </div>\n\n  <h2 id=\"s2\">二、云璟的 5 家竞对与两种加权口径</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption>表 9-2　云璟竞争组合（Comp Set）<span class=\"cap-note\">《SPEC》2.4 原文，唯一权威版本</span></caption>\n      <thead><tr><th>竞对</th><th>档次</th><th class=\"num\">房量</th><th class=\"num\">平峰 BAR</th><th class=\"num\">距本店</th><th class=\"num\">房量权重</th></tr></thead>\n      <tbody>\n        <tr><td><b>A 江畔万枫酒店</b></td><td>中高端</td><td class=\"num\">280</td><td class=\"num\">¥650</td><td class=\"num\">1.2 km</td><td class=\"num\">280 ÷ 1,370 = 20.4%</td></tr>\n        <tr><td><b>B 滨江希尔顿花园</b></td><td>中高端</td><td class=\"num\">240</td><td class=\"num\">¥690</td><td class=\"num\">2.5 km</td><td class=\"num\">240 ÷ 1,370 = 17.5%</td></tr>\n        <tr><td><b>C 钱塘智选假日</b></td><td>中端偏上</td><td class=\"num\">300</td><td class=\"num\">¥560</td><td class=\"num\">3.1 km</td><td class=\"num\">300 ÷ 1,370 = 21.9%</td></tr>\n        <tr><td><b>D 星光开元名都</b></td><td>高端</td><td class=\"num\">350</td><td class=\"num\">¥880</td><td class=\"num\">4.0 km</td><td class=\"num\">350 ÷ 1,370 = 25.5%</td></tr>\n        <tr><td><b>E 云栖亚朵 S</b></td><td>中高端</td><td class=\"num\">200</td><td class=\"num\">¥620</td><td class=\"num\">2.0 km</td><td class=\"num\">200 ÷ 1,370 = 14.6%</td></tr>\n        <tr><td colspan=\"2\"><b>合计</b></td><td class=\"num\"><b>1,370</b></td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\"><b>100.0%</b></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>2.1 两种加权口径：¥680 与 ¥691.7（本学院统一说明）</h3>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">这是本模块最需要讲清楚的一处口径问题</span>\n    <p>《SPEC》2.4 标注「竞争组合加权均价（平峰）：<b>¥680</b>」；而按<b>房量加权</b>计算的结果是 <b>¥691.7</b>。两个数都对，算法不同：<br>\n    <b>¥680 = 算术平均</b>：（650 + 690 + 560 + 880 + 620）÷ 5 = 3,400 ÷ 5 = <b>¥680</b><br>\n    <b>¥691.7 = 房量加权平均</b>：（280×650 + 240×690 + 300×560 + 350×880 + 200×620）÷ 1,370<br>\n    　　= （182,000 + 165,600 + 168,000 + 308,000 + 124,000）÷ 1,370 = 947,600 ÷ 1,370 = <b>¥691.7</b></p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 9-3　两种口径的分工（本学院统一规定）<span class=\"cap-note\"><b>同一次计算中不得混用</b>，必须在表头标明用的是哪一种</span></caption>\n      <thead><tr><th>口径</th><th>数值</th><th>算法</th><th>使用场景</th><th>为什么</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>算术平均</b></td><td class=\"num\"><b>¥680</b></td>\n          <td>5 家挂牌价求和 ÷ 5</td>\n          <td>① 日间口头汇报与快速心算；② 收益晨会的口头沟通；③ 快速校核（「我们 ¥680，组合 ¥680，我们持平」）</td>\n          <td>不需要计算器就能算，适合需要立刻给结论的场合。<b>与《SPEC》2.4 标注值一致</b></td>\n        </tr>\n        <tr>\n          <td><b>房量加权</b></td><td class=\"num\"><b>¥691.7</b></td>\n          <td>Σ（房量 × 挂牌价）÷ 总房量</td>\n          <td>① <b>比价表与 ARI / MPI / RGI 的正式计算</b>；② 月报与业主一页纸；③ 所有需要落笔存档的数字</td>\n          <td>《SPEC》3.1 定义 ARI = 本店 ADR ÷ 竞争组合<b>加权</b> ADR × 100，用的是「加权」二字；且房量加权能反映「大房量酒店的价格对市场影响更大」这一事实</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">两种口径得出的结论一致吗？在云璟的基准情形下是一致的</span>\n    <p>本店平峰 BAR ¥680：<br>\n    ARI（对算术平均 680）= 680 ÷ 680 × 100 = <b>100.0</b> → 落表 C「97–103 健康」→ 维持<br>\n    ARI（对房量加权 691.7）= 680 ÷ 691.7 × 100 = <b>98.3</b> → 落表 C「97–103 健康」→ 维持<br>\n    <b>两者同档，结论相同，都与《SPEC》2.4「本店目标定位：ARI ≈ 100」一致。</b><br>\n    <b>但不要以为永远一致。</b>当某家大房量竞对（如 D 星光开元名都 350 间）大幅调价时，房量加权会被显著拉动，而算术平均只变动 1/5。此时两种口径可能落在不同档位。<b>规则：一旦两种口径落在不同档位，一律以房量加权（¥691.7 口径）为准。</b></p>\n  </div>\n\n  <h2 id=\"s3\">三、每日比价 SOP：五同、怎么记、几点前完成</h2>\n\n  <h3>3.1 时点：08:10 开始，08:30 前完成</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 9-4　比价的时段安排<span class=\"cap-note\">《法典》表 M 原文</span></caption>\n      <thead><tr><th>时间</th><th>动作</th><th>产出物</th><th class=\"num\">耗时上限</th></tr></thead>\n      <tbody>\n        <tr><td><b>08:10</b></td><td>采集竞争组合 5 家价格</td><td>比价表更新</td><td class=\"num\">20 min</td></tr>\n        <tr><td><b>08:30</b></td><td>逐日查《法典》表 A/B/C/H，得出动作清单</td><td>《今日动作清单》</td><td class=\"num\">40 min</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">为什么必须 08:30 前完成：比价是表 C / 表 D 的唯一输入</span>\n    <p>08:30 的查表环节要查表 A / 表 B / 表 C / 表 H 四张表，其中<b>表 C（ARI）与表 D（MPI）的输入全部来自比价表</b>。<br>\n    比价没做完 → 表 C / 表 D 查不了 → 08:30 的查表不完整 → 09:10 的执行会漏动作。<br>\n    <b>硬性要求：08:10–08:30 是比价的固定窗口，5 家必须在这个窗口内采集完毕。若某家在窗口内采集失败，该行留空并告警，不得用昨日数据填充。</b></p>\n  </div>\n\n  <h3>3.2 比什么：五同</h3>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">「五同」是比价的全部纪律。少同一样，这个价就不可比</span>\n    <div class=\"checklist\" style=\"margin-top:8px\">\n      <li><b>同入住日</b>——比的是同一个目标日，不能拿本店的周五比竞对的周六</li>\n      <li><b>同房型</b>——比的是同一档位房型。云璟统一用 <code>SUP-K</code>（高级大床房，系数 100）为对标房型，竞对取与之同档位的房型（如同为「高级大床房 / 豪华大床房」）</li>\n      <li><b>同含早条件</b>——统一比<b>不含早</b>价。含早价与不含早价混比，会差出 ¥68/人（云璟含早加价；注意这与自助早餐门市价 ¥128/人 是两个不同的数）</li>\n      <li><b>同取消政策</b>——统一比<b>免费取消</b>的产品。不可取消产品天然便宜 5–10%，混比会让竞对显得更便宜</li>\n      <li><b>同提前天数</b>——统一在<b>同一提前天数</b>下比。提前 30 天的价格与提前 1 天的价格没有可比性（提前预订价通常更低）</li>\n    </div>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 9-5　「五同」违反时的偏差量级（云璟实测量级参考）<span class=\"cap-note\">用于理解「为什么必须同」</span></caption>\n      <thead><tr><th>不同哪一项</th><th>典型偏差量级</th><th>后果</th></tr></thead>\n      <tbody>\n        <tr><td>不同入住日（平峰 vs 高峰）</td><td><span class=\"up\">↑30–100%</span></td><td>ARI 严重失真，可能跨越 2–3 个档位</td></tr>\n        <tr><td>不同房型（标准房 vs 套房）</td><td><span class=\"up\">↑50–180%</span></td><td>同上，且是最常见的错误</td></tr>\n        <tr><td>不同含早条件</td><td><span class=\"up\">↑¥68/人</span>（双人即 <span class=\"up\">↑¥136</span>）</td><td>ARI 偏差约 10 个点（按 BAR ¥680 计，单人即 10%）</td></tr>\n        <tr><td>不同取消政策</td><td><span class=\"down\">↓5–10%</span></td><td>ARI 偏差 5–10 个点</td></tr>\n        <tr><td>不同提前天数</td><td><span class=\"down\">↓5–20%</span>（越早越便宜）</td><td>ARI 偏差 5–20 个点</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>3.3 怎么记：采集的 6 个必录项</h3>\n\n  <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n    "}, {"id": "p1", "name": "固定采集顺序", "min": 8, "desc": "", "html": "<h4>固定采集顺序</h4>\n    <p>按<b>固定顺序</b>采集：A → B → C → D → E。<b>顺序固定能显著减少漏采</b>——人脑对「固定流程」的漏项率远低于对「随机检查」的漏项率。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n    <h4>录 6 项，一项都不能少</h4>\n    <div class=\"tbl-wrap\" style=\"margin-top:8px\">\n      <table class=\"tbl\">\n        <caption>表 9-6　比价采集的 6 个必录项</caption>\n        <thead><tr><th class=\"num\">#</th><th>必录项</th><th>为什么必须有</th></tr></thead>\n        <tbody>\n          <tr><td class=\"num\">1</td><td><b>采集时间戳</b>（精确到分钟）</td><td>OTA 价格随库存动态变化。没有时间戳就无法判断数据新鲜度，也无法解释「同一天两个人采的价格不一样」</td></tr>\n          <tr><td class=\"num\">2</td><td><b>竞对名称 + 房量</b></td><td>房量是加权计算的分母来源</td></tr>\n          <tr><td class=\"num\">3</td><td><b>对标房型挂牌价</b></td><td>核心数据</td></tr>\n          <tr><td class=\"num\">4</td><td><b>含早状态</b></td><td>校验「同含早条件」</td></tr>\n          <tr><td class=\"num\">5</td><td><b>取消政策</b></td><td>校验「同取消政策」</td></tr>\n          <tr><td class=\"num\">6</td><td><b>是否售罄</b></td><td><b>售罄的竞对必须从加权计算中剔除后重算</b>——一家售罄的酒店，其挂牌价没有市场意义（它已经不卖了）</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n    <h4>售罄处理（最容易出错的一步）</h4>\n    <p>若某家竞对在目标日<b>售罄</b>：① 该行标记「售罄」；② <b>从加权 ADR 的分子与分母中同时剔除</b>（即分子减去「该家房量 × 该家价格」，分母减去该家房量）；③ 重新计算加权 ADR。<br>\n    <b>错误做法：把售罄酒店的价格按原价计入。</b>一家已经卖完的酒店，其挂牌价往往是当日最高的，计入会虚抬组合均价，让你的 ARI 虚低，进而误判为「该提价」。<br>\n    <b>注意：售罄只影响「价格」维度的加权 ADR，不影响「出租率」维度的加权 OCC</b>——售罄酒店的 OCC 应记为 100%，必须计入（否则会低估市场热度）。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n    "}, {"id": "p2", "name": "自动算出 4 个数", "min": 8, "desc": "", "html": "<h4>自动算出 4 个数</h4>\n    <p>比价表应自动计算：① 组合加权 ADR（房量加权）② 组合加权 OCC（房量加权）③ 本店 ARI ④ 本店 MPI。<br>\n    <b>并跑恒等式自检：|RGI − MPI × ARI ÷ 100| ≤ 0.2</b>，不通过不得进入 08:30 查表。</p>\n  </div></div>\n\n  <h2 id=\"s4\">四、比价表：字段设计与填好的示例</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 9-7　《每日比价表》示例<span class=\"cap-note\">目标日 2026-11-12（周四，D3 平峰日）；对标房型 SUP-K 同档位；不含早；免费取消；提前 15 天</span></caption>\n      <thead><tr><th>竞对</th><th class=\"num\">房量</th><th class=\"num\">挂牌价</th><th>含早</th><th>取消政策</th><th>是否售罄</th><th class=\"num\">采集时间</th><th class=\"num\">当日 OCC</th></tr></thead>\n      <tbody>\n        <tr><td>A 江畔万枫酒店</td><td class=\"num\">280</td><td class=\"num\">¥680</td><td>不含早</td><td>免费取消</td><td>否</td><td class=\"num\">08:12</td><td class=\"num\">78.0%</td></tr>\n        <tr><td>B 滨江希尔顿花园</td><td class=\"num\">240</td><td class=\"num\">¥720</td><td>不含早</td><td>免费取消</td><td>否</td><td class=\"num\">08:14</td><td class=\"num\">76.0%</td></tr>\n        <tr><td>C 钱塘智选假日</td><td class=\"num\">300</td><td class=\"num\">¥560</td><td>不含早</td><td>免费取消</td><td>否</td><td class=\"num\">08:16</td><td class=\"num\">70.0%</td></tr>\n        <tr><td>D 星光开元名都</td><td class=\"num\">350</td><td class=\"num\">¥880</td><td>不含早</td><td>免费取消</td><td>否</td><td class=\"num\">08:19</td><td class=\"num\">68.0%</td></tr>\n        <tr><td>E 云栖亚朵 S</td><td class=\"num\">200</td><td class=\"num\">¥620</td><td>不含早</td><td>免费取消</td><td>否</td><td class=\"num\">08:21</td><td class=\"num\">80.0%</td></tr>\n        <tr><td><b>本店（云璟）</b></td><td class=\"num\"><b>320</b></td><td class=\"num\"><b>¥680</b></td><td>不含早</td><td>免费取消</td><td>否</td><td class=\"num\">—</td><td class=\"num\"><b>75.0%</b>（预测）</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 9-8　由比价表自动算出的 4 个数</caption>\n      <thead><tr><th>指标</th><th>算式</th><th class=\"num\">结果</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>组合加权 ADR</b></td>\n          <td>（280×680 + 240×720 + 300×560 + 350×880 + 200×620）÷ 1,370<br>=（190,400 + 172,800 + 168,000 + 308,000 + 124,000）÷ 1,370<br>= 963,200 ÷ 1,370</td>\n          <td class=\"num\"><b>¥703.1</b></td>\n        </tr>\n        <tr>\n          <td><b>组合加权 OCC</b></td>\n          <td>（280×78 + 240×76 + 300×70 + 350×68 + 200×80）÷ 1,370<br>=（21,840 + 18,240 + 21,000 + 23,800 + 16,000）÷ 1,370<br>= 100,880 ÷ 1,370</td>\n          <td class=\"num\"><b>73.6%</b></td>\n        </tr>\n        <tr>\n          <td><b>本店 ARI</b></td>\n          <td>本店 ADR ¥680 ÷ 组合加权 ADR ¥703.1 × 100</td>\n          <td class=\"num\"><b>96.7</b></td>\n        </tr>\n        <tr>\n          <td><b>本店 MPI</b></td>\n          <td>本店预测 OCC 75.0% ÷ 组合加权 OCC 73.6% × 100</td>\n          <td class=\"num\"><b>101.9</b></td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">口径提示：ARI 用的是「本店 ADR」还是「本店 BAR」？</span>\n    <p>《SPEC》3.1 的定义是 <b>ARI = 本店 ADR ÷ 竞争组合加权 ADR × 100</b>，用的是 <b>ADR</b>。<br>\n    但 ADR 是<b>已发生的事后指标</b>（客房收入 ÷ 已售房晚），在预测场景下还没有 ADR 可用。<br>\n    <b>本学院统一口径：</b><br>\n    ① <b>预测场景（每日 08:30 查表、表 C 判定）→ 用「本店 BAR（SUP-K/SUP-T）」代替 ADR</b>，与竞对的「同档位挂牌价」同口径（都是挂牌 BAR），符合「五同」；<br>\n    ② <b>复盘场景（月度三维诊断、表 N 每月 1 日）→ 用实际 ADR</b>，与竞对的实际 ADR 同口径。<br>\n    <b>两种场景都必须在表头注明用的是哪一种，不得混用。</b>本模块的例题中，每日查表用 BAR，月度诊断用 ADR。\n    </p>\n  </div>\n\n  <h2 id=\"s5\">五、三个指数：ARI / MPI / RGI 的口径与恒等式</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 9-9　三个指数的定义与读法<span class=\"cap-note\">《SPEC》3.1 原文</span></caption>\n      <thead><tr><th>指数</th><th>中文名</th><th>公式</th><th>&gt;100 意味着</th><th>回答的问题</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>MPI</b></td><td>市场渗透指数<br>Market Penetration Index</td>\n          <td>本店 OCC ÷ 竞争组合 OCC × 100</td>\n          <td><b>份额领先</b>——你抢到的客人比竞对多</td>\n          <td><b>量</b>：我卖得比竞对多吗？</td>\n        </tr>\n        <tr>\n          <td><b>ARI</b></td><td>平均房价指数<br>Average Rate Index</td>\n          <td>本店 ADR ÷ 竞争组合 ADR × 100</td>\n          <td><b>卖得比竞对贵</b></td>\n          <td><b>价</b>：我卖得比竞对贵吗？</td>\n        </tr>\n        <tr>\n          <td><b>RGI</b></td><td>收入生成指数<br>Revenue Generation Index</td>\n          <td>本店 RevPAR ÷ 竞争组合 RevPAR × 100<br><b>= MPI × ARI ÷ 100</b></td>\n          <td><b>综合竞争力领先</b>——量价合起来赢了</td>\n          <td><b>钱</b>：我总共赚得比竞对多吗？</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">恒等式自检（每次算完必须跑）</span>\n    <div class=\"formula\" style=\"margin-top:8px\">\n      <span class=\"f-label\">恒等式</span>\n      RGI = MPI × ARI ÷ 100<br>\n      <span class=\"f-label\">容差</span>\n      |RGI（直接算）− MPI × ARI ÷ 100| ≤ <span class=\"f-out\">0.2</span>\n    </div>\n    <p style=\"margin-top:8px\"><b>本例验证：</b><br>\n    RGI（直接算）= 本店 RevPAR ÷ 组合 RevPAR × 100 =（75.0% × 680）÷（73.6% × 703.1）× 100 = 510.0 ÷ 517.5 × 100 = <b>98.6</b><br>\n    MPI × ARI ÷ 100 = 101.9 × 96.7 ÷ 100 = <b>98.5</b><br>\n    |98.6 − 98.5| = 0.1 ≤ 0.2 ✓ <b>通过</b><br>\n    <b>差值超过 0.2 说明三个数不是同一口径算出来的</b>——常见原因：OCC 一个用总房量做分母一个用可售房晚；或 ADR 一个含早一个不含早；或预测 OCC 与组合 OCC 不是同一目标日。<b>不通过不得上报。</b></p>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">只看一个指数必然误判——这是本模块最重要的一句话</span>\n    <p>三个经典的反例：<br>\n    ① <b>ARI 高 ≠ 好。</b>ARI 120 说明你比竞对贵 20%，但如果 MPI 只有 70（份额大幅落后），你的 RGI = 70 × 120 ÷ 100 = <b>84</b>——你贵了但没人住，总收入输得很惨。<br>\n    ② <b>MPI 高 ≠ 好。</b>MPI 115 说明份额领先，但如果 ARI 只有 85（比竞对便宜 15%），你的 RGI = 115 × 85 ÷ 100 = <b>97.75</b>——你靠低价买来了份额，钱留在桌上。<br>\n    ③ <b>RGI 高 ≠ 永远安全。</b>RGI 140（如 MPI 112 × ARI 125）看起来很牛，但 ARI 125 已是「严重偏高」，一旦市场转向，跌幅会比竞对猛得多。<br>\n    <b>所以三个指数必须同时看，这就是下一节「三角诊断法」的由来。</b></p>\n  </div>\n\n  <h2 id=\"s6\">六、《法典》表 C · 价格指数（ARI）判定表（完整内嵌）</h2>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">输入</span>\n    ARI = 本店 ADR（预测场景用 BAR）÷ 竞争组合加权 ADR × 100\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption><span class=\"badge-codex\">表 C</span>　价格指数（ARI）判定表<span class=\"cap-note\">七档，从上到下 ARI 由高到低</span></caption>\n      <thead><tr><th>ARI</th><th>判定</th><th>动作</th></tr></thead>\n      <tbody>\n        <tr><td><b>&gt;120</b></td><td>严重偏高</td><td>MPI&lt;95 → <b>降 8%</b>；MPI≥95 → <b>维持并每日盯 Pickup</b></td></tr>\n        <tr><td><b>110–120</b></td><td>偏高</td><td>RGI&lt;100 → <b>降 5%</b>；RGI≥100 → <b>维持</b></td></tr>\n        <tr><td><b>103–110</b></td><td>略高</td><td><b>维持，观察 Pickup</b></td></tr>\n        <tr><td><b>97–103</b></td><td>健康</td><td><b>维持</b></td></tr>\n        <tr><td><b>90–97</b></td><td>略低</td><td>预测 OCC≥80% → <b>提 3%</b>；否则 <b>维持</b></td></tr>\n        <tr><td><b>80–90</b></td><td>偏低</td><td><b>提 5%</b></td></tr>\n        <tr><td><b>&lt;80</b></td><td>严重偏低</td><td><b>提 8%</b>，并核查房型配置与含早策略</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">区间边界（含下界不含上界，与表 A / 表 B / 表 E / 表 H 一致）</span>\n    <p>&gt;120.0 → 严重偏高<br>\n    110.0 ≤ X ≤ 120.0 → 偏高（<b>注意：本档两端都含等号</b>，原文写的是「110–120」，且上一档是「&gt;120」，下一档是「103–110」，所以 120.0 归「110–120」，110.0 也归「110–120」）<br>\n    103.0 &lt; X &lt; 110.0 → 略高<br>\n    97.0 ≤ X ≤ 103.0 → 健康<br>\n    90.0 ≤ X &lt; 97.0 → 略低<br>\n    80.0 ≤ X &lt; 90.0 → 偏低<br>\n    X &lt; 80.0 → 严重偏低<br>\n    <b>本学院统一：边界值取「含下界不含上界」，唯一例外是「110–120」档——因为上一档写的是「&gt;120」（严格大于），所以 120.0 归入「110–120」。同理 103.0 归入「97–103」（因下一档是「103–110」，103.0 取含下界）。</b></p>\n  </div>\n\n  <h3>6.1 表 C 的执行约束（原文，必须遵守）</h3>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">《SPEC》表 C 执行约束原文</span>\n    <p><b>ARI 调整每次不超过 8%，每周不超过 2 次，且不得与表 A 结论叠加执行（同日只执行优先级更高的一条，优先级：表 A &gt; 表 C）。</b></p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 9-10　表 C 三条执行约束的解读</caption>\n      <thead><tr><th class=\"num\">#</th><th>约束</th><th>校验方法</th><th>不满足时怎么办</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td>\n          <td>ARI 调整<b>每次不超过 8%</b></td>\n          <td>表 C 最大动作是「提 8%」与「降 8%」，本身就是上限</td>\n          <td>不存在超限可能（表 C 没有更大的动作）</td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td>\n          <td>ARI 调整<b>每周不超过 2 次</b></td>\n          <td>查《调价台账》近 7 天触发表编号为「表 C」的条目数</td>\n          <td>第 3 次起<b>不予执行</b>，写入《观察清单》，下周一重新评估</td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td>\n          <td><b>不得与表 A 结论叠加执行</b>（同日只执行优先级更高的一条，表 A &gt; 表 C）</td>\n          <td>若当日表 A 给出的动作 ≠ 维持，则表 C 的动作一律不执行</td>\n          <td>表 C 结论写入《观察清单》与台账备注栏，不落位</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">约束 3 的两种理解，本学院采用哪一种</span>\n    <p>「不得与表 A 结论叠加执行」有两种可能的理解：<br>\n    <b>理解甲（严格）：</b>只要当日表 A 有动作（哪怕与表 C 反向），表 C 就一律不执行。<br>\n    <b>理解乙（宽松）：</b>只有表 A 与表 C <b>同方向</b>时才禁止叠加（避免调过头）；反向时两者冲突，仍按表 O 只执行表 A。<br>\n    <b>本学院采用理解甲。</b>理由：《法典》表 O 已经明确「同日只执行优先级最高的那一条动作」，表 A（优先级 3）&gt; 表 C（优先级 4）。<b>只要表 A 给出了非「维持」的动作，表 C 就一定不执行</b>，无论方向。<br>\n    <b>但有一个例外必须记住：若表 A 的动作是「维持」，则按表 O 第二条铁律「若最高优先级动作为『维持』，则顺延执行下一优先级」，此时表 C 的动作被执行。</b></p>\n  </div>\n\n  <h2 id=\"s7\">七、《法典》表 D · 市场渗透指数（MPI）判定表（完整内嵌）</h2>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">输入</span>\n    MPI = 本店 OCC ÷ 竞争组合 OCC × 100\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption><span class=\"badge-codex\">表 D</span>　市场渗透指数（MPI）判定表<span class=\"cap-note\">五档。《SPEC》表 O 明确：表 D「多为分析而非动作」，优先级最低（6）</span></caption>\n      <thead><tr><th>MPI</th><th>判定</th><th>动作</th><th>动作性质</th></tr></thead>\n      <tbody>\n        <tr><td><b>&gt;110</b></td><td>份额领先</td><td><b>优先提价</b>（走表 C 提价分支）</td><td><b>导向性</b>——本身不给价格动作，把球踢给表 C</td></tr>\n        <tr><td><b>100–110</b></td><td>健康</td><td><b>维持</b></td><td>无动作</td></tr>\n        <tr><td><b>95–100</b></td><td>略弱</td><td>检查 OTA 曝光 / 挂牌 / 点评分；<b>补挂牌</b></td><td><b>非价格动作</b>——不动价格</td></tr>\n        <tr><td><b>85–95</b></td><td>落后</td><td><b>降价 5%</b> 或 <b>增加 OTA 广告投放</b></td><td><b>组合包</b>——二选一，见下文</td></tr>\n        <tr><td><b>&lt;85</b></td><td>严重落后</td><td>启动《应急方案 L2-E1》：<b>降价 10%</b> + 全员直销动员 + 48 小时复盘</td><td><b>组合包</b>——三部分拆分处理，见下文</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>7.1 表 D 两个组合包的拆分处理规则</h3>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">核心规则：组合包要拆开，价格动作参与仲裁，非价格动作不参与</span>\n    <p>表 D 的「85–95 落后」与「&lt;85 严重落后」两档给的都是<b>组合包</b>。处理时必须拆成「价格动作」与「非价格动作」两类：<br>\n    <b>价格动作 → 参与表 O 仲裁</b>（与表 A / 表 C 同类，只执行优先级最高的那一条）<br>\n    <b>非价格动作 → 不参与仲裁，照常执行</b>（它们不与任何价格表冲突）</p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 9-11　表 D 两个组合包的拆分</caption>\n      <thead><tr><th>MPI 档</th><th>组合包内容</th><th>性质</th><th>是否参与表 O 仲裁</th><th>处理方式</th></tr></thead>\n      <tbody>\n        <tr>\n          <td rowspan=\"2\"><b>85–95</b><br>落后</td>\n          <td>降价 5%</td>\n          <td>价格动作</td>\n          <td><span class=\"pill pill-red\">参与</span></td>\n          <td>与表 A（3）/ 表 C（4）比较，只执行优先级最高的一条；表 D（6）最低，通常不执行</td>\n        </tr>\n        <tr>\n          <td>增加 OTA 广告投放</td>\n          <td>非价格动作</td>\n          <td><span class=\"pill pill-teal\">不参与</span></td>\n          <td><b>照常执行</b>，列入《今日动作清单》，写进台账备注第三段</td>\n        </tr>\n        <tr>\n          <td rowspan=\"3\"><b>&lt;85</b><br>严重落后</td>\n          <td>降价 10%</td>\n          <td>价格动作</td>\n          <td><span class=\"pill pill-red\">参与</span></td>\n          <td>同上；表 D 优先级最低，通常不执行</td>\n        </tr>\n        <tr>\n          <td>全员直销动员</td>\n          <td>非价格动作</td>\n          <td><span class=\"pill pill-teal\">不参与</span></td>\n          <td><b>照常执行</b>（启动 M08 第 12 节的直销提升动作）</td>\n        </tr>\n        <tr>\n          <td>48 小时复盘</td>\n          <td>非价格动作</td>\n          <td><span class=\"pill pill-teal\">不参与</span></td>\n          <td><b>照常执行</b>，48 小时后产出复盘记录，归档并与《调价台账》关联</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">「&gt;110 份额领先 → 优先提价（走表 C 提价分支）」这一档怎么执行</span>\n    <p>这一档<b>本身不给价格动作</b>，它是一个<b>导向</b>：告诉你「份额已经领先，可以往提价方向走」。<br>\n    具体的价格动作要去<b>表 C 找</b>。执行顺序：<br>\n    ① 查表 C 得到本档的 ARI 动作；<br>\n    ② 若表 C 的动作是提价（如「80–90 偏低 → 提 5%」「90–97 略低 + 预测 OCC≥80% → 提 3%」「&lt;80 严重偏低 → 提 8%」）→ 两表同向，执行表 C 的提价；<br>\n    ③ 若表 C 的动作是「维持」或「降价」→ <b>以表 C 为准</b>（表 C 优先级 4 &gt; 表 D 优先级 6），不提价。<br>\n    <b>典型误区：</b>看到 MPI 112 就直接提价 5%。<b>错。</b>若此时 ARI 已经是 108（103–110 略高），表 C 给的是「维持，观察 Pickup」，那么就不能提价——你已经比竞对贵了，再提会掉份额。</p>\n  </div>\n\n  <h2 id=\"s8\">八、★ 三角诊断法：MPI × ARI = RGI 的 8 种组合与处方</h2>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">三角诊断法怎么用：三个指数画成一个三角形</span>\n    <p><b>MPI 看量、ARI 看价、RGI 看钱。三者由恒等式 RGI = MPI × ARI ÷ 100 锁死，所以只要知道任意两个，第三个就确定了。</b><br>\n    诊断步骤固定两步：<br>\n    <b>第一步</b>：把 MPI 与 ARI 各归到自己的档位（表 D 五档 / 表 C 七档）；<br>\n    <b>第二步</b>：在下面的 8 种组合中找到对应的一格，读出诊断结论与处方。</p>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 9-12　三角诊断矩阵：8 种典型组合<span class=\"cap-note\">行 = MPI（份额），列 = ARI（价格），格内 = 组合名 / RGI 量级</span></caption>\n      <thead><tr><th>MPI ＼ ARI</th><th>严重偏低 &lt;80</th><th>偏低 80–90</th><th>略低 90–97</th><th>健康 97–103</th><th>略高 103–110</th><th>偏高 110–120</th><th>严重偏高 &gt;120</th></tr></thead>\n      <tbody>\n        <tr>\n          <th class=\"rowh\">&gt;110<br>份额领先</th>\n          <td>组合 2b<br>极度以价换量<br>RGI &lt;90</td>\n          <td class=\"up-cell\"><b>组合 2</b><br>以价换量<br>RGI ≈ 99</td>\n          <td>组合 6<br>份额稳·价略低<br>RGI ≈ 99</td>\n          <td>组合 5<br>稳态健康<br>RGI ≈ 104</td>\n          <td>组合 1<br>量价双优<br>RGI ≈ 121</td>\n          <td>组合 8<br>溢价透支风险<br>RGI ≈ 130</td>\n          <td>组合 8b<br>高价孤峰<br>RGI &gt;140</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">100–110<br>健康</th>\n          <td>组合 4<br>双输（价崩）<br>RGI &lt;85</td>\n          <td>组合 4<br>双输<br>RGI ≈ 85</td>\n          <td>组合 6<br>份额稳·价略低<br>RGI ≈ 98</td>\n          <td><b>组合 5</b><br>稳态健康<br>RGI ≈ 104</td>\n          <td>组合 1<br>量价双优<br>RGI ≈ 111</td>\n          <td>组合 3<br>价高量失<br>RGI ≈ 115</td>\n          <td>组合 8<br>溢价透支风险<br>RGI &gt;125</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">95–100<br>略弱</th>\n          <td>组合 4<br>双输<br>RGI &lt;80</td>\n          <td>组合 4<br>双输<br>RGI ≈ 82</td>\n          <td>组合 7<br>曝光不足<br>RGI ≈ 93</td>\n          <td><b>组合 7</b><br>曝光不足<br>RGI ≈ 97</td>\n          <td>组合 3<br>价高量失<br>RGI ≈ 101</td>\n          <td>组合 3<br>价高量失<br>RGI ≈ 105</td>\n          <td>组合 8<br>溢价透支<br>RGI &gt;115</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">85–95<br>落后</th>\n          <td>组合 4<br>双输（重症）<br>RGI &lt;75</td>\n          <td>组合 4<br>双输（重症）<br>RGI ≈ 78</td>\n          <td>组合 4<br>双输<br>RGI ≈ 86</td>\n          <td>组合 7<br>曝光不足<br>RGI ≈ 91</td>\n          <td><b>组合 3</b><br>价高量失<br>RGI ≈ 96</td>\n          <td>组合 3<br>价高量失<br>RGI ≈ 100</td>\n          <td>组合 3b<br>价高量失（重症）<br>RGI &gt;105</td>\n        </tr>\n        <tr>\n          <th class=\"rowh\">&lt;85<br>严重落后</th>\n          <td>组合 4b<br>全面崩塌<br>RGI &lt;68</td>\n          <td><b>组合 4</b><br>双输（危重）<br>RGI ≈ 72</td>\n          <td>组合 4<br>双输（危重）<br>RGI ≈ 77</td>\n          <td>组合 4b<br>全面崩塌<br>RGI ≈ 82</td>\n          <td>组合 3<br>价高量失<br>RGI ≈ 87</td>\n          <td>组合 3b<br>价高量失（危重）<br>RGI ≈ 95</td>\n          <td>组合 3b<br>价高量失（危重）<br>RGI &gt;100</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>8.1 四种基础组合（重点展开 · 各配云璟实例）</h3>\n\n  <\!-- 组合 1 -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">①</span>组合 1 · 高 MPI + 高 ARI = 高 RGI「量价双优」<span class=\"pill pill-teal\">最理想</span></div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">特征</div><div class=\"kv-v\">份额领先（MPI &gt;110）且卖得比竞对贵（ARI 103–120）。<b>量价两头都赢。</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">云璟实例</div><div class=\"kv-v\">目标日 9 月 20 日（周六，云栖大会次日，D2 高涨日）：<br>本店预测 OCC 94.0%、SUP BAR ¥980；组合加权 OCC 83.9%、加权 ADR ¥907.4<br>MPI = 94.0 ÷ 83.9 × 100 = <b>112.0</b>（&gt;110 份额领先）<br>ARI = 980 ÷ 907.4 × 100 = <b>108.0</b>（103–110 略高）<br>RGI = 112.0 × 108.0 ÷ 100 = <b>121.0</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 C 判定</div><div class=\"kv-v\">ARI 108.0 落「103–110 略高」→ 动作 = <b>维持，观察 Pickup</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 D 判定</div><div class=\"kv-v\">MPI 112.0 落「&gt;110 份额领先」→ 动作 = <b>优先提价（走表 C 提价分支）</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">处方</div><div class=\"kv-v\">按表 O：表 C（优先级 4）&gt; 表 D（6）→ <b>执行表 C 的「维持」，不提价</b>。表 D 的「优先提价」只是导向，且表 C 本档动作是维持，<b>不执行提价</b>。<br>① 维持当前价格，<b>每日盯 Pickup</b>（表 C 本档原文要求）；<br>② 把高 ARI 的收益留在低成本渠道——按 M08 表 H「≥95% 或 90–95%」档压减高成本渠道（OTA 国际、批发商），把库存导向直销；<br>③ 若 Pickup 连续 3 天领先 &gt;10%，回到表 A 走提价分支（表 A 优先级 3 &gt; 表 C）。</div></div>\n    </div>\n  </div>\n\n  <\!-- 组合 2 -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">②</span>组合 2 · 高 MPI + 低 ARI = 中 RGI「以价换量」<span class=\"pill pill-amber\">钱留在桌上</span></div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">特征</div><div class=\"kv-v\">份额领先（MPI &gt;110）但卖得比竞对便宜（ARI 80–97）。<b>你靠低价买来了份额，RGI 却没赢。</b>这是最典型、也最容易被误读为「经营良好」的组合——因为 OCC 好看。</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">云璟实例</div><div class=\"kv-v\">目标日 11 月 12 日（周四，D3 平峰日）：<br>本店预测 OCC 82.4%、SUP BAR ¥620；组合加权 OCC 73.6%、加权 ADR ¥703.1<br>MPI = 82.4 ÷ 73.6 × 100 = <b>112.0</b>（&gt;110 份额领先）<br>ARI = 620 ÷ 703.1 × 100 = <b>88.2</b>（80–90 偏低）<br>RGI = 112.0 × 88.2 ÷ 100 = <b>98.8</b>（&lt;100，<b>输给组合</b>）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 C 判定</div><div class=\"kv-v\">ARI 88.2 落「80–90 偏低」→ 动作 = <b>提 5%</b>（本档无前置条件，直接提）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 D 判定</div><div class=\"kv-v\">MPI 112.0 落「&gt;110 份额领先」→ 动作 = <b>优先提价（走表 C 提价分支）</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">处方</div><div class=\"kv-v\"><b>两表同向（都指向提价）→ 执行表 C 的提 5%，不叠加。</b><br>新价 = 620 × 1.05 = <b>¥651</b>；提价后 ARI = 651 ÷ 703.1 × 100 = <b>92.6</b>，从「80–90 偏低」改善到「90–97 略低」。<br>① 执行表 C 提 5%（触发表编号填「表 C」）；<br>② 表 D 的「优先提价」是导向而非独立动作，<b>不额外提价</b>；<br>③ <b>测算提价后的份额容忍度</b>：若提价后 MPI 从 112 跌破 100，说明份额是靠低价撑的，需回退并改用非价格手段（M08 直销提升动作）；<br>④ 7 天内盯 Pickup：若 Pickup 由领先转为落后，立即复盘。</div></div>\n    </div>\n    <div class=\"callout callout-do\">\n      <span class=\"co-t\">本组合的判断口诀</span>\n      <p><b>「份额已经领先了，就别再便宜卖了。」</b>MPI &gt;110 意味着客人在没有价格优势的情况下仍然选你（可能是位置、产品、口碑），这正是提价的窗口期。<br>\n      <b>反过来验证：</b>如果不提价会怎样？按当前结构，一年 116,800 个可售房晚、OCC 82.4%、ADR ¥620 对应 RevPAR ¥511，提 5% 后 RevPAR = ¥536.6，<b>年增收约 ¥299 万</b>（假设份额不变）。即使提价导致 OCC 跌 3 个百分点（到 79.4%），RevPAR = 0.794 × 651 = ¥516.9，<b>仍高于提价前的 ¥511</b>。<b>所以本组合的容错空间是 OCC 跌不超过约 3.3 个百分点。</b></p>\n    </div>\n  </div>\n\n  <\!-- 组合 3 -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">③</span>组合 3 · 低 MPI + 高 ARI = 中 RGI「价高量失」<span class=\"pill pill-red\">定价超出市场承受</span></div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">特征</div><div class=\"kv-v\">份额落后（MPI &lt;95）却卖得比竞对贵（ARI &gt;110）。<b>需求被竞对吸走了，你还在涨价。</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">云璟实例</div><div class=\"kv-v\">目标日 7 月 8 日（周一，D4 低谷日）：<br>本店预测 OCC 48.0%、SUP BAR ¥690；组合加权 OCC 55.8%、加权 ADR ¥616.1<br>MPI = 48.0 ÷ 55.8 × 100 = <b>86.0</b>（85–95 落后）<br>ARI = 690 ÷ 616.1 × 100 = <b>112.0</b>（110–120 偏高）<br>RGI = 86.0 × 112.0 ÷ 100 = <b>96.3</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 C 判定</div><div class=\"kv-v\">ARI 112.0 落「110–120 偏高」→ 判据是 RGI：<b>RGI 96.3 &lt; 100 → 降 5%</b>（若 RGI ≥100 则维持）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 D 判定</div><div class=\"kv-v\">MPI 86.0 落「85–95 落后」→ 动作 = <b>降价 5%</b> 或 <b>增加 OTA 广告投放</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">处方</div><div class=\"kv-v\">按表 O：表 C（4）&gt; 表 D（6）→ <b>价格动作执行表 C 的降 5%，表 D 的降价 5% 不叠加</b>。<br>新价 = 690 × 0.95 = <b>¥655.5 → ¥656</b>；降价后 ARI = 656 ÷ 616.1 × 100 = <b>106.4</b>，仍偏高但已进入「103–110 略高」。<br>① 执行表 C 降 5%；<br>② <b>表 D 的「增加 OTA 广告投放」是非价格动作，照常执行</b>——本组合的病根是「客人看到你的价格后不选你」，投放能增加曝光；<br>③ 同时跑 M08 第 11 节的 OTA 排名优化清单 10 项（点评分 ≥4.6、图片 ≥30 张、响应时间 &lt;5 分钟等）；<br>④ 7 天内盯 MPI：若仍 &lt;95，回到表 C 再看是否需要第二次降价（<b>注意表 C 约束 2：每周不超过 2 次</b>）。</div></div>\n    </div>\n    <div class=\"callout callout-warn\">\n      <span class=\"co-t\">本组合的关键：表 C「110–120 偏高」这一档的判据是 RGI，不是 MPI</span>\n      <p>表 C 原文：「110–120 偏高 → <b>RGI&lt;100 → 降 5%；RGI≥100 → 维持</b>」。<br>\n      这是表 C 七档里<b>唯一一档用 RGI 做判据</b>的（另有一档「&gt;120」用 MPI 做判据）。<br>\n      <b>为什么这一档用 RGI？</b>因为 ARI 110–120 属于「贵但还没贵到离谱」，此时要不要降，取决于「贵」有没有被「量」抵消掉——这正是 RGI 的定义。RGI ≥100 说明虽然贵、但份额够大，总收入已经赢了，不必降。<br>\n      <b>本例 RGI 96.3 &lt; 100 → 降 5%。</b>若本例 MPI 是 92.0，则 RGI = 92 × 112 ÷ 100 = 103.0 ≥100 → <b>维持，不降</b>。<br>\n      <b>这是表 C 里最容易记错的一格，必须连同判据一起背。</b></p>\n    </div>\n  </div>\n\n  <\!-- 组合 4 -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">④</span>组合 4 · 低 MPI + 低 ARI = 低 RGI「双输」<span class=\"pill pill-red\">最危险</span></div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">特征</div><div class=\"kv-v\">份额落后（MPI &lt;95）且卖得比竞对便宜（ARI &lt;97）。<b>既不便宜也没人住——这是全部 8 种组合里最危险的一种。</b><br><b>它说明问题不在价格上。</b>你已经比竞对便宜了，还是抢不到客人，说明病根在<b>产品、曝光、口碑或渠道</b>，降价只会让情况更糟。</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">云璟实例</div><div class=\"kv-v\">目标日 1 月 14 日（周二，D4 低谷日，1 月淡季）：<br>本店预测 OCC 42.0%、SUP BAR ¥560；组合加权 OCC 53.8%、加权 ADR ¥682.9<br>MPI = 42.0 ÷ 53.8 × 100 = <b>78.1</b>（&lt;85 严重落后）<br>ARI = 560 ÷ 682.9 × 100 = <b>82.0</b>（80–90 偏低）<br>RGI = 78.1 × 82.0 ÷ 100 = <b>64.0</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 C 判定</div><div class=\"kv-v\">ARI 82.0 落「80–90 偏低」→ 动作 = <b>提 5%</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">表 D 判定</div><div class=\"kv-v\">MPI 78.1 落「&lt;85 严重落后」→ 启动《应急方案 L2-E1》：<b>降价 10%</b> + 全员直销动员 + 48 小时复盘</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\"><span class=\"pill pill-red\">核心困境</span></div><div class=\"kv-v\"><b>两表方向完全相反：表 C 要提 5%，表 D 要降 10%。</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">处方</div><div class=\"kv-v\">按表 O：表 C（4）&gt; 表 D（6）→ <b>价格动作执行表 C 的提 5%，表 D 的降价 10% 不执行</b>。<br>新价 = 560 × 1.05 = <b>¥588</b>。<br>① 执行表 C 提 5%（触发表编号「表 C」）；<br>② <b>表 D 组合包中的「全员直销动员」与「48 小时复盘」是非价格动作，照常执行</b>；<br>③ <b>★ 必须加设保护条款（本组合专属）：</b>在台账备注写明「表 C 与表 D 反向冲突，本组合属『双输』（MPI 78.1 / ARI 82.0 / RGI 64.0）。提价后 7 天内若 MPI 继续下滑 &gt;5 个百分点，立即回退至 ¥560 并改走表 D 的降价 10%」；<br>④ <b>同步启动非价格诊断（本组合的重点不在价格）</b>：跑 M08 第 11 节的 OTA 排名优化 10 项，重点查点评分（≥4.6）、挂牌完整性、图片数量（≥30 张）、响应时间（&lt;5 分钟）；<br>⑤ 核查《法典》表 L「竞对新开业」分支：3 km 内是否有新开同档酒店抢走了客源？若有，按表 L 走差异化策略，不盲目跟价。</div></div>\n    </div>\n    <div class=\"callout callout-danger\">\n      <span class=\"co-t\">本组合最容易犯的错：看到 MPI 低就降价</span>\n      <p>直觉告诉你「没人来住，那就降价」。但<b>表 C 明确禁止这么做</b>——你的 ARI 已经 82.0（偏低），再降就是 70 出头（严重偏低），而表 C 对「&lt;80 严重偏低」给的动作是「<b>提 8%</b>，并核查房型配置与含早策略」。<br>\n      <b>《法典》在这个位置的态度非常明确：价格已经低于市场了，还抢不到客人，说明不是价格问题，降价只会让 ARI 更糟、RGI 更低。</b><br>\n      <b>正确的用力方向是：曝光（OTA 排名）、产品（点评分、图片）、渠道（是否漏挂）、客源（是否有新竞对）。</b></p>\n    </div>\n  </div>\n\n  <h3>8.2 四种扩展组合</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 9-13　四种扩展组合与处方</caption>\n      <thead><tr><th>组合</th><th>MPI × ARI</th><th>RGI</th><th>云璟实例</th><th>表 C / 表 D 判定</th><th>处方</th></tr></thead>\n      <tbody>\n        <tr>\n          <td><b>⑤ 稳态健康</b></td>\n          <td>104.0（100–110）<br>× 100.0（97–103）</td>\n          <td class=\"num\"><b>104.0</b></td>\n          <td>本店 OCC 76.5% / ADR ¥691.7；组合 OCC 73.6% / ADR ¥691.7</td>\n          <td>表 C「健康 → 维持」；表 D「健康 → 维持」</td>\n          <td><b>全部维持，不动价格。</b>按表 O 第二条铁律顺延到表 A；若表 A 也是维持，则本日无价格动作，台账写「维持」。只做每日盯 Pickup 与常规巡检</td>\n        </tr>\n        <tr>\n          <td><b>⑥ 份额稳·价略低</b></td>\n          <td>104.0（100–110）<br>× 95.0（90–97）</td>\n          <td class=\"num\"><b>98.8</b></td>\n          <td>本店 OCC 76.5% / ADR ¥657.1；组合 OCC 73.6% / ADR ¥691.7</td>\n          <td>表 C「90–97 略低 → 预测 OCC≥80% 提 3%；否则维持」；<b>本例预测 OCC 76.5% &lt; 80% → 维持</b></td>\n          <td><b>维持，不提价。</b><span class=\"pill pill-amber\">这是表 C 最常被读错的一格</span>——很多人看到「略低」直接提 3%，忽略了「预测 OCC ≥80%」这个前置条件。<b>份额虽健康但没到 >110，提价的风险大于收益</b></td>\n        </tr>\n        <tr>\n          <td><b>⑦ 曝光不足</b></td>\n          <td>97.0（95–100）<br>× 100.0（97–103）</td>\n          <td class=\"num\"><b>97.0</b></td>\n          <td>本店 OCC 71.4% / ADR ¥691.7；组合 OCC 73.6% / ADR ¥691.7</td>\n          <td>表 C「健康 → 维持」；表 D「95–100 略弱 → 检查 OTA 曝光/挂牌/点评分，补挂牌」</td>\n          <td><b>不动价格。</b>价格（ARI 100）没问题，问题是客人看不到你。按表 O，表 C 维持 → 顺延执行表 D 的非价格动作：跑 M08 第 11 节的 OTA 排名优化 10 项，重点是<b>补挂牌</b>（检查是否有渠道漏挂、房型投放是否 ≥5 个）</td>\n        </tr>\n        <tr>\n          <td><b>⑧ 溢价透支</b></td>\n          <td>112.0（&gt;110）<br>× 125.0（&gt;120）</td>\n          <td class=\"num\"><b>140.0</b></td>\n          <td>10 月 2 日（D1 峰值日）：本店 OCC 95.9% / ADR ¥1,314；组合 OCC 85.6% / ADR ¥1,051.2</td>\n          <td>表 C「&gt;120 严重偏高 → MPI&lt;95 降 8%；<b>MPI≥95 → 维持并每日盯 Pickup</b>」；表 D「&gt;110 份额领先 → 优先提价（走表 C 提价分支）」</td>\n          <td><b>维持，不提价，每日盯 Pickup。</b>本例 MPI 112 ≥95 → 走「维持」分支。表 D 的「优先提价」让位于表 C（4 &gt; 6）。<b>RGI 140 看着漂亮，但 ARI 125 已是严重偏高，Pickup 一旦掉头会崩得比竞对快</b></td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h2 id=\"s9\">九、★ 《法典》表 O · 决策优先级与冲突仲裁表（完整内嵌）</h2>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption><span class=\"badge-codex\">表 O</span>　决策优先级与冲突仲裁表<span class=\"cap-note\">当多张表给出不同动作时，<b>严格按以下优先级执行</b>。《SPEC》第四章原文</span></caption>\n      <thead><tr><th class=\"num\">优先级</th><th>表</th><th>场景</th></tr></thead>\n      <tbody>\n        <tr><td class=\"num\"><b>1</b>（最高）</td><td><b>表 L 应急</b></td><td>异常事件，覆盖一切</td></tr>\n        <tr><td class=\"num\"><b>2</b></td><td><b>表 B 库存</b></td><td>库存安全（超售 / 关房）优先于价格</td></tr>\n        <tr><td class=\"num\"><b>3</b></td><td><b>表 A 价格</b></td><td>常规价格调整</td></tr>\n        <tr><td class=\"num\"><b>4</b></td><td><b>表 C ARI</b></td><td>竞争定位微调</td></tr>\n        <tr><td class=\"num\"><b>5</b></td><td><b>表 H 渠道</b></td><td>渠道开关</td></tr>\n        <tr><td class=\"num\"><b>6</b>（最低）</td><td><b>表 D MPI</b></td><td>份额诊断，多为分析而非动作</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>9.1 三条冲突处理铁律（原文）</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-codex\">\n      <caption><span class=\"badge-codex\">表 O</span>　冲突处理铁律<span class=\"cap-note\">《SPEC》第四章原文，三条同时生效</span></caption>\n      <thead><tr><th class=\"num\">#</th><th>铁律</th><th>解读</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"num\">1</td>\n          <td>同日只执行<b>优先级最高</b>的那一条动作，其余记录在《观察清单》</td>\n          <td><b>「只执行一条」指的是同一类动作。</b>不同类的动作（价格 / 库存 / 渠道）互不冲突，并行执行。见下方仲裁五步法第 3 步</td>\n        </tr>\n        <tr>\n          <td class=\"num\">2</td>\n          <td>若最高优先级动作为「<b>维持</b>」，则<b>顺延执行下一优先级</b></td>\n          <td>「维持」不是「有动作」，它是「没有动作」。所以最高优先级给维持时，要看下一优先级有没有动作</td>\n        </tr>\n        <tr>\n          <td class=\"num\">3</td>\n          <td>所有冲突与取舍<b>必须写入《调价台账》备注栏</b></td>\n          <td>没有写进备注的仲裁，等于没有发生。30 天后复盘时会完全看不出当时为什么这么选</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-gold\">\n    <span class=\"co-t\">记忆口诀</span>\n    <p><b>「应急第一、库存第二、价格第三、定位第四、渠道第五、诊断第六。」</b><br>\n    简化版：<b>急 &gt; 存 &gt; 价 &gt; 位 &gt; 渠 &gt; 诊</b>。<br>\n    对应的表：<b>表 L &gt; 表 B &gt; 表 A &gt; 表 C &gt; 表 H &gt; 表 D</b>。</p>\n  </div>\n\n  <h2 id=\"s10\">十、表 O 的三条铁律与仲裁五步法</h2>\n\n  <h3>10.1 仲裁五步法（每次遇到多表冲突都按这五步走）</h3>\n\n  <div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\">\n    <h4>列全：把所有查过的表与各自的动作列出来</h4>\n    <p>至少列出：表 A（价格）、表 B（库存）、表 C（ARI）、表 D（MPI）、表 H（渠道）；另核查表 L（异常事件）是否触发。<br>\n    <b>不许只列出「有动作」的表。</b>给「维持」的表也要列——因为铁律 2 要靠它们才能生效。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\">\n    <h4>查表 L：先看有没有异常事件</h4>\n    <p>表 L 是优先级 1，<b>覆盖一切</b>。若表 L 触发（需求暴跌 48h Pickup 落后 &gt;40%、需求暴涨 24h Pickup 领先 &gt;60%、竞对新开业、系统故障、超售过度），<b>立即按表 L 执行，其余全部让位</b>。<br>\n    <b>这一步必须在最前面做</b>——如果先按表 A 调了价，再发现表 L 触发，等于白做一遍且可能做反了方向。</p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\">\n    "}, {"id": "p3", "name": "分类：把动作分成「价格类 / 库存类 / 渠道类 / 非", "min": 8, "desc": "", "html": "<h4>分类：把动作分成「价格类 / 库存类 / 渠道类 / 非价格动作」四类</h4>\n    <div class=\"tbl-wrap\" style=\"margin-top:8px\">\n      <table class=\"tbl\">\n        <caption>表 9-14　动作分类与仲裁规则</caption>\n        <thead><tr><th>类别</th><th>包含哪些动作</th><th>是否参与仲裁</th><th>规则</th></tr></thead>\n        <tbody>\n          <tr><td><b>价格类</b></td><td>表 A 的调价、表 C 的调价、表 D 的降价</td><td><span class=\"pill pill-red\">参与</span></td><td>优先级 表 A(3) &gt; 表 C(4) &gt; 表 D(6)，<b>只执行最高的一条，不叠加</b></td></tr>\n          <tr><td><b>库存类</b></td><td>表 B 的 MinLOS / CTA / Stop Sell / 超售、表 E 的超售</td><td><span class=\"pill pill-teal\">不参与</span></td><td>表 B 优先级 2，<b>全部执行</b>（四列同时配置），不与价格类冲突</td></tr>\n          <tr><td><b>渠道类</b></td><td>表 H 的渠道开关</td><td><span class=\"pill pill-teal\">不参与</span></td><td>表 H 优先级 5，<b>全部执行</b>；但与表 B 的「低价渠道 Stop Sell」重叠时以表 B 为准</td></tr>\n          <tr><td><b>非价格动作</b></td><td>表 D 的全员直销动员 / 48 小时复盘 / 增加 OTA 投放；表 L 的复盘报告等</td><td><span class=\"pill pill-teal\">不参与</span></td><td><b>照常执行</b>，不与任何价格表冲突</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <p style=\"margin-top:8px\"><b>这是本学院对《法典》表 O 的执行解释：仲裁只在同一类动作之间进行；不同类的动作并行执行，全部记入台账备注栏。</b></p>\n  </div></div>\n\n  <div class=\"step\"><div class=\"step-num\">4</div><div class=\"step-body\">\n    "}, {"id": "p4", "name": "定价格动作：按 3 &gt; 4 &gt; 6 的顺序，", "min": 8, "
