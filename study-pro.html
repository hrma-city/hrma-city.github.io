</tr>\n        <tr><td>2026-09-21</td><td class=\"num\">1</td><td class=\"num\">221</td><td class=\"num\">218</td><td class=\"num\">+3</td><td class=\"num\">+1.4%</td><td>持平 ±3%</td></tr>\n        <tr><td>2026-09-23</td><td class=\"num\">3</td><td class=\"num\">196</td><td class=\"num\">190</td><td class=\"num\">+6</td><td class=\"num\">+3.2%</td><td>领先 3–10%</td></tr>\n        <tr><td>2026-09-27</td><td class=\"num\">7</td><td class=\"num\">172</td><td class=\"num\">168</td><td class=\"num\">+4</td><td class=\"num\">+2.4%</td><td>持平 ±3%</td></tr>\n        <tr><td>2026-10-04</td><td class=\"num\">14</td><td class=\"num\">142</td><td class=\"num\">140</td><td class=\"num\">+2</td><td class=\"num\">+1.4%</td><td>持平 ±3%</td></tr>\n        <tr><td>2026-10-11</td><td class=\"num\">21</td><td class=\"num\">110</td><td class=\"num\">113</td><td class=\"num\">−3</td><td class=\"num\"><span class=\"down\">−2.7%</span></td><td>持平 ±3%</td></tr>\n        <tr><td>2026-10-20</td><td class=\"num\">30</td><td class=\"num\">96</td><td class=\"num\">78</td><td class=\"num\">+18</td><td class=\"num\"><span class=\"up\">+23.1%</span></td><td>领先 &gt;10%</td></tr>\n        <tr><td>2026-11-04</td><td class=\"num\">45</td><td class=\"num\">42</td><td class=\"num\">41</td><td class=\"num\">+1</td><td class=\"num\">+2.4%</td><td>持平 ±3%</td></tr>\n        <tr><td>2026-11-19</td><td class=\"num\">60</td><td class=\"num\">24</td><td class=\"num\">23</td><td class=\"num\">+1</td><td class=\"num\">+4.3%</td><td>领先 3–10%</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">公式（《法典》表 A 输入 2 · 逐字引用）</span>\n    Pickup 偏差 =（当前在手房晚 − 去年同期同一提前窗口在手房晚）÷ 去年同期在手房晚 × 100%<br>\n    例（10-20）：(96 − 78) ÷ 78 × 100% → <span class=\"f-out\">+23.1%</span>\n  </div>\n\n  <\!-- ================= 三 ================= -->\n  <h2 id=\"s3\">三、《Pickup 追踪表》的三种读法</h2>\n\n  <p>同一张表，三种读法，回答三个不同的问题。学员必须三种都会，且能说出每种读法回答什么问题。</p>\n\n  "}, {"id": "p6", "name": "1 对角读（左下 → 右上）：今天的整体快照", "min": 8, "desc": "", "html": "<h3>3.1 对角读（左下 → 右上）：今天的整体快照</h3>\n\n  <p><b>回答的问题</b>：此刻，未来每一天各自收了多少？哪一天落后？</p>\n\n  <p>沿\"目标日期 − 今天 = 提前天数\"这条阶梯对角线，从右下角（0 天 × 09-20）向左上角（60 天 × 11-19）读一遍，得到今天的完整快照：240 / 221 / 196 / 172 / 142 / 110 / 96 / 42 / 24。</p>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">对角读的动作规则</span>\n    <p>读完后只做一件事：把每个格子换算成<b>在手健康度</b>，凡健康度 &lt; 100% 的日子，按落后幅度查《法典》表 I 对应窗口档，触发相应动作。</p>\n    <div class=\"formula\" style=\"margin:10px 0 0\">\n      在手健康度 = 当前在手 ÷（去年同期实际房晚 × 该提前窗口基准累计占比）× 100%\n    </div>\n  </div>\n\n  "}, {"id": "p7", "name": "2 竖读（同一列从上到下）：单日的预订曲线", "min": 8, "desc": "", "html": "<h3>3.2 竖读（同一列从上到下）：单日的预订曲线</h3>\n\n  <p><b>回答的问题</b>：这一天收得<b>快不快</b>？剩下的日子还能不能补上？</p>\n\n  <p>以 09-20 这一列为例，从上到下读：29 → 48 → 82 → 110 → 139 → 175 → 206 → 226 → 240。这就是 09-20 这一天的<b>预订曲线（Booking Curve）</b>。曲线的斜率就是 Pickup 速度：</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-3　目标日 2026-09-20 的预订曲线与区间 Pickup 速度</caption>\n      <thead><tr><th>提前天数</th><th class=\"num\">累计在手</th><th class=\"num\">区间 Pickup</th><th class=\"num\">区间天数</th><th class=\"num\">日均 Pickup</th><th>曲线判读</th></tr></thead>\n      <tbody>\n        <tr><td>提前 60 天</td><td class=\"num\">29</td><td class=\"num\">—</td><td class=\"num\">—</td><td class=\"num\">—</td><td>起点</td></tr>\n        <tr><td>提前 45 天</td><td class=\"num\">48</td><td class=\"num\">+19</td><td class=\"num\">15</td><td class=\"num\">1.27</td><td>长线慢速爬升</td></tr>\n        <tr><td>提前 30 天</td><td class=\"num\">82</td><td class=\"num\">+34</td><td class=\"num\">15</td><td class=\"num\">2.27</td><td>进入月度放量</td></tr>\n        <tr><td>提前 21 天</td><td class=\"num\">110</td><td class=\"num\">+28</td><td class=\"num\">9</td><td class=\"num\">3.11</td><td>加速</td></tr>\n        <tr><td>提前 14 天</td><td class=\"num\">139</td><td class=\"num\">+29</td><td class=\"num\">7</td><td class=\"num\">4.14</td><td>加速</td></tr>\n        <tr><td>提前 7 天</td><td class=\"num\">175</td><td class=\"num\">+36</td><td class=\"num\">7</td><td class=\"num\">5.14</td><td>进入高速区</td></tr>\n        <tr><td>提前 3 天</td><td class=\"num\">206</td><td class=\"num\">+31</td><td class=\"num\">4</td><td class=\"num\">7.75</td><td>最后一刻冲刺</td></tr>\n        <tr><td>提前 1 天</td><td class=\"num\">226</td><td class=\"num\">+20</td><td class=\"num\">2</td><td class=\"num\">10.00</td><td>最后一刻冲刺</td></tr>\n        <tr><td>当天 0 天</td><td class=\"num\">240</td><td class=\"num\">+14</td><td class=\"num\">1</td><td class=\"num\">14.00</td><td>上门散客补齐</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">竖读的三条判读规则</span>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>斜率判读</b>：把当天所处区间的日均 Pickup，与去年同期同一区间的日均 Pickup 相除，商 &lt; 0.9 判\"收得慢\"，商 &gt; 1.1 判\"收得快\"，0.9–1.1 判\"正常\"。</li>\n      <li><b>后段空转判读</b>：提前 3 天 → 1 天的区间日均 Pickup 若 &lt; 提前 7 天 → 3 天的区间日均 Pickup，说明最后一刻需求枯竭，立即查《法典》表 I 0–3 天档（OCC&lt;70% 触发「今日特惠」）。</li>\n      <li><b>前置透支判读</b>：提前 30 天在手已超过\"去年同期实际 × 34%\"，说明长线需求前移，其后段大概率减速，不得按早期增速线性外推。</li>\n    </ul>\n  </div>\n\n  <h3>3.3 横读（同一行从左到右）：同窗口的未来横截面</h3>\n\n  <p><b>回答的问题</b>：在<b>同样的提前期</b>下，未来连续各日哪天是\"凹陷日\"（收得明显比邻日差）？</p>\n\n  <p>以\"提前 30 天\"这一行为例，从左到右读：82 / 80 / 78 / 80 / 83 / 82 / 96 / — / —。09-23 的 78 是这一段的最低点，10-20 的 96 是最高点。凹陷日要单独标出来，因为它往往不是\"需求真的差\"，而是三类可修问题：</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-4　横读发现\"凹陷日\"后的四类归因与对应动作</caption>\n      <thead><tr><th>归因</th><th>验证方法（一步到位）</th><th>动作</th></tr></thead>\n      <tbody>\n        <tr><td>该日有大型团队／会议占用未释放</td><td>查宴会预订本：当日宴会厅是否已被占满</td><td>走《法典》表 K 会议／宴会综合收益联动表，重新评估是否释放客房</td></tr>\n        <tr><td>该日被误设了限制条件（MinLOS／CTA）</td><td>查价格日历中该日的限制条件设置</td><td>按《法典》表 B 该 OCC 档重新核对，撤销不合规限制</td></tr>\n        <tr><td>该日渠道被误关（Stop Sell）</td><td>查 6 个渠道的开关状态</td><td>按《法典》表 H 该 OCC 档恢复</td></tr>\n        <tr><td>该日确实需求弱（无以上三类）</td><td>查需求日历：是否为节后 3–5 天、极端天气日</td><td>按本模块第六节预测三步法重算，走《法典》表 A 调价</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>3.4 三种读法的作业顺序（固定，不得颠倒）</h3>\n\n  <div class=\"flow\">\n    <div class=\"flow-item\"><div class=\"fi-t\">① 对角读</div><div class=\"fi-d\">07:50 取数后先读对角线，圈出所有健康度 &lt;100% 的日子</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">② 竖读</div><div class=\"fi-d\">只针对①圈出的日子竖读，判断是\"收得慢\"还是\"最后一刻枯竭\"</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">③ 横读</div><div class=\"fi-d\">只针对②判为异常的日子横读邻日，做四类归因</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">④ 查表</div><div class=\"fi-d\">按表 I 定监控动作，按表 A 定价格动作，写入《调价台账》</div></div>\n  </div>\n\n  <\!-- ================= 四 ================= -->\n  <h2 id=\"s4\">四、《法典》表 I：预订窗口分档监控表（完整内嵌）</h2>\n\n  <div class=\"callout callout-gold\">\n    <span class=\"co-t\">本模块的背诵表</span>\n    <p>《法典》表 I 是本模块的<b>唯一必背判定表</b>。当堂默写，错一格不得进入下一课。引用时写「《法典》表 I」。完整版同时在 <a href=\"../codex.html\">《收益管理操作法典》</a> 中可检索、可打印。</p>\n  </div>\n\n  <div class=\"codex-block\" data-codex-block data-cat=\"forecast\">\n    <div class=\"codex-head\">\n      <span class=\"badge-codex\">表 I</span>\n      <h3>预订窗口分档监控表</h3>\n      <span class=\"pill pill-navy\">监控节奏</span>\n    </div>\n    <p class=\"codex-desc\">输入：目标日的预订窗口（入住日 − 今天）。输出：监控频率、关注指标、落后触发阈值、触发动作。六档覆盖 0 天到 60 天以上。</p>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <thead>\n          <tr><th>窗口</th><th>监控频率</th><th>关注指标</th><th>落后触发阈值</th><th>触发动作</th></tr>\n        </thead>\n        <tbody>\n          <tr><th class=\"rowh\">0–3 天</th><td>每日 2 次（10:00 / 17:00）</td><td>当日 Pickup、临时取消</td><td>OCC&lt;70%</td><td>上「今日特惠」尾房产品</td></tr>\n          <tr><th class=\"rowh\">4–7 天</th><td>每日 1 次</td><td>周内进度</td><td>落后 10%</td><td>启动 48h 闪购</td></tr>\n          <tr><th class=\"rowh\">8–14 天</th><td>每日 1 次</td><td>双周在手</td><td>落后 15%</td><td>执行表 A 调价</td></tr>\n          <tr><th class=\"rowh\">15–30 天</th><td>每周 2 次</td><td>月度在手</td><td>落后 20%</td><td>策略复盘 + 销售动员</td></tr>\n          <tr><th class=\"rowh\">31–60 天</th><td>每周 1 次</td><td>长线在手</td><td>落后 25%</td><td>启动协议客户拜访计划</td></tr>\n          <tr><th class=\"rowh\">&gt;60 天</th><td>每月 1 次</td><td>大型团队/会议在手</td><td>落后 30%</td><td>上报 L3，调整年度策略</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <div class=\"codex-meta\">配套：《法典》表 M（每日收益操作流水线）规定 07:50 抓取未来 30 天在手 + Pickup、17:00 做 0–3 天窗口二次巡检——这两个时点即表 I 第一档「每日 2 次」的落地时点。跨模块引用：落在 8–14 天档且触发时，动作直接转《法典》表 A。</div>\n  </div>\n\n  <h3>4.1 表 I 的三条执行细则</h3>\n\n  <div class=\"step\">\n    <div class=\"step-num\">1</div>\n    <div class=\"step-body\">\n      <h4>\"落后 X%\" 的分母是什么</h4>\n      <p>表 I 的\"落后 X%\"与《法典》表 A 的 Pickup 偏差<b>不是同一个数</b>，两者不可混用：</p>\n      <ul>\n        <li><b>表 A 的 Pickup 偏差</b>＝（当前在手 − 去年同期同一提前窗口在手）÷ 去年同期在手 × 100%。用于表 A 调价。</li>\n        <li><b>表 I 的落后幅度</b>＝（当前在手 − 去年同期同一提前窗口在手）÷ 去年同期在手 × 100%，取<b>绝对值方向与幅度</b>，与表 A 同源同口径。区别只在用法：表 I 是<b>监控触发器</b>（只判\"是否越线\"），表 A 是<b>决策矩阵</b>（判\"越到哪一格\"）。</li>\n      </ul>\n      <p>即：表 I 的落后 10% / 15% / 20% / 25% / 30% 五个阈值，与表 A 的\"落后 3–10%\"、\"落后 &gt;10%\"两档并列读，<b>两个数同时算，分别查两张表</b>。表 I 触发的是动作类型，表 A 触发的是价格幅度；两者同时命中时，按《法典》表 O 仲裁——表 A（优先级 3）高于表 I 的监控动作（表 I 不在表 O 的 6 级序列内，属常规监控，仅在表 A 结论为「维持」时才执行表 I 动作）。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">2</div>\n    <div class=\"step-body\">\n      <h4>0–3 天档的阈值是绝对 OCC，不是相对落后</h4>\n      <p>表 I 六档中，只有 0–3 天档用<b>绝对 OCC&lt;70%</b>，其余五档用<b>相对落后百分比</b>。原因：距离入住只剩 3 天时，\"比去年差多少\"已经不重要，重要的是\"今晚还剩多少房\"。所以这一档直接看 OCC，触发即上「今日特惠」尾房产品。学员在默写时最容易把这一格写成\"落后 X%\"，属重大错误。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">3</div>\n    <div class=\"step-body\">\n      <h4>监控频率是下限，不是上限</h4>\n      <p>表 I 写的\"每日 2 次\"\"每周 1 次\"是<b>最低频率</b>。触发《法典》表 L 异常事件（需求暴跌 48h Pickup 落后 &gt;40%、需求暴涨 24h Pickup 领先 &gt;60%）时，监控升级为每小时 1 次，直到事件解除。表 L 优先级为 1（最高），覆盖表 I。</p>\n    </div>\n  </div>\n\n  <h3>4.2 表 I 在云璟酒店的落地排期表</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-5　云璟酒店表 I 落地排期（与《法典》表 M 流水线对齐）</caption>\n      <thead><tr><th>时间</th><th>覆盖窗口档</th><th>动作</th><th>产出物</th><th>耗时上限</th></tr></thead>\n      <tbody>\n        <tr><td>07:50</td><td>31–60 天 / 15–30 天 / 8–14 天</td><td>抓未来 30 天在手 + Pickup，更新《Pickup 追踪表》对角线</td><td>Pickup 表更新</td><td>20 min</td></tr>\n        <tr><td>08:30</td><td>全部 6 档</td><td>逐日查《法典》表 A / B / C / H，得出动作清单</td><td>《今日动作清单》</td><td>40 min</td></tr>\n        <tr><td>10:00</td><td>0–3 天（第 1 次）</td><td>查当日 OCC，&lt;70% 则上「今日特惠」</td><td>尾房产品上架记录</td><td>10 min</td></tr>\n        <tr><td>17:00</td><td>0–3 天（第 2 次）</td><td>二次巡检，查临时取消与当日 Pickup</td><td>尾房动作</td><td>15 min</td></tr>\n        <tr><td>每周一</td><td>31–60 天</td><td>长线在手检查，落后 25% 启动协议客户拜访计划</td><td>《周度收益报告》</td><td>—</td></tr>\n        <tr><td>每月 1 日</td><td>&gt;60 天</td><td>大型团队／会议在手检查，落后 30% 上报 L3</td><td>《月度收益复盘报告》</td><td>—</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <\!-- ================= 五 ================= -->\n  <h2 id=\"s5\">五、《法典》表 A：每日价格调整判定表（本模块配套内嵌）</h2>\n\n  <p>预测算出来的两个数字——<b>预测 OCC</b> 和 <b>Pickup 偏差</b>——正是《法典》表 A 的两个输入。所以预测做完，调价动作是\"读\"出来的，不是\"想\"出来的。这是\"不猜、不算、不纠结\"三不原则的直接体现。</p>\n\n  <div class=\"codex-block\" data-codex-block data-cat=\"pricing forecast\">\n    <div class=\"codex-head\">\n      <span class=\"badge-codex\">表 A</span>\n      <h3>每日价格调整判定表（双因子矩阵）</h3>\n      <span class=\"pill pill-red\">L2 核心</span>\n    </div>\n    <p class=\"codex-desc\">\n      <b>输入 1</b>：目标日当前预测 OCC（在手 + 预测增量）<br>\n      <b>输入 2</b>：Pickup 偏差 =（当前在手房晚 − 去年同期同一提前窗口在手房晚）÷ 去年同期在手房晚 × 100%\n    </p>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl tbl-matrix\">\n        <thead>\n          <tr><th>预测 OCC ＼ Pickup 偏差</th><th>落后 &gt;10%</th><th>落后 3–10%</th><th>持平 ±3%</th><th>领先 3–10%</th><th>领先 &gt;10%</th></tr>\n        </thead>\n        <tbody>\n          <tr><th class=\"rowh\">≥95%</th><td class=\"keep\">维持</td><td class=\"up-cell\">+5%</td><td class=\"up-cell\">+10%</td><td class=\"up-cell\">+15%</td><td class=\"up-cell\">+20%</td></tr>\n          <tr><th class=\"rowh\">85–95%</th><td class=\"keep\">维持</td><td class=\"up-cell\">+3%</td><td class=\"up-cell\">+5%</td><td class=\"up-cell\">+10%</td><td class=\"up-cell\">+15%</td></tr>\n          <tr><th class=\"rowh\">70–85%</th><td class=\"down-cell\">−5%</td><td class=\"down-cell\">−3%</td><td class=\"keep\">维持</td><td class=\"up-cell\">+5%</td><td class=\"up-cell\">+8%</td></tr>\n          <tr><th class=\"rowh\">55–70%</th><td class=\"down-cell\">−10%</td><td class=\"down-cell\">−5%</td><td class=\"down-cell\">−3%</td><td class=\"keep\">维持</td><td class=\"up-cell\">+3%</td></tr>\n          <tr><th class=\"rowh\">40–55%</th><td class=\"down-cell\">−15%</td><td class=\"down-cell\">−10%</td><td class=\"down-cell\">−5%</td><td class=\"keep\">维持</td><td class=\"keep\">维持</td></tr>\n          <tr><th class=\"rowh\">&lt;40%</th><td class=\"down-cell\">−20%</td><td class=\"down-cell\">−15%</td><td class=\"down-cell\">−10%</td><td class=\"down-cell\">−5%</td><td class=\"keep\">维持</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <div class=\"codex-meta\">\n      <b>执行约束（必须同时遵守）</b>\n      <ol style=\"margin:6px 0 0\">\n        <li>单日同方向累计调价 <b>不超过 20%</b>；24 小时内同方向调价 <b>不超过 2 次</b>。</li>\n        <li>每次调价幅度 <b>不低于 3%</b>（低于 3% 无市场感知，不算调价）。</li>\n        <li>调价后 <b>30 分钟内</b>必须检查 OTA 挂牌价是否同步（价格一致性）。</li>\n        <li>触及 D1 峰值日的调价，<b>必须</b>由 L3 收益经理审批。</li>\n        <li>调价动作全部写入《调价台账》。</li>\n      </ol>\n    </div>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">表 A 三条易错点</span>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>区间边界</b>：70–85% 与 85–95% 在 85% 重叠。判定规则：OCC 恰好等于 85% 时归入<b>上一档</b>（85–95%），恰好等于 95% 时归入 <b>≥95%</b> 档。即\"取高档不取低档\"。</li>\n      <li><b>输入 1 是\"预测 OCC\"不是\"当前在手 OCC\"</b>：预测 OCC =（在手 + 预测增量）÷ 可售房晚。用当前在手算，会系统性低估，导致该涨不涨。</li>\n      <li><b>预测增量用什么</b>：用本模块第六节预测三步法算出的 RW（剩余需求）填。不准填\"去年 Pickup\"，那是循环论证。</li>\n    </ul>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">表 A 调价结果的取整规则（全学院统一，与约束 2 配套）</span>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>提价：向上取整到 ¥10</b>（例：¥734.4 → ¥740）</li>\n      <li><b>降价：向下取整到 ¥10</b>（例：¥646 → ¥640）</li>\n      <li><b>取整后必须回算实际幅度</b>：实际幅度 = |新价 − 原价| ÷ 原价。若 &lt; 3%，本次调价<b>不成立</b>，改记入《观察清单》。</li>\n    </ul>\n    <p style=\"margin:8px 0 0\">取整方向的原则是\"只放大不缩小\"——提价往上取、降价往下取，保证取整不会把幅度吃掉。若按反方向取整导致幅度低于 3%，属操作失误，须在《调价台账》备注栏写明并重新落位。</p>\n  </div>\n\n  <\!-- ================= 六 ================= -->\n  <h2 id=\"s6\">六、预测三步法与修正系数表</h2>\n\n  <p>这是本模块的核心算法。三步有严格的先后顺序，不得颠倒、不得跳步。三步做完，得到一个数字：预测总需求。</p>\n\n  <div class=\"flow\">\n    <div class=\"flow-item\"><div class=\"fi-t\">第 ① 步：去年同期实际</div><div class=\"fi-d\">取出去年同一目标日的实际售出房晚，作为基准盘</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">第 ② 步：加 Pickup 增量</div><div class=\"fi-d\">今年在手 − 去年同窗口在手，把今年的\"早收／晚收\"补进基准盘</div></div>\n    <div class=\"flow-arrow\">→</div>\n    <div class=\"flow-item\"><div class=\"fi-t\">第 ③ 步：做三项修正</div><div class=\"fi-d\">星期几修正 × 需求等级变动修正 × 事件修正，得到最终预测</div></div>\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">预测三步法 · 总公式</span>\n    预测总需求 = [ 去年同期实际房晚 +（今年在手房晚 − 去年同期同一提前窗口在手房晚）]<br>\n    　　　　　　 × 星期几修正系数 × 需求等级变动系数 × 事件修正系数 + 已确认事件增量<br>\n    预测 OCC = 预测总需求 ÷ 可售房晚（云璟平峰日 320）<br>\n    RW（剩余需求） = 预测总需求 − 今年在手房晚\n  </div>\n\n  <h3>6.1 第 ① 步：去年同期实际——取数与清洗</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-6　第 ① 步取数清单（不多抓一个，不少抓一个）</caption>\n      <thead><tr><th>字段</th><th>说明</th><th>清洗规则</th></tr></thead>\n      <tbody>\n        <tr><td>去年同一目标日实际售出房晚</td><td>取 PMS 中同月同日的售出房晚</td><td>剔除免费房与自用房（Comp / House Use）</td></tr>\n        <tr><td>去年同一目标日可售房晚</td><td>分母</td><td>若去年当日有装修／OOO 房，须按今年可售房晚同比放大</td></tr>\n        <tr><td>去年同一目标日实际 OCC</td><td>交叉校验用</td><td>与售出房晚 ÷ 可售房晚 一致性检查</td></tr>\n        <tr><td>去年同一目标日在 T-30 / T-14 / T-7 / T-1 的在手房晚</td><td>第 ② 步与表 I 用</td><td>同取数时点（建议统一 08:00 快照）</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">跨年对齐：春节与闰年</span>\n    <p>农历节日（春节、端午、中秋）不能按公历同月同日对齐，必须按<b>农历同日</b>对齐。闰年 2 月 29 日缺失时，用 2 月 28 日与 3 月 1 日的平均值代替。这两个规则不执行，第 ① 步的基准盘就是错的，后两步再准也没用。</p>\n  </div>\n\n  <h3>6.2 第 ② 步：加 Pickup 增量</h3>\n\n  <p>这一步的逻辑是\"加法模型（Additive Pickup）\"：假设今年与去年在<b>剩余窗口内</b>的增量速度相同，那么今年最终 = 去年最终 + 今年已经多收（或少收）的部分。</p>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">第 ② 步</span>\n    Pickup 增量 = 今年在手房晚 − 去年同期同一提前窗口在手房晚<br>\n    未修正预测 = 去年同期实际房晚 + Pickup 增量\n  </div>\n\n  <p>例：去年 10-20 实际 232 房晚，去年 T-30 在手 78 房晚，今年 T-30 在手 96 房晚 → Pickup 增量 = +18 → 未修正预测 = 232 + 18 = <span class=\"f-out\">250 房晚</span>。</p>\n\n  <h4>用预订基准曲线做交叉校验</h4>\n\n  <p>第 ② 步算完后，用云璟酒店的<b>预订基准曲线</b>反查一遍，防止异常值。下表为该曲线的历史基准形态：</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-7　云璟酒店预订基准曲线（累计在手占最终售出房晚的历史比例）<span class=\"cap-note\">用途：反推预测、交叉校验。须以本店近 12 个月实际数据每季度重算一次</span></caption>\n      <thead><tr><th>提前天数</th><th class=\"num\">60</th><th class=\"num\">45</th><th class=\"num\">30</th><th class=\"num\">21</th><th class=\"num\">14</th><th class=\"num\">7</th><th class=\"num\">3</th><th class=\"num\">1</th><th class=\"num\">0</th></tr></thead>\n      <tbody><tr><th class=\"rowh\">累计占比</th><td class=\"num\">12%</td><td class=\"num\">20%</td><td class=\"num\" data-hit>34%</td><td class=\"num\">46%</td><td class=\"num\">58%</td><td class=\"num\">73%</td><td class=\"num\">86%</td><td class=\"num\">94%</td><td class=\"num\">100%</td></tr></tbody>\n    </table>\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">交叉校验公式</span>\n    曲线外推预测 = 今年在手房晚 ÷ 该提前天数的基准累计占比<br>\n    偏差容忍带 = | 第 ② 步结果 − 曲线外推结果 | ÷ 曲线外推结果 ≤ 15%<br>\n    例：96 ÷ 34% → <span class=\"f-out\">282 房晚</span>；第 ② 步结果 250；(282 − 250) ÷ 282 = 11.3% → 在容忍带内，通过\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">超出容忍带时的处理</span>\n    <p>偏差 &gt;15% 时，<b>不得取平均值糊弄过去</b>，必须按以下顺序排查，找到原因后取单一结果：</p>\n    <ol style=\"margin:6px 0 0\">\n      <li>查是否有大型团队／会议在手（团队预订不按散客曲线分布，会抬高早期在手）→ 若有，改用第 ② 步结果。</li>\n      <li>查是否去年同日有异常（去年当日有 OOO 房、有大型团队、有极端的天气事件）→ 若有，改用曲线外推结果。</li>\n      <li>两项都无 → 上报 L2 主管复核，取第 ② 步结果，并在《预测偏差台账》备注栏注明\"曲线校验 &gt;15%，原因待查\"。</li>\n    </ol>\n  </div>\n\n  <h3>6.3 第 ③ 步：三项修正（星期几 / 需求等级 / 事件）</h3>\n\n  <h4>修正一：星期几修正系数</h4>\n\n  <p>去年同日与今年目标日的星期几不同时，需求结构不同。修正系数按下表查：</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-8　星期几修正系数表<span class=\"cap-note\">查法：行＝去年同日的星期类型，列＝今年目标日的星期类型</span></caption>\n      <thead><tr><th>去年 ＼ 今年</th><th>周一–周四<br>（工作日）</th><th>周五–周六<br>（周末）</th><th>周日<br>（周末尾）</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">周一–周四（工作日）</th><td class=\"mid\" data-hit>1.00</td><td class=\"mid\"><span class=\"up\">1.06</span></td><td class=\"mid\"><span class=\"down\">0.94</span></td></tr>\n        <tr><th class=\"rowh\">周五–周六（周末）</th><td class=\"mid\"><span class=\"down\">0.92</span></td><td class=\"mid\">1.00</td><td class=\"mid\"><span class=\"down\">0.96</span></td></tr>\n        <tr><th class=\"rowh\">周日（周末尾）</th><td class=\"mid\"><span class=\"down\">0.96</span></td><td class=\"mid\"><span class=\"up\">1.04</span></td><td class=\"mid\">1.00</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">为什么这样分三类</span>\n    <p>云璟酒店是中高端全服务酒店，商务客（CORP 协议客户占比 22%）集中在周一至周四，休闲客集中在周五、周六，周日是返程日、需求最低。把一周切成\"工作日 / 周末 / 周末尾\"三类，比做七个独立的星期系数更稳，且不会出现小样本失真。</p>\n  </div>\n\n  <h4>修正二：需求等级变动系数</h4>\n\n  <p>当去年同日与今年目标日的需求等级（D1 峰值日 / D2 高涨日 / D3 平峰日 / D4 低谷日）不同时，用下表修正。系数来源：《SPEC》2.5 年度需求日历各等级的<b>目标 OCC 中值之比</b>。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-9　各需求等级的目标 OCC 中值（《SPEC》2.5）<span class=\"cap-note\">D1「≥95%」取 96%；D2「88–95%」取 91.5%；D3「72–85%」取 78.5%；D4「45–65%」取 55%</span></caption>\n      <thead><tr><th>需求等级</th><th>代号</th><th class=\"num\">目标 OCC</th><th class=\"num\">中值</th><th class=\"num\">价格系数（相对平峰 BAR）</th></tr></thead>\n      <tbody>\n        <tr><td>D1 峰值日</td><td>PEAK</td><td class=\"num\">≥95%</td><td class=\"num\">96.0%</td><td class=\"num\">150–200%</td></tr>\n        <tr><td>D2 高涨日</td><td>HIGH</td><td class=\"num\">88–95%</td><td class=\"num\">91.5%</td><td class=\"num\">120–150%</td></tr>\n        <tr><td>D3 平峰日</td><td>SHOULDER</td><td class=\"num\">72–85%</td><td class=\"num\">78.5%</td><td class=\"num\">95–110%</td></tr>\n        <tr><td>D4 低谷日</td><td>LOW</td><td class=\"num\">45–65%</td><td class=\"num\">55.0%</td><td class=\"num\">70–85%</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl tbl-matrix\">\n      <caption>表 5-10　需求等级变动修正系数 = 今年等级中值 ÷ 去年等级中值<span class=\"cap-note\">行＝去年同日等级，列＝今年目标日等级</span></caption>\n      <thead><tr><th>去年 ＼ 今年</th><th>D1</th><th>D2</th><th>D3</th><th>D4</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">D1</th><td class=\"mid\">1.00</td><td class=\"mid\"><span class=\"down\">0.95</span></td><td class=\"mid\"><span class=\"down\">0.82</span></td><td class=\"mid\"><span class=\"down\">0.57</span></td></tr>\n        <tr><th class=\"rowh\">D2</th><td class=\"mid\"><span class=\"up\">1.05</span></td><td class=\"mid\">1.00</td><td class=\"mid\"><span class=\"down\">0.86</span></td><td class=\"mid\"><span class=\"down\">0.60</span></td></tr>\n        <tr><th class=\"rowh\">D3</th><td class=\"mid\"><span class=\"up\">1.22</span></td><td class=\"mid\"><span class=\"up\">1.17</span></td><td class=\"mid\" data-hit>1.00</td><td class=\"mid\"><span class=\"down\">0.70</span></td></tr>\n        <tr><th class=\"rowh\">D4</th><td class=\"mid\"><span class=\"up\">1.75</span></td><td class=\"mid\"><span class=\"up\">1.66</span></td><td class=\"mid\"><span class=\"up\">1.43</span></td><td class=\"mid\">1.00</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <p style=\"font-size:13px;color:var(--ink-3)\">核算示例：D3 → D2 = 91.5% ÷ 78.5% = 1.166 → 取 1.17；D3 → D1 = 96.0% ÷ 78.5% = 1.223 → 取 1.22。</p>\n\n  <h4>修正三：事件修正系数与已确认事件增量</h4>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-11　事件修正系数表<span class=\"cap-note\">事件修正以\"乘\"计入；已确认的具体房晚数以\"加\"计入，二者不重复</span></caption>\n      <thead><tr><th>事件类型</th><th>判定信号（必须在系统中可核实）</th><th class=\"num\">系数</th><th>计入方式</th><th>依据</th></tr></thead>\n      <tbody>\n        <tr><td>目标日升级为 D1 峰值日（新增大型展会／赛事／节庆）</td><td>官方会期公告 + 已在《年度需求日历》打标</td><td class=\"num\">—</td><td>走表 5-10 等级变动系数</td><td>《SPEC》2.5</td></tr>\n        <tr><td>3km 内新增同档竞争酒店开业（开业 1–3 个月）</td><td>《法典》表 L「竞对新开业」判定信号</td><td class=\"num\"><span class=\"down\">0.95</span></td><td>乘</td><td>《法典》表 L</td></tr>\n        <tr><td>3km 内新增同档竞争酒店开业（开业 4–6 个月）</td><td>同上，且已进入《竞争组合比价表》</td><td class=\"num\"><span class=\"down\">0.97</span></td><td>乘</td><td>《法典》表 L</td></tr>\n        <tr><td>本店可售房量下降（装修／OOO 房）</td><td>工程部书面通知的 OOO 房数与工期</td><td class=\"num\">1.00</td><td>不改需求，改分母（可售房晚下调）</td><td>《SPEC》3.1 OCC 口径</td></tr>\n        <tr><td>已确认的会议／团队锁房</td><td>已签合同或已付定金的团队房晚数</td><td class=\"num\">—</td><td>加（若该房晚已计入在手，<b>不得重复加</b>）</td><td>《法典》表 G / 表 K</td></tr>\n        <tr><td>已确认的需求流失（协议客户闭厂、团队取消）</td><td>客户书面取消通知</td><td class=\"num\">—</td><td>减</td><td>《调价台账》备注栏记录</td></tr>\n        <tr><td>极端天气预警（台风／暴雪橙色及以上）</td><td>气象部门官方预警</td><td class=\"num\"><span class=\"down\">0.80</span></td><td>乘</td><td>《SPEC》2.5 D4 定义</td></tr>\n        <tr><td>本店大型设备／餐厅停业（泳池、全日制餐厅停业）</td><td>工程 / 餐饮部书面通知</td><td class=\"num\"><span class=\"down\">0.93</span></td><td>乘</td><td>《SPEC》2.2 配套</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">事件修正的三条铁律</span>\n    <ol style=\"margin:6px 0 0\">\n      <li><b>无证据不修正</b>：任何系数必须有可核实的外部证据（公告、合同、预警、书面通知）。\"听说下个月有展会\"不算证据，不进模型。</li>\n      <li><b>不重复计入</b>：已确认的团队房晚如果已经进入在手（OTB），只能算一次，不得在\"加 Pickup 增量\"之外再加一遍。判据：查该团队的预订日期，若早于本次取数日，则已在手内。</li>\n      <li><b>等级变动与事件不叠加</b>：如果事件的影响已经体现为需求等级变动（例如新增展会使该日从 D3 升为 D1），只走表 5-10 的等级变动系数，<b>不再额外乘事件系数</b>。</li>\n    </ol>\n  </div>\n\n  <h4>修正系数连乘的封顶规则</h4>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">封顶规则</span>\n    总修正系数 = 星期几系数 × 等级变动系数 × 事件系数（连乘）<br>\n    下限 <span class=\"f-out\">0.60</span>　上限 <span class=\"f-out\">1.60</span><br>\n    超出区间时取端点值，并在《预测偏差台账》备注栏注明\"触顶，人工复核\"\n  </div>\n\n  <\!-- ================= 七 ================= -->\n  <h2 id=\"s7\">七、三个完整预测演算案例</h2>\n\n  <p>以下三例均为<b>提前 30 天</b>（T-30）的预测演练，取数日统一为 2026-09-20，酒店为杭州滨江云璟酒店，可售房晚 320。三例分别代表三种典型场景：<b>平推场景</b>、<b>事件升级场景</b>、<b>双向利空场景</b>。每一例都从原始数据一步步算到最终动作。</p>\n\n  <h3>案例一：平推场景 —— 目标日 2026-10-20（周二）</h3>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">1</span>已知条件</div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">目标日 / 星期</div><div class=\"kv-v\">2026-10-20（周二），需求等级 <b>D3 平峰日</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">去年同日</div><div class=\"kv-v\">2025-10-20（周一），需求等级 D3 平峰日</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">去年同日实际</div><div class=\"kv-v\">售出 <b>232 房晚</b>，实际 OCC = 232 ÷ 320 = <b>72.5%</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">去年 T-30 在手</div><div class=\"kv-v\"><b>78 房晚</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">今年 T-30 在手</div><div class=\"kv-v\"><b>96 房晚</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">事件因素</div><div class=\"kv-v\">无。无展会、无新增竞对、无 OOO 房、无团队锁房</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">当前 BAR</div><div class=\"kv-v\">高级房平峰 BAR <b>¥680</b>（《SPEC》2.1）</div></div>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>演算过程（一步步）</div>\n\n    <p><b>第 ① 步　去年同期实际</b></p>\n    <div class=\"formula\">基准盘 = <span class=\"f-out\">232 房晚</span></div>\n\n    <p><b>第 ② 步　加 Pickup 增量</b></p>\n    <div class=\"formula\">\n      Pickup 增量 = 96 − 78 = <span class=\"f-out\">+18 房晚</span><br>\n      未修正预测 = 232 + 18 = <span class=\"f-out\">250 房晚</span>\n    </div>\n\n    <p><b>交叉校验（表 5-7 曲线）</b></p>\n    <div class=\"formula\">\n      曲线外推 = 96 ÷ 34% = 282 房晚<br>\n      偏差 = |250 − 282| ÷ 282 = <span class=\"f-out\">11.3%</span> → ≤15%，通过，取第 ② 步结果 250 房晚\n    </div>\n\n    <p><b>第 ③ 步　三项修正</b></p>\n    <div class=\"formula\">\n      星期几修正：去年周一（工作日）→ 今年周二（工作日） → 查表 5-8 → <span class=\"f-out\">×1.00</span><br>\n      需求等级变动：去年 D3 → 今年 D3 → 查表 5-10 → <span class=\"f-out\">×1.00</span><br>\n      事件修正：无 → <span class=\"f-out\">×1.00</span><br>\n      总修正系数 = 1.00 × 1.00 × 1.00 = 1.00（在 0.60–1.60 区间内）<br>\n      预测总需求 = 250 × 1.00 = <span class=\"f-out\">250 房晚</span>\n    </div>\n\n    <p><b>换算成预测 OCC 与 RW</b></p>\n    <div class=\"formula\">\n      预测 OCC = 250 ÷ 320 = <span class=\"f-out\">78.1%</span><br>\n      RW（剩余需求） = 250 − 96 = <span class=\"f-out\">154 房晚</span><br>\n      日均必需进度 = 154 ÷ 30 天 = <span class=\"f-out\">5.1 房晚／天</span>\n    </div>\n\n    <p><b>算 Pickup 偏差（表 A 输入 2）</b></p>\n    <div class=\"formula\">\n      Pickup 偏差 =（96 − 78）÷ 78 × 100% = <span class=\"f-out up\">+23.1%</span> → 定位「领先 &gt;10%」列\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">✓</span>查表与动作</div>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <thead><tr><th>查表</th><th>输入</th><th>表结论</th><th>是否执行</th></tr></thead>\n        <tbody>\n          <tr><td>《法典》表 A</td><td>预测 OCC 78.1%（70–85% 行）× Pickup 偏差 +23.1%（领先 &gt;10% 列）</td><td><span class=\"up\">+8%</span></td><td><span class=\"pill pill-teal\">执行</span></td></tr>\n          <tr><td>《法典》表 I（15–30 天档）</td><td>落后触发阈值 20%；当前为<span class=\"up\">领先 23.1%</span></td><td>未触发</td><td><span class=\"pill\">不执行</span></td></tr>\n          <tr><td>《法典》表 B</td><td>预测 OCC 78.1% → 70–85% 档</td><td>MinLOS 1 晚 / CTA 否 / 低价渠道全开 / 超额预订按表 E</td><td><span class=\"pill pill-teal\">执行</span></td></tr>\n          <tr><td>《法典》表 H</td><td>预测 OCC 78.1% → 70–85% 档</td><td>OTA 全开 / OTA 国际全开 / GDS 开 / 批发商限价开（≤BAR×75%）/ 直销全开 + 早鸟</td><td><span class=\"pill pill-teal\">执行</span></td></tr>\n        </tbody>\n      </table>\n    </div>\n    <p><b>价格动作</b>：平峰 BAR ¥680 <span class=\"up\">↑8%</span> → ¥734.4 → 提价向上取整至 <b>¥740</b>（实际涨幅 +8.8%，高于表 A 约束 2 的 3% 门槛，低于约束 1 的 20% 单日上限）。该日非 D1 峰值日，<b>无需</b> L3 审批。<br>\n    <b>记录动作</b>：写入《调价台账》——目标日 2026-10-20、预测 OCC 78.1%、Pickup 偏差 +23.1%、原 BAR ¥680、新 BAR ¥740、依据《法典》表 A（70–85% × 领先&gt;10%）。</p>\n    <p class=\"card-note\">与预算对比：10 月 OCC 目标 85%（《SPEC》2.5 月度需求基准）＝ 272 房晚，预测 250 房晚 → 缺口 <b>22 房晚</b>。缺口记入《周度收益报告》，由销售部按日均 0.7 房晚／天的追加任务承接。</p>\n  </div>\n\n  <h3>案例二：事件升级场景 —— 目标日 2026-10-23（周五）</h3>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">2</span>已知条件</div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">目标日 / 星期</div><div class=\"kv-v\">2026-10-23（周五）。因 2026 滨江国际马拉松于 10-24 举行，本日为该赛事<b>周边日</b>，需求等级由 D3 升级为 <b>D2 高涨日</b>（《SPEC》2.5：展会周边日属 D2）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">去年同日</div><div class=\"kv-v\">2025-10-23（周四），需求等级 D3 平峰日，当年无赛事</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">去年同日实际</div><div class=\"kv-v\">售出 <b>210 房晚</b>，实际 OCC = 210 ÷ 320 = <b>65.6%</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">去年 T-30 在手</div><div class=\"kv-v\"><b>72 房晚</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">今年 T-30 在手</div><div class=\"kv-v\"><b>100 房晚</b>，其中<b>含</b>马拉松组委会已确认锁房 <b>40 间夜</b>（8 月已签约并计入在手）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">当前 BAR</div><div class=\"kv-v\">已按 D2 高涨日价格系数 130% 设置：<b>¥884</b>（¥680 × 130%）</div></div>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>演算过程（一步步）</div>\n\n    <p><b>第 ① 步　去年同期实际</b></p>\n    <div class=\"formula\">基准盘 = <span class=\"f-out\">210 房晚</span></div>\n\n    <p><b>第 ② 步　加 Pickup 增量</b></p>\n    <div class=\"formula\">\n      Pickup 增量 = 100 − 72 = <span class=\"f-out\">+28 房晚</span><br>\n      未修正预测 = 210 + 28 = <span class=\"f-out\">238 房晚</span>\n    </div>\n\n    <p><b>交叉校验（表 5-7 曲线）</b></p>\n    <div class=\"formula\">\n      曲线外推 = 100 ÷ 34% = 294 房晚；偏差 = |238 − 294| ÷ 294 = <b>19.0%</b> → &gt;15%，<b>未通过</b>\n    </div>\n    <div class=\"callout callout-warn\" style=\"margin:10px 0\">\n      <span class=\"co-t\">排查结论</span>\n      <p>按表 5-7 的排查顺序第一条：查是否有大型团队／会议在手 → 有，马拉松组委会锁房 40 间夜，约占今年在手 100 的 40%。团队预订不按散客曲线分布，属正常畸高。<b>采用第 ② 步结果 238 房晚</b>，并在《预测偏差台账》备注栏写明\"曲线校验 19.0%，因团队锁房 40 间夜畸高，采用加法模型结果\"。</p>\n    </div>\n\n    <p><b>第 ③ 步　三项修正</b></p>\n    <div class=\"formula\">\n      星期几修正：去年周四（工作日）→ 今年周五（周末） → 查表 5-8 → <span class=\"f-out up\">×1.06</span><br>\n      需求等级变动：去年 D3 → 今年 D2 → 查表 5-10 → <span class=\"f-out up\">×1.17</span><br>\n      事件修正：马拉松已体现为等级从 D3 升为 D2，按\"等级变动与事件不叠加\"铁律 → <span class=\"f-out\">×1.00</span><br>\n      　　　　　组委会锁房 40 间夜<b>已含在手</b>，按\"不重复计入\"铁律 → 不加<br>\n      总修正系数 = 1.06 × 1.17 × 1.00 = 1.24（在 0.60–1.60 区间内）<br>\n      预测总需求 = 238 × 1.24 = <span class=\"f-out\">295 房晚</span>\n    </div>\n\n    <p><b>换算成预测 OCC 与 RW</b></p>\n    <div class=\"formula\">\n      预测 OCC = 295 ÷ 320 = <span class=\"f-out\">92.2%</span><br>\n      RW（剩余需求） = 295 − 100 = <span class=\"f-out\">195 房晚</span><br>\n      日均必需进度 = 195 ÷ 30 天 = <span class=\"f-out\">6.5 房晚／天</span>\n    </div>\n\n    <p><b>算 Pickup 偏差（表 A 输入 2）</b></p>\n    <div class=\"formula\">\n      Pickup 偏差 =（100 − 72）÷ 72 × 100% = <span class=\"f-out up\">+38.9%</span> → 定位「领先 &gt;10%」列\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">✓</span>查表、仲裁与动作（本例含《法典》表 O 冲突仲裁）</div>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <thead><tr><th>查表</th><th>输入</th><th>表结论</th><th>表 O 优先级</th><th>裁决</th></tr></thead>\n        <tbody>\n          <tr><td>《法典》表 B</td><td>预测 OCC 92.2% → 90–95% 档</td><td>MinLOS 2 晚 / <b>D1 日启用 CTA</b>（10-23 为 D2，非 D1 → 不启用 CTA）/ 关闭尾房特惠 / 超售 ≤2 间</td><td><b>2</b></td><td><span class=\"pill pill-teal\">当日执行</span></td></tr>\n          <tr><td>《法典》表 A</td><td>预测 OCC 92.2%（90–95% 行）× Pickup 偏差 +38.9%（领先 &gt;10% 列）</td><td><span class=\"up\">+15%</span></td><td>3</td><td><span class=\"pill pill-amber\">次日执行</span></td></tr>\n          <tr><td>《法典》表 H</td><td>预测 OCC 92.2% → 90–95% 档</td><td>OTA 国内开 2 家 / OTA 国际关 / GDS 开 / 批发商关 / 直销全开</td><td>5</td><td><span class=\"pill pill-amber\">次日执行</span></td></tr>\n          <tr><td>《法典》表 I（15–30 天档）</td><td>落后触发阈值 20%；当前为<span class=\"up\">领先 38.9%</span></td><td>未触发</td><td>—</td><td><span class=\"pill\">不执行</span></td></tr>\n        </tbody>\n      </table>\n    </div>\n    <div class=\"callout callout-key\">\n      <span class=\"co-t\">表 O 仲裁过程</span>\n      <p>四张表中，表 B（优先级 2）最高。按表 O 冲突处理铁律「同日只执行优先级最高的那一条动作，其余记录在《观察清单》」：<b>当日只执行表 B 的库存动作</b>（设 MinLOS 2 晚、关闭尾房特惠、超售 ≤2 间）；表 A 的 <span class=\"up\">+15%</span> 与表 H 的渠道开关写入《观察清单》，<b>次日</b>若表 B 无新增动作，则顺延执行。</p>\n    </div>\n    <p><b>次日价格动作</b>：D2 当前 BAR ¥884 <span class=\"up\">↑15%</span> → ¥1,016.6 → 取整 <b>¥1,020</b>。<br>\n    <b>上限校验</b>：¥1,020 = 平峰 BAR ¥680 × 150%，<b>恰好等于 D2 高涨日价格系数上限 150%</b>（《SPEC》2.5）。结论：可执行，但不得再涨；若次日 Pickup 仍领先 &gt;10%，只能走 MinLOS 与关渠道（表 B、表 H），不能再提价。<br>\n    <b>审批</b>：该日为 D2 而非 D1 峰值日，按表 A 约束 4 无需 L3 审批；但因触及 D2 价格系数上限，按学院规定须由 L3 收益经理<b>事后 24 小时内复核</b>并签字。<br>\n    <b>记录动作</b>：写入《调价台账》，备注栏注明「表 O 仲裁：当日执行表 B（优先级 2），表 A +15% 与表 H 渠道开关顺延至次日」。</p>\n  </div>\n\n  <h3>案例三：双向利空场景 —— 目标日 2026-10-18（周日）</h3>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">3</span>已知条件</div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">目标日 / 星期</div><div class=\"kv-v\">2026-10-18（<b>周日</b>，周末尾），需求等级 D3 平峰日</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">去年同日</div><div class=\"kv-v\">2025-10-18（<b>周六</b>，周末），需求等级 D3 平峰日</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">去年同日实际</div><div class=\"kv-v\">售出 <b>288 房晚</b>，实际 OCC = 288 ÷ 320 = <b>90.0%</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">去年 T-30 在手</div><div class=\"kv-v\"><b>98 房晚</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">今年 T-30 在手</div><div class=\"kv-v\"><b>88 房晚</b></div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">事件因素</div><div class=\"kv-v\">2026 年 8 月，距本店 2.8km 处新增一家同档次酒店开业，触发《法典》表 L「竞对新开业」判定；至 10-18 该酒店开业满 <b>2 个月</b>（处于 1–3 个月区间）</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">当前 BAR</div><div class=\"kv-v\">高级房平峰 BAR <b>¥680</b></div></div>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>演算过程（一步步）</div>\n\n    <p><b>第 ① 步　去年同期实际</b></p>\n    <div class=\"formula\">基准盘 = <span class=\"f-out\">288 房晚</span></div>\n\n    <p><b>第 ② 步　加 Pickup 增量</b></p>\n    <div class=\"formula\">\n      Pickup 增量 = 88 − 98 = <span class=\"f-out down\">−10 房晚</span><br>\n      未修正预测 = 288 +（−10） = <span class=\"f-out\">278 房晚</span>\n    </div>\n\n    <p><b>交叉校验（表 5-7 曲线）</b></p>\n    <div class=\"formula\">\n      曲线外推 = 88 ÷ 34% = 259 房晚<br>\n      偏差 = |278 − 259| ÷ 259 = <span class=\"f-out\">7.3%</span> → ≤15%，通过，取第 ② 步结果 278 房晚\n    </div>\n\n    <p><b>第 ③ 步　三项修正（本例三项全部生效）</b></p>\n    <div class=\"formula\">\n      星期几修正：去年<b>周六（周末）</b> → 今年<b>周日（周末尾）</b> → 查表 5-8 → <span class=\"f-out down\">×0.96</span><br>\n      需求等级变动：去年 D3 → 今年 D3 → 查表 5-10 → <span class=\"f-out\">×1.00</span><br>\n      事件修正：3km 内新增同档竞对，开业 2 个月（1–3 个月区间）→ 查表 5-11 → <span class=\"f-out down\">×0.95</span><br>\n      总修正系数 = 0.96 × 1.00 × 0.95 = 0.912（在 0.60–1.60 区间内）<br>\n      预测总需求 = 278 × 0.912 = 253.5 → <span class=\"f-out\">254 房晚</span>\n    </div>\n\n    <p><b>换算成预测 OCC 与 RW</b></p>\n    <div class=\"formula\">\n      预测 OCC = 254 ÷ 320 = <span class=\"f-out\">79.2%</span><br>\n      RW（剩余需求） = 254 − 88 = <span class=\"f-out\">166 房晚</span><br>\n      日均必需进度 = 166 ÷ 30 天 = <span class=\"f-out\">5.5 房晚／天</span>\n    </div>\n\n    <p><b>算 Pickup 偏差（表 A 输入 2）</b></p>\n    <div class=\"formula\">\n      Pickup 偏差 =（88 − 98）÷ 98 × 100% = <span class=\"f-out down\">−10.2%</span> → 定位「落后 &gt;10%」列\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">✓</span>查表与动作</div>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <thead><tr><th>查表</th><th>输入</th><th>表结论</th><th>是否执行</th></tr></thead>\n        <tbody>\n          <tr><td>《法典》表 A</td><td>预测 OCC 79.2%（70–85% 行）× Pickup 偏差 −10.2%（落后 &gt;10% 列）</td><td><span class=\"down\">−5%</span></td><td><span class=\"pill pill-teal\">执行</span></td></tr>\n          <tr><td>《法典》表 I（15–30 天档）</td><td>落后触发阈值 20%；当前落后 10.2%</td><td>未触发（继续按每周 2 次监控）</td><td><span class=\"pill\">不执行</span></td></tr>\n          <tr><td>《法典》表 L（竞对新开业）</td><td>3km 内新增同档酒店</td><td>采集其价格加入比价表、评估 ARI（2 小时内）；制定差异化策略（24 小时内）；月度跟踪 MPI 变化</td><td><span class=\"pill pill-teal\">执行</span></td></tr>\n          <tr><td>《法典》表 H</td><td>预测 OCC 79.2% → 70–85% 档</td><td>全开 / 全开 / GDS 开 / 批发商限价开（≤BAR×75%）/ 直销全开 + 早鸟</td><td><span class=\"pill pill-teal\">执行</span></td></tr>\n        </tbody>\n      </table>\n    </div>\n    <p><b>价格动作</b>：平峰 BAR ¥680 <span class=\"down\">↓5%</span> → ¥646 → 降价向下取整至 <b>¥640</b>（实际降幅 −5.9%，高于表 A 约束 2 的 3% 门槛）。<br>\n    <b>表 L 动作</b>：2 小时内采集新竞对价格加入《竞争组合比价表》并评估 ARI；24 小时内制定差异化策略——按表 L 明确要求「<b>不盲目跟价</b>」，故本日降价 5% 的依据是表 A（自身 Pickup 落后），而不是跟着竞对降价。两者依据必须分别写在《调价台账》备注栏。<br>\n    <b>记录动作</b>：写入《调价台账》，备注栏注明「落后 10.2%，未达表 I 15–30 天档 20% 阈值，按每周 2 次继续监控；若 T-14 仍落后 &gt;10% 则转表 A 二次调价」。</p>\n    <p class=\"card-note\">复盘要点：本例的 −5% 来自表 A，而非来自\"竞对开业所以要降价\"。很多新人会把两者混为一谈，导致跟价。表 L 对竞对新开业的规定是「制定差异化策略（不盲目跟价）」，请学员牢记。</p>\n  </div>\n\n  <h3>三例横向对比</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-12　三个预测案例的横向对比</caption>\n      <thead><tr><th>项目</th><th>案例一 10-20</th><th>案例二 10-23</th><th>案例三 10-18</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">去年同日实际房晚</th><td class=\"num\">232</td><td class=\"num\">210</td><td class=\"num\">288</td></tr>\n        <tr><th class=\"rowh\">去年 T-30 在手</th><td class=\"num\">78</td><td class=\"num\">72</td><td class=\"num\">98</td></tr>\n        <tr><th class=\"rowh\">今年 T-30 在手</th><td class=\"num\">96</td><td class=\"num\">100</td><td class=\"num\">88</td></tr>\n        <tr><th class=\"rowh\">Pickup 增量</th><td class=\"num\"><span class=\"up\">+18</span></td><td class=\"num\"><span class=\"up\">+28</span></td><td class=\"num\"><span class=\"down\">−10</span></td></tr>\n        <tr><th class=\"rowh\">未修正预测</th><td class=\"num\">250</td><td class=\"num\">238</td><td class=\"num\">278</td></tr>\n        <tr><th class=\"rowh\">星期几系数</th><td class=\"num\">1.00</td><td class=\"num\"><span class=\"up\">1.06</span></td><td class=\"num\"><span class=\"down\">0.96</span></td></tr>\n        <tr><th class=\"rowh\">等级变动系数</th><td class=\"num\">1.00</td><td class=\"num\"><span class=\"up\">1.17</span></td><td class=\"num\">1.00</td></tr>\n        <tr><th class=\"rowh\">事件系数</th><td class=\"num\">1.00</td><td class=\"num\">1.00</td><td class=\"num\"><span class=\"down\">0.95</span></td></tr>\n        <tr><th class=\"rowh\">预测总需求</th><td class=\"num\">250</td><td class=\"num\">295</td><td class=\"num\">254</td></tr>\n        <tr><th class=\"rowh\">预测 OCC</th><td class=\"num\">78.1%</td><td class=\"num\">92.2%</td><td class=\"num\">79.2%</td></tr>\n        <tr><th class=\"rowh\">RW 剩余需求</th><td class=\"num\">154</td><td class=\"num\">195</td><td class=\"num\">166</td></tr>\n        <tr><th class=\"rowh\">Pickup 偏差</th><td class=\"num\"><span class=\"up\">+23.1%</span></td><td class=\"num\"><span class=\"up\">+38.9%</span></td><td class=\"num\"><span class=\"down\">−10.2%</span></td></tr>\n        <tr><th class=\"rowh\">表 A 结论</th><td class=\"num\"><span class=\"up\">+8%</span></td><td class=\"num\"><span class=\"up\">+15%</span></td><td class=\"num\"><span class=\"down\">−5%</span></td></tr>\n        <tr><th class=\"rowh\">表 B 结论</th><td>MinLOS 1 晚<br>全开</td><td>MinLOS 2 晚<br>关尾房特惠<br>超售 ≤2 间</td><td>MinLOS 1 晚<br>全开</td></tr>\n        <tr><th class=\"rowh\">执行 BAR</th><td class=\"num\">¥680 → <span class=\"up\">¥740</span></td><td class=\"num\">¥884 → <span class=\"up\">¥1,020</span></td><td class=\"num\">¥680 → <span class=\"down\">¥640</span></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <\!-- ================= 八 ================= -->\n  <h2 id=\"s8\">八、预测偏差复盘：准确率、合格线与改进</h2>\n\n  <p>预测做完不是结束。每次预测都要在目标日过后被\"判卷\"，判卷结果决定是否要修正模型参数。这是 L2 与 L1 的分水岭：L1 只看今天要不要调价，L2 要对预测的准确性负责。</p>\n\n  <h3>8.1 预测准确率的定义</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">公式（本模块唯一口径）</span>\n    预测准确率 = 1 − |预测 OCC − 实际 OCC| ÷ 实际 OCC<br>\n    例：预测 OCC 78.1%，实际 OCC 74.0%<br>\n    准确率 = 1 − |78.1% − 74.0%| ÷ 74.0% = 1 − 5.54% = <span class=\"f-out\">94.5%</span>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">分母必须用实际 OCC</span>\n    <p>分母是实际 OCC，不是预测 OCC，也不是可售房晚。用实际 OCC 做分母，高估与低估的惩罚才对称，且不同 OCC 水平的日子之间可以横向比较。</p>\n  </div>\n\n  <h3>8.2 合格线（分提前期设定）</h3>\n\n  <p>预测提前期越长，越难准，所以合格线分档设定。下表为<b>本学院 L2 考核标准</b>：</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-13　预测准确率合格线（分提前期）<span class=\"cap-note\">口径：单个目标日的预测准确率；月度考核取该提前期下全部目标日的算术平均</span></caption>\n      <thead><tr><th>预测提前期</th><th class=\"num\">准确率合格线</th><th>对应《法典》表 I 窗口档</th><th>未达标处理</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">T-30（提前 30 天）</th><td class=\"num\" data-hit>≥85%</td><td>15–30 天档</td><td>记入《预测偏差台账》，月度复盘</td></tr>\n        <tr><th class=\"rowh\">T-14（提前 14 天）</th><td class=\"num\">≥90%</td><td>8–14 天档</td><td>记入《预测偏差台账》，周度复盘</td></tr>\n        <tr><th class=\"rowh\">T-7（提前 7 天）</th><td class=\"num\">≥93%</td><td>4–7 天档</td><td>当周书面说明</td></tr>\n        <tr><th class=\"rowh\">T-3（提前 3 天）</th><td class=\"num\">≥95%</td><td>0–3 天档</td><td>当日书面说明</td></tr>\n        <tr><th class=\"rowh\">T-1（提前 1 天）</th><td class=\"num\">≥97%</td><td>0–3 天档</td><td>当日书面说明 + L2 主管复核</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <h3>8.3 偏差分级与追责</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 5-14　预测偏差分级与处理动作</caption>\n      <thead><tr><th>偏差级别</th><th>判定条件</th><th>处理动作</th><th>责任层级</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">一级 · 正常</th><td>单日准确率 ≥ 该提前期合格线</td><td>无需动作，正常归档</td><td>L1 执行</td></tr>\n        <tr><th class=\"rowh\">二级 · 超标</th><td>单日准确率低于合格线，但 |预测 OCC − 实际 OCC| ≤ 10 个百分点</td><td>在《预测偏差台账》记录偏差值与归因分类</td><td>L1 记录，L2 复核</td></tr>\n        <tr><th class=\"rowh\">三级 · 重大</th><td>|预测 OCC − 实际 OCC| &gt; 10 个百分点</td><td>当日提交《偏差说明》（一页纸：现象 / 归因 / 改进 / 责任）</td><td>L2 提交，L3 批复</td></tr>\n        <tr><th class=\"rowh\">四级 · 系统性</th><td>连续 3 日<b>同向</b>偏差（连续高估或连续低估），且每日偏差 &gt; 5 个百分点</td><td>48 小时内重估修正系数（表 5-8 / 5-10 / 5-11），出具《预测模型修正说明》</td><td>L2 重估，L3 审批</td></tr>\n        <tr><th class=\"rowh\">五级 · 月度失格</th><td>单月 T-7 平均准确率 &lt; 90%</td><td>触发《预测模型月度复盘》，重算全部基准曲线与修正系数，纳入下月 L2 绩效考核</td><td>L3 主持</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">追责不是罚钱，是量化损失</span>\n    <p>偏差的代价要用 RevPAR（每间可售房收入）算清楚，写进《偏差说明》，这样追责才有说服力：</p>\n    <div class=\"formula\" style=\"margin:10px 0 0\">\n      <b>高估损失</b>（预测过高 → 提了价 → 实际空房）=（预测房晚 − 实际房晚）× 实际 ADR ÷ 可售房晚<br>\n      <b>低估损失</b>（预测过低 → 降了价 → 实际满房）=（实际房晚 − 预测房晚）×（实际 ADR − 成交 ADR）÷ 可售房晚\n    </div>\n    <p style=\"margin:10px 0 0\">举例：10-20 预测 250 房晚、实际 237 房晚，当日实际 ADR ¥700，可售房晚 320 → 高估损失 =（250 − 237）× 700 ÷ 320 = <b>¥28.4</b>（当日 RevPAR 口径的虚高决策损失）。这个数字必须写进《偏差说明》，而不是写一句\"预测偏高\"。</p>\n  </div>\n\n  <h3>8.4 改进四步法（固定动作，不纠结）</h3>\n\n  <div class=\"step\">\n    <div class=\"step-num\">1</div>\n    <div class=\"step-body\">\n      <h4>记录：把偏差写进《预测偏差台账》</h4>\n      <p>字段固定 8 项：目标日 / 预测提前期 / 预测 OCC / 实际 OCC / 准确率 / 偏差方向（高估／低估）/ 归因分类 / 改进动作。缺一项视为未记录。</p>\n    </div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-num\">2</div>\n    <div class=\"step-body\">\n      <h4>分类：把偏差归入五类归因之一</h4>\n      <p>五类归因为：<b>星期系数失准</b> / <b>需求等级判定失准</b> / <b>事件因素未识别或系数失准</b> / <b>竞争组合变化</b> / <b>团队与会议在手突变</b>。一个类只能归一次，不得写\"综合因素\"。</p>\n    </div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-num\">3</div>\n    <div class=\"step-body\">\n      <h4>重估：只改出错的那一个系数</h4>\n      <p>归到哪一类，就只重估对应表格的那一个系数，其余不动。重估样本量为<b>近 12 周同类型目标日</b>，样本量 &lt; 8 个时不重估，只记录。重估幅度单次不超过原系数的 ±5%。</p>\n    </div>\n  </div>\n  <div class=\"step\">\n    <div class=\"step-num\">4</div>\n    <div class=\"step-body\">\n      <h4>回写：更新系数表并留痕</h4>\n      <p>新系数写入表 5-8 / 5-10 / 5-11 的对应格，同时保留旧值与生效日期。每季度末（表 N 季度节奏）统一做一次全表复核。</p>\n    </div>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">一条容易忽略的规则</span>\n    <p>归因分类为「竞争组合变化」时，<b>不得</b>立刻改系数。因为竞对变化要用 ARI（平均房价指数）／MPI（市场渗透指数）先验证，验证动作走 M09 模块与《法典》表 C / 表 D。竞对影响至少观察满 4 周，才能回写系数。</p>\n  </div>\n\n  <\!-- ================= 九 ================= -->\n  <h2 id=\"s9\">九、讲师示范：完整走一遍四步闭环</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▶</span>示范：目标日 2026-11-04（周三），提前 45 天，四步闭环全程</div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">场景设定</div><div class=\"kv-v\">取数日 2026-09-20。目标日 2026-11-04（周三），去年同日 2025-11-04（周二），两年均为 D3 平峰日。去年同日实际售出 210 房晚；去年 T-45 在手 41 房晚；今年 T-45 在手 42 房晚。无事件。当前平峰 BAR ¥680。</div></div>\n    </div>\n\n    <h4>① 看数</h4>\n    <div class=\"formula\">\n      去年同日实际 = 210 房晚；去年 T-45 在手 = 41；今年 T-45 在手 = 42<br>\n      可售房晚 = <span class=\"f-out\">320</span>\n    </div>\n\n    <h4>② 查表（本模块的两张表）</h4>\n    <div class=\"formula\">\n      第 ① 步：基准盘 = 210<br>\n      第 ② 步：Pickup 增量 = 42 − 41 = +1 → 未修正预测 = 211 房晚<br>\n      　曲线校验：42 ÷ 20% = 210 房晚；偏差 = |211 − 210| ÷ 210 = 0.5% → 通过<br>\n      第 ③ 步：星期几（周二工作日 → 周三工作日）×1.00；等级（D3 → D3）×1.00；事件 ×1.00 → 总系数 1.00<br>\n      预测总需求 = <span class=\"f-out\">211 房晚</span><br>\n      预测 OCC = 211 ÷ 320 = <span class=\"f-out\">65.9%</span><br>\n      RW = 211 − 42 = <span class=\"f-out\">169 房晚</span>；日均必需进度 = 169 ÷ 45 = 3.8 房晚／天<br>\n      Pickup 偏差 =（42 − 41）÷ 41 = <span class=\"f-out\">+2.4%</span> → 持平 ±3%\n    </div>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl tbl-matrix\">\n        <caption>查《法典》表 A：预测 OCC 65.9% → 55–70% 行；Pickup 偏差 +2.4% → 持平 ±3% 列</caption>\n        <thead><tr><th>预测 OCC ＼ Pickup 偏差</th><th>落后 &gt;10%</th><th>落后 3–10%</th><th>持平 ±3%</th><th>领先 3–10%</th><th>领先 &gt;10%</th></tr></thead>\n        <tbody>\n          <tr><th class=\"rowh\">≥95%</th><td class=\"keep\">维持</td><td class=\"up-cell\">+5%</td><td class=\"up-cell\">+10%</td><td class=\"up-cell\">+15%</td><td class=\"up-cell\">+20%</td></tr>\n          <tr><th class=\"rowh\">85–95%</th><td class=\"keep\">维持</td><td class=\"up-cell\">+3%</td><td class=\"up-cell\">+5%</td><td class=\"up-cell\">+10%</td><td class=\"up-cell\">+15%</td></tr>\n          <tr><th class=\"rowh\">70–85%</th><td class=\"down-cell\">−5%</td><td class=\"down-cell\">−3%</td><td class=\"keep\">维持</td><td class=\"up-cell\">+5%</td><td class=\"up-cell\">+8%</td></tr>\n          <tr><th class=\"rowh\">55–70%</th><td class=\"down-cell\">−10%</td><td class=\"down-cell\">−5%</td><td class=\"down-cell\" data-hit>−3%</td><td class=\"keep\">维持</td><td class=\"up-cell\">+3%</td></tr>\n          <tr><th class=\"rowh\">40–55%</th><td class=\"down-cell\">−15%</td><td class=\"down-cell\">−10%</td><td class=\"down-cell\">−5%</td><td class=\"keep\">维持</td><td class=\"keep\">维持</td></tr>\n          <tr><th class=\"rowh\">&lt;40%</th><td class=\"down-cell\">−20%</td><td class=\"down-cell\">−15%</td><td class=\"down-cell\">−10%</td><td class=\"down-cell\">−5%</td><td class=\"keep\">维持</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <p>表 A 结论：<span class=\"down\">−3%</span>。<br>\n    表 I 结论：45 天落在 <b>31–60 天档</b>，落后触发阈值 25%，当前为<span class=\"up\">领先 2.4%</span> → 未触发。<br>\n    表 B 结论：预测 OCC 65.9% → <b>&lt;70% 档</b> → 不设限 / CTA 否 / 全开 + 上促销 / 不超售。</p>\n\n    <h4>③ 执行</h4>\n    <p>平峰 BAR ¥680 <span class=\"down\">↓3%</span> → ¥659.6 → 若按<b>向上</b>取整为 <b>¥660</b>（实际降幅仅 −2.9%）。<br>\n    <b>触发否决条件检查</b>：表 A 约束 2 规定每次调价幅度不低于 3%。取整后实际降幅 2.9% &lt; 3%，<b>违反约束 2，该取整结果不成立</b>。</p>\n    <div class=\"callout callout-danger\">\n      <span class=\"co-t\">示范的关键：取整方向错了，调价就不成立</span>\n      <p>取整后必须回算实际幅度。¥660 的实际幅度是 −2.9%，不足 3%，按表 A 约束 2「低于 3% 无市场感知，不算调价」，<b>不得落位</b>。正确做法是按本学院取整规则——<b>降价向下取整到 ¥10</b>——取 <b>¥650</b>（降幅 −4.4%，满足 ≥3%），执行 <b>¥680 → ¥650</b>。<br>\n      若出于挂牌美观考虑不愿用 ¥650，另一种合规做法是不调价、保持 ¥680，将该日写入《观察清单》，待 T-30（进入 15–30 天档）再查。</p>\n    </div>\n    <p>同时执行表 B「&lt;70% 档」动作：撤销该日全部限制条件、6 个渠道全开、上架促销产品。</p>\n\n    <h4>④ 记录</h4>\n    <p>写入《调价台账》：目标日 2026-11-04 / 预测提前期 T-45 / 预测 OCC 65.9% / Pickup 偏差 +2.4% / 原 BAR ¥680 / 新 BAR ¥650 / 依据《法典》表 A（55–70% × 持平±3%）/ 备注「降价向下取整至 ¥650，实际降幅 4.4%；同日执行表 B&lt;70% 档全开 + 上促销；表 I 31–60 天档未触发」。</p>\n\n    <h4>⑤ 事后判卷（目标日过后补填）</h4>\n    <div class=\"formula\">\n      假设 2026-11-04 实际售出 218 房晚，实际 OCC = 218 ÷ 320 = 68.1%<br>\n      准确率 = 1 − |65.9% − 68.1%| ÷ 68.1% = 1 − 3.23% = <span class=\"f-out\">96.8%</span><br>\n      T-30 合格线 85% → <span class=\"pill pill-teal\">达标</span>（T-45 早于 T-30，按更宽松的 T-30 线判）\n    </div>\n    <p>归因分类：本例偏差 2.2 个百分点、方向为低估，幅度 ≤10 个百分点 → <b>二级 · 超标</b>（低于 T-30 档 96.8%？不，96.8% ≥ 85% 达标）。重新判定：<b>一级 · 正常</b>，正常归档，无需说明。</p>\n  </div>\n\n  <\!-- ================= 十 ================= -->\n  <h2 id=\"s10\">十、学员跟练（7 题）</h2>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">跟练规则</span>\n    <p>独立完成，不讨论。每题限时 8 分钟。全部完成后对照折叠答案自评，错题须在《预测偏差台账》练习区重做一遍。数据源：<code>m05-pickup-dataset.xlsx</code>（模拟数据集）。</p>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 1 题　Pickup 与区间 Pickup</div>\n    <div class=\"q-b\">目标日 2026-10-25，10-18 08:00 在手 120 房晚，10-19 08:00 在手 127 房晚，10-20 08:00 在手 124 房晚。求：10-18→10-19、10-19→10-20 两段的区间 Pickup，以及 10-18→10-20 的合计 Pickup。并说明 10-20 当天发生了什么。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>10-18→10-19 = +7 房晚；10-19→10-20 = −3 房晚；合计 = +4 房晚</b>。<br>解析：区间 Pickup = 期末在手 − 期初在手。第一段 127 − 120 = +7；第二段 124 − 127 = −3。合计可直接用首尾相减：124 − 120 = +4，与分段相加（+7 − 3 = +4）一致。<b>10-20 当天净取消 3 间</b>（新增少于取消）。按表 4-4 的横读归因顺序，应首先排查是否有团队释放房量（退房），其次查当日是否有误设限制条件导致无法下单。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 2 题　《Pickup 追踪表》的对角线与填表</div>\n    <div class=\"q-b\">取数日 2026-09-20。表 5-1 中，目标日 2026-10-04 今天应填在哪一行？该行该列当前值是多少？到了 2026-09-27（7 天后），同一个目标日 2026-10-04 应填在哪一行？</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>09-20 时填在「提前 14 天」行，值 142 房晚；09-27 时填在「提前 7 天」行</b>。<br>解析：对角线条件为「目标日期 − 今天 = 该行的提前天数」。2026-10-04 − 2026-09-20 = 14 天 → 提前 14 天行，表 5-1 中该格为 142。7 天后是 09-27，2026-10-04 − 2026-09-27 = 7 天 → 提前 7 天行。这就是\"每天在同一条对角线上往下移一格\"的含义。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 3 题　《法典》表 I 的档位定位</div>\n    <div class=\"q-b\">以下四个目标日（取数日均为 2026-09-20），分别落在表 I 的哪一档？各自的监控频率是什么？① 2026-09-22　② 2026-09-25　③ 2026-10-01　④ 2026-12-15</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>① 0–3 天档，每日 2 次（10:00 / 17:00）；② 4–7 天档，每日 1 次；③ 8–14 天档，每日 1 次；④ &gt;60 天档，每月 1 次</b>。<br>解析：先算提前天数。09-22 − 09-20 = 2 天 → 0–3 天；09-25 − 09-20 = 5 天 → 4–7 天；10-01 − 09-20 = 11 天 → 8–14 天；12-15 − 09-20 = 86 天 → &gt;60 天。注意 09-20 当天为 0 天，落在 0–3 天档。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 4 题　预测三步法 · 平推 + 星期修正</div>\n    <div class=\"q-b\">目标日 2026-11-14（周六）。去年同日 2025-11-14（周五）实际售出 268 房晚，去年 T-30 在手 90 房晚；今年 T-30 在手 99 房晚。两年均为 D3 平峰日，无事件。可售房晚 320。求：预测总需求、预测 OCC、RW、Pickup 偏差，并查《法典》表 A 给出动作。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>预测总需求 277 房晚；预测 OCC 86.6%；RW 178 房晚；Pickup 偏差 +10.0%；表 A 结论 +10%（85–95% 行 × 领先 3–10% 列）</b>。<br>解析：第①步 268。第②步增量 = 99 − 90 = +9 → 277。曲线校验：99 ÷ 34% = 291；偏差 = |277 − 291| ÷ 291 = 4.8% ≤15%，通过。第③步：去年周五（周末）→ 今年周六（周末）→ 表 5-8 得 ×1.00；D3→D3 ×1.00；无事件 ×1.00 → 预测 277。预测 OCC = 277 ÷ 320 = 86.6%。RW = 277 − 99 = 178。Pickup 偏差 = 9 ÷ 90 = +10.0%，按表 A 列边界规则落在「领先 3–10%」（含端点）。OCC 86.6% 落 85–95% 行 → 交叉得 <b>+10%</b>。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 5 题　预测三步法 · 需求等级变动</div>\n    <div class=\"q-b\">目标日 2026-12-31（周四）。去年同日 2025-12-31（周三）为 D3 平峰日，实际售出 240 房晚，去年 T-30 在手 82 房晚。今年该日因跨年活动被判定为 <b>D1 峰值日</b>，今年 T-30 在手 96 房晚。无其他事件。可售房晚 320。求：预测总需求、预测 OCC、表 A 动作，并检查是否触及《SPEC》2.5 的 D1 价格系数区间。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>预测总需求 310 房晚；预测 OCC 96.9%；表 A 结论 +20%（≥95% 行 × 领先&gt;10% 列）；触及 D1 价格系数区间 150–200%，且必须由 L3 审批</b>。<br>解析：第①步 240。第②步增量 = 96 − 82 = +14 → 254。曲线校验：96 ÷ 34% = 282；偏差 = |254 − 282| ÷ 282 = 9.9% ≤15%，通过。第③步：去年周三（工作日）→ 今年周四（工作日）×1.00；D3 → D1 → 表 5-10 得 ×1.22；无事件 ×1.00。总系数 1.22。预测 = 254 × 1.22 = 309.9 → <b>310</b>。预测 OCC = 310 ÷ 320 = 96.9% → ≥95% 行。Pickup 偏差 = 14 ÷ 82 = +17.1% → 领先 &gt;10% 列。交叉得 <b>+20%</b>，恰好等于表 A 约束 1 的单日累计上限 20%，<b>当日不得再有第二次同向调价</b>。价格校验：平峰 BAR ¥680 × 150% = ¥1,020 起；+20% 后若原 BAR 已设为 ¥1,020，则新价 ¥1,224，仍在 D1 上限 ¥680 × 200% = ¥1,360 以内，可执行。按表 A 约束 4，D1 峰值日调价<b>必须</b>由 L3 收益经理审批。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 6 题　预测三步法 · 双向利空 + 已确认增量</div>\n    <div class=\"q-b\">目标日 2027-01-15（周五）。去年同日 2026-01-15（周四）为 D3 平峰日，实际售出 228 房晚，去年 T-30 在手 76 房晚。今年该日：① 落入 1 月淡季，判定为 <b>D4 低谷日</b>；② 3km 内新竞对开业满 5 个月；③ 工程部书面通知当日有 20 间 OOO 房（装修）；④ 某协议客户已书面确认锁房 30 间夜，<b>其中 12 间夜已在当前在手中</b>。今年 T-30 在手 70 房晚。求：预测总需求、可售房晚、预测 OCC。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>可售房晚 300；预测总需求 178 房晚；预测 OCC 59.3%；表 A 结论 −5%</b>。<br>解析：<br><b>第①步</b>：基准盘 = 去年同日实际 <b>228 房晚</b>。<br><b>第②步</b>：Pickup 增量 = 70 − 76 = <b>−6</b> → 未修正预测 = 228 − 6 = <b>222 房晚</b>。曲线校验：70 ÷ 34% = 206；偏差 = |222 − 206| ÷ 206 = 7.8% ≤15%，通过，取 222。<br><b>第③步（三项修正）</b>：星期几——去年周四（工作日）→ 今年周五（周末），查表 5-8 得 ×<b>1.06</b>；需求等级——D3 → D4，查表 5-10 得 ×<b>0.70</b>；事件——新竞对开业满 5 个月（4–6 个月区间），查表 5-11 得 ×<b>0.97</b>。总修正系数 = 1.06 × 0.70 × 0.97 = <b>0.72</b>。<br><b>已确认增量</b>：协议客户锁房 30 间夜，其中 12 间夜已计入当前在手（按\"不重复计入\"铁律不加），剩余 <b>18 间夜</b>尚未进在手，属必然发生的需求，<b>加回</b>。<br><b>预测总需求</b> = 222 × 0.72 + 18 = 159.8 + 18 = <b>178 房晚</b>。<br><b>可售房晚</b>：OOO 房 20 间改分母不改需求（表 5-11 第 4 行明确规定系数为 1.00）→ 320 − 20 = <b>300 房晚</b>。<br><b>预测 OCC</b> = 178 ÷ 300 = <b>59.3%</b>。<br>易错点：若误把 OOO 房当成需求系数处理，会算成 178 ÷ 320 = 55.6%，这是错的——OOO 房不卖，分母必须降，分子不能动。<br><b>表 A</b>：预测 OCC 59.3% → 55–70% 行；Pickup 偏差 =（70 − 76）÷ 76 = <b>−7.9%</b> → 落后 3–10% 列 → 交叉得 <b>−5%</b>。平峰 BAR ¥680 × 95% = ¥646 → 取整 <b>¥650</b>（实际降幅 −4.4%，满足 ≥3% 门槛）。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 7 题　预测准确率与偏差分级</div>\n    <div class=\"q-b\">目标日 2026-10-20 的四次预测与实际如下（实际 OCC 74.0%，实际 ADR ¥700，可售房晚 320）：<br>T-30 预测 OCC 78.1%　T-14 预测 OCC 76.5%　T-7 预测 OCC 75.2%　T-1 预测 OCC 74.8%<br>求：四次的预测准确率；判断各次是否达标；判断是否存在系统性偏差；算出 T-30 的高估损失。</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>T-30 = 94.5% 达标；T-14 = 96.6% 达标；T-7 = 98.4% 达标；T-1 = 98.9% 达标；四次全部高估但不构成系统性偏差；T-30 高估损失 ¥28.4</b>。<br>解析：准确率 = 1 − |预测 − 74.0%| ÷ 74.0%。<br>T-30：1 − 4.1 ÷ 74.0 = 1 − 5.54% = <b>94.5%</b>（合格线 85%，达标）<br>T-14：1 − 2.5 ÷ 74.0 = <b>96.6%</b>（合格线 90%，达标）<br>T-7：1 − 1.2 ÷ 74.0 = <b>98.4%</b>（合格线 93%，达标）<br>T-1：1 − 0.8 ÷ 74.0 = <b>98.9%</b>（合格线 97%，达标）<br>系统性偏差判定：四级要求「连续 3 日<b>同向</b>偏差且每日偏差 &gt; 5 个百分点」。本题四次偏差分别为 +4.1、+2.5、+1.2、+0.8 个百分点，虽同向但<b>均 ≤5 个百分点</b>，<b>不构成四级系统性偏差</b>。<br>高估损失 =（预测房晚 − 实际房晚）× 实际 ADR ÷ 可售房晚。实际房晚 = 74.0% × 320 = 236.8 → 237。T-30 预测房晚 = 78.1% × 320 = 249.9 → 250。损失 =（250 − 237）× 700 ÷ 320 = <b>¥28.4</b>。</div>\n    </details>\n  </div>\n\n  <\!-- ================= 十一 ================= -->\n  <h2 id=\"s11\">十一、判定表默写清单</h2>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">✎</span>当堂默写（限时 20 分钟，错一格不得进入下一课）</div>\n    <ul class=\"checklist\">\n      <li>《法典》表 I 六档窗口：0–3 天 / 4–7 天 / 8–14 天 / 15–30 天 / 31–60 天 / &gt;60 天</li>\n      <li>表 I 六档的监控频率：每日 2 次（10:00 / 17:00）/ 每日 1 次 / 每日 1 次 / 每周 2 次 / 每周 1 次 / 每月 1 次</li>\n      <li>表 I 六档的落后触发阈值：OCC&lt;70% / 落后 10% / 落后 15% / 落后 20% / 落后 25% / 落后 30%</li>\n      <li>表 I 六档的触发动作：上「今日特惠」尾房产品 / 启动 48h 闪购 / 执行表 A 调价 / 策略复盘 + 销售动员 / 启动协议客户拜访计划 / 上报 L3 调整年度策略</li>\n      <li>《法典》表 A 六行（预测 OCC 分档）：≥95% / 85–95% / 70–85% / 55–70% / 40–55% / &lt;40%</li>\n      <li>《法典》表 A 五列（Pickup 偏差分档）：落后 &gt;10% / 落后 3–10% / 持平 ±3% / 领先 3–10% / 领先 &gt;10%</li>\n      <li>《法典》表 A 五条执行约束：单日 ≤20%、24h ≤2 次 / 单次 ≥3% / 30 分钟内核 OTA 挂牌 / D1 调价须 L3 审批 / 全部写入《调价台账》</li>\n      <li>预测三步法总公式（含三项修正系数与已确认事件增量的位置）</li>\n      <li>预测准确率公式（分母为实际 OCC）</li>\n      <li>五档准确率合格线：T-30 ≥85% / T-14 ≥90% / T-7 ≥93% / T-3 ≥95% / T-1 ≥97%</li>\n      <li>云璟酒店预订基准曲线 9 个提前天数的累计占比：12 / 20 / 34 / 46 / 58 / 73 / 86 / 94 / 100（%）</li>\n      <li>《Pickup 追踪表》9 个提前天数行：60 / 45 / 30 / 21 / 14 / 7 / 3 / 1 / 0</li>\n    </ul>\n  </div>\n\n  <\!-- ================= 十二 ================= -->\n  <h2 id=\"s12\">十二、随堂测（5 题）</h2>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">及格线</span>\n    <p>5 题全对方可进入下一课（M06 价格体系设计）。错 1 题须重做本模块第 10 节学员跟练全部 7 题。</p>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 1 题</div>\n    <div class=\"q-b\">《法典》表 I 中，唯一一个用绝对 OCC 而不是相对落后幅度作为触发阈值的窗口档是哪一档？阈值是多少？触发动作是什么？</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>0–3 天档；阈值 OCC&lt;70%；触发动作是上「今日特惠」尾房产品</b>。<br>解析：其余五档（4–7 / 8–14 / 15–30 / 31–60 / &gt;60 天）用的都是相对落后百分比（10% / 15% / 20% / 25% / 30%）。只有 0–3 天档直接看绝对 OCC，因为距入住只剩 3 天时，\"比去年差多少\"已不重要，重要的是今晚还剩多少房。该档监控频率为每日 2 次（10:00 / 17:00）。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 2 题</div>\n    <div class=\"q-b\">预测三步法中，第 ② 步「加 Pickup 增量」的公式是什么？如果一个已确认的团队锁房 40 间夜中，有 40 间夜已经在当前在手（OTB）里，预测时该怎么处理？</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>Pickup 增量 = 今年在手房晚 − 去年同期同一提前窗口在手房晚；未修正预测 = 去年同期实际房晚 + Pickup 增量。40 间夜已全部在手时，不再额外加，即加 0</b>。<br>解析：依据表 5-11 下方\"事件修正三铁律\"第 2 条「不重复计入」：已确认的团队房晚如果已经进入 OTB，只能算一次。判据是查该团队的预订日期是否早于本次取数日。若早于，则已在手内，不得在\"加 Pickup 增量\"之外再加一遍。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 3 题</div>\n    <div class=\"q-b\">目标日预测 OCC 计算出来是 85.0%。查《法典》表 A 时，应归入哪一行？依据是什么？</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>归入 85–95% 行。依据：表 A 行区间在边界值重叠时，「取高档不取低档」</b>。<br>解析：表 A 的 70–85% 与 85–95% 在 85% 处重叠。规则规定 OCC 恰好等于 85% 时归入上一档（85–95%），恰好等于 95% 时归入 ≥95% 档。这条规则避免同一数值有两种读法，是\"不纠结\"的具体体现。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 4 题</div>\n    <div class=\"q-b\">某次调价：原 BAR ¥680，表 A 给出 −3%，算得 ¥659.6，取整为 ¥660。这个执行对不对？为什么？正确处理是什么？</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>不对。取整后实际降幅 =（680 − 660）÷ 680 = 2.9%，低于表 A 约束 2 规定的 3% 门槛，「低于 3% 无市场感知，不算调价」，本次调价不成立</b>。<br>解析：正确处理二选一并在《调价台账》注明：① 取整到 <b>¥655</b>（降幅 3.7%，满足 ≥3%）；② 不调价，保持 ¥680，将该日写入《观察清单》，待进入下一窗口档再查。核心教训：取整动作完成后必须回算实际幅度，取整不能吃掉调价下限。</div>\n    </details>\n  </div>\n\n  <div class=\"ex-q\">\n    <div class=\"q-t\">第 5 题</div>\n    <div class=\"q-b\">目标日预测 OCC 65.9%，Pickup 偏差 +2.4%，表 A 给出 −3%；同时《法典》表 B 在 &lt;70% 档给出「不设限 / 全开 + 上促销」，表 I 在 31–60 天档未触发。按《法典》表 O，当日应执行哪些动作？</div>\n    <details class=\"ex-a\">\n      <summary>查看答案与解析</summary>\n      <div class=\"a-body\">答案：<b>当日执行表 B 的库存动作（撤销全部限制条件、6 个渠道全开、上架促销产品）与表 A 的价格动作（−3%），两者不冲突；表 I 未触发，不执行</b>。<br>解析：表 O 的冲突处理铁律是「同日只执行优先级最高的那一条动作」，但这条只在<b>多张表给出不同（互斥）动作</b>时才生效。本题中表 B 给的是<b>库存动作</b>，表 A 给的是<b>价格动作</b>，两者作用于不同对象，不冲突，可以同日并行执行。真正会被\"搁置\"的是当两表对<b>同一对象</b>（例如都对价格、或都对渠道）给出不同结论时。另需注意：表 A 的 −3% 取整后若实际幅度 &lt;3%，则按约束 2 不执行，只执行表 B。</div>\n    </details>\n  </div>\n\n  <\!-- ================= 十三 ================= -->\n  <h2 id=\"s13\">十三、本模块产出物</h2>\n\n  <div class=\"callout callout-do\">\n    <span class=\"co-t\">结课交付清单（缺一项不予结课）</span>\n    <ul style=\"margin:6px 0 0\">\n      <li><b>《Pickup 追踪表》</b>——行＝提前天数 60/45/30/21/14/7/3/1/0，列＝未来 60 天目标日期，连续填写 14 个取数日（含今日对角线 9 格）</li>\n      <li><b>《去年同期 Pickup 追踪表》</b>——同结构，填去年同窗口在手</li>\n      <li><b>《Pickup 差值表》</b>——今年 − 去年，含 Pickup 偏差列与表 A 列定位</li>\n      <li><b>《预测修正模型表》</b>——内嵌表 5-8 星期几系数、表 5-9 等级中值、表 5-10 等级变动系数、表 5-11 事件系数、预订基准曲线（表 5-7）</li>\n      <li><b>《未来 30 天逐日预测表》</b>——每列一天，含预测总需求、预测 OCC、RW、日均必需进度、Pickup 偏差、表 A 结论、执行 BAR</li>\n      <li><b>《预测偏差台账》</b>——8 个固定字段，至少完成 30 个目标日的判卷记录</li>\n      <li><b>表 I 默写卷</b>——当堂完成，错一格重默</li>\n    </ul>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">→</span>下一模块预告</div>\n    <p>本模块解决了\"这个日子会卖多少\"。下一步要回答\"这个日子卖多少钱\"——M06 价格体系设计将把 BAR（最优可用房价 Best Available Rate）体系、《法典》表 F 房型价差阶梯、D1/D2/D3/D4 价格日历打标与衍生价格讲清楚。届时你会发现，M05 算出的预测 OCC 正是 M06 每一档价格系数的取值依据。</p>\n  </div>\n\n  <\!-- ===== 底部导航 ===== -->\n  <div class=\"p-title\">M04 报表与台账</div></a>\n    <a href=\"m06.html\" class=\"p-next\"><div class=\"p-dir\">下一模块 →</div><div class=\"p-title\">M06 价格体系设计</div></a>\n  </div>\n\n</div>\n"}]}, {"n": 6, "t": "动态定价", "part": "L2 主管", "mod": "模块 M06", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n  <\!-- ===== 页头 ===== -->\n  <div class=\"crumb\">\n    <a href=\"../index.html\">学院首页</a><span>/</span>\n    <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n    L2 模块六\n  </div>\n\n  <div class=\"page-head\">\n    <div class=\"badge-row\">\n      <span class=\"badge badge-l2\">L2 收益管理主管</span>\n      <span class=\"badge\">模块 M06</span>\n      <span class=\"badge\">6 课时 / 540 min</span>\n      <span class=\"badge\">占 L2 认证 18.75%</span>\n      <span class=\"badge\">前置 M05</span>\n    </div>\n    <h1 class=\"page-title\">价格体系设计：BAR 与价差阶梯</h1>\n    <p class=\"page-lede\">一句话导语：价格不是一个个拍脑袋报出来的数字，而是一套\"一个锚点 + 一张阶梯 + 一本日历 + 一组公式\"的结构。本模块把这套结构拆开，让你做到：任何一天、任何房型、任何客源，价格都能算出来、都能被审批、都能被追溯。</p>\n  </div>\n\n  <\!-- ===== 学习目标 ===== -->\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n    <ul>\n      <li>能<b>说出</b> BAR（最优可用房价 Best Available Rate）的定义、它在价格体系中的锚点作用，以及它与挂牌价的关系</li>\n      <li>能<b>完整默写并套用</b>《法典》表 F（房型价差阶梯表），并按每周一价差校验规则（&lt;8% 拉开、&gt;35% 收敛、套房 &lt;60% 提价）独立跑完一轮校验并给出调整后价格</li>\n      <li>能<b>独立搭建</b>全年 365 天的 D1/D2/D3/D4 四档价格日历，并按《SPEC》2.5 的价格系数区间给每一档定出具体系数取值</li>\n      <li>能<b>算出</b>会员价、协议价、早鸟价、最后一刻价、套餐价、长住价六类衍生价格，并说出各自的定价公式</li>\n      <li>能<b>判断</b>任意折扣应由哪一级审批（L1 / L2 / L3），并说出 D1 峰值日的特殊审批规则</li>\n    </ul>\n    <p class=\"card-note\">前置要求：M01 指标语言（ADR／RevPAR 口径）、M05 需求预测（预测 OCC 与 Pickup 偏差是本模块定档系数的输入）。</p>\n  </div>\n\n  <\!-- ===== 目录 ===== -->\n  <div class=\"toc\">\n    <div class=\"toc-title\">本模块目录</div>\n    <ol>\n      <li><a href=\"#s1\">BAR 体系：一个锚点撑起全部价格</a></li>\n      <li><a href=\"#s2\">《法典》表 F：房型价差阶梯表（完整内嵌）</a></li>\n      <li><a href=\"#s3\">每周一价差校验：跑一遍云璟酒店</a></li>\n      <li><a href=\"#s4\">价格日历：365 天的 D1/D2/D3/D4 打标</a></li>\n      <li><a href=\"#s5\">四档需求等级的价格系数取值判定</a></li>\n      <li><a href=\"#s6\">六类衍生价格：公式与定价</a></li>\n      <li><a href=\"#s7\">审批权限矩阵：谁有权批几折</a></li>\n      <li><a href=\"#s8\">讲师示范：一整天的价格体系落地</a></li>\n      <li><a href=\"#s9\">学员跟练（5 题）</a></li>\n      <li><a href=\"#s10\">判定表默写清单</a></li>\n      <li><a href=\"#s11\">随堂测（5 题）</a></li>\n      <li><a href=\"#s12\">本模块产出物</a></li>\n    </ol>\n  </div>\n\n  <\!-- ================= 一 ================= -->\n  <h2 id=\"s1\">一、BAR 体系：一个锚点撑起全部价格</h2>\n\n  "}, {"id": "p1", "name": "1 BAR 是什么", "min": 8, "desc": "", "html": "<h3>1.1 BAR 是什么</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">定义（《SPEC》3.1 逐字引用）</span>\n    BAR｜最优可用房价｜Best Available Rate｜公开可订的基准弹性价｜<span class=\"f-out\">所有折扣的锚点</span>\n  </div>\n\n  <p>拆开这句话，BAR 有四个特征，缺一不可：</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-1　BAR 的四个特征与判据</caption>\n      <thead><tr><th>特征</th><th>含义</th><th>判据（怎么验证一个价是不是 BAR）</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">公开可订</th><td>任何客人通过任何公开渠道都能订到，无需资质、无需代码、无需登录</td><td>用无痕浏览器、不登录、不输协议码，能查到并下单 → 是 BAR</td></tr>\n        <tr><th class=\"rowh\">基准</th><td>它是所有其他价格的参照原点，其他价格都表示为\"BAR 的百分之多少\"</td><td>能否写成「某价 = BAR × N%」？能 → 是 BAR</td></tr>\n        <tr><th class=\"rowh\">弹性</th><td>它随需求变化而变动，不是固定价</td><td>该价格是否被《法典》表 A 调价动作覆盖？是 → 是 BAR</td></tr>\n        <tr><th class=\"rowh\">唯一</th><td>同一房型、同一入住日，BAR 只有一个</td><td>同日同房型出现两个\"公开可订基准价\" → 体系已崩，须立即整改</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <p>杭州滨江云璟酒店的 BAR 基准：以<b>高级房 SUP（高级大床房 / 高级双床房）平峰日 BAR ¥680</b> 为整个价格体系的零点。《SPEC》2.1 中 10 个房型的平峰 BAR 与《法典》表 F 的价差系数，全部以这个 ¥680 为基准推导。</p>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">为什么选高级房做锚点</span>\n    <p>因为高级房 SUP-K（60 间）+ SUP-T（40 间）合计 <b>100 间</b>，占 320 间总房量的 <b>31.25%</b>，是房量最大的一档，也是成交最活跃的一档。用最大众的房型做锚点，价格变动对全店 ADR 的传导最直接、最容易观察。若用行政套房 STE-E（仅 2 间）做锚点，锚点本身就会被单笔订单扰动。</p>\n  </div>\n\n  "}, {"id": "p2", "name": "2 为什么所有折扣都必须锚定 BAR", "min": 8, "desc": "", "html": "<h3>1.2 为什么所有折扣都必须锚定 BAR</h3>\n\n  <p>三个原因，每一个都能量化：</p>\n\n  <div class=\"step\">\n    <div class=\"step-num\">1</div>\n    <div class=\"step-body\">\n      <h4>不锚定，就无法做置换分析</h4>\n      <p>《法典》表 G（团队／协议询价接受判定表）的输入 1 是「团队报价 ÷ 该日预期散客 ADR」的比率 R。分母\"预期散客 ADR\"的来源就是 BAR 体系。若团队价是\"拍出来的\"、散客价也是\"拍出来的\"，R 就无从计算，表 G 直接失效。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">2</div>\n    <div class=\"step-body\">\n      <h4>不锚定，就无法追责</h4>\n      <p>《调价台账》要求记录\"原 BAR / 新 BAR / 依据\"。若折扣是绝对数（如\"这张协议卡给 ¥520\"），需求等级一变，折扣力度就悄悄变了——D1 峰值日 BAR ¥1,360 时卖 ¥520 等于打 38 折，D4 低谷日 BAR ¥476 时卖 ¥520 等于加价 9%。写成\"BAR × 78%\"则任何一天力度恒定、可追溯。</p>\n    </div>\n  </div>\n\n  <div class=\"step\">\n    <div class=\"step-num\">3</div>\n    <div class=\"step-body\">\n      <h4>不锚定，价格一致性（Rate Parity）必然失守</h4>\n      <p>《法典》表 H 的定价一致性红线要求\"直销价不得高于任一 OTA 挂牌价\"。要让 6 个渠道的价同时可比，唯一可行的办法是所有渠道都以同一个 BAR 为分子、各自套自己的折扣公式。各渠道自行报价 = 一致性必然失守。</p>\n    </div>\n  </div>\n\n  "}, {"id": "p3", "name": "3 BAR 一天改几次", "min": 8, "desc": "", "html": "<h3>1.3 BAR 一天改几次</h3>\n\n  <p>这个问题必须有数字答案，不能是\"视情况而定\"。《法典》表 M 与表 A 合起来给出了确切结论：</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-2　BAR 调整时点与次数上限</caption>\n      <thead><tr><th>时点</th><th>动作</th><th>依据</th><th>次数上限</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">08:30 – 09:10</th><td>逐日查《法典》表 A/B/C/H，得出动作清单并落位</td><td>《法典》表 M（08:30 生成动作清单、09:10 执行）</td><td>每日第 1 个调价时点</td></tr>\n        <tr><th class=\"rowh\">17:00</th><td>0–3 天窗口二次巡检后的尾房调价</td><td>《法典》表 M（17:00 二次巡检）、表 I（0–3 天档每日 2 次）</td><td>每日第 2 个调价时点</td></tr>\n        <tr><th class=\"rowh\">任意时点</th><td>异常事件触发的紧急调价</td><td>《法典》表 L（2 小时内动作）</td><td>不受时点限制，但须 L3 审批</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-danger\">\n    <span class=\"co-t\">三条次数硬约束（《法典》表 A 执行约束）</span>\n    <ol style=\"margin:6px 0 0\">\n      <li>单日同方向累计调价 <b>不超过 20%</b>。</li>\n      <li>24 小时内同方向调价 <b>不超过 2 次</b>。</li>\n      <li>每次调价幅度 <b>不低于 3%</b>；低于 3% 不计为一次调价。</li>\n    </ol>\n    <p style=\"margin:8px 0 0\"><b>结论（可直接执行）</b>：常规作业下，BAR 每天在 <b>09:10</b> 与 <b>17:00</b> 两个时点调整；每个方向上 24 小时内最多调 2 次；单日同方向累计不超过 20%；单次幅度不低于 3%。异常事件（表 L）可在任意时点追加，但必须 L3 审批，且追加后仍受 20% 单日累计上限约束。</p>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">\"改了几次\"以《调价台账》为准</span>\n    <p>判断 24 小时内是否已调 2 次，唯一的依据是《调价台账》的记录条数，不是记忆。台账中同一目标日、同一调价方向的记录达 2 条时，第 3 次调价一律拒绝执行，改记入《观察清单》。</p>\n  </div>\n\n  "}, {"id": "p4", "name": "4 BAR 与挂牌价的关系", "min": 8, "desc": "", "html": "<h3>1.4 BAR 与挂牌价的关系</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">关系公式</span>\n    挂牌价（Rack Rate）= 该房型平峰 BAR × 挂牌价政策系数<br>\n    BAR ≤ 挂牌价（<span class=\"f-out\">BAR 只能在挂牌价以下浮动，永远不得高于挂牌价</span>）\n  </div>\n\n  <p>挂牌价是价格体系的<b>天花板</b>，一年固定不变；BAR 是<b>浮标</b>，在天花板以下随需求上下浮动。两者的分工是：挂牌价负责\"这个产品值多少钱\"的品牌表达，BAR 负责\"今天这个产品卖多少钱\"的收益表达。</p>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-3　云璟酒店挂牌价与平峰 BAR 对照<span class=\"cap-note\">挂牌价政策系数 = 115%（本店价格政策：在平峰 BAR 基础上上浮 15%，取整到 ¥10）；若本店另有规定，以其为准</span></caption>\n      <thead><tr><th>房型</th><th>房型代码</th><th class=\"num\">间数</th><th class=\"num\">平峰 BAR</th><th class=\"num\">挂牌价</th><th class=\"num\">BAR / 挂牌价</th></tr></thead>\n      <tbody>\n        <tr><td>标准大床房</td><td>STD-K</td><td class=\"num\">70</td><td class=\"num\">¥580</td><td class=\"num\">¥670</td><td class=\"num\">86.6%</td></tr>\n        <tr><td>标准双床房</td><td>STD-T</td><td class=\"num\">50</td><td class=\"num\">¥580</td><td class=\"num\">¥670</td><td class=\"num\">86.6%</td></tr>\n        <tr><td>高级大床房</td><td>SUP-K</td><td class=\"num\">60</td><td class=\"num\">¥680</td><td class=\"num\">¥780</td><td class=\"num\">87.2%</td></tr>\n        <tr><td>高级双床房</td><td>SUP-T</td><td class=\"num\">40</td><td class=\"num\">¥680</td><td class=\"num\">¥780</td><td class=\"num\">87.2%</td></tr>\n        <tr><td>豪华大床房</td><td>DLX-K</td><td class=\"num\">45</td><td class=\"num\">¥820</td><td class=\"num\">¥940</td><td class=\"num\">87.2%</td></tr>\n        <tr><td>豪华江景房</td><td>DLX-V</td><td class=\"num\">15</td><td class=\"num\">¥960</td><td class=\"num\">¥1,100</td><td class=\"num\">87.3%</td></tr>\n        <tr><td>行政大床房</td><td>EXE-K</td><td class=\"num\">25</td><td class=\"num\">¥990</td><td class=\"num\">¥1,140</td><td class=\"num\">86.8%</td></tr>\n        <tr><td>行政双床房</td><td>EXE-T</td><td class=\"num\">5</td><td class=\"num\">¥990</td><td class=\"num\">¥1,140</td><td class=\"num\">86.8%</td></tr>\n        <tr><td>商务套房</td><td>STE-B</td><td class=\"num\">8</td><td class=\"num\">¥1,280</td><td class=\"num\">¥1,470</td><td class=\"num\">87.1%</td></tr>\n        <tr><td>行政套房</td><td>STE-E</td><td class=\"num\">2</td><td class=\"num\">¥1,880</td><td class=\"num\">¥2,160</td><td class=\"num\">87.0%</td></tr>\n        <tr><th class=\"rowh\">合计</th><th class=\"rowh\">—</th><th class=\"rowh\">320</th><th class=\"rowh\">—</th><th class=\"rowh\">—</th><th class=\"rowh\">—</th></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">D1 峰值日的 BAR 会不会超过挂牌价？</span>\n    <p>会，而且必然。D1 峰值日价格系数为 150–200%（《SPEC》2.5），高级房 BAR 可达 ¥680 × 200% = <b>¥1,360</b>，远超挂牌价 ¥780。<b>这不是违规</b>——挂牌价约束的是\"常规销售价的天花板\"，而 D1 峰值日属《SPEC》2.5 明确规定的价格系数区间，是体系的合法延伸。处理规则：D1 峰值日 BAR 超过挂牌价时，挂牌价<b>不上调</b>（保持品牌表达稳定），但在价格日历中须为该日打上「D1 峰值日」标签，且按《法典》表 A 约束 4，调价必须由 L3 收益经理审批。</p>\n  </div>\n\n  <\!-- ================= 二 ================= -->\n  <h2 id=\"s2\">二、《法典》表 F：房型价差阶梯表（完整内嵌）</h2>\n\n  <div class=\"codex-block\" data-codex-block data-cat=\"pricing\">\n    <div class=\"codex-head\">\n      <span class=\"badge-codex\">表 F</span>\n      "}, {"id": "p5", "name": "房型价差阶梯表", "min": 8, "desc": "", "html": "<h3>房型价差阶梯表</h3>\n      <span class=\"pill pill-navy\">以高级房 BAR 为 100</span>\n    </div>\n    <p class=\"codex-desc\">基准：高级房 SUP 平峰 BAR = ¥680，系数 = 100。其余房型按系数换算。</p>\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <thead><tr><th>房型</th><th class=\"num\">系数</th><th class=\"num\">相对高级房差价（平峰 BAR ¥680 时）</th></tr></thead>\n        <tbody>\n          <tr><th class=\"rowh\">标准房 STD</th><td class=\"num\">85</td><td class=\"num\">−¥100</td></tr>\n          <tr><th class=\"rowh\">高级房 SUP</th><td class=\"num\" data-hit>100</td><td class=\"num\">基准</td></tr>\n          <tr><th class=\"rowh\">豪华房 DLX</th><td class=\"num\">120</td><td class=\"num\">+¥140</td></tr>\n          <tr><th class=\"rowh\">豪华江景 DLX-V</th><td class=\"num\">140</td><td class=\"num\">+¥260</td></tr>\n          <tr><th class=\"rowh\">行政房 EXE</th><td class=\"num\">145</td><td class=\"num\">+¥310</td></tr>\n          <tr><th class=\"rowh\">商务套房 STE-B</th><td class=\"num\">180</td><td class=\"num\">+¥600</td></tr>\n          <tr><th class=\"rowh\">行政套房 STE-E</th><td class=\"num\">265</td><td class=\"num\">+¥1,200</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <div class=\"codex-meta\">\n      <b>附加项</b>：高楼层 +5%；江景/特色景观 +10%；含早 +¥68/人；连通房 +¥50；加床 +¥180。<br>\n      <b>价差校验规则（每周一执行）</b>：<br>\n      · 相邻房型价差 &lt;8% → 拉开价差（降下一档或提上一档）<br>\n      · 相邻房型价差 &gt;35% → 收敛价差（提下一档）<br>\n      · 套房与最高房型价差 &lt;60% → 提套房价\n    </div>\n  </div>\n\n  "}, {"id": "p6", "name": "1 系数怎么换算成钱", "min": 8, "desc": "", "html": "<h3>2.1 系数怎么换算成钱</h3>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">换算公式</span>\n    某房型平峰 BAR = 高级房平峰 BAR ¥680 ×（该房型系数 ÷ 100）<br>\n    例：豪华房 DLX 系数 120 → ¥680 × 1.20 = <span class=\"f-out\">¥816 ≈ ¥820</span>（《SPEC》2.1 表列 ¥820，取整到 ¥10）\n  </div>\n\n  <p>《SPEC》2.1 给出的平峰 BAR 与《法典》表 F 系数换算结果存在小额取整差异（如 DLX 系数换算 ¥816，表列 ¥820；STE-E 换算 ¥1,802，表列 ¥1,880）。<b>处理规则：以《SPEC》2.1 的平峰 BAR 数字为准做定价，以《法典》表 F 的系数为准做价差校验。</b>两者冲突时，定价用 SPEC 数字，校验用系数比例。</p>\n\n  "}, {"id": "p7", "name": "2 附加项：五个加价的叠加规则", "min": 8, "desc": "", "html": "<h3>2.2 附加项：五个加价的叠加规则</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-4　附加项加价规则与叠加顺序</caption>\n      <thead><tr><th>附加项</th><th class=\"num\">加价</th><th>叠加方式</th><th>示例（高级房平峰 BAR ¥680）</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">高楼层</th><td class=\"num\">+5%</td><td>乘（在房型 BAR 之上）</td><td>¥680 × 1.05 = ¥714</td></tr>\n        <tr><th class=\"rowh\">江景 / 特色景观</th><td class=\"num\">+10%</td><td>乘（在房型 BAR 之上）</td><td>¥680 × 1.10 = ¥748</td></tr>\n        <tr><th class=\"rowh\">含早</th><td class=\"num\">+¥68/人</td><td>加（按实际入住人数）</td><td>¥680 + ¥68 = ¥748（1 人）</td></tr>\n        <tr><th class=\"rowh\">连通房</th><td class=\"num\">+¥50</td><td>加（按间）</td><td>¥680 + ¥50 = ¥730</td></tr>\n        <tr><th class=\"rowh\">加床</th><td class=\"num\">+¥180</td><td>加（按床，含早）</td><td>¥680 + ¥180 = ¥860</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">叠加顺序（先乘后加，不得颠倒）</span>\n    最终房价 = 房型 BAR ×（1 + 高楼层 5%）×（1 + 江景 10%）+ 含早 ¥68 × 人数 + 连通房 ¥50 + 加床 ¥180<br>\n    例：豪华江景房（高楼层）+ 双人含早 + 连通房<br>\n    = ¥960 × 1.05 × 1.10 + ¥68 × 2 + ¥50 = ¥1,108.8 + ¥136 + ¥50 → <span class=\"f-out\">¥1,295</span>\n  </div>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">为什么必须先乘后加</span>\n    <p>百分比附加项（高楼层、江景）是<b>对房型价值的比例加价</b>，应随房型 BAR 一起被需求等级系数放大；固定金额附加项（含早、连通房、加床）是<b>成本驱动的固定加价</b>，不随需求等级放大。若先加后乘，D1 峰值日（系数 200%）时早餐会被算成 ¥136/人，而早餐实际成本不变——这是错的。先乘后加，早餐永远是 ¥68/人。</p>\n  </div>\n\n  <p>另需注意：《SPEC》2.1 规定自助早餐门市价 ¥128/人，含早附加仅 ¥68/人，即<b>早餐实际按 53 折卖给客房客人</b>（68 ÷ 128 = 53.1%）。这是全服务酒店的通行做法，用早餐差价换取客房竞争力；餐饮部已按此口径计入《SPEC》2.3 的餐饮收入 ¥28,600,000。</p>\n\n  <\!-- ================= 三 ================= -->\n  <h2 id=\"s3\">三、每周一价差校验：跑一遍云璟酒店</h2>\n\n  <p>《法典》表 N 规定：每周一执行「房型价差校验（表 F）」，产出《周度收益报告》。这一节把云璟酒店平峰日（D3，价格系数 100%）的价格序列完整跑一遍校验。</p>\n\n  <h3>3.1 校验对象与数据</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-5　云璟酒店平峰日（D3）各房型实际 BAR 序列 · 校验前</caption>\n      <thead><tr><th>房型</th><th>房型代码</th><th class=\"num\">间数</th><th class=\"num\">平峰 BAR</th><th class=\"num\">相对上一档价差</th><th>判定</th></tr></thead>\n      <tbody>\n        <tr><td>标准房</td><td>STD</td><td class=\"num\">120</td><td class=\"num\">¥580</td><td class=\"num\">—</td><td>基准起点</td></tr>\n        <tr><td>高级房</td><td>SUP</td><td class=\"num\">100</td><td class=\"num\">¥680</td><td class=\"num\">+17.2%</td><td><span class=\"pill pill-teal\">合格</span>（8%–35%）</td></tr>\n        <tr><td>豪华房</td><td>DLX</td><td class=\"num\">45</td><td class=\"num\">¥820</td><td class=\"num\">+20.6%</td><td><span class=\"pill pill-teal\">合格</span>（8%–35%）</td></tr>\n        <tr><td>豪华江景房</td><td>DLX-V</td><td class=\"num\">15</td><td class=\"num\">¥960</td><td class=\"num\">+17.1%</td><td><span class=\"pill pill-teal\">合格</span>（8%–35%）</td></tr>\n        <tr><td>行政房</td><td>EXE</td><td class=\"num\">30</td><td class=\"num\">¥990</td><td class=\"num\" data-hit>+3.1%</td><td><span class=\"pill pill-red\">不合格</span>（&lt;8%）</td></tr>\n        <tr><td>商务套房</td><td>STE-B</td><td class=\"num\">8</td><td class=\"num\">¥1,280</td><td class=\"num\">+29.3%</td><td><span class=\"pill pill-teal\">合格</span>（8%–35%）</td></tr>\n        <tr><td>行政套房</td><td>STE-E</td><td class=\"num\">2</td><td class=\"num\">¥1,880</td><td class=\"num\" data-hit>+46.9%</td><td><span class=\"pill pill-red\">不合格</span>（&gt;35%）</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <p style=\"font-size:13px;color:var(--ink-3)\">STD 间数 = STD-K 70 + STD-T 50 = 120；SUP = 60 + 40 = 100；EXE = 25 + 5 = 30；合计 320。</p>\n\n  <div class=\"formula\">\n    <span class=\"f-label\">价差公式</span>\n    相邻房型价差 =（较高档价格 − 较低档价格）÷ <span class=\"f-out\">较低档价格</span> × 100%<br>\n    例：DLX-V → EXE =（990 − 960）÷ 960 × 100% = <span class=\"f-out\">3.1%</span>\n  </div>\n\n  <div class=\"callout callout-warn\">\n    <span class=\"co-t\">分母是哪一档</span>\n    <p>分母固定为<b>较低档</b>价格，不是较高档，也不是两者平均。三条校验规则（&lt;8% / &gt;35% / &lt;60%）全部用这个口径，全学院统一。用错分母，8% 与 35% 两条线会同时错位。</p>\n  </div>\n\n  <h3>3.2 逐条执行校验规则</h3>\n\n  <h4>不合格项 1：DLX-V → EXE 价差 3.1% &lt; 8% → 拉开价差</h4>\n\n  <div class=\"callout callout-key\">\n    <span class=\"co-t\">二选一的判定规则（不许\"看情况\"）</span>\n    <p>《法典》表 F 写的是「降下一档或提上一档」，二选一必须有判据。判据是<b>近 7 日售罄速度</b>：</p>\n    <div class=\"formula\" style=\"margin:10px 0 0\">\n      若 EXE 近 7 日平均 OCC &gt; DLX-V 近 7 日平均 OCC → <b>提上一档（EXE）</b><br>\n      若 EXE 近 7 日平均 OCC ≤ DLX-V 近 7 日平均 OCC → <b>降下一档（DLX-V）</b>\n    </div>\n    <p style=\"margin:10px 0 0\">逻辑：哪一档卖得更快，说明哪一档还有提价空间，就动那一档；反过来则说明该档价格已经偏高，应降价。绝不动卖得慢的那一档的价格去\"凑数\"。</p>\n  </div>\n\n  <div class=\"kv\">\n    <div class=\"kv-row\"><div class=\"kv-k\">实测数据</div><div class=\"kv-v\">近 7 日 EXE 平均 OCC <b>88%</b>（30 间 × 7 天 = 210 间夜，售出 185 间夜）；DLX-V 平均 OCC <b>71%</b>（15 间 × 7 天 = 105 间夜，售出 75 间夜）</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">判定</div><div class=\"kv-v\">88% &gt; 71% → <b>提上一档（EXE）</b></div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">计算</div><div class=\"kv-v\">EXE 新价 = DLX-V ¥960 ×（1 + 8%）= ¥1,036.8 → 取整到 ¥10 → <b>¥1,040</b></div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">复校</div><div class=\"kv-v\">（1,040 − 960）÷ 960 = <b>8.3%</b> → ≥8%，<span class=\"pill pill-teal\">达标</span></div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">新系数</div><div class=\"kv-v\">¥1,040 ÷ ¥680 × 100 = <b>153</b>（原 145）</div></div>\n  </div>\n\n  <h4>不合格项 2：STE-B → STE-E 价差 46.9% &gt; 35% → 收敛价差（提下一档）</h4>\n\n  <div class=\"kv\">\n    <div class=\"kv-row\"><div class=\"kv-k\">规则</div><div class=\"kv-v\">&gt;35% 时的动作唯一，即「提下一档」——提高较低档（STE-B），把价差压到 ≤35%。没有第二种选择。</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">计算</div><div class=\"kv-v\">STE-B 新价 ≥ STE-E ¥1,880 ÷（1 + 35%）= ¥1,392.6 → 取整到 ¥10，且必须 ≥1,392.6 → <b>¥1,400</b>（取 ¥1,390 会使价差为 35.3%，仍超标）</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">复校</div><div class=\"kv-v\">（1,880 − 1,400）÷ 1,400 = <b>34.3%</b> → ≤35%，<span class=\"pill pill-teal\">达标</span></div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">新系数</div><div class=\"kv-v\">¥1,400 ÷ ¥680 × 100 = <b>206</b>（原 180）</div></div>\n  </div>\n\n  <h4>规则 3：套房与最高房型价差 &lt;60% → 提套房价</h4>\n\n  <div class=\"kv\">\n    <div class=\"kv-row\"><div class=\"kv-k\">口径</div><div class=\"kv-v\">「套房」取套房序列最高档 <b>STE-E 行政套房</b>；「最高房型」取<b>最高非套房房型 EXE 行政房</b>。这两档之间的差距代表\"升级到套房的溢价感\"，必须 ≥60%，否则客人不愿为套房付费，免费升级（表 J）也没有价值感。</div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">实测</div><div class=\"kv-v\">（¥1,880 − ¥1,040）÷ ¥1,040 = <b>80.8%</b></div></div>\n    <div class=\"kv-row\"><div class=\"kv-k\">判定</div><div class=\"kv-v\">80.8% ≥ 60% → <span class=\"pill pill-teal\">达标</span>，本条<b>无需动作</b></div></div>\n  </div>\n\n  <h3>3.3 校验后价格序列与全表复校</h3>\n\n  <div class=\"tbl-wrap\">\n    <table class=\"tbl\">\n      <caption>表 6-6　云璟酒店平峰日（D3）各房型 BAR 序列 · 校验后</caption>\n      <thead><tr><th>房型</th><th class=\"num\">间数</th><th class=\"num\">校验前</th><th class=\"num\">校验后</th><th>调整</th><th class=\"num\">新价差</th><th>判定</th></tr></thead>\n      <tbody>\n        <tr><th class=\"rowh\">标准房 STD</th><td class=\"num\">120</td><td class=\"num\">¥580</td><td class=\"num\">¥580</td><td class=\"flat\">－不变</td><td class=\"num\">—</td><td>起点</td></tr>\n        <tr><th class=\"rowh\">高级房 SUP</th><td class=\"num\">100</td><td class=\"num\">¥680</td><td class=\"num\">¥680</td><td class=\"flat\
