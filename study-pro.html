tr><th style=\"width:88px\">部门</th><th>他的 KPI</th><th>他的痛点</th><th>你要他配合什么</th><th>怎么让他愿意</th></tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td><b>销售部</b><br><span class=\"pill pill-red\">最难</span></td>\n        <td>客房产量、团队间夜、客户满意度、应收账款</td>\n        <td>好不容易谈来的客户被收益拒了，面子上过不去</td>\n        <td>询价先过收益；按表 G 报价；大单提前 30 天报备</td>\n        <td><b>给明确规则 + 给谈判空间</b>。不是一刀切拒绝，而是告诉他「谈到多少我立刻签」。把置换成本公式教给他，让他自己能算。</td>\n      </tr>\n      <tr>\n        <td><b>前厅部</b><br><span class=\"pill pill-amber\">最频繁</span></td>\n        <td>客人满意度、投诉率、升级体验、入住效率</td>\n        <td>客人闹起来是他们扛，收益却在楼上算数字</td>\n        <td>按表 J 升级；不私自放价；不私自放房给上门客</td>\n        <td><b>把规则做成卡片</b>，贴在他们工位上，让他们不用动脑就能执行。另外给激励（月度表扬、绩效挂钩）。</td>\n      </tr>\n      <tr>\n        <td><b>预订部</b></td>\n        <td>接单量、转化率、出错率</td>\n        <td>限制条件太复杂，一不小心就卖错价，最后背锅</td>\n        <td>准确落地限制条件；发现异常立刻反馈；不擅自取消订单</td>\n        <td>把限制条件做成<b>每日一张表</b>（哪天 MinLOS 几晚、哪天 CTA），每天 09:40 前发到群里。别让他们去系统里猜。</td>\n      </tr>\n      <tr>\n        <td><b>市场部</b></td>\n        <td>曝光量、粉丝增长、直销占比、活动 ROI</td>\n        <td>投了广告不知道有没有带来订单，考核说不清</td>\n        <td>一起做直销；配合会员专享价；同步大型活动信息</td>\n        <td><b>给他数据</b>。每月告诉他直销占比涨了多少、其中多少来自他投的渠道。让他能拿这个去邀功。</td>\n      </tr>\n      <tr>\n        <td><b>财务部</b></td>\n        <td>报表准确性、成本控制、合规</td>\n        <td>收益的报表和他的对不上，月结时被追问</td>\n        <td>口径一致；数据可核查；差异提前说明</td>\n        <td><b>主动对齐口径</b>。尤其要说明「我把装修房从分母剔除了」这类差异，别等他来问。每月 1 日主动发一次口径说明。</td>\n      </tr>\n      <tr>\n        <td><b>餐饮宴会部</b></td>\n        <td>餐饮收入、翻台率、宴会承接量、毛利率</td>\n        <td>客房为了保房价把会议拒了，餐饮收入跟着没了</td>\n        <td>一起用表 K 算综合贡献；同步满房日；配合做打包产品</td>\n        <td><b>用表 K 把决策权分给他一半</b>。让他先报餐饮保底能力，你再算客房置换成本。他会发现你在替他争取生意，而不是在挡他。</td>\n      </tr>\n    </tbody>\n  </table>\n</div>\n\n<div class=\"callout callout-key\">\n  <span class=\"co-t\">一句话总结</span>\n  <p>\n    这六个部门没有一个是你的敌人，<b>只是 KPI 不一样</b>。<br>\n    销售要产量，你要价格；前厅要满意，你要规则；宴会要收入，你要置换成本。<br>\n    <b>协同的本质不是说服对方接受你的目标，而是找到一个双方 KPI 都能受益的方案。</b>\n  </p>\n</div>\n\n<\!-- ============ 二、异议应对库 ============ -->\n"}, {"id": "p2", "name": "二、异议应对库（14 组）", "min": 8, "desc": "", "html": "<h2 id=\"s2\">二、异议应对库（14 组）</h2>\n<p>\n  这些话术要练到能脱口而出。<b>课上两两对练，站起来说，不许笑场。</b>\n  每一组都遵循同一结构：<b>共情 → 算账 → 给方案 → 留余地</b>。\n</p>\n\n<h3>销售篇（4 组）</h3>\n<div class=\"dialogue\">\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 1</div><div class=\"dlg-text\">\n    <b>销售：</b>「这个客户跟了三年，不能拒。」<br>\n    <b>你：</b>「我理解，跟了三年的客户确实不能随便丢。我算了笔账：那天预测 OCC 88%，\n    预期散客 ADR ¥680，80 间的置换成本是 2 万 4。<b>谈到 ¥520 我立刻签</b>，\n    或者减到 30 间、¥380 也行。你拿着这两个方案去谈，比空手回去好说话。」\n  </div></div>\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 2</div><div class=\"dlg-text\">\n    <b>销售：</b>「你不接，客户就去隔壁了。」<br>\n    <b>你：</b>「去隔壁，我们这 2 万 4 的置换成本变成 0，一分钱收入都没有。\n    不如各让一步——我给 ¥500，你去谈。谈成了我们少亏 1 万 4，比全丢强。」\n  </div></div>\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 3</div><div class=\"dlg-text\">\n    <b>销售：</b>「旺季反正空着也是空着。」<br>\n    <b>你：</b>「现在不是空着，是留给散客的。预测 OCC 88%，按现在的 Pickup 速度，\n    这些房在入住前 7 天大概率能卖到 ¥680。<b>我们先挂 ¥520 的团队保留房，\n    到提前 7 天如果散客没起来，我无条件放给你。</b>」\n  </div></div>\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 4</div><div class=\"dlg-text\">\n    <b>销售：</b>「你总是拿表压我，表是人定的。」<br>\n    <b>你：</b>「表确实是人定的，但不是我定的，是我们一起校准的。\n    上个月表 G 的命中率是 78%，说明它在这家店是准的。<b>如果你觉得哪个阈值不对，\n    我们拿三个月的真实数据回来重算</b>——我随时愿意改，但今天这一单请先按表来。」\n  </div></div>\n</div>\n\n<h3>前厅篇（2 组）</h3>\n<div class=\"dialogue\">\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 5</div><div class=\"dlg-text\">\n    <b>前厅：</b>「客人都站前台了，你不给他升级说不过去。」<br>\n    <b>你：</b>「按表 J，顺序是钻石 &gt; 铂金 &gt; 金 &gt; 银。今天在住有两位铂金还没升，\n    他们 18 点前到。<b>这位金卡我给双早 + 延迟退房</b>，成本 ¥136，\n    比升一档（¥140）还低，客人却拿到两样东西。」\n  </div></div>\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 6</div><div class=\"dlg-text\">\n    <b>前厅：</b>「就这一间套房，通融一下。」<br>\n    <b>你：</b>「今天套房已经升了 3 间，是表 J 的上限。<b>再升要 L3 批，我现在就打电话。</b>\n    不过更快的办法：给他行政房 + 双早 + 欢迎果盘，成本差不多，客人体验也不差。」\n  </div></div>\n</div>\n\n<h3>总经理 / 业主篇（4 组）</h3>\n<div class=\"dialogue\">\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 7</div><div class=\"dlg-text\">\n    <b>总经理：</b>「隔壁降价了，我们为什么不降？」<br>\n    <b>你：</b>「我们 MPI 105，份额还在涨，说明客人没被抢走。跟降到 ¥480，\n    ARI 会从 91 掉到 71，表 C 判定『严重偏低』——<b>全年少收约 300 万</b>。\n    建议加价值不降价：含早、升级、延迟退房，成本不到 ¥150。」\n  </div></div>\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 8</div><div class=\"dlg-text\">\n    <b>总经理：</b>「这个月必须完成预算。」<br>\n    <b>你：</b>「可以。需要把 OTA 深折开到 55%、并上一波长住产品。\n    <b>代价是 ADR 掉约 8%，GOP 掉约 5%</b>。您确认的话我今天就执行，\n    但要注意这会影响 12 月的价格体系，明年 1 月要花时间修复。」\n  </div></div>\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 9</div><div class=\"dlg-text\">\n    <b>业主：</b>「RevPAR 涨了 5%，为什么利润没涨？」<br>\n    <b>你：</b>「因为渠道结构变了。OTA 占比从 28% 升到 33%，\n    佣金多付了约 40 万。<b>RevPAR 涨 5%，但 NRevPAR 只涨 1.8%。</b>\n    下个月我把 OTA 压回 28%，利润就回来了——这需要市场部配合做直销，我已经约了他。」\n  </div></div>\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 10</div><div class=\"dlg-text\">\n    <b>业主：</b>「你这套表，换个城市还管用吗？」<br>\n    <b>你：</b>「方法管用，阈值要重算。这套表是按我们店的 No-show 率、\n    提前窗口和竞争组合校准的。<b>换城市我会用三个月数据重新标定表 E 和表 C</b>，\n    表 A 和表 O 的逻辑不用动——那是通用的。」\n  </div></div>\n</div>\n\n<h3>其他部门篇（4 组）</h3>\n<div class=\"dialogue\">\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 11</div><div class=\"dlg-text\">\n    <b>财务：</b>「你的预测不准。」<br>\n    <b>你：</b>「上月准确率 95.7%，合格线是当月 ±3%。<b>这是逐日的明细表</b>，\n    偏差超过 8% 的有 3 天，都是展会临时加场导致的——这部分我需要销售提前同步信息，\n    已经在周会上提了。」\n  </div></div>\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 12</div><div class=\"dlg-text\">\n    <b>财务：</b>「两边报表对不上。」<br>\n    <b>你：</b>「口径差异在这里：<b>我把 12 间装修房从可售房量里剔除了</b>，\n    所以我的 OCC 比你算的高 3.9%。要不要统一？我建议统一按可售房量算，\n    这也是行业标准口径。」\n  </div></div>\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 13</div><div class=\"dlg-text\">\n    <b>宴会：</b>「这个 200 人的会议，客房为什么不能便宜点？」<br>\n    <b>你：</b>「按表 K，我们算综合贡献。你先告诉我：餐饮能做到多少保底？\n    <b>如果能做到 ¥8 万，那客房哪怕按 ¥400 给我都能接</b>——\n    因为综合贡献已经超过置换成本了。你报个数，我来算。」\n  </div></div>\n  <div class=\"dlg-row\"><div class=\"dlg-who\">异议 14</div><div class=\"dlg-text\">\n    <b>市场：</b>「我要投 10 万做 OTA 广告。」<br>\n    <b>你：</b>「先看数据：我们 OTA 占比已经 31%，佣金成本一年 900 万。\n    <b>投 OTA 广告会继续推高这个占比。</b>建议分 6 万给直销小程序，4 万给 OTA。\n    我每月给你直销占比的变化数据，一个季度后看哪个 ROI 高，再决定下一步。」\n  </div></div>\n</div>\n\n<\!-- ============ 三、推动工具 ============ -->\n"}, {"id": "p3", "name": "三、推动工具箱", "min": 8, "desc": "", "html": "<h2 id=\"s3\">三、推动工具箱</h2>\n<p>光靠嘴说没用，要有<b>工具</b>。这四个工具组合起来用，效果最好。</p>\n\n<div class=\"grid grid-2\">\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▦</span>数据看板</div>\n    <p style=\"font-size:13.5px;color:var(--ink-2)\">\n      一张所有人都看得懂的看板，每天更新，放在公共区域（或群里）。<br>\n      <b>只放 5 个数字</b>：今日 OCC、本月累计 RevPAR、本月达成率、MPI、直销占比。<br>\n      作用：让所有部门随时看到进展，你不用说第二遍。\n    </p>\n    <p class=\"card-note\">关键：<b>要看板替你说话</b>，而不是你每天去催。</p>\n  </div>\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">▤</span>月度排名</div>\n    <p style=\"font-size:13.5px;color:var(--ink-2)\">\n      每月公布各部门的协同指标排名：销售的团队价达标率、前厅的升级合规率、\n      预订的限制条件执行准确率、市场的直销贡献。<br>\n      作用：<b>把协同变成可比较的东西</b>，没人愿意排最后。\n    </p>\n    <p class=\"card-note\">注意：排名要<b>先公示规则</b>，不能突然拿出来。</p>\n  </div>\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◆</span>激励挂钩</div>\n    <p style=\"font-size:13.5px;color:var(--ink-2)\">\n      把收益指标写进相关部门的 KPI：前厅的直销占比、销售的团队平均价、\n      市场的直销贡献、宴会的会议综合贡献。<br>\n      作用：<b>数据让人服，利益让人动。</b>不挂钩，协同永远靠人情。\n    </p>\n    <p class=\"card-note\">这需要总经理支持——在月度会上提，作为你的「一个请求」。</p>\n  </div>\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">◈</span>案例复盘会</div>\n    <p style=\"font-size:13.5px;color:var(--ink-2)\">\n      每季度一次，讲一个真实案例：「上个月那个 200 人会议，我们怎么算的综合贡献、\n      做对了什么、如果重来会怎么改」。<br>\n      作用：<b>让其他部门理解你的思维方式</b>，而不只是服从你的结论。\n    </p>\n    <p class=\"card-note\">会上要<b>表扬具体的部门</b>，别只讲自己的功劳。</p>\n  </div>\n</div>\n\n<\!-- ============ 四、变革六步 ============ -->\n"}, {"id": "p4", "name": "四、变革落地六步", "min": 8, "desc": "", "html": "<h2 id=\"s4\">四、变革落地六步</h2>\n<p>从「没人听你的」到「他们主动来找你」，通常需要 <b>3–6 个月</b>。前两个月最难。</p>\n\n<div class=\"timeline\">\n  <div class=\"tl-item\">\n    <div class=\"tl-time\">第 1 步 · 第 1–4 周</div>\n    <div class=\"tl-body\"><b>先做出成绩</b>。挑一个最容易见效的点（推荐：价格一致性核查），\n    两周内做出结果，用数据证明你有用。<b>别一上来就改大事。</b></div>\n  </div>\n  <div class=\"tl-item\">\n    <div class=\"tl-time\">第 2 步 · 第 3–6 周</div>\n    <div class=\"tl-body\"><b>把数据公开</b>。做一张看板，每天更新，放在所有人都能看到的地方。\n    透明是最快的信任建立方式。</div>\n  </div>\n  <div class=\"tl-item\">\n    <div class=\"tl-time\">第 3 步 · 持续</div>\n    <div class=\"tl-body\"><b>说话算数</b>。承诺的每一个动作都要有结果；做不到就<b>提前说</b>，\n    不要事后解释。一次失信，前面全部白做。</div>\n  </div>\n  <div class=\"tl-item\">\n    <div class=\"tl-time\">第 4 步 · 第 2–3 个月</div>\n    <div class=\"tl-body\"><b>把规则写进制度</b>。从「收益说要这样」变成「公司规定这样」。\n    这一步必须总经理点头，所以在月度会上提请求。</div>\n  </div>\n  <div class=\"tl-item\">\n    <div class=\"tl-time\">第 5 步 · 第 3–4 个月</div>\n    <div class=\"tl-body\"><b>把利益挂钩</b>。让相关部门的 KPI 里有收益指标。\n    到这一步，协同才从「配合你」变成「为了自己」。</div>\n  </div>\n  <div class=\"tl-item\">\n    <div class=\"tl-time\">第 6 步 · 第 4–6 个月</div>\n    <div class=\"tl-body\"><b>培养盟友</b>。先搞定一个部门（推荐从预订部或宴会部开始，\n    他们最不容易冲突），让他的成功案例去说服其他人。</div>\n  </div>\n</div>\n\n<div class=\"callout callout-warn\">\n  <span class=\"co-t\">为什么推荐从预订部或宴会部开始</span>\n  <p>\n    销售部和前厅部与收益有天然的利益冲突，最难搞定。\n    <b>预订部需要你给清晰的指令</b>（你把每日限制条件表发给他，他是受益者）；\n    <b>宴会部需要你替他争取生意</b>（表 K 让他在会议决策里有发言权，他也是受益者）。<br>\n    先拿下这两个，你就有了两个盟友。等销售看到宴会部因为配合你拿下了大单，态度自然会变。\n  </p>\n</div>\n\n<\!-- ============ 五、失败模式 ============ -->\n"}, {"id": "p5", "name": "五、八种失败模式", "min": 8, "desc": "", "html": "<h2 id=\"s5\">五、八种失败模式</h2>\n\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>八种常见失败及规避方法</caption>\n    <thead><tr><th class=\"mid\" style=\"width:40px\">#</th><th>失败模式</th><th>为什么会失败</th><th>怎么规避</th></tr></thead>\n    <tbody>\n      <tr><td class=\"mid\">1</td><td><b>一上来就想改所有事</b></td><td>树敌太多，会死在第一轮</td><td>先挑一个点做成绩，再扩展</td></tr>\n      <tr><td class=\"mid\">2</td><td><b>只讲数据不讲利益</b></td><td>别人服了但没动力，不会真的配合</td><td>每个要求都要说清「对你有什么好处」</td></tr>\n      <tr><td class=\"mid\">3</td><td><b>用系统和术语压人</b></td><td>让人觉得你在炫技，产生抵触</td><td>把表 G 的公式教会销售，让他自己能算</td></tr>\n      <tr><td class=\"mid\">4</td><td><b>承诺了没做到</b></td><td>一次失信，前面全部白做</td><td>做不到就提前说，别事后解释</td></tr>\n      <tr><td class=\"mid\">5</td><td><b>数据不公开</b></td><td>别人怀疑你藏了什么</td><td>做看板，全部公开，包括对你不利的数字</td></tr>\n      <tr><td class=\"mid\">6</td><td><b>只在出问题时才找人</b></td><td>别人一看到你就知道没好事</td><td>平时也要沟通，分享好消息</td></tr>\n      <tr><td class=\"mid\">7</td><td><b>要求配合但不给工具</b></td><td>规则太复杂，执行不了，最后还是乱</td><td>把规则做成卡片、表格，让人不用动脑</td></tr>\n      <tr><td class=\"mid\">8</td><td><b>期待三个月内见效</b></td><td>两个月没动静就放弃了</td><td>给自己 6 个月，前两个月只做铺垫</td></tr>\n    </tbody>\n  </table>\n</div>\n\n<div class=\"callout callout-danger\">\n  <span class=\"co-t\">最致命的是第 4 条</span>\n  <p>\n    <b>承诺了没做到。</b>你可以能力不足，可以判断失误，但<b>不能失信</b>。\n    能力不足别人会帮你，判断失误别人会原谅，失信一次就再也建立不起来了。<br>\n    <b>所以：宁可少承诺，不可做不到。做不到就提前说。</b>\n  </p>\n</div>\n\n<\!-- ============ 六、讲师示范 ============ -->\n"}, {"id": "p6", "name": "六、讲师示范：一个真实的跨部门协同冲突", "min": 8, "desc": "", "html": "<h2 id=\"s6\">六、讲师示范：一个真实的跨部门协同冲突</h2>\n<p>场景：云璟酒店 11 月 15 日（展会周，预测 OCC 94%）。同一天下午，三个部门同时找收益：\n销售要接 50 间 ¥450 的团；宴会要留 30 间给 200 人会议；前厅说金卡会员投诉升级慢。</p>\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>云璟 11/15 协同冲突 · 收益经理的处置顺序</caption>\n    <thead><tr><th class=\"mid\" style=\"width:56px\">步</th><th>冲突</th><th>依据</th><th>处置</th></tr></thead>\n    <tbody>\n      <tr><td class=\"mid\"><b>1</b></td><td>销售 50 间 ¥450 团</td><td>表 G：R=450÷700=64.3%，OCC&gt;85% → 拒绝</td><td>共情后算置换成本 50×(700−450)=1.25 万；给替代：减到 15 间或换 11/20（OCC 61%）</td></tr>\n      <tr><td class=\"mid\"><b>2</b></td><td>宴会 30 间会议</td><td>表 K：餐饮保底 ≥¥3 万则综合贡献达标</td><td>宴会报保底 ¥3.5 万 → 综合贡献 &gt; 置换成本，<b>接受 30 间</b>，要求书面确认保底</td></tr>\n      <tr><td class=\"mid\"><b>3</b></td><td>前厅升级投诉</td><td>表 J：钻石&gt;铂金&gt;金；套房每日≤3 间</td><td>当场升 2 位铂金；金卡给双早+延迟退房（成本¥136&lt;升档¥140）；套房已满待 L3 批</td></tr>\n      <tr><td class=\"mid\"><b>4</b></td><td>总房量核对</td><td>320 间，OCC 94% 余 19 间</td><td>50 团拒、30 会议接、升级占 2 → 余 17 间给散客 BAR ¥880，不慌</td></tr>\n      <tr><td class=\"mid\"><b>5</b></td><td>闭环</td><td>表 O 冲突仲裁</td><td>处置写进《调价台账》备注；晚会同步四部门；次日复盘 Pickup</td></tr>\n    </tbody>\n  </table>\n</div>\n<div class=\"callout callout-key\">\n  <span class=\"co-t\">示范要点</span>\n  <p>① 先按<b>表 O 优先级</b>排处置顺序（应急 &gt; 库存 &gt; 价格 &gt; 竞争 &gt; 渠道 &gt; 份额）；\n  ② 每个拒绝都先共情、算账、给替代方案，销售/宴会都不觉得被压；\n  ③ 把宴会部变成盟友（用表 K 让他有发言权）；④ 所有取舍写入台账，可追溯。</p>\n</div>\n\n"}, {"id": "p7", "name": "七、学员跟练（4 题）", "min": 8, "desc": "", "html": "<h2 id=\"s7\">七、学员跟练（4 题）</h2>\n<p>用云璟真实数据独立练，答案在折叠里。</p>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 1</div>\n  <div class=\"q-b\">销售说：「客户跟了三年，这个 40 间 ¥460 的团必须接。」入住日预测 OCC 91%、散客 ADR ¥700。你怎么做？（写出四步话术）</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    共情：「跟了三年的客户确实不能随便丢。」算账：R=460÷700=65.7%，OCC&gt;85% → 表 G 拒绝；置换成本 40×(700−460)=9,600。\n    给方案：「谈到 ¥560 我立刻签，或减到 15 间、¥460 也行，或换 11/22 那天 OCC 62%。」留余地：「战略意义重大我们报 L3 一起评估。」\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 2</div>\n  <div class=\"q-b\">前厅抱怨「每次升级都要找你确认太麻烦」。你给他什么工具、什么边界，让他能自己执行？</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    把<b>表 J 做成卡片</b>贴工位——钻石&gt;铂金&gt;金&gt;银 的升级顺序、每日套房≤3 间让他照着执行；\n    只有套房升级且当天已升满 3 间时才需要问你。同时把升级合规率写进前厅 KPI，月度表扬做得好的员工。\n    这就是「给工具 + 利益挂钩」的组合。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 3</div>\n  <div class=\"q-b\">你推动变革两个月了，销售还是绕开你直接放团价。八种失败模式里，你最可能犯了哪一条？怎么救？</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    最可能犯<b>第 7 条：要求配合但不给工具</b>——销售记不住表 G 的阈值。\n    救济：把表 G 的「置换成本公式」教给销售，让他自己能算「谈到多少我立刻签」；再配月度排名（团队价达标率）和激励挂钩。\n    也可能是第 3 条「用术语压人」，要改成共情+算账的对话方式。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 4</div>\n  <div class=\"q-b\">业主要求「RevPAR 涨 5% 但利润没涨」的解释。你用哪两个指标拆穿真相？下一步动作是什么？</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    用 <b>NRevPAR</b>（净 RevPAR = RevPAR×(1−渠道综合成本率)）和 <b>渠道结构</b>拆穿：OTA 占比偏高，佣金吃掉增量。\n    下一步：把 OTA 压回 28%，用市场部直销补量——并在月度会作为「一个请求」要资源。\n  </div></details>\n</div>\n\n<\!-- ============ 随堂测 ============ -->\n<h2 id=\"quiz\">八、随堂测（5 题）</h2>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 1 题</div>\n  <div class=\"q-b\">销售部、前厅部、预订部各自的 KPI 是什么？你要他们分别配合什么？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    <b>销售部</b>：KPI = 客房产量、团队间夜、客户满意度、应收账款。\n    要他配合：询价先过收益，按表 G 报价，大单提前 30 天报备。<br>\n    <b>前厅部</b>：KPI = 客人满意度、投诉率、升级体验。\n    要他配合：按表 J 升级，不私自放价，不私自放房给上门客。<br>\n    <b>预订部</b>：KPI = 接单量、转化率、出错率。\n    要他配合：准确落地限制条件，发现异常立刻反馈，不擅自取消订单。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 2 题</div>\n  <div class=\"q-b\">异议应对的通用结构是什么？用「销售说客户跟了三年不能拒」举例说明。</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    四步结构：<b>共情 → 算账 → 给方案 → 留余地</b>。<br><br>\n    ① <b>共情</b>：「我理解，跟了三年的客户确实不能随便丢。」<br>\n    ② <b>算账</b>：「那天预测 OCC 88%，预期散客 ADR ¥680，80 间的置换成本 2 万 4。」<br>\n    ③ <b>给方案</b>：「谈到 ¥520 我立刻签，或者减到 30 间、¥380 也行。」<br>\n    ④ <b>留余地</b>：「如果战略意义大，我们报 L3 一起评估。」\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 3 题</div>\n  <div class=\"q-b\">业主问：「RevPAR 涨了 5%，为什么利润没涨？」你怎么回答？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    「因为渠道结构变了。OTA 占比从 28% 升到 33%，佣金多付了约 40 万。\n    <b>RevPAR 涨 5%，但 NRevPAR 只涨 1.8%。</b>\n    下个月我把 OTA 压回 28%，利润就回来了——这需要市场部配合做直销，我已经约了他。」<br><br>\n    <b>要点：</b>① 用 NRevPAR 而非 RevPAR 解释；② 给出具体金额；\n    ③ 给出下一步动作；④ 说明你已经开始推动（不是事后解释）。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 4 题</div>\n  <div class=\"q-b\">变革落地六步中，为什么建议先搞定预订部或宴会部，而不是销售部？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    因为销售部和前厅部与收益有<b>天然的利益冲突</b>，最难搞定。<br><br>\n    <b>预订部</b>需要你给清晰的指令——你把每日限制条件表发给他，他是直接受益者；<br>\n    <b>宴会部</b>需要你替他争取生意——表 K 让他在会议决策里有发言权，他也是受益者。<br><br>\n    先拿下这两个盟友，等销售看到宴会部因为配合你拿下了大单，态度自然会转变。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 5 题</div>\n  <div class=\"q-b\">八种失败模式中，哪一种最致命？为什么？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    <b>第 4 条：承诺了没做到。</b><br><br>\n    能力不足别人会帮你，判断失误别人会原谅，但<b>失信一次就再也建立不起来了</b>。\n    协同本质上靠的是信任，信任崩了，数据再对也没人听。<br><br>\n    <b>规避方法：宁可少承诺，不可做不到；做不到就提前说，不要事后解释。</b>\n  </div></details>\n</div>\n\n<h2 id=\"memo\">九、判定表默写清单</h2>\n<p>本模块结业前，必须能不翻资料默写以下条目：</p>\n<ul class=\"checklist\">\n  <li>六个部门的 KPI 与痛点：销售要产量、前厅要满意、预订怕背锅、市场要数据、财务要口径、宴会要生意。</li>\n  <li>异议四步顺序：共情 → 算账 → 给方案 → 留余地；核心是把立场之争变成算术题。</li>\n  <li>四工具：看板（替你说话）、排名（可比性）、激励挂钩（利益让人动）、案例复盘会（教思维方式）。</li>\n  <li>变革六步：做成绩 → 公开数据 → 说话算数 → 制度化 → 利益挂钩 → 培养盟友；周期 3–6 个月。</li>\n  <li>八失败最致命：承诺了没做到——宁可少承诺，做不到提前说。</li>\n</ul>\n\n<div class=\"callout callout-do\">\n  <span class=\"co-t\">本模块产出物</span>\n  <ul style=\"margin:6px 0 0\">\n    <li>《六个部门接口表》——打印贴工位</li>\n    <li>异议应对库 14 组——<b>课上两两对练一遍</b></li>\n    <li>《变革落地六步计划》——用你自己酒店的情况填一份</li>\n  </ul>\n</div>\n\n<div class=\"p-title\">M12 会议与汇报</div></a>\n  <a href=\"m14.html\" class=\"p-next\"><div class=\"p-dir\">下一模块 →</div><div class=\"p-title\">M14 收益管理系统与自动化</div></a>\n</div>\n\n</div>\n"}]}, {"n": 14, "t": "收益管理与 RMS", "part": "L3 经理", "mod": "模块 M14", "st": [{"id": "p0", "name": "开场", "min": 8, "desc": "", "html": "\n<div class=\"wrap\">\n\n<div class=\"crumb\">\n  <a href=\"../index.html\">学院首页</a><span>/</span>\n  <a href=\"../curriculum.html\">教案总纲</a><span>/</span>\n  L3 模块十四（最后一课）\n</div>\n\n<div class=\"page-head\">\n  <div class=\"badge-row\">\n    <span class=\"badge badge-l3\">L3 收益管理经理</span>\n    <span class=\"badge\">模块 M14</span>\n    <span class=\"badge\">6 课时 / 270 min</span>\n    <span class=\"badge\">认证权重 15%</span>\n  </div>\n  <h1 class=\"page-title\">收益管理系统与自动化</h1>\n  <p class=\"page-lede\">\n    系统能替你做 80% 的重复劳动，但<b>剩下 20% 必须由人把关</b>。\n    这一模块教你怎么画出那条人机边界。\n  </p>\n</div>\n\n<div class=\"card\">\n  <div class=\"card-title\"><span class=\"ic\">◎</span>学习目标</div>\n  <ul>\n    <li>能<b>说出</b> RMS 四个核心模块，以及数据是怎么在里面流动的</li>\n    <li>能<b>画出</b>自己酒店的人机边界：哪些交给系统自动执行、哪些必须人工干预</li>\n    <li>能<b>配置</b> 12 个必配参数，并说得出每个值的推荐理由</li>\n    <li>能<b>制定</b>自动化渐进路径，知道为什么不许跳级</li>\n    <li>能<b>设计</b>至少 8 条告警规则</li>\n  </ul>\n  <p class=\"card-note\">前置要求：M06 价格体系、M07 库存战术。<b>本模块是 L3 最后一课。</b></p>\n</div>\n\n<div class=\"toc\">\n  <div class=\"toc-title\">本模块目录</div>\n  <ol>\n    <li><a href=\"#s0\">核心概念区</a></li>\n    <li><a href=\"#s1\">RMS 的四个核心模块</a></li>\n    <li><a href=\"#s2\">人机边界：白名单与黑名单</a></li>\n    <li><a href=\"#s3\">12 个必配参数</a></li>\n    <li><a href=\"#s4\">自动化渐进路径</a></li>\n    <li><a href=\"#s5\">系统选型十问</a></li>\n    <li><a href=\"#s6\">告警规则设计</a></li>\n    <li><a href=\"#s7\">讲师示范：参数配置与干预</a></li>\n    <li><a href=\"#s8\">学员跟练</a></li>\n    <li><a href=\"#quiz\">随堂测</a></li>\n    <li><a href=\"#memo\">判定表默写清单</a></li>\n  </ol>\n</div>\n\n<div class=\"card\" id=\"s0\" style=\"margin-top:4px\">\n  <div class=\"card-title\"><span class=\"ic\">◈</span>核心概念区（本模块 5 个新概念）</div>\n  <div class=\"grid grid-2\">\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">RMS 四模块</div><div class=\"kv-v\">数据接入 → 需求预测 → 价格推荐 → 自动下发，系统无关</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">人机边界</div><div class=\"kv-v\">白名单（错得起、易回滚）交系统；黑名单（代价高、需人判）留人</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">12 参数</div><div class=\"kv-v\">按本店 No-show / 提前窗口 / 竞争组合标定，不可照抄</div></div>\n    </div>\n    <div class=\"kv\">\n      <div class=\"kv-row\"><div class=\"kv-k\">渐进路径</div><div class=\"kv-v\">L0 手工 → L1 半自动 → L2 推荐+确认 → L3 部分自动 → L4 全自动，不许跳级</div></div>\n      <div class=\"kv-row\"><div class=\"kv-k\">告警稀缺</div><div class=\"kv-v\">告警太多等于没有；只留真正需要人介入的 8 条</div></div>\n    </div>\n  </div>\n  <p class=\"card-note\">系统放大你，不是替代你。<b>你越懂规则，系统配得越好；你不懂，它只会很努力地犯错。</b></p>\n</div>\n\n<\!-- ============ 一、四个模块 ============ -->\n"}, {"id": "p1", "name": "一、RMS 的四个核心模块", "min": 8, "desc": "", "html": "<h2 id=\"s1\">一、RMS 的四个核心模块</h2>\n<p>\n  不管哪个品牌的收益管理系统（RMS），拆开都是这四个模块。\n  <b>本节系统无关</b>——讲通用的原理，不针对任何具体产品。\n</p>\n\n<div class=\"flow\">\n  <div class=\"flow-item\">\n    <div class=\"fi-t\">① 数据接入</div>\n    <div class=\"fi-d\">PMS 的历史与在手<br>渠道数据<br>竞争价格<br>事件日历</div>\n  </div>\n  <div class=\"flow-arrow\">→</div>\n  <div class=\"flow-item\">\n    <div class=\"fi-t\">② 需求预测</div>\n    <div class=\"fi-d\">历史 + 在手<br>+ 提前窗口<br>→ 未来每一天<br>的预测需求</div>\n  </div>\n  <div class=\"flow-arrow\">→</div>\n  <div class=\"flow-item\">\n    <div class=\"fi-t\">③ 价格推荐</div>\n    <div class=\"fi-d\">基于预测与竞争<br>给出每一天<br>的建议价格</div>\n  </div>\n  <div class=\"flow-arrow\">→</div>\n  <div class=\"flow-item\">\n    <div class=\"fi-t\">④ 自动下发</div>\n    <div class=\"fi-d\">把价格直接推到<br>PMS 与各渠道</div>\n  </div>\n</div>\n\n<div class=\"grid grid-2\">\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">✓</span>系统比人强的地方</div>\n    <ul style=\"font-size:13.5px;margin:0\">\n      <li>能同时处理<b>几百个变量</b>（历史、在手、竞对、事件、星期几、天气……）</li>\n      <li><b>从不疲倦、从不漏</b>。365 天 × 10 个房型 × 6 个渠道，人做不到每天全查一遍</li>\n      <li><b>执行一致</b>。不会今天心情好少降点、明天心情差多降点</li>\n      <li>能<b> 24 小时响应</b>。凌晨 3 点竞对降价，它立刻知道</li>\n    </ul>\n  </div>\n  <div class=\"card\">\n    <div class=\"card-title\"><span class=\"ic\">✕</span>系统不如人的地方</div>\n    <ul style=\"font-size:13.5px;margin:0\">\n      <li>遇到<b>没见过的情况</b>会失灵（新竞对开业、突发舆情、政府征用）</li>\n      <li><b>不懂组织</b>。它不知道这个客户是销售跟了三年的战略客户</li>\n      <li><b>不承担责任</b>。超售过度导致客人无房，挨骂的是你不是它</li>\n      <li><b>只会优化既定目标</b>。目标设错了，它会很努力地往错的方向跑</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"callout callout-key\">\n  <span class=\"co-t\">正确的人机关系</span>\n  <p>\n    <b>系统负责 80% 的常规决策，人负责 20% 的关键判断。</b><br>\n    上了 RMS 收益经理不会失业，但<b>不用 RMS 的收益经理会</b>——\n    因为他一个人查不了 365 天 × 10 房型 × 6 渠道的组合。<br><br>\n    <b>关键认知：系统放大你，不是替代你。</b>你越懂规则，系统配得越好，产出越大；\n    你不懂规则，配出来的系统只会很努力地犯错。\n  </p>\n</div>\n\n<\!-- ============ 二、人机边界 ============ -->\n"}, {"id": "p2", "name": "二、人机边界：白名单与黑名单", "min": 8, "desc": "", "html": "<h2 id=\"s2\">二、人机边界：白名单与黑名单</h2>\n<p>\n  这是本模块<b>最核心的内容</b>。把这张表画清楚，RMS 就出不了大事。\n</p>\n\n<div class=\"grid grid-2\">\n  <div class=\"card\" style=\"border-left:4px solid var(--teal)\">\n    <div class=\"card-title\">✓ 白名单：可交给系统自动执行</div>\n    <ul style=\"font-size:13.5px;margin-bottom:10px\">\n      <li>平峰日的小幅调价（±3–5%）</li>\n      <li>常规渠道开关</li>\n      <li>限制条件的批量设置与撤除</li>\n      <li>价格一致性巡检与告警</li>\n      <li>常规报表生成与推送</li>\n    </ul>\n    <p style=\"margin:0;font-size:13px;color:var(--ink-2)\">\n      <b>判断标准：错了代价可控，且容易回滚。</b><br>\n      平峰日调错 5%，损失可能几千块，第二天改回来就行。\n    </p>\n  </div>\n  <div class=\"card\" style=\"border-left:4px solid var(--danger)\">\n    <div class=\"card-title\">✕ 黑名单：必须人工干预</div>\n    <ul style=\"font-size:13.5px;margin-bottom:10px\">\n      <li><b>D1 峰值日</b>的任何调价</li>\n      <li>超售率 <b>&gt;10%</b></li>\n      <li>团队与会议询价决策（表 G / 表 K）</li>\n      <li>异常事件（表 L 的五种情况）</li>\n      <li>价格体系重构（表 F 的价差调整）</li>\n      <li>年度预算与滚动预测</li>\n    </ul>\n    <p style=\"margin:0;font-size:13px;color:var(--ink-2)\">\n      <b>判断标准：错了代价高，或涉及人的判断。</b><br>\n      D1 日调错一次，可能损失几十万，且无法回滚。\n    </p>\n  </div>\n</div>\n\n<div class=\"callout callout-warn\">\n  <span class=\"co-t\">为什么 D1 峰值日不能自动</span>\n  <p>\n    云璟酒店全年 D1 日约 20 天（国庆、五一、春节、展会等），\n    但这 20 天的客房收入通常占全年 <b>12–18%</b>。<br>\n    系统在这类日期的预测误差也最大——因为它见过的一手数据最少（一年才几次）。<br>\n    <b>所以：D1 日系统只给建议，人来拍板。这是《法典》表 A 约束 4 的硬性要求。</b>\n  </p>\n</div>\n\n<\!-- ============ 三、参数 ============ -->\n"}, {"id": "p3", "name": "三、12 个必配参数", "min": 8, "desc": "", "html": "<h2 id=\"s3\">三、12 个必配参数</h2>\n<p>\n  这些参数<b>不能照抄</b>——下面给的是云璟酒店的值，以及<b>为什么是这个值</b>。\n  你要按自己酒店的情况算一遍。\n</p>\n\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>12 个必配参数（云璟酒店推荐值）</caption>\n    <thead><tr><th class=\"mid\" style=\"width:36px\">#</th><th>参数</th><th>推荐值</th><th>为什么是这个值</th></tr></thead>\n    <tbody>\n      <tr><td class=\"mid\">1</td><td><b>竞争组合</b></td><td>5 家，加权均价 ¥680</td><td>选房量相近、档次相同、3km 内的竞对。太少没代表性，太多采集不过来。</td></tr>\n      <tr><td class=\"mid\">2</td><td><b>价格地板</b></td><td>¥480</td><td>低于此价连变动成本都收不回（布草洗涤 + 能耗 + 早餐 + 佣金约 ¥470）。</td></tr>\n      <tr><td class=\"mid\">3</td><td><b>价格天花板</b></td><td>¥2,400</td><td>品牌线。超过会伤害口碑，且会被OTA降权。平峰 BAR ¥680 的 3.5 倍。</td></tr>\n      <tr><td class=\"mid\">4</td><td><b>调价步长</b></td><td>最小 3%，最大 20%</td><td>与《法典》表 A 一致。低于 3% 市场无感知，高于 20% 会吓跑客人。</td></tr>\n      <tr><td class=\"mid\">5</td><td><b>调价频率</b></td><td>每日最多 2 次</td><td>《法典》表 A 约束 1。改太频繁，渠道同步跟不上，还会触发价格一致性告警。</td></tr>\n      <tr><td class=\"mid\">6</td><td><b>房型价差</b></td><td>85/100/120/140/145/180/265</td><td>《法典》表 F。设定一次，全房型价格自动生成，每周一校验。</td></tr>\n      <tr><td class=\"mid\">7</td><td><b>渠道优先级</b></td><td>直销 &gt; 会员 &gt; 协议 &gt; GDS &gt; OTA &gt; 批发</td><td>按渠道成本排序（3%/4%/8%/13%/16%/26%）。房好卖时从右往左关。</td></tr>\n      <tr><td class=\"mid\">8</td><td><b>超售上限</b></td><td>5% 且 ≤15 间</td><td>《法典》表 E 硬上限。两条都要满足，取小值。</td></tr>\n      <tr><td class=\"mid\">9</td><td><b>细分权重</b></td><td>OTA 权重不宜过高</td><td>权重太高，系统会学成「只会降价冲量」。按净贡献设权重，别按产量。</td></tr>\n      <tr><td class=\"mid\">10</td><td><b>预测模型</b></td><td>历史 + Pickup + 事件 复合模型</td><td>只用历史跟不上变化；只用 Pickup 在远期不稳定；加事件才能处理展会这类脉冲。</td></tr>\n      <tr><td class=\"mid\">11</td><td><b>审批流</b></td><td>D1 日调价、超售&gt;10% 必须人工审批</td><td>与黑名单一致。系统给建议，人来拍板并留痕。</td></tr>\n      <tr><td class=\"mid\">12</td><td><b>告警阈值</b></td><td>Pickup 偏差 &gt;±30%；ARI &gt;120 或 &lt;80</td><td>超出常规波动范围，说明有异常，需要人介入看一眼。</td></tr>\n    </tbody>\n  </table>\n</div>\n\n<div class=\"callout callout-danger\">\n  <span class=\"co-t\">最容易配错的是第 9 条（细分权重）</span>\n  <p>\n    很多人按<b>产量</b>设权重，结果 OTA 产量最大、权重最高，系统就学成了「降价冲 OTA 量」。<br>\n    正确做法是<b>按净贡献设权重</b>——把渠道成本扣掉之后再算，直销的权重应该高于 OTA。<br><br>\n    <b>每季度必须复核一次全部 12 个参数。</b>市场在变，竞对在变，参数不跟着变，系统就会越跑越偏。\n  </p>\n</div>\n\n<\!-- ============ 四、渐进路径 ============ -->\n"}, {"id": "p4", "name": "四、自动化渐进路径（不许跳级）", "min": 8, "desc": "", "html": "<h2 id=\"s4\">四、自动化渐进路径（不许跳级）</h2>\n\n<div class=\"timeline\">\n  <div class=\"tl-item\">\n    <div class=\"tl-time\">Level 0</div>\n    <div class=\"tl-body\"><b>纯手工</b>。Excel + 人工落位。<br>\n    <b>适用</b>：80 间以下、无专职收益。<b>验收</b>：能稳定完成每日流水线。</div>\n  </div>\n  <div class=\"tl-item\">\n    <div class=\"tl-time\">Level 1</div>\n    <div class=\"tl-body\"><b>Excel 半自动</b>。用本学院的模板包，公式自动出结论，人工落位。<br>\n    <b>适用</b>：任何规模，<b>建议所有人从这里开始</b>。<b>验收</b>：调价命中率可统计。</div>\n  </div>\n  <div class=\"tl-item\">\n    <div class=\"tl-time\">Level 2</div>\n    <div class=\"tl-body\"><b>系统推荐 + 人工确认</b>。RMS 给建议，人逐条确认后下发。<br>\n    <b>适用</b>：150 间以上、有专职收益。<b>验收</b>：连续 3 个月，系统建议的采纳率 &gt;70%。</div>\n  </div>\n  <div class=\"tl-item\">\n    <div class=\"tl-time\">Level 3</div>\n    <div class=\"tl-body\"><b>部分自动</b>。白名单放开自动执行，黑名单仍人工。<br>\n    <b>适用</b>：Level 2 跑顺 3 个月以上。<b>验收</b>：白名单动作的出错率 &lt;2%。</div>\n  </div>\n  <div class=\"tl-item\">\n    <div class=\"tl-time\">Level 4</div>\n    <div class=\"tl-body\"><b>全自动 + 人工监管</b>。系统全权执行，人只看告警和复盘。<br>\n    <b>适用</b>：多店集团、有成熟中台。<b>验收</b>：RGI 稳定跑赢竞争组合，且季度复盘无重大事故。</div>\n  </div>\n</div>\n\n<div class=\"callout callout-danger\">\n  <span class=\"co-t\">为什么不许跳级</span>\n  <p>\n    最常见的失败是：<b>直接上系统、直接开全自动</b>（从 Level 0 跳到 Level 3/4）。<br><br>\n    后果通常是：系统参数没配好 → 建议价格离谱 → 但因为全自动，没人看 →\n    连续跑了一个月才发现 ADR 掉了 15%。<br><br>\n    <b>正确做法：从 Level 2 开始，跑顺三个月再放白名单。</b>\n    这三个月的价值不只是验证系统，更是<b>让人学会看懂系统的建议</b>——\n    你看得懂它为什么这么建议，才敢放手让它自己干。\n  </p>\n</div>\n\n<\!-- ============ 五、选型十问 ============ -->\n"}, {"id": "p5", "name": "五、系统选型十问", "min": 8, "desc": "", "html": "<h2 id=\"s5\">五、系统选型十问</h2>\n<p>给要买系统的学员用。问销售这十个问题，答不上来的直接淘汰。</p>\n\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>选型十问清单</caption>\n    <thead><tr><th class=\"mid\" style=\"width:36px\">#</th><th>要问的问题</th><th>什么样的答案算合格</th></tr></thead>\n    <tbody>\n      <tr><td class=\"mid\">1</td><td>能对接我们现在的 PMS 吗？是直连还是定时同步？</td><td>直连。定时同步（如 4 小时一次）在旺季会出事</td></tr>\n      <tr><td class=\"mid\">2</td><td>竞争价格数据从哪来？多久更新一次？</td><td>每日至少 1 次，且能自定义竞争组合</td></tr>\n      <tr><td class=\"mid\">3</td><td>能设置价格地板/天花板吗？能不能按房型分别设？</td><td>能，且必须能按房型分别设</td></tr>\n      <tr><td class=\"mid\">4</td><td>能不能配置审批流？哪些动作需要人工确认？</td><td>能自定义规则，至少支持按日期类型和幅度配置</td></tr>\n      <tr><td class=\"mid\">5</td><td>预测模型是什么？能不能看预测准确率？</td><td>能输出历史准确率，且能按天查看</td></tr>\n      <tr><td class=\"mid\">6</td><td>能不能处理团队和会议的置换分析？</td><td>能，或者至少能手动录入团队占用后再预测</td></tr>\n      <tr><td class=\"mid\">7</td><td>告警规则能不能自定义？支持哪些通知方式？</td><td>能自定义阈值，支持邮件 + 短信/微信</td></tr>\n      <tr><td class=\"mid\">8</td><td>能不能导出全部决策日志？</td><td>能，且包含「当时看到什么数、给出什么建议」</td></tr>\n      <tr><td class=\"mid\">9</td><td>实施周期多久？包含几次参数调优？</td><td>不超过 3 个月，至少包含 2 次调优</td></tr>\n      <tr><td class=\"mid\">10</td><td>能不能先试运行 3 个月，只看建议不自动执行？</td><td><b>必须能。</b>不给试运行的，直接淘汰</td></tr>\n    </tbody>\n  </table>\n</div>\n\n<\!-- ============ 六、告警 ============ -->\n"}, {"id": "p6", "name": "六、告警规则设计", "min": 8, "desc": "", "html": "<h2 id=\"s6\">六、告警规则设计</h2>\n<p>\n  系统应该在你<b>需要知道</b>的时候打扰你，而不是天天发消息。\n  告警太多等于没有告警——人会自动忽略。\n</p>\n\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>8 条告警规则</caption>\n    <thead><tr><th class=\"mid\" style=\"width:36px\">#</th><th>告警</th><th>阈值</th><th>收到后做什么</th></tr></thead>\n    <tbody>\n      <tr><td class=\"mid\">1</td><td>Pickup 异常落后</td><td>48h 内落后 &gt;30%</td><td>查表 L 是否触发需求暴跌，是则启动应急</td></tr>\n      <tr><td class=\"mid\">2</td><td>Pickup 异常领先</td><td>24h 内领先 &gt;60%</td><td>查表 L 需求暴涨，考虑提价与 MinLOS</td></tr>\n      <tr><td class=\"mid\">3</td><td>ARI 越界</td><td>&gt;120 或 &lt;80</td><td>查表 C，判断是提价还是降价</td></tr>\n      <tr><td class=\"mid\">4</td><td>竞对大幅降价</td><td>单日降幅 &gt;15%</td><td>先怀疑数据，再查表 D，<b>不盲目跟价</b></td></tr>\n      <tr><td class=\"mid\">5</td><td>价格一致性违规</td><td>直销价 &gt; 任一 OTA 价</td><td>24 小时内整改（表 H 红线）</td></tr>\n      <tr><td class=\"mid\">6</td><td>接近满房</td><td>某日预测 OCC ≥95%</td><td>查表 B，配 MinLOS/CTA、关低价渠道</td></tr>\n      <tr><td class=\"mid\">7</td><td>渠道断连</td><td>某渠道 2 小时无订单</td><td>切手动模式，通知渠道经理（表 L）</td></tr>\n      <tr><td class=\"mid\">8</td><td>超售率逼近上限</td><td>某日超售 &gt;可售房量 4%</td><td>复核表 E 的修正系数，确认备用酒店</td></tr>\n    </tbody>\n  </table>\n</div>\n\n<div class=\"callout callout-key\">\n  <span class=\"co-t\">讲师示范：告警太多会怎样</span>\n  <p>\n    某酒店配了 30 条告警，每天收 80+ 条消息。两周后，收益经理把告警邮箱设成了自动归档。<br>\n    第三周，国庆前一天渠道断连 6 小时，告警发了 12 封，一封没看到。<br>\n    等发现时，那天的 OTA 库存已经被竞对抢光，OCC 只有 71%（预测 96%）。<br><br>\n    <b>教训：告警的价值在于稀缺性。</b>宁可只留 8 条真正重要的，也不要 30 条全都要看。\n  </p>\n</div>\n\n<\!-- ============ 七、讲师示范 ============ -->\n"}, {"id": "p7", "name": "七、讲师示范：给云璟配一套 RMS 参数并处置一次异常", "min": 8, "desc": "", "html": "<h2 id=\"s7\">七、讲师示范：给云璟配一套 RMS 参数并处置一次异常</h2>\n<p>场景：云璟酒店要上线 RMS，你作为收益经理做初始参数配置，并在一次 D1 日异常中拍板。</p>\n<div class=\"tbl-wrap\">\n  <table class=\"tbl\">\n    <caption>云璟 RMS 初始化 · 关键参数与一次干预</caption>\n    <thead><tr><th class=\"mid\" style=\"width:40px\">环节</th><th>动作</th><th>取值 / 决策</th><th>依据</th></tr></thead>\n    <tbody>\n      <tr><td class=\"mid\"><b>1</b></td><td>竞争组合</td><td>5 家，加权均价 ¥680</td><td>房量相近、档次相同、3km 内</td></tr>\n      <tr><td class=\"mid\"><b>2</b></td><td>价格地板 / 天花板</td><td>¥480 / ¥2,400</td><td>地板=变动成本线；天花板=品牌线 3.5×BAR</td></tr>\n      <tr><td class=\"mid\"><b>3</b></td><td>细分权重</td><td>按净贡献，直销&gt;OTA</td><td>避免系统学成「降价冲量」</td></tr>\n      <tr><td class=\"mid\"><b>4</b></td><td>审批流</td><td>D1 日调价、超售&gt;10% 需人批</td><td>黑名单硬要求</td></tr>\n      <tr><td class=\"mid\"><b>5</b></td><td>D1 日（国庆）异常</td><td>系统 09:00 建议 +20%</td><td>表 A：OCC≥95% 列 +20%</td></tr>\n      <tr><td class=\"mid\"><b>6</b></td><td>人拍板</td><td>批准，但<b>手动加锁 14:00 前不二次调</b></td><td>表 A 约束 2：24h 同方向≤2 次</td></tr>\n      <tr><td class=\"mid\"><b>7</b></td><td>复盘</td><td>当日 OCC 97%、ADR ¥1,180，RevPAR ¥1,144</td><td>比平峰 RevPAR ¥445 高 157%，达标</td></tr>\n    </tbody>\n  </table>\n</div>\n<div class=\"callout callout-key\">\n  <span class=\"co-t\">示范要点</span>\n  <p>① 参数先按本店标定，尤其<b>细分权重按净贡献</b>；② D1 日系统只给建议，<b>人必须拍板并留痕</b>；\n  ③ 即便批准也要遵守表 A 的调价约束（同方向频率 / 幅度）；④ 事后用 RevPAR 复盘，数据回流调参。</p>\n</div>\n\n<h2 id=\"s8\">八、学员跟练（4 题）</h2>\n<p>用云璟真实数据独立练，答案在折叠里。</p>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 1</div>\n  <div class=\"q-b\">你接手一家新店，直接把云璟的 12 个参数复制过去，跳到 Level 3 全自动。三个月后 ADR 掉了 15%。最可能的原因是什么？怎么救？</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    原因：<b>参数没按新店标定 + 跳级</b>。新店 No-show 率、提前窗口、竞争组合都不同，复制云璟参数直接偏；\n    又跳到全自动，没人看建议，错误持续放大。<br><br>\n    救济：退回 <b>Level 2（系统推荐+人工确认）</b>跑三个月，期间用新店真实数据重新标定 12 参数\n    （尤其表 E 超售率、表 C 的 ARI 绝对值、表 F 价差），每季度复核。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 2</div>\n  <div class=\"q-b\">系统建议把 OTA 权重放到最高，说「OTA 产量最大、学习最快」。你为什么拒绝？正确权重怎么设？</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    拒绝原因：按<b>产量</b>设权重，系统会优化成「降价冲 OTA 量」，NRevPAR 越跑越低。<br><br>\n    正确做法：按<b>净贡献</b>设权重——扣掉渠道成本后，直销（3%）权重应高于 OTA（16%）。让系统学的是「利润」不是「间夜」。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 3</div>\n  <div class=\"q-b\">国庆前一天系统自动把价格提到 +25%（超过表 A 单日 20% 上限），且因全自动没人看。你发现时已是第二天。第一件事做什么？</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    第一件事：<b>切回人工确认（至少 Level 2），并核查当天价格一致性</b>（表 H 红线：直销≤OTA）。\n    然后复盘：25% 违反表 A 约束 1（单日同方向≤20%），说明白名单设错了——D1 日应入黑名单人工批。\n    损失计入《调价台账》备注，月度复盘。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">跟练 4</div>\n  <div class=\"q-b\">告警邮件每天 80+ 条，你把告警邮箱设了自动归档。这违反了哪条原则？正确做法是什么？</div>\n  <details class=\"ex-a\"><summary>参考思路</summary><div class=\"a-body\">\n    违反：<b>「告警的价值在于稀缺性」</b>——太多等于没有。正确做法：只留 8 条真正需要人介入的\n    （Pickup 异常、ARI 越界、价格一致性违规、接近满房、渠道断连、竞对大幅降价、超售逼近上限等），其余交给系统自动处理或日报汇总。\n  </div></details>\n</div>\n\n<\!-- ============ 随堂测 ============ -->\n<h2 id=\"quiz\">九、随堂测（5 题）</h2>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 1 题</div>\n  <div class=\"q-b\">RMS 的四个核心模块是什么？系统比人强在哪、不如人在哪？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    四模块：<b>数据接入 → 需求预测 → 价格推荐 → 自动下发</b>。<br><br>\n    <b>系统强在</b>：能同时处理几百个变量；从不疲倦不漏；执行一致；24 小时响应。<br>\n    <b>系统弱在</b>：遇到没见过的情况会失灵；不懂组织（不知道哪个是战略客户）；\n    不承担责任；只会优化既定目标（目标错了就往错的方向跑）。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 2 题</div>\n  <div class=\"q-b\">人机边界的判断标准是什么？举两个白名单动作、两个黑名单动作。</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    <b>白名单判断标准：错了代价可控，且容易回滚。</b><br>\n    例：平峰日小幅调价（±3–5%）、常规渠道开关、限制条件批量设置与撤除。<br><br>\n    <b>黑名单判断标准：错了代价高，或涉及人的判断。</b><br>\n    例：D1 峰值日的任何调价、超售率 &gt;10%、团队与会议询价决策（表 G/表 K）、\n    异常事件（表 L）。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 3 题</div>\n  <div class=\"q-b\">为什么 D1 峰值日的调价必须人工审批？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    两个原因：<br>\n    ① <b>占比太高</b>——云璟酒店全年 D1 日约 20 天，但这 20 天的客房收入占全年 12–18%。\n    调错一次损失几十万，且无法回滚。<br>\n    ② <b>系统在这类日期预测误差最大</b>——因为它见过的一手数据最少（一年才几次）。<br><br>\n    这也是《法典》表 A 约束 4 的硬性要求。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 4 题</div>\n  <div class=\"q-b\">12 个必配参数中，哪一个最容易配错？正确的做法是什么？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    <b>第 9 条：细分权重。</b><br><br>\n    常见错误是<b>按产量</b>设权重——结果 OTA 产量最大、权重最高，\n    系统就学成了「降价冲 OTA 量」，NRevPAR 越跑越低。<br><br>\n    <b>正确做法：按净贡献设权重</b>——把渠道成本扣掉之后再算，\n    直销（成本 3%）的权重应该高于 OTA（成本 16%）。<br><br>\n    另外，<b>12 个参数每季度必须复核一次</b>。\n  </div></details>\n</div>\n\n<div class=\"ex-q\">\n  <div class=\"q-t\">第 5 题</div>\n  <div class=\"q-b\">某酒店直接上系统并开启全自动（从 Level 0 跳到 Level 4），通常会出什么问题？\n  正确做法是什么？</div>\n  <details class=\"ex-a\"><summary>查看答案</summary><div class=\"a-body\">\n    <b>典型后果</b>：系统参数没配好 → 建议价格离谱 → 但因为全自动没人看 →\n    连续跑了一个月才发现 ADR 掉了 15%。<br><br>\n    <b>正确做法：从 Level 2（系统推荐 + 人工确认）开始，跑顺三个月再放白名单。</b><br><br>\n    这三个月的价值不只是验证系统，更是<b>让人学会看懂系统的建议</b>——\n    你看得懂它为什么这么建议，才敢放手让它自己干。<br>\n    另外，选型第 10 问就是「能不能先试运行 3 个月，只看建议不自动执行」，\n    不给试运行的供应商直接淘汰。\n  </div></details>\n</div>\n\n<div class=\"callout callout-gold\" style=\"margin-top:26px\">\n  <span class=\"co-t\">🎓 你已经学完全部 14 个模块</span>\n  <p>\n    从 M01 的「OCC 怎么算」，到现在的「系统怎么配」，你走完了 L1 → L2 → L3 的完整路径。<br><br>\n    <b>最后一句提醒：阈值是通用起点，不是圣经。</b>\n    回到岗位后用三个月，拿自己酒店的真实数据把这 15 张表重新标定一遍——\n    尤其是表 E（超售率）、表 C（ARI 绝对值）、表 F（价差）。<br><br>\n    <b>把这套东西教会你团队里的下一个人——那才是真正的掌握。</b>\n  </p>\n</div>\n\n<h2 id=\"memo\">十、判定表默写清单</h2>\n<p>本模块结业前，必须能不翻资料默写以下条目：</p>\n<ul class=\"checklist\">\n  <li>RMS 四模块顺序：数据接入 → 需求预测 → 价格推荐 → 自动下发。</li>\n  <li>人机边界判断标准：白名单=错了代价可控且易回滚；黑名单=错了代价高或需人判（D1 日、超售&gt;10%、表 G/K、表 L、价格体系重构、年度预算）。</li>\n  <li>12 参数中最易错的是「细分权重」——必须按净贡献设，不能按产量。</li>\n  <li>渐进路径 L0→L4 不许跳级；从 L2 跑顺三个月再放白名单。</li>\n  <li>告警原则：稀缺性；只留真正需人介入的，宁少勿多。</li>\n</ul>\n\n<div class=\"callout callout-do\">\n  <span class=\"co-t\">本模块产出物</span>\n  <ul style=\"margin:6px 0 0\">\n    <li>《人机边界表》——用你自己酒店的情况填一份（白名单 / 黑名单）</li>\n    <li>《12 个必配参数表》——每个参数写出你酒店的值和理由</li>\n    <li>《告警规则清单》——至少 8 条，含阈值和收到后做什么</li>\n  </ul>\n</div>\n\n<div class=\"p-title\">M13 跨部门协同与变革推动</div></a>\n  <a href=\"wb.html\" class=\"p-next\"><div class=\"p-dir\">全部课程学完 →</div><div class=\"p-title\">演练题库（251 题）</div></a>\n</div>\n\n</div>\n"}]}];
var KEY="hrma_pro_v1";
var st={done:{},last:null};
try{st=JSON.parse(localStorage.getItem(KEY)||'null')||{done:{},last:null}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function isDone(n,sid){return (st.done[n]||[]).indexOf(sid)>=0}
function doneCount(n){return (st.done[n]||[]).length}
function totalDone(){var t=0;for(var n in st.done)t+=st.done[n].length;return t}
function chOf(n){for(var i=0;i<BOOK.length;i++)if(BOOK[i].n===n)return BOOK[i];return null}
function liveSt(c){return c.st.filter(function(s){return !!s.html})}
function view(){return document.getElementById('view')}
function crumb(t,p){document.getElementById('crumb').textContent=t;document.getElementById('pos').textContent=p||''}
function dots(c,n,cur){var h='';liveSt(c).forEach(function(s,i){
  h+='<div class="dot '+(i===cur?'on ':'')+(isDone(n,s.id)?'done':'')+'">'+(isDone(n,s.id)?'✓':(i+1))+'</div>';});
  document.getElementById('dots').innerHTML=h;}
function listBook(){
  crumb('酒店人线 · 认证模块 M01–M14','共 '+BOOK.length+' 节 · 已完成 '+totalDone()+' 站');
  document.getElementById('dots').innerHTML='';
  var h='<div class="bar"><span class="stat">已完成 '+totalDone()+' 站</span>'
   +(st.last?'<button class="bk" id="resume" style="background:#e8b84b;color:#3a2a05;font-weight:700">继续上次</button>':'')
   +'<button class="bk" id="io">进度导出 / 导入</button></div>';
  var part='';
  BOOK.forEach(function(c){
    if(c.part!==part){h+=(part?'</div>':'')+'<div class="partgrp">'+c.part+'</div><div class="grid">';part=c.part;}
    var d=doneCount(c.n),L=liveSt(c).length;
    h+='<button class="card'+(d>=L?' done':'')+'" data-n="'+c.n+'">'
     +'<span class="no">'+(d>=L?'✓':c.n)+'</span><b>'+c.t+'</b><span>'+(c.mod||'')+'</span>'
     +'<span class="meta"><span class="tag">'+(d>=L?'已学完':'已学 '+d+' / '+L+' 站')+'</span></span></button>';
  });
  h+='</div>';
  view().innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.card[data-n]'),function(b){
    b.addEventListener('click',function(){openCh(parseInt(b.getAttribute('data-n'),10))});});
  var r=document.getElementById('resume');
  if(r) r.addEventListener('click',function(){ var c=chOf(st.last.n); if(!c){listBook();return}
    var ls=liveSt(c),idx=0; for(var i=0;i<ls.length;i++){if(!isDone(c.n,ls[i].id)){idx=i;break}idx=i+1}
    if(idx>=ls.length)idx=0; openCh(c.n,idx); });
  document.getElementById('io').addEventListener('click',ioPanel);
}
function openCh(n,auto){
  var c=chOf(n); if(!c)return; var ls=liveSt(c);
  crumb(c.t,c.part+(c.mod?' ｜ '+c.mod:''));
  dots(c,n,-1);
  var h='<div class="grid">';
  ls.forEach(function(s,i){var d=isDone(n,s.id);
    h+='<button class="card'+(d?' done':'')+'" data-s="'+s.id+'"><span class="no">'+(d?'✓':(i+1))+'</span>'
     +'<b>'+(i+1)+'. '+s.name+'</b>'+(s.desc?'<span>'+s.desc+'</span>':'')
     +'<span class="meta"><span class="tag">约 '+s.min+' 分钟</span>'
     +(d?'<span class="tag">已学完</span>':'')+'</span></button>';});
  h+='</div>';
  if(ls.every(function(s){return isDone(n,s.id)})){
    var nx=null; for(var i=0;i<BOOK.length;i++) if(BOOK[i].n===n&&i+1<BOOK.length) nx=BOOK[i+1];
    h+='<div class="exit"><b>这一节学完了。</b><br>'+(nx?'· <a href="#" id="nextCh">下一节：'+nx.t+' →</a>':'· 全部学完 ✓')+'</div>';
  }
  view().innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.card[data-s]'),function(b){
    b.addEventListener('click',function(){openSt(n,b.getAttribute('data-s'))});});
  var nb=document.getElementById('nextCh');
  if(nb) nb.addEventListener('click',function(e){e.preventDefault();
    for(var i=0;i<BOOK.length;i++) if(BOOK[i].n===n&&i+1<BOOK.length){openCh(BOOK[i+1].n);break}});
  if(typeof auto==='number'&&auto>=0&&auto<ls.length) openSt(n,ls[auto].id);
}
function openSt(n,sid){
  var c=chOf(n),ls=liveSt(c),idx=-1;
  for(var i=0;i<ls.length;i++) if(ls[i].id===sid) idx=i;
  var s=ls[idx],tot=ls.length;
  st.last={n:n};save();
  crumb(c.t+' · 第 '+(idx+1)+' 站 / 共 '+tot+' 站',c.part);
  dots(c,n,idx);
  var h='<div class="panel"><h2>'+(idx+1)+'. '+s.name+'</h2>'
   +(s.desc?'<p class="sub">'+s.desc+' ｜ 约 '+s.min+' 分钟</p>':'')
   +'<div class="in">'+s.html+'</div><div class="nav">'
   +'<button id="pv"'+(idx===0?' disabled':'')+'>← 上一站</button>'
   +(isDone(n,sid)?'<button id="nx" class="prim">'+(idx<tot-1?'下一站 →':'回到本节 →')+'</button>'
                  :'<button id="mk" class="prim">标记学完，继续 →</button>')
   +'</div></div>';
  view().innerHTML=h;
  var pv=document.getElementById('pv');
  if(pv) pv.addEventListener('click',function(){if(idx>0)openSt(n,ls[idx-1].id)});
  var mk=document.getElementById('mk');
  if(mk) mk.addEventListener('click',function(){
    if(!st.done[n])st.done[n]=[];
    if(st.done[n].indexOf(sid)<0)st.done[n].push(sid);
    save(); if(idx<tot-1)openSt(n,ls[idx+1].id); else openCh(n);});
  var nx2=document.getElementById('nx');
  if(nx2) nx2.addEventListener('click',function(){if(idx<tot-1)openSt(n,ls[idx+1].id);else openCh(n);});
  window.scrollTo(0,0);
}
function ioPanel(){
  crumb('进度导出 / 导入','换设备时用这个把进度带走');
  document.getElementById('dots').innerHTML='';
  var data=JSON.stringify({v:1,at:new Date().toISOString(),done:st.done,last:st.last});
  var b64=(function(s){try{return btoa(unescape(encodeURIComponent(s)))}catch(e){return ''}})(data);
  view().innerHTML='<div class="io"><h3>导出</h3>'
   +'<button id="dl">下载进度文件（.json）</button> <button class="ghost" id="cp">复制一段文字</button>'
   +'<textarea id="out" readonly>'+b64+'</textarea>'
   +'<div style="margin-top:14px"><h3>导入</h3>'
   +'<textarea id="inp" placeholder="把另一台设备导出的一段文字粘到这里"></textarea>'
   +'<button id="im">导入（覆盖当前进度）</button> <button class="ghost" id="pick">选择 .json 文件</button>'
   +'<input type="file" id="file" accept=".json" style="display:none"></div>'

  document.getElementById('dl').addEventListener('click',function(){

    r.onload=function(){apply(String(r.result))}; r.readAsText(f);});
}
function apply(v){
  var o=null;
  try{o=JSON.parse(v)}catch(e){
    try{o=JSON.parse(decodeURIComponent(escape(atob(v.replace(/\s+/g,'')))))}catch(e2){o=null}}
  if(!o||!o.done){alert('这段内容读不出来，请检查是否复制完整。');return;}
  st.done=o.done;st.last=o.last||null;save();
  alert('导入成功：已恢复 '+totalDone()+' 站的进度。');listBook();
}
