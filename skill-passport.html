<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.HRMA_PREFIX="";</script>
<script src="auth-config.js?v=gate20261013"></script>
<script src="assets/js/access-gate-public.js?v=v1"></script>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微证书技能护照 · 46 章学习地图</title>
<style>
:root{--o:#0284C7;--od:#0369A1;--soft:#f0f9ff;--navy:#0f2a4a;--navy2:#1d4e7e;--ink:#1f2937;--mut:#5b6a7d;--line:#e3e9f1;--page:#f4f7fb;--g:#16a34a;--r:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--ink)}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px 0 20px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.top .kick{font-size:12px;color:#f5d78e;letter-spacing:1px;margin-bottom:6px}
.top h1{font-size:26px;line-height:1.35;margin-bottom:6px}
.top p{color:#c9d8ea;font-size:13.5px;max-width:640px}
main{max-width:860px;margin:0 auto;padding:24px 20px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px}
h2{font-size:18px;color:var(--navy);margin-bottom:10px}
h3{font-size:15px;color:var(--navy);margin:14px 0 8px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
select,input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
.btn{display:inline-block;background:var(--o);color:#fff;border:0;border-radius:9px;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit;margin:6px 6px 0 0}
.btn:hover{background:var(--od)}
.btn.ghost{background:#fff;color:var(--o);border:1px solid var(--o)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.hide{display:none}
.tag{display:inline-block;background:var(--soft);color:var(--od);border:1px solid #fcd9b6;border-radius:20px;padding:3px 11px;font-size:12px;margin:2px 4px 2px 0}
.note{background:#fffbe8;border:1px solid #f5d78e;border-radius:9px;padding:10px 13px;font-size:12.5px;color:#7a5b00;margin-top:12px}
.out{background:var(--soft);border:1px dashed var(--o);border-radius:11px;padding:16px 18px;margin-top:14px;white-space:pre-wrap;line-height:1.85;font-size:14px}
.back{display:inline-block;margin-top:8px;color:var(--mut);font-size:12.5px;text-decoration:none}
.back:hover{color:var(--o)}
@media(max-width:600px){.top h1{font-size:21px}.card{padding:18px 16px}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
<div class="kick">RMC 收益管理社区 · 免费工具</div>
<h1>微证书技能护照 · 46 章学习地图</h1>
<p id="topdesc"></p>
</div></div>
<main><div class="card"><h2>点亮章节，攒出你的技能护照</h2><p class="sub">点「已掌握」标记进度，自动保存到本机。集满一个能力域即可生成该领域的技能凭证。</p><div id="prog" style="font-size:14px;margin-bottom:10px"></div><div style="height:10px;background:#eef2f7;border-radius:10px;overflow:hidden"><div id="bar" style="height:100%;width:0;background:var(--o);transition:width .3s"></div></div></div><div id="grid"></div><div class="card hide" id="cert"></div><script>
const CH=[{"n": 1, "title": "收益管理是什么：一句话与底层逻辑"}, {"n": 2, "title": "三个核心指标：OCC、ADR、RevPAR"}, {"n": 3, "title": "竞争三件套：MPI、ARI、RGI"}, {"n": 4, "title": "价格弹性：降多少价能换多少量"}, {"n": 5, "title": "什么时候涨价"}, {"n": 6, "title": "竞品降价：跟还是不跟"}, {"n": 7, "title": "竞争博弈：从「跟不跟价」到「对方下一期会怎么反应」"}, {"n": 8, "title": "折扣与促销：什么时候该让"}, {"n": 9, "title": "套餐与锚定：让客人觉得划算"}, {"n": 10, "title": "房型价差：差价定多少才合理"}, {"n": 11, "title": "最短住期 MinLOS：用条件把客群分开"}, {"n": 12, "title": "超额预订：卖出去的比有的多"}, {"n": 13, "title": "库存分配与保护位：给谁留多少房"}, {"n": 14, "title": "渠道净价：到手多少钱才算数"}, {"n": 15, "title": "渠道组合战略：不是逐个算净价，是解一个带约束的配置问题"}, {"n": 16, "title": "客源细分：把客人分成几堆来卖"}, {"n": 17, "title": "客户终身价值：把一晚的决策放到一段关系里"}, {"n": 18, "title": "团队置换：这个团该不该接"}, {"n": 19, "title": "直销与会员：把客人变成自己的"}, {"n": 20, "title": "运营全景：从年到日的节奏"}, {"n": 21, "title": "每日实操流程：一天具体做什么"}, {"n": 22, "title": "执行标准与收益例会"}, {"n": 23, "title": "预测与需求日历"}, {"n": 24, "title": "需求创造：收益不是分蛋糕，是把蛋糕做大"}, {"n": 25, "title": "年度预算：把一年拆到每天"}, {"n": 26, "title": "价格体系 BAR：所有价格的锚"}, {"n": 27, "title": "报表体系：每天该看哪几张表"}, {"n": 28, "title": "OTA 与点评：评分就是价格"}, {"n": 29, "title": "岗位与组织：谁来干这件事"}, {"n": 30, "title": "成本与利润：降价的底线在哪"}, {"n": 31, "title": "系统与数据：工具能替您做什么"}, {"n": 32, "title": "淡旺季与事件日：一年里最容易赚的钱"}, {"n": 33, "title": "餐饮收益：RevPASH 与翻台"}, {"n": 34, "title": "会议宴会：不只算房，算总贡献"}, {"n": 35, "title": "其他业态与跨行业参数"}, {"n": 36, "title": "常见误区：30 个坑，别再踩"}, {"n": 37, "title": "中国渠道生态：平台、私域、买断与直播"}, {"n": 38, "title": "连锁与中央预订：总部定价，门店做什么"}, {"n": 39, "title": "AI 工具做收益分析"}, {"n": 40, "title": "生成式 AI 与优化：把 AI 放在校验链里，不放在决策位上"}, {"n": 41, "title": "危机与极端场景"}, {"n": 42, "title": "收益岗位与职业发展"}, {"n": 43, "title": "变革篇：收益管理正在发生的五件事"}, {"n": 44, "title": "周期与不确定性下的收益管理"}, {"n": 45, "title": "人工智能与收益管理（科普）"}, {"n": 46, "title": "绿色收益管理与可持续"}];
const GROUPS=[{"name": "基础与指标", "chs": [1, 2, 3]}, {"name": "预测与预算", "chs": [5, 23, 24, 25]}, {"name": "定价与竞争", "chs": [4, 5, 6, 7, 8, 9, 10, 26]}, {"name": "库存与渠道", "chs": [11, 12, 13, 14, 15, 16, 19]}, {"name": "运营与管理", "chs": [20, 21, 22, 27, 29, 30, 31]}, {"name": "实战与前沿", "chs": [32, 33, 34, 37, 39, 40, 41, 42, 43, 44, 45, 46]}];
let done=JSON.parse(localStorage.getItem('hrma_passport')||'[]');
function save(){localStorage.setItem('hrma_passport',JSON.stringify(done));}
function toggle(n){const i=done.indexOf(n);if(i>=0)done.splice(i,1);else done.push(n);save();render();}
function render(){
  document.getElementById('grid').innerHTML=GROUPS.map(g=>{
    const got=g.chs.filter(n=>done.includes(n)).length;
    const full=got===g.chs.length;
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">${g.name}</h2><span class="tag" style="${full?'background:#dcfce7;color:#166534;border-color:#86efac':''}">${got}/${g.chs.length}${full?' ✓':''}</span></div>
      <div style="margin-top:12px">${g.chs.map(n=>{const c=CH.find(x=>x.n===n);if(!c)return'';
        const on=done.includes(n);
        return `<div style="display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid ${on?'#86efac':'var(--line)'};background:${on?'#f0fdf4':'#fff'};border-radius:9px;margin:5px 0;cursor:pointer" onclick="toggle(${n})">
          <span style="width:22px;height:22px;border-radius:6px;background:${on?'#16a34a':'#e5e7eb'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">${on?'✓':''}</span>
          <span style="font-size:13px;color:${on?'#166534':'var(--ink)'}">第${n}章 · ${c.title}</span></div>`}).join('')}</div>
      ${full?`<button class="btn sm" style="margin-top:10px" onclick="cert('${g.name}',${JSON.stringify(g.chs).replace(/"/g,'&quot;')})">生成「${g.name}」技能凭证</button>`:''}
    </div>`}).join('');
  const pct=Math.round(done.length/CH.count*100);
  document.getElementById('prog').innerHTML=`已点亮 <b style="color:var(--o)">${done.length}</b> / ${CH.length} 章 · ${pct}%`;
  document.getElementById('bar').style.width=pct+'%';
}
function cert(name,chs){
  document.getElementById('cert').classList.remove('hide');
  document.getElementById('cert').innerHTML=`<div style="text-align:center;padding:20px;border:2px solid var(--o);border-radius:14px;background:var(--soft)">
   <div style="font-size:12px;letter-spacing:2px;color:var(--mut)">RMC 收益管理社区 · 技能凭证</div>
   <h2 style="font-size:24px;color:var(--o);margin:10px 0">${name}</h2>
   <p style="font-size:14px">已完成 ${chs.length} 个章节的学习与掌握</p>
   <p style="font-size:12px;color:var(--mut);margin-top:10px">凭证编号 RM-${name.length}${chs.length}-${done.length}　·　可截图分享</p>
   <button class="btn sm" style="margin-top:12px" onclick="window.print()">保存 / 打印</button></div>`;
  document.getElementById('cert').scrollIntoView({behavior:'smooth'});
}
render();
</script>
<div style="text-align:center;margin-top:26px">
<a class="back" href="free-tools-hub.html">← 返回免费工具箱</a>
</div>
</main>
</body>
</html>
