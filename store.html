<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>window.HRMA_PREFIX="";</script>
<script src="auth-config.js?v=gate20261013"></script>
<script src="assets/js/access-gate.js?v=v12"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>产品超市 · RMC 收益管理社区</title>
<style>
:root{--navy:#0f2a4a;--navy2:#123a66;--gold:#e8b84b;--ink:#1f2a37;--mut:#5b6a7d;--ok:#2a9d5f;--line:#e3e9f1;--bg:#f4f7fb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px 80px}
.hero{background:linear-gradient(135deg,#0f2a4a,#1d4e7e);color:#fff;padding:30px 0 26px}
.hero .wrap{padding-bottom:0}
.hero .tag{display:inline-block;background:rgba(232,184,75,.18);border:1px solid rgba(232,184,75,.5);color:#f5d78e;font-size:12px;border-radius:999px;padding:3px 12px;margin-bottom:10px}
.hero h1{font-size:25px;line-height:1.45}
.hero p{color:#b9d0e6;font-size:14px;margin-top:8px;max-width:820px}
.note{background:#fff8e6;border:1px solid #f0dca6;color:#7a5c12;border-radius:9px;padding:9px 13px;font-size:12.5px;margin:14px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
.f{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:13.5px;cursor:pointer;color:var(--mut);transition:.15s}
.f:hover{border-color:var(--navy2);color:var(--navy2)}
.f.on{background:var(--navy2);border-color:var(--navy2);color:#fff;font-weight:700}
.catdesc{font-size:13px;color:var(--mut);margin:8px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 19px;box-shadow:0 1px 3px rgba(15,42,74,.05);display:flex;flex-direction:column}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cn{font-size:16px;font-weight:800;color:var(--navy);line-height:1.4}
.cc{font-size:10.5px;color:#fff;border-radius:6px;padding:2px 8px;white-space:nowrap}
.cc.tool{background:var(--navy2)}.cc.template{background:var(--ok)}.cc.book{background:var(--gold);color:#5a420a}
  .cc.license{background:#6b4a8c}
.val{font-size:13.5px;color:var(--ink);margin:11px 0;min-height:48px}
.tags{margin-bottom:10px}
.tags span{background:#f0f4f9;color:var(--mut);font-size:10.5px;border-radius:5px;padding:2px 7px;margin-right:4px}
.price{font-size:15px;font-weight:800;color:var(--ok);margin:4px 0 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;border-radius:8px;padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer}
.btn.p{background:var(--navy2);color:#fff}
.btn.s{background:#fff;color:var(--navy2);border:1px solid var(--navy2)}
.btn.g{background:#f0f4f9;color:var(--mut);border:1px solid var(--line)}
.next{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--mut)}
.next b{color:var(--navy2)}
.min{margin-top:6px;font-size:11px;color:var(--mut)}
.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--mut)}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
@media print{.hero{background:#fff;color:#000}.hero p{color:#333}.filters,.btns{display:none}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body data-page="store" data-auth="protected">
<header class="hero"><div class="wrap">
  <span class="tag">产品超市 · 19 件</span>
  <h1>产品超市</h1>
  <p>工具、模板、课件教材，打开就能看、照着就能用。先看预览，再决定自取还是购买——每个商品都写清了"你能用它做什么"和"几分钟能上手"。</p>
</div></header>
<main class="wrap">
  <div class="note">货架 19 件（工具 4 / 模板 5 / 教材 7 / 授权 3）。全部链接指向站内真实页面；商品内容受登录保护，不公开。</div>
  <div class="filters" id="filters"></div>
  <div class="catdesc" id="catdesc"></div>
  <div class="grid" id="grid"></div>
</main>
<script src="store-catalog.js"></script>
<script src="auth.js?v=2"></script>
<script>
(function(){
  var S=window.RMC_STORE||{CATALOG:[],CATS:[]};
  var CAT={tool:'工具',template:'模板',book:'课件教材',license:'授权'};
  var fbox=document.getElementById('filters'),grid=document.getElementById('grid'),desc=document.getElementById('catdesc');
  var cur='all';
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
  function renderFilters(){
    fbox.innerHTML=S.CATS.map(function(c){
      return '<div class="f'+(c.id===cur?' on':'')+'" data-id="'+c.id+'">'+esc(c.name)+'</div>';
    }).join('');
    [].forEach.call(fbox.children,function(b){b.onclick=function(){cur=b.getAttribute('data-id');render()}});
  }
  function render(){
    renderFilters();
    var cat=S.CATS.filter(function(c){return c.id===cur})[0]||S.CATS[0];
    desc.textContent=cat.name+' · '+cat.desc;
    var list=S.CATALOG.filter(function(p){return cur==='all'||p.cat===cur});
    if(!list.length){grid.innerHTML='<div class="empty">这一类暂时没有上架商品。</div>';return}
    grid.innerHTML=list.map(function(p){
      var open='<a class="btn p" href="'+esc(p.link)+'">'+(p.priceType==='paid'?'查看 / 购买':'打开使用')+'</a>';
      var prev=p.preview&&p.preview!==p.link?'<a class="btn s" href="'+esc(p.preview)+'">先看预览</a>':'';
      var down=p.download?'<a class="btn g" href="'+esc(p.download)+'">下载</a>':'';
      return '<article class="card">'+
        '<div class="ch"><div class="cn">'+esc(p.name)+'</div><span class="cc '+p.cat+'">'+esc(CAT[p.cat]||p.cat)+'</span></div>'+
        '<div class="tags">'+p.tags.map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>'+
        '<div class="val">'+esc(p.value)+'</div>'+
        '<div class="price">'+esc(p.price)+'</div>'+
        '<div class="btns">'+open+prev+down+'</div>'+
        '<div class="min">约 '+p.minutes+' 分钟上手</div>'+
        '<div class="next"><b>下一步：</b>'+esc(p.next)+'</div>'+
      '</article>';
    }).join('');
  }
  if(!S.CATALOG.length){grid.innerHTML='<div class="empty">商品目录未加载（检查 store-catalog.js）。</div>';return}
  render();
})();
</script>
</body>
</html>
