<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#1f2a37;

.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}

.grp{margin:0 0 12px}

.pill{background:#eef3f9;color:#3c5670}
.pill.sk{background:#eaf4ee;color:#2a7d4f}
.pill.fm{background:#f6f0e6;color:#96702a}

.pill.tm{background:#eef3f9;color:#5b6a7d}

/* ---- 路线图 ---- */
.rmap{margin:18px 0 6px;background:#fff;border:1px solid #e3e8ef;border-radius:12px;padding:18px 16px 14px}
.rmap .rt{font-size:13px;color:#5b6a7d;margin:0 0 14px;font-weight:700;letter-spacing:.5px}
.rtrack{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding-bottom:6px}
.rnode{flex:1;min-width:104px;text-align:center;position:relative;cursor:pointer}
.rnode .dot{width:30px;height:30px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:800;background:#e6ecf3;color:#8394a8;
  border:2px solid #d4dee8;transition:.2s;position:relative;z-index:2}
.rnode .nm{font-size:12.5px;color:#5b6a7d;line-height:1.35}
.rnode.done .dot{background:#2a7d4f;border-color:#2a7d4f;color:#fff}
.rnode.done .nm{color:#2a7d4f;font-weight:700}
.rnode.cur .dot{background:#e8b84b;border-color:#b98a1e;color:#3a2a05;
  box-shadow:0 0 0 5px rgba(232,184,75,.25);animation:pulse 2s infinite}
.rnode.cur .nm{color:#0f2a4a;font-weight:800}
.rnode.lock .dot{background:#f2f5f8;color:#b3bfcc}
.rnode.lock .nm{color:#a9b6c4}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(232,184,75,.25)}50%{box-shadow:0 0 0 9px rgba(232,184,75,.12)}}
.rline{position:absolute;top:15px;left:50%;width:100%;height:3px;background:#e6ecf3;z-index:1}
.rnode:last-child .rline{display:none}
.rline.pass{background:#2a7d4f}
.rprog{margin:14px 0 0;display:flex;align-items:center;gap:10px;font-size:13px;color:#43536a}
.rbar{flex:1;height:8px;background:#e6ecf3;border-radius:99px;overflow:hidden}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,#2a7d4f,#e8b84b);border-radius:99px;transition:.4s}
.rreset{background:none;border:0;color:#98a6b6;font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit}
/* ---- 站点卡片 ---- */
.station{background:#fff;border:1px solid #e3e8ef;border-radius:12px;margin:16px 0;overflow:hidden}
.station.cur{border-color:#e8b84b;box-shadow:0 3px 16px rgba(232,184,75,.18)}
.station.done{opacity:.92}
.st-h{padding:15px 18px 13px;background:linear-gradient(180deg,#fbfcfe,#f6f8fb);border-bottom:1px solid #e9eef4;

.st-no{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:#0f2a4a;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.station.done .st-no{background:#2a7d4f}
.station.cur .st-no{background:#e8b84b;color:#3a2a05}
.st-t{flex:1;min-width:0}
.st-t h3{margin:0 0 3px;font-size:17px;color:#0f2a4a}
.st-t .goal{margin:0;font-size:13.5px;color:#43536a;line-height:1.6}
.st-t .hrs{font-size:12px;color:#98a6b6;margin-top:3px}
.st-b{padding:14px 18px 16px}
.st-how{margin:0 0 13px;background:#f4f8fd;border-left:3px solid #1d6fb8;border-radius:0 8px 8px 0;
  padding:10px 13px;font-size:13.5px;line-height:1.75;color:#2c3e50}
.st-how b{color:#0f2a4a}
.st-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:13px}
.st-check{border:1px dashed #cfd8e3;border-radius:9px;padding:11px 13px;margin-bottom:13px}
.st-check .ct{font-size:12.5px;font-weight:800;color:#5b6a7d;margin:0 0 7px;letter-spacing:.5px}
.st-check label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:#33465c;

.viewtab{display:inline-flex;background:#e6ecf3;border-radius:9px;padding:3px;gap:3px;margin:14px 0 4px}

.viewtab button.on{background:#fff;color:#0f2a4a;box-shadow:0 1px 3px rgba(15,42,74,.12)}

var T = {"教学资料":{"c":"b3600a","sd":"给要开课、要上课的人","subs":[{"name":"备课","items":[{"u":"teach.html","n":"教学入口 · 打开就能上课","k":["入口"],"d":"教师总入口，第一次来从这里进。"},{"u":"book-teach.html","n":"开课教案完整版（32 章）","k":["教案","备课"],"d":"32 章逐章教案主书，讲什么、怎么讲、板书怎么排。"},{"u":"study-teach.html","n":"逐章备课与上课","k":["教案","上课"],"d":"备课与课堂现场执行版，比教案更贴课堂。"},{"u":"teach-case.html","n":"案例教材配套教案册","k":["教案","案例"],"d":"14 篇教学案例各自的配套教案。"},{"u":"teach-data.html","n":"教学数据工坊","k":["数据","练习"],"d":"云璟模拟数据库 + 练习模板，让学生手上有真数据可算。"},{"u":"curriculum.html","n":"教案总纲 · 14 模块","k":["教案"],"d":"M01–M14 十四个模块的详细教案。"},{"u":"selfcheck.html","n":"开课自检表","k":["自检"],"d":"开课前逐项自查，缺什么一目了然。"},{"u":"ai-verifier.html","n":"AI 教案校验器","k":["工具","质检"],"d":"把写好的教案丢进去，检查缺项与常见硬伤。"}]},{"name":"课件与微课","items":[{"u":"slides.html","n":"教材投屏课件 · 32 章","k":["课件","投屏"],"d":"32 章教材配的投屏课件总索引。"},{"u":"slides-teach.html","n":"按学时选课件","k":["课件","学时"],"d":"按课时多少选适用课件包。"},{"u":"sl-teach-16.html","n":"投屏课件 · 16 学时","k":["课件","短课"],"d":"课时紧张时的 16 学时版课件。"},{"u":"sl-teach-32.html","n":"投屏课件 · 32 学时","k":["课件"],"d":"标准 32 学时版课件。"},{"u":"sl-teach-48.html","n":"投屏课件 · 48 学时","k":["课件","长课"],"d":"课时充足的 48 学时版课件。"},{"u":"slides-case.html","n":"案例投屏课件 · 14 篇","k":["课件","案例"],"d":"案例教材 14 篇的投屏课件。"},{"u":"slides-outline.html","n":"32 章课件大纲","k":["大纲"],"d":"课件大纲，改课时、挑章节前先看这份。"},{"u":"micro-course.html","n":"院校版微课方案","k":["微课","方案"],"d":"六模块 + 学练战证的微课整体方案。"},{"u":"micro-course-scripts.html","n":"32 节微课脚本","k":["微课","脚本"],"d":"32 节微课逐节脚本，可直接照着录。"},{"u":"micro-player.html","n":"微课放映版 · 32 节","k":["微课","放映"],"d":"带分镜与旁白的放映版，可直接播放给学生。"},{"u":"micro-major.html","n":"微专业方案 · 96 学时","k":["微专业"],"d":"《酒店与旅游业收益管理》微专业整体方案。"}]},{"name":"专业建设与授权","items":[{"u":"course-standard.html","n":"课程标准","k":["标准","申报"],"d":"可直接用于课程申报与专业建设的课程标准文本。"},{"u":"course-ruler.html","n":"课程标尺设计","k":["评价","标尺"],"d":"课程达成度怎么量、怎么评。"},{"u":"license-course.html","n":"授权课程包设计","k":["授权","商务"],"d":"做成可认证版权课的设计方案。"},{"u":"quality-manual.html","n":"授权课程包 · 质量手册","k":["授权","质量"],"d":"授权课的质量标准与交付要求。"},{"u":"teacher-training.html","n":"师资培训包","k":["师资","培训"],"d":"两天师资培训课程与考核，可录播。"}]}]},"认证考核":{"c":"a02c4a","sd":"给要考证、要验收的人","subs":[{"name":"认证体系","items":[{"u":"cert.html","n":"资格认证 · 三级收益管理师","k":["认证","入口"],"d":"认证主入口：L1 助理 / L2 收益管理师 / L3 高级，各自的条件与路径。"},{"u":"certification.html","n":"考核认证标准","k":["标准"],"d":"考核怎么组织、怎么判分的标准文本。"},{"u":"cert-hub.html","n":"学习履历与认证准备度","k":["进度","自评"],"d":"汇总训练营、闯关、打卡、自测数据，自动判定 L1–L3 的准备度与缺口。"},{"u":"exam.html","n":"考核与题库目录","k":["题库","目录"],"d":"所有题库的总目录。"},{"u":"quiz.html","n":"在线考核","k":["考核"],"d":"在线答题入口。"},{"u":"quest.html","n":"考级认证 · 决策闯关","k":["考级","闯关"],"d":"以闯关形式进行的考级。"}]},{"name":"题库与自测","items":[{"u":"exam-book.html","n":"习题集 · 138 题含答案","k":["题库","解析"],"d":"90 题流程篇 + 48 题案例篇，每题带答案解析。"},{"u":"wb.html","n":"演练题库 · 237 题","k":["题库","分级"],"d":"按 M01–M14 组织，可按三级能力达成标准与难度筛题。"},{"u":"flow-quest.html","n":"流程闯关 · 90 关","k":["题库","流程"],"d":"流程篇 90 题的闯关版，带错题本。"},{"u":"case-quiz.html","n":"案例自测 · 48 题","k":["题库","案例"],"d":"案例篇 48 题自测。"},{"u":"case-check.html","n":"案例配套自测 · 42 题","k":["题库","案例"],"d":"对应 14 篇教学案例的自测题。"},{"u":"coll-modules.html","n":"认证模块全集 M01–M14","k":["模块"],"d":"十四个认证模块的目录索引。"}]},{"name":"入行训练营","items":[{"u":"camp-rm.html","n":"入行实操训练营 · 总览","k":["训练营"],"d":"12 周四个阶段 12 个实操任务的总览。"},{"u":"camp-assess.html","n":"考核与结业标准","k":["结业","量规"],"d":"训练营结业怎么评，附评分量规与答辩要求。"}]}]}}, ORD = ["备课", "课件与微课", "专业建设与授权", "认证体系", "题库与自测", "入行训练营"];
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function render(){
  var q = document.getElementById('q').value.trim(), n = 0, html = '';
  Object.keys(T).forEach(function(name){
    var blocks = '', cnt = 0;
    T[name].subs.sort(function(a,b){ return ORD.indexOf(a.name) - ORD.indexOf(b.name); });
    T[name].subs.forEach(function(sub){
      var items = sub.items.filter(function(it){
        if (!q) return true;
        return ((it.n+' '+(it.d||'')+' '+(it.k||[]).join(' ')).toLowerCase().indexOf(q.toLowerCase()) >= 0);
      });
      if (!items.length) return;
      cnt += items.length;
      blocks += '<div class="grpblk"><h4>' + esc(sub.name) + '</h4><div class="grid">'
        + items.map(function(it){
            var ps = (it.k||[]).map(function(k){ return '<span class="pill">' + esc(k) + '</span>'; }).join('');
            return '<article class="card"><h3><a href="' + esc(it.u) + '">' + esc(it.n) + '</a></h3>'
              + '<div class="pills">' + ps + '</div><p>' + esc(it.d) + '</p></article>';
          }).join('') + '</div></div>';
    });
    if (!cnt) return;
    n += cnt;
    html += '<section class="sec"><h2 style="border-color:#' + T[name].c + '">' + esc(name)
      + '　<span style="font-size:14px;color:#5b6a7d;font-weight:400">' + cnt + ' 项</span></h2>'
      + '<p class="sd">' + esc(T[name].sd) + '</p>' + blocks + '</section>';
  });
  document.getElementById('cnt').innerHTML = '显示 <b>' + n + '</b> 项';
  document.getElementById('secs').innerHTML = html || '<div class="empty">没有匹配的资源。</div>';
}
document.getElementById('q').addEventListener('input', render);
render();
</script>
