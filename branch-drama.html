<h1>分支互动剧 · 五个高危情景</h1>
<p>超售救场、团队压价、总经理汇报、渠道倒挂、旺季定价。每个走两步，不同选择通向不同结局——不看对错，看后果。</p>
</div></header>
<main class="wrap">

<h2>五个情景，每个都有三种结局</h2>
<p class="lead">这些是岗位上最容易出事、也最考验判断的五个场景。每个场景走两步，不同选择通向不同结局，结局会告诉你为什么会这样、依据在哪张表。</p>
<div class="note"><b>怎么玩：</b>选一个情景 → 读场景 → 点你的选择 → 看即时反馈 → 走到结局。<b>不看对错，看后果</b>——同一个选择在不同情境下可能是对的。</div>

<script>
var D = [{"id": "ov", "title": "超售救场", "tag": "高危", "scene": "旺季满房夜。按参数超售了 8 间，今晚有 6 位客人到店无房，其中一位是白金会员，已经在前台情绪激动。你是收益经理，现在站在大堂。", "start": "n1", "nodes": {"n1": {"text": "前台喊你过去。你的第一反应是什么？", "opts": [{"t": "先道歉，立刻安排同档次酒店并承担差价与交通", "to": "n2a", "fb": "对。现场第一原则是止损声誉——争辩只会把一次补偿变成一次差评。"}, {"t": "向客人解释超售是行业惯例，请他理解", "to": "n2b", "fb": "不对。客人在气头上时，解释＝推卸。他听到的只有\"你没房还很有理\"。"}, {"t": "让前台先处理，你去后台算今晚的损失", "to": "n2c", "fb": "不妥。现场没人拍板，前台只能反复道歉，客人情绪会继续升温。"}]}, "n2a": {"text": "客人被送去同档次酒店，你承诺承担差价。第二天，你还要做什么？", "opts": [{"t": "当晚回访，次日给补偿（积分/下次免费升级），并在台账复盘超售参数", "to": "eg", "fb": "完整。补救做到位，还把根因（超售参数）改掉。"}, {"t": "安排完就算了，客人没再投诉就不需要跟进", "to": "em", "fb": "可惜。客人不会投诉，但也不会再来——你损失的是复购，而这看不见。"}]}, "n2b": {"text": "客人当场录像，说要在平台曝光。现在怎么办？", "opts": [{"t": "立刻改口道歉，升级处理：安排酒店 + 补偿 + 亲自跟进", "to": "em", "fb": "补救方向对了，但成本已经翻倍：多花的时间、补偿额度、以及已经说出去的话。"}, {"t": "坚持立场，让客人走投诉流程", "to": "eb", "fb": "最差的选择。一次超售省下的房费，远抵不过一条带视频的差评。"}]}, "n2c": {"text": "前台勉强把客人安顿了，但没人给出补偿承诺。你回来后？", "opts": [{"t": "补上补偿与道歉，并复盘为什么自己不在现场", "to": "em", "fb": "补了一半。客人拿到了补偿，但第一时间的体验已经受损。"}, {"t": "既然已经安顿了，就不必再提", "to": "eb", "fb": "这就是\"没人负责\"的典型。客人记住的不是有没有房，是出了事有没有人管。"}]}, "eg": {"end": true, "lv": "好结局", "title": "一次事故，换回一个忠实客户", "text": "客人后来在点评里写了这件事的处理过程，反而成了正面口碑。更重要的是你在台账里复盘了超售参数：那晚的取消率假设偏高，硬上限也应该下调。", "why": "超售的价值在于对冲取消与未到，但它的代价是\"客人到店无房\"——这是一个非线性损失：省下的是一间房费，赔上的是客户终身价值与品牌评分。所以硬上限必须守，触发后必须复盘。", "u": "m07.html", "ul": "超售与库存控制"}, "em": {"end": true, "lv": "中结局", "title": "事情平了，但客人不会再来了", "text": "当晚顺利收场，没有差评，也没有表扬。这位白金会员三个月后转投了隔壁那家。你不知道原因。", "why": "不投诉不等于满意。收益岗最容易低估的就是\"沉默流失\"——它没有数据、没有告警，只在复购率里慢慢显现。补救的窗口只在事发当晚。", "u": "m07.html", "ul": "超售与库存控制"}, "eb": {"end": true, "lv": "差结局", "title": "省下 8 间房费，赔上一条差评", "text": "视频上了平台，集团通报，前三个月的直销转化可见下滑。财务算下来，那晚超售多赚的钱不到损失的十分之一。", "why": "超售是收益手段里风险最不对称的一个：收益有上限（省几间空房），损失无上限（品牌、评分、集团信任）。任何时候都不要赌，硬上限就是用来不让你赌的。", "u": "m07.html", "ul": "超售与库存控制"}}}, {"id": "tm", "title": "团队压价", "tag": "高频", "scene": "销售接了一个 80 间、连住 2 晚的团队，报价比你的团队底线低 15%。销售说：\"不接就丢了，这家一年就这一次。\"", "start": "n1", "nodes": {"n1": {"text": "你怎么回应销售？", "opts": [{"t": "先算总贡献：这单含不含餐饮和会议室？加起来够不够底线？", "to": "n2a", "fb": "对。团队从来不是只看房价——先把总贡献算出来，才有谈判的余地。"}, {"t": "直接拒绝：低于底线，没有讨论空间", "to": "n2b", "fb": "太硬。底线是算出来的，不是喊出来的；而且你还没算，怎么知道它一定低于底线？"}, {"t": "让销售自己去谈，你只负责给一个数字", "to": "n2c", "fb": "把决策推出去了。销售只会继续压你，因为他也知道你没算过。"}]}, "n2a": {"text": "算下来：房价确实低于底线，但这单含两场宴会和一间会议室，总贡献刚好够。接下来？", "opts": [{"t": "接，但加上取消条款与餐饮保底，并留痕说明依据", "to": "eg", "fb": "漂亮。既守住了底线，又给了销售台阶，还留下了事后可复盘的依据。"}, {"t": "既然够底线，就直接接，不再提条件", "to": "em", "fb": "少了保护。团队单最大的风险不是价格，是取消——没有条款，你等于裸奔。"}]}, "n2b": {"text": "销售很不高兴：\"那你给个能接的价。\"", "opts": [{"t": "给出替代方案：降到 60 间接，或换到淡日，价格按档位给", "to": "em", "fb": "方向对，但晚了。如果一上来就给方案，销售会觉得你在帮忙而不是在挡他。"}, {"t": "坚持不接，不提供任何替代方案", "to": "eb", "fb": "你把一次商务判断变成了部门对立。下个大单，销售不会再提前找你。"}]}, "n2c": {"text": "销售按自己理解去谈了，回来报了个更低的价格。", "opts": [{"t": "补算总贡献，发现确实亏，紧急叫停并重谈", "to": "em", "fb": "止损了，但代价是销售在客户面前失了一次信。"}, {"t": "已经报出去了，就这样吧", "to": "eb", "fb": "这是最典型的\"没有底线\"：底线不是挂在墙上的数字，是每一次都要算的动作。"}]}, "eg": {"end": true, "lv": "好结局", "title": "接了单，也守住了底线", "text": "团队如期入住，宴会消费达标，取消条款让最后 10 间的取消没有造成空房。销售下次接单前会主动先问你。", "why": "团队底线＝\"不接这个团队、改卖散客能拿多少\"，是机会成本不是成本价。判断依据是总贡献（房价＋餐饮＋会议室）与置换成本的比较，而不是房价本身。", "u": "m10.html", "ul": "团队与会议"}, "em": {"end": true, "lv": "中结局", "title": "单接了，但你心里没底", "text": "单接成了，但过程中你始终是被动的：要么少了条款保护，要么和销售的信任被消耗了一次。", "why": "团队谈判的本质是信息交换：你要量承诺和附加消费，他才拿得到价格档位。只谈价格、不谈条件，你就永远在被压的一方。", "u": "m10.html", "ul": "团队与会议"}, "eb": {"end": true, "lv": "差结局", "title": "要么亏本接，要么丢客户又丢关系", "text": "这单一亏就是两晚 160 间夜的机会成本；更麻烦的是，销售以后会把你当成\"审批障碍\"而不是\"算账的战友\"。", "why": "收益岗的价值不在于说\"不\"，而在于说\"怎么样才行\"。拒绝不给方案，就是把协同关系变成对抗关系——而跨部门协同本身，就是这个岗位的核心能力。", "u": "m13.html", "ul": "跨部门协同"}}}, {"id": "rp", "title": "总经理汇报", "tag": "高频", "scene": "月度经营会。你的每间可售房收入同比涨了 3%，但经营毛利同比跌了 1%。总经理抬眼问你：\"为什么？\"", "start": "n1", "nodes": {"n1": {"text": "这一句\"为什么\"，你先答什么？", "opts": [{"t": "拆成\"量\"和\"价\"，再看渠道结构", "to": "n2a", "fb": "对。收入变化先拆量价，再看是哪些渠道带来的——结构问题通常就在这里。"}, {"t": "市场不好、竞对在打价格战", "to": "n2b", "fb": "这是最常见的错误答法：把内部问题归因成外部原因，而且无法被追问时自证。"}, {"t": "把报表从头到尾讲一遍，让他自己看", "to": "n2c", "fb": "老板问的是结论，不是数据。让他自己找答案＝你没做分析。"}]}, "n2a": {"text": "你拆出来：出租率涨了，但低价渠道占比上升，净收入其实没跟上。总经理点头，然后问：\"那下一步？\"", "opts": [{"t": "给出具体动作，并说清需要他批什么", "to": "eg", "fb": "完美。汇报的终点从来不是解释，而是\"要一个决定\"。"}, {"t": "把原因讲透就结束，等他布置", "to": "em", "fb": "解释清楚了，但会开完没有结论——下次他不会再问你\"下一步\"。"}]}, "n2b": {"text": "他追问：\"竞对具体降了多少？我们跟了没有？\"", "opts": [{"t": "会后补数据，第二天给他一份完整拆解", "to": "em", "fb": "补上了，但在会上失了一次分：老板记住的是\"他当时答不上来\"。"}, {"t": "继续强调外部环境，坚持是市场原因", "to": "eb", "fb": "把一次可以挽回的解释，变成了立场之争。"}]}, "n2c": {"text": "他打断你：\"直接说结论。\"", "opts": [{"t": "立刻收住，给结论和下一步", "to": "em", "fb": "救回来了，但前面的几分钟已经消耗了他的耐心。"}, {"t": "坚持把数据讲完，这样才严谨", "to": "eb", "fb": "严谨不是目的。汇报的目的是让对方做出决定，顺序错了就是无效沟通。"}]}, "eg": {"end": true, "lv": "好结局", "title": "你要到了授权", "text": "当场定了渠道结构调整的方案和责任人。会后总经理对别人说：\"收益这个岗位，现在能讲清楚事了。\"", "why": "向上汇报只有三件事：结果、原因、需要对方做什么决定。一页纸六板块的顺序就是为此设计的——结论在最前面，因为老板没时间在最后一页找答案。", "u": "m12.html", "ul": "会议与汇报"}, "em": {"end": true, "lv": "中结局", "title": "讲清楚了，但会没有结论", "text": "原因大家都听懂了，然后散会。下一个月，同样的问题会再出现一次。", "why": "汇报不落到\"要什么决定\"，就只是一次信息传递。收益岗的专业性，一半体现在算得准，一半体现在推动得动。", "u": "m12.html", "ul": "会议与汇报"}, "eb": {"end": true, "lv": "差结局", "title": "失去了他的信任", "text": "此后他开始直接问前厅和销售的口径，月度会上你的环节被压缩到五分钟。", "why": "把指标翻译成经营语言，是这个岗位最贵的能力。说不出\"赚多少、风险在哪、要批什么\"，数据再准也没有话语权。", "u": "m12.html", "ul": "会议与汇报"}}}, {"id": "ch", "title": "渠道倒挂", "tag": "高危", "scene": "周五晚上，你在手机上看到：某 OTA 上高级房比官网低 80 元，而且已经卖出去 15 间了。", "start": "n1", "nodes": {"n1": {"text": "现在是周五晚上。你做什么？", "opts": [{"t": "立刻停掉该渠道该房型的售卖，对齐价格后再开", "to": "n2a", "fb": "对。价格一致性是红线，先止血再查原因。"}, {"t": "周末先放着，周一上班再处理", "to": "n2b", "fb": "周末是预订高峰。两天时间足够再卖出去几十间，也足够被客人截图传播。"}, {"t": "把官网价格降到和它一样", "to": "n2c", "fb": "这是用损失换一致——你把整个价格体系往下拽了一次，代价远大于 15 间。"}]}, "n2a": {"text": "你停了售卖并对齐了价格。接下来？", "opts": [{"t": "补上每日一致性核查，并在台账记录发现与处理过程", "to": "eg", "fb": "完整。一次事故换一套机制，这才叫复盘。"}, {"t": "处理完就结束，反正已经对齐了", "to": "em", "fb": "这次是人工发现的，下次呢？同类问题一定会再来一次。"}]}, "n2b": {"text": "周一你来处理时，发现周末又卖了 40 间，还多了一条差评截图。", "opts": [{"t": "紧急对齐价格，补做核查机制", "to": "em", "fb": "止损了，但多付了 40 间的差价和一条差评的成本。"}, {"t": "既然已经卖完了，就悄悄改回来，不提这事", "to": "eb", "fb": "掩盖问题比问题本身更危险：下次爆出来时，性质就从失误变成了隐瞒。"}]}, "n2c": {"text": "官网降到一致后，直销的价格锚点被打破了。", "opts": [{"t": "活动结束后把价格调回原位", "to": "em", "fb": "能回来，但这段时间所有渠道的成交价都被拉低了，会员也会问\"为什么官网更贵过\"。"}, {"t": "既然降了就维持，省得再出倒挂", "to": "eb", "fb": "等于让外部渠道替你定了价。直销体系从此失去意义。"}]}, "eg": {"end": true, "lv": "好结局", "title": "一次事故换一套机制", "text": "此后每天的一致性核查成了例行动作，同类问题再没发生过。你在复盘里写了一句：价格一致性不是价格问题，是流程问题。", "why": "同房型、同日期、各渠道价格一致是必须每天核查的红线。倒挂的真正代价不是那几间差价，而是直销信任被击穿——客人一旦发现官网更贵，就不会再来官网。", "u": "m08.html", "ul": "渠道与分销"}, "em": {"end": true, "lv": "中结局", "title": "止损了，但多付了学费", "text": "问题解决了，代价是一批低价订单和一条差评。你意识到了，但还没把它变成机制。", "why": "渠道问题的共同点是\"发现得越晚越贵\"。人工发现的成本远高于每日自动核查——机制的意义就在于把发现时间从几天压到一天。", "u": "m08.html", "ul": "渠道与分销"}, "eb": {"end": true, "lv": "差结局", "title": "价格体系被外部渠道牵着走", "text": "此后每次有渠道降价，你都跟着降。三个月后，直销占比从 38% 掉到 24%，综合渠道成本率上升了两个点。", "why": "价格一致性守的不是\"价格\"，是\"谁定价\"。一旦让外部渠道成为价格锚点，你就失去了定价权，也就失去了这个岗位存在的意义。", "u": "m08.html", "ul": "渠道与分销"}}}, {"id": "pk", "title": "旺季定价", "tag": "高频", "scene": "三天后城市有一场大型展会。需求明显起来了，竞对已经提价 30%。销售在群里催：\"赶紧拉满，别让别人抢先。\"", "start": "n1", "nodes": {"n1": {"text": "你怎么定这一波价格？", "opts": [{"t": "先分确定性：展会确定的日子先锁价收紧，不确定的日子留观察窗口", "to": "n2a", "fb": "对。事件型需求最忌讳一次性拉满——因为你还不知道真实需求有多强。"}, {"t": "立刻把价格拉到竞对水平，甚至更高", "to": "n2b", "fb": "竞对提价不代表需求一定跟得上。你跟的是他的价格，不是你的需求。"}, {"t": "先小幅提价观察一天再说", "to": "n2c", "fb": "保守没错，但\"观察\"要有判断标准，否则就是你不敢决策的借口。"}]}, "n2a": {"text": "展会前两天锁价并收紧了低价渠道，第三天留了观察窗口。在手进度开始快速上涨。", "opts": [{"t": "按在手进度逐步加码，同时收紧最低住店天数", "to": "eg", "fb": "完美。用真实进度驱动加价，而不是一次性赌到底。"}, {"t": "锁完价格就等展会开始", "to": "em", "fb": "少了后半程。需求还在涨，你的价格却停了——少赚的那一截才是这波最大的收益。"}]}, "n2b": {"text": "价格拉满后，在手进度反而慢下来了——竞对还有房，而你已经贵出一大截。", "opts": [{"t": "发现不对，赶紧回调并重新按进度走", "to": "em", "fb": "止损及时，但高价那两天已经吓退了一批真实需求。"}, {"t": "坚持高价，相信展会当天会满", "to": "eb", "fb": "把定价变成了赌博。收益管理的前提是\"按证据决策\"，不是\"按信心决策\"。"}]}, "n2c": {"text": "小幅提价后进度继续涨，但销售还在催你加。", "opts": [{"t": "设一个判断标准（进度到多少就加到多少），按标准执行", "to": "em", "fb": "有了标准就比拍脑袋强，只是起步晚了两天，少了前段收益。"}, {"t": "不敢加，怕把客人吓跑", "to": "eb", "fb": "满房前不敢提价，是收益岗最常见的损失来源：你不是卖不出去，是卖便宜了。"}]}, "eg": {"end": true, "lv": "好结局", "title": "卖满，也卖到了价", "text": "展会三天满房，平均房价同比提升 24%，且没有客人投诉\"临时涨价\"。复盘时你写下一条：大型活动定价要分层，别一次拉满。", "why": "事件型需求的核心是不确定性。按确定性分层处理：确定的部分提前锁价与限制条件，不确定的部分留观察窗口，再按在手进度逐步加码——既不吃掉尾部收益，也不把风险一次押上。", "u": "m04.html", "ul": "需求预测与监控"}, "em": {"end": true, "lv": "中结局", "title": "满房了，但少赚了一截", "text": "三天都满房，但平均房价只提升了 12%。老板说\"不错\"，你知道本来可以更好。", "why": "满房不等于收益最大化。判断有没有卖到位，看的不是最后一天有没有房，而是\"最后一天你还在不在提价\"——如果在，说明你一直慢半拍。", "u": "m05.html", "ul": "动态定价"}, "eb": {"end": true, "lv": "差结局", "title": "要么空置，要么被投诉", "text": "高价那两天掉了一批订单，最后靠临时降价清房，还收到几条\"坐地起价\"的差评。品牌和收益两头都没拿到。", "why": "定价不是猜大小。所有价格动作都要有依据：看预测、看在手、看竞对、看剩余需求。凭信心定的价，对了是运气，错了是事故。", "u": "m05.html", "ul": "动态定价"}}}];
var cur = null, node = null, path = [];
function esc(s){return String(s).replace(/[&<>]/g,function(m){return m=='&'?'&amp;':m=='<'?'&lt;':'&gt;'})}
function showPick(){
  document.getElementById('stage').classList.add('hide');
  document.getElementById('endc').classList.add('hide');
  var g = document.getElementById('pick'); g.innerHTML = '';
  D.forEach(function(d){
    var a = document.createElement('div');
    a.className = 'mini'; a.style.cursor = 'pointer';
    a.innerHTML = '<b>' + d.title + ' <span class="pill g">' + d.tag + '</span></b><span style="margin-top:6px">' +
      d.scene.slice(0, 46) + '…</span><span style="margin-top:8px;color:#3d8bd4">开始 →</span>';
    a.addEventListener('click', function(){ start(d.id); });
    g.appendChild(a);
  });
}
function start(id){
  cur = D.filter(function(x){return x.id === id})[0];
  node = cur.start; path = [];
  document.getElementById('pick').innerHTML = '';
  document.getElementById('stage').classList.remove('hide');
  document.getElementById('endc').classList.add('hide');
  document.getElementById('dt').textContent = cur.title;
  document.getElementById('ds').textContent = cur.scene;
  render();
}
function render(){
  var n = cur.nodes[node];
  if(n.end){ showEnd(n); return; }
  document.getElementById('nt').textContent = n.text;
  var box = document.getElementById('no'); box.innerHTML = '';
  n.opts.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'btn o'; b.style.display = 'block'; b.style.width = '100%'; b.style.textAlign = 'left';
    b.textContent = o.t;
    b.addEventListener('click', function(){
      path.push(o.t);
      var f = document.getElementById('nf');
      f.className = 'quote'; f.innerHTML = '<b>即时反馈：</b>' + o.fb;
      document.getElementById('path').innerHTML = path.map(function(p){return '<li>' + esc(p) + '</li>'}).join('');
      node = o.to;
      setTimeout(render, 60);
    });
    box.appendChild(b);
  });
}
function showEnd(n){
  document.getElementById('stage').classList.add('hide');
  var e = document.getElementById('endc'); e.classList.remove('hide');
  document.getElementById('et').textContent = '【' + n.lv + '】' + n.title;
  document.getElementById('etx').textContent = n.text;
  document.getElementById('ewhy').innerHTML = '<b>为什么：</b>' + n.why;
  var u = document.getElementById('eu');
  u.href = n.u; u.textContent = '看依据：' + n.ul;
}
document.getElementById('again').addEventListener('click', function(){ start(cur.id); });
document.getElementById('again2').addEventListener('click', function(){ start(cur.id); });
document.getElementById('back').addEventListener('click', showPick);
showPick();
</script>
