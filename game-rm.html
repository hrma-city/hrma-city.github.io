<script>
var CH=[{"ch": "ch01", "t": "收益管理是什么", "story": "您接手云璟酒店收益岗的第一天。前台小王刚把最后一间房以 320 元卖了出去——而同样的房，上周六卖过 780 元。周总问您：这是不是乱来？", "q": "同一间房，昨天卖 300、今天卖 800，问题到底出在哪？", "opts": [["是前台乱报价，应该统一成一个价", "bad", "统一价会把旺季的钱白白送出去。旺季卖 780 不是乱来，是需求真的到了。"], ["不是乱来，是需求不同；要管的是在什么时间、以什么价、卖给谁", "best", "对。这正是收益管理要解决的问题。"], ["只要出租率上去就行，价格低一点没关系", "bad", "只看出租率会亏钱：满房但价低，收入反而更少。"]], "lesson": "收益管理＝在正确的时间、以正确的价格、通过正确的渠道，把正确的房卖给正确的客人。判据不是「出租率最高」，也不是「房价最高」，而是两者的组合最优——即 RevPAR 与净收入最优。", "key": "同房不同价不是乱来，需求不同才是原因。", "part": "第一篇 · 认知篇"}, {"ch": "ch02", "t": "三个核心指标 OCC、ADR、RevPAR", "story": "月底经营会。前厅经理报：「出租率 85%，住得很好！」销售经理报：「平均房价 520，守得也不错！」两人都在报喜，可财务一算，客房收入比上月还少。", "q": "该用哪个指标判断这个月到底好不好？", "opts": [["出租率 OCC", "ok", "OCC 只看量，会漏掉价格损失。"], ["RevPAR（每间可售房收入）＝ OCC × ADR", "best", "对。RevPAR 同时容纳量与价，才是最终判据。"], ["平均房价 ADR", "ok", "ADR 只看价，会漏掉空置损失。"]], "lesson": "OCC＝已售房夜 ÷ 可售房夜；ADR＝客房收入 ÷ 已售房夜；RevPAR＝客房收入 ÷ 可售房夜，也等于 OCC × ADR。云璟基准：OCC 68%、ADR 620 元、RevPAR 422 元。单看 OCC 或 ADR 都会失真。", "key": "高出租率 + 低房价是最常见的陷阱，必须用 RevPAR 判优劣。", "part": "第一篇 · 认知篇"}, {"ch": "ch03", "t": "竞争三件套 MPI、ARI、RGI", "story": "云璟本店 ADR 620 元、出租率 68%；同商圈同档次竞品群平均 ADR 680 元、出租率 72%。周总问：我们到底算好还是算差？", "q": "用什么才能看清本店在竞争群里的真实位置？", "opts": [["跟自己去年同期比就够了", "bad", "只跟自己比会看不见对手的位移。"], ["MPI（量）+ ARI（价）+ RGI（收入）三个指数", "best", "对。三个指数一起看，才能分清是量的问题还是价的问题。"], ["只看平均房价在商圈里排第几", "ok", "只看价格会漏掉出租率的位置。"]], "lesson": "MPI＝本店 OCC ÷ 竞品群 OCC；ARI＝本店 ADR ÷ 竞品群 ADR；RGI＝本店 RevPAR ÷ 竞品群 RevPAR，也等于 MPI × ARI。RGI > 1 领先，< 1 落后。特别要警惕 MPI > 1 而 ARI < 1——那是靠低价换量，利润正在被侵蚀。", "key": "RGI 是最终结论；量和价必须一起看。", "part": "第一篇 · 认知篇"}, {"ch": "ch04", "t": "价格弹性：降多少价能换多少量", "story": "您想把 620 元降到 560 元，指望多卖一些。可降多少价，到底能换回多少间？如果换不回来，这次降价就是白白损失。", "q": "判断这次降价划不划算，第一步该算什么？", "opts": [["先降 100 试试，看效果再说", "bad", "先试再改，损失已经发生了。"], ["价格弹性系数＝销量变动百分比 ÷ 价格变动百分比", "best", "对。有了弹性系数，才能推算降价后到底能多卖多少。"], ["看竞品有没有跟着降", "ok", "竞品是参考，但算不出您自己的量价关系。"]], "lesson": "弹性＝销量变动百分比 ÷ 价格变动百分比，通常取绝对值判断。绝对值 > 1（富有弹性）降价可增收；< 1（缺乏弹性）降价反而减收。需求旺盛时弹性偏低，此时宜提价；需求疲软时弹性偏高，才可谨慎降价换量。", "key": "降价之前先算弹性，别凭感觉试。", "part": "第一篇 · 认知篇"}, {"ch": "ch05", "t": "什么时候涨价", "story": "11 月某个周三。云璟未来 14 天的预订进度已到 62%，高于去年同期的 54%；竞品 A 已把挂牌价从 880 提到 920。本店 BAR 仍是 620 元。", "q": "这时候该怎么办？", "opts": [["立刻大幅提到 900，一次到位", "bad", "一次跳到位容易吓跑客人，也会失去观察窗口。"], ["阶梯式小步上调一档，24 小时后看 pickup 再决定", "best", "对。涨价要小步快跑，边涨边看市场反应。"], ["再等等，等进度到 80% 再说", "ok", "等太久会错过窗口，需求最旺的时候价格反而没跟上。"]], "lesson": "三看法则：一看进度（与去年同期、与目标比）；二看竞品（ARI 与 RGI 的位置）；三看弹性（涨价后的量损测算）。进度超前 + 竞品普涨 + RGI < 1，就是涨价的三个信号。", "key": "涨价的三个信号：进度超前、竞品普涨、RGI 小于 1。", "part": "第二篇 · 决策篇"}, {"ch": "ch06", "t": "竞品降价：跟还是不跟", "story": "竞品 B 把挂牌价从 680 元降到 600 元，本店仍是 620 元。销售部急着问：「我们降不降？」", "q": "第一步该看什么？", "opts": [["马上跟到 590，压过它", "bad", "盲目跟价会白白损失，而且可能对方只是短期促销。"], ["先看 pickup 与取消率有没有被影响，再确认是长期调价还是短期促销", "best", "对。用数据判断，而不是用情绪判断。"], ["完全不理，我们产品更好", "ok", "产品力强可以不跟，但要先确认 pickup 确实没被影响。"]], "lesson": "先分清性质：全房型还是局部房型、长期调价还是短期促销。再看本店 pickup 与取消率的实际变化。短期促销不必跟；全城普降且需求疲软才跟；不跟时用含早、房型升级等非价格手段补偿。", "key": "跟不跟，看 pickup，不看情绪。", "part": "第二篇 · 决策篇"}, {"ch": "ch07", "t": "折扣与促销：什么时候该让", "story": "淡季将至，销售部想做「住二送一」冲量。这个折扣让出去，换来的是真增量，还是把本来就会来的客人变便宜了？", "q": "这个折扣该怎么给？", "opts": [["直接全场七折，冲量最重要", "bad", "无条件的折扣等于长期降价，还会挤占正价客。"], ["带限制条件：提前预订、不可取消、限定房型与日期、限量", "best", "对。条件把促销框住，只让真正新增的客人享受。"], ["只对老客户给，回馈忠诚度", "bad", "合规风险：对特定人群做区别定价，可能触碰「大数据杀熟」红线。"]], "lesson": "无条件的折扣就是长期降价。必须配条件：提前期、不可取消、限定房型与日期、限量。合规要点：明码标价、同一渠道同一时点同价、不得对特定人群区别定价。复盘时看增量里有多少是新客、有多少是被挤占的正价客。", "key": "折扣一定要带条件；不带条件的折扣就是降价。", "part": "第二篇 · 决策篇"}, {"ch": "ch08", "t": "套餐与锚定：让客人觉得划算", "story": "云璟想推「客房 + 双早 + 行政酒廊」套餐。加的东西成本不高，但客人觉得值。", "q": "套餐定价的关键是什么？", "opts": [["越便宜越好，先把量冲起来", "bad", "套餐价低于纯房价，等于自降身价。"], ["低于单买之和、高于纯房价；且附加成本低、感知价值高", "best", "对。套餐用低边际成本换高感知价值。"], ["按成本加 10% 定", "ok", "成本加成会漏掉客人的感知价值，可能定低了。"]], "lesson": "套餐价低于单买之和、高于纯房价，先算清边际成本再定。附加成本低而感知价值高的项目（早餐、酒廊、接送）优先做；成本高而感知低的不要做。还要设限制条件，避免套餐挤占高价值散客。", "key": "套餐的意义，是用低边际成本换高感知价值。", "part": "第二篇 · 决策篇"}, {"ch": "ch09", "t": "房型价差：差价定多少才合理", "story": "云璟 300 间：高级 150、豪华 90、行政 45、套房 15。高级与豪华差 80 元，豪华与行政差 200 元。这个阶梯合理吗？", "q": "怎么判断房型价差合不合理？", "opts": [["看客人是往上买还是往下买", "best", "对。客人的升降级行为就是市场给出的答案。"], ["按装修成本差额定", "ok", "成本是下限，但客人的感知才是定价依据。"], ["价差越大越好，反正总有人买贵的", "bad", "价差过大会把客人都挤到低价房型。"]], "lesson": "价差要与「差异的可感知程度」和「额外变动成本」对应。客人普遍升级购买说明价差偏小，普遍降级说明价差偏大。房型开关有固定顺序：先关低价房型，后关高价房型。", "key": "客人往上买还是往下买，会直接告诉您价差对不对。", "part": "第二篇 · 决策篇"}, {"ch": "ch10", "t": "最短住期 MinLOS：用条件把客群分开", "story": "周末只剩周六一晚的房，很多人只想住一晚。可一住一晚，周五和周日就空着——两头的空房比这一晚赚的还多。", "q": "该怎么办？", "opts": [["设最短住期 2 晚，把两端填上", "best", "对。MinLOS 的作用就是填补空档。"], ["周六降价促销，先把这一晚卖完", "ok", "能卖掉，但两头的空房还是空的。"], ["关掉周六的房，全留给长住客", "bad", "关房不会自动变成长住客。"]], "lesson": "MinLOS 用来填补 gap night。通常设 2–3 晚，选定作用的房型与日期，比较「被挡掉的短住客人损失」与「留住长住客带来的两端收益」。全程各日都紧张时不必设；度假型或长住客群为主时更适用。设置后如果整体出租率下降，立即撤销。", "key": "最短住期是用来填空档的，不是用来提价的。", "part": "第二篇 · 决策篇"}, {"ch": "ch11", "t": "超额预订：卖出去的比有的多", "story": "周六，300 间房已售出 285 间。历史数据：No-show 率约 8%，临近取消率约 12%。销售部希望再接 20 间。", "q": "能超售多少？", "opts": [["按 No-show 与取消的历史值测算，再扣掉一段保障缓冲", "best", "对。超售是算出来的，不是猜出来的。"], ["来多少接多少，反正总会有 No-show", "bad", "一旦客人都到店，就是一场事故。"], ["最多 5 间，稳妥第一", "ok", "过于保守，白白的空房也是损失。"]], "lesson": "取同类型日期（同为周末或同为会展期）近 8–12 周的数据，不要用全年平均值；按房型分层计算（套房与高级房的 No-show 率不同）；扣掉保障缓冲；超过门店授权上限必须报店总审批；并准备好 walk 预案（安置酒店、交通、差价承担、次日优先回本店）。", "key": "超售是「可控承诺」：必须有测算、有审批、有 walk 预案。", "part": "第二篇 · 决策篇"}, {"ch": "ch12", "t": "库存分配与保护位：给谁留多少房", "story": "还剩 40 间。销售部想接一个 20 间的团队，可散客这边预计还要 35 间。房给谁？", "q": "正确的分配依据是？", "opts": [["先到先得，谁先订给谁", "bad", "先到先得会把高价值房源贱卖。"], ["算各客群期望价值（净价 × 成交概率），给高价值散客留保护位", "best", "对。期望价值才是分配依据。"], ["团队量大，优先给团队", "ok", "量大不等于价值高，要先算期望价值。"]], "lesson": "期望价值＝净价 × 成交概率，概率必须来自历史数据。按期望价值排序：散客期望价值高于团队时设保护位并给团队明确上限；临近日期若高价值 pickup 未达预期，逐步释放保护位。", "key": "库存分配看期望价值，不看谁先开口。", "part": "第二篇 · 决策篇"}, {"ch": "ch13", "t": "渠道净价：到手多少钱才算数", "story": "OTA 挂 620 元，佣金 15%。销售说：「和直销一个价啊。」", "q": "这一间房，到手是多少？", "opts": [["620 元", "bad", "那是客人付的钱，不是您收到的钱。"], ["527 元（620 × 0.85）", "best", "对。账面同价，实际差了 93 元。"], ["600 元左右", "ok", "接近但不够精确，佣金之外还可能有其他成本。"]], "lesson": "净价＝挂牌价 ×（1 − 佣金比例）− 其他渠道成本。别只算佣金，促销分摊、开票与结算成本都要列。按净价与战略价值给渠道排序、配额；直销净价最高，应优先投入。", "key": "账面同价，到手差 93 元——永远算净价。", "part": "第二篇 · 决策篇"}, {"ch": "ch14", "t": "客源细分：把客人分成几堆来卖", "story": "云璟当前客源结构：商务散客 42%、会议团队 24%、OTA 20%、协议 10%、会员 4%。", "q": "这个结构最能说明什么？", "opts": [["会员只占 4%，直销能力弱", "best", "对。会员占比是直销能力的体检指标。"], ["结构挺好，商务散客最多", "ok", "散客多说明基本盘稳，但会员偏低是隐患。"], ["OTA 占比不高，没问题", "ok", "20% 尚可，但直销只有 4%，两头不对称。"]], "lesson": "不细分就无法差异化。按渠道、目的、预订行为、价格敏感度分类，算各客源净贡献（含餐饮会场等附加消费），按价值与稳定性排序，再用提前期、取消政策、最少住期把客群真正隔开——而不是只在嘴上分开。", "key": "会员占比，是直销能力的体检指标。", "part": "第二篇 · 决策篇"}, {"ch": "ch15", "t": "团队置换：这个团该不该接", "story": "一个 120 间夜的会议团队，报价 480 元/间夜，占用周五、周六，同时要用 800 ㎡ 宴会厅。本店 BAR 620 元，该周末散客需求旺盛。", "q": "接，还是不接？", "opts": [["算置换：比较团队净贡献与被置换散客的预期净收入", "best", "对。团队看的是置换，不是间夜量。"], ["接，120 间夜量这么大", "bad", "量大不等于划算，要看被占掉的散客值多少钱。"], ["不接，480 低于 BAR 620", "ok", "方向对，但还没算餐饮会场等附加价值。"]], "lesson": "置换损失＝被置换散客净收入 − 团队净贡献。本例：团队净＝120 ×（480 − 95）＝ 46,200 元；被置换散客净 ≈ 120 × 0.85 ×（680 − 95）＝ 59,670 元，亏约 13,470 元。但宴会餐饮等附加收益约 8,000 元，计入后临界报价约 526 元——低于就不接，按这个数去谈。", "key": "团队看置换，不看间夜量；附加价值算进去才谈得动。", "part": "第二篇 · 决策篇"}, {"ch": "ch16", "t": "直销与会员：把客人变成自己的", "story": "云璟会员只占 4%，绝大多数客人从 OTA 来。每间房都在给平台交佣金。", "q": "提升直销的第一步是什么？", "opts": [["官网/小程序做最优价保证，让客人有理由直接订", "best", "对。直销不是靠堵，是靠给一个更好的理由。"], ["OTA 涨价，逼客人来官网", "bad", "涨价只会流失订单，不会自动带来直销。"], ["先搭一套积分体系", "ok", "积分是权益，但要先确认权益成本低于直销与 OTA 的净价差。"]], "lesson": "先算清直销与 OTA 的净价差——这是会员投入的上限。会员权益（价格、服务、积分三类）成本必须低于净价差才有意义。会员数据用于客群细分，须在告知同意范围内使用，不得越界采集或对外提供。", "key": "直销不是靠堵住 OTA，是靠给客人一个直接订的理由。", "part": "第二篇 · 决策篇"}, {"ch": "ch17", "t": "运营全景：从年到日的节奏", "story": "新任收益经理最常问的一句话是：「我到底该从哪儿开始？」", "q": "正确的节奏是？", "opts": [["年看方向、月看修正、周看决策、日看动作", "best", "对。四层各有各的判断对象。"], ["从每天早上调价开始", "ok", "那是日度层，之上还有三层要先对齐。"], ["先做明年预算", "ok", "那是年度层，但之后还要拆到月周日。"]], "lesson": "年度层定目标与关键事件；月度层做预测与偏差修正；周度层开例会，只处理未来 14 天内可执行的事项；日度层做定价与库存动作。超出 90 天的事只做方向性判断，不做具体操作。", "key": "14 天以内才叫决策，14 天以外只是方向。", "part": "第三篇 · 运营篇"}, {"ch": "ch18", "t": "每日实操流程：一天具体做什么", "story": "每天早上八点半，收益岗要干的事其实就那么几件。问题不在于没时间，而在于没有固定顺序。", "q": "进办公室第一步看什么？", "opts": [["昨日经营结果，与昨日、上周同日、去年同期三方对比", "best", "对。先看结果，才知道今天要不要动。"], ["先看竞品价格", "ok", "重要，但在固定顺序里排在第三步。"], ["先处理销售部发来的询价", "bad", "一上来就被打断，整天都会被动。"]], "lesson": "固定顺序：昨日结果 → 在手与 pickup → 竞品价格 → 调价与开关房型 → 处理当日请求 → 填日报。顺序对了，20 分钟就够；顺序乱了，一上午都不够。", "key": "每日动作要有固定顺序，顺序本身就是效率。", "part": "第三篇 · 运营篇"}, {"ch": "ch19", "t": "执行标准与收益例会", "story": "每周例会开了两小时，前厅、销售、收益各说各话，散会时谁也不知道要干什么。", "q": "例会的第一个改进是什么？", "opts": [["固定四段议程：回顾 → 预测 → 决策 → 分工，且每项决策落到人与时间", "best", "对。没有责任人和时间的决策等于没决策。"], ["把会议缩短到 30 分钟", "ok", "缩短只是治标，议程不变照样低效。"], ["要求每个人会前发书面材料", "ok", "有用，但先要把议程和数据源统一。"]], "lesson": "会前把数据表发到参会人手里，会上不争论口径；只讨论未来 14 天内可执行的事项，超出范围的移到月度会；每项决策必须有责任人与完成时间；下次会先复盘上次决策的执行结果。", "key": "没有责任人和完成时间的决策，等于没有决策。", "part": "第三篇 · 运营篇"}, {"ch": "ch20", "t": "预测与需求日历", "story": "明年三月城里有个大型展会，销售部问：要不要现在就把价格锁上去？锁早了可能锁错，锁晚了就被别人先占。", "q": "判断依据是？", "opts": [["做需求日历：历史同期 + 事件标注 + 剔除异常年，再定价格档", "best", "对。预测的价值是给「提前多久动手」一个依据。"], ["等到临近再看，灵活应对", "bad", "临近再动，价格与库存都已被别人先占。"], ["按去年价格加 10%", "ok", "比不动好，但没有区分事件日与平常日。"]], "lesson": "取过去 2–3 年同月同周的数据作为基准；把展会、演出、考试、节假日逐条标出并注明确定程度；剔除受特殊事件影响的年份；把每日分成高/中/低需求等级，每个等级对应一个价格档与限制条件。确定性高的才提前锁价，不确定的保留弹性。", "key": "预测的价值，是给「提前多久动手」一个依据。", "part": "第三篇 · 运营篇"}, {"ch": "ch21", "t": "年度预算：把一年拆到每天", "story": "老板只给了一句话：明年客房收入要比今年高 8%。一个总数没法执行。", "q": "怎么让它变得可执行？", "opts": [["拆到月（按淡旺季，不能平均）、再拆到周、拆到日", "best", "对。一个总数没法执行，必须拆到每天。"], ["分摊到 12 个月，每月增长 0.67%", "bad", "平均分配会忽略淡旺季，淡季目标永远完不成。"], ["给每位销售压指标", "ok", "压指标解决不了目标本身合不合理。"]], "lesson": "先定全年 OCC、ADR、RevPAR 三个目标并互相校验；结合淡旺季与事件日历分到 12 个月（不能平均分配）；再拆到周、到日，形成每日目标值；与去年实际逐日对比找缺口，把每个缺口变成具体动作（填谷、提价、事件日布局、客源结构调整）。", "key": "一个总数没法执行，必须拆到每天。", "part": "第三篇 · 运营篇"}, {"ch": "ch22", "t": "价格体系 BAR：所有价格的锚", "story": "店里价格档位混乱：前台一个价、OTA 一个价、协议客户又一个价，谁也说不清哪个是「标准价」。", "q": "怎么理顺？", "opts": [["定 BAR 为锚，房型/客源/渠道/套餐全部按规则从 BAR 折算", "best", "对。没有锚，所有价格都失去依据。"], ["统一成最低价，简单省事", "bad", "统一成最低价等于放弃全部溢价空间。"], ["每个渠道单独定一套价格", "bad", "那正是混乱的来源。"]], "lesson": "BAR（最佳可售房价）是不含限制条件、对所有公开渠道开放的基础价格。房型价差、协议价、会员价、团队价、OTA 价、套餐价，全部按规则从 BAR 折算。检验标准：所有价格都能追溯到 BAR，套餐也能折算回 BAR。", "key": "没有锚，所有价格都失去依据。", "part": "第三篇 · 运营篇"}, {"ch": "ch23", "t": "报表体系：每天该看哪几张表", "story": "系统里报表有几十张，看不完也没用。", "q": "每天真正要驱动决策的是哪几张？", "opts": [["四张：在手量、pickup 增量、竞品价格、渠道结构", "best", "对。四张表足以驱动每日决策。"], ["全部看一遍，免得漏掉", "bad", "逐行看会把异常淹没在细节里。"], ["只看经营日报", "ok", "日报看结果，但缺了进度与竞品。"]], "lesson": "固定看表顺序：先看结果、再看进度、再看竞品、最后看渠道。只抓超过阈值的偏差，每个异常都要对应一个具体动作或一条待查事项。阈值不是固定的，按季节与客源结构调整。", "key": "报表不是用来看的，是用来触发动作的。", "part": "第三篇 · 运营篇"}, {"ch": "ch24", "t": "OTA 与点评：评分就是价格", "story": "云璟评分从 4.6 掉到 4.4，订单明显少了。价格没变，可客人在列表页看到的就是：比您低 0.2 分的那家排在前面。", "q": "正确的应对是？", "opts": [["把差评归类成主题，转成运营整改项并指定责任人", "best", "对。分数只能靠服务挣回来。"], ["找人刷几条好评，先把分拉回来", "bad", "刷评是短期假指标、长期真负债，也是对客人的欺骗。"], ["降价弥补排名下滑", "ok", "降价能换来一点订单，但治不了根本。"]], "lesson": "评分直接影响曝光、排名与转化。把差评归类（卫生、噪音、服务响应、设施、早餐），每个主题对应一个可整改的动作与责任人；同时监测竞品评分判断相对位置。排名下滑时要同时检查价格、库存与评分三件事。", "key": "评分就是价格，但分数只能靠服务挣。", "part": "第三篇 · 运营篇"}, {"ch": "ch25", "t": "岗位与组织：谁来干这件事", "story": "云璟 300 间，要不要设专职收益经理？周总觉得「先招个人再说」。", "q": "关键其实不在有没有人，而在？", "opts": [["定价权与审批权限有没有写清楚", "best", "对。没有权限表的收益岗，等于没有岗。"], ["能不能招到一个懂系统的人", "ok", "系统能力可培养，权责边界才是前提。"], ["预算够不够", "ok", "预算决定形式，不决定成败。"]], "lesson": "按房量、客源复杂度、渠道数量判断专职还是兼任。定权责（谁定价、谁审批、超授权怎么办，写成权限表）；定协作（前厅、销售、财务的接口与例会机制）；定考核——不能只看出租率，要把 RevPAR 与 RGI 纳入。", "key": "没有权限表的收益岗，等于没有岗。", "part": "第四篇 · 组织篇"}, {"ch": "ch26", "t": "成本与利润：降价的底线在哪", "story": "销售想以 500 元接一个团。云璟单位变动成本是 95 元/间夜。", "q": "底线在哪？", "opts": [["变动成本 95 元是底线，但经营上要留出空间，不能贴着底线卖", "best", "对。边际为正只是及格线。"], ["500 高于 95，随便接", "ok", "边际确实为正，但没算隐性成本，也没留空间。"], ["按去年均价定", "bad", "均价与底线无关。"]], "lesson": "边际贡献＝净价 − 单位变动成本，为正就对固定成本有贡献；但经营上必须留出合理空间。还要计入隐性成本（能耗、布草洗涤、人力、易耗品），按房型与日期换算；高能耗房型与高负荷日期适当上调底线。", "key": "底线是变动成本，但别贴着底线卖。", "part": "第四篇 · 组织篇"}, {"ch": "ch27", "t": "系统与数据：工具能替您做什么", "story": "没有收益管理系统，用 Excel 能不能做？团队里有人神化系统，也有人完全不用。", "q": "系统与人的分工是？", "opts": [["计算与报表交给工具；判断、谈判、对客承诺只能由人来做", "best", "对。工具替您算账，不替您担责。"], ["上了系统就不用人管了", "bad", "系统不会判断，也不会对一个到店无房的客人负责。"], ["没有系统就做不了收益管理", "bad", "先建四张核心表就能开工。"]], "lesson": "系统能做：数据汇总、自动算价建议、报表生成、异常提醒。系统不能做：判断、谈判、对客承诺、承担责任。系统给出的异常值与建议价，必须人工复核后才生效；关键数据缺失时先补数据，不做无依据决策。", "key": "工具替您算账，不替您担责。", "part": "第四篇 · 组织篇"}, {"ch": "ch28", "t": "淡旺季与事件日：一年里最容易赚的钱", "story": "一年 365 天，真正决定全年利润的往往只有几十天：展会那几天、演唱会那晚、长假那几天。", "q": "该提前做什么？", "opts": [["建事件日历，评估每个事件的需求强度，提前锁定价格与库存", "best", "对。一年的利润，往往由几十天决定。"], ["到了再说，灵活应对", "bad", "事件日临时应对，通常只能捡别人剩下的。"], ["全年统一价，简单省事", "bad", "统一价会把事件日的钱全部让出去。"]], "lesson": "把展会、演出、考试、体育赛事、节假日逐条列出并标日期；按历史同期与事件规模估算需求强度；对确定性高的事件日提前设置价格档与住期限制，提前与渠道谈配额；事件临近时按实际 pickup 调整，不要一次定死；事件结束后需求骤降要提前安排填谷。", "key": "一年的利润，往往由几十天决定。", "part": "第四篇 · 组织篇"}, {"ch": "ch29", "t": "餐饮收益：RevPASH 与翻台", "story": "云璟餐厅 120 个座位，翻台 1.8 次，人均消费 95 元。餐饮部问：我们的收益该怎么衡量？", "q": "餐饮收益看什么指标最合适？", "opts": [["RevPASH＝营收 ÷ 可用座位数 ÷ 营业小时", "best", "对。它同时容纳了翻台与人单。"], ["翻台率", "ok", "翻台只看流转，会漏掉每桌赚多少。"], ["人均消费", "ok", "人单只看单价，会漏掉座位空转。"]], "lesson": "RevPASH（每可用座位每小时收入）把翻台率与人单合成一个数。提升路径有三条：控制用餐时长、引导点单结构、做时段定价（下午茶与晚市错峰）。它和 RevPAR 的逻辑完全一致：容量 × 利用率 × 单价。", "key": "餐饮要同时管翻台和人单，RevPASH 把两者合成一个数。", "part": "第五篇 · 延伸篇"}, {"ch": "ch30", "t": "会议宴会：不只算房，算总贡献", "story": "一个会议团队用房 80 间夜，另用 800 ㎡ 宴会厅两天，还含三餐与停车。销售只报了房价。", "q": "该怎么算这笔账？", "opts": [["算总贡献：客房 + 餐饮 + 会场 + 停车，减去全部变动成本", "best", "对。会议团的账要算总贡献。"], ["只看房价够不够", "bad", "会漏掉餐饮与会场这两块真正的利润来源。"], ["会场免费送，把房拿下来", "ok", "可能把最赚钱的一块送掉了。"]], "lesson": "会议宴会要把客房、餐饮、会场、停车等一并计入总贡献，再减去全部变动成本（含能耗、人力、布草、易耗品）。常见错误是为了把房拿下而免费送会场，结果送掉的是利润最高的那一块。", "key": "会议团的账要算总贡献，不能只算房价。", "part": "第五篇 · 延伸篇"}, {"ch": "ch31", "t": "其他业态与跨行业参数", "story": "餐厅的桌子、会议室的时段、车场的车位——它们和客房一样，容量固定、需求会波动、可以分段定价。", "q": "判断一个场景能不能套用这套方法，看什么？", "opts": [["容量固定 + 需求波动 + 可分段定价，三条同时满足", "best", "对。三条件同时满足，判据就能搬过去。"], ["只要能卖东西就行", "bad", "缺了任意一条，判据都会失效。"], ["只要有竞争对手", "bad", "竞争不是必要条件。"]], "lesson": "餐厅、会议室、车位、影院、球场、航班都符合三条件。把 OCC/ADR/RevPAR 换成该场景的对应指标（如翻台率、时段单价、单位面积收入），保留判定逻辑、替换变量即可。容量不可控或无法区分客群时，先不要硬套。", "key": "三条件同时满足，这套判据就能搬过去。", "part": "第五篇 · 延伸篇"}, {"ch": "ch32", "t": "常见误区：别再踩这些坑", "story": "通关前的最后一问。学完 31 章之后，最容易犯的错是什么？", "q": "下面哪个是收益管理最典型的误区？", "opts": [["把出租率当成唯一目标", "best", "对。只追出租率是最典型、也最贵的误区。"], ["每天都在调价", "ok", "频繁调价是操作问题，不是最典型的误区。"], ["关注竞品价格", "ok", "关注竞品是必要的，不算误区。"]], "lesson": "常见误区：只追出租率、只追房价、降价靠感觉、无条件折扣、超售无 walk 预案、团队只看间夜量、库存先到先得、报表看完不动作、刷评删差评、贴着成本底线卖。记住一条总纲——所有动作都必须可解释、可追溯、合规。", "key": "收益管理的底线：可解释、可追溯、合规。", "part": "第五篇 · 延伸篇"}];
var K='hrma_game_rm_v1';
var st={i:0,ph:0,score:0,ans:{},fin:0};
try{var s=JSON.parse(localStorage.getItem(K)||'null');if(s)st=s;}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(st));}catch(e){}}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function dots(){
  var h='';
  for(var i=0;i<CH.length;i++){
    var c=(st.ans[i]!==undefined?' done':'')+(i===st.i?' cur':'');
    h+='<button class="'+c+'" onclick="go('+i+')" title="第'+(i+1)+'章 ' + CH[i].t + '">'+(i+1)+'</button>';
  }
  document.getElementById('dots').innerHTML=h;
}
function head(c){
  return '<div class="part">'+c.part+'<span class="chno">第 '+(st.i+1)+' 章 / 32</span></div><h2 class="ch">'+c.t+'</h2>';
}
function bar(){document.getElementById('pn').textContent=st.i+1;document.getElementById('sc').textContent=st.score;
  document.getElementById('pb').style.width=((st.i)/32*100)+'%';}
function go(i){if(i<0||i>=CH.length)return;st.i=i;st.ph=0;save();render();window.scrollTo(0,0);}
function pick(k){
  if(st.ans[st.i]!==undefined)return;
  st.ans[st.i]=k;
  st.score+=(k===0?10:(k===1?6:3));
  save();render();
}
function next(){if(st.i<CH.length-1){st.i++;st.ph=0;}else{st.fin=1;}save();render();window.scrollTo(0,0);}
function reset_(){st={i:0,ph:0,score:0,ans:{},fin:0};save();render();window.scrollTo(0,0);}
function rank(s){if(s>=280)return '收益总监';if(s>=220)return '收益经理';if(s>=160)return '预订主管';return '见习收益员';}
function render(){
  bar();dots();
  var el=document.getElementById('stage');
  if(st.fin){fin(el);return;}
  var c=CH[st.i],h='',picked=st.ans[st.i];
  h+='<div class="card">'+head(c)+'<div class="story">'+esc(c.story)+'</div>';
  if(picked===undefined){
    h+='<div class="q">'+esc(c.q)+'</div>';
    for(var k=0;k<c.opts.length;k++){
      h+='<button class="opt" onclick="pick('+k+')"><span class="mk">'+(k===0?'A':(k===1?'B':'C'))+'</span>'+esc(c.opts[k][0])+'</button>';
    }
    h+='<p class="sub" style="margin-top:12px">点击一个选项即可，选错不会卡关。</p>';
  }else{
    var o=c.opts[picked];
    var cls=(picked===0?'best':(picked===1?'ok':'bad'));
    var tag=(picked===0?'✓ 这是更好的选择':(picked===1?'△ 可以，但还有更好的':'✗ 这个选择要小心'));
    h+='<div class="res '+cls+'"><div class="tag">'+tag+'</div>'+esc(o[2])+'</div>';
    if(picked!==0){
      h+='<div class="lesson"><b>更好的选择是：</b>'+esc(c.opts[0][0])+'　—　'+esc(c.opts[0][2])+'</div>';
    }
    for(var k2=0;k2<c.opts.length;k2++){
      if(k2!==picked&&k2!==0){
        h+='<div class="lesson" style="background:#fff;border-style:dashed"><b>'+(k2===1?'B':'C')+'：</b>'+esc(c.opts[k2][2])+'</div>';
      }
    }
    h+='<div class="lesson"><b>讲解</b><br>'+esc(c.lesson)+'</div>';
    h+='<div class="key">记住这一句：'+esc(c.key)+'</div>';
    h+='<div class="row"><button class="btn" onclick="next()">'+(st.i<CH.length-1?'下一章 →':'看通关结果 →')+'</button>'
      +'<span class="sub">本章得分 +'+(picked===0?10:(picked===1?6:3))+'</span></div>';
  }
  h+='</div>';
  el.innerHTML=h;
}
function fin(el){
  document.getElementById('pb').style.width='100%';
  document.getElementById('pn').textContent='32';
  var h='<div class="card fin"><div class="sc">'+st.score+' / 320</div>'
   +'<div class="rk">通关评级：'+rank(st.score)+'</div>'
   +'<p class="sub">您已走完全部 32 章。下面是每一章要记住的一句话。</p><div class="kl">';
  for(var i=0;i<CH.length;i++){
    h+='<div><b>第'+(i+1)+'章 · '+CH[i].t+'</b><br>'+esc(CH[i].key)+'</div>';
  }
  h+='</div><div class="row" style="justify-content:center"><button class="btn gh" onclick="reset_()">再玩一次</button>'
   +'<a class="btn" style="text-decoration:none;display:inline-block" href="textbook.html">去读原版教材</a></div></div>';
  el.innerHTML=h;
}
render();
</script>
</body></html>
