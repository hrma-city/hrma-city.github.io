680 元、出租率 72%。周总问：我们到底算好还是算差？", "qs": [{"q": "用什么才能看清本店在竞争群里的真实位置？", "opts": [["MPI（量）+ ARI（价）+ RGI（收入）三个指数", "best", "对。三个指数一起看，才能分清是量的问题还是价的问题。"], ["只看平均房价在商圈里排第几", "ok", "只看价格会漏掉出租率的位置。"], ["跟自己去年同期比就够了", "bad", "只跟自己比会看不见对手的位移。"]]}, {"q": "本店 MPI 1.05、ARI 0.85，说明什么？", "opts": [["靠低价换来出租率：量涨了，但价格位置输了", "best", "对。这是危险信号——利润正在被悄悄侵蚀，需要尽快把价格拉回来。"], ["全面领先竞争群", "bad", "错。ARI < 1 说明价格位置是落后的。"], ["应该继续降价冲出租率", "bad", "错。继续降价只会让 ARI 更低，陷入恶性循环。"]]}, {"q": "竞争群应该怎么选？", "opts": [["同档次、同商圈、客源重叠的 3–5 家", "best", "对。竞争群选错，后面所有指数都会失真。"], ["只盯住最大的那一家", "ok", "不够。单家没有统计意义，要看一群的均值。"], ["范围越大越好，全城都算进去", "bad", "错。档次差异大的店会把均值拉偏。"]]}], "lesson": "MPI＝本店 OCC ÷ 竞品群 OCC；ARI＝本店 ADR ÷ 竞品群 ADR；RGI＝本店 RevPAR ÷ 竞品群 RevPAR，也等于 MPI × ARI。RGI > 1 领先，< 1 落后。特别要警惕 MPI > 1 而 ARI < 1——那是靠低价换量，利润正在被侵蚀。", "key": "RGI 是最终结论；量和价必须一起看。"}, {"kind": "ch", "ch": "ch04", "part": "第一篇 · 认知篇", "title": "价格弹性：降多少价能换多少量", "story": "您想把 620 元降到 560 元，指望多卖一些。可降多少价，到底能换回多少间？如果换不回来，这次降价就是白白损失。", "qs": [{"q": "判断这次降价划不划算，第一步该算什么？", "opts": [["价格弹性系数＝销量变动百分比 ÷ 价格变动百分比", "best", "对。有了弹性系数，才能推算降价后到底能多卖多少。"], ["看竞品有没有跟着降", "ok", "竞品是参考，但算不出您自己的量价关系。"], ["先降 100 试试，看效果再说", "bad", "先试再改，损失已经发生了。"]]}, {"q": "需求旺盛时，价格弹性通常怎样？", "opts": [["偏低——客人对价格不敏感，此时宜提价", "best", "对。旺需求下小幅提价不会明显掉量，是该收的时候。"], ["偏高——应当大幅降价换量", "bad", "错。需求已经很旺，降价是白白让利。"], ["和需求淡时一样，不变", "bad", "错。弹性随需求环境显著变化。"]]}, {"q": "判断一次降价划不划算，最终要比较的是？", "opts": [["降价后的净收益（收入 − 变动成本）与不降价时的净收益", "best", "对。必须扣掉变动成本，只比营业收入会误判。"], ["降价后销量涨了多少", "ok", "销量是中间量，最终要看净收入。"], ["竞品有没有跟着降", "bad", "竞品是参考，算不出您自己的得失。"]]}], "lesson": "弹性＝销量变动百分比 ÷ 价格变动百分比，通常取绝对值判断。绝对值 > 1（富有弹性）降价可增收；< 1（缺乏弹性）降价反而减收。需求旺盛时弹性偏低，此时宜提价；需求疲软时弹性偏高，才可谨慎降价换量。", "key": "降价之前先算弹性，别凭感觉试。"}, {"kind": "boss", "ch": "", "part": "第一篇 · 认知篇 · 综合小考", "title": "认知篇收尾检查", "story": "前四章学完了。老板走过来说：「下个月把出租率做到 90%，别的我不看。」您要用什么回应？", "qs": [{"q": "面对「出租率必须 90%」的要求，最好的回应是？", "opts": [["建议改用 RevPAR 与 RGI 作为目标，并说明单追出租率会压低房价、反而减少收入", "best", "对。用老板听得懂的语言把指标讲清楚，是收益岗的第一项功课。"], ["照做，把价格降下来冲出租率", "bad", "错。达成目标却伤害了利润。"], ["拒绝执行", "bad", "错。对抗没有帮助，要给出更好的替代方案。"]]}, {"q": "向老板汇报经营好坏，最合适的三个数是？", "opts": [["OCC、ADR、RevPAR，并以 RevPAR 作结论", "best", "对。三个数讲完故事，用 RevPAR 下结论。"], ["总收入一个数字", "ok", "太粗，看不出是量的问题还是价的问题。"], ["只有出租率", "bad", "错。"]]}, {"q": "判断本店在与对手的竞争中处在什么位置，说一个最关键的指标是？", "opts": [["RGI（收入生成指数）", "best", "对。RGI > 1 领先，< 1 落后，一个数字说清最终格局。"], ["MPI", "ok", "只说了量。"], ["ARI", "ok", "只说了价。"]]}, {"q": "考虑降价时，最后一个必须算的量是？", "opts": [["扣掉变动成本之后的净收益对比", "best", "对。弹性只告诉你能不能换来量，净收益才告诉你划不划算。"], ["弹性系数", "ok", "是中间步骤，不是最终依据。"], ["竞品的反应", "bad", "错。"]]}], "lesson": "认知篇的四块地基：一句话说清收益管理是什么；用 RevPAR 而不是出租率判断好坏；用 RGI 判断竞争位置；用弹性与净收益判断降价划不划算。后面所有操作都建立在这四件事上。", "key": "先有正确的尺子，才谈得上正确的决策。"}, {"kind": "ch", "ch": "ch05", "part": "第二篇 · 决策篇", "title": "什么时候涨价", "story": "11 月某个周三。云璟未来 14 天的预订进度已到 62%，高于去年同期的 54%；竞品 A 已把挂牌价从 880 提到 920。本店 BAR 仍是 620 元。", "qs": [{"q": "这时候该怎么办？", "opts": [["阶梯式小步上调一档，24 小时后看 pickup 再决定", "best", "对。涨价要小步快跑，边涨边看市场反应。"], ["再等等，等进度到 80% 再说", "ok", "等太久会错过窗口，需求最旺的时候价格反而没跟上。"], ["立刻大幅提到 900，一次到位", "bad", "一次跳到位容易吓跑客人，也会失去观察窗口。"]]}, {"q": "涨价信号已经出现，正确的执行方式是？", "opts": [["小步上调一档，24 小时后看 pickup 再决定下一档", "best", "对。小步快跑既能收钱，又留出纠错的观察窗。"], ["只涨周末，工作日不动", "ok", "不够。每个日期都要按自己的数据判断。"], ["一次提到目标价，免得客人占便宜", "bad", "错。一次跳到位容易把客人吓跑，也失去观察机会。"]]}, {"q": "下面哪种情况，不要急着涨价？", "opts": [["距入住日不足 3 天且预订进度落后于同期", "best", "对。临近日期以放量为主，此时提价只会白白空置。"], ["竞品普遍上调了挂牌价", "ok", "也是涨价信号之一，可以跟进一档。"], ["预订进度明显快于去年同期", "bad", "这恰恰是涨价信号。"]]}], "lesson": "三看法则：一看进度（与去年同期、与目标比）；二看竞品（ARI 与 RGI 的位置）；三看弹性（涨价后的量损测算）。进度超前 + 竞品普涨 + RGI < 1，就是涨价的三个信号。", "key": "涨价的三个信号：进度超前、竞品普涨、RGI 小于 1。"}, {"kind": "ch", "ch": "ch06", "part": "第二篇 · 决策篇", "title": "竞品降价：跟还是不跟", "story": "竞品 B 把挂牌价从 680 元降到 600 元，本店仍是 620 元。销售部急着问：「我们降不降？」", "qs": [{"q": "第一步该看什么？", "opts": [["先看 pickup 与取消率有没有被影响，再确认是长期调价还是短期促销", "best", "对。用数据判断，而不是用情绪判断。"], ["完全不理，我们产品更好", "ok", "产品力强可以不跟，但要先确认 pickup 确实没被影响。"], ["马上跟到 590，压过它", "bad", "盲目跟价会白白损失，而且可能对方只是短期促销。"]]}, {"q": "确认竞品在做短期促销后，通常应该？", "opts": [["不跟，等促销结束自然恢复，同时用非价格手段守住客人", "best", "对。短期促销不必跟进，用含早、升级等手法补偿更有价值。"], ["立刻同步降到同等价位", "ok", "会白白损失这一周的收入。"], ["比它降得更多，抢先把量锁住", "bad", "错。容易引发价格战，两败俱伤。"]]}, {"q": "判断「跟还是不跟」，最可靠的依据是？", "opts": [["本店的 pickup 与取消率有没有真的被影响", "best", "对。数据说客人没走就不用慌，数据说走了再动手。"], ["竞品降了多少", "ok", "降幅是参考，关键看有没有影响到您的订单流。"], ["销售部的主观感受", "bad", "错。感觉会放大恐慌。"]]}], "lesson": "先分清性质：全房型还是局部房型、长期调价还是短期促销。再看本店 pickup 与取消率的实际变化。短期促销不必跟；全城普降且需求疲软才跟；不跟时用含早、房型升级等非价格手段补偿。", "key": "跟不跟，看 pickup，不看情绪。"}, {"kind": "ch", "ch": "ch07", "part": "第二篇 · 决策篇", "title": "折扣与促销：什么时候该让", "story": "淡季将至，销售部想做「住二送一」冲量。这个折扣让出去，换来的是真增量，还是把本来就会来的客人变便宜了？", "qs": [{"q": "这个折扣该怎么给？", "opts": [["带限制条件：提前预订、不可取消、限定房型与日期、限量", "best", "对。条件把促销框住，只让真正新增的客人享受。"], ["直接全场七折，冲量最重要", "bad", "无条件的折扣等于长期降价，还会挤占正价客。"], ["只对老客户给，回馈忠诚度", "bad", "合规风险：对特定人群做区别定价，可能触碰「大数据杀熟」红线。"]]}, {"q": "促销复盘时最该看的一个指标是？", "opts": [["增量中有多少是本来不会来的新客", "best", "对。如果大部分是被促销吸走的正价客，这次促销就是净亏损。"], ["同行有没有跟着做", "ok", "那是竞争参考，不是复盘依据。"], ["总共卖了多少间", "bad", "销量高不等于赚了钱。"]]}, {"q": "一个「健康的折扣」必须具备什么？", "opts": [["限制条件：提前期、不可取消、限定房型与日期、限量", "best", "对。条件把促销框住，只让真正新增的客人享受。"], ["价格足够低，有吸引力", "bad", "低价无条件，等于长期降价。"], ["只给熟悉的合作单位", "bad", "可能构成对不同客户的差别定价，有合规风险。"]]}], "lesson": "无条件的折扣就是长期降价。必须配条件：提前期、不可取消、限定房型与日期、限量。合规要点：明码标价、同一渠道同一时点同价、不得对特定人群区别定价。复盘时看增量里有多少是新客、有多少是被挤占的正价客。", "key": "折扣一定要带条件；不带条件的折扣就是降价。"}, {"kind": "ch", "ch": "ch08", "part": "第二篇 · 决策篇", "title": "套餐与锚定：让客人觉得划算", "story": "云璟想推「客房 + 双早 + 行政酒廊」套餐。加的东西成本不高，但客人觉得值。", "qs": [{"q": "套餐定价的关键是什么？", "opts": [["低于单买之和、高于纯房价；且附加成本低、感知价值高", "best", "对。套餐用低边际成本换高感知价值。"], ["按成本加 10% 定", "ok", "成本加成会漏掉客人的感知价值，可能定低了。"], ["越便宜越好，先把量冲起来", "bad", "套餐价低于纯房价，等于自降身价。"]]}, {"q": "哪种附加内容最适合做进套餐？", "opts": [["成本低但客人感知价值高的项目，如早餐、行政酒廊", "best", "对。套餐的意义就是用低边际成本换高感知价值。"], ["所有能想到的服务都塞进去", "ok", "会让套餐复杂度上升、成本失控。"], ["成本高、客人也不太在意的项目", "bad", "错。那不如直接给现金折扣。"]]}, {"q": "套餐上线后发现大量原本订高价房的客人转订套餐，怎么办？", "opts": [["收紧套餐的房型与日期限制，把它限制在淡季与指定房型", "best", "对。套餐不能挤占高价值散客，用限制条件隔开客群。"], ["取消套餐", "ok", "过于激进，先尝试加限制条件。"], ["提高全部房价，逼客人回到原价", "bad", "错。会连真实需求一起赶走。"]]}], "lesson": "套餐价低于单买之和、高于纯房价，先算清边际成本再定。附加成本低而感知价值高的项目（早餐、酒廊、接送）优先做；成本高而感知低的不要做。还要设限制条件，避免套餐挤占高价值散客。", "key": "套餐的意义，是用低边际成本换高感知价值。"}, {"kind": "ch", "ch": "ch09", "part": "第二篇 · 决策篇", "title": "房型价差：差价定多少才合理", "story": "云璟 300 间：高级 150、豪华 90、行政 45、套房 15。高级与豪华差 80 元，豪华与行政差 200 元。这个阶梯合理吗？", "qs": [{"q": "怎么判断房型价差合不合理？", "opts": [["看客人是往上买还是往下买", "best", "对。客人的升降级行为就是市场给出的答案。"], ["按装修成本差额定", "ok", "成本是下限，但客人的感知才是定价依据。"], ["价差越大越好，反正总有人买贵的", "bad", "价差过大会把客人都挤到低价房型。"]]}, {"q": "高价房型早早售罄、低价房型还剩很多，说明？", "opts": [["价差偏小，可以拉开一档，或关闭部分低价房型", "best", "对。市场对高价房的接受度已经给出信号。"], ["维持现状，不要乱动", "ok", "错过了一次结构性提价的机会。"], ["应该再降低高价房型的价格", "bad", "错。高价房已经卖得掉，降价是白让。"]]}, {"q": "房型开关的先后顺序，正确的是？", "opts": [["先关低价房型，后关高价房型", "best", "对。先关低价，客人才会往上买，收益才上得去。"], ["先关高价房型，留着低价冲出租率", "bad", "错。那会把高价值的客人挡在门外。"], ["随机关，看当天情况", "bad", "错。开关必须有固定规则。"]]}], "lesson": "价差要与「差异的可感知程度」和「额外变动成本」对应。客人普遍升级购买说明价差偏小，普遍降级说明价差偏大。房型开关有固定顺序：先关低价房型，后关高价房型。", "key": "客人往上买还是往下买，会直接告诉您价差对不对。"}, {"kind": "ch", "ch": "ch10", "part": "第二篇 · 决策篇", "title": "最短住期 MinLOS：用条件把客群分开", "story": "周末只剩周六一晚的房，很多人只想住一晚。可一住一晚，周五和周日就空着——两头的空房比这一晚赚的还多。", "qs": [{"q": "该怎么办？", "opts": [["设最短住期 2 晚，把两端填上", "best", "对。MinLOS 的作用就是填补空档。"], ["周六降价促销，先把这一晚卖完", "ok", "能卖掉，但两头的空房还是空的。"], ["关掉周六的房，全留给长住客", "bad", "关房不会自动变成长住客。"]]}, {"q": "设置 MinLOS 后整体出租率反而下降了，应该？", "opts": [["立即撤销，重新算「被挡客人损失」与「两端收益」", "best", "对。MinLOS 若导致总量下降，说明这道条件得不偿失。"], ["继续观察一整月再决定", "ok", "试错要有止损点，不宜拖一整月。"], ["再延长到 3 晚试试", "bad", "错。方向已经错了，加长只会更糟。"]]}, {"q": "哪种房况最不需要设 MinLOS？", "opts": [["所有日期都很紧张，本来就不愁卖", "best", "对。没有空档可填，设 MinLOS 只会白白赶客。"], ["度假型客群、长住需求多", "ok", "度假型反而更适合设 MinLOS。"], ["周末紧张、前后两天空", "bad", "这正是 MinLOS 最该发挥作用的时候。"]]}], "lesson": "MinLOS 用来填补 gap night。通常设 2–3 晚，选定作用的房型与日期，比较「被挡掉的短住客人损失」与「留住长住客带来的两端收益」。全程各日都紧张时不必设；度假型或长住客群为主时更适用。设置后如果整体出租率下降，立即撤销。", "key": "最短住期是用来填空档的，不是用来提价的。"}, {"kind": "ch", "ch": "ch11", "part": "第二篇 · 决策篇", "title": "超额预订：卖出去的比有的多", "story": "周六，300 间房已售出 285 间。历史数据：No-show 率约 8%，临近取消率约 12%。销售部希望再接 20 间。", "qs": [{"q": "能超售多少？", "opts": [["按 No-show 与取消的历史值测算，再扣掉一段保障缓冲", "best", "对。超售是算出来的，不是猜出来的。"], ["最多 5 间，稳妥第一", "ok", "过于保守，白白的空房也是损失。"], ["来多少接多少，反正总会有 No-show", "bad", "一旦客人都到店，就是一场事故。"]]}, {"q": "做超售测算时，历史数据应该怎么取？", "opts": [["取同类型日期（同为周末或同为会展期）近 8–12 周", "best", "对。不同类型日期的 No-show 率差异很大，不能用全年平均。"], ["取上一周的数据，最及时", "ok", "样本太少，波动会被放大。"], ["取全年的平均值，样本最多", "bad", "错。平均值会掩盖周末与平日的差异。"]]}, {"q": "超售最核心的一条底线是？", "opts": [["绝不让到店客人无房可住，必须有 walk 预案与补偿标准", "best", "对。超售是「可控承诺」，一旦失控就是对客人的失信。"], ["控制在 5 间以内就安全", "ok", "安全与否要看测算，不是一个固定数字。"], ["尽量多超，反正多数会 No-show", "bad", "错。这是赌博，不是管理。"]]}], "lesson": "取同类型日期（同为周末或同为会展期）近 8–12 周的数据，不要用全年平均值；按房型分层计算（套房与高级房的 No-show 率不同）；扣掉保障缓冲；超过门店授权上限必须报店总审批；并准备好 walk 预案（安置酒店、交通、差价承担、次日优先回本店）。", "key": "超售是「可控承诺」：必须有测算、有审批、有 walk 预案。"}, {"kind": "ch", "ch": "ch12", "part": "第二篇 · 决策篇", "title": "库存分配与保护位：给谁留多少房", "story": "还剩 40 间。销售部想接一个 20 间的团队，可散客这边预计还要 35 间。房给谁？", "qs": [{"q": "正确的分配依据是？", "opts": [["算各客群期望价值（净价 × 成交概率），给高价值散客留保护位", "best", "对。期望价值才是分配依据。"], ["团队量大，优先给团队", "ok", "量大不等于价值高，要先算期望价值。"], ["先到先得，谁先订给谁", "bad", "先到先得会把高价值房源贱卖。"]]}, {"q": "期望价值是怎么算出来的？", "opts": [["净价 × 成交概率", "best", "对。既要看一单值多少钱，也要看它有多大可能成交。"], ["挂牌价 × 出租率", "ok", "过于粗糙，没有区分客群。"], ["净价 × 房间数量", "bad", "错。量大不等于价值高。"]]}, {"q": "临近日期时，高价值散客的 pickup 一直没起来，保护位应该？", "opts": [["逐步释放，把房源放给团队以免空置", "best", "对。保护位要跟着实际 pickup 动态调整，不能一成不变。"], ["一次性全部放掉", "ok", "过于急躁，应分批逐步释放。"], ["继续保留到最后，等散客上门", "bad", "错。空置的损失是确定性的。"]]}], "lesson": "期望价值＝净价 × 成交概率，概率必须来自历史数据。按期望价值排序：散客期望价值高于团队时设保护位并给团队明确上限；临近日期若高价值 pickup 未达预期，逐步释放保护位。", "key": "库存分配看期望价值，不看谁先开口。"}, {"kind": "ch", "ch": "ch13", "part": "第二篇 · 决策篇", "title": "渠道净价：到手多少钱才算数", "story": "OTA 挂 620 元，佣金 15%。销售说：「和直销一个价啊。」", "qs": [{"q": "这一间房，到手是多少？", "opts": [["527 元（620 × 0.85）", "best", "对。账面同价，实际差了 93 元。"], ["600 元左右", "ok", "接近但不够精确，佣金之外还可能有其他成本。"], ["620 元", "bad", "那是客人付的钱，不是您收到的钱。"]]}, {"q": "哪种渠道最应该优先投入？", "opts": [["净价最高且供给稳定的直销渠道", "best", "对。直销没有佣金，是长期最划算的渠道。"], ["流量最大的 OTA", "ok", "流量大但成本高，应作为拉新渠道限量使用。"], ["佣金最低但几乎不产生订单的渠道", "bad", "错。没有转化，净价再高也没意义。"]]}, {"q": "渠道成本除了佣金，还应该列入哪些？", "opts": [["促销分摊、开票与结算成本、退改损失", "best", "对。只看佣金会低估渠道的真实成本。"], ["只有推广费", "ok", "不全面。"], ["没有了，佣金就是全部", "bad", "错。隐性成本常常比想象的高。"]]}], "lesson": "净价＝挂牌价 ×（1 − 佣金比例）− 其他渠道成本。别只算佣金，促销分摊、开票与结算成本都要列。按净价与战略价值给渠道排序、配额；直销净价最高，应优先投入。", "key": "账面同价，到手差 93 元——永远算净价。"}, {"kind": "ch", "ch": "ch14", "part": "第二篇 · 决策篇", "title": "客源细分：把客人分成几堆来卖", "story": "云璟当前客源结构：商务散客 42%、会议团队 24%、OTA 20%、协议 10%、会员 4%。", "qs": [{"q": "这个结构最能说明什么？", "opts": [["会员只占 4%，直销能力弱", "best", "对。会员占比是直销能力的体检指标。"], ["结构挺好，商务散客最多", "ok", "散客多说明基本盘稳，但会员偏低是隐患。"], ["OTA 占比不高，没问题", "ok", "20% 尚可，但直销只有 4%，两头不对称。"]]}, {"q": "客群真正「分开」靠的是什么？", "opts": [["提前期、取消政策、最少住期等限制条件", "best", "对。没有条件的细分只是嘴上分开，高价客照样来买低价。"], ["给每个客群分配不同的销售", "ok", "有帮助，但真正隔开客群的还是限制条件。"], ["在报表里给他们贴上不同的标签", "bad", "错。标签不改变客人的购买行为。"]]}, {"q": "会员占比长期偏低，最可能的后果是？", "opts": [["被迫长期依赖 OTA，佣金支出居高不下", "best", "对。直销能力弱，就只能持续向平台交钱。"], ["出租率会下降", "ok", "短期不一定，长期会失去定价主动权。"], ["对经营没有实质影响", "bad", "错。这直接影响利润结构。"]]}], "lesson": "不细分就无法差异化。按渠道、目的、预订行为、价格敏感度分类，算各客源净贡献（含餐饮会场等附加消费），按价值与稳定性排序，再用提前期、取消政策、最少住期把客群真正隔开——而不是只在嘴上分开。", "key": "会员占比，是直销能力的体检指标。"}, {"kind": "ch", "ch": "ch15", "part": "第二篇 · 决策篇", "title": "团队置换：这个团该不该接", "story": "一个 120 间夜的会议团队，报价 480 元/间夜，占用周五、周六，同时要用 800 ㎡ 宴会厅。本店 BAR 620 元，该周末散客需求旺盛。", "qs": [{"q": "接，还是不接？", "opts": [["算置换：比较团队净贡献与被置换散客的预期净收入", "best", "对。团队看的是置换，不是间夜量。"], ["不接，480 低于 BAR 620", "ok", "方向对，但还没算餐饮会场等附加价值。"], ["接，120 间夜量这么大", "bad", "量大不等于划算，要看被占掉的散客值多少钱。"]]}, {"q": "本例把餐饮会场收益计入后，团队报价大约多少才不亏？", "opts": [["约 526 元/间夜", "best", "对。团队净 46,200 元加上约 8,000 元附加收益，要覆盖约 59,670 元的置换损失，反推约 526 元。"], ["必须高于BAR 620 元", "ok", "过于严格，忽略了餐饮会场带来的附加贡献。"], ["480 元就够了", "bad", "错。那会亏约 13,470 元（未计附加收益）。"]]}, {"q": "接团决策最常见的错误是？", "opts": [["只看间夜量大就接", "best", "对。量的背后是被占掉的散客价值，必须算置换。"], ["先问财务意见", "ok", "可以参考，但置换测算是收益岗自己的功课。"], ["一律不接团队", "bad", "错。淡季或低需求日的团队是很好的填谷工具。"]]}], "lesson": "置换损失＝被置换散客净收入 − 团队净贡献。本例：团队净＝120 ×（480 − 95）＝ 46,200 元；被置换散客净 ≈ 120 × 0.85 ×（680 − 95）＝ 59,670 元，亏约 13,470 元。但宴会餐饮等附加收益约 8,000 元，计入后临界报价约 526 元——低于就不接，按这个数去谈。", "key": "团队看置换，不看间夜量；附加价值算进去才谈得动。"}, {"kind": "ch", "ch": "ch16", "part": "第二篇 · 决策篇", "title": "直销与会员：把客人变成自己的", "story": "云璟会员只占 4%，绝大多数客人从 OTA 来。每间房都在给平台交佣金。", "qs": [{"q": "提升直销的第一步是什么？", "opts": [["官网/小程序做最优价保证，让客人有理由直接订", "best", "对。直销不是靠堵，是靠给一个更好的理由。"], ["先搭一套积分体系", "ok", "积分是权益，但要先确认权益成本低于直销与 OTA 的净价差。"], ["OTA 涨价，逼客人来官网", "bad", "涨价只会流失订单，不会自动带来直销。"]]}, {"q": "设计会员权益的上限依据是？", "opts": [["直销与 OTA 之间的净价差", "best", "对。权益成本必须低于这个差额，否则还不如让客人从 OTA 来。"], ["同行给了多少权益", "ok", "会被卷入军备竞赛，失去依据。"], ["会员愿意付多少钱", "bad", "缺乏成本约束，容易做亏。"]]}, {"q": "会员数据的使用边界是？", "opts": [["在告知并同意的范围内使用，不得越界采集或对外提供", "best", "对。便捷不能以牺牲客人隐私为代价。"], ["匿名化之后就不受限了", "ok", "过度简化，仍受法规约束。"], ["只要是自家会员，怎么用都行", "bad", "错。合规风险很高。"]]}], "lesson": "先算清直销与 OTA 的净价差——这是会员投入的上限。会员权益（价格、服务、积分三类）成本必须低于净价差才有意义。会员数据用于客群细分，须在告知同意范围内使用，不得越界采集或对外提供。", "key": "直销不是靠堵住 OTA，是靠给客人一个直接订的理由。"}, {"kind": "boss", "ch": "", "part": "第二篇 · 决策篇 · 综合小考", "title": "十二个决策场景总复习", "story": "连着十二天的决策实操之后，周总把您叫进办公室：「这周几个决定连在一起，说说你的逻辑。」", "qs": [{"q": "周一发现本周 pickup 落后于同期，第一步应该？", "opts": [["先看是量的问题还是价的问题，再决定动价格还是放库存", "best", "对。先定位，再动手，不要一上来就降价。"], ["立刻全渠道降价", "bad", "错。可能根本不是价格问题。"], ["关掉所有低价房型", "bad", "错。方向相反。"]]}, {"q": "同时来了一个团队询价和一个高价值散客群需求，库存只够一个，依据什么分配？", "opts": [["比较两边的期望价值（净价 × 成交概率）", "best", "对。期望价值是唯一可靠的分配依据。"], ["给团队，因为量大", "bad", "错。"], ["先到先得", "bad", "错。"]]}, {"q": "渠道结构调整的第一步应该做什么？", "opts": [["把各渠道的净价算清楚并排序，再定配额", "best", "对。没有净价对照，调整就是拍脑袋。"], ["提高所有渠道的价格", "ok", "不解决结构问题。"], ["全面压缩 OTA 库存", "bad", "错。可能同时压掉了拉新能力。"]]}, {"q": "超售之前必须完成的三件事是？", "opts": [["分层测算并扣缓冲 → 走审批 → 备好 walk 预案", "best", "对。三件缺一不可，尤其是第三件关系到对客承诺。"], ["测算 → 审批", "ok", "缺了最关键的客人保障方案。"], ["只要历史数据够多就够", "bad", "错。"]]}], "lesson": "决策篇的十二条判据可以合成一句话：先看数据（进度、pickup、RGI），再算价值（净价、期望价值、置换），最后带条件执行（限制条件、审批、预案）。任何一步跳过，决策都会变形。", "key": "先看数据、再算价值、最后带条件落地。"}, {"kind": "ch", "ch": "ch17", "part": "第三篇 · 运营篇", "title": "运营全景：从年到日的节奏", "story": "新任收益经理最常问的一句话是：「我到底该从哪儿开始？」", "qs": [{"q": "正确的节奏是？", "opts": [["年看方向、月看修正、周看决策、日看动作", "best", "对。四层各有各的判断对象。"], ["从每天早上调价开始", "ok", "那是日度层，之上还有三层要先对齐。"], ["先做明年预算", "ok", "那是年度层，但之后还要拆到月周日。"]]}, {"q": "一件落在 90 天以外的事，应该怎么处理？", "opts": [["只做方向性判断，不做具体操作", "best", "对。太远的预测不可靠，具体操作应留给 14 天内的窗口。"], ["完全不要管，等临近再说", "ok", "方向可以先定，不能彻底不管。"], ["现在就把它落实到每天的动作上", "bad", "错。过早细化会被后续变化推翻。"]]}, {"q": "月度预算实际完成偏差超过阈值，第一步是？", "opts": [["做偏差原因分析，并把修正动作落到具体日期", "best", "对。月度层的核心职责就是纠偏。"], ["把全年目标往下调，让它更容易达成", "bad", "错。那是改目标而不是改经营。"], ["等到年底再一起总结", "bad", "错。错过修正窗口。"]]}], "lesson": "年度层定目标与关键事件；月度层做预测与偏差修正；周度层开例会，只处理未来 14 天内可执行的事项；日度层做定价与库存动作。超出 90 天的事只做方向性判断，不做具体操作。", "key": "14 天以内才叫决策，14 天以外只是方向。"}, {"kind": "ch", "ch": "ch18", "part": "第三篇 · 运营篇", "title": "每日实操流程：一天具体做什么", "story": "每天早上八点半，收益岗要干的事其实就那么几件。问题不在于没时间，而在于没有固定顺序。", "qs": [{"q": "进办公室第一步看什么？", "opts": [["昨日经营结果，与昨日、上周同日、去年同期三方对比", "best", "对。先看结果，才知道今天要不要动。"], ["先看竞品价格", "ok", "重要，但在固定顺序里排在第三步。"], ["先处理销售部发来的询价", "bad", "一上来就被打断，整天都会被动。"]]}, {"q": "看昨日结果时，正确的对比方式是？", "opts": [["与昨日、上周同日、去年同期三方对比", "best", "对。单看一天看不出趋势，三方对比才知道是不是真的变好了。"], ["只看与去年同期比", "ok", "缺少周维度的季节性参照。"], ["只看比昨天涨跌了多少", "bad", "错。日波动大，容易被噪声误导。"]]}, {"q": "距入住不足 3 天且进度落后时，操作的重点是？", "opts": [["以放量为主，谨慎提价", "best", "对。剩下的时间不多，空置是确定的损失。"], ["继续按原节奏提价", "bad", "错。会把最后的机会也赶走。"], ["关闭低价房型保价格", "bad", "错。此时保价不如保出租率。"]]}], "lesson": "固定顺序：昨日结果 → 在手与 pickup → 竞品价格 → 调价与开关房型 → 处理当日请求 → 填日报。顺序对了，20 分钟就够；顺序乱了，一上午都不够。", "key": "每日动作要有固定顺序，顺序本身就是效率。"}, {"kind": "ch", "ch": "ch19", "part": "第三篇 · 运营篇", "title": "执行标准与收益例会", "story": "每周例会开了两小时，前厅、销售、收益各说各话，散会时谁也不知道要干什么。", "qs": [{"q": "例会的第一个改进是什么？", "opts": [["固定四段议程：回顾 → 预测 → 决策 → 分工，且每项决策落到人与时间", "best", "对。没有责任人和时间的决策等于没决策。"], ["把会议缩短到 30 分钟", "ok", "缩短只是治标，议程不变照样低效。"], ["要求每个人会前发书面材料", "ok", "有用，但先要把议程和数据源统一。"]]}, {"q": "会上提出一个可执行事项但没有指定责任人，应该？", "opts": [["当场补上责任人与完成时间，否则视为未决策", "best", "对。没有归属的事项通常不会被执行。"], ["先记下来，会后由秘书分配", "ok", "效率低于当场定人。"], ["下次会再说", "bad", "错。基本等于搁置。"]]}, {"q": "下次例会开始时最先应该做什么？", "opts": [["复盘上次会议决策的执行结果", "best", "对。不复盘，例会就变成了流水账。"], ["先通报最新的整体经营数据", "ok", "重要，但应排在复盘之后。"], ["直接进入本周的新议题", "bad", "错。没有闭环。"]]}], "lesson": "会前把数据表发到参会人手里，会上不争论口径；只讨论未来 14 天内可执行的事项，超出范围的移到月度会；每项决策必须有责任人与完成时间；下次会先复盘上次决策的执行结果。", "key": "没有责任人和完成时间的决策，等于没有决策。"}, {"kind": "ch", "ch": "ch20", "part": "第三篇 · 运营篇", "title": "预测与需求日历", "story": "明年三月城里有个大型展会，销售部问：要不要现在就把价格锁上去？锁早了可能锁错，锁晚了就被别人先占。", "qs": [{"q": "判断依据是？", "opts": [["做需求日历：历史同期 + 事件标注 + 剔除异常年，再定价格档", "best", "对。预测的价值是给「提前多久动手」一个依据。"], ["按去年价格加 10%", "ok", "比不动好，但没有区分事件日与平常日。"], ["等到临近再看，灵活应对", "bad", "临近再动，价格与库存都已被别人先占。"]]}, {"q": "为什么要剔除异常年份的历史数据？", "opts": [["异常事件会污染基准，让预测系统性偏高或偏低", "best", "对。比如疫情期间的数据完全不可比。"], ["因为数据比较多，删掉一些更清爽", "bad", "错。"], ["出版社/上级要求这样做", "bad", "错。"]]}, {"q": "某个事件日的「确定性」不同，处理方式是？", "opts": [["确定性高就提前锁定价格与库存；不确定就保留弹性", "best", "对。把资源押在确定性强的事情上。"], ["一律不提前，灵活第一", "ok", "错失确定性收益。"], ["一律提前锁定，抢占先机", "bad", "错。押错了要承担空置损失。"]]}], "lesson": "取过去 2–3 年同月同周的数据作为基准；把展会、演出、考试、节假日逐条标出并注明确定程度；剔除受特殊事件影响的年份；把每日分成高/中/低需求等级，每个等级对应一个价格档与限制条件。确定性高的才提前锁价，不确定的保留弹性。", "key": "预测的价值，是给「提前多久动手」一个依据。"}, {"kind": "ch", "ch": "ch21", "part": "第三篇 · 运营篇", "title": "年度预算：把一年拆到每天", "story": "老板只给了一句话：明年客房收入要比今年高 8%。一个总数没法执行。", "qs": [{"q": "怎么让它变得可执行？", "opts": [["拆到月（按淡旺季，不能平均）、再拆到周、拆到日", "best", "对。一个总数没法执行，必须拆到每天。"], ["给每位销售压指标", "ok", "压指标解决不了目标本身合不合理。"], ["分摊到 12 个月，每月增长 0.67%", "bad", "平均分配会忽略淡旺季，淡季目标永远完不成。"]]}, {"q": "把年度目标分摊到 12 个月时，最常见的错误是？", "opts": [["平均分摊，忽略了淡旺季与事件日历", "best", "对。平均分摊会让淡季目标永远完不成、旺季目标又过于轻松。"], ["完全按去年实际占比分配", "ok", "稳健，但没有考虑今年的新事件。"], ["把目标全部压在旺季", "bad", "错。旺季容量有限，压太多不现实。"]]}, {"q": "拆到每日目标后，发现某淡季月缺口最大，应该？", "opts": [["针对该月做填谷方案：团队、活动、套餐、渠道", "best", "对。缺口要变成具体动作，而不是在报表上空着。"], ["提高全年的房价来补", "ok", "淡季提价会进一步抑制需求。"], ["把该月目标下调，让总数看起来合理", "bad", "错。"]]}], "lesson": "先定全年 OCC、ADR、RevPAR 三个目标并互相校验；结合淡旺季与事件日历分到 12 个月（不能平均分配）；再拆到周、到日，形成每日目标值；与去年实际逐日对比找缺口，把每个缺口变成具体动作（填谷、提价、事件日布局、客源结构调整）。", "key": "一个总数没法执行，必须拆到每天。"}, {"kind": "ch", "ch": "ch22", "part": "第三篇 · 运营篇", "title": "价格体系 BAR：所有价格的锚", "story": "店里价格档位混乱：前台一个价、OTA 一个价、协议客户又一个价，谁也说不清哪个是「标准价」。", "qs": [{"q": "怎么理顺？", "opts": [["定 BAR 为锚，房型/客源/渠道/套餐全部按规则从 BAR 折算", "best", "对。没有锚，所有价格都失去依据。"], ["统一成最低价，简单省事", "bad", "统一成最低价等于放弃全部溢价空间。"], ["每个渠道单独定一套价格", "bad", "那正是混乱的来源。"]]}, {"q": "检验价格体系是否健康的最简单标准是？", "opts": [["所有价格都能追溯到 BAR", "best", "对。任何一个价格说不清从 BAR 怎么来的，就是体外循环。"], ["每个渠道都有一套自己能解释的价格", "ok", "那正是混乱的来源。"], ["房价表足够长，覆盖各种情况", "bad", "错。表越长通常越混乱。"]]}, {"q": "某折扣需要审批但现场常常跳过，根治办法是？", "opts": [["把审批权限写成权限表，并追责到岗位", "best", "对。制度不落到岗位与表单，就等于没有制度。"], ["取消折扣权限，全部上报", "ok", "会拖慢前台响应，不是最优解。"], ["口头强调不要再犯", "bad", "错。"]]}], "lesson": "BAR（最佳可售房价）是不含限制条件、对所有公开渠道开放的基础价格。房型价差、协议价、会员价、团队价、OTA 价、套餐价，全部按规则从 BAR 折算。检验标准：所有价格都能追溯到 BAR，套餐也能折算回 BAR。", "key": "没有锚，所有价格都失去依据。"}, {"kind": "ch", "ch": "ch23", "part": "第三篇 · 运营篇", "title": "报表体系：每天该看哪几张表", "story": "系统里报表有几十张，看不完也没用。", "qs": [{"q": "每天真正要驱动决策的是哪几张？", "opts": [["四张：在手量、pickup 增量、竞品价格、渠道结构", "best", "对。四张表足以驱动每日决策。"], ["只看经营日报", "ok", "日报看结果，但缺了进度与竞品。"], ["全部看一遍，免得漏掉", "bad", "逐行看会把异常淹没在细节里。"]]}, {"q": "发现某个渠道占比突然翻倍，第一步是？", "opts": [["查配额与活动设置，确认是不是自己放开了口子", "best", "对。结构突变通常有内部原因，先查自己再查外部。"], ["记下来下次例会讨论", "ok", "响应太慢，渠道问题宜当日处理。"], ["立即关闭该渠道", "bad", "错。可能误伤正在起量的新渠道。"]]}, {"q": "报表阈值应该？", "opts": [["按季节与客源结构定期调整", "best", "对。固定的阈值在淡旺季都会失真。"], ["设得越灵敏越好", "ok", "过于灵敏会淹没在误报里。"], ["一经设定永不更改", "bad", "错。"]]}], "lesson": "固定看表顺序：先看结果、再看进度、再看竞品、最后看渠道。只抓超过阈值的偏差，每个异常都要对应一个具体动作或一条待查事项。阈值不是固定的，按季节与客源结构调整。", "key": "报表不是用来看的，是用来触发动作的。"}, {"kind": "ch", "ch": "ch24", "part": "第三篇 · 运营篇", "title": "OTA 与点评：评分就是价格", "story": "云璟评分从 4.6 掉到 4.4，订单明显少了。价格没变，可客人在列表页看到的就是：比您低 0.2 分的那家排在前面。", "qs": [{"q": "正确的应对是？", "opts": [["把差评归类成主题，转成运营整改项并指定责任人", "best", "对。分数只能靠服务挣回来。"], ["降价弥补排名下滑", "ok", "降价能换来一点订单，但治不了根本。"], ["找人刷几条好评，先把分拉回来", "bad", "刷评是短期假指标、长期真负债，也是对客人的欺骗。"]]}, {"q": "定位差评之后的关键一步是？", "opts": [["把差评主题转成可整改的运营动作并指定责任人", "best", "对。只统计不整改，评分不会自己回来。"], ["逐条向客人解释", "ok", "必要但不充分。"], ["统计一下本月差评数量即可", "bad", "错。数量没有行动价值。"]]}, {"q": "排名下滑时应该同时检查哪三件事？", "opts": [["价格、库存、评分", "best", "对。排名是这三者的综合结果，只看一个会误判。"], ["价格、佣金、评分", "ok", "佣金影响有限，重点应是库存是否放开。"], ["只看评分", "bad", "错。"]]}], "lesson": "评分直接影响曝光、排名与转化。把差评归类（卫生、噪音、服务响应、设施、早餐），每个主题对应一个可整改的动作与责任人；同时监测竞品评分判断相对位置。排名下滑时要同时检查价格、库存与评分三件事。", "key": "评分就是价格，但分数只能靠服务挣。"}, {"kind": "boss", "ch": "", "part": "第三篇 · 运营篇 · 综合小考", "title": "把决策串成流程", "story": "半年过去了，您的操作越来越熟练，但周总说：「一个人会做不够，得让整家店天天运转起来。」", "qs": [{"q": "让全店稳定运转起来的第一件事是？", "opts": [["建立固定节奏：年→月→周→日，并配固定议程与固定表单", "best", "对。流程是把个人能力变成组织能力的唯一方式。"], ["上一套更好的系统", "ok", "系统承载流程，但不能替代流程设计。"], ["招更多懂收益的人", "bad", "错。没有流程，人再多也会乱。"]]}, {"q": "每日早间操作，正确的顺序是？", "opts": [["昨日结果 → 在手与 pickup → 竞品价格 → 调价开关 → 当日请求 → 填日报", "best", "对。顺序固定，二十分钟就能完成。"], ["竞品价格 → 昨日结果 → 调价", "ok", "把竞品放在结果之前容易被带偏。"], ["先处理邮件与电话，再谈数据", "bad", "错。一早被打断，整天被动。"]]}, {"q": "报表看完之后必须发生什么？", "opts": [["每个异常都要对应一个动作或一条待查事项", "best", "对。看完没动作，报表就变成了仪式。"], ["抄送给相关同事", "ok", "抄送不等于处置。"], ["存档备查", "bad", "错。"]]}, {"q": "价格混乱久治不愈，根治办法是？", "opts": [["建立以 BAR 为锚的价格体系，所有价格可折算、可追溯", "best", "对。没有锚，价格永远是各说各话。"], ["每月做一次价格检查", "ok", "治标。"], ["把定价权全部收归总经理", "bad", "错。会降低响应速度。"]]}], "lesson": "运营篇的核心不是新招式，而是把决策篇的招式串成一条能天天运转的流水线：固定节奏、固定顺序、固定议程、固定看板、一个价格锚。个人能力靠灵感，组织能力靠流程。", "key": "把会做的事变成天天都在做的事，靠的是流程不是灵感。"}, {"kind": "ch", "ch": "ch25", "part": "第四篇 · 组织篇", "title": "岗位与组织：谁来干这件事", "story": "云璟 300 间，要不要设专职收益经理？周总觉得「先招个人再说」。", "qs": [{"q": "关键其实不在有没有人，而在？", "opts": [["定价权与审批权限有没有写清楚", "best", "对。没有权限表的收益岗，等于没有岗。"], ["能不能招到一个懂系统的人", "ok", "系统能力可培养，权责边界才是前提。"], ["预算够不够", "ok", "预算决定形式，不决定成败。"]]}, {"q": "什么样的酒店更适合设专职收益岗？", "opts": [["房量大、客源与渠道复杂、需要每日决策的酒店", "best", "对。复杂度决定岗位形态。"], ["任何酒店都应该设", "ok", "小规模店由店总或前厅经理兼任更合适。"], ["只要有预算就可以设", "bad", "错。结构简单的店设专职是浪费。"]]}, {"q": "收益岗的考核如果只看出租率，会发生什么？", "opts": [["团队会用降价冲出租率，牺牲房价与利润", "best", "对。考核指标决定行为，指标错了行为一定错。"], ["出租率会明显提升", "ok", "是的，但利润会下降。"], ["没有影响", "bad", "错。"]]}], "lesson": "按房量、客源复杂度、渠道数量判断专职还是兼任。定权责（谁定价、谁审批、超授权怎么办，写成权限表）；定协作（前厅、销售、财务的接口与例会机制）；定考核——不能只看出租率，要把 RevPAR 与 RGI 纳入。", "key": "没有权限表的收益岗，等于没有岗。"}, {"kind": "ch", "ch": "ch26", "part": "第四篇 · 组织篇", "title": "成本与利润：降价的底线在哪", "story": "销售想以 500 元接一个团。云璟单位变动成本是 95 元/间夜。", "qs": [{"q": "底线在哪？", "opts": [["变动成本 95 元是底线，但经营上要留出空间，不能贴着底线卖", "best", "对。边际为正只是及格线。"], ["500 高于 95，随便接", "ok", "边际确实为正，但没算隐性成本，也没留空间。"], ["按去年均价定", "bad", "均价与底线无关。"]]}, {"q": "净价高于变动成本就一定该接吗？", "opts": [["不一定——边际为正只是及格线，还要留出经营空间", "best", "对。贴着底线卖会把固定的利润也吃掉。"], ["要看对方是不是长期客户", "ok", "关系重要，但不能替代成本核算。"], ["是的，只要高于变动成本就该接", "bad", "错。"]]}, {"q": "高能耗房型或高负荷日期，价格底线应该？", "opts": [["上调，把隐性成本算进去", "best", "对。能耗、布草、人力都是随间夜发生的成本。"], ["与普通房型相同", "ok", "忽略了不同房型的实际成本差异。"], ["下调，先把量做起来", "bad", "错。"]]}], "lesson": "边际贡献＝净价 − 单位变动成本，为正就对固定成本有贡献；但经营上必须留出合理空间。还要计入隐性成本（能耗、布草洗涤、人力、易耗品），按房型与日期换算；高能耗房型与高负荷日期适当上调底线。", "key": "底线是变动成本，但别贴着底线卖。"}, {"kind": "ch", "ch": "ch27", "part": "第四篇 · 组织篇", "title": "系统与数据：工具能替您做什么", "story": "没有收益管理系统，用 Excel 能不能做？团队里有人神化系统，也有人完全不用。", "qs": [{"q": "系统与人的分工是？", "opts": [["计算与报表交给工具；判断、谈判、对客承诺只能由人来做", "best", "对。工具替您算账，不替您担责。"], ["上了系统就不用人管了", "bad", "系统不会判断，也不会对一个到店无房的客人负责。"], ["没有系统就做不了收益管理", "bad", "先建四张核心表就能开工。"]]}, {"q": "数据缺失时应该？", "opts": [["先补数据，不做没有依据的决策", "best", "对。没有数据的判断只是猜测。"], ["凭经验先做，之后再说", "bad", "错。"], ["完全依赖系统给出的建议", "bad", "错。系统也只能基于已有数据算。"]]}, {"q": "先建立最小可用的数据表，应该包含哪几类？", "opts": [["在手量、pickup 增量、竞品价格、渠道结构", "best", "对。四张表足以驱动每日决策。"], ["只要有经营日报就行", "ok", "缺了进度与竞品维度。"], ["把所有能导出的报表都存下来", "bad", "错。数据多不等于有用。"]]}], "lesson": "系统能做：数据汇总、自动算价建议、报表生成、异常提醒。系统不能做：判断、谈判、对客承诺、承担责任。系统给出的异常值与建议价，必须人工复核后才生效；关键数据缺失时先补数据，不做无依据决策。", "key": "工具替您算账，不替您担责。"}, {"kind": "ch", "ch": "ch28", "part": "第四篇 · 组织篇", "title": "淡旺季与事件日：一年里最容易赚的钱", "story": "一年 365 天，真正决定全年利润的往往只有几十天：展会那几天、演唱会那晚、长假那几天。", "qs": [{"q": "该提前做什么？", "opts": [["建事件日历，评估每个事件的需求强度，提前锁定价格与库存", "best", "对。一年的利润，往往由几十天决定。"], ["到了再说，灵活应对", "bad", "事件日临时应对，通常只能捡别人剩下的。"], ["全年统一价，简单省事", "bad", "统一价会把事件日的钱全部让出去。"]]}, {"q": "事件日结束后最容易出现什么？", "opts": [["需求骤降，若未提前安排会形成空置低谷", "best", "对。高峰之后的下滑必须提前安排填谷。"], ["需求继续维持高位", "bad", "错。"], ["与平常日没有差别", "bad", "错。"]]}, {"q": "事件日的布局，正确的节奏是？", "opts": [["提前锁定价格与库存，临近再按实际 pickup 微调", "best", "对。先占住位置，再跟着数据校准。"], ["完全不动，等客人上门", "ok", "会被同行先占完。"], ["一次定死，之后完全不动", "bad", "错。失去调整机会。"]]}], "lesson": "把展会、演出、考试、体育赛事、节假日逐条列出并标日期；按历史同期与事件规模估算需求强度；对确定性高的事件日提前设置价格档与住期限制，提前与渠道谈配额；事件临近时按实际 pickup 调整，不要一次定死；事件结束后需求骤降要提前安排填谷。", "key": "一年的利润，往往由几十天决定。"}, {"kind": "boss", "ch": "", "part": "第四篇 · 组织篇 · 综合小考", "title": "谁来做、底线在哪", "story": "这一年后半段，您开始参与管理：要定岗、要守成本底线、要判断什么时候抓事件日。", "qs": [{"q": "新设一个收益岗，最先要写下来的是什么？", "opts": [["定价权与审批权限表", "best", "对。没有权限表的岗位，遇到事就只能临时请示。"], ["岗位说明书里的工作职责", "ok", "职责重要，但权限决定能不能真的做决定。"], ["薪资与考核方案", "ok", "可以在权限明确之后再谈。"]]}, {"q": "一个团的报价刚好略高于变动成本，接不接？", "opts": [["看是否还有经营空间；贴着底线的单要上一级审批", "best", "对。边际为正只是及格线，还要留出管理与隐性的空间。"], ["不接，太薄", "ok", "过于绝对，淡季填谷时略高于底线也可以考虑。"], ["接，边际为正就该接", "bad", "错。贴着底线卖会吃掉本该赚的钱。"]]}, {"q": "系统给出与经验明显相反的建议价，应该？", "opts": [["人工复核：查输入数据是否异常，再决定是否采纳", "best", "对。系统不会担责，最终签字的是人。"], ["完全按经验执行，忽略系统", "ok", "忽视数据同样危险。"], ["完全按系统执行", "bad", "错。"]]}, {"q": "一年里把资源优先投向哪里收益最高？", "opts": [["少数几个确定性高的事件日与旺季节点", "best", "对。一年的利润，往往由几十天决定。"], ["淡季，因为那里最缺客人", "ok", "淡季要填谷，但利润峰值在高需求日。"], ["平均分摊到每一天", "bad", "错。"]]}], "lesson": "组织篇讲的是「谁来做、靠什么做、底线在哪」：岗位靠权限表落地，价格底线是变动成本但要留空间，系统与人的边界是算账与担责的分工，而一年的资源要押在几十个高确定性日期上。", "key": "<｜hy_place▁holder▁no▁813｜>到人之前先定权限，押资源之前先定确定性。"}, {"kind": "ch", "ch": "ch29", "part": "第五篇 · 延伸篇", "title": "餐饮收益：RevPASH 与翻台", "story": "云璟餐厅 120 个座位，翻台 1.8 次，人均消费 95 元。餐饮部问：我们的收益该怎么衡量？", "qs": [{"q": "餐饮收益看什么指标最合适？", "opts": [["RevPASH＝营收 ÷ 可用座位数 ÷ 营业小时", "best", "对。它同时容纳了翻台与人单。"], ["翻台率", "ok", "翻台只看流转，会漏掉每桌赚多少。"], ["人均消费", "ok", "人单只看单价，会漏掉座位空转。"]]}, {"q": "提升 RevPASH 的路径不包括？", "opts": [["无条件把所有菜品降价促销", "best", "对（这是不该做的）。降价会同时压低人单，反而伤 RevPASH。"], ["控制用餐时长，提高翻台", "ok", "这是有效路径。"], ["做时段定价，把下午茶与晚市错峰", "ok", "也是有效路径。"]]}, {"q": "餐饮与客房在收益逻辑上的共同点是？", "opts": [["都是「容量 × 利用率 × 单价」，只是换了名字", "best", "对。RevPASH 与 RevPAR 是同一套逻辑。"], ["两者毫无关系", "bad", "错。"], ["只有客房可以做收益管理", "bad", "错。"]]}], "lesson": "RevPASH（每可用座位每小时收入）把翻台率与人单合成一个数。提升路径有三条：控制用餐时长、引导点单结构、做时段定价（下午茶与晚市错峰）。它和 RevPAR 的逻辑完全一致：容量 × 利用率 × 单价。", "key": "餐饮要同时管翻台和人单，RevPASH 把两者合成一个数。"}, {"kind": "ch", "ch": "ch30", "part": "第五篇 · 延伸篇", "title": "会议宴会：不只算房，算总贡献", "story": "一个会议团队用房 80 间夜，另用 800 ㎡ 宴会厅两天，还含三餐与停车。销售只报了房价。", "qs": [{"q": "该怎么算这笔账？", "opts": [["算总贡献：客房 + 餐饮 + 会场 + 停车，减去全部变动成本", "best", "对。会议团的账要算总贡献。"], ["会场免费送，把房拿下来", "ok", "可能把最赚钱的一块送掉了。"], ["只看房价够不够", "bad", "会漏掉餐饮与会场这两块真正的利润来源。"]]}, {"q": "为了把客房拿下而免费送宴会厅，风险是？", "opts": [["可能送掉整单里利润最高的那一块", "best", "对。会议团的餐饮与会场往往比房更赚钱。"], ["会提升客户满意度，一定划算", "ok", "满意度有价值，但不能不计成本。"], ["没有风险，只要房价合适", "bad", "错。"]]}, {"q": "计算会议团贡献时，成本端要包含？", "opts": [["客房、餐饮、会场的全部变动成本，含能耗、人力、布草、易耗品", "best", "对。只算房的成本会严重高估这单的价值。"], ["固定成本也要分摊进去", "ok", "短期决策看变动成本即可。"], ["只需要算客房的变动成本", "bad", "错。"]]}], "lesson": "会议宴会要把客房、餐饮、会场、停车等一并计入总贡献，再减去全部变动成本（含能耗、人力、布草、易耗品）。常见错误是为了把房拿下而免费送会场，结果送掉的是利润最高的那一块。", "key": "会议团的账要算总贡献，不能只算房价。"}, {"kind": "ch", "ch": "ch31", "part": "第五篇 · 延伸篇", "title": "其他业态与跨行业参数", "story": "餐厅的桌子、会议室的时段、车场的车位——它们和客房一样，容量固定、需求会波动、可以分段定价。", "qs": [{"q": "判断一个场景能不能套用这套方法，看什么？", "opts": [["容量固定 + 需求波动 + 可分段定价，三条同时满足", "best", "对。三条件同时满足，判据就能搬过去。"], ["只要能卖东西就行", "bad", "缺了任意一条，判据都会失效。"], ["只要有竞争对手", "bad", "竞争不是必要条件。"]]}, {"q": "哪个场景最符合三个迁移条件？", "opts": [["影院：座位固定、场次需求波动、可按时段与座位分区定价", "best", "对。三条全中。"], ["一个付费咨询顾问的时间", "ok", "有一定相似性，但难以标准化分段定价。"], ["路边便利店：容量不固定、需求平稳", "bad", "错。容量与需求都不满足。"]]}, {"q": "迁移时正确的做法是？", "opts": [["保留判定逻辑，把变量换成该场景的对应指标", "best", "对。逻辑是通用的，变量要重换。"], ["把客房的公式原封不动套用", "bad", "错。单位都不同。"], ["重新发明一套方法", "bad", "错。"]]}], "lesson": "餐厅、会议室、车位、影院、球场、航班都符合三条件。把 OCC/ADR/RevPAR 换成该场景的对应指标（如翻台率、时段单价、单位面积收入），保留判定逻辑、替换变量即可。容量不可控或无法区分客群时，先不要硬套。", "key": "三条件同时满足，这套判据就能搬过去。"}, {"kind": "ch", "ch": "ch32", "part": "第五篇 · 延伸篇", "title": "常见误区：别再踩这些坑", "story": "通关前的最后一问。学完 31 章之后，最容易犯的错是什么？", "qs": [{"q": "下面哪个是收益管理最典型的误区？", "opts": [["把出租率当成唯一目标", "best", "对。只追出租率是最典型、也最贵的误区。"], ["每天都在调价", "ok", "频繁调价是操作问题，不是最典型的误区。"], ["关注竞品价格", "ok", "关注竞品是必要的，不算误区。"]]}, {"q": "收益管理所有动作的总纲是？", "opts": [["可解释、可追溯、合规", "best", "对。说不清依据、留不下记录、踩了红线的，都不是收益管理。"], ["收入最大化", "bad", "错。不择手段的收入最大化会伤害长期。"], ["出租率与房价同时最高", "bad", "错。两者常不可兼得，要比的是组合最优。"]]}, {"q": "发现下属为了让报表好看虚报预测数据，应该？", "opts": [["立即纠正并重申数据诚信是职业底线", "best", "对。基于假数据做的所有决策都会错，代价远高于表面上的难看。"], ["只在内部提醒一次即可", "ok", "需要纠正并建立机制，不能只口头放过。"], ["数字好看也算一种能力，不必深究", "bad", "错。"]]}], "lesson": "常见误区：只追出租率、只追房价、降价靠感觉、无条件折扣、超售无 walk 预案、团队只看间夜量、库存先到先得、报表看完不动作、刷评删差评、贴着成本底线卖。记住一条总纲——所有动作都必须可解释、可追溯、合规。", "key": "收益管理的底线：可解释、可追溯、合规。"}, {"kind": "boss", "ch": "", "part": "第五篇 · 延伸篇 · 综合小考", "title": "把方法带走", "story": "最后一段路。餐厅经理、宴会销售、甚至一家影院的朋友都来问您：这套东西，我们不卖房，能用吗？", "qs": [{"q": "餐饮的 RevPASH 相当于客房的什么？", "opts": [["RevPAR——都是「单位容量 × 单位时间」的收入", "best", "对。逻辑完全一致，只是把间夜换成了座位小时。"], ["ADR", "bad", "错。ADR 只是单价。"], ["OCC", "bad", "错。OCC 只是利用率。"]]}, {"q": "接一个大型会议团，核算口径应该是？", "opts": [["客房 + 餐饮 + 会场 + 停车的总贡献，减全部变动成本", "best", "对。要算整张账单，而不是只算房价。"], ["以客房收入为主，其余忽略", "bad", "错。常常漏掉最赚钱的一块。"], ["按团队人数估算", "bad", "错。"]]}, {"q": "判断一个新场景能否套用这套方法，三条条件是？", "opts": [["容量固定 + 需求波动 + 可分段定价", "best", "对。三条同时成立，整套判据就能搬过去。"], ["有竞争 + 有历史数据 + 有系统", "bad", "错。都不是必要条件。"], ["只要有库存就行", "bad", "错。"]]}, {"q": "全部 32 章走完，最该记住的一句话是？", "opts": [["收益最大化不是收入最大化，而是「可解释、可追溯、合规」的组合最优", "best", "对。这一句是全书的底线。"], ["把价格提到能卖掉的最高点", "bad", "错。"], ["把客房全部卖光", "bad", "错。"]]}], "lesson": "延伸篇说明这套方法的边界与弹性：只要满足容量固定、需求波动、可分段定价三条，判据就能迁移。但无论在哪个场景，底线不变——可解释、可追溯、合规。", "key": "方法能带走，底线也得带走。"}];
var K='hrma_game_rm_v2';
var st={i:0,q:0,score:0,ans:{},fin:0};
try{var s=JSON.parse(localStorage.getItem(K)||'null');if(s&&s.ans)st=s;}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(st));}catch(e){}}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function done(i){var a=st.ans[i];return a&&a.length===LV[i].qs.length;}
function dots(){
  var h='';
  for(var i=0;i<LV.length;i++){
    var c=(done(i)?' done':'')+(i===st.i?' cur':'')+(LV[i].kind==='boss'?' boss':'');
    var lb=LV[i].kind==='boss'?'★':(LV[i].ch.replace('ch',''));
    h+='<button class="'+c+'" onclick="go('+i+')" title="'+LV[i].title+'">'+lb+'</button>';
  }
  document.getElementById('dots').innerHTML=h;
}
function bar(){
  var n=0;for(var i=0;i<LV.length;i++)if(done(i))n++;
  document.getElementById('pn').textContent=st.i+1;
  document.getElementById('sc').textContent=st.score;
  document.getElementById('pb').style.width=(n/LV.length*100)+'%';
}
function go(i){if(i<0||i>=LV.length)return;st.i=i;st.q=(st.ans[i]||[]).length;save();render();window.scrollTo(0,0);}
function pick(k){
  var a=st.ans[st.i]||[];
  if(a.length>st.q)return;
  a.push(k);st.ans[st.i]=a;
  st.score+=(k===0?10:(k===1?6:3));
  save();render();
}
function cont(){st.q++;save();render();window.scrollTo(0,0);}
function next(){
  if(st.i<LV.length-1){st.i++;st.q=(st.ans[st.i]||[]).length;}
  else{st.fin=1;}
  save();render();window.scrollTo(0,0);
}
function reset_(){st={i:0,q:0,score:0,ans:{},fin:0};save();render();window.scrollTo(0,0);}
function totq(){var n=0;for(var i=0;i<LV.length;i++)n+=LV[i].qs.length;return n;}
function rank(s){var m=totq()*10;var r=s/m;
  if(r>=0.875)return '收益总监';if(r>=0.7)return '收益经理';if(r>=0.5)return '预订主管';return '见习收益员';}
function render(){
  bar();dots();
  var el=document.getElementById('stage');
  if(st.fin){fin(el);return;}
  var l=LV[st.i],a=st.ans[st.i]||[],h='';
  h+='<div class="card'+(l.kind==='boss'?' boss':'')+'">'
   +'<div class="part">'+l.part+'<span class="chno">第 '+(st.i+1)+' 关 / '+LV.length+(l.kind==='boss'?'　综合小考':'')+'</span></div>'
   +'<h2 class="ch">'+l.title+'</h2>'
   +'<div class="story">'+esc(l.story)+'</div>';
  if(st.q>=l.qs.length){
    // 本关全部答完：汇总 + 讲解 + 记住一句
    var got=0;for(var j=0;j<a.length;j++)got+=(a[j]===0?10:(a[j]===1?6:3));
    h+='<div class="res best"><div class="tag">本关完成 · 得 '+got+' / '+(l.qs.length*10)+'</div>';
    for(var j2=0;j2<l.qs.length;j2++){
      h+='<div style="margin:6px 0">'+(j2+1)+'. '+esc(l.qs[j2].q)+' → <b>'
        +(a[j2]===0?'✓ 最佳':(a[j2]===1?'△ 可行':'✗ 需谨慎'))+'</b>　'+esc(l.qs[j2].opts[0][0])+'</div>';
    }
    h+='</div>';
    h+='<div class="lesson"><b>本关讲解</b><br>'+esc(l.lesson)+'</div>';
    h+='<div class="key">记住这一句：'+esc(l.key)+'</div>';
    h+='<div class="row"><button class="btn" onclick="next()">'+(st.i<LV.length-1?'下一关 →':'看通关结果 →')+'</button></div>';
  }else{
    var q=l.qs[st.q],picked=(a.length>st.q)?a[st.q]:undefined;
    h+='<div class="q">'+esc(q.q)+'<span class="qn">（第 '+(st.q+1)+'/'+l.qs.length+' 题）</span></div>';
    if(picked===undefined){
      for(var k=0;k<q.opts.length;k++){
        h+='<button class="opt" onclick="pick('+k+')"><span class="mk">'+(k===0?'A':(k===1?'B':'C'))+'</span>'+esc(q.opts[k][0])+'</button>';
      }
      h+='<p class="sub" style="margin-top:10px">点击一个选项即可，选错不会卡关。</p>';
    }else{
      var o=q.opts[picked];
      var cls=(picked===0?'best':(picked===1?'ok':'bad'));
      var tag=(picked===0?'✓ 这是更好的选择':(picked===1?'△ 可以，但还有更好的':'✗ 这个选择要小心'));
      h+='<div class="res '+cls+'"><div class="tag">'+tag+'</div>'+esc(o[2])+'</div>';
      if(picked!==0){
        h+='<div class="lesson"><b>更好的选择是：</b>'+esc(q.opts[0][0])+'　—　'+esc(q.opts[0][2])+'</div>';
      }
      if(q.opts.length>2&&q.opts[2]&&picked!==2){
        h+='<div class="lesson" style="background:#fff;border-style:dashed"><b>C：</b>'+esc(q.opts[2][2])+'</div>';
      }
      h+='<div class="row"><button class="btn" onclick="cont()">'+(st.q+1<l.qs.length?'下一题 →':'看本关讲解 →')+'</button>'
        +'<span class="sub">本题得分 +'+(picked===0?10:(picked===1?6:3))+'</span></div>';
    }
  }
  h+='</div>';
  el.innerHTML=h;
}
function fin(el){
  document.getElementById('pb').style.width='100%';
  document.getElementById('pn').textContent=LV.length;
  var m=totq()*10;
  var h='<div class="card fin"><div class="sc">'+st.score+' / '+m+'</div>'
   +'<div class="rk">通关评级：'+rank(st.score)+'</div>'
   +'<p class="sub">您已完成全部 32 章与 5 次综合小考，共 '+totq()+' 题。下面是每一关要记住的一句话。</p><div class="kl">';
  for(var i=0;i<LV.length;i++){
    h+='<div><b>'+(LV[i].kind==='boss'?'★ '+(LV[i].part||''):'第'+LV[i].ch.replace('ch','')+'章 · '+LV[i].title)+'</b><br>'+esc(LV[i].key)+'</div>';
  }
  h+='</div><div class="row" style="justify-content:center"><button class="btn gh" onclick="reset_()">再玩一次</button>'
   +'<a class="btn" style="text-decoration:none;display:inline-block" href="textbook.html">去读原版教材</a></div></div>';
  el.innerHTML=h;
}
render();
</script>
