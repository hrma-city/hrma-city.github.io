    },
    {
      t: "表 C · 价格指数 ARI",
      s: "本店 ADR ¥620，竞争组合加权 ADR ¥680。该日预测 OCC 为 85%。",
      q: "按表 C，价格该怎么动？",

      w: "ARI = 620 ÷ 680 × 100 ≈ 91.2，落在「90–97 略低」。该区间规则：预测 OCC ≥80% → 提 3%；否则维持。本日预测 OCC 85% ≥80%，故提 3%。另注意：ARI 调整每次不超 8%、每周不超 2 次，且不得与表 A 结论叠加执行（同日只执行优先级更高者，表 A 优先于表 C）。"
    },
    {
      t: "表 D · 市场渗透指数 MPI",
      s: "本店昨日 OCC 68%，竞争组合 OCC 74%。",
      q: "MPI 是多少？按表 D 该做什么？",

    {
      t: "表 F · 房型价差阶梯",

      w: "表 F：以高级房为 100，行政房系数 145 → 相对高级房差价 +¥310，故 680 + 310 = ¥990。速记：标准 −100、豪华 +140、豪华江景 +260、行政 +310、商务套房 +600、行政套房 +1200。附加项另计：高楼层 +5%、江景 +10%、含早 +68/人、连通房 +50、加床 +180。"

    {
      t: "表 G · 团队询价置换分析",

      o: ["直接接受", "接受，但控制在 20 间以内", "上报 L3 审批", "直接拒绝"],
      a: 2,
      w: "比率 R = 480 ÷ 680 ≈ 70.6%，落在「65% ≤ R < 75%」行；预测 OCC 78% 落在「70–85%」列 → 交叉点 = 上报 L3。不要凭「价格还行」直接接，也不要一刀切拒绝——表 G 是置换分析简化版，边界情形一律上报。若这是会议团队，还需按表 K 计算综合贡献。"
    },
    {
      t: "表 H · 渠道开关",
      s: "目标日预测 OCC 97%（≥95%）。",
      q: "按表 H，渠道怎么开关？",
      o: ["全渠道开放，加大 OTA 投放冲量",
          "OTA 国内仅留 1 家产量最高的；OTA 国际、GDS、批发商全关；直销与会员全开并上会员专享价",
          "OTA 国内开 3 家、国际开 1 家、GDS 开、批发商关",
          "只保留直销，其余全关"],
      a: 1,
      w: "表 H「≥95%」行：OTA 国内仅留产量最高的 1 家，OTA 国际关、GDS/TMC 关、批发商/包房关，直销与会员全开并上会员专享价。同时遵守价格一致性红线：直销价不得高于任一 OTA 挂牌价；会员价可低于 OTA 价但仅限登录会员可见；批发商为净价不得公开挂牌。"
    },
    {
      t: "表 I · 预订窗口分档",
      s: "目标日距离今天 10 天，当前在手进度落后 18%。",
      q: "按表 I，该触发什么动作？",
      o: ["上「今日特惠」尾房产品", "启动 48 小时闪购", "执行表 A 调价", "策略复盘 + 销售动员"],
      a: 2,
      w: "表 I：10 天落在「8–14 天」档，落后触发阈值 15%，当前落后 18% 已触发 → 动作：执行表 A 调价。对照其他档位：0–3 天（阈值 OCC<70%）上今日特惠；4–7 天落后 10% 启动 48h 闪购；15–30 天落后 20% 才做策略复盘 + 销售动员。"
    },
    {
      t: "表 J · 免费升级顺序",
      s: "因超售需要腾出 3 间房。待升级客人：金卡会员（预订价 ¥680）、钻石会员（¥580）、银卡会员（¥820）、铂金会员（¥680）。每次只升 1 档。",
      q: "按表 J，优先升级谁？",
      o: ["银卡，因为预订价最高",
          "钻石 → 铂金 → 金卡 → 银卡",
          "按预订价从高到低：银卡 → 金卡/铂金 → 钻石",
          "先到先得，按入住顺序"],
      a: 1,
      w: "表 J 执行顺序严格为：① 会员等级 钻石 > 铂金 > 金卡 > 银卡；② 同档内预订价高者优先；③ 同价看入住天数；④ 再看复购次数。预订价只在同等级内部参与排序，不能跨等级比价。另外每次最多升 1 档，禁止连跳 2 档；套房升级每日不超 3 间且须 L3 审批；每次升级写入《升级台账》。"
    },
    {
      t: "表 L · 异常事件应急",
      s: "原定下周的大型展会突然取消，过去 48 小时该周 Pickup 落后 45%。",
      q: "按表 L，2 小时内应立即做什么？",
      o: ["降价 15%、全开渠道、启动直销外呼",
          "提价 20%、设 MinLOS 2、关低价渠道",
          "维持价格，等市场回暖",
          "降价 5%，先观察 24 小时"],
      a: 0,
      w: "表 L「需求暴跌」：判定信号为 48h Pickup 落后 >40%（本例 45% 已触发），立即动作 = 降价 15% + 全开渠道 + 启动直销外呼；24 小时内做全员销售动员、上团购产品；事后 7 天出复盘报告。表 L 优先级最高（表 O 第 1 位），覆盖其他所有表的结论。"
    },
    {
      t: "表 O · 冲突仲裁",
      s: "同一目标日：表 A 给出「上调 10%」，同时表 B 要求「关闭低价渠道并控制超售 ≤2 间」。",
      q: "按表 O，先执行哪个？",
      o: ["先执行表 A 的提价，价格优先",
          "先执行表 B 的库存动作，库存安全优先于价格",
          "两个一起执行",
          "都不执行，上报 L3"],
      a: 1,
      w: "表 O 优先级：1 表 L 应急 → 2 表 B 库存 → 3 表 A 价格 → 4 表 C ARI → 5 表 H 渠道 → 6 表 D MPI。库存安全优先于价格，故先做表 B。铁律：同日只执行优先级最高的那一条，其余写入《观察清单》；若最高优先级动作是「维持」，才顺延下一级；所有取舍必须写进《调价台账》备注栏。"
    },
    {
      t: "表 K · 会议综合贡献",
      s: "一个 80 人的公司会议询价：需客房 40 间夜，餐饮保底 ¥35,000，会场租金 ¥20,000。经测算客房置换成本 ¥48,000，预计综合贡献 ¥52,000。",
      q: "按表 K，这笔会议能接吗？",
      o: ["不能，餐饮保底没达到要求",
          "可以，中型会议餐饮保底达标且综合贡献 ≥ 置换成本 ×1.0",
          "不能，必须先算表 G 的比率 R",
          "可以，但必须 L3 审批，因为餐饮毛利率未知"],
      a: 1,
      w: "表 K：80 人属「中型（31–120 人）」，餐饮保底要求 ≥¥30,000（本例 ¥35,000 ✓），接受底线为综合贡献 ≥ 客房置换成本 ×1.0 = ¥48,000（本例 ¥52,000 ✓）→ 可接。决策顺序固定：先问餐饮/宴会承接能力 → 再算综合贡献 → 最后查表 G 客房比率。红线：餐饮毛利率 <55% 的会议须 L3 审批。"
    }
  ];

  var idx = 0, score = 0, answered = 0, locked = false;

  var $ = function (id) { return document.getElementById(id); };

  function render() {
    var L = LEVELS[idx];
    locked = false;
    $("card").style.display = "";
    $("result").style.display = "none";
    $("scTable").textContent = "场景 " + (idx + 1) + " · " + L.t;
    $("scText").textContent = L.s;
    $("qText").textContent = L.q;
    $("fb").innerHTML = "";
    $("nextWrap").style.display = "none";

    var box = $("opts");
    box.innerHTML = "";
    L.o.forEach(function (opt, i) {
      var b = document.createElement("button");
      b.className = "game-opt";
      b.textContent = String.fromCharCode(65 + i) + ". " + opt;
      b.addEventListener("click", function () { pick(i, b); });
      box.appendChild(b);
    });

    $("hudLevel").textContent = (idx + 1) + " / " + LEVELS.length;
    $("barFill").style.width = (idx / LEVELS.length * 100) + "%";
    updateHud();
  }

  function updateHud() {
    $("hudScore").textContent = score;
    $("hudRate").textContent = answered === 0 ? "—" : Math.round(score / (answered * 10) * 100) + "%";
  }

  function pick(i, btn) {
    if (locked) return;
    locked = true;
    answered++;
    var L = LEVELS[idx];
    var btns = $("opts").querySelectorAll(".game-opt");
    for (var k = 0; k < btns.length; k++) btns[k].disabled = true;

    var ok = (i === L.a);
    if (ok) { score += 10; btn.className = "game-opt correct"; }
    else {
      btn.className = "game-opt wrong";
      btns[L.a].className = "game-opt correct";
    }

    $("fb").innerHTML =
      '<div class="game-fb ' + (ok ? "ok" : "no") + '">' +
        "<b>" + (ok ? "✓ 正确" : "✗ 不对") + "</b>" +
        (ok ? "" : "　正确答案：" + String.fromCharCode(65 + L.a)) +
        '<div class="fb-why">' + L.w + "</div>" +
        '<div class="fb-src">依据：《操作法典》' + L.t + "</div>" +
      "</div>";

    $("nextWrap").style.display = "";
    $("btnNext").textContent = (idx === LEVELS.length - 1) ? "查看成绩 →" : "下一关 →";
    updateHud();
  }

  function finish() {
    $("card").style.display = "none";
    $("result").style.display = "";
    $("barFill").style.width = "100%";
    var pct = Math.round(score / (LEVELS.length * 10) * 100);
    $("rScore").textContent = score + " / " + (LEVELS.length * 10);
    var g, adv;
    if (pct >= 90) { g = "S 级 · 可以独立盯店"; adv = "15 张表你已经吃透了。下一步去玩「经营模拟 30 天」，练的是多目标权衡——真实决策从来不是只查一张表。"; }
    else if (pct >= 75) { g = "A 级 · 具备上岗基础"; adv = "主体规则掌握不错，错的那几关建议回到《法典》把对应表格再过一遍，重点记触发阈值。"; }
    else if (pct >= 60) { g = "B 级 · 还需巩固"; adv = "建议按「表 A 价格 → 表 B 库存 → 表 E 超售 → 表 G 团队」的顺序回看《法典》，再回来重刷一遍。"; }
    else { g = "C 级 · 建议先学后练"; adv = "先去学院过一遍 14 个模块和《操作法典》15 张表，把阈值记熟再回来闯关，效率会高很多。"; }
    $("rGrade").textContent = g + "（正确率 " + pct + "%）";
    $("rAdvice").textContent = adv;
  }

  $("btnNext").addEventListener("click", function () {
    if (idx === LEVELS.length - 1) { finish(); return; }
    idx++; render();
  });

  function restart() { idx = 0; score = 0; answered = 0; render(); }
  $("btnRestart").addEventListener("click", restart);
  $("btnAgain").addEventListener("click", restart);

  render();
})();
</script>
</body>
</html>
