<script src="../assets/js/rm-sim.js"></script>
<script>
(function () {
  "use strict";
  var S = window.RMSIM;
  var TOTAL = 6;

  var st, list, idx, log, locked;
  var $ = function (id) { return document.getElementById(id); };

  function renderGauges(delta) {
    var html = "";
    S.GAUGES.forEach(function (g) {
      var v = st[g.k];
      var warn = (v <= 25 || v >= 85) ? " warn" : "";
      var d = delta ? delta[g.k] : 0;
      var dt = "";
      if (d) dt = '<div class="rg-delta' + (d < 0 ? " dn" : "") + '">' + (d > 0 ? "▲ +" : "▼ ") + d + "</div>";
      else dt = '<div class="rg-delta"></div>';
      html += '<div class="rg"><div class="rg-top">' +
                '<span class="rg-name">' + g.full + '</span>' +
                '<span class="rg-val">' + v + '</span>' +
              '</div><div class="rg-bar"><i class="' + warn.trim() + '" style="width:' + v + '%"></i></div>' + dt + '</div>';
    });
    $("panel").innerHTML = html;
  }

  function reset() {
    st = S.newState();
    list = S.shuffled(S.SCENARIOS).slice(0, TOTAL);
    idx = 0; log = []; locked = false;
    $("card").style.display = "";
    $("endCard").style.display = "none";
    renderGauges();
    show();
  }

  function show() {
    var sc = list[idx];
    locked = false;
    $("hudN").textContent = (idx + 1) + " / " + TOTAL;
    $("hudDone").textContent = idx;
    $("scTime").textContent = sc.time + " · " + sc.title;
    $("scTitle").textContent = sc.title;
    $("scText").textContent = sc.text;
    $("conBox").innerHTML = "";

    var box = $("opts");
    box.innerHTML = "";
    sc.opts.forEach(function (o, i) {
      var b = document.createElement("button");
      b.className = "sc-opt";
      b.textContent = o.t;
      b.addEventListener("click", function () { pick(i, b); });
      box.appendChild(b);
    });
  }

  function pick(i, btn) {
    if (locked) return;
    locked = true;
    var sc = list[idx];
    var o = sc.opts[i];

    var btns = $("opts").querySelectorAll(".sc-opt");
    for (var k = 0; k < btns.length; k++) btns[k].disabled = true;
    btn.classList.add("picked");

    S.apply(st, o.fx);
    renderGauges(o.fx);
    log.push({ sc: sc, opt: o });

    $("conBox").innerHTML =
      '<div class="sc-con"><div class="cl">后果</div>' + o.con + "</div>" +
      '<div class="sc-next"><button class="cm-btn cm-btn-primary" id="btnGo">' +
      (idx === TOTAL - 1 ? "下班，看复盘 →" : "继续 →") + "</button></div>";
    $("btnGo").addEventListener("click", function () {
      if (idx === TOTAL - 1) { finish(); return; }
      idx++; show();
    });

    var ov = S.over(st);
    if (ov.done) {
      $("btnGo").textContent = "看看发生了什么 →";
    }
  }

  function finish() {
    $("card").style.display = "none";
    $("endCard").style.display = "";
    $("hudDone").textContent = TOTAL;

    var avg = (st.rev + st.guest + st.owner + st.team) / 4;
    var mn = Math.min(st.rev, st.guest, st.owner, st.team);
    var g, t;
    if (mn <= 0) { g = "D"; t = "出事了 —— " + worstName() + "彻底崩了"; }
    else if (avg >= 70) { g = "S"; t = "漂亮的一天 —— 四项都稳住了"; }
    else if (avg >= 60) { g = "A"; t = "合格的一天 —— 没什么大错"; }
    else if (avg >= 50) { g = "B"; t = "勉强过关 —— 有几个决策代价不小"; }
    else { g = "C"; t = "有点惨 —— 今天得罪了不少人"; }
    $("eGrade").textContent = g;
    $("eTitle").textContent = t;

    var html = "";
    log.forEach(function (r, i) {
      html += '<div class="rv-item">' +
        "<h5>" + (i + 1) + ". " + r.sc.title + "</h5>" +
        "<p><b>你选了：</b>" + r.opt.t + "</p>" +
        "<p>" + r.opt.con + "</p>" +
        '<div class="rv-c">《法典》依据：' + r.sc.codex + "</div>" +
        "</div>";
    });
    $("review").innerHTML = html;
  }

  function worstName() {
    var worst = S.GAUGES[0];
    S.GAUGES.forEach(function (g) { if (st[g.k] < st[worst.k]) worst = g; });
    return worst.full;
  }

  $("btnReset").addEventListener("click", reset);
  $("btnAgain").addEventListener("click", reset);
  reset();
})();
</script>
