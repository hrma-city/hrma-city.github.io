<script src="../assets/js/app.js"></script>
<script src="../assets/js/rm-sim.js"></script>
<script>
(function () {
  "use strict";
  var S = window.RMSIM;
  var $ = function (id) { return document.getElementById(id); };

  var st, cur, n, locked, best = 0;
  try { best = parseInt(localStorage.getItem("hrma_reigns_best") || "0", 10) || 0; } catch (e) {}
  $("hudBest").textContent = best;

  function renderGauges(delta) {
    var html = "";
    S.GAUGES.forEach(function (g) {
      var v = st[g.k];
      var warn = (v <= 25 || v >= 85) ? " warn" : "";
      var d = delta ? delta[g.k] : 0;
      var dt = d ? '<div class="rg-delta' + (d < 0 ? " dn" : "") + '">' + (d > 0 ? "▲ +" : "▼ ") + d + "</div>"
                  : '<div class="rg-delta"></div>';
      html += '<div class="rg"><div class="rg-top">' +
                '<span class="rg-name">' + g.full + '</span>' +
                '<span class="rg-val">' + v + '</span>' +
              '</div><div class="rg-bar"><i class="' + warn.trim() + '" style="width:' + v + '%"></i></div>' + dt + '</div>';
    });
    $("panel").innerHTML = html;
  }

  function reset() {
    st = S.newState();
    n = 0; locked = false;
    $("card").style.display = "";
    $("opts").style.display = "";
    $("endCard").style.display = "none";
    $("hudN").textContent = "0";
    renderGauges();
    next();
  }

  function next() {
    cur = S.SCENARIOS[Math.floor(Math.random() * S.SCENARIOS.length)];
    var card = $("card");
    card.className = "rg-card";
    $("cWho").textContent = cur.time + " · " + cur.title;
    $("cSay").textContent = cur.text;

    var box = $("opts");
    box.innerHTML = "";
    cur.opts.forEach(function (o, i) {
      var b = document.createElement("button");
      b.textContent = o.t;
      b.addEventListener("click", function () { pick(i); });
      box.appendChild(b);
    });
    locked = false;
  }

  function flash(msg, bad) {
    var f = $("flash");
    f.className = "rg-flash " + (bad ? "no" : "ok");
    f.textContent = msg;
    f.classList.add("on");
    setTimeout(function () { f.classList.remove("on"); }, 3200);
  }

  function pick(i) {
    if (locked) return;
    locked = true;
    var o = cur.opts[i];
    S.apply(st, o.fx);
    renderGauges(o.fx);
    n++;
    $("hudN").textContent = n;

    var bad = (o.fx.rev < 0 || o.fx.guest < 0 || o.fx.owner < 0 || o.fx.team < 0);
    flash(o.con, bad);

    var card = $("card");
    card.className = "rg-card " + (i === 0 ? "out-l" : (i === cur.opts.length - 1 ? "out-r" : "out-r"));

    setTimeout(function () {
      var ov = S.over(st);
      if (ov.done) { gameOver(ov); return; }
      if (n > best) {
        best = n;
        try { localStorage.setItem("hrma_reigns_best", String(best)); } catch (e) {}
        $("hudBest").textContent = best;
      }
      next();
    }, 620);
  }

  function gameOver(ov) {
    $("card").style.display = "none";
    $("opts").style.display = "none";
    $("endCard").style.display = "";
    $("eN").textContent = n + " 件";

    var g = ov.g, why;
    if (ov.why === "bottom") why = "「" + g.full + "」见底了 —— " + g.bad + "到了不可收拾的地步";
    else why = "「" + g.full + "」爆表了 —— 走极端同样是失控";
    $("eWhy").textContent = why;

    var tip;
    if (g.k === "rev") tip = "收益是底线。一次降价可以救量，但连续让价会让所有人都习惯你的低价——包括你自己的团队。";
    else if (g.k === "guest") tip = "客人是最长的账。今天的差评会在未来半年里持续影响你的 Pickup，而省下的那点房费一次就花完了。";
    else if (g.k === "owner") tip = "业主要的是可解释的结果，不是奇迹。把《法典》表 O 的优先级发给他，比硬冲一个数字更管用。";
    else tip = "前厅、销售、餐饮是你能拿到数的唯一来源。得罪他们，你就成了瞎子——再准的表也没用。";
    $("eTip").textContent = tip;
  }

  $("btnReset").addEventListener("click", reset);
  $("btnAgain").addEventListener("click", reset);
  reset();
})();
</script>
