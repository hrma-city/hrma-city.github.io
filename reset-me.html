<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>验证</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<style>
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(160deg,#0f2a4a 0%,#163a63 55%,#1d6fb8 100%);
        font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
        color:#fff; padding:24px; }
  .card{ width:100%; max-width:380px; background:#fff; border-radius:14px;
         box-shadow:0 20px 60px rgba(0,0,0,.28); padding:32px 28px 28px; }
  label{ display:block; font-size:14px; color:#1a2733; margin-bottom:8px; font-weight:600; }
  input{ width:100%; padding:12px 14px; font-size:15px; border:1px solid #d6dde6;
         border-radius:8px; outline:none; margin-bottom:16px; }
  button{ width:100%; padding:12px; font-size:15px; font-weight:700;
          background:#e8b84b; color:#0f2a4a; border:1px solid #e8b84b;
          border-radius:8px; cursor:pointer; }
  .msg{ min-height:18px; margin-top:4px; font-size:13px; }
  .msg.ok{ color:#1a7f4b; } .msg.bad{ color:#c0392b; }
</style>
</head>
<body>
<div class="card">
  <label for="rc">恢复码</label>
  <input id="rc" type="password" autocomplete="off">
  <label for="np">新密码</label>
  <input id="np" type="password" autocomplete="new-password">
  <label for="np2">再输入一次</label>
  <input id="np2" type="password" autocomplete="new-password">
  <button id="btn">确认</button>
  <div id="msg" class="msg"></div>
</div>
<script src="auth-config.js?v=fix20261013c"></script>
<script src="assets/js/rc-hash.js?v=fix20261013c"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var msg=$('msg');
  function say(t,k){msg.textContent=t||'';msg.className='msg'+(k?' '+k:'');}
  function sha256Hex(str){
    if(window.crypto&&window.crypto.subtle&&window.TextEncoder){
      return window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(str))
        .then(function(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){
          return ('0'+b.toString(16)).slice(-2);}).join('');});
    }
    var h=5381,s='hrma$3$'+str;
    for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}
    return Promise.resolve('fb$'+h.toString(16)+'.'+s.length);
  }
  var ADMIN='3984557428@qq.com';
  var KEY_USERS='hrma_users_local', KEY_SESSION='hrma_session_v2', KEY_RC='hrma_rc_hash';
  function normRC(s){
    s=String(s||'');
    try{
      s=s.replace(/[\uff01-\uff5e]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xfee0);});
    }catch(e){}
    s=s.replace(/[\s\u00a0\ufeff\r\n\t]/g,'');
    s=s.replace(/^(恢复码|管理员恢复码|recovery\s*code?)[\s:：=、]*/i,'');
    return s.toUpperCase();
  }
  $('btn').addEventListener('click',function(){
    var rc=normRC($('rc').value), np=$('np').value, np2=$('np2').value;
    if(!rc||!np){ say('请填写完整。','bad'); return; }
    if(np.length<8){ say('新密码至少 8 位。','bad'); return; }
    if(np!==np2){ say('两次输入不一致。','bad'); return; }
    $('btn').disabled=true;
    var rcHash;
    try{ rcHash=localStorage.getItem(KEY_RC); }catch(e){}
    if(!rcHash){ say('校验未通过。','bad'); $('btn').disabled=false; return; }
    Promise.all([sha256Hex('hrma-rc|'+rc), sha256Hex(np)])
      .then(function(r){
        if(r[0]!==rcHash){ say('校验未通过。','bad'); $('btn').disabled=false; return; }
        var db;
        try{db=JSON.parse(localStorage.getItem(KEY_USERS)||'null');}catch(e){}
        if(!db||typeof db!=='object'||Array.isArray(db)){db={users:[],approved:[]};}
        if(!Array.isArray(db.users))db.users=[];
        var u=db.users.filter(function(x){return x.email===ADMIN;})[0];
        if(!u){u={email:ADMIN,name:'站长',status:'approved'};db.users.push(u);}
        u.pw=r[1]; try{delete u.password;}catch(e){}
        if(!Array.isArray(db.approved))db.approved=[];
        if(db.approved.indexOf(ADMIN)<0)db.approved.push(ADMIN);
        localStorage.setItem(KEY_USERS,JSON.stringify(db));
        try{
          localStorage.setItem(KEY_SESSION, JSON.stringify({
            email:ADMIN, name:'站长', status:'approved',
            pwRef:r[1], issuedAt:new Date().toISOString(), autoIssued:true
          }));
        }catch(e){}
        say('已更新，正在进入…','ok');
        setTimeout(function(){ location.replace('index.html'); }, 900);
      })
      .catch(function(){ say('操作失败，请重试。','bad'); $('btn').disabled=false; });
  });
})();
</script>
</body>
</html>
