<script>
/* ============================================================
   在线学习页：正文与题目都取自 textbook.html 本体
   ——教材改一次，这里自动跟着改，不会出现两套内容。
   ============================================================ */
var PARTS=[
  ['开篇',[0]],
  ['第一篇 · 认知篇',[1,2,3,4]],
  ['第二篇 · 决策篇 · A 定价',[5,6,7,8]],
  ['第二篇 · 决策篇 · B 库存',[9,10,11,12]],
  ['第二篇 · 决策篇 · C 客源与渠道',[13,14,15,16]],
  ['第三篇 · 运营篇 · D 节奏与流程',[17,18,19]],
  ['第三篇 · 运营篇 · E 计划与支撑',[20,21,22,23,24]],
  ['第四篇 · 组织篇',[25,26,27,28]],
  ['第五篇 · 延伸篇',[29,30,31,32]]
];
var KEY_L='hrma_learn_v1';      /* 本站自己的学习记录 */
var KEY_P='hrma_path_done_v1';  /* 与学习路径页共用的「已完成」名单 */
var CH={}, ORDER=[], cur=1, view='learn';

function ls(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function ss(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function myState(){ return ls(KEY_L,{read:[],score:{}}); }
function setState(s){ ss(KEY_L,s); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stripTags(s){ return String(s||'').replace(/<[^>]+>/g,''); }
function pad2(n){ return (n<10?'0':'')+n; }

/* ---------- 1. 载入教材，抽出每章结构 ---------- */
function loadBook(){
  return fetch('textbook.html?x='+Date.now()).then(function(r){ return r.text(); }).then(function(t){
    var doc=new DOMParser().parseFromString(t,'text/html');
    var hs=[].slice.call(doc.querySelectorAll('h2.ch[id^=ch]'));
    hs.forEach(function(h,i){
      var no=parseInt(h.id.replace('ch',''),10);
      /* 逐个兄弟节点收集，直到下一章 h2 —— 保留教材原有的小节结构 */
      var buf=[], n=h.nextElementSibling;
      while(n && !(n.tagName==='H2')){ buf.push(n.outerHTML); n=n.nextElementSibling; }
      var wrap=doc.createElement('div'); wrap.innerHTML=buf.join('');
      CH[no]={no:no, title:stripTags(h.textContent).replace(/^第\s*\d+\s*章/,'').trim(), el:wrap};
      ORDER.push(no);
    });
    /* 开篇：教材正文开头（两张图 + 学法说明），没有单独锚点，单独存 */
    var first=doc.querySelector('#ch01'), pre=doc.createElement('div'), k=first;
    while(k){ if(k.tagName==='H1'||k.tagName==='H2') break; pre.appendChild(k.cloneNode(true)); k=k.previousElementSibling; }
    CH[0]={no:0,title:'开篇：先看全貌，再学细节',el:pre};
    ORDER.unshift(0);
  });
}

/* ---------- 2. 本章学习卡 ---------- */
function block(title, inner, cls){
  return inner? '<div class="blk"><div class="bt">'+esc(title)+'</div>'+inner+'</div>' : '';
}
function renderLearn(n){
  var c=CH[n], st=myState(), isRead=st.read.indexOf(n)>=0;
  var el=c.el;
  var h='<div class="card"><h2>'+(n===0?'开篇':'第 '+n+' 章')+'　'+esc(c.title)+'</h2>';
  var p=el.querySelector('.promise');
  if(p) h+='<div class="goal">学完这章您要能做到：'+esc(stripTags(p.textContent).replace(/^读完这章您能|^读完本章您能/,''))+'</div>';
  h+=block('本章要点', el.querySelectorAll('.pts').length? ptsHtml(el):'');
  var f=el.querySelectorAll('.fml'); if(f.length){
    var fh=''; [].forEach.call(f,function(x){ fh+='<div style="margin-bottom:8px"><b style="color:var(--navy)">'
      +esc(stripTags(x.querySelector('.fn')?x.querySelector('.fn').textContent:''))+'</b>'
      +'<div class="fml">'+esc(x.querySelector('.fe')?x.querySelector('.fe').textContent:'')+'</div></div>'; });
    h+=block('核心公式与算例', fh);
  }
  var j=el.querySelector('.judge');
  if(j){
    var tb=j.querySelector('table'), th='';
    if(tb) th='<table>'+[].slice.call(tb.querySelectorAll('tr')).map(function(tr){
      return '<tr>'+[].slice.call(tr.children).map(function(td){ return '<td>'+td.innerHTML+'</td>'; }).join('')+'</tr>';
    }).join('')+'</table>';
    h+=block('本章判定表（拿去做判断用这张）', th);
  }
  var cs=el.querySelectorAll('.case');
  if(cs.length){
    var ch2=''; [].forEach.call(cs,function(x){
      ch2+='<details><summary>'+esc(stripTags(x.querySelector('.ct')?x.querySelector('.ct').textContent:'案例'))+'</summary>'
        +'<div class="story">'+x.innerHTML.replace(/<div class="ct">[\s\S]*?<\/div>/,'')+'</div></details>'; });
    h+=block('案例（点开看结论）', ch2);
  }
  var tp=el.querySelector('.tip');
  if(tp) h+='<div class="tip">'+tp.innerHTML+'</div>';
  var ex=el.querySelector('.ex[id^=ex]');
  if(ex){
    h+='<div class="blk"><div class="bt">教材原练习（动笔算一遍）</div>'
      +'<div class="story">'+ex.innerHTML+'</div>'
      +'<div class="hint" style="margin-top:6px">答案在教材附录 B：<a href="textbook.html#appB" target="_blank">打开附录 B</a></div></div>';
  }
  h+='<div class="act">'
    +'<a class="btn ghost" href="textbook.html#'+(n===0?'ch01':'ch'+pad2(n))+'" target="_blank">在教材里翻这一章</a>'
    +'<button class="btn'+(isRead?'':' gold')+'" id="markRead" data-n="'+n+'">'
    +(isRead?'✓ 本章已学完（点击撤销）':'我学完了，标记本章')+'</button>'
    +'<span class="hint">学完标记会同步到学习路径页</span></div></div>';

  /* 本章速测 */
  h+='<div class="card"><h2>本章速测</h2><div class="hint" style="margin-bottom:8px">'
    +'题目全部来自本章正文（要点、判定表、公式、案例），每题都有原文出处。</div>'
    +'<div id="qBox"></div><div class="act"><button class="btn" id="doQuiz">开始本章速测（5 题）</button>'
    +'<span id="qzScore"></span></div></div>';

  /* 上下章 */
  var i=ORDER.indexOf(n), prev=ORDER[i-1], nx=ORDER[i+1];
  h+='<div class="pager">'
    +(prev!=null?'<button class="btn ghost" data-go="'+prev+'">← '+(prev===0?'开篇':'第 '+prev+' 章')+'</button>':'<span></span>')
    +(nx!=null?'<button class="btn" data-go="'+nx+'">'+(nx===0?'开篇':'第 '+nx+' 章')+' →</button>':'<a class="btn gold" id="toFinal">去综合自测 →</a>')
    +'</div>';
  document.getElementById('main').innerHTML=h;
  bindLearn(n);
}

function ptsHtml(el){
  /* 教材里每个要点组前面都有 <h4>（三要点 / 常见错误 / 与前后章的联系…），
     丢掉它就会把要点、易错、章节联系混成一坨。这里按原顺序还原小标题。 */
  var h='';
  [].forEach.call(el.children,function(n){
    if(n.tagName==='H4'){ h+='<div class="subt">'+esc(n.textContent.trim())+'</div>'; return; }
    if(String(n.className).indexOf('pts')<0) return;
    h+='<ul>';
    [].forEach.call(n.querySelectorAll('li'),function(li){
      /* 教材里「——例：」那一批是例句（有独立的例句块），不混进要点列表 */
      var t=li.innerHTML, txt=stripTags(t).trim();
      if(/^例[：:]/.test(txt)) return;
      h+='<li>'+t+'</li>';
    });
    h+='</ul>';
  });
  return h;
}

function bindLearn(n){
  var m=document.getElementById('markRead');
  if(m) m.addEventListener('click',function(){
    var st=myState(), i=st.read.indexOf(n);
    if(i>=0) st.read.splice(i,1); else st.read.push(n);
    setState(st); syncPath();
    renderLearn(n); renderNav(); renderProg();
  });
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click',function(){ go(+b.getAttribute('data-go')); });
  });
  var f=document.getElementById('toFinal');
  if(f) f.addEventListener('click',function(){ view='final'; renderFinal(); setTab('tQuiz'); });
  var q=document.getElementById('doQuiz');
  if(q) q.addEventListener('click',function(){ runChapterQuiz(n); });
}

/* ---------- 3. 题目运行器（章节速测 / 综合自测共用） ---------- */
var QZ=window.HRMA_QUIZ||[];
/* 题库里的 ch 是形如 "02" 的字符串（与教材锚点一致），而页面里章号是数字 1–32。
   必须按数值比：按字符串比 "02" ≠ "2"，抽题永远是空的。 */
function byCh(n){ var k=parseInt(n,10); return QZ.filter(function(q){ return parseInt(q.ch,10)===k; }); }

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function runChapterQuiz(n){
  var pool=byCh(n);
  if(!pool.length){ document.getElementById('qBox').innerHTML='<div class="hint">本章暂无客观题，请做上面的教材原练习。</div>'; return; }
  var qs=shuffle(pool).slice(0,Math.min(5,pool.length));
  mountQuiz(qs, '第 '+n+' 章速测', function(sc,total){
    var st=myState(); st.score['c'+n]={got:sc,total:total,at:Date.now()}; setState(st); renderProg();
  });
  document.getElementById('qBox').scrollIntoView({behavior:'smooth',block:'start'});
}

/* 综合自测：每章均匀抽题，40 题 */
function buildFinal(){
  var out=[], per={};
  ORDER.filter(function(n){ return n>0; }).forEach(function(n){ per[n]=byCh(n); });
  var ns=Object.keys(per);
  var round=0;
  while(out.length<40 && round<8){
    ns.forEach(function(n){
      if(out.length>=40) return;
      var p=per[n];
      if(p.length>round) out.push(p[round]);
    });
    round++;
  }
  return shuffle(out).slice(0,40);
}

function renderFinal(){
  var st=myState();
  var last=ls('hrma_final_v1',null);
  var h='<div class="card"><h2>综合自测（40 题）</h2>'
    +'<div class="tipbox">从五篇三十二章里每章均匀抽题，覆盖要点定义、判定表、核心公式与案例结论。'
    +'60 分及格。不限次，随便练。</div>';
  if(last){
    h+='<div class="hint" style="margin-bottom:10px">上次成绩：<b>'+last.got+' / '+last.total+'</b>（'+esc(last.at)+'）</div>';
  }
  h+='<div id="qBox"></div><div class="act">'
    +'<button class="btn" id="btnFinal">开始综合自测</button>'
    +'<button class="btn ghost" id="btnFinalWrong">只做上次做错的</button>'
    +'<span id="qzScore"></span></div></div>';
  document.getElementById('main').innerHTML=h;
  document.getElementById('btnFinal').addEventListener('click',function(){
    mountQuiz(buildFinal(),'综合自测',function(sc,total,qs,picked){
      ss('hrma_final_v1',{got:sc,total:total,at:new Date().toLocaleString('zh-CN')});
      ss('hrma_final_wrong_v1', qs.filter(function(q,i){ return picked[i]!==q.ans; }).map(function(q){return q.id;}));
    });
  });
  document.getElementById('btnFinalWrong').addEventListener('click',function(){
    var ids=ls('hrma_final_wrong_v1',[]);
    var qs=QZ.filter(function(q){ return ids.indexOf(q.id)>=0; });
    if(!qs.length){ alert('还没有错题记录——先做一次综合自测。'); return; }
    mountQuiz(shuffle(qs),'错题重做（'+qs.length+' 题）',null);
  });
}

/* 通用答题器：逐题作答，即时判分，给原文出处 */
function mountQuiz(qs, title, onDone){
  var box=document.getElementById('qBox'), picked=[];
  var h='<div class="blk"><div class="bt">'+esc(title)+'　共 '+qs.length+' 题</div></div>';
  box.innerHTML=h;
  qs.forEach(function(q,i){
    var d=document.createElement('div'); d.className='q';
    d.innerHTML='<div class="stem"><span class="qn">'+(i+1)+'.</span>'+esc(q.stem)+'</div>'
      +'<div class="opts">'+q.opts.map(function(o,j){
          return '<div class="opt" data-j="'+j+'"><span class="k">'+'ABCD'[j]+'</span><span>'+esc(o)+'</span></div>';
        }).join('')+'</div><div class="exp" style="display:none">出处：'+esc(q.exp||'')+'</div>';
    box.appendChild(d);
    d.querySelectorAll('.opt').forEach(function(el){
      el.addEventListener('click',function(){
        if(d.dataset.ok) return;
        d.dataset.ok='1'; picked[i]=q.opts[+el.getAttribute('data-j')];
        d.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('pick'); });
        el.classList.add(picked[i]===q.ans?'right':'wrong');
        d.querySelector('.exp').style.display='block';
        if(picked[i]!==q.ans){
          d.querySelectorAll('.opt').forEach(function(x){
            if(x.textContent.replace(/^[A-D]/,'').trim()===q.ans) x.classList.add('right');
          });
        }
        upd();
      });
    });
  });
  var sc=document.createElement('div'); sc.className='act'; sc.id='qzBar';
  box.appendChild(sc);
  function upd(){
    var answered=picked.filter(function(x){ return x!=null; }).length;
    var got=picked.filter(function(x,i){ return x!=null && x===qs[i].ans; }).length;
    var done=answered===qs.length;
    sc.innerHTML='<span class="score '+(done?(got>=qs.length*0.6?'p':'f'):'')+'">'
      +'已答 '+answered+' / '+qs.length+(done?'　得分 '+got+' / '+qs.length:'')+'</span>';
    if(done && onDone) onDone(got,qs.length,qs,picked);
  }
  upd();
}

/* ---------- 4. 判定表全集（站内可查，不必翻教材） ---------- */
function renderJudge(){
  var h='<div class="card"><h2>判定表全集</h2>'
    +'<div class="tipbox">全书 32 张「本章判定表」汇总在这里：遇到判断题，先查表、按表判，不靠感觉。'
    +'每张表都来自对应章节的正文，判完可以回本章看案例。</div>'
    +'<div class="act"><input id="jSearch" placeholder="输入关键词筛选，如 降价 / 净价 / 保护位" '
    +'style="flex:1;min-width:220px;padding:8px 12px;border:1px solid #dfe6ef;border-radius:8px"></div>'
    +'<div id="jBox"></div></div>';
  document.getElementById('main').innerHTML=h;
  var all=[];
  ORDER.filter(function(n){ return n>0; }).forEach(function(n){
    var j=CH[n] && CH[n].el.querySelector('.judge');
    if(!j) return;
    var t=j.querySelector('table');
    all.push({n:n, title:stripTags(j.querySelector('.jt')?j.querySelector('.jt').textContent:'第 '+n+' 章判定表'),
              html:t?t.outerHTML:'（本章判定表为列表形式，见教材）'});
  });
  function draw(kw){
    kw=(kw||'').trim();
    var list=all.filter(function(x){
      return !kw || x.title.indexOf(kw)>=0 || stripTags(x.html).indexOf(kw)>=0;
    });
    document.getElementById('jBox').innerHTML = list.length? list.map(function(x){
      return '<details class="jcard" open><summary>第 '+x.n+' 章 · '+esc(x.title)+'</summary>'
        +'<div>'+x.html+'</div>'
        +'<div class="hint" style="margin-top:6px"><a href="#" data-goto="'+x.n+'">回第 '+x.n+' 章 →</a></div></details>';
    }).join('') : '<div class="hint">没有匹配的判定表。</div>';
    document.getElementById('jBox').querySelectorAll('[data-goto]').forEach(function(a){
      a.addEventListener('click',function(e){ e.preventDefault(); go(+a.getAttribute('data-goto')); });
    });
  }
  draw('');
  document.getElementById('jSearch').addEventListener('input',function(){ draw(this.value); });
}

/* ---------- 5. 学习记录 ---------- */
function renderStat(){
  var st=myState();
  var rows=ORDER.map(function(n){
    var s=st.score['c'+n], read=st.read.indexOf(n)>=0;
    return '<tr><td>'+(n===0?'开篇':'第 '+n+' 章')+'</td><td>'+esc(CH[n]?CH[n].title:'')+'</td>'
      +'<td>'+(read?'已学完':'未学')+'</td><td>'+(s?(s.got+' / '+s.total):'—')+'</td></tr>';
  }).join('');
  var last=ls('hrma_final_v1',null);
  document.getElementById('main').innerHTML='<div class="card"><h2>学习记录</h2>'
    +'<div class="tipbox">已学完 <b>'+st.read.length+' / 32</b> 章。综合自测：<b>'
    +(last?(last.got+' / '+last.total):'未参加')+'</b>。记录存在本机浏览器里，换设备不同步。</div>'
    +'<table><tr><td>章</td><td>标题</td><td>学习</td><td>速测</td></tr>'+rows+'</table>'
    +'<div class="act"><button class="btn ghost" id="clr">清空学习记录</button>'
    +'<a class="btn ghost" href="textbook.html" target="_blank">打开教材（翻阅用）</a></div></div>';
  document.getElementById('clr').addEventListener('click',function(){
    if(confirm('清空本章页的学习与测验记录？（学习路径页的完成标记会一起清）')){
      setState({read:[],score:{}}); syncPath(); renderStat(); renderProg();
    }
  });
}

/* ---------- 5. 侧栏 / 进度 / 与学习路径页互通 ---------- */
function renderNav(){
  var h='', st=myState();
  PARTS.forEach(function(p){
    h+='<h4>'+esc(p[0])+'</h4>';
    p[1].forEach(function(n){
      var c=CH[n]; if(!c) return;
      var read=st.read.indexOf(n)>=0, s=st.score['c'+n];
      h+='<a class="ch'+(cur===n?' on':'')+(read?' read':'')+'" data-goto="'+n+'">'
        +'<span class="n">'+(n===0?'开':n)+'</span><span>'+esc(c.title)+'</span>'
        +(s?'<span class="dot">'+s.got+'✓</span>':'')+'</a>';
    });
  });
  var nav=document.getElementById('nav'); nav.innerHTML=h;
  nav.querySelectorAll('[data-goto]').forEach(function(a){
    a.addEventListener('click',function(e){ e.preventDefault(); go(+a.getAttribute('data-goto')); });
  });
}
function renderProg(){
  var st=myState(), n=st.read.filter(function(x){ return x>0; }).length;
  document.getElementById('pgTxt').textContent=n+' / 32';
  document.getElementById('pgBar').style.width=(n/32*100)+'%';
}
/* 学完的章写进学习路径页共用的完成名单，两边进度一致 */
function syncPath(){
  var st=myState(), done=ls(KEY_P,[]);
  ORDER.forEach(function(n){
    var key='C'+n, i=done.indexOf(key), learned=st.read.indexOf(n)>=0;
    if(learned && i<0) done.push(key);
    if(!learned && i>=0) done.splice(i,1);
  });
  ss(KEY_P,done);
}
function go(n){ cur=n; view='learn'; setTab('tLearn'); renderNav(); renderLearn(n); window.scrollTo({top:0}); }
function setTab(id){
  ['tLearn','tQuiz','tJudge','tStat'].forEach(function(x){
    var el=document.getElementById(x); if(el) el.classList.toggle('on', x===id);
  });
}

/* ---------- 启动 ---------- */
document.getElementById('tLearn').addEventListener('click',function(){ setTab('tLearn'); go(cur); });
document.getElementById('tQuiz').addEventListener('click',function(){ setTab('tQuiz'); renderFinal(); window.scrollTo({top:0}); });
document.getElementById('tJudge').addEventListener('click',function(){ setTab('tJudge'); renderJudge(); window.scrollTo({top:0}); });
document.getElementById('tStat').addEventListener('click',function(){ setTab('tStat'); renderStat(); window.scrollTo({top:0}); });

/* 深链：#ch5 打开第 5 章；#ch5q 打开并直接进速测；#final 综合自测；#appA 判定表全集 */
function applyHash(){
  var h=location.hash||'';
  if(h.indexOf('#final')===0){
    setTab('tQuiz'); renderFinal();
    var b=document.getElementById('btnFinal'); if(b) b.click();   /* 深链进来直接开考，别让用户再点一次 */
    return true;
  }
  if(h.indexOf('#app')===0){ setTab('tJudge'); renderJudge(); return true; }
  var m=h.match(/^#ch(\d+)(q?)$/);
  if(m){
    var n=parseInt(m[1],10);
    if(!CH[n]) return false;
    go(n);
    if(m[2]==='q'){ var b=document.getElementById('doQuiz'); if(b) b.click(); }
    return true;
  }
  return false;
}
window.addEventListener('hashchange', function(){ if(CH[parseInt((location.hash||'').replace(/\D/g,''),10)||0]) applyHash(); });

loadBook().then(function(){
  var st=myState();
  if(!applyHash()){
    /* 没带深链：接着上次学的往下学一章，不每次都回到第 1 章 */
    cur=st.read.length? Math.min.apply(null,st.read.filter(function(x){return x>0;}))+1 : 1;
    if(!CH[cur]) cur=1;
    renderNav(); renderProg(); renderLearn(cur);
  }
  syncPath();
}).catch(function(e){
  document.getElementById('main').innerHTML='<div class="card"><h2>载入失败</h2>'
    +'<p>没能读到教材正文（'+esc(e.message)+'）。请刷新重试，或直接 <a href="textbook.html">打开教材</a>。</p></div>';
});
</script>
