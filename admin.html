<main class="adm-wrap">
  <div class="adm-head">
    <h1>账号审批后台</h1>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var A = window.HRMAAuth;
  var listEl = document.getElementById("list");
  var msg = document.getElementById("msg");
  var curSt = "pending";

  function show(text, kind) {
    msg.className = "msg show " + (kind || "err");
    msg.innerHTML = text;
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function fmt(t) {
    if (!t) return "—";
    try { return new Date(t).toLocaleString("zh-CN", { hour12: false }); }
    catch (e) { return String(t); }
  }
  function stPill(st) {
    return '<span class="pill-s ' + (st || "") + '">' +
      ({ pending: "待审核", approved: "已通过", rejected: "已拒绝" }[st] || st || "未知") + "</span>";
  }

  function rowHTML(u) {
    var meta = [
      "邮箱：" + esc(u.email),
      "单位：" + esc(u.org || "—"),
      "职位：" + esc(u.role_text || "—"),
      "手机：" + esc(u.phone || "—"),
      "申请：" + fmt(u.created_at)
    ].join("　|　");
    var reason = u.reason ? '<div class="ar-reason">申请理由：' + esc(u.reason) + "</div>" : "";
    var rev = (u.reviewed_at ? '<div class="ar-reason">审核：' + fmt(u.reviewed_at) +
      (u.reviewed_by ? " · " + esc(u.reviewed_by) : "") +
      (u.note ? " · 备注：" + esc(u.note) : "") + "</div>" : "");

    var act = "";
    if (u.status === "pending") {
      act = '<button class="btn-sm btn-ok" data-act="approve" data-id="' + u.id + '">通过</button>' +
            '<button class="btn-sm btn-no" data-act="reject" data-id="' + u.id + '">驳回</button>';
    } else if (u.status === "rejected") {
      act = '<button class="btn-sm btn-ok" data-act="approve" data-id="' + u.id + '">改为通过</button>';
    } else if (u.status === "approved") {
      act = '<button class="btn-sm btn-no" data-act="reject" data-id="' + u.id + '">改为驳回</button>';
    }

    return '<div class="adm-row">' +
      '<div class="ar-main">' +
        '<div class="ar-name">' + esc(u.full_name || "（未填姓名）") + " " + stPill(u.status) + "</div>" +
        '<div class="ar-meta">' + meta + "</div>" +
        reason + rev +
      "</div>" +
      '<div class="ar-act">' + act + "</div>" +
    "</div>";
  }

  async function load(st) {
    curSt = st || curSt;
    listEl.innerHTML = '<div class="adm-empty">加载中…</div>';
    try {
      var rows = await A.adminList(curSt);
      // 计数
      var all = await A.adminList("all");
      document.getElementById("c-pending").textContent = all.filter(function (x) { return x.status === "pending"; }).length;
      document.getElementById("c-approved").textContent = all.filter(function (x) { return x.status === "approved"; }).length;
      document.getElementById("c-rejected").textContent = all.filter(function (x) { return x.status === "rejected"; }).length;

      if (!rows.length) {
        listEl.innerHTML = '<div class="adm-empty">' +
          (curSt === "pending" ? "暂无待审核申请 🎉" : "该分类下暂无记录。") + "</div>";
        return;
      }
      listEl.innerHTML = rows.map(rowHTML).join("");
    } catch (err) {
      listEl.innerHTML = "";
      show("加载失败：" + ((err && err.message) || err), "err");
    }
  }

  // 事件委托：通过 / 驳回
  listEl.addEventListener("click", async function (e) {
    var btn = e.target.closest("button[data-act]");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    var act = btn.getAttribute("data-act");
    var note = "";
    if (act === "reject") {
      note = window.prompt("驳回理由（会随邮件告知用户，可留空）：", "") || "";
      if (note === null) return; // 取消
    }
    btn.disabled = true;
    try {
      await A.adminSetStatus(id, act === "approve" ? "approved" : "rejected", note);
      show((act === "approve" ? "已通过。" : "已驳回。") + "列表已刷新。", "ok");
      await load(curSt);
    } catch (err) {
      show("操作失败：" + ((err && err.message) || err), "err");
      btn.disabled = false;
    }
  });

  // tab 切换
  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".adm-tab");
    if (!b) return;
    Array.prototype.forEach.call(this.querySelectorAll(".adm-tab"), function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    load(b.getAttribute("data-st"));
  });

  document.getElementById("refresh").addEventListener("click", function (e) {
    e.preventDefault();
    load(curSt);
  });

  // 启动：自身校验（auth.js 的守卫也会拦截非管理员）
  (async function () {
    if (!A || !A.configured()) {
      listEl.innerHTML = "";
      show("鉴权未配置。请先在 <code>auth-config.js</code> 填入 Supabase 的 URL 与 anon key，并运行 supabase-setup.md 中的建表 SQL。", "err");
      return;
    }
    try {
      var s = await A.session();
      if (!s) { location.href = "login.html?redirect=admin.html"; return; }
      if (!A.isAdmin(s.user.email)) {
        listEl.innerHTML = '<div class="adm-empty">无权限：本页面仅管理员可访问。</div>';
        return;
      }
      await load("pending");
    } catch (err) {
      show("初始化失败：" + ((err && err.message) || err), "err");
    }
  })();
})();
</script>

if(t&&l){t.addEventListener('click',function(){l.classList.toggle('open');});}})();
