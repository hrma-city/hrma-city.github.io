<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>登录 · RMC 收益管理社区</title>
<style>
  :root{ --navy:#0f2a4a; --blue:#1d6fb8; --gold:#e8b84b; --ink:#1a2733; --mute:#5b6a7d; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(160deg,#0f2a4a 0%,#163a63 55%,#1d6fb8 100%);
        font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
        color:#fff; padding:24px; }
  .card{ width:100%; max-width:460px; background:#fff; border-radius:14px;
         box-shadow:0 20px 60px rgba(0,0,0,.28); overflow:hidden; }
  .hd{ background:var(--navy); color:#fff; padding:26px 28px 22px; }
  .hd .lock{ font-size:22px; }
  .hd h1{ margin:10px 0 6px; font-size:21px; letter-spacing:.5px; }
  .hd .sub{ font-size:13px; color:#b9cbe0; line-height:1.6; }
  .bd{ padding:26px 28px 22px; }
  label{ display:block; font-size:13px; color:var(--mute); margin-bottom:7px; }
  input{ width:100%; padding:12px 14px; font-size:15px; border:1px solid #d6dde6;
         border-radius:8px; outline:none; margin-bottom:14px; }
  input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(29,111,184,.12); }
  button{ width:100%; margin-top:4px; padding:12px; font-size:15px; font-weight:700;
          background:var(--gold); color:var(--navy); border:1px solid var(--gold);
          border-radius:8px; cursor:pointer; }
  button:hover{ filter:brightness(1.05); }
  button:disabled{ opacity:.6; cursor:default; }
  .msg{ min-height:20px; margin-top:10px; font-size:13px; }
  .msg.ok{ color:#1a7f4b; } .msg.bad{ color:#c0392b; }
  .alt{ margin-top:16px; padding-top:14px; border-top:1px solid #e8ecf1;
        display:flex; justify-content:space-between; font-size:13px; }
  .alt a{ color:var(--blue); text-decoration:none; cursor:pointer; }
  .alt a:hover{ text-decoration:underline; }
  .note{ margin-top:20px; padding-top:18px; border-top:1px solid #e8ecf1;
         font-size:12.5px; color:var(--mute); line-height:1.85; }
  .note b{ color:var(--ink); }
  .note .warn{ background:#fdf6e3; border-left:3px solid var(--gold);
               padding:10px 12px; margin:10px 0; border-radius:0 6px 6px 0; color:#6b5518; }
  .tag{ display:inline-block; font-size:11px; padding:3px 8px; border-radius:20px;
        background:#e8f0f9; color:var(--blue); margin-left:6px; vertical-align:middle; }
  .tag.warn{ background:#fdf1e3; color:#9a6a12; }
  .foot{ padding:14px 28px 20px; font-size:11.5px; color:#8a97a5; line-height:1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="hd">
    <div class="lock">🔒</div>
    <h1>登录后访问</h1>
    <div class="sub">本站内容为内部资料，需通过管理员审核后方可访问。</div>
  </div>
  <div class="bd">
    <label for="email">邮箱</label>
    <input id="email" type="email" placeholder="name@example.com" autocomplete="username" autofocus>
    <label for="password">密码</label>
    <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
    <button id="btn">登录并进入</button>
    <div id="msg" class="msg"></div>
    <div class="alt">
      <a id="regLink">注册申请 →</a>
      <a id="resetLink">忘记密码</a>
    </div>
    <div class="note">
      <b>访问规则</b><br>
      · 注册申请需经管理员（<span id="adminMail">—</span>）审核通过后才能进入。<br>
      · 审核通过后用「注册的邮箱 + 密码」登录即可，无需重复申请。<br>
      · 登录状态保存在本机浏览器，换设备需各登录一次；清除浏览器数据会退出登录。
      <div class="warn" id="beNote" style="display:none">
        <b>当前未接入云端账号库</b><br>
        账号与审核记录保存在「这台设备的浏览器」里：别人在他自己电脑上注册的账号，你在这里看不到、也无法审核通过。
        要给外人开访问，请先完成
        <a href="cloud-setup.html" style="color:#9a6a12;font-weight:700">云端接入</a>（约 15 分钟）。
      </div>
    </div>
  </div>
  <div class="foot">
    RMC 收益管理社区 · 内容与数据均受著作权保护<br>
    如需正式授权与课程合作，请通过正式渠道联系。
  </div>
</div>
<script src="auth-config.js"></script>
<script src="assets/js/access-login.js"></script>
<script>
(function(){
  var m = location.search.match(/[?&]next=([^&]*)/);
  if (m) { window.__HRMA_NEXT = decodeURIComponent(m[1]); }
  var am = document.getElementById('adminMail');
  if (am && window.HRMA_GATE_API) am.textContent = window.HRMA_GATE_API.adminEmail;
  /* 未配真实后端时，明示当前是本地审核模式 */
  if (window.HRMA_GATE_API && !window.HRMA_GATE_API.supabase()) {
    var n = document.getElementById('beNote'); if (n) n.style.display = 'block';
  }
})();
</script>
</body>
</html>
