<body>
  <div class="box">
    <input id="acc" type="text" autocomplete="username" placeholder="账号" aria-label="账号">
    <input id="password" type="password" autocomplete="current-password" placeholder="密码" aria-label="密码">
    <button id="btn">登录</button>
    <div id="msg" class="msg"></div>
  </div>

<script src="assets/data/accounts.js?v=v20261023"></script>
<script>
(function () {
  'use strict';
  /* 全部内联：不依赖任何外部 JS，避免浏览器缓存旧版导致哈希对不上。
     账号为预置列表 rmc001–rmc500（无自由注册）。哈希=密码 SHA-256，无法反推。 */
  var USERS = (window.HRMA_ACCOUNTS || []).map(function (a) {
    return { u: a.u, p: a.p, en: a.en, exp: a.exp, note: a.note };
  });
  function accUsable(rec) {
    if (!rec) return { ok: false, why: 'no' };
    if (rec.en === 0) return { ok: false, why: 'disabled' };
    var t = new Date(); var today = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
    if (rec.exp && rec.exp < today) return { ok: false, why: 'expired' };
    return { ok: true };
  }
  var RC_HASH = 'ff83ba05f7c0fc44b710a828ca5ba85ad8dcfaf1fed1dc4592803b100b07e9c0';

  var $ = function (id) { return document.getElementById(id); };
  var accEl = $('acc'), pwEl = $('password'), btn = $('btn'), msg = $('msg');

  function qs(n) {
    var m = location.search.match(new RegExp('[?&]' + n + '=([^&]*)'));
    if (!m) return '';
    try { return decodeURIComponent(m[1]); } catch (e) { return ''; }
  }
  function say(t, kind) { msg.textContent = t || ''; msg.className = 'msg' + (kind ? ' ' + kind : ''); }
  function safeTarget(t) {
    if (!t) return 'index.html';
    if (/^https?:/i.test(t) || t.charAt(0) === '/' || t.indexOf('..') >= 0) return 'index.html';
    return t;
  }
  function sha256Sync(str) {
    function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
    var mathPow = Math.pow, maxWord = mathPow(2, 32);
    var result = '', words = [];
    var asciiBitLength = str.length * 8;
    var hash = sha256Sync.h = sha256Sync.h || [], k = sha256Sync.k = sha256Sync.k || [];
    var primeCounter = k.length, isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (var i2 = 0; i2 < 313; i2 += candidate) isComposite[i2] = candidate;
        hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    str += '\x80';
    while (str.length % 64 - 56) str += '\x00';
    for (var i3 = 0; i3 < str.length; i3++) {
      var j = str.charCodeAt(i3);
      if (j >> 8) return '';
      words[i3 >> 2] |= j << ((3 - i3) % 4) * 8;
    }
    words[words.length] = (asciiBitLength / maxWord) | 0;
    words[words.length] = asciiBitLength;
    for (var jj = 0; jj < words.length;) {
      var w = words.slice(jj, jj += 16), oldHash = hash, h2 = hash.slice(0, 8);
      for (var i4 = 0; i4 < 64; i4++) {
        var w15 = w[i4 - 15], w2 = w[i4 - 2];
        var a = h2[0], e = h2[4];
        var temp1 = h2[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & h2[5]) ^ (~e & h2[6])) + k[i4] + (w[i4] = (i4 < 16) ? w[i4] : (w[i4 - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i4 - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
        var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & h2[1]) ^ (a & h2[2]) ^ (h2[1] & h2[2]));
        h2 = [(temp1 + temp2) | 0].concat(h2);
        h2[4] = (h2[4] + temp1) | 0;
      }
      for (var i5 = 0; i5 < 8; i5++) h2[i5] = (h2[i5] + oldHash[i5]) | 0;
      hash = h2;
    }
    for (var i6 = 0; i6 < 8; i6++) result += (hash[i6] >>> 0).toString(16).padStart(8, '0');
    return result;
  }
  function sha256(str) { return Promise.resolve(sha256Sync(str)); }

  /* 门守卫要求：会话 pwRef 必须与本机账号表里的密码哈希一致。
     登录时务必「同时写账号表 + 会话」，二者用同一哈希。 */
  function grant(account, hash) {
    var db = { users: [], approved: [] };
    try { db = JSON.parse(localStorage.getItem('hrma_users_local') || 'null') || db; } catch (e) {}
    if (!Array.isArray(db.users)) db.users = [];
    if (!Array.isArray(db.approved)) db.approved = [];
    var u = db.users.filter(function (x) { return x.email === account; })[0];
    if (!u) { u = { email: account, name: account }; db.users.push(u); }
    u.pw = hash; u.status = 'approved';
    try { delete u.password; } catch (e) {}
    if (db.approved.indexOf(account) < 0) db.approved.push(account);
    try { localStorage.setItem('hrma_users_local', JSON.stringify(db)); } catch (e) {}
    var s = {
      email: account, name: account, status: 'approved',
      pwRef: hash, issuedAt: Date.now(), verifiedAt: Date.now()
    };
    try { localStorage.setItem('hrma_session_v2', JSON.stringify(s)); } catch (e) {}
    location.replace(safeTarget(qs('to') || 'index.html?t=nav1'));
  }

  /* 恢复码深链（备用通道，不暴露界面文字） */
  var rc = qs('rc');
  if (rc) {
    sha256('hrma-rc|' + rc.trim()).then(function (h) {
      if (h === RC_HASH) grant('__rc__', h);
      else say('恢复码无效。', 'bad');
    });
    return;
  }

  /* 账号 + 密码登录（匹配预置列表 USERS） */
  btn.addEventListener('click', function () {
    var acc = String(accEl.value || '').trim().toLowerCase();
    var pw = String(pwEl.value || '').replace(/^\s+|\s+$/g, '');
    if (!acc || !pw) { say('请填写账号和密码。', 'bad'); return; }
    btn.disabled = true; btn.textContent = '验证中…'; say('');
    sha256(pw).then(function (h) {
      for (var i = 0; i < USERS.length; i++) {
        if (USERS[i].u === acc && USERS[i].p === h) {
          var us = accUsable(USERS[i]);
          if (!us.ok) {
            btn.disabled = false; btn.textContent = '登录';
            say(us.why === 'disabled' ? '该账号已停用，请联系管理员。' : '该账号已过有效期（至 ' + USERS[i].exp + '）。', 'bad');
            return;
          }
          say('验证通过，正在进入…', 'ok');
          setTimeout(function () { grant(acc, h); }, 300);
          return;
        }
      }
      btn.disabled = false; btn.textContent = '登录';
      if (window.console && console.info) console.info('[HRMA login] fail: badpw');
      say('账号或密码不对。', 'bad');
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = '登录';
      if (window.console && console.error) console.error('[HRMA login]', e);
      say('登录失败，请稍后重试。', 'bad');
    });
  });
  [accEl, pwEl].forEach(function (el) {
    if (!el) return;
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' && btn) btn.click(); });
  });
})();
</script>
</body>
