<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>window.HRMA_PREFIX="";</script>
<script src="auth-config.js"></script>
<script src="assets/js/access-gate.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>登录</title>
<style>
  :root{ --navy:#0f2a4a; --blue:#1d6fb8; --gold:#e8b84b; --ink:#1a2733; --mute:#5b6a7d; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(160deg,#0f2a4a 0%,#163a63 55%,#1d6fb8 100%);
        font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
        color:#fff; padding:24px; }
  .card{ width:100%; max-width:380px; background:#fff; border-radius:14px;
         box-shadow:0 20px 60px rgba(0,0,0,.28); overflow:hidden; }
  .bd{ padding:32px 28px 28px; }
  label{ display:block; font-size:14px; color:var(--ink); margin-bottom:8px; font-weight:600; }
  input{ width:100%; padding:12px 14px; font-size:15px; border:1px solid #d6dde6;
         border-radius:8px; outline:none; margin-bottom:16px; }
  input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(29,111,184,.12); }
  button{ width:100%; padding:12px; font-size:15px; font-weight:700;
          background:var(--gold); color:var(--navy); border:1px solid var(--gold);
          border-radius:8px; cursor:pointer; }
  button:hover{ filter:brightness(1.05); }
  button:disabled{ opacity:.6; cursor:default; }
  .msg{ min-height:18px; margin-top:4px; font-size:13px; }
  .msg.ok{ color:#1a7f4b; } .msg.bad{ color:#c0392b; }
</style>
</head>
<body>
<div class="card">
  <div class="bd">
    <label for="email">邮箱</label>
    <input id="email" type="email" placeholder="邮箱" autocomplete="username">
    <label for="password">密码</label>
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <button id="btn">登录</button>
    <div id="msg" class="msg"></div>
  </div>
</div>

<!-- 站长恢复码通道：保留功能但完全隐藏，仅通过 ?rc= 深链静默进站，门口不暴露任何文字 -->
<div id="rcBox" style="display:none" aria-hidden="true">
  <input id="rcIn" type="text">
  <button id="rcBtn" type="button"></button>
</div>

<script src="assets/js/rc-hash.js?v=10"></script>
<script src="assets/js/access-login.js?v=v13"></script>
<script>
/* ?next= 透传 + 旧登录态失效清理（仅在 needpw=1 时给一行必要提示） */
(function(){
  var m = location.search.match(/[?&]next=([^&]*)/);
  if (m) { window.__HRMA_NEXT = decodeURIComponent(m[1]); }
  var msgEl = document.getElementById('msg');
  if (/[?&]needpw=1/.test(location.search) && msgEl) {
    try {
      ['hrma_session_v2','hrma_gate_v1'].forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
    } catch (e) {}
    msgEl.textContent = '登录状态已失效，请重新输入邮箱和密码。';
    msgEl.className = 'msg bad';
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
})();
</script>
<script>
/* 恢复码深链：?rc=<恢复码>&to=<页面> 自动校验并静默进站，不在门口显示任何文字 */
(function(){
  function qs(n){ var m=location.search.match(new RegExp('[?&]'+n+'=([^&]*)')); return m?decodeURIComponent(m[1]):''; }
  var rc=qs('rc'), to=qs('to'); if(!rc) return;
  if(!qs('auto')){ location.replace('access.html?next='+encodeURIComponent(to||'index.html')+'&rc='+encodeURIComponent(rc)+'&auto=1'); return; }
  function normRC(s){ s=String(s||''); try{ s=s.replace(/[\uff01-\uff5e]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xfee0);}); }catch(e){} s=s.replace(/[\s\u00a0\ufeff\r\n\t]/g,''); s=s.replace(/^(恢复码|管理员恢复码|recovery\s*code?)[\s:：=、]*/i,''); return s.toUpperCase(); }
  var ADMIN='3984557428@qq.com', KEY_USERS='hrma_users_local', KEY_SESSION='hrma_session_v2', KEY_RC='hrma_rc_hash';
  function sha256Hex(str){ if(window.crypto&&window.crypto.subtle&&window.TextEncoder){ return window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');}); } var h=5381,s='hrma$3$'+str; for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;} return Promise.resolve('fb$'+h.toString(16)+'.'+s.length); }
  var rcHash; try{ rcHash=localStorage.getItem(KEY_RC); }catch(e){}
  if(!rcHash) return;
  sha256Hex('hrma-rc|'+normRC(rc)).then(function(h){
    if(h!==rcHash) return;
    var db; try{ db=JSON.parse(localStorage.getItem(KEY_USERS)||'null'); }catch(e){}
    if(!db||typeof db!=='object'||Array.isArray(db)) db={users:[],approved:[]};
    if(!Array.isArray(db.users)) db.users=[];
    var u=db.users.filter(function(x){return x&&typeof x==='object'&&x.email===ADMIN;})[0];
    if(!u){ u={email:ADMIN,name:'站长',status:'approved'}; db.users.push(u); }
    if(!Array.isArray(db.approved)) db.approved=[];
    if(db.approved.indexOf(ADMIN)<0) db.approved.push(ADMIN);
    if(!u.pw) u.pw='直通'+Date.now()+Math.random().toString(36).slice(2,10);
    try{ delete u.password; }catch(e){}
    try{ localStorage.setItem(KEY_USERS,JSON.stringify(db)); }catch(e){}
    var sess={ email:ADMIN, name:'站长', status:'approved', pwRef:u.pw, issuedAt:new Date().toISOString(), autoIssued:true };
    try{ localStorage.setItem(KEY_SESSION, JSON.stringify(sess)); }catch(e){}
    var nx=to||'index.html';
    try{ location.replace(nx); }catch(e){ try{ location.href=nx; }catch(e2){} }
  });
})();
</script>
</body>
</html>
