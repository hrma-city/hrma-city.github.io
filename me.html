<body>
<div class="card">
  <div class="hd">
    <h1>修改我的密码</h1>
    <div class="sub">登录状态下可随时更换自己的密码，改完立即生效。</div>
  </div>
  <div class="bd">
    <label for="old">当前密码</label>
    <input id="old" type="password" placeholder="请输入当前密码" autocomplete="current-password">
    <label for="np">新密码（至少 8 位）</label>
    <input id="np" type="password" placeholder="至少 8 位，建议字母+数字+符号" autocomplete="new-password">
    <label for="np2">再输入一次新密码</label>
    <input id="np2" type="password" placeholder="重复新密码" autocomplete="new-password">
    <button id="btn">保存新密码</button>
    <div id="msg" class="msg"></div>
    <div class="note">
      <b>当前身份：</b><span id="who">—</span><br>
      · 密码只保存在<b>你这台设备的浏览器</b>里（SHA-256 哈希，不是明文）。<br>
      · 换设备或清除浏览器数据后，需要重新设置密码。<br>
      · <a href="index.html">返回首页</a>
    </div>
  </div>

<script src="assets/js/access-login.js?v=v12"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var msg=$('msg');
  function say(t,k){msg.textContent=t||'';msg.className='msg'+(k?' '+k:'');}

  var KEY_SESSION='hrma_session_v2', KEY_USERS='hrma_users_local';
  var s=null;
  try{s=JSON.parse(localStorage.getItem(KEY_SESSION)||'null');}catch(e){}
  if(!s||!s.email){ location.replace('access.html?next=me.html'); return; }
  $('who').textContent=s.email;

  $('btn').addEventListener('click',function(){
    var oldPw=$('old').value, np=$('np').value, np2=$('np2').value;
    if(!oldPw||!np){ say('请把当前密码和新密码都填上。','bad'); return; }
    if(np.length<8){ say('新密码至少 8 位。','bad'); return; }
    if(np!==np2){ say('两次输入的新密码不一致。','bad'); return; }
    if(np===oldPw){ say('新密码不能与当前密码相同。','bad'); return; }

    $('btn').disabled=true;
    var db;
    try{db=JSON.parse(localStorage.getItem(KEY_USERS)||'null');}catch(e){}
    if(!db||!db.users){ say('本机没有账号表，无法修改。请先退出后重新登录一次。','bad'); $('btn').disabled=false; return; }

    var u=db.users.filter(function(x){return x.email===s.email;})[0];
    if(!u){ say('本机账号表里找不到你的记录。','bad'); $('btn').disabled=false; return; }

    window.HRMA_GATE_API.sha256(oldPw).then(function(hOld){
      var stored=u.pw||u.password;
      /* 兼容三种历史格式：SHA-256 / v2 老哈希 / v2 明文 */
      var legacy=(function(x){var h=5381,t='hrma$'+x;for(var i=0;i<t.length;i++){h=((h<<5)+h+t.charCodeAt(i))>>>0;}return h.toString(16)+'.'+t.length;})(oldPw);
      if(stored!==hOld && stored!==legacy && stored!==oldPw){ say('当前密码不对。','bad'); $('btn').disabled=false; return; }
      return window.HRMA_GATE_API.sha256(np).then(function(hNew){
        u.pw=hNew; try{delete u.password;}catch(e){}
        db.users=db.users; localStorage.setItem(KEY_USERS,JSON.stringify(db));
        say('密码已更新，下次登录请用新密码。','ok');
        $('old').value=$('np').value=$('np2').value='';
        $('btn').disabled=false;
      });
    }).catch(function(e){
      say('修改失败：'+(e&&e.message?e.message:'未知错误'),'bad');
      $('btn').disabled=false;
    });
  });
})();
</script>
