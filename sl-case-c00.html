<script>
var N=2, cur=0;
function go(d){cur=Math.max(0,Math.min(N-1,cur+d));paint();}
function paint(){
  var ss=document.querySelectorAll('.sl'), i;
  for(i=0;i<ss.length;i++){
    var kk=ss[i].getAttribute('data-k')||'';
    ss[i].className=(i===cur?('sl on '+kk):('sl '+kk));
  }
  document.getElementById('pg').textContent=(cur+1)+' / '+N;
  var as=document.querySelectorAll('#toc a');
  for(var j=0;j<as.length;j++){ if(j===cur){as[j].classList.add('cur');}else{as[j].classList.remove('cur');} }
  try{location.hash='p'+(cur+1);}catch(e){}
  fit();
}
function fit(){
  var s=document.querySelectorAll('.sl')[cur], b=s.querySelector('.bd');
  if(!b)return;
  b.style.fontSize='';
  var n=0;
  while(b.scrollHeight>b.clientHeight+6 && n<9){ b.style.fontSize=(parseFloat(getComputedStyle(b).fontSize)-2)+'px'; n++; }
}
document.addEventListener('click',function(e){
  if(e.target.closest('#ov')||e.target.closest('#toc'))return;
  if(e.target.closest('button'))return;
  var st=document.getElementById('stage');
  var r=st.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width;
  go(x>0.82?1:(x<0.18?-1:0));
});
function T(){document.getElementById('toc').classList.toggle('on');}
function SP(){ if(document.fullscreenElement){document.exitFullscreen();} else {document.documentElement.requestFullscreen();} }
function PR(){window.print();}
function OV(){
  var o=document.getElementById('ov');
  if(o.classList.contains('on')){o.classList.remove('on');return;}
  var s=document.querySelectorAll('.sl')[cur], t=s.querySelector('.srctpl');
  document.getElementById('ovc').innerHTML = t?t.innerHTML:'';
  o.classList.add('on');
}
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='ArrowDown'){e.preventDefault();go(1);}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='ArrowUp'){e.preventDefault();go(-1);}
  else if(k==='Home'){cur=0;paint();}
  else if(k==='End'){cur=N-1;paint();}
  else if(k==='f'||k==='F'){SP();}
  else if(k==='p'||k==='P'){PR();}
  else if(k==='d'||k==='D'){OV();}
  else if(k==='Escape'){document.getElementById('toc').classList.remove('on');document.getElementById('ov').classList.remove('on');}
});
window.addEventListener('hashchange',function(){
  var m=location.hash.match(/^#p(\d+)$/);
  if(m){var i=parseInt(m[1],10)-1;if(i>=0&&i<N&&i!==cur){cur=i;paint();}}
});
var _m=location.hash.match(/^#p(\d+)$/); if(_m) cur=parseInt(_m[1],10)-1;
cur=Math.max(0,Math.min(N-1,cur));
paint();
</script>
