<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.HRMA_PREFIX="";</script>

<title>多语言出海内容卡 · 收益管理术语对照</title>
<style>
:root{--o:#7C3AED;--od:#6D28D9;--soft:#f5f3ff;--navy:#0f2a4a;--navy2:#1d4e7e;--ink:#1f2937;--mut:#5b6a7d;--line:#e3e9f1;--page:#f4f7fb;--g:#16a34a;--r:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--ink)}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px 0 20px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.top .kick{font-size:12px;color:#f5d78e;letter-spacing:1px;margin-bottom:6px}
.top h1{font-size:26px;line-height:1.35;margin-bottom:6px}
.top p{color:#c9d8ea;font-size:13.5px;max-width:640px}
main{max-width:860px;margin:0 auto;padding:24px 20px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px}
h2{font-size:18px;color:var(--navy);margin-bottom:10px}
h3{font-size:15px;color:var(--navy);margin:14px 0 8px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
select,input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
.btn{display:inline-block;background:var(--o);color:#fff;border:0;border-radius:9px;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit;margin:6px 6px 0 0}
.btn:hover{background:var(--od)}
.btn.ghost{background:#fff;color:var(--o);border:1px solid var(--o)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.hide{display:none}
.tag{display:inline-block;background:var(--soft);color:var(--od);border:1px solid #fcd9b6;border-radius:20px;padding:3px 11px;font-size:12px;margin:2px 4px 2px 0}
.note{background:#fffbe8;border:1px solid #f5d78e;border-radius:9px;padding:10px 13px;font-size:12.5px;color:#7a5b00;margin-top:12px}
.out{background:var(--soft);border:1px dashed var(--o);border-radius:11px;padding:16px 18px;margin-top:14px;white-space:pre-wrap;line-height:1.85;font-size:14px}
.back{display:inline-block;margin-top:8px;color:var(--mut);font-size:12.5px;text-decoration:none}
.back:hover{color:var(--o)}
@media(max-width:600px){.top h1{font-size:21px}.card{padding:18px 16px}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
<div class="kick">RMC 收益管理社区 · 免费工具</div>
<h1>多语言出海内容卡 · 收益管理术语对照</h1>
<p id="topdesc"></p>
</div></div>
<main><div class="card"><h2>一套术语，三种语言，可直接用于出海教学</h2><p class="sub">面向英语授课的海外酒店管理学院：核心口径不变，只把表达本地化。选术语、选语言，一键生成可复制的内容卡。</p><label>选择术语</label><select id="term"><option value="0">收益管理 · Revenue Management</option><option value="1">出租率 · Occupancy (OCC)</option><option value="2">平均房价 · Average Daily Rate (ADR)</option><option value="3">每间可售房收入 · Revenue per Available Room (RevPAR)</option><option value="4">动态定价 · Dynamic Pricing</option><option value="5">超额预订 · Overbooking</option><option value="6">住宿天数限制 · Minimum Length of Stay (MinLOS)</option><option value="7">价格栅栏 · Rate Fence</option><option value="8">竞争指数 · MPI / ARI / RGI</option><option value="9">房晚易逝 · Perishable Inventory</option><option value="10">需求预测 · Demand Forecasting</option><option value="11">渠道净价 · Net Rate</option></select><label>卡片形式</label><select id="form"><option value="card">术语对照卡（释义+用途）</option><option value="post">社交短帖（含话题标签）</option><option value="teach">课堂讲解卡（含追问）</option></select><label>语言</label><select id="lang"><option value="both">中英双语</option><option value="zh">仅中文</option><option value="en">仅 English</option></select><div style="margin-top:14px"><button class="btn" onclick="gen()">生成内容卡 →</button></div></div><div class="card hide" id="out"></div><script>
const T=[{"zh": "收益管理", "en": "Revenue Management", "plain": "在对的时间把对的房卖给对的人，卖对价", "use": "整套方法的主干"}, {"zh": "出租率", "en": "Occupancy (OCC)", "plain": "卖出去的房 ÷ 能卖的房", "use": "看房子卖得满不满"}, {"zh": "平均房价", "en": "Average Daily Rate (ADR)", "plain": "房费收入 ÷ 卖出去的房", "use": "看卖得贵不贵"}, {"zh": "每间可售房收入", "en": "Revenue per Available Room (RevPAR)", "plain": "ADR × OCC，满和贵一起看", "use": "最核心的综合指标"}, {"zh": "动态定价", "en": "Dynamic Pricing", "plain": "按需求和竞对随时调价，不是一口价", "use": "每日调价动作"}, {"zh": "超额预订", "en": "Overbooking", "plain": "预计有人不来，就多卖一点", "use": "对冲 no-show"}, {"zh": "住宿天数限制", "en": "Minimum Length of Stay (MinLOS)", "plain": "至少住几晚才卖，用条件分开客群", "use": "旺季控短住"}, {"zh": "价格栅栏", "en": "Rate Fence", "plain": "用条件把便宜价和贵价隔开", "use": "防止高端客买到低价"}, {"zh": "竞争指数", "en": "MPI / ARI / RGI", "plain": "和竞组比：我卖得够不够、价够不够、份额够不够", "use": "定位竞争位置"}, {"zh": "房晚易逝", "en": "Perishable Inventory", "plain": "今晚卖不掉，这间房永远没了", "use": "收益管理存在的原因"}, {"zh": "需求预测", "en": "Demand Forecasting", "plain": "提前估每天会有多少人要房", "use": "排价与排库存"}, {"zh": "渠道净价", "en": "Net Rate", "plain": "扣掉佣金后真正到手的钱", "use": "判断渠道值不值"}];
function gen(){
  const t=T[+document.getElementById('term').value];
  const form=document.getElementById('form').value;
  const lang=document.getElementById('lang').value;
  const L=(lang==='both')?['zh','en']:[lang];
  let body='';
  if(form==='card'){
    L.forEach(k=>{body+='【'+(k==='zh'?'中文':'English')+'】\n'+(k==='zh'?(t.zh+'（'+t.en+'）\n'+t.plain+'\n用途：'+t.use):(t.en+' ('+t.zh+')\n'+t.plain+'\nUse: '+t.use))+'\n\n';});
  }else if(form==='post'){
    L.forEach(k=>{body+=(k==='zh'?'今天讲一个收益管理词：'+t.zh+'。\n'+t.plain+'。\n你在店里是怎么用它的？ #酒店收益管理 #收益管理 #'+t.zh
      :'Today\'s RM term: '+t.en+'.\n'+t.plain+'.\nHow do you use it in your property? #RevenueManagement #HotelRM #'+t.en.replace(/ /g,''))+'\n\n';});
  }else{
    L.forEach(k=>{body+=(k==='zh'?'课堂讲解卡 · '+t.zh+'\n① 一句话：'+t.plain+'\n② 用途：'+t.use+'\n③ 追问：换个数字或场景，这个指标会怎么变？'
      :'Teaching Card · '+t.en+'\n1) One line: '+t.plain+'\n2) Use: '+t.use+'\n3) Ask: if the number changes, how does this metric move?')+'\n\n';});
  }
  body+='—— RMC 收益管理社区 · 核心口径不变，表达本地化';
  document.getElementById('out').classList.remove('hide');
  document.getElementById('out').innerHTML=`<h2>${t.zh} · 内容卡</h2><div class="out" id="cardtxt">${body}</div>
   <div style="margin-top:14px"><button class="btn" onclick="cp()">复制全文</button></div>`;
}
function cp(){const t=document.getElementById('cardtxt').textContent;navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>alert('已复制'));}
</script>
<div style="text-align:center;margin-top:26px">

</div>
</main>
</body>
</html>
