<svg xmlns="http://www.w3.org/2000/svg" width="300" height="366" viewBox="0 0 300 366" role="img" aria-label="支付宝收款码占位图">
  <rect width="300" height="366" fill="#ffffff"/>
  <rect x="12" y="12" width="276" height="276" rx="12" fill="#f5f8fe" stroke="#1677FF" stroke-width="2" stroke-dasharray="9 6"/>
  <g fill="none" stroke="#1677FF" stroke-width="6">
    <rect x="34" y="34" width="44" height="44" rx="7"/>
    <rect x="222" y="34" width="44" height="44" rx="7"/>
    <rect x="34" y="222" width="44" height="44" rx="7"/>
  </g>
  <g fill="#1677FF">
    <rect x="47" y="47" width="18" height="18" rx="3"/>
    <rect x="235" y="47" width="18" height="18" rx="3"/>
    <rect x="47" y="235" width="18" height="18" rx="3"/>
  </g>
  <rect x="98" y="98" width="104" height="104" rx="10" fill="#e4eeff"/>
  <text x="150" y="163" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="46" font-weight="700" fill="#1677FF">支</text>
  <text x="150" y="252" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1677FF">支付宝收钱码</text>
  <text x="150" y="276" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9aa6bb">这是一张示例占位图</text>
  <text x="150" y="316" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#333333">请替换为你的支付宝收钱码</text>
