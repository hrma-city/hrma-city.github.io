<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>后台</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<style>
  :root{ --navy:#0f2a4a; --blue:#1d6fb8; --gold:#e8b84b; --mute:#5b6a7d; --ink:#1a2733;
         --ok:#1a7f4b; --bad:#c0392b; }
  *{box-sizing:border-box;}
  body{ margin:0; background:#f4f6f9; color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap{ max-width:1080px; margin:0 auto; padding:24px 20px 60px; }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab{ padding:8px 16px; font-size:13.5px; border-radius:20px; cursor:pointer;
        background:#fff; border:1px solid #d6dde6; color:var(--mute); }
  .tab.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .empty{ text-align:center; padding:50px 20px; color:#8a97a5; font-size:14px; }
  .sec h2{ font-size:16px; margin:0 0 12px; }
  .act{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn{ padding:7px 14px; font-size:13px; font-weight:600; border-radius:6px; cursor:pointer;
        border:1px solid var(--blue); background:var(--blue); color:#fff; }
  .btn.no{ background:#fff; color:var(--bad); border-color:#e3b6b0; }
  .btn.ghost{ background:#fff; color:var(--mute); border-color:#d6dde6; }
  .btn:disabled{ opacity:.5; cursor:default; }
</style>
<script src="auth-config.js?v=fix20261013c"></script>
<script>
/* 管理员守卫：非管理员会话静默弹回大门，本页不留任何可见内容 */
(function(){
  var ADMIN='rm-community@qq.com', s=null;
  try{ s=JSON.parse(localStorage.getItem('hrma_session_v2')||'null'); }catch(e){}
  if(!s || !s.email || String(s.email).toLowerCase()!==ADMIN){
    location.replace('signin.html?next=admin-approve.html');
    document.documentElement.style.display='none';
  }
})();
</script>

<body>
<div class="wrap">
  <div class="tabs">
    <div class="tab on" data-f="pending">待审核</div>
    <div class="tab" data-f="approved">已通过</div>
    <div class="tab" data-f="rejected">已拒绝</div>
  </div>
  <div id="list"></div>
</div>
<script>
(function(){
  var ADMIN='rm-community@qq.com';
  var KEY_USERS='hrma_users_local';
  var KEY_SESSION='hrma_session_v2';
  var KEY_LOCALLIST='hrma_approved_local';
  var cur='pending';
  var s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY_SESSION)||'null'); }catch(e){}
  if(!s||!s.email||String(s.email).toLowerCase()!==ADMIN) return;

  var C=window.HRMA_SUPABASE||{};
  var useCloud = String(window.HRMA_AUTH_MODE||'cloud')!=='local'
    && !!(C.url && C.anonKey && String(C.anonKey).indexOf('XXXX')<0);

  function localDb(){ try{ return JSON.parse(localStorage.getItem(KEY_USERS)||'null'); }catch(e){ return null; } }
  function saveLocal(db){ try{ localStorage.setItem(KEY_USERS, JSON.stringify(db)); }catch(e){} }
  function readList(){ try{ var v=JSON.parse(localStorage.getItem(KEY_LOCALLIST)||'[]');
                            return Array.isArray(v)?v:[]; }catch(e){ return []; } }
  function syncLocalList(email, action){
    var em=String(email||'').toLowerCase();
    if(!em) return;
    var list=readList();
    var i=-1; for(var k=0;k<list.length;k++){ if(String(list[k]).toLowerCase()===em){ i=k; break; } }
    if(action==='approved'){ if(i<0) list.push(em); }
    else if(i>=0){ list.splice(i,1); }
    try{ localStorage.setItem(KEY_LOCALLIST, JSON.stringify(list)); }catch(e){}
  }
  function api(path,opts){
    opts=opts||{};
    return fetch(C.url+path,{method:opts.method||'GET',
      headers:{apikey:C.anonKey,'Content-Type':'application/json',
               Authorization:'Bearer '+(s.access_token||C.anonKey)},
      body:opts.body?JSON.stringify(opts.body):undefined, cache:'no-store'});
  }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
  function fmtT(iso){
    if(!iso) return '—';
    var d=new Date(iso); if(isNaN(d.getTime())) return String(iso);
    var p=function(n){ return (n<10?'0':'')+n; };
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function render(rows){
    var box=document.getElementById('list');
    if(!rows.length){
      box.innerHTML='<div class="empty">没有'+({pending:'待审核',approved:'已通过',rejected:'已拒绝'})[cur]+'的申请。</div>';
      return;
    }
    var LABEL={pending:'待审核',approved:'已通过',rejected:'已拒绝'};
    var h='<div class="sec"><h2>'+LABEL[cur]+' · '+rows.length+' 条</h2>';
    rows.forEach(function(u){
      h+='<div style="background:#fff;border:1px solid #e3e8ef;border-radius:8px;padding:12px 14px;margin-bottom:10px">'
        +'<div style="font-size:13.5px"><b>'+esc(u.full_name||u.name||'-')+'</b> · '+esc(u.email)+'</div>'
        +(u.org?'<div style="font-size:12.5px;color:#5b6a7d;margin-top:3px">'+esc(u.org)+'</div>':'')
        +(u.reason?'<div style="font-size:12.5px;color:#5b6a7d;margin-top:3px">理由：'+esc(u.reason)+'</div>':'')
        +'<div style="font-size:12px;color:#9aa7b5;margin-top:4px">提交时间：'+fmtT(u.appliedAt)+'</div>'
        +'<div class="act" style="margin-top:9px">'
        +(u.status!=='approved'?'<button class="btn" data-a="approved" data-e="'+esc(u.email)+'">通过</button>':'')
        +(u.status!=='pending'?'<button class="btn ghost" data-a="pending" data-e="'+esc(u.email)+'">退回待审</button>':'')
        +(u.status!=='rejected'?'<button class="btn no" data-a="rejected" data-e="'+esc(u.email)+'">拒绝</button>':'')
        +'</div></div>';
    });
    box.innerHTML=h+'</div>';
    box.querySelectorAll('button[data-a]').forEach(function(b){
      b.addEventListener('click',function(){
        setStatus(b.getAttribute('data-e'), b.getAttribute('data-a'), b);
      });
    });
  }
  function setStatus(email, action, btn){
    btn.disabled=true; btn.textContent='处理中…';
    if(useCloud){
      api('/rest/v1/profiles?email=eq.'+encodeURIComponent(email),{method:'PATCH',
        body:{status:action, reviewed_at:new Date().toISOString()}})
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return load(); })
        .catch(function(e){ alert('操作失败：'+e.message); btn.disabled=false; });
      return;
    }
    var db=localDb(); if(!db){ return; }
    db.users.forEach(function(u){ if(u.email===email) u.status=action; });
    saveLocal(db);
    syncLocalList(email, action);
    if(String(email).toLowerCase()===ADMIN) s.status=action;
    try{ localStorage.setItem(KEY_SESSION, JSON.stringify(s)); }catch(e){}
    load();
  }
  function load(){
    if(useCloud){
      api('/rest/v1/profiles?select=email,full_name,org,reason,status,created_at&order=created_at.desc')
        .then(function(r){ return r.json(); })
        .then(function(rows){ render((rows||[]).filter(function(u){ return (u.status||'pending')===cur; })); })
        .catch(function(e){ document.getElementById('list').innerHTML=
          '<div class="empty">读取失败，请重试。</div>'; });
      return;
    }
    var db=localDb();
    if(!db){ document.getElementById('list').innerHTML='<div class="empty">暂无申请。</div>'; return; }
    render((db.users||[]).filter(function(u){ return (u.status||'pending')===cur; }));
  }
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
      t.classList.add('on'); cur=t.getAttribute('data-f'); load();
    });
  });
  load();
})();
</script>
</body>
</html>
