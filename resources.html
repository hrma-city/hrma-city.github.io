    var items = list.filter(function(it){return it.cat===c.name;});
    if(!items.length) return;
    var open = (activeCat===c.name) || (q.value.trim()!=='');
    htmlStr += '<section class="board'+(open?' open':'')+'" data-cat="'+esc(c.name)+'">'
      + '<div class="bh" style="--c:'+c.color+'"><span class="ar">▾</span>'
      + '<h2>'+esc(c.name)+'</h2><span class="bc">'+items.length+'</span><div class="bbar"></div></div>';
    htmlStr += '<div class="bgrid grid">';
    items.forEach(function(it){
      var url = it.url.replace(/"/g,'%22');
      htmlStr += '<a class="card" href="'+url+'" target="_blank" rel="noopener">'
        +'<div class="ct">'+hl(it.title,k)+'</div>'
        +'<div class="cd">'+(it.desc?hl(it.desc,k):'　')+'</div>'
        +'<div class="cmeta">'+esc(it.cat)+'</div></a>';
    });
    htmlStr += '</div></section>';
  });
  results.innerHTML = htmlStr || '<div class="empty">没有匹配的资料，换个关键词试试。</div>';
  Array.prototype.forEach.call(results.querySelectorAll('.bh'), function(h){
    h.addEventListener('click', function(){ h.parentElement.classList.toggle('open'); });
  });
}

function render(){
  var k = q.value.trim().toLowerCase();
  var list = DATA.filter(function(it){
    if(activeCat && it.cat!==activeCat) return false;
    if(!k) return true;
    var hay = (it.title+' '+it.desc+' '+it.tags+' '+it.cat+' '+it.url).toLowerCase();
    return hay.indexOf(k)>=0;
  });
  cnt.textContent = '命中 '+list.length+' 份';
  buildBoards(list);
}

q.addEventListener('input', render);
chips.addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if(!b) return;
  var c = b.getAttribute('data-cat');
  if(activeCat===c){ activeCat=null; } else { activeCat=c; }
  Array.prototype.forEach.call(chips.children, function(x){ x.classList.toggle('on', x.getAttribute('data-cat')===activeCat); });
  render();
});

// 分类标签由 CATS 动态生成（计数取自 DATA），新增分类/条目无需再手改标签栏
function buildChips(){
  var htmlStr = '';
  CATS.forEach(function(c){
    var n = DATA.filter(function(it){return it.cat===c.name;}).length;
    if(!n) return;
    htmlStr += '<button class="chip" data-cat="'+esc(c.name)+'" style="--c:'+c.color+'">'+esc(c.name)+' <span class="cn">'+n+'</span></button>';
  });
  chips.innerHTML = htmlStr;
}
buildChips();

// 支持 ?q= 从顶栏搜索框带入
var m = location.search.match(/[?&]q=([^&]*)/);
if(m){ q.value = decodeURIComponent(m[1].replace(/[+]/g,' ')); }
render();
</script>
