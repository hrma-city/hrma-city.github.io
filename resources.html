var CATS = [{"name": "教材与图书", "color": "#0f2a4a"}, {"name": "学生·学习路径", "color": "#1d6fb8"}, {"name": "微课·备课", "color": "#2E8B7A"}, {"name": "教师·开课", "color": "#b3600a"}, {"name": "游戏·演练", "color": "#7a3fb0"}, {"name": "报表·工具·模板", "color": "#2a7d4f"}, {"name": "认证·考评", "color": "#a02c4a"}, {"name": "训练营·入行", "color": "#8e44ad"}, {"name": "案例·教具", "color": "#c0392b"}, {"name": "行业矩阵", "color": "#0e7c86"}, {"name": "社区·运营", "color": "#5a4ba0"}, {"name": "资源下载", "color": "#6b4f2a"}, {"name": "其他", "color": "#5b6a7d"}];
var q = document.getElementById('q');
var chips = document.getElementById('chips');
var results = document.getElementById('results');
var cnt = document.getElementById('cnt');
var activeCat = null;

function esc(s){return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function hl(s, k){ if(!k) return esc(s); var i=s.toLowerCase().indexOf(k.toLowerCase()); if(i<0) return esc(s); return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+k.length))+'</mark>'+esc(s.slice(i+k.length)); }

function render(){
  var k = q.value.trim().toLowerCase();
  var list = DATA.filter(function(it){
    if(activeCat && it.cat!==activeCat) return false;
    if(!k) return true;
    var hay = (it.title+' '+it.desc+' '+it.tags+' '+it.cat+' '+it.url).toLowerCase();
    return hay.indexOf(k)>=0;
  });
  cnt.textContent = '命中 '+list.length+' 份';
  if(!list.length){ results.innerHTML = '<div class="empty">没有匹配的资料，换个关键词试试。</div>'; return; }
  // group by category (respect CATS order)
  var htmlStr = '';
  CATS.forEach(function(c){
    var items = list.filter(function(it){return it.cat===c.name;});
    if(!items.length) return;
    htmlStr += '<div class="cat" style="--c:'+c.color+'"><h2>'+esc(c.name)+'</h2><div class="bar"></div></div>';
    htmlStr += '<div class="grid">';
    items.forEach(function(it){
      var url = it.url.replace(/"/g,'%22');
      htmlStr += '<a class="card" href="'+url+'" target="_blank" rel="noopener">'
        +'<div class="ct">'+hl(it.title,k)+'</div>'
        +'<div class="cd">'+(it.desc?hl(it.desc,k):'　')+'</div>'
        +'<div class="cmeta">'+esc(it.cat)+'</div></a>';
    });
    htmlStr += '</div>';
  });
  results.innerHTML = htmlStr;
}

q.addEventListener('input', render);
chips.addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if(!b) return;
  var c = b.getAttribute('data-cat');
  if(activeCat===c){ activeCat=null; } else { activeCat=c; }
  Array.prototype.forEach.call(chips.children, function(x){ x.classList.toggle('on', x.getAttribute('data-cat')===activeCat); });
  render();
});

// 支持 ?q= 从顶栏搜索框带入
var m = location.search.match(/[?&]q=([^&]*)/);
if(m){ q.value = decodeURIComponent(m[1].replace(/[+]/g,' ')); }
render();
</script>
