<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script>window.HRMA_PREFIX="../";</script>
<script src="../auth-config.js"></script>
<script src="../assets/js/access-gate.js?v=v9"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>课程模块 M01–M14 · 收益管理</title>
<style>
:root{--ink:#152238;--ink2:#3d4c63;--mute:#6b7a90;--line:#dfe6ef;--navy:#0f2a4a;--blue:#1d6fb8;--gold:#e8b84b;--bg:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--navy),#173d68);color:#fff;padding:20px 22px}
.hd{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.hd .sub{font-size:12.5px;opacity:.8}
.hd a{margin-left:auto;color:#cfe0f2;font-size:12.5px;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.4)}
.wrap{max-width:1000px;margin:0 auto;padding:20px 22px 50px}
.lv{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--navy);border-left:4px solid var(--gold);padding-left:9px}
.lv span{font-weight:400;color:var(--mute);font-size:12.5px;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin:0 0 26px}
a.m{display:block;background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px;text-decoration:none;color:inherit;transition:.15s}
a.m:hover{border-color:var(--blue);box-shadow:0 3px 12px rgba(29,111,184,.12);transform:translateY(-1px)}
a.m .n{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-right:8px}
a.m .lvtag{font-size:11.5px;color:var(--blue);border:1px solid #cfe2f7;border-radius:999px;padding:0 7px;margin-left:6px}
a.m b{display:block;font-size:15px;color:var(--navy);margin:6px 0 4px}
a.m i{font-style:normal;font-size:12.5px;color:var(--mute);display:block;line-height:1.6}
a.m .go{font-size:12px;color:var(--blue);margin-top:7px;display:block}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:12px 15px;font-size:13.5px;color:var(--ink2);margin-bottom:20px}
</style>
</head>
<body>
<header><div class="hd">
  <div><h1>课程模块 M01–M14</h1><div class="sub">按认证级别排列 · 点任一模块直接进对应课程页</div></div>
  <a href="../learn-path.html">← 学习路径总入口</a>
</div></header>
<div class="wrap">
  <div class="note">这一页是<strong>课程模块总目录</strong>。如果从别处点某个模块跳到了首页，请从这里进。
  考级题库在 <a href="../exam/index.html">题库目录</a>。</div>
  <div id="box"></div>
</div>
<script>
var M=[['L1','收益执行专员',[
 ['m01-metrics','M01','收益管理的语言：指标与计算','把 OCC / ADR / RevPAR 算对、把口径说清'],
 ['m02-systems','M02','收益管理系统：RMS 与数据','系统能替你做什么、哪些必须人做'],
 ['m03-dailyops','M03','每日收益流程：一天做什么','早会、日间决策、晚间复盘的具体动作'],
 ['m04-reports','M04','报表体系：每天看哪几张','日表、周报、月报的固定结构']]],
['L2','收益管理主管',[
 ['m05-forecast','M05','预测与需求日历','把未来 90 天的需求排出来'],
 ['m06-pricing','M06','价格决策：怎么定价怎么调','涨价、降价的判定与幅度'],
 ['m07-inventory','M07','库存与配额管理','房量怎么分、留多少、关多少'],
 ['m08-channel','M08','渠道管理与净价','到手多少钱才算数'],
 ['m09-compset','M09','竞争对标与价格弹性','跟谁比、跟到什么程度']]],
['L3','收益管理经理',[
 ['m10-segment','M10','客源细分','把客人分成几堆来卖'],
 ['m11-budget','M11','年度预算与月度分解','把一年拆到每天'],
 ['m12-meetings','M12','收益例会与经营分析','把数据变成决策'],
 ['m13-team','M13','团队与组织协同','谁负责、怎么考核'],
 ['m14-rms','M14','RMS 系统与数据治理','系统、数据、口径三件事']]]];
var h='';
M.forEach(function(g){
  h+='<div class="lv">'+g[0]+' · '+g[1]+'<span>'+g[2].length+' 个模块</span></div><div class="grid">';
  g[2].forEach(function(m){
    h+='<a class="m" href="'+m[0]+'.html"><span class="n">'+m[1]+'</span><span class="lvtag">'+g[0]+'</span>'
      +'<b>'+m[2]+'</b><i>'+m[3]+'</i><span class="go">进入这一模块 →</span></a>';
  });
  h+='</div>';
});
document.getElementById('box').innerHTML=h;
</script>
</body>
</html>
