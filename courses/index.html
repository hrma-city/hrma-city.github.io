<header><div class="hd">
  <div><h1>课程模块 M01–M14</h1><div class="sub">点「在本页读」直接在这里看全文，不必跳页</div></div>

<div class="wrap">
  <div class="note">
    每个模块都有两个入口：<b>在本页读</b>（内容直接显示在下面，不跳转，最稳）、
    <b>单独打开</b>（新标签打开该模块页）。若「单独打开」跳到首页，请一律用「在本页读」。
  </div>

<script>
var M=[['L1','收益执行专员',[
 ['m01-metrics','M01','收益管理的语言：指标与计算','把 OCC / ADR / RevPAR 算对、把口径说清'],
 ['m02-systems','M02','收益管理系统：RMS 与数据','系统能替您做什么、哪些必须人做'],
 ['m03-dailyops','M03','每日收益流程：一天做什么','早会、日间决策、晚间复盘的具体动作'],
 ['m04-reports','M04','报表体系：每天看哪几张','日表、周报、月报的固定结构']]],
['L2','收益管理主管',[
 ['m05-forecast','M05','预测与需求日历','把未来 90 天的需求排出来'],
 ['m06-pricing','M06','价格决策：怎么定价怎么调','涨价、降价的判定与幅度'],
 ['m07-inventory','M07','库存与配额管理','房量怎么分、留多少、关多少'],
 ['m08-channel','M08','渠道管理与净价','到手多少钱才算数'],
 ['m09-compset','M09','竞争对标与价格弹性','跟谁比、跟到什么程度']]],
['L3','收益管理经理',[
 ['m10-segment','M10','客源细分','把客人分成几堆来卖'],
 ['m11-budget','M11','年度预算与月度分解','把一年拆到每天'],
 ['m12-meetings','M12','收益例会与经营分析','把数据变成决策'],
 ['m13-team','M13','团队与组织协同','谁负责、怎么考核'],
 ['m14-rms','M14','RMS 系统与数据治理','系统、数据、口径三件事']]]];

/* 把模块页正文搬进本页：只去掉导航/脚本/页脚。
   ⚠️ 千万别删 .wrap —— 课程页的正文容器正是 .wrap（.layout > .main > .wrap > .card…），
   之前误删它导致「标题对了、正文 0 字」。 */
function clean(html){
  var d=document.createElement('div');
  d.innerHTML=html;
  d.querySelectorAll('script,style,noscript,nav,header,footer,.hd,.crumb').forEach(function(n){ n.remove(); });
  /* 站内链接改成不可点，避免在阅读过程中又被跳走 */
  d.querySelectorAll('a').forEach(function(a){
    a.removeAttribute('href');
    a.style.color='inherit'; a.style.textDecoration='none';
  });
  return d.innerHTML;
}

function buildList(){
  var h='';
  M.forEach(function(g){
    h+='<div class="lv">'+g[0]+' · '+g[1]+'<span>'+g[2].length+' 个模块</span></div><div class="grid">';
    g[2].forEach(function(m){
      h+='<div class="m" data-f="'+m[0]+'">'
        +'<div class="top"><span class="n">'+m[1]+'</span><span class="lt">'+g[0]+'</span></div>'
        +'<b>'+m[2]+'</b><i>'+m[3]+'</i>'
        +'<div class="btns">'
          +'<button data-read="'+m[0]+'">在本页读</button>'
          +'<a class="sm" href="'+m[0]+'.html" target="_blank" rel="noopener">单独打开 →</a>'
        +'</div><div class="st hide" id="st-'+m[0]+'"></div></div>';
    });
    h+='</div>';
  });
  document.getElementById('list').innerHTML=h;
  document.querySelectorAll('[data-read]').forEach(function(b){
    b.addEventListener('click',function(){ read(b.getAttribute('data-read'), b); });
  });
}

var meta={};
function read(f, btn){
  var meta2=null;
  M.forEach(function(g){ g[2].forEach(function(m){ if(m[0]===f) meta2={code:m[1],title:m[2],lv:g[0]}; }); });
  var box=document.getElementById('reader');
  var st=document.getElementById('st-'+f);
  if(!box.classList.contains('hide')){ box.classList.add('hide'); if(st) st.classList.add('hide'); return; }
  box.classList.remove('hide');
  box.innerHTML='<div class="meta">正在取 '+meta2.code+' 正文…</div>';
  box.scrollIntoView({behavior:'smooth',block:'start'});
  fetch(f+'.html?inpage='+Date.now(),{cache:'no-store'})
  .then(function(r){ return r.text().then(function(t){ return {ok:r.ok, url:r.url, t:t}; }); })
  .then(function(o){
    var t=/<title[^>]*>([\s\S]{0,120}?)<\/title>/i.exec(o.t);
    var title=t?t[1].replace(/\s+/g,' ').trim():'';
    var isHome=/选一个入口|按您要做的事/.test(o.t) || /^RMC收益管理社区/.test(title);
    if(isHome || title.indexOf(meta2.code)<0){
      box.innerHTML='<h2>'+meta2.code+' '+meta2.title+'</h2>'
        +'<div class="err">这次取回的页面不是本模块（返回的是：<b>'+(title||'空页面')+'</b>）。'
        +'说明您这边网络对子目录地址做了替换。请把这条告诉站长，或先用学习路径页进入。</div>';
      return;
    }
    box.innerHTML='<h2>'+meta2.code+'　'+meta2.title+'</h2>'
      +'<div class="meta">'+meta2.lv+' · 内容取自该模块正文，已去掉导航与页脚</div>'
      +'<div class="body">'+clean(o.t)+'</div>';
  })
  .catch(function(e){
    box.innerHTML='<div class="err">读取失败：'+e.message+'</div>';
  });
}

buildList();
</script>
