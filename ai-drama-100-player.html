<script>
window.DP_CFG = {"series": "《定价之间》· 漫剧动画（100 集完整版）", "subtitle": "预订员到集团收益总监的十八年：100 集长篇，按季分组播放。每集含对白、知识点与分镜提示。", "source": "ai-drama-100.html", "groups": [{"name": "第一季 · 预订员的手艺（1–20）", "from": 1, "to": 20}, {"name": "第二季 · 价格的感觉（21–40）", "from": 21, "to": 40}, {"name": "第三季 · 渠道与份额（41–60）", "from": 41, "to": 60}, {"name": "第四季 · 团队的账（61–80）", "from": 61, "to": 80}, {"name": "第五季 · 总监的十八年（81–100）", "from": 81, "to": 100}], "episodes": [{"no": 1, "title": "三百间房，三百个今天", "meta": "约 95 秒 · 场景：预订部 / 深夜 · 知识：房型结构与可售房基数", "scenes": ["场 1　预订部。魏师傅把一张塑封的房型表拍在林薇面前，桌上还有三摞没拆的文件。", "场 2　同一天下午，客人来电。她手忙脚乱地翻表。", "场 3　深夜，办公室只剩她一盏灯。她把房型表抄在笔记本第一页。"], "lines": [{"sp": "魏师傅", "tx": "高级房多少间？豪华呢？行政和套房呢？背下来。"}, {"sp": "林薇", "tx": "（翻着表）150、90、45、15……一共 300 间。"}, {"sp": "魏师傅", "tx": "声音大点。背出来。"}, {"sp": "林薇", "tx": "（提高声音）高级 150，豪华 90，行政 45，套房 15，一共 300 间可售。"}, {"sp": "魏师傅", "tx": "（满意）记住，这 300 间，今天卖不掉就永远没了。"}, {"sp": "客人", "tx": "你们有没有朝南的大床房？安静一点、不要挨着电梯的。"}, {"sp": "林薇", "tx": "（翻纸）您稍等……我、我查一下系统……"}, {"sp": "客人", "tx": "（挂断声）"}, {"sp": "魏师傅", "tx": "（站在身后）挂了？"}, {"sp": "林薇", "tx": "（低头）……挂了。"}, {"sp": "魏师傅", "tx": "客人问你的时候，你去查；查的时候他已经走了。房型记在脑子里，你才接得住客人的下一句话。"}, {"sp": "林薇", "tx": "（边抄边念）高级 150，豪华 90……"}, {"sp": "魏师傅", "tx": "（门外来一句）抄没用，要能脱口而出。明天早上我考你。"}, {"sp": "林薇", "tx": "（对着空房间，小声但清楚）高级 150，豪华 90，行政 45，套房 15。300 间，每天都是新的 300 间。"}], "know": "本集知识点｜可售房（Inventory）是全部定价逻辑的物理起点。它的关键属性不是\"有多少间\"，而是当日失效——今天空着的房产生不了明天的收益。这一属性决定了收益管理与普通商品零售的根本分野，也是\"满了可能亏、空了也可能对\"这句话的由来。", "shot": "分镜/画面提示：① 预订部工位，老员工把塑封房型表拍在桌上，新人手足无措，日光从百叶窗斜切进来。② 新人接电话翻纸的近景，听筒里只剩忙音，手部特写。③ 深夜办公室只剩一盏台灯，笔记本第一页手写房型数，字迹用力。④ 字幕\"300 间，每天都是新的 300 间\"。"}, {"no": 2, "title": "有房为什么不能卖", "meta": "约 95 秒 · 场景：预订部 / 前厅 · 知识：库存的时间价值", "scenes": ["场 1　系统显示\"高级房 12 间可售\"，魏师傅却让她回绝客人。", "场 2　她不服气，去问阿杰。阿杰正在劝一位到店客人。", "场 3　下班前，魏师傅问她今天学到了什么。"], "lines": [{"sp": "林薇", "tx": "师傅，还有 12 间啊，为什么说没有？"}, {"sp": "魏师傅", "tx": "那 12 间是留给明天开始住三晚的客人。"}, {"sp": "林薇", "tx": "可是现在空着也是空着……"}, {"sp": "魏师傅", "tx": "空一晚亏一晚的钱，卖错一晚亏三晚的钱。房子不是\"有就该卖\"，是\"留给谁更值\"。"}, {"sp": "客人", "tx": "你们网上明明显示有房！为什么前台说没有？"}, {"sp": "阿杰", "tx": "（为难）先生，那个房态……"}, {"sp": "林薇", "tx": "（插话）先生，高级房今晚确实没了。但豪华房还有三间，我按高级房的价给您，您看行吗？"}, {"sp": "客人", "tx": "（犹豫）……那行，就豪华房。"}, {"sp": "林薇", "tx": "（对阿杰）别让他空手走。把客人引到别的房型去，规则就守住了。"}, {"sp": "林薇", "tx": "学到\"有房不卖\"。但我还是觉得……挺别扭的。"}, {"sp": "魏师傅", "tx": "别扭就对了。觉得别扭，说明你在算账，不是在照章办事。等你哪天不别扭了，就该换岗了。"}, {"sp": "魏师傅", "tx": "记住：我们关一档房，不是为了少卖，是为了把对的房留给对的人。"}], "know": "本集知识点｜\"有房不卖\"的两层理由：① 库存的时间价值——占用今晚会挤掉明后天的连住需求；② 房型的层级价值——低价房型留位是为了保护高价房型的销售空间。配套动作是\"引流\"而非\"拒绝\"：把被限制的客人引导到更高房型（免费升级），既守住规则又不丢客源。", "shot": "分镜/画面提示：① 屏幕特写：房态表上\"高级房 12 间可售\"被红笔圈起，魏师傅摇头。② 前厅，客人与前台对峙，女主插入调解，三人构图。③ 老员工与新人下班前的对话，走廊暖光，两人影子拉长。"}, {"no": 3, "title": "七百八和六百二", "meta": "约 100 秒 · 场景：预订部 / 大堂 · 知识：动态定价与可解释性", "scenes": ["场 1　客人投诉：\"我上周来 620，今天怎么 780？\"", "场 2　挂断后，林薇不服气。", "场 3　一周后，大堂立起一块价格日历牌。有客人驻足看。"], "lines": [{"sp": "客人", "tx": "同一个房间，凭什么差 160？你们坐地起价！"}, {"sp": "林薇", "tx": "（语塞）这个……是系统调的……"}, {"sp": "客人", "tx": "系统？你们拿系统当挡箭牌？"}, {"sp": "魏师傅", "tx": "（接过电话）先生，今天是会展第二天，全城房间都紧。上周日是淡日，所以便宜。就跟机票、演唱会门票一样，日子不同价不同。"}, {"sp": "客人", "tx": "（沉默）……那行吧。"}, {"sp": "林薇", "tx": "师傅，道理是对的，可客人还是不高兴。我们涨得没错，为什么挨骂？"}, {"sp": "魏师傅", "tx": "因为你是在他要订的那一刻才告诉他。他以为占了便宜，结果发现没占到。"}, {"sp": "林薇", "tx": "那怎么办？我们不能不涨啊。"}, {"sp": "魏师傅", "tx": "涨可以，但要让他提前看见。门口牌子上写清楚本周价格日历，网上挂出来，协议客户提前发邮件通知。"}, {"sp": "魏师傅", "tx": "客人反感的从来不是\"贵了\"，是\"被蒙在鼓里\"。这两个是完全不同的问题。"}, {"sp": "客人", "tx": "（看着牌子）哦，周三是贵的日子。那我改周四来。"}, {"sp": "林薇", "tx": "（在旁边听见，笑了）"}, {"sp": "林薇", "tx": "（画外音）后来我才明白，那块牌子不是在解释价格——它是在把选择权还给客人。而愿意把选择权还给客人的酒店，客人会多信它一分。"}], "know": "本集知识点｜动态定价的合法性来自可解释性与提前告知，而非价格本身。操作要点：① 公示价格日历（大堂/官网/协议客户邮件）；② 用客人熟悉的类比解释（机票、演出票）；③ 让客人在决策前看见价格，而非在成交时才知道。价格能变，但变化必须可预期。", "shot": "分镜/画面提示：① 电话听筒特写，女主语塞的表情。② 老员工接电话的中景，语气平稳笃定。③ 大堂新立的价格日历牌，客人驻足观看，暖光。④ 女主在旁微笑的侧脸，字幕\"把选择权还给客人\"。"}, {"no": 4, "title": "抢班次的人", "meta": "约 90 秒 · 场景：预订部排班表前 · 人性线：关系型生存", "scenes": ["场 1　预订部，墙上贴着下月排班表。林薇站在前面，脸色不好。", "场 2　茶水间。赵姐低声。", "场 3　三个月后，排班表旁边多了一张《排班规则》。林薇在白班。"], "lines": [{"sp": "林薇", "tx": "赵姐，这个月我又是十一个晚班？上个月也是。"}, {"sp": "赵姐", "tx": "（不敢看她）排班是主管定的……张伟说他家里有事，白班他要照顾。"}, {"sp": "林薇", "tx": "他上个月也是这么说的。"}, {"sp": "张伟", "tx": "（端着杯子晃过来）薇薇，年轻人多上点晚班没事，晚班清静，还能看书呢。"}, {"sp": "林薇", "tx": "那为什么节假日之后、展会那几天的白班，全是你的？"}, {"sp": "张伟", "tx": "（笑）我跟主管熟，你懂的。"}, {"sp": "赵姐", "tx": "薇薇，别跟张伟较劲。他不干活，但他也不得罪人。你这脾气，早晚吃亏。"}, {"sp": "林薇", "tx": "赵姐，活儿是我干的，好处是他的，这叫\"不得罪人\"？"}, {"sp": "赵姐", "tx": "……这叫\"会做人\"。（叹气）我干了十五年，我看明白了。你要么学会，要么就别看。"}, {"sp": "林薇", "tx": "（沉默片刻）那我换个学法——我不跟他抢班，我把排班规则写下来，让主管照着排。"}, {"sp": "林薇", "tx": "（画外音）跟人抢，你会赢一次，然后树一个敌人。跟规则站在一起，你一次都不用抢。这是我学到的第一件事，也是最有用的一件。"}], "know": "本集落点｜职场里最省力的自保不是\"更强硬\"，而是把个人诉求变成规则诉求——诉求人治化，你就永远在求人；诉求规则化，对方不给你，是他违规。这条她后来用了一辈子。", "shot": "分镜提示：① 预订部狭小办公间，墙上排班表密密麻麻，林薇站在表前，背光，表情压抑。② 张伟端保温杯经过，笑得轻松，与林薇形成明暗对比。③ 特写：新贴上的《排班规则》A4 纸，旁边有人用红笔写了\"同意\"。④ 林薇在白班接电话的侧脸，晨光，字幕\"跟规则站在一起，一次都不用抢\"。"}, {"no": 5, "title": "一通投诉电话", "meta": "约 105 秒 · 场景：前厅 / 预订部 · 知识：到店无房与兜底", "scenes": ["场 1　客人到店，房间没了。前台把电话转给预订部，客人冲着林薇吼。", "场 2　客人被送走。前厅一片安静。", "场 3　当晚，她在笔记本上新建一页，标题写\"超售\"。"], "lines": [{"sp": "客人", "tx": "我提前半个月订的！你们收了钱告诉我没房？"}, {"sp": "林薇", "tx": "（慌）先生，我查一下……系统里确实没有可分配的房了……"}, {"sp": "客人", "tx": "那你让我今晚睡大街？我带着孩子！"}, {"sp": "林薇", "tx": "（声音发抖）对、对不起……"}, {"sp": "魏师傅", "tx": "（接过电话）先生，我们在隔壁两家酒店给您安排了房间，比我们这间高一个房型，差价我们出，明晚您回来我们给您升级。车现在就给您叫，孩子的早餐我给您装上。"}, {"sp": "林薇", "tx": "（眼圈红）师傅，是我的错吗？"}, {"sp": "魏师傅", "tx": "是你的错，也是我的错——因为我们没提前算准今天会超。"}, {"sp": "林薇", "tx": "可我已经按系统里的数量订出去了……"}, {"sp": "魏师傅", "tx": "系统算的是\"预计会取消多少\"，不是\"今天实际会来多少\"。这两件事差的那点，就是我们的活儿。"}, {"sp": "魏师傅", "tx": "记住：客人可以不满，但不能无处可去。"}, {"sp": "林薇", "tx": "（写字，念）\"今天：预计取消 8，实际取消 2。卖了 6 间不该卖的。\""}, {"sp": "林薇", "tx": "（停笔）师傅，我们以后能不能不超售？"}, {"sp": "魏师傅", "tx": "不能。不超售，空着的房也是亏。我们要做的是——把\"会来多少\"算得再准一点，而不是不卖。"}, {"sp": "林薇", "tx": "（记下）……算得再准一点。"}], "know": "本集知识点｜到店无房（Walked）是收益管理最贵的失误，成本 = 赔付 + 口碑 + 客人终身价值损失，远高于当晚房费。兜底三件套：同级或升级安置、承担全部差价、承担交通与后续补偿。根因则是到店率（实际到店 / 预订量）预测偏差——正确做法是提高预测精度，而非取消超售（那会制造另一类浪费）。", "shot": "分镜/画面提示：① 前厅，客人拍台怒吼，前台后退半步，女主在电话那头僵住。② 礼宾送客人上车，雨夜，车尾灯远去。③ 女主在灯下新建一页笔记，手写\"超售\"二字，笔尖停顿。④ 字幕\"客人可以不满，但不能无处可去\"。"}, {"no": 6, "title": "魏师傅的兜房本", "meta": "约 100 秒 · 场景：预订部 · 知识：超售的兜底机制", "scenes": ["场 1　魏师傅从抽屉里拿出一个卷边的笔记本，封面写着\"兜房\"。", "场 2　她提出疑问。", "场 3　她开始建自己的本子。第一页只写了一行字。"], "lines": [{"sp": "林薇", "tx": "这是什么？"}, {"sp": "魏师傅", "tx": "兜房本。周边六家酒店，哪家能接、前台是谁、电话多少、什么价、能不能挂账——全在上面。"}, {"sp": "林薇", "tx": "（翻看）连对方前台的名字都记着？"}, {"sp": "魏师傅", "tx": "记名字干啥用的？半夜两点打电话，人肯接你，是因为他知道你是谁。"}, {"sp": "林薇", "tx": "我们是要把客人\"赶\"到别家吗？"}, {"sp": "魏师傅", "tx": "不是赶，是兜。你敢多卖三间，是因为你知道万一来了，你能安排。没这本，你就只能少卖三间。"}, {"sp": "林薇", "tx": "那这六家，是花钱买的？"}, {"sp": "魏师傅", "tx": "（笑）是一家一家喝出来的。十五年，每次我帮他们兜一个，他们就欠我一个。这行到最后，账是记在人身上的。"}, {"sp": "林薇", "tx": "（写字）\"超售不是胆子大，是算过最坏情况，而且准备好了。\""}, {"sp": "魏师傅", "tx": "（看了眼）这句话你早晚会用上。到时候你会知道，最坏情况永远比你以为的更坏一点，所以本子要常更新。"}, {"sp": "林薇", "tx": "（点头）我每个月核一次电话。"}], "know": "本集知识点｜超售的前提不是\"预计会有取消\"，而是具备兜底能力：同业安置网络（含可联系的人）、升级空间、赔付预算、交通安排。先有兜底，才能谈超售；否则超售就是赌博。且兜底资源需要维护与定期核验——失效的安置渠道等于没有。", "shot": "分镜/画面提示：① 抽屉里取出卷边笔记本，封面手写\"兜房\"二字，特写。② 内页密密麻麻手写联系方式，手指划过，暖黄台灯光。③ 师徒对话的中景，老员工讲\"账记在人身上\"，神情淡然。④ 新人笔记本第一页新写的一行字，字幕\"超售不是胆子大，是算过最坏情况\"。"}, {"no": 7, "title": "团队房与散客房", "meta": "约 100 秒 · 场景：销售部 / 预订部 · 知识：团队与散客的结构平衡", "scenes": ["场 1　小唐要 80 间团队房，魏师傅只给 60。", "场 2　小唐走后，林薇问了个问题。", "场 3　一个月后，那个团队真的减了 15 间。散客把房全卖出去了。"], "lines": [{"sp": "小唐", "tx": "80 间全给我啊，一个大单，多省事。"}, {"sp": "魏师傅", "tx": "给你 60。剩下 20 留给散客——他们付 780，你那单 480。"}, {"sp": "小唐", "tx": "可散客还不知道来不来呢！我这是确定的80 间。"}, {"sp": "魏师傅", "tx": "确定是确定，但你占的是最贵的那三天。散客不来，你那 20 间我再给你；散客来了，我多赚 6000。"}, {"sp": "小唐", "tx": "（不服）那我要是谈崩了呢？"}, {"sp": "魏师傅", "tx": "谈崩了，我还有 20 间可以卖给别人。单子越大越要留缝。全押在一个人身上，他一变卦你就崩了。"}, {"sp": "林薇", "tx": "师傅，为什么不能先全给他，散客来了再说？"}, {"sp": "魏师傅", "tx": "因为散客是边来边订的，等他来的时候，房已经没了。团队是提前锁的，散客是临门一脚。"}, {"sp": "魏师傅", "tx": "所以顺序是反的：先给不确定的散客留位，再拿确定的团队填底。新手容易搞反。"}, {"sp": "林薇", "tx": "（记笔记）留位在前，填底在后。"}, {"sp": "小唐", "tx": "（佩服）师傅你怎么知道他会减？"}, {"sp": "魏师傅", "tx": "我不知道。我只是不把话说满。做这行，永远别说\"我全给你\"——说\"我先给你 60，剩下的我们留着看\"。"}, {"sp": "林薇", "tx": "（画外音）很多年后我才懂，那不是保守，那是给自己留了回旋的余地。而在这一行，余地就是利润。"}], "know": "本集知识点｜团队与散客的配比原则：先为散客留位（高价值、晚订），再用团队填底（低价值、早锁）。原因是两者锁定时间相反：散客临期才订，团队提前很久锁量。同时不为单一大单压满库存（留缝），以应对团队减量与需求变化。", "shot": "分镜/画面提示：① 销售部，年轻销售拍着订单争执，老员工平静摇头。② 白板上两个方框：散客留位 20 / 团队 60，箭头标注\"散客先留，团队后填\"。③ 一个月后团队减量的传真/邮件特写。④ 女主记笔记的侧影，字幕\"余地就是利润\"。"}, {"no": 8, "title": "OTA 是什么", "meta": "约 100 秒 · 场景：预订部 / 会议室 · 知识：渠道与净价", "scenes": ["场 1　林薇第一次看到渠道报表，指着一行数字。", "场 2　她拿计算器算了一整天。", "场 3　她把这个结论写在报表边上。"], "lines": [{"sp": "林薇", "tx": "师傅，这间房挂 700，OTA 那栏写的\"到手 595\"？少的 105 呢？"}, {"sp": "魏师傅", "tx": "佣金，还有给客人的积分。105 是成本。"}, {"sp": "林薇", "tx": "那为什么还要卖？我们自己卖不就到手 700 了吗。"}, {"sp": "魏师傅", "tx": "（笑）问得好。因为很多客人根本不来找我们。他先上 OTA，看见我们，才订。"}, {"sp": "魏师傅", "tx": "但你要记住：看价格时，永远看到手的那个数。看到手价，你才知道这门生意赚不赚钱。"}, {"sp": "林薇", "tx": "（自语）上个月 OTA 卖了 900 间夜，每间到手少 105……那就是 9 万 4。"}, {"sp": "林薇", "tx": "（抬头）师傅，9 万 4 我们能再请两个人了。"}, {"sp": "魏师傅", "tx": "是。可如果不上 OTA，这 900 间夜里有 600 间根本不会发生。那你连 595 都拿不到。"}, {"sp": "林薇", "tx": "所以要算的是：多出来的那些，值不值这个价。"}, {"sp": "魏师傅", "tx": "（点头）你今天才算明白。剩下的问题就变成另一个了——怎么让更多人直接来找我们。"}, {"sp": "林薇", "tx": "（写字）\"OTA：到手 595（−105）。作用：被看见。\""}, {"sp": "林薇", "tx": "（画外音）很多年后，我做的第一件大事就是把 OTA 的份额压下去。但那天我在报表边上写的第一句话是：它有用。先承认它有用，才知道该拿它怎么办。"}], "know": "本集知识点｜净价（Net Rate）= 挂牌价 − 佣金 − 积分/卡券成本。判断渠道好坏只看净价。同时要区分 OTA 的双重角色：既获客（带来本来不会发生的订单）也分流（抢走本会直销的订单）——只有增量部分才是它的真实价值，其余是成本。", "shot": "分镜/画面提示：① 报表特写，手指点着\"到手 595\"一行，与\"挂牌 700\"形成对比。② 女主按计算器的近景，屏幕上数字跳动。③ 老员工讲\"被看见\"时的手部动作，桌面暖光。④ 报表边缘手写批注特写，字幕\"先承认它有用，才知道该拿它怎么办\"。"}, {"no": 9, "title": "她被传闲话", "meta": "约 90 秒 · 场景：茶水间 / 更衣室 · 人性线：嫉妒型伤害", "scenes": ["场 1　女更衣室。刘芳与孙倩在里间，林薇在门外听见自己的名字。", "场 2　林薇推门进去，两人立刻转移话题。气氛凝固。", "场 3　走廊。孙倩追上来，有点尴尬。", "场 4　第二天，林薇把自己的确认单流程改成\"双人核对 + 系统留痕\"。刘芳看着她，没说话。"], "lines": [{"sp": "刘芳", "tx": "（压低声音）餐饮部那个小陈又来找她了，还给她带奶茶。你说她一个预订部的，怎么认识这么多人。"}, {"sp": "孙倩", "tx": "人家会来事嘛。上次老周还当着大家夸她报表做得清楚。"}, {"sp": "刘芳", "tx": "报表？我做了八年，我还不知道那报表怎么做。她才来几个月啊。"}, {"sp": "林薇", "tx": "（平静）刘芳姐，上个月的团队房确认单，你那份还没给我。客人后天到。"}, {"sp": "刘芳", "tx": "哦……我忘了。明天给你。"}, {"sp": "林薇", "tx": "明天不行，今天下班前。客人名单要提前发前台。（停顿）还有，你要是觉得我哪里做得不对，直接跟我说。"}, {"sp": "刘芳", "tx": "（笑）说什么呢，我没觉得你不对啊。"}, {"sp": "孙倩", "tx": "薇薇，刘芳姐她……其实人不错，就是嘴碎。你别往心里去。"}, {"sp": "林薇", "tx": "我没往心里去。我在算另一件事——她为什么偏偏在我被表扬之后说这些？"}, {"sp": "孙倩", "tx": "……什么？"}, {"sp": "林薇", "tx": "如果她真的只是嘴碎，她会随时说。可她专挑我出头的时候说。那不是嘴碎，那是不服。"}, {"sp": "林薇", "tx": "不服我理解，我也没什么好让她服的。但她要是因为不服，把客人的确认单压一天——那就不是闲话了，是事故。"}, {"sp": "林薇", "tx": "（画外音）被人议论，你拦不住。你能做的只有两件：一、别让它变成真实的损失；二、别让自己变成她那样的人。"}], "know": "本集落点｜嫉妒型伤害的特征：不针对事情，只针对\"你出头\"这个时刻。应对不是对骂或辩解（越辩越坐实），而是① 把协作流程留痕化，让\"压单\"这种事做不成；② 分清\"情绪\"与\"风险\"，只对风险动手。", "shot": "分镜提示：① 更衣室窄间，镜中映出两人在里间说话，林薇在门外阴影里，构图压迫。② 林薇推门，三人瞬间静止的表情特写。③ 电脑屏幕：确认单双人核对流程，红字标注\"超时自动提醒\"。④ 林薇独自走走廊的背影，字幕\"别让它变成真实的损失\"。"}, {"no": 10, "title": "世博会那年", "meta": "约 105 秒 · 场景：大堂 / 会议室 · 知识：峰值提价的正当性", "scenes": ["场 1　全城满房，房价翻倍。大堂里客人排队，投诉箱满了。", "场 2　会议室。老周宣布这月的收入创纪录。有人笑着，林薇举手。", "场 3　一个月后，大堂多了饮水机与寄存处。退房客人留下一张纸条。"], "lines": [{"sp": "阿杰", "tx": "今天第 8 个投诉了。说我们抢钱。"}, {"sp": "林薇", "tx": "我们是不是涨太多了？我接电话的时候都不敢报价格。"}, {"sp": "魏师傅", "tx": "涨得对不对，你只看一件事：你不涨，这钱归谁？"}, {"sp": "林薇", "tx": "……黄牛？中间商？"}, {"sp": "魏师傅", "tx": "对。他们加价卖，客人一样掏钱，住一样差，挨骂的还是我们。那才是真抢。"}, {"sp": "林薇", "tx": "周总，涨的钱，我们能不能拿出一部分用在客人身上？"}, {"sp": "老周", "tx": "（皱眉）什么意思？"}, {"sp": "林薇", "tx": "大堂加免费饮水、加行李寄存、加晚归的粥。让客人觉得\"贵，但没白贵\"。"}, {"sp": "老周", "tx": "（沉默）……这个月利润本来就高，你还要花钱？"}, {"sp": "魏师傅", "tx": "（站起来）周总，这钱该花。涨价收来的钱，得让客人看得见它去哪了。不然明年他就不来了。"}, {"sp": "阿杰", "tx": "（念纸条）\"贵，但是住得值。\""}, {"sp": "林薇", "tx": "（看着纸条，很久没说话）"}, {"sp": "魏师傅", "tx": "（画外音）客人在意的从来不是便宜。他在意的是自己有没有被当冤大头。"}], "know": "本集知识点｜峰值提价的正当性判据：涨价的收益是否留在服务体系内、客人能否感知。操作上应将超额收入部分回投服务（饮水、寄存、晚归餐食等），让客人形成\"贵但值\"的评价。否则，不提价导致的差价被中间环节截走，客人付出同样成本却得到更差服务——那才是真正的损害。", "shot": "分镜/画面提示：① 满房的大堂，人挤人，投诉箱塞满纸张，喧闹。② 会议室女主举手提建议，全场安静，逆光。③ 大堂新设的饮水机与寄存处，客人使用，暖光。④ 手写纸条\"贵，但是住得值\"特写，字幕\"客人怕的是被当冤大头\"。"}, {"no": 11, "title": "报表里的三行字", "meta": "约 100 秒 · 场景：深夜办公室 / 清晨 · 知识：OCC / ADR / RevPAR", "scenes": ["场 1　深夜，办公室只剩她一盏灯。她对着日报表。", "场 2　她把三个数画成三个连在一起的格子。", "场 3　清晨，她把三个格子贴在办公桌隔板内侧。"], "lines": [{"sp": "林薇", "tx": "（念）出租率 68%……平均房价 620……每间可售房收入 422……"}, {"sp": "林薇", "tx": "（拿笔算）68% 乘 620 = 421.6……原来是这么来的。"}, {"sp": "林薇", "tx": "（愣住）那上周呢？上周出租率 92%，房价 520……92% 乘 520 = 478。上周比这周赚得多？"}, {"sp": "魏师傅", "tx": "（站在门口）看出什么了？"}, {"sp": "林薇", "tx": "看出……我以前只看第一行，是瞎的。"}, {"sp": "林薇", "tx": "出租率是\"卖了多少间\"，房价是\"每间卖了多少钱\"，每间可售房收入……是\"这房子值多少钱\"。"}, {"sp": "魏师傅", "tx": "对。前两个单独看都会骗你。房子卖满了，可能卖贱了；房子卖贵了，可能根本没人住。只有第三个不说谎。"}, {"sp": "林薇", "tx": "（抬头）师傅，那我以前加班到半夜，看的是错的东西？"}, {"sp": "魏师傅", "tx": "（笑）不是错的，是不全的。人这一辈子，很多苦是因为看不全，不是因为不努力。"}, {"sp": "阿杰", "tx": "（路过）你贴这个干嘛？"}, {"sp": "林薇", "tx": "提醒自己。别人问我\"今天好不好\"，我不能再只答一个\"满了\"。"}, {"sp": "林薇", "tx": "（画外音）从那天起，我再看任何一家酒店，第一个找的都是那第三行。它后来救过我很多次。"}], "know": "本集知识点｜RevPAR = OCC × ADR，是唯一同时反映\"量\"与\"价\"的指标。单独看 OCC 会被\"卖便宜了\"欺骗，单独看 ADR 会被\"卖不动\"欺骗。它还有一个更根本的用途：把\"可售房\"而不是\"已售房\"作为分母，因此能反映闲置库存的损失。", "shot": "分镜/画面提示：① 深夜办公室，女主独自对着日报表，台灯暖光，窗外夜色。② 她在纸上画三个相连格子并标注，笔尖停顿。③ 老员工在门口听她说话的剪影。④ 隔板内侧贴的三个格子特写，字幕\"只有第三个不说谎\"。"}, {"no": 12, "title": "满房的那天", "meta": "约 105 秒 · 场景：晨会 / 走廊 · 知识：满房而 RevPAR 下降", "scenes": ["场 1　晨会。白板上写着\"昨日满房！\"和一个感叹号。众人轻松。", "场 2　白板前。老周让她上去讲。", "场 3　散会。走廊上，小唐追上来。"], "lines": [{"sp": "阿杰", "tx": "昨晚满房！最后一间高级房凌晨一点卖掉的，前台几个人都欢呼了。"}, {"sp": "小唐", "tx": "我就说嘛，价格放低点，房子就出去了。"}, {"sp": "老周", "tx": "（没抬头，敲了敲桌上的报表）满房是好事。那你们谁能告诉我，为什么昨天比上周六少赚了两万八？"}, {"sp": "阿杰", "tx": "不可能吧……满房诶，300 间全卖出去了。"}, {"sp": "林薇", "tx": "（小声，第一次开口）上周六均价 780，昨晚 520。"}, {"sp": "林薇", "tx": "（手有点抖）300 间都卖出去了，这是真的。但 100% 乘 520 是 520。上周六是 92% 乘 780，718。"}, {"sp": "老周", "tx": "差多少？"}, {"sp": "林薇", "tx": "每间房少 198，300 间，一天五万九。还少算了餐饮。"}, {"sp": "老周", "tx": "（环视众人）我们拿 100% 的房，换了 67% 的钱。这不是业绩好，这是卖便宜了。"}, {"sp": "小唐", "tx": "（不服）可要是没人订呢？我们不是更惨？"}, {"sp": "林薇", "tx": "（鼓起勇气）所以要看\"什么时候降的\"。降价是为了填谷，不是为了把旺日也卖贱。昨晚是旺日，我们不该放那个价。"}, {"sp": "小唐", "tx": "（语气缓和）你刚才那句\"旺日不该放那个价\"……你怎么知道昨晚是旺日？"}, {"sp": "林薇", "tx": "因为周边三家都满了，我们还在放低价。不是我们卖得好，是我们把客人从别人那儿抢过来了，还少收了钱。"}, {"sp": "林薇", "tx": "（画外音）那是我第一次在会上开口。后来我才知道，开口的代价不是对错，是此后所有人都会记得你开过口。"}], "know": "本集知识点｜满房而 RevPAR 下降 = 定价失败信号。判据不是\"有没有卖完\"，而是\"卖完的均价是不是该有的价\"。配套检查：与竞争集横向对比——若同行满房且价高、自己满房却价低，说明低价是在抢同行客人，属于自我损失。", "shot": "分镜/画面提示：① 白板上红色大字\"满房！\"配感叹号，众人轻松的表情。② 总经理敲报表，全场安静。③ 女主被叫上台讲，手微抖但声音清楚。④ 走廊两人对话，女主抬头，字幕\"开口的代价不是对错，是所有人都会记得你开过口\"。"}, {"no": 13, "title": "三个数字怎么拆", "meta": "约 105 秒 · 场景：办公室 / 会议室 · 知识：诊断顺序与结构归因", "scenes": ["场 1　老周把她叫去解释本月 RevPAR 下滑。", "场 2　老周追问。", "场 3　她在笔记本上画了个\"漏斗\"。"], "lines": [{"sp": "老周", "tx": "别跟我讲三个数。我就想知道：这个月好不好？"}, {"sp": "林薇", "tx": "不好。RevPAR 422，目标 450，差 28。"}, {"sp": "老周", "tx": "差在哪？"}, {"sp": "林薇", "tx": "出租率 68%，跟去年一样——所以不是量的问题，是价的问题。"}, {"sp": "老周", "tx": "价掉在哪？"}, {"sp": "林薇", "tx": "渠道。OTA 占比从 20% 涨到 34%，它卖的价本来就低，还抽佣，把均价拉下去了。"}, {"sp": "老周", "tx": "那降价有用吗？"}, {"sp": "林薇", "tx": "没用。病在渠道，降价只会让更多人走 OTA。降价治的是\"客人嫌贵\"，治不了\"我们从便宜的地方卖太多\"。"}, {"sp": "老周", "tx": "（盯着她）你确定？"}, {"sp": "林薇", "tx": "（把报表推过去）您可以看这行：我们自己渠道的均价是涨的，638。跌的是 OTA 那部分。整体被拉平了，但我们的定价其实没错。"}, {"sp": "老周", "tx": "（沉默）……那就去动渠道，别动价格。"}, {"sp": "林薇", "tx": "（画）先看结果，再拆量价，再找结构，最后才是动作。"}, {"sp": "小马", "tx": "（凑过来看）为什么动作放最后？"}, {"sp": "林薇", "tx": "因为跳过诊断的动作，十有八九是错的。很多人一看到 RevPAR 掉就降价——那是在治症状，不是在治病。"}, {"sp": "林薇", "tx": "（画外音）后来我带团队，第一件事就是让他们背这个顺序。顺序对了，笨一点也没关系；顺序错了，越勤快越糟。"}], "know": "本集知识点｜诊断顺序：RevPAR 异常 → 拆 OCC（量）与 ADR（价）→ 定位来源 → 查结构（渠道/客源/房型）→ 最后才定动作。常见错误是看到 RevPAR 掉就降价：若根因是渠道结构失衡，降价会加重病情。分渠道看均价能验证\"我们的定价本身对不对\"。", "shot": "分镜/画面提示：① 总经理办公室，女主站立汇报，男主坐着追问，侧光。② 报表上两个数字被分别圈出：自家渠道 638 / OTA 部分下跌。③ 女主在笔记本画漏斗的近景，笔沿着箭头走。④ 字幕\"顺序错了，越勤快越糟\"。"}, {"no": 14, "title": "一场没接的团队", "meta": "约 105 秒 · 场景：销售部 / 预订部 · 知识：置换分析（直觉版）", "scenes": ["场 1　小唐要接 60 间低价团，魏师傅在纸上算。", "场 2　林薇看着那张纸，忽然问了一句。", "场 3　小唐最终谈到 590，接了 50 间。"], "lines": [{"sp": "魏师傅", "tx": "你这一单 60 间，按 480 算。可这三天散客能卖 700。你这一单会挤掉多少散客？"}, {"sp": "小唐", "tx": "散客还没来呢，怎么知道？"}, {"sp": "魏师傅", "tx": "所以要估。这三天是展会尾期，去年散客走了 45 间。估 45，不算你 60，那还有 15 间是你多赚的。"}, {"sp": "小唐", "tx": "那要是散客来了 60 间呢？"}, {"sp": "魏师傅", "tx": "那你就挤掉 45 间散客，等于把 700 的卖了 480。你亏 9900。"}, {"sp": "林薇", "tx": "师傅，那是不是说——只要他给的价够高，就能接？"}, {"sp": "魏师傅", "tx": "（意外地看她）……你说。"}, {"sp": "林薇", "tx": "散客 700，但要冒\"可能不来\"的险。团队 480，但是确定的。如果他能给到 600，那点差价，就当买保险了。"}, {"sp": "魏师傅", "tx": "（沉默两秒，笑了）你比我算得快。确定的钱，比可能的钱值钱——这句话你要记一辈子。"}, {"sp": "小唐", "tx": "（擦汗）客户差点就走了。"}, {"sp": "林薇", "tx": "（笑）可你接了 50 间，还留了 10 间给散客。两边都没押满。"}, {"sp": "魏师傅", "tx": "（收起纸）今天这单，可以记进本子。名字你以后会学到，叫\"置换\"。"}, {"sp": "林薇", "tx": "（记笔记）置换……这间房给谁更值。"}], "know": "本集知识点｜置换分析（Displacement）：比较\"接单收入\"与\"它可能挤掉的更高价需求\"，并把需求不确定性计入——确定的钱比可能的钱值钱，因此团队价可低于散客价而仍然划算。结论通常是\"到什么价可以接、接多少间\"，而非简单的接或不接。", "shot": "分镜/画面提示：① 销售部桌上摊开的手写演算纸，数字密密麻麻。② 女主凑近看纸，忽然提问的侧脸。③ 老员工意外又欣慰的笑容，拍她肩膀。④ 笔记上手写\"这间房给谁更值\"，字幕\"确定的钱比可能的钱值钱\"。"}, {"no": 15, "title": "商务客的周三", "meta": "约 100 秒 · 场景：预订部 / 会议室 · 知识：周内需求曲线", "scenes": ["场 1　林薇把一年的出租率按星期几排出来，做成一张图。", "场 2　她真的去问了周边几家，回来带着一个发现。", "场 3　第一个周日包推出，卖出去 31 份。"], "lines": [{"sp": "林薇", "tx": "师傅你看——周二周三是高峰，周日最低，周五周六中间。每周都这样。"}, {"sp": "魏师傅", "tx": "因为我们的客人是来开会的，不是来玩的。商务型酒店和度假型酒店，日历长得不一样。"}, {"sp": "林薇", "tx": "那我们能不能把周日的生意拉起来？"}, {"sp": "魏师傅", "tx": "能，但别用降价的办法。周日要拉的是另一批人——本地的、来度周末的。"}, {"sp": "林薇", "tx": "师傅，我问了三家度假型的，他们的曲线跟我们正好相反：周中低，周末爆满。"}, {"sp": "魏师傅", "tx": "（点头）所以你看到了：曲线不是规律，是客人构成的影子。客人换了，曲线就变了。"}, {"sp": "林薇", "tx": "那我们周日就做\"本地周末包\"？"}, {"sp": "魏师傅", "tx": "做。但记住一条：别拿商务客的产品去卖给周末客。商务客要快速退房和安静，周末客要晚退房和早餐。"}, {"sp": "阿杰", "tx": "（举着单子）31 份！周日出租率到 74% 了。"}, {"sp": "林薇", "tx": "（看着单子）而且他们没跟商务客抢房——用的是不同的房型和包价。"}, {"sp": "林薇", "tx": "（画外音）那是我第一次明白：填谷不是把空房贱卖，是为新房客做新东西。贱卖是把已有的东西打折，做新产品是让本来不会来的人来。"}], "know": "本集知识点｜周内需求曲线由客源构成决定（商务型：周中高周末低；度假型相反）。曲线是客群结构的影子，客群变则曲线变。填谷的正确方法是\"找新客群 + 设计匹配产品\"（如家庭周末包含晚退房与早餐），而非对原有客群降价。", "shot": "分镜/画面提示：① 女主把一年数据按星期排序做成折线图，屏幕光照脸。② 两张曲线图并排：一条周中高、一条周末高，箭头相反。③ 第一个\"周日包\"订单单 stack，共 31 份。④ 字幕\"填谷不是把空房贱卖，是为新房客做新东西\"。"}, {"no": 16, "title": "退订潮", "meta": "约 105 秒 · 场景：预订部 / 会议室 · 知识：突发事件的止损与通报", "scenes": ["场 1　突发公共卫生事件。一天退了 200 间，电话响成一片。", "场 2　当晚，她把所有退订录进表，算出一个数。", "场 3　会议室。她第一次在老周面前报坏消息。"], "lines": [{"sp": "阿杰", "tx": "电话打爆了，全是要退的。有的还骂我们不退钱。"}, {"sp": "林薇", "tx": "（站起来）先统一口径：政策内的全额退，政策外的报我这里，任何人不要自己承诺。"}, {"sp": "小马", "tx": "那客人问\"什么时候能订\"，怎么说？"}, {"sp": "林薇", "tx": "说\"目前政策随时在变，我们按最新政策执行，请您留下联系方式，变了第一时间通知您\"。不许说\"应该没事\"。"}, {"sp": "林薇", "tx": "（对魏师傅）今天退 200 间。按这个速度，一周会退 1100 间，下个月出租率大概 30%。"}, {"sp": "魏师傅", "tx": "这么快就报上去？"}, {"sp": "林薇", "tx": "晚一天，就少一天可调整的时间。"}, {"sp": "魏师傅", "tx": "（点头）好。坏消息要早说——藏着不说，等它自己爆发，那才叫事故。"}, {"sp": "林薇", "tx": "周总，下个月预计出租率 30%。我建议：现在就停招聘、暂停布草采购、把两层楼先封起来。"}, {"sp": "老周", "tx": "（皱眉）还没发生呢，你就让我封楼？"}, {"sp": "林薇", "tx": "是按已发生的事推算的。如果错了，我提前一天告诉您改回来；如果不报，我们连改的机会都没有。"}, {"sp": "老周", "tx": "（沉默）……先停招聘。封楼等我消息。"}, {"sp": "林薇", "tx": "（画外音）那天我学到：报坏消息不是勇气问题，是时间问题——你早说一天，组织就多一天。"}], "know": "本集知识点｜突发事件应对四步：① 统一对外口径（不许个人承诺）；② 逐笔记录；③ 快速推算后续规模；④ 尽早向上通报并附建议。核心是 信息延迟比事件本身更致命——早一天知道，就多一天可调整的空间。", "shot": "分镜/画面提示：① 预订部电话铃声此起彼伏，多人同时接听，慌乱。② 女主站起来统一口径的正面，众人看她。③ 深夜表格上数字累加，红色箭头向下。④ 会议室女主报坏消息，总经理皱眉，字幕\"早说一天，组织就多一天\"。"}, {"no": 17, "title": "她提了个建议，被别人说了", "meta": "约 105 秒 · 场景：会议室 / 茶水间 · 知识：成果被侵占的应对", "scenes": ["场 1　周会。张伟在讲一个方案，林薇越听越耳熟——那是她熬了两个晚上写的。", "场 2　会后，魏师傅看她脸色不对。", "场 3　下次周会，她主动要了十分钟。"], "lines": [{"sp": "张伟", "tx": "我建议旺季前先把低价渠道关掉两档，理由是……"}, {"sp": "林薇", "tx": "（手在桌下握紧，没说话）"}, {"sp": "老周", "tx": "不错。谁做的？"}, {"sp": "张伟", "tx": "我整理的。"}, {"sp": "老周", "tx": "（点头）执行吧。"}, {"sp": "魏师傅", "tx": "憋屈？"}, {"sp": "林薇", "tx": "那是熬了两个晚上写的。连我的草稿纸上的例子，他一字不差地念了。"}, {"sp": "魏师傅", "tx": "你现在想怎么做？"}, {"sp": "林薇", "tx": "冲进去说那是我的？"}, {"sp": "魏师傅", "tx": "（摇头）那你第二天就会变成\"那个抢功的人\"。别人只会看见两个人在抢，不会看见谁先写的。"}, {"sp": "林薇", "tx": "上次的渠道方案，我想补充三条执行细节：关档的时间点、万一关错了的回退办法、还有判断关早了还是关晚了的标准。"}, {"sp": "老周", "tx": "（意外）接着说。"}, {"sp": "林薇", "tx": "（一口气讲完，条理清楚）"}, {"sp": "张伟", "tx": "（在旁边，脸色不太好看）"}, {"sp": "林薇", "tx": "（画外音）我没有说\"那是我的\"。我只是让所有人看见：他讲不下去的地方，我能讲下去。"}], "know": "本集知识点｜成果被侵占时，争署名会陷入\"两个人在抢\"的叙事，反而损害自己。有效应对是把能力显性化：主动上台补充细节、当场答问、把逻辑讲透。写在纸上的东西谁都能拿走，讲出来的、别人接不住的，才是你的。", "shot": "分镜/画面提示：① 会议室，张伟侃侃而谈，女主在角落握笔的手特写。② 会后茶水间师徒对话，老员工摇头。③ 下次周会女主站起来补充，全场转头看她。④ 张伟侧脸表情复杂，字幕\"他讲不下去的地方，我能讲下去\"。"}, {"no": 18, "title": "魏师傅退休", "meta": "约 100 秒 · 场景：预订部最后一天 · 人性线：职业尊严的交付", "scenes": ["场 1　魏师傅收拾东西，纸箱里是十几本手写台账。", "场 2　两人坐在空办公室。", "场 3　门口。魏师傅把最后一句话说完。"], "lines": [{"sp": "林薇", "tx": "师傅，这些本子……系统里都有啊。"}, {"sp": "魏师傅", "tx": "系统里有数字，本子里有人。哪家的客人爱早到、哪个公司前台爱临时加房、哪个协议客户每年三月来——这些系统记不住。"}, {"sp": "林薇", "tx": "那您不带走？"}, {"sp": "魏师傅", "tx": "带走了，你们就得从头摸一遍。我摸了二十年，你们再摸二十年？那这行还怎么进步。"}, {"sp": "林薇", "tx": "师傅，我有个事想不通。上个月世博会，我们把房价翻了一倍，客人骂我们抢钱。可老周说我们做得对。到底对不对？"}, {"sp": "魏师傅", "tx": "房价涨了，你怕不怕？"}, {"sp": "林薇", "tx": "怕。我觉得客人在骂我。"}, {"sp": "魏师傅", "tx": "那我问你：那天我们要是不涨价，房子会怎么样？"}, {"sp": "林薇", "tx": "……会被黄牛和中间商订走，然后加价卖。"}, {"sp": "魏师傅", "tx": "对。你不涨价，钱一样被别人赚走，住的人一样付高价，只是酒店背骂名、服务还变差。那才是真的对不起客人。"}, {"sp": "魏师傅", "tx": "所以价格不是\"要不要涨\"的问题，是\"涨上去的钱，有没有变成更好的服务\"的问题。你要是收了钱还缩水，那才是抢。"}, {"sp": "魏师傅", "tx": "小林，客人记不住我们的价格。他只记得住我们有没有骗他。"}, {"sp": "林薇", "tx": "（点头，眼眶红）我记住了。"}], "know": "本集落点｜定价伦理的朴素表述：价格的正当性来自\"价值是否同步\"。需求峰值提价本身不是过错——若酒店不提价，差价会被中间环节拿走，客人付出同样成本却得到更差服务。\"收了钱还缩水\"才是真正的抢。", "shot": "分镜提示：① 老预订员在空办公室收拾纸箱，桌上十几本手写台账，午后阳光，温暖怀旧。② 两人并排坐在窗边对话的侧影，逆光。③ 特写：泛黄的台账本，手写客户备注，字迹工整。④ 门口告别，老人背影走出画面，字幕\"客人记不住价格，只记得住有没有骗他\"。"}, {"no": 19, "title": "她当上了主管", "meta": "约 105 秒 · 场景：会议室 / 茶水间 · 知识：晋升后的关系重建", "scenes": ["场 1　老周宣布任命。散会后，气氛微妙。", "场 2　茶水间，只剩她和赵姐。", "场 3　第一次以主管身份开会。她把排班表和分工规则贴在墙上。"], "lines": [{"sp": "老周", "tx": "预订主管，林薇。"}, {"sp": "刘芳", "tx": "（笑着鼓掌，手拍得很慢）"}, {"sp": "张伟", "tx": "（凑过来）薇薇，以后照顾啊。"}, {"sp": "林薇", "tx": "（点头，看向赵姐——赵姐在低头整理东西）"}, {"sp": "赵姐", "tx": "恭喜啊。（停顿）以后……我们说话可能就不一样了。"}, {"sp": "林薇", "tx": "赵姐，我还是我。"}, {"sp": "赵姐", "tx": "（摇头）你会是。但我们看你的眼神已经变了。这是没办法的事。"}, {"sp": "林薇", "tx": "（沉默）那我该怎么做？"}, {"sp": "赵姐", "tx": "别对我们好。对我们公平。好是随便给的，也能随便收回去；公平是规矩，规矩不会变。"}, {"sp": "林薇", "tx": "从今天起，班次按这张表轮，特殊情况写申请。活儿按分工走，不按谁离我近。你们要是觉得我偏心，直接拿这张表跟我说。"}, {"sp": "刘芳", "tx": "（小声嘀咕）规矩真多。"}, {"sp": "林薇", "tx": "（听见了，平静）对，规矩多。规矩多，你们就不用猜我今天心情好不好。"}, {"sp": "林薇", "tx": "（画外音）那天散会，赵姐第一个留下来帮她收拾桌子的。她什么也没说。"}], "know": "本集知识点｜晋升改变的是关系结构而非个人。新管理者最常见的问题是期待\"关系不变\"，或试图用\"对人好\"来弥补——但好是随意的、可收回的。正确做法是主动重建协作规则（公开排班、公开分工、公开标准），用确定性替代私人关系。", "shot": "分镜/画面提示：① 会议室宣布任命，刘芳慢慢拍手，女主看向赵姐。② 茶水间两人对话，赵姐说\"对我们公平\"时神情认真。③ 墙上新贴的排班表与分工规则，众人围观。④ 赵姐默默帮忙收拾桌子的背影。"}, {"no": 20, "title": "新总监来了", "meta": "约 105 秒 · 场景：晨会 / 预订部 · 知识：识别管理者", "scenes": ["场 1　晨会。马国栋第一次亮相，笑得很客气。", "场 2　散会。魏师傅在收拾东西——他下周退休。", "场 3　当天下午，马国栋把一摞文件放在她桌上。"], "lines": [{"sp": "马国栋", "tx": "大家好，我姓马，负责收益。以后这块归我。"}, {"sp": "马国栋", "tx": "（转向林薇）小林是吧？听说报表做得清楚。以后这些活儿你来，我只看结果。"}, {"sp": "林薇", "tx": "（点头）好的马总。"}, {"sp": "马国栋", "tx": "（对全桌）大家放手干，出了事我担着。"}, {"sp": "众人（轻松起来，有人笑了）\n\n场 2　散会。魏师傅在收拾东西——他下周退休。\n魏师傅", "tx": "（低声）小林，看人别看他说什么，看他把活儿往哪儿放。"}, {"sp": "林薇", "tx": "他刚才说\"出了事我担着\"，听起来挺好的。"}, {"sp": "魏师傅", "tx": "（摇头）\"我担着\"是最便宜的一句话。因为出事那天，他可以说\"我不知道\"、\"是下面执行的\"。"}, {"sp": "魏师傅", "tx": "真正担责的人，说的是\"这个决定是我同意的，过程是这样的\"。你记住这句话，用得上。"}, {"sp": "马国栋", "tx": "日报周报、渠道调整——你做，你熟。"}, {"sp": "林薇", "tx": "（看着那摞文件，想起魏师傅的话）"}, {"sp": "马国栋", "tx": "（笑）能者多劳嘛。"}, {"sp": "林薇", "tx": "（平静）好的。那我做完发您，您把关。"}, {"sp": "林薇", "tx": "（画外音）这是我第一次学到：接受安排可以，但要让它留下痕迹。那句\"发您把关\"，我说得很轻，但说了。"}], "know": "本集知识点｜识别管理者的三个观察点：① 他把工作往哪儿放；② 他把功劳往哪儿报；③ 他把风险往哪儿甩。语言（客气、承诺、\"我担着\"）成本极低，资源与责任的流向才是真实意图。初级自保动作：接受安排时用\"做完发您把关\"这类表述，让协作留有痕迹。", "shot": "分镜/画面提示：① 晨会新总监亮相，笑容客气，众人放松。② 老员工收拾纸箱，低声提醒，逆光。③ 下午一摞文件被放到女主桌上，手部特写。④ 女主平静点头，字幕\"接受安排可以，但要让它留下痕迹\"。"}, {"no": 21, "title": "那份文件下来那天", "meta": "约 105 秒 · 场景：会议室 / 预订部 · 知识：客源结构单一的风险", "scenes": ["场 1　会议室。老周把一份通知放下，表情罕见地严肃。", "场 2　她走到白板前，画了三个格。", "场 3　会后，老周留下她。"], "lines": [{"sp": "老周", "tx": "从这个月起，政务接待和大型宴请全部取消。已经订的，退。"}, {"sp": "小唐", "tx": "我们下季度 40% 的团队房是这类……这下怎么办？"}, {"sp": "马国栋", "tx": "（刚上任，语气轻松）那赶紧降价啊，把量补回来。"}, {"sp": "林薇", "tx": "（举手，声音不大）降价补不回来。"}, {"sp": "马国栋", "tx": "（转头）你怎么看？"}, {"sp": "林薇", "tx": "这批客人不是因为贵才不来的，是根本不会来了。价格能改变\"来不来\"，改变不了\"还存不存在\"。"}, {"sp": "林薇", "tx": "我们要换的是客源：商务长住、家庭周末、本地小型宴请。这三种人跟原来那批人要的东西不一样，得重做产品。"}, {"sp": "马国栋", "tx": "（笑）那你说说，长住包怎么定？"}, {"sp": "林薇", "tx": "按月定价，不含早餐，房型锁定在行政房——因为它现在最空，而且它本来就是为长住设计的。"}, {"sp": "老周", "tx": "你刚才当着新总监的面说\"降价补不回来\"，胆子不小。"}, {"sp": "林薇", "tx": "（低头）……我只是想说清楚。"}, {"sp": "老周", "tx": "说清楚是对的。但记住——你说了不算，得让它成真才算。这三个客源，你给我做出来。"}, {"sp": "林薇", "tx": "（画外音）那半年我几乎没有在十点前下过班。但也是那半年，我第一次觉得自己在\"做\"一件事，而不是在\"接\"一件事。"}], "know": "本集知识点｜客源结构风险：单一客源占比过高时，政策或环境变化会直接击穿基本盘。结构性问题不能靠价格解决——价格只影响\"来不来\"，解决不了\"这批人还存不存在\"。正确动作是识别替补客源，并为其重建产品，且应优先利用当前最闲置的房型承载新产品。", "shot": "分镜/画面提示：① 会议室通知文件被放下，众人表情凝重，冷白光。② 女主在白板画三个客源格子，手上有粉笔灰。③ 新总监抱臂旁观，表情微妙。④ 会后总经理留人谈话的侧影，字幕\"让它成真才算\"。"}, {"no": 22, "title": "把套房卖给谁", "meta": "约 105 秒 · 场景：会议室 / 客房楼层 · 知识：高端房型的产品重定义", "scenes": ["场 1　行政房与套房连续三周空着。林薇带了份方案。", "场 2　她带着方案去了楼层，和陈姐一起看房。", "场 3　方案落地一个月，15 间长住包全部售出。"], "lines": [{"sp": "马国栋", "tx": "空着就降成普通房价卖呗，总能卖出去。"}, {"sp": "林薇", "tx": "不行。那等于把行政房这个产品取消了，以后再也涨不回来。"}, {"sp": "马国栋", "tx": "（不耐烦）那你倒是说个办法。"}, {"sp": "林薇", "tx": "我们要找的是愿意为行政待遇付钱的新客人，不是把老客人捡进来。"}, {"sp": "陈姐", "tx": "这些房有个小客厅、有书桌，其实特别适合长期办公。就是布草换得太勤，耗人工。"}, {"sp": "林薇", "tx": "（记笔记）那就改成三天一换。长住客不需要天天换。"}, {"sp": "陈姐", "tx": "那我能把这层固定给两个人管，不用满楼跑。"}, {"sp": "林薇", "tx": "（笑）这一条我写进方案。收益的事，最后是客房的人在扛。不跟她们对过，方案就是纸。"}, {"sp": "老周", "tx": "（翻报表）行政房 RevPAR 涨了 18%，客房那边还省了人工？"}, {"sp": "林薇", "tx": "是。因为我们没有降价，只是换了个卖法：按月、去早餐、布草三天一换。"}, {"sp": "老周", "tx": "（点头）再拿 15 间出来。"}, {"sp": "林薇", "tx": "（画外音）那是我第一次明白：产品不是房间的物理属性，是\"卖给谁、按什么单位卖、附什么东西\"的组合。房间没变，产品变了。"}], "know": "本集知识点｜高端房型缺需求时，不要降级贱卖（会摧毁价格体系），而应重定义产品：换目标客群（长住商务）、换售卖单位（按月）、换附加组合（去早餐、减布草）。这样既保住房型的价格地位，又联动成本端改善，且需与运营部门（客房）共同确认可行性。", "shot": "分镜/画面提示：① 空荡的行政楼层走廊，房门紧闭，冷清。② 女主与客房主管在房内查看，主管指客厅与书桌。③ 两人边看边记的近景，阳光从窗进。④ 一个月后满房状态的行政楼层，字幕\"房间没变，产品变了\"。"}, {"no": 23, "title": "她做的第一份预测", "meta": "约 110 秒 · 场景：办公室 / 总经理办公室 · 知识：预测四要素与区间表达", "scenes": ["场 1　老周要下个月的数。系统给 430。", "场 2　她把四步写在纸上，一格一格指给他看。", "场 3　老周看着那张纸，忽然问了另一件事。"], "lines": [{"sp": "老周", "tx": "系统不是会算吗？"}, {"sp": "林薇", "tx": "系统算的是\"按过去规律会怎样\"。可规律里没有下个月的展会，也没有对面换了总经理在冲量。这些得人加进去。"}, {"sp": "老周", "tx": "那你给多少？"}, {"sp": "林薇", "tx": "465。区间 450–480。"}, {"sp": "老周", "tx": "（皱眉）区间？我要个数。"}, {"sp": "林薇", "tx": "历史给形状，在手进度给斜率，事件给尖峰，竞争给修正。"}, {"sp": "林薇", "tx": "现在在手 55%，展会能把它推上去。但展会尾期那两天会断崖——那两天我按 55% 算，所以是 450；如果那两天能到 70%，就是 480。"}, {"sp": "老周", "tx": "所以区间不是你没把握？"}, {"sp": "林薇", "tx": "不是。区间是\"还差多少、差在哪天、还有多少天可以补\"。给单点，您不知道该往哪使劲。"}, {"sp": "老周", "tx": "那两天，你能不能让它到 70%？"}, {"sp": "林薇", "tx": "（愣住）……可以试。我去做个尾期包。"}, {"sp": "老周", "tx": "（点头）这才是预测的用法。不是告诉我会有多少，是提醒我还差多少。"}, {"sp": "林薇", "tx": "（画外音）那天我才知道，预测最大的价值不是准确性，是它能把一个模糊的焦虑，变成一个具体的日子和具体的数字。"}], "know": "本集知识点｜预测 = 历史基线 + 当前在手（Pickup）+ 事件 + 竞争动态。价值不在\"准\"，而在提前暴露缺口：差多少、差在哪天、还有多少天可补。因此应给出区间并说明两端对应的条件，让接收者知道该往哪里使力。", "shot": "分镜/画面提示：① 总经理办公室，女主递上写着\"465（450–480）\"的纸，男主皱眉。② 纸上四格手写：历史/在手/事件/竞争，手指逐格点过。③ 曲线图上被红框圈出的\"展会尾期两天\"。④ 女主被反问后若有所思，字幕\"提醒我还差多少\"。"}, {"no": 24, "title": "预测错了，怎么办", "meta": "约 105 秒 · 场景：预订部 / 总经理办公室 · 知识：偏差监控与纠偏", "scenes": ["场 1　月中，实际比预测低了 12%。她主动去找老周。", "场 2　老周放下笔，说了句她没料到的话。", "场 3　她把这条写进部门流程，贴在墙上。"], "lines": [{"sp": "林薇", "tx": "周总，我预测错了。低了 12%。"}, {"sp": "老周", "tx": "（头也没抬）为什么错？"}, {"sp": "林薇", "tx": "我把展会带来的需求估高了。实际只带了两天的量，不是三天。"}, {"sp": "老周", "tx": "（抬头）你什么时候发现的？"}, {"sp": "林薇", "tx": "上周三。已经在会上下调了关房节奏，这两天的量保住了。"}, {"sp": "老周", "tx": "行。预测错不要紧，发现得晚才要紧。"}, {"sp": "林薇", "tx": "（犹豫）您不怪我？"}, {"sp": "老周", "tx": "怪你什么？你主动来告诉我，还带着已经做的补救。最坏的是那种错了不说、月底才发现的人——那时候钱已经亏完了。"}, {"sp": "老周", "tx": "下周起，偏差超过 5% 就报我。"}, {"sp": "林薇", "tx": "（记下）5%。"}, {"sp": "小马", "tx": "薇姐，5% 是不是太严了？"}, {"sp": "林薇", "tx": "不严。5% 的时候改，成本很小；15% 的时候改，已经来不及了。"}, {"sp": "林薇", "tx": "（画外音）后来我把这条线教给了每一个跟我的人。不是要求他们算得准，是要求他们看得勤。勤快比聪明可靠得多。"}], "know": "本集知识点｜预测管理的重点不是\"不犯错\"，而是建立偏差监控线与纠偏节奏：设定触发阈值（如 ±5%），到线即复盘并调整动作。发现速度比预测精度更重要；主动上报偏差并附补救措施，是专业性的体现而非失误。", "shot": "分镜/画面提示：① 总经理低头看文件，女主站立承认错误，气氛紧张。② 总经理抬头问\"什么时候发现的\"，眼神锐利。③ 女主记下\"5%\"的笔记本特写。④ 墙上新贴的流程条目，字幕\"勤快比聪明可靠得多\"。"}, {"no": 25, "title": "星期三的会议室", "meta": "约 110 秒 · 场景：会议室 · 知识：收益例会四步", "scenes": ["场 1　周三下午，六个人围坐，每人面前一页纸。", "场 2　定动作环节，小唐急着要全关。", "场 3　散会，才十七分钟。小马追上来。"], "lines": [{"sp": "林薇", "tx": "数字会前就发了，会上不念。只做四件事：看过去、看未来、定动作、分活儿。"}, {"sp": "老周", "tx": "看过去。"}, {"sp": "林薇", "tx": "上周 RevPAR 430，超目标 8 块。原因：周二周三两个会议团补了空档。"}, {"sp": "老周", "tx": "看未来。"}, {"sp": "林薇", "tx": "未来 14 天，下周三有展，对手 A 已满房，我们 55%。"}, {"sp": "小唐", "tx": "那低价渠道全关！"}, {"sp": "林薇", "tx": "只关最便宜一档，留一档接着收。"}, {"sp": "小唐", "tx": "为什么不全关？"}, {"sp": "林薇", "tx": "因为万一预测错了，全关就一点退路都没有。留一档，最坏是少赚；全关，最坏是砸手里。"}, {"sp": "老周", "tx": "分活儿。"}, {"sp": "林薇", "tx": "今晚 6 点前关 B 档，小马执行；行政房最短停留两晚，阿杰同步前台；展会两天不接 30 人以下团队，小唐。"}, {"sp": "小马", "tx": "这么快就散了？"}, {"sp": "林薇", "tx": "例会开长了，说明该在会前做的事被搬到了会上。数据是会前的，判断是会上做的。"}, {"sp": "小马", "tx": "那具体单子的争议呢？比如小唐刚才那个？"}, {"sp": "林薇", "tx": "不在会上谈。会上谈单子，会议就会被最大的那张单牵着走。会后单独过，用置换算。"}, {"sp": "林薇", "tx": "（画外音）这个四步我后来用了一辈子。它看起来是流程，其实是一套\"让情绪进入不了决策\"的设计。"}], "know": "本集知识点｜收益例会四步：看过去（复盘）→ 看未来（预测）→ 定动作（价格/库存/限制）→ 分活儿（责任人与时点）。要点：会前发数据、会上只判断、时长 15–30 分钟；具体单子的争议不在会上谈，会后按分析工具单独立会，避免会议被最大单牵着走。", "shot": "分镜/画面提示：① 会议室俯拍，六人围坐，每人面前一页纸，墙上 14 天预测图。② 女主站立指白板四栏：看过去/看未来/定动作/分活儿。③ 小唐急着提建议被否的瞬间。④ 时钟特写 15:17，字幕\"让情绪进入不了决策\"。"}, {"no": 26, "title": "这个团队接不接", "meta": "约 110 秒 · 场景：销售部 · 知识：置换分析", "scenes": ["场 1　小唐把一份 80 间报价推过来。", "场 2　小唐看着两个结果，愣住了。", "场 3　小唐去谈，谈到 570。他回来说客户只肯到 570。"], "lines": [{"sp": "小唐", "tx": "80 间两晚，480，行不行？不然客户走了。"}, {"sp": "林薇", "tx": "这两天散客预计 700。你这 160 间夜会挤掉其中约 140。"}, {"sp": "小唐", "tx": "那不是还有 20 间是白赚的？"}, {"sp": "林薇", "tx": "（在纸上算）接：160×480=7.6 万，加餐饮 8 千，一共 8.4 万。"}, {"sp": "林薇", "tx": "不接：140×700=9.8 万，加餐饮 4 千，10.2 万。但散客可能只来 100 间夜，那就只有 7.4 万。"}, {"sp": "小唐", "tx": "所以……不一定？"}, {"sp": "林薇", "tx": "不一定，是因为价差太大（480 vs 700，差 220）。如果能谈到 590，就是 9.4 万加餐饮 8 千 = 10.2 万，跟散客持平，而且没有风险。"}, {"sp": "小唐", "tx": "什么风险？"}, {"sp": "林薇", "tx": "散客是\"可能来\"，团队是\"一定会来\"。确定的钱，比可能的钱值钱。所以我不要求你谈到 700，谈到 590 就够。"}, {"sp": "林薇", "tx": "那接 60 间，剩下的留给散客。"}, {"sp": "小唐", "tx": "（急）那客户不高兴。"}, {"sp": "林薇", "tx": "你就说\"我们只能保证 60 间，多出来的等有房再给您\"。把话留个口子，比硬撑 80 间强。万一你那 80 间最后只来 40，我们更惨。"}, {"sp": "林薇", "tx": "（画外音）置换分析算出来的从来不是\"接不接\"。它算出来的是一条线：过了这条线就能接，没过就减量。有了线，你就不用每次去猜、去吵。"}], "know": "本集知识点｜置换分析（Displacement）：比较\"接单收入\"与\"被挤掉的散客收入（含附加）\"，并计入需求不确定风险。三条实操结论：① 结论是\"到什么价可以接\"，不是\"接不接\"；② 确定的钱比可能的钱值钱，故团队价可低于散客价而仍划算；③ 谈不到目标价时减量而非放弃，并给客户留口子。", "shot": "分镜/画面提示：① 销售部，订单被推过来，两人隔着桌子。② 女主在纸上两栏对比演算，红色差额被圈出。③ 小唐看着两个结果发愣的表情。④ 女主平静说\"谈到 590 就够\"，字幕\"算出来的是一条线\"。"}, {"no": 27, "title": "客人说：给我打折", "meta": "约 110 秒 · 场景：前厅 / 预订部 · 知识：价格栅栏", "scenes": ["场 1　前厅。老客户要求按上月价格 620 入住（今日 780）。", "场 2　客人犹豫，最后还是按 780 住了。阿杰不解。", "场 3　她把栅栏条件写成一张卡片，发给前台。"], "lines": [{"sp": "客人", "tx": "我上个月来还是 620。老客户不给优惠？不然我去对面，他们 700。"}, {"sp": "阿杰", "tx": "（为难）这个……先生……"}, {"sp": "林薇", "tx": "（走过来）先生，780 是这两天展会的价格。您要是行程能提前一天走，周日是 620，我按 620 给您。"}, {"sp": "客人", "tx": "我周三才走。"}, {"sp": "林薇", "tx": "那还有一个：提前 7 天订、连住三晚、不改不取消，我给 690。"}, {"sp": "阿杰", "tx": "你刚才怎么不直接给他 620？他一个月来三次。"}, {"sp": "林薇", "tx": "因为一旦这次给了，他下次就知道\"闹一闹就有\"。"}, {"sp": "阿杰", "tx": "可他真的会去对面啊。"}, {"sp": "林薇", "tx": "他不会。他刚才说的是\"对面 700\"——他连对面的价都问了，还站在这儿，说明他更想住我们。"}, {"sp": "林薇", "tx": "而且前台一破例，系统里那条价格就废了，谁都能要走。折扣要挂在条件上。"}, {"sp": "林薇", "tx": "以后客人要折扣，你们不说\"不行\"，说\"可以，但要有条件\"——提前订、连住、不改不取消、会员、特定房型。"}, {"sp": "阿杰", "tx": "（念）\"可以，但要有条件\"……这句话好，不伤人。"}, {"sp": "林薇", "tx": "对。他要的不是便宜，是\"被优待的感觉\"。给他条件，比给他降价有用。"}], "know": "本集知识点｜价格栅栏（Rate Fence）：折扣必须绑定可验证条件——提前预订、连住天数、不可取消、会员身份、特定房型、特定渠道。作用：① 保护高价客源不被低价侵蚀；② 让\"愿意让渡条件的人\"拿到低价，而非\"会闹的人\"拿到低价。话术上应说\"可以，但要有条件\"而非\"不行\"。", "shot": "分镜/画面提示：① 前厅客人抱臂，前台为难，女主插入，三人构图。② 女主拿出卡片讲\"可以，但要有条件\"。③ 栅栏条件卡片特写，列着提前订/连住/不可取消/会员。④ 客人最终办理入住的背影，字幕\"他要的是被优待的感觉\"。"}, {"no": 28, "title": "为什么我订不到房", "meta": "约 110 秒 · 场景：预订部 / 前厅 · 知识：存量控制与最短停留", "scenes": ["场 1　小马发现系统里还有 40 间，官网却显示不可订。", "场 2　一晚客人找上门，阿杰正要拒绝。", "场 3　送走客人。她给小马讲了最后一件事。"], "lines": [{"sp": "小马", "tx": "还有 40 间啊，为什么不卖？客人在网站刷到\"没房\"会跑掉的！"}, {"sp": "林薇", "tx": "展会第一天，连住三晚的客人在排队。让只住一晚的订走，第二三晚的长住客就没房了。"}, {"sp": "小马", "tx": "那我们不是少赚了吗？"}, {"sp": "林薇", "tx": "一晚赚 780，会挤掉后面两晚的 1560。我们卖的不是一间房，是一段连续的日期。"}, {"sp": "客人", "tx": "我就住一晚，为什么一定要两晚？"}, {"sp": "阿杰", "tx": "（照稿念）因为展会期间有最短停留要求……"}, {"sp": "林薇", "tx": "（打断，接过话）女士，高级房那 40 间是留给连住客的。但豪华房还有，价格一样，您看可以吗？"}, {"sp": "客人", "tx": "豪华房也一样价？那行。"}, {"sp": "林薇", "tx": "（对阿杰）别念稿。念稿像在赶人。你先给她一个答案。"}, {"sp": "小马", "tx": "薇姐，那 40 间今晚不就空着了？"}, {"sp": "林薇", "tx": "会空一部分。但要算总账：空今晚的高级房，换来的是明后两天满房的高级房。这叫\"用今晚换明晚\"。"}, {"sp": "林薇", "tx": "（画外音）很多人做不好收益，就是因为舍不得今晚那点空。舍不得空，就永远吃不到后面那两块。"}], "know": "本集知识点｜最短停留（MinLOS）用于保护高峰日的连住价值。关键技巧是\"引流到别的房型\"而非直接拒绝——规则守住，客源不丢。代价是接受当晚部分空置，收益在后续天数兑现——这需要以\"总账\"而非\"单日\"衡量决策。", "shot": "分镜/画面提示：① 小马指着屏幕\"还有 40 间\"满脸不解。② 日历图上今明后三天，女主用笔圈出连住区间。③ 前厅女主把客人引到另一房型，前台松了口气。④ 空着的楼层走廊，字幕\"舍不得今晚那点空，就吃不到后面两块\"。"}, {"no": 29, "title": "她第一次独立定价", "meta": "约 105 秒 · 场景：会议室 / 走廊 · 知识：组合策略", "scenes": ["场 1　展会周，她一次设完三条限制，然后抬头看老周。", "场 2　会后，老周说了实话。", "场 3　走廊。小唐笑着路过。"], "lines": [{"sp": "林薇", "tx": "三条：① 今晚 6 点前关掉 B 档价；② 行政房最短停留两晚；③ 展会那两天不接 30 人以下团队。"}, {"sp": "老周", "tx": "（翻着表，没说话）"}, {"sp": "林薇", "tx": "……周总，有什么问题吗？"}, {"sp": "老周", "tx": "（合上表）行。"}, {"sp": "林薇", "tx": "（意外）就……行？"}, {"sp": "老周", "tx": "你那三条，我本来想挑毛病的。"}, {"sp": "林薇", "tx": "那您为什么没挑？"}, {"sp": "老周", "tx": "因为你三条是配套的。只关价格不设停留，高价房会被短住客占掉；只设停留不限团队，销售会把房批量锁出去。"}, {"sp": "老周", "tx": "三条一起上，才叫一个策略。分开看每条都对，一起上才有用。"}, {"sp": "林薇", "tx": "（记笔记）价格 + 库存 + 限制，一起上。"}, {"sp": "小唐", "tx": "听说老周一个字没改？"}, {"sp": "林薇", "tx": "（笑）改了。他改的是我下次怎么讲——他说完\"行\"就走了，我到现在才知道为什么行。"}, {"sp": "林薇", "tx": "（画外音）那天之后我明白：一个动作不算策略，一组互相兜底的动作才算。单条看都对的东西，凑一起常常互相打架。"}], "know": "本集知识点｜完整的价格动作是组合：价格档位 + 库存开关 + 限制条件（MinLOS/团队门槛）。三者必须配套——只调价不设停留会被短住客占满，只设停留不限团队会被批量锁房。组合的意义在于动作之间互相兜底。", "shot": "分镜/画面提示：① 会议室女主说完三条，众人等总经理表态。② 总经理合上文件夹只说一个\"行\"字。③ 走廊上他补的那段\"三条要配套\"，女主边听边记。④ 笔记上\"价格+库存+限制 一起上\"，字幕\"分开看都对，凑一起常常打架\"。"}, {"no": 30, "title": "一张\"不能做的事\"清单", "meta": "约 105 秒 · 场景：预订部 / 会议室 · 知识：规则化的价值", "scenes": ["场 1　林薇把一张 A4 纸贴在部门墙上。刘芳念出声。", "场 2　第二天就出了状况。小马口头答应了改价，被客人截图投诉。", "场 3　晚上，小马在清单下面加了一行。"], "lines": [{"sp": "刘芳", "tx": "\"不许口头改价\"\"不许无记录关房\"\"不许绕过系统锁房\"……这是谁定的？"}, {"sp": "林薇", "tx": "我定的。都是我们已经犯过的错。"}, {"sp": "张伟", "tx": "（笑）这也太教条了吧，特殊情况要灵活啊。"}, {"sp": "林薇", "tx": "特殊情况就写在纸上：什么情况、谁能批、批完怎么记。灵活不等于没有记录。"}, {"sp": "小马", "tx": "（急）薇姐，客人说我们答应了 620，可系统里是 780！"}, {"sp": "林薇", "tx": "（翻记录）你什么时候答应的？有记录吗？"}, {"sp": "小马", "tx": "（低头）电话里说的，没记。"}, {"sp": "林薇", "tx": "那现在只能按 780 跟他解释，或者按 620 认下来，我们亏 160。不是钱的问题，是你说不清，他也不信。"}, {"sp": "林薇", "tx": "你去跟他谈，就说我来处理。谈完把这单记进表。"}, {"sp": "小马", "tx": "（写字）\"口头答应的价格，一律不算，除非当时有记录。\""}, {"sp": "林薇", "tx": "（看着）这条你自己加的，比我写的有用。"}, {"sp": "小马", "tx": "（不好意思）我以前觉得规矩是管我的。"}, {"sp": "林薇", "tx": "现在呢？"}, {"sp": "小马", "tx": "现在觉得……是替我说话的。出了事，我不用靠记性好，靠纸。"}, {"sp": "林薇", "tx": "（画外音）那张纸后来被别人抄走了很多份。我从来没觉得那是我的东西——它就是一堆我们踩过的坑，排了个队而已。"}], "know": "本集知识点｜把错误动作清单化是收益管理的基础工程：规则的价值不在限制，而在让责任与判断可追溯——出事时不依赖任何人的记忆与善意。要点：清单要写\"例外怎么办\"（谁能批、怎么记），否则会被视为教条而被绕过。", "shot": "分镜/画面提示：① 部门墙上新贴的 A4 清单，众人围观，有人不以为然。② 小马接电话口头答应价格的近景，埋下隐患。③ 客人投诉截图特写，红色标注\"620\"。④ 小马在清单下自己补写一行，字幕\"规矩是替我说话的\"。"}, {"no": 31, "title": "活儿开始往下走", "meta": "约 105 秒 · 场景：预订部 / 深夜 · 知识：职责下移的识别", "scenes": ["场 1　马国栋把一摞东西放到林薇桌上。", "场 2　深夜，她一个人做周报。小马还没走。", "场 3　她在周报的最末，加了一行小字。"], "lines": [{"sp": "马国栋", "tx": "日报周报、渠道调整、例会材料——这些以后你做，你是经理嘛。"}, {"sp": "林薇", "tx": "马总，周报是给集团看的，按职责是总监的。"}, {"sp": "马国栋", "tx": "（笑）一家人，分那么清干嘛。你做得比我快，能者多劳。"}, {"sp": "林薇", "tx": "（沉默）……好。"}, {"sp": "马国栋", "tx": "（拍拍她肩）好好干，我看好你。"}, {"sp": "小马", "tx": "薇姐，周报不是应该他写吗？"}, {"sp": "林薇", "tx": "是。但现在是我写。"}, {"sp": "小马", "tx": "那你干嘛不跟他争？"}, {"sp": "林薇", "tx": "（停下手）争什么呢？他说的是\"你做得快\"——这话我反驳不了，因为它是对的。"}, {"sp": "林薇", "tx": "但我要记下来：哪些是我做的，哪些是替他做的。不用现在说，记着就行。"}, {"sp": "林薇", "tx": "（打字）\"本周渠道调整执行：林薇。数据口径：周三例会版本。\""}, {"sp": "小马", "tx": "加这么一行有什么用？"}, {"sp": "林薇", "tx": "现在没用。但等有一天有人问\"这到底是谁做的\"，这一行就是答案。"}, {"sp": "林薇", "tx": "（画外音）那时候我以为这是信任。很久以后才明白，把执行交给你、把汇报留给自己，是最便宜的一种信任——它不用付出任何东西，还能让你不好意思拒绝。"}], "know": "本集知识点｜警惕\"职责下移\"：特征是执行下放、汇报上收。识别方法是问\"这件事最终以谁的名字呈现\"——若答案不是执行者，即属成果转移。初级自保：在执行成果中用事实性署名标注执行人与口径（不抱怨、不评价），为后续责任界定留下依据。", "shot": "分镜/画面提示：① 一摞文件被放到桌上，总监拍肩离去，女主低头看。② 深夜办公室两人对话，小马不解，女主平静。③ 周报末行打字特写：\"渠道调整执行：林薇\"。④ 女主望着屏幕的侧脸，字幕\"最便宜的一种信任\"。"}, {"no": 32, "title": "减员的传闻", "meta": "约 105 秒 · 场景：预订部 / HR 办公室 · 知识：人效指标的失真", "scenes": ["场 1　HR 在核算预订部人效，办公室里人心惶惶。", "场 2　她带着一张表去了 HR。表上是三周的记录。", "场 3　回到部门，她把工时记录变成常规动作。"], "lines": [{"sp": "赵姐", "tx": "（压低声音）听说要按\"人均处理订单量\"算，我们比别的店低。"}, {"sp": "林薇", "tx": "低是因为我们接的非常规订单多——改期、特殊要求、团队分房。这些系统算不出来。"}, {"sp": "赵姐", "tx": "那你去跟 HR 说啊。"}, {"sp": "林薇", "tx": "我去。但我得先把\"非常规\"这件事量化出来。光说\"我们更辛苦\"没用，得拿出工时。"}, {"sp": "HR", "tx": "你们人均 62 单，隔壁店 78 单。"}, {"sp": "林薇", "tx": "是。但我们这 62 单里，有 19 单是改期、团队分房、特殊要求，平均一单 22 分钟；隔壁那 78 单里，这类只有 4 单。"}, {"sp": "HR", "tx": "（翻表）……你怎么知道这么细？"}, {"sp": "林薇", "tx": "我们记了三周。按这个算，我们的人均有效工时其实比他们高。"}, {"sp": "HR", "tx": "（沉默）这份我留着。但别的店没记，我没法横向比。"}, {"sp": "林薇", "tx": "那请您至少别只看订单数。看订单数，我们永远是\"效率低\"的那一档。"}, {"sp": "林薇", "tx": "从今天起，每单记类型。不是为了让大家多干活，是为了别人问起来我们有话说。"}, {"sp": "刘芳", "tx": "（小声）又要多记东西……"}, {"sp": "林薇", "tx": "（听见）多记三秒钟，少掉两个人。这笔账你们自己算。"}, {"sp": "林薇", "tx": "（画外音）后来减员还是来了。但那三周的记录，让后来的那笔账算得清清楚楚。这是我第一次真正理解：记录不是为了证明自己，是为了让损失有证据。"}], "know": "本集知识点｜人效指标失真的常见原因：只统计可自动计数的产出（订单数），忽略不可见的处理复杂度。辩护方式不是诉诸辛苦，而是把复杂度量化为工时/类型分布。同时，将\"记录工作类型\"变成常规动作，能在后续争议中提供证据。", "shot": "分镜/画面提示：① 预订部众人窃窃私语，气氛紧张。② 女主带着记录表去 HR，两人对坐。③ 表格上\"非常规单 19 单 / 平均 22 分钟\"被红笔框出。④ 女主对部门说\"为了别人问起来我们有话说\"。"}, {"no": 33, "title": "制服房", "meta": "约 95 秒 · 场景：制服房 / 预订部 · 人性线：管理者的边界与集体情绪", "scenes": ["场 1　早晨 8:20，制服房门口排队。预订员小夏抱着一摞工装出来。", "场 2　预订部。小夏把工装放在马国栋桌上，脸色很难看。林薇看在眼里。", "场 3　午休，三个预订员在休息室，气氛压抑。林薇进来。", "场 4　马国栋办公室。", "场 5　一周后。小夏还是走了。林薇在离职面谈表上写下四个字：\"管理成本\"。"], "lines": [{"sp": "小夏", "tx": "（小声嘟囔）凭什么又是我去拿……我自己的还没换呢。"}, {"sp": "刘芳", "tx": "马经理说他在开晨会走不开。他每个月都\"走不开\"三四回。"}, {"sp": "赵姐", "tx": "（叹气）他住得近，八点十分到都来得及。他是不想排那十分钟队。"}, {"sp": "马国栋", "tx": "（拿起工装，随口）放着吧，谢了啊。对了小林，今天渠道那份表你做一下。"}, {"sp": "林薇", "tx": "马总，那份表是您的周报附件。"}, {"sp": "马国栋", "tx": "我知道啊，你做得比我快。（笑）能者多劳嘛。"}, {"sp": "小夏", "tx": "薇姐，我要辞职。不是因为累——是因为我们在这儿不像员工，像他的手。他自己能干的事，全让我们跑腿。"}, {"sp": "刘芳", "tx": "（罕见地站在同一边）他让他女朋友来办公室，我们还得帮她订房、拿快递。这算什么？"}, {"sp": "林薇", "tx": "（沉默）我去说。不是替你们出气——是这事再发生，走的就不止小夏一个。"}, {"sp": "林薇", "tx": "马总，制服房的事，我想提个流程：谁的衣服谁自己换。如果实在走不开，可以提前一天把工装挂到部门，别临时叫人。"}, {"sp": "马国栋", "tx": "（脸色变了）你这话什么意思？我让小夏帮个忙，还要立规矩？"}, {"sp": "林薇", "tx": "不是帮忙的问题。是这个忙本身不该存在——您节省的十分钟，是她排队的二十分钟加上全部门的情绪。"}, {"sp": "马国栋", "tx": "（冷）林薇，你现在是经理了，讲话要注意影响。别带头挑事。"}, {"sp": "林薇", "tx": "我不挑事。我只是不想下个月，我们部门再少一个人。"}, {"sp": "林薇", "tx": "（画外音）很多人以为员工流失是因为钱。其实大多数时候不是——是因为\"不被当回事\"这件事，每天都在发生，而且没人觉得它是个事。"}], "know": "本集落点｜管理者的\"小便利\"成本被严重低估：它消耗的不是那十分钟，而是团队的心理账户。管理者每省下一次自己的麻烦，就多一次集体情绪的负债；负债累积到临界点，一次爆发就是集体流失。识别信号：不是抱怨，是沉默。", "shot": "分镜提示：① 制服房门口排队的长队，员工抱工装，早晨冷白光，压抑。② 小夏把工装放在经理桌上，经理头也不抬，对比构图。③ 休息室三人低头的沉默，气氛凝固。④ 离职面谈表特写，手写\"管理成本\"四字。⑤ 字幕\"员工流失不是因为钱，是因为不被当回事\"。"}, {"no": 34, "title": "赵姐走了", "meta": "约 105 秒 · 场景：预订部 · 知识：流失成本与沉默信号", "scenes": ["场 1　赵姐收拾东西，干了十五年。", "场 2　两个人站在空办公室，赵姐说了实话。", "场 3　送别。赵姐最后留下一句话。"], "lines": [{"sp": "林薇", "tx": "赵姐，是钱的问题吗？我可以去谈。"}, {"sp": "赵姐", "tx": "（摇头）不是累。是没人当回事。我在这干了十五年，走的时候连个会都没开。"}, {"sp": "林薇", "tx": "（沉默）……我给您开。"}, {"sp": "赵姐", "tx": "（笑）别了，怪难看的。"}, {"sp": "赵姐", "tx": "小林，你知道最后压垮我的是什么吗？不是活多。"}, {"sp": "林薇", "tx": "是什么？"}, {"sp": "赵姐", "tx": "是我提了三次，说那个流程能改一下，没人理我。第四次我就不提了。"}, {"sp": "赵姐", "tx": "从那以后我就知道，我在这儿只是干活的人。那我为什么不换个地方干活？"}, {"sp": "林薇", "tx": "（记笔记）……提了三次没人理。"}, {"sp": "赵姐", "tx": "你是个好人，也是个能干的人。但你要记住——能干的人最容易被人用坏。"}, {"sp": "赵姐", "tx": "还有，以后谁跟你提建议，你一定要回一句。哪怕回\"我考虑一下\"。不回，人就没了。"}, {"sp": "林薇", "tx": "（画外音）她走之后，我在本子上写了一条：团队出问题的信号不是抱怨，是沉默。抱怨说明他还在乎，沉默说明他已经放弃了。"}], "know": "本集知识点｜流失的近因常不是薪酬，而是\"不被当回事\"的累积——尤其表现为\"提了建议无人回应\"。识别信号：不是抱怨，是沉默。管理上的低成本动作：对任何建议都给予回应（哪怕只是\"我考虑一下\"），让下属感到被看见。", "shot": "分镜/画面提示：① 赵姐收拾纸箱，动作缓慢，办公室午后阳光。② 两人站在空房间对话，赵姐平静讲\"第四次我就不提了\"。③ 女主低头记笔记，笔尖停顿。④ 赵姐拎箱离开的背影，字幕\"团队出问题的信号不是抱怨，是沉默\"。"}, {"no": 35, "title": "她第一次顶嘴", "meta": "约 110 秒 · 场景：会议室 / 走廊 · 知识：口径失真与公开质疑", "scenes": ["场 1　周会。马国栋报数据，林薇听出了问题。", "场 2　会后，办公室很安静。小唐悄悄竖了个大拇指。", "场 3　当天下午，马国栋把她叫去。"], "lines": [{"sp": "马国栋", "tx": "本月 ADR 同比涨了 3%，说明我们策略是对的。"}, {"sp": "林薇", "tx": "（举手）马总，这个 3% 是含了团队房的吗？团队房价低、量大，混进去会把均价拉平。"}, {"sp": "马国栋", "tx": "（停顿）……当然含了。"}, {"sp": "林薇", "tx": "那散客均价其实是跌的。跌 2%。"}, {"sp": "马国栋", "tx": "（脸色不好）现在我们讲的是整体。"}, {"sp": "小唐", "tx": "（经过，低声）说得好。"}, {"sp": "刘芳", "tx": "（也在旁边，什么也没说）"}, {"sp": "小马", "tx": "薇姐，你不怕吗？"}, {"sp": "林薇", "tx": "怕。但我看着那个 3% 浑身难受。"}, {"sp": "马国栋", "tx": "（笑着，但语气冷）小林，会上那种话，你可以会后跟我说。"}, {"sp": "林薇", "tx": "马总，我说了对的事。"}, {"sp": "马国栋", "tx": "对不对是一回事，让不让我下得来台是另一回事。你今天让我难看了。"}, {"sp": "林薇", "tx": "（沉默）……我下次注意方式。"}, {"sp": "林薇", "tx": "（画外音）那天我以为\"说对了\"就够了。后来才知道，说对之后，你要开始算代价。"}], "know": "本集知识点｜指标口径失真：混算客源（团队+散客）会掩盖真实价格走势——团队量大价低，会把整体均价拉向团队水平，使\"散客价在跌\"这一事实消失。看 ADR 必须分客源、分渠道拆开，否则结构性变化会被平均值吞掉。", "shot": "分镜/画面提示：① 会议室女主举手提问，全场安静，总监停顿。② 会后走廊，有人竖拇指，有人沉默。③ 总监办公室表面带笑的对话，气氛压抑。④ 女主低头说\"我下次注意方式\"，字幕\"说对之后要开始算代价\"。"}, {"no": 36, "title": "扑克与晚走", "meta": "约 100 秒 · 场景：电脑房 / 办公室 · 人性线：表演型劳动", "scenes": ["场 1　下午 3:00，电脑房（IT 机房旁的小房间）。里面传出笑声。", "同一时刻，预订部。林薇一个人对着三块屏幕做渠道调整。", "场 2　晚上 8:40。林薇收拾东西准备走，马国栋从外面\"回来\"。", "场 3　第二天晨会。老周当众说：\"马经理最近很拼，天天最后走。\"马国栋谦虚地笑。", "场 4　当晚，林薇发了第一封\"确认邮件\"。"], "lines": [{"sp": "画外音（牌声、笑声）\"对三！\"\"要不要？\"\n同一时刻，预订部。林薇一个人对着三块屏幕做渠道调整。\n刘芳", "tx": "（路过，压低声音）马总在电脑房呢，跟 IT 老李他们打牌。你去吗？"}, {"sp": "林薇", "tx": "（没抬头）我这儿还有四个渠道要调。"}, {"sp": "马国栋", "tx": "（拎着外套，语气疲惫）还没走啊？我也刚忙完。（看了眼她的屏幕）这表你今天能出吗？明天一早老周要看。"}, {"sp": "林薇", "tx": "这四个渠道的数据，是您下午要核对的。"}, {"sp": "马国栋", "tx": "我下午在外面跑渠道关系，很累。你辛苦一下，年轻人多干点没坏处。（拍拍她肩）我先走了，你也早点回。"}, {"sp": "林薇", "tx": "（看着他的背影）……好。"}, {"sp": "林薇", "tx": "（画外音）那一刻我才明白——有些人的工作不是把事做完，是把\"很忙\"这件事演完。而演出需要道具，道具就是我的加班。"}, {"sp": "林薇", "tx": "（打字，念出声）\"马总，确认一下：今日渠道调整由我代为完成，原因为您下午外出；数据口径按周三例会版本；请回复确认。\"（停了一下）——按邮件留痕。"}, {"sp": "林薇", "tx": "（画外音）我不想跟谁斗。我只是要让事情有迹可循。等到有一天有人问\"这到底是谁做的\"，我不靠争，我靠记录。"}], "know": "本集落点｜\"表演型劳动\"的识别与应对：识别特征——工作过程不可见、成果归属模糊、只有\"时长\"被看见。应对不是揭穿（会先成为靶子），而是把协作过程书面化：谁交办的、谁执行的、口径是什么。留痕不是为了告状，是为了在责任被转移时有据可依。", "shot": "分镜提示：① 电脑房门缝里透出的光和笑声，门外走廊昏暗，对比强烈。② 林薇独自面对三块屏幕的背影，办公室只剩她一盏灯。③ 马国栋拎外套\"疲惫\"走过她工位的瞬间。④ 晨会众人，老周表扬时马国栋低头谦虚笑，林薇抬眼看了一秒。⑤ 电脑屏幕特写：邮件正文与\"发送\"按钮。"}, {"no": 37, "title": "她开始留痕", "meta": "约 105 秒 · 场景：预订部 / 深夜 · 知识：留痕三原则", "scenes": ["场 1　她第一次把口头指令写成确认邮件。", "场 2　她给小马讲了三条。", "场 3　三个月后，这习惯派上了第一次用场。"], "lines": [{"sp": "林薇", "tx": "（打字，轻声念）\"马总，确认一下：今日渠道调整由我代为完成，原因为您下午外出；数据口径按周三例会版本；请回复确认。\""}, {"sp": "小马", "tx": "薇姐，这样是不是太生分了？"}, {"sp": "林薇", "tx": "生分一点没关系。等有一天有人问\"这到底是谁做的\"——我不靠争，我靠记录。"}, {"sp": "林薇", "tx": "第一，当天发。隔一周再补，那叫补材料，不叫记录。"}, {"sp": "林薇", "tx": "第二，只写事实和口径，不写情绪。写\"您让我这么做的\"就够了，别写\"您又不负责任\"。"}, {"sp": "小马", "tx": "为什么？"}, {"sp": "林薇", "tx": "因为一旦写了情绪，它就从\"记录\"变成\"证据\"了。记录是给讲道理的人看的，证据是给吵架用的。我们要的是前者。"}, {"sp": "林薇", "tx": "第三，请他回复。回复了才是确认；不回，也留着——说明我提醒过。"}, {"sp": "马国栋", "tx": "这个月渠道数据不对，谁调的？"}, {"sp": "林薇", "tx": "（平静）我调的，按您 6 月 12 日的邮件要求，口径是周三例会版本。邮件在这儿。"}, {"sp": "马国栋", "tx": "（看了眼屏幕，没再说）"}, {"sp": "林薇", "tx": "（画外音）那次我一句话没多说。我没说\"是您让我做的\"，我只是把邮件放在他看得见的地方。这中间的差别，就是活下来和活不下去的差别。"}], "know": "本集知识点｜留痕三原则：① 当天记录；② 只写事实与口径，不写情绪与评价；③ 请对方回复确认。目的是责任可追溯，而非对抗——语气越平静，它越是可被采信的记录；含情绪则退化为\"吵架材料\"，可信度反而下降。", "shot": "分镜/画面提示：① 女主对着屏幕打字，念出邮件内容，小马在旁。② 她竖起三根手指讲原则，神情认真。③ 三个月后总监质问，女主平静推过屏幕。④ 邮件界面特写，日期与\"请回复确认\"，字幕\"让记录待在看得见的地方\"。"}, {"no": 38, "title": "淡季的三十天", "meta": "约 110 秒 · 场景：会议室 / 大堂 · 知识：需求创造与成本联动", "scenes": ["场 1　七月雨季，出租率 41%。小唐提议降价。", "场 2　她推出三件新产品，每件都针对一群人。", "场 3　月末。出租率 63%，RevPAR 288。"], "lines": [{"sp": "小唐", "tx": "降到 380 吧，总比空着强。"}, {"sp": "林薇", "tx": "降到 380 出租率能到 60%，但 RevPAR 只有 228——比现在的 254 还低。"}, {"sp": "小唐", "tx": "可房子空着啊！"}, {"sp": "林薇", "tx": "空着是亏，贱卖也是亏。淡季降价要做对一件事：降给本来不会来的人。"}, {"sp": "林薇", "tx": "本地微度假包：含下午茶和延迟退房，只卖本市身份证客人，外地客买不到。"}, {"sp": "陈姐", "tx": "那长住包布草三天一换的话，我们排班能省下来，厨房也不用那么早备早餐。"}, {"sp": "林薇", "tx": "对。收益和成本两头一起省——这才叫真的赚到了。"}, {"sp": "小唐", "tx": "那会议日场呢？白天开会，又不占晚上的房。"}, {"sp": "林薇", "tx": "对，日场用的是白天没人用的会议室，晚上房子照样卖。它是白捡的一块。"}, {"sp": "老周", "tx": "（翻报表）比去年高 11%。"}, {"sp": "林薇", "tx": "而且这三件事明年还能用——产品做一次，能用很多年。降价只能用一次，用完就没了。"}, {"sp": "小马", "tx": "所以淡季不是\"等客人来\"，是\"换一批客人来\"？"}, {"sp": "林薇", "tx": "对。需求不会自己长出来，但可以被设计出来。"}], "know": "本集知识点｜淡季的正确动作是创造需求：为新细分市场（本地客、日间会议客、长住客）设计带栅栏的新产品（本地身份证限制、不占夜间库存、按月计费），避免侵蚀原有客源。同时联动成本端（布草、备餐、排班）改善利润。产品可复用，降价只能用一次。", "shot": "分镜/画面提示：① 雨季空荡的大堂，冷清，雨痕在玻璃上。② 女主在白板列三个新产品，各配目标客群标签。③ 大堂下午茶包、会议室日场、长住房三个场景快速切换。④ 月末报表两条曲线同时抬头，字幕\"需求不会自己长出来，但可以被设计出来\"。"}, {"no": 39, "title": "早餐包（上）", "meta": "约 110 秒 · 场景：总监办公室 / 预订部 · 知识：房价代码与手工替代", "scenes": ["场 1　马国栋嫌改 rate code 麻烦，口头交代。", "场 2　回到预订部，她给三个人交代了做法，但加了一句。", "场 3　当晚，她发了那封确认邮件。"], "lines": [{"sp": "马国栋", "tx": "那个含早的价格码，改起来要走系统审批，麻烦。你们手动加个早餐包就行了。"}, {"sp": "林薇", "tx": "手动加容易出错，而且对账的时候查不到来源。"}, {"sp": "马国栋", "tx": "（不耐烦）就按我说的做。赶紧的。"}, {"sp": "林薇", "tx": "……好。那我按您说的执行，回头我发个邮件确认一下流程。"}, {"sp": "马国栋", "tx": "（挥手）随你。"}, {"sp": "林薇", "tx": "按马总要求，手动加早餐包。但你们每加一笔，在备注里写清\"马总口头要求，日期、房间号、金额\"。"}, {"sp": "小夏", "tx": "为什么要写这么细？"}, {"sp": "林薇", "tx": "因为手工加的东西，系统查不到。现在不写，以后谁都说不清。"}, {"sp": "刘芳", "tx": "（小声）那你为什么不拒绝？"}, {"sp": "林薇", "tx": "拒不了。他是总监，做法上确实能省时间。我能做的是让它有痕迹，不是让它不发生。"}, {"sp": "林薇", "tx": "（打字）\"马总，确认：含早产品暂以手动加早餐包方式执行，后续如需改 rate code 请提前通知预订部。请回复确认。\""}, {"sp": "马国栋", "tx": "（回复很快）\"按我说的做。\""}, {"sp": "林薇", "tx": "（看着那六个字，把邮件存进了文件夹）"}, {"sp": "林薇", "tx": "（画外音）我那时候还不知道，这次\"省事\"，会在两周后变成一个必须有人负责的事故。但我至少做对了一件事：那封回信，我留着了。"}], "know": "知识点｜房价代码（Rate Code）是价格的唯一事实来源。用手工加项代替系统码，会同时丢失三样东西：可追溯性、对账一致性、变更可通知性。省下的审批时间，会以差错、对账困难和甩锅纠纷的形式加倍还回去。执行时的最低自保：逐笔备注 + 发确认邮件留痕。", "shot": "分镜/画面提示：① 总监办公室，总监挥手说\"随你\"，女主平静退出。② 预订部三人听交代，女主强调\"每笔都要备注\"。③ 深夜发邮件，屏幕光照脸。④ 邮件回复\"按我说的做\"六个字特写，女主存进文件夹。"}, {"no": 40, "title": "早餐包（下）· 罚单", "meta": "约 110 秒 · 场景：预订部 / 总监办公室 · 人性线：甩锅与责任界定", "scenes": ["场 1　（承接 EP39）前情：马国栋嫌改 rate code 麻烦，口头要求预订部\"手动加早餐包\"。两周后他自己在系统里改了 rate code，没有通知任何人。", "场 2　次日。三笔订单因重复计入早餐产生价格偏差，已被前台及时发现并更正，未对客人造成实际影响。", "场 3　林薇沉默。她打开邮箱，翻出两周前那封\"确认邮件\"——马国栋回了\"按我说的做\"。", "场 4　走廊，小夏松了口气。"], "lines": [{"sp": "小夏", "tx": "薇姐，系统里这个房价代码……昨天还能手动加，今天加了就报错。"}, {"sp": "林薇", "tx": "（查系统）rate code 被改了。什么时候改的？"}, {"sp": "小夏", "tx": "不知道，没人通知我们。"}, {"sp": "林薇", "tx": "那就按原来马总的要求操作——手动加。记录好每一笔，我明天去问。"}, {"sp": "马国栋", "tx": "（拍桌子）这是操作事故！谁让他们还手动加的？我早就改了 rate code！"}, {"sp": "林薇", "tx": "您改了，但没有通知我们。我们是在按您上次的口头要求执行。"}, {"sp": "马国栋", "tx": "系统里改了就是改了，还要我一个个通知？你们自己不看系统吗？"}, {"sp": "林薇", "tx": "rate code 属于价格要素变更。按流程，变更必须通知执行部门。这条流程是您去年签的。"}, {"sp": "马国栋", "tx": "（沉默两秒，语气一转）那流程归流程，出了错就得有人负责。这三笔是你的人操作的，罚单必须下——不然上面问我，我怎么说？"}, {"sp": "林薇", "tx": "马总，客人没有实际损失，前台当场更正了。现在的问题不是损失，是口径不一致。我们可以发一份更正说明，把流程补上。"}, {"sp": "马国栋", "tx": "不行。不下罚单，别人会以为是我的问题。"}, {"sp": "林薇", "tx": "（平静）马总，那封邮件您回过\"按我说的做\"。如果罚单要下，我建议连同这封邮件一起附上，报给 HR 和老周，让他们判断责任怎么分。（停顿）您看呢？"}, {"sp": "马国栋", "tx": "（脸色变了）……你这什么意思。"}, {"sp": "林薇", "tx": "我的意思是：罚单可以下，但责任要按真实的分。我不想挡谁，也不想替谁背。"}, {"sp": "马国栋", "tx": "（长时间沉默，挥手）……算了，这事就这么过去。下不为例。"}, {"sp": "小夏", "tx": "薇姐，你刚才那招……好险。"}, {"sp": "林薇", "tx": "不是招。我只是把\"他让我这么干的\"这件事，提前存好了。"}, {"sp": "林薇", "tx": "（画外音）职场里最狠的一刀，往往不是明着来的——是出了事之后，那个人比你更快地说\"这不是我的问题\"。你唯一能提前准备的，就是记录。"}], "know": "本集落点｜甩锅的识别与反制：甩锅者不在乎\"事情有没有损失\"，只在乎\"责任能不能落到别人头上\"；所以他会坚持走一个对解决问题毫无必要、但能证明自己清白的动作（如坚持下罚单）。反制只有一条：事前留痕、事后主张\"按真实责任分配\"——不告状、不威胁，只要求\"责任按真实情况分清\"。这会让甩锅成本陡增。", "shot": "分镜提示：① 预订部小夏指着屏幕报错窗口，焦急。② 总监办公室拍桌子的瞬间，纸张震动。③ 林薇打开邮箱翻找，屏幕光照在她脸上，冷静。④ 邮件正文特写，红色框标出\"按我说的做\"与回复时间。⑤ 总监挥手说\"算了\"的侧脸，字幕\"你唯一能提前准备的，就是记录\"。"}, {"no": 41, "title": "她成了收益经理", "meta": "约 105 秒 · 场景：会议室 / 预订部 · 知识：身份转换与规则重建", "scenes": ["场 1　任命宣布后的下午。刘芳第一次主动给她倒了杯水。", "场 2　她没有顺着安慰，也没有翻旧账。", "场 3　她把分工表贴在墙上，自己留了最难的一块。"], "lines": [{"sp": "刘芳", "tx": "（把水放下）恭喜。"}, {"sp": "林薇", "tx": "（愣了一下）谢谢。……坐啊。"}, {"sp": "刘芳", "tx": "（没坐）以前我说过你不少闲话。"}, {"sp": "林薇", "tx": "我知道。"}, {"sp": "刘芳", "tx": "那你现在……别整我。"}, {"sp": "林薇", "tx": "我不整任何人。但我要说清楚一件事：以后活儿按规则分，不按关系分。"}, {"sp": "刘芳", "tx": "（不安）那我……"}, {"sp": "林薇", "tx": "对你其实更安全。规则分的好处是：你不用讨好我，我也不用在意你讨不讨好我。"}, {"sp": "林薇", "tx": "你把手上的单子交上来，我按类型和数量重排一遍。你觉得不公，拿表来找我。"}, {"sp": "刘芳", "tx": "（沉默两秒）……行。"}, {"sp": "小马", "tx": "薇姐，你怎么把团队房那块留给自己了？最难谈。"}, {"sp": "林薇", "tx": "因为我把表排出来了，就不能让别人觉得我是\"排表的人\"。"}, {"sp": "小马", "tx": "那不一样吗？"}, {"sp": "林薇", "tx": "不一样。规矩是给所有人的，包括制定规矩的人。这一条要是破了，这张纸就白贴了。"}], "know": "本集知识点｜新任管理者处理历史矛盾的最佳方式：不翻旧账、不施恩惠、直接把协作规则公开化。且规则必须适用于制定者本人——管理者主动承担最难的部分，是\"纸上的规则\"变成\"活的规则\"的前提。", "shot": "分镜/画面提示：① 会议室宣布任命，刘芳慢慢倒水，动作僵硬。② 两人对话，女主平静讲\"按规则分\"，刘芳不安。③ 墙上新贴的分工表，众人围观。④ 女主把自己排在\"团队房\"那栏，字幕\"规矩是给所有人的，包括制定规矩的人\"。"}, {"no": 42, "title": "她挑人的三个标准", "meta": "约 105 秒 · 场景：面试间 · 知识：收益岗位画像", "scenes": ["场 1　面试。HR 推来一份简历：名校、聪明、笔试第一。", "场 2　第二个候选人：普通学校，做过三年预订。", "场 3　HR 不理解她的选择。"], "lines": [{"sp": "HR", "tx": "这个候选人很优秀，笔试第一。"}, {"sp": "林薇", "tx": "（翻简历）我问一个问题——你上一份工作，有没有一次\"改了别人的错\"被记下来的？"}, {"sp": "候选人", "tx": "（愣）……没太注意。"}, {"sp": "林薇", "tx": "那你遇到错的时候一般怎么处理？"}, {"sp": "候选人", "tx": "改过来就行了吧。"}, {"sp": "林薇", "tx": "同样的题。"}, {"sp": "候选人二", "tx": "有。我建了个表，每次价格改错都记一行：谁改的、改错了什么、为什么错。"}, {"sp": "候选人二", "tx": "记了半年，我们组没再犯第二次。"}, {"sp": "林薇", "tx": "为什么想到要记？"}, {"sp": "候选人二", "tx": "因为不记的话，下次还会错，而且没人知道错在哪。"}, {"sp": "HR", "tx": "可第一个更聪明，学东西快。"}, {"sp": "林薇", "tx": "聪明可以教。肯把记录写完，教不了。"}, {"sp": "林薇", "tx": "我要的是\"不会让错误第二次发生的人\"。聪明的人会把错改掉，闭环的人会把错消灭。"}, {"sp": "HR", "tx": "（记下）……明白了。"}], "know": "本集知识点｜收益岗位的核心素养不是\"算得快\"，而是对差错的闭环处理：记录 → 归因 → 防再犯。招聘画像应优先\"闭环习惯\"，其次才是分析能力。纠错者只消灭一次错误，闭环者消灭一类错误。", "shot": "分镜/画面提示：① 面试间两位候选人正反打，第一位答不上，第二位翻开自己做的表。② 表格特写：日期/改错人/错因/防再犯措施。③ HR 与女主对话，女主平静解释。④ 字幕\"聪明的人把错改掉，闭环的人把错消灭\"。"}, {"no": 43, "title": "带团队最难的一课", "meta": "约 105 秒 · 场景：办公室 / 咖啡厅 · 知识：培养与流失的悖论", "scenes": ["场 1　她花了半年带出来的下属，跳槽去了对手酒店。", "场 2　咖啡厅，那个离职的下属请她喝咖啡。", "场 3　回到办公室，她改了培养方式。"], "lines": [{"sp": "小马", "tx": "薇姐，你还教吗？教一个走一个。"}, {"sp": "林薇", "tx": "教。"}, {"sp": "小马", "tx": "为什么啊，白教了。"}, {"sp": "林薇", "tx": "因为不教，留下的都是学不会的人。那样的团队看着稳定，其实一碰就碎。"}, {"sp": "下属", "tx": "林姐，我对不起你。您教了我那么多，我还是走了。"}, {"sp": "林薇", "tx": "（笑）你去那边，薪资涨多少？"}, {"sp": "下属", "tx": "（不好意思）涨四成。"}, {"sp": "林薇", "tx": "那很好。你值那个价，是我这儿给不起。给不起不是你走了，是我这儿的位置没那么多。"}, {"sp": "下属", "tx": "（眼眶红）他们还让我把您教的那套方法带过去……"}, {"sp": "林薇", "tx": "带过去。能被别人要走的，说明它有用。怕的是教会了没人要，不是教会了被人要。"}, {"sp": "林薇", "tx": "以后每个人带的东西，至少要带两个人会。一个人学会了走了，还有两个人。"}, {"sp": "小马", "tx": "那不是更容易被挖走？"}, {"sp": "林薇", "tx": "是。但知识沉在一个人身上，他的议价权就比你大；沉在三个人身上，你们是互相抬价的。"}, {"sp": "林薇", "tx": "（画外音）那是我第一次明白：培养不是把本事给一个人，是把本事变成这个团队的一部分。"}], "know": "本集知识点｜培养与流失的悖论解法：① 把\"教会\"视为能力验证——能被市场认可的方法才是有价值的方法；② 用梯队而非个人承载能力——关键能力至少三人掌握，知识沉在团队而非个人身上，降低单点流失冲击并改变议价结构。", "shot": "分镜/画面提示：① 办公室女主平静说\"教\"，小马不解。② 咖啡厅两人对坐，下属低头道歉，女主笑着倒咖啡。③ 女主改培养方式的笔记特写：\"至少要带两个人会\"。④ 字幕\"培养不是把本事给一个人，是变成团队的一部分\"。"}, {"no": 44, "title": "被挪走的培训名额", "meta": "约 100 秒 · 场景：总监办公室 · 人性线：资源与人脉", "scenes": ["场 1　林薇拿着培训通知，找马国栋签字。", "场 2　走廊。小唐低声告诉她实情。", "场 3　她回到工位，打开电脑做了一件事——把这次培训的课程大纲找到，自己学。", "场 4　半年后。阿杰拿着结业证，却答不出一个最基础的问题。"], "lines": [{"sp": "林薇", "tx": "马总，这个收益管理进阶班，名额确认给我了，要您签字。"}, {"sp": "马国栋", "tx": "（看了眼，放下笔）这个……今年给阿杰吧。"}, {"sp": "林薇", "tx": "（愣）给阿杰？他是前厅经理，这是收益管理的班。"}, {"sp": "马国栋", "tx": "我知道。前厅也要懂收益嘛，跨部门培养。（笑）你是经理了，以后机会多。"}, {"sp": "林薇", "tx": "这个班一年只开一期，讲师是集团请的。我等了两年。"}, {"sp": "马国栋", "tx": "（语气转硬）林薇，安排工作要看全局。阿杰那边前厅和收益配合得多，他去更合适。"}, {"sp": "小唐", "tx": "你知道吗，阿杰的姐夫在集团市场部。"}, {"sp": "林薇", "tx": "……所以？"}, {"sp": "小唐", "tx": "马总想往市场销售总监上走。这个名额给阿杰，是给他姐夫那边递个话。"}, {"sp": "林薇", "tx": "（沉默很久）所以我两年的等待，是他的一次人情。"}, {"sp": "林薇", "tx": "（画外音）那天我明白了一件事：在他那里，培训名额不是\"给谁学\"，是\"给谁做人情\"。我不能改变他怎么分配，但我能改变我怎么学。"}, {"sp": "林薇", "tx": "（打字）大纲拿到了，课件问阿杰要——他上完课，课件总该有。"}, {"sp": "林薇", "tx": "（画外音）后来我用那套课件，自己把那门课学完了。他抢走的是名额，抢不走的是内容。"}, {"sp": "阿杰", "tx": "那个……置换分析怎么算来着？"}, {"sp": "林薇", "tx": "（平静）你不是上过那个班吗。"}, {"sp": "阿杰", "tx": "（尴尬）我……我没太听懂。"}, {"sp": "林薇", "tx": "我给你讲。讲完你记一下，下次别再问了。"}], "know": "本集落点｜识别\"资源被挪作人情\"：看受益人与决策人的利益关系，而非看官方理由（\"跨部门培养\"往往是托词）。应对分两层：① 短期——绕过资格去拿内容（课件、大纲、同学），资格可以被拿走，知识不会；② 长期——把能力长在自己身上，让资格变得不重要。", "shot": "分镜提示：① 总监办公室，培训通知单放在桌上，笔被放下，气氛微妙。② 走廊小唐压低声音说话，两人侧影，光影斑驳。③ 林薇深夜独自对着屏幕看课程大纲，台灯暖光。④ 半年后阿杰尴尬挠头，林薇平静讲解，字幕\"他抢走的是名额，抢不走的是内容\"。"}, {"no": 45, "title": "她看懂了那盘棋", "meta": "约 110 秒 · 场景：办公室 · 知识：组织政治的识别", "scenes": ["场 1　林薇在白板上画关系图，小马看不懂。", "场 2　她一条条连线。", "场 3　小马问了个更实在的问题。"], "lines": [{"sp": "小马", "tx": "薇姐你画什么呢？"}, {"sp": "林薇", "tx": "画马总的晋升路径。他要做市场销售总监，需要三票：销售、前厅、集团那边有人。"}, {"sp": "小马", "tx": "那跟我们有什么关系？"}, {"sp": "林薇", "tx": "有关系。他做的每一个业务决定，你都该问一句：这对他的路径有没有用？"}, {"sp": "林薇", "tx": "给前厅培训名额——为前厅那边的人情；给销售开绿灯——为销售那票；压低房价保出租率——出租率好看，他的报表好看。"}, {"sp": "小马", "tx": "那……他做的事对公司全是坏的？"}, {"sp": "林薇", "tx": "不是。有些对公司也有好处，比如他确实在保量。坏的是：当\"对他有用\"和\"对公司有用\"冲突时，他会选前者。"}, {"sp": "小马", "tx": "所以我们怎么办？"}, {"sp": "林薇", "tx": "不跟着他的路径走。我们只走业务那条路。"}, {"sp": "小马", "tx": "可他会挡我们啊。"}, {"sp": "林薇", "tx": "会。所以我们要做两件事：一、把账算清楚，让数据替我们说话；二、把过程留下来。"}, {"sp": "林薇", "tx": "他挡一次，我们留一次。到最后，账和记录会站在我们这边。业务对了，账算得清，谁都绕不过去。"}], "know": "本集知识点｜识别组织政治：把决策与决策人的利益路径对照。若一项业务决定反复\"恰好\"服务于某人的晋升资源，它就不再是业务判断。应对不是加入棋局，而是坚守业务口径并留下数据与过程记录——让账和记录成为最终裁判。", "shot": "分镜/画面提示：① 女主在白板画人物关系连线图，箭头交错。② 她一条条解释，小马越听越明白。③ 女主讲\"他挡一次我们留一次\"时的正面特写。④ 白板上红字\"业务那条路\"，字幕\"账和记录会站在我们这边\"。"}, {"no": 46, "title": "渠道里的那道缝", "meta": "约 110 秒 · 场景：会议室 · 知识：净价与渠道结构", "scenes": ["场 1　月度会。老周指着渠道占比表。", "场 2　小唐急着要下架。", "场 3　三个月后，OTA 占比回到 27%。"], "lines": [{"sp": "老周", "tx": "OTA 占比 34%，去年 20%。为什么？"}, {"sp": "小唐", "tx": "他们给流量啊，不上客人搜不到我们。"}, {"sp": "林薇", "tx": "流量是真的。但我们付了多少？挂 700，抽 15%，到手 595，还要给积分。官网同样 700，到手 700。"}, {"sp": "老周", "tx": "差多少？"}, {"sp": "林薇", "tx": "105 一间。一个月 3000 间夜，31 万。"}, {"sp": "小唐", "tx": "那下架！"}, {"sp": "林薇", "tx": "不能下。很多客人在 OTA 上看见我们，再去官网订——它是招牌。"}, {"sp": "小唐", "tx": "招牌这么贵？"}, {"sp": "林薇", "tx": "贵。但我们要的不是砍掉它，是别让它变成唯一入口。现在是客人只能想起它，不是想起我们。"}, {"sp": "林薇", "tx": "三条一起做：官网会员价比它低 30；协议客户转直销；砍掉量小抽成高的小平台。"}, {"sp": "老周", "tx": "（翻报表）到 27% 了。"}, {"sp": "林薇", "tx": "还能再压，但我不建议压到 20% 以下。"}, {"sp": "老周", "tx": "为什么？"}, {"sp": "林薇", "tx": "因为留着的这部分，大部分是真正的增量——那些只会从 OTA 来的客人。压太狠，我们连那部分也丢。"}, {"sp": "林薇", "tx": "（画外音）很多人以为渠道管理就是\"把 OTA 压到最低\"。其实是要找到那个点：再多一间是成本，再少一间是损失。"}], "know": "本集知识点｜OTA 的双重角色：获客与分流并存。策略不是下架，而是调结构（官网价差、协议直销、收缩低效平台）。最优占比不是最低——压得过低会失去真正的增量客源；目标是找到\"再多一间是成本、再少一间是损失\"的临界点。", "shot": "分镜/画面提示：① 会议室渠道饼图，OTA 板块明显偏大，红色标注。② 女主讲\"它是招牌\"时的手势。③ 三条对策写在白板上。④ 三个月后饼图缩小，女主说\"还能再压但不宜\"，字幕\"再多一间是成本，再少一间是损失\"。"}, {"no": 47, "title": "会员价这道门", "meta": "约 105 秒 · 场景：会议室 / 大堂 · 知识：直销价差设计", "scenes": ["场 1　林薇提出官网会员价比 OTA 低 30。小唐反对。", "场 2　推广期很难，第一个月只有 40 个会员。", "场 3　半年后，直销占比从 38% 涨到 55%。"], "lines": [{"sp": "小唐", "tx": "会员价比 OTA 便宜？那 OTA 更没人订了，量从哪来？"}, {"sp": "林薇", "tx": "对，那正是我要的。"}, {"sp": "小唐", "tx": "（瞪眼）你疯了？"}, {"sp": "林薇", "tx": "（算）少收 30，但省了 105 的佣金。净价反而高 75。"}, {"sp": "林薇", "tx": "而且我们要的不是这一间，是客人\"直接来找我们\"的习惯。习惯一旦养成，能省很多年。"}, {"sp": "小马", "tx": "才 40 个……"}, {"sp": "林薇", "tx": "40 个够用了。我要的是知道他们为什么注册。"}, {"sp": "林薇", "tx": "（翻记录）这 40 个里，31 个是从 OTA 页面过来的——他们在 OTA 看到我们，又去搜了官网。说明招牌是真的在起作用。"}, {"sp": "林薇", "tx": "下一步：前台每办一次入住就问一句\"您注册了吗\"。不是推销，是提醒。"}, {"sp": "老周", "tx": "（翻报表）55% 了。"}, {"sp": "林薇", "tx": "而且这 55% 里，有 40% 是老客回头。他们会自己来，不用我们再付一次佣金。"}, {"sp": "小唐", "tx": "（服气）我当时说你疯了。"}, {"sp": "林薇", "tx": "（笑）你当时说的是对的——短期确实少了量。只是我们算的是三年，不是三个月。"}], "know": "本集知识点｜直销价差设计：让利幅度 （让 30 省 105）。目标是形成\"直接预订习惯\"这一长期资产，而非短期提量。推广要追踪会员来源验证路径，并在前台做轻提醒（不推销）。评估周期应以年计。", "shot": "分镜/画面提示：① 会议室小唐瞪眼质疑，女主平静算账。② 屏幕上会员注册数：40，女主翻看来源记录。③ 前台对客人轻声提醒注册的近景。④ 半年后直销占比 55% 的走势图，字幕\"我们算的是三年，不是三个月\"。"}, {"no": 48, "title": "协议客户的转向", "meta": "约 105 秒 · 场景：销售部 · 知识：协议客户直销化", "scenes": ["场 1　林薇和小唐第一次坐在一边谈。", "场 2　她陪小唐去见第一家客户。", "场 3　半年，40 家转了 26 家。"], "lines": [{"sp": "林薇", "tx": "你手上那 40 家协议公司，有多少是走 OTA 订的？"}, {"sp": "小唐", "tx": "（翻本子）差不多一半。他们习惯那么订。"}, {"sp": "林薇", "tx": "给他们一个专用码，价格跟 OTA 一样，但他们多拿积分，我们能直接联系。"}, {"sp": "小唐", "tx": "（犹豫）那我成了抢 OTA 生意的人。"}, {"sp": "林薇", "tx": "不。你是那个把客户从平台手里拿回来的人。这两句话，说出去效果完全不一样。"}, {"sp": "客户", "tx": "走 OTA 挺好的啊，还能攒平台的积分。"}, {"sp": "林薇", "tx": "我们给您同样积分，另外三件事：您公司的人订房不用垫付、月底一张发票对账、临时用房我们优先留。"}, {"sp": "客户", "tx": "（想了想）……那对账确实省事。行。"}, {"sp": "小唐", "tx": "（出门，兴奋）成了！"}, {"sp": "林薇", "tx": "成了。你记住他为什么答应——不是因为便宜，是因为省了他的事。"}, {"sp": "小唐", "tx": "还有 14 家不肯转。"}, {"sp": "林薇", "tx": "不急。那 14 家是行政图方便，等他们哪次报销出问题，自然会来找你。"}, {"sp": "小唐", "tx": "（笑）你这招损。"}, {"sp": "林薇", "tx": "不损。我们只是把更好的选项放在那儿，等他自己来拿。强推的东西，客户会用一次就丢。"}], "know": "本集知识点｜协议客户直销化：不降价，用附加价值换迁移（专属积分、免垫付、统一对账、优先留房）。关键是让销售成为受益方（客户关系更稳），且谈判要针对客户真实痛点（对账/报销），而非价格。不急于全覆盖。", "shot": "分镜/画面提示：① 销售部两人第一次并肩看客户名单。② 客户办公室三人谈，女主讲\"月底一张发票\"。③ 出门后小唐兴奋，女主提醒\"他是为了省事\"。④ 半年后名单上 26 家打勾，字幕\"把更好的选项放在那儿\"。"}, {"no": 49, "title": "对面降价了", "meta": "约 110 秒 · 场景：预订部 · 知识：竞争集与跟价判据", "scenes": ["场 1　小唐冲进来报消息，林薇先看数据。", "场 2　她把数据摊开。", "场 3　三天后，结果出来了。"], "lines": [{"sp": "小唐", "tx": "对面 A 从 880 降到 780！跟不跟？"}, {"sp": "林薇", "tx": "先看三件事：降到什么时候、降了多少间、他自己还剩多少房。"}, {"sp": "小唐", "tx": "这么麻烦？"}, {"sp": "林薇", "tx": "麻烦是为了别跟错。跟价是能摧毁价格锚点的动作，跟错一次，涨回来要三个月。"}, {"sp": "林薇", "tx": "只降了周三到周五，只放 30 间。挂牌价没动。这是试探性放价，不是全面降价。他在试需求。"}, {"sp": "小唐", "tx": "万一他就是想抢我们客人呢？"}, {"sp": "林薇", "tx": "那要看我们自己的进度。下周三我们已经 85%，只剩 45 间，本来就是留给晚订高价客的。"}, {"sp": "林薇", "tx": "他降到 780，说明他那天只有 60%——他的需求比我们差。我们跟着一个比自己差的人降什么？"}, {"sp": "小唐", "tx": "（佩服）真没跟。我们满房了，他最后一天还在 60%。"}, {"sp": "林薇", "tx": "所以记住三条：他全面且持续降、我们进度落后、客群高度重叠。至少中两条才考虑跟。"}, {"sp": "小马", "tx": "那要是三条都中了？"}, {"sp": "林薇", "tx": "那就跟——但跟一部分，不跟全部。留一档高价在那儿，等他涨回来的时候，我们还有东西接着。"}], "know": "本集知识点｜应对竞品降价看三维度：时间范围 / 数量（试探还是全面）/ 对手在手进度。跟价需至少满足两条判据：对手全面且持续降、我方进度落后、客群高度重叠。即使三条全中，也应部分跟进而非全面跟进，保留高价档位以便回升。", "shot": "分镜/画面提示：① 小唐冲进来报消息，女主不抬头先看数据。② 屏幕上竞品价格表，部分日期被黄色高亮。③ 女主讲三条判据，边说边在纸上画勾。④ 三天后两家出租率对比，字幕\"跟着一个比自己差的人降什么\"。"}, {"no": 50, "title": "她做了一次价格实验", "meta": "约 105 秒 · 场景：预订部 / 会议室 · 知识：价格弹性测量", "scenes": ["场 1　连续六周小步调价，林薇画出一条曲线。", "场 2　六周后，曲线出来了。", "场 3　她把这条线用在了下一次满房。"], "lines": [{"sp": "小马", "tx": "薇姐，我们这是在赌吗？"}, {"sp": "林薇", "tx": "不是赌。是每次只动一点，然后看它往哪边走。"}, {"sp": "小马", "tx": "那要是走错了呢？"}, {"sp": "林薇", "tx": "走错了就退回来。一次只动 3%，错了也就少赚 3%，不会伤筋动骨。"}, {"sp": "林薇", "tx": "（指图）涨 3%，量掉 2%；涨 5%，量掉 4%；涨 8%，量掉 15%。"}, {"sp": "小马", "tx": "所以……"}, {"sp": "林薇", "tx": "所以这家酒店的价格弹性，大概在 5% 到 8% 之间有个坎。过了那个坎，客人就真的不来了。"}, {"sp": "林薇", "tx": "这条线叫需求曲线。每家酒店都有一条，但很少有人真的去画它。"}, {"sp": "小唐", "tx": "展会来了，涨多少？"}, {"sp": "林薇", "tx": "按平时的价，涨 6%。"}, {"sp": "小唐", "tx": "才 6%？别人都涨一倍了！"}, {"sp": "林薇", "tx": "别人涨一倍是因为他们知道会有人来。我们涨 6%，是因为我们知道涨到 8% 客人会跑。剩下的靠限制条件拿，不靠价格。"}, {"sp": "林薇", "tx": "（画外音）后来每次有人问我\"该涨多少\"，我都不给数。我只问一句：你知道自己的曲线吗？"}], "know": "知识点｜价格弹性通过小步试探 + 记录销量响应测得。价值是让定价从\"凭经验猜\"变成\"有据可依\"——知道量开始明显下滑的临界价位。小步试探使错误成本可控；测出弹性后，超额需求应更多用限制条件（MinLOS/团队门槛）而非价格来消化。", "shot": "分镜/画面提示：① 女主在小步调价的表格前，每周记录一行。② 曲线图逐渐成型，过某点后陡然下行，红圈标注。③ 下一次满房时她说\"涨 6%\"，小唐瞪眼。④ 字幕\"你知道自己的曲线吗\"。"}, {"no": 51, "title": "民宿来了", "meta": "约 110 秒 · 场景：会议室 · 知识：替代品与非标供给", "scenes": ["场 1　周末家庭客连续三个月下滑。林薇带着数据开会。", "场 2　她列出了三件\"它做不到\"的事。", "场 3　三个月后，周末家庭客回来了。"], "lines": [{"sp": "林薇", "tx": "不是我们变贵了，是客人有了别的选择。周边出现大量整租公寓，两居一厅，一家四口住正好，还能做饭。"}, {"sp": "小唐", "tx": "那就降价啊，把它打回去。"}, {"sp": "林薇", "tx": "打不过。它的成本结构跟我们不一样——没有大堂、没有前台、没有布草系统。我们跟它拼价格，是拿自己的短处去拼。"}, {"sp": "林薇", "tx": "早餐、安全、前台能解决问题、发票、会员权益、品质稳定。"}, {"sp": "陈姐", "tx": "还有——半夜孩子发烧，我们前台能帮着叫车。它那儿没有人。"}, {"sp": "林薇", "tx": "（记下）对，这条最实在。家庭客最怕的不是贵，是出事没人管。"}, {"sp": "林薇", "tx": "所以产品是：周末家庭包，含早餐、含儿童用品、含\"夜间应急\"承诺。"}, {"sp": "小唐", "tx": "真回来了。"}, {"sp": "林薇", "tx": "而且均价没降。我们没跟它拼价格，我们拼的是\"出事有人管\"。"}, {"sp": "小马", "tx": "那它那边呢？"}, {"sp": "林薇", "tx": "还在。客人分层了：图便宜的去它那儿，带孩子、怕麻烦的来我们这儿。这没什么不好，市场本来就不是只能有一个。"}], "know": "本集知识点｜面对非标替代品，价格战通常是错误武器（成本结构不同）。正确做法是识别自身不可替代的能力（服务响应、合规、品质稳定、应急能力），并针对目标客群的真实痛点（如家庭客的\"出事有人管\"）重组产品。结果通常是市场分层而非取代。", "shot": "分镜/画面提示：① 会议室屏幕上周末家庭客曲线持续下滑。② 女主列出\"它做不到\"的三件事，白板字迹。③ 客房主管补的那句\"半夜孩子发烧\"，众人动容。④ 三个月后曲线回升，字幕\"我们拼的是出事有人管\"。"}, {"no": 52, "title": "减员", "meta": "约 110 秒 · 场景：会议室 / 预订部 · 人性线：自私的\"降本\"", "scenes": ["场 1　季度会。马国栋宣布\"人效优化\"。", "场 2　两个月后，预订部。加班成为常态，气氛崩坏。", "场 3　季度末。奖金发放：预订部减员省下的工资预算，变成\"部门奖金\"发下——大头归部门负责人。", "场 4　林薇带着一份测算，去找老周。"], "lines": [{"sp": "马国栋", "tx": "集团要求提人效。预订部今年减两个人——从 8 个变 6 个。工作量重新分一下。"}, {"sp": "林薇", "tx": "马总，我们现在的日订单量比三年前多 40%，渠道也多了三个。减两个人，剩下的人扛不住。"}, {"sp": "马国栋", "tx": "系统会自动处理大部分订单。人效就是这么提的。"}, {"sp": "林薇", "tx": "系统处理常规订单，非常规的恰恰是最耗人的——改期、特殊要求、团队分房、超售兜底。"}, {"sp": "马国栋", "tx": "（摆手）先试一个季度。省下的预算，部门还能拿奖金，大家都受益。"}, {"sp": "小夏", "tx": "（趴在桌上）薇姐，我这周加了四天，我男朋友说我别干了。"}, {"sp": "刘芳", "tx": "我昨天把两间房的房型搞混了，客人到店才发现。以前不会的……我现在看什么都糊。"}, {"sp": "林薇", "tx": "（沉默）……差错率我记着。"}, {"sp": "赵姐", "tx": "（压低声音）你知道马经理这个季度奖金拿了多少吗？比省下的工资还多一截。"}, {"sp": "林薇", "tx": "……他把人减了，把钱发给了自己。"}, {"sp": "林薇", "tx": "周总，减员两个月的数据在这：加班费涨了 1.8 万，差错导致的赔付与补偿 2.3 万，两个离职的招聘与培训成本约 4 万，熟练期产能损失还没算。"}, {"sp": "老周", "tx": "省了多少工资？"}, {"sp": "林薇", "tx": "两个月省 3.2 万。已经花出去的超过 8 万，还有两个岗位空着。"}, {"sp": "老周", "tx": "（翻着数据，沉默）……这事他知道吗？"}, {"sp": "林薇", "tx": "他拿的是省下来的那部分奖金。"}, {"sp": "老周", "tx": "（合上文件）你把这份东西留着。别声张。"}], "know": "本集落点｜\"减员降本\"最常见的失真：只算省下的工资，不算新增的加班费、差错赔付、招聘与培训成本、熟练期产能损失、以及流失带来的服务质量下降。真正的判据是\"总成本\"而非\"人力成本\"。当\"省下的钱变成管理者自己的奖金\"时，激励已经扭曲——省得越多他拿得越多，哪怕公司在亏。", "shot": "分镜提示：① 会议室宣布减员，众人低头，林薇抬头质疑，构图对比。② 预订部深夜加班，多人趴桌，冷光，疲惫感。③ 工资条/奖金单特写，数字被红笔圈出。④ 老周翻文件的手与紧绷的表情，字幕\"只算省下的工资，不算花出去的代价\"。"}, {"no": 53, "title": "小夏离职那天", "meta": "约 110 秒 · 场景：预订部 · 知识：压垮与告别", "scenes": ["场 1　小夏把工位收拾得很干净，只留下一个纸箱。", "场 2　两个人站在工位旁，说了很多。", "场 3　抱起箱子，走向门口。"], "lines": [{"sp": "林薇", "tx": "真的不再想想？我再去谈一次人手。"}, {"sp": "小夏", "tx": "（摇头）薇姐，不是人手的事。是我每天来上班，不知道今天又要替谁做什么。"}, {"sp": "林薇", "tx": "（沉默）"}, {"sp": "小夏", "tx": "上周五我加完班，电梯里碰到刘芳姐，她说\"又加班啊\"。就那一句，我忽然就撑不住了。"}, {"sp": "林薇", "tx": "是我没护住你们。"}, {"sp": "小夏", "tx": "不是你。你护过我们好多次，我们都知道。但你能护住我们不被骂，护不住我们不被使唤。"}, {"sp": "小夏", "tx": "那不一样。被使唤是每天的，你挡不住每一天。"}, {"sp": "林薇", "tx": "（记笔记）……\"护得住被骂，护不住被使唤\"。"}, {"sp": "小夏", "tx": "薇姐，你别变成他们那样。这是我们几个私下说得最多的一句话——我们都怕你变成他们那样。"}, {"sp": "林薇", "tx": "（站在原地很久）"}, {"sp": "林薇", "tx": "（画外音）那天晚上我一个人坐在办公室。我第一次承认：我不是被对手打败的，我是被自己人耗走的。而我连她都留不住。"}], "know": "本集知识点｜团队对管理者的真实期待往往不是\"更会争取\"，而是\"别变成他们那样\"——即在结构性不公中保持可预期的公正。这是管理者最容易低估、也最容易失去的东西。保护有上限：能挡住冲突，挡不住日常的消耗。", "shot": "分镜/画面提示：① 小夏把工位擦干净，只留一个纸箱，动作平静。② 两人站在工位旁对话，小夏说\"你护不住我们不被使唤\"。③ 女主低头记笔记的手。④ 小夏抱箱走向门口的背影，女主站在原地，字幕\"我是被自己人耗走的\"。"}, {"no": 54, "title": "她算了一笔账", "meta": "约 110 秒 · 场景：总经理办公室 · 知识：总成本视角", "scenes": ["场 1　林薇把一页测算放在老周桌上。", "场 2　老周翻着那页纸，问了个关键问题。", "场 3　她把这份测算做成了一张\"流失成本表\"。"], "lines": [{"sp": "老周", "tx": "这是什么？"}, {"sp": "林薇", "tx": "减员两个月，我们付出了多少。加班费 1.8 万，差错赔付 2.3 万，两个离职的招聘培训约 4 万，熟练期产能损失还没算。"}, {"sp": "老周", "tx": "省了多少？"}, {"sp": "林薇", "tx": "工资省 3.2 万。已花出去的超过 8 万，还有两个岗位空着。"}, {"sp": "老周", "tx": "熟练期产能损失，你怎么不写个数？"}, {"sp": "林薇", "tx": "因为不好算。但您可以想：新人上手要三个月，这三个月他做的事只有熟手的一半。这两个岗位空着，等于我们每天少掉一个人的产出。"}, {"sp": "老周", "tx": "（沉默）……这份东西你留着。别声张。"}, {"sp": "林薇", "tx": "我不声张。我只是想让您知道，省下来的钱没有真的省下来。"}, {"sp": "小马", "tx": "薇姐，你做这个表有什么用？又不能把人变回来。"}, {"sp": "林薇", "tx": "不能。但下次再有人提\"减员提人效\"，我可以把这张表拿出来。"}, {"sp": "林薇", "tx": "吵架赢不了，因为没有数字。有了数字，都不用吵。"}], "know": "本集知识点｜人力\"降本\"必须算总成本：加班费 + 差错赔付 + 招聘培训 + 熟练期产能损失 + 服务质量下降。只看工资项会得出完全相反的结论。把成本做成可复用的表，能在下次决策时用数据替代争论。", "shot": "分镜/画面提示：① 一页测算被放在桌上，手指推过去。② 老周逐行看，眉头越皱越紧。③ 女主说\"省下来的钱没有真的省下来\"。④ 流失成本表格特写，五项加总，字幕\"有了数字，都不用吵\"。"}, {"no": 55, "title": "回扣", "meta": "约 110 秒 · 场景：办公室 / 数据分析 · 人性线：利益输送", "scenes": ["场 1　林薇盯着一组数据，眉头越皱越紧。", "场 2　她把某 OTA 平台的数据单独拉出来。", "场 3　她去找马国栋，用业务理由试探。", "场 4　当晚，她把过去 18 个月这家平台的价格、份额、与马国栋的审批记录，按时间线整理成一份文档。"], "lines": [{"sp": "林薇", "tx": "（自语）奇怪。竞品 A、B、C 今年均价都在涨，我们却在跌。出租率差不多，渠道结构差不多……"}, {"sp": "小马", "tx": "会不会是我们产品旧了？"}, {"sp": "林薇", "tx": "产品旧，跌 8% 说得通，跌 14% 说不通。（打开另一张表）而且你看——每次我要抬价，马总都压回来，理由是\"稳住出租率\"。可出租率一直稳在 70 以上，根本不需要这么低的价格。"}, {"sp": "林薇", "tx": "这个平台我们给的价，比另外两家低 60。它的份额却涨得最快。"}, {"sp": "林薇", "tx": "（停顿）……给客人看的最低价，是一家我们主动压低了的平台。然后所有人都拿这个价来比价。（抬眼）我们不是在跟市场竞价，我们是在跟自己压出来的价竞价。"}, {"sp": "林薇", "tx": "马总，这家平台的价格我想往上收 60，跟另外两家对齐。"}, {"sp": "马国栋", "tx": "（反应很快）不行。这家给我们量大，动了会掉量。"}, {"sp": "林薇", "tx": "可它的净价最低，佣金也最高。量大是因为我们给它的价最低，不是它本事大。"}, {"sp": "马国栋", "tx": "（语气转冷）林薇，渠道关系是要维护的。你别总想着动价格。"}, {"sp": "林薇", "tx": "（点头）好，我先不动。（转身，心里明白了七八分）"}, {"sp": "林薇", "tx": "（画外音）我不能凭猜想去告人。我只能把事实摆成一条线，让看的人自己得出结论。"}, {"sp": "林薇", "tx": "（打字）\"异常点一：该平台挂牌价长期低于其他渠道 60 元，与量、佣均无合理对应。异常点二：三次提价申请被同一人否决，理由与数据不符。\""}, {"sp": "林薇", "tx": "（画外音）这份东西我先放着。不到非用不可，我不会拿出来。因为拿出来我就不能回头了。"}], "know": "本集落点｜ADR 异常归因的正确顺序：与竞争集对比 → 拆出租率与均价 → 查渠道结构 → 查价格审批记录。当\"某渠道价格长期偏离且无业务理由、提价被同一人反复否决\"时，要警觉利益输送。应对原则：用业务语言提建议（留下记录）→ 收集事实而非猜测 → 不擅自摊牌，等有权处理的人需要时再拿出来。", "shot": "分镜提示：① 深夜办公室，屏幕上四条曲线，其中一条明显走低，女主皱眉。② 数据透视：某平台价格柱状图明显低于其他两家，红色标注。③ 总监办公室，女主提建议、总监快速否决的对话正反打。④ 文档时间线界面，一条条异常被列出，字幕\"让看的人自己得出结论\"。"}, {"no": 56, "title": "数据里那根刺", "meta": "约 110 秒 · 场景：深夜办公室 · 知识：异常检测", "scenes": ["场 1　林薇把自家与竞争集的 ADR 曲线叠在一张图上。", "场 2　她把三条证据并列。", "场 3　她没有立刻行动。"], "lines": [{"sp": "林薇", "tx": "（自语）竞品都在涨，我们在跌。出租率差不多，渠道结构差不多……"}, {"sp": "小马", "tx": "会不会是我们产品旧了？"}, {"sp": "林薇", "tx": "产品旧，跌 8% 说得通，跌 14% 说不通。"}, {"sp": "林薇", "tx": "而且——每次我要抬价，都被压回来，理由是\"稳住出租率\"。可出租率一直 70 以上，根本不需要这么低的价格。"}, {"sp": "林薇", "tx": "一、我们跌，竞品涨；二、出租率没掉；三、提价申请被同一个人反复否决。"}, {"sp": "小马", "tx": "这说明什么？"}, {"sp": "林薇", "tx": "说明数据和理由对不上。"}, {"sp": "林薇", "tx": "当数据和给的理由对不上，问题通常不在数据里，在给理由的人那里。"}, {"sp": "小马", "tx": "那你现在去问他？"}, {"sp": "林薇", "tx": "不。问了他就会改说法，然后我永远拿不到真的东西。"}, {"sp": "林薇", "tx": "（打字）\"异常点一：该渠道挂牌价长期低于其他渠道 60 元，与量、佣均无合理对应。异常点二：三次提价申请被同一人否决，理由与数据不符。\""}, {"sp": "林薇", "tx": "（画外音）这份东西我先放着。不到非用不可，我不会拿出来。因为拿出来我就不能回头了。"}], "know": "本集知识点｜异常检测的第一步是与竞争集横向对比（而非只看自身同比）。三条并列证据：我方与竞品走势背离、量未下滑、提价被同一人反复否决 → 当数据与官方解释持续不符时，要警觉人为因素。应对上不急于摊牌（会促使对方改变说辞），而是持续记录。", "shot": "分镜/画面提示：① 屏幕上两条曲线，一条上行一条下行，女主皱眉。② 她把三条证据并列写在纸上，逐条画勾。③ 女主打字记录异常点，屏幕光照脸。④ 字幕\"当数据和理由对不上，问题在给理由的人那里\"。"}, {"no": 57, "title": "绿灯", "meta": "约 110 秒 · 场景：预订部 / 销售部 · 人性线：关系型资源分配", "scenes": ["场 1　旺季前的资源协调会。王莉（销售）要一批房。", "场 2　会后，王莉把一叠确认单放在预订部桌上。", "场 3　晚上九点，预订部三个人在录单。小马忍不住了。", "场 4　三个月后，月度会上，那份汇总被老周看到。"], "lines": [{"sp": "王莉", "tx": "展会那三天我要留 60 间，给几个大客户。"}, {"sp": "林薇", "tx": "那三天预测出租率 92%，散客均价 820。你要 60 间按 600 锁，置换算下来我们亏。"}, {"sp": "王莉", "tx": "（笑）可是这几个客户是我跟了一年才拿下的。"}, {"sp": "马国栋", "tx": "（插话，语气轻松）给王莉留吧。客户资源要维护。"}, {"sp": "林薇", "tx": "马总，置换分析我上周发过您邮件。"}, {"sp": "马国栋", "tx": "看了。但你那个算法太理想了——散客哪有那么确定。"}, {"sp": "林薇", "tx": "（停顿）上个月给小唐的团队，您用的是同一套算法，说\"风险太高不能接\"。"}, {"sp": "马国栋", "tx": "（脸色一沉）情况不一样。"}, {"sp": "王莉", "tx": "（对预订员，语气随意）这些今晚要录完，客户明早要确认。辛苦你们加个班。（对林薇，笑）薇薇，不好意思啊，又麻烦你们。"}, {"sp": "刘芳", "tx": "（小声）她自己不能录吗？这是她的客户。"}, {"sp": "王莉", "tx": "（假装没听见）那我先走了，还有个饭局。"}, {"sp": "小马", "tx": "凭什么她的活儿我们干？每次都是。"}, {"sp": "林薇", "tx": "（平静地录单）因为马总让她这么干，没人拦。"}, {"sp": "小马", "tx": "那我们就不干！"}, {"sp": "林薇", "tx": "要干。但我要让这件事有记录。（指着屏幕）从今天起，所有销售交来的单，登记\"来源人、接收时间、完成时间、加班时长\"。每月汇总一次，发给各部门。"}, {"sp": "小马", "tx": "发了有什么用？"}, {"sp": "林薇", "tx": "现在没用。等有人问\"预订部为什么天天加班\"的时候，就有用了。"}, {"sp": "老周", "tx": "这个\"代销售录单\"的工时，一个月 190 小时？"}, {"sp": "林薇", "tx": "是。旺季更多。"}, {"sp": "老周", "tx": "（皱眉）销售部自己的单，为什么要预订部录？"}, {"sp": "马国栋", "tx": "（抢答）这是部门协作，一直都这样……"}, {"sp": "老周", "tx": "（打断）从下个月起，谁的单谁录。协作不是把活儿推给别人。"}], "know": "本集落点｜关系型资源分配的识别标志：同一套分析工具，对不同人得出相反结论（风险对甲是\"不能接\"，对乙是\"要维护\"）。应对不是对抗个人，而是把不公平\"计量化\"——把被占用的工时、被让渡的价格、被推迟的交付逐项记录并定期公开。不公平最怕的不是有人反对，是有人记账。", "shot": "分镜提示：① 会议室，销售王莉微笑提要求，总监附和，林薇据理力争的三角构图。② 王莉把一叠单据放到预订部桌上，轻描淡写说\"加个班\"。③ 预订部深夜三人录单，时钟特写 21:40。④ 月度会表格特写，红色数字\"190 小时\"，老周皱眉。"}, {"no": 58, "title": "她把证据收好", "meta": "约 110 秒 · 场景：深夜办公室 · 知识：证据链与时机", "scenes": ["场 1　深夜，林薇按时间线整理文档。小马进来。", "场 2　她讲了\"时机\"这件事。", "场 3　她给这份文档定下最后一条规矩。"], "lines": [{"sp": "小马", "tx": "薇姐，你查出来就告他啊。"}, {"sp": "林薇", "tx": "现在不行。现在拿出来，只是我和他之间的事，别人会说我\"内斗\"——然后我什么也改变不了，还多了个敌人。"}, {"sp": "小马", "tx": "那要等到什么时候？"}, {"sp": "林薇", "tx": "等到有人需要它做决定的时候。审计要查、集团要问、或者他先把我推上台。"}, {"sp": "林薇", "tx": "那时候这份东西是\"依据\"，不是\"控告\"。这两个词差别很大。"}, {"sp": "小马", "tx": "什么差别？"}, {"sp": "林薇", "tx": "控告是\"我要他倒\"；依据是\"这里有件事需要您看看\"。前者别人会先防你，后者别人会先用它。"}, {"sp": "林薇", "tx": "还有一条最重要：里面不许有一句我的评价。"}, {"sp": "小马", "tx": "可你心里明明有评价。"}, {"sp": "林薇", "tx": "（笑）有。但评价是我说的，事实是他做的。别人会信哪个，你猜？"}, {"sp": "林薇", "tx": "我只要把事实摆整齐，看的人自己会得出结论。那时候结论就不是我的，是他们的——他们才敢用。"}], "know": "本集知识点｜证据链的使用时机决定其性质：主动抛出 = 控告（易被视为内斗、触发对方防卫）；在被需要时提供 = 依据（易被采纳）。且证据中不含评价——只摆事实与时间戳，把结论留给阅读者，才能保持中立性与可信度。", "shot": "分镜/画面提示：① 深夜办公室，女主对着屏幕整理时间线文档。② 小马站在一旁急切地问。③ 女主讲\"依据是别人会先用它\"的正面特写。④ 文档界面，只有日期与事实，无一字评价，字幕\"把结论留给看的人\"。"}, {"no": 59, "title": "明年的数字", "meta": "约 110 秒 · 场景：预算会 · 知识：预算与目标设定", "scenes": ["场 1　预算会。老周报 480，林薇不签。", "场 2　她递上自己那一份。", "场 3　会后，她给小马解释为什么要\"一条条写依据\"。"], "lines": [{"sp": "老周", "tx": "明年 RevPAR 480。"}, {"sp": "林薇", "tx": "这个数字我不签。"}, {"sp": "老周", "tx": "（皱眉）集团要增长。"}, {"sp": "林薇", "tx": "480 意味着 ADR 要涨 14%。房量没变、产品没升级、对手 B 还要开新店。凭什么涨 14%？"}, {"sp": "老周", "tx": "那你给。"}, {"sp": "林薇", "tx": "445。出租率 68→70 靠淡季产品，ADR 620→636 靠渠道改善。每一项的依据和责任人都在上面。"}, {"sp": "老周", "tx": "渠道改善你确定能拿？"}, {"sp": "林薇", "tx": "OTA 从 34% 压到 25% 能拿 3.1 个点。我按 2.6 报，留了余量。"}, {"sp": "老周", "tx": "为什么留余量？"}, {"sp": "林薇", "tx": "因为做不到一次，第二年我说话就没人听了。"}, {"sp": "小马", "tx": "直接报个 445 不就行了？"}, {"sp": "林薇", "tx": "不行。没有依据的目标，到了月底就会变成造假的动力。"}, {"sp": "林薇", "tx": "你给了依据，大家就知道该往哪使劲；你只给个数，大家就只能想办法让那个数好看。"}, {"sp": "林薇", "tx": "（画外音）这是我后来最坚持的一件事。预算不是一个数字，是一套凭什么。"}], "know": "本集知识点｜预算应自下而上拆依据：每项增幅对应具体动作、责任人与测算，并留余量。没有依据的目标会诱导一线做出损害长期价值的\"假动作\"（如把空房记为自用）；有依据的目标则指明行动方向。", "shot": "分镜/画面提示：① 预算会众人围坐，女主说\"我不签\"，全场安静。② 她递上写着依据的那份，逐条指向动作与责任人。③ 老周追问\"为什么留余量\"。④ 会后她讲\"让那个数好看\"的近景，字幕\"预算是一套凭什么\"。"}, {"no": 60, "title": "她成了障碍", "meta": "约 110 秒 · 场景：总监办公室 / 深夜 · 知识：架构调整的动机识别", "scenes": ["场 1　马国栋把一份\"组织优化\"方案发给林薇，语气客气。", "场 2　当晚，她对着那份方案坐了很久。", "场 3　她做了三件事。"], "lines": [{"sp": "马国栋", "tx": "小林啊，集团要精简。收益这块以后并入市场销售，统一汇报——对你也是机会。"}, {"sp": "林薇", "tx": "并入市场销售，那定价就归销售管了。"}, {"sp": "马国栋", "tx": "（笑）协同嘛。你别想太多。"}, {"sp": "林薇", "tx": "（点头）我回去想想。"}, {"sp": "小马", "tx": "薇姐，合并听起来也没什么坏处啊，还能少扯皮。"}, {"sp": "林薇", "tx": "合并本身没坏处。坏的是合并之后，定价的否决权归谁。"}, {"sp": "林薇", "tx": "现在我说\"这单不能接\"，他最多不高兴；合并后我说这句话，是在反对我的直接上级——那就不一样了。"}, {"sp": "小马", "tx": "那他是故意的？"}, {"sp": "林薇", "tx": "（停顿）我不能确定。但我能确定的是：合并之后，那个知道真实数据的人，会变成向他汇报的人。"}, {"sp": "林薇", "tx": "一、把所有历史数据备份一份；二、把关键流程写成文档；三、给老周发了一封邮件，只谈业务影响，不谈人。"}, {"sp": "林薇", "tx": "（念邮件）\"若定价并入销售，考核指标将转为出租率与总营收，价格失控风险上升。建议保留收益独立汇报线。\""}, {"sp": "林薇", "tx": "（画外音）他不是在优化组织，他是在让那个知道真实数据的人，变成向他汇报的人。"}, {"sp": "林薇", "tx": "而我唯一能做的，是在它发生之前，让另一个人也知道这件事。"}], "know": "本集知识点｜警惕\"架构调整\"中的利益动机：当调整恰好使监督者变成被监督者的下属时，本质是削弱制衡。识别方法：看\"谁从此不能再独立发声\"。应对：备份数据、文档化流程、向上级只谈业务影响（不谈人），在变更发生前让关键信息传递到有权者。", "shot": "分镜/画面提示：① 总监办公室，方案被推过来，总监笑容客气。② 深夜女主独自对着方案，指尖敲桌。③ 她一条条做事：备份、写文档、发邮件。④ 邮件正文特写\"建议保留收益独立汇报线\"，字幕\"在它发生之前，让另一个人也知道\"。"}, {"no": 61, "title": "退订潮", "meta": "约 110 秒 · 场景：预订部 · 知识：不可抗力与口径统一", "scenes": ["场 1　春节前三天，订单一夜清零。电话响成一片。", "场 2　她把口径写在一页纸上，人手一份。", "场 3　深夜，她把所有退订录进表。"], "lines": [{"sp": "小马", "tx": "薇姐，全都退。今天已经接了 400 多个电话。"}, {"sp": "林薇", "tx": "先统一口径：政策内的全额退，政策外的报我这里，任何人不要自己承诺。"}, {"sp": "阿杰", "tx": "有客人骂我们不退钱。"}, {"sp": "林薇", "tx": "把政策原文发给他，把我们的执行说明也发给他。这个时候，客人要的不是退不退，是要有人给他一个说法。"}, {"sp": "小马", "tx": "那客人问\"什么时候能订\"，怎么说？"}, {"sp": "林薇", "tx": "说\"目前政策随时在变，我们按最新政策执行，请您留下联系方式，变了第一时间通知您\"。不许说\"应该没事\"。"}, {"sp": "小马", "tx": "为什么？"}, {"sp": "林薇", "tx": "因为说了\"应该没事\"，客人就会照着订。到时候真有事，是我们让他白跑一趟。那比不退钱更伤。"}, {"sp": "林薇", "tx": "（自语）今天 400 通电话，退了 1200 间夜。"}, {"sp": "林薇", "tx": "（画外音）那天我忽然想起师父的话：客人记不住价格，只记得住有没有骗他。在所有人都不确定的时候，\"不骗\"就是唯一能守住的东西。"}, {"sp": "林薇", "tx": "她把这句话抄在纸上，贴在电话旁边，让每个人都能看见。"}], "know": "本集知识点｜不可抗力事件四步：统一口径 → 依政策执行 → 逐笔记录 → 估算后续规模。对外口径要点：不承诺个人判断（\"应该没事\"），只陈述政策与执行方式，并留联系方式。口径混乱比退款本身更伤品牌。", "shot": "分镜/画面提示：① 预订部人人戴着耳麦接电话，铃声此起彼伏。② 女主站在中间宣布统一口径，众人抬头。③ 一页纸口径被复印分发，人手一份。④ 深夜表格上退订数累加，旁边贴着手写\"不骗\"二字。"}, {"no": 62, "title": "停摆", "meta": "约 110 秒 · 场景：空荡的酒店 / 会议室 · 事件线：零需求", "scenes": ["场 1　大堂。没有客人。前台只有一个人。电子屏显示今日出租率：4%。", "场 2　会议室。老周、各部门。气氛沉重。", "场 3　散会后，小马问她。"], "lines": [{"sp": "林薇", "tx": "（站在大堂中间，很久没说话）"}, {"sp": "阿杰", "tx": "薇姐，今天退了 3 间，来了 1 个。是位长住客，说公司还没通知他回去。"}, {"sp": "林薇", "tx": "那一位，是行政房还是高级房？"}, {"sp": "阿杰", "tx": "……高级房。"}, {"sp": "林薇", "tx": "（点头）给他换到高层安静的一侧。别让他觉得这酒店空得吓人。"}, {"sp": "老周", "tx": "这个月的 RevPAR，谁报一下？"}, {"sp": "林薇", "tx": "17。"}, {"sp": "老周", "tx": "（沉默）……17 块。"}, {"sp": "林薇", "tx": "周总，我建议从这个月起，日报不再以 RevPAR 开头。"}, {"sp": "小唐", "tx": "那看什么？"}, {"sp": "林薇", "tx": "看三件事：每天固定成本多少、可变成本压到多少、账户还能撑几天。需求没了，我们能管的只剩下\"烧钱速度\"。"}, {"sp": "陈姐", "tx": "客房这边，我们把两层楼整体封了，空调、布草、清洁全停。只开一层。"}, {"sp": "林薇", "tx": "（在白板上写）这就是收益管理在零需求期的样子：不是把房子卖贵，是把不该开的成本关掉。"}, {"sp": "小马", "tx": "薇姐，那我们是不是……没用了？房子都卖不出去。"}, {"sp": "林薇", "tx": "恰恰相反。生意好的时候，谁都能做收益——闭着眼睛涨价都有人住。只有现在，才看得出谁真的懂这个生意。"}, {"sp": "林薇", "tx": "我们现在的活儿是：算清楚每一天的最低开房量——低于这个数，开门就是亏。然后守住它。"}, {"sp": "小马", "tx": "那什么时候恢复？"}, {"sp": "林薇", "tx": "不知道。但我要提前准备好三套方案：周边游先回来怎么办、商务先回来怎么办、全回来但不敢涨价怎么办。（停顿）需求回来那天，不能是我们才开始想的那天。"}], "know": "本集落点｜零需求期收益管理的重心转移：从\"收入最大化\"转向\"成本与现金流管理\"。关键工具是最低开房量（保本出租率）：低于它，开门即亏，不如集中楼层、关闭部分区域。同时必须提前准备复苏情景方案——复苏是分客源、分节奏的，不是一夜之间回来的。", "shot": "分镜提示：① 空荡的大堂，只有一位客人的背影，冷色调，空间感强。② 电子屏特写：出租率 4%，红色数字。③ 会议室白板上手写\"固定成本/可变成本/还能撑几天\"。④ 女主独自站在封楼的楼层走廊，尽头黑暗，字幕\"需求回来那天，不能是我们才开始想的那天\"。"}, {"no": 63, "title": "RevPAR 不重要了", "meta": "约 110 秒 · 场景：会议室 / 办公室 · 知识：现金流优先与保本点", "scenes": ["场 1　林薇把日报的第一行改掉了，发给全部门。", "场 2　她给全部门讲新的三件事。", "场 3　她把数字算出来，会议室里很安静。"], "lines": [{"sp": "小马", "tx": "薇姐，日报第一行怎么变成\"现金余额\"了？"}, {"sp": "林薇", "tx": "因为这个月唯一重要的问题是：我们还能撑几天。"}, {"sp": "小马", "tx": "RevPAR 17 块还是 20 块，不影响生死？"}, {"sp": "林薇", "tx": "不影响。但\"还能撑 40 天\"和\"还能撑 70 天\"，影响我们什么时候做决定。"}, {"sp": "林薇", "tx": "从今天起日报看三件事：每天固定成本多少、可变成本压到多少、账户还能撑几天。"}, {"sp": "小马", "tx": "那我们收益部……是不是没活儿了？"}, {"sp": "林薇", "tx": "有。我们要算最低开房量。"}, {"sp": "小马", "tx": "那是什么？"}, {"sp": "林薇", "tx": "就是\"低于这个数，开门就是亏\"。这是现在唯一有意义的一条线。"}, {"sp": "林薇", "tx": "按现在的成本，我们每天要卖到 38% 才不亏。"}, {"sp": "陈姐", "tx": "38%……那我们能做到吗？"}, {"sp": "林薇", "tx": "这个月平均只有 11%。所以我们要么把成本压到 38% 以下，要么接受每天亏。"}, {"sp": "陈姐", "tx": "（站起来）那我把楼层合了。开一层，剩下的封。"}, {"sp": "林薇", "tx": "（画外音）那是我们第一次把\"出租率\"这个词，换成\"能不能活下去\"。后来证明，那三个月学的东西，比前面十年都实在。"}], "know": "本集知识点｜需求归零时，指标重心从 RevPAR 转向现金流与保本点。核心工具是最低开房量（保本出租率）：低于它应集中楼层、关闭区域以压低可变成本。它对组织的作用是把模糊的焦虑变成一条可以天天对照的线。", "shot": "分镜/画面提示：① 屏幕上日报第一行从\"RevPAR\"改为\"现金余额\"，红字。② 女主站着讲三件事，众人记录。③ 白板上手写\"38%\"与当下\"11%\"并排。④ 客房主管站起来说\"我合楼层\"，字幕\"把焦虑变成一条线\"。"}, {"no": 64, "title": "最痛苦的决定", "meta": "约 110 秒 · 场景：总经理办公室 / 会议室 · 知识：人力成本的两难", "scenes": ["场 1　老周把两个方案摆在桌上：裁员 20%，或全员降薪 30%。", "场 2　老周不理解。", "场 3　方案宣布，基层员工先是不信，后来沉默。"], "lines": [{"sp": "老周", "tx": "二选一。"}, {"sp": "林薇", "tx": "我两个都不选。"}, {"sp": "老周", "tx": "（皱眉）那你给第三个。"}, {"sp": "林薇", "tx": "高管降薪 40%、中层 20%、基层不降；排班改为做二休二，把工时摊薄而不是砍人。省的钱差不多，但人保住了。"}, {"sp": "老周", "tx": "为什么高管降最多？"}, {"sp": "林薇", "tx": "因为扛风险的能力本来就该跟收入成正比。"}, {"sp": "林薇", "tx": "而且——等需求回来那天，我需要这些人还在。重新招一批、教三年，那个成本现在看不见，到时候会要命。"}, {"sp": "老周", "tx": "（沉默）……你算过这笔账？"}, {"sp": "林薇", "tx": "算过。按我的流失成本表，裁 20 人，一年后重建这 20 人要花掉省下来的两倍。"}, {"sp": "小马", "tx": "薇姐，为什么你自己也降 20%？你又不是高管。"}, {"sp": "林薇", "tx": "我是中层，该降。"}, {"sp": "小马", "tx": "可你是提方案的人。"}, {"sp": "林薇", "tx": "（笑）正因如此。我提的方案，第一个适用的人是我。不然这方案连一个字都不值。"}, {"sp": "林薇", "tx": "（画外音）那天之后，部门里再没人抱怨过工时。不是因为不苦，是因为他们知道，最苦的那个人跟他们一起在扛。"}], "know": "本集知识点｜危机期人力决策要看复苏后的重建成本：裁员省下当期现金，付出的是招聘、培训与熟练期损失（常达节省额数倍）。阶梯式降薪 + 工时摊薄常优于直接裁员。关键前提：方案制定者必须自己先被方案约束，否则失去正当性。", "shot": "分镜/画面提示：① 桌上两个方案并排，女主说\"我两个都不选\"。② 她逐条讲阶梯降薪，老周皱眉听着。③ 会议宣布时基层员工的表情，从怀疑到沉默。④ 女主被问\"为什么你自己也降\"，微笑作答。"}, {"no": 65, "title": "隔离酒店", "meta": "约 110 秒 · 场景：大堂 / 楼层 · 知识：特殊需求场景下的角色转换", "scenes": ["场 1　酒店被征用作隔离点。价格是指定的，客源是指定的。", "场 2　她跟陈姐一起排班，两个人吵了一架。", "场 3　夜里，她穿着防护服送餐回来。"], "lines": [{"sp": "小马", "tx": "那我们还需要定价吗？"}, {"sp": "林薇", "tx": "定价不用了。但成本要算：一层楼多少人、布草怎么处理、餐怎么送、员工怎么排班。"}, {"sp": "小马", "tx": "那我们收益部做什么？"}, {"sp": "林薇", "tx": "做资源组织。这恰恰说明收益管理不是\"定价\"，是\"在给定条件下把资源用在最值的地方\"——只不过这次条件被别人给定死了。"}, {"sp": "陈姐", "tx": "一层楼要三个人轮，不然撑不住。"}, {"sp": "林薇", "tx": "三个人我们人力不够。两人一层，我加一个机动。"}, {"sp": "陈姐", "tx": "那你那机动的是谁？"}, {"sp": "林薇", "tx": "我。"}, {"sp": "陈姐", "tx": "（愣住）你一个收益经理，去送餐？"}, {"sp": "林薇", "tx": "现在不是收益经理。现在是人手。"}, {"sp": "小马", "tx": "薇姐，你今天在楼上待了六个小时。"}, {"sp": "林薇", "tx": "（摘下护目镜）今天这六小时，比我过去半年算的数都管用。"}, {"sp": "小马", "tx": "为什么？"}, {"sp": "林薇", "tx": "因为我终于亲眼看见我的一个决定，落到人身上是什么样子。我关一层楼，是六个人少走三层；我改一个流程，是她们少弯八十次腰。"}], "know": "本集知识点｜当价格与客源被外生决定时，收益管理退回到成本与资源组织——这也印证其本质是约束条件下的资源最优配置，而非\"涨价\"。同时建立了一个重要的管理者认知：报表上的每个决定，落到一线都是具体的动作与体力；亲自做一次，才知道成本意味着什么。", "shot": "分镜/画面提示：① 酒店大堂被改造成工作区，指示牌与隔离标识，冷光。② 女主与客房主管在白板前排班，两人争执。③ 女主穿防护服推餐车的背影，走廊昏暗。④ 她摘下护目镜的脸，字幕\"我的一个决定，落到人身上是什么样子\"。"}, {"no": 66, "title": "一个人的春节", "meta": "约 110 秒 · 场景：空酒店 / 视频通话 · 知识：职业的被理解", "scenes": ["场 1　空酒店，林薇值班。大堂只有她一个人。", "场 2　视频电话。母亲在屏幕那头。", "场 3　母亲听完，说了句她没料到的话。"], "lines": [{"sp": "林薇", "tx": "（对着监控墙，数着亮灯的楼层）一层、两层……"}, {"sp": "林薇", "tx": "（把其他楼层的灯逐个关掉）"}, {"sp": "林薇", "tx": "（画外音）那是我第一次亲手把一整栋楼关掉大半。师父说过，房子空着是亏。可那天我知道，有些空，是为了能再亮起来。"}, {"sp": "母亲", "tx": "大过年的，你一个人在那儿干嘛？"}, {"sp": "林薇", "tx": "值班。就我一个。"}, {"sp": "母亲", "tx": "我问你多少次了——你到底是干嘛的？前台不像前台，销售不像销售。"}, {"sp": "林薇", "tx": "（沉默一下）妈，这一年我终于能说清楚了。"}, {"sp": "林薇", "tx": "平时我是那个\"决定房子卖多少钱\"的人；今年没人住，我就是那个\"决定这酒店还能撑多久\"的人。"}, {"sp": "母亲", "tx": "（红了眼眶）那你……累不累？"}, {"sp": "林薇", "tx": "（愣住，然后笑了）累。"}, {"sp": "母亲", "tx": "那就别干了。"}, {"sp": "林薇", "tx": "不行。这活儿总得有人干，而且得有人认认真真地干。"}, {"sp": "林薇", "tx": "（挂断，画外音）那一年我三十五岁。我妈第一次听懂了我的工作，也是第一次，她不再劝我换个工作。"}], "know": "本集知识点｜（无技术点）本集作用：让职业被生活理解。收益管理在常态下是定价，在非常态下是生存——两者是同一件事的两面。同时也交代了职业的代价与选择：有些事必须有人认真做，这是从业者的内在动机。", "shot": "分镜/画面提示：① 空大堂只有一盏灯，女主独坐，远处监控墙。② 她逐层关灯的手部特写，楼层指示灯暗下去。③ 视频通话，母亲在屏幕那头红了眼眶。④ 女主挂断后微笑，字幕\"这活儿得有人认认真真地干\"。"}, {"no": 67, "title": "第一波复苏", "meta": "约 110 秒 · 场景：会议室 · 知识：分客源复苏", "scenes": ["场 1　需求开始回来，但回来的顺序很奇怪。", "场 2　她拿出两张图，让大家看清楚差别。", "场 3　一个月后，出租率回到 61%。"], "lines": [{"sp": "小马", "tx": "周末满了，周中还是空的！以前不是反过来的吗？"}, {"sp": "林薇", "tx": "因为先回来的是本地人、短途、开车来的——他们周末来。商务客要等公司恢复出差，那批人更晚。"}, {"sp": "小马", "tx": "那我们按商务酒店那套定价？"}, {"sp": "林薇", "tx": "不行。客人换了，产品就得换。"}, {"sp": "林薇", "tx": "这张是以前：周中高、周末低。现在反过来。如果还按老日历走，我们会在周末爆满却卖低价，周中守着高价没人来。两头落空。"}, {"sp": "小唐", "tx": "那怎么办？"}, {"sp": "林薇", "tx": "周中做会议日场和长住，周末做家庭包。两套产品，两个日历。"}, {"sp": "陈姐", "tx": "那我排班也要跟着改……"}, {"sp": "林薇", "tx": "对，我算过了。周末加两个人，周中减三个人，总数还少一个。"}, {"sp": "小马", "tx": "61% 了！"}, {"sp": "林薇", "tx": "（看着数据，并不激动）还不够。商务客一天不回来，我们就一天不算真的恢复。"}, {"sp": "小马", "tx": "那要等到什么时候？"}, {"sp": "林薇", "tx": "不知道。但我要从今天起就开始盯那个数——公司协议客户的周中预订量。它不动，我们就还得熬。"}], "know": "本集知识点｜复苏是分客源、分节奏的：通常本地/短途/休闲先恢复，商务与会议后恢复。策略上必须按先回来的客群重构产品与日历（两套产品、两个日历），并联动人力排班。同时确立前瞻指标（如协议客户周中预订量）来判断复苏进度。", "shot": "分镜/画面提示：① 屏幕上新旧两张周内曲线并排，形状相反，箭头标注。② 女主讲\"两套产品两个日历\"，白板分两栏。③ 客房主管算排班，笔在纸上划。④ 女主看着 61% 的平静表情，字幕\"商务客不回来，就不算真的恢复\"。"}, {"no": 68, "title": "报复性出游", "meta": "约 110 秒 · 场景：会议室 / 前厅 · 知识：透支型峰值", "scenes": ["场 1　全城满房，同行普遍涨价两到三倍。会议室里很兴奋。", "场 2　她把\"预支\"两个字讲透。", "场 3　两个月后，同行被投诉，他们没有。"], "lines": [{"sp": "小唐", "tx": "对面涨到 1800 了！我们也涨吧，这时候不涨什么时候涨。"}, {"sp": "林薇", "tx": "涨，但不跟到 1800。我们按 1100 走，留出余地。"}, {"sp": "小唐", "tx": "白捡的钱不捡？"}, {"sp": "林薇", "tx": "这不是白捡的，是预支的。"}, {"sp": "林薇", "tx": "今天客人被迫接受 1800，他心里记着这笔账。明年他看见我们就想起\"那次我住了 1800\"，然后他就去别家了。"}, {"sp": "小唐", "tx": "可他明年也不一定要住啊。"}, {"sp": "林薇", "tx": "对，还有更坏的：他会在网上说。一条评论，比我们多赚的那几千块值钱得多。"}, {"sp": "老周", "tx": "（一直没说话）……就按你说的。"}, {"sp": "小唐", "tx": "（小声）周总都不反对啊。"}, {"sp": "阿杰", "tx": "（翻手机）对面被挂网上了，说\"平时 800 涨到 1800\"。我们没上。"}, {"sp": "林薇", "tx": "因为我们没那么贵。"}, {"sp": "小唐", "tx": "（服气）那两个月少赚的钱……"}, {"sp": "林薇", "tx": "不算少赚。我们只是没把明年的客人，提前卖掉。"}], "know": "本集知识点｜报复性需求属透支型峰值：超额提价的当期收益，会以品牌口碑损失与未来客源流失的形式偿还。定价应留出\"可被记住的分寸\"——不把未来的客人提前卖掉。口碑损失的外溢成本（公开评价）常高于当期超额收入。", "shot": "分镜/画面提示：① 会议室众人兴奋，女主平静说\"按 1100\"。② 她在白板上写\"预支\"二字，画箭头指向明年。③ 两个月后手机屏幕上的负面评论，众人围观。④ 女主说\"没把明年的客人提前卖掉\"，字幕\"有些钱是预支的\"。"}, {"no": 69, "title": "被骂上热搜", "meta": "约 110 秒 · 场景：晨会 / 大堂 · 知识：价格伦理的操作化", "scenes": ["场 1　同行涨价三倍被骂上热搜。晨会上传阅手机。", "场 2　她把三条写在黑板上。", "场 3　月底，有客人在前台说了句话。"], "lines": [{"sp": "阿杰", "tx": "评论都在骂\"发国难财\"。我们没涨那么多，是不是亏了？"}, {"sp": "林薇", "tx": "没亏。我师父退休那天跟我说过一句话：客人记不住我们的价格，只记得住我们有没有骗他。"}, {"sp": "小马", "tx": "可我们确实涨了啊。"}, {"sp": "林薇", "tx": "涨了，但我们同时做了三件事。"}, {"sp": "林薇", "tx": "一、价格提前公示，挂在网上、贴在大堂，不是到前台才说。"}, {"sp": "林薇", "tx": "二、老客按原价保——三个月内住过的，回来还是那个价。"}, {"sp": "林薇", "tx": "三、服务一项不减。早餐照常，清洁照常，不加收任何名目。"}, {"sp": "阿杰", "tx": "就这三条？"}, {"sp": "林薇", "tx": "就这三条。收了钱还缩水，那才叫抢。"}, {"sp": "客人", "tx": "你们也涨了，但我知道你们涨多少，所以我认。对面那家我不认，因为他不告诉我。"}, {"sp": "林薇", "tx": "（在旁边听见）"}, {"sp": "林薇", "tx": "（画外音）这一行最难的判断不在报表上——在你收了这个价，晚上睡不睡得着。那三条不是技巧，是让你睡得着的东西。"}], "know": "本集知识点｜价格伦理的操作化判据（三件套）：提前公示 + 老客保护 + 价值不缩水。三者齐备的提价可被解释、可被客人接受；缺一则构成对客人的实质损害。客人
