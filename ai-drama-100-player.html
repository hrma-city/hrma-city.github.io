在意的不是价格高低，而是是否被透明对待。", "shot": "分镜/画面提示：① 晨会众人低头看手机上的负面热搜，气氛凝重。② 女主在黑板写三条，粉笔声清晰。③ 大堂价格公示牌，客人驻足。④ 客人对前台说\"我知道你们涨多少，所以我认\"，字幕\"你收了这个价，晚上睡不睡得着\"。"}, {"no": 70, "title": "反咬", "meta": "约 110 秒 · 场景：集团会议 / 办公室 · 人性线：先发制人的责任转移", "scenes": ["场 1　集团季度会（视频）。马国栋先发言。", "场 2　会后，老周把林薇叫到办公室，脸色不好。", "场 3　屏幕上，一条时间线被展开。", "场 4　老周拿起电话。"], "lines": [{"sp": "马国栋", "tx": "这一轮 ADR 下滑，我们复盘过：主要是定价执行不到位。收益经理层面，对市场反应偏慢，提价建议也给得保守。"}, {"sp": "集团高管", "tx": "具体是谁？"}, {"sp": "马国栋", "tx": "（停顿一秒）执行层面由林薇负责。她的能力没问题，但……判断偏保守，几次关键时点没敢动。"}, {"sp": "林薇", "tx": "（在屏幕另一端，没有立刻说话）"}, {"sp": "老周", "tx": "他说你保守。你怎么说？"}, {"sp": "林薇", "tx": "我不辩。辩解是最弱的回应。（打开电脑）周总，我要给您看一样东西——我存了十八个月。"}, {"sp": "林薇", "tx": "第一次提价申请：去年 3 月，建议某平台回收价差 60 元，被否决，理由是\"会掉量\"。这是他的邮件回复。"}, {"sp": "林薇", "tx": "第二次：6 月，同样建议，被否决。第三次：9 月，被否决。"}, {"sp": "林薇", "tx": "同期，该平台份额从 22% 涨到 38%，我们的挂牌价比另外两家低 60，全城比价都拿这个价当基准。"}, {"sp": "老周", "tx": "（盯着屏幕）……他否决了多少次？"}, {"sp": "林薇", "tx": "三次书面，两次口头。口头那两次，我当天发了确认邮件，他回了\"按我说的做\"。"}, {"sp": "老周", "tx": "（沉默很久）你为什么现在才拿出来？"}, {"sp": "林薇", "tx": "因为之前拿出来，只是我和他之间的事，别人会说我\"内斗\"。现在他先把我推到台上了——这时候拿出来，是给要处理这件事的人一个依据。"}, {"sp": "林薇", "tx": "还有一点我要说清楚：这份东西里，没有一句评价，只有记录。结论由看的人下。"}, {"sp": "老周", "tx": "（对着电话）帮我接集团审计。（挂断，看着林薇）你这段时间……辛苦了。"}, {"sp": "林薇", "tx": "（摇头）我不辛苦。我只是不想让\"谁在说实话\"这件事，由嗓门大小决定。"}], "know": "本集落点｜\"反咬\"的本质是先发制人定义责任。应对三原则：① 不做情绪化辩解（辩解会让自己变成\"两个人在吵\"）；② 用带时间戳的事实回应（申请、否决、邮件回复、同期数据）；③ 证据里不加评价——只摆事实，把判断权交给有权处理的人，这样它才是\"依据\"而不是\"控告\"。", "shot": "分镜提示：① 视频会议分格画面，马国栋在发言，林薇那一格沉默，构图对比。② 屏幕时间线展开，三次\"被否决\"依次亮起，红色标记。③ 邮件回复特写：\"按我说的做\"与时间戳。④ 老周拿起电话的手部特写。⑤ 林薇平静的脸，字幕\"不能让谁在说实话，由嗓门大小决定\"。"}, {"no": 71, "title": "她交出那叠记录", "meta": "约 115 秒 · 场景：总经理办公室 · 知识：证据链的呈现方式", "scenes": ["场 1　老周办公室。屏幕上一条时间线被展开。", "场 2　老周问了最关键的一个问题。", "场 3　她说了最后一句，然后起身。"], "lines": [{"sp": "林薇", "tx": "去年 3 月第一次提价申请，建议回收价差 60 元，被否决，理由是\"会掉量\"。这是他的邮件回复。"}, {"sp": "林薇", "tx": "6 月第二次，被否决。9 月第三次，被否决。"}, {"sp": "林薇", "tx": "同期该平台份额从 22% 涨到 38%，我们挂牌价比另外两家低 60——全城比价都拿这个价当基准。"}, {"sp": "老周", "tx": "（盯着屏幕）……他否决了多少次？"}, {"sp": "林薇", "tx": "三次书面，两次口头。口头那两次，我当天发了确认邮件，他回了\"按我说的做\"。"}, {"sp": "老周", "tx": "你为什么现在才拿出来？"}, {"sp": "林薇", "tx": "因为之前拿出来，只是我和他之间的事。现在他先把我推到台上了——这时候它是依据，不是控告。"}, {"sp": "老周", "tx": "（沉默）你等了十八个月？"}, {"sp": "林薇", "tx": "是。我不是在等他犯错，我是在等一个\"有人需要它\"的时刻。"}, {"sp": "林薇", "tx": "还有一点我要说清楚：这份东西里没有一句评价，只有记录。结论由看的人下。"}, {"sp": "老周", "tx": "（拿起电话）帮我接集团审计。"}, {"sp": "老周", "tx": "（挂断，看着她）你这段时间……辛苦了。"}, {"sp": "林薇", "tx": "（摇头）我不辛苦。我只是不想让\"谁在说实话\"这件事，由嗓门大小决定。"}], "know": "本集知识点｜证据被采纳的三要素：① 带时间戳的事实链（申请—否决—回复—同期数据）；② 在决策者需要时提供，而非主动抛出；③ 不含一句评价——只摆事实，把判断权交给有权处理的人，这样它才是\"依据\"而不是\"控告\"。", "shot": "分镜/画面提示：① 屏幕上时间线逐条展开，三次\"被否决\"依次亮起。② 老周盯着屏幕，表情从怀疑到凝重。③ 两人对话的正反打，女主平静。④ 老周拿起电话，字幕\"不想让谁在说实话由嗓门大小决定\"。"}, {"no": 72, "title": "清算", "meta": "约 110 秒 · 场景：办公室 / 走廊 · 知识：结果与余波", "scenes": ["场 1　马国栋被调岗接受调查。王莉递了辞呈。那天办公室很安静。", "场 2　走廊上，她碰见抱着纸箱的王莉。", "场 3　回到办公室，小马问她接下来做什么。"], "lines": [{"sp": "刘芳", "tx": "（小声）薇姐，你赢了。"}, {"sp": "林薇", "tx": "（摇头）我没赢。我只是把账算清楚了。"}, {"sp": "刘芳", "tx": "那不一样吗？"}, {"sp": "林薇", "tx": "不一样。赢了会有快感，算清楚没有——只有一种\"终于对上了\"的平静。"}, {"sp": "王莉", "tx": "（停下，没看她）你满意了。"}, {"sp": "林薇", "tx": "我不满意。你走，不是我想要的。"}, {"sp": "王莉", "tx": "（笑了一下，很苦）那是我的事。我只是……跟着他走的时候没想过这些。"}, {"sp": "林薇", "tx": "我知道。你那时候也没别的办法。"}, {"sp": "王莉", "tx": "（抱紧箱子）你不用替我说话。我拿了那些绿灯，是我自己拿的。"}, {"sp": "小马", "tx": "薇姐，现在没人挡我们了。"}, {"sp": "林薇", "tx": "（看着空着的工位）从今天起我要做一件事：让下一个想往里钻的人，钻不进去。"}, {"sp": "小马", "tx": "怎么做？"}, {"sp": "林薇", "tx": "不是抓人。是把洞堵上。人抓不完，洞堵住了，谁也钻不进。"}, {"sp": "林薇", "tx": "（画外音）那天我在本子上写了一行字：清算一个人，只是让账对上；堵住一个洞，才是让账不会再错。"}], "know": "本集知识点｜处理完个人 ≠ 解决问题：惩罚一个人只解决一个人，堵住漏洞才能解决所有想钻的人。同时对\"共谋者\"要有客观认知——其责任在于自己接受了不当利益，而非仅是被裹挟。这引出下一季主题：从个人对抗走向制度化。", "shot": "分镜/画面提示：① 办公室安静，有人在收东西，众人低头不语。② 走廊上两人擦肩，王莉抱箱停下，苦笑。③ 女主回到办公室望向空工位。④ 笔记本新写一行字，字幕\"清算一个人只是让账对上\"。"}, {"no": 73, "title": "她成了收益总监", "meta": "约 110 秒 · 场景：收益部 · 知识：透明化作为防腐手段", "scenes": ["场 1　上任第一天，她把部门所有流程贴到共享盘，谁都能看。", "场 2　有人不习惯，私下抱怨。", "场 3　三个月后，第一次有人主动用了这套东西。"], "lines": [{"sp": "小马", "tx": "薇姐，全公开？连审批记录也公开？"}, {"sp": "林薇", "tx": "对。"}, {"sp": "小马", "tx": "那我们做错事不就全看见了……"}, {"sp": "林薇", "tx": "做错事看得见，才会有人提前不想做错。"}, {"sp": "小马", "tx": "可对我们自己也不好看啊。"}, {"sp": "林薇", "tx": "（认真）对我们是保护。出了事，是记录说了算，不是谁嗓门大说了算。"}, {"sp": "下属甲", "tx": "以前改个价，口头说一下就行。现在要写理由，还要留痕。"}, {"sp": "下属乙", "tx": "麻烦死了。"}, {"sp": "林薇", "tx": "（走过来）我知道麻烦。但你们想一下：如果哪天有人问\"这个价是谁改的\"，你答不上来，那才叫麻烦。"}, {"sp": "林薇", "tx": "我不是不信任你们。我是不让\"信任\"变成你们的风险。"}, {"sp": "下属甲", "tx": "林总，我上周那次改价，理由写在系统里了，您可以查。"}, {"sp": "林薇", "tx": "（笑）我看到了。写得挺清楚。"}, {"sp": "下属甲", "tx": "以前我会说\"我跟您说过的\"。现在我说\"系统里有\"。"}, {"sp": "林薇", "tx": "这就是区别。"}, {"sp": "林薇", "tx": "（画外音）我以前是那个靠着记录活下来的人。现在我把它变成所有人的默认配置。不用再有人像我当年那样，夜里一个人在存邮件。"}], "know": "本集知识点｜流程透明化的双向价值：抑制违规（做错会被看见）+ 保护执行者（责任由记录界定）。这是从\"个人自保\"走向\"制度保护\"的第一步。推行时要把规则解释为保护下属（\"不让信任变成你的风险\"），而非监督他们。", "shot": "分镜/画面提示：① 共享盘界面，流程文件夹被公开，众人围观。② 两个下属私下抱怨，女主走近。③ 她说\"不让信任变成你们的风险\"，两人沉默。④ 三个月后下属主动说\"系统里有\"，字幕\"不用再有人夜里一个人存邮件\"。"}, {"no": 74, "title": "第一次管一群收益经理", "meta": "约 110 秒 · 场景：会议室 · 知识：反驳机制的设立", "scenes": ["场 1　新团队第一次会。方法讲完，没人提问。", "场 2　她立了一条规矩。", "场 3　一个月后，第一次有人当面说她错了。"], "lines": [{"sp": "林薇", "tx": "都听懂了？那我问一句：如果我这个判断是错的，谁会告诉我？"}, {"sp": "众人（沉默）\n林薇", "tx": "（叹气）方法教起来容易。教\"敢说不\"很难。"}, {"sp": "经理甲", "tx": "（小声）我们不是不想说……"}, {"sp": "林薇", "tx": "我知道。你们是在看我脸色。这不能怪你们，怪位置。"}, {"sp": "林薇", "tx": "以后每次会，我最后会问一句\"哪里不对\"。你们答不上来不要紧，长期答不上来，我就要换人了。"}, {"sp": "经理乙", "tx": "（不解）为什么？"}, {"sp": "林薇", "tx": "因为一个没人敢反驳的团队，等于没有团队。那不是我厉害，是我瞎了。"}, {"sp": "林薇", "tx": "而且——这条规矩第一个约束的是我自己。你们说我错的时候，我不许当场辩解，先听完。"}, {"sp": "经理甲", "tx": "（紧张）林总，您上周那个关房节奏……我觉得关早了。这两天散客问了很多，我们没房。"}, {"sp": "林薇", "tx": "（停顿，然后）说下去。"}, {"sp": "经理甲", "tx": "（越说越顺）如果留一档，我们这几天能多收八万。"}, {"sp": "林薇", "tx": "（听完，点头）你对。是我关早了。下次遇到这种形状，留一档。"}, {"sp": "林薇", "tx": "（画外音）那天散会，我看见好几个人在笑。他们笑的不是我对，是他们终于可以说话了。"}], "know": "本集知识点｜收益团队的能力不止\"会算\"，更要\"敢说不\"。管理者应主动设立反驳机制（固定提问\"哪里不对\"、不当场辩解、先听完），并公开承认自己的错误。权威位置会天然屏蔽反对声音，机制是对抗这种屏蔽的唯一办法。", "shot": "分镜/画面提示：① 会议室女主问\"谁会告诉我\"，全场沉默。② 她立规矩时的正面，语气严肃。③ 一个月后经理甲紧张开口，女主说\"说下去\"。④ 女主公开承认\"是我关早了\"，众人表情松动。"}, {"no": 75, "title": "三家店的资源怎么分", "meta": "约 110 秒 · 场景：区域会议 · 知识：组合内角色定位", "scenes": ["场 1　区域三店：旗舰店、中端店、机场店。预算怎么分，吵起来了。", "场 2　她在白板上写了三个词。", "场 3　半年后，三家店的报表第一次都好看。"], "lines": [{"sp": "店总甲", "tx": "旗舰店贡献六成利润，资源就该给它。"}, {"sp": "店总乙", "tx": "中端店增长最快，投我这边回报更高。"}, {"sp": "林薇", "tx": "（打断）先别争\"谁该多拿\"。先定每家店在组合里的角色。"}, {"sp": "店总甲", "tx": "角色？"}, {"sp": "林薇", "tx": "旗舰店扛品牌与高价，不追量；中端店扛增长与份额；机场店扛稳定现金流，抗周期。"}, {"sp": "店总甲", "tx": "那我不考核增长率了？"}, {"sp": "林薇", "tx": "对。你考核品牌溢价和口碑。你为了增长率去接低价团，就把旗舰店做坏了。"}, {"sp": "店总乙", "tx": "那我呢？"}, {"sp": "林薇", "tx": "你考核份额和增速。但你不用扛品牌，所以你可以打得凶一点。"}, {"sp": "店总甲", "tx": "（翻报表）我这个季 RevPAR 涨了 9%，还都是高价客。"}, {"sp": "店总乙", "tx": "我份额涨了 3 个点。"}, {"sp": "店总丙", "tx": "我现金流最稳，旺季还能往你们两家匀客人。"}, {"sp": "林薇", "tx": "（看着三张报表）这才是组合。不是三个各自拔尖的店，是三个互相补位的店。"}, {"sp": "林薇", "tx": "（画外音）很多人以为多店管理是\"让每家店都做到最好\"。其实是要让它们做到不一样，然后加起来最好。"}], "know": "本集知识点｜多店/多品牌管理要先定义角色（品牌 / 增长 / 现金流），再按角色配置资源与差异化考核指标。用同一指标考核所有单元，会让它们偏离各自定位去做指标上好看的事，组合失去互补性。", "shot": "分镜/画面提示：① 区域会议三家店总争执，气氛紧张。② 白板上三个词：品牌/增长/现金流，箭头连接。③ 女主逐个讲考核口径，店总们表情变化。④ 半年后三张报表并排，字幕\"让它们做到不一样，加起来最好\"。"}, {"no": 76, "title": "系统上线", "meta": "约 110 秒 · 场景：会议室 · 知识：系统与责任归属", "scenes": ["场 1　RMS 上线，众人欢呼。林薇却泼了冷水。", "场 2　她讲了系统上线后最容易发生的事。", "场 3　一个月后，系统第一次给了个明显不合理的建议。"], "lines": [{"sp": "小马", "tx": "终于不用手算了！系统会自动给建议价。"}, {"sp": "林薇", "tx": "那我问一句：如果它给的价格这个月少赚 80 万，谁负责？"}, {"sp": "小马", "tx": "（愣）……系统是按模型算的。"}, {"sp": "林薇", "tx": "对，它不会负责。系统能替我们算，不能替我们负责。"}, {"sp": "林薇", "tx": "你们以后会听到一句话：\"这个价是系统算的。\""}, {"sp": "小马", "tx": "那不挺好吗，有依据。"}, {"sp": "林薇", "tx": "不好。它跟当年的\"我以为\"是同一句话，只是换了个主语。"}, {"sp": "林薇", "tx": "所以从今天起，任何人接受系统建议，都要能说出它为什么这么建议。说不出，就不许点确认。"}, {"sp": "小马", "tx": "那不是更累？"}, {"sp": "林薇", "tx": "累。但你要是只会点确认，这个岗位就不需要你了。"}, {"sp": "小马", "tx": "（兴奋）它让我把行政房降到 380！"}, {"sp": "林薇", "tx": "（过来看）你为什么觉得它不合理？"}, {"sp": "小马", "tx": "因为它看的是上周数据，可下周有展会。"}, {"sp": "林薇", "tx": "（笑）好。你看出来了，说明你比它强。现在把它覆盖掉，写清理由。"}, {"sp": "林薇", "tx": "（画外音）那天我很高兴。不是因为系统错了，是因为他看出来了。会用工具的人和会被工具用的人，差别就在这一下。"}], "know": "本集知识点｜系统（RMS）引入的边界：算得更快 ≠ 能负责。两条纪律：① 接受系统建议必须能解释其理由；② \"系统算的\"不能成为责任转移的借口（与\"我以为\"同类）。人的价值在于能识别系统未见的情境（如未来事件）。", "shot": "分镜/画面提示：① 会议室系统界面演示，众人欢呼，女主皱眉。② 她讲\"只会点确认，岗位就不需要你\"。③ 一个月后小马发现异常，兴奋汇报。④ 女主让他覆盖并写理由，字幕\"会用工具和会被工具用，差别就在这一下\"。"}, {"no": 77, "title": "第一个接班人", "meta": "约 110 秒 · 场景：面试间 / 办公室 · 知识：接班人标准", "scenes": ["场 1　她挑了个\"会顶嘴\"的年轻人。HR 不理解。", "场 2　她把这个年轻人叫来，直说了。", "场 3　半年后，这个人真的在会上顶了她一次。"], "lines": [{"sp": "HR", "tx": "这个候选人面试时跟您争了三次，不太服管。"}, {"sp": "林薇", "tx": "（笑）我要的就是这个。顶嘴的人才会说\"不\"。"}, {"sp": "HR", "tx": "可管理起来费劲……"}, {"sp": "林薇", "tx": "我这个位置最怕的不是费劲，是我说错的时候没人拦我。"}, {"sp": "林薇", "tx": "我选你，不是因为你最能干。是因为你敢在面试时跟我争。"}, {"sp": "年轻人", "tx": "（不好意思）我那时候太冲了。"}, {"sp": "林薇", "tx": "不冲。你要是那天顺着我说，我现在不会坐在这儿跟你讲话。"}, {"sp": "林薇", "tx": "但我也要提醒你：顶嘴要有依据。没有依据的顶嘴叫抬杠，抬杠的人走不远。"}, {"sp": "年轻人", "tx": "（记下）……要有依据。"}, {"sp": "年轻人", "tx": "林总，这个长住包我觉得不该停。它现在 RevPAR 是低，但它是我们唯一稳定的现金流。"}, {"sp": "林薇", "tx": "（停顿）……你说得对。"}, {"sp": "年轻人", "tx": "（愣住）您不生气？"}, {"sp": "林薇", "tx": "（笑）我等这一天等了半年。能算的人好找，敢说不的人难找。"}, {"sp": "林薇", "tx": "（画外音）等我到了没人敢反驳的位置，那才叫危险。所以我一直在给自己安排\"对手\"。"}], "know": "本集知识点｜接班人的核心特质不是顺从或能力最强，而是具备在权威面前坚持判断的意愿与能力——这是防止组织走向\"无人纠错\"的关键。同时要配套要求：顶嘴必须有依据，否则退化为抬杠。", "shot": "分镜/画面提示：① 面试间两人对视，气氛紧张，HR 在旁为难。② 女主直说\"我选你是因为你敢争\"。③ 年轻人在会上顶撞她，全场屏息。④ 女主笑着承认，字幕\"能算的人好找，敢说不的人难找\"。"}, {"no": 78, "title": "有人来挖她", "meta": "约 105 秒 · 场景：咖啡厅 / 办公室 · 人性线：职业选择的判断框架", "scenes": ["场 1　咖啡厅。猎头代表对方开出条件。", "场 2　当晚，她在家。翻着两个东西：一张是这十年的工资条，一张是她带过的人的名单。", "场 3　第二天，她去找老周，没提 offer，只问了一个问题。", "场 4　她回绝了 offer。三个月后，集团批复：收益管理独立成体系。"], "lines": [{"sp": "对方", "tx": "薪资翻倍，职级给集团收益总监，而且——你可以带团队过去。我们看重的就是你这套体系。"}, {"sp": "林薇", "tx": "带团队过去？"}, {"sp": "对方", "tx": "对。你挑人，我们照单全收。"}, {"sp": "林薇", "tx": "（沉默）……我考虑三天。"}, {"sp": "周航", "tx": "翻倍啊。还犹豫什么？"}, {"sp": "林薇", "tx": "我在想\"带团队过去\"这五个字。"}, {"sp": "周航", "tx": "那不是好事吗？"}, {"sp": "林薇", "tx": "如果我去，带走了小马、带走两个店最好的收益经理——那三家店就空了。我花了四年搭起来的东西，一走就散。"}, {"sp": "周航", "tx": "可他们给得起钱，你在这儿他们给不起。"}, {"sp": "林薇", "tx": "（看着名单）我不是在算钱。我在算另一件事——我走之后，这里会变成什么样？"}, {"sp": "林薇", "tx": "周总，如果我不在了，这个体系还转得下去吗？"}, {"sp": "老周", "tx": "（愣了一下）……你想跳槽？"}, {"sp": "林薇", "tx": "有人找我。我在想，如果我答应的条件之一必须是\"带人走\"，那说明我的价值在他们眼里是我带的那批人，不是我。（停顿）而那批人是这儿长出来的。"}, {"sp": "老周", "tx": "（沉默很久）你要什么条件才留下？"}, {"sp": "林薇", "tx": "我不要钱。我要两件事：一、收益体系的岗位编制独立出来，不再挂在销售下面；二、我带的人，职级和薪资由体系评定，不由某一个人说了算。"}, {"sp": "老周", "tx": "（笑）你这不是在谈条件，你是在改制度。"}, {"sp": "林薇", "tx": "对。因为我受够了\"换一个领导，一切归零\"。"}, {"sp": "林薇", "tx": "（画外音）钱会有的。但\"我走之后这里变成什么样\"这件事，钱买不回来。"}], "know": "本集落点｜职业选择的判断框架：当 offer 的核心条件包含\"带团队/带资源\"时，要分清对方买的是你的能力，还是你积累的存量。更高阶的选择是用这次机会换取\"制度化\"——把个人能力变成岗位编制与评价体系，这样即便你走了，体系也不会归零。留下来改制度，有时比拿翻倍薪资更值。", "shot": "分镜提示：① 咖啡厅，对方推过一张写有数字的纸，林薇低头看。② 家中台灯下，她翻看工资条与人员名单两张纸，对比构图。③ 老周办公室，她说\"我在改制度\"时的正面特写。④ 集团批复文件特写，红章。⑤ 字幕\"我走之后这里变成什么样，钱买不回来\"。"}, {"no": 79, "title": "老周退休", "meta": "约 110 秒 · 场景：总经理办公室 · 知识：交接与提醒", "scenes": ["场 1　老周收拾办公室。林薇来送他。", "场 2　老周说了实话。", "场 3　他递给她一个旧本子。"], "lines": [{"sp": "老周", "tx": "你比我会算。"}, {"sp": "林薇", "tx": "您教了我很多。"}, {"sp": "老周", "tx": "（摇头）我没教你最要紧的那个。你有一件事不如我：你不太会照顾自己。"}, {"sp": "林薇", "tx": "（愣）"}, {"sp": "老周", "tx": "这些年你扛下来的，一半是市场给的，一半是人给的。"}, {"sp": "老周", "tx": "市场那半你算得清，人那半你都自己咽了。"}, {"sp": "林薇", "tx": "说出来也没用。"}, {"sp": "老周", "tx": "有用。咽下去的东西不会消失，它会换个地方长出来。你不说，它就长在你身上。"}, {"sp": "老周", "tx": "我这辈子最后悔的一件事，就是有三年总觉得\"忍忍就过去了\"，结果忍出了一身病。"}, {"sp": "老周", "tx": "这是我当年的兜房本，你师父那本的兄弟。拿去，别学我。"}, {"sp": "林薇", "tx": "（接过，很久）……我记住了。"}, {"sp": "老周", "tx": "记住不够。你得真的找个人说。"}, {"sp": "林薇", "tx": "（画外音）他走的那天，我在办公室坐了很久。我算过无数笔账，唯独没算过自己这一笔。"}], "know": "本集知识点｜（管理心理）长期承受结构性不公的隐性代价不会消失，会转化为健康问题或职业倦怠。可持续的职业生涯需要\"外化\"机制：记录、倾诉、制度化解决，而非独自消化。能算账的人，也要算自己这一笔。", "shot": "分镜/画面提示：① 老周收拾办公室，纸箱、旧物，午后阳光。② 他讲\"人那半你都自己咽了\"，女主沉默。③ 老周递过旧兜房本，手部特写。④ 女主独自坐在办公室，字幕\"我算过无数笔账，唯独没算过自己这一笔\"。"}, {"no": 80, "title": "区域收益总监", "meta": "约 110 秒 · 场景：区域会议 · 知识：多店管理标准化", "scenes": ["场 1　上任第一天，她把三家店的例会格式统一了。", "场 2　她又统一了第二件事。", "场 3　三个月后，她第一次能横向比较三家店。"], "lines": [{"sp": "店总甲", "tx": "我们店有自己的节奏，为什么要跟他们一样？"}, {"sp": "林薇", "tx": "节奏可以不同，但\"看过去—看未来—定动作—分活儿\"这四步必须一样。"}, {"sp": "店总甲", "tx": "为什么？"}, {"sp": "林薇", "tx": "因为我要能在十分钟内看懂任何一家店的状态。格式不统一，我看到的就不是业务，是翻译成本。"}, {"sp": "林薇", "tx": "数据口径统一。以后\"出租率\"三个字，三家店必须指同一个东西。"}, {"sp": "店总乙", "tx": "我们一直把自用房算在里面……"}, {"sp": "林薇", "tx": "从下个月起不算。自用房单列。不然你们三家报上来的数，我加不起来。"}, {"sp": "店总乙", "tx": "（不服）那我们的出租率会掉。"}, {"sp": "林薇", "tx": "会掉。但掉在纸上的数字，比错在决策里的数字便宜得多。"}, {"sp": "林薇", "tx": "（看着三张格式一致的报表）现在我能一眼看出，机场店的问题在周末，不在周中。"}, {"sp": "小马", "tx": "以前看不出来吗？"}, {"sp": "林薇", "tx": "看不出来。以前三家报三个样，我光换算就花掉两个小时，还没算对。"}, {"sp": "林薇", "tx": "（画外音）标准化听起来是最没意思的工作。但没有它，后面所有聪明的事都做不了。"}], "know": "本集知识点｜多店管理的第一步是标准化：会议结构统一、指标口径统一（如自用房单列、口径一致）。口径不一致时，横向对比与资源调配都建立在错误基础上；短期会让数字\"变难看\"，但远优于用错误数字做决策。", "shot": "分镜/画面提示：① 区域会议三份格式各异的报表被摊在桌上。② 女主讲\"翻译成本\"，店总们不服。③ 新格式推行，众人重新填表。④ 三个月后三张统一报表并排，女主一眼看出问题，字幕\"没有标准化，后面所有聪明的事都做不了\"。"}, {"no": 81, "title": "十二家店不是一个数字", "meta": "约 110 秒 · 场景：集团会议 · 知识：组合视角 vs 平均值", "scenes": ["场 1　第一次集团会。汇报口径是\"集团平均 RevPAR 412\"。", "场 2　她当场把平均值拆开。", "场 3　新口径第一次用，就抓出了真问题。"], "lines": [{"sp": "林薇", "tx": "（举手）这个口径，我建议取消。"}, {"sp": "高管", "tx": "为什么？"}, {"sp": "林薇", "tx": "因为它是六家涨、六家跌平均出来的。看到 412，您什么都不会去做；拆开看，您会知道有三家需要立刻处理。"}, {"sp": "林薇", "tx": "这六家涨的，平均涨 9%；那六家跌的，平均跌 11%。两头一平均，看起来风平浪静。"}, {"sp": "高管", "tx": "（翻新表）……有三家跌超过 15%。"}, {"sp": "林薇", "tx": "是。平均值最大的害处不是不准确，是它让问题看起来不值得动手。以后按店分档：健康、观察、预警。预警的单独讲原因和动作。"}, {"sp": "林薇", "tx": "（指表）这三家预警店有个共同点：三家都是去年新上任的店总。"}, {"sp": "高管", "tx": "那说明什么？"}, {"sp": "林薇", "tx": "说明不是市场问题，是新店总还没学会这套。那我的动作就不是救市，是去教人。"}, {"sp": "林薇", "tx": "（画外音）从平均值换成三档，我们才看见真正的问题。一个数字换一种看法，看见的就是另一件事。"}], "know": "本集知识点｜平均值会掩盖结构性问题（六家涨六家跌平均后看似平稳）。多店管理应分档呈现（健康/观察/预警）并单独处理异常单元。分档后还能发现共性成因（如均为新店总），从而把\"救市\"重新定义为\"培养人\"。", "shot": "分镜/画面提示：① 集团会议大屏\"集团平均 RevPAR 412\"，女主举手。② 她把平均值拆成两栏：六家涨/六家跌。③ 新报表三档着色：健康绿/观察黄/预警红。④ 女主指出三家预警店共性，字幕\"换一种看法，看见另一件事\"。"}, {"no": 82, "title": "好店和差店怎么分工", "meta": "约 110 秒 · 场景：集团会议 · 知识：差异化考核", "scenes": ["场 1　她给十二家店画了三张卡：品牌、增长、现金流。", "场 2　有店总不服。", "场 3　一年后，组合效应出来了。"], "lines": [{"sp": "小马", "tx": "这样分，差店会不会觉得被放弃了？"}, {"sp": "林薇", "tx": "所以要换考核：旗舰店考核品牌溢价与口碑，不考核增长率；中端店考核份额与增速；机场店考核现金流稳定性。"}, {"sp": "店总甲", "tx": "都是开店，凭什么他们能追增长，我就不能？"}, {"sp": "林薇", "tx": "因为你那个位置，追增长就是拿品牌换量。你一接低价团，客群就变了，明年高价客也不来了。"}, {"sp": "店总甲", "tx": "那我的奖金……"}, {"sp": "林薇", "tx": "按品牌溢价算，不比他们少。你守住的那些高价客，是给整个集团撑价格的。没有你，中端店也卖不上价。"}, {"sp": "林薇", "tx": "（汇报）整体 RevPAR 涨 6%，更重要的是：我们没靠降价拿到这个增长。旗舰店把价格天花板抬高了 8%，中端店拿了份额，机场店淡季没亏。三家各干各的，加起来才成立。"}, {"sp": "林薇", "tx": "（画外音）多店管理最难的不是管好每一家，是忍住不让每一家都去争同一件事。"}], "know": "本集知识点｜组合内角色分工（品牌 / 增长 / 现金流）配以差异化考核指标。用统一指标考核所有店，会让品牌店为达标牺牲价格定位。组合收益来自互补而非各自最优。", "shot": "分镜/画面提示：① 白板十二家店分入三个框，箭头标注角色。② 店总甲不服，女主解释。③ 一年后三张贡献数据并列。④ 女主汇报正面，字幕\"忍住不让每一家都争同一件事\"。"}, {"no": 83, "title": "涨不动了", "meta": "约 110 秒 · 场景：集团会议 · 知识：增长动力的切换", "scenes": ["场 1　ADR 连续六个季度停滞。所有人都在找出路。", "场 2　她换了四个格子。", "场 3　半年后，四个方向都跑出了一点。"], "lines": [{"sp": "小马", "tx": "要不要再提一波价？"}, {"sp": "林薇", "tx": "提不动了。客人变理性了——他会比价、会等、会选更便宜的替代品。"}, {"sp": "小马", "tx": "那增长从哪来？"}, {"sp": "林薇", "tx": "不能再从\"每间房卖更贵\"来，要从每个客人身上多赚一点、每个空档多填一点来。"}, {"sp": "林薇", "tx": "四个方向：附加消费、非房收入、淡季填谷、成本端。"}, {"sp": "高管", "tx": "哪个最快？"}, {"sp": "林薇", "tx": "附加消费最快，因为它不用多卖一间房。客人已经来了，我们要做的是让他多花 30 块。"}, {"sp": "高管", "tx": "（翻报表）ADR 还是没涨，但利润涨了 7%。"}, {"sp": "林薇", "tx": "对。我们换了个引擎。"}, {"sp": "小马", "tx": "那以后还看 ADR 吗？"}, {"sp": "林薇", "tx": "看。但只看它，会让你以为自己没在进步。有些增长不长在价格上。"}], "know": "本集知识点｜当 ADR 增长停滞（需求侧天花板），增长动力须切换至非房收入、附加消费、填谷与成本优化。继续依赖提价会导致量价双失。评估口径也要随之扩展：只看 ADR 会低估实际经营改善。", "shot": "分镜/画面提示：① ADR 曲线六个季度走平，众人焦虑。② 女主在白板画四个新格子。③ 她讲\"让已来的客人多花 30 块\"。④ 半年后 ADR 平、利润升的双曲线，字幕\"有些增长不长在价格上\"。"}, {"no": 84, "title": "下沉市场", "meta": "约 110 秒 · 场景：区域会议 · 知识：方法论可复制，参数不可", "scenes": ["场 1　三四线城市的店增长最快，但玩法完全不同。", "场 2　她当场做了个决定。", "场 3　新模板推行三个月，下沉店自己调出了花样。"], "lines": [{"sp": "店总", "tx": "我们这边没有商务客，全靠节假日和本地宴请。照总部那套周中高价、周末低价，完全反了。"}, {"sp": "林薇", "tx": "那就别照。日历要按自己的客源重画。"}, {"sp": "店总", "tx": "可总部的系统里模板是一套……"}, {"sp": "林薇", "tx": "模板是给\"典型商务店\"的。你们是\"典型本地需求店\"，要单独配一套周内曲线和价格档。"}, {"sp": "小马", "tx": "那以后每家店都要单独配？"}, {"sp": "林薇", "tx": "不。我配三种模板：商务型、度假型、本地型。新店开的时候对号入座，别都用第一套。"}, {"sp": "林薇", "tx": "记住：方法是可以复制的，参数不能。把一线城市的参数套到下沉市场，是常见的灾难。"}, {"sp": "店总", "tx": "（兴奋）我们发现本地宴请最旺的是\"办事\"，不是周末——我们做了个\"办事包\"，含宴会厅和房间。"}, {"sp": "林薇", "tx": "（笑）这个好。你们比总部懂你们的客人。"}, {"sp": "林薇", "tx": "（记笔记）这个包，我要拿到别的下沉店去试。"}], "know": "本集知识点｜不同市场的需求日历与客源结构不同，系统模板（多为商务型）需按本地客源重设。可复制的是方法论，不是参数。集团层应提供多套模板（商务/度假/本地）而非单一模板，并收集一线创新向上推广。", "shot": "分镜/画面提示：① 区域会议店总诉苦\"完全反了\"，女主点头。② 白板上三套模板并列：商务/度假/本地。③ 下沉店总兴奋讲\"办事包\"。④ 女主记笔记准备推广，字幕\"方法可复制，参数不能\"。"}, {"no": 85, "title": "直播卖房", "meta": "约 110 秒 · 场景：会议室 / 预订部 · 知识：定价权旁落", "scenes": ["场 1　一场直播卖出 3000 间夜，价格是主播定的。", "场 2　她没有一棍子打死。", "场 3　三个月后，直播带来的客人确实有流失。"], "lines": [{"sp": "小唐", "tx": "一晚上 3000 间夜！这个渠道太猛了。"}, {"sp": "林薇", "tx": "（看着价格）399。我们平日卖 620。"}, {"sp": "小唐", "tx": "可量在这儿啊！"}, {"sp": "林薇", "tx": "量是真的。但这次的价格不是我们定的。客人以后会拿 399 来比价——我们自己的价格体系被这一场拉低了。"}, {"sp": "小唐", "tx": "那这渠道还用不用？"}, {"sp": "林薇", "tx": "用。但要限定三件事：特定日期、特定房型、不可退改。"}, {"sp": "小唐", "tx": "为什么不可退改？"}, {"sp": "林薇", "tx": "因为直播卖的量大，如果还能退，我们等于把库存交给一个不知道会退多少的人。锁死了，量的账才算得清。"}, {"sp": "林薇", "tx": "而且日期要选：只卖淡日，不卖旺日。旺日我们本来就满，没必要让出去。"}, {"sp": "小马", "tx": "（查数据）有三成人订了又退……还好我们写了不可退改。"}, {"sp": "林薇", "tx": "那三成没退成的，就是我们的损失。但另外七成是真来的。这个比例，我记下来了。"}, {"sp": "林薇", "tx": "（画外音）新渠道不是坏事。坏事是让它的价格成为你所有客人心里的那个价。"}], "know": "本集知识点｜直播等新渠道的核心风险是价格锚点被外部设定。使用四原则：限日期（只卖淡日）、限房型、不可退改、限数量；并跟踪实际转化率（直播的退订率通常远高于常规渠道）。目的是把它隔离为独立产品，避免冲击主力价格体系。", "shot": "分镜/画面提示：① 会议室手机直播画面，销量数字飞涨，众人兴奋。② 女主盯着\"399\"沉默。③ 她讲\"限定三件事\"，白板写下。④ 三个月后转化数据表，字幕\"别让它的价格成为客人心里的那个价\"。"}, {"no": 86, "title": "最低价条款", "meta": "约 110 秒 · 场景：会议室 · 知识：最惠国条款与流量挟持", "scenes": ["场 1　平台要求\"全网最低价\"，否则降权。", "场 2　她把话说透了。", "场 3　谈判结束后，她给团队留了个规矩。"], "lines": [{"sp": "平台经理", "tx": "给我们独家最低价，我们给头部流量位。不给的话，排序会往后。"}, {"sp": "林薇", "tx": "给了你们最低价，我们官网就不能更低了——那我们等于放弃了自己的直销渠道。"}, {"sp": "平台经理", "tx": "但流量在我们这儿。"}, {"sp": "林薇", "tx": "流量在你这儿，客人在我这儿。"}, {"sp": "林薇", "tx": "你今天要的是价格，明天要的就是佣金，后天要的是客人数据。每一次让步，下一次谈判的起点就更低。"}, {"sp": "平台经理", "tx": "（笑）林总，您这是把我想得太坏了。"}, {"sp": "林薇", "tx": "不是想坏。是看机制。你们内部有 KPI，KPI 会一直要增长——这个增长只能从我们身上拿。"}, {"sp": "林薇", "tx": "我的答复是：可以给你活动价，但限时段、限量、限定房型。主力价格不行。"}, {"sp": "小马", "tx": "他们会不会真的给我们降权？"}, {"sp": "林薇", "tx": "会。降权一个月，我们少赚多少，我算过了，比把主力价格交出去少得多。"}, {"sp": "小马", "tx": "那我们怎么扛？"}, {"sp": "林薇", "tx": "靠会员。我们的客人直接来找我们，就不怕他那儿排序。所以我才一直说，会员是命。"}], "know": "本集知识点｜最惠国/最低价条款的本质是用流量换取定价权，且是单向棘轮：第一次让步会成为下次谈判的起点，后续索取会依次升级（价格→佣金→数据）。应对方式是以\"限定条件\"替代\"全面让步\"：限时段、限量、限房型，保住主力价格与直销能力。", "shot": "分镜/画面提示：① 会议室平台经理微笑提条件，女主平静。② 她讲\"价格→佣金→数据\"的递进，手指逐项点过。③ 她说\"限时段、限量、限房型\"，白板记录。④ 会后讲\"靠会员\"，字幕\"每一次让步，下次起点更低\"。"}, {"no": 87, "title": "定价权这一仗", "meta": "约 110 秒 · 场景：会议室 · 知识：全成本核算的谈判", "scenes": ["场 1　她带着一份测算去谈，不是谈感情，是谈账。", "场 2　她把算法讲给对方听，也讲给自己人听。", "场 3　谈完，她给团队讲了为什么必须算这么细。"], "lines": [{"sp": "林薇", "tx": "按你们要的价格，我们一年多卖 4 万间夜。听起来很好。"}, {"sp": "平台经理", "tx": "那还犹豫什么？"}, {"sp": "林薇", "tx": "但这 4 万里，有 60% 是本来会从我们官网订的人——他们只是换了个更便宜的地方订同一间房。"}, {"sp": "平台经理", "tx": "（翻测算）……你怎么算出来的？"}, {"sp": "林薇", "tx": "我们追踪了三批客人：从你们那儿来的、从官网来的、两边都比过的。净增量只有 1.6 万，不是 4 万。"}, {"sp": "林薇", "tx": "扣掉佣金，扣掉被拉低的价格锚带来的损失，我们一年净亏 280 万。"}, {"sp": "平台经理", "tx": "（沉默）……你们算得这么细。"}, {"sp": "林薇", "tx": "我不谈判，我只算账。账算清楚了，谈不谈得成，双方都知道自己在做什么。"}, {"sp": "小马", "tx": "薇姐，算这么细，他们会不会不高兴？"}, {"sp": "林薇", "tx": "会。但你拿不出数，就只能拿态度去谈——态度是最不值钱的东西。"}, {"sp": "林薇", "tx": "而且算清楚有个好处：如果算完发现是赚的，我们就签。不会因为\"总觉得亏\"错失一个好渠道。"}], "know": "本集知识点｜渠道谈判要用全成本核算：区分\"净增量\"与\"渠道转移量\"（通过客群追踪测算），扣除佣金与价格锚损失。多数\"量很大\"的合作，扣完转移量后是亏损的。且全成本核算是双向的——算完发现划算，就该签，避免凭感觉错失机会。", "shot": "分镜/画面提示：① 会议室女主把测算推过去，平台经理翻阅。② 两栏对比：4 万间夜 vs 净增 1.6 万间夜。③ 女主说\"我不谈判，我只算账\"。④ 会后讲\"拿不出数就只能拿态度\"，字幕\"态度是最不值钱的东西\"。"}, {"no": 88, "title": "AI 来了", "meta": "约 110 秒 · 场景：集团会议室 · 技术线：AI 与责任归属", "scenes": ["场 1　集团会议室。IT 负责人演示 AI 定价系统。", "场 2　会后，年轻经理追上来。", "场 3　她给 AI 项目提了三条要求。"], "lines": [{"sp": "IT", "tx": "这套系统每 15 分钟重算一次全渠道价格，比人工快 200 倍。上线后，各店收益经理只需要确认它的建议。"}, {"sp": "年轻经理", "tx": "（兴奋）那我们是不是不用熬夜调价了？"}, {"sp": "另一位", "tx": "（低声）……那还要我们干嘛。"}, {"sp": "林薇", "tx": "（举手）我问一个问题：如果它给出的价格，让这个月少赚了 80 万——谁负责？"}, {"sp": "IT", "tx": "（愣）这个……系统是按模型最优解的……"}, {"sp": "林薇", "tx": "那我再问：如果它建议涨价 30%，结果客人全跑了、网上骂声一片，第二天谁去跟总经理解释？谁去跟销售解释？谁去跟客人解释？"}, {"sp": "全场（安静）\n林薇", "tx": "我不是反对 AI。我是要说清楚一件事：AI 能替我们算，不能替我们负责。责任还在人身上，所以判断也必须在人身上。"}, {"sp": "年轻经理", "tx": "林总，那我们……会不会被取代？"}, {"sp": "林薇", "tx": "被取代的会有一部分是\"算数\"。（停顿）我做了十九年。前十年，我一半的时间在算数，一半在判断。现在算数这部分确实可以交给机器了——那我应该高兴才对，因为我终于可以只做判断了。"}, {"sp": "年轻经理", "tx": "可……判断不是也最难吗？"}, {"sp": "林薇", "tx": "对，所以才值钱。算数会被取代，判断不会——因为判断要承担后果，而机器不承担后果。"}, {"sp": "林薇", "tx": "第一，系统必须给出理由，不能只给一个数字——没有理由的建议，我们无法判断它对不对。"}, {"sp": "林薇", "tx": "第二，人工覆盖必须留记录，写清为什么不接受它的建议。"}, {"sp": "林薇", "tx": "第三，异常情况要自动停下来问人——遇到没见过的情况，不要自己拍板。"}, {"sp": "林薇", "tx": "（合上本子）一句话：让它算，让它建议，让它记录。但别让它决定。"}], "know": "本集落点｜AI 进入收益管理的边界：算得更快 ≠ 能负责。判断之所以属于人，是因为判断要承担后果（对客人、对总经理、对品牌）。落地三条原则：① 系统必须给出可审查的理由；② 人工覆盖留记录；③ 异常场景交还给人（AI 不该在自己没见过的情况下拍板）。", "shot": "分镜提示：① 集团会议室大屏演示 AI 定价界面，数字快速跳动，众人仰头。② 林薇举手提问的正面特写，全场安静。③ 年轻经理追出走廊，两人对话的侧影。④ 三条要求的手写笔记特写，字幕\"让它算，让它建议，别让它决定\"。"}, {"no": 89, "title": "把判定表变成引擎", "meta": "约 110 秒 · 场景：办公室 · 知识：规则库与决策引擎", "scenes": ["场 1　她把十九年的经验，拆成一条条规则交给系统。", "场 2　她讲了规则化的三重价值。", "场 3　规则库第一版完成的那天。"], "lines": [{"sp": "小马", "tx": "薇姐，你把这些都写进去了，那你……不就没用了？"}, {"sp": "林薇", "tx": "（笑）恰恰相反。写进去的是\"遇到 A 情况该做 B\"，那是过去十九年我遇到的情况。"}, {"sp": "小马", "tx": "那不就是全部了吗？"}, {"sp": "林薇", "tx": "不是。真正难的永远是没遇到过的情况——系统没见过，人也没见过，那才要判断。"}, {"sp": "林薇", "tx": "第一，常规判断自动化，人专注异常。第二，知识不随个人流失。第三，规则可以被审查、被修正、被继承。"}, {"sp": "小马", "tx": "第二条最重要吧？"}, {"sp": "林薇", "tx": "对我最重要。我一个人能守住的只有一家店，规则能守住所有店。"}, {"sp": "林薇", "tx": "这些年我见过太多\"某个能人一走，那家店就垮了\"。那不是能人厉害，是那个东西从来没被写下来过。"}, {"sp": "小马", "tx": "（翻着清单）三百多条了。"}, {"sp": "林薇", "tx": "还差得远。但至少现在，谁照着做都不会太离谱。"}, {"sp": "林薇", "tx": "以后每遇到一个新情况，处理完就加一条。这个库是活的，它会比我们任何一个人活得久。"}], "know": "本集知识点｜把经验规则化的三重价值：① 常规判断自动化，人力专注异常；② 知识不随个人流失（解决\"能人依赖\"）；③ 规则可被审查、修正、传承。规则库是活资产——每次处理新情况后应回写一条。", "shot": "分镜/画面提示：① 女主把手写经验卡片逐条录入系统。② 屏幕上规则条目不断增加。③ 她讲\"我守住一家店，规则守住所有店\"。④ 规则库清单翻到最后一页，字幕\"它会比我们任何人活得久\"。"}, {"no": 90, "title": "第一版 AI 收益助手", "meta": "约 110 秒 · 场景：办公室 · 知识：人机分工", "scenes": ["场 1　上线第一天，AI 给了一个离谱的建议。小马慌了。", "场 2　她讲了真正可怕的是什么。", "场 3　他们查出了它为什么错。"], "lines": [{"sp": "小马", "tx": "它建议我们把行政房降到 380！这要是执行了……"}, {"sp": "林薇", "tx": "（看着屏幕，反而笑了）好。第一天就出错，是好事。"}, {"sp": "小马", "tx": "啊？"}, {"sp": "林薇", "tx": "因为它错得离谱，你们才会去查它为什么错。"}, {"sp": "林薇", "tx": "如果它错得\"看起来有道理\"，那才可怕——我们会跟着它错三年都不知道。"}, {"sp": "小马", "tx": "那我们怎么防？"}, {"sp": "林薇", "tx": "三件事：一、它必须给理由；二、你覆盖它时要写为什么；三、没见过的情况它要停下来问人。"}, {"sp": "林薇", "tx": "让它算，让它建议，让它记录。但别让它决定。"}, {"sp": "小马", "tx": "它用的是上个月的数据，那批行政房当时没人订。"}, {"sp": "林薇", "tx": "（点头）所以它\"学\"到的是错的规律。数据脏，模型就一定错。"}, {"sp": "林薇", "tx": "去把那批数据标出来，标完再喂一次。以后每发现一次这种错，就回写一条规则。"}], "know": "本集知识点｜AI 上线的正确心态：明显的错误是礼物——它暴露训练数据与规则的缺口；真正危险的是\"看似合理实为错误\"的建议，会被长期执行而无人察觉。落地三原则：系统给理由、人工覆盖留记录、异常交还给人。", "shot": "分镜/画面提示：① 屏幕弹出 AI 建议\"行政房 380\"，小马惊慌。② 女主反而笑了，众人意外。③ 白板写下三条原则。④ 两人追踪到脏数据源，字幕\"数据脏，模型就一定错\"。"}, {"no": 91, "title": "有人反对", "meta": "约 110 秒 · 场景：会议室 · 知识：岗位价值的迁移", "scenes": ["场 1　年轻收益经理联名担心被取代。林薇开了一次会。", "场 2　她讲了自己的经历。", "场 3　会散后，那个年轻经理留下来。"], "lines": [{"sp": "年轻经理", "tx": "如果 AI 都能定价了，我们做什么？"}, {"sp": "林薇", "tx": "被取代的是算数，不是判断。"}, {"sp": "年轻经理", "tx": "可我们大部分时间都在算……"}, {"sp": "林薇", "tx": "对，所以你们要往前挪一步：从\"算出来\"挪到\"判断它对不对、该不该听它的\"。"}, {"sp": "林薇", "tx": "我做了十九年。前十年一半时间在算，一半在判断。现在算的那部分可以交给机器了——我应该高兴，因为我终于可以只做判断了。"}, {"sp": "年轻经理", "tx": "可判断不是也最难吗？"}, {"sp": "林薇", "tx": "对，所以才值钱。算数会被取代，判断不会——因为判断要承担后果，机器不承担后果。"}, {"sp": "林薇", "tx": "它算错了，明天照常上班。你们算错了，要跟客人解释、跟店总解释、跟自己的良心解释。"}, {"sp": "年轻经理", "tx": "林总，那我该怎么练判断？"}, {"sp": "林薇", "tx": "去承担后果。你今天做的决定，写下来；三个月后回来看它对不对。一年下来，你就有了自己的判断力。"}, {"sp": "林薇", "tx": "（画外音）这句话我跟很多人说过。它是我这一行唯一无法被教、只能被练的东西。"}], "know": "本集知识点｜AI 时代岗位价值的迁移方向：从\"产出答案\"转向\"审查与判断答案\"。判断之所以属于人，是因为它要承担后果。培养判断力的方法：记录决定 + 定期回看结果，让判断力在反馈中累积。", "shot": "分镜/画面提示：① 会议室年轻经理们神情不安，女主平静应对。② 她讲\"机器不承担后果\"的正面特写。③ 会后两人对话，女主说\"去承担后果\"。④ 字幕\"判断是唯一无法被教、只能被练的东西\"。"}, {"no": 92, "title": "把人治改成制度", "meta": "约 110 秒 · 场景：集团制度宣贯会 · 人性线：从个人正直到制度正直", "scenes": ["场 1　制度宣贯会。她讲了三件事，台下有人不太舒服。", "场 2　会后，一位老店总留下来。", "场 3　半年后。系统拦下第一次异常预警：某店连续三周价格偏离。"], "lines": [{"sp": "林薇", "tx": "第一件：所有价格变更必须留痕。谁改的、什么时候、从多少改到多少、依据是什么——系统记，删不掉。"}, {"sp": "店总A", "tx": "（低声）这不是不信任我们吗？"}, {"sp": "林薇", "tx": "（听见了）不是不信任，是不让信任变成风险。你是个好人，这我知道；但三年后接你班的那个人，我不认识他。"}, {"sp": "林薇", "tx": "第二件：关键动作双人复核。关房、调价超过阈值、团队房确认——两个人签字。"}, {"sp": "年轻经理", "tx": "那不是变慢了吗？"}, {"sp": "林薇", "tx": "会慢十分钟。但一次操作事故，赔掉的是这十分钟的几千倍。而且——（停顿）双人复核保护的不只是公司，也保护你。出了事，是两个人的记录，不是你一个人的说法。"}, {"sp": "林薇", "tx": "第三件：异常自动预警。某个渠道价格长期偏离、某个店 ADR 与竞争集背离、某笔佣金异常——系统自动报给集团，不经过任何人。"}, {"sp": "老店总", "tx": "林总，你这套东西……是不是因为你以前吃过亏？"}, {"sp": "林薇", "tx": "（笑）吃过。"}, {"sp": "老店总", "tx": "那你为什么不直接抓人？"}, {"sp": "林薇", "tx": "因为我抓不完。抓一个人，只能解决一个人；堵一个洞，能解决所有想往里钻的人。"}, {"sp": "林薇", "tx": "而且说实话——我不相信我能一直看对人。我信的是：把洞堵上之后，就算我看错了人，损失也是有限的。"}, {"sp": "小马", "tx": "（已是收益经理）林总，系统报了，我查了——是渠道专员输错了。"}, {"sp": "林薇", "tx": "（看记录）输错三次都没被发现，说明复核没执行。去查为什么没执行，不是查谁输错的。（停顿）还有——把这条记录留着，作为复核制度的案例。"}, {"sp": "林薇", "tx": "（画外音）我花了十九年才明白：个人正直能守住的，只有自己那一块；制度正直能守住的，是所有人。"}], "know": "本集落点｜从\"靠人\"到\"靠制度\"的三个抓手：① 关键变更留痕（不可删）；② 高风险动作双人复核；③ 异常指标自动预警（绕过人工上报链）。核心认知：惩罚个人只解决一个人，堵住漏洞解决所有想钻的人；且制度化能降低\"看错人\"的损害。", "shot": "分镜提示：① 宣贯会台上，林薇讲三条，台下众人表情各异。② 老店总会后留下的两人对话，暖光，气氛缓和。③ 系统预警界面：红色告警条弹出，标注\"连续 3 周偏离\"。④ 字幕\"个人正直守住自己，制度正直守住所有人\"。"}, {"no": 93, "title": "让回扣不可能发生", "meta": "约 110 秒 · 场景：制度宣贯会 · 知识：合规内建于流程", "scenes": ["场 1　她推的最后一条制度：渠道价格与审批全部进系统。", "场 2　她讲了真正的目的。", "场 3　半年后，系统拦下第一次预警。"], "lines": [{"sp": "小马", "tx": "人工覆盖也不能随便改了？"}, {"sp": "林薇", "tx": "能改，但要写理由，而且理由会留着。我不禁止任何人改价格，我只是要求他写清楚为什么。"}, {"sp": "小马", "tx": "写理由就能防止回扣吗？"}, {"sp": "林薇", "tx": "不能完全防止。但能让\"不合理的改价\"很难连续发生三次而不被发现。"}, {"sp": "小马", "tx": "为什么是三次？"}, {"sp": "林薇", "tx": "因为腐败靠的不是一次，是长期、稳定、不被问。你让它每次都得解释一次，它就没法长期稳定。"}, {"sp": "林薇", "tx": "我不指望制度让人变好。我指望它让坏事变难。"}, {"sp": "小马", "tx": "（查）某店连续三周价格偏离，他们写了理由，但理由每周都一样。"}, {"sp": "林薇", "tx": "（看记录）同样的理由连续出现，系统为什么没更早报？"}, {"sp": "小马", "tx": "因为阈值设的是\"偏离幅度\"，没设\"次数\"。"}, {"sp": "林薇", "tx": "加上。下次遇到同样的理由超过两次，就自动报给集团。制度也是要改的，它跟人一样会犯错。"}], "know": "本集知识点｜合规设计的核心是提高违规的持续成本：强制理由（不可删）、异常自动预警、以及对\"重复同样理由\"这类模式设阈值。制度的目标不是让人变好，是让坏事难以长期隐藏。且制度本身需要迭代——漏洞会以新形式出现。", "shot": "分镜/画面提示：① 宣贯会女主讲\"我只要求写清楚为什么\"。② 她讲\"腐败靠长期不被问\"，众人沉默。③ 半年后系统预警界面弹出。④ 女主说\"制度也要改\"，字幕\"让坏事变难，不是让人变好\"。"}, {"no": 94, "title": "她带出来的三个总监", "meta": "约 110 秒 · 场景：办公室 · 知识：人才梯队", "scenes": ["场 1　三个人三种风格，她给三人写了不同的评语。", "场 2　甲想补齐自己的短板。", "场 3　她给三个人排了位。"], "lines": [{"sp": "小马", "tx": "薇姐，我们三个谁最像你？"}, {"sp": "林薇", "tx": "都不像，这是好事。"}, {"sp": "林薇", "tx": "你（甲）会算——别人看不出的异常你能看出来；你（乙）会说不——压力再大你也不松口；你（丙）会带人——你带出来的人比你还稳。"}, {"sp": "甲", "tx": "那我应该学学乙，我也得敢说不。"}, {"sp": "林薇", "tx": "不用。梯队的意义就是让不同的人互补，不是把每个人都补成全才。"}, {"sp": "甲", "tx": "那我遇到需要\"说不\"的时候怎么办？"}, {"sp": "林薇", "tx": "你只要保证一件事：遇到你解决不了的那类问题，你知道该找谁。"}, {"sp": "林薇", "tx": "最怕的是三个人都很像我，然后我们三个一起在同一个地方犯错。"}, {"sp": "林薇", "tx": "甲去集团做分析，乙去最难的那家店，丙留在总部带新人。"}, {"sp": "乙", "tx": "（笑）最难的那家，是我啊。"}, {"sp": "林薇", "tx": "是你。因为那家店现在的问题不是算不出来，是没人敢拦店总。"}, {"sp": "林薇", "tx": "（画外音）我花了十九年才明白：一个团队最强的状态，不是每个人都全面，是每个人都不一样，而且互相知道该找谁。"}], "know": "本集知识点｜人才梯队应按能力特质互补配置（分析 / 坚持原则 / 培养他人），而非把所有人培养成同一模板。关键是建立\"知道该找谁\"的协作网络；把合适的人放到匹配其特质的岗位上（如\"敢说不\"的人去最需要制衡的单元）。", "shot": "分镜/画面提示：① 办公室三人与女主围坐，气氛轻松。② 女主逐个点评，三人表情各异。③ 甲问\"要不要学乙\"，女主摇头。④ 她安排岗位，乙笑接最难的店，字幕\"最强不是都全面，是都不一样\"。"}, {"no": 95, "title": "数据造假", "meta": "约 110 秒 · 场景：办公室 · 知识：数据失真与预警", "scenes": ["场 1　系统预警亮了：某店连续三周\"自用房\"异常偏高。", "场 2　她没有去抓人。", "场 3　她带着这个思路去找那位店总。"], "lines": [{"sp": "小马", "tx": "查出来了——他们把没卖出去的房记成\"自用\"，这样出租率好看。"}, {"sp": "小马", "tx": "要通报吗？"}, {"sp": "林薇", "tx": "先别。先想一个问题：他为什么要造假？"}, {"sp": "小马", "tx": "因为完不成预算。"}, {"sp": "林薇", "tx": "对。如果一个指标能逼人造假，那这个指标本身就是坏的。通报他一个人，下一个人还会这么干。"}, {"sp": "小马", "tx": "那怎么办？"}, {"sp": "林薇", "tx": "改考核口径，不是抓人。"}, {"sp": "店总", "tx": "（紧张）林总，我……"}, {"sp": "林薇", "tx": "我知道你为什么那么记。出租率这个指标，在你那儿就是死线。"}, {"sp": "林薇", "tx": "现在改：自用房单列，考核改成\"可售房收入 + 数据合规\"。你再造假，不仅没好处，系统还会立刻标出来。"}, {"sp": "店总", "tx": "（愣住）……您不罚我？"}, {"sp": "林薇", "tx": "罚你已经没意义了。我要的是你下次不用造假也能活。"}], "know": "本集知识点｜数据造假通常是指标设计缺陷的后果，而非个人道德问题。根因处理是修正考核口径与预警机制（自用房单列、加入数据合规考核）；只惩罚个人，行为会复发。", "shot": "分镜/画面提示：① 屏幕预警条弹出\"自用房异常\"，红色。② 女主拦住要通报的小马。③ 她去店总办公室，对方紧张。④ 她说\"我要的是你下次不用造假也能活\"，字幕\"逼人造假的指标本身就是坏的\"。"}, {"no": 96, "title": "她怎么处理那个店总", "meta": "约 110 秒 · 场景：办公室 · 知识：根因处理 vs 惩罚个人", "scenes": ["场 1　她没有开除、没有通报，只改了考核口径。", "场 2　小马担心没人怕。", "场 3　三个月后，那位店总主动打电话来。"], "lines": [{"sp": "小马", "tx": "就这样？他造假啊！"}, {"sp": "林薇", "tx": "我知道。我把\"自用房\"从统计里单列，考核改成\"可售房收入 + 数据合规\"。现在他再造假，不仅没好处，还会立刻被系统标出来。"}, {"sp": "小马", "tx": "可不罚他，别人会不会学？"}, {"sp": "林薇", "tx": "不会。因为学已经没用了。"}, {"sp": "小马", "tx": "……什么意思？"}, {"sp": "林薇", "tx": "人做一件事，是因为它有用。你把它的用处去掉，行为自己就停了。这跟\"怕不怕\"没关系，跟\"值不值\"有关系。"}, {"sp": "店总", "tx": "（电话）林总，我这个月出租率掉了 6 个点，但我按新口径报，没造假。"}, {"sp": "林薇", "tx": "（笑）好。掉了就说掉了，我们一起想办法。"}, {"sp": "店总", "tx": "（停顿）……谢谢您。以前我不敢报真数。"}, {"sp": "林薇", "tx": "（挂断，画外音）罚一个人很痛快，但痛快是给旁观者看的。堵一个洞不痛快，但它对所有人都有效。"}], "know": "本集知识点｜行为改变的两条路径：惩罚（震慑，效果依赖被发现）+ 改变激励结构（让行为失去收益，自动停止）。后者更可靠且不依赖持续监督。附带收益：指标不再逼人造假时，真实数据才会浮现。", "shot": "分镜/画面提示：① 女主在文件上改考核口径，笔迹落下。② 小马质疑，她平静解释\"学已经没用了\"。③ 三个月后电话那头店总的声音。④ 女主放下电话微笑，字幕\"堵一个洞，对所有人都有效\"。"}, {"no": 97, "title": "母亲终于听懂了", "meta": "约 110 秒 · 场景：家里 · 知识：职业的朴素定义", "scenes": ["场 1　家里。母亲看电视里一则酒店新闻，忽然转头。", "场 2　母亲追问了一句最难答的。", "场 3　母亲沉默了很久，说了最后一句。"], "lines": [{"sp": "母亲", "tx": "我问了你十几年，你到底干嘛的。今天我好像懂了。"}, {"sp": "林薇", "tx": "（笑）您说说。"}, {"sp": "母亲", "tx": "你就是那个……决定今天这房子该卖多少钱的人。"}, {"sp": "林薇", "tx": "（点头）是。"}, {"sp": "母亲", "tx": "那要是卖贵了没人住呢？"}, {"sp": "林薇", "tx": "那也是我的责任。所以我每天晚上都会再看一遍数字。"}, {"sp": "母亲", "tx": "（叹气）那你别干了。"}, {"sp": "林薇", "tx": "不行。这活儿总得有人干，而且得有人认认真真地干。"}, {"sp": "母亲", "tx": "那你要记得吃饭。"}, {"sp": "林薇", "tx": "（愣了愣，眼眶红了）……记得。"}, {"sp": "林薇", "tx": "（画外音）那一刻我才知道，我妈其实早就懂了。她担心的从来不是我做什么，是我做着做着，把自己忘了。"}], "know": "本集知识点｜（无技术点）把职业还给生活：一句朴素的理解，胜过所有头衔。同时点出责任归属——判断者必须承担后果，这正是这个职业的重量；也点出从业者的自我代价需要被关心。", "shot": "分镜/画面提示：① 家中客厅，电视播着酒店新闻，母亲转头。② 她一句说中女主的工作，画面静。③ 母女对坐，母亲说\"那你要记得吃饭\"。④ 女主低头，眼眶微红，字幕\"她担心的是我把自己忘了\"。"}, {"no": 98, "title": "利润还是份额", "meta": "约 110 秒 · 场景：集团会议 · 知识：战略取舍与代价陈述", "scenes": ["场 1　集团要二选一。所有人等她表态。", "场 2　她把两条路的账都摆出来。", "场 3　高管追问了一句。"], "lines": [{"sp": "高管", "tx": "利润优先，还是份额优先？给个方向。"}, {"sp": "林薇", "tx": "我两个都不选，但我可以说清楚代价。"}, {"sp": "林薇", "tx": "选利润：未来两年 RevPAR 涨 8%，但份额掉 5 个点，三年后我们要花更大代价买回来。"}, {"sp": "林薇", "tx": "选份额：份额稳住，但 ADR 被压住，团队会被\"量\"推着走，价格体系会被慢慢磨平。"}, {"sp": "高管", "tx": "那你建议什么？"}, {"sp": "林薇", "tx": "分店选：旗舰店保利润，中端店保份额。集团层面的意义，就是不必在每个战场上都做同一个选择。"}, {"sp": "高管", "tx": "那会不会两头都不够狠？"}, {"sp": "林薇", "tx": "会。所以我要说清楚：这是拿\"极致\"换\"稳健\"。"}, {"sp": "林薇", "tx": "您可以选极致，但您要知道极致意味着什么——它意味着三年后要花两倍的钱，把今天让出去的份额买回来。"}, {"sp": "林薇", "tx": "（画外音）那天我明白：给建议不是替人做决定，是把每条路的账单摆到他面前。"}], "know": "本集知识点｜战略取舍的正确回答不是\"选边\"，而是陈述代价 + 分层承担。组合型组织的优势恰恰在于不同单元可以承担不同战略角色，无需统一取舍。同时必须诚实说明\"分层\"的代价（拿极致换稳健），让决策者知情。", "shot": "分镜/画面提示：① 集团会议室众人等她表态，气氛凝重。② 她在白板左写\"利润\"、右写\"份额\"，各配代价。③ 她说\"分店选\"，箭头指向不同店型。④ 高管追问，她答\"拿极致换稳健\"，字幕\"给建议是把账单摆到他面前\"。"}, {"no": 99, "title": "最后一场例会", "meta": "约 110 秒 · 场景：会议室 · 知识：传承的最后一课", "scenes": ["场 1　她把主持位让给小马，自己坐到角落。", "场 2　散会。小马请她点评。", "场 3　她把桌上的东西收进纸箱。小马看着。"], "lines": [{"sp": "小马", "tx": "看过去：上周 RevPAR 438，超目标 6 块……看未来：未来 14 天……"}, {"sp": "林薇", "tx": "（在角落听着，没有打断）"}, {"sp": "小马", "tx": "林总，我哪里讲得不对？"}, {"sp": "林薇", "tx": "都对。只有一句我想补上——你最后应该问一句：\"哪里不对？\""}, {"sp": "小马", "tx": "……为什么？"}, {"sp": "林薇", "tx": "因为你坐那个位置以后，会越来越少听到这句话。你要自己把它留着。"}, {"sp": "小马", "tx": "林总，您真走了？"}, {"sp": "林薇", "tx": "（笑）不是走，是换个位置坐。我在这里坐太久，你们说话就不自由了。"}, {"sp": "小马", "tx": "那您坐哪儿？"}, {"sp": "林薇", "tx": "后面那排。你们开你们的会，我听着。有不对的，我散会再说。"}, {"sp": "林薇", "tx": "（画外音）这是我做的最后一个决定，也是最难的一个——把自己从那个位置挪开。"}], "know": "本集知识点｜传承的最后一课不是方法，而是机制：把\"哪里不对\"变成固定动作，防止权威位置自动屏蔽反对声音。且真正的传承要求前任主动退到幕后——留在原位，后任与团队就无法真正独立。", "shot": "分镜/画面提示：① 会议室小马主持，女主坐角落，构图\"交接\"。② 散会后她补那句\"哪里不对\"。③ 她把桌上东西收进纸箱。④ 她走向后排座位坐下，字幕\"把自己从那个位置挪开\"。"}, {"no": 100, "title": "定价之间", "meta": "约 130 秒 · 场景：最后一场例会 / 天台 · 收束", "scenes": ["场 1　例会现场。她把主持位让给小马，自己坐到角落。", "场 2　散会后，小马找到她。", "场 3　天台。黄昏。她一个人。", "场 4　闪回快剪（十九年）：魏师傅的台账本 / 排班表 / 罚单邮件 / 减员会议 / 空荡的大堂 / 时间线证据 / 制度宣贯 / 小马主持例会。", "场 5　她转身走回楼里。镜头拉远，字幕升起。"], "lines": [{"sp": "小马", "tx": "（主持）看过去：上周 RevPAR 438，超目标 6 块，原因是周三那两个会议团。看未来：未来 14 天……"}, {"sp": "林薇", "tx": "（在角落，看着他，没说话）"}, {"sp": "小马", "tx": "林总，我一直想问您一个问题。您做了十九年，最难的是哪一件事？"}, {"sp": "林薇", "tx": "（想了很久）不是 2020 年那一年，不是那几次被甩锅，也不是算错过数。"}, {"sp": "林薇", "tx": "最难的是——在该说\"不\"的时候说\"不\"，而且说完之后，还能第二天正常来上班。"}, {"sp": "小马", "tx": "为什么难？"}, {"sp": "林薇", "tx": "因为说\"是\"永远比说\"不\"舒服。说\"是\"，所有人当天都高兴；说\"不\"，只有三个月后的报表知道你是对的。而那三个月里，你要一个人扛着所有人的不高兴。"}, {"sp": "林薇", "tx": "（画外音）我师父退休那天跟我说：客人记不住我们的价格，只记得住我们有没有骗他。"}, {"sp": "林薇", "tx": "（画外音）后来我又明白了一层——价格不是我们定的，是市场定的；我们定的，是\"要不要跟着它做错\"。"}, {"sp": "林薇", "tx": "（画外音）数据告诉我现在发生了什么，预测告诉我接下来会发生什么，规则告诉我这种情况下该怎么做。真正难的，是当这三样跟\"所有人希望的答案\"不一样时，你敢不敢照着它们做。"}, {"sp": "林薇", "tx": "（画外音）我从一个接电话的预订员，做到这里。我学会的不是怎么把房价调高，是怎么在每一次\"调高还是调低\"之间，找到那个对的判断。"}, {"sp": "林薇", "tx": "（画外音）这中间那一点点空间——就是定价之间。"}], "know": "全集收束｜收益管理十九年的最终答案：技术（数据/预测/规则）可以学，周期不可逆，最难的是在\"说'是'能让所有人当天高兴、说'不'要独自扛三个月\"的结构里，一直做对的事。而让这件事可持续的，不是个人硬扛，是把判断变成规则、把正直变成制度、把个人能力变成可被继承的体系。", "shot": "分镜提示（收束集镜头升级）：① 例会现场，小马站在前面主持，林薇坐在角落的光影里，构图\"交接\"。② 天台黄昏，女主独自凭栏，城市天际线，逆光。③ 快剪蒙太奇：台账本／排班表／邮件／空大堂／时间线／宣贯会／例会，每帧 1 秒。④ 她转身走回楼内的背影，镜头缓缓拉远，字幕浮起\"定价之间，是判断的余地\"。"}]};
