<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script src="assets/js/commerce.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  var t=document.getElementById('snToggle'), l=document.getElementById('snLinks');
  if(t&&l){ t.addEventListener('click',function(){ l.classList.toggle('open'); }); }

  var KIND_LABEL={membership:'会员',course:'课程包',consult:'专家咨询',job_post:'职位推广'};
  var orderBox=document.getElementById('orderBox');
  var myBox=document.getElementById('myOrders');
  var esc=function(s){ return window.RMCCommerce?window.RMCCommerce.esc(s):(s==null?'':String(s)); };

  /* 静态收款码：微信个人收款码 / 支付宝个人收钱码，无需商户资质、无需回调 */
  var PAY_TABS=[
    {id:'wechat', label:'微信支付', key:'wechatQR', tip:'打开微信「扫一扫」，扫描上方二维码后手动输入金额付款'},
    {id:'alipay', label:'支付宝',   key:'alipayQR', tip:'打开支付宝「扫一扫」，扫描上方二维码后手动输入金额付款'}
  ];

  function payCfg(){ return window.HRMA_PAY||{}; }

  // 收款码地址：配置留空时回退到同名占位图，避免出现死链
  function qrSrc(tab){
    var v=payCfg()[tab.key];
    v=(v&&String(v).trim())?String(v).trim():'';
    return v || ('assets/img/pay/'+tab.id+'-qr.svg');
  }

  function copyAmount(val, btn){
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(String(val)); }
      else{
        var ta=document.createElement('textarea'); ta.value=String(val);
        ta.style.position='absolute'; ta.style.left='-9999px';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
    }catch(e){}
    if(btn){ var old=btn.getAttribute('data-label')||'复制金额'; btn.setAttribute('data-label',old); btn.textContent='已复制'; setTimeout(function(){ btn.textContent=old; },1500); }
  }

  async function doConfirm(o, btn){
    if(btn){ btn.disabled=true; btn.textContent='提交中…'; }
    var plan=(o.kind==='membership')?o.ref_id:null;
    var r=await window.RMCCommerce.confirmPayment(o.id, plan);
    if(r&&r.ok){ location.reload(); return; }
    if(btn){ btn.disabled=false; btn.textContent='我已支付'; }
    alert((r&&r.msg)||'提交失败，请稍后重试或联系客服');
  }

  async function doCancel(o){
    if(!confirm('确定放弃该订单？')) return;
    var r=await window.RMCCommerce.cancelOrder(o.id);
    if(r&&r.ok){ location.reload(); } else { alert((r&&r.msg)||'操作失败，请稍后重试'); }
  }

  function headRows(o, amount){
    return '<div class="co-row"><span>订单类型</span><b>'+esc(KIND_LABEL[o.kind]||o.kind)+'</b></div>'
      +(o.ref_id?'<div class="co-row"><span>项目</span><b>'+esc(o.ref_id)+'</b></div>':'')
      +'<div class="co-row"><span>应付金额</span><b class="co-amount">¥'+amount+'</b></div>'
      +'<div class="co-row"><span>状态</span><b>待支付</b></div>';
  }

  /* ---- 主流程：扫码支付 ---- */
  function showQRPay(o, active){
    var tab=PAY_TABS.filter(function(x){ return x.id===active; })[0]||PAY_TABS[0];
    var amount=Number(o.amount)||0;
    var P=payCfg();
    orderBox.innerHTML=headRows(o, amount)
      +'<div class="co-pay">'
        +'<div class="cm-eyebrow">扫码支付</div>'
        +'<div id="qrTabs" style="margin-bottom:12px"></div>'
        +'<div id="qrImg" class="co-qr-lg" style="background:#fff"></div>'
        +'<p class="co-note" id="qrTip"></p>'
        +'<p class="co-note">请付款 <b>¥'+amount+'</b>'
          +'<button class="btn-line" id="copyAmt" style="padding:2px 10px;font-size:12px;margin-left:6px">复制金额</button></p>'
        +(P.note?'<p class="co-note">'+esc(P.note)+'</p>':'')
      +'</div>'
      +'<div class="co-pay">'
        +'<button class="btn-gold" id="payBtn">我已支付</button> '
        +'<button class="btn-line" id="manualBtn">其他方式</button> '
        +'<button class="btn-line" id="cancelBtn">放弃订单</button>'
      +'</div>';

    var tabsBox=document.getElementById('qrTabs');
    PAY_TABS.forEach(function(x){
      var b=document.createElement('button');
      b.className='btn-line'; b.textContent=x.label; b.style.marginRight='8px';
      if(x.id===tab.id){ b.style.borderColor='var(--gold-2)'; b.style.color='var(--gold-2)'; }
      b.addEventListener('click', function(){ showQRPay(o, x.id); });
      tabsBox.appendChild(b);
    });

    var wrap=document.getElementById('qrImg');
    var im=document.createElement('img');
    im.src=qrSrc(tab); im.alt=tab.label+'收款码';
    im.style.maxWidth='240px'; im.style.width='100%';
    wrap.appendChild(im);
    document.getElementById('qrTip').textContent=tab.tip;

    document.getElementById('copyAmt').addEventListener('click', function(){ copyAmount(amount, this); });
    document.getElementById('payBtn').addEventListener('click', function(){ doConfirm(o, this); });
    document.getElementById('manualBtn').addEventListener('click', function(){ showManual(o); });
    document.getElementById('cancelBtn').addEventListener('click', function(){ doCancel(o); });
  }

  /* ---- 兜底：转账 / 人工确认 ---- */
  function buildManualPay(){
    var P=payCfg();
    var wrap=document.createElement('div');
    function line(html){ var d=document.createElement('p'); d.className='co-note'; d.innerHTML=html; return d; }
    wrap.appendChild(line('收款方：<b>'+esc(P.payee||'RMC收益管理社区')+'</b>'));
    if(P.bank) wrap.appendChild(line('转账账号：'+esc(P.bank)));
    if(P.contact) wrap.appendChild(line('联系：'+esc(P.contact)));
    return wrap;
  }

  function showManual(o){
    var amount=Number(o.amount)||0;
    orderBox.innerHTML=headRows(o, amount)
      +'<div class="co-pay"><div class="cm-eyebrow">转账 / 人工确认（转账后再点“我已支付”）</div><div id="payArea"></div></div>'
      +'<div class="co-pay">'
        +'<button class="btn-gold" id="payBtn">我已支付</button> '
        +'<button class="btn-line" id="qrBtn">返回扫码支付</button> '
        +'<button class="btn-line" id="cancelBtn">放弃订单</button>'
      +'</div>';
    var payArea=document.getElementById('payArea');
    if(payArea) payArea.appendChild(buildManualPay());
    document.getElementById('payBtn').addEventListener('click', function(){ doConfirm(o, this); });
    document.getElementById('qrBtn').addEventListener('click', function(){ showQRPay(o); });
    document.getElementById('cancelBtn').addEventListener('click', function(){ doCancel(o); });
  }

  function renderOrder(o){
    if(!o){ orderBox.innerHTML='<p class="co-empty">没有待结算的订单。<a href="pricing.html">去选购会员</a> 或 <a href="academy.html">课程包</a>。</p>'; return; }
    if(o.status==='paid'){
      orderBox.innerHTML='<div class="co-success"><div class="big">✅</div><h3>订单已支付</h3><p class="co-note">'+esc(KIND_LABEL[o.kind]||o.kind)+' · 金额 ¥'+Number(o.amount)+' · 权益已开通。</p></div>';
      return;
    }
    if(o.status==='cancelled'){
      orderBox.innerHTML='<p class="co-empty">该订单已取消。<a href="pricing.html">重新选购</a></p>';
      return;
    }
    showQRPay(o);
  }

  function renderMy(orders){
    if(!orders||!orders.length){ myBox.innerHTML='<p class="co-empty">还没有订单。</p>'; return; }
    var rows=orders.map(function(o){
      var st=o.status==='paid'?'<span class="st-paid">已支付</span>':(o.status==='cancelled'?'<span class="st-pending">已取消</span>':'<span class="st-pending">待支付</span>');
      var label=KIND_LABEL[o.kind]||o.kind;
      var gw=o.gateway?(' · '+esc(o.gateway)):'';
      return '<tr><td>'+label+gw+'</td><td>¥'+Number(o.amount)+'</td><td>'+st+'</td><td>'+(o.created_at||'').slice(0,10)+'</td></tr>';
    }).join('');
    myBox.innerHTML='<table class="co-orders" style="width:100%"><thead><tr><th>类型</th><th>金额</th><th>状态</th><th>日期</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }

  async function init(){
    if(!window.RMCCommerce){ orderBox.innerHTML='<p class="cm-hint">组件加载中，请刷新</p>'; return; }
    var params=new URLSearchParams(location.search);
    var oid=params.get('order');
    if(oid){
      var o=await window.RMCCommerce.getOrder(oid);
      renderOrder(o);
    } else {
      orderBox.innerHTML='<p class="co-empty">没有待结算的订单。<a href="pricing.html">去选购会员</a>。</p>';
    }
    var mine=await window.RMCCommerce.myOrders();
    renderMy(mine);
  }
  init();
})();
</script>
</body>
</html>
