<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title></title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<script>
(function(){
  var m=location.search.match(/[?&]next=([^&]*)/);
  var t='';
  try{ t=m?decodeURIComponent(m[1]):''; }catch(e){}
  if(/^https?:/i.test(t)||t.charAt(0)==='/'||t.indexOf('..')>=0) t='';
  location.replace('signin.html'+(t?('?next='+encodeURIComponent(t)):''));
})();
</script>
</head>
<body></body>
</html>
