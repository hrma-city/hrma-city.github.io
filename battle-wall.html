<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>window.HRMA_PREFIX="";</script>
<script src="auth-config.js?v=gate20261013"></script>
<script src="assets/js/access-gate.js?v=v12"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>战绩墙 · RMC 收益管理社区</title>
<style>
:root{--navy:#0f2a4a;--navy2:#123a66;--gold:#e8b84b;--ink:#1f2a37;--mut:#5b6a7d;--ok:#2a9d5f;--line:#e3e9f1;--bg:#f4f7fb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;font-size:15px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px 80px}
.hero{background:linear-gradient(135deg,#0f2a4a,#1d4e7e);color:#fff;padding:30px 0 26px}
.hero .wrap{padding-bottom:0}
.hero .tag{display:inline-block;background:rgba(232,184,75,.18);border:1px solid rgba(232,184,75,.5);color:#f5d78e;font-size:12px;border-radius:999px;padding:3px 12px;margin-bottom:10px}
.hero h1{font-size:24px;line-height:1.45}
.hero p{color:#b9d0e6;font-size:14px;margin-top:8px;max-width:780px}
.note{background:#fff8e6;border:1px solid #f0dca6;color:#7a5c12;border-radius:9px;padding:9px 13px;font-size:12.5px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:15px;margin-top:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 19px;box-shadow:0 1px 3px rgba(15,42,74,.05);display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.who{font-weight:800;color:var(--navy);font-size:15px}
.org{font-size:12px;color:var(--mut)}
.demo{background:#f0f0f0;color:#888;font-size:10px;border-radius:6px;padding:2px 7px;white-space:nowrap}
.badge{display:inline-block;background:#eaf0f8;color:var(--navy2);font-size:11px;border-radius:6px;padding:2px 8px;margin-top:8px}
.metric{font-size:20px;font-weight:800;color:var(--ok);margin:12px 0 2px}
.title{font-size:14px;font-weight:700;color:var(--navy2);margin-bottom:10px;line-height:1.5}
.tl{border-left:2px solid #dbe4ef;margin:6px 0 0 6px;padding-left:14px}
.tl div{font-size:12.5px;color:var(--ink);margin:7px 0;position:relative}
.tl div:before{content:'';position:absolute;left:-20px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--navy2)}
.tl b{color:var(--navy2)}
.foot{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between}
.tags{margin-top:8px}
.tags span{background:#f4f7fb;color:var(--mut);font-size:10.5px;border-radius:5px;padding:2px 6px;margin-right:4px}
@media print{.hero{background:#fff;color:#000}.hero p{color:#333}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body data-page="battle-wall" data-auth="protected">
<header class="hero"><div class="wrap">
  <span class="tag">战绩墙 · 人 + 过程 + 结果 + 时间线</span>
  <h1>战绩墙</h1>
  <p>让"和我差不多的人做成了"被看见——每条战绩不只有结果数字，还有当时的信号、查了哪张表、走过的节点。这是社区最强的驱动力。</p>
</div></header>
<main class="wrap">
  <div class="note">示例数据 · 下列战绩均为虚构占位，用于展示结构与版式，上线真实战绩时替换本文件数据源即可（见 rmc-seed.js）。</div>
  <div class="grid" id="grid"></div>
</main>
<script src="rmc-seed.js"></script>
<script src="auth.js?v=2"></script>
<script>
(function(){
  var B=(window.RMC_SEED&&window.RMC_SEED.BATTLES)||[];
  var g=document.getElementById('grid');
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
  g.innerHTML=B.map(function(b){
    return '<article class="card">'+
      '<div class="top"><div><div class="who">'+esc(b.who)+'</div><div class="org">'+esc(b.org)+'</div></div>'+
        (b.demo?'<span class="demo">示例</span>':'')+'</div>'+
      '<span class="badge">'+esc(b.role)+' · '+esc(b.span)+'</span>'+
      '<div class="metric">'+esc(b.metric)+'</div>'+
      '<div class="title">'+esc(b.title)+'</div>'+
      '<div class="tl">'+
        '<div><b>看到的信号</b>：'+esc(b.signal)+'</div>'+
        '<div><b>动作</b>：'+esc(b.action)+'</div>'+
        '<div><b>结果</b>：'+esc(b.result)+'</div>'+
      '</div>'+
      '<div class="tags">'+b.tables.map(function(t){return '<span>表 '+esc(t)+'</span>'}).join('')+'</div>'+
      '<div class="foot"><span>点亮 '+b.nodes+' 个节点</span><span>历时 '+b.days+' 天</span></div>'+
    '</article>';
  }).join('')||'<div class="note">暂无战绩数据。</div>';
})();
</script>
</body>
</html>
