<meta name="description" content="把三级课程 143 个知识点化作登山路：14 个营地对应 14 个模块，一盏灯一个知识点。读口诀、排序、连线、看情境后果，全程不判分。点亮全部，再去做题。">
<style>
:root{--navy:#0f2a4a;--navy2:#123a66;--gold:#e8b84b;--gold2:#f5d78e;--ink:#1f2a37;--mut:#5b6a7d;
  --ok:#2a9d5f;--blue:#3d8bd4;--purple:#7c6bd6;--teal:#2aa8a0;--line:#e3e9f1;
  --l1:#3f9d6e;--l2:#2f7fbf;--l3:#c98f2d}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#eef3f9;color:var(--ink);line-height:1.7;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 90px}
a.back{color:#9fc3e4;font-size:13.5px;text-decoration:none;display:inline-block;margin-top:14px}
a.back:hover{color:#fff}

/* ── 顶部山景 ── */
.hero{position:relative;background:linear-gradient(180deg,#0b2140 0%,#123a66 70%,#1c4d7e 100%);
  color:#fff;padding:20px 0 0;overflow:hidden}
.hero .stars{position:absolute;inset:0;pointer-events:none;opacity:.7}
.hero .wrap{position:relative;padding-bottom:0}
h1{color:#fff;font-size:25px;margin:6px 0 2px}
h1 .grad{background:linear-gradient(90deg,#f5d78e,#e8b84b);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#b9d0e6;font-size:14px;max-width:680px}
.statbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.stat{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:10px;
  padding:7px 13px;font-size:13px;color:#dbe8f5}
.stat b{color:#f5d78e;font-size:15px}
.hero .mtn{display:block;width:100%;margin-top:10px}
.pbar{height:10px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden;margin:12px 0 0}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8b84b,#f5d78e);
  border-radius:999px;transition:width .6s ease}

/* ── 山径 ── */
.zone{margin-top:26px}
.zone-h{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-radius:12px;color:#fff;font-size:15px;font-weight:700}
.zone-h small{font-weight:400;opacity:.85;font-size:12.5px}
.zone-h.z1{background:linear-gradient(90deg,#2f7a52,#3f9d6e)}
.zone-h.z2{background:linear-gradient(90deg,#1d6fb8,#2f7fbf)}
.zone-h.z3{background:linear-gradient(90deg,#a8781f,#c98f2d)}
.trail{position:relative;margin-top:14px;padding-left:0}
.trail::before{content:'';position:absolute;left:26px;top:8px;bottom:8px;border-left:3px dashed #c7d6e6}
.camp{position:relative;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:13px 16px;margin:0 0 14px 44px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.camp:hover{transform:translateX(3px);box-shadow:0 4px 14px rgba(15,42,74,.10)}
.camp::before{content:'';position:absolute;left:-27px;top:50%;transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #c7d6e6}
.camp .badge{flex:none;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:#fff;background:#8aa0b8}
.camp .cbody{flex:1;min-width:0}
.camp .cname{font-weight:700;font-size:15.5px;color:var(--navy)}
.camp .cmeta{font-size:12.5px;color:var(--mut);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.camp .lamps{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.camp .lamps i{width:13px;height:13px;border-radius:50%;background:#e2e9f1;border:1px solid #d3dde8}
.camp .lamps i.on{background:radial-gradient(circle at 35% 30%,#fff3c4,#e8b84b);border-color:#d9a83c;
  box-shadow:0 0 8px rgba(232,184,75,.75);animation:pulse 2s infinite}
.camp .cright{flex:none;text-align:right;font-size:12.5px;color:var(--mut)}
.camp .flag{font-size:20px}
.camp.z1 .badge{background:var(--l1)}.camp.z2 .badge{background:var(--l2)}.camp.z3 .badge{background:var(--l3)}
.camp.z1::before{border-color:#bcd9c8}.camp.z2::before{border-color:#b7d4ec}.camp.z3::before{border-color:#e8cfa0}
.camp.done{border-color:#bfe3cf;background:linear-gradient(180deg,#fbfffc,#f2faf5)}
.camp.cur{border:2px solid var(--gold);box-shadow:0 3px 16px rgba(232,184,75,.28)}
.camp.locked{opacity:.62;cursor:not-allowed}
.camp.locked:hover{transform:none;box-shadow:none}
.camp.locked .badge{background:#a9b6c5}
@keyframes pulse{0%,100%{box-shadow:0 0 5px rgba(232,184,75,.55)}50%{box-shadow:0 0 12px rgba(232,184,75,.95)}}

/* ── 营地视图 ── */
.panel{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:22px;box-shadow:0 6px 22px rgba(15,42,74,.06)}
.panel.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.camphead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.camphead .badge{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:var(--navy)}
.z1h .badge{background:var(--l1)}.z2h .badge{background:var(--l2)}.z3h .badge{background:var(--l3)}
.camphead h2{font-size:19px;color:var(--navy);line-height:1.4}
.camphead .tag{font-size:12px;color:var(--mut)}
.story{margin:10px 0 0;padding:10px 14px;background:#f6f9fc;border-left:3px solid var(--gold);border-radius:0 10px 10px 0;
  color:#44536a;font-size:14px}
.cprog{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:13px;color:var(--mut)}
.cprog .bar{flex:1;height:8px;background:#edf1f6;border-radius:999px;overflow:hidden}
.cprog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:width .5s}
.kpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.kchip{border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;background:#fbfdfe;
  transition:border-color .15s,box-shadow .15s,transform .15s;display:flex;gap:9px;align-items:flex-start}
.kchip:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 12px rgba(232,184,75,.18)}
.kchip.lit{background:linear-gradient(180deg,#fffcf2,#fdf7e3);border-color:#e8cfa0}
.kchip .ic{flex:none;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
.kchip .kt{font-weight:700;font-size:13.5px;line-height:1.45;color:var(--navy)}
.kchip .ksub{font-size:11.5px;color:var(--mut);margin-top:2px}
.kchip .glow{margin-left:auto;align-self:center;font-size:15px}
.ic.card{background:var(--blue)}.ic.seq{background:var(--teal)}.ic.match{background:var(--purple)}.ic.scenario{background:#d97f3f}

/* ── 知识灯详情 ── */
.kphead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.kptag{font-size:12px;border-radius:999px;padding:3px 11px;color:#fff}
.kptag.card{background:var(--blue)}.kptag.seq{background:var(--teal)}.kptag.match{background:var(--purple)}.kptag.scenario{background:#d97f3f}
.kptag.dim{background:#e8edf3;color:var(--mut)}
h3.kptitle{font-size:18px;color:var(--navy);margin:2px 0 10px}
.nudge{display:none;background:#fff8e6;border:1px solid #ecd9a5;color:#7a5b12;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.nudge.show{display:block}
.qcard{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:14.5px;margin-bottom:10px}
.keybox{background:linear-gradient(90deg,#fff8e6,#fdf3d3);border:1px solid #ecd9a5;border-radius:10px;padding:10px 14px;
  font-size:14.5px;font-weight:700;color:#6b4e0e;margin-bottom:10px}
.keybox::before{content:'🗝️ 口诀 · '}
.wrongbox{background:#fdf1ef;border:1px solid #eecac4;border-radius:10px;padding:9px 14px;font-size:13.5px;color:#8a3a2e;margin-bottom:10px}
.wrongbox::before{content:'⚠️ 易错 · '}
.opts .opt{border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:9px;cursor:pointer;font-size:14px;background:#fbfdfe;transition:border-color .15s}
.opts .opt:hover{border-color:var(--blue)}
.opts .opt.picked{border-color:var(--blue);background:#f2f8fd}
.opts .opt.conseq{border-color:#d9a83c;background:#fffcf2;animation:fadein .3s ease}
.opts .opt.best{border-color:var(--ok);background:#f2fbf5}
.opts .opt .ctag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;margin-right:7px;color:#fff;background:#d97f3f}
.opts .opt.best .ctag{background:var(--ok)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.mitem{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13.5px;background:#fbfdfe;text-align:center;transition:all .15s;min-height:44px;display:flex;align-items:center;justify-content:center}
.mitem:hover{border-color:var(--purple)}
.mitem.sel{border-color:var(--purple);background:#f5f3fd}
.mitem.lock{border-color:var(--ok);background:#f2fbf5;cursor:default;opacity:.85}
.mitem.bad{animation:shake .35s ease;border-color:#d66a5b;background:#fdf1ef}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.seqstep{border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:9px;cursor:pointer;font-size:14px;background:#fbfdfe;display:flex;gap:10px;align-items:center;transition:all .15s}
.seqstep:hover{border-color:var(--teal)}
.seqstep .n{flex:none;width:26px;height:26px;border-radius:50%;background:#e8edf3;color:var(--mut);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.seqstep.done{border-color:var(--ok);background:#f2fbf5}
.seqstep.done .n{background:var(--ok);color:#fff}
.seqstep.bad{animation:shake .35s ease;border-color:#d66a5b;background:#fdf1ef}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:none;border-radius:11px;padding:11px 22px;font-size:14.5px;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#e8b84b,#d9a83c);color:#3a2c07;box-shadow:0 3px 12px rgba(232,184,75,.4)}
.btn.gold:hover{box-shadow:0 5px 16px rgba(232,184,75,.55)}
.btn.ghost{background:#eef2f7;color:var(--navy)}
.btn.blue{background:var(--navy);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}

/* ── 登顶 ── */
.summit{display:none;text-align:center;padding:34px 18px 30px}
.summit.on{display:block;animation:fadein .5s ease}
.summit .mount{font-size:52px}
.summit h2{font-size:23px;color:var(--navy);margin:8px 0 4px}
.summit p{color:var(--mut);font-size:14.5px;max-width:520px;margin:6px auto 16px}
.confetti{position:relative;height:0;overflow:visible}
.confetti i{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;opacity:0;animation:fall 2.8s ease-in forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(220px) rotate(540deg);opacity:0}}
.flash{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--navy);color:#fff;
  border-radius:999px;padding:10px 22px;font-size:14px;box-shadow:0 6px 20px rgba(15,42,74,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.flash.show{opacity:1}
.foot{color:#8fa3b8;font-size:12.5px;text-align:center;margin-top:26px}
@media(max-width:560px){.camp{margin-left:34px}.trail::before{left:16px}.camp::before{left:-25px}}
</style>

<script>
var CAMPS = [{"id":"M01","lv":"L1","name":"收益管理的语言：指标与计算","story":"开口谈收益之前，先把每个词的分子分母说准。这一段山路上，您要把整套指标语言装进口袋。","kp":[{"id":"M01-1","type":"card","title":"OCC 出租率：分母是可售房晚","def":"OCC = 已售房晚 ÷ 可售房晚 × 100%。分母必须剔除装修房与 OOO（坏房）：320 间房有 3 间 OOO，可售房晚就是 317，不是 320。","key":"量够不够，先剔除卖不了的房","wrong":"拿总房量当分母——OCC 被系统性低估。"},{"id":"M01-2","type":"card","title":"ADR 平均房价：分母是已售房晚","def":"ADR = 客房收入 ÷ 已售房晚。只算卖掉的房，含服务费、不含增值税。这是 ADR 与 RevPAR 最核心的区别。","key":"只看卖掉的房卖得贵不贵","wrong":"把 ADR 的分母写成可售房晚——那是 RevPAR 的分母。"},{"id":"M01-3","type":"card","title":"RevPAR：空房也要摊进分母","def":"RevPAR = 客房收入 ÷ 可售房晚 = OCC × ADR。因为要衡量「每一间可售房赚多少」，卖不掉的空房也摊进分母——这正是 RevPAR 同时被量价双向拉动的根本原因。","key":"收益管理第一指标","wrong":"认为 RevPAR 分母是已售房晚——那就跟 ADR 混了。"},{"id":"M01-4","type":"match","title":"指标 ↔ 公式（全部配对）","pairs":[["OCC","已售房晚 ÷ 可售房晚"],["ADR","客房收入 ÷ 已售房晚"],["RevPAR","客房收入 ÷ 可售房晚"],["TRevPAR","总营收 ÷ 可售房晚"],["GOPPAR","经营毛利 GOP ÷ 可售房晚"],["NRevPAR","RevPAR ×（1 − 渠道成本率）"]]},{"id":"M01-5","type":"seq","title":"指标层级：从收入到利润","steps":["RevPAR——客房收入效率，第一指标","TRevPAR——总营收效率，全服务酒店加看","NRevPAR——扣掉渠道成本的真实收入","GOPPAR——最终利润效率，考核指标"]},{"id":"M01-6","type":"card","title":"NRevPAR：永远不高于 RevPAR","def":"NRevPAR = RevPAR ×（1 − 渠道综合成本率）。成本率最低 3%（直销）、最高 26%（批发商），都 ≥0，所以 NRevPAR ≤ RevPAR 恒成立。BAR ¥680 走 OTA（16%）净收入只有 ¥571.2，比直销少 ¥88.4。","key":"收入要扣完渠道佣金才算数","wrong":"以为某渠道挂牌价高就赚得多——忘了扣成本。"},{"id":"M01-7","type":"card","title":"三大竞争指数：量、价、合","def":"MPI = 本店 OCC ÷ 组合 OCC ×100（抢没抢到量）；ARI = 本店 ADR ÷ 组合 ADR ×100（卖得贵不贵）；RGI = 本店 RevPAR ÷ 组合 RevPAR ×100 = MPI × ARI ÷ 100。MPI >100 是量赢，ARI >100 是价高，别混。","key":"RGI = MPI × ARI ÷ 100","wrong":"说「MPI >100 说明卖得贵」——那是 ARI 的事。"},{"id":"M01-8","type":"scenario","title":"用指数给自己定位","scene":"云璟：OCC 72.0%，组合 68.0%；ADR ¥618，组合 ¥680。三个指数各是多少？说明什么？","opts":[{"t":"MPI 105.9（量赢）、ARI 90.9（价低）、RGI 96.3（综合落后）","c":"量赢了、价输了——份额是靠低价换的。下一步不是继续放量，而是查价格定位（表 C）与产品差异，把 ADR 拉回来。"},{"t":"MPI 94.4、ARI 110.1、RGI 104.0","c":"分子分母放反了。MPI = 72÷68、ARI = 618÷680，别颠倒。"},{"t":"RGI = 105.9 + 90.9 = 196.8","c":"指数是相乘再除以 100，不是相加。"}],"best":0},{"id":"M01-9","type":"card","title":"Pickup：预订增量，可为负","def":"Pickup = 某目标日在一段时间内新增的预订房晚数。为正是净新增；为负说明取消量大于新增量。它是《法典》表 A 的两个输入之一，也是表 I 六个窗口落后判定的依据。","key":"今天比昨天多订了还是退了","wrong":"把 Pickup 理解成「在手总数」——那是存量，Pickup 是增量。"},{"id":"M01-10","type":"scenario","title":"量差与价差分解","scene":"3 月 OCC 74.0%、ADR ¥600；4 月 OCC 78.0%、ADR ¥660。RevPAR 涨的 ¥70.8 里，量贡献多少、价贡献多少？","opts":[{"t":"量差 ¥24.0，价差 ¥46.8——价贡献占 66%","c":"量差 = ΔOCC × ADR₀，价差 = ΔADR × OCC₁。涨价贡献更大，说明这个月主要靠价格拉动，要警惕 ADR 见顶。"},{"t":"量差 ¥28.3，价差 ¥42.5","c":"权重用反了：量差用基期 ADR，价差用报告期 OCC。"},{"t":"各占一半 ¥35.4","c":"不是平均分——量价各有公式，算出来就有答案。"}],"best":0},{"id":"M01-11","type":"card","title":"一次完整计算走一遍","def":"某日售出 256 间、客房收入 ¥166,400、无 OOO：OCC = 256÷320 = 80.0%；ADR = 166,400÷256 = ¥650；RevPAR = 166,400÷320 = ¥520 = 80.0% × 650 ✓。三个数互相咬合，算完互相验一遍。","key":"OCC × ADR 必须等于 RevPAR","wrong":"只算一个数就走——三个数能互验，错了赶紧回头。"}]},{"id":"M02","lv":"L1","name":"系统与数据：把术语说成同一种话","story":"PMS、RMS、Rate Code、Market Segment……系统不认识中文感觉，只认字段。这一段路把系统术语和收益术语对齐。","kp":[{"id":"M02-1","type":"card","title":"三兄弟：MinLOS / CTA / Stop Sell","def":"MinLOS = 最少连住（最多住期叫 MaxLOS）；CTA = 不可入住——当日不接新到店，已住客可续住；Stop Sell（关房/停售，与 Close-out 同义）——连已住客续住一并停。三件都是《法典》表 B 的库存控制手段。","key":"CTA 挡新客、Stop Sell 连老人一起挡","wrong":"把 CTA 理解成「最多住期」。"},{"id":"M02-2","type":"match","title":"收益术语 ↔ 系统字段","pairs":[["价格代码","Rate Code / Rate Plan"],["市场细分","Market Segment / 客源类别"],["渠道","Channel / Source of Business"],["价格日历","Rate Calendar / Rate Grid"],["限制条件","Restriction / Rate Restriction"],["免费房/自用房","Comp / House Use"]]},{"id":"M02-3","type":"card","title":"价格代码 vs 市场细分：一个管价一个管人","def":"Rate Code 决定「卖多少钱」；Market Segment 决定「卖给谁」。云璟 7 个细分：FIT-WI / FIT-DIR / FIT-OTA / CORP / LOY / GRP / LNG。两者不可互换。","key":"价格代码管钱、细分管人","wrong":"把 Rate Code 说成市场细分——查报表时口径全错。"},{"id":"M02-4","type":"card","title":"Source 单独出现时指什么","def":"系统里 Channel / Source of Business 都指渠道；但「Source」单独出现时指市场细分。一词多义，取数前先确认本系统字段定义。","key":"Source 独行 = 细分","wrong":"看见 Source 就当渠道——客源结构报表直接错位。"},{"id":"M02-5","type":"seq","title":"收益经理的一天（表 M 时点）","steps":["07:30 抓昨日数据 →《每日收益数据包》","07:50 抓未来 30 天在手 + Pickup","08:10 采集竞对价 → 比价表更新","08:30 查表 A/B/C/H →《今日动作清单》","09:40 价格一致性核查（6 渠道）","10:05 收益晨会"]},{"id":"M02-6","type":"card","title":"Comp / House Use 的口径","def":"免费房、自用房按本店政策计入已售房晚、收入计 0。政策必须写进《取数清单》。例：可售 = 320 − 5 OOO − 3 维修 = 312；已售 = 240 + 2 Comp + 1 House = 243；OCC = 77.9%。","key":"口径先写死，再来算数","wrong":"每人口径不一样——同一个酒店算出两个 OCC。"},{"id":"M02-7","type":"card","title":"Booking Window：方向别写反","def":"Booking Window = 入住日 − 预订日（提前天数）。写成「预订日 − 入住日」会得负数，方向全错。六档：0–3 / 4–7 / 8–14 / 15–30 / 31–60 / >60 天。","key":"提前多少天订的，就是多长的窗口","wrong":"把窗口算成负数还照用。"},{"id":"M02-8","type":"scenario","title":"算一个窗口落档","scene":"某笔预订：入住 10 月 5 日，预订 9 月 20 日。窗口多少天？落在哪一档？监控节奏是什么？","opts":[{"t":"15 天，落「15–30 天」档：每周 2 次，落后 20% 触发策略复盘 + 销售动员","c":"对。10 月 5 日 − 9 月 20 日 = 15 天。这一档每周盯两次。"},{"t":"−15 天，窗口无效","c":"方向反了：入住日减预订日，不是反过来。"},{"t":"30 天，落「31–60 天」档","c":"9 月 20 到 10 月 5 只有 15 天，别把整月都算进去。"}],"best":0},{"id":"M02-9","type":"card","title":"《取数清单》纪律：不多不少","def":"「按《取数清单》抓固定字段，不多抓一个，不少抓一个。」多抓会被无关信息干扰，少抓会让判定表读不出来。目的是让不同人、不同天取到的数据口径一致、可复现。","key":"口径一致 = 判定可复现","wrong":"凭习惯顺手多抓几个字段——表就没法查了。"}]},{"id":"M03","lv":"L1","name":"每日流水线与调价：表 A 怎么查","story":"数据备齐之后，每天的核心动作就是查表 A 调价。这一段山路练的是「行列定位 + 执行约束」的条件反射。","kp":[{"id":"M03-1","type":"card","title":"表 A 双因子：OCC 定方向、Pickup 定幅度","def":"行 = 预测 OCC（<40 到 ≥95 六档），列 = Pickup 偏差（落后 >10 / 落后 3–10 / 持平 ±3 / 领先 3–10 / 领先 >10 五档），行列交叉给出唯一动作。需求绝对水平决定方向，势头决定力度。","key":"先看 OCC 定调不调，再看 Pickup 调多少","wrong":"「Pickup 落后就要降价」——OCC 95% × 落后 5% 是 ↑5%，不是降价。"},{"id":"M03-2","type":"seq","title":"一次完整查表流程","steps":["定位行：预测 OCC 落哪一档","定位列：Pickup 偏差落哪一档","行列交叉读出唯一动作","合规检查：幅度 ≥3%？同日累计 ≤20%？","写台账：表编号 + 触发数值","执行后 30 分钟内查 OTA 挂牌同步"]},{"id":"M03-3","type":"card","title":"四条执行约束","def":"① 单日同方向累计调价 ≤20%；② 单次 ≥3%（低于 3% 无市场感知，不算调价）；③ 24 小时内同方向不超过 2 次；④ 触及 D1 峰值日的调价必须 L3 审批。","key":"小了不算、大了封顶、峰值要批","wrong":"连着降三次 8%——单日同方向已 24%，违规。"},{"id":"M03-4","type":"scenario","title":"高频易错格：55–70 行的「持平」","scene":"目标日预测 OCC 66%，Pickup 持平 −1%。直觉说「不动」？","opts":[{"t":"↓3%——55–70% 行连持平都要求降价","c":"对。需求绝对水平太低，持平也要用小降价去够需求。这是全表最高频的失分格。"},{"t":"维持——持平就是不调","c":"70% 以上行「持平」才多数是维持；55–70 行持平 = ↓3%。"},{"t":"↓5%","c":"幅度大了：这格是 ↓3%。"}],"best":0},{"id":"M03-5","type":"scenario","title":"落后但不降价的格子","scene":"预测 OCC 95.5%，Pickup 落后 5%。查表 A。","opts":[{"t":"↑5%——OCC 已过 95%，方向是提","c":"对。OCC 定方向：高需求日即便势头落后也提价，只是幅度收着。"},{"t":"↓5%——落后就降","c":"双因子：OCC 定方向，Pickup 只定幅度。"},{"t":"维持","c":"95.5% ≥ 95% 行没有「维持 × 落后 3–10%」这个组合。"}],"best":0},{"id":"M03-6","type":"scenario","title":"唯一的「领先仍降价」格","scene":"预测 OCC 32%，Pickup 领先 5%。查表 A。","opts":[{"t":"↓5%——OCC 太低，领先也救不回来","c":"对。这是全表唯一「领先仍降」的格子：<40% 行 × 领先 3–10% 列。最高频失分点之一。"},{"t":"↑5%——领先就该提","c":"需求绝对水平 32%，提价等于把客人往外推。"},{"t":"维持","c":"这一格不是维持——是 ↓5%。"}],"best":0},{"id":"M03-7","type":"match","title":"OCC 档 ↔ 典型方向","pairs":[["≥95%","↑5%–20% 满房逻辑"],["85–95%","多为 ↑3%–15%"],["70–85%","小幅 ↑ 或 ↓3%"],["55–70%","↓3%–5% 或维持"],["<40%","↓10%–20% 最大力度"]]},{"id":"M03-8","type":"scenario","title":"表 A 给了「维持」之后","scene":"预测 OCC 96%，Pickup 落后 15%。表 A = 维持。这一天就什么都不做了？","opts":[{"t":"顺延执行下一优先级：查表 C（ARI），再表 H（渠道）；表 A 的维持记入台账备注","c":"对。表 O 铁律：最高优先级为「维持」时顺延，不是收工。"},{"t":"维持就是今天的最终结论","c":"那是表 A 单表的结论；全店动作要按表 O 顺延。"},{"t":"直接提价","c":"表 A 明确维持时不能自作主张提价——顺延看别的表。"}],"best":0},{"id":"M03-9","type":"card","title":"D1 峰值日：L1 不能自己拍板","def":"国庆 1–5、五一 1–3、春节初三–初六 + 展会共约 20 天，价格系数 150–200%、目标 OCC ≥95%。触及 D1 的调价必须由 L3 收益经理审批，L1 无权自调。","key":"峰值日的价格 = 钱最多的地方 = 审批最严","wrong":"L1 觉得方向对就直接执行——流程违规。"},{"id":"M03-10","type":"scenario","title":"国庆 D1 实战","scene":"10 月 2 日（D1）预测 OCC 92%，Pickup 领先 12%。L1 小王查得 ↑15%，准备直接执行。","opts":[{"t":"动作 ↑15% 没错，但必须 L3 审批后执行","c":"对。D1 触发审批约束。审批通过后执行并写台账：表 A：OCC 92% × 领先 12% → ↑15%，D1 日，L3 已审批。"},{"t":"D1 不能调价，放弃","c":"D1 不是不能调，是必须审批。系数 150–200% 本来就是为峰值准备的。"},{"t":"再叠加提 5% 凑 20%","c":"单日同方向累计 ≤20%，且叠加执行本身违规。"}],"best":0},{"id":"M03-11","type":"card","title":"17:00 二次巡检：尾房时刻","def":"表 M 17:00 = 二次巡检（0–3 天窗口），15 分钟。对应表 I 唯一用绝对值的档：OCC <70% → 上「今日特惠」尾房产品。因为临期已来不及调价修复，只能用产品直接清库存。","key":"最后 3 天不看百分比，看绝对出租率","wrong":"0–3 天还在研究调价——来不及了，上尾房产品。"}]},{"id":"M04","lv":"L1","name":"报表与台账：留下可复盘的痕迹","story":"动作做完不等于结束。这一段山路练「记录」：台账怎么写、周期报表谁在什么时候出、复盘看哪三个指数。","kp":[{"id":"M04-1","type":"match","title":"表 N 周期 ↔ 产出物","pairs":[["每周一","《周度收益报告》"],["每周三","比价深度表"],["每周五","《周末作战表》"],["每月 1 日","《月度收益复盘报告》"],["每月 5 日","《客源渠道报告》"],["每月 10 日","汇报 PPT + 一页纸摘要"],["每年 9 月","《年度预算文件》"]]},{"id":"M04-2","type":"card","title":"每周一的三件事","def":"房型价差校验（表 F）+ 未来 8 周预测更新 + 渠道开关复核（表 H）→《周度收益报告》。相邻价差 <8% 拉开、>35% 收敛——校验就是查这两条。","key":"周一 = 校准日","wrong":"把比价（周三）或周末盯防（周五）的事放到周一。"},{"id":"M04-3","type":"card","title":"每月节奏：1 → 5 → 10","def":"1 日对内复盘（RGI/MPI/ARI 三维诊断 + 滚动预测）；5 日客源结构与渠道贡献分析；10 日对业主/管理层汇报。先内部消化，再对外汇报。","key":"先对内、后对外","wrong":"1 日就出《客源渠道报告》——那是 5 日的事，差 4 天。"},{"id":"M04-4","type":"card","title":"《调价台账》13 个必填字段","def":"操作日期、目标入住日、房型代码、渠道、原 BAR、新 BAR、调价幅度%、依据表编号、预测 OCC、Pickup 偏差、操作人、复核人、备注。竞争组合挂牌价不在其中——那记在比价表里。","key":"依据栏 = 表编号 + 触发数值","wrong":"依据栏写「市场变化」——模糊表述，上机扣 3 分。"},{"id":"M04-5","type":"card","title":"没执行的结论更要记","def":"表 O 铁律第三条：所有冲突与取舍必须写入台账备注栏。被放弃的那条结论（比如表 A 维持、顺延执行了表 C）恰恰是复盘时最需要的信息。","key":"留痕是为了让一个月后的自己看懂今天","wrong":"只记执行了的动作——复盘时说不清当时为什么这么定。"},{"id":"M04-6","type":"card","title":"三维诊断：份额、价格、综合","def":"MPI 看份额（表 D）、ARI 看价格定位（表 C）、RGI = MPI × ARI ÷ 100 看综合。三者结合才能识别「假持平」：RGI 100 = MPI 106 × ARI 94，是低价换来的份额。","key":"一个指数下结论，三个指数才定论","wrong":"RGI 100 就宣布追平市场——可能是拿利润换的。"},{"id":"M04-7","type":"scenario","title":"台账扣分计算","scene":"上机实操：台账漏填 2 个字段、未标注依据表编号。该项满分 10 分（每缺 1 项扣 1 分、无表编号另扣 3 分），得多少？","opts":[{"t":"10 − 2 − 3 = 5 分","c":"对。先扣缺项，再扣表编号专项。写不出表编号的记录，在笔试里同样扣分。"},{"t":"7 分","c":"漏了表编号的专项扣 3 分。"},{"t":"0 分——扣完为止","c":"还没触底：8 − 3 = 5，不到 0。"}],"best":0},{"id":"M04-8","type":"card","title":"一年 197 份报表","def":"周度 3 项 × 52 = 156；月度 3 项 × 12 = 36；季度 4 份《季度策略文件》；年度预算 1 份。156 + 36 + 4 + 1 = 197 份/年。固定节奏是收益管理的底盘。","key":"报表不是负担，是系统的节拍器","wrong":"以为收益管理就是每天调调价——固定周期的校准才是防跑偏的。"}]},{"id":"M05","lv":"L2","name":"需求预测与进度监控：表 I 六个窗口","story":"上了山腰，视野变长。这一段练「往前看」：预测怎么修正、六个提前窗口各用什么节奏盯、落后了用什么手段救。","kp":[{"id":"M05-1","type":"card","title":"RW 剩余需求：还缺多少没填上","def":"RW = 预测总需求 − 在手预订。RW 大 → 缺口靠未来新增填，倾向降价/放量；RW ≈0 或为负 → 接近满房，转向提价 + 收紧限制（表 B）。例：预测 280、在手 256，RW = 24。","key":"RW 是「还差多少」的量表","wrong":"RW 为负还想着促销——那是在给满房日白送钱。"},{"id":"M05-2","type":"seq","title":"表 I 六档窗口（由近到远）","steps":["0–3 天：每日 2 次","4–7 天：每日 1 次","8–14 天：每日 1 次","15–30 天：每周 2 次","31–60 天：每周 1 次",">60 天：每月 1 次"]},{"id":"M05-3","type":"seq","title":"落后触发阈值递进","steps":["4–7 天：落后 10%","8–14 天：落后 15%","15–30 天：落后 20%","31–60 天：落后 25%",">60 天：落后 30%"]},{"id":"M05-4","type":"match","title":"窗口 ↔ 救场手段","pairs":[["0–3 天","上「今日特惠」尾房产品（OCC<70%）"],["4–7 天","启动 48h 闪购"],["8–14 天","执行表 A 调价"],["15–30 天","策略复盘 + 销售动员"],["31–60 天","启动协议客户拜访计划"],[">60 天","上报 L3 调整年度策略"]]},{"id":"M05-5","type":"card","title":"为什么 0–3 天看绝对值","def":"六档里只有 0–3 天的阈值是「OCC <70%」，其余都是相对百分比。因为临期已没有时间通过调价修复，判断标准自然回到绝对出租率——直接清库存。","key":"近了看绝对、远了看相对","wrong":"0–3 天还算「落后 20%」——临期口径不一样。"},{"id":"M05-6","type":"card","title":"闪购 vs 调价：两类武器","def":"4–7 天落后 → 48h 闪购（限时产品手段）；8–14 天落后 → 表 A 调价（价格手段）。相邻窗口用不同工具，别混：闪购是造一波需求，调价是改价格水平。","key":"产品救急、价格调势","wrong":"4–7 天直接降价 10%——该上闪购而不是动 BAR。"},{"id":"M05-7","type":"scenario","title":"判一次触发","scene":"目标日落 15–30 天窗口：当前在手 150 房晚，去年同期同窗口 200 房晚。触发吗？","opts":[{"t":"落后 25.0% ≥ 20% → 触发：策略复盘 + 销售动员","c":"对。（150−200)÷200 = −25%。该档阈值 20%，触发成立。"},{"t":"落后 25% < 30% → 不触发","c":"30% 是 >60 天档的阈值；15–30 天档是 20%。"},{"t":"领先 25%","c":"在手比去年少，是落后不是领先。"}],"best":0},{"id":"M05-8","type":"card","title":"Pickup 偏差公式","def":"Pickup 偏差 =（当前在手 − 去年同期同提前窗口在手）÷ 去年同期在手 × 100%。注意「同一提前窗口」——拿今天 210 对照 30 天前的去年今天，不能拿入住日前一天比。","key":"和去年同期的同一个窗口比","wrong":"拿不同提前期的在手互比——窗口错位，偏差失真。"},{"id":"M05-9","type":"scenario","title":"RW 收口的全过程","scene":"某目标日 7 天前：在手 180、预测总需求 290；今天（0–3 天档）：在手 268、预测修正 285。","opts":[{"t":"RW 从 110 收到 17；Pickup +88 房晚；今日 OCC 83.8% ≥70% 不触发尾房","c":"对。缺口被预订一点点填上，这就是监控的意义：看见势头，才敢收价格。"},{"t":"RW = 285 − 268 = 17，要立刻降价","c":"RW 小恰恰是好事——接近满房该考虑提价收紧，不是降价。"},{"t":"Pickup = 268 − 180 = 88，落后","c":"+88 是领先。方向别搞反。"}],"best":0},{"id":"M05-10","type":"card","title":"预测的三块输入","def":"预测 = 历史（同期曲线）+ 在手（未来 30 天 pickup）+ 提前窗口（表 I 节奏）。预测给区间不给点值，随 Pickup 每日修正——修正频率本身就是预测的一部分。","key":"预测是滚动的，不是一次算完","wrong":"年初做一次预测用一年——那叫拍脑袋。"}]},{"id":"M06","lv":"L2","name":"价格体系：表 F 房型价差阶梯","story":"BAR 不只是一个数，是一整栋楼的价差结构。这一段把每层楼、每类房的价格关系摆正。","kp":[{"id":"M06-1","type":"card","title":"价差健康区间：8%–35%","def":"相邻房型价差 <8% → 拉开（客人加一点钱就升房，低档形同虚设）；>35% → 收敛，修法是提下一档而不是降高档。每周一校验。","key":"太近白送升级、太远高档卖不动","wrong":"价差 >35% 就降高档价——应该提低档。"},{"id":"M06-2","type":"card","title":"套房底线：60%","def":"套房与最高非套房房型价差 <60% → 提套房价。云璟 STE-B（180）对 EXE（145）只有 24.1% < 60%，必然触发提套房价——套房卖不出溢价，全店 ADR 顶盖被压住。","key":"套房是价格天花板，要撑得住","wrong":"套房和行政房差不多的价——客人永远「升级」到套房，却没人付套房该付的钱。"},{"id":"M06-3","type":"match","title":"房型 ↔ 价差系数（SUP = 100 基准）","pairs":[["STD 标准房","85（−¥100）"],["SUP 高级房","100（基准 ¥680）"],["DLX 豪华房","120（+¥140）"],["DLX-V 江景","140（+¥260）"],["EXE 行政房","145（+¥310）"],["STE-B 商务套房","180（+¥600）"],["STE-E 行政套房","265（+¥1,200）"]]},{"id":"M06-4","type":"card","title":"附加价规则四件套","def":"高楼层 +5%；江景/特色景观 +10%；含早 +¥68/人（早餐门市 ¥128 的五折，用边际成本换溢价与直销吸引力）；加床 +¥180/晚——已含一份早，不再叠加 ¥68。","key":"高五、景十、早六八、床一八零","wrong":"高楼层 +10%——那是江景的数，两者常被记混。"},{"id":"M06-5","type":"seq","title":"附加价叠加顺序","steps":["基准 BAR ¥680","乘系数：高楼层 680 × 1.05 = 714","加固定项：含双早 +68 × 2 = +136","最终价 714 + 136 = ¥850"]},{"id":"M06-6","type":"scenario","title":"找一次违规的价差","scene":"周一校验：DLX-V（140）与 EXE（145）相邻价差 = 5÷140 = 3.6%。怎么办？","opts":[{"t":"触发 <8% → 拉开价差：提 EXE 至价差 ≥8%","c":"对。提上一档（EXE ≥ 140×1.08 ≈ 151），低档不动——保住 DLX-V 的江景溢价。"},{"t":"价差小是好事，客人喜欢","c":"价差过小 = 加一点钱就升房 = 低档房白送了高档体验。"},{"t":"降 DLX-V","c":"拉开优先动上一档；降 DLX-V 等于砍自己的江景产品。"}],"best":0},{"id":"M06-7","type":"scenario","title":"套房撑不撑得住","scene":"STE-B（180）与 STE-E（265）相邻价差 = 85÷180 = 47.2% > 35%。动作？","opts":[{"t":"收敛价差：提下一档 STE-B","c":"对。修法是提低档（套房），不是降高档。STE-B 提上去，套房整体溢价撑起来。"},{"t":"降 STE-E","c":"收敛价差的规范动作是提下一档——降高档是反向操作。"},{"t":"不动，47% 不算大","c":"阈值是 35%，47.2% 已越界。"}],"best":0},{"id":"M06-8","type":"card","title":"含早为什么卖五折","def":"含早 +¥68 vs 门市 ¥128：早餐边际成本远低于门市价，用折扣价打包早餐换取房价溢价与直销吸引力，同时拉走 OTA 的含早订单。儿童政策一并写死：1.2m 以下不占床免费。","key":"打包是定价工具，不是让利","wrong":"觉得含早加价太低「亏了」——没算早餐的边际成本。"},{"id":"M06-9","type":"card","title":"套房升级链的红线","def":"STE-E（2 间，88㎡）是全店最稀缺房型：D1/D2 日最后释放，表 J 升级链顶端。每日免费升级套房不超过 3 间，且须 L3 审批。","key":"套房是弹药，不能随便打","wrong":"客人不满意就免费升套房——稀缺库存被当成人情。"}]},{"id":"M07","lv":"L2","name":"库存限制与超售：表 B 与表 E","story":"山顶前的最后一段陡坡：房价怎么定已经会了，现在学「房怎么管」——限制条件家族和超售三步法。","kp":[{"id":"M07-1","type":"match","title":"表 B 档位 ↔ 四项配置","pairs":[["≥95%","MinLOS 2 晚(D1 3 晚)·CTA 启用·低价渠道关·不超售"],["90–95%","MinLOS 2 晚·CTA 仅 D1 启用·关尾房特惠·超售 ≤2 间"],["85–90%","MinLOS 1–2 晚·CTA 否·低价保留·按表 E"],["70–85%","MinLOS 1 晚·CTA 否·低价全开·按表 E"],["<70%","不设限·CTA 否·低价全开+促销·不超售"]]},{"id":"M07-2","type":"card","title":"90–95 档的「≤2 间」是固定值","def":"预测 OCC 90–95% 时超售上限固定 2 间，不走表 E 计算——表 E 只在 85–90% 与 70–85% 两档被调用。这是表 B 最容易记错的一处。","key":"这一档不请表 E，直接给 2","wrong":"90–95% 也去跑三步法——这档不用算。"},{"id":"M07-3","type":"card","title":"为什么满房日反而不超售","def":"≥95% 行超售列 = 不超售：预测已近满房，No-show 腾出的房会被上门散客（FIT-WI，全店最高 ADR ¥720）自然填掉，超售只会制造步行客人。","key":"满房时，No-show 是礼物不是机会","wrong":"越满越敢超——那是把最贵的客人往门外推。"},{"id":"M07-4","type":"seq","title":"表 E 三步法","steps":["第一步：按历史 No-show+24h取消率 查基准超售率","第二步：按当日特征乘修正系数（多项连乘）","第三步：算间数（向下取整）并套硬上限"]},{"id":"M07-5","type":"match","title":"No-show+取消率 ↔ 基准超售率","pairs":[["<5%","0%（不超售）"],["5–10%","2%"],["10–15%","3%"],["15–20%","5%"],["20–30%","7%"],[">30%","10%（需 L3 审批）"]]},{"id":"M07-6","type":"card","title":"四条修正系数","def":"D1 峰值日 / D2 高涨日 ×0.5；担保预订占比 >60% ×0.5；会议团队 >40% ×0.5；协议客户集中度 >50% ×0.8。多项满足时连乘：D1 + 担保 65% = ×0.25。","key":"越不敢出事的日子，系数越狠","wrong":"只乘一个系数就收工——多项满足必须连乘。"},{"id":"M07-7","type":"card","title":"硬上限三条","def":"① 不超过可售房量 5%；② 不超过 15 间；③ 步行 30 分钟内无同档次备用酒店 → 超售率减半。两条都要满足取小值：320 间 × 5% = 16，但 15 间更紧，恒取 15。","key":"5% 和 15 间，哪个小听哪个","wrong":"只记 5%——大店撞 15 间上限，小店撞 5% 上限。"},{"id":"M07-8","type":"scenario","title":"D1 日超售三步走","scene":"某 D1 峰值日，历史 No-show+24h 取消合计 12%，可售 320 间，无其他修正项。超售几间？","opts":[{"t":"基准 3% × 0.5 = 1.5% → 320 × 1.5% = 4.8 → 向下取整 4 间","c":"对。D1 修正减半 + 向下取整——超售是风险动作，宁可少一间。"},{"t":"4.8 → 四舍五入 5 间","c":"表 E 明确向下取整，不允许四舍五入。"},{"t":"3% → 9.6 → 10 间","c":"漏乘了 D1 的 ×0.5 修正。"}],"best":0},{"id":"M07-9","type":"card","title":"MinLOS 是筛子不是墙","def":"设 MinLOS 2 晚挡掉的是「只住周六一晚」的碎片预订，把房留给连住的高价值组合。预测 OCC <70% 时必须撤掉——淡季设 MinLOS 等于把客人往外赶。","key":"旺季筛短住、淡季全打开","wrong":"全年统一 MinLOS 2 晚——淡季出租率自己掉。"},{"id":"M07-10","type":"scenario","title":"改判 D1 会变什么","scene":"预测 OCC 92%（90–95 档）非 D1 日：MinLOS 2 晚、CTA 否、关尾房特惠、超售 ≤2 间。若改判为 D1 峰值日？","opts":[{"t":"只有 CTA 变：由「否」变「启用」","c":"对。该档其他三项不变。同一行里 D1 的开关只有 CTA。"},{"t":"四项全变","c":"MinLOS、超售列、低价渠道三项都不含 D1 条件。"},{"t":"超售改成按表 E 重算","c":"90–95 档超售固定 ≤2 间，与 D1 无关。"}],"best":0},{"id":"M07-11","type":"card","title":"超售的上限是三道闸的结果","def":"超售间数 = min(基准×修正 算出的间数, 房量 5%, 15 间)。它是「错了也扛得住」的保险阀，不是收益最大化工具——激进超售前先把自己店的 No-show 统计做扎实。","key":"先保命，再赚钱","wrong":"把超售率当 KPI 往上冲——一次步行客的赔偿与差评够吃掉一个月的超售收益。"}]},{"id":"M08","lv":"L2","name":"渠道分销：净价思维与表 H","story":"同一间房，走不同渠道到手的钱差 23 个点。这一段学会用「净价」看渠道，并用表 H 按需求开关水龙头。","kp":[{"id":"M08-1","type":"seq","title":"渠道成本率从低到高","steps":["直销 DIR 3%","会员 LOY 4%","协议 CORP 8%","GDS/TMC 13%","OTA 国内 16%","OTA 国际 18%","批发商/包房 26%"]},{"id":"M08-2","type":"card","title":"净价思维：先扣佣金再比较","def":"净收入 = 挂牌价 ×（1 − 成本率）。BAR ¥680：直销净 659.6，OTA 净 571.2，单间差 ¥88.4——100 间就差 ¥8,840。比渠道优劣永远用净价，不用牌价。","key":"到手的才是收入","wrong":"看 OTA 挂牌 ¥690 比直销 ¥680 高就高兴——扣完 16% 反而少赚。"},{"id":"M08-3","type":"match","title":"渠道 ↔ 一句话特点","pairs":[["直销/会员","成本最低、黏性最强"],["协议公司","稳定低频、可锁量"],["OTA 国内","量大、佣金 16%"],["OTA 国际","覆盖海外客、佣金 18%"],["GDS/TMC","商旅结算、佣金 13%"],["批发商/包房","一次走量、成本 26% 且净价不得公开"]]},{"id":"M08-4","type":"card","title":"NRevPAR 一算就懂","def":"NRevPAR = RevPAR ×（1 − 综合成本率）。日 RevPAR ¥425、综合成本率 12% → NRevPAR ¥374，每间可售房有 ¥51 被渠道吃掉。降价冲量如果冲来的是高佣金渠道，NRevPAR 反而掉。","key":"毛收入好看、净收入才救命","wrong":"RevPAR 涨了就庆功——成本率同步涨时净的没涨。"},{"id":"M08-5","type":"card","title":"表 H：需求越弱、龙头开越大","def":"OTA 国内按档位：≥95% 仅留 1 家产量最高 → 90–95% 开 2 家 → 85–90% 开 3 家 → 70–85% 全开 → 55–70% 全开+促销 → <55% 全开+深折。OTA 国际比国内晚一档开。","key":"弱市放量、旺市收口","wrong":"旺日还全渠道敞开——把高价库存便宜卖掉了。"},{"id":"M08-6","type":"card","title":"批发商：限价而不是全关","def":"70–85% 档批发商/包房 = 限价开（≤ BAR × 75% = ¥510），≥90% 才关。批发商成本率 26%，¥510 净到手 ¥377——薄，但空着的房更薄。","key":"75% 是批发商的及格线","wrong":"70–85% 就把批发商全关——低于 75% 红线的净价不能接，但达标的部分该走就走。"},{"id":"M08-7","type":"card","title":"价格一致性四条红线","def":"① 直销价 ≤ 任一 OTA 挂牌价（比的是最低那家）；② 会员价可低于 OTA 但仅登录可见；③ 批发净价不得公开挂牌；④ 违规 24 小时内整改并记入考核。每天 09:40 用 15 分钟核查。","key":"直销不能贵、会员要遮脸、净价不见光","wrong":"官网比携程贵 ¥40——被投诉接低价客，体系击穿。"},{"id":"M08-8","type":"scenario","title":"「独家最低价」的诱惑","scene":"OTA 渠道经理：给我们比官网低 12% 的独家价，保证首页曝光。BAR ¥680、该 OTA 成本 16%。","opts":[{"t":"拒绝——直销 ≤ 任一 OTA 是红线；改谈：给流量包不破价、或用会员价登录可见承接","c":"对。破价换曝光 = 用体系换流量，24h 整改 + 记考核的代价远高于曝光收益。"},{"t":"接受——曝光值 12%","c":"红线违规：官网将高于该 OTA 挂牌价，全渠道比价体系击穿。"},{"t":"口头答应，先上线再说","c":"一致性核查当天就会发现，照样整改记考核。"}],"best":0},{"id":"M08-9","type":"scenario","title":"把 OTA 客迁到直销值多少","scene":"某月 OTA 国内 8,000 间、平均 ADR ¥598。动员 20% 迁到直销（16%→3%）。","opts":[{"t":"省 1,600 × 598 × 13% = ¥124,384","c":"对。迁移 1,600 间，单间省 ¥77.74 佣金。直销动员省的是真金白银。"},{"t":"省 8,000 × 598 × 16% = ¥76,544","c":"口径错了：只有 20% 迁移，且省的是成本差 13 个点。"},{"t":"收入不变所以没意义","c":"佣金省下的每一元都是纯利润——这就是会员体系的意义。"}],"best":0},{"id":"M08-10","type":"card","title":"会员价的「登录可见」","def":"会员价可以低于 OTA 价，但仅限登录会员可见。公开展示 = 变相公开降价 → OTA 一致性投诉 + 侵蚀 BAR。合规做法：登录 + 会员身份验证后展示。","key":"会员价是钩子不是广告","wrong":"把会员价放首页当卖点——第二天 OTA 就来函了。"},{"id":"M08-11","type":"scenario","title":"算一次综合成本率","scene":"某日 200 房晚、同 ADR ¥640：直销 60 间（3%）、OTA 国内 80 间（16%）、协议 60 间（8%）。综合成本率？","opts":[{"t":"(60×3% + 80×16% + 60×8%) ÷ 200 = 9.3%","c":"对。按房晚加权。同价时加权成本率 9.3%，NRevPAR = 640 × 90.7% = ¥580.5。"},{"t":"(3%+16%+8%)÷3 = 9.0%","c":"简单平均不对——要按房晚数加权。"},{"t":"16%——按最大成本算","c":"保守过头。成本率按实际结构加权。"}],"best":0}]},{"id":"M09","lv":"L3","name":"竞争监测：表 C 与表 D","story":"登上山顶段，开始往外看：竞组五家怎么比、ARI/MPI 越界了怎么动。价格定位与份额诊断的双表联动。","kp":[{"id":"M09-1","type":"card","title":"表 C 六档ARI 动作","def":"<80 提 8%+查表F/含早；80–90 提 5%；90–97 提 3%（须预测 OCC≥80%）；97–103 健康-维持；103–110 维持观察 Pickup；110–120 RGI<100 降 5%；>120 MPI<95 降 8% / MPI≥95 维持盯盘。","key":"ARI 偏高要不要降，先看 RGI 或 MPI","wrong":"看到「偏高」就降——110–120 档有 RGI<100 的前置条件。"},{"id":"M09-2","type":"card","title":"表 C 执行约束","def":"ARI 调整每次 ≤8%、每周 ≤2 次，且不得与表 A 叠加（同日只执行优先级高的一条：表 A > 表 C）。「降 8%」「提 8%」正是单次上限——一次用满额度。","key":"8% 是顶格，用满就得等下周","wrong":"今天表 A 提 10%、表 C 再提 5%——叠加执行违规。"},{"id":"M09-3","type":"match","title":"MPI 档位 ↔ 动作（表 D）","pairs":[["<85 严重落后","应急 L2-E1：降 10%+全员直销动员+48h 复盘"],["85–95 落后","降 5% 或增加 OTA 广告投放"],["95–100 略弱","检查 OTA 曝光/挂牌/点评分，补挂牌"],["100–110 健康","维持"],[">110 领先","优先提价（走表 C 提价分支）"]]},{"id":"M09-4","type":"card","title":"L2-E1 应急包：三项缺一不可","def":"MPI <85 触发《应急方案 L2-E1》：降价 10% + 全员直销动员 + 48 小时复盘，三项同时启动才算执行。且表 D 优先级最低（第 6），同日与其他表冲突时让路。","key":"抢救份额是套餐，不是单点","wrong":"只降价不动员销售——份额还是抢不回来。"},{"id":"M09-5","type":"card","title":"竞组加权均价 ¥680 怎么来的","def":"五家平峰 BAR：A 江畔万枫 650（280 间）、B 希尔顿花园 690（240 间）、C 智选假日 560（300 间）、D 开元名都 880（350 间）、E 620——简单算术平均 = 680。口径统一（含税、含早、房型范围）后指数才有意义。","key":"先统一口径，再谈指数","wrong":"各家取数口径不一致算 RGI——偏差 >2% 说明数据有问题，先修数据。"},{"id":"M09-6","type":"scenario","title":"假持平识别","scene":"RGI = 100。拆开看：MPI 106、ARI 94。该高兴吗？","opts":[{"t":"不——份额是降价换的，该提价","c":"对。量赢价输的「假持平」：拿利润换份额。动作是查表 C 把 ADR 拉回，而不是维持现状。"},{"t":"高兴——综合追平市场","c":"只看综合指数会错过结构性问题。"},{"t":"加大投放继续抢量","c":"量已经赢了，缺的是价格。继续冲量是南辕北辙。"}],"best":0},{"id":"M09-7","type":"scenario","title":"ARI 偏高 + RGI 达标","scene":"ARI = 114、RGI = 102。查表 C。","opts":[{"t":"维持——110–120 档要求 RGI<100 才降，RGI 102 说明高价守住了","c":"对。高价且综合不落后 = 定位成功的表现，降了反而把利润让出去。"},{"t":"降 5%——ARI 越界了","c":"忽略了 RGI<100 的前置条件。"},{"t":"提价","c":"ARI 已 114，继续提很快进 >120 区间，风险大。"}],"best":0},{"id":"M09-8","type":"card","title":"RGI 验算：数字互相咬合","def":"RGI = RevPAR 比可直接算，也可 MPI × ARI ÷ 100 验算。例：本店 480/组合 500 = 96.0；MPI 106.7 × ARI 90.0 ÷ 100 = 96.0 ✓。两条路对不上（差 >2%）= 口径不一致，先查数据。","key":"指数互验是免费的体检","wrong":"直接信一个数——口径错了全部白算。"},{"id":"M09-9","type":"card","title":"竞组筛选「三同」","def":"同档次（ADR 差 ±20% 内）、同商圈（3km 内或共享客源）、同客群（商旅/度假/会议）。3–5 家：少于 3 家易被单店促销扰动，多于 5 家混入异质。每季度复核，停业装修的照样挂牌低价会污染均价——剔除。","key":"选错对手，指数全废","wrong":"把装修甩卖的酒店留在竞组里——ARI 虚高。"},{"id":"M09-10","type":"scenario","title":"一次完整定位诊断","scene":"平峰日：本店 OCC 68%、组合 74%；本店 ADR ¥700、组合 ¥680；Pickup 持平。三表各说什么？","opts":[{"t":"表 A ↓3%（55–70 行持平）；ARI 102.9 维持；MPI 91.9 → 降 5% 或加 OTA 投放；最终执行 ↓3%，表 D 的动作记观察清单","c":"对。按表 O 优先级 A>C>D 依次裁决，价格让一步、份额落后另案处理。"},{"t":"表 D 优先执行降 5%","c":"表 D 优先级最低（第 6），不能抢在表 A 前面。"},{"t":"量价都弱，直接降 8%","c":"幅度没有依据——表 A 该格给的是 ↓3%，表 C 的 8% 是 ARI 严重偏低才用。"}],"best":0}]},{"id":"M10","lv":"L3","name":"客源细分与团队决策：表 G 与表 K","story":"山顶的平台：团队和会议的大单最诱人也最危险。这一段练「置换思维」——每间房给谁才最值。","kp":[{"id":"M10-1","type":"card","title":"表 G 的两个输入","def":"R = 团队报价 ÷ 该日预期散客 ADR（输入 1）+ 该日预测 OCC（输入 2），行列交叉给唯一动作。分子分母不可颠倒——反着写 R 永远 >100%，判定失效。","key":"R 是「团队价是散客价的几折」","wrong":"把公式倒过来算 R——整张表读成天书。"},{"id":"M10-2","type":"seq","title":"R 的五个分档","steps":["R ≥ 85%：优质团队价","75% ≤ R < 85%：可谈区间","65% ≤ R < 75%：谨慎区间","55% ≤ R < 65%：低价区","R < 55%：击穿区"]},{"id":"M10-3","type":"card","title":"高价团队紧张日也要限量","def":"R ≥85% 且预测 OCC >85% → 接受但 ≤10 间。再好的团队价也只给 10 间——紧张日散客的边际价值更高，必须留库存。这是「高价团队也限量」的逻辑。","key":"越忙的日子，团队越要掐着给","wrong":"团队价高就放 60 间——把当天最好的散客挤走了。"},{"id":"M10-4","type":"scenario","title":"直觉陷阱：空日低价团","scene":"预期散客 ADR ¥680，预测 OCC 65%（很空）。旅行社询价 ¥420，R = 61.8%。","opts":[{"t":"上报 L3——表 G 该格是「上报 L3」，不是「房多就收」","c":"对。低价团即使在空日也要 L3 把关：它可能锁死库存排挤后续高价散客，还牵动淡季价格底线。"},{"t":"接受 ≤30 间——反正空着","c":"这正是本题设计的直觉陷阱：R <65% 的团不是房多就能接的。"},{"t":"拒绝","c":"主矩阵是「上报 L3」，由 L3 结合综合贡献拍板，不是直接拒绝。"}],"best":0},{"id":"M10-5","type":"scenario","title":"优质团队遇高峰","scene":"预期散客 ADR ¥680，预测 OCC 92%。企业询价 ¥600，R = 88.2%。","opts":[{"t":"接受，但 ≤10 间","c":"对。R ≥85% + OCC >85% → 接受 ≤10 间：优质价也只给10 间，其余留给散客。"},{"t":"接受 ≤30 间","c":"30 间的档位在更空的列。92% 的日子最多 10 间。"},{"t":"拒绝——太满了","c":"价达 88% 的优质客可以要，只是限量。"}],"best":0},{"id":"M10-6","type":"card","title":"置换成本：拒绝团队的真实代价","def":"客房置换成本 = 被挤占房晚 ×（预期散客 ADR − 团队价）。40 间夜 ×（680−480）= ¥8,000；再加工挤占的餐饮等边际收益 = 完整置换成本。低于这个数的让步，都是白送。","key":"接单前先算：挤掉了谁","wrong":"只看团队总收入 40×480=19,200 很大——没算挤掉散客的机会成本。"},{"id":"M10-7","type":"card","title":"表 K 会议底线随规模递减","def":"接受底线 = 置换成本 × 系数：小型 ≤30 人 ×1.1；中型 31–120 ×1.0；大型 121–300 ×0.95；超大型 >300 ×0.9 + L3/业主审批。越大折扣越松——因为餐饮宴会的溢出效应越强。","key":"单子越大，越要看综合贡献","wrong":"用客房口径否掉大会议——漏算了宴会厅的钱。"},{"id":"M10-8","type":"card","title":"餐饮保底四档","def":"≤30 人 ≥¥8,000；31–120 人 ≥¥30,000；121–300 人 ≥¥80,000；>300 人 ≥¥150,000。客房需求对应 ≤15 / 16–60 / 61–150 / >150 间夜。保底不达标，贡献再好看也有水分。","key":"保底是会议的入场券","wrong":"只算综合贡献总额，忘了保底线。"},{"id":"M10-9","type":"card","title":"会议附加条款：低价也能接","def":"会议团队综合贡献 ≥ 占用房晚 × 预期散客 ADR × 85% 时，即使 R<55% 也可接受——但须 L3 审批并记入《团队决策档案》。仅限会议团队，普通旅游团与协议不适用。","key":"看整单生意，不只看房费","wrong":"把这条用在旅游团上——条款只开给带宴会餐饮的会议。"},{"id":"M10-10","type":"scenario","title":"年会大单怎么判","scene":"企业年会 60 间夜 @¥340（R=50%，主矩阵拒绝）；餐饮 80,000 + 会场 30,000 + 其他 5,000，综合贡献 ¥135,400；阈值 = 60×680×85% = ¥34,680。","opts":[{"t":"附加条款成立 → 最终可接受，L3 审批并记档案","c":"对。主矩阵拒绝 + 综合贡献达标 = 走附加条款。这正是会议线「算总账」的意义。"},{"t":"维持拒绝——主矩阵说了算","c":"主矩阵对会议团队有附加条款通道，贡献达标可翻案。"},{"t":"直接接，不用审批","c":"附加条款明确要 L3 审批 + 记录档案。"}],"best":0},{"id":"M10-11","type":"card","title":"七个细分是定价的地基","def":"FIT-WI 8% / FIT-DIR 17% / FIT-OTA 31% / CORP 22% / LOY 12% / GRP 8% / LNG 2%。细分不是为了报表好看——每个细分的敏感度和成本不同，差异化定价的前提就是分开看。","key":"先分人，再分价","wrong":"全体客人一个价——把OTA 价格敏感客和协议稳定客混着定价，两头都吃亏。"}]},{"id":"M11","lv":"L3","name":"年度预算与滚动预测：把目标拆成每一天","story":"接近山顶：从一天到一个_year。预算不是拍一个 RevPAR 数字，是把它拆进月、周、日和事件。","kp":[{"id":"M11-1","type":"card","title":"固定分母：116,800","def":"年可售房晚 = 320 × 365 = 116,800。RevPAR、TRevPAR、GOPPAR 全用它当分母。当年有装修停业或新增房量，须按实际重算——不能照抄。","key":"分母一动，全馆指标跟着动","wrong":"换算年度指标还用去年的分母。"},{"id":"M11-2","type":"card","title":"收入结构决定看哪些指标","def":"云璟上年：客房 ¥51,977,328（61.4%）+ 餐饮 ¥28,600,000（33.8%）+ 其他 4.8%。客房只占六成——这就是全服务酒店必须同时看 RevPAR 与 TRevPAR 的原因。","key":"收入结构在哪里，管理重心就在哪里","wrong":"全服务酒店只盯 RevPAR——三分之一强的餐饮营收没人管。"},{"id":"M11-3","type":"card","title":"量差价差：变动可以完全分解","def":"量差 =（OCC₁−OCC₀）× ADR₀；价差 =（ADR₁−ADR₀）× OCC₁。量差用基期价、价差用报告期量，两者之和恰等于 RevPAR 总变动，无残差。例：量差 12.36 + 价差 16.28 = 28.64 ✓。","key":"量差旧价称、价差新量称","wrong":"两项权重都用基期或都用报告期——加起来对不上总变动。"},{"id":"M11-4","type":"seq","title":"预算编制流程","steps":["每年 9 月启动（给 10 月业主汇报和 Q4 续签留时间）","按季节系数 × 日型系数拆到月/周/日","D1/D2 日单独按事件定价（系数 150–200%）","汇总成《年度预算文件》","次年每月 1 日滚动复核修正"]},{"id":"M11-5","type":"card","title":"目标不能 ÷12","def":"1 月最淡：OCC 58%、ADR ¥540、RevPAR ¥313.2；10 月最旺：OCC 85%、ADR ¥700 + D1 系数。月度按「季节系数 × 日型系数」拆分，日型至少分 D1/D2/D3/D4。","key":"旺淡起伏是规律，平摊目标是错误","wrong":"年度目标 ÷12 当月度目标——1 月永远达不成、10 月永远躺赢。"},{"id":"M11-6","type":"scenario","title":"业主要多 8%，怎么拆","scene":"业主要求 RevPAR 从 ¥445 提 8% 到 ¥480.6。三条路径：A 只提 ADR 至 667.5；B 只提 OCC 至 77.8%；C 均衡 ADR 642.7 + OCC 74.8%。","opts":[{"t":"推荐 C：量价各走一点，单边压力最小","c":"对。只提价要 +8% ADR，会被竞对压死；只冲量要 OCC 77.8% 超过目标线。均衡路径每边只走 4%，可行性最高。"},{"t":"推荐 A：先把价格拉满","c":"ADR +8% 在竞组均价 680 的环境里约 ARI 98→106，超出现实空间。"},{"t":"推荐 B：营销多卖就行","c":"OCC 77.8% 高于本店历史 72% 近 6 个点，单靠营销不现实。"}],"best":0},{"id":"M11-7","type":"card","title":"预算推演公式链","def":"目标收入 = 可售房晚 × OCC × ADR = 可售房晚 × RevPAR。验算：116,800 × 72% × 618 ≈ ¥51.97M ✓。任何目标先问：量走多少、价走多少、加起来对不对。","key":"预算的每个数都要能从公式里长出来","wrong":"目标收入与 OCC/ADR 对不上——自洽都不过关。"},{"id":"M11-8","type":"scenario","title":"滚动修正","scene":"全年目标 RevPAR ¥473.6。Q1 实际只完成 RevPAR ¥400（90 天）。后三季要怎么走？","opts":[{"t":"剩余 RevPAR =（55,316,480 − 11,520,000）÷ 27,200 间 ≈ ¥497.7，比原目标高 5.1%","c":"对。滚动预测的意义：Q1 欠的账要显性化，重新分配到剩余月份，而不是假装全年目标还在。"},{"t":"维持原目标不动","c":"Q1 已定型，剩余月份的隐含目标实际上已经变了——不重算就是自欺。"},{"t":"全年目标下调 5%","c":"先看 Q1 欠收原因：是季节性偏差还是趋势性下滑，处置不同，不能直接砍目标。"}],"best":0},{"id":"M11-9","type":"card","title":"预算要和竞对一起算","def":"目标 OCC 74%/ADR 640 vs 预计组合 71%/660：MPI 104.2、ARI 97.0、RGI 101.1 → 表 C「97–103 健康」维持、表 D「100–110」维持。预算不光是自己的数，还是与市场的相对位置。","key":"预算 = 自己的目标 + 竞对的预判","wrong":"只算自己的数——年底 RGI 掉了才发现对手跑得更快。"},{"id":"M11-10","type":"card","title":"复盘差额再拆一遍","def":"每月 1 日：实绩 413 vs 目标 444，差 ¥31 → 量差 −24 + 价差 −7。量没跟上主责，价小欠。差额拆解指向动作：量的问题查渠道与限制条件，价的问题查表 A 执行。","key":"差额不拆开，复盘就是抒情","wrong":"「这个月差 31 块」——不拆量价，下个月不知道改什么。"}]},{"id":"M12","lv":"L3","name":"会议与汇报：把数据讲成决策","story":"山顶的最后一段台阶：收益经理一半的工作是说服。这一段练对业主、对总经理、对跨部门把话讲到位。","kp":[{"id":"M12-1","type":"seq","title":"汇报指标的出场顺序","steps":["RevPAR——第一指标打头","OCC 与 ADR——双因子分解量价","MPI/ARI/RGI——竞争定位","NRevPAR——剔渠道成本的真实收入","GOPPAR——落到最后利润"]},{"id":"M12-2","type":"card","title":"为什么不能只报 OCC","def":"OCC 只含量不含价——OCC 100% 也可能是贱卖。 RevPAR = OCC × ADR 量价合一才是第一指标。汇报顺序错了，业主就会用 OCC 考核你，逼着前台低价冲量。","key":"报什么指标，业主就考什么","wrong":"用 OCC 报喜——把管理层引向单指标考核的死路。"},{"id":"M12-3","type":"card","title":"GOPPAR 必须出现在汇报里","def":"业主关心利润不是收入。RevPAR 上升但 GOPPAR 没同步上升时，必须主动说明原因（通常是渠道成本），并给出动作（表 H 收紧 + 直销动员）——否则这个差口会被业主自己解释。","key":"自己先说破，别等业主问","wrong":"回避利润话题——业主对收益经理的信任就断了。"},{"id":"M12-4","type":"scenario","title":"业主的灵魂拷问","scene":"「RevPAR 从 445 涨到 480（+7.9%），GOP 率怎么反而从 32.0% 掉到 30.5%？」","opts":[{"t":"增量主要来自高成本 OTA——展示 NRevPAR 数据，给出收紧表 H + 直销动员的动作","c":"对。三步：先承认数据、再定位原因（渠道结构）、最后给动作。主动权在自己手里。"},{"t":"解释为「行业都这样」","c":"模糊归因等于没回答——业主要的是机制解释和动作。"},{"t":"承诺下月 GOP 一定回升","c":"没有依据的承诺比不回答更伤信任。"}],"best":0},{"id":"M12-5","type":"card","title":"一页纸摘要的六个板块","def":"固定顺序：① RevPAR 同比/环比 ② OCC/ADR 分解 ③ 三维指数 ④ 渠道与 NRevPAR ⑤ GOPPAR ⑥ 下月动作。顺序不能乱——业主的目光从上往下扫，最重要的放最上。","key":"一页纸是给「只读一页的人」的","wrong":"把动作清单放最上、指标塞最后——业主看不清结果就先否了。"},{"id":"M12-6","type":"card","title":"晨会 25 分钟：双向通道","def":"10:05 收益晨会 ≤25 分钟：收益部输出今日动作，销售输入团队/协议在谈，前厅输入 No-show/升级/客诉。缺任何一方，表 A 的预测和表 E 的超售都是瞎子。超时的议题转《观察清单》，不拖堂。","key":"数据要双向流动才有用","wrong":"收益部自说自话开晨会——明天预测照样失真。"},{"id":"M12-7","type":"scenario","title":"前厅经理的质疑","scene":"「超售 15 间，客人全来了拿什么给？责任谁负？」完整应答怎么组织？","opts":[{"t":"四段：数从表 E 三步法来 → 硬上限 15 间兜底 → A/E/B 三家备用酒店 → 表 L 步行预案四步补偿","c":"对。每一段都有出处：不是赌，是带保险的风控。质询会变成信任。"},{"t":"「行业标准都这样」","c":"数字答不出出处，质疑就赢了。"},{"t":"「出了事我负责」","c":"态度不能替代机制——要讲清防线的每一层。"}],"best":0},{"id":"M12-8","type":"scenario","title":"销售部要降价保客户","scene":"销售：某协议公司要求从 ¥520 降到 ¥450，理由对手报 ¥430。该客户年用房 2,000 间夜，当日预测 OCC 82%。","opts":[{"t":"算 R = 66.2% → 上报 L3；年损失 ¥140,000、置换成本远高于此；替代：提到 ¥510 走「接受 ≤20 间」格","c":"对。用表 G 的语言把「人情压力」翻译成「置换成本」，再给出替代方案——销售和收益就站到了同一边。"},{"t":"答应——客户重要","c":"OCC 82% 的日子给 66% 折扣，置换成本巨大；且一旦降了就是新协议价，回不去。"},{"t":"直接拒绝","c":"不给出口的销售协作只会变成地下折扣。给替代方案才能落地。"}],"best":0},{"id":"M12-9","type":"card","title":"PPT + 一页纸缺一不可","def":"每月 10 日产出两件：PPT 用于现场讲述，一页纸摘要用于会后被转发与存档。业主与管理层多数时候只读一页纸——它是收益经理真正的「简历」。","key":"会被转发的那个文件，才是真汇报","wrong":"只做 PPT——会后没人记得内容。"},{"id":"M12-10","type":"card","title":"数据自洽是汇报的底线","def":"NRevPAR = RevPAR ×（1 − 成本率）现场就能验：473.6 × 90.9% = 430.5 ✓。L3 答辩里 GOPPAR 写错一个数（232 写成 223），数据准确性 30 分直接按比例扣。数字咬合是信任的第一层。","key":"汇报前自己先当一回审计","wrong":"指标各写各的——业主一验算，全盘 credibility 崩塌。"}]},{"id":"M13","lv":"L3","name":"跨部门协同与冲突仲裁：表 O","story":"六张表打架听谁的？总经理要降价、OTA 要独家价、业主提非分要求——这一段练的是「有依据地说不」。","kp":[{"id":"M13-1","type":"seq","title":"表 O 优先级（背下来）","steps":["1 表 L 应急——异常事件，覆盖一切","2 表 B 库存——超售/关房安全","3 表 A 价格——每日调价","4 表 C ARI——价格定位","5 表 H 渠道——开关与限价","6 表 D MPI——份额诊断"]},{"id":"M13-2","type":"card","title":"口诀：保命→保底→挣钱→微调→放量→诊断","def":"应急保命（L）→ 库存保底（B）→ 价格挣钱（A）→ 定位微调（C）→ 渠道放量（H）→ 份额诊断（D）。先别出事故，再别卖错房，然后才谈卖多少钱。","key":"六层顺序就是风险层级","wrong":"把表 D 排在表 B 前——份额诊断可等，库存事故不能等。"},{"id":"M13-3","type":"card","title":"铁律三条","def":"① 同日只执行优先级最高的那一条动作，其余记《观察清单》；② 最高优先级为「维持」时顺延执行下一优先级；③ 所有冲突与取舍写入台账备注栏（放弃哪条、为什么、何时复看）。","key":"同维冲突取其一，维持就顺延，取舍必留痕","wrong":"表 A 和表 C 同日都执行——叠加违规。"},{"id":"M13-4","type":"card","title":"裁决只管同维度","def":"表 A 与表 C 都动价格 → 冲突取其一。但表 G（团队询价）、表 K（会议）作用于不同对象 → 与价格/渠道动作并行执行，不适用「只取一条」。","key":"维度不同，并行不悖","wrong":"把团队询价也卷进表 O 顺延——该接的单被拖着黄了。"},{"id":"M13-5","type":"scenario","title":"总经理令：今天必须降 20%","scene":"预测 OCC 64%、Pickup 落后 16%。查表 A = ↓10%。总经理晨会拍板降 20%。","opts":[{"t":"按表 A 执行 ↓10%：向总经理展示查表依据，说明 20% 一次用满当日额度、且超出表格结论无台账可写","c":"对。用表格与约束说话：不是不听指挥，是 20% 之后今天再无调整空间，且 10% 已是该格结论。"},{"t":"听总经理的，降 20%","c":"超出表 A 结论 + 用满单日额度 + 无表编号可写——三重违规。"},{"t":"各降一半，降 10% 但不写台账","c":"执行对了但留痕违规——台账是保护执行人的。"}],"best":0},{"id":"M13-6","type":"scenario","title":"业主的 ARI 幻想","scene":"业主：「我们要做高端，ARI 必须从 90.9 提到 110，不能比竞对便宜。」当前 ADR 618、组合 680。","opts":[{"t":"算给他看：ARI 110 = ADR 748 = 提价 21%→ 超出表 C 单次 8% 上限、超约束，OCC 将大幅回落；给出渐进路径","c":"对。用公式把「愿望」翻译成「代价」，再给可执行的分步路径。拒绝要有数字。"},{"t":"答应，明天就提价","c":"21% 直接违反表 C 约束，OCC 崩盘后业主第一个问责。"},{"t":"说「做不到」","c":"只有拒绝没有方案——给出渐进路径（分季提价 + 产品升级）才是专业应答。"}],"best":0},{"id":"M13-7","type":"card","title":"表 J 升级顺序","def":"腾房升级按会员等级：钻石 → 铂金 → 金卡（住 2 晚）→ 金卡（住 1 晚）。当日套房升级 ≤3 间且 L3 审批。升级是超售的缓冲垫，也是会员体系兑付的一部分。","key":"先高卡后低卡、先长住后短住","wrong":"谁闹得凶给谁升——会员体系信用破产。"},{"id":"M13-8","type":"scenario","title":"财务总监的风险质疑","scene":"「超售是赌客人不来，这是风险敞口，我不同意。」历史 No-show 6% + 取消 7% = 13% → 基准 3%；320 间预测 96% 档修正后 9 间。怎么应答？","opts":[{"t":"摆期望账：多卖 9 间的期望收益 ¥41,760 vs 步行期望成本 ¥4,080，净期望 +¥37,680，且有硬上限与步行预案兜底","c":"对。风险敞口是真的，但要量化对冲后再谈——期望收益 10 倍于期望成本，且上限封顶。"},{"t":"「大家酒店都超售」","c":"同行惯例不能回应风险质疑——要给数字。"},{"t":"「出了事有预案」","c":"只谈兜底不谈收益，等于承认纯风险。期望账才是完整答案。"}],"best":0},{"id":"M13-9","type":"card","title":"毛利率红线：贡献达标也可能不能接","def":"会议餐饮报价 ¥30,000、成本 ¥14,500，毛利率 51.7%。若综合贡献达标但毛利率 <55%，须 L3 审批；再降价到 ¥25,000 毛利率掉到 42%——贡献数字好看，利润结构恶化，不可行。","key":"总额达标 + 毛利率达标，双门都过","wrong":"只看综合贡献总额——被低毛利大单撑起来的「达标」是假达标。"},{"id":"M13-10","type":"card","title":"协同的本质：让对方看见同一张表","def":"前台抵触超售、销售要折扣、餐饮要接会——冲突的根子是各自只看自己的指标。把表 E 的账、表 G 的 R、表 K 的保底摆到桌面上，用同一套数字对话，协同才成立。","key":"先对齐数字，再对齐立场","wrong":"靠人情和权威压部门——今天答应，明天变本加厉。"}]},{"id":"M14","lv":"L3","name":"系统与自动化：人机边界","story":"登顶前的最后一站：把重复的交给机器，把判断的留给人。这一段画清楚人机的边界线。","kp":[{"id":"M14-1","type":"seq","title":"RMS 四模块（按数据流）","steps":["数据接入：PMS 历史/在手、渠道、竞对、事件日历","需求预测：历史 + 在手 + 提前窗口 → 每日预测","价格推荐：基于预测与竞争给建议价","自动下发：推到 PMS 与各渠道"]},{"id":"M14-2","type":"card","title":"白名单/黑名单判据","def":"白名单 = 错了代价可控且易回滚（平峰 ±3–5%、常规开关、限制批量设置、巡检、报表）。黑名单 = 错了代价高或需人的判断（D1 日任何调价、超售率 >10%、团队会议询价、表 L 异常事件）。","key":"错了赔得起才交给机器","wrong":"按「涉不涉及钱」分——平峰调价也涉及钱，但赔得起。"},{"id":"M14-3","type":"match","title":"动作 ↔ 白/黑名单","pairs":[["平峰日 ±3–5% 调价","白名单"],["常规渠道开关","白名单"],["D1 峰值日调价","黑名单"],["超售率 >10%","黑名单"],["团队/会议询价决策","黑名单"],["价格一致性巡检","白名单"]]},{"id":"M14-4","type":"card","title":"为什么 D1 不能全自动","def":"全年约 20 个 D1 日占客房收入 12–18%，调错一次几十万且无法回滚；且系统在 D1 的一手数据最少（一年才几次），预测误差反而最大。D1：系统只给建议，人来拍板。","key":"越值钱的日子，人越要在场","wrong":"「系统国庆预测最准」——恰恰相反，样本最少的日期误差最大。"},{"id":"M14-5","type":"card","title":"告警稀缺性：只留 8 条","def":"告警太多等于没有——人会把邮箱设成自动归档。只留真正需要人介入的：Pickup 异常落后/领先、ARI 越界、一致性违规、接近满房、渠道断连、竞对大幅降价、超售逼近上限。其余走日报。","key":"告警的价值在于稀缺","wrong":"「宁可误报不可漏报」配 80 条/天——第三天就没有人看了。"},{"id":"M14-6","type":"seq","title":"自动化渐进五级（不许跳级）","steps":["L0 纯手工","L1 Excel 半自动（建议所有人从这里开始）","L2 系统推荐 + 人工确认（150 间以上或有专职收益）","L3 白名单自动 + 黑名单人工（L2 顺跑 3 个月以上）","L4 全自动 + 人工监管（集团多店 + 成熟中台）"]},{"id":"M14-7","type":"scenario","title":"跳级的代价","scene":"某店从 L0 直接上 RMS 开全自动，一个月 ADR 掉了 15%。","opts":[{"t":"典型跳级事故：参数没配好 → 建议离谱 → 全自动没人看。回退到 L2：推荐 + 人工确认，顺跑 3 个月再放白名单","c":"对。自动化不是一步到位，采纳率 >70% 才升级——每一级是下一级的验收。"},{"t":"系统不行，换一家","c":"先查参数与流程：多数「系统不行」是 L0 直接跳 L4 的人为事故。"},{"t":"关掉系统回到手工","c":"因噎废食。回退一级（L2）保留预测能力，人审价格。"}],"best":0},{"id":"M14-8","type":"card","title":"12 个参数必须自己算","def":"竞组、价格地板（盖住变动成本）、细分权重（按净贡献不按产量）等 12 参数不能照抄推荐值——每家店的成本结构与客群不同。且每季度复核一次，市场变了参数不改，系统越跑越偏。","key":"参数是系统的大脑，得自己喂","wrong":"抄隔壁酒店的参数——系统学的是别人家的生意。"},{"id":"M14-9","type":"scenario","title":"系统学坏了","scene":"按「产量」设细分权重三个月，NRevPAR 越跑越低，系统天天降价冲 OTA。","opts":[{"t":"权重口径错了：改成按净贡献设——直销 3% 权重应高于 OTA 16%；重训参数","c":"对。产量最大 ≠ 贡献最大。按产量设权重等于告诉系统「OTA 的量最值钱」。"},{"t":"OTA 单也赚钱，没问题","c":"16% 佣金下的「赚钱」被直销 3% 一比就露馅——NRevPAR 已经在报警。"},{"t":"关掉自动调价","c":"先修参数（根因），再谈开关——参数错，人工确认也会被带偏。"}],"best":0},{"id":"M14-10","type":"scenario","title":"国庆 D1 系统建议降价","scene":"国庆 D1，系统建议降价 10% 冲 OTA（预测 OCC 仅 82%）。执行吗？","opts":[{"t":"不执行——D1 任何调价在黑名单，人工拍板；先人工复核预测：D1 历史 OCC ≥95%，系统 82% 大概率低估","c":"对。黑名单挡下动作 + 人复核预测——两层都指向「不执行」。"},{"t":"执行——系统基于数据","c":"D1 是黑名单；且预测 82% 与 D1 历史规律矛盾，输入可能就错了。"},{"t":"折中降 5%","c":"黑名单没有折中——D1 的价格动作一律人工。"}],"best":0},{"id":"M14-11","type":"card","title":"超售参数：两个上限取小","def":"系统里超售上限 = 5% 且 ≤15 间，两条都设、取小值。200 间的小店：5% = 10 < 15，取 10。把参数放大一倍 = 表 E 的保险被拆了。","key":"参数抄法典，别自由发挥","wrong":"把 15 改成 30——步行客人的赔偿和差评不会跟你商量。"},{"id":"M14-12","type":"card","title":"净价对齐：给系统定的锚","def":"直销 3% vs OTA 16%：要拿相同净价，OTA 报价须比直销高约 15.5%（0.84X = 97 → X ≈ 115.5）。这类锚点数是渠道优先级参数的地基——系统按它排序给价。","key":"系统的每一个数，背后都要有净价逻辑","wrong":"拍脑袋填「OTA 高 10%」——比直销净价还低，系统自然学坏。"}]}];
var KEY = 'hrma_quest_v2';
var TYPENAME = {card:'读一读', seq:'排个序', match:'连一连', scenario:'看一看后果'};
var TYPEQ = {card:'读完全部三段，点亮', seq:'按正确顺序点齐，点亮', match:'全部连对，点亮', scenario:'看完后果与推荐做法，点亮'};
var LVID = {L1:'山脚 · L1', L2:'山腰 · L2', L3:'山顶 · L3'};
var ZCLS = {L1:'z1', L2:'z2', L3:'z3'};

function $(id){return document.getElementById(id)}
function resc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function jload(){try{var v=JSON.parse(localStorage.getItem(KEY)||'null');return (v&&typeof v==='object'&&!Array.isArray(v)&&v.lit)?v:{lit:{}}}catch(e){return {lit:{}}}}
function jsave(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
var P=jload();
function litN(m){var n=0;for(var i=0;i<m.kp.length;i++){if(P.lit[m.kp[i].id])n++}return n}
function campDone(mi){return litN(CAMPS[mi])===CAMPS[mi].kp.length}
function allDone(){for(var i=0;i<CAMPS.length;i++){if(!campDone(i))return false}return true}
function unlocked(mi){return mi===0||campDone(mi-1)}
var nowMi=0, nowKpi=0, mstate=null;
function flash(t){var f=$('flash');f.textContent=t;f.className='flash show';window.clearTimeout(f._t);f._t=window.setTimeout(function(){f.className='flash'},1600)}

/* ── 山径 ── */
function drawTrail(){
  var h='',lastZone='';
  for(var i=0;i<CAMPS.length;i++){
    var m=CAMPS[i];
    if(m.lv!==lastZone){lastZone=m.lv;
      h+='<div class="zone zone-h '+ZCLS[m.lv]+'">'+({L1:'🏕️ 山脚 · L1 基础',L2:'🥾 山腰 · L2 进阶',L3:'🧗 山顶 · L3 高阶'})[m.lv]+'<small>'+(m.lv==='L1'?'M01–M04 · 先把语言和数据练熟':(m.lv==='L2'?'M05–M09 · 预测、价格、库存、渠道、竞争':'M10–M14 · 客源、预算、汇报、协同、自动化'))+'</small></div><div class="trail">';
    }
    var n=litN(m), total=m.kp.length, done=campDone(i), lock=!unlocked(i), cur=(!lock&&!done);
    var cls='camp '+ZCLS[m.lv]+(done?' done':'')+(cur?' cur':'')+(lock?' locked':'');
    var lamps='';for(var j=0;j<total;j++){lamps+='<i class="'+(j<n?'on':'')+'"></i>'}
    var right=lock?'🔒 完成「'+CAMPS[i-1].id+'」解锁':(done?'<span class="flag">🚩</span> 已通过':'<b style="color:var(--gold)">→ 进行中</b>');
    h+='<div class="'+cls+'" data-mi="'+i+'" role="button" tabindex="0">'
      +'<div class="badge">'+m.id+'</div>'
      +'<div class="cbody"><div class="cname">'+resc(m.name)+'</div>'
      +'<div class="cmeta"><span>💡 '+n+' / '+total+' 盏</span><span>'+({card:'📖',seq:'🔢',match:'🔗',scenario:'🎬'})+'</span></div>'
      +'<div class="lamps">'+lamps+'</div></div>'
      +'<div class="cright">'+right+'</div></div>';
  }
  h+='</div>';
  $('trail').innerHTML=h;
  var nodes=$('trail').querySelectorAll('.camp');
  for(var k=0;k<nodes.length;k++){(function(el){
    el.addEventListener('click',function(){var mi=+el.getAttribute('data-mi');
      if(!unlocked(mi)){flash('🔒 先点亮「'+CAMPS[mi-1].id+' '+CAMPS[mi-1].name.slice(0,12)+'…」的全部知识灯');return}
      showCamp(mi);});
  })(nodes[k])}
}

/* ── 营地 ── */
function showCamp(mi){
  nowMi=mi; var m=CAMPS[mi];
  $('campHead').className='camphead '+(m.lv==='L1'?'z1h':(m.lv==='L2'?'z2h':'z3h'));
  $('campBadge').textContent=m.id;
  $('campName').textContent='营地 '+m.id+' · '+m.name;
  $('campLv').textContent=LVID[m.lv]+' · '+m.kp.length+' 盏知识灯 · '+TYPENAME[m.kp[0].type]+'开始';
  $('campStory').textContent=m.story;
  drawCampGrid();
  $('trail').className='panel';$('stKp').className='panel';$('stSummit').className='panel summit';
  $('stCamp').className='panel on';
  drawTop();window.scrollTo({top:0,behavior:'smooth'});
}
function drawCampGrid(){
  var m=CAMPS[nowMi];var n=litN(m);
  $('campProgTxt').textContent='已点亮 '+n+' / '+m.kp.length;
  $('campProgFill').style.width=(100*n/m.kp.length)+'%';
  var h='';
  for(var i=0;i<m.kp.length;i++){var k=m.kp[i],lit=!!P.lit[k.id];
    h+='<div class="kchip'+(lit?' lit':'')+'" data-i="'+i+'" role="button" tabindex="0">'
      +'<div class="ic '+k.type+'">'+({card:'📖',seq:'🔢',match:'🔗',scenario:'🎬'})[k.type]+'</div>'
      +'<div style="flex:1;min-width:0"><div class="kt">'+resc(k.title)+'</div>'
      +'<div class="ksub">'+TYPENAME[k.type]+' · '+k.id+'</div></div>'
      +'<div class="glow">'+(lit?'💡':'')+'</div></div>';
  }
  $('kpGrid').innerHTML=h;
  var chips=$('kpGrid').querySelectorAll('.kchip');
  for(var c=0;c<chips.length;c++){(function(el){
    el.addEventListener('click',function(){showKp(+el.getAttribute('data-i'))});
  })(chips[c])}
}

/* ── 知识灯 ── */
function showKp(i){
  nowKpi=i; var m=CAMPS[nowMi], k=m.kp[i];
  $('kpMeta').innerHTML='<span class="kptag '+k.type+'">'+TYPENAME[k.type]+'</span>'
    +'<span class="kptag dim">'+m.id+' · '+k.id+'</span>'
    +'<span class="kptag dim">'+LVID[m.lv]+'</span>'
    +(P.lit[k.id]?'<span class="kptag" style="background:var(--ok)">已点亮</span>':'');
  $('kpTitle').textContent=k.title;
  $('nudge').className='nudge';$('nudge').textContent='';
  var box=$('kpBox'); box.innerHTML='';
  mstate={done:false};
  if(k.type==='card')renderCard(k);
  else if(k.type==='seq')renderSeq(k);
  else if(k.type==='match')renderMatch(k);
  else if(k.type==='scenario')renderScenario(k);
  var row=$('kpRow'); row.innerHTML='';
  var bb=document.createElement('button');bb.className='btn ghost';bb.textContent='← 回营地';bb.onclick=function(){showCamp(nowMi)};row.appendChild(bb);
  var lb=document.createElement('button');lb.className='btn gold';lb.id='btnLight';
  if(P.lit[k.id]){lb.textContent='💡 已点亮 · 回营地';lb.onclick=function(){showCamp(nowMi)};}
  else{lb.textContent='💡 点亮这盏灯（'+TYPEQ[k.type]+'）';lb.disabled=!mstate.done;
    lb.onclick=function(){lightNow()};}
  row.appendChild(lb);
  $('trail').className='panel';$('stCamp').className='panel';$('stSummit').className='panel summit';
  $('stKp').className='panel on';
  drawTop();window.scrollTo({top:0,behavior:'smooth'});
}
function ready(){mstate.done=true;var b=$('btnLight');if(b)b.disabled=false}
function nudge(t){var n=$('nudge');n.textContent=t;n.className='nudge show'}

function renderCard(k){
  var h='<div class="qcard">'+resc(k.def)+'</div>'
       +'<div class="keybox">'+resc(k.key)+'</div>'
       +'<div class="wrongbox">'+resc(k.wrong)+'</div>';
  $('kpBox').innerHTML=h;ready();
}

function renderSeq(k){
  var steps=k.steps.map(function(s){return s});
  for(var i=steps.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=steps[i];steps[i]=steps[j];steps[j]=t}
  var doneN=0, h='<div class="qcard" style="font-size:13.5px">按正确的顺序依次点选——点错会晃一下，从已完成的位置继续。</div>';
  for(var s=0;s<steps.length;s++){h+='<div class="seqstep" data-s="'+s+'"><span class="n">'+(s+1)+'</span><span>'+resc(steps[s])+'</span></div>'}
  $('kpBox').innerHTML=h;
  var els=$('kpBox').querySelectorAll('.seqstep');
  for(var e=0;e<els.length;e++){(function(el){
    el.addEventListener('click',function(){
      if(el.className.indexOf('done')>=0)return;
      var idx=+el.getAttribute('data-s');
      if(steps[idx]===k.steps[doneN]){
        el.className='seqstep done';el.querySelector('.n').textContent=doneN+1;doneN++;
        if(doneN===k.steps.length){flash('✅ 顺序全部排对！');ready()}
      }else{el.className='seqstep bad';window.setTimeout(function(){el.className='seqstep'},380);
        nudge('顺序不对——第 '+(doneN+1)+' 步不是它，再想想。')}
    });
  })(els[e])}
}

function renderMatch(k){
  var L=k.pairs.map(function(p,i){return {t:p[0],oi:i}});
  for(var i=L.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=L[i];L[i]=L[j];L[j]=t}
  var R=k.pairs.map(function(p){return p[1]});
  for(var i2=R.length-1;i2>0;i2--){var j2=Math.floor(Math.random()*(i2+1));var t2=R[i2];R[i2]=R[j2];R[j2]=t2}
  var h='<div class="qcard" style="font-size:13.5px">左列选一个，右列选它的对应项。连对会锁定变绿，连错会晃一下。</div>';
  h+='<div class="mrow">';for(var a=0;a<L.length;a++){h+='<div class="mitem" data-li="'+a+'" data-oi="'+L[a].oi+'">'+resc(L[a].t)+'</div>'}
  h+='</div><div class="mrow">';for(var b=0;b<R.length;b++){h+='<div class="mitem" data-ri="'+b+'">'+resc(R[b])+'</div>'}
  h+='</div>';
  $('kpBox').innerHTML=h;
  var selL=-1, selOI=-1, matched=0;
  var items=$('kpBox').querySelectorAll('.mitem');
  for(var c=0;c<items.length;c++){(function(el){
    el.addEventListener('click',function(){
      if(el.className.indexOf('lock')>=0)return;
      if(el.hasAttribute('data-li')){
        var all=$('kpBox').querySelectorAll('.mitem[data-li]');
        for(var x=0;x<all.length;x++){if(all[x].className.indexOf('lock')<0)all[x].className='mitem'}
        el.className='mitem sel';selL=+el.getAttribute('data-li');selOI=+el.getAttribute('data-oi');
      }else{
        if(selL<0){nudge('先点左列的一个概念，再点右侧对应。');return}
        if(k.pairs[selOI][1]===el.textContent){
          var le=$('kpBox').querySelector('.mitem[data-li="'+selL+'"]');
          le.className='mitem lock';el.className='mitem lock';selL=-1;selOI=-1;matched++;
          if(matched===k.pairs.length){flash('✅ 全部连对！');ready()}
        }else{
          el.className='mitem bad';window.setTimeout(function(){el.className='mitem'},380);
          nudge('这对不搭——再想想它们的对应关系。')}
      }
    });
  })(items[c])}
}

function renderScenario(k){
  var h='<div class="qcard"><b>情境：</b>'+resc(k.scene)+'</div><div class="opts" id="scOpts"></div>';
  $('kpBox').innerHTML=h;
  var box=$('scOpts'), revealed=false;
  for(var i=0;i<k.opts.length;i++){(function(idx){
    var d=document.createElement('div');d.className='opt';
    d.innerHTML='<span>'+resc(k.opts[idx].t)+'</span>';
    d.addEventListener('click',function(){
      if(revealed)return;
      revealed=true;
      for(var x=0;x<k.opts.length;x++){
        var el=box.children[x];
        el.className='opt '+(x===k.best?'best':'conseq');
        el.innerHTML='<span class="ctag">'+(x===k.best?'✅ 推荐做法':'后果')+'</span>'+resc(k.opts[x].t)
          +'<div style="font-size:13px;color:#5b6a7d;margin-top:5px">'+resc(k.opts[x].c)+'</div>';
      }
      flash(idx===k.best?'✅ 选中了推荐做法！':'看清楚后果了——推荐做法在上面。');
      ready();
    });
    box.appendChild(d);
  })(i)}
}

function lightNow(){
  var k=CAMPS[nowMi].kp[nowKpi];
  P.lit[k.id]=1;jsave(P);
  drawTrail();drawTop();
  var campJustDone=campDone(nowMi);
  if(campJustDone&&nowMi<CAMPS.length-1){flash('🏕️ 营地 '+CAMPS[nowMi].id+' 全部点亮！下一营地已解锁')}
  else if(campJustDone){flash('🏔️ 最后一个营地也点亮了！')}
  else{flash('💡 这盏灯亮了！还差 '+(CAMPS[nowMi].kp.length-litN(CAMPS[nowMi]))+' 盏')}
  window.setTimeout(function(){
    if(allDone()){showSummit()}
    else{showCamp(nowMi)}
  },700);
}

/* ── 顶部进度 ── */
function drawTop(){
  var lit=0,tot=0,camps=0;
  for(var i=0;i<CAMPS.length;i++){lit+=litN(CAMPS[i]);tot+=CAMPS[i].kp.length;if(campDone(i))camps++}
  $('litN').textContent=lit;$('totN').textContent=tot;
  $('totLamps').textContent=tot;
  $('campN').textContent=camps;
  var pct=Math.round(100*lit/tot);$('pctN').textContent=pct+'%';
  $('pbarFill').style.width=pct+'%';
  var pos=CAMPS.length;for(var j=0;j<CAMPS.length;j++){if(!campDone(j)){pos=j;break}}
  $('posName').textContent=CAMPS[Math.min(pos,CAMPS.length-1)].id;
}

/* ── 登顶 ── */
function showSummit(){
  $('trail').className='panel';$('stCamp').className='panel';$('stKp').className='panel';
  $('stSummit').className='panel summit on';
  var cols=['#e8b84b','#3d8bd4','#2a9d5f','#d97f3f','#7c6bd6'];
  var h='';for(var i=0;i<40;i++){h+='<i style="left:'+(Math.random()*100)+'%;background:'+cols[i%cols.length]
    +';animation-delay:'+(Math.random()*1.2)+'s"></i>'}
  $('confetti').innerHTML=h;
  $('summitStats').textContent='14 个营地 · '+NKP_DATA+' 盏知识灯全部点亮——L1 指标语言、L2 四张操作表、L3 经营全局，都已走过一遍。';
  window.scrollTo({top:0,behavior:'smooth'});
}
var NKP_DATA='143';

function boot(){
  var st='';for(var i=0;i<26;i++){st+='<i style="position:absolute;left:'+(Math.random()*100)+'%;top:'+(Math.random()*60)+'%;width:2px;height:2px;border-radius:50%;background:#fff;opacity:'+(0.2+Math.random()*0.6)+'"></i>'}
  $('stars').innerHTML=st;
  drawTrail();drawTop();
  $('toTrail1').addEventListener('click',function(){$('stCamp').className='panel';$('trail').className='panel on'});
  $('btnReplay').addEventListener('click',function(){P={lit:{}};jsave(P);drawTrail();drawTop();$('stSummit').className='panel summit';$('trail').className='panel on';flash('进度已清空，重新出发！')});
  if(allDone()&&Object.keys(P.lit).length>0){/* 保留登顶状态，不自动跳，由用户点开 */}
}
boot();
window._t={showCamp:showCamp,showKp:showKp,P:function(){return P},lightNow:lightNow,unlocked:unlocked,campDone:campDone,allDone:allDone,C:CAMPS};
</script>
