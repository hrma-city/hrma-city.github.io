<style>
:root{--navy:#0f2a4a;--gold:#e8b84b;--gold2:#f5d78e;--ink:#1f2a37;--mut:#5b6a7d;
  --ok:#2a7d4f;--bad:#c94f43;--blue:#3d8bd4;--line:#e3e9f1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(180deg,#0f2a4a 0%,#1c4470 260px,#eaf1f8 260px);color:var(--ink);
  min-height:100vh;line-height:1.7}
.wrap{max-width:920px;margin:0 auto;padding:0 18px 80px}
a.back{color:#9fc3e4;font-size:13.5px;text-decoration:none;display:inline-block;margin-top:16px}
a.back:hover{color:#fff}
h1{color:#fff;font-size:25px;margin:6px 0 4px}
.sub{color:#b9d0e6;font-size:14px;max-width:660px}
/* 山径 */
.trail{background:linear-gradient(180deg,#123159,#1d4a78);border-radius:16px;padding:18px 16px 8px;
  margin-top:20px;box-shadow:0 10px 40px rgba(15,42,74,.2);overflow-x:auto}
.trail-in{display:flex;align-items:flex-end;gap:0;min-width:760px;padding-bottom:6px}
.camp{flex:1;text-align:center;cursor:pointer;position:relative;min-width:52px}
.camp .flag{font-size:20px;filter:grayscale(1);opacity:.45;transition:.2s;display:block}
.camp.done .flag{filter:none;opacity:1}
.camp.here .flag{filter:none;opacity:1}
.camp.locked{opacity:.55}
.camp .dot{width:15px;height:15px;border-radius:50%;background:#2a4d78;border:2px solid #4a6f9e;
  margin:6px auto;transition:.2s;position:relative;z-index:2}
.camp.done .dot{background:var(--gold);border-color:#f5d78e;box-shadow:0 0 8px rgba(232,184,75,.6)}
.camp.here .dot{background:#fff;border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,184,75,.3);transform:scale(1.25)}
.camp .nm{font-size:10.5px;color:#8fb2d4;white-space:nowrap}
.camp.here .nm{color:#f5d78e;font-weight:700}
.camp.done .nm{color:#d8e8f5}
.camp .cnt{font-size:10px;color:var(--gold2);font-weight:700}
.path{flex:0 0 26px;height:3px;background:#2a4d78;margin-bottom:9px;border-radius:2px}
.path.done{background:linear-gradient(90deg,var(--gold),#f5d78e)}
.lvflag{text-align:center;min-width:60px}
.lvflag .lvb{display:inline-block;background:linear-gradient(135deg,#d9a83c,#f0c060);color:#3a2c07;
  font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 8px;margin-bottom:5px}
.lvflag .peak{font-size:22px}
/* 统计条 */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#dbe9f5;
  border-radius:10px;padding:6px 14px;font-size:12.5px}
.stat b{color:var(--gold2);font-size:15px}
/* 阶段卡 */
.stage{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(15,42,74,.16);
  padding:22px;margin-top:18px;display:none}
.stage.on{display:block;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.crumbs{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.crumbs b{color:var(--navy)}
.crumbs a{color:var(--blue);text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border:none;
  border-radius:10px;padding:11px 26px;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(61,139,212,.3);transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:linear-gradient(135deg,#d9a83c,#e8b84b);color:#3a2c07;box-shadow:0 4px 14px rgba(232,184,75,.35)}
.btn.ghost{background:#eef2f7;color:#33465c;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.center{text-align:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.h2{color:var(--navy);font-size:19px;margin:2px 0 4px}
.mini{color:var(--mut);font-size:13px}
/* 营地知识灯网格 */
.camphead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.campbadge{background:linear-gradient(135deg,#d9a83c,#f0c060);color:#3a2c07;font-size:12px;font-weight:800;
  border-radius:8px;padding:3px 10px}
.lights{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.light{border:2px solid var(--line);border-radius:14px;padding:13px 15px;cursor:pointer;background:#fbfcfe;
  transition:.15s;position:relative}
.light:hover{border-color:#9dbdd8;transform:translateY(-2px)}
.light .lk{font-size:13px;font-weight:700;color:var(--navy)}
.light .lt{font-size:11px;color:var(--mut);margin-top:2px}
.light .badge{position:absolute;top:10px;right:12px;font-size:18px}
.light.lit{background:#f3fbf6;border-color:#bcdcc8}
.light.lit .lk{color:var(--ok)}
.light .tag{display:inline-block;font-size:10.5px;border-radius:999px;padding:1px 8px;margin-top:8px;
  background:#eef2f7;color:#4a5a6e}
.light.lit .tag{background:#e3f3ea;color:#1d5c39}
/* 知识灯交互 */
.kpbox{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fbfcfe;margin-top:6px}
.kpmeta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.kptag{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 9px;background:#eef2f7;color:#4a5a6e}
.kptag.card{background:#e3edf7;color:#1d6fb8}
.kptag.seq{background:#fdeede;color:#a9711a}
.kptag.match{background:#e8f1e3;color:#3a7a2c}
.kptag.scenario{background:#f3e6f3;color:#8a3a8a}
.kptitle{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:10px}
.def{background:linear-gradient(135deg,#fff8e8,#fdf3d7);border:1px solid #ecd9a8;border-radius:12px;
  padding:12px 16px;margin-bottom:12px;font-size:15px;color:#4a3c12}
.def .dt{font-size:11px;font-weight:800;color:#8a6d1f;letter-spacing:2px;display:block;margin-bottom:4px}
.keyline{border-left:4px solid var(--gold);padding:8px 14px;background:#fbf7ec;border-radius:0 10px 10px 0;margin-bottom:12px;font-size:14px}
.wrong{border-left:4px solid var(--bad);padding:8px 14px;background:#fdf0ef;border-radius:0 10px 10px 0;margin-bottom:12px;font-size:13.5px;color:#7a322a}
.wrong .wt{font-size:11px;font-weight:800;color:#a23b2f;letter-spacing:1px;display:block;margin-bottom:3px}
.nudge{color:#a9711a;font-size:13px;margin-top:8px;font-weight:600;display:none}
.nudge.on{display:block}
/* seq */
.seqitem{border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;
  font-size:14px;background:#fff;transition:.15s;display:flex;gap:10px;align-items:flex-start}
.seqitem:hover{border-color:#9dbdd8}
.seqitem .num{font-weight:800;color:#8394a8}
.seqitem.ok{border-color:var(--ok);background:#eef8f1;color:var(--ok)}
.seqitem.ok .num{color:var(--ok)}
.seqitem.fix{border-color:var(--bad);background:#fdefee}
.seqhint{font-size:12.5px;color:var(--mut);margin:6px 0}
/* match */
.matchwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4{font-size:12px;color:var(--mut);margin-bottom:8px;font-weight:700}
.mitem{border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;
  font-size:14px;background:#fff;transition:.15s;text-align:center}
.mitem:hover{border-color:#9dbdd8}
.mitem.sel{border-color:var(--blue);background:#f0f6fc}
.mitem.matched{border-color:var(--ok);background:#eef8f1;color:var(--ok);cursor:default}
.mitem.fix{border-color:var(--bad);background:#fdefee}
/* scenario */
.scene{background:#f3f1fb;border:1px solid #d9d2f0;border-radius:12px;padding:13px 16px;font-size:14.5px;
  color:#3a2c5a;margin-bottom:14px}
.sopt{border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;cursor:pointer;
  font-size:14.5px;background:#fff;transition:.15s}
.sopt:hover{border-color:#9dbdd8}
.sopt.chosen{border-color:var(--blue);background:#f0f6fc}
.sopt.best{border-color:var(--ok);background:#eef8f1}
.scon{border-radius:10px;padding:10px 14px;margin-top:8px;font-size:13.5px;display:none;line-height:1.8}
.scon.on{display:block;animation:pop .3s ease}
.scon.good{background:#eef8f1;border:1px solid #bcdcc8;color:#1d5c39}
.scon.bad{background:#fdefee;border:1px solid #eac5c0;color:#8e2b20}
.scon.neutral{background:#eef2f7;border:1px solid #c8d6e4;color:#33465c}
.scon .cl{font-weight:800}
/* 登顶 */
.summit{background:linear-gradient(135deg,#fff8e8,#fdf3d7);border:2px solid var(--gold);border-radius:16px;
  padding:22px;text-align:center;margin-top:18px;display:none}
.summit.on{display:block;animation:pop .3s ease}
.summit .big{font-size:40px}
.summit .st{font-size:18px;font-weight:800;color:#7a5a14;margin:6px 0}
</style>
</head>

  <h1>⛰️ 登顶之路 · 三级知识学习游戏</h1>
  <p class="sub">把三级课程的知识点化作一条登山路：一营地一模块，一盏灯一个知识点。先在这儿把知识一点点点亮，<b style="color:#f5d78e">学完再去做题</b>。</p>

  <div class="trail"><div class="trail-in" id="trail"></div></div>

  <div class="stage" id="stCamp">
    <div class="crumbs" id="campCrumb"></div>

      <span class="campbadge" id="campBadge">—</span>
      <div><div class="h2" id="campName">—</div><div class="mini" id="campSub">—</div></div>
    </div>
    <div class="mini" id="campHint">点亮下面每一盏知识灯（读一读、排一排、连一连、看一看），全部点亮营地就算通过，自动解锁下一营地。</div>

<script>
/* ── 数据 ── */
var CAMPS=[{"id":"M01","lv":"L1","name":"收益管理的语言：指标与计算","kp":[{"id":"M01-1","type":"card","title":"OCC 出租率","def":"已售房晚 ÷ 可售房晚 × 100%","key":"分母是「可售」不是「总」——有房在装修/OOO（维修停用），分母要先减掉。","wrong":"常把物理总房量当分母，装修房没扣，出租率虚高；或把已售房晚当分子之外的东西。"},{"id":"M01-2","type":"card","title":"ADR 平均房价","def":"客房收入 ÷ 已售房晚","key":"含服务费、不含增值税；免费房/自用房房晚照算（分母），但收入计 0。","wrong":"把免费房也算成收入，或忘记「房晚为 0 时 ADR 无定义」；与 OCC 分母（可售）搞混。"},{"id":"M01-3","type":"card","title":"RevPAR 每间可售房收入","def":"客房收入 ÷ 可售房晚 = OCC × ADR","key":"收益管理第一指标，衡量「全部房间的均价」而非「卖出房间的均价」。","wrong":"以为 RevPAR = ADR × OCC 永远成立——前提是 OCC 与 ADR 同口径（分母都是可售房晚）。"},{"id":"M01-4","type":"card","title":"TRevPAR 每间可售房总营收","def":"总营收 ÷ 可售房晚","key":"分子从客房收入扩展到全部营收；全服务酒店（餐饮/宴会多）必须和 RevPAR 一并看。","wrong":"和 RevPAR 混为一谈——RevPAR 只看客房，TRevPAR 看全部营收。"},{"id":"M01-5","type":"match","title":"指标 ↔ 公式","pairs":[["OCC","已售房晚 ÷ 可售房晚"],["ADR","客房收入 ÷ 已售房晚"],["RevPAR","客房收入 ÷ 可售房晚"],["TRevPAR","总营收 ÷ 可售房晚"]]}]},{"id":"M02","lv":"L1","name":"系统与数据导航","kp":[{"id":"M02-1","type":"card","title":"PMS 物业管理系统","def":"管房态、账单、在住客人的酒店核心系统","key":"一切经营数据的源头——房态准，后面才准。","wrong":"以为 RMS/渠道系统能替代 PMS；PMS 房态错，预测全错。"},{"id":"M02-2","type":"card","title":"RMS 收益管理系统","def":"做需求预测与价格/库存优化、给建议价的系统","key":"它给「建议」，最终由收益经理拍板发布——系统不替你担责。","wrong":"把 RMS 建议价直接当最终价自动发布，跳过人审。"},{"id":"M02-3","type":"match","title":"系统 ↔ 职责","pairs":[["PMS","房态与账单"],["渠道管理","预订与库存"],["RMS","预测与优化"],["报表中心","汇总呈现"]]}]},{"id":"M03","lv":"L1","name":"每日操作流水线","kp":[{"id":"M03-1","type":"seq","title":"每日操作顺序","steps":["晨会看昨夜成绩（OCC/ADR/RevPAR）","拉取当前预订与 Pickup","做当日/近期需求预测","设定限制条件（MinLOS/关房）","调整各渠道价格","发布价格到各渠道","夜间审核对账"]},{"id":"M03-2","type":"card","title":"Pickup 预订增量","def":"某时段新进预订量 = 期末在订 − 期初在订","key":"预测更新的核心信号——看最近几天 Pickup 速度比看静态更准。","wrong":"把「在订总量」当成「新增」，忽略取消与退订抵消。"},{"id":"M03-3","type":"card","title":"在住 vs 预订","def":"在住=已入住客人；预订=未来到店的承诺","key":"夜审后日期切换，昨天的「预订」变成今天的「在住」。","wrong":"白天拿「在住」当「可售余量」算价，漏掉已订未到。"}]},{"id":"M04","lv":"L1","name":"报表与台账","kp":[{"id":"M04-1","type":"card","title":"日报表四件套","def":"OCC、ADR、RevPAR、当日收入","key":"每天必看这四样，才能发现问题——只看收入会掩盖量价失衡。","wrong":"只盯收入高低，不拆 OCC 与 ADR，量价此消彼长看不出来。"},{"id":"M04-2","type":"card","title":"台账 vs 报表","def":"台账=原始流水（每笔交易）；报表=汇总加工","key":"报表对不上，先回台账查源头，别在报表上拍脑袋改。","wrong":"报表异常直接改报表数字，不回溯台账。"},{"id":"M04-3","type":"match","title":"报表 ↔ 看什么","pairs":[["渠道报表","各渠道产量与成本"],["客源报表","细分客群表现"],["价格报表","各价位销量"],["竞争报表","竞对价位与份额"]]}]},{"id":"M05","lv":"L2","name":"需求预测：Pickup 与预订曲线","kp":[{"id":"M05-1","type":"card","title":"预订曲线","def":"随抵达日临近，在订量逐日累积上升的曲线","key":"越靠近抵达日越准；远期的曲线是用来「看趋势」不是「定死」。","wrong":"把 60 天前的在订量当成最终需求，过早锁死价格。"},{"id":"M05-2","type":"card","title":"Pickup 外推法","def":"用近期 Pickup 速度 + 同期比，外推抵达日总需求","key":"结合「去年同日进度」校正，单看今年速度会偏。","wrong":"只看今年 Pickup 速度，忽略市场比去年热/冷。"},{"id":"M05-3","type":"scenario","title":"进度领先怎么判","scene":"距抵达日还有 14 天，本店已订 60%；去年同期此时 55%、最终 78%。怎么判断？","opts":[{"t":"按去年最终 78% 保守准备","c":"偏保守——今年进度已领先 5 个点，等到 78% 可能卖亏，散客高价房早被锁死。"},{"t":"进度领先，上调预期并收紧低价","c":"较稳——进度领先说明需求更强，应上调预期、收紧低价渠道留房给高价散客（这正是收益管理的抓手）。"},{"t":"完全不动，等临近再说","c":"会错过最佳调价窗口——临近才动，高价客早已在他店下单。"}],"best":1},{"id":"M05-4","type":"card","title":"预测给区间不给单点","def":"预测写成「基准 ± 区间」，不是一个数","key":"需求有波动，区间帮你看风险与机会，单点容易误判。","wrong":"只报一个预测数，到了发现差 10% 就慌。"}]},{"id":"M06","lv":"L2","name":"价格体系设计","kp":[{"id":"M06-1","type":"card","title":"价格层级","def":"BAR（公开最优价）→ 会员价 → 协议价 → OTA → 团队价","key":"层级由「限制条件」决定价值：免费退、可改期=更值钱。","wrong":"把团队价设得比 OTA 公开价还高，团队根本不来。"},{"id":"M06-2","type":"card","title":"价格一致性","def":"同一房型各渠道展示价保持一致","key":"防窜货、防客诉；差异只体现在「限制条件/权益」而非裸价。","wrong":"官网比 OTA 贵，客人去 OTA 下单还投诉你双标。"},{"id":"M06-3","type":"seq","title":"建价格体系步骤","steps":["定 BAR 基准价（对标竞对与价值）","设会员/协议折扣与权益","配 OTA 价与不可改/不可退限制","定团队价与最低量","审各渠道价格一致性"]}]},{"id":"M07","lv":"L2","name":"库存与限制条件战术","kp":[{"id":"M07-1","type":"card","title":"限制条件家族","def":"MinLOS（最短住）、CTA（到点前不可订）、Closing（关房）、超售","key":"高需求日收紧、低需求日放松——它们是「调节库存」的旋钮。","wrong":"低需求日也设 MinLOS=3，把刚需短住客全推给竞对。"},{"id":"M07-2","type":"card","title":"超售不是多卖房","def":"按 No-show 概率与 walk（拒住）成本，算「期望损失最小」的超售数","key":"超售是为了补 No-show 的空房，不是为卖更多——超太多 walk 客成本飙升。","wrong":"拍脑袋超售 5 间，不算 No-show 率与 walk 赔偿，旺季被拒住客投诉爆仓。"},{"id":"M07-3","type":"scenario","title":"高需求日留房","scene":"旺季周六仅剩 20 间可售，低价团队要包 30 间过夜。怎么处理？","opts":[{"t":"全接团队，锁死 30 间","c":"亏——剩 20 间不够，还要把已订散客踢掉，walk 成本+口碑损失远大于团队薄利。"},{"t":"关低价渠道、留房给高价散客","c":"较稳——高需求日散客愿出高价，关掉低价渠道把房留给高价客，RevPAR 最高。"},{"t":"超售 10 间接团队","c":"赌太大——超售要算 No-show，盲目超 10 间 walk 风险失控。"}],"best":1}]},{"id":"M08","lv":"L2","name":"渠道与分销管理","kp":[{"id":"M08-1","type":"card","title":"渠道结构","def":"直销（官网/会员）｜ OTA ｜ 协议/团队","key":"直销佣金最低、客人黏性最强，应优先把流量引回直销。","wrong":"all-in OTA，佣金 15–20% 吃掉利润还丢失客史。"},{"id":"M08-2","type":"card","title":"算净价不算牌价","def":"渠道净收入 = 牌价 − 佣金 − 其他成本","key":"比渠道不能只看产量，要看「净贡献」——OTA 量大但净价可能最低。","wrong":"只比各渠道产量，忽略 OTA 佣金，误以为 OTA 最赚钱。"},{"id":"M08-3","type":"match","title":"渠道 ↔ 特点","pairs":[["官网/会员","佣金低黏性强"],["OTA","量大但佣金高"],["协议客","稳定低频"],["团队","低价量大"]]}]},{"id":"M09","lv":"L2","name":"竞争监测与市场定位","kp":[{"id":"M09-1","type":"card","title":"竞争组合","def":"选 3–5 家规模、位置、客群相近的酒店做对标","key":"组合要「可比」——拿奢华酒店比经济型没意义。","wrong":"把全城所有酒店都塞进组合，均值被拉歪。"},{"id":"M09-2","type":"card","title":"MPI / ARI / RGI","def":"MPI=本店OCC÷组合OCC；ARI=本店ADR÷组合ADR；RGI=MPI×ARI÷100","key":"RGI>100 表示综合收益领先市场；三个指数知道两个就能推第三个。","wrong":"只看 ADR 高低判断胜负——卖得贵但份额掉，RGI 可能<100。"},{"id":"M09-3","type":"scenario","title":"算 RGI 定地位","scene":"本店 MPI=105，ARI=98。你的市场地位如何？","opts":[{"t":"RGI=102.9，略领先市场","c":"对——MPI×ARI÷100 = 105×98÷100 ≈ 102.9，份额与价格一升一降，综合微领先。"},{"t":"ARI<100 所以落后","c":"错——单看 ARI 会误判；RGI 才看综合，102.9 是领先的。"},{"t":"MPI>100 所以大幅领先","c":"夸大——份额领先被价格略低抵消，综合只是微领先。"}],"best":0}]},{"id":"M10","lv":"L3","name":"客源细分战略","kp":[{"id":"M10-1","type":"card","title":"细分为了差异化定价","def":"把客群拆开，找出对价格不敏感的群体卖高价","key":"细分不是为了好看，是为了「不同的人不同价」提升整体收益。","wrong":"细分完只做一张饼图，没落到定价动作。"},{"id":"M10-2","type":"card","title":"行为比人口准","def":"按预订行为/价格敏感度/目的细分，比按年龄性别准","key":"「提前 21 天订、不可退」的客，价格敏感度通常低。","wrong":"按人口统计（年龄/性别）分，和真实价格敏感度对不上。"},{"id":"M10-3","type":"match","title":"客群 ↔ 策略","pairs":[["商务散客","卖高价、少限制"],["价格敏感 leisure","早鸟/连住优惠"],["团队","量与低价"],["会员","权益锁客、引回直销"]]}]},{"id":"M11","lv":"L3","name":"年度预算与滚动预测","kp":[{"id":"M11-1","type":"card","title":"预算自上而下+自下而上","def":"年目标（OCC/ADR）→ 拆到月 → 拆到日/渠道，再自下而上校验","key":"只压指标不校验可行性，年底必翻车。","wrong":"老板拍个 RevPAR 数直接下分，不问市场能不能撑。"},{"id":"M11-2","type":"seq","title":"预算步骤","steps":["看历史业绩与差距","分析市场增量与竞对","定年度 OCC/ADR 目标","拆到各月","拆到日与渠道","按月滚动复盘修正"]},{"id":"M11-3","type":"card","title":"滚动预测比年度预算活","def":"每月更新未来 12 个月预期","key":"年度预算是「计划」，滚动预测是「实时纠偏」——两者都要。","wrong":"做完年度预算一年不动，市场变了还在盯旧数。"}]},{"id":"M12","lv":"L3","name":"会议与汇报","kp":[{"id":"M12-1","type":"card","title":"对谁汇报用谁的语言","def":"总经理看 OCC/ADR 执行；业主/投资人看 RGI、NOI、回报","key":"业主关心「比市场多赚多少」，别用一堆操作细节填满幻灯片。","wrong":"给业主讲 MinLOS 怎么设，他不关心，要的是收益与回报。"},{"id":"M12-2","type":"card","title":"用指标讲故事","def":"用 RevPAR/RGI 讲业绩，用趋势讲机会","key":"对比市场才有说服力——「我涨了」不如「我比市场多涨 3 点」。","wrong":"堆 20 张图表不讲结论，听众抓不住重点。"},{"id":"M12-3","type":"scenario","title":"给业主汇报重点","scene":"本月收入涨了 4%，但 RGI 从 108 掉到 103。汇报重点放哪？","opts":[{"t":"只报收入涨 4%","c":"危险——收入涨可能是量价失衡或份额掉了，RGI 下滑在报警。"},{"t":"报 RGI 仍领先(103)但指出下滑与机会","c":"稳——诚实讲「还领先市场，但份额/价格松动，下月抓手是…」，业主要的是这个。"},{"t":"堆所有报表图","c":"听众睡着了——没结论的图表等于没汇报。"}],"best":1}]},{"id":"M13","lv":"L3","name":"跨部门协同与变革推动","kp":[{"id":"M13-1","type":"card","title":"收益要借各部门数据","def":"前台（房态/No-show）、销售（团队）、财务（成本）、IT（系统）","key":"收益不是孤岛——超售算 No-show 率得靠前台历史。","wrong":"关起门算价格，不跟前台/销售对齐，落地必撞车。"},{"id":"M13-2","type":"card","title":"小胜立信推变革","def":"用数据先打几个小胜仗，再推大动作","key":"变革靠信任——一次推太大，各部门集体抵触。","wrong":"一上来就改全员考核+全渠道规则，被当成夺权。"},{"id":"M13-3","type":"scenario","title":"推超售被前台抵触","scene":"前台怕超售导致 walk 客投诉，抵制你设超售。怎么推？","opts":[{"t":"强制下发执行","c":"反效果——前台消极配合，No-show 数据更不准，超售算歪。"},{"t":"用数据讲 walk 概率低+收益高，先小范围试点","c":"稳——先证明超售让空房少了、总收益高了，再扩，前台自然接受。"},{"t":"算了不超售","c":"放弃收益——No-show 空房白白流失，每年都是钱。"}],"best":1}]},{"id":"M14","lv":"L3","name":"收益管理系统与自动化","kp":[{"id":"M14-1","type":"card","title":"RMS 自动三步走","def":"预测 → 优化 → 给建议价","key":"自动化解决「算得过来」，不解决「决策对不对」。","wrong":"以为上了 RMS 就不用人，收益经理变摆设。"},{"id":"M14-2","type":"card","title":"人机组装","def":"系统给建议，收益经理结合实时上下文拍板发布","key":"系统看不到当天展会/竞对突发，经理的补丁在最值钱。","wrong":"系统建议价直接自动发布，突发情况没人兜。"},{"id":"M14-3","type":"scenario","title":"系统价 vs 经验价","scene":"系统建议价 ¥720，你凭经验觉得 ¥680 更稳（当天有竞对促销）。听谁的？","opts":[{"t":"直接听系统 ¥720","c":"可能错过——系统没纳入当天竞对突发促销，高价可能卖不动。"},{"t":"看实时竞对再定，取折中","c":"稳——系统数据 + 你的实时上下文，折中更抗风险，这正是人机组装的意义。"},{"t":"直接听经验 ¥680","c":"也可能偏——经验要好，但也要用系统数据校验，别完全凭感觉。"}],"best":1}]}];
var LV_NAME={"L1":"L1 山脚 · 执行专员","L2":"L2 山腰 · 收益主管","L3":"L3 山顶 · 收益经理"};
var KEY='hrma_quest_v2';
function jload(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ return {}; } }
function jsave(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} }
var P=jload(); if(!P.lit) P.lit={};
function $(id){return document.getElementById(id)}
function resc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function fmt(n){return n.toLocaleString('en-US')}
function kpId(mi,kpi){ return CAMPS[mi].kp[kpi].id; }
function isLit(mi,kpi){ return !!P.lit[kpId(mi,kpi)]; }
function litCount(mi){ var c=0; CAMPS[mi].kp.forEach(function(k,i){ if(isLit(mi,i))c++; }); return c; }
function campDone(mi){ return litCount(mi)===CAMPS[mi].kp.length; }
function campUnlocked(mi){ return mi===0 || campDone(mi-1); }
function allDone(){ for(var i=0;i<CAMPS.length;i++){ if(!campDone(i))return false; } return true; }

/* ── 山径 ── */
function drawTrail(){
  var h='';
  CAMPS.forEach(function(m,mi){
    var done=campDone(mi), unl=campUnlocked(mi);
    var st = done?'done':(unl?'here':'');
    if(mi>0){ h+='<div class="path'+(campDone(mi-1)?' done':'')+'"></div>'; }
    h+='<div class="camp '+st+(unl?'':' locked')+'" data-mi="'+mi+'">'
      +'<span class="flag">'+(done?'🚩':(unl?'📍':'⛺'))+'</span>'
      +'<div class="dot"></div>'
      +'<div class="nm">'+m.id+'</div>'
      +'<div class="cnt">'+litCount(mi)+'/'+m.kp.length+'</div></div>';
    var nxt=CAMPS[mi+1];
    if(nxt && LV_NAME[m.lv]!==LV_NAME[nxt.lv]){
      h+='<div class="path"></div><div class="lvflag"><span class="lvb">'+LV_NAME[m.lv].split(' · ')[0]+'</span><div class="peak">🏔️</div></div>';
    }
  });
  h+='<div class="path"></div><div class="lvflag"><span class="lvb">山顶</span><div class="peak">🏆</div></div>';
  $('trail').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.camp'),function(c){
    c.addEventListener('click',function(){
      var mi=+c.getAttribute('data-mi');
      if(campUnlocked(mi)) showCamp(mi);
      else { flash('先点亮上一营地的所有知识灯，这营地才解锁～'); }
    });
  });
}
function drawStats(){
  var lit=0,total=0; CAMPS.forEach(function(m,mi){ m.kp.forEach(function(k,i){total++; if(isLit(mi,i))lit++;}); });
  var doneCamps=0; for(var i=0;i<CAMPS.length;i++) if(campDone(i))doneCamps++;
  $('stats').innerHTML=
    '<span class="stat">💡 点亮 <b>'+lit+'</b> / '+total+' 盏灯</span>'+
    '<span class="stat">🏕️ 通过营地 <b>'+doneCamps+'</b> / '+CAMPS.length+'</span>'+
    '<span class="stat">📍 当前 <b>'+(allDone()?'已登顶':(curCampName()))+'</b></span>';
}
function curCampName(){ for(var i=0;i<CAMPS.length;i++){ if(!campDone(i)) return CAMPS[i].id+' '+CAMPS[i].name; } return '全部完成'; }
function flash(msg){ var n=$('nudge'); n.textContent=msg; n.className='nudge on'; window.setTimeout(function(){n.className='nudge';},2600); }

/* ── 营地视图 ── */
function showCamp(mi){
  if(!campUnlocked(mi)){ flash('这一营地还没解锁哦'); return; }
  var m=CAMPS[mi];
  $('campCrumb').innerHTML='<a href="#" id="toTrail">⛰️ 山径</a> ｜ <b>'+LV_NAME[m.lv]+'</b> ｜ 营地 '+m.id;
  $('campBadge').textContent=m.id;
  $('campName').textContent=m.name;
  $('campSub').textContent=LV_NAME[m.lv]+' ｜ '+m.kp.length+' 盏知识灯';
  $('toTrail')&&$('toTrail').addEventListener('click',function(e){e.preventDefault();showTrail();});
  var grid=$('lights'); grid.innerHTML='';
  var typeName={'card':'卡片·读','seq':'排序·练','match':'连线·练','scenario':'情境·看'};
  m.kp.forEach(function(k,i){
    var lit=isLit(mi,i);
    var el=document.createElement('div');
    el.className='light'+(lit?' lit':'');
    el.innerHTML='<div class="lk">'+resc(k.title)+'</div>'
      +'<div class="lt">'+(k.def?k.def.slice(0,30)+(k.def.length>30?'…':''):(k.scene?k.scene.slice(0,30)+'…':''))+'</div>'
      +'<span class="badge">'+(lit?'✅':'💡')+'</span>'
      +'<span class="tag">'+typeName[k.type]+'</span>';
    el.addEventListener('click',function(){ showKp(mi,i); });
    grid.appendChild(el);
  });
  var row=$('campRow'); row.innerHTML='';
  var b1=document.createElement('button'); b1.className='btn ghost'; b1.textContent='← 回山径'; b1.onclick=showTrail; row.appendChild(b1);
  if(campDone(mi)){
    if(mi<CAMPS.length-1){ var b2=document.createElement('button'); b2.className='btn gold'; b2.textContent='营地通过！去下一营地 →';
      b2.onclick=function(){ showCamp(mi+1); }; row.appendChild(b2); }
    else { var b3=document.createElement('button'); b3.className='btn gold'; b3.textContent='全部点亮 · 去登顶 →';
      b3.onclick=showSummit; row.appendChild(b3); }
  } else {
    var nb=document.createElement('button'); nb.className='btn'; nb.textContent='点亮下一盏未亮的灯 →';
    nb.onclick=function(){ for(var i=0;i<m.kp.length;i++){ if(!isLit(mi,i)){ showKp(mi,i); return; } } };
    row.appendChild(nb);
  }
  $('stKp').classList.remove('on'); $('summit').classList.remove('on'); $('stCamp').classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── 知识灯交互 ── */
var nowMi=-1, nowKpi=-1;
function showKp(mi,kpi){
  if(!campUnlocked(mi)){ flash('这一营地还没解锁哦'); return; }
  nowMi=mi; nowKpi=kpi;
  var m=CAMPS[mi], k=m.kp[kpi];
  $('kpCrumb').innerHTML='<a href="#" id="toCamp">🏕️ '+m.id+'</a> ｜ '+LV_NAME[m.lv]+' ｜ <b>'+resc(k.title)+'</b>';
  var typeName={'card':'卡片·读口诀','seq':'排序·理清顺序','match':'连线·对应概念','scenario':'情境·看后果'};
  $('kpMeta').innerHTML='<span class="kptag '+k.type+'">'+typeName[k.type]+'</span>'
    +'<span class="kptag">'+m.id+'</span><span class="kptag">'+LV_NAME[m.lv].split(' · ')[0]+'</span>';
  $('nudge').className='nudge';
  var box=$('kpBox'); box.innerHTML='';
  var row=$('kpRow'); row.innerHTML='';
  var bb=document.createElement('button'); bb.className='btn ghost'; bb.textContent='← 回营地'; bb.onclick=function(){showCamp(mi);}; row.appendChild(bb);
  if(k.type==='card') renderCard(k);
  else if(k.type==='seq') renderSeq(k);
  else if(k.type==='match') renderMatch(k);
  else if(k.type==='scenario') renderScenario(k);
  $('toCamp')&&$('toCamp').addEventListener('click',function(e){e.preventDefault();showCamp(mi);});
  $('stCamp').classList.remove('on'); $('summit').classList.remove('on'); $('stKp').classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
}
function lightNow(){
  var k=CAMPS[nowMi].kp[nowKpi];
  P.lit[k.id]=1; jsave(P);
  drawTrail(); drawStats();
  if(nowMi===CAMPS.length-1 && campDone(nowMi)){
    showSummit();
  } else if(campDone(nowMi)){
    flash('🏕️ 营地 '+CAMPS[nowMi].id+' 全部点亮，已解锁下一营地！');
    window.setTimeout(function(){ showCamp(nowMi); }, 700);
  } else {
    flash('💡 这盏灯亮了！');
    window.setTimeout(function(){ showCamp(nowMi); }, 700);
  }
}
/* card */
function renderCard(k){
  var h='<div class="kptitle">'+resc(k.title)+'</div>';
  if(k.def) h+='<div class="def"><span class="dt">定义 / 算法</span>'+resc(k.def)+'</div>';
  if(k.key) h+='<div class="keyline"><b>记忆要点：</b>'+resc(k.key)+'</div>';
  if(k.wrong) h+='<div class="wrong"><span class="wt">易错点</span>'+resc(k.wrong)+'</div>';
  h+='<div class="seqhint">读完了点下面按钮，点亮这盏灯。</div>';
  $('kpBox').innerHTML=h;
  var b=document.createElement('button'); b.className='btn gold'; b.textContent='💡 点亮这盏灯';
  b.onclick=lightNow; $('kpRow').appendChild(b);
}
/* seq */
function renderSeq(k){
  $('kpBox').innerHTML='<div class="kptitle">'+resc(k.title)+'</div>'
    +'<div class="seqhint">按正确顺序点击下面几步（先发生的点前面）。点错会提示，从头再来。</div>';
  var wrap=document.createElement('div'); wrap.id='seqWrap'; $('kpBox').appendChild(wrap);
  var order=shuffle(k.steps.map(function(s,i){return i;}));
  var done=[]; /* 已点且正确的原始下标 */
  function paint(){
    wrap.innerHTML='';
    order.forEach(function(oi){
      var el=document.createElement('div'); el.className='seqitem'; el.setAttribute('data-oi',oi);
      if(done.indexOf(oi)>=0){ el.className+=' ok'; el.innerHTML='<span class="num">✓</span><span>'+resc(k.steps[oi])+'</span>'; }
      else { el.innerHTML='<span class="num">'+(k.steps.length>9?'•':'•')+'</span><span>'+resc(k.steps[oi])+'</span>'; }
      el.addEventListener('click',function(){ onPick(oi); });
      wrap.appendChild(el);
    });
  }
  function onPick(oi){
    if(done.indexOf(oi)>=0) return;
    if(oi===done.length){ done.push(oi); paint();
      if(done.length===k.steps.length){
        var b=document.createElement('button'); b.className='btn gold'; b.textContent='✅ 顺序对了，点亮这盏灯';
        b.onclick=lightNow; $('kpRow').appendChild(b);
      }
    } else { flash('顺序不对～再想想哪步在前，从头点。'); done=[]; paint(); }
  }
  paint();
}
/* match */
function renderMatch(k){
  var lefts=k.pairs.map(function(p,i){return {t:p[0],i:i};});
  var rights=k.pairs.map(function(p,i){return {t:p[1],i:i};});
  var rOrder=shuffle(rights);
  var sel=-1; /* 已选左项原始下标 */
  var matched={}; /* 原始下标 -> true */
  $('kpBox').innerHTML='<div class="kptitle">'+resc(k.title)+'</div>'
    +'<div class="seqhint">点一个左边，再点它对应的右边连起来；连错会提示，重选即可。</div>';
  var wrap=document.createElement('div'); wrap.className='matchwrap'; $('kpBox').appendChild(wrap);
  var lc=document.createElement('div'); lc.className='mcol'; lc.innerHTML='<h4>概念</h4>'; wrap.appendChild(lc);
  var rc=document.createElement('div'); rc.className='mcol'; rc.innerHTML='<h4>对应</h4>'; wrap.appendChild(rc);
  function paint(){
    lc.querySelectorAll('.mitem').forEach(function(n){n.remove();});
    rc.querySelectorAll('.mitem').forEach(function(n){n.remove();});
    lefts.forEach(function(L){
      var el=document.createElement('div'); el.className='mitem'+(matched[L.i]?' matched':'')+(sel===L.i?' sel':'');
      el.textContent=resc(L.t); el.setAttribute('data-li',L.i);
      if(!matched[L.i]) el.addEventListener('click',function(){ onLeft(L.i); });
      lc.appendChild(el);
    });
    rOrder.forEach(function(R){
      var el=document.createElement('div'); el.className='mitem'+(matched[R.i]?' matched':'')+(sel>=0&&matched[sel]?'':'');
      el.textContent=resc(R.t); el.setAttribute('data-ri',R.i);
      if(!matched[R.i]) el.addEventListener('click',function(){ onRight(R.i); });
      rc.appendChild(el);
    });
  }
  function onLeft(i){ sel=i; paint(); }
  function onRight(i){
    if(sel<0) return;
    if(matched[i] || matched[sel]){ return; }
    if(k.pairs[sel][1]===k.pairs[i][1]){ matched[sel]=true; matched[i]=true; sel=-1; paint();
      if(Object.keys(matched).length===k.pairs.length){
        var b=document.createElement('button'); b.className='btn gold'; b.textContent='✅ 全部连对，点亮这盏灯';
        b.onclick=lightNow; $('kpRow').appendChild(b);
      }
    } else { flash('这对不上～换一个试试。'); sel=-1; paint(); }
  }
  paint();
}
/* scenario */
function renderScenario(k){
  $('kpBox').innerHTML='<div class="kptitle">'+resc(k.title)+'</div>'
    +'<div class="scene">'+resc(k.scene)+'</div>';
  var optsBox=document.createElement('div'); optsBox.id='scBox'; $('kpBox').appendChild(optsBox);
  var picked={}; /* 选项下标 -> true（已看后果） */
  function paint(){
    optsBox.innerHTML='';
    k.opts.forEach(function(o,oi){
      var el=document.createElement('div'); el.className='sopt'+(picked[oi]?' chosen':'')+((picked[oi]&&k.best===oi)?' best':'');
      el.innerHTML='<div>'+resc(o.t)+'</div>';
      if(picked[oi]){
        var tone=o.tone||(oi===k.best?'good':'neutral');
        var c=document.createElement('div'); c.className='scon on '+tone;
        c.innerHTML='<span class="cl">'+(oi===k.best?'✅ 推荐做法':'看后果')+':</span> '+resc(o.c);
        el.appendChild(c);
      }
      if(!picked[oi]) el.addEventListener('click',function(){ picked[oi]=true; paintAfter(); });
      optsBox.appendChild(el);
    });
    if(Object.keys(picked).length>0 && !$('kpRow').querySelector('.btn.gold')){
      var b=document.createElement('button'); b.className='btn gold'; b.textContent='💡 我看明白了，点亮这盏灯';
      b.onclick=lightNow; $('kpRow').appendChild(b);
    }
  }
  function paintAfter(){ paint(); }
  paint();
}

/* ── 山径 / 登顶 ── */
function showTrail(){
  drawTrail(); drawStats();
  $('stCamp').classList.remove('on'); $('stKp').classList.remove('on');
  if(allDone()){ showSummit(); return; }
  $('summit').classList.remove('on');
  // 给个「继续/开始」提示：找到第一个未完成营地
  for(var i=0;i<CAMPS.length;i++){ if(!campDone(i) && campUnlocked(i)){ flash('继续登山：下一站是 '+CAMPS[i].id+' '+CAMPS[i].name); break; } }
  window.scrollTo({top:0,behavior:'smooth'});
}
function showSummit(){
  drawTrail(); drawStats();
  $('stCamp').classList.remove('on'); $('stKp').classList.remove('on');
  $('summit').classList.add('on');
  $('btnReplay').onclick=function(){ P.lit={}; jsave(P); drawTrail(); drawStats(); showTrail(); };
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── 启动 ── */
drawTrail(); drawStats();
if(allDone()) showSummit();
else {
  // 进入第一个未完成且已解锁的营地
  var start=0; for(var i=0;i<CAMPS.length;i++){ if(!campDone(i)){ start=i; break; } }
  showCamp(start);
}
</script>
