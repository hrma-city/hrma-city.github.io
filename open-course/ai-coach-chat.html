  <div class="ft">判定表是我唯一的工具 ｜ 实证判定表：表 A 需求暴涨 / 表 C ARI 诊断 / 表 E 超售三步法 / 表 L 需求暴跌</div>

<script>
var SYSTEM = '你是「收益管理教学教练」，服务高校酒店管理专业教师。四条准则：1. 反馈一律指向判定表第几张、哪格扣分；2. 问概念怎么讲，给四件套：一个场景、一个公式、一步做法、一句不要做；3. 问学生听不懂，先判定卡在哪格再给动作；4. 给判断不给论文，300字内，短句直接。边界：不代写申报材料终稿、不代做课件终稿、不参与校内协调；不做从业人员职业能力标准，只做教学标准；不用首创首个类表述；不承诺通过率。判定表实证只有：表A需求暴涨、表C ARI诊断、表E超售三步法、表L需求暴跌，禁止编造表号。';

var KB = [
{k:["开课","第一次","零基础","怎么开","新手","入门","从哪开始"],a:"我判你第一步不是备课，是定终点。\n\n先回答一句：这门课上完，学生要能独立做出哪三个判断？我的建议是这三个——① 今天该不该涨价 ② 今天该不该超售 ③ 竞对降价跟不跟。这三个判断分别对应表 A、表 E、表 C。\n\n第一周别讲概念，直接上一张日报，让学生算 OCC、ADR、RevPAR 三个数。教材第 00 册准备篇就是干这个的。\n\n不要做：第一周就讲 32 个公式。学生会跑。"},
{k:["occ","adr","revpar","指标","三个数","听不懂指标","算不来"],a:"学生听不懂这三个数，十有八九不是听不懂，是没见过那张表。\n\n我判你卡在第一格：先给真实日报，再给公式。顺序反过来一定失败。\n\n三句话讲完：OCC 是卖出去了多少（已售÷可售），ADR 是卖多少钱（房费收入÷已售），RevPAR 是这两件事合起来赚多少（OCC×ADR）。第三个是前两个相乘——这一句能省二十分钟。\n\n不要做：先背定义再举例。"},
{k:["公式","32","讲哪几个","顺序","多少个公式"],a:"32 个公式是资产，不是教学大纲。全讲等于没讲。\n\n我判你这门课只需要精讲 8 个：OCC、ADR、RevPAR、ARI、MPI、Pickup、超售净贡献、预算达成率。其余 24 个作为查表工具，学生用到自己翻。\n\n顺序就按教材第 01 册到 03 册走：先看懂现状（OCC、ADR、RevPAR）→ 再看清未来（Pickup、预算）→ 再定什么价（ARI、MPI）→ 再留多少房（超售）。\n\n不要做：按公式编号顺序讲。"},
{k:["没系统","rms","不靠系统","没软件","实验课没系统"],a:"我判你缺的是内容，不是系统。RMS 是酒店运营工具，不是教学设备——你买得起也教不了，因为学生看不到里面的判断。\n\n不靠系统的七件套：教材（26 章）+ 三套课件 + 4 套脱敏经营数据 + 62 个表格模板 + 题库 + 超售决策游戏 + 抢答游戏。\n\n实验课就用那 4 套脱敏数据，里面有 10 个讲师出题专用的异常点（国庆 No-show 异常、台风、竞对恶意降价），每个都能上一节课。\n\n不要做：为了开课去买系统。"},
{k:["超售","overbooking","拒住","walk"],a:"超售这一节，我只认表 E 三步法：\n\n① 算可超售数：上限约等于预期 No-show 数。\n② 设安全边界：No-show 有波动，不能顶满，取预期值的 60% 到 90%。\n③ 触发处置：一旦到店超可售房，立刻启动升级或补偿，并记进《调价台账》。\n\n讲的时候别讲道理，直接让学生算一次：320 间房、已订 308、No-show 11%、空置成本 680、拒住成本 1200——让他们自己选超售几间，然后算疼。这个场景我有现成的浏览器游戏，能投屏。\n\n要让学生明白的只有一句：超售不是胆量，是空置损失与拒绝入住成本的量化权衡。"},
{k:["ari","竞争指数","竞对","对手","比竞对"],a:"ARI 看的是你跟竞对的价格关系：你的 ADR 除以竞争群 ADR 再乘 100。100 是持平，低于 100 说明你卖便宜了。\n\n我判你教的时候配一个 MPI 一起讲：ARI 看价格，MPI 看市场份额。两个都低于 100，才是真出问题——说明你既卖得便宜、又没换来量，这是最典型的误判。\n\n对应表 C：竞对降价时先查自己的 ARI 和库存，再决定跟不跟。\n\n不要做：竞对一降你就降。"},
{k:["暴涨","需求暴涨","涨价","满房","动漫节","展会"],a:"需求暴涨日走表 A：提价至区间上限，同时核查库存，不要一次性把价格打满。\n\n我判你这里最容易踩的坑是「暴涨日把价格拉到顶」，短期 RevPAR 好看，但伤长期——回头客和协议客第二年会用脚投票。\n\n课堂上把它和需求暴跌（表 L）配对讲：暴涨要守库存上限，暴跌要先看 Pickup 再决定降多少。两个场景一比，学生才明白价格不是越高越好。\n\n不要做：暴涨日全渠道放开不设限。"},
{k:["暴跌","需求暴跌","降价","台风","淡季","pickup"],a:"需求暴跌走表 L：先看 Pickup（当前进度对比去年同期），确认是真跌还是慢热，再决定降多少。\n\n我判你这里最典型的误判是「一看到预订慢就降价」。48 小时 Pickup 落后 45% 和落后 10% 是完全两回事——前者要动，后者可能只是还没到订房高峰。\n\n数据集里有个现成的：2025-07-09 台风那天，48h Pickup 落后 45%，这就是标准的表 L 场景。\n\n不要做：不看 Pickup 直接降。"},
{k:["思政","课程思政","育人","价值观"],a:"这门课的思政落点，我判你抓三处就够，别硬加：\n\n① 数据诚信——日报上出现已售 341 间但可售只有 320 间，这是脏数据。教学生交叉验算三条（已售=可售×OCC、收入=已售×ADR、RevPAR=OCC×ADR），对不上就退回源头。这是最好讲的一处。\n② 折扣伦理——价格差异只能来自购买时间、取消条件、产品、需求量四条，绝不能看人报价。教材第 12 章有专门一节。\n③ 服务意识——超售拒住时的处置，考验的是怎么对待被拒的客人。\n\n不要做：每章都贴一段思政。"},
{k:["考核","出卷","评价","1+3","怎么考","成绩"],a:"评价用 1+3：1 个终结性考核加 3 个过程性考核。\n\n我判你这样配：终结性等于真实数据下的完整决策报告（给一套脱敏数据，让学生交一份定价加超售方案）；过程性三条是课堂决策记录、表格作业、章末自测。\n\n关键是考判断不考背诵。卷子上不要出 RevPAR 的定义是什么，要出这张日报显示 RevPAR 跌了，列出三个可能原因并说明先查哪个。\n\n题库我有现成的：章章自测、三级默写、结业考核。"},
{k:["一流课程","申报","教改","省级","材料"],a:"申报材料我给你清单，但不代写——这是我写死的边界。\n\n省级一流课程一般要这几块：课程定位与建设历程、教学团队、课程内容与资源、教学设计与方法（这块最能体现你的改革）、教学评价与成效、特色与创新、建设计划。\n\n我判你最能拉开差距的是教学设计与方法那一栏：多数人写采用案例教学法就完了，你要写清楚用 4 套脱敏真实数据驱动，学生每人独立完成决策，决策过程留痕可查——这就从有案例变成有证据。\n\n需要我评审你的大纲哪里会扣分，把大纲贴给我。\n\n不要做：把申报书写成工作总结。"},
{k:["听不懂","学生","学不会","没兴趣","上课"],a:"学生听不懂，我先判定卡在哪一格，你告诉我具体现象：\n\n是学生算不出数（卡在指标计算）？还是知道公式但不知道什么时候用（卡在场景映射）？还是会上课但做不了题（卡在判断，不是知识）？\n\n三种卡法三种教法：算不出就补真实日报；不会用就加场景配对（暴涨配暴跌、超售配拒住）；做不了题就减公式、加重复次数。\n\n最常见的是第二种——学生背得下 ARI 公式，但看到竞对降价不知道该查什么。这一格只能靠场景练，靠讲没用。\n\n你把具体现象告诉我，我判到具体那一格。"},
{k:["数据","实训","实验","数据集","脱敏","异常"],a:"我判你用这 4 套脱敏经营数据，别用编的：\n\n数据全部脱敏、可复现、不依赖任何系统。里面预埋了 10 个讲师出题专用异常点，每个都能单独出一节课：国庆次日 No-show 异常升到 11%（表 E）、台风日 48h Pickup 落后 45%（表 L）、竞对恶意降价 22%（表 C）等等。\n\n用法：给同一套数据，让学生独立交决策，然后全班对答案——对不上的地方就是他要学的那一格。\n\n想要数据集，邮件找我领。"},
{k:["大纲","评审","帮我看","扣分","改大纲"],a:"把你的大纲贴给我，我按判定表逐条评审，告诉你哪里会扣分、为什么。\n\n我判大纲只看四件事：① 终点清不清晰（学生上完能做哪三个判断）② 场景够不够（有没有真实数据驱动）③ 评价是不是考判断（不是考背诵）④ 有没有留痕（决策过程能不能查）。\n\n多数大纲在第 ② 条上扣分最狠：写满了知识点，但没有一个真实场景。\n\n贴过来，我给你逐条判。\n\n不要做：让我替你写终稿——这是我写死的边界，我只判不改。"},
{k:["ai","人工智能","取代","chatgpt","被替代"],a:"学生问这个，我判你这样答最诚实：\n\nAI 会取代算，不会取代判。算 OCC、算 ARI、生成报表——这些 AI 已经比人快。但今天该不该超售 20 间这个决策，要承担拒住客人的后果、要考虑老板的容忍度、要看这家酒店下个月还要不要这个协议客——这些是判断，不是计算。\n\n所以我教的重点一直是判断，不是算。这也是为什么我这门课不靠系统上课：系统会自动算，你要的是会拒绝的判断力。\n\n顺便说一句，你自己现在就在用 AI（就是我），但它判不了你的实际材料。"},
{k:["教材","课件","资料","领取","工具包","模板","题库"],a:"七件套，我一样一样给你：\n\n① 教材：26 章完整版，可打印\n② 课件：L1、L2、L3 三套讲师版加讲师手册\n③ 经营数据：4 套脱敏 CSV 加 10 个异常点\n④ 表格模板：62 个可填 xlsx\n⑤ 题库：章章自测、三级默写、结业考核\n⑥ 场景锻炼游戏（超售决策）\n⑦ 竞赛游戏（知识抢答）\n\n⑥⑦ 两个游戏是浏览器打开就能玩，不用装任何东西。其余几项邮件找我领：rm-community@qq.com\n\n院校要用、想走账，我可以开《开课工具包》发票。"},
{k:["陪跑","报价","多少钱","收费","合作","咨询"],a:"我的服务分两层，你要先说你是哪一层：\n\n① 开课即用包（引流层）：工具包加资料，按校收费\n② 师资陪跑（我的利润核心）：课程共建加年度陪跑，按月交付、按结果验收\n\n陪跑我锁死为异步：每月一次深度评审加一次集中答疑，反馈一律指向判定表第几张。不做实时响应、不代写申报材料、不代上课、不参与校内协调。\n\n具体方案和报价在师资陪跑那页，或者直接邮件问我：rm-community@qq.com"},
{k:["平台","年费","小鹅通","订阅","定价","登录"],a:"你问的是卖教学网站登录权这个模式——我判它成立，而且很适合你：写一次内容、所有订阅校自动同步。\n\n但两个硬提醒：\n① 别自建后端。登录系统运维会让你累垮，用现成机构版平台承载登录、支付、发票，你只管内容源。\n② 卖给学校要能开票，所以需要经营主体（个体工商户就够，注册免费、线上办）。\n\n定价按校分级，不按人——按人你得做账号管理，那是体力活。\n\n完整方案我有现成文档，邮件找我要。"},
{k:["证书","认证","1+x","人社","职业技能","等级"],a:"这一块我必须说清楚，别踩坑：\n\n国家职业资格目录里没有收益管理这个独立工种，现有的 1+X 证书已按政策移交人社部管理。市面上收益管理从业人员职业能力已有团体标准（别人执笔），我不做这块，也不发证。\n\n我做的是教学标准：课程怎么开、考什么、教学终点是什么。这是上下游关系，不是竞争。\n\n所以你跟领导汇报时，说课程能力评价可以，说国家认可的职业资格不行——这句话说错，后面全是麻烦。"},
{k:["课时","学时","排课","几周","学期","安排"],a:"课时我没法给你一个通用数字——不同学校学分不同，硬套一定出问题。\n\n但我判一个比例：讲课、场景练习、决策复盘等于 4 比 4 比 2。\n\n多数老师把它排成 8 比 2 比 0，结果学生听完还是不会决策。至少把练习拉到四成，用那 4 套脱敏数据做。\n\n16 周还是 32 周都能按这个比例切。你把你们学分告诉我，我帮你算具体周次。"},
{k:["案例","案例库","例子","素材"],a:"案例我判你别用编的，用数据集里的 10 个异常点——它们是从真实结构数据里挑出来的，每个都有明确的判定表对应：\n\n超售风险（表 E）、台风需求暴跌（表 L）、竞对恶意降价（表 C）、需求暴涨（表 A）。\n\n编的案例有个致命问题：学生会问老师这真的吗，你答不上来，整节课的可信度就没了。真实的不用解释。\n\n要案例库邮件找我领。"},
{k:["渠道","ota","分销","携程","美团","直销"],a:"渠道这一节，我判你只讲一件事：不同渠道的真实成本不一样。\n\nOTA 有佣金，直销有获客成本，协议客有维护成本。学生最容易误以为哪个渠道卖得多就用哪个——要看的是净贡献，不是间夜量。\n\n课堂上给一组渠道数据让学生算净贡献，他们自己会发现：卖得最多的渠道不一定是赚得最多的。这比讲半天渠道理论有用。\n\n不要做：只讲渠道分类不讲成本。"},
{k:["预算","预测","目标","明年","定多少"],a:"年度预算基线等于历史同期实际加合理的需求趋势，不是拍脑袋，也不是照抄去年。\n\n我判你这里最常见的错是去年做了多少、今年加 10%。这既不考虑市场变化，也不考虑你自己的产品变化（比如装修了、换了客群）。\n\n用脱敏数据 01 号做年度复盘训练最合适：让学生自己算一遍基线，再跟实际比。\n\n不要做：把预算目标直接当成考核指标下发。"}

var FALLBACK = '这一格我判不了——我的判定引擎只覆盖教学开课这个范围，你这句没命中。\n\n换个问法试试，比如点上面那些按钮。或者把问题说具体一点：是开课、备课、上课、考核还是申报？\n\n如果是要看你的实际材料（大纲、申报书、课件），那得真人教练来，我不编。';

var QUICKS = ["我没做过收益管理，怎么开这门课？","学生听不懂 OCC/ADR/RevPAR 怎么办？","32 个公式我该讲哪几个？","学校没系统，实验课怎么上？","超售那一节怎么讲？","考核怎么出卷？","省级一流课程申报要什么材料？","学生问 AI 会不会取代收益经理？"];

function bubble(who, text){
  var d=document.createElement('div');
  d.className='msg '+who;
  var b=document.createElement('div');
  b.className='bub';
  b.textContent=text;
  d.appendChild(b);
  var c=document.getElementById('chat');
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
}

function offlineAnswer(q){
  var s=q.toLowerCase(), best=null, score=0;
  for(var i=0;i<KB.length;i++){
    var hit=0;
    for(var j=0;j<KB[i].k.length;j++){
      if(s.indexOf(KB[i].k[j].toLowerCase())>=0) hit++;
    }
    if(hit>score){ score=hit; best=KB[i]; }
  }
  return best? best.a : FALLBACK;
}

async function tryLLM(q){
  var key=localStorage.getItem('ds_key');
  if(!key) return null;
  try{
    var r=await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:SYSTEM},{role:'user',content:q}],stream:false})
    });
    if(!r.ok) return null;
    var d=await r.json();
    return d.choices && d.choices[0] && d.choices[0].message ? d.choices[0].message.content : null;
  }catch(e){ return null; }
}

async function send(){
  var inp=document.getElementById('inp');
  var q=inp.value.trim();
  if(!q) return;
  inp.value='';
  bubble('me', q);
  var ans=await tryLLM(q);
  if(!ans) ans=offlineAnswer(q);
  bubble('coach', ans);
}

function saveKey(){
  var v=document.getElementById('apikey').value.trim();
  if(!v){ document.getElementById('keystat').textContent='Key 是空的，没保存。'; return; }
  localStorage.setItem('ds_key', v);
  document.getElementById('keystat').textContent='已保存到本机浏览器。现在提问会优先走大模型；若请求失败会自动切回离线判定引擎。';
  document.getElementById('mode').textContent='已接大模型';
}
function clearKey(){
  localStorage.removeItem('ds_key');
  document.getElementById('apikey').value='';
  document.getElementById('keystat').textContent='已清除，回到离线判定引擎。';
  document.getElementById('mode').textContent='离线判定引擎';
}
window.onload=function(){
  if(localStorage.getItem('ds_key')){ document.getElementById('mode').textContent='已接大模型'; }
  var qd=document.getElementById('quick');
  QUICKS.forEach(function(t){
    var b=document.createElement('button');
    b.className='qb'; b.textContent=t;
    b.onclick=function(){ document.getElementById('inp').value=t; send(); };
    qd.appendChild(b);
  });
  bubble('coach','我是收益管理教学教练的 AI 分身。\n\n你直接问，我按判定表答你——每个回答都指向具体哪张表、哪一格。\n\n现在用的是离线判定引擎（不用配置、不花钱）。想让它更像真人，上面填个 DeepSeek Key 就行。');
};
