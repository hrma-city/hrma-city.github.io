  .cq-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:22px 26px;box-shadow:var(--shadow)}

  .cq-case{font-size:13px;color:var(--ink-3);margin-bottom:12px;line-height:1.6}
  .cq-q{font-size:16.5px;font-weight:700;color:var(--navy);line-height:1.7;margin-bottom:14px}
  .cq-hintbtn{font-family:inherit;font-size:13px;padding:7px 14px;border:1px dashed var(--gold);background:#FFF9EC;
    color:#B8730F;border-radius:7px;cursor:pointer;margin-bottom:14px}
  .cq-nohint{font-size:12.5px;color:var(--ink-3);background:var(--bg-2);border-radius:7px;padding:7px 12px;margin-bottom:14px}
  .cq-hintbox{display:none;font-size:13.5px;color:var(--ink-2);background:#FFF9EC;border-left:3px solid var(--gold);
    border-radius:0 7px 7px 0;padding:10px 14px;margin-bottom:14px;line-height:1.8}
  .cq-hintbox.show{display:block}
  .cq-o{display:block;width:100%;text-align:left;font-family:inherit;font-size:14.5px;padding:12px 15px;

  .cq-o:hover{border-color:var(--navy);background:var(--bg-2)}
  .cq-o b{margin-right:8px;color:var(--navy)}
  .cq-o.right{background:#EDF7F0;border-color:var(--teal);color:#1F6B5C}
  .cq-o.wrong{background:#FDF3F2;border-color:var(--danger);color:#A32B1E}
  .cq-o[disabled]{cursor:default}
  .cq-fb{display:none;margin-top:14px;border-radius:9px;padding:14px 16px;font-size:14px;line-height:1.8}
  .cq-fb.show{display:block}
  .cq-fb.ok{background:#EDF7F0;border-left:4px solid var(--teal)}
  .cq-fb.no{background:#FDF3F2;border-left:4px solid var(--danger)}
  .cq-fb b{color:var(--navy)}
  .cq-fb .go{display:inline-block;margin-top:9px;font-size:12.5px;color:var(--gold);text-decoration:none;
    border-bottom:1px solid var(--gold-2)}
  .cq-next{display:none;margin-top:14px;width:100%;text-align:center}
  .cq-next.show{display:block}
  .cq-start,.cq-end{text-align:center}
  .cq-end,.cq-play{display:none}
  .cq-toggle{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
  .cq-toggle button{font-family:inherit;font-size:13px;padding:8px 18px;border:1px solid var(--line-2);
    background:#fff;color:var(--ink-2);border-radius:20px;cursor:pointer}
  .cq-toggle button.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:650}
  .cq-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
  .cq-mbtn{display:block;width:100%;text-align:left;font-family:inherit;background:var(--white);
    border:1px solid var(--line);border-radius:11px;padding:12px 15px;cursor:pointer;transition:.12s}
  .cq-mbtn:hover{border-color:var(--navy);background:var(--bg-2)}
  .cq-mbtn .mt{font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:3px}
  .cq-mbtn .md{font-size:12px;color:var(--ink-3);line-height:1.6}
  .cq-mbtn.wide{grid-column:1/-1}
  .cq-box{text-align:left;border-radius:11px;padding:13px 17px;margin-top:14px;font-size:13px;line-height:1.8}
  .cq-box.w{background:#FDF3F2;border:1px solid #F3D6D2}
  .cq-box.w .h{font-weight:800;color:#A32B1E;margin-bottom:6px}
  .cq-box.w ul{margin:0;padding-left:20px;color:var(--ink-2)}
  .cq-box.s{background:#F4F7FA;border:1px solid var(--line)}
  .cq-box.s .h{font-weight:800;color:var(--navy2);margin-bottom:8px}
  .cq-box.s .row{display:flex;flex-wrap:wrap;gap:16px;color:var(--ink-2)}
  .cq-box.s .row b{font-family:var(--mono);font-size:17px;color:var(--navy);margin-right:3px}
  .cq-end .em{font-size:46px}
  .cq-end h2{color:var(--navy);margin:10px 0 6px}
  .cq-end .g{font-size:38px;font-weight:800;font-family:var(--mono);color:var(--navy)}
  .cq-end p{font-size:14px;color:var(--ink-2);line-height:1.85;max-width:600px;margin:10px auto}
  @media(max-width:700px){.cq-opts{grid-template-columns:1fr}.cq-card{padding:18px 18px}}
</style>

<script>
var BANK = [{"id": "1-0", "no": 1, "i": 0, "q": "会议单报价 ¥680、当期 BAR ¥1,180，历史同期 OCC 仅 62%。判断「该不该接」时，最先要算的是哪一项？", "o": ["（BAR − 报价）× 全部间夜，即表面差价", "被挤掉的散客净损失——按「本可卖出的间夜」算，不是按满房算", "餐饮与会场收入", "团队报价与 BAR 的比值"], "a": 1, "e": "置换分析算的是「本可卖出的间夜」。直接按满房间夜算会严重高估损失，从而误拒一个划算的会议单。本例历史 OCC 仅 62%，散客实际只能卖出约 279 间夜，而非 380 间。", "part": "一 · 业态与星级", "ct": "450 间五星酒店：客房亏 8 万，为什么还要接这个会？", "take": "全服务酒店判断会议单，永远用表 K 算综合收益；被挤掉的散客只按「本可卖出的间夜」算，不是按满房算。", "tags": ["五星全服务", "会议团队", "表K"]}, {"id": "1-1", "no": 1, "i": 1, "q": "全服务酒店判断会议单，为什么必须用表 K 而不是只看客房？", "o": ["客房是主业，只看客房就够", "客房亏的钱可以从餐饮和会场赚回来，要看综合贡献", "表 K 只用于宴会厅排期", "表 K 用来计算超售间数"], "a": 1, "e": "表 K 是「会议／宴会综合收益联动表」：会议价值 = 客房 + 餐饮 + 会场租金 + 设备/其他。本例客房净收益仅 +¥3.2 万，但餐饮会场净贡献约 ¥52 万，综合 +¥55 万——只看客房会误拒。", "part": "一 · 业态与星级", "ct": "450 间五星酒店：客房亏 8 万，为什么还要接这个会？", "take": "全服务酒店判断会议单，永远用表 K 算综合收益；被挤掉的散客只按「本可卖出的间夜」算，不是按满房算。", "tags": ["五星全服务", "会议团队", "表K"]}, {"id": "2-0", "no": 2, "i": 0, "q": "协议客占比 55%、ADR 被三年老合同锁死，优先应该做什么？", "o": ["所有协议价一律上调 15%", "按贡献度分层：低效协议不再续原价，高频客户给保量返点而非无条件低价", "取消全部协议客，转做散客", "全面降价换量"], "a": 1, "e": "一刀切提价会流失核心客户；分层处理才能既提 ADR 又保住量。本例后 40% 的协议公司只贡献 8% 间夜，却占着最低价——这部分才是问题所在。", "part": "一 · 业态与星级", "ct": "四星商务酒店：协议价签得太低，ADR 被锁死了三年", "take": "协议价必须设有效期 + 保量条款；每年做一次「频次—房价」矩阵复盘，清掉低效低价协议。", "tags": ["四星商务", "协议客", "价格体系"]}, {"id": "2-1", "no": 2, "i": 1, "q": "签公司协议价时，合同里最该补上的两条是什么？", "o": ["无限期 + 无条件最低价", "有效期 + 保量条款", "只允许涨不许降", "按市场价每日浮动"], "a": 1, "e": "没有有效期和保量条款，价格就会变成刚性——市场涨了你也涨不了。本例正是三年前签了无期限最低价，导致 ADR 被锁死三年。", "part": "一 · 业态与星级", "ct": "四星商务酒店：协议价签得太低，ADR 被锁死了三年", "take": "协议价必须设有效期 + 保量条款；每年做一次「频次—房价」矩阵复盘，清掉低效低价协议。", "tags": ["四星商务", "协议客", "价格体系"]}, {"id": "3-0", "no": 3, "i": 0, "q": "想提升直订占比，正确的做法是？", "o": ["官网公开挂比 OTA 更低的牌价", "用权益差异化（积分、免费取消、延迟退房、升级），牌价保持一致", "把所有 OTA 全部下架", "给 OTA 独家低价换曝光"], "a": 1, "e": "公开破价违反表 H 价格一致，会被平台降权、被客人比价后投诉，还会永久拉低价格锚。用权益做差异化才能既提直订又不伤价格体系。", "part": "一 · 业态与星级", "ct": "120 间中端酒店：把 OTA 从 62% 压到 41%，一年多赚 38 万", "take": "提直订 = 权益差异化 + 库存倾斜，绝不等于公开降价；用 NRevPAR 而非 RevPAR 看渠道。", "tags": ["中端有限服务", "渠道", "直订"]}, {"id": "3-1", "no": 3, "i": 1, "q": "要衡量渠道的真实净贡献，应该看哪个指标？", "o": ["RevPAR", "OCC", "NRevPAR（扣掉佣金/渠道费后的净 RevPAR）", "ADR"], "a": 2, "e": "RevPAR 与 ADR 都不含渠道成本。OTA 佣金约 15%、直销成本约 3%，中间 12 个点就是利润差异——只有 NRevPAR 能看出来。", "part": "一 · 业态与星级", "ct": "120 间中端酒店：把 OTA 从 62% 压到 41%，一年多赚 38 万", "take": "提直订 = 权益差异化 + 库存倾斜，绝不等于公开降价；用 NRevPAR 而非 RevPAR 看渠道。", "tags": ["中端有限服务", "渠道", "直订"]}, {"id": "4-0", "no": 4, "i": 0, "q": "淡季考虑闭店时，除了固定成本与变动成本，还必须计入什么？", "o": ["只算当月亏损就够", "渠道排名下滑与会员流失的隐性成本", "员工情绪", "装修预算"], "a": 1, "e": "闭店省下的成本是显性的，但 OTA 排名、搜索权重、会员心智的流失是隐性的，次年重开要花更大代价才能拿回来。这类成本必须写进决策。", "part": "一 · 业态与星级", "ct": "海岛度假村：淡季到底该关门，还是 ¥399 包三餐？", "take": "极端淡季别只盯客房：套餐化 + 二消 + 会员锁定三管齐下；闭店决策要把渠道排名与会员流失算进去。", "tags": ["度假村", "季节性", "淡季"]}, {"id": "4-1", "no": 4, "i": 1, "q": "淡季想保量又不破牌价，常用手法是？", "o": ["直接降挂牌价", "买二送一 / 含三餐的套餐（打包权益，牌价不动）", "关闭餐厅省成本", "只接团队"], "a": 1, "e": "「买二送一」在客人感知里是优惠，在账面上保住了牌价；而直接降牌价会拉低价格锚并污染公开渠道。本例用 ¥1,299/3 晚套餐把 OCC 从 28% 拉到 47%。", "part": "一 · 业态与星级", "ct": "海岛度假村：淡季到底该关门，还是 ¥399 包三餐？", "take": "极端淡季别只盯客房：套餐化 + 二消 + 会员锁定三管齐下；闭店决策要把渠道排名与会员流失算进去。", "tags": ["度假村", "季节性", "淡季"]}, {"id": "5-0", "no": 5, "i": 0, "q": "长租与短租的配比，正确做法是什么？", "o": ["年初定一个固定比例，全年不变", "每月只拿「当月到期」的房源做短租，存量长租不动", "全部转短租博高价", "全部做长租最稳"], "a": 1, "e": "配比必须是动态的。只用当月到期的房源做短租，短租永远不会侵蚀长租基本盘；展会月全部转短租，非展会月优先续约。", "part": "一 · 业态与星级", "ct": "服务式公寓：长租和短租，每个月都要重新配比", "take": "服务式公寓的核心工具是到期日历；短租只动「当月到期」的房量，不动存量；用免租期替代降租。", "tags": ["服务式公寓", "长短租配比", "RevPAU"]}, {"id": "5-1", "no": 5, "i": 1, "q": "给续约客户让利时，为什么「免租 7 天」优于「直接降月租」？", "o": ["免租期手续更简单", "免租期保住了账面租金水平，降租会永久拉低价格锚", "租客更喜欢", "税务更优惠"], "a": 1, "e": "降租会体现在合同价上，续签、评估、新客报价都会被拉低；免租期是一次性优惠，账面租金仍可维持并逐年上调。本例续约涨 4% 而非市场价 8%，差额以免租期补偿。", "part": "一 · 业态与星级", "ct": "服务式公寓：长租和短租，每个月都要重新配比", "take": "服务式公寓的核心工具是到期日历；短租只动「当月到期」的房量，不动存量；用免租期替代降租。", "tags": ["服务式公寓", "长短租配比", "RevPAU"]}, {"id": "6-0", "no": 6, "i": 0, "q": "40 间的精品民宿面对周边 11 家新店的价格战，最优策略是？", "o": ["跟降到最低价保量", "做人群与产品差异化（住宿+在地体验套餐），OTA 当曝光入口、成交回私域", "加大 OTA 广告投入", "涨价彰显定位"], "a": 1, "e": "小体量永远打不赢价格战。把「房间」卖成「体验」，客人比价的维度就变了；再把 OTA 当曝光，用内容把人引到私域成交，才能摆脱佣金。本例直订从 22% 升到 63%。", "part": "一 · 业态与星级", "ct": "40 间古镇民宿：不投 OTA 广告，靠内容把直订做到 63%", "take": "小体量民宿：不做价格战，做人群与内容匹配；OTA 当曝光入口，成交回私域。", "tags": ["精品民宿", "小体量", "内容获客"]}, {"id": "6-1", "no": 6, "i": 1, "q": "40 间精品民宿想摆脱 OTA 佣金，以下哪条路最可持续？", "o": ["官网公开挂牌价低于 OTA 10%", "OTA 当曝光入口，用内容（笔记/短视频/达人探店）把人引到私域成交", "把所有 OTA 全部下架，只做自有渠道", "给 OTA 独家低价换首页曝光"], "a": 1, "e": "公开破价违反表 H，会被平台降权、被客人比价投诉，还会永久拉低价格锚；全部下架则直接失去曝光，小店承受不起。小店的流量不来自预算，来自内容——把 OTA 当「广告位」，成交引回私域，佣金才能降到接近零。本例直订占比从 22% 升到 63%。", "part": "一 · 业态与星级", "ct": "40 间古镇民宿：不投 OTA 广告，靠内容把直订做到 63%", "take": "小体量民宿：不做价格战，做人群与内容匹配；OTA 当曝光入口，成交回私域。", "tags": ["精品民宿", "小体量", "内容获客"]}, {"id": "7-0", "no": 7, "i": 0, "q": "单房变动成本 ¥95、平台佣金 15%。卖 ¥99 的净到手是多少？", "o": ["¥99，高于成本", "¥84.15，低于变动成本，每卖一间亏 ¥10.85", "¥95，刚好打平", "¥114"], "a": 1, "e": "99 × (1−15%) = ¥84.15 < 变动成本 ¥95，卖得越多亏得越多，还会把客人的价格锚永久拉到三位数以下。", "part": "一 · 业态与星级", "ct": "县城经济型酒店：¥99 的特价房，是引流还是自杀？", "take": "任何低于变动成本的价格都是在自杀；竞争用「权益包 + 限时尾单」，不动牌价。", "tags": ["经济型", "价格底线", "入住率"]}, {"id": "7-1", "no": 7, "i": 1, "q": "面对同行的 ¥99 特价房，正确的应对是？", "o": ["裸价跟降到 ¥99", "权益包（含早+延迟退房+停车）+ 限时尾单，牌价不动", "拒绝一切促销", "只做会员"], "a": 1, "e": "底线是成交价必须高于变动成本。用权益包提升感知价值，用限时尾单在 17:00 后清剩余房量，既参与竞争又不破牌价。", "part": "一 · 业态与星级", "ct": "县城经济型酒店：¥99 的特价房，是引流还是自杀？", "take": "任何低于变动成本的价格都是在自杀；竞争用「权益包 + 限时尾单」，不动牌价。", "tags": ["经济型", "价格底线", "入住率"]}, {"id": "8-0", "no": 8, "i": 0, "q": "MPI 106、ARI 94、RGI ≈ 100，这组数据说明什么？", "o": ["三项全面领先，无需动作", "份额是靠低价抢来的（ARI 偏低），应当提价", "应该继续降价保量", "竞组选错了"], "a": 1, "e": "RGI 100 是「假持平」：MPI>100 说明抢到份额，ARI<100 说明是用低价换的。在需求普涨 22% 而 ADR 只涨 4% 时，典型的漏损就是不敢提价。", "part": "二 · 经济周期", "ct": "繁荣期最容易犯的错：不是卖不掉，是卖太便宜", "take": "繁荣期看 ARI 而不是 OCC；小步多次提价 + 设 OCC 刹车线；协议价新签必须跟涨。", "tags": ["繁荣期", "提价节奏", "表A"]}, {"id": "8-1", "no": 8, "i": 1, "q": "繁荣期提价，安全的做法是？", "o": ["一次性提 15%，一步到位", "小步多次（每次 2%–3%，观察 3 天）+ 设 OCC 刹车线", "只提周末", "只提协议价"], "a": 1, "e": "一次性大幅提价容易吓退需求且不可逆；小步快跑可以随时观察反应。设刹车线（如 OCC 跌破 82% 暂停）能防止过量。", "part": "二 · 经济周期", "ct": "繁荣期最容易犯的错：不是卖不掉，是卖太便宜", "take": "繁荣期看 ARI 而不是 OCC；小步多次提价 + 设 OCC 刹车线；协议价新签必须跟涨。", "tags": ["繁荣期", "提价节奏", "表A"]}, {"id": "9-0", "no": 9, "i": 0, "q": "下行期考虑降价 15%，判断其是否可行的核心依据是？", "o": ["竞对降了就跟降", "算清打平所需的 OCC 增量（本例需 +9pp，下行期不现实）", "业主要求就降", "看当月任务缺口"], "a": 1, "e": "降价 15% 后 RevPAR 需靠 OCC 提升约 9pp 才能打平，但整体需求在萎缩，这个增量几乎不可能——所以降价大概率是净损失。", "part": "二 · 经济周期", "ct": "下行期：商旅预算砍 30%，是降价还是换客群？", "take": "下行期先算降价打平所需的 OCC 增量，通常得不偿失；优先换客群、保价换权益、用 TrevPAR 补 RevPAR。", "tags": ["下行期", "客群转移", "保价"]}, {"id": "9-1", "no": 9, "i": 1, "q": "下行期保住收益，优先应该做哪组动作？", "o": ["全面降价保量", "换客群 + 保价换权益 + 用 TrevPAR 补 RevPAR", "裁员压缩成本", "关闭部分楼层"], "a": 1, "e": "降价解决不了需求萎缩。转向相对稳定的本地客群（考试、陪护、微度假），用权益而非降价留住协议客，再用餐饮二消补客房缺口，才是可持续的。", "part": "二 · 经济周期", "ct": "下行期：商旅预算砍 30%，是降价还是换客群？", "take": "下行期先算降价打平所需的 OCC 增量，通常得不偿失；优先换客群、保价换权益、用 TrevPAR 补 RevPAR。", "tags": ["下行期", "客群转移", "保价"]}, {"id": "10-0", "no": 10, "i": 0, "q": "复苏期启动提价，应该看哪些信号？", "o": ["只看 Pickup 增速", "Pickup 增速 + 竞对动作 + 在手绝对量（三选二即可启动）", "只看业主意见", "只看天气与节假日"], "a": 1, "e": "单一信号容易误判。三个信号交叉验证能显著降低风险：增速连续 3 周 >30%、竞对已提价、未来 30 天在手量达去年同期的 112%。", "part": "二 · 经济周期", "ct": "复苏期：需求回来了，什么时候该提价？", "take": "复苏期提价看三个信号（Pickup 增速 / 竞对动作 / 在手绝对量）；先提远期，临近期缓提；用预付折扣吸收价格敏感客。", "tags": ["复苏期", "提价时机", "预测"]}, {"id": "10-1", "no": 10, "i": 1, "q": "复苏期提价应该从哪个提前期开始？", "o": ["T-7 内的临期房", "T-30 以外的远期房（远期客人价格敏感度低）", "全部日期同时提", "只提当天"], "a": 1, "e": "远期客人计划性强、比价成本低但价格敏感度相对低；临近期需求更急、对价格更敏感。先提远期可以在不影响近期转化的情况下试探市场。", "part": "二 · 经济周期", "ct": "复苏期：需求回来了，什么时候该提价？", "take": "复苏期提价看三个信号（Pickup 增速 / 竞对动作 / 在手绝对量）；先提远期，临近期缓提；用预付折扣吸收价格敏感客。", "tags": ["复苏期", "提价时机", "预测"]}, {"id": "11-0", "no": 11, "i": 0, "q": "旺季判断「现在卖掉」还是「再等等」的核心依据是？", "o": ["前台的经验判断", "历史同期临时高价需求的期望值对比", "竞对当前挂牌价", "当天天气"], "a": 1, "e": "本例：立即按 ¥880 卖得 ¥10,560；等到 T-1 有 80% 概率以 ¥1,800+ 卖出 = ¥21,600。用期望值算，等待更优。这是可量化的判断，不是拍脑袋。", "part": "三 · 季节", "ct": "旺季满房日：为什么我宁愿空 12 间也不卖？", "take": "旺季判断「现在卖还是等」要看历史临时高价需求的期望值；永远设兜底释放时点，别把宝押到底。", "tags": ["旺季", "库存分配", "表B"]}, {"id": "11-1", "no": 11, "i": 1, "q": "既然选择等待，为什么还必须设兜底释放时点？", "o": ["方便财务统计", "避免把宝押到底导致全空，T-1 下午未售出就以次优价释放", "应付上级检查", "平台规则要求"], "a": 1, "e": "等待是有风险的。设兜底（本例 T-1 下午 ¥1,280 释放）能把最坏情况锁定在可接受区间——本例最终 12 间平均 ¥1,720 售出。", "part": "三 · 季节", "ct": "旺季满房日：为什么我宁愿空 12 间也不卖？", "take": "旺季判断「现在卖还是等」要看历史临时高价需求的期望值；永远设兜底释放时点，别把宝押到底。", "tags": ["旺季", "库存分配", "表B"]}, {"id": "12-0", "no": 12, "i": 0, "q": "商务酒店周末 OCC 只有 41%，正确的解法是？", "o": ["周末大幅降价冲量", "换产品：做本地微度假套餐（含早+下午茶+联名权益），牌价不动", "周末闭店", "只接低价团队"], "a": 1, "e": "周末需求不是「同样的客人嫌贵」，而是「商务客根本不来」。换客群、换产品才是解法；降价只会拉低平日价格锚。", "part": "三 · 季节", "ct": "商务酒店的周末洼地：用 2 天拉动 5 天", "take": "周末洼地用换产品解决；套餐要 bundled 权益、牌价不动；周五做弹性日承接两种需求。", "tags": ["平季", "周末洼地", "套餐"]}, {"id": "12-1", "no": 12, "i": 1, "q": "衡量周末改造效果，更合适的指标是？", "o": ["只看 OCC", "TrevPAR（含餐饮等二消）", "只看 ADR", "只看成本率"], "a": 1, "e": "周末套餐摊薄了 ADR，但带来了餐饮与联名收入。只看 ADR 会低估周末改造的价值，应看 TrevPAR 甚至 GOPPAR。", "part": "三 · 季节", "ct": "商务酒店的周末洼地：用 2 天拉动 5 天", "take": "周末洼地用换产品解决；套餐要 bundled 权益、牌价不动；周五做弹性日承接两种需求。", "tags": ["平季", "周末洼地", "套餐"]}, {"id": "13-0", "no": 13, "i": 0, "q": "换季时预测模型集体失准，根因通常是？", "o": ["历史数据太少", "物候/事件驱动的需求位移，模型捕捉不到", "系统故障", "竞对恶意干扰"], "a": 1, "e": "花期、迁徙、赛事这类事件每年日期会前后移动 7–14 天，而模型基于「去年同期+平滑」，无法捕捉这种位移。这是结构性缺陷，不是数据量的事。", "part": "三 · 季节", "ct": "换季翻车：预测模型在季节切换时集体失准", "take": "换季/事件驱动的需求必须人工校准；建「本地事件日历」并在换季前开校准会；事件日提高监控频率。", "tags": ["换季", "预测校准", "表I"]}, {"id": "13-1", "no": 13, "i": 1, "q": "应对换季失准，应该建立什么机制？", "o": ["换一套更贵的预测系统", "建本地事件日历 + 换季前人工校准会 + 事件日提高监控频率", "让经理每天凭经验猜", "放弃预测，只看法实际"], "a": 1, "e": "模型补不了的部分要靠机制补：事件日历把外部变量显性化，校准会在换季前统一修正，监控频率提高则保证发现及时。", "part": "三 · 季节", "ct": "换季翻车：预测模型在季节切换时集体失准", "take": "换季/事件驱动的需求必须人工校准；建「本地事件日历」并在换季前开校准会；事件日提高监控频率。", "tags": ["换季", "预测校准", "表I"]}, {"id": "14-0", "no": 14, "i": 0, "q": "春节期间为什么不能一个价走到底？", "o": ["客人会投诉", "春节存在「返乡低谷段」与「旅游高峰段」两个方向相反的峰", "系统不支持多价格", "员工休假排班问题"], "a": 1, "e": "除夕–初三本地人回家过年、需求低；初四–初七旅游与返程叠加、需求爆满。统一价会导致前段空置、后段没赚够。", "part": "四 · 节假日", "ct": "春节不是一条曲线，是两个完全不同的峰", "take": "长假要按日型切段，不能一个价走到底；低谷段用套餐（含餐饮）保量，高峰段提价 + MinLOS。", "tags": ["春节", "双峰结构", "日型切割"]}, {"id": "14-1", "no": 14, "i": 1, "q": "春节低谷段（除夕–初三）的正确动作是？", "o": ["降价抛售", "做含餐饮的「团圆/年夜饭套餐」保量，牌价不动", "干脆闭店", "只接团队"], "a": 1, "e": "用餐饮把客房价值包起来，既保住了牌价又拉高了 OCC 与 TrevPAR。本例前段 OCC 从 32% 升到 61%，餐饮收入同比 +34%。", "part": "四 · 节假日", "ct": "春节不是一条曲线，是两个完全不同的峰", "take": "长假要按日型切段，不能一个价走到底；低谷段用套餐（含餐饮）保量，高峰段提价 + MinLOS。", "tags": ["春节", "双峰结构", "日型切割"]}, {"id": "15-0", "no": 15, "i": 0, "q": "国庆 D2–D4 为什么能顶格定价？", "o": ["因为房源充足", "游客已在目的地、转换成本高、价格不敏感", "因为天气好", "因为竞对先涨了"], "a": 1, "e": "到达目的地后，更换酒店的时间与交通成本很高，需求接近刚性——这是溢价能力最强的窗口。而 D1 出发日游客仍在比价，弹性大得多。", "part": "四 · 节假日", "ct": "国庆 7 天：为什么第 1 天和第 4 天要卖两个价", "take": "长假内部要按游客行为阶段切日型；弱日型用连住优惠转化，核心日顶格定价，尾段设限时释放。", "tags": ["国庆", "长假", "前中后段"]}, {"id": "15-1", "no": 15, "i": 1, "q": "早鸟优惠应该保护哪几天？", "o": ["全部日期参与早鸟", "核心日（D2–D4）不参与早鸟，只给 D1 与 D5–D7 等弱日型", "只给核心日", "完全不做早鸟"], "a": 1, "e": "早鸟的目的是锁量，应该用在需求弱的日型；把核心日放进早鸟等于把最高的价格提前打折卖掉。", "part": "四 · 节假日", "ct": "国庆 7 天：为什么第 1 天和第 4 天要卖两个价", "take": "长假内部要按游客行为阶段切日型；弱日型用连住优惠转化，核心日顶格定价，尾段设限时释放。", "tags": ["国庆", "长假", "前中后段"]}, {"id": "16-0", "no": 16, "i": 0, "q": "短假期（3 天）决策最容易犯的错是什么？", "o": ["调价太频繁", "只看某一时点的在手量就下结论，忽略 Pickup 增速", "调价次数太少", "过度关注竞对"], "a": 1, "e": "本例 T-11 在手仅 38% 看似疲软，但 T-6 已升到 61%（+23pp/5 天）。只看绝对值会误判降价，把后面爆发的需求低价卖光。", "part": "四 · 节假日", "ct": "五一 3 天假：48 小时里改了 9 次价", "take": "短假期要提高监控频率 + 预设调价阈值；每次调整幅度控制在 8% 以内；在手超 90% 就停止提价。", "tags": ["五一短假", "高频调价", "表I"]}, {"id": "16-1", "no": 16, "i": 1, "q": "短假期的正确决策机制是？", "o": ["每天看一次", "提高监控频率（每日两次）+ 预设三档阈值，用规则代替临场判断", "每周看一次", "假期当天再决定"], "a": 1, "e": "短假期窗口短、变化快，临场判断容易被情绪左右。预设阈值（在手<50% 且增速<10pp/周 → 降；50–75% → 守；>75% 或增速>20pp/周 → 提）能让动作稳定可复现。", "part": "四 · 节假日", "ct": "五一 3 天假：48 小时里改了 9 次价", "take": "短假期要提高监控频率 + 预设调价阈值；每次调整幅度控制在 8% 以内；在手超 90% 就停止提价。", "tags": ["五一短假", "高频调价", "表I"]}, {"id": "17-0", "no": 17, "i": 0, "q": "亲子长住客拉高 OCC 却压低 ADR，正确的应对是？", "o": ["限制长住，多接短住高价客", "给长住配产品（连住套餐）+ 设计二消路径（家庭餐、儿童俱乐部）", "直接涨价", "拒绝家庭客"], "a": 1, "e": "限制长住会产生大量难以补满的「空档日」。长住客的价值是稳定高 OCC 与可预期的二消，应该用产品和二消把这块价值兑现。", "part": "四 · 节假日", "ct": "暑期 60 天：亲子长住客，是把双刃剑", "take": "长住客不必然拉低收益，关键是配产品 + 设计二消；用 MinLOS 过滤短住低价需求；看 TrevPAR 而非只看 ADR。", "tags": ["暑期", "亲子客群", "长住"]}, {"id": "17-1", "no": 17, "i": 1, "q": "衡量暑期经营效果，更合适的指标是？", "o": ["ADR", "TrevPAR（含餐饮与娱乐收入）", "OCC", "平均住期"], "a": 1, "e": "家庭客的客房 ADR 弹性小，但餐饮、儿童俱乐部等二消弹性大。只看 ADR 会低估暑期，应看 TrevPAR。", "part": "四 · 节假日", "ct": "暑期 60 天：亲子长住客，是把双刃剑", "take": "长住客不必然拉低收益，关键是配产品 + 设计二消；用 MinLOS 过滤短住低价需求；看 TrevPAR 而非只看 ADR。", "tags": ["暑期", "亲子客群", "长住"]}, {"id": "18-0", "no": 18, "i": 0, "q": "展会操盘最大的风险是什么？", "o": ["卖不掉", "卖早了、卖便宜了（核心日参与早鸟或提价不及时）", "客人投诉", "员工排班不足"], "a": 1, "e": "展会需求刚性且价格不敏感，几乎不存在卖不掉的风险；真正的漏损是核心三日被早鸟或保守定价提前锁死。", "part": "五 · 特殊事件", "ct": "展会 3 天：从 T-90 到 T+1 的完整操盘记录", "take": "峰值事件要提前 90 天分五个时点操盘；核心日不参与早鸟；提价必须逐个渠道核对同步。", "tags": ["展会", "峰值日", "全程操盘"]}, {"id": "18-1", "no": 18, "i": 1, "q": "展会期的超售参数要特别注意什么？", "o": ["沿用月度参数即可", "展会期 No-show 通常显著下降（本例 <3%），必须重算，否则会步行", "一律不超售", "按往期加倍超售"], "a": 1, "e": "展会客多为刚性出行，No-show 远低于平日。沿用月度参数会超售过度，产生步行客人与赔付。本例重算后零步行。", "part": "五 · 特殊事件", "ct": "展会 3 天：从 T-90 到 T+1 的完整操盘记录", "take": "峰值事件要提前 90 天分五个时点操盘；核心日不参与早鸟；提价必须逐个渠道核对同步。", "tags": ["展会", "峰值日", "全程操盘"]}, {"id": "19-0", "no": 19, "i": 0, "q": "演唱会这类瞬时需求场景，什么比价格本身更关键？", "o": ["酒店装修", "信息速度——多快知道、多快反应", "餐饮配套", "停车位"], "a": 1, "e": "本例比竞对晚知道 40 分钟，直接决定了可操作空间。第一次 2 小时售罄说明定低了；建立活动监控清单后，第二次 15 分钟内提价，多赚 ¥3.4 万。", "part": "五 · 特殊事件", "ct": "演唱会当晚：2 小时卖光 180 间，但价格定低了", "take": "瞬时需求场景：先解决信息速度，再解决价格；定溢价看「场馆距离 + 竞对 1.3–1.5 倍」；售罄过快 = 定低了，要敢加档。", "tags": ["演唱会", "瞬时需求", "溢价"]}, {"id": "19-1", "no": 19, "i": 1, "q": "活动房在 2 小时内就售罄，说明什么？", "o": ["需求不足", "价格定低了，应立即再加一档", "应该降价走量", "渠道投放有问题"], "a": 1, "e": "售罄速度是价格信号。快速售罄意味着需求远大于供给，此时加价仍能卖出大部分房源，总收入更高。", "part": "五 · 特殊事件", "ct": "演唱会当晚：2 小时卖光 180 间，但价格定低了", "take": "瞬时需求场景：先解决信息速度，再解决价格；定溢价看「场馆距离 + 竞对 1.3–1.5 倍」；售罄过快 = 定低了，要敢加档。", "tags": ["演唱会", "瞬时需求", "溢价"]}, {"id": "20-0", "no": 20, "i": 0, "q": "判断政府包场这类大单是否划算，核心是算什么？", "o": ["单价高低", "机会成本 + 隐性收益 + 风险对冲，三笔账一起算", "领导或销售的意见", "结算周期长短"], "a": 1, "e": "本例直接机会成本 ¥22.9 万，但政务接待资质与次年会议资源是隐性收益，赛事取消风险则被包场对冲。三笔账合看才不会误判。", "part": "五 · 特殊事件", "ct": "政府包场：稳定的大单，值不值得签？", "take": "大单决策要算机会成本 + 隐性收益 + 风险对冲三笔账；能折中就别二选一，合同要留弹性条款。", "tags": ["政府会议", "包场", "机会成本"]}, {"id": "20-1", "no": 20, "i": 1, "q": "面对「全盘接受」与「一口回绝」，更好的思路是？", "o": ["二选一", "部分包场 + 保留散客房量，并在合同里写弹性条款", "全盘接受保关系", "一口回绝保收益"], "a": 1, "e": "折中方案能同时拿到确定性收益与上行空间；合同写「若赛事取消，剩余房量可自由销售」则把风险也管住了。", "part": "五 · 特殊事件", "ct": "政府包场：稳定的大单，值不值得签？", "take": "大单决策要算机会成本 + 隐性收益 + 风险对冲三笔账；能折中就别二选一，合同要留弹性条款。", "tags": ["政府会议", "包场", "机会成本"]}, {"id": "21-0", "no": 21, "i": 0, "q": "台风预警后大量退订，优先应该怎么做？", "o": ["一律不退，按合同执行", "不可抗力订单全额退，但主动引导「改期」而非「取消」", "只退一半", "等客人上门再谈"], "a": 1, "e": "不可抗力硬扛会引发舆情与平台处罚；但直接全部取消则损失未来收入。本例改期转化率 41%，保留了 ¥18 万的未来收入。", "part": "五 · 特殊事件", "ct": "台风来了：退订潮之后，是滞留客的爆发", "take": "灾害天气走表 L；退订优先引导改期而非退款；滞留需求「能承接但不抬价」，口碑比短期溢价值钱。", "tags": ["极端天气", "台风", "双面影响"]}, {"id": "21-1", "no": 21, "i": 1, "q": "滞留需求爆发时可以大幅抬价吗？", "o": ["可以，需求刚性且客人没得选", "不可以，合规与品牌风险高，口碑比短期溢价值钱", "可以翻倍", "视库存而定"], "a": 1, "e": "灾害期间恶意抬价有合规风险，且会永久伤害品牌。本例仅 +10%，换来零投诉与 OTA 评分上升 0.12，长期收益远大于短期溢价。", "part": "五 · 特殊事件", "ct": "台风来了：退订潮之后，是滞留客的爆发", "take": "灾害天气走表 L；退订优先引导改期而非退款；滞留需求「能承接但不抬价」，口碑比短期溢价值钱。", "tags": ["极端天气", "台风", "双面影响"]}, {"id": "22-0", "no": 22, "i": 0, "q": "OTA 评分下滑时，降价能解决问题吗？", "o": ["能，降价能拉回订单量", "不能，降价会吸引价格敏感客、稀释体验，反而引发更多差评", "能，但见效慢", "不确定"], "a": 1, "e": "本例测算：降价到 ¥700 后 RevPAR ¥497，反而低于维持 ¥880 的 ¥685。根因是服务缺陷，降价只是把问题放大。", "part": "五 · 特殊事件", "ct": "差评危机：评分从 4.6 掉到 4.1，还要不要提价？", "take": "口碑危机时不要降价：先整改 + 用权益补偿 + 限量保体验；价格是缓冲，不是解药。", "tags": ["舆情危机", "口碑", "价格应对"]}, {"id": "22-1", "no": 22, "i": 1, "q": "口碑危机的正确处理顺序是？", "o": ["先降价止血", "先整改服务 + 用权益补偿 + 限量接单保体验，价格不动", "先关店整顿", "先投广告冲淡差评"], "a": 1, "e": "补偿包成本 ¥85/间远低于降价 ¥180/间，且不会拉低价格锚；把可售房量控制在 85% 能留出服务余量，避免边修边新增差评。", "part": "五 · 特殊事件", "ct": "差评危机：评分从 4.6 掉到 4.1，还要不要提价？", "take": "口碑危机时不要降价：先整改 + 用权益补偿 + 限量保体验；价格是缓冲，不是解药。", "tags": ["舆情危机", "口碑", "价格应对"]}, {"id": "23-0", "no": 23, "i": 0, "q": "系统故障导致的损失大小， var PARTS = ["一 · 业态与星级", "二 · 经济周期", "三 · 季节", "四 · 节假日", "五 · 特殊事件"];
var K_BEST="hrma_case_ex_v1", K_WRONG="hrma_case_wrong_v1", K_DONE="hrma_case_done_v1";
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var hintOn=true, paper=[], pi=0, ok=0, score=0, paperName="";
  var LETTERS="ABCD";

  function esc(t){return String(t).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  function load(k,d){ try{ var s=localStorage.getItem(k); return s?JSON.parse(s):d; }catch(e){ return d; } }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  function today(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
  function byId(id){ for(var i=0;i<BANK.length;i++){ if(BANK[i].id===id) return BANK[i]; } return null; }

  var wrongBook=load(K_WRONG,[]);
  function addWrong(id){ if(wrongBook.indexOf(id)<0){ wrongBook.push(id); save(K_WRONG,wrongBook); } }
  function removeWrong(id){ wrongBook=wrongBook.filter(function(x){return x!==id;}); save(K_WRONG,wrongBook); }

  function buildPaper(kind){
    var p=[];
    if(kind.indexOf("part:")===0){
      var nm=kind.slice(5);
      BANK.forEach(function(b){ if(b.part===nm) p.push(b.id); });
      paperName=nm;
    } else if(kind==="all"){ BANK.forEach(function(b){ p.push(b.id); }); paperName="全部 48 题"; }
    else if(kind==="rnd20"){
      var pool=BANK.map(function(b){return b.id;});
      for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
      p=pool.slice(0,20); paperName="随机 20 题";
    } else if(kind==="rnd30"){
      var pool2=BANK.map(function(b){return b.id;});
      for(var k=pool2.length-1;k>0;k--){ var j2=Math.floor(Math.random()*(k+1)); var t2=pool2[k]; pool2[k]=pool2[j2]; pool2[j2]=t2; }
      p=pool2.slice(0,30); paperName="随机 30 题";
    } else if(kind==="redo"){ p=wrongBook.slice(); paperName="重做错题"; }
    return p;
  }

  function play(kind){
    paper=buildPaper(kind);
    if(!paper.length){ alert("这一组暂时没有题目"); return; }
    pi=0; ok=0; score=0;
    $("vStart").style.display="none"; $("vEnd").style.display="none"; $("vPlay").style.display="";
    $("hTot").textContent=paper.length;
    $("hMode").className="cq-mode "+(hintOn?"teach":"chal");
    $("hMode").textContent=paperName;
    $("hScoreWrap").style.display = hintOn? "none":"";
    render();
  }

  function render(){
    var q=byId(paper[pi]);
    $("hNo").textContent=pi+1; $("hOk").textContent=ok; $("hScore").textContent=score;
    $("hBar").style.width=(pi/paper.length*100)+"%";
    $("qSrc").textContent="案例 "+q.no+"　"+esc(q.part);
    $("qCase").textContent=esc(q.ct);
    $("qText").textContent=q.q;
    $("qHint").textContent=q.take||"这个案例的可复用动作见案例集原文。";
    $("qHint").classList.remove("show");
    $("btnHint").style.display = hintOn? "":"none";
    $("noHint").style.display = hintOn? "none":"";
    $("qOpts").innerHTML=q.o.map(function(o,i){
      return '<button class="cq-o" data-i="'+i+'"><b>'+LETTERS[i]+'.</b>'+esc(o)+'</button>';
    }).join("");
    $("qFb").className="cq-fb"; $("qFb").innerHTML="";
    $("btnNext").classList.remove("show");
    $("btnNext").textContent = (pi===paper.length-1)? "查看成绩 →":"下一题 →";
    Array.prototype.forEach.call($("qOpts").querySelectorAll(".cq-o"),function(b){
      b.onclick=function(){ pick(parseInt(b.getAttribute("data-i"),10)); };
    });
  }

  function pick(i){
    var q=byId(paper[pi]);
    var right=(i===q.a);
    if(right){ ok++; if(!hintOn) score+=10; if(paperName==="重做错题") removeWrong(q.id); }
    else { addWrong(q.id); }
    Array.prototype.forEach.call($("qOpts").querySelectorAll(".cq-o"),function(b){
      var j=parseInt(b.getAttribute("data-i"),10);
      b.disabled=true;
      if(j===q.a) b.classList.add("right"); else if(j===i) b.classList.add("wrong");
    });
    var fb=$("qFb");
    fb.className="cq-fb show "+(right?"ok":"no");
    fb.innerHTML='<b>'+(right?"✓ 正确":"✗ 再想想")+'</b>　'+esc(q.e)+
      '<br><a class="go" data-go="cases-book.html#case'+q.no+'">读案例 '+q.no+' 原文 →</a>';
    var a=fb.querySelector("a[data-go]"); if(a) a.setAttribute("href",a.getAttribute("data-go"));
    $("hOk").textContent=ok; $("hScore").textContent=score;
    $("btnNext").classList.add("show");
  }

  $("btnHint").onclick=function(){ $("qHint").classList.toggle("show"); };
  $("btnNext").onclick=function(){
    if(pi<paper.length-1){ pi++; render(); return; }
    finish();
  };
  $("btnQuit").onclick=function(){ location.href="cases-book.html"; };

  function finish(){
    $("vPlay").style.display="none"; $("vEnd").style.display="";
    var tot=paper.length, pct=Math.round(ok/tot*100);
    var sc = ok*10;
    if(!hintOn) addRecord(paperName, ok, tot, ok*10);
    save(K_DONE, (load(K_DONE,0)||0)+1);
    var g,title,desc;
    if(pct>=90){g="S";title="情境判断已经很稳";desc="换个场景也判断得对，说明这些不是背下来的规则，而是真正理解了。下一步可以拿自家数据做一次收益健康自检，把能力落到自己的酒店上。";}
    else if(pct>=75){g="A";title="掌握扎实";desc="多数情境都能判断对。建议把答错的几题对应案例重读一遍，重点看「复盘」里「做错的是」那部分。";}
    else if(pct>=55){g="B";title="框架有了，取舍还要练";desc="案例题难在「两难」——不是不知道规则，而是不知道此刻该用哪条。建议重做一遍，这次先点提示。";}
    else {g="C";title="刚起步，正常";desc="情境判断靠的是见过足够多的局面。建议先读案例原文再做题，理解每个案例为什么那么决策。";}
    $("eHead").textContent=paperName+" 完成";
    $("eScore").textContent = hintOn ? (ok+" / "+tot+"　（"+pct+"%）　评级 "+g) : (sc+" / "+(tot*10)+" 分　（"+pct+"%）　评级 "+g);
    $("eTitle").innerHTML="<b>"+title+"</b>";
    $("eDesc").textContent=desc;
    var wl=load(K_WRONG,[]);
    if(wl.length){
      $("eWrong").innerHTML='<div class="cq-box w"><div class="h">错题本（'+wl.length+' 题）</div><ul>'+
        wl.slice(0,10).map(function(id){ var q=byId(id); return q? '<li><b>案例 '+q.no+'</b>　'+esc(q.ct)+'　<a data-go="cases-book.html#case'+q.no+'">看原文 →</a></li>':''; }).join("")+
        (wl.length>10? '<li>…还有 '+(wl.length-10)+' 题，回到开始页可「只重做错题」</li>':'')+'</ul></div>';
      Array.prototype.forEach.call($("eWrong").querySelectorAll("a[data-go]"),function(a){a.setAttribute("href",a.getAttribute("data-go"));});
    } else $("eWrong").innerHTML="";
  }

  function addRecord(name, okN, totN, sc){
    var rec=load(K_BEST,[]);
    rec.push({t:today(), m:name, ok:okN, tot:totN, s:sc});
    if(rec.length>30) rec=rec.slice(-30);
    save(K_BEST,rec);
  }

  function renderPapers(){
    var html="";
    PARTS.forEach(function(p){
      var n=BANK.filter(function(b){return b.part===p;}).length;
      html+='<button class="cq-mbtn" data-p="part:'+esc(p)+'"><div class="mt">'+esc(p)+'（'+n+' 题）</div>'+
            '<div class="md">该篇所有案例的练习题</div></button>';
    });
    html+='<button class="cq-mbtn" data-p="all"><div class="mt">全部 48 题</div><div class="md">一次做完，全面检验</div></button>';
    html+='<button class="cq-mbtn" data-p="rnd20"><div class="mt">随机 20 题</div><div class="md">每次不同，可反复测</div></button>';
    html+='<button class="cq-mbtn" data-p="rnd30"><div class="mt">随机 30 题</div><div class="md">更接近正式测验的题量</div></button>';
    html+='<button class="cq-mbtn" data-p="redo" id="mRedo" style="display:none"><div class="mt">只重做错题 <span id="mRedoN"></span></div><div class="md">答对后自动移出错题本</div></button>';
    $("papers").innerHTML=html;
    Array.prototype.forEach.call($("papers").querySelectorAll(".cq-mbtn"),function(b){
      b.onclick=function(){ play(b.getAttribute("data-p")); };
    });
  }

  function renderStart(){
    var n=wrongBook.length;
    var mr=$("mRedo"); if(mr){ mr.style.display=n?"":"none"; }
    var mn=$("mRedoN"); if(mn) mn.textContent=n?"（"+n+" 题）":"";
    var wb=$("wrongBox");
    if(n){
      wb.innerHTML='<div class="cq-box w"><div class="h">错题本（'+n+' 题）</div><ul>'+
        wrongBook.slice(0,10).map(function(id){ var q=byId(id); return q? '<li><b>案例 '+q.no+'</b>　'+esc(q.ct)+'　<a data-go="cases-book.html#case'+q.no+'">看原文 →</a></li>':''; }).join("")+
        (n>10? '<li>…还有 '+(n-10)+' 题</li>':'')+'</ul></div>';
      Array.prototype.forEach.call(wb.querySelectorAll("a[data-go]"),function(a){a.setAttribute("href",a.getAttribute("data-go"));});
    } else wb.innerHTML="";
    renderStat();
  }

  function renderStat(){
    var rec=load(K_BEST,[]), box=$("statBox");
    var doneN=load(K_DONE,0)||0;
    if(!rec.length){
      box.innerHTML = doneN? '<div class="cq-box s"><div class="h">已完成 '+doneN+' 组练习</div>'+
        '<div style="color:var(--ink-2)">教学模式不计分。切到<b>挑战模式</b>做一套，就会有成绩记录。</div></div>' : "";
      return;
    }
    var best=0,sum=0;
    rec.forEach(function(r){ if(r.s>best) best=r.s; sum+=r.s; });
    var avg=Math.round(sum/rec.length);
    var last=rec.slice(-12), W=280,H=52,pad=6;
    var vals=last.map(function(r){ return r.s||Math.round(r.ok/r.tot*r.tot*10); });
    var mx=Math.max.apply(null, vals.concat([1]));
    var pts=vals.map(function(v,i){
      var x=pad+(W-pad*2)*(vals.length>1? i/(vals.length-1):0.5);
      var y=H-pad-(v/mx)*(H-pad*2);
      return x.toFixed(1)+","+y.toFixed(1);
    }).join(" ");
    box.innerHTML='<div class="cq-box s"><div class="h">我的成绩（存在本机）</div>'+
      '<div class="row"><span><b>'+best+'</b>最佳分</span><span><b>'+avg+'</b>平均分</span><span><b>'+rec.length+'</b>次记录</span>'+
      '<span><b>'+doneN+'</b>组已完成</span></div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none" style="margin-top:8px">'+
      '<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#E1E5EA" stroke-width="1"/>'+
      '<polyline points="'+pts+'" fill="none" stroke="#1B3A5C" stroke-width="2"/>'+
      vals.map(function(v,i){ var x=pad+(W-pad*2)*(vals.length>1? i/(vals.length-1):0.5); var y=H-pad-(v/mx)*(H-pad*2);
        return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.2" fill="#B8894A"/>'; }).join("")+
      '</svg><div style="font-size:11.5px;color:var(--ink-3);margin-top:6px">最近 '+last.length+' 次成绩</div></div>';
  }

  $("tTeach").onclick=function(){ hintOn=true; $("tTeach").classList.add("on"); $("tChal").classList.remove("on"); };
  $("tChal").onclick=function(){ hintOn=false; $("tChal").classList.add("on"); $("tTeach").classList.remove("on"); };
  $("btnAgain").onclick=function(){ $("vEnd").style.display="none"; $("vStart").style.display=""; renderStart(); };

  renderPapers(); renderStart();
})();
</script>
