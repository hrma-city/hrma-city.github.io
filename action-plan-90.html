<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.HRMA_PREFIX="";</script>

<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>90 天收益提升行动生成器</title>
<style>
:root{--o:#F97316;--od:#EA580C;--soft:#fff7ed;--navy:#0f2a4a;--navy2:#1d4e7e;--ink:#1f2937;--mut:#5b6a7d;--line:#e3e9f1;--page:#f4f7fb;--g:#16a34a;--r:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--ink)}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px 0 20px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.top .kick{font-size:12px;color:#f5d78e;letter-spacing:1px;margin-bottom:6px}
.top h1{font-size:26px;line-height:1.35;margin-bottom:6px}
.top p{color:#c9d8ea;font-size:13.5px;max-width:640px}
main{max-width:860px;margin:0 auto;padding:24px 20px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px}
h2{font-size:18px;color:var(--navy);margin-bottom:10px}
h3{font-size:15px;color:var(--navy);margin:14px 0 8px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
select,input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
.btn{display:inline-block;background:var(--o);color:#fff;border:0;border-radius:9px;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit;margin:6px 6px 0 0}
.btn:hover{background:var(--od)}
.btn.ghost{background:#fff;color:var(--o);border:1px solid var(--o)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.hide{display:none}
.tag{display:inline-block;background:var(--soft);color:var(--od);border:1px solid #fcd9b6;border-radius:20px;padding:3px 11px;font-size:12px;margin:2px 4px 2px 0}
.note{background:#fffbe8;border:1px solid #f5d78e;border-radius:9px;padding:10px 13px;font-size:12.5px;color:#7a5b00;margin-top:12px}
.out{background:var(--soft);border:1px dashed var(--o);border-radius:11px;padding:16px 18px;margin-top:14px;white-space:pre-wrap;line-height:1.85;font-size:14px}
.back{display:inline-block;margin-top:8px;color:var(--mut);font-size:12.5px;text-decoration:none}
.back:hover{color:var(--o)}
@media(max-width:600px){.top h1{font-size:21px}.card{padding:18px 16px}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
<div class="kick">RMC 收益管理社区 · 免费工具</div>
<h1>90 天收益提升行动生成器</h1>
<p id="topdesc"></p>
</div></div>
<main><div class="card"><h2>回答 4 个问题，生成一份可执行提升计划</h2><p class="sub">不谈空泛理论，直接给分阶段动作 + 对应教材章节 + 该看哪张表。</p><label>你的业态</label><select id="biz"><option>城市商务酒店</option><option>度假酒店</option><option>民宿/公寓</option><option>会展/赛事酒店</option></select><label>当前最大痛点</label><select id="pain"><option value="occ">出租率上不去</option><option value="adr">房价提不动</option><option value="channel">渠道成本高/价格倒挂</option><option value="process">没有日常流程，靠感觉</option><option value="data">数据乱，看不懂</option></select><label>团队收益管理基础</label><select id="level"><option value="new">刚起步</option><option value="some">有些基础</option><option value="good">比较成熟</option></select><label>主要客源</label><select id="guest"><option>商务散客为主</option><option>休闲/游客为主</option><option>团队/会议为主</option><option>混合</option></select><div style="margin-top:14px"><button class="btn" onclick="gen()">生成我的 90 天计划 →</button></div></div><div class="card hide" id="out"></div><script>
const CH=[{"n": 1, "title": "收益管理是什么：一句话与底层逻辑"}, {"n": 2, "title": "三个核心指标：OCC、ADR、RevPAR"}, {"n": 3, "title": "竞争三件套：MPI、ARI、RGI"}, {"n": 4, "title": "价格弹性：降多少价能换多少量"}, {"n": 5, "title": "什么时候涨价"}, {"n": 6, "title": "竞品降价：跟还是不跟"}, {"n": 7, "title": "竞争博弈：从「跟不跟价」到「对方下一期会怎么反应」"}, {"n": 8, "title": "折扣与促销：什么时候该让"}, {"n": 9, "title": "套餐与锚定：让客人觉得划算"}, {"n": 10, "title": "房型价差：差价定多少才合理"}, {"n": 11, "title": "最短住期 MinLOS：用条件把客群分开"}, {"n": 12, "title": "超额预订：卖出去的比有的多"}, {"n": 13, "title": "库存分配与保护位：给谁留多少房"}, {"n": 14, "title": "渠道净价：到手多少钱才算数"}, {"n": 15, "title": "渠道组合战略：不是逐个算净价，是解一个带约束的配置问题"}, {"n": 16, "title": "客源细分：把客人分成几堆来卖"}, {"n": 17, "title": "客户终身价值：把一晚的决策放到一段关系里"}, {"n": 18, "title": "团队置换：这个团该不该接"}, {"n": 19, "title": "直销与会员：把客人变成自己的"}, {"n": 20, "title": "运营全景：从年到日的节奏"}, {"n": 21, "title": "每日实操流程：一天具体做什么"}, {"n": 22, "title": "执行标准与收益例会"}, {"n": 23, "title": "预测与需求日历"}, {"n": 24, "title": "需求创造：收益不是分蛋糕，是把蛋糕做大"}, {"n": 25, "title": "年度预算：把一年拆到每天"}, {"n": 26, "title": "价格体系 BAR：所有价格的锚"}, {"n": 27, "title": "报表体系：每天该看哪几张表"}, {"n": 28, "title": "OTA 与点评：评分就是价格"}, {"n": 29, "title": "岗位与组织：谁来干这件事"}, {"n": 30, "title": "成本与利润：降价的底线在哪"}, {"n": 31, "title": "系统与数据：工具能替您做什么"}, {"n": 32, "title": "淡旺季与事件日：一年里最容易赚的钱"}, {"n": 33, "title": "餐饮收益：RevPASH 与翻台"}, {"n": 34, "title": "会议宴会：不只算房，算总贡献"}, {"n": 35, "title": "其他业态与跨行业参数"}, {"n": 36, "title": "常见误区：30 个坑，别再踩"}, {"n": 37, "title": "中国渠道生态：平台、私域、买断与直播"}, {"n": 38, "title": "连锁与中央预订：总部定价，门店做什么"}, {"n": 39, "title": "AI 工具做收益分析"}, {"n": 40, "title": "生成式 AI 与优化：把 AI 放在校验链里，不放在决策位上"}, {"n": 41, "title": "危机与极端场景"}, {"n": 42, "title": "收益岗位与职业发展"}, {"n": 43, "title": "变革篇：收益管理正在发生的五件事"}, {"n": 44, "title": "周期与不确定性下的收益管理"}, {"n": 45, "title": "人工智能与收益管理（科普）"}, {"n": 46, "title": "绿色收益管理与可持续"}];
const PAIN={
 occ:{title:'提升出租率',phases:[
  ['第 1–30 天 · 看清现状',['建立每日 pickup 跟踪，记录预订速度','梳理竞争组合，每周比价 3 次','把 OCC 按渠道、客源拆开看'],[2,3,23,27]],
  ['第 31–60 天 · 精准放量',['淡季日用限量折扣 + MinLOS 拉开客群','针对慢速日做私域/会员定向推送','用保护位给高价值客源留房'],[8,11,13,19]],
  ['第 61–90 天 · 稳定机制',['把有效动作写进每日收益例会','用需求日历提前排布淡旺季','复盘 OCC 变化，固化到 SOP'],[21,22,23]]]},
 adr:{title:'把房价提上去',phases:[
  ['第 1–30 天 · 建立价格锚',['理清 BAR 价格体系，堵住低价漏洞','算清各类房型价差是否合理','核对各渠道价格一致性'],[10,26,14]],
  ['第 31–60 天 · 分步提价',['按需求日历在高峰日小步提价','用套餐与锚定抬高感知价值','旺季配合 MinLOS 和关低价渠道'],[5,9,11,32]],
  ['第 61–90 天 · 弹性验证',['用历史数据校准价格弹性','把提价节奏做成规则表','跟踪 ADR 与 RevPAR 同步变化'],[4,6,27]]]},
 channel:{title:'优化渠道与净价',phases:[
  ['第 1–30 天 · 算清净价',['逐渠道算到手净价与成本率','找出价格倒挂的渠道','梳理直销与会员占比'],[14,19]],
  ['第 31–60 天 · 调整组合',['按净价重排渠道开关优先级','对高成本渠道设配额上限','加强直销与私域引流'],[15,16,37]],
  ['第 61–90 天 · 持续监控',['建立渠道周报，盯成本率变化','维护价格一致性规则','评估 OTA 评分对价格的影响'],[28,27]]]},
 process:{title:'建立日常决策流程',phases:[
  ['第 1–30 天 · 搭框架',['明确每天必看的几张表','建立首张每日调价判定表','固定一个 15 分钟收益例会'],[20,21,22]],
  ['第 31–60 天 · 跑起来',['按流程执行并留痕，记录每次动作','用偏差触发动作，不凭感觉','把常见场景补成判定表'],[27,21]],
  ['第 61–90 天 · 标准化',['整理成岗位 SOP 与检查清单','复盘流程漏洞并迭代','把工具沉淀给团队共用'],[22,29]]]},
 data:{title:'让数据说话',phases:[
  ['第 1–30 天 · 打基础',['搞懂 OCC/ADR/RevPAR 的定义与算法','统一报表口径与数据源','做一张核心指标速查卡'],[1,2,27]],
  ['第 31–60 天 · 建体系',['搭起竞争指数 MPI/ARI/RGI 的跟踪','用需求日历做滚动预测','把报表固化成每日模板'],[3,23,25]],
  ['第 61–90 天 · 用起来',['用数据触发调价与库存动作','尝试用 AI 辅助分析（校验而非决策）','形成数据驱动的例会文化'],[39,40,22]]]}
};
function gen(){
  const pain=document.getElementById('pain').value, level=document.getElementById('level').value, biz=document.getElementById('biz').value, guest=document.getElementById('guest').value;
  const p=PAIN[pain];
  let html=`<h2>你的 90 天提升计划</h2><p class="sub">业态：${biz} · 痛点：${p.title} · 客源：${guest} · 基础：${{new:'刚起步',some:'有些基础',good:'比较成熟'}[level]}</p>`;
  p.phases.forEach((ph,i)=>{
    html+=`<div class="card" style="margin:12px 0;background:var(--soft)"><h3 style="margin-top:0">${ph[0]}</h3>
      <ol style="padding-left:20px;font-size:14px">${ph[1].map(a=>`<li style="margin:5px 0">${a}</li>`).join('')}</ol>
      <div style="margin-top:8px"><b style="font-size:12.5px;color:var(--mut)">配套学习：</b>${ph[2].map(n=>{const c=CH.find(x=>x.n===n);return c?`<span class="tag">第${n}章</span>`:''}).join('')}</div></div>`;
  });
  html+=`<div class="note">这是一份通用起点。落地时请把每个动作换成你店里的具体数字和责任人——计划的价值在执行，不在文档。</div>
   <div style="margin-top:12px"><button class="btn" onclick="window.print()">打印 / 保存 PDF</button></div>`;
  document.getElementById('out').classList.remove('hide');
  document.getElementById('out').innerHTML=html;
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
}
</script>
<div style="text-align:center;margin-top:26px">

</div>
</main>

</body>
</html>
