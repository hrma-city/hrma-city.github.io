<script>
const byId = id => JT.find(r=>r.id===id);
const msgs = document.getElementById('msgs'), quick = document.getElementById('quick'), inp = document.getElementById('inp');
const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function trunc(s,n){ s=String(s); return s.length>n? s.slice(0,n)+'…' : s; }

function coachSay(html, qr){
  const d=document.createElement('div'); d.className='row';
  const b=document.createElement('div'); b.className='bubble coach'; b.innerHTML=html;
  d.appendChild(b); msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
  renderQuick(qr||[]);
}
function userSay(text){
  const d=document.createElement('div'); d.className='row';
  const b=document.createElement('div'); b.className='bubble user'; b.textContent=text;
  d.appendChild(b); msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
}
function renderQuick(list){
  if(!list || !list.length) return;   // 空列表不清除已渲染的快捷入口（避免上一条 coachSay 把入口冲掉）
  quick.innerHTML='';
  list.forEach(it=>{
    const c=document.createElement('span'); c.className='qchip'+(it.m?' m':''); c.textContent=it.label; c.title=it.label;
    c.onclick=()=>onPick(it); quick.appendChild(c);
  });
}
function onPick(it){
  if(it.mode){ startMode(it.mode); return; }
  if(it.value==='@restart'){ restart(); return; }
  if(it.value.startsWith('@table:')){ showTable(byId(it.value.slice(7))); return; }
  if(it.value.startsWith('@teach:')){ showTeach(TEACH[parseInt(it.value.slice(7),10)]); return; }
  if(it.value.startsWith('@quiz:')){ showQuiz(parseInt(it.value.slice(6),10)); return; }
  if(it.value==='@quizmore'){ quizMore(); return; }
  if(it.value.startsWith('@quiztopic:')){ quizByTopic(it.value.slice(11)); return; }
}

// ---- 模式引导 ----
function startMode(mode){
  if(mode==='teach'){
    state={mode:'teach'};
    coachSay('好，我们聊<b>「怎么讲」</b>。选一个你想备的专题，或直接说出你的困惑（如「超售那节怎么讲学生才有感觉？」）。',
      TEACH.map((t,i)=>({label:t.k, value:'@teach:'+i})).concat([{label:'查看全部专题', value:'@teach:-1'}]));
  } else if(mode==='table'){
    state={mode:'table'};
    coachSay('好，我们聊<b>「查哪张表」</b>。把情境用一句话告诉我（如「竞品降价30%让学生查哪张表？」），或直接选领域：',
      DOMAIN_LABELS.map(d=>({label:d, value:'@domain:'+d})));
  } else if(mode==='quiz'){
    state={mode:'quiz', list:[]};
    coachSay('好，我们聊<b>「这道题」</b>。点一个专题看典型题，或直接在输入框搜关键词 / 写章节号（如「超售」「第7章」）。',
      TEACH.map((t,i)=>({label:t.k, value:'@quiztopic:'+i})));
  }
}

// ---- 查哪张表 ----
function domainOf(q){
  for(const k in CUES){ if(q.includes(k)) return byId(CUES[k]); }
  return null;
}
function showTable(rec){
  let h='你该让学生查 <b>'+rec.code+' '+rec.title+'</b>（'+rec.domain+'）。<br><br>';
  h+='<b>适用场景：</b>'+esc(rec.scene)+'<br>';
  h+='<b>决策逻辑：</b>'+esc(rec.logic)+'<br>';
  h+='<b>查表路径（让学生一步步走）：</b>'+esc(rec.path)+'<br><br>';
  h+='<b>依据 / 红线：</b>'+esc(rec.basis)+(rec.pitfalls?('；<span style="color:#c0503f">'+esc(rec.pitfalls)+'</span>'):'');
  h+='<br><br><span class="note">对应教材：'+esc(rec.ch)+'。想让学生亲手查表演练，打开『判定表决策引擎』做完整交互。</span>';
  coachSay(h);
  const rel=(rec.rel||[]).map(id=>({label:'关联 '+id.replace('JT-','表 '), value:'@table:'+id}));
  rel.push({label:'打开判定表引擎', value:'@eng'});
  rel.push({label:'换领域', value:'@restart'});
  coachSay('还想看哪张表，或换个情境？', rel);
}
function showEngine(){
  userSay('打开判定表引擎');
  coachSay('判定表决策引擎（15 张表完整交互，含矩阵/行表/步骤表与决策输出）在这里：<br><a class="src" href="jt-engine.html">表 A–O 完整引擎 →</a>　<a class="src" href="jt-coach.html">实战教练（对话版）→</a>');
  coachSay('那是给学生/酒店人亲手查表练手的地方；教师用它做课堂演示也很好。还要备点别的吗？', [{label:'换个情境', value:'@restart'},{label:'怎么讲', value:'@mode:teach'},{label:'这道题', value:'@mode:quiz'}]);
}

// ---- 怎么讲 ----
function showTeach(t){
  if(!t){ // 全部
    let h='<b>全部备课专题（点任一可再展开）：</b><ol>';
    TEACH.forEach((x,i)=>{ h+='<li><a class="src" href="javascript:void(0)" onclick="showTeach(TEACH['+i+'])">'+esc(x.k)+'</a> · '+esc(x.ch)+'</li>'; });
    h+='</ol>';
    coachSay(h);
    return;
  }
  let h='<b>「'+esc(t.k)+'」怎么讲</b>（'+esc(t.ch)+'）<br><br>';
  h+='<b>学生最容易误解：</b>'+esc(t.mist)+'<br><br>';
  h+='<b>课堂纠错动作：</b>'+esc(t.fix);
  if(t.rel && t.rel.length){ h+='<br><br><span class="note">关联判定表：'+t.rel.map(r=>'<a class="src" href="javascript:void(0)" onclick="showTable(byId(\''+r+'\'))">'+r.replace('JT-','表 ')+'</a>').join(' ')+'</span>'; }
  h+='<br><br><span class="note">出处：教材'+esc(t.ch)+'。可点上方关联判定表，让学生边查表边学。</span>';
  coachSay(h);
  coachSay('还想备哪个专题？', TEACH.map((x,i)=>({label:x.k, value:'@teach:'+i})));
}

// ---- 这道题 ----
let quizAll = (window.HRMA_QUIZ || []);
function quizByTopic(idx){
  const k = TEACH[idx].k;
  // 在题干/解析里搜该专题关键词
  const hits = quizAll.map((q,i)=>({q,i})).filter(o=>{
    const s=(o.q.stem+' '+o.q.exp+' '+o.q.ch).toLowerCase();
    return s.includes(k.toLowerCase()) || o.q.ch === TEACH[idx].ch.match(/第\d+章/);
  });
  showQuizList(hits, '专题「'+k+'」');
}
function quizSearch(text){
  const t=text.trim().toLowerCase();
  if(!t) return [];
  return quizAll.map((q,i)=>({q,i})).filter(o=>{
    const chMatch = /^第?\s*\d+\s*章?$/.test(t) ? ('第'+t.replace(/[^0-9]/g,'')+'章') : null;
    if(chMatch && o.q.ch===chMatch) return true;
    return (o.q.stem+' '+o.q.exp+' '+o.q.ch).toLowerCase().includes(t);
  });
}
function showQuizList(hits, title){
  if(!hits.length){ coachSay('题库里暂时没有匹配「'+esc(title)+'」的题。换个关键词，或点其它专题。', TEACH.map((x,i)=>({label:x.k, value:'@quiztopic:'+i}))); return; }
  state.list = hits;
  let h='<b>'+esc(title)+'</b> 命中 <b>'+hits.length+'</b> 道（点一道看答案与解析）：<ol>';
  hits.slice(0,30).forEach((o,si)=>{
    h+='<li><a class="src" href="javascript:void(0)" onclick="showQuiz('+o.i+')">'+esc(trunc(o.q.stem,40))+'</a> <span style="color:#5b6a7d;font-size:12px">('+esc(o.q.ch)+')</span></li>';
  });
  h+='</ol>';
  if(hits.length>30) h+='<span class="muted">仅显示前 30 道，可在输入框继续搜。</span>';
  coachSay(h);
}
function quizMore(){
  const hits=state.list||[];
  coachSay('可继续在输入框搜关键词 / 章节号，查看更多题。');
}
function showQuiz(i){
  const q=quizAll[i]; if(!q){ coachSay('该题暂无数据。'); return; }
  let h='<b>'+esc(q.stem)+'</b><br><span style="color:#5b6a7d;font-size:12.5px">（'+esc(q.ch)+' · 题型 '+esc(q.type||'')+'）</span><br><br>';
  h+='<b>选项：</b><ol style="margin-top:4px">';
  (q.opts||[]).forEach((o,oi)=>{ h+='<li'+(o===q.ans?' style="color:#2a9d5f;font-weight:700"':'')+'>'+esc(o)+(o===q.ans?' ✓ 答案':'')+'</li>'; });
  h+='</ol><br>';
  h+='<b>解析 / 出处：</b><div style="background:#f4f7fb;border-left:3px solid #3d8bd4;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:4px">'+esc(q.exp)+'</div>';
  coachSay(h);
  coachSay('这道题讲完，还想看？', [
    {label:'再搜一题', value:'@mode:quiz'},
    {label:'看关联备课', value:'@teach:'+Math.max(0, TEACH.findIndex(t=>q.ch.indexOf(t.ch.match(/第\d+章/))>=0))},
    {label:'换模式', value:'@restart'}
  ]);
}

// ---- 自由文本路由 ----
function classify(text){
  if(text.includes('怎么讲')||text.includes('怎么教')||text.includes('学生听不懂')||text.includes('误解')||text.includes('误区')||text.includes('上课')||text.includes('课堂')) return 'teach';
  if(text.includes('这道题')||text.includes('答案')||text.includes('解析')||text.includes('为什么是')||text.includes('选')&&text.includes('题')) return 'quiz';
  if(text.includes('查哪张表')||text.includes('查表')||text.includes('哪张表')||text.includes('让学生')) return 'table';
  return null;
}
function handleUser(text){
  const forced = classify(text);
  // 这道题：命中题库
  const hits = quizSearch(text);
  if((forced==='quiz' || (hits.length && !forced)) && hits.length){
    state={mode:'quiz', list:hits};
    coachSay('我在题库里找到 '+hits.length+' 道相关题：');
    showQuizList(hits, text);
    return;
  }
  if(forced==='teach'){
    state={mode:'teach'};
    const t = TEACH.find(x=>text.includes(x.k)) || TEACH.find(x=>(x.ch||'').includes(text.replace(/章.*/,'')));
    if(t){ showTeach(t); }
    else { coachSay('你想备哪个专题？点一个，或直接说（如「超售那节怎么讲」）：', TEACH.map((x,i)=>({label:x.k, value:'@teach:'+i}))); }
    return;
  }
  // 查哪张表
  const rec = domainOf(text);
  if(rec){ state={mode:'table'}; showTable(rec); return; }
  if(forced==='table'){ state={mode:'table'}; coachSay('这个情境我没能定位到具体表，先选个领域：', DOMAIN_LABELS.map(d=>({label:d, value:'@domain:'+d}))); return; }
  // 兜底：给三模式
  coachSay('我能帮你备三类问题，选一个开始：', [
    {label:'怎么讲（教学法）', value:'@mode:teach', m:true},
    {label:'查哪张表（工具）', value:'@mode:table', m:true},
    {label:'这道题（题库）', value:'@mode:quiz', m:true}
  ]);
}
// @domain: 在查表模式下选领域 → 列出该领域所有表
function showDomainTables(dom){
  const list=JT.filter(r=>r.domain===dom);
  if(!list.length){ coachSay('这一类暂无对应判定表，换一个：', DOMAIN_LABELS.map(d=>({label:d, value:'@domain:'+d}))); return; }
  coachSay('「'+dom+'」相关的判定表有这几张，点一张讲查表路径：', list.map(r=>({label:r.id.replace('JT-','表 ')+'·'+trunc(r.title,10), value:'@table:'+r.id})));
}

// ---- 输入 ----
document.getElementById('send').onclick=()=>{
  const v=inp.value.trim(); if(!v) return; userSay(v); inp.value=''; handleUser(v);
};
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ document.getElementById('send').click(); } });
document.getElementById('restart').onclick=restart;

// onPick 扩展：@mode / @domain / @eng
const _onPick = onPick;
onPick = function(it){
  if(it.value==='@eng'){ showEngine(); return; }
  if(it.value.startsWith('@mode:')){ startMode(it.value.slice(6)); return; }
  if(it.value.startsWith('@domain:')){ showDomainTables(it.value.slice(8)); return; }
  if(it.value.startsWith('@quiztopic:')){ quizByTopic(parseInt(it.value.slice(11),10)); return; }
  if(it.value.startsWith('@teach:') && it.value.slice(7)==='-1'){ showTeach(null); return; }
  _onPick(it);
};

function restart(){
  state={mode:null};
  coachSay('你好，我是<b>教学教练</b>——你的收益管理备课分身。回答都带出处（章节 / 判定表号 / 题库），你可以放心拿来准备课堂。');
  coachSay('你想备哪一类？点一个，或直接把问题打给我。', [
    {label:'怎么讲（教学法）', value:'@mode:teach', m:true},
    {label:'查哪张表（工具）', value:'@mode:table', m:true},
    {label:'这道题（题库）', value:'@mode:quiz', m:true}
  ]);
  coachSay('示例：「超售那节怎么讲学生才有感觉？」「竞品降价30%让学生查哪张表？」「这道题答案为什么是B？」');
}
let state={mode:null};
restart();
</script>
