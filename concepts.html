<script>
var CP_DATA = [{"cid": "c3", "cat": "found", "zh": "平均房价", "en": "ADR", "def": "客房总收入 ÷ 已售房数。衡量“卖得贵不贵”，和入住率一起决定 RevPAR。", "video": "c3", "anchor": null, "more": null, "tag": "基础", "no": 1}, {"cid": "c11", "cat": "metric", "zh": "ARI", "en": "Average Rate Index", "def": "价格指数 = 本店 ADR ÷ 竞组平均 ADR。>100 表示卖得比对手贵，要结合 MPI 一起看。", "video": "c11", "anchor": "codex.html#table-c", "more": "calc-templates.html#ari", "tag": "指标", "no": 2}, {"cid": "c24", "cat": "fcst", "zh": "提前期", "en": "Booking Lead Time", "def": "从预订到实际使用（入住/起飞/出诊）的间隔。提前期越长计划性越强、价格越不敏感；越临近越急、越肯出价。", "video": "c24", "anchor": null, "more": null, "tag": "预测", "no": 3}, {"cid": "c31", "cat": "chan", "zh": "渠道管理", "en": "Channel Management", "def": "不同渠道成本不同（直订最便宜、OTA 有佣金）。渠道管理就是分配各渠道房量与价，让净收益最大。", "video": "c31", "anchor": null, "more": null, "tag": "渠道", "no": 4}, {"cid": "c33", "cat": "chan", "zh": "竞争响应", "en": "Competitive Response", "def": "对手降价别慌：先看自己定位与客群敏感度，差异化守住，只对有价格敏感的部分局部跟，不盲跟。", "video": "c33", "anchor": null, "more": null, "tag": "竞争", "no": 5}, {"cid": "c8", "cat": "chan", "zh": "竞品对标组", "en": "Competitive Set", "def": "选 3–5 家最可比的竞争对手组成一个组，用来算 ARI、MPI、RGI，判断自己相对市场的位置。", "video": "c8", "anchor": null, "more": null, "tag": "竞争", "no": 6}, {"cid": "c25", "cat": "fcst", "zh": "需求曲线", "en": "Demand Curve", "def": "价格与需求的反向关系：价越高需求越少。收益管理的目标不是最高价，而是总收入最大的那个价。", "video": "c25", "anchor": null, "more": null, "tag": "预测", "no": 7}, {"cid": "c5", "cat": "fcst", "zh": "需求预测", "en": "Demand Forecasting", "def": "基于历史、在手预订、节假日与事件，判断未来各日期会有多少需求，是所有调价与房量动作的前提。", "video": "c5", "anchor": null, "more": null, "tag": "预测", "no": 8}, {"cid": "c28", "cat": "price", "zh": "差别定价", "en": "Differential Pricing", "def": "同一种库存，对不同细分（渠道/提前期/弹性）卖不同价，把每间房卖到它肯出的价；前提是不引起客诉与渠道冲突。", "video": "c28", "anchor": null, "more": null, "tag": "定价", "no": 9}, {"cid": "c17", "cat": "inv", "zh": "置换分析", "en": "Displacement Analysis", "def": "比较同一房量给不同客源的净收益，把房留给净收益最高的客源；是超额预订与关低价决策的依据。", "video": "c17", "anchor": null, "more": "calc-templates.html#displacement", "tag": "库存", "no": 10}, {"cid": "o4", "cat": "price", "zh": "动态调价", "en": "Dynamic Pricing", "def": "根据需求、库存与竞争，持续调整价格，而不是一年不变价。涨满房靠它，淡季保价也靠它。", "video": "o4", "anchor": null, "more": null, "tag": "定价", "no": 11}, {"cid": "c26", "cat": "price", "zh": "早鸟价", "en": "Early Bird", "def": "用折扣换“提前锁定”：先把远期库存卖出去、回笼资金，把临近的高价库存留给临时客。", "video": "c26", "anchor": null, "more": null, "tag": "定价", "no": 12}, {"cid": "c22", "cat": "found", "zh": "固定产能", "en": "Fixed Capacity", "def": "酒店的房、邮轮的舱、医生的号，短期几乎无法增加。产能锁死，只能把现有产能卖给更值钱的人。", "video": "c22", "anchor": null, "more": null, "tag": "基础", "no": 13}, {"cid": "c14", "cat": "metric", "zh": "GOPPAR", "en": "GOP per Available Room", "def": "每可售房经营毛利 =（收入−运营成本）÷ 可售房，扣掉人工/能耗/物料后的真赚，反映经营效率。", "video": "c14", "anchor": null, "more": "calc-templates.html#goppar", "tag": "指标", "no": 14}, {"cid": "c27", "cat": "price", "zh": "尾单甩卖", "en": "Last-minute Sale", "def": "临近使用还有空房，空着也是归零——尾单甩卖哪怕低价也要尽量收回变动成本，优先覆盖变动成本。", "video": "c27", "anchor": null, "more": null, "tag": "定价", "no": 15}, {"cid": "c10", "cat": "metric", "zh": "MPI", "en": "Market Penetration Index", "def": "市场渗透指数 = 本店入住率 ÷ 竞组平均入住率。>100 表示抢到了比对手更多的份额。", "video": "c10", "anchor": "codex.html#table-d", "more": "calc-templates.html#mpi", "tag": "指标", "no": 16}, {"cid": "c6", "cat": "fcst", "zh": "市场细分", "en": "Market Segmentation", "def": "把客户按渠道、价格敏感度、预订提前期等分成若干类，对不同细分定不同价、给不同库存。", "video": "c6", "anchor": null, "more": null, "tag": "预测", "no": 17}, {"cid": "c30", "cat": "inv", "zh": "嵌套式库存控制", "en": "Nested Inventory Control", "def": "库存按价格从高到低嵌套开放：先卖高价房类，卖不动再放低一档，确保不把高价房低价卖掉。", "video": "c30", "anchor": null, "more": null, "tag": "库存", "no": 18}, {"cid": "c15", "cat": "metric", "zh": "NRevPAR", "en": "Net RevPAR", "def": "净可售房收入 =（房收入−佣金/渠道费）÷ 可售房，揭示不同渠道的真实净贡献，直订高于 OTA。", "video": "c15", "anchor": null, "more": "calc-templates.html#nrevpar", "tag": "指标", "no": 19}, {"cid": "c18", "cat": "inv", "zh": "No-show / 取消", "en": "No-show & Cancellation", "def": "No-show 率＝预订了却未到店的比例；取消率＝预订后又取消的比例。两者是超额预订与房量决策的地基。", "video": "c18", "anchor": null, "more": null, "tag": "库存", "no": 20}, {"cid": "c2", "cat": "found", "zh": "入住率", "en": "Occupancy (OCC)", "def": "已售房数 ÷ 可售房数。衡量“卖了多少”，是收益管理最基础的饱和指标。", "video": "c2", "anchor": null, "more": null, "tag": "基础", "no": 21}, {"cid": "c32", "cat": "chan", "zh": "OTA 与直订", "en": "OTA vs Direct", "def": "OTA 带来客源但有佣金，直订零佣金却要自己引流。两端搭配：用直订提净收益、用 OTA 补量，价格一致性是底线。", "video": "c32", "anchor": null, "more": null, "tag": "渠道", "no": 22}, {"cid": "o3", "cat": "inv", "zh": "超额预订", "en": "Overbooking", "def": "预计会有“订了不来/提前退房”的空房，故意多卖几间，把空置损失降到最低；但要控 walk-in 风险。", "video": "o3", "anchor": null, "more": null, "tag": "库存", "no": 23}, {"cid": "c21", "cat": "found", "zh": "易逝库存", "en": "Perishable Inventory", "def": "房晚、舱位、号源、车位等，今天卖不掉明天价值归零——这是收益管理存在的根本原因，必须在有效期内卖出。", "video": "c21", "anchor": null, "more": null, "tag": "基础", "no": 24}, {"cid": "c7", "cat": "fcst", "zh": "价格弹性", "en": "Price Elasticity", "def": "需求量随价格变动的敏感程度。弹性大的客群提价会跑光，弹性小的客群可以涨。", "video": "c7", "anchor": null, "more": null, "tag": "预测", "no": 25}, {"cid": "c40", "cat": "price", "zh": "调价台账", "en": "Pricing Log", "def": "每次调价都要登记：依据哪张表、改了什么价、实际与预期差多少，用于事后复盘命中率、沉淀经验。", "video": "c40", "anchor": "codex.html#table-a", "more": null, "tag": "定价", "no": 26}, {"cid": "c36", "cat": "ind", "zh": "RASK（航空）", "en": "RASK · Airline", "def": "每座位公里收入 = 总收入 ÷ 可用座位公里（ASK）。座公里=座位×飞行公里，衡量单位运力产出。", "video": "c36", "anchor": null, "more": null, "tag": "跨行业", "no": 27}, {"cid": "c19", "cat": "price", "zh": "价格一致性", "en": "Rate Parity", "def": "同一房型在各渠道挂牌价（含含税总价）必须一致，否则客人比价后流失、伤品牌，是渠道管理红线。", "video": "c19", "anchor": "codex.html#table-h", "more": null, "tag": "定价", "no": 28}, {"cid": "o1", "cat": "price", "zh": "价格体系 / BAR", "en": "Rate Structure / BAR", "def": "以基准 BAR 为锚，按房型、渠道、提前期展开的完整价格阶梯，保证价差合理、不互相打架。BAR 是当日散客公开渠道可售的最高弹性房价。", "video": "o1", "anchor": null, "more": null, "tag": "定价", "no": 29}, {"cid": "c12", "cat": "metric", "zh": "RGI", "en": "Revenue Generation Index", "def": "综合收益指数 = 本店 RevPAR ÷ 竞组平均 RevPAR，是量价合一的最终竞争力指标。", "video": "c12", "anchor": "codex.html#table-d", "more": null, "tag": "指标", "no": 30}, {"cid": "c1", "cat": "found", "zh": "收益管理", "en": "Revenue Management", "def": "在正确的时间、把正确的库存、以正确的价格、卖给正确的客户，追求整体收益最大化，而非单笔售价最高。", "video": "c1", "anchor": null, "more": null, "tag": "基础", "no": 31}, {"cid": "c4", "cat": "found", "zh": "RevPAR", "en": "Revenue per Available Room", "def": "每可售房收入 = 客房总收入 ÷ 可售房数 = 入住率 × 平均房价。综合反映“量价”结果，是酒店最核心的收益指标。", "video": "c4", "anchor": null, "more": null, "tag": "基础", "no": 32}, {"cid": "c39", "cat": "ind", "zh": "RevPAA（医疗号源）", "en": "RevPAA · Appointment", "def": "单号产出 = 总营收 ÷ 可用号源。号源=库存、医生时段=房、号别=房型、No-show=爽约，医疗版 RevPAR。", "video": "c39", "anchor": null, "more": "tools.html#medical-appointment", "tag": "跨行业", "no": 33}, {"cid": "c34", "cat": "ind", "zh": "RevPAC（邮轮）", "en": "RevPAC · Cruise", "def": "单舱产出 =（船票+岸上餐饮）×已售 ÷ 可用舱位夜。舱位=房、航次=连住、套舱=房型，邮轮版 RevPAR。", "video": "c34", "anchor": null, "more": "tools.html#cruise", "tag": "跨行业", "no": 34}, {"cid": "c37", "cat": "ind", "zh": "RevPAS（研学营地）", "en": "RevPAS · Camp", "def": "单营位产出 =（营费+餐饮）×已售 ÷ 可用营位夜。营位=房、营期=连住、批次=档期，营地版 RevPAR。", "video": "c37", "anchor": null, "more": "tools.html#research-camp", "tag": "跨行业", "no": 35}, {"cid": "c35", "cat": "ind", "zh": "RevPASH（餐饮）", "en": "RevPASH · F&B", "def": "每餐位每小时收入 = 营收 ÷ 餐位 ÷ 营业小时。翻台率×客单价，是餐饮收益管理的核心指标。", "video": "c35", "anchor": null, "more": null, "tag": "跨行业", "no": 36}, {"cid": "c38", "cat": "ind", "zh": "RevPAT（租车）", "en": "RevPAT · Car Rental", "def": "单车产出 = 总营收 ÷ 可用车辆·天。车=房、租期=连住、车型=房型，租车版 RevPAR。", "video": "c38", "anchor": null, "more": "tools.html#car-rental", "tag": "跨行业", "no": 37}, {"cid": "ca", "cat": "codex", "zh": "表A 每日调价判定", "en": "Table A", "def": "《法典》表 A：每日价格调整判定表——看当天需求与库存，读出该涨价、降价还是持平。", "video": "ca", "anchor": "codex.html#table-a", "more": null, "tag": "法典", "no": 38}, {"cid": "cb", "cat": "codex", "zh": "表B 库存与限制", "en": "Table B", "def": "《法典》表 B：库存与限制条件配置表——价格定完后配库存动作（关房/连住/超售）。", "video": "cb", "anchor": "codex.html#table-b", "more": null, "tag": "法典", "no": 39}, {"cid": "cc", "cat": "codex", "zh": "表C 价格指数 ARI", "en": "Table C (ARI)", "def": "《法典》表 C：价格指数（ARI）判定表——按相对竞对贵贱决定提价或降价。", "video": "cc", "anchor": "codex.html#table-c", "more": null, "tag": "法典", "no": 40}, {"cid": "cd", "cat": "codex", "zh": "表D 渗透指数 MPI", "en": "Table D (MPI)", "def": "《法典》表 D：市场渗透指数（MPI）判定表——按份额领先/落后决定抢量还是提价。", "video": "cd", "anchor": "codex.html#table-d", "more": null, "tag": "法典", "no": 41}, {"cid": "ce", "cat": "codex", "zh": "表E 超售标准", "en": "Table E", "def": "《法典》表 E：超额预订标准表——按历史 no-show/取消率算出可超售几间及安全上限。", "video": "ce", "anchor": "codex.html#table-e", "more": null, "tag": "法典", "no": 42}, {"cid": "cf", "cat": "codex", "zh": "表F 房型价差", "en": "Table F", "def": "《法典》表 F：房型价差与价格体系展开规则——基准 BAR 如何展开全房型价格。", "video": "cf", "anchor": "codex.html#table-f", "more": null, "tag": "法典", "no": 43}, {"cid": "cg", "cat": "codex", "zh": "表G 团队询价", "en": "Table G", "def": "《法典》表 G：客户/团队询价决策表——大客户或团队打折是否划算的判定逻辑（看置换分析）。", "video": "cg", "anchor": "codex.html#table-g", "more": null, "tag": "法典", "no": 44}, {"cid": "ch", "cat": "codex", "zh": "表H 渠道与一致性", "en": "Table H", "def": "《法典》表 H：渠道与价格一致性表——各渠道该不该卖、挂牌价（含含税总价）怎么对齐。", "video": "ch", "anchor": "codex.html#table-h", "more": null, "tag": "法典", "no": 45}, {"cid": "co", "cat": "codex", "zh": "表O 冲突仲裁", "en": "Table O", "def": "《法典》表 O：多表冲突仲裁表——几张表结论打架时，只执行最高优先级那一条。", "video": "co", "anchor": "codex.html#table-o", "more": null, "tag": "法典", "no": 46}, {"cid": "c13", "cat": "metric", "zh": "TrevPAR", "en": "Total RevPAR", "def": "每可售房总收入 =（房费+餐饮+会议+其他全部收入）÷ 可售房，衡量单间房的综合产出，比 RevPAR 更全面。", "video": "c13", "anchor": null, "more": "calc-templates.html#trevpar", "tag": "指标", "no": 47}, {"cid": "c29", "cat": "inv", "zh": "Walk 拒载", "en": "Walk-in / Denied Stay", "def": "超售过头或 No-show 没发生，到店无房即为 Walk。要升级/赔礼/安置周边，是超售失控的最高成本。", "video": "c29", "anchor": null, "more": null, "tag": "库存", "no": 48}];
var CP_TAGS = ["基础", "指标", "预测", "定价", "库存", "渠道", "竞争", "跨行业", "法典"];
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var curTag="全部";
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  $("totalN").textContent=CP_DATA.length;

  // 标签按钮
  function renderTags(){
    var all=["全部"].concat(CP_TAGS);
    $("tags").innerHTML=all.map(function(t){
      return '<button class="cp-tag'+(t===curTag?" on":"")+'" data-t="'+esc(t)+'">'+esc(t)+'</button>';
    }).join("");
    Array.prototype.forEach.call($("tags").querySelectorAll(".cp-tag"),function(b){
      b.onclick=function(){ curTag=b.getAttribute("data-t"); renderTags(); render(); };
    });
  }

  function render(){
    var q=($("q").value||"").trim().toLowerCase();
    var list=CP_DATA.filter(function(c){
      if(curTag!=="全部" && c.tag!==curTag) return false;
      if(!q) return true;
      return ((c.en||"")+" "+(c.zh||"")+" "+(c["def"]||"")).toLowerCase().indexOf(q)>=0;
    });
    $("cnt").textContent="显示 "+list.length+" / "+CP_DATA.length+" 条";
    $("empty").style.display=list.length?"none":"block";
    $("rows").innerHTML=list.map(function(c){
      var more="";
      if(c.anchor) more+='<a class="cp-more" data-go="'+esc(c.anchor)+'">↗ 查判定表</a> ';
      if(c.more)   more+='<a class="cp-more" data-go="'+esc(c.more)+'">↗ 相关工具</a>';
      return '<tr>'+
        '<td class="cp-no">'+c.no+'</td>'+
        '<td><div class="cp-en">'+esc(c.en)+'</div></td>'+
        '<td><div class="cp-zh">'+esc(c.zh)+'</div></td>'+
        '<td class="cp-def">'+esc(c["def"])+(more?'<div>'+more+'</div>':'')+'</td>'+
        '<td><span class="cp-chip" data-t="'+esc(c.tag)+'">'+esc(c.tag)+'</span></td>'+
        '<td>'+(c.video?'<a class="cp-vid" href="gejijipo-player.html?id='+esc(c.video)+'" target="_blank" rel="noopener">▶ 1 分钟解说</a>':'—')+'</td>'+
        '</tr>';
    }).join("");
    // 运行时写入 href（避免静态扫描把模板字符串误判为失效链接）
    Array.prototype.forEach.call($("rows").querySelectorAll("a[data-go]"),function(a){
      a.setAttribute("href", a.getAttribute("data-go"));
    });
  }

  $("q").addEventListener("input",render);
  renderTags(); render();
})();
</script>
