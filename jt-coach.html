<style>
:root{--ink:#1f2733;--ink2:#5b6675;--line:#e6e9ef;--bg:#f7f8fa;--navy:#1f3a5f;--teal:#0f8a7e;--amber:#c77a16;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.65}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:30}
.topbar b{color:var(--navy);font-size:16px}
.topbar .tag{margin-left:10px;font-size:12px;color:var(--ink2);background:#eef2f7;border-radius:12px;padding:2px 10px}
.topbar .restart{margin-left:auto;font-size:13px;color:var(--navy);cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:5px 12px;background:#fff}
.wrap{max-width:800px;margin:0 auto;display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.msgs{flex:1;overflow:auto;padding:18px 16px 6px}
.row{display:flex;flex-direction:column}
.bubble{max-width:80%;padding:10px 14px;border-radius:15px;margin:7px 0;font-size:14px;line-height:1.65;word-break:break-word}
.bubble b{color:var(--navy)}
.coach{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.user{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bubble ol{margin:6px 0 0 18px;padding:0}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:2px 16px 8px}
.qchip{background:#eef2f7;color:var(--navy);border:1px solid #cdd9e8;border-radius:18px;padding:6px 13px;font-size:13px;cursor:pointer}
.qchip:hover{background:#e3ebf5}
.inputbar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#fff}
.inputbar input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:0 18px;font:inherit;cursor:pointer}
.foot{text-align:center;color:var(--ink2);font-size:11.5px;padding:6px 0 12px}
a.eng{color:var(--navy)}
/* 轻量决策助手：定位条 + 例会清单 */
.scopebar{max-width:800px;margin:10px auto 0;padding:8px 14px;background:#eef7f2;border:1px solid #bfe3d4;border-radius:10px;font-size:12.8px;color:#245c48}
.mtbtn{margin-left:auto;font-size:13px;color:#fff;cursor:pointer;border:1px solid var(--teal);border-radius:8px;padding:5px 12px;background:var(--teal)}
.mtbtn:hover{opacity:.9}
.mt-add{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--navy);cursor:pointer;border:1px solid #cdd9e8;border-radius:16px;padding:4px 12px;background:#eef2f7}
.mt-add:hover{background:#e3ebf5}
.mt-add.done{color:#245c48;border-color:#bfe3d4;background:#eef7f2;cursor:default}
.mt-mask{position:fixed;inset:0;background:rgba(15,30,50,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.mt-mask[hidden]{display:none}
.mt-panel{background:#fff;max-width:880px;width:100%;max-height:88vh;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(15,30,50,.25)}
.mt-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:#f7f8fa}
.mt-head b{color:var(--navy);font-size:15px}
.mt-head .mt-time{font-size:12px;color:var(--ink2)}
.mt-close{margin-left:auto;font-size:13px;color:var(--navy);cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:#fff}
.mt-body{overflow:auto;padding:14px 18px;font-size:13.2px}
.mt-body h4{margin:14px 0 6px;color:var(--navy);font-size:13.6px}
.mt-body h4:first-child{margin-top:0}
.mt-t{width:100%;border-collapse:collapse;font-size:12.6px;margin:4px 0}
.mt-t th,.mt-t td{border:1px solid #d6dee8;padding:6px 8px;text-align:left;vertical-align:top;line-height:1.6}
.mt-t th{background:#eef4fa;color:var(--navy)}
.mt-blank{color:var(--ink2)}
.mt-in{width:100%;min-width:64px;border:1px solid #c9d5e2;border-radius:6px;padding:4px 7px;font-size:12.4px;font-family:inherit;color:var(--ink);background:#fff;resize:vertical}
.mt-in:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(15,42,74,.10)}
.mt-t td:has(.mt-in){padding:4px 5px}
.mt-foot{display:flex;gap:8px;padding:10px 18px;border-top:1px solid var(--line);background:#f7f8fa}
.mt-b{font:inherit;font-size:13px;color:#fff;background:var(--navy);border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
.mt-b.ghost{color:var(--ink2);background:#fff;border:1px solid var(--line)}
.mt-toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.mt-toast.on{opacity:.95}
@media print{
  .topbar,.scopebar,.wrap,.foot,.mt-head,.mt-foot{display:none!important}
  .mt-mask{position:static;background:#fff;padding:0;display:block}
  .mt-panel{max-width:none;box-shadow:none;border-radius:0}
  .mt-body{overflow:visible}
}

/* 输入框常驻底部（2026-10-23）：body 改为 flex 列，消息区吃掉剩余高度 */
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box}
.wrap>*{flex:0 0 auto}
.msgs{flex:1 1 auto!important;min-height:0}
.quick{flex:0 0 auto}
.inputbar{flex:0 0 auto;position:sticky;bottom:0;z-index:20}
@media (max-height:520px){.quick{display:none}}

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function trunc(s,n){ s=String(s); return s.length>n? s.slice(0,n)+'…' : s; }

function coachSay(html, qr){
  const d=document.createElement('div'); d.className='row';
  const b=document.createElement('div'); b.className='bubble coach'; b.innerHTML=html;
  d.appendChild(b); msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
  renderQuick(qr||[]);
}
function userSay(text){
  const d=document.createElement('div'); d.className='row';
  const b=document.createElement('div'); b.className='bubble user'; b.textContent=text;
  d.appendChild(b); msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
}
function renderQuick(list){
  quick.innerHTML='';
  list.forEach(it=>{
    const c=document.createElement('span'); c.className='qchip'; c.textContent=it.label; c.title=it.label;
    c.onclick=()=>onPick(it.value, it.label); quick.appendChild(c);
  });
}
function onPick(value, label){
  userSay(label);
  if(value.startsWith('@domain:')){ showDomainTables(value.slice(8)); return; }
  if(value.startsWith('@table:')){ state={tableId:value.slice(7), step:0, answers:{}}; startTableFlow(byId(state.tableId)); return; }
  if(value==='@restart'){ restart(); return; }
  if(value==='@confirm'){ handleConfirm(); return; }
  handleAnswer(parseInt(value,10));
}

// ---- 场景匹配 ----
function bigrams(s){ s=(s||'').replace(/\s/g,''); const o=[]; for(let i=0;i<s.length-1;i++) o.push(s.slice(i,i+2)); return o; }
function score(rec,q){
  const hay=[rec.title,rec.domain,(rec.tags||[]).join(''),rec.trigger,rec.decision_logic,rec.basis,rec.code].join('');
  const qs=new Set(bigrams(q)), hs=new Set(bigrams(hay)); let hit=0; qs.forEach(g=>{ if(hs.has(g)) hit++; });
  (rec.tags||[]).forEach(t=>{ if(q.includes(t)) hit+=2; }); return hit;
}
function domainOf(q){
  for(const k in CUES){ if(q.includes(k)) return byId(CUES[k]); }
  const ranked=DATA.map(r=>({r,s:score(r,q)})).sort((a,b)=>b.s-a.s);
  return ranked[0].s>=2 ? ranked[0].r : null;
}
const DOMAIN_LABELS=['价格','库存','竞争','渠道','客户','节奏','应急'];

function restart(){
  state={tableId:null};
  coachSay('你好，我是<b>收益管理教练</b>。把你的经营情况用一句话告诉我，我来帮你定位该查哪张判定表、并一步步给出决策建议。<br><br>例如：「今天预测出租率 95%、Pickup 领先 10%，要涨价吗？」或「有个 80 间夜团队询价，报价是散客价 8 折，当天出租率 80%，接不接？」');
  coachSay('或者，你想先问哪一类？', DOMAIN_LABELS.map(d=>({label:d, value:'@domain:'+d})));
}
function showDomainTables(dom){
  const list=DATA.filter(r=>r.domain===dom);
  if(!list.length){ coachSay('这一类暂时没有对应判定表，换一个试试？', DOMAIN_LABELS.map(d=>({label:d, value:'@domain:'+d}))); return; }
  coachSay('「'+dom+'」相关的判定表有这几张，点一张我们细聊：', list.map(r=>({label:r.id.replace('JT-','表 ')+'·'+trunc(r.title,10), value:'@table:'+r.id})));
}

// ---- 表流程 ----
function startTableFlow(rec){
  const t=rec.tables[0]||{type:'list',rows:[]};
  coachSay('好的，这是 <b>'+rec.code+' '+rec.title+'</b>（'+rec.domain+'）。适用场景：'+esc(rec.trigger));
  if(t.type==='matrix'){
    state.step=0;
    const ra=t.row_axis||'行条件', d0=(rec.inputs&&rec.inputs[0])?rec.inputs[0].desc:'';
    coachSay('查这张表分两步。<br><b>第 1 步 · 看【'+esc(ra)+'】</b>'+(d0?('：'+esc(d0)):'')+'<br>你的情况落在哪一档？点选下面符合的一项：',
      t.rows.map((r,i)=>({label:ra+' ＝ '+trunc(r.label,14), value:String(i)})));
  } else if(t.type==='steps'){
    state.step=0;
    let ol='<ol>'+t.items.map(it=>'<li><b>'+esc(it.step)+'</b> '+esc(it.text)+'</li>').join('')+'</ol>';
    coachSay('本表是<b>流程型</b>，共 '+t.items.length+' 步，必须<b>按顺序</b>执行，不能跳步：'+ol, [{label:'我了解了，给出结论', value:'@confirm'}]);
  } else {
    state.step=0;
    const h0=(t.headers&&t.headers[0])||'条件';
    const d0=(rec.inputs&&rec.inputs[0])?rec.inputs[0].desc:'';
    coachSay('这张表按<b>【'+esc(h0)+'】</b>分档'+(d0?('（'+esc(d0)+'）'):'')+'。<br>对照你的实际情况，点选符合的一行：',
      t.rows.map((r,i)=>({label:h0+' ＝ '+trunc(r[0],14), value:String(i)})));
  }
}
function handleAnswer(idx){
  const rec=byId(state.tableId), t=rec.tables[0];
  if(t.type==='matrix'){
    if(state.step===0){
      state.answers.row=idx; state.step=1;
      const ca=t.col_axis||'列条件', d1=(rec.inputs&&rec.inputs[1])?rec.inputs[1].desc:'';
      coachSay('<b>第 2 步 · 再看【'+esc(ca)+'】</b>'+(d1?('：'+esc(d1)):'')+'<br>落在哪一档？点选符合的一项：',
        t.cols.map((c,i)=>({label:ca+' ＝ '+trunc(c,14), value:String(i)})));
    } else {
      const col=idx; const cell=t.rows[state.answers.row].cells[col];
      const ra=t.row_axis||'行条件', ca=t.col_axis||'列条件', cm=t.cell_meaning||'动作';
      presentDecision(rec, cell, '第1步【'+ra+'】＝'+t.rows[state.answers.row].label+'；第2步【'+ca+'】＝'+t.cols[col]+'；交叉格子的'+cm+'如上');
    }
  } else if(t.type==='list'){
    const h0=(t.headers&&t.headers[0])||'条件';
    const hN=(t.headers&&t.headers[t.headers.length-1])||'决策';
    const row=t.rows[idx]; const decision=row[row.length-1]; const cond=row.slice(0,-1).join('，');
    presentDecision(rec, decision, '该行【'+h0+'】＝'+cond+'；结论取自【'+hN+'】列');
  }
}
function handleConfirm(){
  const rec=byId(state.tableId), t=rec.tables[0];
  presentDecision(rec, '按顺序完整执行本表全部 '+t.items.length+' 步（不可跳步）', '流程型表：结论=完整走完各步；要点见下方依据与红线');
}
function presentDecision(rec, decision, note){
  let h='根据 <b>'+rec.code+' '+rec.title+'</b>，我的建议是：<div style="font-size:15px;margin:6px 0"><b>'+esc(decision)+'</b></div>';
  if(rec.basis) h+='<br><b>依据 / 公式：</b>'+esc(rec.basis)+'<br>';
  if(rec.pitfalls) h+='<br>⚠️ <b>易错 / 红线：</b>'+esc(rec.pitfalls);
  h+='<br><br><span style="color:var(--ink2);font-size:12.5px">（定位：'+esc(note)+'）</span>';
  MTLOG.push({code:rec.code, title:rec.title, domain:rec.domain||'', decision:decision, note:note,
              basis:rec.basis||'', pitfalls:rec.pitfalls||''});
  var mi=MTLOG.length-1;
  h+='<div class="mt-add" onclick="mtAdd(this,'+mi+')">＋ 记入例会清单</div>';
  coachSay(h);
  const rel=(rec.related||[]);
  const qr=rel.map(id=>({label:'看关联 '+id.replace('JT-','表 '), value:'@table:'+id}));
  qr.push({label:'换一张表', value:'@restart'});
  coachSay('还想让我帮你看点别的吗？', qr);
}

// ---- 用户输入（自由文本） ----
function handleUser(text){
  if(!state.tableId){
    const rec=domainOf(text);
    if(rec){ state={tableId:rec.id, step:0, answers:{}}; startTableFlow(rec); }
    else { coachSay('我还不太确定你问的是哪一类，先选个大方向：', DOMAIN_LABELS.map(d=>({label:d, value:'@domain:'+d}))); }
    return;
  }
  // 已选表：尝试把自由文本匹配到当前选项
  const rec=byId(state.tableId), t=rec.tables[0];
  let opts=[];
  if(t.type==='matrix'){ opts = state.step===0 ? t.rows.map((r,i)=>({i,l:r.label})) : t.cols.map((c,i)=>({i,l:c})); }
  else if(t.type==='list'){ opts = t.rows.map((r,i)=>({i,l:r[0]})); }
  const hit=opts.find(o=> text.includes(o.l.slice(0,2)) || o.l.includes(text.slice(0,2)));
  if(hit){ handleAnswer(hit.i); }
  else { coachSay('请点选下面符合你情况的一项（每项都标了它问的是哪个条件）：',
        (t.type==='matrix'?(state.step===0?t.rows:t.cols):t.rows).map((x,i)=>({label:trunc((t.type==='matrix'?x.label||x:x[0]),16), value:String(i)}))); }
}

document.getElementById('send').onclick=()=>{ const v=inp.value.trim(); if(!v) return; userSay(v); inp.value=''; handleUser(v); };
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ document.getElementById('send').click(); } });
document.getElementById('restart').onclick=restart;

/* ---- 例会清单：判定表引导的产出闭环 ---- */
var MTLOG=[];          /* 本次会话产出的全部决策（含未记入） */
var MTSHOW=[];         /* 已记入清单的 MTLOG 下标 */
function gid(id){ return document.getElementById(id); }
function mtAdd(btn,i){
  if(btn.dataset.done) return;
  btn.dataset.done='1'; btn.classList.add('done'); btn.textContent='已记入 ✓';
  if(MTSHOW.indexOf(i)<0) MTSHOW.push(i);
  gid('mt-n').textContent=MTSHOW.length;
  var t=gid('mt-toast'); t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); },1400);
}
function mtEsc(s){ return esc(s); }
/* ---- 昨日复盘：手填 + 本机记忆 + 导出 ---- */
var RV_KEY='hrma_mt_review_v1';
function mtReviewGet(){
  try{ return Object.assign({occ_a:'',occ_f:'',occ_r:'',adr_a:'',adr_f:'',adr_r:'',rev_a:'',rev_f:'',rev_r:''}, JSON.parse(localStorage.getItem(RV_KEY)||'{}')); }
  catch(e){ return {occ_a:'',occ_f:'',occ_r:'',adr_a:'',adr_f:'',adr_r:'',rev_a:'',rev_f:'',rev_r:''}; }
}
function mtReviewSave(){
  var o={};
  document.querySelectorAll('#mt-body .mt-in').forEach(function(el){ o[el.dataset.k]=el.value; });
  try{ localStorage.setItem(RV_KEY, JSON.stringify(o)); }catch(e){}
}
function mtReviewBind(){
  document.querySelectorAll('#mt-body .mt-in').forEach(function(el){
    el.addEventListener('input', mtReviewSave);
    el.addEventListener('change', mtReviewSave);
  });
}
/* ---- 导出：Excel(.xls) / Word(.doc)，可二次加工计算 ---- */
function mtReviewRows(){
  var RV=mtReviewGet(), L=[['指标','实际','预测','偏差与一句话归因']];
  [['出租率 OCC','occ'],['平均房价 ADR','adr'],['RevPAR','rev']].forEach(function(r){
    L.push([r[0], RV[r[1]+'_a'], RV[r[1]+'_f'], RV[r[1]+'_r']]);
  });
  return L;
}
function mtActionRows(){
  var L=[['#','条件 / 定位','判定依据','动作','红线 / 台账']];
  MTSHOW.forEach(function(idx,k){
    var it=MTLOG[idx];
    L.push([k+1, it.note, it.code+' '+it.title, it.decision, it.pitfalls||'—']);
  });
  return L;
}
function mtTableHtml(rows, cls){
  var h='<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;font-family:Microsoft YaHei;font-size:11pt"'+(cls?' class="'+cls+'"':'')+'>';
  rows.forEach(function(r,i){
    h+='<tr>'+r.map(function(c){ return '<td'+(i===0?' style="background:#EEF2F7;font-weight:bold"':'')+'>'+esc(c)+'</td>'; }).join('')+'</tr>';
  });
  return h+'</table>';
}
function mtDl(uri, name){
  var a=document.createElement('a');
  a.href=uri; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 400);
  var t=gid('mt-toast'); t.textContent='已导出 '+name; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); t.textContent='已记入例会清单'; },1600);
}
function mtExport(kind){
  var ts=new Date().toLocaleString('zh-CN',{hour12:false});
  var rv=mtTableHtml(mtReviewRows()), ac=mtTableHtml(mtActionRows());
  var risk=['所有限制条件（MinLOS / CTA / Stop Sell）到期是否自动解除','未来 7 天团队、宴会到店日期与房量是否已对齐','竞品未来一周促销 / 活动信号是否有人盯','满房日一过，MinLOS / CTA 是否立刻撤'];
  MTSHOW.forEach(function(idx){ var p=MTLOG[idx].pitfalls; if(p) risk.push('（'+MTLOG[idx].code+'）'+p); });
  var body='<h2 style="font-family:Microsoft YaHei">收益例会清单 · '+esc(ts)+'</h2>'
    +'<h3 style="font-family:Microsoft YaHei">① 昨日复盘</h3>'+rv
    +'<h3 style="font-family:Microsoft YaHei">② 今日动作（共 '+MTSHOW.length+' 条）</h3>'+ac
    +'<h3 style="font-family:Microsoft YaHei">③ 未来 7 天风险检查</h3>'
    +'<ul style="font-family:Microsoft YaHei;font-size:11pt">'+risk.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  if(kind==='doc'){
    var doc='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]--></head><body>'+body+'</body></html>';
    mtDl('data:application/msword;charset=utf-8,'+encodeURIComponent(doc), '收益例会清单-'+ts.replace(/[\/: ]/g,'-')+'.doc');
  } else {
    var xls='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>'+body+'</body></html>';
    mtDl('data:application/vnd.ms-excel;charset=utf-8,'+encodeURIComponent(xls), '收益例会清单-'+ts.replace(/[\/: ]/g,'-')+'.xls');
  }
}
function mtRender(){
  var n=MTSHOW.length, body=gid('mt-body');
  gid('mt-time').textContent='生成于 '+new Date().toLocaleString('zh-CN',{hour12:false});
  var h='';
  if(!n){
    h='<p class="mt-blank">本次会话还没有记入任何决策。走任意一张判定表（如「今天预测出租率 95%、Pickup 领先 10%，要涨价吗？」），在结论下方点「＋ 记入例会清单」，这里就会帮你攒出明天例会要用的清单。</p>';
  } else {
    /* ① 昨日复盘 */
    h+='<h4>① 昨日复盘（会前 5 分钟填）</h4>';
    h+='<table class="mt-t"><tr><th>指标</th><th>实际</th><th>预测</th><th>偏差与一句话归因</th></tr>';
    var RV=mtReviewGet();
    h+='<tr><td>出租率 OCC</td><td><input class="mt-in" data-k="occ_a" value="'+mtEsc(RV.occ_a)+'" placeholder="实际 %"></td><td><input class="mt-in" data-k="occ_f" value="'+mtEsc(RV.occ_f)+'" placeholder="预测 %"></td><td><textarea class="mt-in" data-k="occ_r" rows="1" placeholder="偏差与一句话归因">'+mtEsc(RV.occ_r)+'</textarea></td></tr>';
    h+='<tr><td>平均房价 ADR</td><td><input class="mt-in" data-k="adr_a" value="'+mtEsc(RV.adr_a)+'" placeholder="实际 元"></td><td><input class="mt-in" data-k="adr_f" value="'+mtEsc(RV.adr_f)+'" placeholder="预测 元"></td><td><textarea class="mt-in" data-k="adr_r" rows="1" placeholder="偏差与一句话归因">'+mtEsc(RV.adr_r)+'</textarea></td></tr>';
    h+='<tr><td>RevPAR</td><td><input class="mt-in" data-k="rev_a" value="'+mtEsc(RV.rev_a)+'" placeholder="实际 元"></td><td><input class="mt-in" data-k="rev_f" value="'+mtEsc(RV.rev_f)+'" placeholder="预测 元"></td><td><textarea class="mt-in" data-k="rev_r" rows="1" placeholder="偏差与一句话归因">'+mtEsc(RV.rev_r)+'</textarea></td></tr></table>';
    h+='<p style="font-size:11.5px;color:var(--ink2);margin:4px 0 0">手填的内容会自动存在本机，下次打开还在；导出时一并带走。</p>';
    /* ② 今日动作（来自判定表记录） */
    h+='<h4>② 今日动作（来自判定表引导，共 '+n+' 条）</h4>';
    h+='<table class="mt-t"><tr><th>#</th><th>条件 / 定位</th><th>判定依据</th><th>动作</th><th>红线 / 台账</th></tr>';
    MTSHOW.forEach(function(idx,k){
      var it=MTLOG[idx];
      h+='<tr><td>'+(k+1)+'</td><td>'+mtEsc(trunc(it.note,60))+'</td><td><b>'+mtEsc(it.code)+'</b> '+mtEsc(trunc(it.title,16))+'</td><td><b>'+mtEsc(it.decision)+'</b></td><td>'+mtEsc(trunc(it.pitfalls,80)||'—')+'</td></tr>';
    });
    h+='</table>';
    /* ③ 未来 7 天风险 */
    h+='<h4>③ 未来 7 天风险检查（固定四项 + 本会话红线）</h4><ul style="margin:4px 0 0 18px;padding:0">';
    h+='<li>所有限制条件（MinLOS / CTA / Stop Sell）到期是否自动解除</li>';
    h+='<li>未来 7 天团队、宴会到店日期与房量是否已对齐</li>';
    h+='<li>竞品未来一周促销 / 活动信号是否有人盯</li>';
    h+='<li>满房日一过，MinLOS / CTA 是否立刻撤</li>';
    MTSHOW.forEach(function(idx){
      var p=MTLOG[idx].pitfalls;
      if(p) h+='<li>（'+mtEsc(MTLOG[idx].code)+'）'+mtEsc(trunc(p,60))+'</li>';
    });
    h+='</ul>';
  }
  body.innerHTML=h;
  mtReviewBind();
}
function mtOpen(){ mtRender(); gid('mt-mask').hidden=false; }
function mtClose(){ gid('mt-mask').hidden=true; }
function mtCopy(){
  var n=MTSHOW.length;
  var lines=['《收益例会清单》 生成于 '+new Date().toLocaleString('zh-CN',{hour12:false})+'',''];
  if(!n){ lines.push('（本次会话尚未记入任何决策）'); }
  else{
    var RV=mtReviewGet();
    lines.push('① 昨日复盘：OCC '+((RV.occ_a||'__')+'% / 预测 '+(RV.occ_f||'__')+'%')+'；ADR '+(RV.adr_a||'__')+' 元 / 预测 '+(RV.adr_f||'__')+' 元；RevPAR '+(RV.rev_a||'__')+' 元 / 预测 '+(RV.rev_f||'__')+' 元');
    if(RV.occ_r||RV.adr_r||RV.rev_r) lines.push('   归因：'+(RV.occ_r||'—')+' ｜ '+(RV.adr_r||'—')+' ｜ '+(RV.rev_r||'—'));
    lines.push('');
    lines.push('② 今日动作（共 '+n+' 条）：');
    MTSHOW.forEach(function(idx,k){
      var it=MTLOG[idx];
      lines.push((k+1)+'. ['+it.code+'·'+it.title+'] 动作：'+it.decision+' ｜ 条件：'+it.note+' ｜ 红线：'+(it.pitfalls||'—'));
    });
    lines.push('','③ 未来 7 天风险：限制条件到期解除 / 团队宴会到店 / 竞品促销 / 满房日过后撤 MinLOS');
  }
  var txt=lines.join('\n');
  function fb(){
    var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).catch(fb); } else { fb(); }
  var t=gid('mt-toast'); t.textContent='已复制为纯文本'; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); t.textContent='已记入例会清单'; },1400);
}
gid('mt-open').onclick=mtOpen;
gid('mt-close').onclick=mtClose;
gid('mt-copy').onclick=mtCopy;
gid('mt-print').onclick=function(){ mtRender(); window.print(); };

gid('mt-doc').onclick=function(){ mtExport('doc'); };
gid('mt-clear').onclick=function(){ MTSHOW=[]; gid('mt-n').textContent='0'; mtRender(); };
gid('mt-mask').addEventListener('click',function(e){ if(e.target===this) mtClose(); });

let state={tableId:null};
restart();
