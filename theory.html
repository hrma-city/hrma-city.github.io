/* 进度：本机记录学完哪些站。静态站没有账号体系，进度跟浏览器走，
   换设备/清缓存会重置——对"心里有数"这个目的够用。 */
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ return {}; } }
function save(o){ try { localStorage.setItem(KEY, JSON.stringify(o)); } catch(e){} }
var prog = load(); if (!Array.isArray(prog.done)) prog.done = [];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function state(i){
  var id = ST[i].id;
  if (prog.done.indexOf(id) >= 0) return 'done';
  /* 当前站 = 第一个未完成的站 */
  for (var k = 0; k < ST.length; k++) if (prog.done.indexOf(ST[k].id) < 0) return (k === i) ? 'cur' : 'lock';
  return 'lock';
}

function drawMap(){
  var doneN = prog.done.length, html = '';
  ST.forEach(function(s, i){
    var st = state(i);
    var lineCls = (st === 'done') ? 'rline pass' : 'rline';
    var mark = (st === 'done') ? '✓' : (i + 1);
    html += '<div class="rnode ' + st + '" data-i="' + i + '" id="rn-' + s.id + '">'
      + '<div class="' + lineCls + '"></div>'
      + '<div class="dot">' + mark + '</div><div class="nm">' + esc(s.n) + '</div></div>';
  });
  document.getElementById('rtrack').innerHTML = html;
  document.getElementById('rtxt').innerHTML = '路线进度 <b>' + doneN + ' / ' + ST.length + '</b>';
  document.getElementById('rfill').style.width = (doneN / ST.length * 100) + '%';
  Array.prototype.forEach.call(document.querySelectorAll('.rnode'), function(nd){
    nd.addEventListener('click', function(){
      document.getElementById('tab-path').click();
      var el = document.getElementById('st-' + ST[+nd.getAttribute('data-i')].id);
      if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function renderPath(){
  var html = '';
  ST.forEach(function(s, i){
    var st = state(i);
    var items = s.items.map(function(it){
      var ps = (it.k||[]).map(function(k){ return '<span class="pill">' + esc(k) + '</span>'; }).join('');
      return '<article class="card"><h3><a href="' + esc(it.u) + '">' + esc(it.n) + '</a></h3>'
        + '<div class="pills">' + ps + '</div><p>' + esc(it.d) + '</p></article>';
    }).join('');
    var checks = s.check.map(function(c, ci){
      return '<label><input type="checkbox" class="ck" data-st="' + s.id + '" data-ci="' + ci + '" '
        + (prog['ck_' + s.id] && prog['ck_' + s.id][ci] ? 'checked' : '') + '><span>' + esc(c) + '</span></label>';
    }).join('');
    var isDone = (st === 'done');
    html += '<section class="station ' + st + '" id="st-' + s.id + '">'
      + '<div class="st-h"><div class="st-no">' + (isDone ? '✓' : (i + 1)) + '</div>'
      + '<div class="st-t"><h3>第 ' + (i + 1) + ' 站 · ' + esc(s.n) + '</h3>'
      + '<p class="goal">学完这一站，你应该能：' + esc(s.goal) + '。</p>'
      + '<div class="hrs">约 ' + esc(s.hrs) + (isDone ? ' · 已完成' : (st === 'cur' ? ' · 当前站' : ' · 未到')) + '</div></div></div>'
      + '<div class="st-b">'
      + '<div class="st-how"><b>怎么读：</b>' + esc(s.how) + '</div>'
      + '<div class="st-items">' + items + '</div>'
      + '<div class="st-check"><div class="ct">出口自检 · 三条都能打勾，再往下走</div>' + checks + '</div>'
      + '<button class="st-btn' + (isDone ? ' ghost' : '') + '" data-done="' + s.id + '">'
      + (isDone ? '撤销完成' : '我学完这一站了') + '</button>'
      + (isDone ? '<span class="st-done-tip">已计入路线进度</span>' : '')
      + '</div></section>';
  });
  document.getElementById('pathview').innerHTML = html;
  document.getElementById('cnt').innerHTML =
    '七站路线 · 已完成 <b>' + prog.done.length + '</b> 站，还剩 <b>' + (ST.length - prog.done.length) + '</b> 站';
  bindPath();
}

function bindPath(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-done]'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-done');
      var idx = prog.done.indexOf(id);
      if (idx >= 0) prog.done.splice(idx, 1); else prog.done.push(id);
      save(prog); renderPath(); drawMap();
      if (idx < 0) {
        var nxt = document.getElementById('st-' + (ST[prog.done.length] ? ST[prog.done.length].id : ''));
        if (nxt) setTimeout(function(){ nxt.scrollIntoView({behavior:'smooth', block:'start'}); }, 120);
      }
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.ck'), function(c){
    c.addEventListener('change', function(){
      var st = c.getAttribute('data-st'), ci = +c.getAttribute('data-ci');
      if (!prog['ck_' + st]) prog['ck_' + st] = [];
      prog['ck_' + st][ci] = c.checked;
      save(prog);
    });
  });
}

/* ---- 视图 B：按类型查（原三板块） ---- */
function renderType(){
  var q = document.getElementById('q').value.trim(), n = 0, html = '';
  D.forEach(function(sec){
    var items = sec.items.filter(function(it){
      if (!q) return true;
      return ((it.n+' '+(it.d||'')+' '+(it.k||[]).join(' ')).toLowerCase().indexOf(q.toLowerCase()) >= 0);
    });
    if (!items.length) return;
    n += items.length;
    html += '<section class="sec"><h2 style="border-color:#' + sec.c + '">' + esc(sec.sec) + '</h2>'
      + '<p class="sd">' + esc(sec.sd) + '</p><div class="grid">'
      + items.map(function(it){
          var ps = (it.k||[]).map(function(k){ return '<span class="pill">' + esc(k) + '</span>'; }).join('');
          return '<article class="card"><h3><a href="' + esc(it.u) + '">' + esc(it.n) + '</a></h3>'
            + '<div class="pills">' + ps + '</div><p>' + esc(it.d) + '</p></article>';
        }).join('')
      + '</div></section>';
  });
  document.getElementById('secs').innerHTML = html || '<div class="empty">没有匹配的条目。</div>';
  document.getElementById('cnt').innerHTML = '按类型查 · 显示 <b>' + n + '</b> 份';
}
document.getElementById('q').addEventListener('input', renderType);

document.getElementById('tab-path').addEventListener('click', function(){
  this.classList.add('on'); document.getElementById('tab-type').classList.remove('on');
  document.getElementById('pathview').style.display = '';
  document.getElementById('typeview').style.display = 'none';
  renderPath();
});
document.getElementById('tab-type').addEventListener('click', function(){
  this.classList.add('on'); document.getElementById('tab-path').classList.remove('on');
  document.getElementById('pathview').style.display = 'none';
  document.getElementById('typeview').style.display = '';
  renderType();
});
document.getElementById('rreset').addEventListener('click', function(){
  if (!confirm('清空七站的完成记录，从第 1 站重新开始？')) return;
  prog = {done: []}; save(prog); renderPath(); drawMap();
});

renderPath(); drawMap();
</script>
