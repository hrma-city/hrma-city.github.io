var HALL = 'theory', ST = [{"id":"s1","n":"看懂指标","hrs":"1–2 小时","goal":"会算、会看 OCC / ADR / RevPAR，知道数字背后发生了什么","how":"先读主教材第 1–3 章建立骨架，再翻公式手册把每个指标的算法与适用边界钉死。遇到听不懂的词，随时回概念总表查。","items":[{"u":"textbook.html","n":"主教材 · 第 1–3 章","k":["教材","先读这本"],"d":"收益管理是什么、三个核心指标、竞争三件套（MPI/ARI/RGI）。七站路线的主线都挂在这本上。"},{"u":"concepts.html","n":"收益管理概念总表","k":["术语","速查"],"d":"按英文术语字母序，标注所属板块。任何一章读卡了，先来这里查词。"},{"u":"formulas.html","n":"公式手册 · 32 个公式","k":["公式","边界"],"d":"每个公式的算法、适用边界与常见误用。手算一遍第 2 章的三个指标。"},{"u":"learn.html","n":"在线学习与自测 · 第 1–3 章","k":["自测"],"d":"读完立刻自测，学一章验一章。"}],"quiz":[{"t":"choice","q":"某晚 OCC 91%、ADR 486 元、RevPAR 442 元；上周同期 OCC 78%、ADR 640 元、RevPAR 499 元。本周 OCC 高了 13 个点，能说明经营更好吗？","opts":["能，出租率创了年内新高","不能，RevPAR 反而比上周低 57 元","无法判断，要看更多指标","能，因为多卖了 84 间房"],"a":1,"why":"OCC 是手段不是目的。这 13 个点是用降价换来的——ADR 掉了 132 元，RevPAR 反而低 57 元。判断经营好坏看 RevPAR，不看热闹。"},{"t":"judge","q":"RGI 低于 100，说明这家酒店的收益管理水平低于竞品组的平均水平。","opts":["对","错"],"a":0,"why":"对。RGI = 本店 RevPAR ÷ 竞品组平均 RevPAR × 100。低于 100 就是在同样的市场里没打过对手，先查是价格问题还是份额问题。"},{"t":"choice","q":"某酒店 300 间可售房，当晚已售 258 间，ADR 620 元。这晚的 RevPAR 是多少？","opts":["533.2 元","620 元","495.6 元","588 元"],"a":0,"why":"RevPAR = OCC × ADR = (258÷300) × 620 = 0.86 × 620 = 533.2 元。算不出来就先回公式手册把手算练熟。"}]},{"id":"s2","n":"看懂需求","hrs":"2–3 小时","goal":"会看预订进度（Pickup）、会画需求日历，知道该为哪几天做准备","how":"先读第 20 章把「预测」的输入输出搞清楚，再读第 17 章建立「从年到日」的节奏感，最后用流程图把预测嵌进日常工作流。","items":[{"u":"textbook.html","n":"主教材 · 第 20、17 章","k":["教材"],"d":"预测与需求日历；运营全景：从年到日的节奏。"},{"u":"process.html","n":"流程图 · 10 环节全解","k":["流程","入门"],"d":"把预测放回整体工作流里看它排第几、前后接什么。"},{"u":"process-detail.html","n":"流程细化 · 30 个子步骤","k":["子步骤"],"d":"预测这一步的输入、动作、交付物分别是什么。"},{"u":"onepager-day.html","n":"一页纸 · 日流程","k":["一页纸","速查"],"d":"每天要看哪些数、按什么顺序看。打印出来压在桌上。"}],"quiz":[{"t":"choice","q":"Pickup 落后去年同期 20%，你的第一个动作应该是什么？","opts":["立刻降价促销","先归因：是预测错了，还是市场变了（渠道、竞对、事件）","马上加大 OTA 配额","等周末再看"],"a":1,"why":"落后先归因再动手。如果是渠道断了或竞对开业，降价只会白让利；只有确认是需求侧问题，才轮到价格动作。"},{"t":"judge","q":"需求日历只需要标节假日，工作日不用标。","opts":["对","错"],"a":1,"why":"错。需求日历要按天估需求：商务周期（周中/周末）、展会期、事件日、淡旺季都要标。只标节假日等于丢掉大部分波动信息。"},{"t":"choice","q":"这周预测比实际高出一大截，正确的做法是？","opts":["继续用原预测，反正会均值回归","记录偏差原因，修正下一轮预测模型","把责任归给销售没努力","忽略不计，下月再说"],"a":1,"why":"预测的价值在迭代。每次都记录偏差来源（渠道？事件？竞对？），模型才会越来越准；不记录的预测永远是拍脑袋。"}]},{"id":"s3","n":"学会定价","hrs":"3–4 小时","goal":"会搭价格体系（BAR），会判断该不该涨、跟不跟降、底线在哪","how":"这是看家本领，篇幅最长：第 4–8 章讲单个价格决策，第 22 章收拢成 BAR，第 26 章给你降价的地板。每章都问自己「换到我的酒店还成立吗」。","items":[{"u":"textbook.html","n":"主教材 · 第 4–8、22、26 章","k":["教材","核心"],"d":"价格弹性、什么时候涨价、竞品降价跟不跟、折扣促销、套餐锚定、BAR 价格体系、成本底线。"},{"u":"guide.html","n":"实战手册（岗位版）","k":["岗位","落地"],"d":"同一套定价方法在岗位视角下怎么落地。"},{"u":"codex.html","n":"操作法典 · 表 A / 表 C","k":["判定表","决策"],"d":"价格弹性与跟随降价两张判定表，什么条件走哪一步直接可查。"},{"u":"scene-pricing.html","n":"场景锻炼 · 涨价决策","k":["练手","5 分钟"],"d":"一个场景一道题，先把刚学的用一次。"}],"quiz":[{"t":"choice","q":"竞品 C 只降了 OTA 渠道价，公开价没动。你的反应是？","opts":["公开价全面跟降","用会员定向价接住比价客，公开价不动","跟降到同价但限量","完全不理"],"a":1,"why":"先判断对方是渠道促销还是全面降价。只降 OTA 说明它在抢新客，不是抢你的协议客——用定向价接比价客，公开价和价格体系都要保住。"},{"t":"judge","q":"只要还有空房，降价总比空着好。","opts":["对","错"],"a":1,"why":"错。降价会挤走本来愿意付全价的客人（蚕食效应），还会训练客人等折扣。要看边际贡献和价格体系伤害，不是「空着就是亏」。"},{"t":"choice","q":"某房型变动成本 95 元，BAR 公开价 620 元。对团队报价时，最低可接受价应该怎么定？","opts":["不低于 95 元","不低于 620 元","不低于 95 元 + 被挤走的散客机会成本","不低于 300 元"],"a":2,"why":"底线不是变动成本，是「变动成本 + 置换成本」。接这个团挤走了 620 元的散客，那 95 元的地板就远远不够。"}]},{"id":"s4","n":"会分库存","hrs":"2–3 小时","goal":"同样的房，知道该卖给谁、留多少、敢不敢超售","how":"第 9–12 章是一个整体：房型价差定结构，MinLOS 和保护位定分配，超售定风险边界。四章连起来读，别跳。","items":[{"u":"textbook.html","n":"主教材 · 第 9–12 章","k":["教材"],"d":"房型价差、最短住期 MinLOS、超额预订、库存分配与保护位。"},{"u":"codex.html","n":"操作法典 · 表 B / 表 E / 表 J","k":["判定表"],"d":"库存限制、超售、客房升级三张表，覆盖这一站所有高频决策。"},{"u":"scene-protect.html","n":"场景锻炼 · 客源保护位","k":["练手"],"d":"给高价值客源留多少房、什么时候放出来。"},{"u":"game-oversell.html","n":"场景锻炼 · 超售决策","k":["练手"],"d":"超售超多少、爆仓了怎么赔——把风险边界亲手试一遍。"}],"quiz":[{"t":"judge","q":"超售率设得越高越好，因为能多卖几间。","opts":["对","错"],"a":1,"why":"错。超售的边界由 No-show 历史分布决定：超多了要赔付、要安置、伤品牌；超少了浪费库存。按概率算，不按胆子算。"},{"t":"choice","q":"保护位（给高价值客源预留的房量）应该在什么时候撤？","opts":["一直留着不动","等高价值需求确认不足、距入住日临近时，分批放出来","随时可撤","等满房了再撤"],"a":1,"why":"保护位是保险不是坟场。临近入住日，高端需求已经基本落定，继续捂着只会空着——按进度分批释放，同时观察释放后是否触发高端补位。"},{"t":"choice","q":"某晚 300 间可售房，给高端客源设了 40 间保护位。这一晚中端房型最多能卖多少间？","opts":["240 间","260 间","300 间","200 间"],"a":1,"why":"300 − 40 = 260 间。保护位是从总库存里先扣下来的，剩下的才轮到中端放开卖。"}]},{"id":"s5","n":"看懂竞争与渠道","hrs":"2–3 小时","goal":"算得清各渠道到手多少钱，知道该把配额偏向谁","how":"第 13 章算账（净价），第 6 章判断（竞品降价），第 16 章和第 24 章讲把客人变成自己的两条路。读完这站，每个渠道都应能算出真实贡献。","items":[{"u":"textbook.html","n":"主教材 · 第 6、13、16、24 章","k":["教材"],"d":"竞品降价跟不跟、渠道净价、直销与会员、OTA 与点评。"},{"u":"codex.html","n":"操作法典 · 表 D / 表 H","k":["判定表"],"d":"竞争监测与渠道管理两张表。"},{"u":"scene-channel.html","n":"场景锻炼 · 渠道净价与配额","k":["练手"],"d":"各渠道怎么配额、净价怎么算才不亏。"},{"u":"industries.html","n":"行业矩阵","k":["参数","迁移"],"d":"同一套逻辑换到餐饮、航空、景区怎么落参数。"}],"quiz":[{"t":"choice","q":"OTA 佣金 15%、直销佣金 3%。同一房型要拿到相同的净价，OTA 报价应比直销高多少？","opts":["约高 14%","高 15%","高 12%","一样高"],"a":0,"why":"设直销价 P，净价 0.97P；OTA 价 X，净价 0.85X。令 0.85X = 0.97P，得 X ≈ 1.14P——OTA 价要高出约 14% 才不吃亏。"},{"t":"judge","q":"评分从 4.6 掉到 4.4 只影响口碑，不影响价格和转化。","opts":["对","错"],"a":1,"why":"错。评分进渠道排序、进客人比价决策，等于变相涨价空间被压缩。评分就是价格，这句话在教材第 24 章。"},{"t":"choice","q":"竞品这次是全面降价（所有渠道一起降），你的第一判断应该是？","opts":["它要抢份额，必须跟","先查它是不是需求塌陷的信号，评估自身弹性再定","立刻跟进到同价","上报总部等指示"],"a":1,"why":"全面降价常常是需求侧出问题的信号（供过于求），不是冲锋号。跟不跟，看你的客源结构和价格弹性，而不是看对手的动作。"}]},{"id":"s6","n":"会做取舍","hrs":"2–3 小时","goal":"面对压过来的需求，算得清接不接、让不让、保不保","how":"难的不是「怎么多卖」，是「决定不接什么」。第 14–15 章给方法，第 30 章把账算到总贡献，第 28 章讲一年里最容易赚的钱。","items":[{"u":"textbook.html","n":"主教材 · 第 14–15、28、30 章","k":["教材"],"d":"客源细分、团队置换、淡旺季与事件日、会议宴会总贡献。"},{"u":"codex.html","n":"操作法典 · 表 G / 表 K","k":["判定表"],"d":"团队置换与会议综合收益两张表，这一站最常用。"},{"u":"myths.html","n":"常见误区库 · 30 条反直觉结论","k":["纠偏"],"d":"「出租率高就是好」这类想当然的结论，逐条用数据反驳。"},{"u":"scene-displacement.html","n":"场景锻炼 · 团队置换","k":["练手","挑战"],"d":"一笔大团队压过来，接还是不接——亲手算一次。"}],"quiz":[{"t":"choice","q":"一笔 300 间夜的团队，团价 380 元；当天预测散客能卖 250 间 @ 620 元。接不接该怎么算？","opts":["直接接，量大就是利大","比较「团队总收入」与「被挤走的散客净贡献 + 边际成本」，后者小才接","看总经理意见","一律拒绝团队"],"a":1,"why":"置换分析：团队赚 380×300，但挤走的 250 间散客按 620 卖也有可观的净贡献。只有团队总贡献更高才接——这就是「决定不接什么」的算法。"},{"t":"judge","q":"满房就说明经营得好。","opts":["对","错"],"a":1,"why":"错。满房但 ADR 崩了、把高价值客挤走了，RevPAR 和总收益反而更差。误区库第一条就是这个坑。"},{"t":"choice","q":"评估一个会议值不值，除了房费还应该算什么？","opts":["只算房费","房费 + 餐饮 + 场地 + 后续业务 + 品牌曝光","只算餐饮","都不用算，看规模"],"a":1,"why":"会议是总贡献生意：餐饮、场地、明年的复购、客户关系都是收益。只算房费会把高价值会议拒之门外。"}]},{"id":"s7","n":"会复盘汇报","hrs":"2 小时","goal":"能把一个月的得失讲清楚，让人支持你继续做","how":"第 18–19 章是日常执行与例会，第 21 章把一年拆到每天，第 23 章告诉你每天该看哪几张表。这一站的产出是一份你真能交出去的月度复盘。","items":[{"u":"textbook.html","n":"主教材 · 第 18–19、21、23、25 章","k":["教材"],"d":"每日实操流程、收益例会、年度预算、报表体系、岗位与组织。"},{"u":"ops-no01.html","n":"操作系列 01–04 · 预测/决策/执行/复盘","k":["操作","四册"],"d":"四步各自的完整操作说明，复盘那册是这一站的重点。"},{"u":"onepager-month.html","n":"一页纸 · 月流程 / 季流程 / 年流程","k":["一页纸"],"d":"月度、季度、年度各自的动作清单。"},{"u":"game-rm.html","n":"云璟一年 · 32 章通关","k":["验收","116 题"],"d":"跟着云璟酒店走完一年，5 次综合小考。七站走完，用这套验收。"}],"quiz":[{"t":"choice","q":"月度复盘最该讲清的是什么？","opts":["这个月做了多少事","几个关键决策、各自的数据结果、下月怎么调整","这个月的出租率数字","竞争对手在干什么"],"a":1,"why":"复盘复的是决策，不是工作量。讲清「当时为什么这么定、结果如何、下次怎么改」，才是别人愿意支持你的汇报。"},{"t":"judge","q":"复盘就是总结成绩与不足，不需要摆数据。","opts":["对","错"],"a":1,"why":"错。没有数据的复盘是感想。每个结论背后都要有指标：RevPAR 差多少、差在哪个决策、量价各贡献了多少。"},{"t":"choice","q":"收益例会上最该同步的内容是？","opts":["把所有数据念一遍","与决策相关的偏差、已采取的动作、需要其他部门配合的事","只报问题","只报成绩"],"a":1,"why":"例会的时间很短，只放与决策有关的信息：偏差多少、动作是什么、需要谁配合。数据细节放报表，别占用会议。"}]}], RKEY = 'hrma_' + HALL + '_path_v1';
var WB = {}, WBKEY = 'hrma_wb_progress_v1';   /* 培训馆：认证演练题库（按模块在线练习）*/
function rload(){ try { return JSON.parse(localStorage.getItem(RKEY) || '{}') || {}; } catch(e){ return {}; } }
function rsave(o){ try { localStorage.setItem(RKEY, JSON.stringify(o)); } catch(e){} }
var rprog = rload();
if (!Array.isArray(rprog.done)) rprog.done = [];
if (!rprog.quiz) rprog.quiz = {};
function resc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function rpassed(i){ return !!(rprog.quiz[ST[i].id] && rprog.quiz[ST[i].id].passed); }
function rstate(i){
  if (rpassed(i)) return 'done';
  for (var k = 0; k < ST.length; k++) if (!rpassed(k)) return (k === i) ? 'cur' : 'lock';
  return 'lock';
}
function rdoneN(){ var n=0; for (var i=0;i<ST.length;i++) if (rpassed(i)) n++; return n; }

function rdrawMap(){
  var html = '';
  ST.forEach(function(s, i){
    var st = rstate(i), lineCls = (st === 'done') ? 'rline pass' : 'rline';
    var mark = (st === 'done') ? '✓' : (i + 1);
    html += '<div class="rnode ' + st + '" data-i="' + i + '" id="rn-' + s.id + '">'
      + '<div class="' + lineCls + '"></div>'
      + '<div class="dot">' + mark + '</div><div class="nm">' + resc(s.n) + '</div></div>';
  });
  var t = document.getElementById('rtrack');
  if (t) t.innerHTML = html;
  var dn = rdoneN();
  var tx = document.getElementById('rtxt');
  if (tx) tx.innerHTML = '路线进度 <b>' + dn + ' / ' + ST.length + '</b>';
  var fl = document.getElementById('rfill');
  if (fl) fl.style.width = (dn / ST.length * 100) + '%';
  Array.prototype.forEach.call(document.querySelectorAll('.rnode'), function(nd){
    nd.addEventListener('click', function(){
      var tp = document.getElementById('tab-path'); if (tp) tp.click();
      var el = document.getElementById('st-' + ST[+nd.getAttribute('data-i')].id);
      if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

/* ---- 模块在线练习区（培训馆）：把演练题库按模块直接搬进站里，
      不用跳页、不用拉到材料正文最底下。机判题型（判断/单选）在线判分；
      计算题给参考答案与解析，用户自评「算对了/没算对」。进度记本机。 ---- */
function rwbLoad(){ try { return JSON.parse(localStorage.getItem(WBKEY) || '{}') || {}; } catch(e){ return {}; } }
function rwbSave(o){ try { localStorage.setItem(WBKEY, JSON.stringify(o)); } catch(e){} }
var rwbProg = rwbLoad();
function rwbKey(it, idx){ return it.m + '-' + idx; }
function rwbZoneHtml(s){
  if (!s.lv || !WB || !WB.items) return '';
  var mods = {};
  WB.items.forEach(function(it, idx){
    if (!it.m) return;
    var lv = (WB.modules && WB.modules[it.m]) ? WB.modules[it.m].lv : '';
    if (lv !== s.lv) return;
    (mods[it.m] = mods[it.m] || []).push({it: it, idx: idx});
  });
  var keys = Object.keys(mods);
  if (!keys.length) return '';
  var total = 0;
  keys.forEach(function(k){ total += mods[k].length; });
  var h = '<div class="wbzone"><div class="wz-h">模块练习 · ' + s.lv + ' 共 ' + total + ' 题'
    + '<span class="wz-tip">机判题型在线判分；计算题看答案与解析后自评。做过一遍的题会记住状态。</span></div>';
  keys.forEach(function(mk){
    var arr = mods[mk], mn = (WB.modules && WB.modules[mk]) ? WB.modules[mk].n : mk;
    var done = 0;
    arr.forEach(function(o){ if (rwbProg[rwbKey(o.it, o.idx)]) done++; });
    h += '<div class="wz-mod"><div class="wz-mh">' + resc(mk) + ' ' + resc(mn)
      + '<span class="wz-cnt">' + done + ' / ' + arr.length + '</span></div><div class="wz-list">';
    arr.forEach(function(o){
      var it = o.it, idx = o.idx, key = rwbKey(it, idx);
      var st = rwbProg[key];
      var typeName = it.t === 'judge' ? '判断' : (it.t === 'choice' ? '单选' : '计算/查表');
      h += '<div class="wz-q" id="wz_' + key + '" data-k="' + key + '">'
        + '<div class="wz-qt"><span class="pill fm">' + typeName + '</span>'
        + '<span class="pill">' + resc(it.lv || '') + '</span>'
        + (st === 1 ? '<span class="pill" style="background:#eef8f1;color:#1d5c39">已答对</span>'
           : (st === 'self-ok' ? '<span class="pill" style="background:#eef8f1;color:#1d5c39">自评通过</span>' : ''))
        + '</div><div class="wz-qb">' + resc(it.q) + '</div>';
      if (it.t === 'judge' || it.t === 'choice') {
        it.opts.forEach(function(op, oi){
          h += '<label class="opt" id="wzo_' + key + '_' + oi + '"><input type="radio" name="wz_' + key + '" value="' + oi + '"><span>' + resc(op) + '</span></label>';
        });
        h += '<div class="qfoot"><button class="st-btn" data-wsub="' + key + '">提交</button>'
          + '<span class="qres" id="wzr_' + key + '"></span></div>';
      } else {
        h += '<div class="qfoot"><button class="st-btn" data-wshow="' + key + '">看答案与解析</button>'
          + '<button class="st-btn ghost" data-wself="' + key + '" data-v="self-ok">我算对了</button>'
          + '<button class="st-btn ghost" data-wself="' + key + '" data-v="self-no">没算对</button></div>';
      }
      h += '<div class="exp" id="wze_' + key + '"></div></div>';
    });
    h += '</div></div>';
  });
  return h + '</div>';
}
function rwbBind(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-wsub]'), function(b){
    b.addEventListener('click', function(){
      var key = b.getAttribute('data-wsub');
      var sel = document.querySelector('input[name="wz_' + key + '"]:checked');
      var oi = sel ? (+sel.value) : -1;
      var idx = key.split('-'), it = null;
      WB.items.forEach(function(x, i){ if (rwbKey(x, i) === key) it = x; });
      if (!it) return;
      var ok = (oi === it.a);
      rwbProg[key] = ok ? 1 : 0;
      rwbSave(rwbProg);
      var box = document.getElementById('wze_' + key);
      box.className = 'exp ' + (ok ? 'ok' : 'bad');
      box.innerHTML = (ok ? '✓ 答对了。' : '✗ 正确答案：<b>' + resc(it.opts[it.a]) + '</b>')
        + '<div class="why">' + resc(it.why || '') + '</div>';
      Array.prototype.forEach.call(document.querySelectorAll('input[name="wz_' + key + '"]'), function(r){
        r.disabled = true;
        var v = (+r.value), lab = document.getElementById('wzo_' + key + '_' + v);
        if (lab) { if (v === it.a) lab.classList.add('right'); else if (r.checked) lab.classList.add('wrong'); }
      });
      var rs = document.getElementById('wzr_' + key);
      if (rs) { rs.className = 'qres ' + (ok ? 'ok' : 'bad'); rs.textContent = ok ? '已答对' : '答错了，看解析'; }
      rwbRefreshCounts();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-wshow]'), function(b){
    b.addEventListener('click', function(){
      var key = b.getAttribute('data-wshow'), it = null;
      WB.items.forEach(function(x, i){ if (rwbKey(x, i) === key) it = x; });
      var box = document.getElementById('wze_' + key);
      if (!it || !box) return;
      box.className = 'exp ok';
      box.innerHTML = '<b>参考答案与解析</b><div class="why">' + resc(it.why || '') + '</div>';
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-wself]'), function(b){
    b.addEventListener('click', function(){
      var key = b.getAttribute('data-wself'), v = b.getAttribute('data-v');
      rwbProg[key] = v; rwbSave(rwbProg); rwbRefreshCounts();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.wz-q .opt'), function(l){
    l.addEventListener('click', function(){
      var r = l.querySelector('input'); if (!r || r.disabled) return;
      Array.prototype.forEach.call(l.parentNode.querySelectorAll('.opt'), function(x){ x.classList.remove('sel'); });
      l.classList.add('sel');
    });
  });
}
function rwbRefreshCounts(){
  Array.prototype.forEach.call(document.querySelectorAll('.wz-mod'), function(mod){
    var list = mod.querySelectorAll('.wz-q'), done = 0;
    Array.prototype.forEach.call(list, function(q){ if (rwbProg[q.getAttribute('data-k')]) done++; });
    var c = mod.querySelector('.wz-cnt');
    if (c) c.textContent = done + ' / ' + list.length;
  });
}

function rquizHtml(s, i){
  var passed = rpassed(i), rec = rprog.quiz[s.id] || {};
  if (!s.quiz || !s.quiz.length) {
    /* 导读站：不出计分题。读完点「我已了解」即计入进度——
         考题不堆在导读站，按 L1/L2/L3 分别放在对应站。 */
    return '<div class="qz"><div class="qh">本站导读</div>'
      + '<p class="qs">这一站不带计分题：先把体系与标准读一遍，知道每一级怎么考、怎么算过。'
      + '考核题在后面 L1 / L2 / L3 各站，练题也在各级站的模块练习区。</p>'
      + '<div class="qfoot"><button class="st-btn' + (passed ? ' ghost' : '') + '" data-read="' + s.id + '">'
      + (passed ? '撤销' : '我已了解，继续') + '</button>'
      + '<span class="qres' + (passed ? ' ok' : '') + '" id="qres_' + s.id + '">'
      + (passed ? '已读毕，计入路线进度' : '') + '</span></div></div>';
  }
  var h = '<div class="qz"><div class="qh">本站考核 · ' + s.quiz.length + ' 题</div>'
    + '<p class="qs">' + (passed
        ? '已通过（' + rec.score + '）。这一站计入路线进度。'
        : '全部答对才算通过这一站。答错会给出正确答案与解析，改完可以再交。') + '</p>';
  s.quiz.forEach(function(q, qi){
    var nm = 'q_' + s.id + '_' + qi;
    h += '<div class="qitem" id="qi_' + s.id + '_' + qi + '">'
      + '<p class="qt"><span class="qn">' + (qi + 1) + '.</span>' + resc(q.q) + '</p>';
    q.opts.forEach(function(o, oi){
      var checked = (rec.picks && rec.picks[qi] === oi) ? ' checked' : '';
      h += '<label class="opt' + (checked ? ' sel' : '') + '" id="op_' + s.id + '_' + qi + '_' + oi + '">'
        + '<input type="radio" name="' + nm + '" value="' + oi + '"' + checked + '>'
        + '<span>' + resc(o) + '</span></label>';
    });
    h += '<div class="exp" id="exp_' + s.id + '_' + qi + '"></div></div>';
  });
  h += '<div class="qfoot"><button class="st-btn" data-sub="' + s.id + '">'
    + (passed ? '再测一次' : '提交考核') + '</button>'
    + '<span class="qres" id="qres_' + s.id + '"></span></div></div>';
  return h;
}

function rbindQuiz(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-read]'), function(b){
    b.addEventListener('click', function(){
      var sid = b.getAttribute('data-read');
      if (rpassed(sid)) { delete rprog.quiz[sid]; }
      else { rprog.quiz[sid] = {passed: true, score: '导读', picks: []}; }
      rsave(rprog); rdrawMap(); rrenderPath();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-sub]'), function(b){
    b.addEventListener('click', function(){
      var sid = b.getAttribute('data-sub');
      var si = 0; for (var i = 0; i < ST.length; i++) if (ST[i].id === sid) si = i;
      var st = ST[si], correct = 0, picks = [];
      st.quiz.forEach(function(q, qi){
        var sel = document.querySelector('input[name="q_' + sid + '_' + qi + '"]:checked');
        var oi = sel ? (+sel.value) : -1;
        picks.push(oi);
        var ok = (oi === q.a);
        if (ok) correct++;
        var box = document.getElementById('exp_' + sid + '_' + qi);
        box.className = 'exp ' + (ok ? 'ok' : 'bad');
        box.innerHTML = (ok ? '✓ 答对了。' : '✗ 正确答案：<b>' + resc(q.opts[q.a]) + '</b>')
          + '<div class="why">' + resc(q.why) + '</div>';
        Array.prototype.forEach.call(
          document.querySelectorAll('input[name="q_' + sid + '_' + qi + '"]'), function(r){
            r.disabled = true;
            var v = (+r.value), lab = document.getElementById('op_' + sid + '_' + qi + '_' + v);
            if (lab) {
              if (v === q.a) lab.classList.add('right');
              else if (r.checked) lab.classList.add('wrong');
            }
          });
      });
      var all = (correct === st.quiz.length);
      if (!rprog.quiz) rprog.quiz = {};
      rprog.quiz[sid] = {passed: all, score: correct + '/' + st.quiz.length, picks: picks};
      if (all && rprog.done.indexOf(sid) < 0) rprog.done.push(sid);
      rsave(rprog);
      var rs = document.getElementById('qres_' + sid);
      if (rs) {
        rs.className = 'qres ' + (all ? 'ok' : 'bad');
        rs.innerHTML = all ? ('本站通过 ' + correct + '/' + st.quiz.length + '，已计入路线进度')
                          : ('答对 ' + correct + '/' + st.quiz.length + '，看解析后改答案再交');
      }
      rdrawMap();
      rrenderPath();
      if (all) {
        var nx = document.getElementById('st-' + (ST[si + 1] ? ST[si + 1].id : ST[si].id));
        if (nx) setTimeout(function(){ nx.scrollIntoView({behavior:'smooth', block:'start'}); }, 150);
      }
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(l){
    l.addEventListener('click', function(){
      var r = l.querySelector('input'); if (!r || r.disabled) return;
      Array.prototype.forEach.call(
        l.parentNode.querySelectorAll('.opt'), function(x){ x.classList.remove('sel'); });
      l.classList.add('sel');
    });
  });
  rwbBind();
}

function rrenderPath(){
  var html = '', dn = rdoneN();
  ST.forEach(function(s, i){
    var stt = rstate(i);
    var items = s.items.map(function(it){
      var ps = (it.k||[]).map(function(k){ return '<span class="pill">' + resc(k) + '</span>'; }).join('');
      return '<article class="card"><h3><a href="' + resc(it.u) + '">' + resc(it.n) + '</a></h3>'
        + '<div class="pills">' + ps + '</div><p>' + resc(it.d) + '</p></article>';
    }).join('');
    html += '<section class="station ' + stt + '" id="st-' + s.id + '">'
      + '<div class="st-h"><div class="st-no">' + (stt === 'done' ? '✓' : (i + 1)) + '</div>'
      + '<div class="st-t"><h3>第 ' + (i + 1) + ' 站 · ' + resc(s.n)
      + (stt === 'done' ? '<span class="st-passed">已通过</span>' : '') + '</h3>'
      + '<p class="goal">学完这一站，你应该能：' + resc(s.goal) + '。</p>'
      + '<div class="hrs">约 ' + resc(s.hrs)
      + (stt === 'done' ? ' · 已完成' : (stt === 'cur' ? ' · 当前站' : ' · 未到')) + '</div></div></div>'
      + '<div class="st-b">'
      + '<div class="st-how"><b>怎么学：</b>' + resc(s.how) + '</div>'
      + '<div class="st-items">' + items + '</div>'
      + rwbZoneHtml(s)
      + rquizHtml(s, i)
      + '</div></section>';
  });
  document.getElementById('pathview').innerHTML = html;
  var rc = document.getElementById('rcnt');
  if (rc) rc.innerHTML = '共 <b>' + ST.length + '</b> 站 · 已通过 <b>' + dn
    + '</b> 站 · 还剩 <b>' + (ST.length - dn) + '</b> 站'
    + (dn === ST.length ? ' · 全部走完，可以去自由浏览里查漏了' : '');
  rbindQuiz();
}

(function(){
  var tp = document.getElementById('tab-path'), tf = document.getElementById('tab-free');
  if (tp) tp.addEventListener('click', function(){
    tp.classList.add('on'); if (tf) tf.classList.remove('on');
    document.getElementById('pathview').style.display = '';
    document.getElementById('freeview').style.display = 'none';
    rrenderPath();
  });
  if (tf) tf.addEventListener('click', function(){
    tf.classList.add('on'); if (tp) tp.classList.remove('on');
    document.getElementById('pathview').style.display = 'none';
    document.getElementById('freeview').style.display = '';
    if (typeof renderFree === 'function') renderFree();
  });
  var rr = document.getElementById('rreset');
  if (rr) rr.addEventListener('click', function(){
    if (!confirm('清空所有站的考核记录，从第 1 站重新开始？')) return;
    rprog = {done: [], quiz: {}}; rsave(rprog); rrenderPath(); rdrawMap();
  });
})();

rrenderPath(); rdrawMap();
</script>

  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

    n += items.length;
    html += '<section class="sec"><h2 style="border-color:#' + sec.c + '">' + esc(sec.sec) + '</h2>'

          var ps = (it.k||[]).map(function(k){ return '<span class="pill">' + esc(k) + '</span>'; }).join('');

        }).join('')
      + '</div></section>';
